  - Leverage serverless AWS infrastructure to build scalable, cost-efficient backends
    for AI workloads
  - Collaborate with client engineering and product teams to translate requirements
    into agent architectures and contribute to AI strategy
  use_cases:
  - Production multi-agent AI systems for enterprise clients
  - RAG-based knowledge bases for document retrieval and question answering
  - Agent-to-agent interoperability across client platforms and workflows
  - Scalable AI-powered backends using serverless cloud infrastructure
  - AI observability and compliance monitoring for production systems
