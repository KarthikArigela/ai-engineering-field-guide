    with paying customers
  - Migrate AI security features natively into the Delinea Platform without disrupting
    existing customers
  - Enforce just-in-time access and policy decisions in the request path using platform
    identity and authorization components
  - Partner with product and platform engineering teams building the proxy and access
    engine
  use_cases:
  - Securing AI agent traffic through gateway-level inspection and control
  - Enforcing access policies on Model Context Protocol (MCP) boundaries
  - Controlling agent-to-agent communication with authorization rules
  - Just-in-time access enforcement for AI systems and identities
  - Real-time threat detection and response for AI workloads
