position:
  title: GPU (Graphics) - AI Performance Engineer
  ai_type:
    type: ml-first
    reasoning: |-
      This role focuses on GPU architecture performance
      optimization for AI/ML workloads, involving deep hardware-
      level analysis, power modeling, and benchmarking. While AI
      workloads are a target, the core work is GPU performance
      engineering, semiconductor design, and hardware-software co-
      optimization rather than building, fine-tuning, or deploying
      ML models directly. It uses ML frameworks like
      PyTorch/TensorFlow for workload characterization, not model
      development.
