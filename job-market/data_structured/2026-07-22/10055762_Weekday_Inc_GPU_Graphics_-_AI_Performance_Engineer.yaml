  - Analyze GPU architecture and microarchitecture to identify performance improvement
    and power optimization opportunities
  - Perform workload characterization, benchmarking, and profiling to identify system
    bottlenecks
  - Conduct power-performance trade-off studies and provide data-driven recommendations
    for architectural enhancements
  - Collaborate with architecture, hardware, software, compiler, driver, and ML teams
    to optimize end-to-end system performance
  - Identify hardware-software co-optimization opportunities across graphics and AI
    applications
  - Develop automation scripts and analysis tools using C/C++ and Python to improve
    performance evaluation workflows
  - Support future GPU architecture planning with insights from performance modelling
    and workload analysis
  use_cases:
  - GPU power and performance optimization for AI workloads
  - Next-generation GPU architecture design and evaluation
  - Power-performance trade-off analysis for semiconductor platforms
  - Workload characterization and bottleneck identification for graphics and AI applications
  - Energy-efficient computing platform development
