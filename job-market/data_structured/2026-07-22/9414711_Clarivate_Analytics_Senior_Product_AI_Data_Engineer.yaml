position:
  title: Senior Product AI Data Engineer
  ai_type:
    type: ai-support
    reasoning: |-
      This role focuses on building data platforms, ETL/ELT
      pipelines, and dimensional data models that enable AI/ML
      workloads, rather than directly building, training, or
      deploying models. The work is infrastructure and data
      engineering in service of AI teams, making it an ai-support
      role.
  responsibilities:
  - Define and evolve enterprise-level product data architecture across multiple product
    lines ensuring scalability and AI/ML readiness
  - Architect scalable ETL/ELT pipelines and distributed data workflows for analytics,
    AI, and product intelligence
  - Develop and enforce dimensional data modeling standards including star and snowflake
    schemas across the organization
  - Design and maintain fact and dimension tables with proper SCD handling, hierarchical
    dimensions, and high-performance queries
  - Establish data architecture principles, naming conventions, and best practices
    for ETL/ELT, event tracking, and AI pipelines
  - Serve as the technical authority guiding architecture decisions to meet product,
    platform, and AI requirements
  - Partner with cross-functional teams to translate requirements into scalable analytics-
    and AI-ready data models and pipelines
  - Curate and validate datasets for machine learning, experimentation, and advanced
    analytics
  - Establish feature store frameworks and reusable AI data pipelines across multiple
    products
  use_cases:
  - Enterprise AI-ready data platforms for Life Sciences and Healthcare products
  - Scalable ETL/ELT pipelines for analytics, AI, and product intelligence
  - Dimensional data modeling for pharma, biotech, and healthcare SaaS applications
  - Feature store frameworks and reusable AI data pipelines across multiple products
  - Event-driven data architectures for downstream analytics and AI enablement
