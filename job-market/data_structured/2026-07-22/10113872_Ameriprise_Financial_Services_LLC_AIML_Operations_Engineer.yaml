position:
  title: AI/ML Operations Engineer
  ai_type:
    type: ai-support
    reasoning: |-
      This role is focused on operating, supporting, and
      maintaining enterprise AI/ML platforms (Dataiku, SageMaker)
      and their infrastructure — not directly building, training,
      or fine-tuning models. The engineer enables AI/ML
      capabilities for data scientists and ML engineers through
      platform engineering, DevOps, CI/CD, and governance, which
      is squarely in the ai-support category.
  responsibilities:
  - Support day-to-day operations of enterprise AI/ML platforms such as Dataiku and
    Amazon SageMaker including availability, performance, monitoring, and configuration
    management
  - Enable AWS AI/ML services including SageMaker, Bedrock, AgentCore, Amazon Q, and
    QuickSight for enterprise use cases
  - Collaborate with data scientists, ML engineers, and business teams to design and
    develop scalable AI/ML solutions
  - Build and maintain CI/CD pipelines, infrastructure-as-code, and automation for
    AI/ML platform components and deployments
  - Implement monitoring, logging, alerting, governance, and security controls for
    AI/ML platforms and workloads
  - Develop reusable platform components, templates, and deployment patterns to convert
    prototypes into production-ready solutions
  - Create and maintain operational dashboards and reports using Power BI for platform
    usage and adoption tracking
  - Support incident management, root cause analysis, access management, and continuous
    improvement initiatives
  use_cases:
  - Enterprise AI/ML platform operations and enablement for data science teams
  - Generative AI solution deployment using AWS Bedrock and related services
  - Governed, secure AI/ML workload deployment in a financial services enterprise
  - Cost optimization, usage reporting, and platform adoption tracking for AI/ML resources
  - Automated infrastructure provisioning and CI/CD for AI/ML workloads
