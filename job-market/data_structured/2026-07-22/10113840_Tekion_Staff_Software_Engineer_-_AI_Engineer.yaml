  - Retrieval-augmented generation using domain knowledge graphs spanning dealer and
    consumer data
  - Multi-provider LLM governance with cost, latency, and safety guardrails
  - Classical ML model optimization for dealership operations such as upsell, cycle
    time, and CSAT
  - Human-in-the-loop agent actions before touching dealer systems
