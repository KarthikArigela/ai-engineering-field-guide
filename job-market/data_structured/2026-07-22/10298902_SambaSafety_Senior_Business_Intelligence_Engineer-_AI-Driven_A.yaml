    reasoning: |-
      The core deliverables are BI dashboards, semantic layers,
      OpenMetadata cataloging, and data quality governance; AI
      appears mainly as tooling (Claude Code/Copilot/ChatGPT in
      the dev workflow) and as LLM API integrations the person
      consumes. Building AI-ready metadata and semantic views for
      NL-to-SQL agents is data plumbing that others' agents
      consume, and validating AI-generated outputs is QA oversight
      rather than shaping model behavior, so the role does not
      shape model output quality itself.
  responsibilities:
  - Design and build AI-augmented dashboards and self-service analytics experiences
    in Power BI and Looker, including natural-language query interfaces backed by
    Semantic Views
  - Use AI-assisted development tools (Claude Code, GitHub Copilot, ChatGPT) daily
    to accelerate SQL development, dashboard scaffolding, testing, and documentation
  - Prototype and evaluate GenAI use cases such as automated insight generation, anomaly
    narratives, and AI-written executive summaries to reduce manual reporting effort
  - Build and maintain AI-ready metadata and certified lineage in OpenMetadata to
    power natural-language-to-SQL agents and other AI query tools
  - Guide engineering teams on Semantic View design and define, monitor, and enforce
    data quality rules so AI-generated outputs rest on trusted data
  - Partner with data engineering and data science to productionize forecasting, anomaly
    detection, and clustering outputs into BI dashboards
  - Write Python for advanced analysis, automation, and integration with LLM/AI APIs
    where SQL and point-and-click BI tools fall short
  - Translate AI-driven and traditional analytics findings into reports and presentations
    for stakeholders up to the C-suite
  use_cases:
  - AI-augmented dashboards and self-service analytics for business users
  - Natural-language querying of governed data via Semantic Views and NL-to-SQL agents
  - Automated insight generation, anomaly narratives, and AI-written executive summaries
    to reduce manual reporting effort
  - Productionizing forecasting, anomaly detection, and clustering outputs into actionable
    BI dashboards
  - Driver monitoring and road safety risk analytics built on trusted data
