position:
  title: Senior Engineer – AI & Workplace Enablement
  ai_type:
    type: ai-support
    reasoning: |-
      This role is primarily a Microsoft 365 workplace engineer
      focused on identity, endpoint management, and collaboration
      services. The AI component involves driving adoption of
      Microsoft 365 Copilot and building Copilot Studio agents,
      but the core engineering work is enterprise IT enablement
      rather than building, training, or fine-tuning AI/ML models.
      The role supports AI usage within the organization rather
      than building AI systems from scratch.
  responsibilities:
  - Own and continuously improve the Microsoft 365 E5 service stack across Exchange
    Online, SharePoint Online, Teams, OneDrive, Entra ID, Intune, Defender, Purview
    and Power Platform
  - Design, configure and support identity, access and governance controls across
    Entra ID, Conditional Access, MFA, and privileged access management
  - Manage endpoint and device services across Intune, Windows Autopilot, Windows
    11, macOS, application deployment and compliance policies
  - Develop automation, reporting and operational controls using PowerShell, Microsoft
    Graph, Power Platform, Azure Automation and Infrastructure as Code
  - Drive Microsoft 365 Copilot adoption by identifying use cases, improving productivity
    and embedding AI-enabled workflows across business teams
  - Build, manage and improve Copilot Studio agents for business workflows including
    API integrations and reusable automation patterns
  - Ensure AI solutions align with enterprise security, responsible AI practices,
    data governance and compliance expectations
  - Provide third-line engineering support, root cause analysis and technical leadership
    across the Microsoft 365 E5 workplace estate
  use_cases:
  - Digital workplace modernization through Microsoft 365 and endpoint automation
  - AI-enabled productivity workflows via Microsoft 365 Copilot adoption
  - Custom business workflow automation using Copilot Studio agents
  - Identity, access and governance management across the enterprise
  - Endpoint security, compliance and device lifecycle management
  - AI governance including cost controls, usage reporting and responsible AI practices
