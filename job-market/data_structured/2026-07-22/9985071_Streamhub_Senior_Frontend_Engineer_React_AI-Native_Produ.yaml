position:
  title: Senior Frontend Engineer (React) – AI-Native Product Development
  ai_type:
    type: ai-support
    reasoning: |-
      This is a frontend engineering role focused on building
      React applications for a data-intensive SaaS product. While
      the role emphasizes "AI-native" development practices —
      using AI agents as collaborators in the development loop
      (Claude Code, lint rules, typed boundaries) — the engineer
      is building web applications, not AI/ML systems. The AI
      aspect is about development methodology, not building,
      training, or deploying models.
  responsibilities:
  - Build and maintain modern React applications within a structured monorepo (Turborepo)
    with reusable, scalable components readable by both engineers and AI agents
  - Develop highly interactive, data-intensive user experiences using React Hooks,
    TypeScript, and modern frontend patterns with typed API contracts
  - Collaborate with backend engineers to integrate RESTful APIs via server-side proxy
    patterns for seamless, secure data flow
  - Work with Product, Design, and Data teams to deliver intuitive user experiences
    and maintain in-repo convention documentation
  - Design and implement frontend testing strategies including unit, integration,
    and end-to-end tests for reliable agent feedback loops
  - Build responsive, accessible, and cross-browser compatible applications across
    major platforms
  - Contribute to frontend architecture, coding standards, and CI/CD improvements
    including custom lint rules for agent invariants
  - Mentor fellow engineers and influence product direction and frontend architecture
    decisions
  use_cases:
  - Audience measurement data visualization for TV and streaming services
  - Interactive reporting and analytics dashboards for media and advertising ecosystem
  - AdTech and MarTech data exploration and planning tools
  - Complex data grid interfaces for large-scale audience and measurement datasets
