  stage: Public
  focus: Aerospace and defense technology systems
position:
  title: AI Systems Engineer (Principal or Sr. Principal Level)
  ai_type:
    type: ml-first
    reasoning: |-
      This role involves developing, training, and validating
      traditional ML/DL models (supervised, unsupervised,
      reinforcement learning, Bayesian) for defense simulation
      environments. The focus is on classical ML techniques, GPU
      acceleration, MLOps pipelines, and representation learning —
      not LLMs or GenAI agents. The core work is building and
      deploying ML models for pattern detection, anomaly
      identification, predictive insight, and data compression in
      mission-level simulations.
  responsibilities:
  - Model operational environments and conduct trade-studies via computer simulation
  - Perform operational and effectiveness analysis to quantify capability gaps
  - Develop, train, and validate AI/ML models (supervised, unsupervised, reinforcement-learning,
    Bayesian) for pattern detection, anomaly identification, and predictive insight
  - Apply data compression techniques (autoencoders, sparse coding, learned codecs)
    to reduce bandwidth/storage while preserving decision-critical information
  - Design and implement MLOps pipelines integrating training, validation, versioning,
    and deployment into simulation toolchains
  - Leverage high-performance computing and GPU acceleration to scale model training
    and inference for massive datasets
  - Provide blue/red tactics and CONOPS modeling, simulation, and analysis in mission-level
    models
  - Synthesize stakeholder input, visualize results, and communicate findings to leadership
  use_cases:
  - Pattern detection and anomaly identification in large-scale military/defense data
    streams
  - Real-time decision-support scoring for complex multi-domain simulation environments
  - Data compression for telemetry and sensor streams to reduce bandwidth and storage
  - Automation of time-intensive data workflows including feature extraction, data
    fusion, and report generation
  - Blue/red kill-chain analysis and mission-level modeling across multiple security
    environments and platforms
  - Predictive analytics for threat assessment and survivability/lethality/vulnerability
    analysis
