position:
  title: Forward Deployed Engineer - Physical AI Cloud Platform
  ai_type:
    type: ai-support
    reasoning: |-
      This is a Forward Deployed Engineer role focused on building
      and operating cloud infrastructure (compute orchestration,
      platform services, networking, storage) that enables
      customers to run physical AI workloads. While deeply
      embedded with strategic customers, the work is on
      infrastructure and platform engineering that SUPPORTS AI
      workloads rather than directly building, training, fine-
      tuning, or deploying AI models. The AI coding tools
      mentioned are for development velocity, not for building AI
      products.
  responsibilities:
  - Own end-to-end technical execution inside strategic accounts including discovery,
    scoping, infrastructure design, build, and production rollout for design partners
    and ISV engagements
  - Build and operate cloud infrastructure and compute orchestration for simulation,
    training, evaluation, inference, and batch workloads at scale
  - Build platform services for job execution, scheduling, retries, observability,
    logging, secrets, access control, and cost tracking
  - Build customer onboarding infrastructure including sandbox environments, dataset
    storage, workflow execution, and deployment
  - Optimize cloud cost, utilization, performance, and reliability across workloads
    and debug infrastructure issues across all layers
  - Define long-term infrastructure architecture for multi-tenant SaaS, enterprise
    deployments, and high-throughput physical AI workloads
  - Turn repeated customer infrastructure pain into reusable platform capabilities
    by partnering with Product and Engineering teams
  - Co-author reference architectures, solution templates, and technical blogs, and
    maintain structured feedback loops to Product and Engineering
  use_cases:
  - Compute orchestration for physical AI simulation, training, evaluation, and inference
    workloads
  - Cloud infrastructure platform for running physical AI workloads in production
    at scale
  - Multi-tenant SaaS and enterprise deployment infrastructure for AI workloads
  - GPU-heavy simulation and training pipeline infrastructure
  - Customer onboarding and pilot infrastructure for AI cloud platform
