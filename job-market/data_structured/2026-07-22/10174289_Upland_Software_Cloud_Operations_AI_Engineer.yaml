position:
  title: Cloud Operations AI Engineer
  ai_type:
    type: ai-support
    reasoning: |-
      This role is primarily a Cloud Operations/DevOps engineer
      that uses AI tools (GitHub Copilot, AWS Bedrock, Claude) to
      accelerate troubleshooting, scripting, and automation. The
      AI tools are aids for operational work, not the core
      deliverable — the engineer is not building, fine-tuning, or
      deploying AI/ML models. AI is leveraged to improve
      operational efficiency rather than being the product itself.
  responsibilities:
  - Partner with developers and Cloud Operations teams to troubleshoot production
    issues and improve service reliability
  - Use AI-assisted tools such as GitHub Copilot, AWS Bedrock, and Claude to accelerate
    troubleshooting, scripting, and automation
  - Automate manual operational work including health checks, remediation, patching,
    reporting, and deployment support
  - Improve performance, availability, scalability, and observability across AWS-hosted
    SaaS environments
  - Contribute to incident response, root cause analysis, corrective actions, and
    operational documentation
  - Administer Windows Server, .NET framework, IIS web sites, and SQL Server database
    servers
  - Participate in on-call support for customer-facing SaaS environments and serve
    as escalation point
  - Promote responsible AI practices by validating output, protecting sensitive data,
    and applying testing and review standards
  use_cases:
  - Accelerating production troubleshooting and incident response using AI-assisted
    tooling
  - Automating repetitive cloud operations tasks such as health checks, patching,
    and remediation
  - Improving SaaS reliability, availability, and observability across AWS environments
  - Generating, debugging, and validating operational scripts and runbooks with AI
    assistance
  - Investigating performance bottlenecks and failure patterns in production systems
