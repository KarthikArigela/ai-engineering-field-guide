company:
  name: Databricks
  stage: Series H
  focus: Unified data analytics and AI platform
position:
  title: Senior Data and AI Engineer - Finance
  ai_type:
    type: ai-support
    reasoning: |-
      This role primarily involves building data pipelines and BI
      reporting for Databricks' Finance organization. While it
      mentions developing "AI-assisted tools" and an interest in
      applying AI/ML to finance workflows, the core
      responsibilities are data engineering, pipeline maintenance,
      and dashboard development — not building, training, or fine-
      tuning models. The AI component is a secondary, supportive
      aspect of the broader data engineering work.
  responsibilities:
  - Build and maintain finance data pipelines in the Finance DataLake using Databricks
    Jobs and Lakeflow Declarative Pipelines
  - Develop AI-assisted tools for Finance and Accounting, including workflow automation,
    anomaly detection, and reporting enhancements
  - Contribute to Finance applications (Databricks Apps, Genie Spaces, dashboards)
    enabling self-service analytics
  - Build and maintain reports and dashboards for monthly, quarterly, and executive-level
    reporting
  - Implement row-level security and data access policies across Finance DataLake
    datasets
  - Collaborate with Accounting, FP&A, Internal Audit, and Procurement to gather requirements
    and deliver technical solutions
  - Follow Git-based version control, PR reviews, and CI/CD pipelines to meet SOX
    change management requirements
  - Support financial close by monitoring pipelines, investigating data issues, and
    escalating as needed
  use_cases:
  - Finance data pipeline automation and reconciliation
  - AI-assisted anomaly detection in financial data
  - Self-service analytics and reporting for Finance stakeholders
  - Automated financial close and executive-level reporting
  - Data access governance and row-level security for financial datasets
