    data platform services
  - Participate in on-call rotation and contribute to operational excellence
  use_cases:
  - Web-based AI products for insurance and financial services customers
  - API platform enabling data science and ML model integration into production applications
  - Cloud infrastructure and DevOps pipelines supporting reliable AI product delivery
  - Data platform integrations connecting ML pipelines with production web services
