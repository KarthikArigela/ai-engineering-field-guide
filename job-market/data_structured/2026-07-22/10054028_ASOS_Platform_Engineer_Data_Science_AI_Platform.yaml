    data: [Spark, Databricks, Unity Catalog, Data Pipelines]
    cloud: [Azure, ADLS Gen2]
    ops: [Terraform, CI/CD, Azure DevOps, GitHub Actions, Docker, Kubernetes, MLOps,
      Observability, Monitoring, LLMOps, Infrastructure as Code]
    languages: [Python]
    domains: []
    other: [RBAC, Identity and Access Management]
  is_customer_facing: false
  is_management: false
