position:
  title: Senior QA Automation Engineer – AI Applications  UK
  ai_type:
    type: ai-support
    reasoning: |-
      This is a QA Automation Engineer role focused on testing AI-
      powered applications, not building or deploying AI/ML
      models. The role involves creating test frameworks,
      evaluating model outputs for quality, and automating QA
      workflows for AI features. While it requires understanding
      of AI/ML systems to validate them, the core work is quality
      assurance and test automation rather than model development.
  responsibilities:
  - Design and maintain automated test suites, evaluation scenarios, metrics, and
    test datasets for AI-powered features
  - Automate QA workflows using Python and CI/CD pipelines, leveraging AI-powered
    testing tools to improve test development and coverage
  - Create and maintain test harnesses for AI services, applications, and APIs
  - Define quality strategy and acceptance criteria for AI-powered applications across
    functional, API, integration, and AI/ML features
  - Evaluate AI/ML model outputs for correctness, consistency, and expected application
    behavior
  - Build quality gates for CI/CD and deployment pipelines including automated regression
    and integration testing
  - Mentor teams on QA automation best practices and consistent quality standards
    for AI-powered applications
  - Participate in code reviews and document findings across the company
  use_cases:
  - Automated testing and quality assurance for AI-powered applications
  - Validation and evaluation of AI/ML model outputs for correctness and consistency
  - AI-powered test development and QA workflow automation
  - Quality gating for AI features in CAD and design software
