position:
  title: Senior Solution Engineer-  (AI & Start-Ups). Los Angeles
  ai_type:
    type: ai-support
    reasoning: |-
      This is a pre-sales Solutions Engineer role at Cloudflare
      focused on evangelizing and selling the Cloudflare Developer
      Platform (including Workers AI, Vectorize) to startups.
      While the role involves deep technical knowledge of AI-
      related platform services and guiding customers on AI
      initiatives, the person is not building, training, fine-
      tuning, or deploying AI/ML models themselves. They map
      customer needs to Cloudflare's platform capabilities rather
      than working directly on AI systems.
  responsibilities:
  - Lead technical discovery within the cloud-developer vertical, uncovering how customers
    build and where Cloudflare fits
  - Partner with sales from the start of the cycle, joining discovery calls and qualifying
    opportunities early
  - Map customer initiatives and business problems, especially around new product
    development and AI initiatives, to the Cloudflare platform
  - Build relationships with technical champions from founding engineers up to CTOs
    within customer accounts
  - Develop and present tailored technical content, demos, and architecture discussions
    for developer and senior technical audiences
  - Lead proof-of-concept and build activities for Cloudflare prospects and customers
  - Evangelize the Cloudflare Developer Platform including Workers, Workers AI, Vectorize,
    R2, D1, KV, Queues, and Pages
  - Create professional content including reference architectures, blog posts, and
    represent Cloudflare at industry events
  use_cases:
  - Helping startups and cloud-native businesses adopt Cloudflare's developer platform
    for new product development
  - Supporting customer AI initiatives by mapping needs to Cloudflare Workers AI and
    Vectorize capabilities
  - Technical pre-sales discovery and solution design for digital-native companies
  - Architecting edge computing solutions using Cloudflare Workers and related services
