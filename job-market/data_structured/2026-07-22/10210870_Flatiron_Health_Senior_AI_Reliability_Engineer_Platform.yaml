position:
  title: Senior AI Reliability Engineer (Platform)
  ai_type:
    type: ai-first
    reasoning: |-
      This role involves building evaluation frameworks,
      observability, guardrails, and orchestration for AI/LLM-
      powered and agentic workflows in production. While it
      focuses on reliability rather than model training, the
      engineer directly works on deploying, evaluating, and
      governing AI systems including multi-agent orchestration,
      drift detection, and hallucination risk monitoring — making
      it hands-on work with AI systems.
  responsibilities:
