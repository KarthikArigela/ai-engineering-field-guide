    agent coordination, permissions, auditability, and human oversight
  - Partner with platform, product, security, engineering, and data science teams
    to evaluate AI solutions and establish reusable standards for build-vs-buy and
    model selection decisions
  - Support experimentation with emerging AI technologies while helping the organization
    make pragmatic, scalable decisions and participating in on-call rotations
  use_cases:
  - Evaluation and automated testing of LLM-powered and agentic workflows in production
  - Monitoring AI system reliability including drift detection, hallucination risk,
    and retrieval quality
  - Orchestration and governance of multi-agent AI systems with human-in-the-loop
    controls
  - Scaling AI-enabled workflows across engineering, product, and business teams in
    a regulated healthcare environment
  - AI observability and incident response for production AI failure modes
