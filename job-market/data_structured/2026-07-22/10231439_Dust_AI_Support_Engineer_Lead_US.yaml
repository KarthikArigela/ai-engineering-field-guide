    outreach)
  - Build tooling including MCP integrations, Dust agents, and internal scripts to
    scale team capacity
  - Hire, onboard, and develop support engineers on the team
  - Handle the most complex escalated support cases by investigating across logs,
    code, and internal tooling
  - Analyze agent-generated responses for inconsistencies and iterate on prompts,
    documentation, and tooling
  - Own the feedback loop between support pain points and product/engineering improvements
  - Define and own the Support as a Product backlog and coach the team to execute
    it
  use_cases:
  - Automated ticket classification and acknowledgment for customer support
  - AI-driven response drafting for support inquiries
  - Automated incident detection and proactive user outreach
  - Support workload reduction through AI agents that eliminate categories of tickets
  - Internal tooling to increase support team capacity without increasing headcount
