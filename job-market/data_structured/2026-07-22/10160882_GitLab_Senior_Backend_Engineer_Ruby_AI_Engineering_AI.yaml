  - Contribute to the broader event platform that serves as core infrastructure for
    GitLab's AI features
  - Architect for high availability and throughput to reliably process events at significant
    scale
  - Work within GitLab's Rails monolith to develop the event and trigger system
  - Influence product and architecture direction by proposing iterative solutions
    across a multi-service environment
  - Collaborate with product managers, designers, and cross-departmental Duo Agent
    Platform teams on trigger and event integration
  - Participate in Tier 2 and Tier 3 on-call rotations to troubleshoot production
    issues in a globally distributed environment
  use_cases:
  - Automated code review triggered by GitLab events
  - AI-powered DevSecOps workflows that run automatically in response to development
    lifecycle events
  - Agentic workflows that enable AI agents to take autonomous action based on events
    from GitLab and third-party tools
  - Event-driven orchestration of AI features across the GitLab platform
