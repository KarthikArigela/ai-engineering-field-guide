  focus: Identity security and access governance platform
position:
  title: 'Senior Software Engineer: AI Discovery and Posture'
  ai_type:
    type: ai-support
    reasoning: |-
      This role is about building discovery and security posture
      assessment capabilities for AI agents — it's
      infrastructure/security tooling that finds and evaluates AI
      agents, not building, training, or deploying AI models. The
      engineer builds cloud and endpoint discovery systems that
      feed into an identity governance platform, which is squarely
      enabling/security work near AI rather than hands-on AI/ML
      work.
  responsibilities:
  - Build AI agent discovery capabilities on top of Delinea's existing cloud discovery
    infrastructure, starting with Azure and expanding to AWS and GCP
  - Develop discovery mechanisms for AI agents running on endpoints
  - Assess security posture of discovered AI agents including configuration, access
    levels, and risk areas
  - Feed discovered agents and their context into the identity and attribution layer
    for governance
  - Partner with platform teams to extend existing discovery services
  - Break down complex, ambiguous problems into sound technical approaches with limited
    direction
  use_cases:
  - AI agent discovery across cloud platforms (Azure, AWS, GCP)
  - AI agent discovery on endpoints
  - Security posture assessment for AI agents
  - Identity governance and attribution for AI agents
  - Enterprise AI security and risk management
