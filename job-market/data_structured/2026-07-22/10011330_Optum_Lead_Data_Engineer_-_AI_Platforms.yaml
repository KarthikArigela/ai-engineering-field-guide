company:
  name: Optum
  stage: Public
  focus: Healthcare technology, pharmacy benefits, and care delivery
position:
  title: Lead Data Engineer - AI Platforms
  ai_type:
    type: ai-support
    reasoning: |-
      This role is focused on architecting and building data
      platforms, pipelines, and infrastructure that SUPPORT AI/ML
      and GenAI workloads (feature stores, embedding pipelines,
      vectorized datasets, semantic layers). The engineer does not
      build, train, fine-tune, or deploy models themselves, but
      enables other AI/ML teams by providing AI-ready data
      foundations.
  responsibilities:
  - Lead the architecture, design, and implementation of AI-first enterprise data
    platforms supporting AI/ML, Generative AI, Agentic AI, and operational workloads
  - Design end-to-end data architectures spanning ingestion, processing, storage,
    serving, governance, and semantic knowledge layers using Lakehouse, Medallion,
    and Data Mesh patterns
  - Build AI-ready data foundations including feature stores, embedding generation
    pipelines, vectorized datasets, and semantic indexing for AI inference workloads
  - Architect enterprise semantic layers and knowledge platforms unifying data products,
    metadata, embeddings, lineage, knowledge graphs, and business semantics
  - Establish enterprise-wide data governance frameworks including data quality controls,
    security standards, and regulatory compliance (HIPAA, GDPR, PII)
  - Lead platform reliability and operational excellence initiatives including observability,
    monitoring, cost optimization, and platform modernization
  - Collaborate with AI/ML Engineers, Data Scientists, and Enterprise Architects to
    ensure data platforms support model training, inference, RAG, and Agentic AI applications
  - Mentor engineering teams and drive technical excellence across the organization
  use_cases:
  - Enterprise knowledge retrieval and RAG systems for AI copilots and agents
  - Semantic search and vector search across enterprise knowledge assets
  - Feature stores and embedding pipelines supporting AI/ML model training and inference
  - Enterprise copilots and Agentic AI workflows consuming business-aware knowledge
  - Healthcare data platforms supporting analytics, AI-driven applications, and regulated
    workloads
  - Enterprise knowledge graphs and semantic interoperability for AI data consumption
  skills:
    genai: [Embeddings, RAG, Semantic Search, AI Agents, Agentic Workflows, Context
        Engineering]
    ml: [Feature Stores]
    web: [REST APIs]
    databases: [BigQuery, Snowflake, Redshift, PostgreSQL, MySQL, SQL Server, Oracle,
      Cosmos DB, NoSQL, Pinecone, Chroma, FAISS, Vector Databases, Vector Search,
      Knowledge Graphs, Graph Databases, Neo4j]
    data: [Databricks, Delta Lake, Apache Iceberg, Spark, PySpark, Kafka, Spark Streaming,
      Airflow, dbt, Data Pipelines, Data Modeling, Data Engineering, Data Governance,
      Data Mesh, Lakehouse Architecture, Medallion Architecture, Lambda Architecture,
      Kappa Architecture, Parquet, Hadoop, Azure Event Hub, AWS Kinesis]
    cloud: [AWS S3, Azure Data Factory, Azure Synapse, AWS, Azure, GCP, IAM]
    ops: [Docker, Kubernetes, CI/CD, Jenkins, GitHub Actions, Monitoring, Observability,
      DataOps]
    languages: [Python, SQL]
    domains: []
