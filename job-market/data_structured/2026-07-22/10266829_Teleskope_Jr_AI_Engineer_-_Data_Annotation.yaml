  - Build and run quality control checks to catch labeling errors, measure inter-annotator
    agreement, and surface systematic issues
  - Collaborate with data scientists and ML engineers to close the loop between real-world
    performance and model improvement
  - Context switch across labeling, quality analysis, scripting, and process work
    as priorities evolve
  - Document QC processes and annotation guidelines to support team scaling and onboarding
  use_cases:
  - Data classification for data security and remediation
  - Training data production for ML models that protect sensitive customer data
  - Quality control and inter-annotator agreement measurement for data labeling pipelines
  - Automated annotation workflow scaling for growing data science operations
