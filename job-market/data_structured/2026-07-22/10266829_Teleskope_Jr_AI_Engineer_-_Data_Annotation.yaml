position:
  title: Jr. AI Engineer - Data Annotation
  ai_type:
    type: ai-support
    reasoning: |-
      This role is primarily focused on data annotation, labeling,
      and quality control for ML pipelines. While the role
      involves building tooling (Python, SQL, agentic workflows)
      to improve annotation processes, the engineer does not
      build, train, fine-tune, or deploy ML models directly. The
      work supports the data science team by producing high-
      quality training data and quality signals that feed into
      models built by others.
  responsibilities:
