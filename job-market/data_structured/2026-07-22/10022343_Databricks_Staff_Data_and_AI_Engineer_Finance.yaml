company:
  name: Databricks
  stage: Public
  focus: Unified data, analytics, and AI platform
position:
  title: Staff Data and AI Engineer, Finance
  ai_type:
    type: ai-support
    reasoning: |-
      This role is primarily a data engineering and technical lead
      position within the Finance organization, focused on
      building data pipelines, internal applications, and data
      infrastructure. While it involves leading the technical
      design of AI use cases (forecasting, anomaly detection, NL
      interfaces), the core work is data pipeline architecture and
      governance rather than directly building, training, or fine-
      tuning models. AI/ML is listed as "nice to have" and the
      role's primary deliverables are data infrastructure and
      Finance DataLake management.
  responsibilities:
  - Architect, build, and own complex finance data pipelines in the Finance DataLake
    using Databricks Jobs and Lakeflow Declarative Pipelines
  - Lead technical design of AI use cases for Finance including forecasting automation,
    anomaly detection, and natural language interfaces to financial data
  - Build and maintain internal Finance applications (Databricks Apps, Genie Spaces,
    dashboards) for self-service by non-technical Finance stakeholders
  - Design curated Finance DataLake datasets enforcing row-level security, data access
    policies, and Unity Catalog governance standards
  - Define and champion coding standards, data modeling conventions, documentation
    practices, and testing frameworks across the Finance engineering team
  - Enforce Git-based version control, pull-request reviews, and CI/CD pipelines to
    satisfy SOX change management requirements
  - Serve as primary technical point of contact during financial close ensuring data
    accuracy and timely pipeline issue resolution
  - Mentor junior and mid-level engineers through code reviews, pairing, and design
    discussions
  use_cases:
  - Forecasting automation for Finance and Accounting
  - Anomaly detection in financial data
  - Natural language interfaces to financial data
  - Self-service Finance applications and dashboards for non-technical stakeholders
  - Financial data lake governance with row-level security and access policies
  - ETL pipelines from financial source systems into centralized data lake
  skills:
    genai: [LLMs]
    ml: [Anomaly Detection, Machine Learning]
    web: [FastAPI, Streamlit]
    databases: [PostgreSQL, Snowflake]
    data: [Apache Spark, PySpark, Databricks, Delta Lake, ETL, Data Pipelines, Data
        Modeling, Data Governance, Airflow]
    cloud: [AWS, Azure, GCP]
    ops: [CI/CD, GitHub Actions, Git, Docker, Kubernetes]
    languages: [Python, SQL]
    domains: []
    other: [Salesforce, NetSuite, Agile]
  is_customer_facing: false
  is_management: false
