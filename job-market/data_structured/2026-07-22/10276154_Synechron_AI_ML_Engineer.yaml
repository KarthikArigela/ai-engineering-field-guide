position:
  title: AI ML Engineer
  ai_type:
    type: ai-first
    reasoning: |-
      This role involves hands-on building of RAG-based enterprise
      AI search and retrieval systems using Azure OpenAI,
      designing prompts, implementing vector search, and
      architecting agentic multi-step retrieval. The engineer
      directly builds and deploys AI/LLM systems, not just
      supporting infrastructure.
  responsibilities:
  - Build secure AI search and retrieval systems for large-scale enterprise document
    platforms using Azure AI Search and Azure OpenAI
  - Design RAG architectures including index design, hybrid search, semantic ranking,
    and relevance tuning for unstructured enterprise documents
  - Develop backend services and APIs that orchestrate search, retrieval, and LLM
    calls with cloud-native scalability and observability
  - Implement prompt engineering strategies to constrain responses to source documents,
    reduce hallucinations, and support citation-based answers
  - Design and enforce security-aware retrieval including document-level access control,
    metadata-driven filtering, and LLM access restrictions
  - Measure and improve retrieval relevance, answer accuracy, and latency across search
    and generation pipelines
  - Lead and influence AI architecture decisions for enterprise RAG platforms and
    mentor other engineers in AI search patterns
  - Integrate AI search capabilities into internal enterprise applications
  use_cases:
  - Enterprise document search and retrieval at scale
  - Retrieval-Augmented Generation (RAG) for grounding LLM responses in enterprise
    data sources
  - Generative question-answering over enterprise document repositories
  - Document summarization and embedding generation
  - Secure, compliance-aware AI search with document-level access controls
  - Agentic multi-step retrieval for complex enterprise documents
