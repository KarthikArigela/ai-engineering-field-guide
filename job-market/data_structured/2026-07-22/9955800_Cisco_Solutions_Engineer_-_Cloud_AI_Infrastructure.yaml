position:
  title: Solutions Engineer - Cloud & AI Infrastructure
  ai_type:
    type: ai-support
    reasoning: |-
      This is a solutions engineering/presales role focused on
      selling and designing Cisco's data center, cloud, and AI-
      ready infrastructure. The role involves customer-facing
      architectural discussions and platform modernization — not
      building, training, or deploying AI/ML models directly. AI
      is referenced only in the context of infrastructure that
      supports AI workloads (GPU compute, high-performance
      fabrics, reference architectures).
  responsibilities:
  - Drive adoption of Cisco's data center, cloud, and AI-ready infrastructure solutions
    across UK&I customers
  - Partner with customers to understand their modernization goals and design tailored
    platform architectures
  - Demonstrate how Cisco's compute, networking, and cloud-native technologies accelerate
    customer business outcomes
  - Act as the technical liaison between internal engineering teams, account teams,
    partners, and customers
  - Deliver engaging workshops and presentations on infrastructure modernization to
    technical and non-technical audiences
  - Contribute to architectural discussions and solve customer infrastructure challenges
  - Build awareness and education around platform modernization, cloud-native infrastructure,
    and AI-ready data centers
  - Travel for customer meetings and industry events as needed
  use_cases:
  - Data center transformation and modernization for enterprise customers
  - AI-ready infrastructure design including GPU compute and high-performance fabrics
  - Cloud-native platform deployment and containerized workload management
  - Virtualization and hypervisor migration strategies
  - Infrastructure automation and DevOps for data center operations
  - Zero-trust security implementation in data center and cloud-native environments
