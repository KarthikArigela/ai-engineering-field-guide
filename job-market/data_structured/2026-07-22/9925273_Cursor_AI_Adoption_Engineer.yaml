position:
  title: AI Adoption Engineer
  ai_type:
    type: ai-support
    reasoning: |-
      This role is about driving adoption of Cursor (an AI coding
      tool) within customer organizations through hackathons,
      workshops, and developer engagement. The person works NEAR
      AI products but does NOT build, train, fine-tune, or deploy
      models themselves. They are a post-sales, customer-facing
      practitioner focused on behavior change and adoption
      outcomes, not on engineering AI systems.
  responsibilities:
  - Design, produce, and run internal hackathons within customer organizations using
    formats like cohort-based programs, single-day sprints, and multi-day builds
  - Build and own the Customer Developer Day program including immersive half-day
    or full-day events for specific accounts or customer segments
  - Develop facilitation infrastructure such as playbooks, judging rubrics, agenda
    frameworks, and post-event retrospective templates
  - Partner with AI Deployment Managers and Customer Success to identify the right
    adoption intervention for each account
  - Capture outcomes from engagements and turn them into customer success stories
    for internal teams and broader Cursor storytelling
  - Identify patterns across customer engagements and feed insights back into the
    Customer Education team's program and content design
  - Serve as a credible technical presence in the room with developers, able to follow
    codebases, troubleshoot in real time, and demonstrate Cursor capabilities
  use_cases:
  - Driving adoption of AI coding tools within large enterprise engineering organizations
  - Facilitating developer behavior change from traditional coding to AI-assisted
    development workflows
  - Running hackathons and developer events to accelerate AI tool adoption at customer
    companies
  - Enabling internal champions within customer organizations to sustain AI tooling
    adoption
