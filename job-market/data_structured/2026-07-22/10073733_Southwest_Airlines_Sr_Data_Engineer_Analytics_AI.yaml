    data from various sources using AWS and SQL technologies
  - Develop analytical tools providing actionable insights into key business performance
    metrics including operational efficiency and customer acquisition
  - Partner with Business Data Analysts, AI Engineers, Product Owners, and executive
    teams to support data infrastructure needs
  - Establish data quality, validation, and reconciliation frameworks for analytical
    products
  use_cases:
  - GenBI and conversational analytics powered by AI-enabled datasets
  - Enterprise BI dashboards and self-service analytics for operational decision-making
  - Operational efficiency monitoring for airline operations
  - Customer acquisition and commercial analytics
  - Data platforms serving Analytics, ML, and AI workloads across a large enterprise
  - Vector databases and embeddings pipelines supporting AI-enabled analytics
