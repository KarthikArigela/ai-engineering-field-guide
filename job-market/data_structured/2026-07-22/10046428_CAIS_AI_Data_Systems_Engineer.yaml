  - Partner with Technology to implement SDLC, testing, deployment, and version control
    practices for the tool stack
  - Define lightweight automation standards including reliability, error handling,
    and logging guardrails
  - Bridge BT and Engineering/InfoSec teams, translating business requirements into
    technical specs and mentoring team members
  use_cases:
  - Workflow automation for platform operations and business transformation
  - Cross-system data integration between Salesforce, Snowflake, and other SaaS platforms
  - Operational dashboards and internal tooling for business users
  - Agentic workflow prototyping and operationalization
  - Data cataloging and discoverability across the business transformation environment
  - Automated pre-trade, trade, and post-trade operational processes for alternative
    investments
