position:
  title: Senior Software Engineer I – Search and AI Platform
  ai_type:
    type: ai-support
    reasoning: |-
      This role is building backend infrastructure (graph-based
      search services, data pipelines) that powers an AI platform,
      but does not directly involve building, training, fine-
      tuning, or deploying AI/ML models. The engineer works on
      graph traversal, entity hydration, and search APIs that
      serve as the data layer for Elsevier's AI-powered products.
  responsibilities:
  - Design and implement graph-based search services using GraphQL and GraphQL Federation
  - Develop backend applications using Java, Spring Boot, and Spring framework
  - Integrate with databases and AWS services (Neo4j, DynamoDB, RDS, S3, SQS, SNS,
    Kinesis) to support ingestion, storage, and messaging pipelines
  - Champion clean code, SOLID principles, and engineering best practices while mentoring
    other engineers
  - Collaborate with product managers and engineering teams to deliver advanced search
    and recommendation features
  - Ensure robust monitoring and logging using New Relic and Coralogix for reliability
    and performance
  - Build structured queries based on entity relationships and metadata hydration
    for discovery and recommendation systems
  use_cases:
  - Graph-based search and discovery across scientific research data
  - Advanced entity traversal and recommendation systems for scientific literature
  - Knowledge graph interrogation powering products like Scopus, ScienceDirect, and
    ClinicalKey
  - AI-powered search systems for the scientific community
  - Data ingestion and storage pipelines supporting search and recommendation features
