position:
  title: AI Voice Implementation Engineer
  ai_type:
    type: ai-support
    reasoning: |-
      This role is focused on telephony implementation and
      onboarding for a Voice AI product — configuring PBX systems,
      troubleshooting call routing, and managing phone number
      porting. The engineer works NEAR the AI product (deploying
      and supporting it for customers) but does NOT build, train,
      fine-tune, or deploy the underlying AI/ML models themselves.
      The work is infrastructure/integration/support for an AI
      product, making it ai-support.
  responsibilities:
  - Own the technical onboarding and telephony setup for every Voice AI deployment
    at hotel properties
  - Collaborate with hotel IT teams, PBX vendors, and carriers to gather requirements
    and drive end-to-end configuration
  - Troubleshoot live telephony issues including call transfers, audio tuning, number
    porting, and attestation problems
  - Read and analyze logs to diagnose and resolve call routing and connectivity issues
  - Partner with Product team on call flow design and escalation logic, bringing telephony
    expertise to conversational AI design
  - Serve as the telephony subject matter expert across customer implementations and
    ongoing support
  use_cases:
  - Voice AI deployment for hotel guest interactions and call handling
  - Telephony integration between hotel PBX systems and AI-powered voice agents
  - Call routing, transfer, and answering automation for hospitality
  - Conversational AI phone experiences replacing static phone trees in hotels
