position:
  title: Lead Cloud AI Engineer - Travel role
  ai_type:
    type: ai-first
    reasoning: |-
      This role involves guiding the implementation of Gemini for
      Government, Google AI APIs, Model Garden, and Agent Builder
      for federal customers, which constitutes deploying AI
      solutions. However, the primary focus is cloud architecture
      and migration (70-80% of the role), with AI being one
      component of a broader cloud modernization leadership
      position. The AI work involves architecting and deploying AI
      platforms/solutions rather than building or training models,
      placing it at the boundary of ai-first and ai-support, but
      the hands-on implementation guidance for Gemini and AI APIs
      tips it to ai-first.
  responsibilities:
  - Lead architecture and design for enterprise Google Cloud Platform environments
    supporting federal agencies
  - Develop and execute migration strategies for legacy, hybrid, and multi-cloud infrastructures
  - Design secure cloud architectures using Google Cloud Assured Workloads, IAM, VPC
    Service Controls, and encryption strategies
  - Guide implementation of Gemini for Government, Google AI APIs, Model Garden, and
    enterprise AI solutions for federal customers
  - Drive FedRAMP authorization and Authority to Operate (ATO) efforts alongside compliance
    teams and 3PAOs
  - Lead infrastructure automation, CI/CD, deployment governance, and observability
    initiatives
  - Serve as primary technical advisor to federal customers and agency leadership
    throughout the project lifecycle
  - Mentor Associate and Mid-Level Cloud Engineers and develop the organization's
    Google Cloud practice
  use_cases:
  - Enterprise cloud migration and modernization for U.S. Federal Government agencies
  - Secure deployment of Gemini for Government and Google AI APIs in classified environments
  - FedRAMP High and DoD IL4/IL5/IL6 compliant cloud architecture for federal customers
  - Enterprise AI platform deployment using Model Garden and Agent Builder in government
    cloud
  - Infrastructure automation and DevSecOps for government cloud environments
