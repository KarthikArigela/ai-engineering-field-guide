position:
  title: AI/ML Operations Engineer
  ai_type:
    type: ai-support
    reasoning: |-
      This role is focused on operating, supporting, and
      maintaining AI/ML platforms (Dataiku, SageMaker) and
      enabling their use by data scientists and ML engineers.
      While it involves AWS AI/ML services like Bedrock and
      SageMaker, the core responsibilities are platform
      engineering, DevOps, infrastructure-as-code, and operational
      support rather than directly building, training, or fine-
      tuning models.
  responsibilities:
  - Support day-to-day operations of enterprise AI/ML platforms including Dataiku
    and Amazon SageMaker
  - Manage platform availability, performance, access controls, configurations, monitoring,
    and operational health
  - Enable AWS AI/ML services including SageMaker, Bedrock, AgentCore, Amazon Q, and
    QuickSight for enterprise use cases
  - Develop and maintain CI/CD pipelines for AI/ML platform components and solution
    deployments
  - Implement infrastructure-as-code and configuration-as-code practices using CloudFormation
    and Terraform
  - Collaborate with data scientists, ML engineers, and business teams to design and
    deploy scalable AI/ML solutions
  - Ensure AI/ML platforms follow enterprise security, compliance, governance, and
    monitoring requirements
  - Create and maintain operational dashboards and reports using Power BI and QuickSight
  use_cases:
  - Enterprise AI/ML platform operations and enablement
  - Generative AI solution deployment using AWS Bedrock
  - Enterprise data science and ML workload management
  - AI/ML governance, monitoring, and cost optimization
  - Automated ML pipeline and deployment orchestration
