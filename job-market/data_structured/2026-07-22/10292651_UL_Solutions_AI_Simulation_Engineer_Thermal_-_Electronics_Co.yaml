    reasoning: |-
      This role is primarily a Computational Fluid Dynamics (CFD)
      and thermal simulation engineering position for electronics
      cooling. While it mentions "interest in AI-assisted
      simulation workflows" as a nice-to-have, the core work
      involves traditional physics-based simulation, not building,
      deploying, or fine-tuning ML/LLM models. AI is only
      tangentially mentioned.
  responsibilities:
  - Develop and execute CFD and thermal simulations for electronics cooling applications
    including airflow, convection, and conjugate heat transfer
  - Support component-, board-, enclosure-, and sub-system-level thermal analysis
    for products such as circuit breakers, PLCs, laptops, and appliances
  - Analyze industrial environments including high ambient temperatures, enclosure
    heating, dust effects, and derating requirements
  - Apply appropriate boundary conditions including power losses, contact resistance,
    and environmental loads
  - Support steady-state and transient thermal analyses including power cycling, duty
    cycles, startup conditions, and fault scenarios
  - Post-process and interpret simulation results to identify thermal risks, hotspots,
    and design improvement opportunities
  - Correlate simulation results with temperature rise tests, lab measurements, and
    field observations
  - Support verification and validation activities including comparison with test
    data and engagement with UL/IEC standards
  use_cases:
  - Thermal simulation and analysis for electronics cooling applications
  - Airflow distribution evaluation in control panels, switchgear, and electronic
    enclosures
  - Design optimization including heat sink sizing, airflow path improvement, and
    enclosure ventilation
  - Thermal risk identification and hotspot detection in industrial and consumer products
  - Compliance verification with UL/IEC certification standards and temperature rise
    limits
