    reasoning: |-
      This is a support engineering role where the person helps
      customers install, maintain, and troubleshoot ArangoDB-based
      deployments. While the role requires AI/RAG knowledge, the
      core work is customer support, deployment operations, and
      database administration — not building, training, or
      deploying AI models themselves. The engineer enables
      customers to use ArangoDB's AI capabilities but does not
      directly build AI systems.
