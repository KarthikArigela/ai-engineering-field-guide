    environments
  - Diagnose and troubleshoot complex customer issues including database performance,
    networking, and infrastructure problems
  - Build and configure customer deployments and assist with query writing and performance
    optimization
  - Collaborate with Engineering, Product, and QA teams on product defects and customer
    feedback
  - Create documentation and contribute to internal and external knowledge bases
  - Train internal and external teams on ArangoDB and its AI suite capabilities
  use_cases:
  - Enterprise AI infrastructure deployment and operations
  - Vector search and RAG-based AI applications on graph/document databases
  - Database performance tuning and optimization for AI workloads
  - Kubernetes-based database cluster management at scale
  - Customer support and troubleshooting for production database systems
