position:
  title: AI & Digital Workplace Engineer
  ai_type:
    type: ai-first
    reasoning: |-
      This role directly engineers, deploys, configures, and
      governs AI capabilities embedded in the digital workplace
      (Microsoft 365 Copilot, AI assistants, custom AI
      integrations, AI-driven automation workflows). While the
      foundation is IT/digital workplace engineering, the
      differentiating scope involves hands-on AI tool
      implementation, prompt library development, and building AI-
      driven workflows — making this an AI-first role where AI
      engineering is the primary value-add.
  responsibilities:
  - Engineer and operate Microsoft Entra ID including conditional access, identity
    governance, SSO/SAML/OIDC integrations, hybrid identity, PIM, and B2B guest access
    governance
  - Own endpoint management across Windows (Intune) and macOS (Jamf) including policy,
    compliance, provisioning, and device performance
  - Lead the engineering of AI capabilities embedded in productivity and collaboration
    platforms including Microsoft 365 Copilot, third-party AI assistants, and custom
    AI integrations
  - Configure, integrate, and govern AI features across the digital workplace stack
    balancing capability with security, privacy, and licensing constraints
  - Build AI-driven automation for IT operations including service desk augmentation,
    log analysis, documentation generation, and knowledge retrieval
  - Implement technical controls that enforce AI usage policy at the platform layer
    including data loss prevention, sensitivity labeling, and AI feature gating
  - Maintain a living technical inventory of enterprise AI tools and operate shadow-AI
    detection and remediation in coordination with GRC
  - Provide hands-on technical coaching to IT staff on prompt engineering, AI-assisted
    runbooks, and agentic patterns, maintaining a community of practice
  use_cases:
  - AI-driven IT service desk augmentation and routine task automation
  - Enterprise AI tool governance and shadow-AI detection across the digital workplace
  - AI-augmented knowledge work automation including documentation generation and
    knowledge retrieval
  - Microsoft 365 Copilot integration and custom AI assistant deployment for enterprise
    productivity
  - AI adoption measurement and impact reporting across the IT organization
  - Technical enforcement of AI acceptable use policy and regulatory compliance (EU
    AI Act, NIST AI RMF)
