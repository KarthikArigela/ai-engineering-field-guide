      FreeRTOS, Zephyr, Embedded Linux, Over-The-Air Updates]
    languages: [C, C++, Rust, Python]
    domains: []
    other: [NPU, DSP, Real-Time Audio Processing, Hardware-Software Co-Design, Benchmarking,
      Power Management, Embedded Systems]
  is_customer_facing: false
  is_management: false
