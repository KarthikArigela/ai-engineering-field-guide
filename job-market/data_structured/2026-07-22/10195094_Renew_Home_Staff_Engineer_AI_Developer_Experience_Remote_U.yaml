  title: Staff Engineer, AI Developer Experience (Remote, US)
  ai_type:
    type: ai-support
    reasoning: |-
      This role is focused on Developer Experience (DevX) —
      improving the tooling, workflows, and infrastructure that
      enable engineers to work effectively. While AI tools (GitHub
      Copilot, Cursor, Claude, etc.) are a key area of adoption
      and governance, the engineer is not building, training, or
      deploying AI models themselves. They are evaluating,
      integrating, and standardizing AI development tools for
      internal engineering teams, which is enabling work near AI
      rather than hands-on model work.
  responsibilities:
  - Lead the evolution of AI Developer Experience, enabling engineers to safely and
