  - Drive evaluation, adoption, and governance of AI development tooling including
    code generation, in-editor assistance, and agentic workflows
  - Measure and improve the speed of common developer actions across TypeScript/Node
    and Python codebases including build times, pre-push hooks, linting, and type
    checking
  - Own devcontainer strategy for local and cloud-based development environments
  - Maintain and improve local testing frameworks and developer-facing test infrastructure
  - Own and evolve shared internal libraries and configuration systems used across
    application teams
  - Contribute to CI/CD and delivery pipelines, SDLC definition, language and library
    upgrade cycles, developer onboarding, documentation, and observability
  - Mentor engineers and influence engineering culture as a technical leader
  use_cases:
  - AI-assisted code generation and in-editor assistance for software engineers
  - Agentic workflows for software development lifecycle
  - Developer productivity and velocity optimization across monorepos
  - Standardized and reproducible development environments via devcontainers
  - Governance and guardrails for safe AI tool adoption in engineering teams
