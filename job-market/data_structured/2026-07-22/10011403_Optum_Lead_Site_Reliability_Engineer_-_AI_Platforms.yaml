position:
  title: Lead Site Reliability Engineer - AI Platforms
  ai_type:
    type: ai-support
    reasoning: |-
      This is an SRE/Platform Engineering role focused on
      operating, monitoring, and maintaining the infrastructure
      that supports AI/ML platforms. While the role involves
      deploying and operating AI inference services, RAG
      pipelines, and vector databases, the core work is
      reliability engineering, observability, and platform
      operations — not building, training, or fine-tuning models.
      The role enables AI teams rather than directly building AI
      systems.
  responsibilities:
  - Operate and maintain production AI/ML platforms including inference services,
    RAG pipelines, and AI serving infrastructure
  - Build and support CI/CD pipelines, deployment automation, and platform operational
    workflows
  - Implement auto-scaling, load balancing, disaster recovery, failover, and business
    continuity solutions
  - Ensure observability through monitoring, logging, tracing, and alerting across
    multi-region distributed cloud environments
  - Optimize platform performance, resource utilization, AI inference workloads, and
    operational costs
  - Manage production incidents, perform root cause analysis, and drive operational
    excellence initiatives
  - Mentor junior engineers and contribute to engineering best practices
  - Collaborate with research, engineering, product, security, and data teams to translate
    AI advancements into production-ready capabilities
  use_cases:
  - Production AI inference serving and model deployment at scale
  - RAG pipeline and vector database operations for enterprise AI
  - Multi-region distributed AI platform reliability and failover
  - AI/ML platform observability, monitoring, and incident response
  - Cloud cost optimization for AI infrastructure and GPU workloads
