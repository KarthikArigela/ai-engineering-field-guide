    APIs, workflow orchestration, and relational database layers
  - Architect and manage RDBMS-based data models supporting transactional and analytical
    use cases
  - Build AI-enabled features such as intelligent search, chatbots, document processing,
    and agent-driven workflows
  - Implement DevSecOps practices including SAST, DAST, and SCA to identify and remediate
    software vulnerabilities
  - Design and maintain CI/CD pipelines with integrated security scanning, automated
    testing, and compliance checks
  - Mentor engineering teams, conduct code reviews, and establish best practices in
    software design, security, and cloud-native development
  - Operate within a SAFe Agile environment, contributing to sprint planning, backlog
    refinement, and cross-team coordination
  use_cases:
  - Intelligent search for government mission operations
  - Chatbots for federal client assistance
  - Document processing for government workflows
  - Agent-driven workflow automation for business and mission operations
  - Data visualization and analytics dashboards for decision-making
  - Workflow and process automation for federal agencies
