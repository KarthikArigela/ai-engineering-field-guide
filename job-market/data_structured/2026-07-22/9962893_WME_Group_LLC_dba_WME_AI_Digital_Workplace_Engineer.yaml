position:
  title: AI & Digital Workplace Engineer
  ai_type:
    type: ai-support
    reasoning: |-
      This role is centered on digital workplace engineering
      (identity, endpoint, M365) with AI as a differentiating
      layer. The engineer evaluates, integrates, configures, and
      governs AI tools like Microsoft 365 Copilot rather than
      building, training, or fine-tuning models. Model fine-tuning
      and ML development are explicitly out of scope, making this
      an AI-support role.
  responsibilities:
  - Engineer and operate Microsoft Entra ID including conditional access, SSO/SAML/OIDC,
    hybrid identity, PIM, and B2B guest access governance
  - Manage endpoint provisioning, compliance, and policy across Windows (Intune) and
    macOS (Jamf)
  - Resolve complex M365 service issues across Exchange Online, Teams, SharePoint,
    and OneDrive
  - Lead the engineering and integration of AI capabilities across the digital workplace
    stack including Microsoft 365 Copilot and third-party AI assistants
  - Design and build AI-driven automation for IT operations including service desk
    augmentation, documentation generation, and routine task automation
  - Partner with cybersecurity governance and compliance to operationalize AI usage
    policy through technical controls and maintain a technical AI tool inventory
  - Provide hands-on technical coaching to IT staff on AI tooling including prompt
    engineering, AI-assisted runbook authoring, and agentic patterns
  - Lead complex incident response, problem management, and continual service improvement
    using ITIL/ITSM practices
  use_cases:
  - AI-augmented IT service desk and support automation
  - Enterprise AI productivity and collaboration via Microsoft 365 Copilot and third-party
    assistants
  - Shadow-AI detection and governance across the enterprise
  - AI-driven workflow automation for routine knowledge work
  - AI policy enforcement through technical controls like conditional access and data
    loss prevention
  - IT operational automation including log analysis and documentation generation
