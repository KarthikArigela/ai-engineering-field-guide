    ops: [Terraform, Infrastructure as Code]
    languages: [Python, Go]
    domains: []
    other: [Okta, SAML 2.0, OAuth 2.0, OIDC, SCIM, IAM, SOC 2, GDPR, Zero-Trust Architecture]
  is_customer_facing: false
  is_management: false
