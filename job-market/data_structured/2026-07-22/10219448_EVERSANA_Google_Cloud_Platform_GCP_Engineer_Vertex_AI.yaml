  - Configure and manage IAM, Cloud Identity, Service Accounts, RBAC, and Workload
    Identity Federation
  - Build and maintain CI/CD pipelines using Azure DevOps, GitHub Actions, or GitLab
    CI
  - Monitor, troubleshoot, and optimize cloud infrastructure and participate in incident
    management and root cause analysis
  use_cases:
