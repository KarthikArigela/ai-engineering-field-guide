position:
  title: Solution Engineer - Cloud & AI Infrastructure
  ai_type:
    type: ai-support
    reasoning: |-
      This is a technical pre-sales/solution engineering role
      focused on cloud infrastructure migration and modernization
      on Azure. While AI is mentioned as part of the
      infrastructure solutions, the role involves designing cloud
      architectures and guiding customers through migrations — not
      building, training, or deploying AI/ML models directly. AI
      workloads are something the infrastructure supports, not
      what the engineer builds.
  responsibilities:
  - Own technical sales engagements with customer technical decision makers through
    demos, POCs, and consultative sales methodology
  - Build trusted advisor relationships with customers to co-develop secure and resilient
    cloud architecture solutions using Cloud Adoption Framework best practices
  - Overcome technical objections and manage customer escalations with Global Black
    Belt and engineering teams
  - Maintain deep expertise in cloud migration across Windows, SQL Server, Linux,
    PostgreSQL, and Oracle workloads to Azure
  - Guide customers through modernization using the 6R strategy, containerization,
    and Azure-native services like AKS and Arc
  - Design hybrid and cloud-native networking solutions including virtual networks,
    VPNs, and secure routing architectures
  - Maintain expertise in partner solutions including NetApp, VMware, RedHat, and
    SAP for migration scenarios
  - Stay current on market trends, competitive insights, and Azure security and compliance
    frameworks
  use_cases:
  - Cloud migration of enterprise workloads (Windows, SQL Server, Linux, PostgreSQL,
    Oracle) to Azure
  - Cloud modernization using containerization, AKS, and Azure Arc
  - Hybrid and cloud-native network architecture design
  - AI-powered infrastructure for enterprise workloads
  - Secure and compliant cloud environments meeting regulatory requirements
  - Legacy system transformation using AI and intelligent agents
