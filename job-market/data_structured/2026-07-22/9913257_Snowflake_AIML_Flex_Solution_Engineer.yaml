position:
  title: AI/ML Flex Solution Engineer
  ai_type:
    type: ai-support
    reasoning: |-
      This is a pre-sales solutions engineering role at Snowflake
      focused on supporting AI/ML sales cycles, building
      demos/PoCs, and driving customer adoption of Snowflake's
      AI/ML platform. The Flex SE architectes solutions and
      prototypes but does not build, train, or deploy models
      themselves — they enable customers and regional teams to use
      Snowflake's existing AI/ML products. The role works NEAR AI
      (sales engineering, enablement, prototyping on an existing
      platform) rather than directly ON AI systems.
  responsibilities:
  - Partner with Account Executives and Solution Engineers to identify and develop
    AI/ML opportunities within strategic US Major Accounts
  - Conduct technical presentations, product demonstrations, and workshops focused
    on Snowflake's AI/ML portfolio
  - Architect and prototype foundational AI/ML solutions including proof-of-concepts
    that demonstrate clear business value
  - Serve as the technical bridge between customers and central AI/ML Product and
    Engineering teams, synthesizing feedback and requirements
  - Drive sales acceleration through hands-on development of MVPs and functional prototypes
    demonstrating platform capability
  - Provide technical support and capacity augmentation for regional SE teams in complex
    AI/ML sales cycles
  - Develop and deliver AI/ML training materials to upskill the broader SE organization
  - Document successful solution patterns and best practices for regional SE reuse
  use_cases:
  - AI/ML platform adoption acceleration for enterprise customers
  - Rapid prototyping of AI/ML proof-of-concepts to demonstrate business value
  - MLOps pipeline implementation on Snowflake for customer use cases
  - Customer enablement and technical upskilling in AI/ML capabilities
  - AI/ML consumption growth and revenue acceleration in strategic accounts
