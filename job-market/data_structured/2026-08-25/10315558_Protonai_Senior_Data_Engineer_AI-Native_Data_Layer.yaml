  - Build validation, reconciliation, lineage, backfills, and idempotent/incremental
    loads to ensure data correctness
  - Partner with backend, AI, product engineers, and occasionally customers' IT teams
    to define data contracts
  - Drive the Data Layer's next-level architecture, tooling, scale, and source expansion
  use_cases:
  - Unified data layer serving CRM, PIM, eCommerce AI, and Order & Quote Entry AI
    products
  - Data foundation feeding Proton's AI brain and AI/ML products (retrieval, feature/serving
    layers)
  - Ingesting and reconciling messy distributor data from ERP and ecommerce sources
  - Trustworthy, reconciled data serving downstream engineering and product teams
