position:
  title: Senior Data Engineer (AI-Native) — Data Layer
  ai_type:
    type: ai-support
    reasoning: |-
      The role builds and operates data pipelines, ingestion,
      medallion modeling, and serving layers. AI agents (Claude
      Code, Cursor) are used as dev tools to write code faster,
      which is explicitly ai-support, and the data layer merely
      feeds an AI brain owned by others. The person shapes no
