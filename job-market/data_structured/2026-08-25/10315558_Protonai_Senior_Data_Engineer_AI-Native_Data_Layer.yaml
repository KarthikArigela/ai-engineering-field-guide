  responsibilities:
  - 'Own the Data Layer end to end: ingestion from file-, event-, and API-based sources;
    medallion-style modeling (raw, refined, curated); and the serving layer powering
    products and the AI brain'
  - Build and operate ingestion and transformation pipelines using a modern orchestration
    framework and cloud data warehouse
  - Ingest and reconcile large, messy real-world data across batch files, streaming
    events, and APIs
  - Model data across medallion layers to keep it trustworthy, queryable, and stable
    for downstream teams and the AI
  - Operate AI coding agents (Claude Code and similar) to scope work, structure context,
