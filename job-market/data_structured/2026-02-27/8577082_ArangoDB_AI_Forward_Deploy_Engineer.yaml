position:
  title: AI Forward Deploy Engineer
  ai_type:
    type: ai-first
    reasoning: |-
      The role directly shapes LLM behavior: it designs RAG
      (chunking, embeddings, ranking, caching), writes and
      iterates prompts, builds tool/call orchestration, fine-tunes
      models (LoRA/PEFT, DPO, distillation), and builds evals and
      guardrails. Forward Deploy Engineers delivering AI solutions
      at customer sites are also explicitly ai-first.
  responsibilities:
  - Embed with customers to run discovery, identify high-value AI use cases, and define
    success metrics, SLAs/SLOs, and delivery plans from PoV through pilot to production
  - Build end-to-end prototypes including data connectors, RAG pipelines, prompts/tools,
    and UIs/APIs
  - Implement retrieval-augmented generation (chunking, embeddings, ranking, caching)
    and tool/call orchestration
  - Evaluate and iterate prompts, models, and retrieval strategies using offline/online
    metrics and A/B tests
  - Fine-tune or adapt models (LoRA/PEFT, preference optimization/DPO, distillation)
