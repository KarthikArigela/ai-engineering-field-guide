position:
  title: Data Engineer, AWS & AI/ML Enablement
  ai_type:
    type: ai-support
    reasoning: |-
      This is primarily a data engineering role: the person builds
      batch/streaming pipelines, data models, and ETL frameworks
      on AWS. The AI/ML portion (25%) is enablement work -
      productionizing ML-ready datasets, feature pipelines,
      embedding workflows, and MLOps/LLMOps infrastructure to
      support separate Data Science and AI teams. They do not
      write prompts, design the RAG system itself, train/fine-tune
      models, or judge model output quality; they feed data to
      models others shape, which is ai-support.
  responsibilities:
  - Design, build, and maintain scalable batch and streaming data pipelines using
    AWS services such as S3, Glue, Lambda, Kinesis, Step Functions, Redshift, Athena,
    and DynamoDB
  - Develop and optimize data models, complex SQL queries, and analytics-ready datasets
    for reporting and downstream consumers
  - Build and operate serverless ETL frameworks for automated ingestion, transformation,
    and loading of structured and semi-structured data
  - Partner with Data Science and AI teams to productionize ML-ready datasets, feature
    pipelines, and embedding workflows
  - Support MLOps/LLMOps workflows including dataset versioning, experiment tracking,
    and inference data capture for continuous improvement
  - Enable AI use cases such as recommendation systems, personalization, and RAG through
    robust data foundations
  - Ensure data quality, reliability, and observability through automated testing,
    validation, monitoring, and alerting
  - Integrate BI tools such as QuickSight, contribute to CI/CD and infrastructure
    automation, and mentor junior engineers
  use_cases:
  - Higher-education recruitment and student engagement analytics
  - Personalized outreach to students for college enrollment planning
  - Recommendation systems and personalization for student-college connections
  - Retrieval-augmented generation (RAG) AI capabilities enabled by data foundations
  - Real-time and self-service analytics and reporting via BI tools
  - ML model training, evaluation, and inference data pipelines
