position:
  title: AI Research Engineer (Multi-Modal Reinforcement Learning) - 100% Remote Worldwide
  ai_type:
    type: ai-first
    reasoning: |-
      This is an AI Research Engineer role focused on multi-modal
      reinforcement learning systems. The role involves hands-on
      development of RL algorithms for diffusion models and
      autoregressive multimodal architectures, directly building
      and training advanced AI models. This is core AI/ML research
      and development work, not supporting infrastructure or
      general software engineering.
  responsibilities:
  - Conduct research on reinforcement learning algorithms for multimodal models, including
    diffusion-based approaches for image autoregressive models and unified frameworks
  - Design and build reinforcement learning infrastructure that supports scalable,
    distributed training across multimodal systems while maintaining efficiency and
    reliability
  - Develop and refine reward modeling strategies that improve training stability,
    align model behavior with desired outcomes, and mitigate reward hacking and related
    failure modes
  - Create and curate multimodal simulation environments and datasets to support robust
    training, evaluation, and benchmarking of reinforcement learning systems
  - Design and conduct rigorous benchmarking and evaluation protocols to measure model
    performance, track progress against baselines, and validate improvements across
    multimodal tasks
  - Analyze and optimize policy performance across modalities by identifying bottlenecks
    in training, credit assignment, and cross-modal alignment
  - Investigate and develop next-generation reinforcement learning paradigms that
    more effectively learn from environment feedback to achieve superior state-of-the-art
    performance
  - Publish research findings in top-tier conferences such as ICML, NeurIPS, ICLR,
    CVPR, ICCV, ECCV
  use_cases:
  - Multi-modal reinforcement learning for next-generation intelligent systems
  - Optimizing decision-making and adaptive behavior across text, images, and audio
    modalities
  - Diffusion-based generative models for multimodal understanding and image generation
  - Resource-efficient multimodal models for constrained hardware environments
  - Unified multimodal frameworks integrating multiple data modalities for robust
    AI performance
  - Domain-adapted AI systems for dynamic real-world environments with environment
    feedback learning
  skills:
    genai: [Diffusion Models, Autoregressive Models]
    ml: [Reinforcement Learning, Multi-modal Learning, PyTorch, Reward Modeling, Deep
        Learning]
