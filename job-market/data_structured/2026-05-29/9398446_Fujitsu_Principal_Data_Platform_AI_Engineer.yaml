position:
  title: Principal Data Platform & AI Engineer
  ai_type:
    type: ai-support
    reasoning: |-
      This is a data platform engineering role focused on building
      infrastructure and platforms that ENABLE AI/ML work rather
      than building models directly. The role centers on data
      lakehouse architectures, ETL/ELT pipelines, and platform
      design using Databricks/Snowflake/Azure - providing the
      foundation for others to operationalize AI and machine
      learning.
  responsibilities:
  - Define and lead target-state architectures for modern data platforms using Databricks,
    Microsoft Fabric, Azure Synapse, Snowflake, and cloud-native services
  - Design scalable data lakehouse environments, ingestion frameworks, semantic layers,
    and analytics architectures
  - Architect secure, governed, and high-performing enterprise data solutions aligned
    with customer strategy and European data regulations
  - Lead end-to-end implementation of data platforms and AI solutions from advisory
    through production deployment
  - Build and optimize ETL/ELT pipelines, streaming solutions, and transformation
    frameworks using Python, PySpark, SQL, and cloud-native technologies
  - Implement best practices for CI/CD, Infrastructure as Code, DevOps, automation,
    monitoring, and platform lifecycle management
  - Help customers operationalize AI and machine learning capabilities on top of modern
    data platforms
  - Act as a strategic advisor to customers on data modernization, cloud transformation,
    and AI adoption
  use_cases:
  - Enterprise AI enablement including generative AI and intelligent search
  - Advanced analytics and forecasting on modern data platforms
  - Cloud-native data platform modernization and migration
  - Data lakehouse and data mesh architecture implementations
  - Intelligent automation and AI-ready data foundations
  - Enterprise data governance and compliance solutions
