  - Partner in weekly AI enablement sessions and help turn identified use cases into
    repeatable, supportable workflows or tools
  - Work closely with Security to implement safe patterns for authentication, authorization,
    token handling, data protection, and production readiness
  - Use Terraform, cloud infrastructure, and version-controlled delivery practices
    to manage systems that support internal AI enablement
  - Create clear documentation, reusable patterns, and technical guidance that help
    teams adopt AI responsibly and effectively
  use_cases:
  - Internal workflow automation using AI agents and tools to reduce repetitive manual
    tasks across the organization
  - Enterprise AI enablement through integration of AI platforms (Claude, Copilot)
    with business systems (Okta, Google Workspace, Slack, Notion, Jira)
  - Knowledge integration and retrieval workflows using context-aware systems that
    maintain continuity across tools and platforms
  - Employee productivity enhancement through AI-powered automations that streamline
    cross-system workflows and reduce SaaS dependencies
  - AI governance and security implementation ensuring safe authentication, authorization,
    and data protection patterns for AI-enabled workflows
  - Technical enablement program scaling through reusable patterns, MCP infrastructure,
    and operational standards that support enterprise-wide AI adoption
