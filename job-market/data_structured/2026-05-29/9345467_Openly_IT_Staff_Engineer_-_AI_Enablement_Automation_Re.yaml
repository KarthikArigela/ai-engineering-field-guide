position:
  title: IT Staff Engineer - AI Enablement & Automation (Remote, US)
  ai_type:
    type: ai-support
    reasoning: |-
      This is an IT/Platform Engineer role focused on AI
      enablement and infrastructure. The role builds integrations,
      automations, and tooling to support enterprise-wide AI
