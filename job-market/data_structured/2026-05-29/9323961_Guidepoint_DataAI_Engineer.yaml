position:
  title: Data/AI Engineer
  ai_type:
    type: ai-support
    reasoning: |-
      This is a data/platform engineering role: it builds ETL
      pipelines, Lakehouse infrastructure, streaming APIs, and
      microservices that feed BI and AI/ML use cases, but never
      shapes model behaviour (no prompt design, retrieval
      architecture, evals, fine-tuning, or agent work). ML and
      Generative AI items (MLflow feature pipelines, GenAI tools)
      appear only as nice-to-have platform plumbing, so the role
      is ai-support.
  responsibilities:
  - Design, build, and maintain ETL pipelines, data ingestion workflows, and table
    schemas on Azure Databricks to support BI, analytics, and AI/ML use cases
  - Architect and optimize the Lakehouse using Delta Lake on Databricks for reliability,
    performance, and cost efficiency
  - Build data pipelines from business applications such as Salesforce and NetSuite,
    and develop Knowledge Graph models and NLP-based insight pipelines
  - Maintain data governance, data privacy standards, and compliance practices throughout
    the data lifecycle
  - Develop scalable web APIs and microservices in Python and deploy them on AKS using
    Docker, Kubernetes, Helm, and Azure DevOps YAML pipelines
  - Design SSE endpoints and asynchronous streaming services integrating Kafka, Redis
    Pub/Sub, and RabbitMQ for real-time event delivery to web and mobile clients
  - Implement observability across streaming services with distributed tracing, structured
    logging, and metrics using Prometheus, Datadog, and OpenTelemetry
  - Write unit, integration, and load tests, maintain CI/CD pipelines, participate
    in architecture and code reviews and on-call rotations, and mentor junior engineers
  use_cases:
  - Data infrastructure powering Guidepoint's research and analytics products
  - BI reporting and analytics over a Lakehouse data warehouse
  - Data pipelines supporting AI/ML platforms and ML/feature engineering workflows
  - Knowledge Graph models and NLP-based insight pipelines
  - Real-time event streaming and delivery to web and mobile clients via SSE
  - Enterprise data integration from Salesforce, NetSuite, and other business applications
