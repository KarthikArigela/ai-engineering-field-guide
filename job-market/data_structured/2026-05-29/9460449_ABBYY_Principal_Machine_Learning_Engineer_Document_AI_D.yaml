position:
  title: Principal Machine Learning Engineer, Document AI Data (Tech Lead Manager)
  ai_type:
    type: ai-support
    reasoning: |-
      This role is a Tech Lead Manager for Document AI Data,
      focused on building data infrastructure, pipelines, and
      platforms that support AI teams rather than directly working
      on models. The role centers on AI-assisted annotation,
      synthetic data generation, document understanding pipelines,
      and creating high-quality training data at scale for
      modeling teams to consume. While the role requires expertise
      in LLMs/VLMs for data strategy, the hands-on work involves
      architecting data platforms, establishing data quality
      frameworks, and leading data operations rather than
      training, fine-tuning, or deploying models.
  responsibilities:
  - Own end-to-end technical strategy for Document AI data platform including AI-assisted
    annotation, synthetic data generation, and document understanding pipelines
  - Define architectural principles unifying multiple data workflows into a scalable,
    cohesive platform
  - Establish and operationalize standards for high-quality training data in collaboration
    with Modeling teams
  - Drive development of data quality evaluation frameworks including metrics for
    coverage, fidelity, and performance
  - Lead, mentor, and grow a team of Senior Machine Learning Engineers including hiring
    strategy and performance management
  - Partner cross-functionally with Platform, Modeling, and Data Operations teams
    to align data strategies with model training needs
  - Make hands-on technical contributions to critical architectural and pipeline decisions
  - Champion best practices for data privacy, compliance, and responsible AI across
    all data processes
  use_cases:
  - Enterprise document processing and information extraction for Fortune 500 customers
  - AI-assisted document annotation and synthetic training data generation
  - Large-scale document understanding pipelines processing millions of documents
  - Training data creation for large language models (LLMs) and vision-language models
    (VLMs)
  - Document layout analysis and structured data extraction from varied document types
  - Intelligent Document Processing (IDP) for business process automation
