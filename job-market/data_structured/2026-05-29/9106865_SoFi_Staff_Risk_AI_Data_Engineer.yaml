  - Serve as primary technical liaison for strategic vendor and platform relationships
    including Snowflake, credit bureau providers, and AI/data platform partners
  - Evaluate emerging AI and data technologies including AI-powered ETL, intelligent
    monitoring systems, and LLM-enabled operational tooling
  - Partner with Product Managers and cross-functional stakeholders to translate business
    and Risk requirements into scalable engineering roadmaps
  use_cases:
  - Risk data platform scaling and operational maturity for a financial services company
  - AI-assisted development environments and intelligent alerting for engineering
    productivity
  - Automated documentation and AI-powered operational tooling for data engineering
    teams
  - Enterprise-scale data governance, lineage, and compliance for risk management
  - AI-powered ETL and intelligent monitoring for production data systems
