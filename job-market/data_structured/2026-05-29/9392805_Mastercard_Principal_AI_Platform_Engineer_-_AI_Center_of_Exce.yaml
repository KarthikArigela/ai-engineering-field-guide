position:
  title: Principal AI Platform Engineer - AI Center of Excellence
  ai_type:
    type: ai-support
    reasoning: |-
      This is an infrastructure/platform engineering role that
      builds and scales the underlying hardware and systems
      (compute, storage, networking, GPUs) that ENABLE AI
      workloads for others. The role focuses on data center
      design, procurement, vendor management, and platform
      architecture - supporting data scientists and ML teams
      rather than building, training, or deploying models
      directly. The person enables AI work through infrastructure
      rather than working hands-on with models or AI algorithms.
  responsibilities:
  - Lead AI infrastructure roadmap for on premise private cloud, spanning strategy,
    design, procurement, delivery, installation, and lifecycle management
  - Act as product owner for AI infrastructure, translating business and data science
    needs into scalable platform capabilities
  - Lead RFI and RFP processes for AI infrastructure components including CPU, GPU,
    storage, and networking
  - Architect infrastructure capable of training large scale predictive and generative
    models on petabytes of data
  - Define and champion modern AI infrastructure standards including high performance
    storage, networking, liquid cooling, and power dense rack design
  - Partner with data science, MLOps, and platform teams to align infrastructure choices
    with model development and deployment requirements
  - Collaborate cross functionally with enterprise architecture, security, risk, governance,
    compliance, and legal teams
  - Stay ahead of industry trends in AI infrastructure, Generative AI, and Agentic
    AI to inform long term strategy
  use_cases:
  - Training large-scale predictive ML models for payment and transaction analysis
  - Training and serving generative AI and agentic AI models at enterprise scale
  - Real-time and batch inference for payment processing with thousands of TPS
  - Supporting petabyte-scale data processing for AI model training
  - Enabling AI-powered fraud detection and security analytics
  - Supporting responsible AI and compliance-driven AI applications across financial
    services
