    reasoning: |-
      This role optimizes model internals directly: writing custom
      GPU/Metal compute shaders from scratch and applying pruning,
      quantization, Flash Attention, KV Cache, and speculative
      decoding, which counts as shaping. The optimization targets
      span LLM techniques (token response, KV Cache, speculative
      decoding) alongside diffusion models and vision
      transformers, and roles covering both LLM and classical
      components are ai-first.
  responsibilities:
  - Design and deploy state-of-the-art model serving architectures delivering high
    throughput and low latency while optimizing memory usage across environments including
    resource-constrained devices and edge platforms
  - Build, run, and monitor controlled inference tests in simulated and live production
    environments, tracking latency, throughput, memory consumption, and error rates
    against benchmarks
  - Identify and prepare test datasets and simulation scenarios tailored to real-world
    deployment challenges on low-resource devices
  - Analyze computational efficiency and diagnose bottlenecks in serving pipelines,
    addressing suboptimal batch processing, network delays, and high memory usage
  - Write custom GPU compute shaders and perform low-level kernel optimization for
    mobile and edge inference
  - Apply pruning, quantization, Flash Attention, KV Cache, and speculative decoding
    to reduce inference latency, memory footprint, and improve throughput
  - Design and optimize distributed inference engines using tensor, pipeline, and
    expert parallelism for massive models on GPU clusters
  - Collaborate with cross-functional teams to integrate optimized serving and inference
    frameworks into production pipelines for edge and on-device applications
  use_cases:
  - On-device and edge AI inference on resource-constrained mobile hardware
  - High-throughput, low-latency, low-memory model serving in production environments
  - Multi-modal AI architectures integrating text, images, and audio
  - Distributed inference of massive models across GPU clusters
  - Efficient deployment and serving of diffusion models and vision transformers
