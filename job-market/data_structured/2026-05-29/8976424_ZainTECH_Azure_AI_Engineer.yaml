position:
  title: Azure AI Engineer
  ai_type:
    type: ai-first
    reasoning: |-
      This role is directly hands-on with building, deploying, and
      operationalizing AI/ML systems on Azure — including RAG
      pipelines, fine-tuned model deployment, agent design, prompt
      flows, and guardrails implementation. The engineer owns the
      full lifecycle of AI solution delivery, making this clearly
      an ai-first role.
  responsibilities:
  - Implement AI solutions on Azure AI Foundry including agent design, model selection,
    prompt flows, evaluation pipelines, and deployment of fine-tuned and base models
  - Build RAG pipelines using Azure AI Search, Azure OpenAI, and vector stores integrated
    with enterprise data sources via Azure Data Lake and Databricks
  - Deploy models and AI endpoints to Azure Machine Learning, Azure AI Foundry, AKS,
    and Azure Container Apps with endpoint scaling and versioning
  - Build and operationalize data pipelines, feature engineering jobs, and model training
    notebooks on Azure Databricks using PySpark, Delta Lake, and Unity Catalog
  - Implement input/output guardrails using Azure AI Content Safety, Prompt Shields,
    and groundedness checks with PII and harmful-content filters
  - Enforce security standards including private endpoints, VNet integration, Managed
    Identity, Key Vault, and RBAC across all AI services
  - Take ownership of the full deployment lifecycle from environment provisioning
    and CI/CD pipeline build to go-live and handover
  - Author and maintain Infrastructure as Code (Terraform/Bicep) modules for AI services
    and build CI/CD pipelines for prompt flows, model training, and endpoint deployment
  use_cases:
  - Enterprise RAG pipelines for knowledge retrieval over corporate data sources
  - Agentic AI solutions for enterprise workflow automation
  - Responsible AI deployment with content safety and compliance guardrails for regulated
    industries
  - AI model serving and inference at scale on Azure infrastructure
  - Feature engineering and model training pipelines on enterprise data lake platforms
  - Enterprise AI solution integration with downstream business applications via REST
    APIs
