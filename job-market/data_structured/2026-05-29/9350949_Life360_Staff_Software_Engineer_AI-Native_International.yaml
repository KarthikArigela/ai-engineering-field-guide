      core product. The engineer designs APIs and services for
      location sharing, internationalization, and family safety
      features, using AI assistants like Claude Code to accelerate
      development workflow.
  responsibilities:
  - Design and build high-quality APIs and services for international adaptation of
    Life360 platform
  - Work with AI (Claude Code) as a first-class collaborator, orchestrating agents
    to create specs, generate code and tests, verify results, and perform reviews
  - Define and codify AI-Native engineering practices for the International team,
    establishing playbooks for broader organization adoption
  - Build across the full stack as needed, shipping polished, performant, and reliable
    experiences to tens of millions of users
  - Contribute to architectural decisions, code reviews, and culture of craft and
    continuous improvement
  - Mentor team members and evolve team's AI-native engineering practices and technical
    standards
  - Participate in on-call rotation and incident response for production services
  - Ensure performance, reliability, and accessibility across owned features
  use_cases:
  - International platform localization and adaptation for markets like Brazil, UK,
    and Philippines
  - Location sharing and family safety services serving 97.8M monthly active users
    across 180+ countries
  - APIs and microservices for internationalization including regionally relevant
    features and localized experiences
  - Consumer-scale backend services supporting lower-end mobile devices and inconsistent
    network connectivity
  - AI-accelerated software development workflows using agentic AI coding assistants
  - Family coordination features including emergency dispatch, crash detection, and
    safe driver reports
