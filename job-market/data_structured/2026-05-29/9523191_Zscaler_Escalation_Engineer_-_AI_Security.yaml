position:
  title: Escalation Engineer - AI Security
  ai_type:
    type: ai-support
    reasoning: |-
      This is an Escalation Engineer role focused on
      troubleshooting and resolving issues related to AI security,
      data governance, and AI model deployment safety. The role
      involves understanding AI systems and investigating security
      scenarios related to AI models and agents, but does not
      involve building, training, fine-tuning, or deploying AI
      models. Instead, the engineer is supporting customers and
      resolving technical escalations for a cloud security
      platform that includes AI-assisted capabilities.
  responsibilities:
  - Own and resolve highest-severity technical escalations through deep analysis,
    ensuring fast resolution and managing on-call rotation for critical issues
  - Troubleshoot and resolve complex issues across Zscaler cloud security services,
    configuration, policy engines, APIs, and AI-assisted capabilities
  - Investigate and resolve scenarios related to secure use of AI models, governance
    of AI agents, data protection, and inference security
  - Perform detailed log, telemetry, and packet-level analysis to identify root cause,
    reproduce complex defects, and validate fixes
  - Drive cross-functional collaboration with Engineering, Cloud Ops, and Product
    Management while creating troubleshooting documentation
  - Act as technical mentor to uplift support capability and provide engineering-ready
    bug reports
  use_cases:
  - Secure enterprise AI model deployment and usage governance
  - AI agent behavior monitoring and security policy enforcement
  - Data leakage prevention in AI systems and inference security
  - Cloud-native Zero Trust security for AI-assisted capabilities
  - Enterprise access control and authentication for AI model usage
  - TLS/SSL inspection and security for AI traffic
