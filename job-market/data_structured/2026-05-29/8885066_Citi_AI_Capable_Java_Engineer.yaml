position:
  title: AI Capable Java Engineer
  ai_type:
    type: ai-support
    reasoning: |-
      This role is primarily a Java microservices engineering
      position that involves integrating pre-built AI/ML models
      into enterprise applications. The engineer does not build,
      train, or fine-tune models themselves—they integrate models
      developed by data scientists and ML engineers into Java-
      based microservice systems. This is enabling/support work
      for AI rather than hands-on AI/ML model development.
  responsibilities:
  - Architect and design high-volume, low-latency Java microservice systems and solutions
    for AI/ML model integration and deployment
  - Develop clean, efficient code for core microservice components, APIs, AI-driven
    services, and related systems using Java and its ecosystem
  - Identify and resolve performance bottlenecks ensuring optimal performance and
    scalability of microservices and AI-integrated components
  - Provide technical leadership and mentorship to development teams on software development,
    AI integration, and microservices architecture
  - Diagnose and resolve complex technical issues across the microservice and AI/ML
    integration stack for critical production systems
  - Collaborate with data scientists, AI/ML engineers, front-end developers, and stakeholders
    to deliver integrated intelligent solutions
  - Stay current with emerging technologies in Java, microservice patterns, and MLOps,
    recommending innovative solutions
  - Create and maintain comprehensive technical documentation including design specifications,
    API documentation, and operational guides
  use_cases:
  - AI/ML model integration into enterprise financial services applications
  - Real-time AI inference for financial services via streaming data processing
  - Production deployment and monitoring of AI/ML models in Java microservice architectures
  - Intelligent automation and AI-driven decision-making in banking systems
