    scaling tasks
  - Implement self-healing patterns and resilient recovery workflows
  use_cases:
  - Large-scale GPU compute clusters for autonomous driving AI model training
  - Multi-tenant GPU scheduling systems for distributed model training
  - Model development platform supporting end-to-end ML pipelines from raw data to
    on-road experimentation
  - Production inference infrastructure for autonomous driving AI systems
  - Fleet management and resource optimization for GPU-backed compute environments
