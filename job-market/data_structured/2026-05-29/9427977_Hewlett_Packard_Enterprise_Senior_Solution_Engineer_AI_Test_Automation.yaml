  - Mentor and guide engineers through code reviews, design discussions, and best
    practices to ensure high-quality deliverables
  - Collaborate closely with cross-functional teams including program managers, architects,
    hardware engineers, and QA teams
  - Integrate intelligent automation and drive AI/ML adoption in networking, security,
    and system performance domains
  use_cases:
  - AI-powered test automation for networking and security systems
  - Intelligent automation for network security threat detection and prevention
  - Performance optimization and bottleneck analysis in distributed network systems
  - Automated testing and validation of networking stacks and security functions
  - Enterprise network security solutions with AI-enhanced capabilities
  - LLM-based automation for system monitoring and issue resolution
