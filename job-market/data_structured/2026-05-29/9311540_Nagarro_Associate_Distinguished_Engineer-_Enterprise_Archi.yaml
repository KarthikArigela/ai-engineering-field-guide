position:
  title: Associate Distinguished Engineer- Enterprise Architect (Azure AI)
  ai_type:
    type: ai-support
    reasoning: |-
      This is an enterprise architect role focused on platform
      governance, integration patterns, security/compliance, and
      MLOps infrastructure. The architect designs the Azure AI
      Landing Zone and provides technical direction, but does not
      build, train, fine-tune, or deploy models directly. The role
      enables AI work for others through platform architecture and
      governance rather than hands-on model development.
  responsibilities:
  - Architect the AI Landing Zone including Azure OpenAI, Azure AI Foundry, Power
    Platform, Microsoft Fabric, and Microsoft Copilot services
  - Ensure platform security, compliance, governance, identity/SSO integration, and
    infrastructure requirements across academic, administrative, research, and healthcare
    environments
  - Implement architectural controls for FERPA, accessibility (WCAG/508), privacy,
    and institutional policy requirements with responsible AI checks and observability
  - Design integration patterns with core client systems (SIS, LMS, SSO, APIs, data
    sources) and define secure data pipelines and access patterns
  - Evaluate technology options (Azure OpenAI, Copilot, Power Platform, Fabric) for
    use cases and define technical requirements and architectural components
  - Establish CI/CD pipelines, monitoring dashboards, cost transparency mechanisms,
    and lifecycle management processes for platform maturity
  - Review prototypes, solution designs, integrations, and deployments for technical
    completeness and architectural alignment
  - Provide technical leadership, coaching, and guidance to development and engineering
    teams while collaborating with functional consultants and data/technology leads
  use_cases:
  - Enterprise AI platform for academic institutions supporting education, research,
    healthcare, and administration
  - Integration with Student Information Systems (SIS), Learning Management Systems
    (LMS), and core enterprise systems
  - AI-powered applications using Azure OpenAI, Microsoft Copilot, and Power Platform
    across departments
  - Secure data pipelines and connectors enabling AI solutions compliant with FERPA
    and institutional policies
  - Scalable AI platform evolving from pilot projects to enterprise-wide institutionalization
