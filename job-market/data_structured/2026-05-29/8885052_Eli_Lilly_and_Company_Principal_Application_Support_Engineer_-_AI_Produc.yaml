  - Provide senior support for deployments and releases including risk assessment,
    go/no-go input, and rollback readiness
  - Ensure support processes and fixes align with internal standards and external
    regulations (GDPR, HIPAA)
  - Create and govern high-quality runbooks, knowledge base articles, and operational
    standards; mentor L2/R2 engineers
  use_cases:
  - Production support and incident resolution for AI products and agent systems
  - Reliability engineering and operational excellence for enterprise pharmaceutical
    technology platforms
  - Observability and monitoring for distributed AI-powered services
  - Compliance-aligned operations in regulated healthcare/pharmaceutical environment
