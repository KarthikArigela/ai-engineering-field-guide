      MCP/Function calling, Context window management]
    data: [Kafka, Kinesis]
    other: [Distributed Systems]
    ops: [Docker, Kubernetes, CI/CD, Prometheus, Grafana, OpenTelemetry, Datadog]
    web: [RESTful API design, Microservices]
    databases: [DynamoDB, NoSQL, Redis]
  is_customer_facing: false
  is_management: false
