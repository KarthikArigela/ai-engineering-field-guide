  - Maintain smooth operation of the RLHF feedback pipeline and processes
  - Apply strong code-review instincts to identify logic errors, performance traps,
    and security issues
  - Provide detailed written explanations justifying why one coding approach is better
    than another
  use_cases:
  - Training LLMs to write production-grade code across multiple programming languages
  - RLHF pipeline for code generation models
  - AI code generation and refinement
  - Automated code quality assessment and improvement
