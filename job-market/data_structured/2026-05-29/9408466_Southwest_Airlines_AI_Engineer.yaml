    reasoning: |-
      The role is hands-on building agentic AI systems -
      implementing task-oriented agents with tool routing,
      RAG/retrieval pipelines, embeddings, and working directly
      with LLMs and agentic frameworks (LangGraph, AWS Bedrock
      Agents). This is core AI engineering work on deploying and
      operating AI models/agents in production.
  responsibilities:
  - Design, build, and operate task-oriented agents with planner/executor patterns,
    tool routing, human-in-the-loop checkpoints, fallbacks, and circuit breakers
