  - Optimize context size, caching, rerankers, model selection, and tool routing to
    reduce cost per successful task
  - Prepare and maintain schemas and data contracts, batch and stream ETL for context
    stores, embedding jobs, and freshness SLAs
  - Integrate runtime frameworks such as LangGraph/AgentCore and Bedrock Agents/Guardrails
    with enterprise systems
  - Maintain agent cards, runbooks, and playbooks; contribute templates and internal
    libraries for repeatable delivery
  use_cases:
  - Customer-facing AI experiences that simplify journeys and enable faster, more
    intuitive interactions across digital channels
  - Enterprise search and retrieval augmented generation for customer support and
    commercial operations
  - Internal AI tools that make enterprise teams more effective through practical
    agentic AI solutions
  - Task-oriented agents for automating operational workflows with human-in-the-loop
    safeguards
  - Safe and compliant AI interactions with PII redaction and audit trails for regulated
    airline industry
