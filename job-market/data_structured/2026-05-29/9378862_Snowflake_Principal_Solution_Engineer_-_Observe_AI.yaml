position:
  title: Principal Solution Engineer - Observe AI
  ai_type:
    type: ai-support
    reasoning: |-
      This is a Principal Sales Engineer role for Observe by
      Snowflake, an observability platform. The position involves
      pre-sales technical support, conducting product
      demonstrations, managing POCs, and advising customers on
      observability solutions. While the product (Observe) is
      built on Snowflake's AI Data Cloud and mentions AI-powered
      capabilities, the role itself is focused on sales
      engineering and customer enablement rather than hands-on
      AI/ML model development, deployment, or fine-tuning. The
      technical requirements center on observability tools
      (Prometheus, OpenTelemetry, Grafana, ELK) and cloud
      platforms, not AI/ML frameworks.
  responsibilities:
  - Conduct in-depth technical discovery sessions with prospects to understand their
    environment and observability requirements
  - Tailor and deliver compelling product demonstrations and technical presentations
    showcasing solution value
  - Design, scope, and manage technical evaluations and Proof of Concepts in customer
    environments
  - Partner with Account Executives to develop and execute technical sales strategies
    throughout the sales cycle
  - Serve as the voice of the customer to Product Management and Engineering teams
  - Develop and maintain technical sales collateral, including demo environments and
    best practice guides
  use_cases:
  - Troubleshooting modern distributed applications with AI-powered observability
  - Unified platform for telemetry and business data analysis
  - Monitoring metrics, logging, and tracing for cloud-native applications
  - Observability for Kubernetes, Docker, and microservices architectures
  - Root cause analysis and incident response acceleration
