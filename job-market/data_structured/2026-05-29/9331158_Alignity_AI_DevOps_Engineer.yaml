position:
  title: AI DevOps Engineer
  ai_type:
    type: ai-support
    reasoning: |-
      This is an AI DevOps Engineer role focused on infrastructure
      and platform engineering that supports AI systems. The
      responsibilities involve designing and managing
      infrastructure for AI/LLM applications, deploying
      containerized environments, and implementing DevOps/SRE
      practices - all of which enable AI work rather than directly
      building, training, or fine-tuning models. The role supports
      model serving, inference workflows, and AI platforms, which
      is characteristic of ai-support work.
  responsibilities:
  - Design, deploy, and manage scalable infrastructure for AI and LLM-based applications
    in production environments
  - Build and maintain Infrastructure-as-Code (IaC) using Terraform for secure, repeatable,
    and auditable deployments
  - Deploy, manage, and scale containerized environments using Kubernetes with focus
    on high availability and reliability
  - Implement DevOps, Platform Engineering, and SRE best practices to improve system
    reliability and scalability
  - Support AI platform services for model serving, inference, experimentation, and
    evaluation workflows
  - Deploy and maintain infrastructure supporting AI agents, orchestration frameworks,
    and LLM runtime dependencies
  - Design and manage vector database infrastructure including Pinecone, Weaviate,
    or PostgreSQL with pgvector for RAG and semantic search
  - Implement monitoring, alerting, logging, and incident response processes for mission-critical
    AI systems
  - Collaborate with security, compliance, and governance teams to ensure adherence
    to regulatory and enterprise security standards
  use_cases:
  - LLM-powered applications in financial services
  - RAG and semantic search systems using vector databases
  - AI agent-based workflows and orchestration frameworks
  - Model serving and inference platforms for AI applications
  - Enterprise AI platforms in regulated financial services environment
