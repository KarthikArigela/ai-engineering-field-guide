company:
  name: Success Academy Charter Schools
  stage: Public/Non-profit
  focus: K-12 public charter school network
position:
  title: AI Software Engineer
  ai_type:
    type: ai-support
    reasoning: |-
      This role is an integration specialist focused on connecting
      AI tools with school systems rather than building or fine-
      tuning AI models. The role involves API development,
      middleware, and automation to enable AI-enhanced workflows,
      but the actual AI systems are built by separate AI teams
      that this position collaborates with.
  responsibilities:
  - Design and implement integrations between AI models and school systems including
    SIS, LMS, student data platforms, and assessment tools
  - Develop middleware, APIs, and automation scripts to enable AI-enhanced workflows
    for grading, student engagement analysis, and predictive insights
  - Build and manage RESTful APIs, GraphQL APIs, and Webhooks to enable seamless communication
    between AI tools and school infrastructure
  - Automate data extraction, transformation, and synchronization between systems
    using ETL pipelines and API-driven workflows
  - Develop integrations with LLM-based AI assistants, chatbots, and recommendation
    engines to enhance learning experiences
  - Ensure real-time data flow between AI tools and student management systems using
    Pub/Sub, Kafka, or event-driven architectures
  - Implement secure authentication and authorization protocols including OAuth 2.0,
    SAML, and JWT to protect student and faculty data
  - Work with cloud platforms to deploy serverless functions and event-driven architectures
    for scalable automation
  use_cases:
  - AI-enhanced grading workflows and automated assessment tools
  - Student engagement analysis and predictive insights for academic performance
  - LLM-based chatbots and AI assistants for educational support
  - Recommendation engines for personalized learning experiences
  - Real-time data synchronization between AI tools and school management systems
  - Secure data exchange between educational platforms while maintaining FERPA compliance
