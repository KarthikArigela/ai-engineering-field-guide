position:
  title: AI Data Engineer
  ai_type:
    type: ai-support
    reasoning: |-
      This is a data engineering role that supports AI work rather
      than building AI models. The role is described as the "data
      backbone that powers our AI capabilities" and involves
      preparing data FOR AI Engineers to use in RAG pipelines,
      model training, and agentic workflows. While the role
      requires familiarity with LLM data requirements and AI-
      assisted tooling (Copilot), the core work is building
      ETL/ELT pipelines, data transformation, governance, and
      reporting infrastructure.
  responsibilities:
  - Design, build, and maintain scalable ETL/ELT pipelines using Azure Data Factory,
    Databricks, and Microsoft Fabric
  - Transform raw multi-source data into clean analytics-ready datasets following
    Medallion Architecture principles
  - Define and monitor data quality rules and implement automated validation frameworks
  - Administer Collibra data governance platform including business glossary and data
    lineage
  - Build and manage Lakehouses, Warehouses, and Dataflows within Microsoft Fabric
    ecosystem
  - Develop and maintain Power BI semantic models and production-grade dashboards
  - Partner with AI Engineers to prepare high-quality feature datasets for ML and
    LLM use cases
  - Contribute to shared data contracts and API schemas between data engineering and
    AI engineering layers
  use_cases:
  - Financial services data transformation and analytics
  - AI/ML model training and RAG pipeline data preparation
  - Business intelligence and reporting dashboards
  - Data governance and quality management
  - LLM data preparation including embeddings and chunking
  - Self-service analytics for business stakeholders
