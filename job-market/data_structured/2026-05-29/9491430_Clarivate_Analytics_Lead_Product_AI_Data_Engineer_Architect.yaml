  stage: Public
  focus: Analytics and data insights for innovation
position:
  title: Lead Product AI Data Engineer & Architect
  ai_type:
    type: ai-support
    reasoning: |-
      This is a data engineering and architecture role focused on
      building data pipelines, data warehouses, and dimensional
      models that support AI/ML workloads. The role involves
      preparing datasets for data scientists and ensuring data
      quality for AI initiatives, but does not involve building,
      training, fine-tuning, or deploying AI/ML models directly.
      The work is primarily data infrastructure and platform
      engineering that enables AI systems rather than working on
      AI systems themselves.
  responsibilities:
  - Own and evolve product-level data architecture, ensuring scalability, reliability,
    and alignment with analytics and AI/ML use cases
  - Design and implement scalable, reliable data pipelines supporting product analytics,
    user behavior tracking, and AI/ML initiatives
  - Define and maintain enterprise-aligned dimensional data models including star
    and snowflake schemas
  - Partner with Product Managers, Data Scientists, Analysts, and Engineers to translate
    requirements into well-architected data models and pipelines
  - Prepare, validate, and document datasets used for analytics, experimentation,
    and machine learning
  - Implement monitoring, testing, and alerting for data quality, pipeline health,
    and freshness
  - Mentor and support data engineers through architecture reviews, code reviews,
    and design discussions
  use_cases:
  - Product analytics and user behavior tracking
  - AI-ready data pipeline enablement for data science teams
  - Transformation of unstructured internet data into structured cross-referenced
    data
  - Multi-product data exposure through service mesh architecture
  - Experimentation and machine learning dataset preparation
  - Business intelligence and visualization dashboards
