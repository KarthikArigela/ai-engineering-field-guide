  - Document classification and data extraction from SEC filings and tax reports
  - Audit-defensible report generation with expert reasoning traceability
  - Knowledge retrieval from 34,000 expert reports and curated financial data
  - Agentic workflow automation for tax advisory tasks and regulatory compliance
