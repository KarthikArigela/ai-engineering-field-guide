  - Support the buildout and operationalization of agentic AI workflows including
    agent hosting, lifecycle management, and integration with MCP servers
  - Deploy, configure, and maintain shared AI platform services as containerized workloads
    on Azure with end-to-end ownership of networking and connectivity
  - Maintain CI/CD pipelines, branch protection policies, and release management workflows
    across data science repositories
  - Design and implement evaluation frameworks and quality standards for AI agents
    including automated benchmarking and regression testing
  use_cases:
  - Investment lifecycle automation from underwriting to portfolio management in private
    credit and structured finance
  - Integration of structured and unstructured data for investment decision-making
  - Advanced analytics and automated workflows for risk-adjusted returns
  - Agentic AI workflows for institutional investment decisions
  - Real-time and batch model inference for investment analytics
  - Data quality and traceability from raw ingestion through model consumption
