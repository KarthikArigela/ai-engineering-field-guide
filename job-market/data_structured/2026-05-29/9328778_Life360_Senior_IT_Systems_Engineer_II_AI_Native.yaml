  focus: Family safety and location sharing mobile app with 97.8M MAU
position:
  title: Senior IT Systems Engineer II (AI Native)
  ai_type:
    type: ai-support
    reasoning: |-
      This is an IT Systems Engineer role focused on internal IT
      infrastructure, identity management (Okta), SaaS governance,
      and endpoint management. While the role involves deploying
      and governing AI-powered tools and building AI-assisted
      workflows using LLMs to accelerate IT operations, it does
      not involve building, training, or deploying AI models. The
      role is AI-support because it enables AI tooling for IT
      operations rather than working directly on AI/ML systems.
  responsibilities:
  - Serve as the senior technical escalation point for the Help Desk on identity,
    SaaS, MDM, and authentication issues exceeding Tier 2
  - Act as the subject matter expert on Okta and the broader identity stack including
    user directories, SCIM provisioning, SSO integrations, and authentication policies
  - Design, configure, and maintain Life360's SaaS estate including Okta, Google Workspace,
    Slack, Zoom, MDM platforms, and AWS with focus on integration and governance
  - Evaluate, deploy, and govern AI-powered tools across the organization and build
    AI-assisted workflows including MCP integrations
  - Partner with automation and infrastructure specialists to contribute low-code
    automations and scripts in PowerShell, Python, and JavaScript
  - Define and refine IT processes and policies for identity lifecycle, access governance,
    and tool-selection criteria
  - Maintain technical documentation and SOPs for critical workflows and mentor junior
    team members
  - Participate in on-call rotations for IT systems support
  use_cases:
  - Internal IT operations automation using AI/LLM tools to accelerate troubleshooting
    and documentation
  - Identity and access management governance across SaaS platforms with Okta as the
    central identity provider
  - AI-assisted audit investigations and cross-platform operations workflows
  - Enterprise AI deployment patterns and governance for acceptable-use policies
  - Endpoint security and MDM policy management for remote-first workforce
  - SaaS platform integration and lifecycle management for internal business applications
