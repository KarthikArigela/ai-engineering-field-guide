  - Develop chaos engineering tools that inject real-world failures like latency,
    packet loss, and hardware crashes to test Raft and RDMA implementations
  - Build telemetry pipelines to track P99 latency and jitter and provide architectural
    feedback to Core Kernel teams
  - Operate with rigorous engineering standards including design docs, production-grade
    code reviews, and high-level architectural planning
  use_cases:
  - Enterprise data stack and storage infrastructure for AI model training and inference
  - GPU utilization optimization for compute-intensive workloads
  - High-performance data pipelines for AI and ML workloads
  - Massive-scale validation and reliability testing for distributed storage systems
  - Adversarial testing and chaos engineering for AI infrastructure
