      is building adversarial testing frameworks, chaos
      engineering tools, and telemetry pipelines for storage
      systems - infrastructure that SUPPORTS AI workloads rather
      than directly building/training AI models. The role is a
      backend SWE position focused on reliability engineering, not
      model development.
  responsibilities:
