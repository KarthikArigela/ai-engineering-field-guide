position:
  title: Staff Engineer – Data/AI Platform Engineering
  ai_type:
    type: ai-support
    reasoning: |-
      This is an infrastructure/platform engineering role focused
      on building and maintaining the data and ML platform
      infrastructure that enables AI work. While the role involves
      ML model deployment and inference systems, the primary
      responsibility is architecting the platform, data pipelines,
      governance, and infrastructure that SUPPORT data science
      teams and productionize their models. The engineer is not
      building, training, or fine-tuning models themselves, but
      rather creating the systems and infrastructure that enable
      others to do so at scale.
  responsibilities:
  - Define and own the architecture of enterprise data platforms spanning data lakes,
    document management systems, and AI pipelines
  - Lead the design and implementation of scalable, secure, and compliant data systems
    and infrastructure
  - Establish best practices for data governance, cataloging, lineage, and compliance
    frameworks
  - Define architecture for ML model deployment, inference, and lifecycle management
    systems
  - Design and scale batch and real-time inference systems in production
  - Partner with Data Science teams to productionize models and improve reliability
  - Ensure platform scalability, availability, and performance under production workloads
  - Lead complex technical initiatives and mentor engineers across teams
  use_cases:
  - Intelligent automation solutions for enterprise document processing and workflow
    transformation
  - Document processing and OCR/IDP systems for extracting structured information
    from unstructured documents
  - Data lake architecture for managing large-scale document storage and processing
    pipelines
  - Batch and real-time inference systems for deploying ML models in production environments
  - Data governance and compliance systems for enterprise data protection and regulatory
    adherence
  - NLP and computer vision applications for document understanding and information
    extraction
