  responsibilities:
  - Partner with cross-functional teams to deliver AI-powered products that transform
    how associates work and customers interact with Capital One
  - Design and maintain north star platform architecture including agent orchestration,
    RAG pipelines, prompt libraries, and multi-tenant policy enforcement
  - Evaluate and harden agentic frameworks (LangGraph, AutoGen, Semantic Kernel, CrewAI,
