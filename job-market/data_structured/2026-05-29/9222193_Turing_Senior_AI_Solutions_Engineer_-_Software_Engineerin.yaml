company:
  name: Turing
  stage: Series C or later
  focus: |-
    AI research accelerator providing data, talent, and training
    pipelines for frontier AI labs and enterprise AI deployments
position:
  title: Senior AI Solutions Engineer - Software Engineering
  ai_type:
    type: ai-support
    reasoning: |-
      This is a pre-sales/field engineering role focused on
      selling datasets, benchmarks, and evaluation tools to
      frontier AI labs. The role does NOT involve building,
      training, or deploying AI models - it creates datasets and
      evaluation frameworks that enable OTHER teams (AI labs) to
      train and evaluate their models. The technical work involves
      prototyping demos and writing sample code to demonstrate
      Turing's data/evaluation products, not working directly on
      model development, training, fine-tuning, or inference
      systems. This is a classic ai-support role: enabling the AI
      work of others through infrastructure
      (datasets/evals/benchmarks) rather than doing the AI work
      itself.
  responsibilities:
  - Lead technical discovery with AI researchers and research leads to understand
    training and evaluation needs
  - Translate lab requirements into scoped deliverables including custom datasets,
    benchmarks, and managed talent solutions
  - Build working prototypes and demos including eval tasks, dataset samples, and
    agentic scaffolds using real code
  - Own paid POCs from kick-off to scale-up decision with measurable success criteria
  - Interface between GTM and R&D teams to pre-digest technical asks and maintain
    predictable collaboration cadence
  - Codify discovery scripts, qualification criteria, demo artifacts, and objection-handling
    patterns for future hires
  use_cases:
  - Code generation model training using human expert datasets and evaluation benchmarks
  - Agentic software engineering systems evaluation through graded trajectories and
    reference datasets
  - Post-training data pipelines for frontier AI models focused on software engineering
    capabilities
  - SWE model assessment using benchmarks like SWE-bench, LiveCodeBench, and custom
    evaluation frameworks
  - Frontier AI lab data sourcing for advancing code understanding, reasoning, and
    multimodal capabilities
  skills:
    domains: [Benchmark construction, Evaluation design, Grader reliability]
    languages: [Python, TypeScript, Go, Rust, Java]
    ml: []
    cloud: []
    genai: [LangChain, LangGraph, OpenAI API, Anthropic API, LLM Evaluation, Prompt
        Engineering, RAG, AI Agents, Agentic Workflows, Code generation models, SWE-bench]
    data: []
    other: []
    ops: [Docker, Kubernetes, CI/CD, Git]
    web: [FastAPI, REST APIs]
    databases: [PostgreSQL, Redis, MongoDB, Snowflake]
  is_customer_facing: true
  is_management: false
