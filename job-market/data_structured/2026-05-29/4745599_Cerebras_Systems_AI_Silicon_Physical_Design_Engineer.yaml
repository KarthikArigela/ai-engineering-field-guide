position:
  title: AI Silicon Physical Design Engineer
  ai_type:
    type: ai-support
    reasoning: |-
      This role is a hardware/physical design engineering position
      focused on chip layout, timing closure, and physical
      verification using EDA tools (Design Compiler, ICC2,
      Calibre). While the company builds AI chips, the role itself
      works ON silicon physical design—not on building, training,
      fine-tuning, or deploying AI/ML models. It enables AI
      compute but is fundamentally a semiconductor/hardware
      engineering role.
  responsibilities:
  - Synthesize, place, and route high-speed chip designs as part of the physical design
    team
  - Perform block-level and full-chip physical verification including DRC and LVS
    checks
  - Drive block and subsystem timing closure to meet performance targets
  - Optimize designs for best power, performance, and area tradeoffs
  - Conduct IR/EM analysis and resolve issues across the chip
  - Collaborate with RTL design teams to optimize designs for physical implementation
  - Integrate physical design blocks into the full-chip wafer-scale architecture
  - Enhance and automate physical design flows using scripting languages
  use_cases:
  - Wafer-scale AI chip physical design and implementation
  - High-speed silicon layout for AI training and inference acceleration
  - Full-chip integration of physical design blocks for the world's largest AI processor
  - Physical verification and signoff for next-generation AI hardware
