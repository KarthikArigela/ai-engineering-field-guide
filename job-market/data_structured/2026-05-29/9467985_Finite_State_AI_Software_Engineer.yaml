position:
  title: AI Software Engineer
  ai_type:
    type: ai-support
    reasoning: |-
      This is a full-stack software engineer role that uses AI
      tools (Cursor, Devin, Copilot) as development aids to
      accelerate productivity. The engineer builds web
      applications, database logic, and security features for a
      cybersecurity platform - not AI/ML models or systems. While
      they use AI-assisted development and may build internal
      automation agents, the core work is full-stack web
      development with AI as a productivity tool.
  responsibilities:
  - Build and maintain secure, scalable web applications using Next.js, React, TypeScript,
    and Node.js with PostgreSQL on Supabase
  - Design and implement business logic close to the data using Postgres functions,
    views, triggers, Row-Level Security, and Supabase Edge Functions
  - Leverage AI-assisted development tools (Cursor, Devin, GitHub Copilot, agent frameworks)
    to scaffold features, refactor code, and automate repetitive engineering tasks
  - Embed security best practices into every layer of development including secure
    coding, data protection, and authentication/authorization
  - Collaborate with product managers and designers to translate customer pain points
    into impactful features and shape roadmaps
  - Design and optimize API contracts, edge endpoints, and event flows while considering
    performance, resiliency, and multi-region deployment
  - Model and optimize relational data in PostgreSQL for large multi-tenant workloads
    with indexing strategies and data partitioning
  - Support automated testing, CI/CD pipelines, database migrations, and vulnerability
    scanning throughout the development lifecycle
  use_cases:
  - Connected device cybersecurity and vulnerability detection
  - Software supply chain risk analysis and management
  - Firmware analysis and software bill of materials (SBOM) generation
  - Security compliance and risk scoring for IoT and embedded systems
  - Real-time security monitoring and actionable insights for product security teams
  - Multi-tenant security platform for enterprises, healthcare, utilities, and critical
    infrastructure
