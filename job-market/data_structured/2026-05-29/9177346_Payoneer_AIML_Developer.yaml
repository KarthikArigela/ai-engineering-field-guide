  - Optimize inference performance through quantization, pruning, distillation and
    ONNX/TensorRT conversion
  - Build and maintain model registries, experiment tracking (MLflow, Comet) and monitor
    model/data drift in production
  - Implement RAG solutions and explore PEFT methods (LoRA, QLoRA), mixture-of-experts
    (MoE), and agentic workflows
  - Collaborate with product teams to translate business requirements into model objectives
    and KPIs
