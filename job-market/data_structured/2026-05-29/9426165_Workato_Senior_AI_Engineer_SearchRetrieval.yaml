    languages: [Python, Go, Java, SQL]
    ml: [Embeddings, Transformers]
    cloud: [AWS, GCP, Azure]
    genai: [LangChain, LlamaIndex, Haystack, RAG, Prompt Engineering]
    data: [Kafka, Flink, Spark]
    other: []
    ops: [Docker, Kubernetes, CI/CD]
    web: [REST, GraphQL]
    databases: [OpenSearch, Elasticsearch, Solr, Vespa, FAISS, pgvector, Pinecone,
      Weaviate, Qdrant, Milvus, NoSQL]
  is_customer_facing: false
  is_management: false
