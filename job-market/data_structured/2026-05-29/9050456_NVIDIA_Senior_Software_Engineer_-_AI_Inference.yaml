  - High-throughput, low-latency LLM serving at scale on NVIDIA GPUs
  - Open-source LLM inference engine optimization (vLLM, SGLang)
  - Multi-GPU distributed inference performance and reliability
  - Production LLM deployment with improved throughput and tail latency
