  - Profile and improve hot paths across layers from Python orchestration to C++/CUDA
    kernels using data-driven optimization
  - Improve multi-GPU inference performance and reliability through parallelism strategies,
    communication patterns, and resource utilization
  - Build and maintain performance and correctness regression tests to prevent slowdowns
    across model and hardware configurations
  - Collaborate with model, platform, and SRE teams to translate production requirements
    into upstreamable solutions
