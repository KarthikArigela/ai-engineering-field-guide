  - Design distributed inference engines using tensor, pipeline, and expert parallelism
    to handle massive models on GPU clusters
  - Collaborate with cross-functional teams to integrate optimized serving and inference
    frameworks into production pipelines for edge and on-device applications
  use_cases:
  - Low-latency, high-throughput AI inference on resource-constrained and edge devices
  - On-device AI on smartphones powered by custom GPU kernels
  - Efficient serving of multi-modal models integrating text, images, and audio
  - Distributed inference of massive models across GPU clusters
  - Model compression and memory-optimized deployment for real-world production applications
