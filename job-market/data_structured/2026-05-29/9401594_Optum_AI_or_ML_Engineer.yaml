position:
  title: AI or ML Engineer
  ai_type:
    type: ai-support
    reasoning: |-
      This is primarily a data engineering role that builds
      platforms and pipelines to enable AI/ML work, rather than
      directly building or deploying models. The engineer
      integrates ML models and LLMs into data systems, provides
      infrastructure support through MLflow/Databricks, and
      handles prompt engineering for API integrations - all
      enabling AI capabilities without core model development.
  responsibilities:
  - Design, code, test, and maintain scalable Big Data applications using PySpark
    and Scala Spark on Azure Cloud
  - Build and maintain batch and real-time streaming data pipelines using Kafka and
    Spark Structured Streaming
  - Partner with AI/ML teams to integrate machine learning models into data pipelines
    for predictive analytics and automation
  - Support deployment, versioning, and monitoring of ML models using MLflow, Azure
    ML, and Databricks
  - Work with LLMs to develop intelligent data solutions including prompt engineering,
    secure API integrations, and contextual data enrichment
  - Build and maintain CI/CD automation pipelines using Jenkins, GitHub Actions, Docker,
    and Kubernetes
  - Collaborate with data science, architecture, and business teams to define technical
    solutions and ensure scalability
  - Identify optimization opportunities and perform performance tuning across cloud
    and Big Data environments
  use_cases:
  - Healthcare analytics and predictive modeling for improved health outcomes
  - Intelligent automation of data pipelines using ML and LLM capabilities
  - Real-time streaming data processing for health data analytics
  - Batch processing of large-scale healthcare datasets for insights generation
  - Conversational AI solutions for healthcare domain applications
  - Data-driven solutions connecting people with care and pharmacy benefits
