      ArangoDB, Graph databases]
    data: [Airflow, Prefect, Data pipelines, ETL, Knowledge graphs]
    cloud: [AWS, S3, AWS Glue, AWS Lambda, ECS, Athena, Redshift]
    ops: []
    languages: [Python, SQL]
    domains: []
    other: []
  is_customer_facing: false
  is_management: false
