  - Participate in 24/7 on-call rotation and lead incident triage, escalation, and
    root cause analysis
  - Design and operate monitoring, logging, tracing, and alerting systems for rapid
    detection and recovery
  - Build automation for cluster operations, training workflows, remediation, and
    scaling tasks
  - Harden CI/CD and release processes to improve deployment safety and velocity
  - Partner with ML, platform, and software teams to establish production readiness
    standards
  use_cases:
  - Reliable infrastructure for end-to-end AI model development from raw data to on-road
    experimentation
  - Large-scale GPU compute fleet management for model training workloads
  - Scalable and resilient inference infrastructure for AI model deployment
  - Automated driving system development powered by embodied AI foundation models
