position:
  title: AI Automation Engineer
  ai_type:
    type: ai-support
    reasoning: |-
      This role focuses on building infrastructure and automation
      frameworks that enable AI to write, test, and ship code,
      rather than directly building, training, or fine-tuning AI
      models. The engineer creates the systems and pipelines that
      support AI-driven workflows (CI/CD, deployment validation,
      observability) but does not work directly on models or
      agents themselves. This is ai-support because the role
      enables AI work for others through infrastructure and
      tooling, not hands-on model work.
  responsibilities:
  - Architect and develop advanced CI/CD workflows that support autonomous AI-driven
    development loops
  - Own end-to-end pipeline reliability, including deployment validation, observability,
    and feedback systems for AI-driven code iteration
  - Collaborate cross-functionally with engineering, product, and operations teams
    to identify opportunities for AI-driven automation and tooling
  - Develop internal skills and tooling frameworks to enhance productivity across
    engineering and other teams within the organization
  - Continuously improve system performance, accuracy, and safety of AI-assisted workflows
    in production environments
  - Run internal demos, document learnings, and lower the barrier for teammates to
    use AI in day-to-day work
  use_cases:
  - AI-driven code generation and autonomous software development
  - Automated testing and deployment pipelines with AI validation
  - Internal productivity tools and automation frameworks for engineering teams
  - AI-assisted workflow observability and feedback systems
  - Cross-functional automation opportunities for product and operations teams
