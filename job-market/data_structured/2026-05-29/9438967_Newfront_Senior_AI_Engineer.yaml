position:
  title: Senior AI Engineer
  ai_type:
    type: ai-first
    reasoning: |-
      The role shapes model behavior directly: it designs the
      agent runtime (tool use, planning, multi-agent
      orchestration), RAG/document-understanding pipelines, model
      routing between frontier and self-hosted models, and LLM
      evaluation/guardrail harnesses. It also quantizes and fine-
      tunes open-weight LLMs, which for LLM targets is ai-first.
  responsibilities:
  - Build and scale the agent runtime — tool use, planning, memory, multi-agent orchestration,
    human-in-the-loop handoff, and the SDKs product teams use to compose agents for
    brokering, underwriting, and client service workflows
  - Design and own RAG and document understanding pipelines for insurance artifacts
    such as submissions, policies, endorsements, loss runs, and SOVs, including ingestion,
    chunking, indexing, retrieval, structured extraction, and grounding
  - Build the connector framework letting AI agents reach broker systems (AMS, carrier
    portals, email, document stores) with first-class auth, rate-limiting, schema
    discovery, and auditability
  - Establish the evaluation and observability backbone for AI, including offline
    eval harnesses, regression suites, hallucination and grounding checks, and quality,
    latency, and cost telemetry
  - Own model routing and the model gateway, selecting between hosted frontier models
    and on-premise/self-hosted models per use case to balance quality, latency, cost,
    and data residency
  - Stand up and operate on-premise model hosting including GPU capacity planning,
    inference serving, quantization and optimization, isolation, and lifecycle management
  - Ship AI product features end-to-end on top of the platform, from problem discovery
    with business partners through design, implementation, and user-facing surfaces
  - Mentor engineers on production AI systems and partner with security, privacy,
    and compliance to bake controls such as auth, audit, PII handling, and model risk
    management into the platform
  use_cases:
  - Insurance brokerage workflow automation
  - Underwriting support workflows
  - Client service workflows
  - Document understanding of insurance artifacts (submissions, policies, endorsements,
    loss runs, SOVs)
  - Structured data extraction from unstructured insurance documents
  - Regulated-industry AI with compliance, audit, and data-residency constraints
