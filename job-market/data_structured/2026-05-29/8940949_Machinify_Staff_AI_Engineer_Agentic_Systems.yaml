company:
  name: Machinify
  stage: Growth (deployed by 85+ health plans, 270M+ lives, but described as "fast
    growing startup")
  focus: |-
    AI-powered healthcare intelligence platform for health plan
    claims payment optimization
position:
  title: Staff AI Engineer | Agentic Systems
  ai_type:
    type: ai-first
    reasoning: |-
      This role is directly building production-grade agentic AI
      systems that audit medical claims — designing agent loops,
      choosing agent topologies, engineering context (system
      prompts, structured outputs, citation grounding), and
      working hands-on with agent SDKs. The engineer owns the full
      lifecycle from problem framing through model deployment and
      evaluation, making this clearly an ai-first role.
  responsibilities:
  - Drive vague business problems to closure by working with clinical leads, product,
    and ops to translate healthcare audit challenges into concrete technical problem
    statements with measurable targets
  - Define evaluation metrics and build eval harnesses before building systems — deciding
    what to optimize (recall, appeal-survival rate, cost per case) and what constitutes
    shipping
  - Set technical direction for problem areas including agent topology, context strategy,
    model mix, evaluation regime, and deterministic guardrails
  - Build production-grade agentic systems that audit medical claims end-to-end by
    reading medical records, reasoning over coding and clinical guidelines, and producing
    defensible findings
  - Lead by example on agent engineering best practices including context engineering,
    structured outputs, citation grounding, eval discipline, and cost/latency control
  - Scope and sequence ambiguous initiatives into phased plans with decision points,
    kill criteria, and dependencies, communicating crisply to non-technical stakeholders
  - Present results to clinical, product, and executive stakeholders and defend methodology
    when findings are challenged
  - Use AI tooling (Claude Code, Codex) as a force multiplier to plan, scaffold, refactor,
    debug, and evaluate, and teach the team to do the same
  use_cases:
  - End-to-end medical claims auditing using agentic AI systems that read raw medical
    records and reason over coding and clinical guidelines
  - DRG audit finding generation that holds up to clinical and regulatory appeal review
  - Long-context document understanding on noisy medical records to achieve human-expert
    accuracy
  - Citation-grounded claim analysis where the AI must point to evidence supporting
    its findings
  - Cost and latency optimization of LLM-based agents for broad rollout across 85+
    health plans
  skills:
    domains: [Healthcare claims processing and medical coding]
    languages: [Python, SQL, Async Python programming]
    ml: [OCR and document understanding, Vision-language models]
    cloud: []
    genai: [LangGraph, OpenAI Agents SDK, Anthropic SDK / claude-agent-sdk, 'Agent
        engineering (multi-agent topologies, agent loops)', 'Context engineering (system
        prompts, structured outputs, citation grounding)', Claude Code, Codex, Prompt
        Engineering, 'Reasoning models (o-series, Claude extended thinking)', RAG
        / retrieval]
    data: []
    other: [Evaluation harness design and metric definition]
    ops: [LLM caching and cost control at scale, LLM observability, Git, VS Code]
    web: []
    databases: []
  is_customer_facing: false
  is_management: false
