company:
  name: Salesforce
  stage: Public
  focus: AI-powered CRM platform for enterprise and government
position:
  title: Solution Engineer - AI & Data Integration - US Federal
  ai_type:
    type: ai-support
    reasoning: |-
      This is a pre-sales Solution Engineer role focused on
      technical strategy, demonstrations, and architecture design
      for Salesforce products (MuleSoft, Tableau, Data 360,
      Agentforce). While the role requires knowledge of agentic AI
      concepts (RAG, agents, LLM integration) and involves
      designing "AI-ready architectures," the primary
      responsibility is selling and architecting solutions using
      Salesforce's AI products rather than building, training, or
      deploying models directly. The role bridges technical
      expertise with sales strategy, making it ai-support rather
      than ai-first.
  responsibilities:
  - Lead technical strategy and architecture sessions for US Federal government customers
    to secure technical wins in sales cycles
  - Design comprehensive data-to-AI architectures that integrate MuleSoft, Tableau,
    Data 360, and agentic AI capabilities
  - Conduct discovery workshops to define customer-specific data integration and AI
    adoption journeys
  - Deliver product demonstrations and technical workshops showcasing unified data
    management and agentic AI solutions
  - Architect secure, compliant solutions for government environments including FedRAMP
    High and Impact Level 4/5/6
  - Collaborate with Account Executives and partners to formulate technical account
    strategies and position AI/data solutions
  - Mentor account teams and partners on positioning Data + Integration + Agentic
    AI for mission transformation
  - Design solutions that unify citizen/operational data, modernize legacy systems,
    and deploy agentic AI capabilities
  use_cases:
  - Government data unification across disparate silos and legacy systems for improved
    citizen services and public safety
  - Real-time data integration and analytics for defense decision-making and operational
    excellence
  - Agentic AI deployment for autonomous agents in regulated government environments
  - Legacy system modernization with API-led connectivity using MuleSoft integration
  - Unified data management (Data 360) as foundation for trustworthy, grounded AI
    workflows
  - Enterprise analytics and visualization with Tableau for actionable government
    insights
