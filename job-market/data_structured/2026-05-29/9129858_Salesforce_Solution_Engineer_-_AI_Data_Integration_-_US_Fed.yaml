        Management (MDM)]
    cloud: [AWS, Azure, GCP, Cloud Infrastructure]
    ops: [FedRAMP, System Architecture, Enterprise Architecture]
    languages: [Python, SQL]
    domains: [Public Sector]
    other: [Government Compliance]
  is_customer_facing: true
  is_management: false
