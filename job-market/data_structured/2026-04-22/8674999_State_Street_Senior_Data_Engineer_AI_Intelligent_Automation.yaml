    lineage, critical data elements, and lifecycle management
  - Define and enforce data standards, controls, and documentation aligned with governance
    and platform requirements
  - Enable AI and intelligent automation by ensuring high-quality, well-governed inputs
    for training, inference, and decisioning
  - Define agent action constraints, data quality gates, and human-in-the-loop triggers,
    ensuring auditability through decision logs, lineage, and versioning of rules,
    prompts, and models
  - Monitor data quality dashboards, triage issues, coordinate remediation, and partner
    with Product Owners and business teams to prioritize simplification and automation
    use cases
  use_cases:
  - AI-driven intelligent automation of Global Delivery operational processes
  - Agent-based systems executing automated actions with data quality gates and human-in-the-loop
    controls
  - Operational analytics and reporting across the asset servicing lifecycle
  - Data governance and quality controls enabling AI decisioning in regulated financial
    operations
  - Business simplification initiatives in fund accounting, middle office, custody,
