    reasoning: |-
      The core work is data engineering and data stewardship:
      building and operating production data pipelines, and owning
      data quality, lineage, metadata, and controls. The AI-
      related duties — supplying high-quality governed inputs for
      training/inference and defining control gates and
      auditability for agent-driven workflows — are enablement and
      governance of AI systems designed by others, with no prompt
      authoring, retrieval design, agent flow design, training, or
      model evaluation. Feeding and governing data for someone
      else's AI systems is ai-support.
  responsibilities:
  - Design, build, and operate scalable, resilient data pipelines supporting operational
    analytics, reporting, and AI-driven automation across cloud and on-prem environments
  - Model, store, and serve large-scale datasets optimized for analytical workloads
    and low-latency consumption by AI and agent-based systems
  - Integrate data from multiple internal and external sources, including vendor feeds,
