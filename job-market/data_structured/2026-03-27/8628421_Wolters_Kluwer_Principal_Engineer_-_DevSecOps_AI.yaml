position:
  title: Principal Engineer - DevSecOps & AI
  ai_type:
    type: ai-support
    reasoning: |-
      The role builds and secures CI/CD pipelines and platform
      infrastructure that can deploy AI/ML and Agentic AI
      workloads, but never shapes model behaviour: no prompts,
      retrieval design, evals, or training. AI appears only as
      pipeline targets and a nice-to-have. The deliverable is
      delivery capacity and supply-chain security, so the role is
      ai-support.
  responsibilities:
  - Design and build highly automated, scalable CI/CD pipelines for microservices,
    APIs, infrastructure-as-code, and AI/ML and Agentic AI workloads
  - Establish reusable, self-service, secure-by-default pipeline blueprints and cloud-agnostic
    delivery patterns
  - Embed security controls directly into pipelines, including SAST, DAST, SCA, container
    and IaC scanning, and SBOM generation
  - Design and enforce secure software supply chain practices covering provenance,
    artifact signing, dependency governance, and secrets management
  - Engineer platform automation using Kubernetes, infrastructure-as-code, and GitOps
    patterns for provisioning dev, test, staging, and production environments
  - Enable progressive delivery with blue-green and canary deployments, feature flags,
    and controlled rollouts
  - Integrate observability (metrics, logs, traces) into delivery pipelines and support
    SRE-aligned practices such as error budgets and rollback signals
  - Act as principal-level technical authority across engineering teams, setting standards,
    reviewing high-impact designs, and mentoring senior engineers
  use_cases:
  - Automated, secure-by-default software delivery platform for product engineering
    teams
  - CI/CD pipelines for microservices, APIs, platform services, and AI/ML workloads
  - Secure software supply chain with SBOM, artifact signing, and dependency governance
  - Self-service environment provisioning for multi-tenant and regulated workloads
  - Progressive delivery with blue-green and canary deployments and feature flags
  - Observability and reliability monitoring for deployments and production health
