position:
  title: Senior AI Platform Engineer
  ai_type:
    type: ai-support
    reasoning: |-
      This is a platform engineering role: the person builds the
      backend services, registries, workflow orchestration
      primitives, observability, and CI/CD foundations that AI and
      application engineers build on, and explicitly partners with
      separate AI engineers to define interfaces. Nothing in the
      responsibilities involves shaping model behaviour themselves
      - no prompt writing, retrieval/RAG design, agent flow
      design, training, or output-quality evaluation - and
      operating LLM-enabled systems and monitoring their quality
      signals is serving/monitoring plumbing, which the rules
      classify as ai-support.
  responsibilities:
  - Build and operate core backend services that power AI-enabled workflows, including
    APIs, orchestration, storage, and internal integrations
  - Design scalable data models and registries for versioned artifacts and metadata
    with strong traceability and auditability
  - Implement secure-by-default service patterns including authN/authZ, audit logs,
    secrets handling, and least-privilege access
  - Build reliability foundations spanning observability, metrics, tracing, alerting,
    SLOs, and incident response playbooks
  - Implement idempotent APIs and state-handling patterns for resilient workflows,
    including retries, partial failure, and reconciliation
  - Create integration adapters and event-driven plumbing to safely connect AI-driven
    workflows to internal systems
  - Establish release and deployment practices including CI/CD pipelines, environment
    promotion, rollback strategies, and safe migrations
  - Partner closely with AI and application engineers to define interfaces, validation
    layers, and operational constraints
  use_cases:
  - Autonomous aerial vehicle systems for U.S. ally defense ('democratized deterrence')
  - AI-enabled mission software supporting operators in real-world field conditions
  - Multi-step AI-driven pipelines orchestrated on internal platform services
  - LLM-enabled workflows running under strict governance, auditability, safety, latency,
    and cost constraints
