position:
  title: AI Applications Engineer
  ai_type:
    type: ai-first
    reasoning: |-
      This role involves directly building, extending, and
      operationalizing agentic AI solutions — designing AI agents,
      authoring Skills/Code Tools in Python, and applying prompt
      engineering and agent instruction design. The engineer works
      hands-on with LLM-based agents (Agent Q) to create
      production-grade agentic workflows for industrial customers.
      While customer-facing, the core work is building and
      deploying AI agents, making this an ai-first role (similar
      to a Forward Deployed Engineer pattern).
  responsibilities:
  - Design and build scalable agentic AI solutions that extend and orchestrate Agent
    Q for multi-step industrial workflows
  - Develop custom AI agents in Python that interface with the broader industrial
    technology stack and Seeq's AI platform
  - Design and implement Skills and Code Tools in Python that provide agents governed
    access to enterprise systems like CMMS, historians, and document stores
  - Write production-quality Python for agent Skills, scheduled/event-triggered workflows,
    and Data Lab notebooks with modern software engineering practices
  - Author and consume REST/HTTPS APIs for third-party AI agents and enterprise systems
    with proper authentication patterns
  - Apply prompt engineering, agent instruction design, and evaluation techniques
    to ensure consistent and trustworthy agent behavior at scale
  - Partner cross-functionally with Software, Product, Industry Principals, and Revenue
    teams to align solutions to roadmap and close capability gaps
  - Create enablement kits and mentor partners and customers to scale agentic AI delivery
    globally
  - Gather field feedback, monitor agent adoption and quality, and iterate on solution
    reliability and trustworthiness
  use_cases:
  - Anomaly-to-action workflows integrating industrial software systems (historians,
    CMMS, APM)
  - AI-generated operational reporting for process manufacturing industries
  - Batch deviation analysis and root cause investigations powered by agentic AI
  - Condition-monitor-driven investigations using AI agents
  - Customer internal documentation and SME knowledge operationalization through agent
    workflows
  - Microsoft Copilot and enterprise ecosystem integrations for industrial decision
    intelligence
