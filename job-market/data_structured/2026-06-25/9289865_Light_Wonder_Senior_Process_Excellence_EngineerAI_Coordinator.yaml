position:
  title: Senior Process Excellence Engineer/AI Coordinator
  ai_type:
    type: ai-support
    reasoning: |-
      This is primarily a Lean/Six Sigma process excellence role
      with AI coordination as a secondary responsibility. The AI
      aspect involves identifying opportunities to integrate AI
      tools and prototyping intelligent automation solutions
      within improvement projects, rather than building, training,
      or fine-tuning models. The role coordinates and manages AI-
      enabled initiatives but is not hands-on with model
      development or deployment.
  responsibilities:
  - Lead end-to-end Lean transformation initiatives across all value stream functions
    including Operations, Finance, HR, Accounting, and Procurement
  - Design, facilitate, and execute workshops to identify and prioritize improvement
    opportunities across current and future state value stream maps
  - Drive Kaizen events, rapid improvement workshops, and structured problem-solving
    activities (A3, DMAIC, 8D)
  - Serve as AI Coordinator identifying opportunities to integrate AI tools, ML models,
    and agentic workflows into process improvement projects
  - Prototype, pilot, and scale intelligent automation solutions that complement Lean
    improvements
  - Manage a portfolio of concurrent process improvement and AI-enabled projects using
    PMI, Agile, and hybrid frameworks
  - Partner with IT, Data, and Digital teams to ensure AI tool integration aligns
    with enterprise architecture, data governance, and compliance standards
  - Develop training materials, playbooks, and standard work documentation to institutionalize
    process excellence capabilities
  use_cases:
  - Enterprise Lean transformation and waste elimination across operational and administrative
    functions
  - Intelligent automation of business processes using agentic AI workflows
  - AI-augmented daily management and real-time KPI dashboards
  - Cross-functional process optimization in Finance, HR, Accounting, and Procurement
  - Portfolio management of AI-enabled continuous improvement initiatives
