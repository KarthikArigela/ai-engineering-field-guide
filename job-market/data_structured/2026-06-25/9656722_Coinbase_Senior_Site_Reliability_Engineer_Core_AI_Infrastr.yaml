position:
  title: Senior Site Reliability Engineer, Core AI Infrastructure
  ai_type:
    type: ai-support
    reasoning: |-
      This is an SRE role focused on maintaining the reliability,
      monitoring, and automation of infrastructure that supports
      AI products at Coinbase. The role does not involve building,
      training, fine-tuning, or deploying AI/ML models directly.
      Instead, it involves building and scaling the underlying
      infrastructure (AWS, Kubernetes, CI/CD) that enables AI
      products to run reliably.
  responsibilities:
  - Own the reliability, monitoring, and incident response lifecycle for AI infrastructure
    services including on-call support, root cause analysis, and blameless retros
  - Build automation and tooling to streamline operational IT workflows, eliminate
    manual tasks, and improve deployment velocity across CI/CD frameworks and Kubernetes
    environments
  - Partner with the Infrastructure team to extend CI/CD frameworks supporting IT
    services and enterprise network platforms
  - Collaborate with Security and Compliance teams to integrate surveillance tooling
    into deployment pipelines
  - Strengthen observability and documentation standards by defining metrics, implementing
    monitoring solutions, and maintaining technical documentation
  - Develop full-stack applications that power internal AI products and infrastructure
    using Go or Python
  use_cases:
  - Reliable cloud infrastructure powering AI products at scale
  - Automated deployment pipelines for AI infrastructure services
  - Observability and incident response for AI infrastructure
  - CI/CD automation for IT and enterprise network platforms
  - Security and compliance integration into AI deployment workflows
