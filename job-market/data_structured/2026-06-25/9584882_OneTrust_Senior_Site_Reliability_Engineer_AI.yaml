  - Build and operate AI-assisted incident response systems including root cause analysis,
    log summarization, and anomaly triage
  - Develop and integrate LLM-based tools to reduce MTTR and improve alert quality
  use_cases:
  - AI-assisted incident response for root cause analysis, log summarization, and
    anomaly triage
  - LLM-based operational tools to reduce mean time to resolution (MTTR) and improve
    alert quality
  - Machine learning for anomaly detection, capacity prediction, and failure pattern
    analysis
  - RAG-based operational intelligence using vector databases and embeddings
  - Automated production service reliability monitoring and remediation
