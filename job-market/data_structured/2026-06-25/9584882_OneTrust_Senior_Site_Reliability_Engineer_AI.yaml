position:
  title: Senior Site Reliability Engineer (AI)
  ai_type:
    type: ai-support
    reasoning: |-
      This is primarily a Site Reliability Engineer role focused
      on production service reliability, SLI/SLO management, and
      incident response. While the job description includes AI-
      related responsibilities (LLM-based tools for MTTR
      reduction, AI-assisted incident response, anomaly
      detection), the AI work is in service of operational
      reliability rather than building core AI/ML products. The
      role supports AI-enhanced operations but is fundamentally an
      SRE position.
  responsibilities:
