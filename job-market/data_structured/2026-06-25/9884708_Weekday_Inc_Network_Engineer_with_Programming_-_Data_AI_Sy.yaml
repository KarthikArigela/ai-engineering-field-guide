position:
  title: Network Engineer (with Programming) - Data & AI Systems
  ai_type:
    type: ai-support
    reasoning: |-
      This role is primarily a Level 3 network support engineer
      position with scripting duties. The AI/ML connection is
      limited to preparing, labeling, and cleaning network data so
      that ML systems can consume it — the engineer is not
      building, training, or deploying models themselves. This is
      classic enabling/support work for an ML team's data needs.
  responsibilities:
  - Maintain enterprise network infrastructure as a Tier 3 escalation engineer handling
    outages, RCAs, and final escalations
  - Review and interpret real-world network data including logs, configurations, telemetry,
    and event streams
  - Label, classify, and analyze network behaviors, issues, and anomalies for ML consumption
  - Write scripts and tools to process, clean, and transform network data
  - Define schemas and data structures for large-scale data pipelines
  - Automate operational workflows such as log redaction, compliance checks, monitoring,
    and config audits
  - Collaborate with the client team to improve data quality and usability for ML
    systems
  use_cases:
  - Autonomous networking systems that use infrastructure data to operate real-world
    networks
  - Anomaly detection and classification of network behaviors from telemetry and event
    streams
  - Data pipelines that transform raw network data into ML-ready inputs
  - Predictive infrastructure management powered by network logs and configurations
