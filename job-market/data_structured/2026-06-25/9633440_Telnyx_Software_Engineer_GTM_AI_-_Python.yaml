  - Instrument and monitor production AI systems — build observability into agent
    behavior, track success rates, detect regressions, and debug non-deterministic
    failures
  - Design and run experiments (A/B tests, prompt variations, model comparisons) with
    proper evaluation infrastructure
  use_cases:
  - AI-powered lead qualification and routing
  - Automated email generation and outbound campaign orchestration
  - Contact enrichment using AI agents that call external APIs
