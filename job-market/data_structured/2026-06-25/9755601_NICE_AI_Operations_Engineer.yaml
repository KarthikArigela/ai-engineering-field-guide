position:
  title: AI Operations Engineer
  ai_type:
    type: ai-support
    reasoning: |-
      This role is about operating, administering, and supporting
      an existing AI platform in production — not building,
      training, or fine-tuning models. The engineer monitors
      health, manages incidents, enables business users to self-
      service deploy AI deliverables, and reports KPIs. All hands-
      on model/agent development is done by separate Development
      and DevOps teams, making this clearly an enabling/support
      role.
  responsibilities:
  - Administer and operate the live AI platform components including AI agents, Models
    Gateway, RAG services, connectors, and self-service tooling
  - 'Manage day-to-day operational tasks: user and access administration, configuration
    changes, license and quota management, and routine maintenance'
  - Monitor platform health, availability, and performance using observability tools
    and act as first and second-line support for AI platform issues
  - 'Define, measure, and report KPIs showing platform value: adoption, usage, cost
    consumption, latency, and reliability; build operational and executive dashboards'
  - Help business users publish and deploy their own self-service AI deliverables
    (agents, assistants, automations, dashboards) safely and within governance
  - Operate the platform in line with security and governance policies including access
    reviews, usage policies, data-handling rules, and audit logging
  - 'Own the incident and ticket lifecycle in ServiceNow: logging, prioritization,
    communication, resolution, and follow-up'
  - Collaborate with Development, DevOps, and Security teams as the operational voice
    of the platform, feeding real-world usage insights into the roadmap
  use_cases:
  - Enterprise AI platform administration and operations for internal intelligent
    automation
  - Self-service AI deliverable deployment (agents, assistants, automations, dashboards)
    for business users
  - RAG service operations and monitoring within a corporate AI gateway
  - AI governance, compliance, and security monitoring across an enterprise platform
  - KPI measurement and reporting on AI platform adoption, cost, and performance
  - Incident management and support for production AI services
