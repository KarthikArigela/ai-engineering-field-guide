position:
  title: AI Enablement Engineer
  ai_type:
    type: ai-support
    reasoning: |-
      This role is about enabling engineering teams to adopt AI
      tools (copilots, assistants) in their software development
      workflows — it does not involve building, training, fine-
      tuning, or deploying AI/ML models. The engineer evaluates
      and rolls out AI tooling, creates playbooks, and supports
      adoption governance, which is clearly an AI-support function
      working NEAR AI but not ON AI.
  responsibilities:
  - Support effective and responsible use of AI across software engineering teams
  - Guide engineers on applying AI within real delivery workflows including coding,
    testing, review, debugging, and documentation
  - Help teams embed AI into the SDLC to improve productivity, quality, and developer
    experience
  - Create practical guidance, examples, and playbooks for confident AI adoption
  - Evaluate AI-assisted development tools such as copilots and workflow-integrated
    assistants
  - Support rollout of new AI tools, techniques, or approaches into the engineering
    community
  - Define and track success measures including adoption signals, developer experience
    indicators, and quality outcomes
  - Partner with Security, Model Risk, and governance stakeholders to ensure compliant
    AI usage
  use_cases:
  - AI-assisted coding, testing, code review, debugging, and documentation within
    engineering workflows
  - Developer experience improvement through AI tool adoption in a regulated banking
    environment
  - AI tool evaluation and rollout for software engineering teams
  - Governance-aligned AI enablement balancing productivity with regulatory compliance
