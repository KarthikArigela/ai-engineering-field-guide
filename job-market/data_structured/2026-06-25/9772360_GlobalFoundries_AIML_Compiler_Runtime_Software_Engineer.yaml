    ml: [LLVM, MLIR, Custom MLIR dialects and passes, Code generation, Quantization,
      NPU acceleration, PyTorch, ONNX, TensorFlow Lite/TFLite, torch-mlir, TOSA, Linalg,
      Operator fusion, Tiling, Memory planning, Vectorization, TVM, XNNPACK]
