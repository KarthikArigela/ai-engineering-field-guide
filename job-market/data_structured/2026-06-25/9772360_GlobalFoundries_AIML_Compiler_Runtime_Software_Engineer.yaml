    ops: [IREE, Linux, Cross-compilation, ONNX Runtime, Jenkins, Git, CMake, Bazel,
      Docker, Kubernetes]
    languages: [C/C++, Python]
    domains: [Edge AI deployment, Computer Vision, Robotics, Automotive AI]
    other: [RISC-V, ARM, FPGA prototyping, Hardware-software co-design, DMA]
  is_customer_facing: true
  is_management: true
