    and feedback loops
  - Align with tech leadership across the group to ensure the agentic stack meets
    security, reliability, and scalability standards
  - Manage stakeholder relationships across regional brands to create a unified yet
    flexible developer toolset
  use_cases:
  - Agentic AI-powered IDEs and CLIs for accelerating software development at scale
  - AI-guided feature generation for a global engineering organization
  - Developer productivity enhancement through agentic coding workflows
  - Internal data source integration into agentic ecosystems for contextual AI assistance
  - Achieving 100% daily AI usage among engineers by 2026
