position:
  title: Senior AI Engineer - AI Transformation
  ai_type:
    type: ai-first
    reasoning: |-
      This role is squarely ai-first: the engineer builds and
      ships production AI agent systems end-to-end — including
      context/retrieval strategy, tool integrations (MCPs),
      evaluation frameworks, and model selection/routing. The job
      explicitly excludes pure ML researchers and engineers who
      only wrap LLM APIs, requiring depth in agent engineering
      disciplines.
  responsibilities:
  - Own and deliver complete agent systems end-to-end, from architecture through implementation,
    evaluation, and production operation
  - Design context and retrieval strategies including retrieval pipelines, conversation
    memory, summarisation, and chunking logic
  - Build evaluation frameworks with automated eval pipelines and human-in-the-loop
    review for accuracy, safety, helpfulness, and latency
  - Design and build tool integration layers including MCPs, APIs, data contracts,
    and error handling for reliable agent tool use
  - Influence technical direction through architectural decisions, evidence-based
    proposals, and constructive pushback
  - Raise engineering standards through rigorous code review and pairing with less
    experienced engineers
  - Use Claude Code as the primary development workflow and mentor others in AI-assisted
    development
  - Work across the full stack including LLM integration, backend services, data pipelines,
    and frontend to ship end to end
  use_cases:
  - AI agent systems that transform internal business functions across the company
  - Context-aware retrieval and conversational memory for production AI assistants
  - Automated evaluation of AI system quality including accuracy, safety, and domain-specific
    criteria
  - Tool-augmented agents that interact with external systems via MCP and API integrations
  - AI-powered education and workforce development workflows in an EdTech context
