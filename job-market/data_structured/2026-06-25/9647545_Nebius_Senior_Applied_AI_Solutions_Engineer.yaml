position:
  title: Senior Applied AI Solutions Engineer
  ai_type:
    type: ai-first
    reasoning: |-
      This role requires hands-on work with models — fine-tuning,
      distributed training, building RAG/agentic pipelines, and
      inference optimization on GPU infrastructure. The engineer
      prototypes applied AI use cases and works directly with ML
      systems across the full stack, making this clearly ai-first
      despite the customer-facing nature of the role.
  responsibilities:
  - Build prototypes and demos across the product portfolio including serverless inference,
    databases, MLflow, MLOps, and vertical use cases in Physical AI and HCLS
  - Support new customers hands-on through POC design, technical onboarding, and validation
    as the bridge between their ML team and the platform
  - Research and implement emerging applied AI techniques including new training methods,
    inference optimizations, and agentic architectures, turning findings into working
    prototypes and product recommendations
  - Feed the product roadmap with grounded field feedback from customer POCs and identify
    specific product improvements needed
  - Develop reusable technical assets such as notebooks, reference architectures,
    and benchmark results that reduce onboarding friction at scale
  use_cases:
  - Serverless AI inference and model serving
  - MLOps and MLflow-based model lifecycle management
  - Physical AI and robotics simulation workloads
  - Healthcare and life sciences AI applications including drug discovery and medical
    imaging
  - Enterprise RAG and agentic AI pipeline deployment
  - Large-scale distributed model training on GPU infrastructure
