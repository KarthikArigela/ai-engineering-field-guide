position:
  title: Principal Engineer, AI Infrastructure & Platform
  ai_type:
    type: ai-first
    reasoning: |-
      This role involves building the core AI orchestration
      platform that powers multi-agent orchestration, stateful AI
      workflows, and durable execution for enterprise AI
      operations. The engineer owns foundational architecture for
      how stateful AI systems are designed and operated, directly
      shaping the intelligence layer itself. While infrastructure-
      focused, the work is fundamentally on building the substrate
      for AI-powered operations (agents, human-in-the-loop,
      streaming) — not merely supporting others' AI work.
  responsibilities:
  - Define the technical roadmap and architectural direction for kAIgentic's durable
