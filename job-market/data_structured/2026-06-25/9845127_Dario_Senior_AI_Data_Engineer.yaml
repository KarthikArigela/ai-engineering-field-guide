company:
  name: Dario
  stage: Public
  focus: Digital health and wellness platform
position:
  title: Senior AI Data Engineer
  ai_type:
    type: ai-support
    reasoning: |-
      This is primarily a data engineering role focused on
      building ETL/ELT pipelines, data warehouses, dashboards, and
      analytics products. While the title includes "AI" and the
      candidate will use AI-assisted development workflows and
      some GenAI tooling (prompt pipelines, vector integrations),
      the core work is data infrastructure and analytics that
      supports the broader organization — not building, training,
      fine-tuning, or deploying AI/ML models.
  responsibilities:
  - Own the full lifecycle of data solutions including ingestion, transformation,
    modeling, visualization, automation, monitoring, and stakeholder delivery
  - Design, develop, and maintain scalable ETL/ELT pipelines, data warehouses, semantic
    layers, and near real-time data flows
  - Build and maintain dashboards, operational reporting, KPI tracking, and business-facing
    analytical products
  - Leverage AI-assisted development workflows and design AI-enabled workflows including
    prompt pipelines, automated enrichment, and vector integrations
  - Develop and optimize data infrastructure for performance, cost efficiency, scalability,
    and reliability with batch and near real-time processing
  - Partner with business stakeholders across rotating domains (Clinical, Finance,
    Product Analytics, Enrollment, AI Infrastructure) to translate requirements into
    scalable technical solutions
  - Design and execute validation, testing, and quality compliance processes across
    pipelines, transformations, and dashboards
  - Contribute to architecture decisions, engineering standards, and continuous improvement
    initiatives
  use_cases:
  - Health data pipeline and warehouse management for a digital health platform
  - Clinical and healthcare analytics including KPI tracking and operational reporting
  - AI-assisted data engineering workflows using GenAI tooling for automation and
    enrichment
  - Business intelligence and stakeholder-facing dashboards across multiple organizational
    domains
  - Near real-time data processing for operational monitoring and alerting
  - Data quality validation and governance for compliance with healthcare regulations
