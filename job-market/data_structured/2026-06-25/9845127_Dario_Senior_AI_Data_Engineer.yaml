      Fivetran]
    other: [Tableau, Power BI, Agile]
    ops: [Git, CI/CD, QA automation]
    web: [Streamlit]
    databases: [Snowflake, Data warehousing, Vector Databases]
  is_customer_facing: true
  is_management: false
