    with contact center data
  - Implement scalable frontend architectures including Microfrontend patterns for
    modular multi-team codebases
  - Collaborate with backend and AI platform teams on integration patterns for real-time
    data and AI-driven features
  - Build and maintain CI/CD pipelines, automated test validation, and code quality
    checks
  - Lead and mentor engineers within the team and contribute to frontend engineering
    standards
  use_cases:
  - Real-time agent assist overlays and copilots for contact center agents
  - Live streaming transcripts and supervisor monitoring dashboards
  - Data ingestion and mapping workflows for 3rd-party contact center platform integration
  - Post-call QA and speech analytics interfaces
  - Enterprise multi-tenant SaaS frontend for contact center operations
