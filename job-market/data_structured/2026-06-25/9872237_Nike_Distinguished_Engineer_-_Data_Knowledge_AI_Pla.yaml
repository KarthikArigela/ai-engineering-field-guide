  - Build platform components enabling semantic layers, ontologies, taxonomies, and
    knowledge graphs
  - Establish standards and reference patterns for platform design, governance, observability,
    automation, and high-quality data operations
  - Partner with product, platform, infrastructure, and security leaders to align
    roadmaps and enable self-service experiences at scale
  - Champion innovation in AI, GenAI, automation, and real-time data capabilities
    to unlock new platform and developer value
  - Influence senior stakeholders and mentor engineering leaders to raise the bar
    on technical excellence and platform outcomes
  use_cases:
  - Enterprise data and analytics platform modernization at global scale
  - Knowledge graph and semantic layer infrastructure for organizational knowledge
    management
  - Self-service data access and governance capabilities for engineering and business
    teams
  - AI and GenAI platform capabilities enabling data-driven solutions across Nike
  - Real-time data processing and streaming pipeline infrastructure
