position:
  title: Kong AI Gateway Engineer
  ai_type:
    type: ai-support
    reasoning: |-
      This role focuses on building and maintaining the Kong AI
      Gateway platform — infrastructure that routes and secures
      AI/LLM traffic across the enterprise. The engineer is not
      building, training, or deploying models themselves; rather
      they are enabling other teams to integrate AI capabilities
      through API gateway management, plugins, and platform
      tooling. This is classic AI-support: working NEAR AI but not
      ON AI.
  responsibilities:
  - Collaborate with Product and Technology teams to maximize the value delivered
    by the Kong AI Gateway platform
  - Build, enhance, and maintain Kong gateway capabilities supporting MCP and LLM
    traffic
  - Design and develop Kong plugins for authentication, rate limiting, logging, and
    request/response transformation
  - Develop internal tools and solutions that improve how teams integrate AI capabilities
    across the organization
  - Maintain platform health through upgrades, configuration management, and operational
    best practices
  - Write and maintain technical documentation and knowledge base articles to support
    platform adoption and usage
  - Contribute to reusable patterns and reference implementations that enable consistent
    onboarding across teams
  use_cases:
  - Enterprise AI gateway for routing and securing LLM traffic at scale
  - MCP (Model Context Protocol) traffic management and integration
  - Token-based rate limiting and throttling for AI API consumption
  - Centralized authentication and governance for AI/LLM API access across the enterprise
