position:
  title: AI / ML Platform Engineer Specialist
  ai_type:
    type: ai-support
    reasoning: |-
      This role is focused on building and maintaining the MLOps
      platform and infrastructure that ENABLES data science and AI
      teams to work — not on building, training, or deploying
      models directly. The engineer provides tooling, pipelines,
      and infrastructure (feature stores, model registries, CI/CD)
      for other AI/ML practitioners to use. While it involves
      AI/ML ecosystem knowledge, the core work is platform
      engineering in support of AI, making it ai-support.
  responsibilities:
  - Develop, improve, and maintain the MLOps platform to enable scalable, reproducible,
    and observable ML and generative AI workflows
  - Design and operate core ML infrastructure including feature stores, model registries,
    CI/CD pipelines, and data pipelines using AWS services
  - Enable and support AI/ML development teams with best practices, tooling, and technical
    guidance for training, fine-tuning, and deployment
  - Drive technology and architecture decisions across the ML stack including frameworks,
    data processing, orchestration, and monitoring
  - Collaborate with AI engineering teams to integrate LLMs and generative AI capabilities
    into products through standardized, secure, and auditable infrastructure
  - Ensure platform scalability, reliability, and compliance using DevOps, infrastructure-as-code,
    and observability best practices
  - Evaluate and integrate emerging technologies to enhance developer productivity
    and operational efficiency
  use_cases:
  - MLOps platform for scalable and reproducible ML and generative AI workflows
  - ML infrastructure for model training, fine-tuning, and deployment in packaging
    and printing industry
  - LLM and generative AI integration into packaging and print products
  - Automated CI/CD and continuous training pipelines for enterprise AI delivery
