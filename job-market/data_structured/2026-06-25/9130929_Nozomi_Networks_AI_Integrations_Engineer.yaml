  - Build and optimize data pipelines that feed the data warehouse with clean, structured,
    AI-ready data for agents
  - Partner with business users building agents — help scope possibilities, unblock
    integrations, and turn prototypes into production-grade workflows
  - Implement authentication, authorization, logging, and observability across all
    AI integrations
  - Establish reusable connectors, patterns, and internal documentation to accelerate
    future integrations
  - Collaborate with security and compliance teams to ensure AI access to sensitive
    data follows proper controls
  use_cases:
  - Agentic AI solutions for business functions across the organization
  - Secure AI agent access to CRM, ERP, and internal systems of record
  - AI-powered operational technology (OT) and IoT cybersecurity
  - Data retrieval and retrieval-augmented generation (RAG) for business intelligence
  - Enterprise workflow automation via AI agents
