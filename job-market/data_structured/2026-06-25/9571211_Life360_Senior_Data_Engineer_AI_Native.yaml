position:
  title: Senior Data Engineer (AI Native)
  ai_type:
    type: ai-support
    reasoning: |-
      This is a data engineering role focused on building and
      maintaining data pipelines, infrastructure, and lakehouse
      architecture. While the team uses AI tools (Claude Code,
      Cursor) to accelerate development and builds Databricks
      Genie chatbots for natural language data querying, the core
      work is data infrastructure engineering, not building,
      training, fine-tuning, or deploying AI/ML models. The role
      supports AI adoption within the team but does not work
      directly on AI/ML systems.
  responsibilities:
  - Design and manage scalable data platforms for real-time analytics, batch processing,
    and exploratory analysis
  - Own the full data lifecycle including ingestion, ETL, storage, and serving across
    streaming and batch sources
  - Architect medallion-layer data models (Bronze/Silver/Gold) in Databricks with
    clean, well-documented schemas
  - Automate, test, and harden data workflows with data quality checks and CI/CD pipelines
  - Build and maintain AI-assisted tooling including custom prompts, slash commands,
    and agent workflows for the team
  - Build and improve Databricks Genie chatbots enabling non-technical users to query
    data using natural language
  - Collaborate with product analytics and data science teams to transform messy data
    into production-ready datasets
  - Contribute to infrastructure-as-code using Terraform and Atmos for cloud data
    infrastructure provisioning
  use_cases:
  - Real-time and batch data ingestion processing over 6 billion events per day and
    2 TB of data daily
  - Data lakehouse architecture for analytics, product decisions, and partner integrations
  - Natural language data querying via Databricks Genie chatbots for non-technical
    users
  - Medallion-layer data modeling unifying streaming and batch data sources into a
    consistent platform
  - AI-assisted data pipeline development using Claude Code for scaffolding, documentation,
    and quality validation
