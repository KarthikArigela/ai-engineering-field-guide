    ops: [Application Insights / Log Analytics, CI/CD pipelines, MLOps, Docker, RBAC
        and identity management]
    languages: [Python]
    domains: []
    other: [SAP integration, Salesforce integration, SharePoint, Microsoft Teams /
        M365, AI governance frameworks]
