position:
  title: Sr. AI Engineer
  ai_type:
    type: ai-first
    reasoning: |-
      This role involves directly building, deploying, and
      operationalizing production-grade AI agents using Azure AI
      Foundry and Copilot Studio, including RAG pipelines, multi-
      agent orchestration, prompt engineering, and LLM-based
      applications. The engineer is hands-on with designing and
      shipping agentic AI solutions, not just supporting
      infrastructure for others.
  responsibilities:
  - Define reference architecture and design patterns for agentic AI solutions across
    Copilot Studio and Azure AI Foundry, including RAG, multi-agent orchestration,
    and enterprise integrations
  - Build and deploy production-grade AI agents including knowledge/troubleshooting
    agents, workflow automation agents, and data-driven analytics agents
  - Implement prompt engineering, evaluation strategies, agent workflows, orchestration
    logic, and API/connector integrations
  - Establish enterprise AI governance including security, RBAC, Entra ID identity
    integration, data access boundaries, audit logging, and monitoring frameworks
  - Define and implement agent lifecycle management, CI/CD pipelines, and deployment
    standards
  - Configure and deploy Azure OpenAI model endpoints, Azure AI Search with vector
    and semantic retrieval, and Application Insights monitoring
  - Co-build pilot agents with consultants and internal teams while enabling adoption
    and value-based outcomes
  - Partner with data engineering on data products, semantic layer alignment, AI observability,
    and feedback loops
  use_cases:
  - Knowledge and troubleshooting agents for internal support
  - Operational and workflow automation agents across enterprise systems
  - Data and analytics-driven agents for business intelligence
  - RAG-based enterprise search and document retrieval
  - Multi-agent orchestration integrating SAP, Salesforce, Databricks, SharePoint,
    and Microsoft 365
  - Enterprise AI platform with governed, monitored, and secure agent deployment
  skills:
