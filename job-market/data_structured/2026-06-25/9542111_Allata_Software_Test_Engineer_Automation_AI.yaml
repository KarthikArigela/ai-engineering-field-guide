    validation, and early test planning
  - Use AI-powered tools and RAG approaches to extract knowledge from technical docs,
    speed up code reviews, and recognize defect patterns
  - Track defects in JIRA with clear reproduction steps and collaborate with developers
    on resolution
  use_cases:
  - Automated test generation and acceleration using AI coding assistants
  - Test failure pattern analysis and root cause identification
  - Code review acceleration using AI tools
  - RAG-based knowledge retrieval from technical documentation and past test runs
  - Automated quality assurance for web, SaaS, API, and mobile applications
