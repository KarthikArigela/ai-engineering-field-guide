position:
  title: Data Quality Engineer,  AI Business
  ai_type:
    type: ai-support
    reasoning: |-
      This role is focused on data quality engineering for AI
      training data services — ensuring the quality, authenticity,
      and integrity of human-sourced data used to train AI models.
      The role does not involve building, training, fine-tuning,
      or deploying AI/ML models directly, but rather building
      quality measurement systems, automated checks, and processes
      around the data pipeline that feeds AI development.
  responsibilities:
  - Own end-to-end quality design for managed service studies including rubrics, acceptance
    criteria, and defect taxonomies
  - Define and maintain quality measurement systems including sampling plans, golden
    sets, calibration protocols, and drift detection
  - Build and deploy automated quality checks and launch gates using Python and SQL
  - Design and run launch readiness processes including pre-launch checks, pilot calibration,
    and ramp criteria
  - Partner with Product and Engineering to embed quality controls and authenticity
    checks into workflows and tooling
  - Investigate quality and integrity issues end-to-end, running root-cause analysis
    and driving corrective actions
  - Build dashboards and operating cadences to track defect rates, rework, throughput,
    and SLA adherence
  - Lead calibration sessions and coach QA leads and reviewers to improve decision
    consistency
  use_cases:
  - Ensuring quality and authenticity of human-sourced data for AI model training
  - Automated quality checks and launch gates for managed data collection studies
  - Fraud and integrity detection in participant data collection
  - Quality measurement and drift detection for annotation and labeling workflows
  - Launch readiness and calibration for large-scale data collection programs
