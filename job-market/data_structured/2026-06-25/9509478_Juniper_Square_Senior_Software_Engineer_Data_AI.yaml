position:
  title: Senior Software Engineer, Data (AI)
  ai_type:
    type: ai-support
    reasoning: |-
      This is a data platform engineering role where the primary
      work involves building data infrastructure (ingestion
      pipelines, catalogs, governance tooling). While LLM/agentic
      tools are used as development workflow aids, the role itself
      does not involve building, training, fine-tuning, or
      deploying AI/ML models. The AI usage is as a developer
      productivity tool, not as core product work on AI systems.
  responsibilities:
  - Design and ship production-quality enhancements to the data fabric platform including
    streaming ingestion pipelines (Kafka, Flink) and Redshift-based storage and query
    layers
  - Contribute to the self-service ingestion and transformation platform enabling
    domain teams to publish data models and analysts to create aggregations independently
  - Extend and maintain the CI/CD pipeline for dbt transformations including validation
    frameworks to prevent regressions
  - Build and operate the data catalog platform enabling data discovery, business
    context understanding, keyword search, and lineage tracing
  - Implement integrations between the catalog and upstream systems (dbt, query history,
    data publishers) to maintain accurate lineage and metadata
  - Contribute to governance tooling ensuring data quality, compliance, and observability
    across the platform
  - Use agentic coding tools and LLM-assisted development as primary workflow, critically
    evaluating AI-generated code for correctness
  - Build and maintain monitoring, alerting, and observability tooling to keep data
    pipelines healthy
  use_cases:
  - Real-time streaming data fabric serving as unified data access layer for the company
  - Self-service data catalog with lineage tracking and metadata management for internal
    teams
  - Self-service data ingestion and transformation platform for domain teams and analysts
  - Data governance and observability across a scalable data platform
  - In-app reporting and analytics for private markets customers (fund administration,
    investment workflows)
  - CI/CD pipeline for dbt transformations with regression prevention
