position:
  title: Senior AI Enablement Engineer
  ai_type:
    type: ai-support
    reasoning: |-
      This role is focused on enabling AI adoption across software
      engineering teams — evaluating AI tooling, coaching
      engineers, shaping governance, and occasionally building AI-
      driven services or agents. While the candidate works with
      and around AI tools (copilots, agentic tools), the primary
      mandate is enablement, adoption strategy, and developer
      experience rather than building or training AI/ML models
      themselves.
  responsibilities:
  - Lead the effective and responsible use of AI across ClearBank's software engineering
    teams
  - Evaluate and master AI tooling including copilots, agentic tools, and workflow-integrated
    capabilities used in software engineering
  - Collaborate with engineering teams to improve AI usage in coding, testing, review,
    debugging, and documentation
  - Define and measure AI adoption success using DORA metrics, flow metrics, engagement
    signals, and code quality outcomes
  - Partner with Security, Model Risk, and governance stakeholders to ensure proportionate
    and non-blocking controls
  - Occasionally build or extend AI-driven services, agents, or platform enhancements
    integrated into the SDLC
  - Coach and guide engineers on effective AI-assisted development patterns to raise
    organisational capability
  - Build relationships with AI-using teams across the bank to share approaches and
    support coherent investment decisions
  use_cases:
  - AI-assisted software development including coding, testing, code review, debugging,
    and documentation
  - AI tooling evaluation and adoption across enterprise engineering teams
  - AI governance and compliance within a regulated banking environment
  - Agentic systems and AI-driven automation within engineering workflows and CI/CD
    pipelines
  - Developer productivity and experience improvement through AI integration
