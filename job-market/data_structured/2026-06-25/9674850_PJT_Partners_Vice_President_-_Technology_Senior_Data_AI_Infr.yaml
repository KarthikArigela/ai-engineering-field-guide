company:
  name: PJT Partners
  stage: Public
  focus: Global advisory-focused investment bank
position:
  title: Vice President - Technology (Senior Data & AI Infrastructure Platform Engineer)
  ai_type:
    type: ai-support
    reasoning: |-
      This is explicitly a platform engineering role focused on
      building infrastructure and developer tooling that enables
      other teams to build AI applications. While the role
      involves integrating LLM APIs (Claude, Azure OpenAI) and
      implementing RAG infrastructure, the core responsibility is
      infrastructure, data pipelines, security, and governance —
      not building, training, fine-tuning, or deploying models
      directly. The role supports AI initiatives rather than
      directly creating AI systems.
  responsibilities:
  - Design, build, and operate the firm's AI platform enabling developers to build
    and deploy Python-based AI applications
  - Implement and manage Azure AI Foundry environments including model deployments,
    AI hubs, project workspaces, and access controls
  - Integrate and operationalize third-party AI APIs (Anthropic Claude, Azure OpenAI)
    with secure access patterns, API gateway controls, rate limiting, and cost monitoring
  - Build data pipelines using Azure Data Factory and Azure Databricks to serve AI
    application data needs
  - Implement vector search and document retrieval infrastructure using Azure AI Search
    to support RAG-based applications
  - Provision and maintain secure, scalable infrastructure on Azure and AWS using
    Infrastructure-as-Code (Terraform or Bicep)
  - Build and maintain CI/CD pipelines for AI application deployment via Azure DevOps
    or GitHub Actions
  - Implement data access controls, encryption, audit logging, and AI governance guardrails
    aligned with SEC and FINRA compliance requirements
  use_cases:
  - Enterprise AI platform enabling internal developers to build and deploy AI-powered
    applications
  - RAG-based document retrieval and search for investment banking workflows
  - Secure LLM API integration (Claude, Azure OpenAI) for regulated financial services
  - AI governance and compliance enforcement for investment banking use cases
  - Internal developer tooling and SDK scaffolding for accelerating AI application
    development
