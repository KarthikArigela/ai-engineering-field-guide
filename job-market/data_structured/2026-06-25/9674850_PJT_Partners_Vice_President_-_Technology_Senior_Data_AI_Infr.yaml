        Management, Azure Key Vault, Azure Entra ID]
    genai: [Anthropic Claude API, RAG, LangChain, Semantic Kernel, AutoGen, LangGraph]
    data: [Azure Data Factory, Azure Databricks, Microsoft Fabric, Databricks Unity
        Catalog, Azure Synapse]
    other: []
    ops: [Terraform, Bicep, Azure DevOps, GitHub Actions, Docker, Kubernetes, AKS,
      RBAC, CI/CD, DevSecOps]
    web: [FastAPI, Flask, REST APIs]
    databases: [Azure AI Search, Azure Data Lake, Azure SQL, Cosmos DB, pgvector]
  is_customer_facing: false
  is_management: false
