    quality throughout the development lifecycle
  - Identify, log, track, and validate defects using defect management tools
  - Contribute to building and maintaining automation frameworks and reusable test
    utilities
  - Support CI/CD pipelines by integrating automated tests into the build process
  - Mentor junior QA engineers and promote best practices in quality engineering
  use_cases:
  - Quality assurance for web applications
  - Testing Salesforce and enterprise applications
  - Automated regression and integration testing
  - Validating AI-powered application behavior
  - CI/CD pipeline test integration
