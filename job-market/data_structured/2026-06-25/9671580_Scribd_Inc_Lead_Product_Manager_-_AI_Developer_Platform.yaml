  - Agent and app platforms supporting AI-driven workflows across all company functions
  - Plugin marketplace for extending AI agent capabilities in codebases
  - Agentic engineering transformation to increase development velocity and code quality
  - Cross-functional AI enablement for Product, Design, Research, Data & Analytics,
    and TPM teams
