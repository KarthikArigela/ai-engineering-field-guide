    web: [APIs, JSON]
    databases: []
    data: []
    cloud: [Cloud-based distributed systems, AWS, GCP, Azure]
    ops: [Linux CLI, Logging frameworks, Debugging tools, Packet-level analysis, Telemetry
        analysis]
    languages: [Scripting for automation]
    domains: []
