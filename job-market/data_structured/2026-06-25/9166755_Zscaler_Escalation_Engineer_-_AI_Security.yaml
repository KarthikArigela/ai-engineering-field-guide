  stage: Public
  focus: Cloud-native zero trust cybersecurity platform
position:
  title: Escalation Engineer - AI Security
  ai_type:
    type: ai-support
    reasoning: |-
      This is a technical escalation/support engineer role focused
      on resolving customer escalations related to Zscaler's cloud
      security platform, which includes AI-assisted capabilities.
      The role involves troubleshooting and investigating AI
      security issues (model security, AI agent governance, data
      leakage prevention) but does not involve building, training,
      fine-tuning, or deploying AI/ML models. The engineer works
      NEAR AI systems to resolve issues rather than ON them.
  responsibilities:
  - Own and resolve the highest-severity technical escalations through deep analysis,
    managing on-call rotation for critical issues
  - Troubleshoot and resolve complex issues across Zscaler cloud security services,
    configuration, policy engines, APIs, and AI-assisted capabilities
  - Investigate and resolve scenarios related to secure use of AI models, governance
    of AI agents, data protection, and inference security
  - Perform detailed log, telemetry, and packet-level analysis to identify root causes,
    reproduce complex defects, and provide engineering-ready bug reports
  - Validate fixes and drive cross-functional collaboration with Engineering, Cloud
    Ops, and Product Management
  - Create advanced troubleshooting documentation and act as a technical mentor to
    uplift support capability
  use_cases:
  - Secure enterprise deployment and governance of AI models and agents
  - Data loss prevention and data leakage protection in AI systems
  - Cloud security policy enforcement and zero trust access control
  - AI model access policy controls and inference security
  - Customer escalation resolution for complex cloud security incidents
