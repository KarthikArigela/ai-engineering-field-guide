position:
  title: Senior Software Engineer - AI Interaction Evaluator (Codex / Claude Code,
    up to $200/hr)
  ai_type:
    type: ai-support
    reasoning: |-
      This role involves evaluating and assessing the quality of
      AI coding agent outputs (Codex, Claude Code, Cursor), not
      building, training, or deploying models. The engineer
      provides human feedback on AI-generated interactions to help
      define quality standards, which supports the improvement of
      AI products but is not hands-on model work. It is closest to
      RLHF-style evaluation work done by domain experts.
  responsibilities:
  - Evaluate AI-generated coding interactions end-to-end for quality and usefulness
  - Assess whether outputs reflect strong engineering judgment and reasoning
  - Distinguish between different levels of response quality using structured rubrics
  - Provide clear, opinionated feedback on what worked, what didn't, and what felt
    misleading
  - Assess the quality of explanations and reasoning, not just code correctness
  - Help define quality standards for interactions with AI coding agents
  use_cases:
  - Evaluating coding agent interaction quality for OpenAI Codex
  - Evaluating coding agent interaction quality for Claude Code
  - Defining quality benchmarks for AI-assisted development tools like Cursor
  - Human evaluation and feedback for AI coding assistant improvement
  skills:
    domains: []
    languages: [TypeScript, JavaScript, Python]
    ml: []
    cloud: []
    genai: [Codex, Claude Code, Cursor, Prompt Engineering, AI-assisted development
        workflows, AI evaluation workflows]
    data: []
    other: []
    ops: []
    web: []
    databases: []
  is_customer_facing: false
  is_management: false
