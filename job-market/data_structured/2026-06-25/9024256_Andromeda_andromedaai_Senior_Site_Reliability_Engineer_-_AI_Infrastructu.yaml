position:
  title: Senior Site Reliability Engineer - AI Infrastructure
  ai_type:
    type: ai-support
    reasoning: |-
      This role is focused on designing, operating, and debugging
      GPU infrastructure (clusters, networking, storage,
      observability) that supports distributed training and
      inference workloads. The engineer does not build, train, or
      deploy models themselves — they enable AI labs and customers
      to run their training/inference jobs reliably. However, the
      role requires deep understanding of ML frameworks and
      distributed training internals at the systems level, which
      places it firmly in ai-support (infrastructure/platform
      enabling AI work).
  responsibilities:
  - Design and evolve multi-provider, multi-region GPU compute clusters optimized
    for large-scale distributed training
  - Serve as the primary technical point of contact for customers running large-scale
    training workloads, including onboarding, troubleshooting, and real-time optimization
  - Define SLOs, error budgets, and capacity planning across heterogeneous GPU fleets
    accounting for GPU-specific failure modes
  - Ensure health and performance of high-speed interconnects (InfiniBand, RoCE, NVLink)
    underpinning distributed training
  - Build deep observability into GPU utilization, memory pressure, interconnect throughput,
    and hardware health
  - Develop production-grade automation for cluster provisioning, GPU health checks,
    job scheduling, self-healing, and firmware lifecycle management
  - Lead incident response for complex multi-layer failures spanning hardware, networking,
    orchestration, and ML frameworks
  use_cases:
  - Large-scale distributed model training infrastructure
  - GPU inference workload serving
  - Multi-provider multi-region GPU compute routing and scheduling
  - AI compute marketplace and liquidity for global GPU supply
  - High-performance networking fabric health for distributed collective operations
  - Automated GPU cluster lifecycle management and self-healing
