    data: []
    cloud: []
    ops: [NVIDIA A100/H100/B200, GPU cluster operations, InfiniBand, RoCE, NVLink,
      Kubernetes, Slurm, Terraform, Helm, Ansible, Prometheus, Grafana, DCGM, Linux
        kernel tuning, Docker, Incident response, SLO management]
    languages: [Python, Go, Bash]
    domains: []
    other: []
  is_customer_facing: true
  is_management: false
