    performance
  - Improve memory efficiency, latency, and throughput across model pipelines
  - Ensure correctness, numerical stability, and reproducibility as the model evolves
  - Collaborate with ML researchers on productionizing new capabilities
  - Shape architectural decisions for ML systems handling tabular data
  - Maintain clean abstractions, comprehensive tests, and clear documentation
  use_cases:
  - Large Tabular Model (LTM) development for enterprise decision-making
  - Predictive analytics on structured enterprise records
  - Foundation model development for tabular data
  - Performance optimization of ML training and inference pipelines
