position:
  title: Senior Product Manager, AI Platform and Developer Productivity
  ai_type:
    type: ai-support
    reasoning: |-
      This is a Product Manager role focused on defining strategy
      and roadmap for AI platform initiatives, observability, and
      developer productivity tooling — not hands-on building,
      training, or deploying models. While the role involves
      working with AI-powered capabilities (agentic automation,
      AI-native workflows), the core work is product management:
      strategy, prioritization, cross-functional alignment, and
      adoption — enabling AI tools for internal engineering teams
      rather than building the AI systems themselves.
  responsibilities:
  - Define product strategy and execution across a portfolio of AI platform initiatives,
    translating ambiguous technical challenges into clear problem statements and prioritized
    roadmaps
  - Engage directly with internal developers and engineering teams to understand user
    challenges and turn them into high-impact platform capabilities
  - Drive roadmap planning across short- and long-term horizons, balancing customer
    impact, technical feasibility, scalability, and strategic business priorities
  - Identify and evaluate high-value opportunities for AI-powered tooling, agentic
    automation, and developer productivity improvements with focus on measurable adoption
  - Establish product success metrics and use data-driven insights to refine prioritization,
    feature scope, and user experience
  - Champion developer experience and UX quality by understanding engineering workflows
    and trust dynamics in AI-assisted tooling
  - Communicate product strategy, trade-offs, and execution plans across technical
    and executive audiences
  - Lead cross-functional collaboration across engineering, infrastructure, architecture,
    and design teams in a matrixed environment
  use_cases:
  - AI observability and profiling for large-scale engineering systems
  - Agentic automation for developer workflows and operational tasks
  - AI-native developer productivity tooling and environments
  - Infrastructure platforms supporting silicon development, simulation, and validation
  - Source control and SDLC tooling for hardware and software engineering teams
