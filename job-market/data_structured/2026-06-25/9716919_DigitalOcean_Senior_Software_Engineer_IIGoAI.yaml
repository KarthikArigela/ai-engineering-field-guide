    data: []
    cloud: []
    ops: [Kubernetes, Consul, Nomad, Distributed Systems Orchestration, Service Discovery,
      Service Mesh]
    languages: [Go (Golang)]
    domains: []
    other: []
  is_customer_facing: false
  is_management: false
