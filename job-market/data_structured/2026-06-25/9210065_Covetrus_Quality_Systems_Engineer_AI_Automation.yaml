company:
  name: Covetrus
  stage: Public
  focus: Animal-health technology and services platform
position:
  title: Quality Systems Engineer (AI & Automation)
  ai_type:
    type: ai-support
    reasoning: |-
      This role focuses on building automated quality workflows
      using low-code platforms (Power Automate, Salesforce Flow)
      and leverages AI tools (Copilot, ChatGPT, Claude) as
      productivity aids rather than building, training, or
      deploying AI/ML models. The AI usage is ancillary to the
      core quality systems engineering work, making this an AI-
      support role.
  responsibilities:
  - Design, build, and deploy automated workflows and decision logic across quality
    processes using low-code platforms and AI-assisted tools
  - Translate manual quality processes into structured, deterministic workflows for
    complaint intake, nonconformance, CAPA, supplier quality, and recall processes
  - Integrate systems including Salesforce, QMS, and data platforms to enable end-to-end
    process visibility and control
  - Leverage AI tools to accelerate root cause analysis, improve workflow efficiency,
    and support decision-making frameworks
  - Build and maintain dashboards, automated reporting, and data pipelines to monitor
    quality signals and trends
  - Administer and enhance QMS and related platforms to ensure data integrity, system
    reliability, and regulatory compliance
  - Partner with Quality, IT, Supply Chain, and Operations to design scalable, system-enabled
    quality solutions
  - Support audits, inspections, and system validations with a focus on system integrity
    and traceability
  use_cases:
  - Automated complaint intake, triage, and escalation workflows for veterinary and
    pharmacy quality operations
  - Nonconformance and CAPA (Corrective and Preventive Action) workflow automation
  - Supplier quality monitoring and automated trigger systems
  - Recall and traceability process automation for regulated environments
  - DSCSA-related data exchange and compliance system controls
  - Quality signal monitoring and trend analysis through dashboards and reporting
