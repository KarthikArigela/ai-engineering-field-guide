  About Mistral
  
  At Mistral AI, we believe in the power of AI to simplify
  tasks, save time, and enhance learning and creativity. Our
  technology is designed to integrate seamlessly into daily
  working life.
  
  We democratize AI through high-performance, optimized, open-
  source and cutting-edge models, products and solutions. Our
  comprehensive AI platform is designed to meet enterprise
  needs, whether on-premises or in cloud environments. Our
  offerings include le Chat, the AI assistant for life and
  work.
  
  We are a dynamic, collaborative team passionate about AI and
  its potential to transform society.
  
  Our diverse workforce thrives in competitive environments
  and is committed to driving innovation. Our teams are
  distributed between France, USA, UK, Germany and Singapore.
  We are creative, low-ego and team-spirited.
  
  Join us to be part of a pioneering company shaping the
  future of AI. Together, we can make a meaningful impact. See
  more about our culture on https://mistral.ai/careers.
  
  About The Job
  
  Mistral AI is seeking an Applied AI Engineer to facilitate
  the adoption of its products among customers and collaborate
  with them to address complex technical challenges.
  
  The Applied AI Engineer - Software Engineer will be an
  integral part of our Applied AI Engineering team, which is
  dedicated to driving the successful deployment of Mistral AI
  products. They will work hand-in-hand with customers from
  the pre-sale stage to post-implementation, ensuring our
  solutions meet and exceed client expectations.
  
  What you will do
  
  • Collaborate closely with researchers, AI engineers, and
  product engineers on complex customer projects, integrating
  cutting-edge AI models into clients’ software products.
  
  • Design, develop, and maintain scalable and robust full-
  stack applications, ensuring seamless integration between
  front-end and back-end systems.
  
  • Develop complex use cases with our customers, providing
  guidance and ensuring the best production integration with
  back-end and front-end interfaces.
  
  • Collaborate with our product and science team to
  continuously improve our product and model capabilities
  based on customers’ feedback.
  
  About you
  
  • You are fluent in English
  
  • You hold a degree in Computer Science, Software
  Engineering, or a related field.
  
  • You have 2+ years as a technical individual contributor on
  cutting-edge technologies
  
  • You have strong technical coding skills in Python and
  TypeScript
  
  • You have experience with front-end frameworks such as
  React, NextJS, or VueJS.
  
  • You have experience with back-end technologies such as
  NodeJS.
  
  • You have a solid understanding of software development
  principles, including design patterns, data structures, and
  algorithms.
  
  • You hold strong communication skills with an ability to
  explain complex technical concepts in simple terms with
  technical and non-technical audiences
  
  Ideally you have:
  
  • Experience with LLM/GenAI models
  
  • Contributed to open-source projects or libraries
  
  • Experience as a Customer Engineer, Forward Deployed
  Engineer, Sales Engineer, Solutions Architect or Technical
  Product Manager
  
  Benefits
  
  We have local offices in Paris, London, Marseille and
  Singapore.
  
