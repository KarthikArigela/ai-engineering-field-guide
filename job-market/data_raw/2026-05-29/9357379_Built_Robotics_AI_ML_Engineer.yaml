work_type: FULL_TIME
description: |
  WHO WE ARE
  
  Built Robotics’ mission is to build the robots that build
  the world. By automating repetitive tasks in the $300
  billion solar industry, Built is bridging the workforce gap
  to accelerate our transition to clean energy.
  
  
  
  WHAT YOU’LL DO
  
  
  
  - Design and develop edge machine learning systems that to
    improve the autonomy and safety of our construction robots
  - Build scalable ML infrastructure for model training,
    validation, deployment, and monitoring
  - Develop and optimize computer vision and sensor fusion
    models for construction environments
  - Analyze large-scale operational datasets to improve model
    performance and reliability
  - Improve object recognition, scene understanding, and
    autonomous decision-making systems
  - Integrate cloud-based commercial and open-source AI tools
    into our autonomy stack
  
  
  
  YOUR QUALIFICATIONS
  
  
  
  - BS, MS, or PhD in computer science, artificial intelligence,
    machine learning, robotics, or related field
  - 3+ years of experience building and deploying machine
    learning systems
  - Expertise in Python and ML frameworks such as PyTorch or
    TensorFlow
  - Experience building distributed ML training systems and data
    pipelines
  - Robotics or autonomous systems experience is a plus
  
  
  
  COMPANY PERKS
  
  
  
  - Competitive salary and equity
  - 100% employer-sponsored health, dental and vision insurance
    — for you, your spouse and children
  - 401(k) with employer matching
  - Paid holidays and flexible PTO
  - TSA PreCheck
  - Gym membership• Free catered lunch and plenty of snacks
  - A pair of steel-toe boots
  
  ABOUT THE COMPANY & ROLE
  
  Built Robotics’ mission is to build the robots that build
  the world. By automating repetitive tasks in the $300
  billion solar industry, Built is bridging the workforce gap
  to accelerate our transition to clean energy.
  
