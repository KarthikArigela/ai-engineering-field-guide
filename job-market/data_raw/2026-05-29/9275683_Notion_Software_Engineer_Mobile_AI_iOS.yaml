description: |
  Who We Are
  
  Notion is the collaborative AI workspace where teams and
  agents think together. We're building one place where your
  knowledge, projects, meetings, and AI tools live side by
  side, so work feels faster, clearer, and less fragmented.
  Millions of individuals, small teams, and large companies
  run their work on Notion.
  
  Notinos (our employees) are customer zero in bringing this
  future of work to life. We care about craft, humanity, and
  building things that last — not just shipping the next
  feature, but setting a standard for how modern teams (with
  humans and agents working together) think and execute.
  
  About the Role
  
  Notion is building the operating system for knowledge work.
  We aspire for Notion users to be able to do substantive
  knowledge work from their phone.
  
  AI is what makes that possible in Notion by bringing the
  full power of the workspace into your pocket — understanding
  context, taking action, and helping you move work forward in
  the moment. On mobile, that’s not just about speed and
  polish but also about expanding what users can do with AI:
  capture and structure information, answer questions across
  their workspace, manage tasks and projects, coordinate with
  teammates, and trigger or automate workflows — all with
  trustworthy context, clear collaboration cues, and
  dependable execution.
  
  What You'll Achieve:
  
  - Build and ship AI-first iOS experiences from interaction
    design through implementation, launch, and iteration.
  - Raise the bar on reliability and performance improving crash
    prevention, fast time-to-first-token, efficient
    networking, and memory or battery discipline.
  - Evolve our architecture and tooling through modularization,
    observability, offline or resilience strategies, and test
    coverage.
  - Collaborate deeply with Product, Design, Data Science, and
    Research to turn ambiguous problems into crisp shipped
    outcomes.
  - Work across the stack when needed to deliver cohesive AI
    workflows.
  
  Skills You'll Need to Bring
  
  - Ability to ship quality apps at scale: You have around 8-10+
    years of experience delivering high-impact iOS features
    for large audiences, and you’re fluent in Swift and core
    iOS frameworks.
  - Thoughtful problem-solving: You start by building a clear
    model of the problem, then iterate toward a clean solution
    — independently or with teammates — and you ask for help
    early when you’re stuck.
  - Rapid iteration and learning: You build with rigor and
    momentum, stay open to trying things, and use rapid
    prototyping to learn fast with an optimistic, solutions-
    first mindset.
  - AI product instincts: You tinker with and explore the latest
    AI tools and can design AI UX people can understand and
    trust (streaming UX, tool-use patterns, guardrails, and
    failure modes).
  - Empathetic communication: You communicate nuanced ideas
    clearly in writing and in person, and you navigate
    disagreements with curiosity and respect.
  
  Nice to Haves
  
  - You’ve built and shipped AI-powered mobile experiences
    (voice, multimodal input, tool use, evaluation or quality
    loops).
  - 0→1 product experience, or experience rapidly iterating on
    new product surfaces with tight feedback loops.
  - Experience with realtime collaboration, offline-first sync,
    or rich-text editing.
  - You’re proficient with our broader stack (TypeScript, React,
    Node), or you’re excited to learn it to deliver end-to-end
    mobile experiences.
  
  Notion is committed to providing highly competitive cash
  compensation, equity, and benefits. The compensation offered
  for this role will be based on multiple factors such as
  location, the role’s scope and complexity, and the
  candidate’s experience and expertise, and may vary from the
  range provided below. For roles based in New York, the
  estimated base salary range for this role is $220k - $350k
  per year.
  
  By clicking “Submit Application”, I understand and agree
  that Notion and its affiliates and subsidiaries will collect
  and process my information in accordance with Notion’s
  Global Recruiting Privacy Policy and NYLL 144. #LI-Onsite
  
  A Note on AI
  
  You don’t need deep AI expertise for every role, but we do
  expect every Notino to be intellectually curious, drawn to
  tinkering and discovery, and excited to use AI as a real
  collaborator in their work. For some roles, AI fluency is a
  core requirement — when that’s the case, we’ll make it
  explicit in the qualifications. People who thrive here don’t
  treat AI as a novelty. They use it to think better, move
  faster, and build more creatively.
  
  Equal Opportunity & Accommodations
  
  We hire talented and passionate people from a variety of
  backgrounds because we want our teams to reflect the wide
  diversity of our customers. If you’re excited about a role
  but your experience doesn’t align perfectly with every
  bullet point listed, we still encourage you to apply.
  
  Notion is proud to be an equal opportunity employer. We do
