  Resilinc is hiring a Forward Deployed Engineer to help
  deliver our most complex enterprise deployments.
  
  This role sits at the intersection of customer delivery,
  product discovery, data engineering, applied AI, and
  software engineering. You will work directly with strategic
  customers and cross-functional teams across Agent Success,
  Product, Engineering, Data, Support, and Sales to solve
  deployment challenges that go beyond standard
  implementation.
  
  You are not here to coordinate work from the sidelines. You
  are here to understand the problem, define the technical
  path, build what is needed, deploy it into production, and
  leave behind something maintainable, documented, observable,
  and supportable.
  
  The mission is simple: compress time-to-value for Resilinc’s
  most complex customers while ensuring that custom work
  becomes reusable learning, not long-term operational debt.
  
  Mission
  
  Deliver production-ready technical solutions for Resilinc’s
  most complex enterprise customers by turning ambiguous
  business, data, workflow, and AI deployment requirements
  into scalable, well-documented, supportable software and
  implementation patterns.
  
  What You Will Do
  
  What You Will Bring
  
  What Will Make You Stand Out
  
  - Experience with AI-enabled workflows, LLM-powered
    applications, agentic systems, or orchestration frameworks
    such as LangChain, LangGraph, or similar tools
  - Experience deploying AI or analytics solutions into real
    enterprise operating environments
  - Experience turning repeated customer requirements into
    reusable accelerators, frameworks, templates, or
    productizable capabilities
  - Background in supply chain, risk management, manufacturing,
    procurement, logistics, compliance, or complex operational
    environments
  - Experience working with highly variable enterprise data
    landscapes, including fragmented source systems,
    inconsistent schemas, incomplete master data, and
    nonstandard workflows
  - Experience balancing customer-specific delivery with long-
    term platform maintainability
  - Experience working in a forward-deployed engineering, field
    engineering, implementation engineering, or technical
    customer-facing engineering role.
  
  Why This Role Matters
  
