description: |
  🏛️ About GovWell
  
  We the people — and the taxpayers — deserve good government.
  Yet today, interacting with government services is often
  frustrating and inefficient. GovWell is building the AI
  operating system transforming how governments serve
  communities, starting with local agencies.
  
  GovWell replaces legacy software for municipalities and
  counties, empowering public servants to radically streamline
  public services and cut internal processing time for permits
  and licenses by up to 95%.
  
  Founded in 2023, GovWell powers 5,000+ mission-critical
  processes for agencies in 35+ states serving millions of
  residents. The company has raised $35M in funding from
  Insight Partners, Work-Bench, and Bienville Capital, and the
  team works in person at GovWell HQ in New York City. Read
  more about our founding story in TechCrunch.
  
  ☀️ Why GovWell?
  
  - A mission that matters: Building AI-powered products to fix
    outdated government systems isn’t just a technical
    challenge—it’s a historic opportunity to improve our
    foundational relationship with government and ensure
    trillions of tax dollars result in high quality services.
    WATCH: Mission & Vision with CEO & Co-Founder Troy LeCaire
  - Real-world impact: GovWell’s product is the system of record
    for government services that affect millions of Americans.
    From streamlining permitting for small businesses to
    accelerating affordable housing development, your work
    will make an immediate difference.
  - Join a startup in hyper-growth: We’ve found product-market
    fit and are scaling the business very quickly (6X ARR
    growth in the last year). As an early team member, you’ll
    learn what it takes to build a successful startup. You’ll
    work closely with the founders while enjoying exceptional
    autonomy and ownership over your work.
  
  🌟 Role overview
  
  GovWell is hiring our first AI Product Engineer to help turn
  cutting-edge generative AI technology into practical, user-
  facing products for government agencies. This role reports
  directly to the CTO and will work closely with the CEO on
  product strategy. You’ll play a key role in shaping how we
  apply AI to solve real-world problems with the potential to
  grow into a senior product or engineering leadership
  position.
  
  We have a hybrid work culture that combines regular in-
  person collaboration at our New York City office (3+ days
  per week) with flexibility to work remotely.
  
  💻 What you’ll do
  
  - Design, prototype, build, and launch AI-powered workflow
    automation products that transform how governments process
    and deliver services — from AI-powered resident assistants
    to AI agents that review and approve permits, licenses,
    and inspections.
  - Take full ownership of AI product development — from
    identifying agency and resident needs to shipping
    production-ready solutions, using techniques like
    retrieval-augmented generation (RAG) to handle complex
    regulatory and compliance data.
  - Collaborate closely with design, engineering, and government
    domain experts to turn generative AI into intuitive,
    reliable, and auditable workflows, including multi-agent
    orchestration for complex, multi-step approval processes
    (e.g., construction permitting or business licensing).
  - Leverage cutting-edge models and custom LLM systems to
    ensure accuracy, compliance, and scalability across
    diverse government use cases.
  - Use agency feedback and real-world usage data to rapidly
    iterate and improve automation features, ensuring
    solutions are trustworthy, transparent, and aligned with
    regulatory requirements.
  
  🧠 Who you are
  
  - 5+ years of professional software/product engineering
    experience in high-growth startup environments, building
    user-facing applications for enterprises and/or consumers.
  - Hands-on experience building products with generative AI at
    their core, with strong familiarity in LLMs, vector
    databases, and retrieval systems.
  - Product-minded builder: you care as much about usability and
    impact as you do about technical depth, and you know how
    to translate AI capabilities into intuitive, reliable
    workflows.
  - Iterative problem-solver: you move quickly from prototype to
    production, using data and customer feedback to refine and
    improve features.
  - Mission-driven: motivated by GovWell’s mission to improve
    government services in America.
  - Values-aligned: you embody our Core Values.
  
  🖥️ Our tech stack
  
  - RedwoodJS
  - React
  - TypeScript
  - Node.js
  - GraphQL
  - PostgreSQL
  - AWS
  
  💸 Compensation and benefits
  
  Compensation within the posted salary band will be
  commensurate with experience. All offers will include:
  
  - Competitive base salary.
  - Equity / stock options.
  - Medical, dental, and vision insurance.
  - 401(k) program.
  - Flexible PTO.
  
