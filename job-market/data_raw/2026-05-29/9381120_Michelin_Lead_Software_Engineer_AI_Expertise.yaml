  • Ability to operate effectively in large enterprise
  ecosystems: structured communication, rigor, and a strong
  service mindset.
  
  • Experience with RAG architectures, vector databases, and
  MLOps pipelines is a strong plus.
  
  Team Life & Ways of Working:
  
  • Embrace and respect Agile rituals, contributing actively
  to continuous improvement of team processes and
  collaboration.
  
  • Participate in workload estimation for backlog items,
  challenging complexity and scope when needed.
  
  • Contribute to sprint planning and allocation of tasks,
  supporting the delivery of incremental value and
  modernization of components (Evergreen approach).
  
  Behavioural Skills:
  
  Planning & organizing,
  
  Teamwork & Collaboration,
  
  Customer Focus,
  
  Continuous learning
  
  Ability to rapidly learn and take advantage of new concepts,
  business models, and technologies
  
