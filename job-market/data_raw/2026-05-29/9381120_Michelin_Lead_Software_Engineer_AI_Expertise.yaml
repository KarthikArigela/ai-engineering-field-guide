  Lead Software Engineer (AI Expertise)
  
  - - - - - - - - - - - -
  
  Key Responsibilities:
  
  • Design and develop AI powered applications integrating
  Large Language Models (LLMs), including RAG, embeddings, and
  agent-based components.
  
  • Define and contribute to scalable GenAI architectures,
  ensuring robustness, performance, and industrial readiness.
  
  • Implement APIs, microservices, and AI pipelines within an
  industrial cloud environment.
  
  • Support client teams through scoping, technical expertise,
  architecture reviews, audits, and best practice guidance.
  
  • Ensure solution quality, security, compliance, and
