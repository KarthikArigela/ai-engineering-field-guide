description: |
  About the Company
  
  Vagaro is a global leader in cloud-based business management
  software, serving the salon, spa, beauty, fitness, and
  wellness industries. Our platform enables businesses to
  manage scheduling, payments, marketing, and operations from
  one centralized system.
  
  We are a rapidly growing, product-led company transforming
  how wellness businesses operate and connect with their
  customers.
  
  Why Join Us
  
  - 5-day work week & flexible schedule
  - Fun Fridays, Tech sessions & cultural events
  - Learning resources & gaming zones
  - Annual bonus & recognition programs
  - Leave encashment & maternity benefits
  - 15 Paid Leaves + 11 public Holidays
  - Comprehensive family medical insurance
  
  💼 Role: Full stack engineer (AI-First) 📍 Location: Ahmedabad
  (Work from Office)
  
  🎓 Education: Bachelor’s degree in computer science,
  Information Technology, or related field
  
  Role Overview
  
  We are looking for a Full Stack Engineer who builds with AI,
  not just alongside it. If you have genuinely integrated AI
  tools into your daily coding workflow and can ship
  production-grade React frontends and .NET Core APIs, we want
  to talk.
  
  What you will do:
  
  - Build and maintain responsive web applications using React
    (hooks, state management, modern patterns)
  - Design, develop, and optimize RESTful APIs using .NET Core /
    ASP.NET Core
  - Work with SQL/NoSQL databases, write efficient queries, and
    design clean schemas
  - Own features end-to-end — from API contract to deployed UI
  - Use AI coding tools (Claude Code, Copilot, Cursor, etc.) as
    a core part of your workflow to ship faster and better
  - Collaborate on architecture, code reviews, and technical
    decisions
  
  Must-haves:
  
  - 3–7 years of hands-on full stack development experience
  - Strong proficiency in React (functional components, hooks,
    modern tooling)
  - Strong proficiency in .NET Core / C# for API development
  - Solid understanding of REST APIs, authentication
    (JWT/OAuth), and database design
  - Hands-on experience using AI coding assistants in real
    projects — not just experimenting
  - Understanding of AI-assisted development workflows:
    effective prompting, context management, code review of AI
    output, knowing when to trust and when to verify
  - Git, CI/CD basics, and clean coding practices
  
  If you are excited to build real products in an AI-first
  environment and grow with a fast-moving team, we would love
  to hear from you.
