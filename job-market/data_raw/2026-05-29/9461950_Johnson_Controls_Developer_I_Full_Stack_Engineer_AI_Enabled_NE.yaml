  How will you do it?
  
  This role will provide a growth trajectory where you will be
  mentored by senior team members, and you will have
  opportunities to advance and contribute in expanded ways as
  your abilities grow.   As a software engineer, you will work
  with the team within the Software Development Lifecycle
  (SDLC) to build, update, fix, and test enterprise
  applications.  You will work with your Agile team members to
  refine, estimate, and plan backlog items, and you will work
  with QA engineers to make sure your applications and/or
  changes are high quality for our customers.  This role will
  be keenly focused on making sure the solutions created
  delight our customers.
  
  Key Responsibilities
  
  - Use AI tools such as Copilot and Claude to accelerate
    development, improve code quality, and deliver features
    faster to customers
  - Design and deliver features used by enterprise customers
    globally
  - Troubleshoot and resolve real-world production issues
  - Assist in building and modernizing a globally used
    enterprise system and working in C#, VB, React, and other
    languages
  - Improve performance and scalability of core platform
    components
  - Actively participate in evaluation and long-term
    implementation of technology enhancements
  - Follow and improve development practices to ensure reliable,
    high-quality releases for production systems
  - Ensure quality, performance, usability, and maintainability
    are built into our solutions
  - Collaborate with cross-functional team members to deliver
    high-priority features on time
  - Apply engineering best practices to create maintainable,
    scalable code that supports long-term platform growth
  - Partner with UX teams to improve usability and deliver
    intuitive experiences for end users
  
