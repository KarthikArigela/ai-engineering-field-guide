description: |
  The Opportunity
  
  This is your chance to build the foundational systems for
  'Citi Assist', a Generative AI assistant that will reach
  every Citi employee globally. You'll join us on the ground
  floor, becoming a core builder on a high-visibility platform
  that sets the standard for how a global bank adopts this
  technology safely and at scale.
  
  As a polyglot engineer, you'll work across the full stack.
  That means crafting intuitive user interfaces one day and
  building robust backend APIs the next. You'll be equally
  excited about both.
  
  What You'll Do
  
  Build and deliver across the stack. This is a hands-on role
  where you'll write high-quality, tested code and move
  features from idea to production. Sometimes that's a user-
  facing component. Sometimes it's a backend API. Often it's
  both.
  
  Own your features end to end. You'll take responsibility
  from the UI to the database. That means figuring out the
  path forward, asking the right questions, and driving your
  work to completion with support from the team.
  
  Build with security in mind. For us, building safe, sound,
  and compliant systems is non-negotiable and part of our
  craft. You'll implement security best practices in
  everything you build, including navigating the emerging
  challenges of AI safety.
  
  Be a great teammate. We expect you to be an active
  participant in our engineering culture. That means offering
  and receiving constructive code reviews, helping your peers
  when they're blocked, and sharing what you learn. We succeed
  as a team.
  
  Communicate proactively. We value open communication about
  progress and blockers. This helps us support each other
  effectively and keeps the whole team aligned. No one should
  have to chase you for updates
  
  .
  
  What We're Looking For
  
  We know that people from underrepresented groups are less
  likely to apply if they don't meet 100% of the criteria. If
  you're excited about this role but your experience doesn't
  align perfectly with every qualification, we encourage you
  to apply anyway. You may be just the right candidate for
  this or other roles.
  
  You should have
  
  - Experience building and deploying production applications,
    whether that's frontend, backend, or both
  - Proficiency in at least two of these languages: Python,
    TypeScript/JavaScript, Go, or Java
  - Experience building user-facing features with modern
    frontend frameworks like React, Vue, or Angular
  - Experience building backend services and APIs that are
    reliable and maintainable
  - Comfort with containerised environments (we use OpenShift,
    but Kubernetes or Docker experience transfers well)
  - Practical experience with CI/CD pipelines and a belief in
    automating things
  - Solid experience working with relational databases like
    Postgres or MySQL
  
  What matters most to us
  
  A solutions-first mindset. You find the best path to solve
  the problem, whether that's writing new code, improving an
  old system, or integrating the right tool. The outcome is
  what matters.
  
  A bias for action and a focus on shipping. You understand
  our goal is to deliver value to users, not just to write
  perfect code. You know when to be pragmatic and when to
  invest in technical excellence.
  
  Clear communication and collaboration. You're proactive
  about sharing your progress and asking for help when you
  need it. You understand that keeping the team aligned helps
  everyone succeed.
  
  A collaborative spirit. You find satisfaction in building
  high-quality software and you thrive in a team environment
  where you can learn from and help your peers.
  
  A security-conscious approach. You see security and safety
  as part of the job, not an afterthought.
  
  Bonus points for
  
  - Direct experience with Generative AI concepts, LLMs, or
    related personal or professional projects
  - Contributions to open-source projects or a portfolio that
    demonstrates your range
  - Experience working in highly regulated environments
  
  Our Tech Stack
  
  We work with Python, TypeScript, Go, and Java on the
  backend. Our frontend is built with TypeScript, React, and
  Next.js. We use Postgres for our database, run everything on
  Kubernetes (specifically Red Hat OpenShift), and our DevOps
  setup includes GitHub and CI/CD tools like Tekton and
  Harness.
  
  Our Team and Mission
  
  We're the Common Platform Engineering team for GenAI, a
  central group in the Chief Technology Office. We're a
  focused agile team that owns our work from idea to
  production.
  
  Our culture is built on a shared belief in engineering
  craftsmanship, backed by leadership that actually
  understands what that means. We're on a journey to prove
  what's possible inside a large organisation, and that means
  navigating some legacy while building the future. This isn't
  a role for someone who wants everything to be perfect on day
  one. It's for an engineer who wants to be part of the team
  that gets us there.
  
  We have a dual mission. First, we're building 'Citi Assist',
  the GenAI digital assistant for our colleagues. Second,
  we're providing the platforms and guidance that enable the
  entire organisation to adopt GenAI safely and effectively.
  
  This is not a typical banking job. We'll build foundational
  technology together that has a direct, positive impact on
  hundreds of thousands of people. We'll tackle big problems
  as a team, with executive support behind us. We'll shape our
  solutions collaboratively, learning from each other along
  the way. You'll have real autonomy in your work, but you'll
  never be on your own.
  
  What we’ll provide you
  
  This is a unique role that will put you in the position to
  be part of a new venture and actively drive change. Every
  day there will be new challenges that will help you develop
  new skills that can drive your career.
  
  By joining Citi London, you will not only be part of a
  business casual workplace with a hybrid working model (up to
  2 days working at home per week), but also receive a
  competitive base salary (which is annually reviewed), and
  enjoy a whole host of additional benefits such as:
  
  - 27 days annual leave (plus bank holidays)
  - A discretional annual performance related bonus
  - Private Medical Care & Life Insurance
  - Employee Assistance Program
  - Pension Plan
  - Paid Parental Leave
  - Special discounts for employees, family, and friends
  
  Visit our Global Benefits page to learn more.
  
  Alongside these benefits Citi is committed to ensuring our
  workplace is where everyone feels comfortable coming to work
  as their whole self, every day. We want the best talent
  around the world to be energized to join us, motivated to
  stay and empowered to thrive
  
