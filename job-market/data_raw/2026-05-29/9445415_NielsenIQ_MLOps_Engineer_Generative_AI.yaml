description: |
  Company Description
  
  NIQ is the world’s leading consumer intelligence company,
  delivering the most complete understanding of consumer
  buying behavior and revealing new pathways to growth. In
  2023, NIQ combined with GfK, bringing together the two
  industry leaders with unparalleled global reach. With a
  holistic retail read and the most comprehensive consumer
  insights—delivered with advanced analytics through state-of-
  the-art platforms—NIQ delivers the Full View™.
  
  Job Description
  
  The NIQ Innovation team is dedicated to exploring,
  evaluating, designing, and implementing cutting-edge
  solutions that leverage the latest technologies. Within
  Innovation, the Enablement Team plays a critical role in
  bringing Machine Learning (ML) and Artificial Intelligence
  (AI) solutions to production. This team is primarily
  composed of Software Engineers, ML Engineers, AI
  Specialists, and MLOps Engineers, acting as enablers to
  ensure robust engineering and deployment of advanced
  solutions.
  
  We foster a culture of continuous learning and technical
  excellence. Our team regularly organizes weekly study groups
  to share knowledge, enhance coding practices, and stay up to
  date with emerging tools and methodologies. Additionally, we
  document all proof-of-concepts (POCs) and research
  initiatives with a scientific and structured approach,
  ensuring transparency and reproducibility.
  
  Job Description / Job Responsibilities:
  
  We are seeking an experienced ML/ML Ops Engineer with 4+
  years of professional experience in software development to
  join our team. The ideal candidate has a strong foundation
  in software engineering principles, best practices, CI/CD
  pipelines implementation and knowledge of Object-Oriented
  Programming (OOP) fundamentals.
  
  As an MLOps Engineer, you will play a key role in
  developing, engineering, and maintaining high-quality
  software solutions, working on Machine Learning projects and
  some Agentic Pipelines that drive innovation across the
  organization.
  
  Key responsibilities:
  
  - Design and implement the pipelines for training and
    deployment of ML and AI models.
  - Create and maintain a scalable code to deliver AI/ML
    processes, responding to the user's requests in near real
    time.
  - Design dashboards to monitor a system.
  - Collect metrics and create alerts based on them.
  - Design and execute unit and performance tests.
  - Perform feasibility studies/analysis with a critical point
    of view.
  - Support and maintain (troubleshoot issues with data
    and applications).
  - Develop comprehensive technical documentation, including
    diagrams and manuals.
  - Tackle diverse software challenges, ensuring simplicity and
    maintainability in code design.
  - Contribute to architectural designs of large complexity and
    size, potentially involving several distinct software
    components.
  - Working closely with other engineers, data scientists and a
    variety of end-users (across diverse cultures) to ensure
    technical compatibility and user satisfaction.
  - Work as a member of a team, encouraging team
    building, motivation, and cultivating effective team
    relations.
  
  Qualifications
  
  Essential (E):
  
  - 4+ years of professional experience in software development
    and/or CI/CD pipeline development
  - Bachelor’s degree in Computer Science or related field.
  - Proficient in Python programming, with strong knowledge of
    OOP and unit testing.
  - Demonstrated experience and knowledge in Linux and Docker
    containers.
  - Experience with major cloud providers (Azure, GCP, or AWS).
  - Familiarity with ML/Ops technologies (e.g., Azure ML).
  - Experience building Agentic pipelines.
  - Experience designing monitoring dashboards (Grafana or
    similar).
  - Experience with container orchestrators (Kubernetes, Docker
    Swarm).
  - Experience with AI/ML frameworks (PyTorch, ONNX,
    TensorFlow).
  - Experience using collaborative development tools (Git,
    Confluence, Jira, etc.).
  - Problem-solving capabilities and strong analytical/logical
    thinking.
  - Self-driven, proactive attitude, resolutive, and team-
    oriented.
  - Ability to learn quickly and manage deadlines.
  - Agile development methodologies (SCRUM/KANBAN).
  - Excellent communication skills in English (written and
    spoken).
  
  Preferred (P):
  
  - Master’s degree in Computer Engineering or related
    discipline.
  - Experience with distributed systems.
  - Knowledge in Power BI.
  - Hands‑on experience building, fine‑tuning, or deploying ML
    models across domains such as Computer Vision, Natural
    Language Processing (NLP), and classical machine‑learning
    methods (e.g., Decision Trees).
  - Familiarity with modern foundation and open‑source model
    families such as Qwen, LLaMA, and other large language
    models (LLMs).
  
  Additional Information
  
  Our Benefits
  
  - Flexible working environment
  - Volunteer time off
  - LinkedIn Learning
  - Employee-Assistance-Program (EAP)
  
