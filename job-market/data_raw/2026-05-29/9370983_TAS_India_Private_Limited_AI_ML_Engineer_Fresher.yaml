  AI/ML & GenAI Enablement
  
  ·         Design and develop AI/ML models for prediction,
  anomaly detection, and optimization (e.g., Timeseries
  forecasting using TimeGPT, Scikit-learn, TensorFlow, etc.).
  
  ·         Implement and fine-tune GenAI solutions (ChatGPT,
  OpenAI APIs, LangChain, etc.) for use cases such as smart
  assistants, data summarization, document generation, code
  copilots, and more.
  
  ·         Build AI workflows for CMMS, SCADA, industrial
  edge devices, and dashboard intelligence.
  
  ·         Research and prototype AI agents tailored for
  industrial use cases.
  
  Full Stack & Backend Engineering-
  
  ·         Build scalable microservices using Python
  (FastAPI/Flask) or Node.js.
  
  ·         Design REST APIs to serve AI models and data
  pipelines.
  
  ·         Manage data ingestion from MQTT, REST, databases,
  and file-based sources.
  
  ·         Deploy models and services on AWS/Azure, Docker,
  or Kubernetes environments.
  
  Frontend & UX Involvement-
  
  ·         Develop intuitive dashboards or tools using
  React.js, Syncfusion, or similar libraries.
  
  ·         Create AI-powered UI features (e.g., natural
  language queries, AI-driven reports).
  
  ·         Collaborate with design teams to provide real-time
  AI results to users.
  
  
  
  Requirements
  
  ·        Strong Python programming experience (including
  Pandas, NumPy, Scikit-learn, TensorFlow, or PyTorch).
  
  ·         Solid experience with OpenAI, HuggingFace, or
  similar GenAI platforms.
  
  ·         Full-stack web development using React.js + REST
  APIs (Flask/FastAPI/Node.js).
  
  ·         Understanding of data pipelines, JSON processing,
  and data lake integrations (like S3/Athena).
  
  ·         Experience working with MQTT, industrial data
  protocols, or time-series databases is a plus.
  
  ·         Familiarity with tools like Git, Docker,
  Postgres/MongoDB, Redis, etc.
