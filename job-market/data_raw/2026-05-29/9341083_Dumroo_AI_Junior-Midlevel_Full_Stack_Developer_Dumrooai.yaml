description: |
  Job Title: Junior to Mid-Level Full Stack Software Developer
  
  Location: Remote (Must be available during U.S. Eastern
  Time: 8:00 AM – 5:00 PM EST)
  
  Type: Full-Time | Remote
  
  Reports to: Lead Engineer / Head of Product & Technology
  
  About Dumroo.ai
  
  Dumroo.ai is revolutionizing education with an AI-powered
  ecosystem that transcends traditional boundaries. Our
  intelligent platform unites teachers, students,
  administrators, and parents, empowering each stakeholder to
  achieve their best while fostering transparency and
  engagement. We are looking for a talented Junior-Midlevel
  Developer to join our growing team and contribute to the
  development of our cutting-edge educational technology
  solutions.
  
  Position Overview
  
  As a Junior-Midlevel Developer at Dumroo.ai, you will be
  responsible for building, maintaining, and enhancing our AI-
  powered platform. You will collaborate with cross-functional
  teams to develop innovative features, ensure high
  performance, and contribute to the overall success of our
  technology stack.
  
  Key Responsibilities
  
  - Collaborate with the engineering and product teams to build,
    test, and deploy software components and APIs.
  - Work on data pipelines, integrations, and backend systems
    powering our AI-driven workflows.
  - Contribute to development of features using machine learning
    models and LLMs.
  - Write clean, maintainable, and well-documented code.
  - Participate in code reviews, sprint planning, and daily
    stand-ups.
  - Work closely with DevOps and QA teams to ensure high system
    performance and reliability.
  
  Requirements
  
  Required Qualifications
  
  - 2–5 years of hands-on software development experience.
  - Proficiency in JavaScript/TypeScript, Python, or Node.js.
  - Experience working with databases such as PostgreSQL,
    MongoDB, or Redis.
  - Familiarity with data engineering concepts: ETL pipelines,
    data transformation, API integration.
  - Exposure to machine learning/AI concepts, especially LLMs,
    NLP, or predictive analytics.
  - Experience with Git and Agile workflows.
  - Excellent communication and collaboration skills.
  - Must be available to work in U.S. Eastern Time Zone (8 AM –
    5 PM EST).
  
  Preferred Qualifications
  
  - Experience with cloud platforms (AWS, GCP, or Azure).
  - Knowledge of AI tools like OpenAI, LangChain, or
    HuggingFace.
  - Familiarity with REST APIs, GraphQL, or WebSocket.
  - Startup or edtech experience is a plus.
  
  Benefits
  
  What We Offer
  
  - Opportunity to work on impactful technology that improves
    education.
  - A collaborative and inclusive remote work environment.
  - Learning opportunities in AI, product development, and
    scaling systems.
  - Competitive compensation with potential for equity for the
    right candidate.
