title: Sr Associate AI Full stack Software Engineer
company: CoverMyMeds
location: USA
work_type: FULL_TIME
description: |
  McKesson is an impact-driven, Fortune 10 company that
  touches virtually every aspect of healthcare. We are known
  for delivering insights, products, and services that make
  quality care more accessible and affordable. Here, we focus
  on the health, happiness, and well-being of you and those we
  serve – we care.
  
  What you do at McKesson matters. We foster a culture where
  you can grow, make an impact, and are empowered to bring new
  ideas. Together, we thrive as we shape the future of health
  for patients, our communities, and our people. If you want
  to be part of tomorrow’s health today, we want to hear from
  you.
  
  We are seeking a highly skilled and experienced Sr.
  Associate AI Full stack Software Engineer to join our
  innovative team. This role will be responsible for
  designing, developing, and deploying end-to-end AI-powered
  software solutions, from front-end user interfaces to back-
  end services and AI model integration, within the healthcare
  domain.
  
  
  
  Responsibilities
  
  - Develop and deliver AI-driven enterprise quality software
    applications.
  - Build scalable applications integrating Large Language
    Models and other AI tools (e.g. voice recognition,
    document parsing, image parsing, text to speech, RAG) into
    new and legacy codebases
  - Design and optimize data pipelines and datasets for AI
    system development and testing.
  - Communicate modern AI concepts (LLMs, vector databases etc.)
    to non-technical audiences
  - Iteratively craft effective prompts to maximize LLM
    performance and implement prompt caching strategies
  - Maintain prompt libraries & benchmark performance
  - Fine-tune & serve GPT-family, Llama
  - Develop AI agents Semantic Kernel
  - Prototype co-pilot experiences & autonomous workflows
  - Fully document all work at both the code level and
    application level.
  - The ability to learn and adapt in a changing environment.
  - Collaborate with other staff and outside stakeholders on
    large projects.
  - Must be passionate about creating solutions and solving
    complex problems.
  
  
  
  Priority will be given to candidates who reside in the
  Columbus, OH metropolitan area.
  
  We are unable to provide sponsorship for this role presently
  or in the future.
  
  
  Minimum Qualifications
  
  - Minimum 2+ years of experience in Software development.
  - B.S. degree in Computer Science or related engineering
    discipline, or equivalent experience
  
  Critical Skills
  
  - 2+ years of experience developing AI-powered applications
    using LLMs, voice, image, or speech models
  - Experience with AI evaluation metrics (precision, recall,
    F1, AUC) and MLOps for scalable deployment
  - Proven ability to build RAG solutions using
    LangChain/LlamaIndex and vector databases
  - Strong experience with LLM optimization techniques
    (prompting, caching, cost awareness)
  - Proficiency in Python and AI/ML frameworks (OpenAI,
    TensorFlow, PyTorch)
  - Full-stack development experience, including Node.js
    (Express)
  - Experience with cloud platforms (AWS, GCP, or Azure)
  - Experience with modern DevOps tools (Git, Docker,
    Kubernetes)
  - Strong analytical/problem-solving skills to derive insights
    from data
  
  
  
  Preferred Skills
  
  - Deep understanding of LLM model landscape (e.g., GPT
    variants, emerging models)
  - Experience with advanced LLM cost optimization techniques
    (batching, quantization)
  - Experience using AI coding assistants (GitHub Copilot,
    Cursor, Codeium/Windsurf)
  - Healthcare domain experience and ability to translate
    clinical/business needs into AI solutions
  - Strong cross-functional communication skills across
    technical and non-technical stakeholders
  
  
  
