  Job Description
  
  JOB TITLE: Lead Engineer – Advanced AI Engineering
  
  SALARY: £69,624 - £105,000 depending on location and
  experience
  
  LOCATION: Bristol, Edinburgh, Leeds, London or Manchester
  
  WORKING PATTERN: Our work style is hybrid, which involves
  spending at least two days per week, or 40% of our time, at
  our office location.
  
  
  
  About this Opportunity 
  
  We are looking for Lead Engineers to join our new Advanced
  AI Engineering team. You will combine applied research and
  solution development to create effective solutions to
  critical AI business challenges, building operational MVPs
  that our engineering teams can scale out across the Group’s
  business areas.
  
  You will be working within the Data & AI Unit of the Chief
  Technology Office (CTO), where we define and lead the
  Group’s Data and AI technology strategy, serve as the
  Group’s design authority for Data and AI, and inspire,
  develop and incubate new AI‑driven products, capabilities
  and ways of working through applied research and product
  discovery.
  
  These are hands-on roles, working at the forefront of
  Agentic AI adoption, which will draw upon your curiosity and
  problem-solving abilities, your experience building and
  supporting technology solutions within production
  environments, and your knowledge of GenAI technology.
  
  Day to day, you will:
  
  - Support ideation activities, working with team members and
    business stakeholders to explore the art of the possible
    and identify areas of challenge and opportunity
  
  - Evaluate AI methods and technologies, conducting experiments
    and building proof-of-concepts
  
  - Develop operational MVPs and support their delivery to
    business platforms and engineering teams
  
  Why Lloyds Banking Group
  
  If you think all banks are the same, you’d be wrong. We’re
  an innovative, fast-changing business that’s shaping finance
  as a force for good. A bank that’s empowering its people to
  innovate, explore possibilities and grow with purpose.
  
  What you’ll need
  
  - Proven experience engineering technology solutions in
    complex environments and supporting production operations
  
  - Applied AI/ML and GenAI experience with knowledge of
    established patterns (RAG, tool use, guardrails,
    evaluation, agents) and an ability to evaluate tools and
    approaches
  
  - Experience of working in teams employing agile practices and
    using modern SDLC tooling
  
  - A solid understanding of requirements for managing
    operational and AI risk in a regulated environment,
    including reliability, security, safety and explainability
  
  - Ability to collaborate as part of a high-performing
    engineering team – mentoring and supporting others and
    engaging stakeholders on technical direction
  
  Desirable:
  
  - Experience delivering technology solutions in regulated
    industries (financial services preferred)
  
  - Experience of research, either in industry or as part of an
    advanced degree
  
  - Experience developing technology solutions for customer-
    facing platforms at scale (digital apps, contact
    centre/voice, colleague tooling)
  
  - Experience of partnering with Enterprise Architecture
    functions
  
  
  
