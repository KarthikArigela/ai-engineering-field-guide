description: |
  AI Automation Engineer
  
  $200K – $230K • meaningful equity
  
  About Novig
  
  Novig is building America's #1 sports prediction market. Our
  mission is to financialize and democratize sports trading -
  taking a closed system run by casinos and turning it into a
  fair, efficient, two-sided market where the power sits with
  users.
  
  With CFTC approval on the horizon, we're poised to go live
  across all 50 states as the leading sports-focused,
  federally regulated market built on trust, transparency, and
  real user protection.
  
  We're backed by some of Silicon Valley's top investors —
  Pantera, Forerunner, Lux, NFX, Paul Graham, and Joe Montana
  — who have collectively invested over $100M behind this
  vision.
  
  About the Role
  
  This is the role for someone who sees AI as a multiplier and
  knows how to build the infrastructure that makes it work.
  You'll design the systems that let AI write, test, and ship
  code with minimal human intervention — and make sure those
  systems are airtight in production. Beyond the technical
  build, you'll embed yourself across the company, surfacing
  opportunities for automation, developing frameworks that
  raise the floor for everyone, and being the person teammates
  turn to when they want to understand what AI can do for
  them.
  
  Who you are and what you will do
  
  - Architect and develop advanced CI/CD workflows that support
    autonomous development loops
  - Own end-to-end pipeline reliability, including deployment
    validation, observability, and feedback systems for AI-
    driven code iteration
  - Collaborate cross-functionally with engineering, product,
    and operations teams to identify opportunities for AI-
    driven automation and tooling
  - Develop internal “skills” and tooling frameworks to enhance
    productivity across engineering and other teams within the
    organization
  - Continuously improve system performance, accuracy, and
    safety of AI-assisted workflows in production environments
  - Be the person who shows the rest of the company what's
    possible with AI — running internal demos, writing up
    learnings, and lowering the barrier for teammates to use
    AI in their day-to-day work
  
  Why work here, in the words of the people who do
  
  “I work with extremely stellar people, I own real systems,
  and decisions happen fast. No politics, no waiting for
  needless red tape. If something's broken, I fix it. If I
  build something good, it ships.”
  
  “The people! They're smart, thoughtful, fun to work with and
  passionate about their craft.”
  
  “I'm having the most fun I've had in my entire career.”
  
  If you want responsibility, trust, and the chance to help
  build the future of sports prediction markets - take your
  shot, we’d love to connect.
  
  Not for everyone
  
  - Our work is tied to live sports - that means potential
    nights, weekends, and pressure included.
  - If you need clear swim lanes, a heavy process, or someone to
    tell you what to do, this won’t be the right environment.
  
  Compensation & benefits
  
  - $200K – $230K base, benchmarked at top-tier tech companies
  - Meaningful equity for every employee, regardless of role
  
  - 100% health premiums covered
  - 99% dental & vision covered
  - 401(k) with 4% company match
  - HSA + $1,080 annual company contribution
  - $27/day lunch stipend when working from our NYC office
  - $35/day dinner stipend when working from the NYC office
    after 6:30pm
  
  Homebase
  
  Union Square, NYC In-person 4 days a week because we
  genuinely like being around each other.
