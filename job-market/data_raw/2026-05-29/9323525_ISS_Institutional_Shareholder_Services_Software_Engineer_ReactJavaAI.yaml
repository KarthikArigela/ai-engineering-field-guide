  About ISS STOXX
  
  ISS STOXX GmbH is a leading provider of research and
  technology solutions for the financial market. Established
  in 1985, we offer top-notch benchmark and custom indices
  globally, helping clients identify investment opportunities
  and manage portfolio risks. Our services cover corporate
  governance, sustainability, cyber risk, and fund
  intelligence. Majority-owned by Deutsche Börse Group, ISS
  STOXX has over 3,400 professionals in 33 locations
  worldwide, serving around 6,400 clients, including
  institutional investors and companies focused on ESG, cyber,
  and governance risk. Clients trust our expertise to make
  informed decisions for their stakeholders' benefit.
  
  Founded in 1985 as Institutional Shareholder Services (ISS)
  Inc., ISS Governance is a leading global provider of
  independent and objective shareholder meeting research and
  recommendations, providing multiple voting policy choices as
  well as end-to-end workflow solutions for institutional
  investors. More than 1,600 clients worldwide utilize ISS
  Governance’s actionable expertise to help them make informed
  investment stewardship decisions, and to help them manage
  their voting responsibilities. Covering over 50,000 meetings
  annually, ISS Governance leverages its extensive global
  footprint, deep experience, high quality data and analysis,
  unified client support, and technology infrastructure to
  continuously evolve and extend its innovative suite of
  solutions to meet clients’ evolving portfolio, fiduciary,
  and stewardship requirements.
  
