  applications using Java, React, and Agentic AI to enable
  rapid processing of high-volume transactions.
  
  Responsibilities:
  
  - Build high-quality web applications using React.
  - Develop and maintain Java / Spring Boot REST APIs
  - Contribute to integrating AI/LLM-powered agents that
    automate workflows and enhance product capabilities
  - Collaborate with the team on system architecture and UI,
    API, and database design
  - Work with GitHub, CI/CD pipelines, and cloud-ready
    components
  
  Qualification:
  
  - 3+ years of progressive application development experience.
  - 2+ years of experience with Java (Spring Boot preferred)
  - 1+ year building modern UIs with React.
  - Exposure to AI Agents (Copilot, Claude etc.) for code
    generation/testing/review.
  - Strong fundamentals in OOP, problem solving, and clean code
    practices
  - Experience designing, building and using REST APIs
  - Familiarity with GitHub, modern IDEs (Eclipse/IntelliJ), and
    frontend basics (HTML/CSS)
  
  Good to have:
  
  - Experience with SQL databases (Oracle, SQL Server)
  - Cloud exposure (AWS, Azure or GCP)
  - Testing frameworks (JUnit, Selenium, Cypress)
  - Understanding of security best practices (OWASP),
    performance tuning, and design patterns
  
  Why Join Us:
  
  - Be part of a mission-driven company influencing corporate
    governance worldwide
  - Work with a modern, evolving tech stack
  - Learn and grow in a collaborative, high-quality engineering
    environment
  - Experience and influence architecture and design decisions
    to build large, complex systems.
  
