description: |
  HPC/AI systems engineer
  
  
  
  This role has been designed as ‘’Onsite’ with an expectation
  that you will primarily work from an HPE office.
  
  Who We Are:
  
  Hewlett Packard Enterprise is the global edge-to-cloud
  company advancing the way people live and work. We help
  companies connect, protect, analyze, and act on their data
  and applications wherever they live, from edge to cloud, so
  they can turn insights into outcomes at the speed required
  to thrive in today’s complex world. Our culture thrives on
  finding new and better ways to accelerate what’s next. We
  know varied backgrounds are valued and succeed here. We have
  the flexibility to manage our work and personal needs. We
  make bold moves, together, and are a force for good. If you
  are looking to stretch and grow your career our culture will
  embrace you. Open up opportunities with HPE.
  
  Job Description:
  
  
  
  In the HPE Hybrid Cloud, we lead the innovation agenda and
  technology roadmap for all of HPE. This includes managing
  the design, development, and product portfolio of our next-
  generation cloud platform, Green Lake. Working with
  customers, we help them reimagine their information
  technology needs to deliver a simple, consumable solution
  that helps them drive their business results. Join us
  redefine what’s next for you.
  
  Job Family Definition:
  
  Designs, develops, troubleshoots and debugs software
  programs for software enhancements and new products.
  Develops software including operating systems, compilers,
  routers, networks, utilities, databases and Internet-related
  tools. Determines hardware compatibility and/or influences
  hardware design.
  
  Management Level Definition:
  
  Contributions impact technical components of HPE products,
  solutions, or services regularly and sustainable. Applies
  advanced subject matter knowledge to solve complex business
  issues and is regarded as a subject matter expert. Provides
  expertise and partnership to functional and technical
  project teams and may participate in cross-functional
  initiatives. Exercises significant independent judgment to
  determine best method for achieving objectives. May provide
  team leadership and mentoring to others.
  
  What you will do:
  
  - Leads multiple project teams of other software systems
    engineers and internal and outsourced development partners
    responsible for all stages of design and development for
    complex products and platforms, including solution design,
    analysis, coding, testing, and integration.
  - Manages and expands relationships with internal and
    outsourced development partners on software systems design
    and development.
  - Reviews and evaluates designs and project activities for
    compliance with systems design and development guidelines
    and standards; provides tangible feedback to improve
    product quality and mitigate failure risk.
  - Provides domain-specific expertise and overall software
    systems leadership and perspective to cross-organization
    projects, programs, and activities.
  - Drives innovation and integration of new technologies into
    projects and activities in the software systems design
    organization.
  - Provides guidance and mentoring to less- experienced staff
    members.
  
  What you need to bring:
  
  - Bachelor's or Master's degree in Computer Science,
    Information Systems, or equivalent.
  - Typically 8-15 years experience.
  
  Knowledge and Skills:
  
  - Extensive experience with multiple software systems design
    tools and languages specially in distributed systems.
  - Experience in HPC/AI networking domain
  - Modelling & creating POCs experience is needed
  - Excellent analytical and problem solving skills.
  - Experience in overall architecture of software systems for
    products and solutions.
  - Designing and integrating software systems running on
    multiple platform types into overall architecture.
  - Excellent written and verbal communication skills; mastery
    in English and local language. Ability to effectively
    communicate product architectures, design proposals and
    negotiate options at senior management levels.
  
  Additional Skills:
  
  Cloud Architectures, Cross Domain Knowledge, Design
  Thinking, Development Fundamentals, DevOps, Distributed
  Computing, Microservices Fluency, Full Stack Development,
  Security-First Mindset, Solutions Design, Testing &
  Automation, User Experience (UX)
  
  What We Can Offer You:
  
  Health & Wellbeing
  
  We strive to provide our team members and their loved ones
  with a comprehensive suite of benefits that supports their
  physical, financial and emotional wellbeing.
  
  Personal & Professional Development
  
  We also invest in your career because the better you are,
  the better we all are. We have specific programs catered to
  helping you reach any career goals you have — whether you
  want to become a knowledge expert in your field or apply
  your skills to another division.
  
  Unconditional Inclusion
  
  We are unconditionally inclusive in the way we work and
  celebrate individual uniqueness. We know varied backgrounds
  are valued and succeed here. We have the flexibility to
  manage our work and personal needs. We make bold moves,
  together, and are a force for good.
  
  Let's Stay Connected:
  
  Follow @HPECareers on Instagram to see the latest on people,
  culture and tech at HPE.
  
