description: |
  Let’s face it, a company whose mission is human
  transformation better have some fresh thinking about the
  employer/employee relationship.
  
  We do. We can’t cram it all in here, but you’ll start
  noticing it from the first interview.
  
  Even our candidate experience is different. And when you get
  an offer from us (and accept it), you get way more than a
  paycheck. You get a personal BetterUp Coach, a development
  plan, a trained and coached manager, the most amazing team
  you’ve ever met, and most importantly, work that matters.
  
  Join us and we promise you the most intense and fulfilling
  years of your career, doing life-changing work in a fun,
  inventive, soulful culture.
  
  If that sounds exciting—and the job description below feels
  like a fit—we really should start talking.
  
  We are a hybrid company with a focus on in-person
  collaboration when necessary. Employees are expected to be
  available to work from one of our office hubs at least two
  days per week, or eight days per month. Our US hub locations
  include: Austin, TX; New York City, NY; San Francisco, CA;
  and the Washington, DC metro area. Please ensure you can
  realistically commit to this structure before applying.
  
  The Opportunity
  
  BetterUp’s GTM Data & Operations team is investing in the
  infrastructure, intelligence, and automation that powers our
  go-to-market engine. As an AI / Data Engineer (P3), you will
  sit at the intersection of data engineering and applied
  AI—building the pipelines, models, and systems that help our
  Sales, Marketing, and Customer Success teams move faster,
  make smarter decisions, and drive measurable business
  impact. This is a high-impact role for someone who thrives
  when technology and strategy meet.
  
  What You’ll Do
  
  Data Engineering & Infrastructure
  
  - Design, build, and maintain scalable data pipelines that
    serve clean, reliable data across the GTM stack.
  - Own and evolve our data warehouse architecture (Snowflake)
    to support GTM analytics, reporting, and AI workloads.
  - Establish and enforce data quality standards, documentation
    practices, and governance frameworks to ensure trustworthy
    data at scale.
  - Develop and maintain dbt models, SQL transformations, and
    Python scripts that power self-serve reporting and
    downstream analysis.
  - Define and track key GTM metrics, ensuring consistent
    definitions and reliable data pipelines that support
    executive and board-level reporting.
  
  Applied AI for GTM
  
  - Develop and deploy AI tools for high-impact GTM use cases
    including lead scoring, pipeline forecasting, churn
    prediction, and customer segmentation.
  - Partner with Sales, Marketing, and RevOps stakeholders to
    identify where AI can automate workflows, surface
    insights, and unlock new capacity.
  - Integrate LLMs and generative AI tooling into GTM systems to
    streamline operations and accelerate decision-making.
  - Measure and iterate on created systems, translating outputs
    into actionable tools that are accessible to non-technical
    stakeholders.
  - Lead cross-functional efforts to integrate AI into core GTM
    workflows, ensuring adoption across direct and neighboring
    teams.
  - Coach teammates through AI adoption, helping them build new
    capabilities and overcome resistance to change.
  
  If You Have Some or All of the Following, Please Apply
  
  Required
  
  - 3–5 years of experience in data engineering, analytics
    engineering, GTM engineering or applied AI roles.
  - Strong proficiency in Python and SQL.
  - Experience building and maintaining data pipelines, reverse
    ETL workflows and working with modern cloud data
    warehouses (Snowflake, BigQuery, or Redshift).
  - Familiarity with agentic coding tools (Claude Code, Cursor,
    etc.).
  - Familiarity with GTM tools and ecosystems (Salesforce,
    Hubspot, Clay, etc.).
  - Demonstrated ability to build and deploy models (lead
    scoring, forecasting, classification) in a business
    context.
  - Experience integrating data and AI into CRM and/or marketing
    automation platforms (Salesforce, HubSpot, Marketo, etc.).
  - Familiarity with BI tools such as Looker or Hex for
    dashboard development and self-serve analytics.
  - Familiarity with software engineering principles and tools
    (version control, CI/CD, testing, code review, Github
    etc.)
  - Systems-level thinking with the ability to trace data and
    logic across multiple platforms (e.g., HubSpot →
    Salesforce → Snowflake → BI layer) and understand how
    changes in one system ripple across the stack.
  - Strong communication skills with the ability to translate
    complex technical work into business impact.
  - Bachelor’s degree in Computer Science, Data Science,
    Engineering, or a related field—or equivalent practical
    experience.
  
  Preferred
  
  - Prior experience in a Revenue Operations or GTM Analytics
    function at a B2B SaaS company.
  - Hands-on experience building with LLMs or deploying
    generative AI solutions in a production environment.
  - Hands-on experience with decoupled or "headless" semantic
    layers (Cube, Snowflake Cortex etc.)
  - Track record of working in a high-growth startup or scale-up
    environment where priorities evolve quickly.
  - Hands-on experience with dbt for data transformation.
  
  AI at BetterUp
  
  Our team thrives at the intersection of human expertise and
  AI capability. As an AI-forward company, adaptation and
  continuous learning are part of our daily work. We’re
  looking for teammates who are excited to evolve alongside
  technology—people who experiment boldly, share their
  discoveries openly, and help define best practices for AI-
  augmented work.
  
  As an AI / Data Engineer, you will be expected to:
  
  - Lead cross-functional efforts to integrate AI into core GTM
    workflows, ensuring adoption across direct and neighboring
    teams.
  - Set measurable AI improvement objectives based on functional
    strategy with minimal manager direction.
  - Ensure failed AI experiments generate documented learnings
    that inform future decisions and prevent rework.
  - Make decisions about AI processes and tools that impact your
    direct team, neighboring teams, and cross-functional
    partners.
  - Re-architect team processes to incorporate AI at
    scale—automated reporting, intelligent workflow routing,
    systems building.
  
  During our interview process, you’ll have opportunities to
  showcase how you harness AI to learn, iterate, and amplify
  your impact. We encourage all candidates to share examples
  of how they’ve used AI tools in their work.
  
  Benefits
  
  At BetterUp, we are committed to living out our mission
  every day and that starts with providing benefits that allow
  our employees to care for themselves, support their
  families, and give back to their community.
  
  - Access to BetterUp coaching; one for you and one for a
    friend or family member
  - A competitive compensation plan with opportunity for
    advancement
  - Medical, dental, and vision insurance
  - Flexible paid time off
  - All federal/statutory holidays observed
  - 4 BetterUp Inner Work Days
  - 5 Volunteer Days to give back
  - Learning and Development stipend
  - Company wide Summer & Winter breaks
  - Year-round charitable contribution of your choice on behalf
    of BetterUp
  - 401(k) self contribution
  
  We are dedicated to building diverse teams that fuel an
  authentic workplace and sense of belonging for each and
  every employee. We know applying for a job can be
  intimidating, please don’t hesitate to reach out—we
  encourage everyone interested in joining us to apply.
  
