description: |
  Morningstar DBRS is a leading provider of independent credit
  rating services and opinions for corporate and sovereign
  entities, financial institutions, and project and structured
  finance instruments globally. Rating more than 4,500 issuers
  and 68,000 securities, we are one of the top four credit
  rating agencies in the world and a market leader in Canada,
  the U.S., and Europe in multiple asset classes. For 50
  years, Morningstar DBRS has been committed to bringing
  greater transparency and a much-needed diversity of opinion
  in the credit rating industry. Our nimble approach combined
  with Morningstar's global scale and resources enable us to
  respond to customers' needs in their local markets while
  also empowering investor success worldwide. Market
  innovators choose to work with us because of our agility,
  tech-forward approach, and exceptional customer service.
  Visit dbrs.morningstar.com/careers to learn more. The Role:
  We are seeking a Senior Software Engineer to enable AI
  adoption across the Morningstar DBRS group. This role also
  includes developing new systems as well as maintaining and
  enhancing existing applications. The ideal candidate has
  experience building AI agents and commercial-grade, web-
  based applications. You will work with other engineers to
  develop AI agents, MCP servers, and APIs and to modernize
  the platform to deliver leading product experiences. You
  will also help prioritize work to meet project goals. This
  position is based in our Mumbai office. Responsibilities
  
  - Build and maintain AI agents using Microsoft Copilot Studio
    or similar tools and enable teams across Morningstar DBRS
    to build AI agents.
  - Build and maintain AI-based applications in the cloud using
    AWS Bedrock and related AWS services.
  - Build end-to-end web applications with Python for the back
    end using GitHub Copilot or Claude Code
  - Help establish AI standards and practices to enable faster,
    reliable adoption across the group.
  - Use an Agile approach to iteratively deliver enhancements
    and new functionality.
  - Stay up to date on emerging technologies and industry best
    practices.
  - Build secure, reusable code and follow best practices for
    object-oriented design and continuous
    integration/continuous deployment (CI/CD).
  
  Requirements
  
  - Bachelor's degree in computer science or an engineering
    field; a graduate degree is preferred.
  - At least five years of programming experience.
  - Experience with AI tools and frameworks such as Microsoft
    Copilot Studio and AWS Bedrock.
  - Understanding of Retrieval-augmented generation (RAG),
    vector databases, and MCP development.
  - Experience with Python, SQL/NoSQL databases, and AWS.
  - Experience of using GitHub Copilot or Claude Code for as an
    AI assistant during software development.
  - Understanding of Continuous Integration (CI); experience
    with tools such as Jenkins or Harness is a plus.
  - Drive continuous improvement by delivering initiatives that
    improve performance, processes, and controls.
  - Experience with distributed computing and cloud platforms is
    a plus.
  - Experience with source code management using Git is a plus.
  - Experience working in an Agile team environment.
  - Strong coding and documentation habits, with the ability to
    build and maintain enterprise-grade applications.
  - Ability to make thoughtful recommendations on analysis,
    design, implementation, and troubleshooting.
  - Strong written and verbal communication skills in English.
  - Proven ability to perform in a demanding environment with a
    flexible attitude.
  
  Morningstar is an equal opportunity employer. Morningstar's
  hybrid work environment gives you the opportunity to
  collaborate in-person each week as we've found that we're at
  our best when we're purposely together on a regular basis.
  In most of our locations, our hybrid work model is four days
  in-office each week. A range of other benefits are also
  available to enhance flexibility as needs change. No matter
  where you are, you'll have tools and resources to engage
  meaningfully with your global colleagues.
