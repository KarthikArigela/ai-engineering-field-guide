description: |
  Job Description
  
  At EisnerAmper, we look for individuals who welcome new
  ideas, encourage innovation, and are eager to make an
  impact. Whether you’re starting out in your career or taking
  your next step as a seasoned professional, the EisnerAmper
  experience is one-of-a-kind. You can design a career you’ll
  love from top to bottom – we give you the tools you need to
  succeed and the autonomy to reach your goals.
  
  Join the EisnerAI team, a fast-growing organization within
  EisnerAmper that is redefining how professional services
  harness the power of Artificial Intelligence. As an AI
  Engineer specializing in MLOps and AIOps, you will play a
  critical role in deploying, operating, and optimizing
  enterprise-grade AI solutions built on Azure, collaborating
  closely with AI Developers, Product Owners, Governance
  leaders and Cloud Architects to ensure these systems are
  reliable, scalable, and cost-effective across tax, audit,
  advisory, and client-facing applications. This role goes
  beyond traditional DevOps—it’s about engineering AI into the
  fabric of enterprise operations, enabling secure,
  observable, and governed machine learning deployments that
  deliver real business impact.
  
  What it Means to Work for EisnerAmper:
  
  - You will get to be part of one of the largest and fastest
    growing accounting and advisory firms in the industry
  - You will have the flexibility to manage your days in support
    of our commitment to work/life balance
  - You will join a culture that has received multiple top
    “Places to Work” awards
    - We believe that great work is accomplished when cultures,
      ideas and experiences come together to create innovative
      solutions
    - We understand that embracing our differences is what unites
      us as a team and strengthens our foundation
    - Showing up authentically is how we, both as professionals
      and a Firm, find inspiration to do our best work
  
  What Work You Will be Responsible For:
  
  - Deploy and monitor AI models across Azure services with
    robust telemetry for performance, drift, and availability.
  - Manage model upgrades including APIs and UIs with structured
    rollout, version control, and rollback support.
  - Optimize performance and cost through testing, profiling,
    and tuning of inference infrastructure and pipelines.
  - Implement MLOps pipelines for continuous integration,
    deployment, and lifecycle management using Azure ML and
    GitHub Actions.
  - Ensure compliant change management for all AI-related
    deployments, with auditability, security, and governance
    controls.
  
  Basic Qualifications
  
  - Bachelor's degree in Computer Science, Engineering, Data
    Science, or related technical field
  - 3+ years in MLOps and/or AIOps, ideally within Azure cloud
    environment with hands-on experience with Azure ML,
    Synapse, Data Lake, App Services, Cosmos DB, and Azure AI
    Foundry
  
  Preferred/Desired Qualifications
  
  - Consulting background with a strong bias for action.
  - Workflow Design: Prompt flow, automation pipelines, and
    human-in-the-loop systems
  - Post-Training Techniques: Fine-tuning, instruction tuning,
    RLHF, and domain adaptation
  - Azure DevOps, App Insights, Log Analytics, Key Vault, and
    Managed Identity integration.
  - Tools for inference performance testing and profiling (e.g.,
    locust, K6, or custom scripts).
  - Model Evaluation: Performance metrics, benchmark
    development, and A/B testing frameworks
  - Understanding of model observability, telemetry, and
    incident response for AI systems.
  
  About EisnerAmper:
  
  EisnerAmper is one of the largest accounting, tax, and
  business advisory firms, with approximately 450 partners and
  5000 employees across the world. We combine responsiveness
  with a long-range perspective; to help clients meet the
  pressing issues they face today and position them for
  success tomorrow.
  
  Our clients are enterprises as diverse as sophisticated
  financial institutions and start-ups, global public firms,
  and middle-market companies, as well as high net worth
  individuals, family offices, not-for-profit organizations,
  and entrepreneurial ventures across a variety of industries.
  We are also engaged by the attorneys, financial
  professionals, bankers, and investors who serve these
  clients.
  
  About EisnerAmper India:
  
  EisnerAmper (India) Consultants Pvt. Ltd. (“EA India”) is a
  subsidiary of Eisner Advisory Group LLC (“EA Group”), which
  practices in an alternative practice structure with
  EisnerAmper LLP.  EA India employees provide advisory
  services to clients of EA Group and audit services to
  clients of Eisner Amper LLP and comply with the professional
  standards applicable to each of EA India, EA Group and
  EisnerAmper LLP.  EA India employees also provide
  operational services to EA Group and EisnerAmper LLP.  The
  policies and procedures of EA India, including obligations
  of confidentiality and non-disclosure, apply to all services
  provided by EA India employees.  All applicants are applying
  to positions for employment with EA India, and not EA Group
  or EisnerAmper LLP.
  
  EA India opened its first office in Mumbai in 2007. Over the
  years, our India footprint has expanded to include offices
  in Bangalore, Hyderabad, and Ahmedabad. We are a culturally
  diverse pool of over 900 professionals supporting our global
  clientele from a range of startups to Fortune 500 entities.
  
  Should you need any accommodations to complete this
  application please email: india.recruiting@eisneramper.com
  
  Preferred Location:
  
  Mumbai
