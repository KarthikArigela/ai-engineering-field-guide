job_id: 9472213
title: AI Engineer
company: Canadian National Railway Company
location: USA
remote: true
work_type: FULL_TIME
description: |
  AI Engineer will design and deliver AI based solutions for a
  web based workflow application for the Federal Government.
  You will learn customer business workflows, refine business
  use cases that can leverage AI enablement and build cutting-
  edge AI solutions that directly result in productivity
  increase, enhanced user experience and cost savings. You
  will work with cross-functional teams to develop AI-enabled
  features, build Proof of Concept (POC) for agentic solutions
  and translate it into Production Ready systems. You will
  utilize latest AI tools to develop AI chatbots, Agentic
  workflows, intelligent dashboards and application
  assistants.
  
  
  
  ESSENTIAL REQUIREMENTS
  
  - The ability to obtain, maintain and access classified
    information at the client level.
  - 5+ years of experience with software implementation across
    all aspects of the SDLC
  - 1+ years hands-on experience developing generative AI / LLM-
    powered applications
  - Expert-level proficiency in Python; strong JavaScript
    proficiency
  - Experience with RESTful APIs and integrating AI/LLM APIs
    (OpenAI, Bedrock)
  - Experience with prompt engineering techniques (few-shot,
    chain-of-thought, system prompts)
  - Experience with LLM orchestration frameworks such as
    LangGraph, Agno, CrewAI, or similar
  - Experience with RAG architectures, agentic patterns, and
    vector databases
  - Strong understanding of ML fundamentals
    (supervised/unsupervised learning, model evaluation,
    feature engineering, NLP)
  - Experience with data analysis and ML libraries (pandas,
    NumPy, scikit-learn, or equivalent)
  - Experience with containerization (Docker) and at least one
    major cloud platform (AWS, Azure, or GCP)
  - Proficiency with Git version control and CI/CD pipelines
  - Strong written and verbal communication skills
  
  
  
  Preferred:
  
  - Experience with vector databases (OpenSearch, pgvector) and
    embedding models
  - Experience with AWS GovCloud, AWS Bedrock, or Azure OpenAI
    Service
  
  KEY DUTIES AND RESPONSIBILITIES
  
  Essential Duties and responsibilities include the following.
  Other duties may be assigned.
  
  - Design and develop AI-enabled features for web-based
    workflow applications using LLMs, GenAI, and agentic AI
    patterns
  
  - Build RAG pipelines using application data, policy
    documents, user manuals, help cards and business process
    publications.
  - Implement agentic workflows using orchestration frameworks
    (LangGraph, Agno, Haystack, CrewAI) for AI based
    application assistants.
  - Implement prompt engineering strategies and integrate AI/LLM
    APIs (OpenAI, Bedrock).
  - Architect full-stack AI features with reliable API
    integrations, error handling, and graceful degradation.
  - Establish LLM observability (cost, latency, quality) and
    responsible AI guardrails (hallucination detection, output
    validation, CUI safeguards).
  - Maintain full-stack applications (including Web Application
    development using modern technologies such as React,
    TypeScript, NodeJS, Python and Java)
  - Address security vulnerabilities and ensure compliance with
    cybersecurity standards.
  - Participate in code reviews, CI/CD pipelines, and
    collaborative development workflows.
  - Document technical implementations and stay current with AI
    and ML developments.
  
  
  
  EDUCATION AND EXPERIENCE
  
  Bachelor’s degree in Computer Science, Data Science,
  Mathematics, or related STEM field and minimum 5+ years
  relevant experience. Masters degree preferred.
  
  
  
  PHYSICAL DEMANDS
  
  The physical demands described here are representative of
  those that must be met by an employee to perform
  successfully the essential functions of this job. Reasonable
  accommodations may be made to enable individuals with
  disabilities to perform the essential functions of this job.
  
  
  
  Work is primarily performed in an office environment.
  Regularly required to sit. Regularly required use hands to
  finger, handle, or feel, reach with hands and arms to handle
  objects and operate tools, computer, and/or controls.
  Required to speak and hear. Occasionally required to stand,
  walk and stoop, kneel, crouch, or crawl. Must frequently
  lift and/or move up to 10 pounds and occasionally lift
  and/or move up to 25 pounds. Specific vision abilities
  required by this job include close vision, distance vision,
  depth perception, and ability to adjust focus. Exposed to
  general office noise with computers printers and light
  traffic.
  
  
  
  EOE including Disability/Vet
  
  
  
  The estimated pay range for this role is $100kto $125k, with
  the final offer contingent on location, skillset, and
  experience.
  
  
  
  CNI offers a comprehensive benefits package that includes:
  
  - Medical
  - Dental
  - Vision
  - 401(k)
  - Family Planning/Fertility Assistance
  - STD/LTD/Basic Life/AD&D
  - Legal-Aid Program
  - Employee Assistance Program (EAP)
  - Paid Time Off (PTO) – (11) Federal Holidays
  - Training and Development Opportunities
  
  
  
  Your application submission will be considered for all
  potential employment opportunities with Chickasaw Nation
  Industries (CNI).
  
