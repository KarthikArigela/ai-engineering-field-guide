job_id: 9164987
title: AI Tooling Engineer
company: Supabase
location: USA
remote: true
work_type: FULL_TIME
description: |
  We are looking for an AI Tooling Engineer with strong
  expertise in JavaScript/TypeScript to help shape how
  developers and agents build with Supabase.
  
  As part of our engineering team, you'll work across product
  surfaces like the dashboard assistant, MCP, docs, and
  developer tooling to make Supabase a seamless platform for
  AI-native workflows. You'll combine product thinking, strong
  engineering fundamentals, and an eval-first mindset to build
  reliable tools, interfaces, and abstractions that serve both
  our own AI products and the developers building with
  Supabase.
  
  What You’ll Own:
  
  - Build and maintain Supabase's AI tooling, including surfaces
    such as MCP, agent skills, and other interfaces developers
    and agents use to work with Supabase.
  - Progress Supabase's dashboard assistant into a genuinely
    useful self-serve product for debugging and day-to-day
    product workflows.
  - Understand how customers are using AI tools and translate
    those workflows into better product experiences,
    abstractions, and documentation.
  - Drive an eval-first approach by building and improving
    evaluation frameworks, instrumentation, and feedback loops
    across real use cases.
  - Design and improve the ways documentation and product
    knowledge are exposed to agents.
  - Build tools and patterns customers can use to incorporate AI
    into their own apps, including areas like MCP on Edge
    Functions, vector embeddings, and agents running on Edge
    Functions.
  - Centralize shared AI logic and reduce duplicated patterns
    across our products and services.
  - Ensure the tools we ship are battle-tested, with strong test
    coverage, benchmarking, and stress testing where
    appropriate.
  - Work cross-functionally with docs, CLI, frontend, API, and
    other teams to deliver coherent developer experiences.
  - Stay close to the fast-moving AI ecosystem and make good
    product and engineering decisions about what is actually
    useful to builders.
  
  What You Bring:
  
  - Strong experience in TypeScript and the JavaScript
    ecosystem, including npm, ES modules, bundlers, and
    browser compatibility concerns.
  - Deep familiarity with the AI ecosystem, including current
    tools, agent patterns, and practical tradeoffs.
  - Experience building developer tools, product interfaces, or
    platform primitives used by other engineers.
  - Experience designing or using evaluation frameworks to
    measure AI quality, reliability, and task success.
  - Familiarity with Postgres and database best practices.
  - Experience with vector databases and embeddings, ideally
    with pgvector or similar Postgres extensions.
  - Strong judgment about where AI improves user workflows and
    how to avoid fragile or gimmicky experiences.
  - Strong focus on writing tests and validating reliability in
    real-world conditions.
  - Strong communication skills and the ability to work cross-
    functionally across product, engineering, and
    documentation.
  
  What We Offer
  
  - Fully RemoteWe hire globally. We believe you can do your
    best work from anywhere. There are no Supabase offices,
    but we provide a WeWork membership or co-working allowance
    you can use anywhere in the world.
  - ESOPEvery team member receives ESOP (equity ownership) in
    the company. We want everyone to share in the upside of
    what we’re building together.
  - Tech AllowanceUse this budget to set up your ideal work
    environment—laptop, monitor, headphones, or whatever helps
    you do your best work.
  - Health BenefitsSupabase covers 100% of health insurance for
    employees and 80% for dependents, wherever you are. Your
    wellbeing and your family’s health are important to us.
  - Annual Off-SitesOnce a year, the entire company gathers in a
    new city for a week of connection, collaboration, and fun.
    It’s a highlight of our year.
  - Flexible WorkWe operate asynchronously and trust you to
    manage your own time. You know what needs to be done and
    when.
  - Professional DevelopmentEvery team member receives an annual
    education allowance to spend on learning—courses, books,
    conferences, or anything that supports your growth.
  
  About the Team
  
  Supabase was born-remote and open-source-first. We believe
  our globally distributed team is our secret weapon in
  building tools developers love.
  
  - 280+ team members
  - 55+ countries
  - 20+ languages spoken
  - $500M raised
  - 500,000+ community members
  
  We move fast, build in public, and use what we ship. If it’s
  in your project, we probably use it in ours too. We believe
  deeply in the open-source ecosystem and strive to
  support—not replace—existing tools and communities.
  
  Hiring Process
  
  We keep things simple, async-friendly, and respectful of
  your time:
  
  - Apply – Our team will review your application.
  - Intro Call – A short video chat to get to know each other.
  - Interviews – Up to four calls with:
    - Team Leads
    - Future teammates
    - Someone cross-functional from product, growth, or
      engineering (depending on the role)
    - Someone from our leadership/founding team
  - Decision – We may follow up with a final question or go
    straight to offer.
  
  All communication is remote and we aim to move fast.
