  Experience of fine tuning the open source models for
  business use case.
  
  Experience with LangChain, LlamaIndex, OpenAI APIs, or
  Hugging Face.
  
  Experience deploying models using Docker/Kubernetes.
  
  Knowledge of MLOps pipelines.
