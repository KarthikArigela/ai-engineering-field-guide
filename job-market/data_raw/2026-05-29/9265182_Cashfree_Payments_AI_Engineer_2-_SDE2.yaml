  Familiarity with the Transformers architecture, large
  language models and agentic frameworks.
  
  Experience building APIs and backend services.
  
  Good understanding of evaluating of current model pipelines.
  
  Knowledge of cloud platforms (AWS/GCP/Azure).
  
