description: |
  Job Titale: AI/ML Engineer – Forecasting & Network Analytics
  
  Experience: 4–6 years
  
  
  
  Overview
  
  We’re looking for an AI/ML Engineer with strong experience
  in forecasting and machine learning model development to
  drive data-driven optimization
  
  
  
  Key Responsibilities
  
  - Build and deploy forecasting models (demand, volume,
    capacity planning)
  - Develop ML models for network optimization and operational
    efficiency
  - Work on production level code
  - Perform deep-dive analysis to identify trends and
    improvement opportunities
  - Work closely with business teams to translate problems into
    ML solutions
  - Monitor, evaluate, and improve model performance
  - Work closely with data team to get data in required format
  
  Required Skills
  
  - Hands-on experience in ML model development & deployment
  - Strong background in time-series forecasting
  - Experience working with large datasets in cloud environments
  - Exposure to logistics / supply chain analytics is a plus
  - Azure (Databricks, Azure ML, Data Factory, Synapse)
  - Python (pandas, PySpark)
  - SQL, Power BI (good to have)
  
