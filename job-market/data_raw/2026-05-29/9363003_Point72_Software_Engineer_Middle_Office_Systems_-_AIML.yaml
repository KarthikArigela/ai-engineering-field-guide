description: |
  A CAreer with point72’s Technology TEAM
  
  As Point72 reimagines the future of investing, our
  Technology team is constantly improving our company’s IT
  infrastructure, positioning us at the forefront of a rapidly
  evolving technology landscape. We’re a team of experts
  experimenting, discovering new ways to harness the power of
  open-source solutions, and embracing enterprise agile
  methodology. We encourage professional development to ensure
  you bring innovative ideas to our products while satisfying
  your own intellectual curiosity.
  
  WHAT YOU'LL DO
  
  - Build and deliver equities trading services and execution
    components that directly influence trading performance and
    product innovation
  - Integrate generative AI capabilities into developer
    workflows and trading tools to automate code generation,
    testing, and operational support
  - Prototype and productionize AI-driven features and
    automation in close partnership with research, trading,
    and operations teams
  - Optimize system performance, scalability, and reliability
    through profiling, tuning, and capacity planning for low-
    latency environments
  - Lead testing, deployment, and observability efforts to
    ensure safe, auditable delivery of new features and rapid
    incident resolution
  - Mentor and coach junior engineers, elevate engineering
    standards, and contribute to the technical roadmap for
    equities technology
  - Drive cross-team projects to modernize execution
    infrastructure and build reusable platforms and developer
    tooling
  
  WHAT'S REQUIRED
  
  - Minimum of 3 years of professional experience in markets
    technology or trading technology
  - Demonstrated experience working as an AI-first engineer,
    routinely applying AI-driven approaches to solve
    engineering and operational problems
  - Hands-on experience building, maintaining, or supporting
    production trading systems, order management systems, or
    execution platforms
  - Proven software development experience in Python, Java, and
    SQL on production projects
  - Regular hands-on use of generative AI (GenAI) tools in day-
    to-day development, testing, or operational workflows
  - Strong understanding of electronic equity market structure,
    trading workflows, and market data concepts
  - Practical experience with real-time data processing,
    streaming APIs, or event-driven architectures.
  - Experience profiling, optimizing, and debugging performance-
    sensitive or low-latency systems
  - Bachelor’s or Master’s degree in Computer Science,
    Engineering, Mathematics, or a related technical field
  - Strong verbal and written communication skills with
    demonstrated ability to collaborate with trading,
    research, and product teams
  - Commitment to the highest ethical standards
  
  WE TAKE CARE OF OUR PEOPLE
  
  We invest in our people, their careers, their health, and
  their well-being. When you work here, we provide:
  
  - Health care benefits
  - Maternity, Adoption & related leave policies
  - Generous paternity and family care leave policies
  - Employee Assistance Program & Mental wellness programs
  - Transportation support
  - Tuition assistance
  
  ABOUT POINT72
  
  Point72 is a leading global alternative investment firm led
  by Steven A. Cohen. Building on more than 30 years of
  investing experience, Point72 seeks to deliver superior
  returns for its investors through fundamental and systematic
  investing strategies across asset classes and geographies.
  We aim to attract and retain the industry's brightest talent
  by cultivating an investor-led culture and committing to our
  people's long-term growth. For more information, visit
  https://point72.com/.
