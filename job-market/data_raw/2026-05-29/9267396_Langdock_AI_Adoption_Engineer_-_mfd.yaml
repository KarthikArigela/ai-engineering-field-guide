description: |
  About Langdock
  
  We help organizations drive internal AI adoption through our
  enterprise-ready AI platform. Our product suite includes AI
  Chat, Assistants, Search, API, and Workflows - enabling
  companies to roll out AI internally and build custom AI use
  cases. We serve over 7,000 customers, from DAX companies to
  startups, including enterprise clients like Merck KGaA, Der
  Spiegel, GetYourGuide, Babbel, and Personio.
  
  We are model-agnostic, fully GDPR-compliant, and ISO 27001 &
  SOC-2 Type 2 certified. Made in Germany, backed by Y
  Combinator.
  
  About the Role
  
  AI is the biggest transformation of our lifetime. Most
  companies know they need to move. Few know how. This is
  where you come in.
  
  As an AI Adoption Engineer in Langdock's Customer Success
  team, you turn ambition into working solutions. You sit at
  the intersection of customer, product, and engineering:
  discovering high-value use cases, scoping them, building
  them, and making sure they stick. You understand a
  customer's workflows, identify where AI creates real
  leverage, and deliver solutions they can maintain and scale
  on their own.
  
  This is a technical role. You write code. You build MCP
  servers and custom integrations. You work with agentic
  coding tools daily. You understand our platform at the code
  level and you're comfortable operating at the boundary
  between product and engineering. Everyone at Langdock builds
  AI agents and workflows to automate their own work. As a AI
  Adoption Engineer, you set the standard for what that looks
  like.
  
  You work project-based with our most relevant customers:
  running use case workshops, leading on-site hackathons,
  building complex agents and integrations, and handing over
  production-ready solutions. You also serve as the technical
  expert during Sales conversations, helping prospects
  understand what's possible and how Langdock fits into their
  architecture.
  
  You work closely with Customer Success to drive adoption,
  with Product and Engineering to push the platform forward,
  and with Marketing to create reusable resources that help
  customers build independently. When you hit a platform
  limitation, you articulate what needs to change and why, and
  work with the team to make it happen.
  
  What You Will Do
  
  - Discover and scope high-value use cases: run AI Use Case
    Workshops, Department Deep-Dives, and Scoping Sessions to
    identify where AI creates the most impact for each
    customer.
  - Build and deploy solutions: lead On-Site Hackathons,
    Implementation Sprints, and Architecture Reviews; deliver
    working agents, integrations, and workflows that customers
    can own and maintain.
  - Serve as a technical expert during the Sales process: join
    sales conversations to answer technical questions, build
    tailored demos and proof-of-concept environments, evaluate
    integration architectures, and help prospects understand
    what Langdock can do for them. You are the person in the
    room who makes the product feel real for a technical
    buyer.
  - Drive use case adoption: make sure customers actually adopt
    what you build; create documentation, run Office Hours,
    provide hands-on support, and enable power users to build
    independently.
  - Create reusable resources: build templates, documentation,
    and reference architectures that Account Management and
    Marketing can share with customers and prospects.
  - Push the platform forward: identify product limitations
    blocking high-value use cases, articulate requirements
    clearly, and work directly with Product and Engineering to
    close the gaps.
  - Build your own tools: build MCP servers, develop custom
    integrations, and use agentic coding tools to build on top
    of the platform and automate your own workflows.
  
  What We're Looking For
  
  You have 3+ years of experience in a technical, customer-
  facing role - Solutions Engineering, Technical Customer
  Success, Technical Consulting, or similar - where you both
  built things and worked directly with customers on a real
  technical product.
  
  You have experience working with enterprise customers on
  high-impact use cases: scoping projects, managing
  stakeholders, and delivering outcomes in large organizations
  where things move slowly, people change roles, and
  requirements shift. You've also supported the sales side:
  building demos that close deals, translating a product's
  capabilities into a prospect's language, and making complex
  technical products feel tangible.
  
  You are comfortable running workshops with senior
  stakeholders and following up with a sharp scoping document
  that aligns everyone afterwards. You know how to listen for
  the real problem behind a feature request. You translate
  complex technical concepts into language non-technical
  stakeholders understand, and turn customer needs into
  concrete, buildable specifications.
  
  You understand AI deeply and know how to turn it into
  working systems. You can judge when an LLM-based approach is
  the right tool and when it isn't, and you can hold your own
  in technical conversations with engineering teams. You write
  production-quality code in JavaScript and Python, and are
  comfortable with HTML/CSS, APIs, and integration
  architectures. You can build an MCP server, design a multi-
  step agent workflow, or debug a customer's integration
  setup. Agentic coding tools are a core part of how you
  operate.
  
  You are fluent in English (C1+). German is a strong plus,
  since many of our customers are German-speaking enterprises.
  
  Bonus: you come from a technical consulting background, an
  AI-native company, or an early-stage startup. Experience
  with enterprise software, developer tools, or platform
  products is a plus.
  
  How We Work
  
  - 100% on-site in our Berlin office (Greifswalder Strasse 212)
  - Small team, high ownership - we expect everyone to manage
    themselves, find valuable work, and pull others in when
    needed
  - We value calm urgency: things break, we stay calm and fix
    them. No drama, no firefighting culture
  - We value ambitious execution: learning, shipping, and
    providing value are big drivers of happiness here
  - We value caring ownership: we are kind, we care about our
    customers and each other, and we have fun at work
  
  What We Offer
  
  - Competitive salary with equity participation
  - Free lunch and dinner, every day in the office
  - Premium gym access (right around the corner)
  - Relocation support for those moving to Berlin
  - A front-row seat to the enterprise AI transformation -
    working with some of the most ambitious companies in
    Europe
  
  How to Apply
  
  Apply through our application form. We will ask you a few
  short questions - take your time with them, they matter more
  than your CV.
  
  Our process: Application - CV Review - Hiring Manager
  Interview (30 min, video) - Case Study - On-site Day (team
  meeting, founder interview) - Reference Call - Offer.
