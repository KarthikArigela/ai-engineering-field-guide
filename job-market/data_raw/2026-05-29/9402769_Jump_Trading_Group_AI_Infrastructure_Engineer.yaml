description: |
  Jump Trading Group is committed to world class research. We
  empower exceptional talent across the mathematical and
  computational sciences to push past scientific boundaries
  and apply cutting edge research to global financial markets.
  Our culture is unique: constant innovation requires
  fearlessness and intellectual honesty, alongside a
  relentless competitive streak that drives us to win
  together. We unlock unique individual talent by motivating
  collaboration and mutual respect. At Jump, research outcomes
  drive more than superior risk-adjusted returns. We deploy
  groundbreaking technologies, fund start-ups across
  industries, and partner with leading global research
  organizations to solve problems that affect the broader
  world. Our AI team is an R&D group of quantitative
  researchers, engineers, and ML experts leading LLM research
  and applications at Jump. Our mission is to combine emerging
  techniques and original research to generate signals from
  unstructured data and to put frontier AI capabilities into
  the hands of the people doing the most demanding
  quantitative work in the world. Our remit is broad and
  growing, spanning model research, agentic systems, and the
  platforms that bring them into daily use, and we want our
  researchers and traders to experience these capabilities as
  a seamless and dependable extension of how they already
  work. What You’ll Do: We are seeking an infrastructure
  engineer to own the production layer for AI capabilities
  deployed across trading teams. The ideal person for this
  role will combine strong systems instincts with engineering
  taste and a clear product sense, and will be capable of
  turning a fast-moving set of AI capabilities into reliable,
  scalable services for demanding internal users. You will
  partner with the research and platform groups to bring their
  work into production, and with trading teams to ensure that
  what we ship meets stringent operational requirements.
  Responsibilities include hardening and scaling the systems
  that deliver AI to internal users, designing and operating
  dedicated pathways that protect critical-path workflows from
  contention with heavier non-trading workloads, and
  continuously improving the reliability and breadth of the AI
  platform. You will also play a central role in how context,
  tools, and agentic flows are composed at scale. Other duties
  as assigned or needed. Skills You’ll Need:
  
  - 5+ year track record of building and operating production
    systems at meaningful scale
  - Bachelor’s degree in Computer Science, Computer Engineering
    or related field
  - Strong development skills in Python, with working knowledge
    of at least one systems language
  - Deep Linux fluency and a sharp sense for how distributed
    systems fail under load
  - Hands-on experience with agentic systems, context
    engineering, and harness design
  - Product instinct and a customer view when building tooling
    for sophisticated internal users
  - A taste for ops work and an appetite for keeping critical
    systems healthy
  - Intellectual curiosity and a strong bias toward shipping
  - Reliable and predictable availability
  
  Benefits
  
     - Discretionary bonus eligibility
     - Medical, dental, and vision insurance
     - HSA, FSA, and Dependent Care options
     - Employer Paid Group Term Life and AD&D Insurance
     - Voluntary Life & AD&D insurance
     - Paid vacation plus paid holidays
     - Retirement plan with employer match
     - Paid parental leave
     - Wellness Programs
  
  Annual Base Salary Range
  
  $200,000—$250,000 USD
