description: |
  At F5, we strive to bring a better digital world to life.
  Our teams empower organizations across the globe to create,
  secure, and run applications that enhance how we experience
  our evolving digital world. We are passionate about
  cybersecurity, from protecting consumers from fraud to
  enabling companies to focus on innovation.
  
  
  Everything we do centers around people. That means we obsess
  over how to make the lives of our customers, and their
  customers, better. And it means we prioritize a diverse F5
  community where each individual can thrive.
  
  Position Summary
  
  We are seeking a skilled AI Data Engineer to join the
  Central Operations team at F5, specializing in driving AI
  and automation solutions throughout corporate operations
  functions. Data is the foundation of every successful AI
  initiative. At F5, we believe that AI is only as reliable as
  the data that trains and feeds it. This role is not a
  supporting function, it is a core enabler of our AI
  strategy. The engineer who fills this position will have
  direct influence on the accuracy, fairness, and operational
  effectiveness of AI systems that impact the entire
  organization. You will shape and optimize data pipelines
  that empower AI model training and support advanced
  automation initiatives across the organization.
  
  You will be responsible for developing and refining ETL
  pipelines for both structured and unstructured data,
  executing data cleaning and transformation tasks, and ensure
  reliable data availability and integrity within operational
  AI systems. The role will need to collaborate closely with
  cross-functional teams to align data processes with business
  objectives and adopting innovative technologies that advance
  automation and AI strategies at F5.
  
  Candidates should possess proficiency in analytics, cloud-
  based services, and big data frameworks such as Hadoop and
  Spark. Strong expertise in Python and SQL is essential,
  along with a solid understanding of data governance and
  security compliance requirements. Experience scaling data
  engineering solutions to support growing AI initiatives is
  also a must. Effective communication skills are crucial for
  partnering with operational and technical teams to ensure
  data solutions are closely aligned with business needs. This
  person must showcase previous adaptability and
  professionalism in complex environments where AI and
  automation are central to operational excellence.
  
  Primary Responsibilities / What You’ll Do
  
  - Implement automated data quality checks, validation rules,
    and anomaly detection at each stage of the data pipeline
    to prevent corrupt, incomplete, or biased data from
    reaching AI models.
  - Define and enforce data quality SLAs (e.g., completeness,
    timeliness, consistency, accuracy thresholds)
  - Build monitoring and alerting systems to detect pipeline
    failures, data drift, and schema changes that could
    degrade AI model performance.
  - Conduct root cause analysis on data quality incidents and
    implement preventative controls.
  - Implement and maintain end-to-end data pipelines, including
    processes for structured, semi-structured, unstructured
    datasets.
  - Work with AI Deployment Engineers to optimize data pipelines
    for AI model training and data stores for AI model
    retention.
  - Ensure data availability and reliability across operational
    AI systems.
  - Implement data retention, data lineage, and other data
    governance standards across various data pipelines and
    products.
  - Collaborate with both technical and non-technical teams for
    seamless data integration with automation tools.
  - Implement both batch and real-time/streaming data pipelines
    to support diverse AI and/or automation use cases.
  
  Qualifications / What You’ll Bring
  
  - Bachelor’s or Master’s degree in Business Analytics, Data
    Engineering, Data Science, or another similar field.
  - 8+ years of experience in related field, such as Data
    Engineer, Automation Platform Architect, or the like.
  - Proficiency in Python, SQL, and big data frameworks (Hadoop,
    Spark).
  - Familiarity with tools such as Snowflake, dbt, FiveTran, and
    Tableau.
  - Familiarity with GDPR, CCPA/CPRA, and other data privacy
    regulations.
  - Understanding of data governance and security compliance,
    specifically focused on how to maintain at scale with AI
    solutions.
  - Effective communication to align data processes with
    business needs.
  - Previous background in management consulting is a plus.
  - Strong business acumen and understanding of enterprise-level
    processes and the interplay between functions, namely
    digital, data, and functional teams.
  - Strong attention to detail, a constantly analytical mindset,
    and the ability to work independently and effectively to
    deliver value.
  
