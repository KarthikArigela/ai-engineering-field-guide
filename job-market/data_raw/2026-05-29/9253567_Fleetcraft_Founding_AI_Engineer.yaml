title: Founding AI Engineer
company: Fleetcraft
location: London, GBR
work_type: FULL_TIME
company_size: 10 Employees
description: |
  About Fleetcraft Aerospace represents the best of human
  engineering. Yet the systems that build and maintain
  aircraft are slow, manual, and barely changed in decades -
  and with a mounting shortage of personnel and parts
  capacity, the industry has to change to grow.
  
  We're reshaping how aircraft are maintained and manufactured
  to make innovation faster, cheaper, and more accessible
  across the entire industry. We're already working with MROs
  on three continents.
  
  Our seed was led by Susa Ventures (a 1-in-10 unicorn hit
  rate), who doubled down a year later at 2× the valuation,
  alongside Liquid 2 VC, early backers of Anduril and Stoke
  Space.
  
  You'll work with a team that has helped launch airlines and
  put satellites into orbit - and with our aviation advisory
  board, whose members have run some of the largest aircraft
  OEMs, led airworthiness at Gulfstream, and overseen training
  facilities that educate a quarter of all aircraft mechanics
  in the US.
  
  Why Join Us?
  
  We’re building at the intersection of aerospace and AI -
  modernising one of the world’s most complex and critical
  industries.
  
  - Solve real-world problems: Your code won’t just ship; it
    will define how aircraft are inspected, maintained, and
    trusted worldwide.
  - Join from the start: We’re growing fast and already working
    with some of the largest aviation companies in the world.
    You’ll be here from day one, helping shape the future.
  - High trust, high ownership: Make decisions that move the
    whole company forward. We value autonomy, speed, and
    impact.
  - Stack: Build with modern tools — Python, FastAPI,
    TypeScript, LLMs, MLOps
  
  What We’re Looking For
  
  - 2+ years of software development experience
  - Hands-on experience building production AI systems with
    Python, PyTorch, and LLMs (OpenAI, Anthropic, etc.),
    integrated into real user workflows
  - Familiarity with MLOps tools and CI/CD for both traditional
    and ML-driven systems
  - Strong backend and API development skills - comfortable
    owning systems end-to-end, from data pipelines to user-
    facing interfaces
  - Passion for building clean, usable products that solve real
    problems, fast
  - Comfortable wearing multiple hats, challenging assumptions,
    and shaping product direction in ambiguous environments
  
  Bonus Points
  
  - Prior startup or 0→1 product experience
  - Contributions to open-source AI/ML projects
  - Experience with aviation, aerospace, or other safety-
    critical domains
  
  Tech Stack
  
  - Core: Python, FastAPI, TypeScript, React
  - AI/ML: OpenAI, Anthropic, computer use, evals, voice agents
  - Infrastructure: Azure, Docker
  
  Process:
  
  - Initial Screen (30 min video call with one of the founders)
  - Interview (45 min video call with both founders)
  - Take-Home Test (HackerRank assessment)
  - In-Person Interview
  - Reference Check
  
  Working at Fleetcraft
  
  Our office is in central London, in Fitzrovia. Being in the
  same room helps us move fast, make better decisions, and
  build with urgency.
  
  We’re comfortable with chaos and energised by the pace. We
  also get that life isn’t always predictable. When something
  personal comes up, we trust each other to handle it with
  flexibility and maturity.
  
  Compensation + Benefits
  
  💰 Highly Competitive: £80k-£120k + equity
  
  We’ll Back You to Do Your Best Work Need to relocate?
  Working late? Want a tool that helps you move faster? We’ve
  got you. Just tell us what you need we’ll make it happen.
  
  Fleetcraft is an equal opportunities employer.
