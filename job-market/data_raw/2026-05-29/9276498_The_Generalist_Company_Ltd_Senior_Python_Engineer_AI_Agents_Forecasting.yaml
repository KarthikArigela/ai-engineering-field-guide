job_id: 9276498
title: "Senior Python Engineer: AI Agents & Forecasting"
company: The Generalist Company Ltd
location: London, GBR
work_type: FULL_TIME
company_size: 24 Employees
description: |
  We're building AI that predicts the future. Literally. The
  Company
  
  Numinous is building the world's most advanced super-
  forecasting AI agents. We're creating autonomous systems
  that ingest real-world data, reason through complex
  scenarios, and produce predictions for the highest-stakes
  decisions on the planet. Think hedge funds, traders,
  governments, and Fortune 500 companies.
  
  Right now, we're selling predictive intelligence to hedge
  funds and operating in prediction markets. But that's the
  starting point, not the ceiling. We're a small team, early-
  stage, well-backed, and moving fast.
  
  Our mission: To build forecasting AI that fundamentally
  changes how critical decisions get made.
  
  Our Culture
  
  We operate like founders, not employees. Everyone here has
  skin in the game and the autonomy to make real decisions. We
  move fast, communicate directly, and don't hide behind
  process. If something needs doing, you do it. If something's
  broken, you say it.
  
  We value missionaries over mercenaries. We want people who
  care about the mission, not just the paycheque. The kind of
  people who'll stay up late because the problem is
  interesting, not because someone told them to.
  
  The Role
  
  You'll architect and build the core infrastructure of the
  Numinous platform. This is the backbone that allows
  autonomous AI agents to ingest data, reason, compete, and
  forecast. This isn't gluing APIs together. You'll be
  designing the systems that score, rank, and incentivise AI
  forecasting agents in live, competitive environments.
  
  Day to day, you're deep in backend architecture, building
  production-grade agent orchestration, designing data
  pipelines, and solving problems at the intersection of
  software engineering and quantitative forecasting. You'll
  work directly with the founders. There are no layers between
  you and the decisions that shape the product.
  
  What You'll Be Doing
  
  - Unifying the different parts of the stack. The network,
    signal layers, and forecasting architectures need to work
    together as one coherent system.
  - Designing and building the agent orchestration pipeline that
    allows AI forecasters to ingest data, reason, and produce
    predictions.
  - Building and optimising the signal pipeline that feeds real-
    world data into forecasting models.
  - Experimenting with different forecasting architectures to
    find optimal approaches for linking targets to signals.
  - Writing production-grade Python that handles complexity at
    scale, not scripts that work in a notebook.
  - Contributing to technical strategy alongside the founders.
    You'll have a voice in what gets built and why.
  - Evaluating and vetting technical candidates as the
    engineering team grows.
  
  Bad News
  
  - We're early. The engineering function is still being built.
  - Documentation is thin and processes are light
  - Priorities will shift and things will break
  - If you need a mature engineering culture with established
    practices, this isn't the role yet. You'll be helping
    build that culture, not inheriting it.
  
  Good News
  
  - More ownership, influence, and impact in 6 months than you'd
    get in 5 years at a bigger company
  - Technical co-founders who are direct, move fast, and
    actually understand what you're building
  - No politics, no layers, no waiting for approval
  - The problem is genuinely unsolved and the market is enormous
  - If we get this right, you'll have built the infrastructure
    behind the world's most advanced forecasting AI.
  
  Your Mission
  
  Make the Numinous platform into a self-improving world model
  with the most accurate forecasts in the world. You exist to
  turn our vision of self-improving superhuman AI forecasting
  into a reality, building the systems that allow agents to
  get smarter, faster, and more accurate over time.
  
  Why Join Now
  
  This is founding-engineer territory. The team is small, the
  problem is unsolved, and the market is massive. You're not
  joining a machine that's already running. You're building
  it. The architecture decisions you make in the next 6 months
  will define the platform for years. You'll have direct
  influence over the product, the technical direction, and the
  culture of the engineering team as it grows.
  
  In 12 months this role won't look like this. The team will
  be bigger, the foundations will be set, and the opportunity
  to shape everything from scratch will be gone. Right now,
  it's all open.
  
  What Good Looks Like
  
  At 3 months: There's a production-grade forecaster in one
  category. Targets are linked to signals, connected to the
  network, with experimentation underway on forecasting
  architectures. You're making architectural decisions
  independently and contributing to technical strategy, not
  just executing tickets.
  
  At 6 months: The signal pipeline has an inductive process, a
  world model sits on top, and there's a sellable product for
  clients. You've unified the different parts of the stack
  (the network, signal layers, and forecasting architectures)
  into something coherent and powerful.
  
  At 12 months: The platform handles complex targets across
  multiple verticals including commodities, politics, and
  beyond. There's a provable edge that unlocks serious
  commercial conversations. You're a technical leader in the
  company, not just an engineer.
  
  Skills & Expertise
  
  - 5+ years building production-grade Python backends. You know
    the internals, not just the syntax.
  - Hands-on experience with LLM orchestration frameworks such
    as LangChain or LangGraph (agent memory, tool calling,
    state management)
  - Dagster in production (assets, sensors, partitions) or
    equivalent pipeline orchestration
  - Strong backend fundamentals including API design, async
    programming, and database modelling
  - You've built systems that had to work reliably at scale, not
    just pass a demo
  
  Experience
  
  - Worked at an early-stage startup or high-growth environment.
    You understand the pace.
  - Built and shipped production systems, not just prototypes
  - Comfortable being the most senior engineer in the room, or
    the only one
  
  What Sets You Apart
  
  - You think holistically about systems. You see how your work
    connects to every other part of the product without being
    told.
  - Research-driven approach to problem solving. You test
    hypotheses, not just ship features.
  - Experience in financial markets, algo-trading, or prediction
    market platforms (Polymarket, Manifold, etc.)
  - Quantitative background in maths, statistics, or probability
    theory
  - ML experience including random forests, regression models,
    scikit-learn, and PyTorch
  - AWS infrastructure experience deploying containerised
    applications and managing cloud environments (EC2, Lambda,
    RDS)
  - Open-source contributions to AI or crypto projects
  
  Compensation
  
  - Salary: £80,000 to £120,000 depending on experience
  - Equity: Competitive for the right candidate
  
  Hours & Location
  
  - Full-time
  - Remote-friendly with a presence in London
  - Async by default, in-person when it matters
  - We care about output, not hours logged. This is a startup,
    and the pace reflects that.
  
  How to Apply
  
  - Apply. Submit your application through Ashby. Tell us why
    this role excites you and what you'd bring to it.
  - Shortlist. We review every application and shortlist
    candidates for interview.
  - Interview with TGC. A conversation with our team to walk
    through your experience and how you think about the
    problem.
  - Interview with the founders. You'll meet the Numinous
    founding team directly.
  - Task. A short, practical exercise to see how you approach
    real work.
  - Offer. If it's a fit on both sides, we move fast.
