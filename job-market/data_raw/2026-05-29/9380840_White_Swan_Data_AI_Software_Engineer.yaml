description: |
  We’re looking for a Software Developer with deep Calude Code
  or similar expertise to build advanced automation and visual
  data processing workflows. You’ll work at the intersection
  of AI, computer vision, and data streaming.
  
  Key Responsibilities
  
  - Build, optimise, and document AI workflows and custom nodes.
  - Develop computer vision and video streaming tools for real-
    time data analysis.
  - Design and manage databases for efficient data storage and
    retrieval.
  - Implement data scraping and ingestion pipelines from diverse
    online sources.
  - Collaborate cross-functionally to prototype, deploy, and
    maintain production-grade solutions.
  - Ensure system scalability, reliability, and security across
    all builds.
  
  Skills, Knowledge and Expertise
  
  - Proven, hands-on experience with Claude Code or similar AI
    tools
  - Strong Python development skills.
  - Experience with computer vision frameworks (OpenCV, PyTorch,
    TensorFlow).
  - Proficiency with databases (SQL/NoSQL) and API integration.
  - Knowledge of video streaming protocols (FFmpeg, WebRTC,
    RTSP).
  - Experience with web scraping tools (Scrapy, Selenium,
    BeautifulSoup).
  - Excellent debugging, documentation, and collaboration
    skills.
  
  Benefits
  
  - Salary depending on experience.
  - Annual discretionary performance bonus.
  - 25 days holiday per annum, plus UK bank holidays.
  - Private health & dental insurance.
  - Optical cover through Aviva.
  - Pension plan.
  - Gympass membership to over 1900 gyms and wellness
    businesses.
  - Breakfast bought in everyday and lunch bought in twice a
    week
  - Free coffee & snacks at the office.
  - Regular team events & socials.
  
  About Technology is at the heart of our business and has
  produced consistent and significant results. We are a small
  but rapidly growing team of mathematicians, data scientists
  and software engineers constantly striving to refine our
  world class statistical models while also researching and
  deploying new ones.Our work bridges three domains, each
  challenging in its own right - iGaming, quantitative
  research and software development. This convergence demands
  a rare blend of skills and creativity to identify and
  capitalise on inefficiencies across the iGaming landscape.
  The opportunities are vast, but we are only as good as the
  people we bring on board.As a startup, we offer a dynamic
  and entrepreneurial environment where you’ll work on
  impactful projects and have the autonomy to explore new
  ideas. In-person collaboration and innovation are at the
  heart of what we do, and we are always looking for
  individuals who can contribute their unique perspectives and
  talents to help us stay ahead in a constantly evolving
  industry.At White Swan Data, we recognise that building a
  diverse and inclusive workforce within a highly technical
  field presents both opportunities and challenges. We
  recognise the value that a variety of perspectives can bring
  to innovation, problem-solving, and business success. A team
  composed of individuals from different backgrounds,
  experiences, and ways of thinking fosters creativity,
  enhances decision-making, and ultimately strengthens our
  ability to tackle complex challenges.
