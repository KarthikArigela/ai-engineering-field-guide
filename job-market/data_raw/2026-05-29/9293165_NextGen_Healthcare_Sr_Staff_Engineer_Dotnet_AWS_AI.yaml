description: |
  Job Description:
  
  We are seeking a seasoned Technical Leader (T5) with deep
  healthcare domain expertise to drive the design and delivery
  of enterprise-scale interoperability solutions. This role
  requires a hands-on problem solver who can strategically
  dissect complex challenges, define scalable architectures,
  and lead teams through execution. The ideal candidate
  combines strong technical depth in .NET and cloud
  technologies and demonstrates the ability to influence teams
  with a strong sense of ownership and forward-looking
  mindset.Job Responsibilities
  
  - Lead architecture and design discussions across global
    teams, ensuring scalable, maintainable, and high-
    performance solutions
  - Analyze complex technical and functional problems, break
    them down strategically, and drive end-to-end solutions
  - Design and build enterprise-grade healthcare
    interoperability solutions, with a strong focus on both
    functional and non-functional requirements (performance,
    scalability, reliability, security)
  - Learn and adapt to latest AI trends and initiatives
  - Drive continuous improvements in system architecture,
    performance, and operational efficiency
  - Act as a hands-on technical leader, contributing to
    development while guiding and influencing the team
  - Lead initiatives around healthcare data interoperability
    aligned with standards (eg: HL7, FHIR, and CDA)
  - Ensure compliance with regulatory requirements including
    USCDI and the 21st Century Cures Act
  - Leverage observability and performance metrics to
    proactively improve system behavior and end-user
    experience
  - Collaborate with Engineering, Product, Program, and cross-
    functional teams, including offshore teams, to drive
    integrated solutions
  - Establish and reinforce engineering and QA best practices,
    driving process improvements across the team
  - Provide technical leadership, mentorship, and coaching to
    engineers, fostering a high-performance and feedback-
    driven culture
  - Demonstrate strong ownership and accountability while
    enabling team success through servant leadership
  - Stay forward-looking by driving innovation and adoption of
    modern technologies and practices
  
  Experience Required
  
  - Bachelor’s or Master’s degree in Computer Science or a
    related field
  - 10+ years of hands-on experience in building enterprise
    applications
  - Proven experience in healthcare domain, particularly in
    interoperability solutions
  - Strong experience in designing and implementing scalable,
    distributed systems
  - Demonstrated ability to handle complex problem-solving and
    system design challenges
  - Proven track record of delivering solutions addressing non-
    functional requirements such as performance, scalability,
    and reliability
  - Experience working in cross-functional and globally
    distributed teams
  - Prior experience in modernizing legacy systems (e.g., 32-bit
    to 64-bit transitions) is a plus
  
  Knowledge, Skills & Abilities
  
  - Strong technical expertise in C#, .NET, .NET Core, Web API,
    and RESTful services
  - Hands on with AWS (ECS, EKS, Lambda, S3) and gateway
    patterns
  - Exposure to AI assisted dev practices (a plus)
  - Experience with large-scale, high-throughput API
    development.
  - Familiarity with API authentication/authorization standards
    and best practices.
  - Understanding of distributed systems, tracing, monitoring,
    and troubleshooting production issues.
  - Experience with modern deployment strategies and trade-offs
    in production environments.
  - Knowledge of Kong API Gateway (preferred).
  - Familiarity with REST, GraphQL, CQRS, and event-driven
    development patterns.
  - Experience with WCF, WPF and Deep understanding of XML,
    XPATH
  - Strong proficiency in SQL Server and relational database
    design
  - Exposure to interop standards like HL7 v2, FHIR, and CDA
    (C-CDA) standards
  - Knowledge of IHE profiles and interoperability workflows is
    a plus
  - Exposure to Kafka or event-driven architectures is a plus
  - Strong analytical and problem-solving skills with ability to
    navigate ambiguity
  - Excellent communication skills with ability to articulate
    complex technical concepts clearly
  - Ability to influence, collaborate, and drive alignment
    across teams
  - Strong sense of ownership, accountability, and commitment to
    quality
  - Open to feedback and focused on continuous learning and
    improvement
  
  NextGen Healthcare is an equal opportunity employer. We
  celebrate diversity and are committed to creating an
  inclusive environment for all employees.
