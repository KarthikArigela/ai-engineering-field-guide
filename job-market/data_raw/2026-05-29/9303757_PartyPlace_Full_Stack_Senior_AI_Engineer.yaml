title: Full Stack Senior AI Engineer
company: PartyPlace
location: New York, USA
work_type: FULL_TIME
company_size: 10 Employees
description: |
  read bottom for how to apply
  
  We're a small team building something we genuinely think is
  a big idea.
  
  PartyPlace is where people go to book large group events at
  bars and restaurants in NYC. We've been growing, we have
  real venues and real users, and now we're going all in on
  AI.
  
  We're building a suite of tools that help bars and
  restaurants drive more large group bookings and maximize
  their revenue, without the overhead of a human event
  manager.
  
  We need someone who is a strong full stack engineer and
  knows how to build with AI. Not someone who talks about AI.
  Someone who has actually shipped it.
  
  This is early. You'd be one of the first people building
  this with us.
  
  WHAT YOU'LL DO
  
  - Build AI agents from the ground up. Real systems that handle
    real conversations and close real bookings.
  - Integrate third party APIs including AI/LLM tools and build
    features with them.
  - Own the full thing: the logic, the integrations, the surface
    that venues and hosts interact with
  - Work directly with the founders and real partner venues.
    You'll be in the room figuring out what to build next.
  - Start with one focused product and own the architecture as
    the suite grows
  
  WHAT WE'RE LOOKING FOR
  
  - Strong full stack experience. You're comfortable across the
    entire stack — frontend, backend, APIs, databases. This is
    the foundation.
  - Solid AI integration experience on top of that. You've
    shipped real things that use LLMs, agents, or similar. Not
    demos.
  - Fluent in our stack: React, Next.js, TypeScript, PostgreSQL,
    Node.js and related technologies. You see our codebase and
    it feels familiar.
  - You move fast and figure things out. A detailed spec is not
    how you work best.
  - You're in NYC and want to be in the office with the team
  
  Bonus if you've worked with real-time data integrations or
  have a background in hospitality or marketplace products.
  
  HOW WE THINK ABOUT THIS ROLE
  
  - There's no backlog waiting for you. You're helping build the
    roadmap.
  - This is not a 9-5. We're building something from scratch and
    moving fast.
  - We're a small team. No layers. Everyone is close to the
    product.
  - We're going senior because we need someone who can own this.
  - We're offering equity. This is something we're building
    together.
  
  HOW TO APPLY
  
  Send to reservations@partyplace.com:
  
  - Links to anything you've built. AI projects especially —
    repos, shipped products, anything that shows how you work
    with AI.
  - Info on your background. Resume, portfolio, LinkedIn,
    whatever makes sense.
  
  Warm intros always welcome. Reach out to Jack or Victor
  directly if you know us.
