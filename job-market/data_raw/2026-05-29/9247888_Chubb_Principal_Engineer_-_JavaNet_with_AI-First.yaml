description: |
  Chubb is a world leader in insurance. With operations in 54
  countries and territories, Chubb provides commercial and
  personal property and casualty insurance, personal accident
  and supplemental health insurance, reinsurance, and life
  insurance to a diverse group of clients. The company is
  defined by its extensive product and service offerings,
  broad distribution capabilities, exceptional financial
  strength, and local operations globally. Parent company
  Chubb Limited is listed on the New York Stock Exchange
  (NYSE: CB) and is a component of the S&P 500 index. Chubb
  employs approximately 40,000 people worldwide. Additional
  information can be found at: www.chubb.com.
  
  About Chubb India
  
  At Chubb India, we are on an exciting digital transformation
  journey, driven by a commitment to engineering excellence
  and analytics. We are proud to share that we have been
  officially certified as a Great Place to Work® for the third
  consecutive year, a reflection of the culture at Chubb,
  where we believe in fostering an environment where everyone
  can thrive, innovate, and grow.
  
  With a team of over 2500 talented professionals, we
  encourage a start-up mindset that promotes collaboration,
  diverse perspectives, and a solution-driven attitude. We are
  dedicated to building expertise in engineering, analytics,
  and automation, empowering our teams to excel in a dynamic
  digital landscape.
  
  We offer an environment where you will be part of an
  organization that is dedicated to solving real-world
  challenges in the insurance industry. Together, we will work
  to shape the future through innovation and continuous
  learning.
  
  Position Details
  
  - Job Title: Principal Engineer – Java / .Net with AI first
  - Function/Department: Technology
  - Location: Hyderabad / Bangalore
  - Employment Type: Full-time
  
  Role Overview
  
  A Principal Engineer with 15+ years of experience in Java or
  .NET, emphasizing an AI-first approach, leads the
  architecture, development, and delivery of scalable,
  intelligent enterprise systems.
  
  This senior technical leadership role focuses on designing
  AI-integrated software solutions using Java or .NET stacks.
  Professionals guide cross-functional teams, mentor
  engineers, and drive innovation by embedding AI/ML
  capabilities like generative AI, machine learning models,
  and intelligent automation into core platforms. Expect
  hands-on coding alongside strategic decision-making for
  high-impact projects in cloud-native environments.
  
  Key Responsibilities
  
  - Architect and evolve large-scale, distributed systems with
    microservices, ensuring scalability, resilience, and AI-
    driven features like predictive analytics or GenAI
    integration.
  - Lead technical strategy, from requirements gathering to
    implementation, including API design (REST/gRPC), database
    optimization (SQL/NoSQL), and performance tuning.
  - Mentor senior developers, conduct code/design reviews, and
    champion best practices like TDD, CI/CD, and agile
    methodologies.
  - Collaborate with product and engineering leaders to align
    AI-first solutions with business goals, while adopting
    tools like Azure Cognitive Services or cloud ML
    frameworks.
  
  Qualifications
  
  - 15+ years in software engineering, with deep expertise in
    Java/Kotlin/Spring Boot or .NET/C#/ASP.NET.
  - Identify AI opportunities to enhance systems, such as
    asynchronous processing or multi-cloud deployments.
  - Proven track record building enterprise-grade, AI-augmented
    platforms; experience with ML/big data (e.g., TensorFlow,
    PyTorch), cloud (AWS/Azure/GCP), and distributed systems.
  - Strong skills in modern stacks: React/TypeScript for front-
    end, Postgres/MongoDB for data, and AI tools like
    Claude/Cursor for coding acceleration.
  - Bachelor's/master’s in computer science; excellent problem-
    solving, communication, and leadership abilities.
  
  This Role Is Not For
  
  - Someone who has been fully hands-off technically for a long
    time, or someone who operates purely at a high-level
    strategy layer without engaging in the details.
  
