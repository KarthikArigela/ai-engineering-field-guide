description: |
  Requisition Number: 2363595 Optum is a global organization
  that delivers care, aided by technology to help millions of
  people live healthier lives. The work you do with our team
  will directly improve health outcomes by connecting people
  with the care, pharmacy benefits, data and resources they
  need to feel their best. Here, you will find a culture
  guided by inclusion, talented peers, comprehensive benefits
  and career development opportunities. Come make an impact on
  the communities we serve as you help us advance health
  optimization on a global scale. Join us to start Caring.
  Connecting. Growing together. Primary Responsibilities:
  
  - Research & Development
    - Lead applied research in LLMs, generative AI, and multimodal
      models
    - Evaluate and experiment with state-of-the-art architectures
      (e.g., Transformers, Diffusion Models, Retrieval-
      Augmented Generation)
    - Publish internal whitepapers and contribute to external
      conferences where applicable
  - Engineering & Implementation
    - Design and implement scalable AIML pipelines using
      frameworks like PyTorch, TensorFlow, Hugging Face, and
      MLflow
    - Collaborate with engineering teams to deploy models into
      production using MLOps best practices (CI/CD, model
      versioning, monitoring)
  - Tooling & Infrastructure
    - Evaluate and integrate advanced AIML tools such as GitHub
      Copilot, Windsurf, Vertex AI, Azure OpenAI, and Hugging
      Face Transformers
    - Work with cloud platforms (AWS, Azure, GCP) to ensure
      scalable and secure model deployment
  - Architecture & Strategy
    - Architect end-to-end AIML systems including data ingestion,
      model training, inference, and feedback loops
    - Partner with enterprise architects and product leaders to
      align AIML capabilities with business goals 3
  - Mentorship & Collaboration
    - Mentor junior engineers and researchers
    - Collaborate with cross-functional teams including data
      scientists, software engineers, and business
      stakeholders #AIforbetterhealthcare
  - Comply with the terms and conditions of the employment
