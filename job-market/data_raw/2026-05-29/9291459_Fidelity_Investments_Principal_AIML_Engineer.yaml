  Job Description:
  
  Job Title – Principal, AI/ML Engineer
  
  The Purpose of This Role
  
  We are looking for a highly experienced and technically
  proficient Principal  ML Engineer to lead the development,
  deployment, and scaling of machine learning infrastructure
  and pipelines and ML based applications. This role is ideal
  for someone with a strong foundation in backend development,
  Kubernetes-based deployment, AWS cloud infrastructure, and
  MLOps practices. You will play a key role in bridging the
  gap between data science and production systems.
  
  The Value you Deliver
  
  Key Responsibilities:
  
  - Create, design and maintain AI ML  based application
  - Design, build, and maintain scalable and secure MLOps
    pipelines using AWS Sagemaker for model training,
    validation, deployment, and monitoring
  - Develop and deploy APIs and backend services using Python,
    FastAPI, and Spring Boot
  - Manage containerized applications using Kubernetes and
    Amazon EKS
  - Implement CI/CD pipelines for ML workflows and application
    delivery
  - Collaborate with data scientists and Data Engineers to
    operationalize ML models in production
  - Utilize AWS services for infrastructure, automation, and
    monitoring
  - Ensure robust database integration and performance
    optimization
  - Contribute to UI development using Angular
  
  The Skills that are Key to this Role
  
  Required Technical Skills:
  
  - Expertise with FastAPI and/or Java Spring Boot for API
    development.
  - Deep expertise in Kubernetes and Amazon EKS/Azure AKS.
  - Strong programming skills in Python.
  - Hands-on experience with Amazon SageMaker,
  - Proficiency in AWS /Azure cloud services (e.g., EC2, S3,
    Lambda).
  - Understanding of database fundamentals (SQL/NoSQL)
  - Hands-on experience with MLOps tools.
  - Expertise with CI/CD tools and DevOps practices
  
  Good to Have:
  
  - Experience with Angular or other front-end frameworks
  - Exposure to data engineering and ETL pipelines,
  - Exposure on Snowflake.
  
  Soft Skills:
  
  - Excellent communication and collaboration skills
  - Ability to work cross-functionally with data science,
    engineering, and DevOps teams
  - Strong problem-solving and critical thinking abilities
  - Self-Driven, Proactive, adaptable, and committed to
    continuous learning
  
  Why Join Us?
  
  - Lead impactful ML infrastructure projects with cutting-edge
    technologies
  - Be part of a collaborative, innovative, and inclusive team
  - Opportunities for leadership, growth, and continuous
    learning
  - Flexible work environment and supportive culture
  
  
  
  
  
  How Your Work Impacts the Organization
  
  WS (Workplace Solutions) helps our customers save and invest
  through workplace retirement savings plans, build lifetime
  relationships with customers and provide employers with
  cost-effective, integrated employee benefit solutions. WS
  serves customers online, over the phone, and through a
  nationwide network of investor centers. WS is also committed
  to helping drive employee retirement readiness by delivering
  leading-edge financial solutions to employers, including
  recordkeeping, cash management products and services and
  personal advisory services (PAS).
  
  The Expertise we’re looking for
  
  - 12+  years of experience in MLOps, Backend Development ,
    AWS, Python  .
  - Graduate / Postgraduate
  
