title: IT Support Manager / Microsoft Engineer (AI Forward)
company: CAIS
location: New York, USA
work_type: FULL_TIME
company_size: 341 Employees
description: |
  CAIS is the pioneer in democratizing access to and education
  about alternative investments for independent financial
  advisors, empowering them to engage and transact with
  leading asset managers on a massive scale through a wide
  variety of alternative investment products and technology
  solutions. CAIS provides financial advisors with a broad
  selection of alternative investment strategies, including
  hedge funds, private equity, private credit, real estate,
  digital assets, and structured notes. CAIS also delivers
  industry-leading technology, operational efficiency, and
  world-class client service throughout the pre-trade, trade,
  and post-trade experience. CAIS supports over 50,000
  advisors who oversee more than $6 trillion in network
  assets.
  
  We are seeking someone who is the visible face of IT at CAIS
  headquarters. This role owns the day-to-day support
  experience—managing the support team, serving as the senior
  escalation point, and making sure employees can get things
  done. Alongside that, this person is a genuine practitioner
  of AI tools, using them to manage, maintain, and engineer
  solutions in the Microsoft ecosystem.
  
  This is an IT leadership role, not a software engineering or
  ML role. AI tools are how you do the work — not the work
  itself. The right person is practical and people-facing:
  comfortable with tools like Claude and Codex, able to get
  employees access to what they need, and enthusiastic about
  showing someone how to write their first useful prompt. The
  goal is to be the person who makes AI feel accessible, not
  intimidating.
  
  Key Responsibilties
  
  Pillar 1 — IT Support Leadership & Microsoft Estate
  
  - Support Team Management: Manage CAIS’s support function
    firmwide, leveraging internal staff and MSP resources.
    Hold partners accountable for performance and drive
    continuous improvement in service quality.
  - Senior Escalation Point: Act as the senior escalation point
    for all end-user support issues across the organization.
    Own complex or unresolved tickets through to resolution,
    ensuring no issue falls through the cracks between the
    support team and internal stakeholders.
  - Microsoft Environment Management: Lead day-to-day
    administration and engineering of the CAIS Microsoft
    estate: Intune device policies and compliance profiles,
    Azure / Entra enterprise application management, and M365
    service health. Beyond break-fix—this includes proactive
    configuration, policy improvement, and keeping the
    environment clean and well governed.
  - Visible Face of IT: Be physically present and accessible at
    CAIS HQ. Build trust with employees as the go-to person
    when something isn’t working—whether that’s a support
    issue or a question about technology. Represent IT in a
    way that is responsive, human, and credible.
  
  Pillar 2 — AI Operations & End-User Enablement
  
  - AI Tooling Comfort: Use Claude Code and OpenAI Codex as
    primary tools for engineering solutions in the Microsoft
    environment—generating and refining scripts, automating
    repetitive admin tasks, troubleshooting configurations,
    and improving documentation. AI tooling is how this person
    works, not an afterthought.
  - AI Access Operations: Ensure CAIS employees have access to
    the AI tools they need. Manage provisioning, permissions,
    and basic configuration for end-user AI platforms. Be the
    first point of contact when someone can’t get in, doesn’t
    know where to start, or needs a tool set up.
  - On-Ramp & Evangelism: Help colleagues take their first steps
    with AI tooling. Run informal sessions, share practical
    tips, introduce basic prompt engineering concepts, and be
    available for one-on-one guidance. The goal is not deep
    training—it’s making the tools feel approachable and
    getting people to their first win as quickly as possible.
  
  Required
  
  - Strong hands-on knowledge of Microsoft 365, Azure / Entra
    ID, and Intune—able to own configuration and policy work,
    not just administer tickets
  - Experience managing a support function—internal team, MSP,
    offshore, or a combination; comfortable holding vendors
    and partners accountable to service standards
  - Comfortable daily user of Claude Code, OpenAI Codex, or
    equivalent AI tooling—applied to real engineering and
    administrative tasks
  - Excellent communication and interpersonal skills—comfortable
    engaging at all levels of the organization and able to
    explain technology clearly to non-technical users in
    plain, practical terms
  
  Preferred
  
  - Financial services industry experience or a similar fast-
    paced, entrepreneurial environment
  
  Qualifications
  
  - 5+ years of progressive IT experience
  - 2+ years leading a support function or small team
  - Demonstrated experience using AI tools (e.g., Copilot,
    ChatGPT, Claude)
  - Hands-on expertise in automating Microsoft 365, Azure, and
    Intune environments
  
