description: |
  About Artian
  
  Artian AI is building agentic AI automation for financial
  services. Our platform enables reliable, autonomous AI
  agents to execute business-critical workflows across
  regulated enterprise environments.
  
  We are an in-person team in New York, building at the
  intersection of AI, enterprise software, workflow
  automation, and financial services. We move with urgency,
  take ownership, communicate transparently, and care deeply
  about doing excellent work. We are looking for people who
  are grounded under pressure, learn quickly, earn trust with
  teammates and customers, and want to help define how AI
  agents are deployed safely and effectively in the
  enterprise.
  
  About the Role
  
  Artian AI is looking for a Senior Software Engineer - AI/ML
  to lead development of core AI systems for our agentic
  automation platform. You will help design, build, and scale
  the AI architecture that enables autonomous agents to
  perform complex, high-stakes work for financial services
  customers.
  
  This is a senior individual contributor role for someone who
  can operate across research-informed prototyping, production
  engineering, evaluation, and system design. You will be
  expected to make high-leverage technical decisions, mentor
  other engineers, and drive AI/ML projects from ambiguous
  problem statements to reliable product capabilities.
  
  What You’ll Do
  
  - Lead design and implementation of AI/ML systems that power
    autonomous financial-services workflows.
  - Architect agentic systems involving LLMs, retrieval,
    embeddings, tool use, planning, classification, ranking,
    and structured reasoning.
  - Build rigorous evaluation infrastructure for measuring agent
    quality, task completion, hallucination risk, accuracy,
    latency, and regressions.
  - Translate customer and product needs into technical AI
    system designs that are reliable, auditable, and scalable.
  - Own major AI/ML workstreams from exploration through
    production deployment.
  - Partner closely with backend, product, and solutions teams
    to ensure AI capabilities are deeply integrated into the
    platform.
  - Mentor engineers on AI system design, experimentation,
    evaluation, and productionization.
  - Establish engineering standards for AI reliability,
    observability, safety, and maintainability.
  
  What We’re Looking For
  
  - Deep Python engineering experience and a track record of
    shipping production systems.
  - Significant experience with applied ML, LLM systems, NLP,
    retrieval, embeddings, ranking, or agentic architectures.
  - Strong system-design skills and the ability to reason about
    tradeoffs across accuracy, latency, cost, reliability, and
    maintainability.
  - Experience building evaluation pipelines, offline and online
    metrics, model monitoring, or data feedback loops.
  - Ability to operate independently in ambiguous environments
    and drive complex projects to completion.
  - Strong technical judgment and the ability to distinguish
    promising AI techniques from fragile demos.
  - Clear communication and mentorship skills.
  
  Nice to Have
  
  - MS/PhD in Computer Science, Machine Learning, Artificial
    Intelligence, or a related technical field, or equivalent
    industry experience.Experience building production LLM
    applications, AI agents, RAG systems, or enterprise
    automation platforms.
  - Experience with financial services, compliance, model risk
    management, auditability, or regulated enterprise
    workflows.
  - Experience designing human-in-the-loop workflows, approval
    systems, or agent control mechanisms.
  - Experience at an early-stage company where senior engineers
    are expected to shape product and architecture.
  
  Why Join Artian
  
  - Lead AI architecture for a category-defining enterprise
    automation platform.
  - Work on production agentic AI systems for complex, regulated
    customer environments.
  - Join a high-ownership team where senior engineers directly
    shape product direction and technical culture.
  - Help set the standard for reliable autonomous agents in
    financial services.
