description: |
  About Motion 💡
  
  Motion is building the command center for creative
  strategists: an AI-native platform that bridges the gap
  between performance marketers and creative teams, so they
  can uncover what’s working, what’s not, and ship more
  winning ads across platforms like YouTube, LinkedIn, Meta,
  and TikTok.
  
  ⁠
  
  We’re at the forefront of AI as the foundation of Motion.
  Motion now automatically analyzes and organizes creative at
  scale, surfaces competitor trends, and is rolling out a
  persistent creative strategy agent that retains context,
  runs workflows, and integrates with the tools teams already
  use.
  
  ⁠
  
  Today, Motion is trusted by some of the world’s top
  e-commerce and direct-to-consumer brands and agencies
  (including Vuori, True Classic, The Farmer’s Dog, and
  HexClad) and has analyzed over $14B in media spend. When
  leading brands want to understand their creative
  performance, they turn to us.
  
  Our founders have built successful companies before,
  including alongside several of the people now at Motion. A
  number of teammates chose to build again here — a reflection
  of the trust, culture, and conviction behind what we’re
  building.
  
  The people building Motion are deeply embedded in where AI
  and our industry is heading, and obsessed with closing the
  gap between what's possible and what's actually shipping in
  product. We're a 70+ person team, having raised over $65M in
  total capital, with consecutive record revenue quarters and
  real momentum. If you want to work on a hard problem, with
  people who've done it before, and a product that customers
  genuinely love - we'd love to connect!
  
  ▶️ Brief overview of the Motion product from our Co-Founder
  & CEO, Reza Khadjavi.
  
  About the AI Product Engineer role 🔍
  
  At Motion, the engineering team builds market leading
  software to accelerate the time to and quality of decisions
  made by creative strategists in paid advertising.
  Increasingly that means augmenting our users’ abilities with
  AI agents and intelligence drawing on the many many data
  sources we have available.
  
  We are looking for impatient, self-sufficient, pragmatic,
  and fun engineers who love building user facing products.
  You are someone who loves to build and bring new things to
  life, and own features from ideation to launch.
  
  | Our tech stack: React, Node.js with Express, TypeScript,
  GraphQL, PostgreSQL, MongoDB, and Azure.
  
  - 🎥 See an overview of the role from our Co-Founder & CTO,
    Alexander Sloan.
  - 🔗 Explore our Engineering at Motion page to learn more about
    our team, our work, and how we build together.
  - 👩‍💻 Browse our Engineering Blog for an inside look at the
    decisions our team is making, the things we're learning,
    and what it means for us to be building an AI product
    today.
  
  What you'd be doing 🛠️
  
  - Go through 2 days of industry specific and Motion specific
    onboarding, pair with a senior dev to set up the codebase,
    and push a feature in your first week.
  - Own a major initiative in your first 3 months.
  - Work on a small, high-ownership, cross-functional team, with
    weekly cycles.
  - Build user facing product ranging from cutting edge AI
    support to onboarding to creative discovery tools.
  
  Our ideal fit brings ✨
  
  - 5+ years of experience turning designs and product
    requirements into products people love and use
  - 0 to 1 experience
  - Proficiency with React, TypeScript, and Node.js (or closely
    related technologies – we’re open)
  - Excitement about using AI as part of your workflow and
    keeping up with how fast it’s changing how we build
    software
  - Any background: self-taught, bootcamp, degree, founder. We
    love talent from everywhere
  
  ...and you'll be a strong fit if you align with these
  qualities:
  
  - A strong sense of ownership: you make decisions, stand
    behind them, and fix things quickly when they’re wrong
  - A pragmatic mindset. You optimize for impact over
    perfection, care more about shipping real customer value
    than polishing every edge, and improve things over time
  - Comfort thriving in a fast-moving startup where requirements
    are ambiguous, shift quickly, and clarity isn’t handed to
    you – you create it
  - You enjoy being a strong individual contributor and a
    supportive teammate. Engineering is a team sport here 💪
  
  What you'll love about Motion 💜
  
  - Competitive compensation package: We offer competitive
    compensation, including equity for all employees, health
    benefits from day one, a monthly health & lifestyle
    stipend to support your well-being, 20 days of PTO, and a
    $1,500 work-from-home stipend.
  - Remote-first with hybrid flexibility: We're a remote-first
    company with team members spanning Canada, the U.S., and
    beyond, but also have office spaces in 4 main hubs
    (Toronto, Montreal, Vancouver, and Porto) for optional
    hybrid work.
  - Growth that speaks for itself: Motion has strong product-
    market fit, 2.5x YoY growth, second-time founders with
    deep industry knowledge, and $30M in Series B funding to
    fuel our momentum.
  - Opportunity for impact: As an early team member, your
    contributions will directly shape the product, team, and
    the future of the company. If you're excited about
    building, you’ll thrive here!
  - Award-winning team: We're a low-ego, high-performing team
    that was just ranked #19 on G2's list of Best Canadian
    Software Companies for 2026.
  - Team connection:
    - Virtual: Day-to-day, we use Roam, an AI-powered virtual
      office platform that fosters spontaneous collaboration,
      drop into meetings or quick chats, and interact with
      colleagues for a simulated, "live" digital headquarters.
    - In-person: Outside of the option to go to one of our
      offices, our team gets together in-person for a week
      every two months, and we have a company retreat every
      summer.
  
  We closed out 2024 with a $30M Series B raise and strong
  signals from our customers. In 2025, we built the
  foundational capabilities our customers rely on, setting the
  stage for what's to come. In 2026, we’re building forward
  from that foundation, taking what we learned to market in a
  deeply AI-native way. The direction is clearer, the stakes
  are higher, and there’s a lot left to build.
  
   🌎 A note on location: we're looking to hire someone based
  in Canada, the United States, or Europe but are open to
  exceptional candidates in other locations. If this position
  excites you and you believe you'd be a strong fit, we
  encourage you to apply!
  
  Motion uses artificial intelligence (AI) to support
  administrative and efficiency-focused aspects of our
  recruitment process. All interviews and hiring decisions are
  made by (human) members of the Motion team.
