  Position Summary:
  
  We are seeking a highly skilled and motivated Machine
  Learning / AI Engineer to support a federal government
  program focused on designing, developing, and deploying
  production-grade artificial intelligence and machine
  learning solutions. The role will focus on building
  scalable, secure, and high-performing AI models that support
  mission-critical decision-making and operational efficiency.
  
  The Machine Learning/AI Engineer will work across the full
  model lifecycle—from data preparation and feature
  engineering to model training, deployment, and monitoring—in
  a regulated government environment.
  
  Key Responsibilities
  
  Minimum Requirements
  
  - Bachelor’s or Master’s degree in Computer Science, Data
    Science, Artificial Intelligence, Engineering,
    Mathematics, or related field (or equivalent experience).
  - 3+ years of experience in machine learning, data science, or
    AI engineering roles.
  - Proven experience delivering production-grade machine
    learning models in real-world environments.
  - Expert proficiency in Python and ML frameworks (scikit-
    learn, TensorFlow, PyTorch).
  - Advanced SQL development experience, including complex
    queries, performance tuning, and data transformation
    logic.
  - Experience leveraging Large Language Models (LLMs) in
    development.
  - Understanding of core concepts such as context windows,
    prompt design, and input/output structures, with the
    ability to apply AI tools effectively in building and
    enhancing solutions.
  - Experience building and deploying models using scalable
    serving frameworks (e.g., REST APIs, containerized
    deployments, or cloud-based inference services).
  - Experience working with large-scale structured and
    unstructured datasets.
  - Strong understanding of machine learning concepts including
    supervised/unsupervised learning, deep learning, model
    evaluation, and feature engineering.
  - Experience working in the federal government or other highly
    regulated environments with security and compliance
    requirements.
  - Strong analytical and problem-solving skills.
  - Ability to communicate complex technical concepts to non-
    technical stakeholders.
  - Strong collaboration skills across engineering, data, and
    product teams.
  - Ability to work independently in a fast-paced, mission-
    driven environment.
  - High attention to detail with a focus on model reliability
    and production readiness.
  - US Citizenship or Permanent Residency required.
  - Must reside in the Continental US.
  - Depending on the government agency, specific requirements
    may include public trust background check or security
    clearance.
  
  Preferred Qualifications
  
