description: |
  The Applications Development Technology Lead Analyst is a
  senior-level position responsible for establishing and
  implementing new or revised application systems and programs
  in coordination with the Technology team. The Retail RWA and
  Reporting Technology team is responsible for delivering
  robust software solutions to Citi's Risk organization, with
  a primary focus on Risk-Weighted Assets (RWA) and the
  engineering of critical data products for regulatory
  reporting.
  
  The overall objective of this role is to lead complex
  applications systems analysis and programming activities,
  ensuring the platforms that manage and process a diverse
  range of financial instruments are resilient, scalable, and
  aligned with the overall architecture blueprint.
  
  Responsibilities
  
  The successful candidate will lead a team of developers,
  providing technical guidance, and ensuring the delivery of
  high-quality Java/J2EE software applications that comply
  with specifications, timescales, and quality criteria.
  
  - Partner with multiple management teams to ensure appropriate
    integration of functions to meet goals; identify and
    define necessary system enhancements to deploy new
    products and process improvements.
  - Resolve a variety of high-impact problems and projects
    through in-depth evaluation of complex business processes,
    system processes, and industry standards.
  - Provide technical thought leadership and expertise in
    advanced application programming, ensuring application
    design adheres to the overall architecture blueprint.
  - Utilize advanced knowledge of system flow to develop and
    enforce standards for coding, testing, debugging, and
    implementation.
  - Develop a comprehensive knowledge of how areas of business,
    such as architecture and infrastructure, integrate to
    accomplish business goals.
  - Serve as an advisor and coach to mid-level and senior
    developers and analysts, allocating work and providing
    technical mentorship.
  - Lead design, code, and project review meetings with local
    and global teams.
  - Take ownership of all applications in the assigned sub-
    domain within Risk Technology, ensuring they remain lean,
    resilient, robust, self-healing, and scalable.
  - Appropriately assess risk when business decisions are made,
    demonstrating particular consideration for the firm's
    reputation and safeguarding Citigroup, its clients, and
    assets, by driving compliance with applicable laws, rules,
    and regulations.
  
  Technical Skills
  
  Mandatory:
  
  - 10+ years of relevant experience in application development
    and systems analysis.
  - Extensive experience in the programming of complex software
    applications, with expert-level Object-Oriented Design
    skills.
  - Expert knowledge of Core Java (Threading, Collections,
    Synchronization, Locking, Annotations, Generics) and J2EE.
  - Strong experience with Spring Core and Spring Batch.
  - Advanced ability to write and optimize complex SQL Queries
    and PL/SQL.
  - Subject Matter Expert (SME) in applying design patterns to
    solve complex architectural challenges.
  - Proven experience with Microservices architecture and
    development on cloud platforms.
  - Experience with build scripts like Ant and Maven, and IDEs
    such as Eclipse.
  - Deep understanding of ETL, ELT, and data warehousing
    concepts.
  - Experience with NoSQL databases (e.g., MongoDB) or in-memory
    caches (e.g., GemFire/Redis/Hazelcast).
  - Experience with Unix/Linux environments and shell scripting.
  
  Business knowledge:
  
  - Familiarity with Retail Banking products (e.g., Mortgages,
    Credit Cards, Personal Loans), Risk-Weighted Assets (RWA),
    and risk reporting principles.
  
  Soft Skills
  
  - Demonstrated leadership and project management skills.
  - Consistently demonstrates clear and concise written and
    verbal communication.
  - Strong ability to adjust priorities quickly as circumstances
    dictate.
  - Experience managing and implementing successful, large-scale
    projects.
  - Excellent problem-solving skills with a strong design and
    execution mindset.
  - Ability to lead and motivate a team, troubleshoot conflicts,
    and manage stakeholder expectations.
  - Proactive, self-starter with a passion for technology and a
    disciplined approach to the SDLC.
  
  Education
  
  - Bachelor’s degree/University degree or equivalent
    experience.
  - Master’s degree preferred.
  
  AI Co-pilot / AI Tools for Development
  
  Experience with AI co-pilot and other AI-driven development
  tools is highly valued. The ideal candidate will be
  proficient in leveraging these tools to enhance
  productivity, code quality, and accelerate development
  cycles. This includes:
  
  - Efficient Prompting: Demonstrating expertise in crafting
    clear, concise, and effective prompts to maximize the
    utility of AI co-pilots for code generation, debugging,
    refactoring, and documentation.
  - Code Optimization: Utilizing AI tools to identify and
    implement performance improvements, security enhancements,
    and adherence to best practices within Java/J2EE
    applications.
  - Automated Testing Support: Employing AI capabilities to
    generate test cases, analyze code coverage, and streamline
    testing processes for faster and more reliable
    deployments.
  - Knowledge Sharing: Promoting the adoption of AI development
    tools within the team and contributing to best practices
    for their efficient and accurate use.
  
