description: |
  Role Overview:
  
  We are seeking a Cloud Development Engineer with strong
  AI/ML expertise to design and build scalable, cloud‑native
  systems that power intelligent automation and data‑driven
  decisioning. This role focuses on building backend services,
  AI/ML pipelines, and cloud platforms that support advanced
  classification, personalization, and prediction use cases.
  You will work hands‑on across cloud infrastructure, data
  platforms, and machine learning systems, collaborating
  closely with product, data, and platform teams. This is a
  Hybrid position located at our Bangalore, India development
  center. You will be required to be on-site 2 to 3 days per
  week. When you are not working on-site, you will be working
  from your home office. We are only considering candidates
  within a commutable distance to our Bangalore office and are
  not offering relocation assistance at this time.
  
  About the Role:
  
  • Design and build scalable cloud‑native platforms and
  backend services enabling AI/ML-driven applications.
  
  • Develop APIs and microservices using Python, .NET or Java
  for high‑through put and low‑latency systems.
  
  • Build and operate ML platforms, including model deployment
  and real‑time/ batch inference pipelines.
  
  • Architect secure, reliable solutions on AWS/GCP,
  leveraging Databricks for data processing and ML workflows.
  
  • Drive platform standards, CI/CD, containerization, and
  collaborate across product, data, and engineering teams.
  
  About You:
  
  • 5–8 years of hands-on experience in cloud/backend or
  platform engineering with production systems.
  
  • Strong proficiency in Python with working knowledge of
  .NET or Java.
  
  • Experience with AWS/GCP, distributed systems, and
  MongoDB/SQL databases at scale.
  
  • Practical understanding of ML concepts with experience in
  model deployment and inference pipelines.
  
  • Familiarity with Databricks, Docker, CI/CD, and a strong
  platform mindset with ownership and collaboration skills.
  
  #LI-Hybrid
  
