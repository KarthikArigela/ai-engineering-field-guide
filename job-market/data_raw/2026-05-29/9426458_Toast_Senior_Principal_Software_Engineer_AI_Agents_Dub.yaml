description: |
  This hybrid role is based in Dublin, Ireland (Full
  relocation provided).
  
  Toast creates technology to help restaurants and local
  businesses succeed in a digital world, helping business
  owners operate, increase sales, engage customers, and keep
  employees happy.
  
  Your mission is to drive architecture, technical strategy,
  and implementation of AI agents for Toast's Team area which
  is part of the Fintech line of business. You will be one of
  the most senior technologists in line of business. The Team
  area is a mission-critical space on which our restaurants
  rely to manage their staff and optimize their labor. Beyond
  being on the forefront of agent development, your scope will
  also include enablement and leadership for how software is
  developed at Toast through adoption of bleeding edge spec
  driven development and other paradigms.
  
  A day in the life (Responsibilities)
  
  - Develop and drive an architectural vision to support the
    ambitious goals for agents and agent development
  - Be an active participant and an authoritative technical
    voice in FinTech product strategy discussions
  - Partner with the Team Management Director of Engineering and
    Sr. Director of Product to successfully deliver Team agent
    products from design to production
  - Work closely with other Senior Principal Engineers to
    further the agent patterns and ecosystem across Toast as a
    whole
  - Evolve an ever more efficient way of working through agents
    and spread it across Toast
  - Work directly with the product manager for the Team Agent
    space, collaborating to drive vision
  - Be hands on and actively participate in development on the
    Team Agent
  - Mentor and develop technical leadership across Team, and
    Fintech
  
  What you'll need to thrive (Requirements)
  
  - 15+ years experience designing and building highly scalable,
    mission-critical distributed and fullstack software
    systems
  - 10+ years experience building and operating SaaS products,
    ideally AWS hosted
  - 1+ years experience using the latest in coding agents
  - A strong desire to lean all in on agentic development
    practices
  - Passion for building autonomous agents
  - Demonstrated ability to drive technical architecture for a
    company or highly scalable line of products
  - A desire to work not only with technologists but also
    product owners and business leaders
  - Ability and desire to draw big lines and boxes on a
    whiteboard paired with the ability to dig in and
    understand the ebb and flow of what the code is doing
    under load
  - Ability and desire to communicate and influence at the
    executive level
  
  What will help you stand out (Nonessential Skills/Nice to
  Haves)
  
  - Experience designing agentic products
  - Experience building systems that leverage LLMs and other ML
    models
  - Experience with enterprise integration using Apache Camel
  - Experience architecting event-driven distributed systems
    using Apache Pulsar
  - Experience defining test, build and deploy strategies
  - Solid understanding of workforce management
  - Solid understanding of restaurant operations
  
