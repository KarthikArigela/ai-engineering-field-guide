description: |
  Lyric is an AI-first, platform-based healthcare technology
  company, committed to simplifying the business of care by
  preventing inaccurate payments and reducing overall waste in
  the healthcare ecosystem, enabling more efficient use of
  resources to reduce the cost of care for payers, providers,
  and patients. Lyric, formerly ClaimsXten, is a market leader
  with 35 years of pre-pay editing expertise, dedicated teams,
  and top technology. Lyric is proud to be recognized as 2025
  Best in KLAS for Pre-Payment Accuracy and Integrity and is
  HI-TRUST and SOC2 certified, and a recipient of the 2025
  CandE Award for Candidate Experience. Interested in shaping
  the future of healthcare with AI? Explore opportunities at
  lyric.ai/careers and drive innovation with
  #YouToThePowerOfAI.
  
  The Staff AI Engineer is a senior technical leader who will
  architect the core ML infrastructure and establish
  engineering standards for intelligent systems that extract
  and structure data from unstructured documents such as PDFs,
  scanned forms, and medical policies. This role will define
  technical architecture across multiple teams, lead the
  design and deployment of production-scale machine learning
  platforms and generative AI solutions, with a particular
  emphasis on building foundational capabilities that enable
  language models (SLM/LLMs) to operate reliably in healthcare
  settings at scale. In addition, this position will mentor
  other AI engineers and manage delivery for the India team.
  
  This is not a research role.
  
  ESSENTIAL JOB RESPONSIBILITIES & KEY PERFORMANCE OUTCOMES
  
  - Architect and drive the strategic vision for AI/ML platforms
    that power document ingestion, understanding, and
    extraction across multiple product teams and use cases.
  - Establish organization-wide frameworks and standards for
    dataset quality, ML validation methodologies, and model
    verification processes that ensure healthcare-grade safety
    and compliance.
  - Define core ML infrastructure for LLM operations, including
    model serving platforms, fine-tuning pipelines, and
    generative AI systems that enable teams to build reliable
    document understanding applications at scale.
  - Lead the technical architecture for production capabilities.
  - Build and optimize the core RAG infrastructure, vector
    database architecture, and LLM integration patterns that
    enable efficient retrieval and structured output
    generation for downstream systems.
  - Drive cross-functional technical strategy, partnering with
    product, clinical, and engineering leadership to align
    multi-quarter ML roadmaps with business requirements and
    regulatory compliance.
  - Mentor junior/mid AI/ML engineers across distributed teams,
    establish best practices for model training, evaluation,
    and monitoring, and define ML engineering standards that
    scale across the organization.
  - Stay abreast of the latest advancements in generative AI and
    lead technical evaluation and adoption of cutting-edge
    techniques that provide measurable business value.
  
  REQUIRED QUALIFICATIONS
  
  - Minimum of ten (10) years of experience in AI/ML
    engineering, with at least three (3) years in a technical
    or team leadership role
  - Previous technical leadership in the AI/ML leadership space
  - Hands-on experience building and deploying S/LLMs or
    generative AI applications (e.g., using Llama, Deepseek or
    similar frameworks)
  - Proven track record of extracting structured data from
    unstructured document sources, including scanned forms,
    free-text reports, and complex layouts
  - Strong software engineering skills in Python and ML
    frameworks (e.g., Kubeflow, PyTorch, multi-agentic
    frameworks)
  - Experience with OCR technologies (e.g., Tesseract, Amazon
    Textract), NLP techniques, and model deployment in
    production environments
  - Deep understanding of NLP methods including embeddings,
    transformers, named entity recognition (NER), and text
    classification
  - Familiarity with MLOps, version control, CI/CD, and cloud
    platforms (AWS, GCP, or Azure).
  
  PREFERRED QUALIFICATIONS
  
  - Experience implementing retrieval-augmented generation
    (RAG), prompt engineering, or fine-tuning foundation
    models
  - Familiarity with vector databases (e.g., Postgres-pg-vector,
    Pinecone, FAISS, Weaviate) and semantic search
  - Strong experience shipping production ML systems with a
    track record of monitoring and improving the ML systems
  - Experience working in regulated domains such as healthcare,
    legal, or finance
  
  ***The US base salary range for this full-time position is:
  
  $216,417.00 - $324,625.00
  
