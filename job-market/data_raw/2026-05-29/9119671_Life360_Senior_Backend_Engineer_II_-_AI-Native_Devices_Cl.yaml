title: Senior Backend Engineer II - AI-Native, Devices Cloud
company: Life360
location: USA
remote: true
work_type: FULL_TIME
description: |
  About Life360
  
  Life360’s mission is to keep people close to the ones they
  love. Our category-leading mobile app,Tile tracking devices,
  and Pet GPS tracker empower members to protect the people,
  pets, and things they care about most with a range of
  services, including location sharing, safe driver reports,
  and crash detection with emergency dispatch. Life360 serves
  approximately 97.8 million monthly active users (MAU), as of
  March 31, 2026, across more than 180 countries.
  
  Life360 delivers peace of mind and enhances everyday family
  life with seamless coordination for all the moments that
  matter, big and small. By continuing to innovate and deliver
  for our customers, we have become a household name and the
  must-have mobile-based membership for families (and those
  friends who are basically family).
  
  Life360 has more than 500 (and growing!) remote-first
  employees. For more information, please visit life360.com.
  
  Life360 is a Remote-First company, which means a remote work
  environment will be the primary experience for all
  employees. All positions, unless otherwise specified, can be
  performed remotely (within the US) regardless of any
  specified location above.
  
  We are AI Native
  
  We are building an AI native company where AI is an integral
  part of how we build and operate. AI tool usage during
  interviews varies by role. You may be asked to demonstrate
  proficiency with AI tools, discuss how you leverage AI, or
  complete interview exercises without AI assistance. Your
  Recruiter will provide clear guidance as you move through
  the interview process. Undisclosed use of AI not previously
  discussed with or approved by your Recruiter may impact your
  candidacy.
  
  About the Devices Cloud Team
  
  The Devices Cloud team owns the backend services that power
  Life360's fleet of connected hardware — Tile trackers,
  Jiobit wearables, and emerging device categories. We manage
  real-time device state, high-frequency telemetry ingest, and
  the cloud infrastructure that translates physical-world
  signals into reliable, family-facing experiences. Our work
  sits at the intersection of hardware, firmware, mobile, and
  platform — and runs at a scale where correctness and
  reliability aren't optional.
  
  We are an AI-Native team. AI isn't an add-on to how we work
  — it's how we work. We've redesigned our development
  workflows around AI, using it as a first-class collaborator
  at every stage: spec writing, code generation, test
  authoring, incident triage, and system design. We ship
  faster and go deeper because of it. We're looking for
  engineers who want to help define what AI-native backend
  development looks like for complex, hardware-connected
  systems.
  
  About the Job
  
  As a Senior Backend Engineer on the Devices Cloud team,
  you'll build and operate the cloud services that power
  Life360's connected devices. This role sits at the
  intersection of hardware, firmware, and mobile — translating
  real-world device signals into reliable, scalable backend
  systems.
  
  You don't just use AI tools. You think natively in them.
  Your primary workflow involves orchestrating agents to
  create specs, generate code and tests, verify results, and
  perform reviews. You'll help establish and evolve AI-native
  engineering practices for the Devices Cloud team — playbooks
  the broader org can adopt — while delivering backend systems
  that serve millions of families daily.
  
  For candidates based in the US, the salary range for this
  position is $148,000 to $216,500 USD. For candidates based
  out of Canada, the salary range is 171,500 to 201,000 CAD.
  Note: We take into consideration an individual's background
  and experience in determining final salary- therefore, base
  pay offered may vary considerably depending on geographic
  location, job-related knowledge, skills, and experience. The
  compensation package includes a wide range of medical,
  dental, vision, financial, and other benefits, as well as
  equity.
  
  What You'll Do
  
  - Design, build, and maintain backend services for device
    connectivity, telemetry ingest, health monitoring, and
    command/control operations — using AI (Claude Code) as a
    first-class collaborator in your daily development
    workflow.
  - Use agentic workflows to dramatically increase delivery
    velocity without sacrificing quality: from generating
    service scaffolding, to writing and validating test
    coverage, to triage and root cause analysis during
    incidents.
  - Help define and codify AI-native engineering practices for
    the Devices Cloud team — establishing patterns the broader
    org can adopt.
  - Collaborate with firmware, mobile, and product teams to
    define APIs and workflows for device-driven features.
  - Build and own data pipelines for high-throughput telemetry
    streams using Kafka or similar streaming technologies.
  - Deliver scalable, resilient microservices on AWS (EKS,
    Lambda, DynamoDB, SQS, etc.).
  - Instrument services for observability, reliability, and SLO
    compliance.
  - Participate in on-call rotation and live incident response.
  - Write clean, testable, performant code; contribute to CI/CD
    automation and improve team-wide engineering standards.
  - Mentor teammates and help evolve the team's AI-native
    engineering culture.
  
  What We're Looking For
  
  - 5+ years of experience building and operating high-quality
    backend services in Java, Go, Python, or similar
    languages.
  - Hands-on experience prompting, evaluating, and building with
    LLMs — not just autocomplete, but as a genuine development
    partner.
  - Deep experience with agentic workflows, prompt engineering,
    context window management, and MCP/function calling.
  - A track record of using AI tooling to multiply your own
    output — faster specs, better test coverage, cleaner code,
    faster debugging.
  - Strong experience with microservices architecture, RESTful
    API design, and distributed systems.
  - Solid skills with cloud infrastructure (AWS preferred),
    container orchestration, and production deployments.
  - Experience with databases (relational and/or NoSQL),
    caching, and event/streaming systems.
  - Ability to collaborate across teams and articulate technical
    tradeoffs clearly.
  - A genuine drive to define what AI-native looks like for
    complex, hardware-connected systems — you're not waiting
    for the playbook, you want to write it.
  
  Nice-to-Have
  
  - Experience with IoT, telematics, or embedded/hardware-
    adjacent systems.
  - Familiarity with Kafka, Kinesis, or other high-throughput
    streaming platforms.
  - Experience with high-frequency ingest systems and time-
    series data.
  - Background with observability tooling (Prometheus, Grafana,
    OpenTelemetry, DataDog).
  - Knowledge of SRE practices and automated testing frameworks.
  
  AI-Native Expectations
  
  We use AI coding tools as a professional standard on this
  team. Here's what that means in practice:
  
  - Daily use: You use AI coding assistants (we support Claude
    Code, Cursor, and GitHub Copilot) for real, substantive
    tasks: analysis, coding, refactoring, testing, navigating
    codebases, and documentation. Not just research or
    autocomplete.
  - Judgment and ownership: AI-generated code gets the same
    review you'd give any PR. You are accountable for
    everything you ship.
  - Velocity: We expect senior engineers who use AI well to
    operate with meaningful leverage — doing more with the
    same time, taking on problems that would otherwise require
    a larger team.
  - Team leadership: You share what works. You automate
    prompting strategies that others can build on and help
    teammates earlier in their AI workflow adoption get up to
    speed.
  - Continuous learning: The tooling is changing fast. You stay
    current and bring recommendations to the team when
    something would meaningfully improve how we work.
  
  Our Benefits
  
  - Competitive pay and benefits
  - Medical, dental, vision, life and disability insurance plans
    (US and Canada)
  - 401(k) plan with company matching (US) / RRSP with DPSP
    matching (Canada)
  - Employee Assistance Program (EAP) for mental well-being
  - Flexible PTO, plus several company-wide days off throughout
    the year
  - Winter and Summer week-long synchronized company shutdowns
  - Learning & Development programs
  - Equipment, tools, and reimbursement support for a productive
    remote environment
  - Free Life360 Platinum Membership for your preferred circle
  - Free Tile Products
  
  Life360 Values
  
  Our company’s mission-driven culture is guided by our shared
  values to create a trusted work environment where you can
  bring your authentic self to work and make a positive
  difference.
  
  - Be a Good Person — We have a team of high-integrity people
    you can trust.
  - Be Direct With Respect — We communicate directly, even when
    it’s hard.
  - Members Before Metrics — We focus on building an exceptional
    experience for families.
  - High Intensity, High Impact — We do whatever it takes to get
    the job done.
  
  Our Commitment to Diversity
  
  We believe that different ideas, perspectives and
  backgrounds create a stronger and more creative work
  environment that delivers better results. Together, we
  continue to build an inclusive culture that encourages,
  supports, and celebrates the diverse voices of our
  employees. It fuels our innovation and connects us closer to
  our customers and the communities we serve. We strive to
  create a workplace that reflects the communities we serve
  and where everyone feels empowered to bring their authentic
  best selves to work.
  
  We are an equal opportunity employer and value diversity at
  Life360. We do not discriminate on the basis of race,
  religion, color, national origin, gender, sexual
  orientation, age, marital status, veteran status, disability
  status or any legally protected status.
  
  We encourage people of all backgrounds to apply. We believe
  that a diversity of perspectives and experiences create a
  foundation for the best ideas. Come join us in building
  something meaningful. Even if you don’t meet 100% of the
  above qualifications, you should still seriously consider
  applying!
  
