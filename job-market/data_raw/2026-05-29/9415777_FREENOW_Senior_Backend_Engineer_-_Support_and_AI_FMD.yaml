description: |
  Location: Come and join us in Berlin!
  
  Freenow by Lyft empowers smarter mobility decisions helping
  people to move freely and cities to thrive. Be ready to work
  in a multinational, diverse, highly motivated and
  collaborative marketing team who strives for excellence and
  likes to have fun. Are you ready for your next ride?
  
  Join us as a Senior Backend Engineer to build the
  intelligent systems that power our support teams, drivers
  and passengers. You will drive the development of reliable
  and scalable backend services that bring our AI asset
  features to life end-to-end.
  
  Be ready to join a multinational, diverse, highly motivated
  and collaborative team who strives for excellence and likes
  to have fun, while building great features and products.
  
  YOUR DAILY ADVENTURES WILL INCLUDE:
  
  - Architect, build, and maintain robust backend services
    powering AI-driven support flows, from intent routing to
    automated case resolution.
  - Integrate and orchestrate LLMs to power AI-assisted support
    experiences for drivers and passengers.
  - Run testing and evaluations for AI agents, defining test
    scenarios, using evaluation tooling, and validating agent
    behaviour manually and at scale.
  - Ensure AI systems are observable and reliable through
    monitoring of latency, fallback rates, and output quality.
  - Own features end-to-end, from concept through to deployment
    and performance monitoring, partnering with engineers,
    product managers, and support teams to deliver meaningful,
    user-centered solutions.
  - Experiment with AI-enhanced tools and features to elevate
    our products and engineering practices.
  - Bring your ideas to life and help shape how we work, grow,
    and innovate as a team.
  - Actively engage in our engineering communities to share
    insights, mentor other engineers, and contribute to a
    culture built on transparency, continuous learning, and
    mutual respect.
  
  Our Techstack: Kotlin | TypeScript | Spring | React | AWS |
  Docker | Git | Kafka & more
  
  TO BE SUCCESSFUL IN THIS ROLE:
  
  - Strong hands-on backend development experience, with
    proficiency in Kotlin and Spring.
  - Experience with distributed systems, event-driven
    architectures (e.g. Kafka), CI/CD pipelines, and
    observability tooling (e.g. Grafana, Datadog, Kibana).
  - Experience integrating and working with LLMs (e.g. Gemini,
    GPT, Claude) in production systems, with familiarity with
    AI agent concepts, tool use and intent classification.
  - Experience with intent testing and evaluation of AI agents
    using evaluation tools and frameworks.
  - Owner mentality, you care deeply about quality, continuous
    improvement and technical mentorship.
  - You thrive in a self-organized, agile team that values
    autonomy, open communication, and purpose-driven work.
  - You bring creativity and a problem-solving mindset to
    technical challenges.
  - You actively use AI tools (e.g. Copilot, Cursor, Claude) as
    part of your day-to-day development workflow.
  - You communicate clearly and confidently in English, both
    written and spoken.
  
  BENEFITS & PERKS IN A NUTSHELL:
  
  - Flexible working arrangements
  
  - LinkedIn Learning
  
  - Sabbatical & special leave policies
  
  - WeRoad partnership
  
  - Birthday, 24th + 31st December off
  
  - Short term EU work policy
  
  - Mobility Credit
  
  - Health Insurance
  
  - Employee assistance program
  
   DIVERSITY, EQUITY & INCLUSION:
  
  Freenow is an equal opportunity employer and we consider
  qualified applicants regardless of race, religion, national
  origin, gender, gender identity, sexual orientation,
  disability or age. We want you to grow and evolve, bring
  your true self to work.
  
  ABOUT FREENOW:
  
  Freenow by Lyft empowers smarter mobility decisions, helping
  people to move freely and cities to thrive. Through our
  multi-mobility app, we feature broad options for everyone
  across 9 European markets and over 180 cities. Millions of
  passengers can access services including taxis, private hire
  vehicles, carsharing, car rental, e-scooters, e-bikes,
  e-mopeds, and public transport within a single app.
  
  In July 2025 Freenow was acquired by Lyft, a global mobility
  platform, which connects riders and drivers for billions of
  rides across North America and Europe. Together, Freenow and
  Lyft are creating a more caring and connected world, with
  transportation for everyone. We are a global, diverse,
  highly motivated, and collaborative team that strives for
  excellence and likes to have fun. Ready for your next ride?
