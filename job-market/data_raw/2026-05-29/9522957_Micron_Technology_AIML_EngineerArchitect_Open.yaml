description: |
  Our vision is to transform how the world uses information to
  enrich life for all .  Micron Technology is a world leader
  in innovating memory and storage solutions that accelerate
  the transformation of information into intelligence,
  inspiring the world to learn, communicate and advance faster
  than ever.
  
  - Position SummaryWe are seeking a forward-thinking AI/ML Dev
    & Architecture Engineer to lead the exploration,
    prototyping, and productization of cutting-edge AI/ML
    techniques, as well as the development of governance
    frameworks for responsible AI deployment. This role
    combines deep technical research and development with
    strategic direction to ensure that AI/ML innovation is
    both impactful and aligned with SPG's operational goals
    and ethical standards.Key Responsibilities
  - Lead the prototyping of AI/ML models and architectures,
    ensuring rapid experimentation and iteration to validate
    feasibility and performance.
  - Drive the integration of validated ML solutions into
    production environments and product lines, ensuring
    scalability, reliability, and alignment with SPG's
    strategic goals.
  - AI Research EngineeringExplore, prototype, and evaluate
    state-of-the-art AI/ML techniques with a focus on
    architectural design. Lead experimentation efforts to
    assess feasibility and performance of novel models and
    frameworks.
  - AI/ML Algorithm DevelopmentDesign and deploy AI/ML models to
    solve real-world problems, improve efficiency, and support
    key functional workflows in SPG.
  - AI Governance ArchitectureDefine and implement AI governance
    policies, including model validation, compliance, and
    ethical use standards. Collaborate with legal, security,
    and engineering teams to ensure responsible AI practices
    across SPG.
  - Cross-Functional CollaborationPartner with engineering, data
    science, and program management teams to align research
    outcomes with product roadmaps and operational needs.
  - Tool and Framework LeadershipGuide the selection and
    integration of AI/ML development tools and platforms.
    Promote best practices in model development,
    documentation, and lifecycle management.
  - Stakeholder CommunicationPresent research findings,
    architectural proposals, and governance strategies to
    senior leadership and cross-functional
    stakeholders.Qualifications
  - Bachelor's or Master's degree in Computer Science,
    Electrical Engineering, or a related field.
  - 3+ years of experience in AI/ML systems design, with a
    strong emphasis on architecture and research.
  - Demonstrated experience in developing AI governance
    frameworks or contributing to responsible AI initiatives.
  - Strong communication skills and the ability to translate
    complex research into actionable strategies.
  - Desired experience with storage systems across validation,
    firmware, and development workflows.
  
