title: Senior Software Engineer, Voice AI
company: Natera
location: USA
work_type: FULL_TIME
description: |
  Role Description
  
  This is a high-autonomy, high-agency position for a voice AI
  engineer who thrives at the intersection of real-time
  systems, conversational AI, and healthcare. You'll own the
  architecture and delivery of Natera's Voice AI platform — a
  production system handling thousands of patient calls daily
  that provides automated test status, identity verification,
  billing support, and intelligent routing to human agents.
  
  You'll work across the full voice AI stack: telephony,
  speech-to-text, LLM orchestration, text-to-speech, and
  analytics — building agentic conversational systems that
  directly improve patient access to their genetic testing
  results. This role requires deep understanding of the
  intricacies unique to voice AI: real-time audio streaming,
  turn-taking, interruption handling, latency optimization,
  and the orchestration challenges that distinguish voice from
  text-based AI systems.
  
  Your work will span two critical domains:
  
  1. Voice AI Platform Engineering
  
  Design, build, and operate Natera's production voice AI
  system. This includes multi-agent orchestration, real-time
  WebSocket audio pipelines, telephony integration, and the
  voice-specific challenges of latency management, VAD tuning,
  barge-in handling, and ASR accuracy for medical terminology.
  
  2. Agentic Conversational Architecture
  
  Architect and implement autonomous agent workflows that
  handle complex patient interactions end-to-end — identity
  verification, OTP validation, personalized test status
  delivery, billing inquiries, and intelligent escalation.
  You'll design tool-calling patterns, agent handoff logic,
  state management across conversation turns, and the
  analytics infrastructure needed to measure and improve call
  efficacy.
  
  What You'll Do
  
  - Own the end-to-end voice AI architecture — from Twilio media
    streams through LLM orchestration to TTS output and call
    disposition
  - Design and implement multi-agent systems using tool calling,
    agent handoffs, and shared conversation state for complex
    patient workflows
  - Build and optimize real-time audio pipelines — WebSocket
    streaming, codec handling (mulaw/PCM), VAD configuration,
    and interruption management
  - Architect analytics and observability infrastructure for
    voice-specific metrics: per-segment latency (STT/LLM/TTS),
    call efficacy, disposition accuracy, and ASR error rates
  - Solve voice-specific challenges: turn-taking timing, silence
    detection thresholds, barge-in recovery, medical term
    recognition, and end-to-end latency optimization
  - Integrate voice agents with internal services via secure
    authenticated APIs
  - Drive platform reliability — eliminate single points of
    failure, implement multi-provider LLM failover, and design
    graceful degradation paths
  - Collaborate with product and clinical operations to improve
    self-serve efficacy rates and reduce call escalations
  - Mentor team members on voice AI best practices and
    contribute to architectural decisions
  
  What We're Looking For
  
  - 5+ years of software engineering experience, with at least 2
    years building production voice AI or conversational AI
    systems
  - Deep experience with voice AI pipelines — you understand the
    end-to-end flow from telephony through STT, LLM
    processing, TTS, and back to the caller, and you've solved
    real problems at each stage
  - Production experience with agentic architectures — multi-
    agent orchestration, tool calling, agent handoffs,
    memory/state management, and LLM-driven decision making in
    real-time conversation contexts
  - Strong understanding of voice-specific challenges: VAD
    tuning, turn-taking, interruption/barge-in handling,
    latency budgets, audio codec management, and the
    differences between voice and text-based AI UX
  - Hands-on experience with telephony systems — Twilio (media
    streams, SIP, IVR), or equivalent platforms with
    WebSocket-based audio streaming
  - Proficiency in TypeScript/Node.js with strong async
    programming patterns; experience with NestJS or similar
    frameworks
  - Experience with STT/TTS providers (Deepgram, OpenAI,
    ElevenLabs, Azure Speech) and understanding of ASR
    accuracy challenges (domain-specific vocabulary, noise
    handling)
  - Production experience with LLM APIs — OpenAI (especially
    Realtime API), Anthropic Claude, or equivalent; prompt
    engineering for conversational agents
  - High agency and autonomy — you don't wait for permission,
    detailed specs, or hand-holding. You unblock yourself,
    seek out the highest-impact work, and drive it to
    completion
  - Excellent communication — you can translate complex voice AI
    architecture decisions for product and clinical
    stakeholders
  
  Preferred
  
  - Experience in healthcare, biotech, or regulated environments
    (HIPAA, PHI handling, zero-retention architectures, BAA
    compliance)
  - AWS infrastructure experience — ECS Fargate, Lambda,
    DynamoDB, Bedrock, Kafka/MSK, API Gateway, CDK
  - Background in real-time systems: WebSocket lifecycle
    management, connection resilience, streaming protocols
  - Experience building analytics pipelines for
    voice/conversational metrics (call efficacy, disposition
    tracking, latency observability)
  - Familiarity with RAG architectures (vector stores, embedding
    models, chunking strategies) for knowledge-grounded voice
    agents
  - Track record of migrating or evaluating vendor platforms
    while maintaining production uptime
  - Experience with Datadog APM, LLM Observability, or
    equivalent monitoring for AI systems
  - Prior experience in a high-growth startup or zero-to-one
    product environment
  
  OUR OPPORTUNITY
  
  Natera™ is a global leader in cell-free DNA (cfDNA) testing,
  dedicated to oncology, women’s health, and organ health. Our
  aim is to make personalized genetic testing and diagnostics
  part of the standard of care to protect health and enable
  earlier and more targeted interventions that lead to longer,
  healthier lives.
  
  The Natera team consists of highly dedicated statisticians,
  geneticists, doctors, laboratory scientists, business
  professionals, software engineers and many other
  professionals from world-class institutions, who care deeply
  for our work and each other. When you join Natera, you’ll
  work hard and grow quickly. Working alongside the elite of
  the industry, you’ll be stretched and challenged, and take
  pride in being part of a company that is changing the
  landscape of genetic disease management.
  
  WHAT WE OFFER
  
  Competitive Benefits - Employee benefits include
  comprehensive medical, dental, vision, life and disability
  plans for eligible employees and their dependents.
  Additionally, Natera employees and their immediate families
  receive free testing in addition to fertility care benefits.
  Other benefits include pregnancy and baby bonding leave,
  401k benefits, commuter benefits and much more. We also
  offer a generous employee referral program!
  
  For more information, visit www.natera.com.
  
  Natera is proud to be an Equal Opportunity Employer. We are
  committed to ensuring a diverse and inclusive workplace
  environment, and welcome people of different backgrounds,
  experiences, abilities and perspectives. Inclusive
  collaboration benefits our employees, our community and our
  patients, and is critical to our mission of changing the
  management of disease worldwide.
  
  All qualified applicants are encouraged to apply, and will
  be considered without regard to race, color, religion,
  gender, gender identity or expression, sexual orientation,
  national origin, genetics, age, veteran status, disability
  or any other legally protected status. We also consider
  qualified applicants regardless of criminal histories,
  consistent with applicable laws.
  
  If you are based in California, we encourage you to read
  this important information for California residents.
  
  Link: https://www.natera.com/notice-of-data-collection-
  california-residents/
  
