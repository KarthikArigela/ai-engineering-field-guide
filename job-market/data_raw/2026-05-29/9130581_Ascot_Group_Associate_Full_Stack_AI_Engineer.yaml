description: |
  This is an opportunity to join Ascot Group - one of the
  world’s preeminent specialty risk underwriting
  organizations.
  
  
  
  Designed as a modern-era company operating through an
  ecosystem of interconnected global operating platforms,
  we’re bound by a common mission and purpose: One Ascot. Our
  greatest strength is a talented team who flourishes in a
  collaborative, inclusive, and entrepreneurial culture,
  steeped in underwriting excellence, integrity, and a passion
  to find a better way, The Ascot Way.
  
  
  
  The Ascot Way guides our people and our organization. Our
  underwriting platforms collaborate to find creative ways to
  deploy our capital in a true cross-product and cross-
  platform approach. These platforms work as one, deploying
  our capital creatively through our unique Fusion Model:
  Client Centric, Risk Centric, Technology Centric.
  
  
  
  Built to be resilient, Ascot maximizes client financial
  security while delivering bespoke products and world class
  service — both pre- and post-claims. Ascot exists to solve
  our clients’ brightest tomorrow, through agility,
  collaboration, resilience, and discipline.
  
  
  
  
  
  Position Overview:
  
  
  
  Reporting to the Senior AI Data Program Manager, the
  Associate Full Stack AI Engineer will support the design and
  development of insurance workflows built on Palantir Foundry
  and Artificial Intelligence Platform (AIP). This role is
  well suited for an exceptional early-career engineer or
  recent graduate with strong technical fundamentals,
  intellectual curiosity, and the ability to learn complex
  enterprise platforms. The successful candidate will join a
  multidisciplinary team delivering data-driven applications
  that drives efficiency and enables operational decision-
  making at scale. While prior Palantir experience is not
  required, the individual must demonstrate the aptitude and
  discipline to be trained on Foundry’s data, ontology, and
  application frameworks, as well as AIP-enabled workflows.
  This role will be in the office on a hybrid work schedule.
  
  
  
  
  
  Responsibilities:
  
  
  
  - Develop and maintain AI Applications deployed within
    Palantir Foundry and AIP environments
  - Implement user interfaces that translate complex data models
    and workflows into intuitive, reliable user experiences
  - Build AI automation with Foundry ontologies, APIs, and
    backend services
  - Collaborate with data engineers, backend developers, and
    business stakeholders to support end-to-end application
    delivery
  - Participate in code reviews, testing, documentation, and
    controlled release processes
  - Learn and apply best practices related to data governance,
    security, and performance within Palantir platforms
  - Progressively assume ownership of features and application
    modules as technical proficiency increases
  - Commitment to The Ascot Way: Embody The Ascot Way in their
    daily interaction with colleagues, fostering colleague
    engagement and development, collaboration, inclusivity,
    and individual accountability.
  
  
  
  
  
  Requirements:
  
  
  
  - Bachelor’s degree in Computer Science, Software Engineering,
    Data science, AI/ML, Mathematics, or a related technical
    discipline
  - Prior internship experience in an AI capacity
  - Strong foundation in:
    - JavaScript and/or TypeScript, Python/Pyspark
    - General AI understanding including LLM’s, RAG’s and agentic
      workflows
  - Solid problem-solving and analytical skills, with the
    ability to reason through complex systems
  - Demonstrated ability to learn new technologies and platforms
    rapidly
  - Excellent written and verbal communication skills in a
    professional environment
  - Foundry/AIP certification and experience preferred
  - Exposure to enterprise or data-intensive applications
  - Familiarity with:
    - Data visualization techniques or libraries
    - RESTful APIs and basic backend integration concepts
    - SQL, Python, or another general-purpose programming language
  - Interest in applied data, AI-enabled workflows, or
    operational decision systems
  - Formal and informal training on Palantir Foundry, including
    data pipelines, ontologies, and application development
  - Exposure to AIP use cases, including human in the loop and
    AI assisted workflows
  - Ongoing mentorship from senior engineers and platform
    specialists
  - Clear progression path from junior engineer to independent
    contributor within Palantir-based solution teams
  
  
  
  
  
  ***This position may be filled at a different level,
  depending on experience***
  
  
  
  Compensation:
  
  
  
  Actual base pay could vary and may be above or below the
  listed range based on factors including but not limited to
  experience, subject matter expertise, and skills. The base
  pay is just one component of Ascot’s total compensation
  package for employees. Other rewards may include annual cash
  bonus, and other forms of discretionary compensation awarded
  by the Company.
  
  
  
  The annualized base pay range for this role is: $90,000
  
  
  
  
  
  Company Benefits:
  
  
  
  The Company provides a competitive benefits package that
  includes the following (eligibility requirements apply):
  
  Health and Welfare Benefits: Medical (including prescription
  coverage), Dental, Vision, Health Savings Account, Commuter
  Account, Health Care and Dependent Care Flexible Spending
  Accounts, Life Insurance, AD&D, Work/Life Resources
  (including Employee Assistance Program), and more
  
  Leave Benefits: Paid holidays, annual Paid Time Off
  (includes paid state /local paid leave where required),
  Short-term Disability, Long-term Disability, Other leaves
  (e.g., Bereavement, FMLA, Adoption, Maternity, Military,
  Primary & Non-Primary Caregiver)
  
  Retirement Benefits: Contributory Savings Plan (401k)
  
  
  
