description: |
  About us
  
  We’re Cortea, a Berlin-based RegTech firm modernizing the
  foundational processes of financial audit. Audit is the
  bedrock of global capital markets, yet the profession
  remains burdened by manual data tie-outs and fragmented
  checklists. We believe that professional judgment should be
  the center of the audit, not manual data entry.
  
  We build AI-native infrastructure designed to augment the
  auditor’s capabilities. By formalizing complex audit logic
  into scalable software, we enable highly-qualified
  professionals to focus on professional skepticism, complex
  accounting estimates, and high-stakes judgment.
  
  With €10m+ in funding and a live product used by innovative
  firms across Europe, we are contributing to the emerging
  best practices for the AI-supported audit of the future.
  
  The role
  
  This is a role for a senior audit professional who is tired
  of ticking boxes and ready to start building the tools they
  always wished they had. As an Agentic Auditor, you are the
  brain behind our AI. You translate your deep field expertise
  into scalable software logic.
  
  Your mission is to take complex ISA/IDW requirements and
  turn them into elegant, automated workflows. You are not the
  person filling out the checklist; you are the person
  designing the system that makes the checklist disappear.
  
  What you’ll do
  
  - Architecting Audit Logic: Instead of manually ticking off
    checklists, you will design the logical "blueprints".
    You’ll translate complex ISA/IDW requirements (like ISA
    240 or ISA 330) into smart, automated workflows that
    replace hundreds of hours of manual testing with a single,
    scalable system logic.
  - AI-Supported Augmentation: Design AI-driven workflows for
    the analysis of complex contracts (e.g., IFRS 16 or
    Revenue Recognition) and data-driven anomaly detection
    that supports Risk Identification (ISA 315).
  - Independence & Ethics Architecture: You will ensure that our
    tool maintains auditor independence in accordance with IDW
    PS 210 and professional ethical standards.
  - Documentation & Reviewability: Ensure every system-generated
    output is formatted for seamless integration into the
    Prüfungsakte under IDW PS 450, providing a clear audit
    trail that stands up to internal Quality Control and
    external peer reviews.
  - Thought Leadership: Act as a bridge to the wider profession.
    You will represent Cortea at Fachtagungen, contribute to
    whitepapers on AI in audit, and help shape the dialogue
    with regulatory bodies regarding the digital evolution of
    the profession.
  
  Who you are
  
  - 6+ years of experience in professional auditing (Big 4 or
    top-tier mid-market). You have operated at the
    Prüfungsleiter level and possess a deep understanding of
    Mandatsverantwortung and Haftungsrisiken.
  - Regulatory Precisionist: You have a command of IDW PS, ISA,
    and HGB. You enjoy the challenge of deconstructing a high-
    level standard into a reproducible, logical workflow.
  - Systems Thinker: While you may not be a coder, you think in
    "logic flows." You understand how structured data and AI
    can improve Audit Quality and consistency across large-
    scale engagements.
  - Impact-driven: You are looking for a role that offers
    significant professional upside and the opportunity to
    become a recognized expert in the emerging field of AI x
    Audit.
  - Language: Native or professional fluency in German and
    English (C1+) is essential for navigating the German
    regulatory landscape and professional standards.
  
  How we work
  
  - Seamless Execution: We act with focus, guided by our
    commitment to regulatory excellence. For us, rigor isn't a
    hurdle—it's what keeps our progress smooth and reliable.
  - Quality by Design: We believe that system-driven consistency
    reduces the burden of review and enhances the reliability
    of the audit opinion.
  - Intellectual Honesty: We engage in deep, logic-based
    discussions. If a feature risks compromising professional
    skepticism, we rethink it.
  
  What we offer
  
  - Impact: The opportunity to build the tools you wish you had
    during your time in practice.
  - Growth: Transition from traditional auditing into a high-
    growth leadership role at the intersection of Audit and
    AI.
  - Compensation: Competitive salary + meaningful equity.
  
  Interview process
  
  - Intro call with Leon (Founders Associate)
  - Technical (Auditing) interview: A technical case study
    (e.g., formalizing a decision tree for ISA 240 compliance)
    with Philipp (co-Founder).
  - Strategic & Collaboration Fit with Valentin (co-Founder).
  - On-site (Berlin): A collaborative session focused on
    designing a "Reviewer-First" interface that maximizes
    transparency and skepticsm.
