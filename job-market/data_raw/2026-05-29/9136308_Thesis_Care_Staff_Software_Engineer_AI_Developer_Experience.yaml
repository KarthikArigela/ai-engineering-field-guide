title: Staff Software Engineer, AI Developer Experience
company: Thesis Care
location: New York, USA
work_type: FULL_TIME
company_size: 23 Employees
description: |
  About us
  
  Thesis is building the AI-powered care team platform for
  infinitely scalable clinical capacity. We radically increase
  access and improve quality of care by combining AI agents
  with clinical experts to take on high-impact clinical
  operations and care management activities for healthcare
  organizations.
  
  We’re based in NYC, are growing rapidly, and are backed by
  $60 million in funding from Oak HC/FT, CRV, Black Opal
  Ventures, and experienced C-level healthtech angel
  investors.
  
  About the role
  
  We’re looking for a Staff Software Engineer, focused on AI
  Developer Experience, to build the systems that let our
  entire company ship products. Product managers, designers,
  and operators at Thesis increasingly build with AI, and we
  want to harness that energy without losing the rigor,
  security, and maintainability that a healthcare business
  depends on.
  
  Your job is to design and build the paved road: the typed
  API framework, tenant-safe data access layer, migration
  tooling, and progressive delivery infrastructure that make
  it easy to do the right thing and impossible to do the
  dangerous thing.
  
  This is a foundational hire. You’ll set the patterns that
  shape how dozens of people write code over the next several
  years. You’ll work directly with engineering leadership on
  what gets enforced structurally, what’s reviewed by humans,
  and what’s monitored at runtime, and you’ll be the person
  product managers come to when they’re stuck.
  
  Responsibilities:
  
  - Design and build the platform primitives. The data access
    layer (TypeScript + Drizzle + Postgres), the endpoint
    framework, feature flag integration, progressive delivery
    tooling, migration scaffolding, and the KV/events
    primitives that absorb most schema requests. You own the
    architecture and the code.
  - Encode conventions into the type system, CI, and runtime.
    Where other teams would write a style guide, you write a
    TypeScript signature, a lint rule, a Semgrep check, or a
    runtime assertion. Humans shouldn’t have to remember what
    the system can enforce.
  - Enable non-engineer builders. Design the scaffolders,
    documentation, and agent-style guides that let a product
    manager with AI assistance ship a well-formed feature on
    their first day. Your users are as much PMs as they are
    engineers.
  - Partner with the engineering team on reviews and unblocking.
    Run the schema review process. Extend the data layer when
    new patterns emerge. Shape the CODEOWNERS structure. Coach
    engineers who rotate onto “PM enablement” duty.
  - Own the governance rituals. Weekly platform review, monthly
    architecture review, quarterly cleanup. Watch for drift
    and duplication. Delete what doesn’t earn its keep.
  - Handle production incidents on the platform. When something
    breaks in the shared infrastructure, you’re the person who
    figures it out and fixes the class of bug, not just the
    instance.
  
  We expect you to have:
  
  - Staff-level engineering experience: 8+ years building
    production systems, with meaningful time spent on
    platform, infrastructure, or developer-experience work.
    You’ve set patterns that outlasted you at previous
    companies, and you have opinions about what makes them
    good or bad.
  - Deep TypeScript and Postgres fluency: You can read and write
    advanced TypeScript types without flinching. You
    understand Postgres well enough to reason about indexes,
    locks, query plans, and migrations on live tables. Direct
    experience with Drizzle, Kysely, or similar typed query
    builders is a strong plus.
  - A safety-through-types instinct: You reach for the type
    system and the framework before you reach for
    documentation. You’ve shipped abstractions where “the
    wrong thing doesn’t compile”—not just “the wrong thing is
    discouraged in the style guide.”
  - Security literacy: You understand multi-tenant isolation,
    the common vulnerabilities in web applications, and why
    defense in depth matters. You’ve set up CI security
    tooling (SAST, secrets scanning, dependency auditing) or
    are eager to.
  - Empathy for non-engineer users: You can design an API
    surface that a product manager can use confidently, and
    you’re genuinely interested in what makes the difference
    between a tool people adopt and one they route around.
  - AI fluency: You’ve built with modern AI coding tools and
    have a considered view of where they help, where they
    mislead, and what guardrails matter most when AI is
    generating code at scale.
  - Healthcare awareness: Experience building systems that work
    with sensitive data and regulated environments, or a
    strong interest in learning healthcare workflows and
    constraints.
  - Clear communication: Ability to explain complex technical
    concepts clearly to both technical and non-technical
    stakeholders.
  - NYC-based: You are based in New York and excited to be in-
    office ~3 days per week.
  
  Nice to have:
  
  - Experience designing API frameworks (tRPC, typed REST,
    GraphQL) where conventions are enforced by the framework
    itself, not by review.
  - Experience running progressive delivery systems
    (LaunchDarkly, Statsig, or homegrown).
  - Experience in a company that successfully enabled non-
    engineers to ship production code—or a company that tried
    and failed, and you know why.
  - Experience with Postgres row-level security in production.
  
  Target compensation for this role is $225–$275k, plus equity
  and a generous benefits package.
  
  Thesis Care is an equal opportunity employer. We celebrate
  diversity and are committed to creating an inclusive
  environment for all employees. All qualified applicants will
  receive consideration for employment without regard to race,
  color, religion, gender, gender identity or expression,
  sexual orientation, national origin, genetics, disability,
  age, or veteran status.
