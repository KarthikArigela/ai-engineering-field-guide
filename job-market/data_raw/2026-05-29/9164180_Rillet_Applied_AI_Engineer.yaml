description: |
  What We Do
  
  Rillet serves accounting and finance teams. Our customers
  are the financial brains of their companies. Our job is to
  help them run the numbers with impossible speed, accuracy,
  and insight.
  
  Rillet is an AI-native ERP that can drive a zero-day close.
  We are different because of our unified source-of-truth data
  model, hundreds of best-in-class native integrations
  (Stripe, Ramp, Salesforce, etc), automated & auditable
  workflows, multi-entity consolidation, and quickly expanding
  army of specialized AI agents (e.g., accrual, audit, P&L
  flux, board decks, etc). These earn us a consistently
  perfect customer satisfaction score. High-growth AI
  customers like Mercor, and Function Health love our ship
  velocity, because their financial stack needs to scale as
  quickly as they do.
  
  This huge market is ours to take. We have raised $100M from
  leading investors (including Sequoia, a16z, Iconiq, Oak
  HC/FT, and First Round) to help everyone run their numbers
  at the speed of AI.
  
  Who We Are
  
  Rillet’s pace is not for everyone. Intelligence is table
  stakes. To succeed here, you need extreme speed, agency, and
  flexibility.
  
  Successful Rilleteers do not wait for assignments. They
  internalize a mission, design a strategy, and bring back
  results that are better, faster, and more creative than a
  manager could have asked for.
  
  Work revolves around our customers. Successful Rilleteers
  are energized by delivering the most important things, even
  those that weren’t in the original plan.
  
  In this role, you do not need to be an accountant. But you
  do need to appreciate the value that our customers can
  create for their own company when we equip them with the
  perfect financial tools. Successful Rilleteers love powering
  the financial core of the world’s fastest-growing companies.
  
  Who We Need
  
  As an Applied AI Engineer on Rillet's AI & ML team, you'll
  design and ship production AI systems that transform how
  finance and accounting teams operate. This team sits at the
  intersection of LLMs, ERP workflows, and financial data,
  building the intelligence layer that makes Rillet
  fundamentally different from legacy ERP. You'll own high-
  impact features end-to-end, from model integration to
  infrastructure, and your work will be used daily by finance
  teams at companies like Juicebox, Scribe, and Sotheby’s.
  
  We're an AI-native company, and we expect our engineers to
  bring that same mindset to how they work. If you're
  energized by pushing the boundaries of what AI can do in a
  real product context, you'll fit right in.
  
  We're looking for teammates within commutable distance of
  our NYC or San Francisco offices (or willing to relocate).
  Team members work in-office Tuesdays and Thursdays, plus one
  additional flexible day.
  
  What You'll Do
  
  - Own AI features end-to-end: from designing agentic workflows
    and RAG pipelines to the infrastructure that runs them in
    production at scale.
  - Work on genuinely hard problems: financial data is
    structured, high-stakes, and unforgiving, making it one of
    the more interesting domains to apply LLMs to.
  - Build the evaluation frameworks and experimentation loops
    that turn good models into reliable, production-grade
    systems.
  - Partner directly with product and domain experts to push the
    frontier of what AI can do inside an ERP, not just what's
    been done before.
  
  Who We're Looking For
  
  - 3+ years in a technical role with a strong foundation in
    backend systems, APIs, and cloud infrastructure
  - 2+ years shipping production AI systems with real users and
    real stakes, not research or prototypes
  - Hands-on experience with production LLM applications: RAG
    pipelines, agentic systems, or structured extraction
  - Proficiency in Python and comfort working across the full
    stack to deliver end-to-end features
  - Strong product instincts and a habit of thinking about user
    impact, not just technical correctness
  - Drawn to hard, ambiguous problems and energized by building
    in an environment where the playbook is still being
    written
  
  Bonus Points
  
  - Background in fintech, ERP, or accounting software
  - Experience with fine-tuning or training models, not just
    inference
  - Familiarity with Python, Kotlin, Java, or TypeScript
  - Experience building AI systems that operate on structured
    financial or transactional data
  
  Life at Rillet:
  
  - Competitive Pay & Benefits: Backed by world-class investors,
    we offer strong salaries plus equity so you share in our
    success. We've got you covered with top-tier health and
    dental insurance, premiums partially or fully covered for
    you, plus 90% coverage for dependents.
  - Room to Grow: We're building a team of ambitious, high-
    performing people who will grow with the company. As
    Rillet scales, so will your role, responsibilities, and
    compensation.
  - Flexibility That Works: Take the time you need with flexible
    PTO and 9 company-wide holidays. We value both the
    flexibility of remote and hybrid work and the creativity
    and energy that comes from in-person collaboration at our
    hubs in San Francisco, NYC, and Barcelona.
  - Build Real Connections: Great work happens when people
    connect. Join us for team offsites in incredible
    locations, our team has bonded everywhere from New York
    and San Francisco to Toronto, Italy, France, and beyond.
