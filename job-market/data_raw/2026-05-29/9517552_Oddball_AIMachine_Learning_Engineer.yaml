title: AI/Machine Learning Engineer
company: Oddball
location: USA
work_type: FULL_TIME
description: |
  Oddball believes that we can bring change and improve the
  daily lives of millions by bringing quality software to the
  federal space. Our team is full of experienced engineering,
  product, and user experience professionals who love bringing
  scalable solutions to life as much as they love working with
  clients to solve problems. We value learning, growth, and
  the ability to make a big impact at a rapidly growing
  company.
  
  We're looking for an AI/ML Engineer to join our team,
  building intelligent automation capabilities into a cloud-
  based case management system for a major federal financial
  regulatory agency.
  
  What you'll be doing:
  
  - Design, develop, and deploy AI/ML models to automate and
    improve internal workflow and review processes
  - Build and maintain ML pipelines within an AWS cloud
    environment
  - Collaborate with product and engineering teams to identify
    high-value automation opportunities and translate them
    into production-ready solutions
  - Integrate ML capabilities into existing Java and React
    application workflows
  - Monitor model performance and iterate based on real-world
    outcomes and stakeholder feedback
  - Ensure all AI/ML implementations meet federal security and
    compliance requirements including FISMA and NIST 800-53
  
  What you’ll bring:
  
  - Hands-on experience designing and deploying machine learning
    models in production environments
  - Proficiency in Python and familiarity with ML frameworks
    such as TensorFlow, PyTorch, or scikit-learn
  - Experience building and maintaining ML pipelines in AWS
    cloud environments
  - Ability to work across engineering and product teams to
    deliver practical, integrated AI solutions
  - Experience with natural language processing or document
    classification is a plus
  - Familiarity with federal security frameworks (FISMA, NIST
    800-53) is a plus
  - Thrives in a remote, collaborative Agile environment and
    genuinely enjoys working closely with a cross-functional
    team
  - Communicates clearly and openly, whether presenting model
    performance to stakeholders or collaborating with
    engineers on integration
  - Performs other related duties as assigned
  
  Requirements:
  
  - Applicants must be authorized to work in the United States.
    In alignment with federal contract requirements, certain
    roles may also require U.S. citizenship and the ability to
    obtain and maintain a federal background investigation
    and/or a security clearance.
  
  Education:
  
  - Bachelor's Degree
  
  Benefits:
  
  - Fully remote
  - Tech & Education Stipend
  - Comprehensive Benefits Package
  - Company Match 401(k) plan
  - Flexible PTO, Paid Holidays
  
