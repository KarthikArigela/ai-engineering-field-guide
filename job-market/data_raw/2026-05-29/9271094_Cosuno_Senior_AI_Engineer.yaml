title: Senior AI Engineer
company: Cosuno
location: Berlin, DEU
work_type: FULL_TIME
company_size: 96 Employees
description: |
  Your mission
  
  Join our AI team and build the intelligent systems at the
  core of Cosuno's platform.
  
  - AI Agent Development: Build and improve our agentic system
    that orchestrates multi-step reasoning to navigate the
    complex, often messy tendering workflow.
  - Ship end-to-end into the product: Own features from
    model/agent through API to the TypeScript front-end —
    backend service, API, and the integration into the web
    app.
  - Ranking, Search & Retrieval: Iterate on the ranking and
    retrieval systems that power subcontractor matching and
    marketplace search.
  - Price Prediction: Improve models that estimate fair pricing
    for construction work, helping users evaluate bids and
    make better procurement decisions.
  - Experimentation & Evaluation: Design offline evals, run
    online A/B tests, and drive metrics-led iteration.
  - Collaborate across teams: Work with Product, Engineering,
    and Data to translate business problems into shipped ML/AI
    features.
  - Maintain production ML & AI: Monitoring, alerting, and
    continuous improvement of everything we deploy.
  
  Your profile
  
  - Strong Python: You have 5+ years writing production-grade
    Python. You write clean, well-structured code.
  - TypeScript, React, Node: Non-negotiable. You're comfortable
    shipping into our web app end-to-end — front-end, backend
    service, API.
  - End-to-end product delivery: You've shipped features (not
    just models) into a production web app and owned the
    integration from research code to real users.
  - LLM application depth: You have deep hands-on experience
    building and deploying LLM/agent systems — RAG, tool use,
    multi-step reasoning, evals.
  - Backend engineering skills: You design APIs, data pipelines,
    and services.
  - Product mindset: You're comfortable with ambiguity and can
    judge when something is good enough to ship.
  - Sharp problem solver: You look at a complex system, quickly
    identify what matters, and decide what to do next.
  - Bias for action: When you're unsure something will work,
    your instinct is to find out with data rather than keep
    wondering.
  
  Bonus
  
  - Comfort with 'classical' ML foundations
  - Experience building search/ranking/recommendation or price
    prediction systems
  
  Why us
  
  - Shape a product that solves real-life problems in the
    construction industry
  - Work in an open-minded, collaborative, dynamic, and
    international team
  - Fully remote team and work culture
  - Freedom in your working hours. It's the results that count.
  - Company off-sites and regular team events (offline and
    online)
  - Flexible working conditions with the possibility to do
    workations
  - Competitive compensation, a permanent contract, and modern
    work equipment
  - Open feedback culture with regular 1-on-1s
  
  About us
  
  Cosuno – Revolutionizing construction through technology.
  
  We are Cosuno – a fast-growing tech startup that is making
  the construction industry more efficient and transparent
  with our digital platform for tenders and procurement
  processes. Our goal: to solve the most complex challenges in
  the industry with innovation and simplicity.
  
  Why Cosuno?
  
  Artificial intelligence is the key to our solution: it
  analyzes millions of price data points and helps
  construction companies create precise and efficient bids.
  This not only saves our customers time but also helps them
  avoid unnecessary costs.
  
  But for us, it's not just about technology – it's about the
  people who drive it. At Cosuno, you will work with creative
  minds who are reshaping the construction industry. We
  believe in diversity because we know that the best ideas
  come from different perspectives. An integrative and
  inclusive work environment is a matter of course for us.
  
  Join us – Build the future of construction.
