description: |
  AI/ML Engineer (Python + LLM)1
  
  Key Responsibilities: Experience - 4-8 years.
  
  Location - Hyderabad preferred
  
  Customer Interview - Yes
  
  Strong hands-on experience in Python development, building
  data-driven applications, creating APIs, debugging, testing,
  and deploying production-ready solutions. Must have
  experience in developing data-based chatbots using Large
  Language Models, Retrieval-Augmented Generation, and
  structured/unstructured data sources. Must have hands-on
  experience with LLM workflows including prompt engineering,
  fine-tuning, model evaluation, response quality analysis,
  and performance optimization. Should have strong experience
  in data processing and preprocessing using Python libraries
  such as Pandas, NumPy, and other relevant data-handling
  frameworks. Must have experience in FastAPI and REST API
  development, including creating, consuming, testing, and
  maintaining scalable APIs. Should be able to design and
  build backend services that interact with databases, vector
  stores, external APIs, and other data sources. Having
  experience in LLM evaluation frameworks, test datasets,
  automated evaluation pipelines, and quality benchmarking
  will be highly preferred. Should have hands-on experience in
  writing unit tests, integration tests, and API tests using
  Pytest or similar Python testing frameworks. Experience in
  deployment of Python applications, APIs, and AI/ML services
  on cloud or server environments. Should be able to write
  efficient, reusable, testable, and scalable Python code
  following best development practices. Good understanding of
  data cleaning, transformation, chunking, embedding
  generation, and preparation of data for chatbot or AI/ML
  workflows. Exposure to microservices-based architecture and
  backend application design will be preferred. Ability to
  debug and optimize applications for performance,
  reliability, and scalability. Should have basic knowledge of
  frontend technologies and be able to collaborate with
  frontend developers for integrating APIs into web
  applications. Ability to integrate multiple data sources
  into a unified chatbot or AI-driven system. Good problem-
  solving skills with the ability to work independently on
  AI/ML, data, and backend engineering tasks. Must-Have
  Skills: Python, FastAPI, REST APIs, Data Processing, Data
  Preprocessing, LLMs, Data-Based Chatbots, Fine-Tuning, LLM
  Evaluations, Pytest, API Testing, Deployment. Good-to-Have
  Skills: Frontend basics, Microservices, Vector Databases,
  RAG pipelines, Docker, Cloud Deployment, SQL/NoSQL
  Databases, CI/CD, LangChain/LangGraph, OpenAI/HuggingFace
  APIs.
