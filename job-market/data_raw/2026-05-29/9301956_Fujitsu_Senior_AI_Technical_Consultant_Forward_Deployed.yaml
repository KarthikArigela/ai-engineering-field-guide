description: |
  Transform your world with us!
  
  Fsas Technologies Europe is a leading provider of advanced
  data center solutions, empowering its customers and partners
  in Europe to leverage the performance of their
  infrastructure for sustainable digital transformation,
  thanks to its first-class employees and future-proof
  technologies. As a Fujitsu company, Fsas Technologies
  applies its expertise to realize the Fujitsu Group's goal of
  building trust in society through innovation and making the
  world more sustainable.
  
  We offer an appreciative and flexible work environment that
  promotes work-life balance and actively supports individual
  career development. Diversity, equal opportunities, and
  inclusion are central values of our corporate culture.
  Together, we have the future in mind – and for that, we need
  people with foresight.
  
  Apply now for the position of Senior AI Technical Consultant
  / Forward Deployed Engineer (m/f/d) at Fsas Technologies
  GmbH – hybrid, remote, or at locations across Europe.
  
  Legal Entity: Fsas Technologies GmbH
  
  We would like to fill the position at the earliest possible
  date.
  
  Unleash the Power of On-Premise AI: Join Our Expert AI Team!
  
  Are you a seasoned AI professional with a passion for
  transforming businesses through cutting-edge technology?
  Fsas Technologies GmbH is seeking a highly skilled and
  driven Senior AI Technical Consultant / Forward Deployed
  Engineer to lead our clients and partners through the
  intricate journey of implementing bespoke on-premise AI
  solutions. This is a unique opportunity to blend deep
  technical AI expertise with strategic business acumen,
  delivering end-to-end impact from concept to optimization.
  
  What You'll Do: Drive AI Innovation for Our Clients
  
  As a pivotal member of our AI SBU, you will be the bridge
  between complex AI capabilities and strategic business
  outcomes. Your responsibilities will include:
  
  - Strategic AI Consulting: Partner with clients to understand
    their unique challenges, define their on-premise AI
    vision, and architect robust strategies for Private GPT,
    Enterprise AI Factories, and advanced RAG implementations.
  - End-to-End Solution Delivery: Lead the technical execution
    of AI projects, from initial architectural design and
    solution customization to seamless deployment, integration
    within existing IT infrastructures, and rigorous
    optimization.
  - Technical Implementation & Integration: Expertly install,
    configure, and integrate complex AI solutions, ensuring
    high performance, scalability, and strict alignment with
    data pipelines and enterprise architectural standards.
  - Robust Data Management: Oversee the entire data lifecycle
    for AI, including preparation, cleaning, validation, and
    structuring, to maximize the accuracy and effectiveness of
    GPT and RAG models.
  - Cross-Functional Leadership: Serve as a key project
    coordinator, collaborating with diverse internal and
    client teams, meticulously tracking milestones, and
    proactively managing stakeholder expectations.
  - Empowering Client Teams: Design and deliver engaging
    workshops and training programs, empowering client
    departments to confidently adopt, utilize, and maximize
    the value of their new AI capabilities.
  - Continuous Innovation & Guidance: Stay at the forefront of
    AI advancements, monitoring industry trends, evaluating
    emerging technologies, and integrating best practices to
    ensure continuous improvement and sustained client value.
  
  
  
  What You Bring: Skills and Experience for Success
  
  - Educational Foundation: Bachelor’s or Master’s degree in
    Computer Science, Data Science, Business Informatics, or a
    closely related quantitative field.
  - Deep AI Expertise: Proven hands-on experience in deploying
    Large Language Models (LLMs) and a comprehensive
    understanding of Retrieval-Augmented Generation (RAG)
    principles and applications.
  - On-Premise & DevOps Mastery: Strong technical proficiency
    with on-premise environments, containerization
    technologies (Docker, Kubernetes), and modern DevOps
    practices (CI/CD pipelines).
  - AI Framework Acumen: Practical experience with leading AI/ML
    frameworks such as TensorFlow, PyTorch, and Hugging Face.
  - Data Engineering Prowess: Hands-on experience designing and
    working with data pipelines, big data systems, and various
    database technologies.
  - Business Acumen & Communication: Exceptsional ability to
    translate intricate technical concepts into clear,
    actionable insights for business stakeholders. Fluent in
    English (both written and spoken), with German language
    skills being a significant advantage.
  - Project Leadership: Demonstrable track record of
    successfully leading AI or data-driven projects, employing
    a structured approach to planning, execution, and
    comprehensive documentation.
  
  
  
  Bonus Points That Set You Apart:
  
  - Direct experience in regulated industries (e.g., finance,
    healthcare, government) where on-premise, secure solutions
    are paramount.
  - Relevant certifications in leading AI platforms or
    specialized training in advanced AI/ML technologies.
  - Familiarity with compliance and security standards such as
    GDPR, ISO, or similar regulatory frameworks.
  - Previous experience in client-facing consulting roles,
    particularly those requiring extensive stakeholder
    engagement and management.
  
  
  
  Interested?
  
  The position sounds exciting, but you are not sure if you
  meet all the requirements? Don’t hesitate to apply. In
  addition to skills, your personality and potential count for
  us. We look forward to receiving your application along with
  your earliest possible start date and salary expectations.
