title: Full-Stack Applied AI Engineer
company: Bitovi
location: USA
remote: true
work_type: FULL_TIME
description: |
  PLEASE NOTE: Bitovi has been engaged by Very Big Things to
  lead initial and technical interviews for this role. While
  Bitovi will conduct the early rounds, the final interview
  and hiring decision will be made by Very Big Things
  directly.
  
  JOIN THE VERY BIG THINGS TEAM!
  
  Very Big Things is an AI-native consulting and
  implementation partner. We help mid-market and enterprise
  clients modernize critical workflows using Gen-AI,
  automation, and cloud platforms. We operate with small,
  senior teams and ship production-ready systems
  fast—typically live in 8–12 weeks, secure and auditable.
  
  The Role
  
  We are looking for a Senior Full-Stack AI Engineer who can
  own delivery, not just execute tickets. This role is for
  someone who:
  
  - Can take ambiguous requirements and turn them into working
    systems
  - Is comfortable being the most senior engineer on a stream
  - Moves fast without sacrificing production quality
  - Has shipped real AI features—not demos
  
  You'll work closely with a VBT strategist and other senior
  engineers to design, build, and harden AI-enabled products
  for real clients. This is hands-on delivery work. No ivory-
  tower architecture. No babysitting juniors. You build,
  decide, and ship.
  
  What You'll Do
  
  - Own end-to-end delivery: Design and build full-stack
    features from UI to backend to deployment.
  - Ship real AI systems: Implement RAG, tool-calling, agent
    workflows, structured prompting, evals, and guardrails.
  - Move fast, responsibly: Prototype quickly, then harden for
    security, reliability, and cost control.
  - Use AI as a force multiplier: Work fluently with tools like
    Cursor, Claude Code, Windsurf, or Copilot to accelerate
    delivery while maintaining code quality.
  - Make technical calls: Choose patterns, trade-offs, and scope
    boundaries without waiting for permission.
  - Collaborate tightly: Work directly with strategists,
    clients, and other senior engineers to unblock progress.
  - Light DevOps ownership: Configure environments, CI/CD,
    secrets, and deployments (with support when complexity
    grows).
  
  What You'll Bring
  
  - 6+ years building production software across front-end and
    back-end.
  - Hands-on Gen-AI experience in real products (not just
    experiments).
  - Strong command of JavaScript/TypeScript.
  - Proven experience with modern stacks such as:
    - React/Next.js
    - Node.js (Nest, Express, or similar)
  - SQL databases (Postgres), caches, and vector stores.
  - Comfortable designing secure, production-grade systems: auth
    (RBAC), secrets, auditability, PII-aware data handling.
  - Cloud experience (AWS, GCP, Azure, or Vercel) and CI/CD
    fundamentals.
  - Clear communicator who can explain trade-offs to non-
    engineers.
  - Comfortable working embedded with a client team.
  
  Nice to Have
  
  - Experience in retail, hospitality, logistics, healthcare, or
    regulated environments.
  - Prior consulting or agency delivery experience.
  
  Additional Details to Note
  
  - Competitive pay based on location and experience
  - 100% remote
  
  
  
  HOW TO APPLY:
  
  Please share a resume and LinkedIn profile and answer the
  additional questions. Yes, we read through all the answers!
  
  *Please note that we are not interested in working with
  recruiters. All job offers are contingent on passing a
  detailed background check.
