  Position Summary
  
  The Data & AI Engineer builds the data foundation and AI
  capabilities that power the Digital Lab's prototypes and
  applications. You'll pull data from operational source
  systems, build focused data pipelines to make it usable, and
  develop AI/ML models and GenAI integrations that turn that
  data into intelligent, working solutions. This role combines
  hands-on data engineering with applied AI. You'll build
  pipelines that are clean and fast enough to support rapid
  prototyping — structured using Medallion-style layering and
  dbt where appropriate — and you'll build and integrate AI
  models, LLM-based agents, and machine learning workflows
  that the team's applications consume. You work closely with
  Software Engineers who build the front-end experiences and
  Systems Analysts who define the requirements.
  
  Key Responsibilities
  
  Build Data Pipelines for Prototyping
  
  - Build focused data pipelines that pull from GPS source
    systems (SAP, MES, LIMS, planning tools, quality systems)
    and transform raw data into clean, usable datasets for
    prototypes and applications.
  - Use Spark, Python, SQL, and AWS services (Glue, S3) to
    extract, transform, and load data efficiently.
  - Apply Medallion architecture patterns (bronze → silver →
    gold) to organize data layers — keeping it practical and
    proportional to the prototyping context.
  - Use dbt for modular, testable transformations where
    appropriate — build reusable models that the team can
    leverage across projects.
  - Prepare curated datasets tailored for AI/ML feature
    engineering, application consumption, and analytical
    exploration.
  
  Develop & Integrate AI/ML Solutions
  
  - Build and deploy machine learning models — predictive,
    classification, anomaly detection, and optimization models
    that support GPS use cases.
  - Develop and integrate GenAI and LLM-based capabilities —
    including conversational agents, retrieval-augmented
    generation (RAG), and agentic AI workflows.
  - Perform feature engineering — design and build feature sets
    from complex operational data that improve model
    performance and explainability.
  - Work with Databricks for model development, experimentation,
    and deployment.
  - Ensure AI outputs are structured and accessible for
    consumption by the team's web applications and user-facing
    tools.
  
  Collaborate Across the Digital Lab
  
  - Partner with Software Engineers to define data contracts,
    APIs, and output formats that applications need to
    consume.
  - Work with Systems Analysts to understand business
    requirements and translate them into data and AI solution
    approaches.
  - Engage with business stakeholders when needed to understand
    data sources, validate data quality, and confirm that
    outputs reflect operational reality.
  - Coordinate with centralized IT / BI&T teams for access to
    source systems, data governance considerations, and
    handoff when solutions graduate to production scale.
  
  Keep It Practical and Prototype-Ready
  
  - Build pipelines and models that are robust enough to support
    working prototypes and demos — not over-engineered for
    enterprise scale.
  - Apply sound practices — version control, testing,
    documentation — proportional to the maturity of each
    project.
  - Know when a pipeline or model is good enough for prototyping
    and when it needs to be hardened or handed off for
    production-grade implementation.
  
  Qualifications / Education
  
  - Bachelor's or Master's degree in Computer Science, Data
    Science, Computer Engineering, Information Systems, or a
    related field.
  
  Experience & Skills
  
  Required
  
  - 5–7 years of hands-on experience in data engineering and/or
    applied AI/ML roles.
  - Strong proficiency in Python, Spark, and SQL for data
    pipeline development and data manipulation.
  - Experience with AWS cloud services — S3, Glue, Lambda, or
    equivalent — for building cloud-native data workflows.
  - Hands-on experience with dbt for data transformation,
    testing, and documentation.
  - Experience with Databricks for data processing, model
    development, or both.
  - Working knowledge of Medallion architecture patterns
    (bronze/silver/gold layering).
  - Experience building and deploying ML models — including
    feature engineering, model training, evaluation, and
    integration into applications.
  - Exposure to GenAI and LLM patterns — RAG, prompt
    engineering, conversational agents, or agentic AI
    workflows.
  - Comfortable working with messy, real-world operational data
    from multiple source systems.
  - Strong communication skills — you can explain data and AI
    concepts to non-technical stakeholders and collaborate
    effectively with engineers.
  - A pragmatic, prototyping mindset — you optimize for speed
    and usefulness, not perfection.
  
  Preferred / Nice-to-Have
  
  - Experience in pharma, life sciences, or manufacturing
    environments.
  - Familiarity with GPS/PDS domain systems — SAP, MES, LIMS,
    planning tools (Kinaxis, Blue Yonder, or similar).
  - Experience with React.js or Node.js — enough to build
    lightweight data-backed interfaces or APIs when needed.
  - Experience with agent-based AI patterns, decision
    intelligence, or multi-step AI reasoning workflows.
  - Familiarity with data quality frameworks and data lineage
    concepts.
  - Experience working in innovation labs, prototyping teams, or
    fast-paced delivery environments.
  
