  careers.
  
  
  ROLE PROFILE:
  
  Take ownership of building the core engineering capabilities
  that will enable LSEG to deliver secure, scalable, and AI
  enabled digital products. Enabled digital products.-enabled
  digital products.
  
  
  ROLE SUMMARY:
  
  The Lead Engineer will drive the development of backend and
  frontend systems while establishing and enforcing
  engineering best practices that ensure high quality
  delivery. The role combines hands on engineering with
  technical leadership, guiding teams through architecture
  design, solution implementation, and continuous improvement
  of development workflows. Success requires strong full stack
  expertise, excellent technical judgement, and the ability to
  embed AI capabilities into production systems.-quality
  delivery. The role combines hands-on engineering with
  technical leadership, guiding teams through architecture
  design, solution implementation, and continuous improvement
  of development workflows. Success requires strong full-stack
  expertise, excellent technical judgement, and the ability to
  embed AI capabilities into production systems.
  
  WHAT YOU'LL BE DOING:
  
  - Lead development of secure, scalable backend and frontend
    systems.
  - Define architectural direction, coding standards, and
    development best practices.
  - Plan and deliver features collaboratively with product,
    design, and cross-functional teams.
  - Mentor engineers, conduct code reviews, and guide technical
    decision-making.
  - Improve deployment, monitoring, and operational processes.
  - Lead integration of AI capabilities, including model
    deployment and performance monitoring.
  
  WHAT YOU'LL BRING:
  
  - 5+ years of software engineering experience, including
    technical leadership.
  - Expertise in Java/Kotlin, Spring Boot, REST APIs, and
    MongoDB.
  - Experience with ReactJS, JavaScript, and TypeScript.
  - Strong understanding of secure coding (e.g., OWASP
    principles).
  - Strong experience with CI/CD, Git workflows, automated
    testing.
  - Experience leading AI feature development or integrating ML
    models into production systems.
  
  Career Stage:
  
  Manager
  
