  Job Description
  
  About the Role:
  
  Become a part of Thermo Fisher Scientific Inc. as a Systems
  Developer (.NET & AI/ML). This role presents an outstanding
  opportunity to collaborate with a remarkable team dedicated
  to the development and implementation of system solutions on
  custom-developed applications.
  
  Key Responsibilities
  
  - Help ensure the implementation and adherence to CSLM
    lifecycle, processes, and relevant tools.
  - Write efficient, maintainable code following guidelines and
    coding standards.
  - Engage in code reviews to learn from feedback and improve
    coding skills.
  - Stay current with emerging technologies, including cloud
    platforms (Azure) and applied AI capabilities.
  - Support integration of AI-enabled features such as
    automation, intelligent workflows, or data-driven insights
    where applicable (e.g., using APIs or pre-built services).
  - Aid in generating system deliverables and support business.
  - Work with the Application Manager and team members on
    maintenance and support activities.
  - Debug performance issues and defects. Familiarity with
    troubleshooting techniques (Root Cause Analysis).
  - Help reviewing system compositions to ensure they align with
    relevant technologies and identify improvement areas.
  - Participate in code refactoring efforts to improve system
    quality.
  - Analyse and understand the current technology stack to
    assist with and participate in the exploration of the
    benefits of newer technologies.
  - Contribute to the development and implementation of system
    solutions as a collaborative team member.
  - Good documentation skills to maintain documentation for
    system components and development processes.
  
  Knowledge, Skills, and Abilities:
  
  - Proficient hands-on experience with C# programming language
    on the .NET Platform.
  - Strong understanding of Data Structures and Algorithms.
  - Skilled in Microsoft SQL Server, Structured Query Language
    (SQL).
  - Proficient with - HTML and CSS, JavaScript.
  - Exposure to CICD pipeline and cloud technology.
  - Familiarity with MVC & DOM Concepts, NodeJS, AngularJS
    frameworks & NPM.
  - Familiarity with Agile methodologies and Azure DevOps.
  - Exposure or willingness to learn AI/ML concepts and their
    application in enterprise systems.
  - Familiarity with integrating AI services/APIs (e.g., Azure
    Cognitive Services, OpenAI APIs, or similar) is a plus.
  - Strong problem-solving skills and attention to detail.
  - Proven ability to work collaboratively in a team
    environment.
  
  Education/Experience:
  
  - Bachelor’s degree or equivalent (BE, B Tech, ME, M Tech,
    BCA/MCA, BSC/M Sc)
  - 4+ years of experience in systems development,
    implementation, and support roles with the required
    technologies
  
  Work Details:
  
  - Work Timings: Shift 2 - 01:00 PM to 10:00 PM IST.
  - Work Mode: Hybrid
  - Work Location: Bengaluru, India
  
  Why Join Us?
  
  At Thermo Fisher Scientific, we are committed to your growth
  and success. Our inclusive culture, combined with our
  ambitious goals, ensures that you will thrive in your role.
  Join us and be part of a team that is making a difference in
  the world!
