description: |
  About Telnyx
  
  Telnyx is an industry leader that's not just imagining the
  future of global connectivity—we're building it. From
  architecting and amplifying the reach of a private, global,
  multi-cloud IP network, to bringing hyperlocal edge
  technology right to your fingertips through intuitive APIs,
  we're shaping a new era of seamless interconnection between
  people, devices, and applications.
  
  We're driven by a desire to transform and modernize what's
  antiquated, automate the manual, and solve real-world
  problems through innovative connectivity solutions. As a
  testament to our success, we're proud to stand as a
  financially stable and profitable company. Our robust
  profitability allows us not only to invest in pioneering
  technologies but also to foster an environment of continuous
  learning and growth for our team.
  
  Our collective vision is a world where borderless
  connectivity fuels limitless innovation. By joining us, you
  can be part of laying the foundations for this
  interconnected future. We're currently seeking passionate
  individuals who are excited about the opportunity to
  contribute to an industry-shaping company while growing
  their own skills and careers.
  
  About the Role
  
  The AI Integrations team builds the tools that bring AI into
  Telnyx's core products — think voice agents, intelligent
  messaging, and real-time AI features that improve our
  customer experience. We need a strong fullstack engineer to
  help us move faster.
  
  This is a mid-level IC role. You'll own features end-to-end:
  building React interfaces, writing Node.js services, wiring
  up databases, and shipping things that work. AI experience
  isn't required — you'll pick that up here. What matters is
  that you can build solid fullstack products and want to
  learn.
  
  What You'll Work On
  
  • Fullstack features across our AI product suite — frontend
  to database • Integrating LLMs and AI capabilities into real
  world applications (with support from the team) • Building
  interfaces that make complex AI tools feel simple • Shipping
  iteratively — we value working software over perfect plans
  Tech Stack
  
  Core (you should know this well): React 18+, TypeScript,
  Tailwind CSS, Node.js, PostgreSQL, Prisma, TanStack Query,
  Docker, Kubernetes
  
  Bonus (nice to have, happy to teach): Next.js 15+, LLM
  integration, LangChain/LangGraph RAG/Embeddings, Vector
  Databases, MCP, WebSockets, WebRTC, Radix UI, Shadcn UI,
  Framer Motion
  
  What We're Looking For
  
  You're genuinely comfortable across the stack — not a
  frontend dev who can "do backend" or vice versa. You've
  built and shipped real features. You take ownership,
  communicate clearly, and don't need hand-holding.
  
  AI interest is a plus, but we'd rather have a strong
  fullstack engineer who's curious than an "AI enthusiast" who
  can't ship.
  
  We move fast on modern web tooling (React/Next, TypeScript,
  Tailwind). Expect frequent upgrades.
  
  Values
  
  • Ownership — you see things through • Collaboration — you
  work well with others and communicate proactively •
  Adaptability — comfortable with ambiguity and changing
  requirements • Growth mindset — eager to learn, takes
  feedback well #LI-KG1 #LI-VIETNAM #LI-INDIA
