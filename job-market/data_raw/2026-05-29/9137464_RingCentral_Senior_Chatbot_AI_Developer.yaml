description: |
  Senior Chatbot (AI) developer
  
  We're seeking a highly skilled Chatbot Developer to join our
  team in building an advanced chatbot for RingCentral. This
  chatbot will troubleshoot technical problems and answer
  complex questions related to our suite of  communication
  products. You'll need a deep understanding of Large Language
  Models (LLMs) and a proven ability to construct goal-
  oriented chatbots using advanced prompting techniques. The
  ideal candidate will be an expert in crafting these chatbots
  using  the latest AI technologies and cutting-edge LLM
  prompting methods.
  
  Responsibilities:
  
  - Design, develop, and implement a large, complex chatbot
    integrated with APIs to provide technical support for
    RingCentral products.
  - Develop advanced LLM prompts to optimize chatbot performance
    in troubleshooting technical issues and providing
    accurate, informative answers.
  - Construct goal-oriented conversation flows to guide users
    efficiently to resolutions.
  - Integrate the chatbot with RingCentral's systems and
    databases to access relevant product information and
    customer data.
  - Continuously evaluate and refine chatbot performance metrics
    to identify areas for improvement.
  - Stay abreast of the latest advancements in LLM technology
    and chatbot development to enhance the chatbot's
    capabilities.
  - Collaborate with product managers, engineers, and customer
    support teams to align chatbot development with business
    objectives.
  
  Qualifications:
  
  - 6 to 8 years of overall experience, 3+ years developing
    complex chatbots or IVAs.
  - Proven expertise in using Google Dialogflow CX, Yellow.ai or
    similar LLM platforms.
  - Deep understanding of Natural Language Processing (NLP) and
    advanced LLM prompting techniques.
  - Strong proficiency in scripting languages like Python or
    JavaScript.
  - Experience with API integrations and database interactions.
  - Excellent problem-solving, analytical, and troubleshooting
    skills.
  - Strong communication and collaboration abilities.
  - Demonstrated ability to build goal-oriented chatbots with a
    focus on task completion.
  
  Bonus Points:
  
  - Experience with RingCentral products and their technical
    support processes.
  - Experience with cloud platforms like AWS or GCP.
