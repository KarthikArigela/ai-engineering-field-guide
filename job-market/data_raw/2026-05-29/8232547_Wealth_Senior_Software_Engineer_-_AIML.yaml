description: |
  About Us
  
  Wealth.com is the industry’s leading estate planning
  platform, empowering more than 1,000 wealth management firms
  to modernize how they talk about estate planning with their
  clients. As the only tech-led, end-to-end platform built
  specifically for financial institutions, Wealth.com enables
  firms to drive scale, efficiency, and measurable client
  impact. Trusted by some of the largest names in finance,
  Wealth.com combines proprietary AI, robust security, and
  deep technological and legal expertise to serve the full
  range of client needs, from foundational plans to the most
  sophisticated estate strategies. The company has been widely
  recognized for innovation and leadership, winning Top Estate
  Planning Technology and Top Estate Planning Implementation
  at the 2025 WealthManagement.com Industry Awards, being
  named the 2024 Best Technology Provider in the Trust
  category, and earning #1 in estate planning market share in
  the 2025 Kitces AdvisorTech Study.
  
  Our team is fundamental to our standing as the leading
  estate planning platform. We cultivate a collaborative and
  supportive environment, fostering innovation and making
  Wealth.com a truly enjoyable workplace. Wealth.com is proud
  to be certified as a Great Place to Work for 2025.
  
  The Role
  
  We are seeking a Software Engineer, AI/ML (Full-Stack) to
  build the next generation of AI-powered applications. This
  is a builder role. You will design and ship production-
  grade, agentic systems that deliver real user value — not
  prototypes or demos.
  
  You will operate at the intersection of AI, product, and
  full-stack engineering, taking ambiguous ideas and turning
  them into scalable, user-facing experiences. From document
  understanding to multi-step workflows, your work will
  directly shape how users interact with AI.
  
  What You Will Do:
  
  Own problems end-to-end
  
  - Take loosely defined ideas and turn them into shipped,
    production features
  - Make architectural decisions across AI systems, backend, and
    frontend
  
  Build real AI products (not demos)
  
  - Design, build, and deploy production-grade systems
    leveraging LLMs
  - Own systems that handle real user traffic, constraints, and
    failure modes
  
  Develop agentic systems
  
  - Build multi-step workflows with reasoning, tool use, and
    structured outputs
  - Design systems that balance autonomy, control, and
    reliability
  
  Design AI-native user experiences
  
  - Build AI-native interfaces (agentic UIs) where users
    collaborate with AI
  - Implement streaming, feedback loops, and iterative workflows
  
  Work with tools / skills (AI capabilities)
  
  - Integrate and compose tools (“skills”) such as APIs,
    retrieval systems, and external actions
  - Design product features that leverage these capabilities
    effectively within agent workflows
  - Collaborate with AI Infrastructure to improve tool
    interfaces and behavior
  
  Drive quality and performance
  
  - Build evaluation and feedback loops
  - Implement guardrails and monitoring
  - Optimize for latency, cost, and accuracy
  
  Work across the stack
  
  - Backend services, APIs, data pipelines, and frontend
    experiences
  - Ship quickly and iterate based on real usage
  
  Qualifications:
  
  - Degree in Computer Science, Engineering, or equivalent
    practical experience
  - Strong software engineering fundamentals (system design,
    data structures, clean code)
  - Proven track record of building and shipping production
    systems
  - Proficiency in Python, TypeScript, C#, and comfort working
    across a polyglot stack, picking up new languages and
    frameworks as needed
  - Experience building AI-powered applications in production
  - Hands-on experience with agentic or multi-step AI systems
  - Experience working with APIs or tool integrations within AI
    systems
  - Ability to operate in ambiguous, fast-moving environments
  
  Preferred Qualifications (Bonus Points):
  
  - Experience building end-to-end agentic applications
  - Experience with:
    - RAG systems and vector databases
    - Agent frameworks (LangGraph, LangChain, etc.)
    - Evaluation / observability systems
  - Experience designing AI-native UX
  - Experience with cloud infrastructure:
    - GCP (Cloud Run) or AWS (ECS, Lambda)
  - Experience with mobile app development (iOS, Android, React
    Native, Flutter), especially AI-powered experiences
  - Experience in regulated domains (FinTech, LegalTech, etc.)
  
  Benefits & Perks
  
  - Competitive salary.
  - Hybrid work arrangement in the New York area
  - Excellent medical, dental, and vision insurance options,
    with low-cost premium structures that demonstrate our
    commitment to offering great value to our employees.
  - 100% company-paid basic life insurance, short-term and long-
    term disability insurance.
  - 100% paid parental leave upon eligibility.
  - Company equity managed through Carta.
  - 401k with match and 100% vesting upon hire.
  - Flexible PTO in an environment where taking time off to
    relax or recharge is supported and encouraged.
  - Take time off for holidays—and yes, your birthday counts
    too. Celebrate, relax, and recharge without thinking
    twice.
  
  Wealth is an equal opportunity employer and encourages
  people from all backgrounds to apply. Should you have a
  disability or special need that requires accommodation,
  please let us know.
