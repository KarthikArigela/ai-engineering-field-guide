description: |
  About Astound Digital
  
  At Astound Digital, we are pioneers in the digital
  landscape, dedicated to transforming how the world interacts
  with technology, data, and creativity. Our role as trusted
  advisors in the digital landscape empowers the world’s most
  innovative brands with frictionless, end-to-end customer
  experiences. We are known for our comprehensive solutions,
  proven expertise, and collaborative, nimble approach that
  instills confidence in our clients. We embrace the power of
  Artificial Intelligence (AI) to drive innovation,
  efficiency, and better outcomes for our clients and
  employees. Join us to navigate and lead in the ever-changing
  digital world, where your impact will extend beyond the
  ordinary.
  
  Job Purpose
  
  As a Senior Consultant specializing in Anthropic AI, you
  will sit at the intersection of enterprise cloud
  architecture and generative AI. You will be a part of the
  founding team as a core contributor to Astound Digital’s
  Anthropic AI Practice.
  
  You will serve as both a technical and functional expert,
  partnering with global clients to maximize platform
  utilization through intelligent automation. Your role
  involves a blend of high-level thought leadership and hands-
  on development, leveraging Claude Code and advanced AI
  frameworks to improve organizational efficiency and deliver
  next-generation digital outcomes.
  
  Key Responsibilities
  
  - Translate client requirements into technical specifications
    and scalable AI solution architectures.
  - Lead client-facing discovery sessions, workshops, and
    requirement-gathering activities, including the
    development and iteration of proof-of-concept prototypes.
  - Design, develop, and write clean Python/JavaScript code for
    Claude-powered applications, agents, and enterprise
    workflows.
  - Build integrated solutions using the Anthropic API,
    leveraging advanced prompt engineering and multi-turn
    conversation design.
  - Implement Retrieval-Augmented Generation (RAG) pipelines and
    integrate vector databases for AI solutions.
  - Research evolving Anthropic features to provide gap analyses
    and recommend features that improve organizational
    effectiveness.
  - Lead the technical integration of Salesforce with third-
    party systems and AI orchestration layers like AWS
    Bedrock.
  - Partner with distributed delivery teams as a technical lead
    to drive best practices in modular design, automation, and
    prompt engineering.
  - Manage system release schedules and maintain comprehensive,
    AI-driven configuration documentation using Co-work.
  
  Qualifications (Required and Preferred)
  
  - 3+ years of Software Engineering experience, including prior
    consulting/client-facing project experience and 6-12
    months dedicated experience with Anthropic/Claude models.
  - Proficiency in Python and/or JavaScript/TypeScript for AI
    applications, along with working knowledge of advanced
    prompt engineering (e.g., chain-of-thought, few-shot).
  - Familiarity with agentic frameworks (e.g., LangChain,
    LlamaIndex), Model Context Protocol (MCP), or multi-agent
    orchestration patterns.
  - Experience with RAG architectures and vector databases
    (e.g., Pinecone, Weaviate, pgvector).
  - Familiarity with integrations via REST APIs, JSON, and cloud
    platforms (AWS, GCP, Azure).
  - Exposure to other LLMs, specifically Gemini, OpenAI, and/or
    AWS Bedrock.
  - Strong analytical, problem-solving, and technical writing
    skills, coupled with a solid understanding of software
    architecture principles (OOD, modularity).
  - Completion of Anthropic Academy coursework, familiarity with
    Co-work/Claude Code, and aspiration for Anthropic
    Architect certification.
  
  What we offer in return
  
  - Global Collaboration: The opportunity to work daily with
    diverse and talented professionals across the globe.
  - Off-the-Charts Career Growth: Сlear career path and a
    performance review system, career coaching, training and
    certifications, mentoring and knowledge sharing.
  - Well-being Is Top Priority: Parental leave, paid time off,
    comprehensive health and medical plans.
  - Real Work-Life Balance: Dependent on location, we offer
    remote, in-office, or hybrid working modes; flexible
    hours; work-life balance support on every stage and level.
  
  Why work for Astound Digital?
  
  Whether you’re working directly with our world-renowned
  clients or with your Astound colleagues from around the
  globe, you will shape the future of digital commerce, using
  emerging technologies and innovative approaches.
  
  Grow your career with Astound Digital, and discover exciting
  opportunities while doing the work you love!
