description: |
  Content Developer - HPC & AI
  
  
  
  This role has been designed as ‘Hybrid’ with an expectation
  that you will work on average 2 days per week from an HPE
  office.
  
  Who We Are:
  
  Hewlett Packard Enterprise is the global edge-to-cloud
  company advancing the way people live and work. We help
  companies connect, protect, analyze, and act on their data
  and applications wherever they live, from edge to cloud, so
  they can turn insights into outcomes at the speed required
  to thrive in today’s complex world. Our culture thrives on
  finding new and better ways to accelerate what’s next. We
  know varied backgrounds are valued and succeed here. We have
  the flexibility to manage our work and personal needs. We
  make bold moves, together, and are a force for good. If you
  are looking to stretch and grow your career our culture will
  embrace you. Open up opportunities with HPE.
  
  Job Description:
  
  
  
  HPE Operations is our innovative IT services organization.
  It provides the expertise to advise, integrate, and
  accelerate our customers’ outcomes from their digital
  transformation. Our teams collaborate to transform insight
  into innovation. In today’s fast paced, hybrid IT world,
  being at business speed means overcoming IT complexity to
  match the speed of actions to the speed of opportunities.
  Deploy the right technology to respond quickly to market
  possibilities. Join us and redefine what’s next for you.
  
  Job Family Definition:
  
  Based on identified training needs in the company business
  segments/global functions, designs and develops sales,
  technical or leadership/management training materials,
  including both traditional and media-based deliverables.
  Works with project teams to assess, design, develop,
  evaluate and/or acquire content, and assist with the
  delivery readiness of sales, leadership/management and/or
  technical training programs. Audiences may include company
  employees, partners, or customers. Tests and refines course
  content by delivering pilot training to sample participants;
  also delivers train-the-trainer programs.
  
  Management Level Definition:
  
  Applies advanced subject matter knowledge to solve complex
  business issues and is regarded as a subject matter expert.
  Frequently contributes to the development of new ideas and
  methods. Works on complex problems where analysis of
  situations or data requires an in-depth evaluation of
  multiple factors. Leads and/or provides expertise to
  functional project teams and may participate in cross-
  functional initiatives. Acts as an expert providing
  direction and guidance to process improvements and
  establishing policies. Frequently represents the
  organization to external customers/clients. Exercises
  significant independent judgment to determine best method
  for accomplishing work and achieving objectives. May provide
  mentoring and guidance to lower level employees.
  
  What you will do:
  
  Responsibilities:
  
  - Contributes to and may lead the portfolio management
    process, which includes needs assessment, solution
    selection, design, development, implementation, reporting,
    and continuous improvement and innovation of learning
    solutions.
  - Aligns development priorities with the needs of the company
    corporate and/or business/functions.
  - Manages and monitors monthly and quarterly forecasts against
    assigned budgets.
  - Performs cost-benefit and business impact analyses of
    alternative learning solutions.
  - Designs, plans, and ensures overall integrity/quality of
    global and regional curricula roadmaps.
  - Provides leadership to multiple project teams as
    appropriate.
  - Achieves financial goals, operational goals, and assigned
    metrics.
  
  What you need to bring:
  
  Education and Experience Required:
  
  - First level university degree; advanced university degree
    preferred or equivalent experience.
  - Typically 5-8 years in a training development or equivalent
    role.
  - Typically 4-6 years experience, including the management of
    large projects.
  
  Knowledge and Skills:
  
  - Advanced facilitation, content design, and consulting
    skills.
  - Advanced business and financial planning acumen.
  - Advanced project management and process development skills.
  - Advanced expertise working with cross-functional and global
    teams.
  - Advanced leadership, communication, change management, and
    relationship management skills.
  - Expert ability to quickly understand and adopt new, complex
    tools, technologies, systems.
  
  Additional Skills:
  
  Accountability, Accountability, Active Learning, Active
  Listening, Bias, Business, Change Management, Coaching,
  Communication, Creativity, Critical Thinking, Data Analysis,
  Design Thinking, Empathy, Follow-Through, Growth Mindset,
  Instructional Design, Intellectual Curiosity (Inactive),
  Long Term Planning, Managing Ambiguity, Organizing, Process
  Development (PD), Professional Presentation, Saba, Strategic
  Objectives {+ 2 more}
  
  What We Can Offer You:
  
  Health & Wellbeing
  
  We strive to provide our team members and their loved ones
  with a comprehensive suite of benefits that supports their
  physical, financial and emotional wellbeing.
  
  Personal & Professional Development
  
  We also invest in your career because the better you are,
  the better we all are. We have specific programs catered to
  helping you reach any career goals you have — whether you
  want to become a knowledge expert in your field or apply
  your skills to another division.
  
  Unconditional Inclusion
  
  We are unconditionally inclusive in the way we work and
  celebrate individual uniqueness. We know varied backgrounds
  are valued and succeed here. We have the flexibility to
  manage our work and personal needs. We make bold moves,
  together, and are a force for good.
  
  Let's Stay Connected:
  
  Follow @HPECareers on Instagram to see the latest on people,
  culture and tech at HPE.
  
