title: AI Engineer
company: Reflow
location: USA
remote: true
work_type: FULL_TIME
description: |
  We’re building Reflow, a workforce and workflow intelligence
  platform that helps teams understand and improve how work
  gets done. A key part of that vision is Reflow AI, agentic,
  automation-focused intelligence that adapts to how people
  actually work. We’re looking for an AI developer who can
  experiment fast, optimize intelligently, and help us push
  the boundaries of AI-assisted performance.
  
  What you’ll do
  
  - Develop, optimize, and maintain agentic AI pipelines for
    automation and workflow intelligence.
  - Experiment with prompt engineering, context tuning, and
    model orchestration to improve performance and
    adaptability.
  - Work with vector databases, RAG (retrieval-augmented
    generation), and related frameworks for contextual
    intelligence.
  - Collaborate with engineers and product teams to integrate AI
    systems into real-world workflows.
  - Continuously refine and improve models through
    experimentation, data feedback, and iterative development.
  
  Who you are
  
  - 2+ years working on agentic AI systems that have scaled to
    external users
  - 4+ years as a Backend Developer or similar engineering role
  - Strong foundation in Python, LLMs, and agentic
    architectures.
  - Experienced in prompt engineering, context optimization, and
    AI pipeline design.
  - Comfortable building fast prototypes and testing model
    behavior in varied, complex contexts.
  - Curious, pragmatic, and unafraid to experiment, you turn
    uncertainty into working systems.
  
  Bonus points
  
  - Experience integrating AI into desktop or web apps.
  - Familiarity with LangChain, OpenAI API, or similar
    frameworks.
  - Background in automation systems, workflow optimization, or
    enterprise AI tools.
  
  Why join
  
  You’ll help shape the intelligence core of Reflow, the layer
  that learns from work patterns and turns data into action.
  You’ll work across experiments, prototypes, and production
  systems, collaborating directly with founders and engineers.
  Ideal for someone who loves to push AI beyond the
  theoretical into the real.
  
  Compensation:
  
  We offer competitive pay based on the market and where
  you’re located. The salary ranges in our job postings are
  intentionally wide because they need to cover both U.S. and
  international candidates. Our final offer will depend on
  things like your experience, skill set, and location.
