job_id: 8634334
title: Senior Mobile Infrastructure Engineer, Ambient AI
company: Commure
location: Los Angeles, USA
work_type: FULL_TIME
description: |
  At Commure, we're building the AI Operating System for
  healthcare, the foundation that defines how care is
  delivered, documented, and financed. Our platform spans the
  full care journey: Ambient AI and Dictation eliminating
  documentation burden at the point of care, intelligent
  Agents automating patient and revenue workflows, and
  autonomous RCM processing billions in claims, all on a
  single AI-native platform integrated with 60+ EHRs.
  
  Healthcare carries a $1 trillion administrative burden and
  we're at the center of transforming it. Today, 500,000+
  clinicians across 500+ healthcare organizations nationwide
  trust Commure to handle $25B+ in annual claims and support
  over 200 million patient interactions. Our latest $70M raise
  at a $7B valuation reflects the confidence the market has
  placed in this mission.
  
  Our team works directly alongside clinicians, not through
  layers of process, which means the gap between what you
  build and its impact on patient care is immediate. We move
  fast, deploy daily, and take full ownership from early
  thinking to production. If you're energized by hard
  problems, high stakes, and a team that holds itself to a
  high bar, you'll find your people here.
  
  The future of healthcare is being built right now. Come
  deliver this transformation.
  
  About the Role
  
  We’re building a next-generation ambient AI platform for
  healthcare, helping clinicians focus on patient care by
  automatically capturing, understanding, and structuring
  clinical conversations in real time.
  
  Mobile is at the center of this experience. Our apps power
  long-form audio recording, real-time streaming, offline
  reliability, background sync, and AI-assisted clinical
  workflows in environments where reliability is mission-
  critical. This is not a CRUD app; we’re building new
  interaction patterns for AI-native healthcare software,
  including real-time transcription, multimodal clinical
  workflows, agentic actions, and offline-first care delivery.
  
  We’re hiring a Senior / Staff-level Mobile Infrastructure
  Engineer to help own and evolve the foundation of our mobile
  platform across iOS, Android, and cross-platform surfaces.
  You’ll work deeply on mobile architecture, performance,
  reliability, developer experience, CI/CD, observability, and
  native integrations — while also contributing to product-
  facing experiences when platform work intersects with
  clinician workflows.
  
  This is a highly leveraged role for someone with strong iOS
  and/or Android depth, cross-platform experience, and
  platform instincts.
  
  Today, our mobile application is primarily built in Flutter,
  with native Swift/iOS and Kotlin/Android integrations where
  platform-specific capabilities are required. This role is
  ideal for someone who brings deep native mobile expertise
  and is excited to apply that judgment within a cross-
  platform codebase. Flutter experience is helpful, but not
  required.
  
  What You’ll Do
  
  - Own and evolve our primarily Flutter-based mobile platform,
    including native Swift/iOS and Kotlin/Android integrations
    for audio capture, background execution, offline
    reliability, performance, and observability. Core areas
    include:
    - Real-time audio capture, streaming, chunked uploads, and
      long-form clinical recording
    - Offline-first data handling, local persistence, background
      sync, and recovery flows
    - App performance across startup time, responsiveness, memory,
      battery usage, and background execution
    - Mobile observability, crash reporting, error handling,
      logging, and regression detection
    - Release infrastructure, CI/CD automation, build systems,
      signing, and App Store / Play Store workflows
  - Build and improve foundational mobile frameworks used across
    our apps, such as:
    - Audio recording and processing abstractions
    - Caching and persistence layers
    - State management patterns
    - Navigation and component systems
    - Networking, retry, and sync primitives
    - Mobile observability and diagnostics tooling
  
  - Strengthen mobile reliability by systemically reducing
    crashes, improving release readiness, and preventing
    regressions before they reach clinicians.
  - Partner with product, backend, AI, and design teams to
    understand emerging infrastructure needs and unblock fast,
    reliable product development.
  - Help shape the technical direction for mobile architecture
    as we scale the Ambient AI product line.
  - Contribute occasionally to adjacent surfaces such as our
    Chrome extension and web app, primarily where mobile,
    audio, AI workflow, or platform infrastructure needs
    intersect.
  - Mentor other engineers and help raise the technical bar
    across mobile. There is an opportunity to grow into
    broader mobile technical leadership or people leadership
    over time, but management is not required for this role.
  
  What You Have
  
  - 5+ years of professional mobile development experience, with
    deep experience in iOS, Android, or both.
  - Strong native mobile expertise in Swift/iOS and/or
    Kotlin/Android, including app lifecycle, background
    execution, permissions, performance, and platform-specific
    constraints.
  - Experience working in, or a strong willingness to ramp into,
    a Flutter-based mobile codebase. We value deep native iOS
    and/or Android expertise, and Flutter experience is a plus
    rather than a hard requirement.
  - Experience building or maintaining production-grade mobile
    infrastructure at scale.
  - Experience working in cross-platform mobile environments,
    such as Flutter, React Native, Kotlin Multiplatform,
    shared native modules, or similar architectures.
  - Strong understanding of mobile architecture, release
    processes, CI/CD, testing, observability, and reliability
    best practices.
  - Experience improving app performance, crash rates, release
    quality, or developer velocity through platform-level
    investments.
  - Comfort working across product, backend, design, and AI
    engineering teams in a fast-moving environment.
  - Ownership mindset and strong bias for action — you’ve owned
    meaningful parts of a mobile stack and driven ambiguous
    infrastructure work to completion.
  
  Nice to Haves
  
  - Experience with audio/video streaming, real-time media
    pipelines, audio chunking, transcription, or background
    recording.
  - Experience with offline-first systems, sync engines,
    conflict handling, or resilient local persistence.
  - Experience with mobile observability tools such as Firebase
    Crashlytics, Sentry, Datadog, Amplitude, or similar.
  - Experience with Fastlane, Firebase App Distribution,
    TestFlight, Play Console automation, build optimization,
    or release automation.
  - Experience with AI-native product experiences, real-time
    transcription, multimodal workflows, or agentic user
    experiences.
  - Exposure to healthcare, HIPAA, SOC 2, security, encryption,
    privacy, or regulated mobile environments.
  - Flutter/Dart experience, including Riverpod or similar state
    management patterns.
  - Experience with Shorebird, CodePush, or other mobile over-
    the-air update platforms.
  - Light JavaScript, TypeScript, Chrome extension, or web app
    experience.
  
  Why Join
  
  - Own the mobile infrastructure behind a mission-critical AI
    healthcare product used in real clinical workflows.
  - Work on cutting-edge mobile + AI problems: real-time audio,
    streaming, offline AI workflows, multimodal UX, agentic
    actions, and clinical automation.
  - Help define what best-in-class AI-native healthcare
    applications should look and feel like.
  - Build platform foundations that directly improve clinician
    experience, product velocity, reliability, and patient
    care.
  - Join at a stage where mobile architecture, team culture, and
    technical strategy are still highly shapeable.
  - Grow into a broader mobile platform leadership role as the
    team and product surface area expand.
  
  Please be aware that all official communication from us will
  come exclusively from email addresses ending in
  @getathelas.com, @commure.com or @augmedix.com. Any emails
  from other domains are not affiliated with our organization.
  
  Employees will act in accordance with the organization’s
  information security policies, to include but not limited to
  protecting assets from unauthorized access, disclosure,
  modification, destruction or interference nor execute
  particular security processes or activities. Employees will
  report to the information security office any confirmed or
  potential events or other risks to the organization.
  Employees will be required to attest to these requirements
  upon hire and on an annual basis.
