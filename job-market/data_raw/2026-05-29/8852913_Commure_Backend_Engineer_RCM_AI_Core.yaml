description: |
  At Commure, we're building the AI Operating System for
  healthcare, the foundation that defines how care is
  delivered, documented, and financed. Our platform spans the
  full care journey: Ambient AI and Dictation eliminating
  documentation burden at the point of care, intelligent
  Agents automating patient and revenue workflows, and
  autonomous RCM processing billions in claims, all on a
  single AI-native platform integrated with 60+ EHRs.
  
  Healthcare carries a $1 trillion administrative burden and
  we're at the center of transforming it. Today, 500,000+
  clinicians across 500+ healthcare organizations nationwide
  trust Commure to handle $25B+ in annual claims and support
  over 200 million patient interactions. Our latest $70M raise
  at a $7B valuation reflects the confidence the market has
  placed in this mission.
  
  Our team works directly alongside clinicians, not through
  layers of process, which means the gap between what you
  build and its impact on patient care is immediate. We move
  fast, deploy daily, and take full ownership from early
  thinking to production. If you're energized by hard
  problems, high stakes, and a team that holds itself to a
  high bar, you'll find your people here.
  
  The future of healthcare is being built right now. Come
  deliver this transformation.
  
  About the Role
  
  At Commure, our Revenue Cycle Management (RCM) AI team is
  building the autonomous backend that turns healthcare's most
  manual financial workflows into intelligent systems. You'll
  ship production AI directly into core revenue cycle
  operations, with LLM-powered agents and copilots that
  automate claims submission, remittance posting, denials and
  appeals, and document extraction with real guardrails and
  compliance built in. You'll own the full lifecycle of AI
  features from prompt design and evals through production
  infrastructure, and partner directly with customers and
  internal operations teams to turn repetitive manual work
  into auditable, AI-assisted workflows. We're looking for a
  Backend Engineer who takes ownership end-to-end, moves fast,
  and wants their work to directly impact how care is
  delivered.
  
  What You’ll Do
  
  - Contribute to the most advanced billing platform in the
    country
  - Build end-to-end products to revolutionize revenue cycle
    management for providers and administrators
  - Be a part of a tremendously fast-paced team that celebrates
    fast execution and decisions
  - Work across the entire software stack
  - Work with a stack that includes Python, Flask, Django,
    FastAPIs and other frameworks
  - Work directly with customers to solve their issues daily
  
  What You Have
  
  - Bachelor’s or Master’s degree in Computer Science,
    Engineering, or a related field, or equivalent extensive
    experience
  - 3+ years of full time professional software development
    industry experience
  - [Preferred] Strong Backend Programming Skills (Must be
    comfortable with Python)
  - [Preferred] Experience in environments where you have to
    ship quickly. We move fast.
  - General Understanding of Containers and Cloud (Docker,
    Kubernetes)
  - Excitement to work in a high impact field with a builder
    attitude!
  - Experience building production environments
    - Alerting and reporting
    - Metrics tracking
    - Software reliability engineering
    - Great product sense
  - Attention to detail around user experience and customer
    needs
  - Extremely motivated to grow
  - Strong leadership skills
  
  Please be aware that all official communication from us will
  come exclusively from email addresses ending in
  @getathelas.com, @commure.com or @augmedix.com. Any emails
  from other domains are not affiliated with our organization.
  
  Employees will act in accordance with the organization’s
  information security policies, to include but not limited to
  protecting assets from unauthorized access, disclosure,
  modification, destruction or interference nor execute
  particular security processes or activities. Employees will
  report to the information security office any confirmed or
  potential events or other risks to the organization.
  Employees will be required to attest to these requirements
  upon hire and on an annual basis.
