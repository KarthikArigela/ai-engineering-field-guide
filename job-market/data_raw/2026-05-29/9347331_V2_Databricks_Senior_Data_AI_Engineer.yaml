  About V2
  
  V2 Strategic Advisors is where velocity meets voltage - a
  boutique management and technology consulting firm that has
  spent 20+ years transforming media and advertising sales
  organizations. We're the firm that global and high-growth
  organizations call when they need more than a strategy deck
  - they need results.
  
  Our edge? We offer a rare blend of management consulting,
  data, analytics, AI, and systems integration - all under one
  roof, powered by best-in-class platforms including
  Salesforce, Databricks, Snowflake, HubSpot, and leading AI
  platforms like Claude and Gemini. We understand the nuances
  of our clients' most complex challenges and deliver
  solutions that move the needle.
  
  We're a lean, elite team of consultants, technical
  architects, and data experts who operate with the rigor of
  global management consulting and systems integration
  consultancies and the energy and agility of a startup. We
  approach every day with a sense of purpose to deliver with
  excellence, grow our capabilities, and find fulfillment in
  what we do. If that sounds like your kind of environment,
  keep reading.
  
  The Opportunity
  
  V2’s Databricks practice is growing rapidly, and we’re
  looking for a senior practitioner to accelerate that growth.
  You’ll work directly with our SVP of Architecture, Data &
  Analytics and a sharp group of technical professionals to
  execute with precision and raise the bar across every
  engagement.
  
  You bring the hands-on depth to design and implement
  production-grade Lakehouse solutions, and build pipelines,
  models, and intelligent applications that deliver
  exceptional results for our clients. You'll be a force
  multiplier for the team: elevating the work, setting the
  standard, and helping us win in a market where the
  Databricks platform is increasingly powerful and relevant
  for the future of business systems.
  
  If you want to build something that matters with people who
  operate at a high standard, keep reading.
  
