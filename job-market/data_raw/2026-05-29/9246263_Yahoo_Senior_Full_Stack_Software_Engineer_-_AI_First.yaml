description: |
  It takes powerful technology to connect our brands and
  partners with an audience of hundreds of millions of people.
  Whether you’re looking to write mobile app code, engineer
  the servers behind our massive ad tech stacks, or develop
  algorithms to help us process trillions of data points a
  day, what you do here will have a huge impact on our
  business—and the world.
  
  Senior Full Stack Software Engineer— AI-FirstA Lot About You
  
  We are seeking a Senior Full Stack Engineer who is ready to
  build the next generation of secure, scalable Identity
  systems. As a Senior Professional, you possess specialized
  depth in full-stack architecture and a commitment to modern,
  AI-augmented engineering practices. You are a systems-
  thinker who thrives in an "AI-First" environment, where you
  act as both an architect and a validator of high-quality
  code. You possess an openness to experimentation and a focus
  on using structured specs to drive massive impact across the
  Identity ecosystem.
  
  Responsibilities
  
  - Design, build, and operate high-scale Identity systems
    (React, TypeScript, Java/Node) with a focus on security
    and global availability.
  - Orchestrate an AI-first workflow, utilizing Spec-Driven
    Development (SDD) and AI-assisted tools (e.g.,
    CodeWhisperer Professional) to accelerate implementation
    while maintaining architectural integrity.
  - Identify and implement AI-driven efficiencies in the
    development lifecycle, replacing manual testing and
    boilerplate generation with automated, AI-validated
    workflows.
  - Own complex features end-to-end, from initial requirements
    and system design to production monitoring and operational
    excellence.
  - Improve system reliability and performance by identifying
    systemic bottlenecks and proactively suggesting AI-
    assisted diagnostics or optimizations.
  - Mentor engineers across the squad, raising the bar for
    engineering standards and scaling AI-first best practices
    through peer reviews and design sessions.
  - Exercise judgment in balancing AI-generated outputs with
    manual oversight, ensuring all implementations meet
    Yahoo's rigorous security and performance standards.
  
  Requirements
  
  - 5–8 years of full stack development experience with React,
    TypeScript, and Java/Node.
  - Strong fundamentals in system design, APIs, distributed
    systems, and modern web technologies.
  - Proven expertise in prompt engineering and structured
    interaction with AI tools to drive software
    implementation.
  - Demonstrated ability to independently lead and deliver
    complex, multifaceted features in a production-grade
    environment.
  - Deep experience with testing frameworks and a track record
    of maintaining high-quality, secure codebases.
  - Commitment to evaluating and refining AI-generated outputs,
    ensuring the detection of errors, hallucinations, or
    security vulnerabilities.
  
  Nice to Have
  
  - Experience with identity/auth systems (OAuth, OIDC, SAML, or
    FIDO).
  - Cloud platform experience (GCP, AWS, or Azure).
  - Experience with Spec-Driven Development (SDD) or structured
    engineering workflows using tools like Claude Code or
    Copilot.
  - Familiarity with CI/CD, observability (Splunk/Grafana), and
    performance optimization at scale.
  - Exposure to accessibility (a11y), internationalization
    (i18n), or large-scale consumer systems.
  
  What Success Looks Like
  
  - Consistently deliver high-quality, scalable systems with
    strong ownership and minimal supervision.
  - Significantly increase team velocity by successfully
    integrating AI-augmented oversight into daily engineering
    tasks.
  - Raise the engineering standard across the team by mentoring
    others in AI-first and SDD practices.
  - Proactively improve team productivity through the
    optimization of AI workflows and structured implementation
    specs.
  
  The material job duties and responsibilities of this role
  include those listed above as well as adhering to Yahoo
  policies; exercising sound judgment; working effectively,
  safely and inclusively with others; exhibiting
  trustworthiness and meeting expectations; and safeguarding
  business operations and brand integrity.
  
  At Yahoo, we offer flexible hybrid work options that our
  employees love! While most roles don’t require regular
