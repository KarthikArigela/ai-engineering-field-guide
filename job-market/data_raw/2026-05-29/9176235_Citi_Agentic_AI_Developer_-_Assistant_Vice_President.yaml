title: Agentic AI Developer - Assistant Vice President
company: Citi
location: Pune, IND
work_type: FULL_TIME
company_size: 223,850 Employees
description: |
  The Applications Development Senior Programmer Analyst is an
  intermediate level position responsible for participation in
  the establishment and implementation of new or revised
  application systems and programs in coordination with the
  Technology team. The overall objective of this role is to
  contribute to applications systems analysis and programming
  activities.
  
  The Agentic AI Developer will be responsible for designing,
  developing, and deploying AI agents capable of understanding
  goals, planning actions, and executing tasks with minimal
  human intervention. This role requires a strong
  understanding of AI principles, agent-based systems, machine
  learning, and software engineering best practices. The ideal
  candidate will be able to translate research ideas into
  robust and scalable production systems. Responsibilities:
  
  - Agent Design and Development: Design and implement
    intelligent agents, including their perception, reasoning,
    planning, and action execution modules.
  - System Architecture: Develop scalable and robust
    architectures for agentic systems, ensuring high
    performance, reliability, and security.
  - Machine Learning Integration: Integrate various machine
    learning models (e.g., LLMs, reinforcement learning,
    predictive models) to enhance agent capabilities and
    decision-making.
  - Task Automation: Develop agents that can automate complex
    tasks, optimize workflows, and solve real-world problems
    across various domains.
  - Framework and Tooling: Utilize and contribute to agentic AI
    frameworks and development tools.
  - Evaluation and Optimization: Design and implement metrics
    and evaluation strategies for agent performance,
    continuously optimizing and improving agent behavior.
  - Research and Innovation: Stay abreast of the latest
    advancements in AI, particularly in agent-based systems,
    autonomous AI, and related fields, and propose innovative
    solutions.
  - Collaboration: Work closely with cross-functional teams
    including AI researchers, data scientists, product
    managers, and software engineers to integrate agentic
    solutions into broader products and services.
  - Documentation: Create comprehensive technical documentation
    for agent designs, implementations, and operational
    procedures.
  
  - Monitor and control all phases of development process and
    analysis, design, construction, testing, and
    implementation as well as provide user and operational
    support on applications to business users
  - Utilize in-depth specialty knowledge of applications
    development to analyze complex problems/issues, provide
    evaluation of business process, system process, and
    industry standards, and make evaluative judgement
  - Recommend and develop security measures in post
    implementation analysis of business usage to ensure
    successful system design and functionality
  - Consult with users/clients and other technology groups on
    issues, recommend advanced programming solutions, and
    install and assist customer exposure systems
  - Ensure essential procedures are followed and help define
    operating standards and processes
  - Serve as advisor or coach to new or lower level analysts
  - Has the ability to operate with a limited level of direct
    supervision.
  - Can exercise independence of judgement and autonomy.
  - Acts as SME to senior stakeholders and /or other team
    members.
  - Appropriately assess risk when business decisions are made,
    demonstrating particular consideration for the firm's
    reputation and safeguarding Citigroup, its clients and
    assets, by driving compliance with applicable laws, rules
    and regulations, adhering to Policy, applying sound
    ethical judgment regarding personal behavior, conduct and
    business practices, and escalating, managing and reporting
    control issues with transparency.
  
  Recommended Qualifications:
  
  - 8+ years of relevant experience
  - Experience: 5+ years of professional experience in software
    development with a focus on AI, machine learning, or
    agent-based systems.  Experience in finance industry a
    plus.
  - Programming: Strong proficiency in Python, SQL; Java is a
    plus.
  - AI/ML Expertise:
  - Solid understanding of core AI concepts, including knowledge
    representation, automated planning, decision-making under
    uncertainty, and multi-agent systems.
  - Experience with machine learning frameworks (e.g.,
    TensorFlow, PyTorch) and relevant libraries (e.g., scikit-
    learn, numpy, pandas).
  - Familiarity with large language models (LLMs) and their
    application in agentic systems.
  - Familiarity with specific agent frameworks (e.g., LangChain,
    AutoGen, CrewAI, RAG) or research in multi-agent
    reinforcement learning.
  - Experience in designing and implementing APIs for AI
    services.
  - Software Engineering: Experience with software development
    best practices, including version control (Git), CI/CD
    pipelines, testing, and code reviews.
  - Problem-Solving: Excellent analytical and problem-solving
    skills with a creative approach to complex challenges.
  - Communication: Strong written and verbal communication
    skills, with the ability to articulate complex technical
    concepts to diverse audiences.
  - Platforms: Experience with cloud platforms (AWS, Azure, GCP)
    and containerization technologies (Docker, Kubernetes).
  
  Education:
  
  - Bachelor’s degree/University degree or equivalent experience
  
