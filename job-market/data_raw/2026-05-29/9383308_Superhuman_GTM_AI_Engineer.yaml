description: |
  Superhuman offers a dynamic hybrid model, and candidates in
  this role can be based remotely. You may be expected to
  travel to meet in person during your team’s scheduled
  collaboration weeks. Managers will determine in-person time
  according to business needs
  
  About Superhuman
  
  Grammarly is now part of Superhuman, the AI productivity
  platform on a mission to unlock the superhuman potential in
  everyone. The Superhuman suite of apps and agents brings AI
  wherever people work, integrating with over 1 million
  applications and websites. The company’s products include
  Grammarly’s writing assistance, Coda’s collaborative
  workspaces, Mail’s inbox management, and Go, the proactive
  AI assistant that understands context and delivers help
  automatically. Founded in 2009, Superhuman empowers over 40
  million people, 50,000 organizations, and 3,000 educational
  institutions worldwide to eliminate busywork and focus on
  what matters. Learn more at superhuman.com and about our
  values here.
  
  The Opportunity
  
  As GTM AI Engineer, you will own the design and execution of
  AI-driven workflows across Superhuman's go-to-market stack,
  translating ideas from sales leadership and business
  partners into automations that measurably improve how our
  reps prospect, manage pipeline, and close deals. You'll be
  the builder behind our GTM AI function, turning a strong
  existing foundation in Salesforce, Gong, Outreach and more
  into a high-leverage, AI-powered revenue engine. This role
  offers the unique opportunity to define how Superhuman's go-
  to-market teams operate in an AI-first world, from the
  ground up, with direct visibility into the impact of your
  work.
  
  In this role, you will:
  
  - Architect end-to-end AI workflows for GTM use cases like
    prospecting and deal execution, defining data flows,
    system integrations, and automation logic
  - Ship 5 - 10 production AI workflows per quarter, from
    initial scoping through to live deployment and any
    subsequent iterations
  - Configure MCPs and AI infrastructure and tooling; determine
    where data needs to come from and how it gets delivered to
    the right people or systems
  - Manage Superhuman's MCP and AI connector library available
    to the GTM org, ensuring the tooling is discoverable,
    maintained, and actively adopted
  - Break down high-level business goals (e.g. "AI-inspect our
    pipeline") into concrete technical requirements and build
    against them
  - Partner with business partners and sellers to surface
    workflow pain points and translate them into AI-ready
    specifications
  - Own and prioritize a live backlog of AI use cases for the
    GTM org; gathering ideas from sellers, business partners,
    and leadership and operationalizing the best ones
  - Identify and evaluate tools, vendors and AI capabilities
    relevant to our GTM tech stack
  
  Qualifications
  
  - 5+ years in GTM Systems, Revenue Operations, Sales
    Operations, or a similar role in high-growth SaaS
    environments
  - Hands-on experience building AI-powered workflows,
    automations, or agents in a business context (not just
    prompt engineering)
  - Extensive experience with Clay, building multi-step
    workflows that pull data from multiple sources and take
    action
  - Proficiency with AI tools like Claude, Gemini or Perplexity
    for workflow automation, including prompt design, tool
    use, and agentic task orchestration
  - Extensive experience with MCP (Model Context Protocol)
    configuration and AI agent frameworks
  - Solid understanding of how enterprise GTM tools connect
    together; i.e. CRM (Salesforce), CPQ (DealHub), sales
    engagement (Outreach), conversation intelligence (Gong),
    data enrichment (Zoominfo) and adjacent tooling with
    experience in administering these or similar tools
  - Comfortable working from ambiguity to delivery; you can take
    a rough idea and ship something real in weeks, not
    quarters
  - Excellent communicator who can translate technical ideas
    from non-technical stakeholders
  - Has a demonstrated ability to work independently with
    minimal guidance, proactively manages tasks and priorities
    across multiple projects, analyzes and executes work
    efficiently, collaborates effectively with cross-
    functional teams, and thrives in fast-paced, results-
    driven environments.
  
  Compensation and Benefits
  
  Superhuman offers all team members competitive pay along
  with a benefits package encompassing the following and more:
  
  - Excellent health care (including a wide range of medical,
    dental, vision, mental health, and fertility benefits)
  - Disability and life insurance options
  - 401(k) and RRSP matching
  - Paid parental leave
  - 20 days of paid time off per year, 12 days of paid holidays
    per year, two floating holidays per year, and flexible
    sick time
  - Generous stipends (including those for caregiving, pet care,
    wellness, your home office, and more)
  - Annual professional development budget and opportunities
  
  Superhuman takes a market-based approach to compensation, so
  base pay may vary by location. Our US locations are
  categorized into two compensation zones based on proximity
  to our hub locations. In Canada, all locations where we
  support employment are considered “Zone 1”.
  
  
  
  Base pay may vary considerably depending on job-related
  knowledge, skills, and experience. The expected salary
  ranges for this position are outlined below by compensation
  zone and may be modified in the future.
  
  United States:
  
  Zone 1: $140,000 - $190,000/year USD
  
  Zone 2: $123,000 - $154,000/year USD
  
  
  
  Canada:
  
  Zone 1: $100,000 - $135,000/year CAD
  
  For more information about our compensation zones and
  locations where we currently support employment, please
  refer to this page. If a location of interest is not listed,
  please speak with a recruiter for additional information.
  
