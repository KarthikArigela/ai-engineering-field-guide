  Life at Flex
  
  We understand that it takes a diverse team of highly
  intelligent, curious, determined, empathetic, and self aware
  people to grow a successful company. Our HQ is located in
  New York City, but we have employees located throughout the
  US, Australia, Canada and South America. We are growing
  quickly, but deliberately, with a focus on building an
  inclusive culture. Our dynamic team has incredible
  perspectives to share, just as we know you do, and we take
  great pride in being an equal opportunity workplace.
  
  Offices
  
  Roles posted in New York, San Francisco, and Salt Lake City
  are hybrid positions with on-site expectations of 2-3 days
  per week in our local offices. For candidates outside of
  these areas, you may be eligible for our relocation
  assistance program.
  
  Benefits
  
  For full-time U.S. employees we offer:
  
  - Competitive medical, dental, and vision
  - Company equity
  - 401(k) plan with company match
  - Unlimited paid time off + 13 company paid holidays
  - Parental leave
  - Free Flex subscription
  
   For full-time non-U.S. employees, we offer:
  
  - Competitive compensation + company equity
  - Unlimited PTO
