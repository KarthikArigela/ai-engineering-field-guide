title: Software Engineer Intern – AI Applications
company: Cambium Learning Group
location: USA
remote: true
work_type: INTERN
description: |
  Cambium Learning® Group is an award-winning educational
  technology solutions leader dedicated to helping all
  students reach their potential through individualized and
  differentiated instruction. Using a research-based,
  personalized approach, Cambium Learning Group delivers SaaS
  resources and instructional products that engage students
  and support teachers in fun, positive, safe and scalable
  environments. These solutions are provided through Learning
  A-Z® (online differentiated instruction for elementary
  school reading, writing and science), ExploreLearning®
  (online interactive math and science simulations, a math
  fact fluency solution, and a K–2 science solution), Voyager
  Sopris Learning® (blended solutions that accelerate
  struggling learners to achieve in literacy and math and
  professional development for teachers), and VKidz Learning
  (online comprehensive homeschool education and programs for
  literacy and science). We believe that every student has
  unlimited potential, that teachers matter, and that data,
  instruction, and practice are the keys to success in the
  classroom and beyond.
  
  Location: Remote, US. You must reside and work in the US for
  this internship position.
  
  Internship Overview:
  
  Are you excited to explore how AI can transform learning? As
  a Software Engineer Intern (AI Applications), you’ll join a
  collaborative team of engineers and researchers building
  AI‑powered educational assessment systems used by millions
  of students. This internship offers hands‑on experience
  contributing to real AI products while learning from
  experienced engineers at the forefront of EdTech.
  
  Internship Responsibilities:
  
  As an intern, you’ll support and learn from the AI
  Applications team by contributing to projects such as:
  
  - Assisting in the development of AI‑powered features using
    Large Language Models (LLMs)
  - Supporting AI agent workflows, including prompt design, tool
    integration, and basic orchestration logic
  - Helping integrate generative AI capabilities into
    educational platforms
  - Contributing to evaluation and testing of AI systems for
    quality, safety, and performance
  - Collaborating with engineers, product managers, and
    researchers on real‑world learning use cases
  - Exploring responsible AI practices in a mission‑driven
    education environment
  
  What You’ll Learn:
  
  - Practical experience working with modern AI and generative
    technologies
  - How production‑grade AI systems are designed, tested, and
    deployed
  - Best practices for building safe, scalable, and user‑focused
    AI features
  - How cross‑functional teams turn learning science, advances
    in technology and user needs into high impact software
    systems and products
  
  Internship Requirements:
  
  - Currently pursuing a postgraduate degree in Computer
    Science, Data Science, Software Engineering, AI/ML, or a
    related field.
  - Experience (academic or project‑based) with at least one
    programming language such as Python,
    JavaScript/TypeScript, or C#
  - Familiarity with web development, APIs, or backend systems
  - Interest in Generative AI, LLMs, or intelligent systems
  - Strong problem‑solving skills and eagerness to learn
  - Ability to collaborate effectively in a team environment
  
  Nice to Have
  
  - Coursework or projects involving advanced AI, machine
    learning, or NLP
  - Exposure to cloud platforms (AWS, Azure, or GCP)
  - Interest in education technology or applied learning
    sciences
  
  To apply for this opportunity, simply click on the “Apply”
  button and submit a cover letter and resume.
  
  An Equal Opportunity Employer
  
  We are dedicated to fostering a culture that celebrates
  unique backgrounds, ideas, and experiences. All qualified
  applicants will receive consideration for employment without
  discrimination on the basis of race, color, religion, sex,
  gender, gender identity/expression, sexual orientation,
  national origin, protected veteran status, or disability.
