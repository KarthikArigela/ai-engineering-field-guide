description: |
  Most marketing teams still measure output in campaigns
  shipped. We measure it in decisions our agents make
  autonomously, and we want to widen that gap.
  
  You will design, deploy, and govern the agentic layer that
  runs Sidetrade marketing: lead scoring, enrichment,
  prospection, campaign orchestration, and attribution. You
  will ship agents, instrument them, evaluate their outputs,
  and retire them the moment something better exists.
  
  This is a builder role, not a strategy role.
  
  First 12 months, you will:
  
  - Replace at least three manual marketing workflows with
    production agents, with measured time savings and quality
    parity or better.
  - Stand up the evaluation and observability layer: cost per
    task, accuracy, drift, human escalation rate, reported
    monthly to the exec team.
  - Cut the Martech stack by at least 20 percent on cost or tool
    count, against measurable value.
  
  About Sidetrade
  
  Sidetrade is an AI company, listed on Euronext Growth, on a
  mission to revolutionize the way enterprises unlock value
  from their customers leveraging its Order-to-Cash
  Intelligence platform and its Data Lake.
  
  We’re proud of our 38 nationalities and these diverse
  perspectives drive our innovation, one team culture and a
  customer-first mindset. Sudetrade is positioned as a
  Gartner® Magic Quadrant™ Leader since 2022.
  
  We value passion over perfection. So, if you’re eager to
  learn and bring great energy, we want to hear from you. Be
  you. Grow with us.
  
  Curious about Sidetrade? Catch the Sidetrade Inside Out
  podcast.
  
  Requirements
  
  What you will be doing:
  
  - Production of AI agents for lead scoring, enrichment, MQL
    handoff, prospection, and revenue attribution, co-owned
    with Sales, BDRs, and Demand Gen.
  - Prompt libraries, tool definitions, evaluation suites, and
    guardrails that define “production-ready” at Sidetrade.
  - Agent observability: cost, latency, accuracy, drift,
    escalation rate. Martech stack
  - Run and optimize Marketo, Salesforce, Salesloft, ZoomInfo,
    Cognism, LinkedIn Sales Navigator, LetSignIt.
  - Evaluate, onboard, and retire vendors against measurable
    value. Half the tools you inherit will be redundant within
    18 months.
  - Database hygiene, segmentation, lifecycle scoring, GDPR and
    CCPA compliance. Measurement
  - Quantify what the agentic layer produces: hours saved, MQLs
    added, pipeline influenced. Defend it on a board-ready
    cadence.
  
  What you will bring:
  
  - 5+ years in B2B SaaS marketing operations
  - Shipped at least one AI-driven workflow or agent that real
    users depended on. Sandbox demos do not count.
  - Working fluency with Marketo, HubSpot, or Pardot, plus
    Salesforce.
  - Hands-on with n8n, Make, or Zapier. You design multi-step
    flows, handle errors, and connect APIs without writing
    code from scratch.
  - Working fluency with LLM tools (Claude, ChatGPT, or
    equivalent): prompt design, AI inside workflows, and clear
    judgment on what these tools can and cannot do reliably.
  - Comfortable scoping work for a dev team, spec’ing it
    clearly, and validating the result. You read JSON and API
    docs. You do not write production code.
  - Useful, not required • Marketo Certified Expert. • ABM
    platforms (6sense, Demandbase, Terminus). • RevOps or
    analytics engineering background.
  
  Benefits
  
  - Hybrid work model – a flexible mix of in-office and remote
    days
  - Great culture – active Social Club organizing regular team
    events and activities
  - Health & wellness – medical coverage, life insurance, and
    other wellness programs
  - Time off – competitive paid holidays plus public holidays
  - Career growth & compensation – competitive salary, equal
    opportunities, learning & mentorship programs, and
    advancement support
  
  Because when you thrive, we all succeed!
  
  We’re committed to providing a welcoming and inclusive
  experience for every candidate If you need any accommodation
  during the hiring process, just let us know.
  
  Agencies
  
  We only accept applications from invited agencies via our
  Workable portal. Unsolicited CVs sent to managers or HR
  won’t be subject to fees.
