description: |
  Your mission
  
  As our AI Automation Engineer, you will be the driving force
  behind scaling efficiency at Cosuno. As the expert for
  Cosuno’s automation stack, you will partner with teams
  across the company to identify, design, and implement AI-
  driven workflows that transform their work. Rather than
  building or training proprietary models from scratch, you
  will leverage state-of-the-art existing models and reasoning
  chains to solve business problems.
  
  As part of the product team, you will collaborate closely
  with the CEO & CTO to ensure all solutions are technically
  sound and aligned with our core infrastructure. This is an
  execution-heavy role where success is measured by the speed
  and reliability of the modular automation platform you
  build.
  
  Key responsibilities
  
  - Discovery & Prioritization: Partner with Finance, Sales, Ops
    & Product to identify high-ROI automation opportunities &
    evaluate them based on business impact versus technical
    effort.
  - Workflow Engineering: Design, prototype, and deploy end-to-
    end AI workflows by building our orchestration stack
    (e.g., n8n, Vector Databases) and connecting various
    endpoints via APIs to build a universal memory for Cosuno.
  - Scaling & Modularity: Build solutions that are modular and
    reusable across different departments to avoid
    "reinventing the wheel" for every new request.
  - Enablement & Governance: Establish AI guardrails, while
    enabling AI champions in other departments to work with
    the automations themselves.
  - Monitoring & Optimization: Define and track success metrics
    (ROI, time saved, reliability) to ensure automations
    deliver continuous value.
  
  Your profile
  
  - The "Product" Mindset: You treat internal tools like
    products. You prioritize ruthlessly and focus on business
    value over "perfect code” or "beautiful UI”.
  - Technical Fluency: You are proficient in Python, n8n, and
    API architecture. You have hands-on experience with RAG
    and connecting LLMs to proprietary data sources.
  - Applied AI Focus: You prefer building “Reasoning Chains” and
    integrating existing tools over training custom models.
  - Systems Thinker: You see the company as a series of
    interconnected data flows. You naturally see patterns and
    build modular solutions that scale across teams.
  - Change Agent: You have experience driving organizational
    change and can explain complex technical concepts to non-
    technical stakeholders with ease.
  - Pragmatic Innovator: You would rather ship a working
    automation in two weeks than a perfect one in six months,
    and you have the commercial sense to block non-feasible
    requests.
  
  Why us
  
  - Applied AI, Not R&D: You won’t spend months training models
    that never go live. You’ll leverage the modern stack
    (LLMs, Vector DBs, n8n) to ship high-impact automations
    that solve real business problems immediately.
  - Uncapped Leverage: Construction is one of the last
    undigitized global industries. We aren't optimizing ad-
    clicks; we are building the digital nervous system for the
    physical world. Your efficiency gains here have a massive
    multiplier effect.
  - Strategic Ownership: You aren’t hidden in a silo.
    Collaborating directly with the CEO & CTO, you have the
    autonomy to identify bottlenecks and build the
    infrastructure that allows Cosuno to scale.
  
  About us
  
  Cosuno – Revolutionizing construction through technology.
  
  We are Cosuno – a fast-growing tech startup that is making
  the construction industry more efficient and transparent
  with our digital platform for tenders and procurement
  processes. Our goal: to solve the most complex challenges in
  the industry with innovation and simplicity.
  
  Why Cosuno?
  
  Artificial intelligence is the key to our solution: it
  analyzes millions of price data points and helps
  construction companies create precise and efficient bids.
  This not only saves our customers time but also helps them
  avoid unnecessary costs.
  
  But for us, it's not just about technology – it's about the
  people who drive it. At Cosuno, you will work with creative
  minds who are reshaping the construction industry. We
  believe in diversity because we know that the best ideas
  come from different perspectives. An integrative and
  inclusive work environment is a matter of course for us.
  
  Join us – Build the future of construction.
