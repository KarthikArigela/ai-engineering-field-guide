description: |
  Vendelux is transforming how companies discover, evaluate,
  and maximize the impact of events.
  
  Event marketers are the driving force behind pipeline and
  brand — yet events remain one of the least optimized and
  most opaque marketing channels. Vendelux changes that. We
  provide the system of record for event marketing, giving
  teams the data and insights they need to make smarter, more
  strategic decisions.
  
  Our AI-powered platform delivers proprietary insights across
  250,000+ events, helping high-growth companies identify
  where their ideal customers will be, maximize ROI, and turn
  events into a scalable growth channel. Customers often
  describe Vendelux as an event marketer’s dream. A key part
  of this is our growing network of event organizer
  partnerships — where organizers share first-party attendee
  and sponsorship data, and in return gain access to valuable
  market insights.
  
  In addition, Vendelux Meetings helps customers turn event
  insights into action — using AI to identify high-value
  attendees and automatically book 1:1 meetings with the right
  prospects at conferences. This allows teams to maximize
  pipeline generation and make every event materially more
  impactful.
  
  Founded in 2021, Vendelux is a Series A SaaS company backed
  by leading investors including FirstMark, with a recent $14M
  round. Our team brings experience from companies like Bain,
  ZoomInfo, Airbnb, FanDuel, Shutterstock, Compass and more.
  
  ________________
  
  Key Responsibilities
  
  - Applied AI Innovation: Research and apply modern methods (AI
    agents, LLMs, RAG, embeddings, supervised/unsupervised
    learning) to power new product capabilities, prioritizing
    impact and speed over perfection.
  - Enhance User Experience Through AI: Translate business
    problems into AI solutions that improve user workflows,
    accelerate insights, and drive measurable value
  - Build Agentic Chat Across the Product: Own the architecture
    and integration of agentic chat capabilities throughout
    the Vendelux platform — designing the underlying systems
    that allow AI agents to reason, take action, and surface
    insights across every surface of the product. You'll
    establish the patterns for how agents interact with
    internal data, external tools, and user workflows, turning
    conversational AI from a feature into a foundational layer
    of the product experience.
  - Build for Scale and Reliability: Architect multi-tenant AI
    infrastructure that meets the performance, latency, and
    cost requirements of a growing B2B SaaS product. You'll
    own observability, evaluation frameworks, and guardrails
    to keep AI features production-grade.
  - Partner Across Product and Engineering: Work closely with
    product, data science, and application engineering teams
    to translate business requirements into AI systems. You'll
    serve as a thought partner to leadership on the AI
    roadmap, influencing how Vendelux thinks about product
    differentiation through AI.
  
  Qualifications
  
  - 4+ years of professional experience in software engineering
    or data engineering, with at least 3+ years building
    AI/ML-driven products.
  - Strong programming skills in Python and proficiency in SQL.
  - Experience with modern AI frameworks (eg HuggingFace,
    LangChain, etc.) and designing data pipelines (Airflow,
    Dagster, or equivalent),
  - Solid understanding of cloud-based infrastructure (AWS, GCP,
    or Azure).
  - Experience applying LLMs and generative AI in production,
    including prompt engineering, RAG, and LLM deployment.
  - Strong grasp of fundamental data science and machine
    learning techniques, with the ability to balance research
    and engineering tradeoffs.
  - Demonstrated ability to translate business problems into
    data solutions that drive business value.
  - Proven track record of shipping user-facing features with
    measurable impact.
  - Excellent written and verbal communication skills; ability
    to collaborate across data, engineering, and product
    teams.
  - Startup experience preferred.
  
  Not all candidates will check all of the requirements listed
  above and that’s ok! We are open to great people from non-
  traditional backgrounds.
  
  Vendelux is proud to be an equal opportunity workplace. We
  are committed to equal opportunity regardless of race,
  color, ancestry, religion, gender, gender identity, parental
  or pregnancy status, national origin, sexual orientation,
  age, citizenship, marital status, disability, or veteran
  status.
