description: |
  This is a remote position.
  
  AI Developer / AI Engineer – Agentic AI, LLM & Predictive
  Analytics
  
  Job Summary
  
  We are looking for an AI Developer with hands-on experience
  in Agentic AI systems, Large Language Models (LLMs), and
  Predictive AI/ML models. The candidate will be responsible
  for designing, developing, and deploying AI solutions
  including autonomous agents, chatbots, predictive models,
  and AI automation tools to support business operations and
  product development.
  
   Key Responsibilities
  
  
  - Develop and deploy Agentic AI systems using frameworks like
    LangChain, CrewAI, AutoGen, etc.
  - Build applications using Large Language Models (OpenAI,
    Claude, Llama, etc.)
  - Design and implement Predictive AI / Machine Learning models
  - Develop AI chatbots, automation tools, and AI assistants
  - Work on RAG (Retrieval Augmented Generation) systems
  - Integrate AI solutions with web applications, CRMs, and
    enterprise systems
  - Fine-tune and optimize LLM models
  - Work with structured and unstructured data
  - Deploy AI models on cloud platforms (AWS, Azure, GCP)
  - Collaborate with business and product teams to identify AI
    use cases
  
  
  
  
  
  
  RequirementsRequired Skills
  
  
  - Python
  - Machine Learning (Regression, Classification, Clustering)
  - Predictive Modeling
  - LLM APIs (OpenAI, Anthropic, HuggingFace)
  - LangChain / CrewAI / AutoGen
  - Vector Databases (Pinecone, Weaviate, FAISS, Chroma)
  - RAG Architecture
  - Prompt Engineering
  - API Development
  - Data Processing (Pandas, NumPy)
  - Git / Version Control
  
   Preferred Skills
  
  
  - Fine-tuning LLM models
  - AI Agents / Multi-Agent Systems
  - NLP (Natural Language Processing)
  - MLOps
  - Docker / Kubernetes
  - Cloud AI Services
  - Knowledge Graphs
  - AI Automation Workflows
  
   Experience Required
  
  
   3–6 Years in AI/ML development
  
  
  
  
      OR
  
  
  
  
  2+ Years specifically in LLM / Generative AI / Agentic AI
  
  
   Education
  
  
  - B.Tech / M.Tech / MCA / MS in Computer Science, AI, Data
    Science or related field
  
  
  
  
  
  
