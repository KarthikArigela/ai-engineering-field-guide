description: |
  Job Description SummaryThis position provides IT engineering
  for the rapid, scalable, and compliant delivery of
  enterprise software applications and foundational workflows.
  The hallmark of our team is our ability to build next-
  generation applications by leveraging agentic AI development
  tooling using Claude Code to execute against three core
  pillars: modernizing our legacy portfolio capabilities by
  engineering new, operationally stable software alternatives;
  informing SaaS "make vs. buy" decisions at scale by rapidly
  prototyping bespoke solutions; and driving enterprise
  upskilling by establishing blueprint patterns for AI-
  assisted application development. These efforts allow for
  significant operational efficiency and consumption-focused
  innovation across GE Aerospace, as well as provide for
  improved, cutting-edge software services to our global
  workforce and customers.
  
  Job DescriptionRoles and Responsibilities
  
  In this role, you will:
  
  - Architect and design sound/supportable technical solutions
    for net-new software applications built from the ground up
    utilizing Claude Code and agentic workflows
  - Evaluate legacy systems to determine capabilities and
    requirements necessary to build high-performance,
    operationally stable replacement applications using
    generative development tools
  - Code complex, integrated, and modular applications by
    actively using Claude Code and related agentic software
    development frameworks
  - Provide support, maintenance, and continuous iterative
    improvement of AI-generated codebases and deployment
    pipelines
  - Triage/debug application performance, data handling, and
    security issues, tracing bugs within AI-generated code to
    establish corrective prompts and structural code remedies
  - Partner with multi-functional business units and product
    teams to assess their software needs and translate them
    into agentic prompt parameters and functional system
    designs
  - Assist leadership in executing "make vs. buy" strategies by
    leveraging Claude Code to rapidly build and deploy Minimum
    Viable Products (MVPs) to evaluate internal development
    velocity against commercial SaaS offerings
  - Develop new user interfaces, robust APIs, and web
    experiences optimized for modern, cloud-native deployments
  - Develop application enhancements and functional modules
    within new codebases, utilizing advanced context windows
    and automated validation loops
  - Write technical specifications, design system blueprints,
    and structured engineering documentation tailored for AI
    ingestion and future code iteration
  - Document system architecture changes, code repository
    structures, and successful agentic prompting patterns to
    scale institutional knowledge
  - Review AI-generated technical designs and code commits to
    ensure strict compliance with GE Aerospace engineering,
    safety, and security guardrails
  - Train, mentor, and actively upskill team members on how to
    effectively utilize Claude Code and agentic workflows
  
  Education Qualification
  
  - Bachelor’s degree from accredited university or college with
    minimum of 10 years of professional experience OR
    Associates degree with minimum of 13 years of professional
    experience OR High School Diploma with minimum of 15 years
    of professional experience
  - Minimum 7 years of professional experience in IT
  - Note: Military experience is equivalent to professional
    experience
  
  Eligibility Requirement:
  
  - Legal authorization to work in the U.S. is required.  We
    will not sponsor individuals for employment visas, now or
    in the future, for this job.
  
  Desired Characteristics
  
  - Demonstrated ability to quickly understand new software
    architectures and analyze systemic code challenges within
    a fast-moving, agentic development loop
  - Passionate about application security, secure coding
    guardrails, prompt defense, and the operational stability
    of new software
  - Organized, thorough, and detail-oriented, especially when
    managing automated telemetry and system verification tests
  - Collaborates well with others to solve complex software
    engineering problems and actively incorporates input from
    both human teammates and AI development agents
  - Eager to learn, shares creative ideas, encourages open
    experimentation, and accepts feedback well in a fast-paced
    technology landscape
  - Strong analytical skills – strong problem-solving skills,
    communicates in a clear and succinct manner, and
    effectively evaluates technical information/data to make
    design decisions; anticipates obstacles and develops plans
    to resolve them
  - Deeply interested in current and emerging technologies,
    keeping a pulse on the state-of-the-art in agentic coding
    tools, large language models, and multi-modal application
    development
  - Working knowledge of modern data layers, cloud
    architectures, and API development paradigms used to
    sustain rapid software generation
  - Demonstrated customer focus – evaluates application
    decisions through the eyes of the end-user; builds strong
    internal relationships and prioritizes clean UI/UX
    processes
  - High level of energy and enthusiasm, with the ability to
    thrive in a dynamic, fast-paced setting focused on
    organizational transformation
  - Experience operating within modern developer setups and
    orchestrating cloud environments
  - Experience deploying, scaling, and maintaining net-new
    production software applications in an enterprise
    environment
  - Experience with modern git workflows, automated CI/CD
    deployment pipelines, and version control management
  
  This role requires access to U.S. export-controlled
  information. Therefore, employment will be contingent upon
  the ability to prove that you meet the status of a U.S.
  Person as one of the following: U.S. lawful permanent
  resident, U.S. Citizen, have been granted asylee or refugee
  status (i.e., a protected individual under the Immigration
  and Naturalization Act, 8 U.S.C. 1324b(a)(3)).
  
  Additional Information
  
  GE Aerospace offers a great work environment, professional
  development, challenging careers, and competitive
  compensation. GE Aerospace is an Equal Opportunity Employer.
  Employment decisions are made without regard to race, color,
  religion, national or ethnic origin, sex, sexual
  orientation, gender identity or expression, age, disability,
  protected veteran status or other characteristics protected
  by law.
  
  GE Aerospace will only employ those who are legally
  authorized to work in the United States for this opening.
  Any offer of employment is conditioned upon the successful
  completion of a drug screen (as applicable).
  
