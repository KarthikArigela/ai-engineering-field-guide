description: |
  Description
  
  We are a well-funded, early-stage startup hiring our
  Founding Solutions Engineering team to help build and own
  our enterprise customer motion from the ground up. This role
  is perfect for a hands-on, technically curious partner who
  thrives in fast-moving environments, enjoys creating
  structure from scratch, and works closely with founders,
  Product, and R&D to deliver and scale complex, AI-driven
  enterprise solutions.
  
  You will lead the technical side of the customer journey,
  from early discovery and qualification through Proof of
  Value, solution design, stakeholder alignment, and
  deployment support, while helping define how our Solutions
  function evolves as we grow.
  
  Key Responsibilities
  
  Customer Discovery & Process Analysis
  
  - Engage with customers to understand workflows, operational
    processes, and success criteria.
  - Translate findings into clear requirements for AI-powered
    solutions.
  
  Data, AI Models & Workflow Development
  
  - Partner with customers to assess data readiness and gather
    inputs for AI workflows.
  - Configure and integrate AI components into tailored, AI-
    driven workflows.
  - Collaborate with R&D to close data gaps and extend product
    capabilities when needed.
  
  Solution Validation & Proof of Value
  
  - Guide solution refinement and validation to ensure models
    meet performance and business value expectations.
  - Define success metrics and pass criteria with customer
    stakeholders.
  
  Integration, Security & Deployment
  
  - Support integrations with enterprise systems (e.g., Finance,
    ERP, email platforms), ensuring scalability and security.
  - Assist customers through security, compliance, and IT
    approval processes.
  - Plan and support rollout to drive smooth implementation and
    adoption.
  
  Requirements
  
  - 5+ years of experience in Solutions Engineering, Sales
    Engineering, Technical Consulting, or a similar customer-
    facing role.
  - Strong analytical skills with the ability to translate
    business needs into technical solutions.
  - Solid understanding of AI concepts and their enterprise
    applications.
  - High adoption of modern AI tools and workflows.
  - Experience supporting deployments across cloud and.
  - Excellent communication and stakeholder management skills.
  - Demonstrated ability to manage solution delivery across the
    full customer lifecycle.
  
  Nice to Have
  
  - Experience with process mining, workflow mapping, or
    operational analytics.
  - Background in RPA, digital transformation consulting, or
    professional services.
  - Familiarity with enterprise platforms (TMS, ERP, CRM,
    accounting software, email tools).
  - Financial services industry experience.
  
  Compensation
  
  The expected salary for this role is $220,000 to $280,000
  OTE. This is a good-faith estimate but does not include
  equity or other forms of compensation. Pay will be based on
  experience level, but those outside the salary band are
  welcome to apply.
