description: |
  About AudioStack 🦜
  
  AudioStack is revolutionising the way brands and businesses
  create audio content at scale. Our AI-powered platform
  enables the seamless generation and customisation of high-
  quality audio (complete with voiceovers, SFX and music
  beds). We work with leading global brands, agencies, and
  developers, helping them unlock the full potential of audio
  automation.
  
  About the Role
  
  AudioStack is building the next generation of intelligent
  and automated audio creation – a system that uses AI agents
  to orchestrate audio production at scale. We’re looking for
  a Senior Agentic AI Engineer to own the architecture and
  delivery of our agentic capabilities, from designing multi-
  step agent workflows to shipping production-grade
  orchestration pipelines.
  
  You’ll join a small, high-impact backend team in London and
  work closely with product and engineering leadership to
  define how intelligence is embedded into our platform. This
  is a hands-on, high-ownership role: you’ll scope problems
  with the product manager, design solutions, build them, and
  see them through to production – all in a fast-moving
  environment where priorities shift and ambiguity is the
  norm.
  
  What You’ll Be Doing
  
  - Own the end-to-end delivery of agentic systems – from
    scoping with Product to shipping to production.
  - Design and implement multi-agent orchestration systems,
    including agent loops, tool-use patterns, and context
    management strategies.
  - Make key architectural decisions around LLM integration:
    prompt design, caching strategies, cost management, and
    evaluation approaches.
  - Build real-time communication layers (Server-Sent Events,
    WebSockets, HTTP/2 streaming) to power agent-to-frontend
    and agent-to-agent interactions.
  - Contribute to the wider code base roadmap. Our product is
    great because we combine innovative AI and audio solutions
    in a best-in-class software foundation – all our engineers
    work to make the overall product exceptional.
  - Raise the bar of backend engineering quality across the team
    through code review, knowledge sharing, and adoption of
    best practices.
  - Collaborate with engineering and product leadership on
    technical direction, balancing short-term delivery with
    long-term platform health.
  - Own the quality of the systems you build – including
    testing, monitoring, incident response, and iterating
    based on customer and stakeholder feedback.
  
  Requirements
  
  - Strong production experience with Python and a track record
    of shipping backend systems to production end-to-end.
  - Practical, hands-on experience building agentic AI systems.
  - Demonstrated ability to operate in a resource-constrained,
    fast-moving environment with ambiguous objectives and
    shifting priorities.
  - Solid systems and solutions design skills, with the ability
    to scope problems, propose candidate architectures, and
    communicate trade-offs clearly.
  - Experience with real-time communication protocols.
  - Practical experience with cloud infrastructure, CI/CD
    pipelines – enough to bring a solution to production
    without depending on a dedicated infra team.
  - A track record of raising engineering quality in a team –
    through code review, mentoring, or introducing better
    practices.
  
  Desirables
  
  - Hands-on experience going beyond out-of-the-box LLMs and
    prompt engineering such as RAG pipelines or fine-tuning
    LLMs.
  - Familiarity with agentic coding tools (e.g. Claude Code) and
    an understanding of patterns like context saturation
    management and agentic development loops.
  - Background in audio, speech, or media technology.
  
  Benefits
  
  - 💰 Stock Options (subject to performance and time served).
  - 🎛 The opportunity to work in a leading voice & audio AI
    company, with an exceptional tech team with diverse and
    highly recognised backgrounds.
  - 🎹 Be part of a great story: we are making audio scalable for
    the first time in history.
  - ⏱ Hybrid working and Flexible working hours with 2 days in
    the office per week.
  - 🛠 The opportunity to shape a startup culture in a company in
    the fast-growing audio/video space.
  - 🗺 A truly international and diverse team.
  - 🥵 Offices in the hottest startup hubs London, Barcelona, New
    York and San Francisco
  - 🐶 Dog friendly offices (come and meet Swanson and Bernie)!
  
  Why Is Now a Really Exciting Time to Join AudioStack 🚀
  
  AudioStack is the leading Audio-As-A-Service company with a
  very strong technology stack and AI R&D team, featured in
  some of the leading media.
  
  We have a great team and culture and you will be immersive
  in a very international environment and market.
  
  We are still a small team of 40 people expanding rapidly
  internationally. As an early employee you have a lot of room
  to apply and grow your skills fast, build out a team and
  move quickly with your ideas, enjoying a lot of space,
  flexibility and trust.
  
  🚀 Join us now to revolutionise how audio production is
  delivered at scale!
  
  Our Commitment to Diversity 💗
  
  We embrace diversity at AudioStack. To build a product
  that’s loved by everyone, we need a team with all kinds of
  different perspectives, experiences, and backgrounds. That’s
  why we’re committed to hiring people regardless of race,
  religion, colour, national origin, sex, sexual orientation,
  gender identity, age or disability.
