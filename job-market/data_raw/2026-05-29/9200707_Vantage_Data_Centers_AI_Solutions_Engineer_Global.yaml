description: |
  About Vantage Data Centers
  
  Vantage Data Centers powers, cools, protects and connects
  the technology of the world’s well-known hyperscalers, cloud
  providers and large enterprises. Developing and operating
  across North America, EMEA and Asia Pacific, Vantage has
  evolved data center design in innovative ways to deliver
  dramatic gains in reliability, efficiency and sustainability
  in flexible environments that can scale as quickly as the
  market demands.
  
  Information Technology Department
  
  The Information Technology Department architects and
  operates the digital foundation powering Vantage Data
  Centers' global operations while pioneering the intelligent
  transformation of how we work. Our integrated IT/AI
  organization delivers enterprise-grade infrastructure,
  networking, cybersecurity, and end-user services with
  operational excellence, while simultaneously developing
  artificial intelligence capabilities that drive measurable
  business value. We are transforming our service delivery
  model around ITIL best practices, comprehensive automation
  frameworks, and governance structures that enable both
  stability and innovation. Our teams collaborate across
  Infrastructure, Network, Service Desk, IT Engineering, and
  Artificial Intelligence functions, emphasizing service over
  technology and recognizing that success is measured by
  business outcomes rather than technical implementations.
  This is an exceptional time to join as we fundamentally
  reshape how technology serves the organization, creating an
  environment where operational discipline and innovative
  experimentation work as complementary forces.
  
  Artificial Intelligence Team
  
  The Artificial Intelligence Team exists to amplify human
  potential through intelligent technology. We're building an
  AI-powered ecosystem that transforms how Vantage creates
  value, freeing our people from routine work so they can
  focus on innovation and strategic thinking that truly
  differentiates us in the market. Through responsible AI
  implementation across operations, engineering, and business
  functions, we're not just automating processes; we're
  reimagining what's possible when human creativity partners
  with artificial intelligence. Our approach centers on
  measurable business outcomes, ethical governance, and
  creating capabilities that make every team member more
  effective while positioning Vantage at the forefront of the
  intelligent infrastructure revolution.
  
  Position Overview
  
  This position is based remotely in the United States.
  
  The AI Solutions Engineer, Global is a hands-on technical
  builder within Vantage’s Accelerators team, responsible for
  transforming validated business requirements into working AI
  prototypes that demonstrate tangible value within aggressive
  6-week development cycles. This role combines deep expertise
  in AI/ML technologies, Microsoft 365 ecosystem mastery, and
  pragmatic software engineering discipline to deliver
  production-quality code under rapid prototyping constraints.
  The Solutions Engineer operates at the technical frontline
  of innovation, making real-time architectural decisions,
  writing code that balances speed with maintainability, and
  validating hypotheses through working demonstrations rather
  than theoretical designs. Success requires the rare
  combination of technical depth, velocity orientation, and
  business pragmatism, knowing when to leverage existing
  platforms versus custom development, when to optimize versus
  ship, and when technical debt is strategic versus dangerous.
  This is not research engineering focused on algorithmic
  innovation; this role delivers practical solutions using
  proven technologies in novel combinations that solve actual
  business problems for Vantage’s data center operations.
  
  Essential Job Functions
  
  - Design and deliver AI-powered prototypes within 6‑week
    sprint cycles, producing production-quality code that
    demonstrates business value and supports future enterprise
    productization.
  - Build intelligent solutions leveraging the Microsoft 365
    ecosystem, including Azure AI Services, Azure OpenAI,
    Copilot Studio, and Power Platform.
  - Partner with Accelerators and Navigators to translate
    validated opportunities into working solutions, providing
    feedback on feasibility, performance, and implementation
    complexity.
  - Apply SDLC best practices—version control, code reviews,
    automated testing, and CI/CD—within a rapid prototyping
    environment to balance quality and speed.
  - Produce clear technical documentation (code, APIs,
    deployment, and architecture decisions) to enable seamless
    handoff to Development teams.
  - Demonstrate prototypes to stakeholders, translating
    technical capabilities into business value and
    incorporating feedback into iterative improvements.
  - Make pragmatic engineering decisions that balance speed,
    technical debt, and long-term scalability.
  - Develop solutions using Halo and Copilot platforms in
    alignment with enterprise architecture and platform
    standards.
  
  Duties
  
  - Develop AI solutions using Python, TypeScript/JavaScript,
    and modern frameworks, including ML models, agentic
    systems, NLP, and intelligent automation.
  - Integrate Azure AI services such as Azure OpenAI, Azure
    Machine Learning, Cognitive Services, and Document
    Intelligence into enterprise-ready solutions.
  - Build custom Copilots using Copilot Studio to support
    conversational AI, workflow automation, and decision
    support within Microsoft 365.
  - Design data pipelines and ETL processes to prepare
    enterprise data for AI use, ensuring data quality,
    privacy, and performance.
  - Implement APIs, webhooks, and integrations connecting AI
    solutions with enterprise platforms (Microsoft 365,
    SharePoint, Power Platform, Salesforce, and operational
    systems).
  - Rapidly evaluate and experiment with emerging AI
    technologies, focusing on solutions suitable for
    production environments.
  - Participate in code reviews, pair programming, and knowledge
    sharing to ensure prototype quality and team capability
    growth.
  - Embed security, privacy, and governance controls from the
    outset, meeting enterprise compliance standards.
  - Create automated tests and validation checks to verify
    solution accuracy, reliability, and readiness for
    demonstrations.
  - Troubleshoot and resolve complex technical and integration
    issues while documenting learnings.
  - Package prototypes with deployment scripts, configuration
    documentation, and user guides for stakeholder
    demonstrations.
  - Support handoff to Development teams through architecture
    walkthroughs, documentation, and knowledge transfer.
  - Stay current on Microsoft AI platform updates and industry
    best practices, applying relevant innovations to
    prototyping efforts.
  - Handle additional duties as assigned by Management.
  
  Job Requirements
  
  - Bachelor’s degree in Computer Science, Software Engineering,
    or related field; advanced degree or relevant AI/ML
    certifications preferred.
  - Strong hands-on experience building AI/ML solutions using
    modern frameworks (e.g., LangChain, Semantic Kernel, or
    similar agentic platforms).
  - Proficiency in Python and TypeScript/JavaScript, with a
    track record of writing clean, maintainable, well-
    documented code.
  - Deep experience with Microsoft Azure, including Azure
    OpenAI, Azure AI Services, Azure Functions, Logic Apps,
    and Power Platform.
  - Experience developing within the Microsoft Copilot ecosystem
    (Copilot Studio, Microsoft Graph, Teams, SharePoint).
  - Solid understanding of machine learning, NLP, retrieval-
    augmented generation, prompt engineering, and agentic
    system design.
  - Experience with modern development practices including Git,
    CI/CD pipelines, containerization, infrastructure as code,
    and cloud-native architectures.
  - Strong API and integration experience, including REST
    services, OAuth/authentication, and enterprise system
    connectivity.
  - Proven ability to deliver high-quality software under tight
    timelines while balancing speed and technical rigor.
  - Familiarity with data center operations, construction
    workflows, or infrastructure delivery is a plus.
  - Knowledge of security, data privacy, and enterprise
    compliance standards.
  - Strong problem-solving and debugging skills, particularly in
    complex, integrated environments.
  - Excellent communication skills, with the ability to explain
    technical concepts to non-technical stakeholders.
  - Self-directed, adaptable, and comfortable working in fast-
    paced, minimally supervised environments.
  - Demonstrated growth mindset with enthusiasm for learning,
    experimentation, and knowledge sharing.
  - Travel required is expected to be up to 5% but may increase
    over time as the business evolves.
  
  Physical Demands and Special Requirements
  
  The physical demands described here are representative of
  those that must be met by an employee to successfully
  perform the essential functions of this job. Reasonable
  accommodations may be made to enable individuals with
  disabilities to perform the essential functions.
  
  While performing the duties of this job, the employee is
  occasionally required to stand; walk; sit; use hands to
  handle, or feel objects; reach with hands and arms; climb
  stairs; balance; stoop or kneel; talk and hear. The employee
  must occasionally lift and/or move up to 25 pounds.
  
  Additional Details
  
  - Salary Range: $130,000-135,000 Base + Bonus (this range is
    based on Colorado market data and may vary in other
    locations)
  - This position is eligible for company benefits including but
    not limited to medical, dental, and vision coverage, life
    and AD&D, short and long-term disability coverage, paid
    time off, employee assistance, participation in a 401k
    program that includes company match, and many other
    additional voluntary benefits.
  - Compensation for the role will depend on a number of
    factors, including your qualifications, skills,
    competencies, and experience and may fall outside of the
    range shown.
  
  #LI-Remote #LI-CD1
  
  We operate with No Ego and No Arrogance. We work to build
  each other up and support one another, appreciating each
  other’s strengths and respecting each other’s weaknesses. We
  find joy in our work and each other, actively seeking
  opportunities to inject fun into what we do. Our hard and
  efficient work is rewarded with an above market total
  compensation package. We offer a comprehensive suite of
  health and welfare, retirement, and paid leave benefits
  exceeding local expectations.
  
  Throughout the year, the advantage of being part of the
  Vantage team is evident with an array of benefits,
  recognition, training and development, and the knowledge
  that your contribution adds value to the company and our
  community.
  
  Don't meet all the requirements? Please still apply if you
  think you are the right person for the position. We are
  always keen to speak to people who connect with our mission
  and values.
  
  Vantage Data Centers is an Equal Opportunity Employer
  
