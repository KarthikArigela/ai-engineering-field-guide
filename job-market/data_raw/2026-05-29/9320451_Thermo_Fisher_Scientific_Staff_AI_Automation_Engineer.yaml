  Job Description
  
  As part of the Thermo Fisher Scientific team, you’ll
  discover meaningful work that makes a positive impact on a
  global scale. Join our colleagues in bringing our Mission to
  life every single day to enable our customers to make the
  world healthier, cleaner and safer. We provide our global
  teams with the resources needed to achieve individual career
  goals while helping to take science a step beyond by
  developing solutions for some of the world’s toughest
  challenges, like protecting the environment, making sure our
  food is safe or helping find cures for cancer.
  
  Description
  
  We are seeking a highly skilled Staff AI & Automation
  Engineer to design, build, and scale enterprise AI/ML,
  Generative AI, and automation solutions. This role will
  focus on delivering intelligent, scalable systems that drive
  business value through advanced analytics, automation, and
  innovation.
  
  Experience Required
  
  - 9+ years of overall experience in Data, AI, and Automation
    domains
  - 4+ years of experience in AI/ML implementation
  - 2+ years of hands-on experience in automation implementation
  - Proven experience delivering at least 2–3 end-to-end AI/ML
    and/or Automation initiatives independently
  
  Key Responsibilities
  
  - Design and implement advanced AI/ML and Generative AI
    solutions for enterprise use cases
  - Lead end-to-end AI/ML solution development from ideation
    through deployment and scaling
  - Design and implement Retrieval-Augmented Generation (RAG)
    solutions including ingestion, embeddings, retrieval, and
    response generation
  - Identify and implement automation opportunities using RPA
    and workflow automation tools
  - Develop automation solutions using tools such as UiPath,
    Automation Anywhere, Blue Prism, and Power Automate
  - Integrate AI and automation solutions with enterprise
    applications, APIs, and data platforms
  - Collaborate with stakeholders to understand business
    requirements and translate them into scalable technical
    solutions
  - Ensure scalability, performance, and reliability of AI and
    automation systems
  - Drive innovation through adoption of emerging technologies
    including IoT and digital twins
  
  Required Skills & Qualifications
  
  - Strong expertise in AI/ML and Generative AI concepts and
    implementations
  - Hands-on experience with RAG architectures and LLM-based
    solutions
  - Experience with automation/RPA tools (UiPath, Automation
    Anywhere, Blue Prism, Power Automate)
  - Cloud-native architecture experience on AWS and/or Azure
  - Experience with Kubernetes (EKS/AKS) and CI/CD tools (GitHub
    Actions, Azure DevOps, Jenkins)
  - Strong understanding of modern data architectures
    (Lakehouse, streaming, data governance)
  - Experience in defining security, access control, and
    compliance frameworks
  - Strong problem-solving, analytical, and stakeholder
    communication skills
  - Ability to work independently with business stakeholders
  
  Preferred Qualifications
  
  - Experience with Databricks, Dataiku, or vector databases
  - Knowledge of data platform engineering including Databricks
    Lakehouse, S3 or equivalent storage, and scalable
    pipelines
  - Exposure to IoT and digital twin technologies
  - Certifications in AI, Automation, and/or Cloud (AWS/Azure)
  - Experience in GxP or Quality processes
  - Familiarity with Agile and Scrum methodologies
  
  Key Competencies
  
  - Strong technical depth in AI and automation
  - Innovation and continuous learning mindset
  - Ability to drive outcomes independently
  - Strong collaboration across cross-functional teams
  
  Education
  
  - Bachelor’s or Master’s degree in Computer Science,
    Engineering, Data Science, or related field
  
  Why Join Us
  
  - Opportunity to work on cutting-edge AI and automation
    initiatives
  - Build enterprise-scale intelligent solutions
  - Collaborative and innovation-driven environment
  - Strong career growth opportunities
