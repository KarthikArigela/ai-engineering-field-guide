description: |
  Sr Director, Software Engineer - Card Tech AI We are seeking
  a Senior Director of Software Engineering to join our team
  and fundamentally redefine the speed and quality of software
  development. We are a high-velocity, mission-driven group
  obsessed with bridging the gap between Intent and Execution
  (I=E). In this role, you won't just manage; you will operate
  as a "Player-Coach," functioning both as a high-leverage
  developer who ships production-ready code in hours as well
  as mentoring a team to become elite AI-native builders. You
  will own the technical benchmark, leveraging agentic
  development tools to its absolute limits through rigorous,
  spec-driven design to solve complex problems with
  unprecedented urgency. This leader must have the ability to
  attract top-tier talent and the technical "whisperer" skills
  to ensure AI-generated output is flawless, secure, and
  scalable. Success requires an innovative mind, a proven
  track record of delivering next-generation products, and a
  passion for AI-native execution. You are a master of
  technical specifications who can translate complex
  architectures into simple, actionable reality. If you are a
  high-agency leader ready to define the 100x engineer era and
  make a massive, visible impact on our company trajectory,
  this is your team. Our Sr. Directors Are:
  
  - Technologists: Strong engineering and technology background
    with the ability to learn quickly and go deep into our
    product and engineering solutions - will have a DevOps
    mindset
  - Effective Communicators: Excellent listener; proven
    collaborator with senior leaders, peers and staff
  - Partnership Attitude: Have the competencies to build very
    strong partnerships with other technology leaders that
    enable your team's ability to stay on the leading edge of
    industry solutions
  - Curious: Hands-on, "roll up your sleeves" collaborative
    style of working
  - Passionate: Bring energy and enthusiasm to the job and
    organization
  - Bold: History of taking smart, calculated risks and
    aggressively leading through change
  - Achievers: Consistently attain/exceed individual and team
    goals
  
   You Will:
  
  - Lead, mentor, and grow a high-velocity team of engineers,
    fostering a culture of AI adoption and rapid execution
  - Embrace and incubate AI-native workflows, leveraging Claude
    and LLMs to fundamentally change the math on development
    speed
  - Operate as a "Player-Coach," remaining deeply hands-on to
    ship production-ready code and solve complex technical
    problems
  - Collaborate with product teams to transform intent into
    functional reality using rigorous, spec-driven design
  - Partner with stakeholders to explain AI-generated
    architectures, ensuring the final product matches initial
    intent flawlessly
  - Work within Agile cycles to design, audit, and support
    technical solutions, serving as the ultimate fail-safe for
    AI output
  - Lead efforts to bridge I=E (Intent = Execution),
    guaranteeing high-leverage output without technical debt
    or hallucinations
  - Conduct design and code reviews to ensure AI-generated code
    meets world-class standards for quality and integrity
  
   Basic Qualifications:
  
  - Bachelor's Degree
  - At least 9 years of experience in software engineering or
    data engineering
  - At least 7 years of people management experience
  - At least 3 years of experience with cloud-based data
    platforms (Amazon Web Services, Microsoft Azure, Google
    Cloud Platform)
  
   Preferred Qualifications:
  
  - Master's Degree
  - 10+ years of experience in software engineering or data
    engineering
  - 2+ years of experience with LLM coding assistance tools such
    as Claude, Windsurf, Copilot or comparable tools
  - 3+ years of experience with AWS
  
   Capital One will consider sponsoring a new qualified
  applicant for employment authorization for this position.
