description: |
  Why Technology at loveholidays?
  
  At loveholidays - we trailblaze together. We’re on a mission
  to open the world to everyone, giving our customers’
  unlimited choice, unmatched ease and unmissable value for
  their next getaway. Our team is the driving force behind our
  role as our customers’ personal holiday expert - the smart
  way to get away.
  
  Technology at loveholidays underpins our vision to become
  the global leader in packaged holidays. We drive cutting-
  edge innovation and technical excellence to futureproof the
  business. Our systems process trillions of daily holiday
  offers, we deploy over a thousand times a month, serving
  thousands of requests per second. This is where you can
  accelerate your growth by solving complex challenges and
  broadening your skillset.
  
  Join us to create impact for our future in an exciting new
  chapter, owning your success and contributing to shared
  goals. We actively talk about technology and adhere to our
  key technology principles that have guided us this far. We
  are growing and have ambitious plans to expand across
  Europe, employing the best minds and technology to let us do
  this.
  
  About the team:
  
  You will be joining our growing Conversational AI team,
  which sits at the heart of our ambition to deliver
  intelligent, seamless customer experiences at scale. The
  team builds and maintains the AI-powered agents and tooling
  that power interactions across our contact centre and
  digital channels – increasingly leveraging agentic
  architectures, large language models and the latest Google
  Cloud AI capabilities. This is a collaborative, fast-moving
  team where curiosity and a willingness to learn are valued
  as highly as technical skill.
  
  The impact you’ll have:
  
  Reporting to the Lead Conversational AI Engineer, you will
  play an important part in building and maintaining the
  conversational AI systems that help our customers find and
  manage their perfect getaway. As a level 1 engineer, you
  will be supported to develop your skills and grow your
  confidence, contributing to real solutions from day one
  whilst building a strong foundation in modern agentic AI
  technologies and engineering best practices.
  
  Your day-to-day:
  
  - Build and maintain conversational AI agents using Google
    Dialogflow CX and Vertex AI Agent Builder, contributing to
    flows, fulfilment logic and agent configurations.
  - Support the development of agentic workflows – learning how
    to design multi-step, tool-using agents that can reason
    and act across systems to resolve customer queries.
  - Work with the Google Agent Development Kit (ADK) to assist
    in building, testing and iterating on agent capabilities
    under the guidance of more senior engineers.
  - Analyse conversational data and real customer interaction
    patterns to understand how users engage with our agents,
    surfacing insights that inform improvements to the
    customer experience.
  - Contribute to the testing and quality assurance of
    conversational flows and agentic pipelines, identifying
    and resolving errors or unexpected behaviour.
  - Assist in the analysis of conversational data and
    performance metrics to support continuous improvement of
    the user experience.
  - Collaborate with Conversation Designers, product managers
    and engineers to ensure technical implementations match
    the intended design and business goals.
  - Participate in team ceremonies including stand-ups,
    retrospectives and planning sessions, communicating your
    progress and raising blockers clearly.
  - Stay curious about developments in agentic AI, LLMs and the
    broader conversational AI landscape, sharing learnings
    with the team through show and tells or internal channels.
  
  Your skillset:
  
  We’re looking for someone who brings enthusiasm, a genuine
  interest in conversational and agentic AI technology, and
  the willingness to grow. You don’t need to have all the
  answers but you should be eager to find them.
  
  - Conversational AI Core: Foundational understanding of
    conversational AI concepts - virtual agents (intents,
    entities, dialogue management, fulfillment) through to
    LLM-driven agentic approaches.
  - Platform Exposure: Experience building virtual agents on
    conversational platforms (e.g., Google Dialogflow CX,
    Vertex AI Agent Builder, Amazon Lex, Rasa).
  - Software Engineering: Strong programming proficiency in
    Python or TypeScript or other programming language, backed
    by solid software engineering and infrastructure
    development practices.
  - Advanced LLM Orchestration: Experience designing LLM
    applications beyond basic APIs, including retrieval-
    augmented generation (RAG) pipelines, orchestration logic,
    and tool/agent workflows.
  - API Integration: Strong awareness of REST APIs and webhooks
    to effectively connect AI agents with backend systems and
    external tools.
  
  Cloud & DevOps: Familiarity with cloud deployment
  environments (preferably Google Cloud Platform) and CI/CD
  practices for AI workflows.
  
  Desirable:
  
  - Experience with the Google Agent Development Kit (ADK),
    LangChain, or similar multi-agent orchestration
    frameworks.
  - Practical familiarity with vector databases, hybrid search
    techniques, and advanced chunking strategies for
    optimizing RAG systems.
  - Knowledge of or previous experience within the travel sector
    or fast-paced B2C e-commerce environments.
  - Familiarity with version control tools (Git) and working
    effectively within an agile team environment.
  
  The interview journey:
  
  - TA screening - 30 mins
  - 1st stage video interview with Lead Conversational AI
    Engineer - 1 hour
  - Take-home engineering task
  - Final stage with Director of Business IT & AI Operations and
    senior stakeholders - 1 hour
  
  Perks of joining us:
  
  - Company pension contributions at 5%.
  - Individualised training budget for you to learn on the job
    and level yourself up.
  - Discounted holidays for you, your family and friends.
  - 25 days of holidays per annum (plus 8 public holidays)
    increases by 1 day for every second year of service, up to
    a maximum 30 days per annum.
  - Ability to buy and sell annual leave.
  - Cycle to work scheme, season ticket loan and eye care
    vouchers.
  
  At loveholidays, we focus on developing an inclusive culture
  and environment that encourages personal growth and
  collective success. Each individual offers unique
  perspectives and ideas that increase the diversity and
  effectiveness of our teams. And we value the insight and
  potential you could bring on our continued journey.
