description: |
  Conversational AI Developer / Chatbot Developer- Microsoft
  Foundry  Job ID#: 26-2249 Location: Hyderabad, India Who We
  Are: Since our inception back in 2006, Navitas has grown to
  be an industry leader in the digital transformation space,
  and we’ve served as trusted advisors supporting our client
  base within the commercial, federal, and state and local
  markets. What We Do: At our very core, we’re a group of
  problem solvers providing our award-winning technology
  solutions to drive digital acceleration for our customers!
  With proven solutions, award-winning technologies, and a
  team of expert problem solvers, Navitas has consistently
  empowered customers to use technology as a competitive
  advantage and deliver cutting-edge transformative solutions.
  What we Need: We are seeking a skilled Conversational AI
  Developer to design, build, and optimize intelligent chatbot
  and virtual assistant solutions. In this role you will
  bridge the gap between cutting-edge large language model
  (LLM) capabilities and real-world business applications,
  delivering seamless, human-like interactions across multiple
  platforms and channels.
  
  Key Responsibilities Design & Development
  
  - Architect and develop conversational AI solutions using
    frameworks such as Lang Chain, Rasa, Dialog flow, Amazon
    Lex, or Azure Bot Services.
  - Design and implement multi-turn dialogue flows, context
    management, and state tracking for complex conversational
    scenarios.
  - Integrate large language models (GPT-4, Claude, Llama,
    Gemini) via APIs and fine-tune prompt engineering
    strategies for optimal performance.
  - Build, test, and deploy chatbots across channels including
    web, mobile, Slack, Microsoft Teams, WhatsApp, and voice
    platforms.
  
  AI/NLP Engineering
  
  - Develop and maintain intent classification, entity
    recognition (NER), and dialogue management pipelines.
  - Apply RAG (Retrieval-Augmented Generation) patterns and
    vector database integrations (Pinecone, Weaviate, Chroma
    DB) to ground LLM responses in enterprise knowledge.
  - Implement guardrails, content moderation, and safety layers
    to ensure compliant and on-brand AI responses.
  - Continuously evaluate and improve model accuracy, latency,
    hallucination rates, and user satisfaction metrics.
  - Integration & Deployment
  - Integrate chatbot solutions with enterprise systems
    including CRMs, ERPs, ticketing platforms, and internal
    knowledge bases via RESTful APIs and webhooks.
  - Deploy and manage chatbot infrastructure on cloud platforms
    (AWS, Azure, GCP) using containerization
    (Docker/Kubernetes).
  - Implement CI/CD pipelines for automated testing and
    deployment of conversational AI updates.
  - Analytics & Optimization
  - Monitor and analyze conversation logs, session metrics,
    fallback rates, and user feedback to drive iterative
    improvements.
  - Collaborate with UX and product teams to design intuitive
    conversational experiences aligned with user needs.
  - Produce clear technical documentation, runbooks, and
    training materials for stakeholders.
  
    Required Qualifications Education & Experience
  
  - Bachelor’s degree in Computer Science, Artificial
    Intelligence, Linguistics, or a related field; master’s
    preferred.
  - 3+ years of experience developing and deploying production-
    grade chatbot or conversational AI solutions.
  - Demonstrable portfolio of conversational AI projects with
    measurable business outcomes.
  
     Technical Skills
  
  - Proficiency in Python; experience with JavaScript/Node.js a
    plus.
  - Hands-on experience with NLP libraries: spaCy, Hugging Face
    Transformers, NLTK, or similar.
  - Expertise in at least one conversational AI platform: Dialog
    flow CX, Rasa Pro, Amazon Lex, or Azure Bot Framework.
  - Hands-on experience with Microsoft Azure AI Foundry
    (formerly Azure AI Studio) includes model deployment,
    prompt flow authoring, and AI hub project management.
  - Experience with LLM orchestration frameworks: Lang Chain,
    Llama Index, Semantic Kernel.
  - Familiarity with vector databases and embedding models for
    semantic search and RAG architectures.
  - Working knowledge of cloud services (AWS Lambda, Azure
    Functions, GCP Cloud Run) and containerization.
  
    Preferred Qualifications
  
  - Experience with voice AI platforms (Amazon Alexa, Google
    Assistant, Nuance, or Twilio Voice).
  - Microsoft Certified: Azure AI Engineer Associate or
    equivalent Azure AI Foundry certification.
  - Knowledge of RLHF (Reinforcement Learning from Human
    Feedback) and model fine-tuning techniques.
  - Familiarity with observability tools: Lang Smith, Weights &
    Biases, or Arize AI.
  - Understanding of GDPR, CCPA, and AI ethics frameworks
    applicable to conversational systems.
  
    Core Competencies
  
  - Strong problem-solving and systems-thinking skills with
    attention to edge cases.
  - Excellent communication skills to translate AI concepts for
    non-technical stakeholders.
  - Collaborative mindset with ability to work cross-
    functionally with product, design, and data teams.
  - Self-motivated learner who stays current with the rapidly
    evolving AI landscape.
