description: |
  About Life360
  
  Life360’s mission is to keep people close to the ones they
  love. Our category-leading mobile app, Tile tracking
  devices, and Pet GPS tracker empower members to protect the
  people, pets, and things they care about most with a range
  of services, including location sharing, safe driver
  reports, and crash detection with emergency dispatch.
  Life360 serves approximately 97.8 million monthly active
  users (MAU), as of March 31, 2026, across more than 180
  countries.
  
  Life360 delivers peace of mind and enhances everyday family
  life with seamless coordination for all the moments that
  matter, big and small. By continuing to innovate and deliver
  for our customers, we have become a household name and the
  must-have mobile-based membership for families (and those
  friends who are basically family).
  
  Life360 has more than 500 (and growing!) remote-first
  employees. For more information, please visit life360.com.
  
  Life360 is a Remote First company, which means a remote work
  environment will be the primary experience for all
  employees. All positions, unless otherwise specified, can be
  performed remotely (within the US and Canada) regardless of
  any specified location above.
  
  We are AI Native
  
  We are building an AI native company where AI is an integral
  part of how we build and operate. AI tool usage during
  interviews varies by role. You may be asked to demonstrate
  proficiency with AI tools, discuss how you leverage AI, or
  complete interview exercises without AI assistance. Your
  Recruiter will provide clear guidance as you move through
  the interview process.
  
  Undisclosed use of AI not previously discussed with or
  approved by your Recruiter may impact your candidacy.
  
  About The Team
  
  Platform Foundations is part of Life360's Developer
  Experience Group (DevX) — the AI platform layer powering how
  engineers build, test, and ship at Life360. We own the
  foundational infrastructure that makes the entire
  development lifecycle faster, safer, and more intelligent.
  We're a small team with outsized impact, building the
  systems other engineers depend on every day — and we're
  doing it with an AI-native mindset from the ground up.
  
  We're building the systems, platforms, and intelligence that
  power the entire software delivery lifecycle. Our work spans
  continuous testing infrastructure, self-healing test
  systems, AI-native developer tooling, agentic quality
  automation, and the observability pipelines that keep
  Life360's engineering engine running at scale. We partner
  closely with Mobile, Backend, and Release Engineering teams
  — and our output directly shapes the speed, confidence, and
  quality with which Life360 ships to millions of families
  around the world.
  
  We move fast, think in systems, and care deeply about craft.
  You'll have high autonomy, real ownership, and the
  opportunity to define what AI-native engineering
  infrastructure looks like — not just at Life360, but as a
  model for the industry.
  
  About the Job
  
  This role is not about writing software. It is about
  producing software — at a level of quality, speed, and scope
  that would previously have required a much larger team.
  
  Our group is the AI platform layer that powers how engineers
  build, test, and ship across Life360's mobile and cloud
  products. Platform Foundations — the team you'd be joining —
  owns the foundational infrastructure that makes the entire
  development lifecycle faster, safer, and more intelligent.
  
  We're looking for a Mobile Engineer who has strong iOS
  and/or Android engineering roots, but whose center of
  gravity has shifted: you think in systems, you direct AI to
  produce outcomes, and you're energized by the idea of
  rebuilding how mobile software gets made, tested, and
  validated — from the ground up.
  
  This role sits at the intersection of mobile engineering,
  platform infrastructure, and applied AI. You'll help us move
  Life360 toward a fully AI-native product development
  lifecycle (PDLC) — one where continuous testing, self-
  healing systems, and agentic workflows are the default, not
  the exception.
  
  For candidates based in the US, the salary range for this
  position is $148,000 to $216,000 USD. For candidates based
  out of Canada, the salary range for this position is 171,500
  to 201,000 CAD. Note: Please be aware that the job title for
  positions in Canada will be "Developer" in lieu of
  "Engineer." We take into consideration an individual's
  background and experience in determining final salary-
  therefore, base pay offered may vary considerably depending
  on geographic location, job-related knowledge, skills, and
  experience. The compensation package includes a wide range
  of medical, dental, vision, financial, and other benefits,
  as well as equity.
  
  AI-Native Expectations
  
  We use AI coding tools as a professional standard on this
  team. Here's what that means in practice:
  
  - Daily use: You use AI coding assistants (we support Claude
    Code, Cursor, and GitHub Copilot) for real, substantive
    tasks: analysis, coding, refactoring, testing, navigating
    codebases, and documentation. Not just research or
    autocomplete.
  - Judgment and ownership: AI-generated code gets the same
    review you'd give any PR. You are accountable for
    everything you ship.
  - Velocity: We expect senior engineers who use AI well to
    operate with meaningful leverage — doing more with the
    same time, taking on problems that would otherwise require
    a larger team.
  - Team leadership: You share what works. You automate
    prompting strategies that others can build on and help
    teammates earlier in their AI workflow adoption get up to
    speed.
  - Continuous learning: The tooling is changing fast. You stay
    current and bring recommendations to the team when
    something would meaningfully improve how we work.
  
  What You’ll Do
  
  - Design and build platform-level test infrastructure for iOS
    and Android that runs continuously, scales automatically,
    and surfaces signals without human intervention.
  - Apply AI-driven failure classification to reduce noise,
    prioritize signal, and cut time-to-fix on test failures
    across mobile suites.
  - Partner with the AI Native platform team to ship net-new
    skills that replace categories of manual engineering work.
  - Build and maintain in-app instrumentation for mobile
    performance, quality signal, and test execution telemetry.
  - Design data pipelines that feed quality signals into
    dashboards, alert systems, and AI analysis layers,
    providing the org with real-time visibility into test
    health and app quality.
  - Own the infrastructure used to baseline, monitor, and debug
    mobile API behavior in CI.
  - Partner with Mobile, Backend, and Release Engineering teams
    to embed AI-native quality practices throughout the
    development lifecycle — from intent to production.
  - Contribute to the design and rollout of agentic quality
    automation: systems that act on quality signals rather
    than just report them.
  - Raise the pod’s AI-native capability — documenting what
    works, improving shared workflows, and helping others
    develop the judgment to direct AI effectively
  
  What We’re Looking For
  
  - A track record of delivering complex, production-grade
    software outcomes.
  - Genuine fluency directing AI agents: you decompose,
    delegate, and validate at a level that produces better
    output than most engineers produce writing manually
  - Comfort working across the stack — mobile instrumentation,
    backend pipelines, CI/CD systems, and developer tooling —
    without needing to stay in one lane or waiting for someone
    else to own a layer. AI closes the skill gaps; you provide
    the judgment
  - The ability to make good decisions quickly under ambiguity,
    and to distinguish reversible decisions (ship it) from
    irreversible ones (slow down)
  - Judgment on AI-generated artifacts — you know what good
    looks like, catch what is locally correct but globally
    brittle, and hold a consistent quality bar regardless of
    how code was produced
  - The ability to frame problems with precision — your prompts,
    specs, and plans are clear enough that AI can act on them
    without constant correction
  - Experience with MCP (Model Context Protocol), LLM tool use,
    or agent orchestration frameworks (LangChain, LangGraph,
    AWS Bedrock Agents, etc.).
  - Clear, direct communication with engineers, product teams,
    and stakeholders across the org
  - Bachelor’s degree or equivalent
  
  Our Benefits
  
  - Competitive pay and benefits.
  - Medical, dental, vision, life and disability insurance plans
    (100% paid for US employees). We offer supplemental plans
    for medical and dental for Canadian employees.
  - 401(k) plan with company matching program in the US and RRSP
    with DPSP plan for Canadian employees.
  - Employee Assistance Program (EAP) for mental wellness.
  - Flexible PTO and 12 company wide days off throughout the
    year.
  - Learning & Development programs.
  - Equipment, tools, and reimbursement support for a productive
    remote environment.
  - Free Life360 Platinum Membership for your preferred circle.
  
  Life360 Values
  
  Our company’s mission driven culture is guided by our shared
  values to create a trusted work environment where you can
  bring your authentic self to work and make a positive
  difference
  
  - Be a Good Person - We have a team of high integrity people
    you can trust.
  - Be Direct With Respect - We communicate directly, even when
    it’s hard.
  - Members Before Metrics - We focus on building an exceptional
    experience for families.
  - High Intensity High Impact - We do whatever it takes to get
    the job done.
  
  Our Commitment to Diversity
  
  We believe that different ideas, perspectives and
  backgrounds create a stronger and more creative work
  environment that delivers better results. Together, we
  continue to build an inclusive culture that encourages,
  supports, and celebrates the diverse voices of our
  employees. It fuels our innovation and connects us closer to
  our customers and the communities we serve. We strive to
  create a workplace that reflects the communities we serve
  and where everyone feels empowered to bring their authentic
  best selves to work.
  
  We are an equal opportunity employer and value diversity at
  Life360. We do not discriminate on the basis of race,
  religion, color, national origin, gender, sexual
  orientation, age, marital status, veteran status, disability
  status or any legally protected status.
  
  We encourage people of all backgrounds to apply. We believe
  that a diversity of perspectives and experiences create a
  foundation for the best ideas. Come join us in building
  something meaningful. Even if you don’t meet 100% of the
  below qualifications, you should still seriously consider
  applying!
  
