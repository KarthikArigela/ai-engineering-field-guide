description: |
  Position Summary
  
  This Software Engineer is a mid-level engineering role
  responsible for designing, developing, testing, and
  maintaining software solutions that support the company’s
  products and platform capabilities. This role works closely
  with senior engineers, product managers, QA, and DevOps
  teams to deliver scalable, reliable, and maintainable
  software in a modern cloud-based engineering environment.
  
  What You'll Do
  
  · Own implementation and delivery of product features and
  services
  
  · Collaborate on technical design and architecture
  discussions
  
  · Develop backend and frontend functionality using modern
  engineering practices
  
  · Contribute to CI/CD pipelines, testing, monitoring, and
  operational reliability
  
  · Grow technical expertise through mentorship and cross-
  functional collaboration
  
  Required Qualifications
  
  · 3+ years of professional software engineering experience
  
  · Strong proficiency in backend engineering using C#/.NET
  and APIs, with familiarity in modern frontend technologies.
  
  · Familiarity with Docker, CI/CD pipelines, and cloud
  platforms (Azure, AWS)
  
  · Experience with AI development tools and methodologies
  
  · Strong communication and problem-solving skills
  
  Why This Role Is Interesting
  
  We value engineers who enjoy building, improving, and
  simplifying systems. This role provides the opportunity to
  work across product, platform, and engineering initiatives
  that directly influence customer experience and business
  outcomes.
  
  What Success Looks Like
  
  Success in this role is measured through technical
  contribution, collaboration, engineering quality,
  operational reliability, and the ability to positively
  influence team effectiveness and software delivery outcomes.
