  Job Details
  
  Lead AI Engineer
  
  Location: Pune (Hybrid)
  
  Role Purpose Design and deliver AI/ML and Generative AI
  solutions that enhance client intelligence, automation, and
  decision-making across Private Banking platforms, leveraging
  data sourced from core banking systems (e.g. Avaloq), CRM,
  and digital channels.
  
  Key Responsibilities
  
  - Develop and deploy AI/ML and GenAI models (e.g. NLP,
    summarization, recommendation engines)
  - Build scalable data pipelines and feature engineering
    workflows using structured and unstructured data
  - Integrate AI capabilities into enterprise platforms via APIs
    and microservices.
  - Work with data originating from core banking platforms (e.g.
    Avaloq) including client, portfolio, and transaction data.
  - Enable AI-driven use cases such as client insights, next-
    best-action, and automation of RM workflows.
  - Implement model monitoring, governance, and performance
    optimization aligned to enterprise standards.
  - Collaborate with engineering and business teams to translate
    wealth use cases into scalable solutions.
  - Experience working with wealth management data (clients,
    portfolios, transactions)
  - Understanding of data flows from core banking systems such
    as Avaloq
  - Awareness of AI governance, model risk, and regulatory
    considerations in banking
  
  Skills & Experience
  
  Primary:
  
  - Python (mandatory) • ML/DL frameworks (TensorFlow, PyTorch,
    Scikit-learn) • GenAI / LLM frameworks (LangChain, OpenAI,
    etc.) • AWS (S3, Lambda, SageMaker, Bedrock)
  
  Secondary: • Data engineering (ETL pipelines, feature
  stores) • API development • Vector databases / embeddings
