description: |
  Who we are:
  
  We are a rapidly growing pan-European digital wealth
  manager, serving over 167,000 active investors with more
  than £5.5 billion invested on our platform. We began in
  Milan in 2011 with the purpose to help more people improve
  their financial well-being by making personal investing
  simple and accessible through technology. Fast forward to
  today, and we are recognised as one of the most innovative
  fintechs, headquartered in the heart of London.
  
  With a team of 220+ people across 4 offices in Italy and the
  UK, we are proudly backed and funded by major partners
  including Poste Italiane, Cabot Square Capital, United
  Ventures, and Allianz.
  
  Our vision
  
  Our vision is to combine passion, expertise, and technology
  to provide best-in-class investment solutions and advice
  that protects and grows client wealth over time.
  
  Our Core Values:
  
  We’ve built our business on three Principles:
  
  - Relationships are our first asset: We’re one team, built on
    trust, honesty, and transparency. We value our
    relationships above all else.
  - Trust drives success: We give each other the space to grow.
    We empower our employees to succeed, so they can make a
    real impact.
  - Our customers dream big, just like us: We see the bigger
    picture and we make sure our customers see it, too. We’re
    always focused on the best outcomes for our clients and
    for each other, no matter what the goal, or how big the
    dream
  
  What this means in practice:
  
  At Moneyfarm, our success comes from the impact each of us
  makes. We move with purpose, urgency, and ambition, focused
  on delivering outcomes that matter for our clients and our
  business. Everyone is empowered to take ownership, challenge
  the status quo, and turn bold ideas into results. As we
  evolve, we embrace AI as a catalyst for sharper thinking,
  smarter decisions, and even greater impact.
  
  Our diversity makes this possible. Different perspectives,
  backgrounds, and experiences fuel our creativity and drive
  better decisions — it’s our competitive edge. We value
  people for who they are and their unique strengths: that's
  why we offer flexible ways of working to support them in
  doing their best work.
  
  Candidates who belong to 'Categoria protetta' (Legge 68/99)
  are more than welcome!
  
  The role in one line
  
  Design, build, and operate the shared AI/LLM platform — and
  the central backend services that sit behind it — so
  Moneyfarm's product teams can ship AI-powered features
  across investing, pensions, and share dealing, from guidance
  today toward fully personalised, regulated advice.
  
  How the team works
  
  The AI team is small (five people) and tightly coupled.
  You'll work alongside the AI Stream Lead as the senior
  engineering counterpart on the team. The Stream Lead owns
  prioritisation, cross-team strategy, capacity allocation,
  and final buy-vs-build calls. You own how the AI stack is
  actually built and operated, and you're the technical voice
  in those strategic decisions. Many things will be co-decided
  in practice — strategy and engineering are tightly coupled
  here, and we want it that way.
  
  This is a hands-on role. As well as designing the platform,
  you'll write the central backend services that power our AI
  projects — APIs, data access layers, integration points
  between LLMs and our internal systems. We're not hiring an
  architect who delegates the build.
  
  Three embedded engineers ship AI features inside the product
  teams (we call them "bubbles" and include tech, product,
  marketing and all other functions required to run that
  vertical). You set the technical standards they work to and
  review their work; the Stream Lead allocates their capacity.
  
  Our environment
  
  Moneyfarm's backend runs on event-driven microservices, with
  Scala as a primary language across much of the platform. The
  AI team's own services will be built in TypeScript and
  Python, but you'll integrate with — and sometimes touch —
  Scala services. Comfort with functional programming and
  event-driven patterns is part of working effectively here.
  
  Responsibilities:
  
