description: |
  Company Overview
  
  At Motorola Solutions, we believe that everything starts
  with our people. We’re a global close-knit community, united
  by the relentless pursuit to help keep people safer
  everywhere. We build and connect technologies to help
  protect people, property and places. Our solutions foster
  the collaboration that’s critical for safer communities,
  safer schools, safer hospitals, safer businesses, and
  ultimately, safer nations. Connect with a career that
  matters, and help us build a safer future.
  
  Department OverviewThe AI Services team creates solutions by
  applying our experience in workflow development, system
  integrations, and infrastructure deployment. Our products
  leverage cutting edge machine learning capabilities to
  enable our customers to focus on providing faster responses,
  safer outcomes, and greater transparency. You will join a
  talented engineering organization with a track record of
  delivering meaningful and impactful solutions. Job
  Description
  
  The AI Services team is looking for an experienced software
  engineer experienced with audio data, machine learning, and
  designing scalable systems.  Our area of work is to enable
  fast, accurate, and natural communication between human
  operators and their underlying information in real-time
  systems.
  
  Responsibilities and Expectations
  
  - Develop mission-critical software solutions that are
    maintainable, testable, scalable, performant, and highly
    available.
  - Promote best practices in software architecture, coding
    standards, and quality assurance while developing
    interfaces and workflow orchestration for real-time and
    batched solutions.
  - Support evaluation and analysis of our solutions and models
    (latency benchmarks, noisy audio and data, accuracy, etc)
  - Build and warehouse datasets for training and validation
    purposes, working closely with data scientists and other
    engineers.
  - Ensure security, compliance, and compartmentalization of
    data for public safety and enterprise customers.
  - Design and implement scalable ML/AI systems and pipeline
  - Optimize model performance and accuracy to meet system
    requirements
  
  Requirements
  
  - 4+ years of software development experience working with
    Python, SQL
  - Must be a US Citizen with ability to obtain necessary
    security clearance as required by government contract
  - Legal authorization to work in the U.S. indefinitely is
    required. Employer work permit sponsorship is not
    available for this position.
  - Expert knowledge of software design and best practices for
    full development life cycle, including coding standards,
    code reviews, source control management, build processes,
    testing methodology, security, and audit/monitoring
    requirements.
  - Strong analytical skills capable of evaluating ideas,
    assessing risks, and controlling feature scope in real-
    time streaming solutions.
  - Highly proficient database and data modeling skills
  - Experience developing containerized solutions (Docker,
    Kubernetes) and serverless infrastructure (e.g. AWS
    Lambda).
  - Experience working with cloud-based solutions and
    configuration: Azure, AWS, and GCP.
  - Excellent written and oral communication skills to
    collaborate in a multinational environment with teams
    spanning the globe.
  - Familiarity with MLOps and full ML lifecycle management from
    prototype to production
  - Experience iterating on models and production code based on
    feedback
  
  Additional Skills
  
  - Experience working with ML models, including traditional
    networks and large language models (LLMs)
  - Delivered solutions across domains like audio, NLP,
    generative AI, edge AI
  - Experience with ML frameworks (PyTorch, Tensorflow) and
    infrastructure (e.g., Databricks, MLFlow, AWS SageMaker,
    Hugging Face)
  - Experience with distributed computing frameworks like Ray
  - Experience with orchestration tools like Apache Airflow or
    Temporal
  - Bachelor’s or Master’s degree in Computer Science,
    Engineering, or a related field.
  
