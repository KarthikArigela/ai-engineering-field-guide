description: |
  At Medtronic you can begin a life-long career of exploration
  and innovation, while helping champion healthcare access and
  equity for all. You’ll lead with purpose, breaking down
  barriers to innovation in a more connected, compassionate
  world.
  
  A Day in the LifeAs a Data Engineer for the Reporting,
  Analytics & Insights (RAI) COE within Global Finance at
  Medtronic, you’ll have an opportunity to contribute to the
  world’s largest medical device company. This dynamic role
  within a multicultural environment fosters career growth and
  is critical to driving digital transformation and
  operational excellence across financial operations. You will
  work closely with Finance, Data Science, and Engineering
  teams to develop interactive visualizations that drive data
  accessibility. This role requires an average of 3-4 days per
  week of overlapping working hours with the U.S. team to
  ensure seamless collaboration.
  
  Responsibilities may include the following and other duties
  may be assigned:
  
  - Enable scalable AI/ML use cases by designing and optimizing
    data architectures, including feature-ready data models,
    real-time/near-real-time pipelines, and governed datasets
    that support advanced analytics, forecasting models, and
    enterprise AI initiatives.
  - Finance Domain Data Ownership: Translate finance processes
    (FP&A, revenue, cost, margin, forecasting) into scalable
    and governed data models.
  - Data Engineering & Pipeline Development: Design, build, and
    maintain robust ETL/ELT pipelines using modern data
    platforms (e.g., Snowflake, Azure).
  - Data Modeling for Finance: Develop optimized data models
    (fact/dimension structures) to support financial
    reporting, planning, and analytics.
  - Business & Technical Collaboration: Partner with finance
    stakeholders, data engineers, and IT teams to align data
    architecture with business needs.
  - Enable Advanced Analytics: Support downstream analytics,
    including Power BI dashboards, forecasting models, and
    AI/ML initiatives.
  - Automation & Process Efficiency: Identify opportunities to
    streamline financial data processes through automation and
    standardization.
  - Performance Optimization: Optimize data pipelines and
    queries for scalability, performance, and cost efficiency.
  - Continuous Improvement: Evaluate and enhance data
    architecture to improve speed, reliability, and business
    impact of financial insights.
  
  Required Knowledge and Experience:
  
  - Requires a full time Bachelor’s degree in engineering,
    Finance, Accounting, or related field AND MBA in Finance
    (preferred).
  - Requires 5–8 years of overall experience, including 5+ years
    of experience in Data Engineering, Analytics Engineering,
    or Finance Data roles.
  - Strong understanding of financial processes (FP&A, P&L,
    forecasting, reporting)
  - Hands-on experience with SQL, Snowflake (or similar cloud
    data warehouse), and ETL/ELT development
  - Experience working with enterprise financial systems (SAP,
    OneStream, ERP platforms)Nice to Have:
  - Experience with cloud platforms such as Azure, AWS, or GCP
  - Familiarity with Python or Spark for data processing
  - Exposure to Power BI or other visualization tools to support
    end-to-end data solutions
  - Experience supporting financial planning, revenue analytics,
    or sales performance reporting (PMx)
  - Knowledge of data governance, data lineage, and financial
    controls frameworks
  - Proven ability to work independently and manage multiple
    priorities
  - Strong communication skills with the ability to translate
    between finance and technical teams
  - Proactive mindset with passion for automation, data
    transformation, and continuous improvement
  - Strong organizational and time-management skills; ability to
    adapt in a fast-paced, global environment
  
  Physical Job Requirements The above statements are intended
  to describe the general nature and level of work being
  performed by employees assigned to this position, but they
  are not an exhaustive list of all the required
  responsibilities and skills of this position.
  
