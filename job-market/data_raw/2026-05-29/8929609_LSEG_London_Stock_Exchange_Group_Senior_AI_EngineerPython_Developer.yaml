description: |
  You'll be joining our FX Trade Advanced Analytics team as a
  Senior AI Engineer. We're responsible for building and
  delivering complex analytic applications across our
  regulated FX trading venues.
  
  Advanced Analytics team provides traders with the ability to
  assess historical trading data with comparisons of liquidity
  providers and data visualization technology. Our existing
  analytic capability processes millions of FX trade messages
  every day on cloud through our big data stack including
  Python, SnowPark, Oracle and Snowflake.
  
  Responsibilities
  
  You will be responsible for designing and implementing new
  analytic and AI‑driven application capabilities within our
  Big Data analytics ecosystem. This includes building
  production grade systems that integrate traditional data
  engineering with modern AI frameworks. You will need strong
  technical abilities, be able to quickly understand and
  contribute to existing codebases and express design concepts
  with a solid understanding of functional programming
  paradigms and AI system design.
  
  As a senior AI engineer, you will be responsible for
  engineering scalable solutions, maintaining rigorous quality
  standards, contributing to Agile Scrum processes, and at
  times interacting directly with product stakeholders.
  
  Required Skills
  
  - Solid grasp of Python, including experience building
    production systems in cloud environments and working with
    big data warehouses (preferably Snowflake).
  - Hands on experience with AI/LLM engineering, Agentic AI,
    including building applications using LangChain,
    LlamaIndex, or similar LLM orchestration frameworks.
  - Hands-on experience with Snowflake Cortex, including
    building or integrating AI/ML pipelines using Cortex
    functions and services.
  - Integrating LLMs (OpenAI, Azure OpenAI, Anthropic, etc.)
    into production systems.
  - 7+ years of relevant software engineering experience.
  - 3+ years delivering application solutions, ideally using big
    data technologies.
  - Demonstrated ability to contribute independently while
    collaborating effectively as part of a team on high
    profile projects.
  
  Additional Skills and Experience
  
  - Some knowledge of, or willingness to learn, technologies
    such as Snowpark, AWS Lambda, Terraform Oracle and Hive
  - Unit and Integration testing your code (including mocking)
  - Proficient with version-control solutions using Git
  - Continuous integration (Gitlab, Bamboo, Jenkins) and/or
    deployment (Terraform)
  - Knowledge of embedding models, vector search optimization,
    and LLM observability/monitoring tools.
  - Experience working in Agile Scrum methodologies
  - Linux and bash/ruby scripting
  - Understanding of FX financial markets
  
  Career Stage:
  
  Senior Associate
  
