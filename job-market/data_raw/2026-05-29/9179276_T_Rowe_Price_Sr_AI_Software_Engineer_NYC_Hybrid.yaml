description: |
  At T. Rowe Price, we identify and actively invest in
  opportunities to help people thrive in an evolving world. As
  a premier global asset management organization with more
  than 85 years of experience, we provide investment solutions
  and a broad range of equity, fixed income, and multi-asset
  capabilities to individuals, advisors, institutions, and
  retirement plan sponsors. We take an active, independent
  approach to investing, offering our dynamic perspective and
  meaningful partnership so our clients can feel more
  confident.
  
  We believe doing the right thing for our clients and our
  associates is good business. With a career at the firm, you
  can expect opportunities to create real impact at work and
  in your community. You’ll enjoy resources to support your
  career path, as well as compensation, benefits, and
  flexibility to enrich your life. Here, you’ll find a
  collaborative culture that respects and values differences
  and colleagues who share a spirit of generosity.
  
  Join us for the opportunity to grow and make a difference in
  ways that matter to you.
  
  Role Summary
  
  Positions are available in our New York City office or with
  our AI Engineering squad in Harbor Point, Baltimore, MD. In
  either location, you will join a collaborative team of
  engineers, product owners, and business partners building
  high-impact software products with leverage across the firm.
  
  As a Senior Software Engineer on T. Rowe Price Labs’ AI
  Engineering team, you will design, build, and scale modern,
  production-grade applications and services that help
  accelerate innovation across the enterprise. Working in a
  Build-Operate-Transfer model, you will help incubate new
  products, harden them for production, and partner closely
  with business-aligned technology teams to enable broader
  adoption at scale.
  
  This role is well suited for engineers with strong software
  fundamentals, cloud and platform experience, and a product
  mindset. What matters most is the ability to solve complex
  problems, build reliable systems, collaborate across
  disciplines, and contribute to the standards and practices
  that shape the next generation of software engineering at T.
  Rowe Price.
  
  Responsibilities
  
  - Design, build, test, deploy, and support modern software
    applications and services within cloud-native
    architectures.
  - Partner with engineers, product owners, and business
    stakeholders to translate complex needs into scalable
    technical solutions that deliver measurable business
    value.
  - Contribute to the incubation of new products by rapidly
    validating ideas, building robust implementations, and
    preparing successful solutions for production adoption.
  - Help execute the Build-Operate-Transfer model by
    collaborating with business-aligned technology teams to
    transition proven capabilities for long-term ownership and
    scale.
  - Contribute to reusable shared capabilities and engineering
    components that improve speed, quality, and consistency
    across teams.
  - Champion engineering excellence through strong software
    design, automated testing, code quality, continuous
    integration, and continuous delivery practices.
  - Build systems with measurable quality, production readiness,
    operational observability, and appropriate safety and
    control mechanisms.
  - Manage technical debt and drive continuous improvement
    across platforms, services, and developer workflows.
  - Identify opportunities to apply emerging technologies in
    ways that accelerate workflows, unlock business value, and
    improve operational efficiency.
  
  Business Knowledge
  
  - Collaborate closely with business stakeholders and product
    owners to understand priorities, shape solution direction,
    and deliver practical outcomes.
  - Bring a strong product mindset to technical decision-making,
    balancing innovation, scalability, risk, and long-term
    maintainability.
  - Operate effectively in a highly collaborative environment
    where engineers work side by side with cross-functional
    partners to solve meaningful business problems.
  
  Qualifications
  
  Required:
  
  - Bachelor’s or Master’s degree in Computer Science or a
    related technical field, or equivalent practical
    experience.
  - 5+ years of professional software engineering experience
    building applications in an object-oriented language such
    as Java, Python, or JavaScript.
  - Hands-on experience with cloud-native architectures,
    containerized microservices, and modern software delivery
    practices.
  - Experience building or contributing to production or near-
    production applications, platforms, or intelligent
    workflows in complex enterprise environments.
  - Familiarity with modern engineering patterns such as API
    integration, event-driven services, observability,
    monitoring, and scalable system design.
  - Strong analytical, problem-solving, and software design
    skills.
  - Commitment to engineering quality through automated testing,
    code reviews, observability, and continuous delivery.
  - Strong collaboration and communication skills, with the
    ability to work across engineering and business teams to
    shape effective solutions.
  - A product mindset, learning agility, and comfort operating
    in a fast-evolving technology landscape.
  
  Preferred:
  
  - Experience contributing to reusable platform components or
    shared engineering capabilities.
  - Exposure to AI-enabled systems, intelligent workflows, or
    emerging automation technologies.
  - Experience with React and/or Angular.
  - Understanding of financial markets, asset management, or
    financial instruments.
  
  WHAT TO EXPECT AFTER APPLYING 1. You will receive an email
  and text message to answer a few questions to verify your
  eligibility. If you apply for multiple jobs, you will
  receive separate invitations for each role and will need to
  respond to each. Estimated Time Commitment: 3-5 minutes 2.
  If you are eligible, you will be asked to record video
  responses to introductory questions with our vendor partner,
  HireVue. Take time to read all instructions carefully before
  responding. Some questions may require you to respond within
  a set time limit, or with limited retakes. You can use this
  opportunity to tell us more about your background and
  interest than we can learn from a resume alone. Estimated
  Time Commitment: 20-30 minutes
  
  FINRA Requirements
  
  FINRA licenses are not required and will not be supported
  for this role.
  
  Work Flexibility
  
  This role is eligible for hybrid work, with up to three days
  per week from home.
  
  Base Salary Ranges
  
  Please review the job posting for the location of this
  specific opportunity.
  
  $121,000.00 - $206,000.00 for the location of: Maryland,
  Colorado, Washington and remote workers $133,000.00 -
  $227,000.00 for the location of: Washington, D.C.
  $151,000.00 - $258,000.00 for the location of: New York,
  California
  
  Placement within the range provided above is based on the
  individual’s relevant experience and skills for the role.
  Base salary is only one component of our total compensation
  package.  Employees may be eligible for a discretionary
  bonus, which is determined upon company and individual
  performance.
  
  This job posting is expected to be available until:
  
  05/31/2026
  
