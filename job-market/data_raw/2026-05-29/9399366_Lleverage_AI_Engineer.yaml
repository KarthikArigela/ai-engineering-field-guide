description: |
  About us
  
  Hey there! We’re Lleverage.ai, and we’re making AI
  automation actually achievable for businesses. We enable
  teams to capture, automate, and integrate AI-driven
  workflows and agents into their business, because AI is only
  useful when it actually fits into daily operations.
  
  We’re a team of entrepreneurs and innovators, who believe
  the future of work is 80% creativity, strategy, and human
  interaction, because AI takes care of the rest. If that
  sounds something you want to help build, we’d love to have
  you on board!
  
  Responsibilities
  
  - AI Agent Development: Build intelligent agents and enhance
    Lleverage Copilot to automate workflows through natural
    language interfaces.
  - Model Evaluation: Implement evaluation frameworks and
    metrics to measure AI model performance and business
    alignment.
  - Model Fine-tuning: Design fine-tuning strategies for
    generative AI models, optimising for specific product use
    cases.
  - Full-Stack Development: Build backend APIs and frontend
    interfaces around AI models using Next.js/TypeScript.
  - Knowledge Base Development: Develop and optimize our off the
    shelf RAG-based knowledge retrieval systems.
  - Production Monitoring: Implement monitoring and alerting
    systems for AI models in production environments.
  - Iterate Fast: Contribute to fast feedback loops — release
    quickly, learn, and improve.
  - Value Delivery: Constantly assess how engineering decisions
    impact customer value and business outcomes.
  
  Job specific requirements
  
  - AI Expertise: Deep experience with generative AI models,
    fine-tuning, and model deployment in production
    environments.
  - AI Agents & Function Calling: Proven experience building AI
    agents with function calling and tool use implementations.
  - LLM Evaluation: Proven experience implementing evaluation
    frameworks and metrics for large language models.
  - RAG & Knowledge Systems: Experience with Retrieval Augmented
    Generation architectures and vector database
    implementations.
  - Developer Skills: Good familiarity proficiency in
    TypeScript, Next.js or similar to build end-to-end
    experiences.
  - First Principals Thinker: Approach AI challenges by
    understanding core mechanisms rather than just applying
    existing frameworks—able to innovate beyond current best
    practices.
  - Startup Mentality: Comfortable with ambiguity and excited to
    work in a fast-moving, AI-focused environment.
  - AI Innovation: Passionate about pushing the boundaries of
    what's possible with generative AI in business automation.
  
  Nice to haves
  
  - Strong proficiency in TypeScript, Next.js.
  - Previous experience at early-stage startups or as a founding
    engineer
  - Background in SaaS or low-code platforms
  - Contributions to open source projects
  - A carry-on ice cream bar (it's becoming our thing)
  
  We offer
  
  You are ready for the ride of a lifetime with experienced
  entrepreneurs and innovators who aim for hyper growth on a
  global scale. We look for an enormous drive and hands-on
  mentality. Somebody who can work with us in creating the
  best AI automation solution out there!
  
  We offer a good salary, a highly experienced (and very
  entertaining...) team and considerable share packages.
