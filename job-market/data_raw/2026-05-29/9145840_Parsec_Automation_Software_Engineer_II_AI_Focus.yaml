description: |
  About Parsec
  
  Parsec Automation, LLC is a global leader in manufacturing
  operations management software. Recognized by Gartner, IDC,
  and numerous industry awards, Parsec’s flagship MES
  platform, TrakSYS™, powers efficiency, quality, and
  compliance improvements at over 11,000 plants across 140+
  countries. Manufacturers such as Johnson & Johnson, Merck,
  Toyota, Procter & Gamble, Hershey, Siemens, and DuPont rely
  on TrakSYS to manage complex operations with clarity and
  precision.
  
  Parsec is backed by BVP Forge, part of the $20B Bessemer
  platform, known for supporting category-defining companies
  such as LinkedIn, Procore, Shopify, and Toast. 
  
  About the Role
  
  We’re looking for a Software Engineer II (AI Focus) to help
  build and expand AI capabilities within our core platform.
  
  This role is hands-on and focused on implementing
  production-ready AI features, including agent-based
  workflows and integrations with LLM providers. You’ll work
  within a Microsoft-based, on-prem environment and contribute
  to building AI functionality that is secure, scalable, and
  reliable in real-world manufacturing settings.
  
  You’ll partner with senior engineers and product teams to
  deliver AI-powered features, while continuing to grow your
  experience in modern AI systems and enterprise software
  development.
  
  Key Responsibilities
  
  Quality, Security & Reliability
  
  - Follow secure development best practices, including least
    privilege and data protection
  
  - Implement validation, error handling, and safe access
    patterns
  
  - Contribute to logging, monitoring, and observability for AI
    features
  
  - Support testing efforts including:
  
  - Unit and integration testing
  
  - Validation of AI and tool interactions
  
  
  
  Team Collaboration & Growth
  
  - Work closely with senior engineers to implement AI features
    aligned to product requirements
  
  - Participate in code reviews, design discussions, and team
    collaboration
  
  - Assist with troubleshooting and support for AI-related
    functionality
  
  - Continue developing skills in AI technologies, the TrakSYS™
    platform, and manufacturing systems
  
  
  
  AI Development & Implementation
  
  - Build AI capabilities within a Microsoft-based stack
    (ASP.NET, .NET services, SQL Server)
  
  - Implement agentic workflows, including agent runtimes and
    orchestration logic
  
  - Develop services that manage:
  
  - Conversation and task state
  
  - Tool execution and routing
  
  - Retries, timeouts, and execution limits
  
  - Integrate with LLM providers (OpenAI, Anthropic, etc.),
    including tool/function calling patterns
  
  - Contribute to building and maintaining tool integrations,
    including:
  
  - SQL Server queries and stored procedures
  
  - Internal APIs and services
  
  - File/report generation systems
  
  Required Qualifications
  
  - 3–5+ years of software development experience
  
  - Experience with .NET (C#, ASP.NET)
  
  - Familiarity with API design and integration (REST, JSON,
    etc.)
  
  - Experience with SQL Server or similar relational databases
  
  - Understanding of software development best practices
    (testing, debugging, version control)
  
  - Exposure to agentic AI systems, MCP, or similar tool/plugin
    frameworks
  
  - Experience integrating with LLM APIs or working with AI/ML-
    powered features
  
  - Bachelor’s degree in Computer Science, Engineering,
    Information Technology, or a related field, or equivalent
    practical experience
  
  
  
  Preferred Qualifications
  
  - Familiarity with Azure OpenAI or other LLM platforms
  
  - Experience with Semantic Kernel or similar frameworks
  
  - Experience working in enterprise or on-prem environments
  
  - Exposure to manufacturing or MES systems
  
  
  
  Benefits
  
  - $145,000 to $165,000 annual salary
  
  - Variable Bonus based on company and individual performance
  
  - Hybrid work schedule (3 days in office / 2 days remote)
  
  - 401(k) with company match
  
  - 100% company-paid health insurance premiums for employees
  
  - Flexible vacation / PTO
  
  - Flexible Spending Account (FSA) plan available for eligible
    healthcare and dependent care expenses
  
  - Outstanding team environment
