  About Role-
  
  We are seeking a highly skilled Senior Generative AI/Python
  Developer with expertise in Python and advanced AI
  technologies. In this role, you will design and develop
  prompt engineering techniques, optimize GenAI performance,
  and work with cutting-edge open-source frameworks. If you
  have a strong background in AI development and are
  passionate about pushing the boundaries of technology, we
  want to hear from you.
  
  Job Details-
  
  Role type: C2H
  
  Experience: 5-7 Years of relevant experience
  
  Work timing: 1 PM – 10 PM IST
  
  Work Days: Monday- Friday
  
  Job Location: Initial 1-week induction at the Ahmedabad
  office, followed by remote work for 1 year, and then Hybrid
  model based in Hyderabad office (HITEC City).
  
  Requirements
  
  Job Requirements:
  
  ·         Advanced proficiency in Python programming, with a
  strong background in AI development.
  
  ·         Hands-on experience with open-source LLM
  frameworks (e.g., LangChain, LlamaIndex).
  
  ·         Proficiency with foundation models in AWS or Azure
  cloud environments.
  
  ·         Knowledge of Streamlit and FastAPI frameworks is a
  plus.
  
  ·         Bachelor's degree in computer science, AI, or
  related field, with 5+ years of experience in software
  engineering.
  
  ·         Strong strategic thinking, problem-solving
  abilities, and excellent communication skills.
  
  Job Responsibilities:
  
  ·         Develop and optimize prompt engineering techniques
  for Generative AI.
  
  ·         Work with frameworks like LangChain, LlamaIndex,
  and foundation models in AWS or Azure.
  
  ·         Collaborate with cross-functional teams to define,
  design, and deliver high-quality solutions.
  
  ·         Mentor and guide junior developers, participating
  in code reviews and maintaining code quality.
  
  ·         Stay updated with the latest industry trends to
  ensure our AI solutions remain innovative and competitive.
