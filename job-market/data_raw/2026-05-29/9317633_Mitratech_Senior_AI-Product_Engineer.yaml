  Senior AI Product Engineer Location: US (Remote) - Only US
  Citizens or PR Team: AI-Enhanced Product Engineering
  
  About Mitratech
  
  Mitratech is a proven global technology partner for
  corporate legal, immigration, human resource, and compliance
  teams. Our approach to work is proactive, collaborative, and
  committed. The professionals who are thriving at Mitratech
  are people like you who know how to balance individual
  excellence with teamwork. We believe our employees’
  enthusiasm fuels great work, so we pursue individuals with a
  passion for building an environment of ownership,
  transparency, continuous improvement as well as a dedication
  to driving the best possible experience for our customers.
  In other words, if you like people and technology, you'll
  fit right in.
  
  Our team is changing the face of legal, immigration,
  compliance, and operational risk. Today, our products run
  over 20,000+ corporations of all sizes across the globe,
  representing a large portion of the Fortune 10, almost 40
  percent of the Fortune 500, and over 50,000 users in over
  150 countries. These teams depend on our technology and our
  people to help them grow and protect their organizations.
  Our approach to work is proactive, collaborative, and
  committed.
  
  This is an excellent opportunity to join our growing company
  by supporting our most valued asset – our customers. In this
  role, you will gain an in-depth understanding of our
  customer’s operations, goals, and challenges so that you can
  help them gain the most value from their investments with
  Mitratech.
  
  Due to business and compliance requirements, this position
  is open only to candidates residing in US. Applications from
  candidates outside this region will not be considered.
  
  Role Overview We are looking for a Senior AI Product
  Engineer to join our team and lead the charge in
  transforming how software is developed. You will be a
  subject matter expert and force multiplier, leveraging AI-
  assisted tools to accelerate engineering, while also driving
  innovative AI features across our HR, Legal, and Risk SaaS
  products.
  
  As a senior team member, you will set the standard for
  technical excellence, foster a collaborative environment,
  and influence the technical direction of our products. If
  you are a seasoned engineer who thrives on solving complex
  problems and amplifying human creativity with AI, this is
  the role for you.
  
  What You’ll Do
  
  - Strategic AI-Augmented Development: Lead our AI-first
    engineering approach. Architect and implement strategies
    using tools like GitHub Copilot, Devin AI, and GPT APIs to
    boost team productivity. Define and refine prompt
    engineering best practices for the entire team.
  - Architecture and Feature Delivery: Design, build, and
    maintain robust, scalable, and secure features across our
    product suite. Lead complex full-stack development
    initiatives, from system architecture to back-end APIs and
    data layers, directly contributing to the value delivered
    to HR, Legal, and Risk clients.
  - Technical Leadership & Mentorship: Set the standard for code
    quality and engineering excellence. Architect and
    implement testing strategies (manual and AI-assisted),
    conduct in-depth code reviews, and mentor junior and mid-
    level engineers to support their growth.
  - Innovation and Process Improvement: Stay ahead of AI
    software development trends. Evaluate and adopt new tools
    and practices to enhance team efficiency and capabilities.
    Contribute to the technical roadmap and help define the
    future of our engineering organization.
  
  Qualifications
  
  Essential:
  
  - 7+ years of professional software development experience,
    with a focus on building and maintaining scalable,
    production-grade applications.
  - Deep expertise in modern backend or full-stack technologies
    (Python, Go, Java, Node.js or React). Proven track record
    of architecting and delivering complex systems.
  - Demonstrated experience leveraging AI-assisted development
    tools (GitHub Copilot, Devin AI, GPT APIs) for
    productivity gains.
  - Extensive experience with AI tools and LLMs, including
    frameworks like LangChain or direct OpenAI API usage.
  - Strong commitment to code quality, security, and
    performance. Expertise in unit, integration, and end-to-
    end testing strategies.
  - Proven technical leadership abilities, mentoring junior
    developers and leading complex projects from concept to
    delivery.
  - Excellent communication skills in English, able to
    articulate complex technical concepts to technical and
    non-technical stakeholders.
  
  Preferred:
  
  - Knowledge of HR, Legal, or Risk industries.
  - Portfolio or contributions to open-source projects
    demonstrating AI or software engineering expertise.
  
  Why You’ll Love This Role This isn’t just another senior
  developer position—it’s your chance to shape the future of
  AI-assisted software engineering. You’ll:
  
  - Our AI-first engineering strategy, influencing both tools
    and processes.
  - Gain hands-on experience applying AI to solve real-world
    engineering challenges at scale.
  - Work in a collaborative environment that values your
    expertise and gives you autonomy to make a tangible impact
    on products and business outcomes
  
  We will disclose intended pay ranges in our job ads for US-
  based opportunities – This role can be performed 100% remote
  anywhere in the US. Anticipated Pay Range: $110,000 USD–
  $180,000 USD Annually
  
  Benefits we offer:
  
  - Health, Dental & Vision Insurance *
  - 401 (k) + Employer Match *
  - Unlimited PTO + 11 Paid Holidays + 4 Annual Paid Global
    Wellness Days Off
  - STD, LTD & Group Life Insurance
  - Paid Parental Leave
  - Pet Insurance
  - FSA & HSA Options
  - Employee Assistance Program
  
  Perks we offer:
  
  - Remote Work
  - Career Advancement & Professional Development Opportunities
  - Employee Recognition
  - LinkedIn Learning Platform
  
