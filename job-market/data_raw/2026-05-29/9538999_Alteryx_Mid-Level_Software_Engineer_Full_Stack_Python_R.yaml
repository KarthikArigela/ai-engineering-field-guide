description: |
  Meet the Moment with Alteryx
  
  We're living through a once-in-a-generation shift in how
  work gets done. Data, automation, and AI are quickly
  becoming the center of every business decision - and Alteryx
  is leading the transformation.
  
  You'll be working on the challenges that sit at the heart of
  modern business. No matter your role, the work you do will
  help organizations move faster, see more clearly, and tackle
  questions that used to feel impossible.
  
  If you're ready to meet the moment with innovation,
  curiosity, and excellence, there's a place for you here.
  
  Alteryx is searching for a Software Engineer (Mid-Level).
  This position is remote-friendly.
  
  Position Overview:
  
  We are looking for a Software Engineer to help us build and
  maintain our Intelligent Services cloud and on-prem product
  suite.  You will be a strong technical contributor whose
  passion is around creating amazing, high quality engineering
  outcomes.  You are someone who loves knowing the intimate
  details of and developing in multiple languages, with a
  strong penchant for analytics.
  
  Primary Responsibilities:
  
  - Assists Product Management and Engineering team in
    definition of work (stories, tasks)
  - Takes full ownership of work outcomes including design,
    development, and testing; supports and contributes to
    DevOps pipeline when/where necessary
  - Contributes to quality system (framework), with a strong
    commitment to leading with quality
  - Participates in code reviews for the engineers on your team,
    ensuring our delivery of clean, well-tested, and
    performant software
  - Helps in the development of a great work environment through
    being a servant leader within their team
  
  Required Qualifications:
  
  - 3-5 years of React and Python design and development
    experience preferably leveraging open source and open
    standards; experience with API and/or SDK development
    preferred
  - Knowledge of and/or experience with object oriented and
    functional design patterns
  - Experience using Git and Git-based pipelines
  - Experience mentoring and developing others
  - Strong skills in critical thinking, decision making, problem
    solving, and attention to detail
  - Growth mindset, hungry for new challenges and experiences
  - Focus on customer-centric product development
  
  Compensation:
  
  Alteryx is committed to fair, equitable, and transparent
  compensation. Final compensation is determined by several
  factors, including but not limited to relevant work
  experience, education, certifications, skills, and
  geographic location.
  
  The salary range for this role in the United States is
  $103,300 - $133,850.
  
  Bonus payouts are based on individual and company
  performance.
  
  In addition to base pay and bonus eligibility, this role
  includes clear forms of additional compensation, such as:
  
  - A monthly Connectivity Plus stipend of $150 to support
    remote work-related expenses
  - An annual $200 home office reimbursement
  
  Alteryx offers a comprehensive benefits package designed to
  support your health, financial security, and overall well-
  being, including:
  
  - Medical, dental, and vision coverage
  - 401(k) with company match
  - Paid parental leave, caregiver leave, and flexible time off
  - Mental health support and wellness reimbursement
  - Career development and education assistance
  
  Interested? Learn more and apply today at
  alteryx.com/careers!
  
