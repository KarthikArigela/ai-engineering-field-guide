description: |
  About us:
  
  Amach is an industry-leading technology driven company with
  headquarters located in Dublin and remote teams in UK and
  Europe.
  
  Our blended teams of local and nearshore talent are
  optimised to deliver high quality and collaborative
  solutions.
  
  Founded in 2013, Amach was created to solve a specific
  problem in aviation: too much complexity, too little usable
  intelligence. We help airlines modernise their operating
  model using cloud, data and Al-delivered by teams with deep
  aviation domain expertise. Our goal is to maximize airlines'
  operational efficiency by optimizing resource use, reduce
  costs and increase customer experience and satisfaction.
  
  We're hiring a Senior SRE / Platform Engineer to design,
  build and scale cloud platforms that support a growing
  portfolio of AI-driven products and services.
  
  This role will play a key part in moving from early AI
  "lighthouse" initiatives into standardised, production-ready
  platforms, enabling teams to deliver AI workloads reliably,
  securely and at scale. The focus is on building opinionated,
  reusable infrastructure patterns and improving how services
  are deployed, operated, and monitored across multiple
  projects.
  
  This is a hands-on role with a strong architectural element
  - suited to someone comfortable owning platform decisions,
  driving consistency across teams and balancing flexibility
  with standardisation in a fast-paced environment. You'll
  work closely with senior engineering and SRE leadership to
  improve platform capability, reliability and developer
  experience across the organisation.
  
  Please note: the successful candidate will be required to go
  to our customers Central London office 2 days per week.
  
  Key responsibilities & duties include:
  
  Platform Architecture & Standardisation
  
  - Define and implement scalable, reusable architecture
    patterns for cloud-native and AI-enabled services (AWS)
  - Establish shared infrastructure blueprints, modules, and
    templates across multiple projects
  - Drive consistency in how services are deployed, integrated,
    and operated
  
  Infrastructure as Code & Automation
  
  - Build and manage Terraform-based infrastructure using
    modular, reusable design principles
  - Define and improve CI/CD patterns for infrastructure,
    applications, and AI workloads
  - Embed best practices through automation and platform tooling
  
  Reliability, Observability & Operations
  
  - Apply SRE principles across services (monitoring, logging,
    tracing, SLIs/SLOs)
  - Improve system reliability, performance, and cost efficiency
  - Support and operate API gateway/data plane technologies
    (e.g. Kong or similar)
  
  AI Platform Enablement
  
  - Support the deployment and operation of AI/ML workloads in
    production (e.g. inference services, pipelines, LLM
    integrations)
  - Contribute to how AI workloads are scaled, monitored and
    optimised within the platform
  
  Required skills
  
  - Strong experience operating AWS-based platforms in
    production environments
  - Proven expertise in Terraform, including modular design and
    CI/CD integrations
  - Experience with container platforms (ECS preferred, EKS or
    similar also considered)
  - Solid understanding of cloud networking, service discovery,
    and distributed systems
  - Experience working across multiple teams or projects on
    shared platforms
  - Strong troubleshooting and production support experience
  - Practical experience supporting or running AI/ML workloads
    in production (e.g. inference services, pipelines, LLM
    integrations)
  - Understanding of scaling and cost considerations for
    compute-heavy workloads
  - Strong architectural thinking and ability to make pragmatic
    decisions
  - Strong communication and stakeholder management skills
  
  Desirable skills
  
  - Experience with API gateways (e.g. Kong or equivalent)
  - Exposure to GPU workloads or specialised compute
    environments
  - Familiarity with vector databases, feature stores, or
    embedding pipelines
  - Knowledge of event-driven architectures
  
  What’s in it for you:
  
  - An opportunity to join a fast-growing company
  - Options for career advancement
  - Learning and development opportunities
  - Flexible working environment
  - Competitive salaries based on experience
  
