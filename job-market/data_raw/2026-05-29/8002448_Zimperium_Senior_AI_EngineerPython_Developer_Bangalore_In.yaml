description: |
  Zimperium® is the world leader in mobile security, purpose-
  built to protect the modern mobile enterprise. Trusted by
  leading organizations and governments, our AI-driven
  platform delivers real-time, on-device protection for mobile
  applications and devices. We help organizations stay ahead
  with proactive defense against evolving threats—including
  mobile-targeted phishing (mishing), malware, app
  vulnerabilities, and zero-day exploits. Our mission is to
  empower organizations to operate securely and confidently in
  today’s dynamic digital environment.
  
  Zimperium® is an industry leader in enterprise mobile
  security, being the first and only company to provide a
  complete mobile threat defense system that offers real-time,
  on device world-class protection against both known and
  unknown next generation of advanced mobile cyberattacks and
  malware.
  
  
  
  Our MTD and award-winning machine learning-based engine
  protects against device, network, phishing and application
  attacks for IOS, Android and Windows devices, using a non-
  intrusive approach to always protect privacy of users.
  
  
  
  As part of our fast - growing pace, we are currently looking
  for a Senior Python Engineer to help build a meaningful
  engineering discipline, combining software and systems to
  develop creative engineering solutions to both development
  and operational problems.
  
  
  
  Location: Bangalore, India (Hybrid)
  
  
  
  You will work on building infrastructure, processes, and
  reducing work through automation. You’ll join a team of
  curious problem solvers with a diverse set of perspectives
  who are thinking big and taking risks. In this environment
  you’ll take the lead on relevant projects, supported by an
  organization that provides the support and mentorship you
  need to learn and grow.
  
  
  
  Responsibilities:
  
  - Work with a team of developers in the development of high-
    performance and scalable web and task servers using Python
    and related technologies.
  
  - Design and implement robust, scalable and maintainable
    server architecture using Django, Flask, or similar Python
    web frameworks.
  
  - Design and implement scheduled services using RQ or other
    task queuing frameworks.
  
  - Support the integration of complex numerical learning and
    analysis code into web and task frameworks.
  
  - Develop and maintain documentation for server architecture
    and code.
  
  - Provide technical guidance and mentorship to junior
    engineers on the team.
  
  - Participate in code reviews and contribute to overall
    software design and architecture.
  
  
  
  Requirements and Qualifications:
  
  - 5–9 years of hands-on experience in Python development
  
  - Strong experience with Python frameworks (Django / Flask /
    FastAPI)
  
  - Good exposure to AI tools and technologies (e.g., OpenAI,
    LangChain, Hugging Face, TensorFlow, PyTorch, etc.)
  
  - Experience working with REST APIs and microservices
    architecture
  
  - Strong knowledge of databases (PostgreSQL, MySQL, MongoDB,
    etc.)
  
  - Familiarity with cloud platforms (AWS, Azure, or GCP)
  
  - Experience with Git and CI/CD pipelines
  
  - Strong problem-solving and communication skills
  
  
  
  Nice to Have:
  
  - Experience with LLMs, Generative AI, or chatbot development
  
  - Knowledge of Docker, Kubernetes
  
  - Exposure to MLOps tools and workflows
  
  - Experience in Agile/Scrum environments
  
  
  
  
  
  
  
  
  
  
  
