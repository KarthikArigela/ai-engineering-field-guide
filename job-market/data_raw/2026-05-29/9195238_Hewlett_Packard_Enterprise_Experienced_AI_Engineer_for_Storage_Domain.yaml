description: |
  Experienced AI Engineer for Storage Domain
  
  
  
  This role has been designed as ‘Hybrid’ with an expectation
  that you will work on average 2 days per week from an HPE
  office.
  
  Who We Are:
  
  Hewlett Packard Enterprise is the global edge-to-cloud
  company advancing the way people live and work. We help
  companies connect, protect, analyze, and act on their data
  and applications wherever they live, from edge to cloud, so
  they can turn insights into outcomes at the speed required
  to thrive in today’s complex world. Our culture thrives on
  finding new and better ways to accelerate what’s next. We
  know varied backgrounds are valued and succeed here. We have
  the flexibility to manage our work and personal needs. We
  make bold moves, together, and are a force for good. If you
  are looking to stretch and grow your career our culture will
  embrace you. Open up opportunities with HPE.
  
  Job Description:
  
  
  
  Data Intelligence Job Description
  
  In the HPE Hybrid Cloud, we lead the innovation agenda and
  technology roadmap for all of HPE. This includes managing
  the design, development, and product portfolio of our next-
  generation cloud platform, Green Lake. Working with
  customers, we help them reimagine their information
  technology needs to deliver a simple, consumable solution
  that helps them drive their business results. Join us
  redefine what’s next for you.
  
  HPE Alletra Storage MP X10000, a new product release,
  unleashes the power of the unstructured data with data
  intelligence, enterprise performance at scale, and simple to
  manage object storage to drive innovation and accelerate
  time to value. HPE Alletra X10000 is our flagship Object
  storage Platform that got released November 2024. This
  product line powers many of customers AI first use-cases
  tapping Data Intelligence from their Storage systems.
  
  What you'll do:
  
  Responsibilities-
  
  - Lead cross-functional teams in identifying and prioritizing
    key areas of a partner’s business where AI solutions can
    drive significant business benefit.
  
  - Design and develop solutions leveraging patterns in the data
    and metadata stored in Petabytes of Objects and Files in
    distributed fashion across enterprise storage platform.
  
  - Design, develop, and deploy hybrid RAG architectures
    integrating LLMs with retrieval-based systems for improved
    relevance and contextual responses.
  
  - Work on functional design, process design (including
    scenario design, flow mapping), prototyping, testing,
    training, and defining support procedures, in
    collaboration with an advanced engineering team and
    executive leadership
  
  - Translating technical AI findings into clear, business-
    oriented language for non-technical stakeholders to
    support AI-driven business strategies.
  
  - Implement and manage pipelines that effectively combine
    retrieval mechanisms with generative capabilities,
    ensuring high accuracy and efficiency.
  
  - Develop custom plugins, adapters, or APIs to integrate
    retrieval systems (e.g., Elasticsearch) with generative
    models, facilitating seamless information retrieval.
  
  - Fine-tune and optimize large language models, enhancing
    their performance and adaptability to domain-specific
    requirements.
  
  - Monitor and troubleshoot issues within pipelines, fine-
    tuning retrieval parameters and model hyperparameters to
    optimize performance.
  
  - Evaluate and benchmark the performance of vector databases
    and collaborate with data scientists and software
    engineers to integrate vector search capabilities into
    production systems.
  
  - Evaluate and benchmark the performance of solutions, using
    metrics such as response accuracy, latency, and user
    satisfaction.
  
  - Articulate and document the solutions architecture and
    lessons learned for each exploration and accelerated
    incubation.
  
  - Serve as liaison between stakeholders and project teams,
    delivering feedback and enabling team members to make
    necessary changes in product performance or presentation.
  
  - Demonstrate innovative AI use-cases, conducting workshops
    and training sessions, technical paper and patent
    presentations to foster AI adoption
  
  - Guiding and mentoring junior AI engineers, helping them
    develop their skills and knowledge in the field.
  
  - Adhere to the policies and procedures related to AI
    governance to ensure compliance with legal and ethical
    standards.
  
  - Keeping abreast of the latest industry trends, tools, and
    technologies in AI to continually improve the AI
    capabilities of the organization.
  
  
  
  Required skills and qualifications
  
  - Experience designing and developing software systems design
    tools and languages in storage/server/networking area.
  
  - Two or more years of experience in applying AI to practical
    and comprehensive technology solutions
  
  - Experience with ML, deep learning, TensorFlow, Python, NLP
  
  - Experience in program leadership, governance, and change
    enablement
  
  - Knowledge of basic algorithms, object-oriented and
    functional design principles, and best-practice patterns
  
  - Experience in REST API development, NoSQL database design,
    and RDBMS design and optimizations
  
  - Experience with innovation accelerators
  
  
  
  What you need to bring:
  
  - Bachelor's or master's degree in computer science,
    Information Systems, or equivalent.
  
  - Typically, 6 to 10 years' experience.
  
  Additional Skills:
  
  Cloud Architectures, Cross Domain Knowledge, Design
  Thinking, Development Fundamentals, DevOps, Distributed
  Computing, Microservices Fluency, Full Stack Development,
  Security-First Mindset, Solutions Design, Testing &
  Automation, User Experience (UX)
  
  What We Can Offer You:
  
  Health & Wellbeing
  
  We strive to provide our team members and their loved ones
  with a comprehensive suite of benefits that supports their
  physical, financial and emotional wellbeing.
  
  Personal & Professional Development
  
  We also invest in your career because the better you are,
  the better we all are. We have specific programs catered to
  helping you reach any career goals you have — whether you
  want to become a knowledge expert in your field or apply
  your skills to another division.
  
  Unconditional Inclusion
  
  We are unconditionally inclusive in the way we work and
  celebrate individual uniqueness. We know varied backgrounds
  are valued and succeed here. We have the flexibility to
  manage our work and personal needs. We make bold moves,
  together, and are a force for good.
  
  Let's Stay Connected:
  
  Follow @HPECareers on Instagram to see the latest on people,
  culture and tech at HPE.
  
