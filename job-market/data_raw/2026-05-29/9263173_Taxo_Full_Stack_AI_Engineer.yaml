description: |
  About Taxo
  
  Healthcare administration is riddled with inefficiencies,
  requiring professionals to spend more time navigating
  paperwork than caring for patients. Most of this stems from
  outdated processes involving manual workflows and
  unstructured data—like PDFs, faxes, and handwritten notes.
  Taxo is on a mission to revolutionize healthcare
  administration using cutting-edge AI. Our platform
  dramatically reduces processing times, minimizes errors, and
  ensures full transparency, compliance, and auditability.
  
  Taxo is a SF-based tech company that launched out of Harvard
  and is backed by General Catalyst, Character VC, Y
  Combinator, and other top investors. If you’re passionate
  about transforming healthcare through technology and
  building systems that make a tangible impact, we’d love to
  hear from you.
  
  Key Responsibilities
  
   • Build and deploy end-to-end MVPs, integrating AI
  capabilities into the product pipeline.
  
   • Develop intuitive front-end interfaces using modern
  frameworks (e.g., React, Vue.js) and robust back-end systems
  (e.g., Python/Django, Node.js).
  
   • Rapidly prototype AI-powered features, ensuring they are
  scalable, reliable, and explainable.
  
   • Work with machine learning models, fine-tuning, and
  integrating them into production workflows.
  
   • Optimize model inference pipelines for performance and
  scalability.
  
   • Develop and maintain APIs, databases, and cloud-based
  infrastructure to support AI applications.
  
   • Stay up-to-date with the latest AI trends and tools,
  ensuring the best technologies are used for our products.
  
  What We're Looking For
  
   • 3+ years of experience in full-stack development with
  exposure to AI/ML applications.
  
   • Proficiency in front-end frameworks (e.g., React) and
  back-end development (e.g., Python/Django, Node.js).
  
   • Working knowledge of LLM APIs e.g. OpenAI, Claude
  
   • Hands-on experience with AI/ML frameworks like
  TensorFlow, PyTorch, or Hugging Face Transformers.
  
   • Familiarity with deploying machine learning models in
  production (e.g., using REST APIs, FastAPI, or Flask).
  
   • Experience working with cloud platforms (e.g., AWS
  SageMaker, GCP AI Platform) and CI/CD pipelines.
  
   • Knowledge of working with unstructured data (e.g., PDFs,
  images, or text) is a strong plus.
  
   • A product-focused mindset with a passion for delivering
  user-centric AI solutions.
  
   • Excellent communication skills and a collaborative, team-
  oriented attitude.
  
   • Prior experience in startups or the healthcare industry
  is a plus but not required.
  
  Why Join Us
  
   • Build impactful, AI-driven products that transform
  healthcare workflows.
  
   • Be part of a fast-growing, venture-backed startup
  tackling real-world challenges.
  
   • Enjoy a collaborative, innovation-driven culture with
  opportunities to work on diverse projects.
  
   • Competitive compensation, benefits, and the chance to
  shape the future of healthcare.
