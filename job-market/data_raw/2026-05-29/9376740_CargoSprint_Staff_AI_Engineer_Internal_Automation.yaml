title: Staff AI Engineer, Internal Automation
company: CargoSprint
location: USA
work_type: INTERN
description: |
  Empowering the people that make global commerce happen.
  
  About CargoSprint
  
  CargoSprint is made up of a world-class team of highly
  motivated individuals who are passionate about transforming
  the cargo industry. We have developed cutting-edge digital
  solutions that streamline cargo operations, enhance
  efficiency, and improve the overall experience for everyone
  involved. Our workplace fosters innovation, collaboration,
  and the drive to solve industry challenges.
  
  CargoSprint is dedicated to delivering game-changing
  solutions that connect the cargo industry like never before,
  and we are looking for driven, enthusiastic people who share
  our vision of innovation and excellence.
  
  If you think we are a great mutual fit, we want hear from
  you!
  
  About You
  
  You write agents. Not as a proof of concept — as a
  professional craft. You have shipped AI-powered automation
  that real teams use every day, and you measure success in
  hours recovered and processes eliminated, not in demos
  delivered.
  
  You are passionate about solving complex problems with a
  talented team that both challenges and supports you. You
  believe in lifelong learning, constantly honing your skills
  and staying on the cutting edge. Most importantly, you want
  to engage your talents to make a meaningful difference — and
  at CargoSprint, that means building the internal automation
  layer that powers the next chapter of a company moving at
  speed.  About the role
  
  This is a Staff-level role. That means you have deep
  technical credibility and the organizational influence to go
  with it. You are not waiting to be told what to automate
  next. You are identifying it, prioritizing it, and making
  the case yourself.
  
  What you'll do
  
  - Identify and prioritize the highest-ROI automation
    opportunities across CargoSprint's internal departments —
    sales, finance, customer operations, and beyond
  - Design and build production-grade AI agents using Python,
    LLMs, and agent orchestration frameworks that internal
    teams actually depend on
  - Own the full lifecycle: from workflow analysis and
    architecture through implementation, deployment,
    monitoring, and iteration
  - Partner with department leaders and the SDR, finance, and
    operations teams to deeply understand their workflows
    before touching a keyboard
  - Instrument everything — build dashboards and telemetry that
    prove business impact in terms department heads understand
    (hours saved, process steps eliminated, error rates
    reduced)
  - Integrate agents with existing systems: Salesforce, HubSpot,
    ZoomInfo, Postgres, internal APIs — whatever the
    department runs on
  - Build the internal AI muscle: document what you build,
    establish patterns and reusable components, and help the
    broader engineering team develop agent-building fluency
  - Use AI coding tools to accelerate your own development —
    Cursor, Copilot, Claude — and raise the team's
    productivity bar alongside yours
  - Travel to CargoSprint's Guadalajara office as needed to
    observe workflows firsthand, build relationships with the
    teams you are automating for, and drive adoption on the
    ground
  
  Qualifications
  
  General
  
  - Extreme ownership — you treat what you ship as yours. You do
    not hand off and walk away.
  
  - 8+ years of engineering experience, with a meaningful
    portion spent building systems that internal teams depend
    on
  
  - Track record of shipping AI or automation into production at
    a company that was moving fast and had high standards
  
  - Strong business sense — you understand ROI, you can read a
    workflow and identify where the real cost is, and you can
    make the case for your prioritization in business terms
  
  - Excellent communication in English — written and verbal; you
    can explain a complex system to an operations manager and
    to a staff engineer in the same week without losing either
    of them
  
  - Comfortable working with limited oversight and ambiguous
    problem statements — you convert ambiguity into a scoped
    proposal, not a question
  
  - Willingness to travel to CargoSprint's Guadalajara, Mexico
    office as needed to work directly with the teams you are
    building for
  
  Technical Skills
  
  - Expert-level Python — you write clean, production-grade
    code, and your code reviews raise the bar
  
  - Deep experience with LLMs and agent frameworks — LangChain,
    LangGraph, or equivalent; you have built multi-step
    agentic workflows that run reliably in production, not
    just in notebooks
  
  - API and integration experience — you can connect an agent to
    any system that exposes an API, and you know what to do
    when it doesn't
  
  - FastAPI and backend service design — you build the
    infrastructure your agents run on, not just the agents
    themselves
  
  - Postgres and database fluency — schema design, query
    optimization, vector extensions (pgvector); you know how
    data should flow through a system
  
  - DevOps and deployment — Docker, CI/CD, monitoring and
    alerting; you ship to production and you know when
    something is wrong before a user does
  
  - RAG and retrieval systems — you have built systems that
    ground LLM outputs in real organizational knowledge, not
    just general model capability
  
  Stack
  
  You will work with these technologies day to day. Strong
  candidates will be familiar with most of them — full fluency
  across every tool is not expected from day one.
  
  - Backend: Python   ·   FastAPI   ·   Temporal
  - Database: PostgreSQL
  - Agents & RAG: LandGraph LLMs(Open AI, Claude) Embeddings
  - DevOps: Docker   ·   Kubernetes   ·   Pulumi
  - Integrations: Salesforce Hubspot REST APIs
  
  Compensation and benefits
  
  We offer competitive pay and benefits designed to fuel our
  team's success.
  
  - Health and Wellness: Medical, dental, and vision plans for
    you and your family
  
  - Future-Ready: 401(k) with company match
  
  - Work Life Balance: Generous flexible PTO program and paid
    holidays
  
  - Grow With Us: Professional development opportunities
  
  Does this role sound like the next step in your career?
  
  We’d love to hear from you! If you don’t meet all of the
  requirements exactly, we encourage you to use your cover
  letter to tell us about your unique experience—talent comes
  from many places, and skills are transferable.
  
  Our Commitment to an Extraordinary Work Environment
  
  At CargoSprint, we value diversity and inclusivity. We
  strive to create a welcoming and supportive community for
  employees from all backgrounds. Regardless of your gender,
  sexual orientation, physical ability, religion, ethnicity,
  race, or age, you will find a place where you can thrive and
  be your authentic self.
  
  Our CargoSprint Recruitment Team personally reviews every
  application.
