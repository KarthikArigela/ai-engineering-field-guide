title: AI Silicon Physical Design Engineer
company: Cerebras Systems
location: USA
remote: true
work_type: FULL_TIME
description: |
  Cerebras Systems builds the world's largest AI chip, 56
  times larger than GPUs. Our novel wafer-scale architecture
  provides the AI compute power of dozens of GPUs on a single
  chip, with the programming simplicity of a single device.
  This approach allows Cerebras to deliver industry-leading
  training and inference speeds and empowers machine learning
  users to effortlessly run large-scale ML applications,
  without the hassle of managing hundreds of GPUs or TPUs.
  
  Cerebras' current customers include top model labs, global
  enterprises, and cutting-edge AI-native startups. OpenAI
  recently announced a multi-year partnership with Cerebras,
  to deploy 750 megawatts of scale, transforming key workloads
  with ultra high-speed inference.
  
  Thanks to the groundbreaking wafer-scale architecture,
  Cerebras Inference offers the fastest Generative AI
  inference solution in the world, over 10 times faster than
  GPU-based hyperscale cloud inference services. This order of
  magnitude increase in speed is transforming the user
  experience of AI applications, unlocking real-time iteration
  and increasing intelligence via additional agentic
  computation.
  
  About The Role
  
  Join our close-knit physical design team where you'll excel
  in synthesizing, placing, and routing high speed designs.
  Experience the full spectrum of physical design and
  implementation, collaborating closely with the RTL team and
  integrating these blocks seamlessly into the full-chip
  architecture.
  
  Skills & Qualifications
  
  - 10+ years of physical design & physical verification
    experience.
  - Strong knowledge of block level and full-chip physical
    verification methodology.
  - Strong experience in block/subsystem timing closure.
  - Expert at optimizing for the best power/performance and
    area.
  - Experience with the complete physical design flow. Knowledge
    of Synopsys tool suite is a plus.
  - Expert with ICV or Calibre tools resolving block and full-
    chip DRC and LVS issues.
  - Expert with IR/EM analysis and resolution.
  - Good understanding of full chip floor planning and
    integration.
  - Strong ability in scripting languages like Tcl and Python.
    Ability to make flow enhancements.
  - Demonstrated ability to work with RTL teams to optimize for
    physical design.
  - Knowledge of CPU/GPU design a plus.
  - Skills in Design Compiler, Fusion Compiler, ICC2 or similar
    physical design tools.
  - BS or MS in Electrical Engineering.
  
  The salary range for this position is $150,000 – $250,000
  annually. Actual compensation will be determined based on
  factors such as experience, skills, qualifications, and
  location.
  
  Why Join Cerebras
  
  People who are serious about software make their own
  hardware. At Cerebras we have built a breakthrough
  architecture that is unlocking new opportunities for the AI
  industry. With dozens of model releases and rapid growth,
  we’ve reached an inflection  point in our business. Members
  of our team tell us there are five main reasons they joined
  Cerebras:
  
  - Build a breakthrough AI platform beyond the constraints of
    the GPU.
  - Publish and open source their cutting-edge AI research.
  - Work on one of the fastest AI supercomputers in the world.
  - Enjoy job stability with startup vitality.
  - Our simple, non-corporate work culture that respects
    individual beliefs.
  
  Read our blog: Five Reasons to Join Cerebras in 2026.
  
  Apply today and become part of the forefront of
  groundbreaking advancements in AI!
  
