  Job Description
  
  About the Role:
  
  We’re hiring a Sr. Python AI/ML Developer to design smart,
  modular systems that connect LLMs with structured and
  unstructured data workflows. This role focuses on
  intelligent file ingestion, metadata reasoning, query
  generation, and language-based responses—not model training.
  
  You’ll work on multi-agent architectures that break down
  user intent, identify relevant data, and produce useful
  outputs. Think intelligent assistants, not chatbots.
  
  What You’ll Do
  
  - Build services/agents that:
    - Ingest and process structured (CSV, Excel) and unstructured
      (PDF, DOCX) files
    - Extract metadata using LLMs
    - Determine relevant data for user queries through reasoning
    - Generate database queries (MongoDB)
    - Summarize and reformat retrieved content
  - Architect JSON/XML-style protocols for agent communication
  - Develop chunking, tagging, and schema inference pipelines
  - Integrate with LLM APIs to:
    - Generate metadata
    - Interpret queries
    - Summarize content
  - Optimize for performance, retry logic, and reliability of
    LLM calls
  - Build clean API interfaces using Flask or similar framework
  - Write modular, test-covered, and well-documented code
  
  Qualifications
  
  What You Bring
  
  - 5–8 years (mid to senior level) experience
  - Solid Python development with OOP
  - MongoDB or equivalent NoSQL experience
  - Hands-on with LLM APIs (OpenAI, Anthropic, etc.)
  - Experience handling unstructured (PDF, DOCX) and tabular
    (CSV, Excel) data
  - Knowledge of multi-agent orchestration or microservice
    architecture
  - Familiarity with API development and integration
  
  Bonus Points
  
  - Prompt engineering or experience with agent frameworks
  - Vector search (Pinecone, FAISS)
  - Redis queues or Celery/RQ for background tasks
  - XML/JSON schema design
  - Past work on research tools, knowledge systems, or
    automation platforms
  - Should have good experience working with MongoDB
  
  Who You Are
  
  - You enjoy building end-to-end systems that do more than just
    call an LLM
  - You think in pipelines, not monoliths
  - You value clean design, smart abstraction, and robust logic
  - You’re excited by the future of AI systems that actually
    solve problems
  
  Additional Information
  
  What We Offer:
  
  - Opportunity to work on cutting-edge projects in a fast-paced
    and innovative environment.
  - Collaborative and inclusive work culture.
  - Competitive compensation package and benefits.
  - Professional growth opportunities and skill development.
