  500, we collaborate with customers and prospects to align
  Akamai solutions to business needs. We build relationships
  and insights to maximize product value through the full
  scope of our global platform.
  
  Shape the future of the internet
  
  As a Solutions Engineer, you'll build relationships,
  becoming a trusted advisor to our customers, delivering
  innovative solutions. You will get to work with all the
  technologies Akamai has to offer. By partnering with
  engineering and business teams you will become a Subject
  Matter Expert.
  
  As a Senior Solutions Engineer, you will be responsible for:
  
  - Leading revenue and acquiring new business by evangelizing
    Akamai's technology to existing and prospective customers.
  - Engaging with customers during the sales-cycle to gather
    requirements and develop proposals, design, delivery,
    demo's and proof-of-concepts.
  - Collaborating with internal Stakeholders to strengthen
    customer relationships by becoming the go-to person for
    technical queries.
  - Supporting and advising internal cross-functional teams to
    ensure customers get appropriate updates, upgrades and
    event-oriented solutions.
  
  Do what you love
  
  To be successful in this role you will:
  
  - Demonstrate knowledge in Cloud and Internet technologies,
    including TCP/IP, DNS, HTTP/HTTPS, Web architecture and
    design.
  - Have an interest in internet technologies and protocols, web
    performance/security solutions, such as, WAF, DDoS
    protection, Bots, Zero trust.
  - Demonstrate experience with presenting technical topics to
    diverse audiences.
  - Be a good team player, able to collaborate, prioritize, and
    solve problems in a fast changing environment.
  - Be fluent in German and English
  
