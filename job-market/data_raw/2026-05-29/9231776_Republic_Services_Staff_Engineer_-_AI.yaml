description: |
  POSITION SUMMARY:  The GenAI Staff Engineer is a hands-on
  technical leader responsible for building and scaling an
  enterprise-grade Agentic AI platform that empowers users
  across the organization to rapidly build, integrate, and
  operationalize GenAI solutions with minimal friction. The
  engineer will ensure the platform adheres to enterprise
  architecture standards, security and compliance
  requirements, and AI governance best practices. The role
  includes technical leadership, platform development, and
  cross-functional collaboration to accelerate time-to-value
  for GenAI use cases. PRINCIPLE RESPONSIBILITIES:
  
  - Provides technical direction related to project deliverables
    for both onshore and off¬shore development team members.
  - Reviews business requirements and technical analysis
    documentation to develop system implementation approaches
    designed to meet business objectives, while also
    consulting with Solution/Enterprise Architects.
  - Maintains and utilizes expert knowledge of, and provides
    system support for at least two or more complex technical
    operating environments.
  - Maintains code quality by leading code reviews and ensuring
    appropriate unit test coverage is in place.
  - Contributes to project deliverables by performing system
    administration and/or software development tasks as
    needed.
  - Provides input and feedback to team management for
    developers and analysts performance reviews and other
    hiring/promotion decisions.
  - Provides Tier 2 and 3 support and resolution of open IT
    issues escalated by IT Customer Support.
  - Reviews application performance metrics and consults with
    the development teams on enhancements opportunities.
  - Oversees the development, configuration, coding, testing,
    and debugging of complex new software for the Digital
    Development teams. Leads the technical design and
    documentation of Republic Services’ Digital Platform
    including, but not limited to the following: Angular,
    Node.js Drupal, AWS, CI/CD
  - Leads and assists application programmers in defining
    applications system scope and objectives through research
    and fact finding
  - Performs other job related duties as assigned.
  
  QUALIFICATIONS:
  
  - Demonstrated mastery of software development best practices,
    including coding standards, code reviews, source control
    management, build processes, testing, and operations.
  - Deep understanding of object-oriented programming
    methodologies.
  - In depth understanding of eCommerce application development
    and best practices around optimization and AB/MVT testing.
  - Experience with Agile software development methodologies
    (Scrum, Kanban)
  - Knowledge of Cloud architectures, services, and DevOps
    practices within Amazon AWS, Microsoft Azure, Google, etc.
  - Advanced proficiency with the following technologies: Native
    JavaScript; Front end web technologies, including Angular,
    Node, Bootstrap/Material Design, CSS3 and HTML5; Web
    development tools and frameworks, including - CSS
    preprocessing, e.g. LESS/SAAS; Front end build tools, e.g.
    Gulp, Grunt, Webpack; JavaScript testing frameworks, e.g.
    Jasmine, Karma;  Front end components, e.g. Bower;
    JavaScript compression and minification, e.g. Uglify;
    Developer/Build tools, including GIT and Jenkins;  Code
    analysis tools such as PMD, Checkstyle, Findbugs and
    Sonar.
  - Experience consuming RESTful web services.
  - Understanding of web performance optimization techniques.
  - Experience integrating with Content Management Systems such
    as Drupal.
  - Experience with enterprise monitoring tools, such as
    Solarwinds, vROPS, SPLUNK. TeaLeaf
  - Demonstrates accountability, sound decision making,
    analytical thoroughness, and clear and concise
    communications
  
  MINIMUM QUALIFICATIONS:
  
  - Bachelors degree in Computer Science, Engineering, or a
    related discipline; and/or 10 years of related experience.
  - Minimum of 8 years of experience in software development
    with a focus on web and mobile technologies, including
    previous experience in development of highly-
    transactional, mission-critical applications in
    environments/architectures for multi-user systems
  
  Additional Job Description: * Partner with product managers,
  data scientists, and business stakeholders to identify and
  prioritize GenAI use cases. * Translate business challenges
  (e.g., inefficiency, risk exposure, customer friction) into
  AI‑enabled solutions. * Build and maintain core services,
  APIs, and orchestration pipelines that integrate LLMs and
  agentic workflows with enterprise data and applications. *
  Align platform design with enterprise architecture
  principles, including scalability, security, observability,
  and resilience. * Implement robust access controls,
  auditability, and compliance with AI governance and ethical
  standards.
  
  Pay Range:
  
  $132,600- $182,250 DOE.
  
