  The AI Automation Engineer – Sales & Marketing is a hands-on
  technical role focused on building AI-driven workflows that
  accelerate revenue generation and reduce friction across the
  commercial engine at Cengage. You will partner directly with
  sales operations, marketing, and RevOps leaders to identify
  high-value automation opportunities and ship weekly
  improvements.
  
  This role sits at the intersection of GTM systems, AI/ML
  capabilities, and enterprise automation. The ideal candidate
  knows Salesforce deeply, has built against marketing
  automation platforms, and can rapidly prototype AI-powered
  improvements to proposal generation, lead qualification, and
  campaign execution. You should be equally comfortable in a
  code editor and on a quarterly business review with sales
  leadership.
  
  Key Responsibilities
  
  Revenue-Focused AI Automation
  
  - Automate proposal generation, contract drafting, and RFP
    response workflows using LLMs and document AI
  - Build AI-powered lead qualification, scoring, and routing
    systems integrated with Salesforce
  - Automate campaign workflows across marketing platforms
    (Marketo, HubSpot, Salesforce Marketing Cloud)
  - Develop AI assistants for sales reps to accelerate account
    research, call prep, and follow-up
  - Create intelligent content generation pipelines for
    marketing collateral, email copy, and personalization
  
  Salesforce & GTM Systems Integration
  
  - Integrate AI capabilities directly into Salesforce via Apex,
    Flow, and Einstein AI platforms
  - Build API integrations between CRM, CPQ, marketing
    automation, and enrichment platforms (ZoomInfo, Clearbit)
  - Identify and resolve workflow friction points slowing down
    pipeline velocity
  - Instrument workflows with telemetry to surface bottlenecks
    and measure automation impact
  - Partner with RevOps on data quality, hygiene, and enrichment
    automation
  
  Continuous Improvement & Delivery
  
  - Deliver continuous weekly improvements to deployed workflows
    based on user feedback
  - Quantify proposal cycle time reduction, pipeline velocity
    gains, and rep productivity lift
  - Partner with sales and marketing stakeholders to identify
    the next tranche of opportunities
  - Maintain documentation, onboarding materials, and runbooks
    for all deployed automations
  - Monitor production workflows for reliability, drift, and
    edge case handling
  
  Required Qualifications
  
  - Bachelor's degree in Computer Science, Engineering,
    Information Systems, or related field
  - 4+ years of experience in automation engineering, software
    development, or RevOps/MarOps engineering
  - Strong proficiency in Python and experience building
    production automation
  - Hands-on experience with LLMs and modern AI APIs (OpenAI,
    Anthropic, AWS Bedrock)
  - Deep experience with Salesforce — administration, Flow,
    Apex, or Salesforce APIs
  - Experience with at least one major marketing automation
    platform (Marketo, HubSpot, Pardot, Eloqua)
  - Strong understanding of B2B sales and marketing processes
    and KPIs
  - Excellent communication skills to work with revenue
    leadership and technical stakeholders
  
  Preferred Qualifications
  
  - Salesforce certifications (Administrator, Platform
    Developer, Sales Cloud Consultant)
  - Experience with CPQ platforms (Salesforce CPQ, Conga,
    PandaDoc)
  - Background in proposal automation or contract intelligence
    platforms
  - Experience with data enrichment platforms (ZoomInfo,
    Clearbit, Apollo)
  - Familiarity with agentic AI frameworks (LangChain, CrewAI,
    AutoGen)
  - Experience in EdTech or enterprise B2B SaaS environments
  
  Tools & Technologies
  
  You should be comfortable with many of the following:
  
  - Languages: Python, JavaScript/TypeScript, SQL, Apex
  - AI/ML: OpenAI API, Anthropic API, AWS Bedrock, LangChain
  - Salesforce: Flow, Apex, Einstein, Salesforce APIs, CPQ
  - Marketing: Marketo, HubSpot, Salesforce Marketing Cloud,
    Pardot
  - Automation: n8n, Zapier, Workato, Tray.io
  - Analytics: Salesforce reports, Tableau CRM, Snowflake
  
  Key Competencies
  
  - Revenue Mindset — instinctively ties automation work to
    pipeline, cycle time, and deal velocity
  - Systems Thinking — sees the full GTM system and how
    automations cascade across it
  - Rapid Delivery — ships weekly improvements and iterates
    based on user feedback
  - Stakeholder Partnership — earns trust of sales leaders,
    marketers, and RevOps
  - Technical Pragmatism — chooses the right tool for the job
    rather than over-engineering
  - Business Acumen — translates technical capability into
    revenue and efficiency language
  
  What We Offer
  
  - Opportunity to shape AI at scale across a global learning
    company
  - Direct impact on business outcomes, product, and workforce
    productivity
  - Access to cutting-edge AI tools, platforms, and technologies
  - Collaborative team environment focused on innovation and
    continuous improvement
  - Professional development and learning opportunities
  
