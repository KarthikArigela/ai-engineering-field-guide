description: |
  What's the role?
  
  You will contribute across the entire software development
  lifecycle—from shaping product vision and architecture to
  building, testing, releasing, and supporting
  production‑grade systems—while collaborating with
  cross‑functional teams to meet product and quality
  expectations.
  
  - Design, develop, and maintain scalable, reusable, and
    reliable backend services using Java, Scala, and
    cloud‑native AWS technologies
  - Build and enhance automated and semi‑automated map data
    processing pipelines, including service layers and
    dashboards for tracking, analytics, and operational
    insights
  - Drive AI‑assisted and agentic workflows, including:
  - Leveraging AI tools for coding productivity, refactoring,
    and documentation
  - Evaluating and building POCs using AI/ML or open‑source APIs
    to solve business and data automation challenges
  - Own services end‑to‑end, including CI/CD pipelines, testing
    strategies, monitoring, and DevOps practices
  - Analyse product requirements and technical designs to
    deliver high‑quality software aligned with performance and
    reliability standards
  - Collaborate closely with Lead and Principal Engineers on
    architecture, design decisions, and code/configuration
    reviews
  - Mentor and guide junior engineers on technical best
    practices and problem‑solving approaches
  - Partner with other engineering teams and internal customers
    to identify new opportunities and solve complex backend
    and platform challenges
  - Continuously evaluate, adopt, and scale newer technologies
    and development tools, with a strong openness to
    innovation and automation
  
  Who are you?
  
  - B.E. / B.Tech in Computer Science, Computer Engineering, or
    equivalent
  - 7+ years of professional software development experience
  - Strong proficiency in Java and Scala, with hands‑on backend
    design experience
  - Solid experience with AWS services (e.g., SQS, SNS, EMR,
    serverless architectures, distributed processing)
  - Experience with event‑driven and asynchronous architectures
  - Expertise in RESTful services, JSON, and XML
  - Experience with relational databases and SQL, preferably
    PostgreSQL and/or Oracle
  - Hands‑on experience with CI/CD, version control, and
    collaboration tools (Git/Gerrit, JIRA, Wikis)
  - Strong analytical, problem‑solving, and communication skills
  - Ability to manage multiple competing priorities in a
    fast‑paced, global engineering environment
  - Demonstrated ownership mindset, curiosity, and willingness
    to rapidly learn and adopt new technologies—including
    AI‑assisted development tools
  
  What we offer
  
  HERE offers an opportunity to work in a cutting-edge
  technology environment with challenging problems to solve!
  You can make a direct impact on delivery of company´s
  strategic goals and the freedom to decide how to perform
  your work. We will support you in delivering your day-to-day
  tasks and achieving your personal goals and developing your
  skills. Personal development is highly encouraged at HERE.
  You can take different courses and training at our online
  Learning Campus and join cross-functional team projects
  within our Talent Platform.
  
  HERE is an equal opportunity employer. We evaluate qualified
  applicants without regard to race, color, age, gender
  identity, sexual orientation, marital status, parental
  status, religion, sex, national origin, disability, veteran
  status, and other legally protected characteristics.
  
  Who are we?
  
  HERE Technologies is a location data and technology platform
  company. We empower our customers to achieve better outcomes
  – from helping a city manage its infrastructure or a
  business optimize its assets to guiding drivers to their
  destination safely.
  
  At HERE we take it upon ourselves to be the change we wish
  to see. We create solutions that fuel innovation, provide
  opportunity and foster inclusion to improve people’s lives.
  If you are inspired by an open world and driven to create
  positive change, join us. Learn more about us on our YouTube
  Channel.
  
  As a Lead Software Engineer you will work across multiple
  high‑impact initiatives, including integrating AI into core
  backend systems to enable smarter, faster, and more
  automated software delivery. You will also contribute to a
  Deviation Detection platform focused on identifying
  discrepancies between real‑world conditions and map data,
  and automating detection, validation, and correction
  workflows at scale.
