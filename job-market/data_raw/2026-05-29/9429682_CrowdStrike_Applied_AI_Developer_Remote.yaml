description: |
  As a global leader in cybersecurity, CrowdStrike protects
  the people, processes and technologies that drive modern
  organizations. Since 2011, our mission hasn’t changed —
  we’re here to stop breaches, and we’ve redefined modern
  security with the world’s most advanced AI-native platform.
  Our customers span all industries, and they count on
  CrowdStrike to keep their businesses running, their
  communities safe and their lives moving forward. We’re also
  a mission-driven company. We cultivate a culture that gives
  every CrowdStriker both the flexibility and autonomy to own
  their careers. We’re always looking to add talented
  CrowdStrikers to the team who have limitless passion, a
  relentless focus on innovation and a fanatical commitment to
  our customers, our community and each other. Ready to join a
  mission that matters? The future of cybersecurity starts
  with you.
  
  About the Role: The HR Data and Analytics (HRDA) team is
  looking for an Applied AI Developer to join us. The HRDA
  team designs, builds, and operates internal AI systems that
  power HR processes: agentic applications, workflow
  automations, data pipelines, and integrations with
  enterprise platforms. This team member will focus on
  building the shared infrastructure and tooling that our
  growing portfolio of AI-powered systems depends on, while
  also contributing directly to individual applications.
  
  This is an exciting opportunity for someone who wants to
  grow their career in applied AI and platform engineering.
  Our team operates a multi-agent ecosystem: several
  autonomous and interactive AI applications that share common
  patterns for LLM integration, data access, monitoring, and
  deployment. This team member will help build and maintain
  the infrastructure layer that ties these systems together,
  develop new agentic applications as needs emerge, support
  DevOps workflows, and experiment with emerging frameworks
  and interfaces. They will also have the freedom to recommend
  and implement best practices across our stack.
  
  Strong candidates will possess an analytical mindset, the
  ability to think at the system design level while
  maintaining a deep understanding of how code behaves at the
  implementation level, and strong written communication
  skills. In an AI-assisted development environment where
  tools like Claude Code are part of the daily workflow, the
  ability to articulate precise technical intent and
  critically evaluate generated output is as valuable as
  writing code directly.
  
  As a remote employee on a distributed team, you will not
  have direct access to co-workers for the entire workday, so
  the ability to work independently, communicate
  asynchronously, and proactively maintain alignment is
  critical. We value enthusiastic individuals who bring
  positivity to their work and are motivated to deliver high-
  quality solutions for our internal stakeholders.
  
  What You’ll Do:
  
  - Design and develop new AI-powered applications with browser-
    based and
  - conversational interfaces to support modern HR functions.
  - Build and maintain shared infrastructure that supports a
    growing portfolio of agentic AI applications, including
    AWS EC2 servers, Airflow workflows, CI/CD pipelines, and
    Snowflake integrations.
  - Integrate LLM APIs into enterprise applications and HR
    workflows, delivering tangible AI-powered features.
  - Partner with HR stakeholders to translate needs into AI
    solutions that improve the employee experience.
  - Collaborate with data scientists to deploy and manage AI
    systems, ensuring scalability, reliability, and
    efficiency.
  - Experiment with and implement agentic frameworks to extend
    future AI capabilities.
  
  What You’ll Need:
  
  - 5-7 years of experience pushing technical work forward in
    innovative ways, including but not limited to: analytics,
    data science, software engineering, or another technical
    discipline.
  - Proficiency in Python.
  - A genuine curiosity about how systems work and a drive to
    build excellent products.
  - Comfort working with AI-assisted development tools (Claude
    Code or equivalent) as a core part of your workflow,
    including the judgment to critically evaluate and refine
  - generated output.
  - Familiarity with cloud infrastructure, workflow
    orchestration, and CI/CD practices.
  - Experience working with APIs, web applications, and data
    pipelines.
  - Exposure to data warehouses (Snowflake or similar).
  - Strong problem-solving skills, self-motivation, and the
    ability to thrive in a remote-first environment.
  
  Bonus Points:
  
  - Experience building Slack apps/bots (e.g., Slack Bolt).
  - Experience building full-stack web applications.
  - Familiarity with agentic application patterns: autonomous
    agents, tool use, orchestration
  - loops.
  - Exposure to LLM APIs (Anthropic, OpenAI, etc.) and applied
    AI workflows.
  
