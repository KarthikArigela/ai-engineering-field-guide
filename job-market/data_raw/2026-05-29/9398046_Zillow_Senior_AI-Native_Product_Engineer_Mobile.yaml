title: Senior AI-Native Product Engineer, Mobile
company: Zillow
location: USA
remote: true
work_type: FULL_TIME
description: |
  About the teamThe Touring Buyer Experience team owns the
  end-to-end touring experience across Zillow’s web, iOS, and
  Android products. This team helps buyers move from intent to
  action by building seamless, reliable experiences that make
  it easier to discover, schedule, and complete home tours,
  and they do so through close collaboration across product,
  design, data, and engineering.
  
  About the role
  
  This is not a standard Senior SDE role. We are looking for
  mobile product builders: engineers who can take a problem
  from an ambiguous idea to a shipped, instrumented, and
  continually improving mobile experience product.
  
  
  In this role, you will help define the problem, shape the
  solution with product and design partners, build across the
  iOS, Android and supporting services when needed, ship with
  strong operational discipline, measure what happened, and
  improve it over time. We’re looking for engineers who
  combine strong technical judgment with product sense,
  business context, and a modern AI-native way of working. AI
  tools are part of normal execution here—for exploration,
  coding, testing, debugging, and analysis—but ownership does
  not move to the tool. You remain accountable for quality,
  correctness, customer experience, and results. Success in
  this role looks like turning a fuzzy ask into a clear plan,
  making tradeoffs explicit, shipping with the right
  safeguards, and learning from what happens in production.
  
  You Will Get To
  
  - Turn ambiguous product ideas into clear plans, tradeoffs,
    success measures, and shippable solutions.
  - Shape mobile experiences across iOS and Android with strong
    product and platform judgment.
  - Partner closely with product, design, data, and engineering
    peers to refine requirements and improve the customer
    experience.
  - Build primarily in native mobile codebases while
    contributing to backend or API layers when needed to
    deliver the full experience.
  - Launch features with an appropriate approach to testing,
    rollout, monitoring, and risk management.
  - Follow features into production, evaluate performance and
    customer behavior, and iterate based on what you learn.
  - Strengthen the team through code review, design feedback,
    mentoring, and high engineering standards.
  
  This role has been categorized as a Remote position.
  “Remote” employees do not have a permanent corporate office
  workplace and, instead, work from a physical location of
  their choice, which must be identified to the Company. U.S.
  employees may live in any of the 50 United States, with
  limited exceptions.
  
  In California, Connecticut, Maryland, Massachusetts, New
  Jersey, New York, Washington state, and Washington DC the
  standard base pay range for this role is $160,900.00 -
  $257,100.00 annually. This base pay range is specific to
  these locations and may not be applicable to other
  locations.
  
  In Colorado, Hawaii, Illinois, Minnesota, Nevada, Ohio,
  Rhode Island, and Vermont the standard base pay range for
  this role is $152,900.00 - $244,300.00 annually. The base
  pay range is specific to these locations and may not be
  applicable to other locations.
  
  In addition to a competitive base salary this position is
  also eligible for equity awards based on factors such as
  experience, performance and location. Actual amounts will
  vary depending on experience, performance and location.
  Employees in this role will not be paid below the salary
  threshold for exempt employees in the state where they
  reside.
  
  Who you are
  
  - You have significant experience building and shipping
    production mobile applications on iOS or Android, with
    strong depth in one platform and the ability or
    willingness to contribute to the other.
  - You have a track record of owning features end to end, from
    ambiguous problem definition through launch and post-
    launch iteration.
  - You bring strong product and business judgment and can
    connect technical decisions to customer impact.
  - You have practical experience using AI-assisted development
    tools or automation in your day-to-day work, while
    maintaining accountability for quality, correctness, and
    customer experience.
  - You collaborate effectively with cross-functional partners,
    including product managers, designers, data partners, and
    other engineers.
  - You are comfortable working across the stack when needed,
    including mobile clients, APIs, services, and data-
    informed decision-making.
  - You bring strong operational discipline, including
    experience with production support, monitoring, debugging,
    and using signals to guide improvements.
  - Here at Zillow, we value the experience and perspective of
    candidates with non-traditional backgrounds. We encourage
    you to apply if you have transferable skills or related
    experiences.
  
  Get to know us
  
  At Zillow, we’re reimagining how people move—through the
  real estate market and through their careers. As the most-
  visited real estate platform in the U.S., we help customers
  navigate buying, selling, financing and renting with greater
  ease and confidence. Whether you're working in tech, sales,
  operations, or design, you’ll be part of a company that's
  reshaping an industry and helping more people make home a
  reality.
  
  Zillow is honored to be recognized among the best workplaces
  in the country. Zillow was named one of FORTUNE 100 Best
  Companies to Work For® in 2025, and included on the PEOPLE
  Companies That Care® 2025 list, reflecting our commitment to
  creating an innovative, inclusive, and engaging culture
  where employees are empowered to grow.
  
  No matter where you sit in the organization, your work will
  help drive innovation, support our customers, and move the
  industry—and your career—forward, together.
  
  Zillow Group is an equal opportunity employer committed to
  fostering an inclusive, innovative environment with the best
  employees. We are committed to equal employment opportunity
  regardless of race, color, ancestry, religion, sex, national
  origin, sexual orientation, age, citizenship, marital
  status, disability, gender identity or Veteran status. If
  you have a disability or special need that requires
  accommodation, please contact your recruiter directly.
  
  Qualified applicants with arrest or conviction records will
  be considered for employment in accordance with applicable
  state and local law.
  
  Los Angeles County applicants: Job duties for this position
  include: work safely and cooperatively with other employees,
  supervisors, and staff; adhere to standards of excellence
  despite stressful conditions; communicate effectively and
  respectfully with employees, supervisors, and staff to
  ensure exceptional customer service; and follow all federal,
  state, and local laws and Company policies. Criminal history
  may have a direct, adverse, and negative relationship with
  some of the material job duties of this position. These
  include the duties and responsibilities listed above, as
  well as the abilities to adhere to company policies,
  exercise sound judgment, effectively manage stress and work
  safely and respectfully with others, exhibit trustworthiness
  and professionalism, and safeguard business operations and
  the Company’s reputation. Pursuant to the Los Angeles County
  Fair Chance Ordinance, we will consider for employment
  qualified applicants with arrest and conviction records.
