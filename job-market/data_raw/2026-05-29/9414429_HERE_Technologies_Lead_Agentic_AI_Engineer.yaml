description: |
  What's the role?
  
  We are looking for a Machine Learning - Agentic AI Lead
  Engineer to improve the performance and efficiency of modern
  AI models in real-world applications.
  
  You will focus on adapting and optimizing models for
  specific behaviors, improving their ability to interact with
  systems, follow structured workflows, and operate reliably
  in production environments.
  
  This role combines hands-on experimentation with applied
  research, requiring a strong understanding of model
  behavior, data, and evaluation.
  
  - Advanced System Design & Implementation: Design and
    implement complex system logic for AI-driven workflows and
    interactions. Lead development of reusable components and
    scalable system patterns. Integrate multiple services,
    models, and data sources into cohesive systems.
  - Model Optimization & Adaptation: Optimize model performance
    for specific behaviors and use cases. Improve model
    reliability, consistency, and response quality in
    structured tasks. Tune models to better interact with
    external systems and tools.
  - Fine-Tuning & Training: Apply fine-tuning techniques (e.g.,
    LoRA, QLoRA) to adapt models efficiently. Experiment with
    parameter-efficient approaches to improve performance
    while controlling cost.
  - Data & Evaluation: Design and generate high-quality
    datasets, including synthetic data where appropriate.
    Develop evaluation methods to measure improvements in
    model behavior and outputs. Iterate quickly based on
    experimental results.
  - Experimentation & Iteration: Run experiments to improve
    model performance across different scenarios. Analyze
    trade-offs between accuracy, cost, and latency. Stay up to
    date with emerging techniques and apply them
    pragmatically.
  
  Who are you?
  
  - Degree in Computer Science, Machine Learning, Data Science,
    or related field.
  - 8+ years of professional engineering experience, including
    3+ years of hands-on experience building modern AI/ML
    models, LLM-based applications, or agentic AI systems.
  - Experience with fine-tuning techniques (e.g., LoRA, QLoRA or
    similar approaches).
  - Strong experience in Rust, Typescript, Python skills and
    with ML frameworks (e.g., PyTorch, TensorFlow).
  - Experience working with datasets, evaluation, and
    experimentation workflows.
  - Analytical mindset with strong problem-solving skills.
  
  What we offer:
  
  - Hybrid model of work
  - Challenging problems to solve
  - Collaborative and encouraging colleagues
  - Opportunities to learn, grow and develop: company
    hackathons, technical talks, and trainings
  - Regular feedbacks
  - Paid vacation days
  - A great work-life balance
  - Flexible working hours
  - Competitive salary plus bonus
  - Diverse team of fantastic & talented people from 60+
    countries worldwide.
  - Brown bag talks, team events, BBQ on the rooftop and more!
  
  Change is HERE. Apply Now!
  #LI-MM3 #LI-HYBRID
  
