description: |
  We're looking for a Lead Software Engineer who can guide and
  grow a small team of frontend engineers while remaining a
  hands-on, high-output individual contributor. This role is
  not about producing baseline code quickly. AI can do that.
  It's about engineering judgment, clear direction, technical
  quality, and team leverage.
  
  You will partner closely with a Product Lead (and design,
  data, and backend partners) to shape scope, define
  milestones, and break work into well-scoped tasks that can
  be delivered predictably. You'll set expectations around
  quality, testing, and production readiness—especially in
  fast-moving, AI-assisted development environments.
  
