title: AI Partner Engineer
company: Life360
location: USA
work_type: FULL_TIME
description: |
  About Life360
  
  Life360’s mission is to keep people close to the ones they
  love. Our category-leading mobile app,Tile tracking devices,
  and Pet GPS tracker empower members to protect the people,
  pets, and things they care about most with a range of
  services, including location sharing, safe driver reports,
  and crash detection with emergency dispatch. Life360 serves
  approximately 97.8 million monthly active users (MAU), as of
  March 31, 2026, across more than 180 countries.
  
  Life360 delivers peace of mind and enhances everyday family
  life with seamless coordination for all the moments that
  matter, big and small. By continuing to innovate and deliver
  for our customers, we have become a household name and the
  must-have mobile-based membership for families (and those
  friends who are basically family).
  
  Life360 has more than 500 (and growing!) remote-first
  employees. For more information, please visit life360.com.
  Life360 is a Remote-First company, which means a remote work
  environment will be the primary experience for all
  employees. All positions, unless otherwise specified, can be
  performed remotely (within the US) regardless of any
  specified location above.
  
  We are AI Native
  
  We are building an AI native company where AI is an integral
  part of how we build and operate. AI tool usage during
  interviews varies by role. You may be asked to demonstrate
  proficiency with AI tools, discuss how you leverage AI, or
  complete interview exercises without AI assistance. Your
  Recruiter will provide clear guidance as you move through
  the interview process.
  
  Undisclosed use of AI not previously discussed with or
  approved by your Recruiter may impact your candidacy.
  
  About The Team
  
  The AI Native Platform team is a cross-functional
  engineering organization built to lay the infrastructure
  foundations for Life360's AI-native transformation. We are
  not exploring what might be possible — we are building the
  platform that makes it operational.
  
  The team works across four interconnected areas: how Life360
  safely accesses and governs the use of frontier AI models
  and external integrations; the agent deployment and workflow
  infrastructure that lets teams build, test, version, and
  operate autonomous agents with the same rigor applied to any
  production software; how we safely democratize data,
  information, and knowledge across the organization — making
  it queryable and usable by AI systems and humans reliably;
  and a multiplayer AI workbench that gives every employee a
  purpose-built environment tuned to their role, with relevant
  tools, knowledge, and workflows rather than a general-
  purpose chat interface.
  
  The work is deliberate, high-velocity, and built to last.
  The bar is high: real use cases, production deployments,
  measurable outcomes.
  
  The End User Workbench is where the platform meets the
  organization — and closing that gap requires more than good
  infrastructure. This role exists at that boundary, and on
  both sides of it. You will be forward-deployed into business
  functions across Life360 — Marketing, Legal, Finance,
  People, Revenue — building AI-native solutions for the
  people you work alongside and increasing their ability to
  build for themselves. What you learn in the field comes back
  to the platform: this role contributes directly to the
  design and build of the Workbench itself, shaping how it
  serves a workforce that is not all engineers. The form that
  it takes will evolve as the platform matures. What won't
  change is the expectation that you are a builder in both
  directions — out into the organization, and back into the
  product.
  
  About the Job
  
  We are hiring an AI Partner Engineer to be the dedicated AI
  transformation partner for the business functions at
  Life360. You will embed for the long term — not parachute in
  with a solution — becoming the go-to person for departments
  like People, Finance, Legal, Marketing, and Revenue as they
  move through their own AI-native journey. Your job is to
  raise fluency not by running training sessions but by
  working alongside people on real problems until they can
  scope, design, and own their own agentic workflows. That
  shift takes time and it takes trust.
  
  Building is how you earn both. The goal is to develop
  agentic workflows with the teams you support — not for them.
  Every engagement starts the same way: learn how a function
  operates, identify the workflows worth building agents
  around, and build alongside them using the platform stack
  the team is assembling. Sometimes you start alone to show
  what's possible. Sometimes you build agents side by side
  from the first line. You read the room, adapt, and stay
  present through the iteration that produces adoption.
  
  You will sit within the AI Native Platform team, reporting
  to the Director of IT, and contribute to the End User
  Workbench as a product that has to work for people who are
  not engineers. What you learn in the field shapes how that
  platform evolves — and in some cases you will build directly
  into it to serve the specific needs of the functions you
  support.
  
  Part of this role is knowing when not to build. Some of
  what's on the market genuinely solves workflow problems at
  scale for specific functions. You will help the departments
  you support evaluate those options with clear eyes —
  separating real capability from vendor noise — and make
  honest recommendations about when to buy versus when to
  build.
  
  Life360's systems carry real-time location data and family
  relationship graphs for tens of millions of people,
  including minors. How AI and agents interact with that data
  is not a secondary concern. It is built into the design
  brief from the start.
  
  The US-based salary range for this position is $148,000 to
  $216,500 USD. For candidates based out of Canada, the salary
  range is $171,500 to $201,000 CAD. We take into
  consideration an individual's background and experience in
  determining final salary — therefore, base pay offered may
  vary considerably depending on geographic location, job-
  related knowledge, skills, and experience. The compensation
  package includes a wide range of medical, dental, vision,
  financial, and other benefits, as well as equity.
  
  What You'll Do
  
  - Embed in each function before building anything — learn how
    work actually moves, surface the workflows worth
    automating, and build them using the platform stack the
    team is assembling. Production adoption is the metric, not
    a polished demo.
  - Configure and deploy the End User Workbench for each
    function you support — tailored to how that team actually
    works, not a generic starting point.
  - Scope, build, and ship agentic workflows in production
    across business functions like legal review, financial
    operations, marketing, HR, and revenue. These are not
    prototypes.
  - Evaluate AI-native vendor solutions alongside the functions
    you support — separating genuine capability from hype and
    making honest build-versus-buy recommendations. When
    something real exists, recommend it. When it doesn't,
    build it.
  - Work alongside people on real problems until they can scope,
    build, and own their own agent workflows. The measure is
    when teams you support are shipping without you.
  - Support your partners through agent ownership — what it
    means to maintain a workflow when you've never operated
    software before. You'll work through those questions in
    practice, not in theory.
  - Return field signal to the platform. What you learn forward-
    deployed shapes how the End User Workbench evolves — and
    in some cases you will build the solution directly into
    it.
  - Partner with Legal, Privacy, and Security to keep data
    boundaries built into every workflow from the start — not
    appended at the end.
  - Document what works — configuration templates, workflow
    patterns, and deployment approaches that make the next
    engagement faster and safer.
  
  What We're Looking For
  
  - A track record of building and shipping technology solutions
    that run in production — agentic workflows and LLM-powered
    applications, or automation pipelines and custom
    integrations built for specific business functions.
  - Product management instincts paired with engineering
    execution. You can surface what a non-technical team
    actually needs — not just what they ask for — and
    translate it into something buildable.
  - Strong judgment on the AI vendor market — you follow what's
    being built, separate genuine capability from positioning,
    and can make and defend a build-versus-buy call.
  - The ability to build trust with non-engineering teams and
    stay embedded through slow, non-linear organizational
    change. Patient without being passive.
  - Clear communication in both directions — you can explain
    agentic workflows to someone who has never written code,
    and explain why a business process is hard to automate to
    an engineer. Both need to land.
  - Comfort with ambiguity. The working model for this role is
    being built alongside you — you are energized by that, not
    destabilized.
  - Genuine awareness of what it means to build with sensitive
    data — location, relationships, minors. You treat data
    boundaries as design inputs, not compliance steps.
  - A background that spans technical delivery and cross-
    functional collaboration — solutions engineering,
    corporate IT, AI product work, or a combination. The title
    matters less than whether you've done the work.
  - Bachelor's degree or equivalent experience.
  
  Bonus points if you have:
  
  - Deep familiarity with one or more of the business functions
    this role serves — legal operations, financial operations,
    marketing, HR, or revenue operations — and the workflow
    patterns specific to how those teams work.
  - Experience with workflow orchestration frameworks and
    agentic tooling — LangChain, LangGraph, Tray, or similar —
    and an opinion on when to use them and when not to.
  - Background contributing to the design or development of
    internal AI tooling, enterprise platforms, or business
    function-specific technology.
  - Experience navigating technology adoption or change
    management in non-engineering teams.
  
  Our Benefits
  
  - Competitive pay and benefits
  - Medical, dental, vision, life and disability insurance plans
    (100% paid for employees)
  - 401(k) plan with company matching program
  - Mental Wellness Program & Employee Assistance Program (EAP)
    for mental well-being
  - Flexible PTO, 13 company-wide days off throughout the year
  - Winter and Summer Weeklong Synchronized Company Shutdowns
  - Learning & Development programs
  - Equipment, tools, and reimbursement support for a productive
    remote environment
  - Free Life360 Platinum Membership for your preferred circle
  - Free Tile Products
  
  Life360 Values
  
  Our company's mission-driven culture is guided by our shared
  values to create a trusted work environment where you can
  bring your authentic self to work and make a positive
  difference.
  
  - Be a Good Person — We have a team of high integrity people
    you can trust.
  - Be Direct With Respect — We communicate directly, even when
    it's hard.
  - Members Before Metrics — We focus on building an exceptional
    experience for families.
  - High Intensity, High Impact — We do whatever it takes to get
    the job done.
  
  Our Commitment to Diversity
  
  We believe that different ideas, perspectives and
  backgrounds create a stronger and more creative work
  environment that delivers better results. Together, we
  continue to build an inclusive culture that encourages,
  supports, and celebrates the diverse voices of our
  employees. It fuels our innovation and connects us closer to
  our customers and the communities we serve. We strive to
  create a workplace that reflects the communities we serve
  and where everyone feels empowered to bring their authentic
  best selves to work.
  
  We are an equal opportunity employer and value diversity at
  Life360. We do not discriminate on the basis of race,
  religion, color, national origin, gender, sexual
  orientation, age, marital status, veteran status, disability
  status or any legally protected status.
  
  We encourage people of all backgrounds to apply. We believe
  that a diversity of perspectives and experiences create a
  foundation for the best ideas. Come join us in building
  something meaningful. Even if you don't meet 100% of the
  below qualifications, you should still seriously consider
  applying!
  
