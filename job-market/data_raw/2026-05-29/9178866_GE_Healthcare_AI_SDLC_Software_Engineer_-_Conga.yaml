description: |
  Job Description SummaryWe are looking for a highly skilled
  and experienced Salesforce and Apttus CPQ/CLM Developer with
  a strong foundation in enterprise application development
  and a passion for emerging technologies like Agentforce,
  Kiro, and Generative AI (GenAI). This role involves building
  scalable, intelligent solutions that enhance our commercial
  sales processes and integrate seamlessly with enterprise
  systems using AI tools. GE HealthCare is a leading global
  medical technology and digital solutions innovator. Our
  purpose is to create a world where healthcare has no limits.
  Unlock your ambition, turn ideas into world-changing
  realities, and join an organization where every voice makes
  a difference, and every difference builds a healthier world.
  
  Job DescriptionKey Responsibilities:
  
  - Design, develop, and implement solutions using Apttus
    CPQ/CLM and Salesforce Force.com platforms.
  - Sound Knowledge and hands on experience on SF Agent force is
    must.
  - Build and customize product models, pricing rules, quote
    templates, and contract workflows.
  - Develop intelligent features using AI/ML models, Agentforce,
    and GenAI tools to enhance user experience and automation.
  - Integrate Microsoft Copilot and other AI assistants into
    Salesforce workflows to improve productivity and decision-
    making.
  - Collaborate with product managers, business analysts, and QA
    teams to translate business requirements into technical
    solutions.
  - Develop custom components using Apex, Visualforce, and
    Lightning Web Components (LWC).
  - Perform data migrations using tools like Apex Data Loader,
    X-Author, and Excel Connector.
  - Integrate Salesforce with external systems such as Oracle
    ERP using SOA, Informatica, or other middleware
    technologies.
  - Participate in Agile ceremonies, design workshops, and
    sprint planning sessions.
  - Ensure code quality, performance, and scalability through
    testing and optimization.
  
  
  
  Required Qualifications:
  
  - Bachelor’s degree in Computer Science or a related field.
  - 4+ years of hands-on development experience in Salesforce
    and  Apttus CPQ/CLM.
  - Strong experience in building custom functionalities and
    bolt-on capabilities within the Salesforce ecosystem.
  - Proficient in Apex, Visualforce, LWC, and Salesforce
    configuration/customization.
  - Proficient in AI/ML integration, Agentforce, or GenAI-based
    tools.
  - Familiarity with Copilot integration in enterprise
    environments.
  - Experience with data migration tools and techniques.
  - Solid understanding of CPQ/CLM processes, including product
    modeling, pricing, quoting, and contract lifecycle.
  - Experience integrating Salesforce with Oracle ERP and other
    enterprise systems.
  
  Preferred Qualifications:
  
  - Experience working in Agile/Iterative development
    environments.
  - Familiarity with Java, C#, Python or other object-oriented
    programming languages.
  - Exposure to performance testing and optimization techniques.
  - Ability to work with remote teams across time zones.
  - Strong communication skills and ability to explain technical
    concepts to non-technical stakeholders.
  - Proactive learner with a passion for AI-driven innovation
    and continuous improvement.
  
