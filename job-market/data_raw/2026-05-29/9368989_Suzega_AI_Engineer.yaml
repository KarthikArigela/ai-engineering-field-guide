description: |
  What You’ll Do
  
  - Develop, implement, and maintain AI systems
  - Develop algorithms and build predictive models
  - Ensure quality and accuracy of training data
  - Deploy and maintain AI models in production
  - Transform machine learning models into APIs that can be
    integrated with other applications
  - Collaborate with Data Engineers to build and manage data
    pipelines for AI/ML workflows
  - Work with AI Architects to ensure AI solutions meet business
    requirements and quality attributes
  
  Requirements
  
  What you’ll Bring
  
  Experience designing, developing, and deploying enterprise-
  grade AI/ML solutions, with a strong emphasis on production
  ready systems Expert-level proficiency in Python and core
  AI/ML frameworks (TensorFlow, PyTorch, scikit-learn), with a
  deep understanding of machine learning algorithms and deep
  learning architectures Hands-on experience architecture and
  building secure, scalable, and flexible enterprise data
  projects in Azure, AWS or GCP Effective communication skills
  (verbal, written, presentation/public speaking) Strong
  analytical and problem-solving skills Ability to work
  effectively with international and multicultural teams and
  with all levels of management
  
  How to Apply:
  
  - Describe your AI development experience and projects
  - Tell us why you are interested in joining Suzega
  
  What Happens Next:
  
  - We will review applications
  - If shortlisted, you'll participate in two virtual interviews
    with our Trusted Interviewers
  - You will have to go through a coding interview
  - We will aim to complete our selection process within two
    weeks and notify you of our decision
  
  Why This Matters
  
  At Suzega, we're not just building better AI—we're thinking
  about how AI can work better with people and society. Are
  you ready to help shape what AI can and should do? Do you
  want to use your technical skills to make a real difference?
  
  If so, we'd love to hear from you.
  
  This is more than a job. It's a chance to shape the future.
  
  Location: Work from anywhere in India
  
  Benefits
  
  Please review the Benefits & Perks section in our Team
  Member Handbook for comprehensive information.
