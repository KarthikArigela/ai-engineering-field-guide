description: |
  Job Description
  
  We are looking for a Pro Python Developer who is passionate
  about building high-quality, scalable, and efficient
  applications. The ideal candidate should have strong
  expertise in Python, databases (SQL/NoSQL), and backend
  development, with experience in APIs, microservices, and
  system integrations.
  
  While the primary focus of this role is Python development,
  candidates with experience in AI/ML model development (using
  frameworks such as TensorFlow, PyTorch, or Scikit-learn)
  will be highly valued. You will work closely with cross-
  functional teams, including data engineers and software
  developers, to deliver robust solutions and, where
  applicable, integrate AI-driven features into our
  applications and business processes.
  
  Key Responsibilities
  
  - Design, develop, and maintain robust Python applications
    with a focus on scalability, reliability, and performance.
  - Write clean, reusable, and efficient code while following
    best practices, coding standards, and version control
    workflows (Git).
  - Work with databases (SQL, NoSQL) to design schemas, optimise
    queries, and ensure efficient data storage and retrieval.
  - Build and optimise APIs / microservices for seamless
    integration across platforms and applications.
  - Collaborate closely with cross-functional teams (frontend,
    mobile, QA, DevOps) to deliver end-to-end solutions.
  - Implement and maintain CI/CD pipelines for smooth deployment
    and testing workflows.
  - Troubleshoot, debug, and optimise existing systems to ensure
    high availability and security compliance.
  - (Plus: AI/ML Expertise) – Develop and deploy AI/ML models
    using frameworks like TensorFlow, PyTorch, or Scikit-
    learn, design data pipelines, and integrate models into
    production systems.
  - Stay updated with the latest Python ecosystem advancements
    and, if applicable, trends in AI/ML to continuously
    improve solutions.
