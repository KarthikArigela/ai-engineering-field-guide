description: |
  About Concourse
  
  Concourse builds AI agents for corporate finance teams.  We
  connect core enterprise data sources and deploy AI agents
  that can analyze the data through natural language, deliver
  insights in seconds, and enable our customers to make better
  decisions. Since launching less than a year ago, Concourse
  has grown extremely rapidly. Our AI agents are deployed
  across hundreds of high-growth companies, unicorn startups
  like Persona, Front, Lightmatter, and large public companies
  - including multiple Fortune 500 customers. Concourse is
  backed by Andreessen Horowitz, CRV, YC, Standard Capital,
  and 50+ angel investors from companies like OpenAI, Cursor,
  Vercel, Brex, Carta, Rippling, 1Password, Deel, Jeeves, and
  DoorDash.
  
  About the Role
  
  We’re hiring a Founding AI & ML Engineer to play a key role
  in the engineering behind our AI agents and define how
  finance teams interact with LLMs at scale. Your mission is
  to build, optimize, and scale production-grade AI agents
  that deliver best-in-class accuracy, reliability, and
  performance for large enterprise datasets. You’ll work
  across models, prompts, infrastructure, and data systems to
  push the boundaries of what AI agents can do for finance
  teams. The right candidate will have a high ownership
  mentality, infectious energy, and technical expertise to
  move the company and engineering organization forward.
  
  Key Responsibilities
  
  - Build and Scale AI Agent Infrastructure: Architect and
    maintain systems that process hundreds of thousands of
    queries per month, ensuring accuracy, reliability, and
    performance across LLM and SQL calls.
  - Tune and Optimize Models: Improve output quality through
    fine-tuning, evaluation frameworks, and prompt engineering
    across a variety of LLMs.
  - Integrate Finance Data Sources: Work across ERPs, banks,
    CRMs, HRIS tools, and internal data models to ensure
    agents return precise, trustworthy, and contextual
    outputs.
  - Experiment with the Latest AI Advances: Evaluate new models,
    tools, and techniques; prototype quickly; and push agent
    capabilities to industry-leading performance.
  - Own Large Areas of the Product: Take full responsibility for
    major components of the agent architecture,
    infrastructure, and engineering roadmap with high
    ownership.
  - Shape Engineering Culture: Work directly with the team to
    establish standards, best practices, and a fast-moving,
    high-bar engineering environment.
  
  About You
  
  - 4+ years of software engineering experience, with strong
    systems thinking and a track record of shipping
    production-grade products
  - 2+ years of experience building AI systems, LLM
    applications, or agent-based workflows in production
    environments. Experience with LangGraph or similar
    frameworks preferred.
  - Deep experience with prompt engineering, model evaluation,
    and tuning LLM outputs for quality, consistency, and
    reliability
  - Proficient in Python and comfortable working across backend
    systems, APIs, data pipelines, and performance-critical
    infrastructure, and deployment pipelines
  - Strong debugging skills and be able to investigate issues
    across data sources, model outputs, and system interface
  - Excellent communicator who collaborates closely with product
    and engineering and can translate complex AI concepts
    clearly
  - Thrives in fast-paced, ambiguous environments and is able to
    self-direct, move quickly, and operate with high ownership
    in a startup setting
  - Experience with fintech, financial data models, or
    enterprise data systems (preferred but not required)
  - Experience leading or mentoring engineers or owning major
    technical components in a 0 to 1 environment (preferred
    but not required)
  
  Why You Should Join Us
  
  Joining Concourse is an incredible opportunity to get in at
  the ground level of a high-growth, category-defining AI
  company. Every person we hire meaningfully shapes the
  product, culture, and trajectory of the business, and we
  compensate accordingly with top-of-market salary and equity.
  You’ll have a high degree of ownership from day one. We move
  fast, build aggressively, and operate with very little
  bureaucracy. You’ll work directly with the founders and
  founding team, ship impactful work weekly, and play a core
  role in scaling the company. We’re in person 5 days a week
  in our new NYC HQ in Flatiron, where we collaborate tightly,
  iterate quickly, and build an environment that’s both high-
  energy and deeply focused. We believe the best work, and the
  fastest learnings, happen together. We care about your
  growth. You’ll get direct mentorship, opportunities to
  stretch into new skills across engineering, AI, and GTM, and
  the support of a team that wants you to succeed. This is a
  place to accelerate your career, build your brand, and make
  an outsized impact.
