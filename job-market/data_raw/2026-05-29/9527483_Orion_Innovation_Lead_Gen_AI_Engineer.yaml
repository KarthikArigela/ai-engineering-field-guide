description: |
  Orion Innovation is a premier, award-winning, global
  business and technology services firm.  Orion delivers game-
  changing business transformation and product development
  rooted in digital strategy, experience design, and
  engineering, with a unique combination of agility, scale,
  and maturity.  We work with a wide range of clients across
  many industries including financial services, professional
  services, telecommunications and media, consumer products,
  automotive, industrial automation, professional sports and
  entertainment, life sciences, ecommerce, and education.
  
  Job Overview: We are seeking a Gen AI Engineer Lead with 8+
  years of experience to play a critical role in the
  11-Delivery department. The role involves driving advanced
  solutions using Generative AI technologies and implementing
  microservices-based architectures. It requires strong
  expertise in Python and LangChain to deliver innovative
  solutions in a highly professional environment.
  
  Required Skills and Experience:
  
  - Mandatory: Generative AI expertise.
  - Proficiency in Langchain, Langraph, LLM, Cursor, RAG, MCP
  - Experience in microservices architecture.
  - Strong Python programming skills.
  - Minimum 8 years of relevant experience in software
    engineering and AI-focused roles.
  
  Key Responsibilities/(Person specifications)
  
  - Design and implement cutting-edge solutions leveraging
    Generative AI technologies.
  - Develop and maintain microservices to ensure scalable and
    efficient systems.
  - Utilize Langchain for advanced model integration and natural
    language processing workflows.
  - Create and enhance Python-based applications for data
    manipulation and AI model deployments.
  - Collaborate with cross-functional teams to meet project
    requirements and objectives.
  - Support quality assurance processes and ensure adherence to
    best practices.
  - Provide technical leadership and mentorship to team members.
  
