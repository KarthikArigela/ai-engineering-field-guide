description: |
  We’re seeking a future team member for the role of AI-
  Forward Software Engineer — AI Transformation Office, Senior
  Vice President to join our team. This role is located in
  London.
  
  We are looking for a hands-on, AI-forward engineer to build
  and ship production-grade GenAI and agentic automation
  solutions as part of BNY's centralized AI Transformation
  Office. This is not a traditional engineering role - we are
  not looking for engineers who use AI tools occasionally. We
  need engineers who have fundamentally changed how they work:
  using tools like Claude Code and Windsurf daily, moving
  faster because of it, and bringing that AI-first mindset to
  everything from architecture decisions to code reviews.
  
  In this role, you’ll make an impact in the following ways:
  
  - Analytical skills - understand the business problem first;
    leverage AI tools to accelerate solution design, not
    replace the thinking
  - Initiative & Ownership - run with tasks end-to-end, from
    scoping and prototyping to deployment, using AI-native
    tooling throughout - not just for coding, but across the
    entire workflow including design, testing, and
    documentation
  - Build and contribute to AI-forward architecture standards -
    including prompt engineering patterns, agentic workflow
    design, and LLM integration guidelines
  - Work with Product Owners, LOB stakeholders, and architects
    to design, prototype, and deliver AI-powered solutions
    spanning automation, workflow orchestration, and client-
    facing tooling
  - Participate in code reviews with an AI-first lens -
    evaluating not just the code, but how effectively AI
    tooling was leveraged in the build
  - Software engineering experience with demonstrable, recent
    use of AI-native development tools as a core part of daily
    workflow - not a side habit
  
  To be successful in this role, we’re seeking the following:
  
  - Required Skills
    - Daily proficiency with AI coding tools such as Claude Code,
      Windsurf, Cursor, or GitHub Copilot - this is a baseline
      requirement, not a differentiator
    - Python and/or Java for backend service development
    - LLM integration experience - OpenAI, Anthropic, or
      equivalent APIs
    - MCP, REST APIs, Microservices Architecture
    - Cloud platforms - AWS, Azure, or GCP
  - Preferred
    - Agentic framework experience - LangChain, LangGraph,
      AutoGen, or similar
    - RAG pipeline design and vector database experience
      (Pinecone, Weaviate, pgvector)
    - Agile / SDLC tooling - Jira, Git, CI/CD pipelines
  
  
  
