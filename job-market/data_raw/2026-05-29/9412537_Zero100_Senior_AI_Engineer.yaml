description: |
  What we do:
  
  Zero100 is a membership-based intelligence company that
  connects, informs, and inspires the world’s most influential
  C-Level Operations & Supply Chain Officers – and their teams
  – to unlock the true potential of the AI and Digital
  Revolution.
  
  Our members use Zero100’s our research, advisory services,
  data, and peer community, to sharpen strategy, challenge
  assumptions, and accelerate progress on their most important
  transformation priorities from AI adoption and digitization
  to resilience and decarbonization.
  
  With a rapidly expanding headquarters in central London,
  Zero100’s members include Nike, Walmart, Unilever, Pfizer,
  Google, Honeywell, and General Motors.
  
  Recent recognition:
  
  - 2026 King’s Award for Enterprise in the International Trade
  - The Sunday Times Best Places to Work 2025
  - The Sunday Times 100 (#43), 2025
  - LinkedIn Top 25 Start-Ups (#12), 2025
  
  What you will do:
  
  Note that this is a primarily office-based role (~4 days per
  week).
  
  As a Senior AI Engineer at Zero100, you will play a central
  role in building and scaling the AI/ML and agentic systems
  that power our research, product, and member-facing teams.
  You'll be hands-on across the full stack: designing and
  operating data pipelines, building production-grade
  intelligent systems, and prototyping new approaches to
  enhance our capabilities. This is an end-to-end role where
  you'll own projects from ideation to production, working
  collaboratively with a senior engineering lead while having
  the autonomy to drive work forward independently. You'll
  partner closely with colleagues in research, product,
  membership, and revenue operations, thriving in an
  environment where you can balance engineering rigour with
  experimentation and help shape our technical foundations as
  we scale.
  
  Responsibilities:
  
  - Design and build production-grade AI/ML and agentic systems,
    including agent orchestration, tool integration, and
    retrieval-augmented generation
  - Develop and operate scalable, reliable data pipelines that
    serve both AI/ML systems and broader research and
    analytical needs across the organisation
  - Collaborate with a senior engineering lead to architect and
    iterate on system designs, while taking ownership of
    implementation and delivery
  - Build and maintain robust infrastructure with a focus on
    deployment, monitoring, and long-term maintainability
  - Conduct exploratory prototyping of new AI/ML approaches to
    inform product direction and system design
  - Work closely with research, product, and member-facing teams
    to understand data requirements and deliver clean,
    reusable data products
  - Champion best practices around data architecture, governance
    (e.g., Unity Catalog), and performance tuning
  - Contribute to engineering standards, documentation, and
    processes as the team scales
  
  Requirements
  
  - 5 years of experience in data and ML engineering roles,
    ideally in startup or high-growth environments, with a
    track record of owning end-to-end projects
  - Experience building production-grade data pipelines and
    AI/ML systems (primarily in Python and SQL) in cloud
    environments, with an emphasis on scalability, code
    clarity, and long-term maintainability
  - Hands-on experience with Databricks, Spark, especially Delta
    Lake, Unity Catalog, Mlflow.
  - Experience working with Knowledge Graphs and building Graph
    Databases.
  - Deep familiarity with cloud platforms, particularly AWS and
    Google Cloud
  - Experience deploying and monitoring ML models in production,
    including CI/CD practices, containerization, and API
    development
  - Ability to deploy Opensource LLMs on local hardware or cloud
    platforms
  - Strong software engineering fundamentals: version control,
    testing, code review, and documentation
  - A genuine interest in agentic AI systems and emerging LLM-
    based architectures and frameworks such as
    Langchain/Langgraph/Deepagents.
  - Proven ability to manage production infrastructure and data
    architecture in a fast-paced environment
  - Strong communication skills and ability to work with
    stakeholders to understand needs and explain complex ideas
    clearly
  - Comfortable with ambiguity and excited to help shape
    processes, standards, and infrastructure as we scale
  
  Benefits
  
  - Competitive salary and bonus scheme
  - Unlimited holidays
  - Private healthcare & Life Insurance
  - Enhanced pension
  - Enhanced Parental Leave Policy
  - Custom designed offices in central London with free
    breakfasts & snacks
  
  Zero100 is an Equal Opportunity-Affirmative Action Employer,
  welcoming applications from individuals of all backgrounds.
  We embrace diversity and inclusion in our workplace.
