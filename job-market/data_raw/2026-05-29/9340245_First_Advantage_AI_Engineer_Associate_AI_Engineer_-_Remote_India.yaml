  What We Do: We are on the frontline of recruitment enabling
  organizations to Hire Smarter. Onboard Faster™ First
  Advantage is an HR Tech company delivering innovative
  solutions and insights to enable our clients to manage risk
  and hire the best talent. Leveraging an advanced technology
  platform, First Advantage builds fully scalable,
  configurable screening programs that meet the unique needs
  of over 33,000 clients. Headquartered in Atlanta, GA and
  with an internationally distributed workforce spanning 19
  countries with about 5,500 employees, First Advantage
  performs over 93 million screens in over 200 countries and
  territories annually. Who You Are: You are self-motivated
  and ready to “roll up your sleeves." While you are an
  independent contributor, you are also collaborative. You can
  spearhead a project and see it through from start to
  completion. As a team player, you navigate cross-functional
  teams and work well with team members in other business
  units and departments toward a common goal. An Innovator —
  you see gaps in current processes or workflows as an
  opportunity to improve and try something new. A lifelong
  learner and always seeking out opportunities to learn and
  upskill, you understand the importance of thorough and
  secure screenings and are interested in the Human Capital
  sector and the confluence of people, process, and
  technology. About Role: We are looking for AI engineers with
  strong and hands-on experience in building AI applications,
  more specifically Generative AI. What You'll Do
  Responsibilities:
  
  - Experienced in working with Generative AI systems and Large
    Language Models (LLM)
  - Hands-on experience with AI patterns like R.A.G, One-shot,
    Multi-shot, Natural language processing (NLP), Computer
    Vision
  - Hands-on experience with Prompt development any LLM system
  - Experience in development APIs and Services
  - Experience in cloud native application development a must,
    Microsoft Azure would be a plus.
  - Experience in any one of Typescript/Javascript or Python for
    developing AI applications
  
  What You May Need to be Successful:
  
  - Development of AI Models: Design, develop, and implement AI
    models for various applications including natural language
    processing (NLP), computer vision, speech recognition, and
    machine learning.
  - Prompt Development: Create effective prompts for AI models
    to generate accurate and relevant responses. This involves
    understanding the nuances of language and designing
    prompts that elicit desired behaviors from AI systems.
  - API-Based Services: Build scalable and robust API-based
    services that expose AI functionalities to internal and
    external stakeholders. These services should be well-
    documented, easy to use, and adhere to best practices in
    software engineering.
  - Integration with OpenAI: Leverage OpenAI's platform and
    tools to enhance AI capabilities and improve model
    performance. Collaborate with OpenAI's APIs and services
    to integrate them seamlessly into our applications.
  - Optimization and Performance Tuning: Continuously optimize
    AI models and services for performance, scalability, and
    efficiency. Implement techniques such as pruning,
    quantization, and parallelization to enhance computational
    efficiency and reduce resource consumption.
  - Testing and Validation: Develop comprehensive testing
    strategies to ensure the quality and reliability of AI
    models and services. Perform unit testing, integration
    testing, and validation testing to identify and address
    any issues or inconsistencies.
  - Documentation and Knowledge Sharing: Create documentation,
    tutorials, and guides to facilitate the usage of AI models
    and services by other team members and stakeholders. Share
    knowledge and best practices related to AI development
    within the organization.
  - Research and Innovation: Stay updated on the latest
    advancements in AI research and technology. Explore new
    techniques, algorithms, and methodologies to enhance the
    capabilities of our AI systems and drive innovation.
  - Collaboration and Communication: Work closely with cross-
    functional teams including software engineers, data
    scientists, product managers, and UX designers to
    understand requirements, gather feedback, and deliver
    impactful solutions.
  
  Nice to have:
  
  - Knowledge of Azure OpenAI or OpenAI in general
  - Hands-on experince working on Microsoft Azure Cloud
  - Full-stack development experience would be a plus
  
