description: |
  Title: QA Engineer
  
  Reporting to: Director, QA Engineering Location: Bengaluru
  (Bangalore)
  
  Opportunity:
  
  As a member of the Quality Assurance (QA) Engineering
  Department, QA Automation Engineers work closely with the
  development and Product Management teams to develop and
  deliver quality software products. The QA Automation
  Engineer will need to possess imagination and creativity,
  along with the ability to provide expert level software
  testing skills, communication skills, and experience working
  in an agile development environment.
  
  Responsibilities:
  
  - Work in a highly collaborative, mission-driven, agile
    product development team.
  - Execute Integration, Feature and Regression test cases using
    both manual and automated testing approaches. Knowledge of
    Unit Testing is a plus.
  - Work in support of the QA lead to help streamline testing
    processes for evaluating application features and
    determining software quality. Contribute to product and
    process improvement discussions and the refinement of QA
    best practices.
  - Perform debugging and root cause analysis of product
    failures and log software defects.
  - Participate in product design reviews to provide input on
    functional requirements, product designs, schedules, or
    potential project risks.
  - Help build scalable and reusable testing documentation in
    support of both manual and automated testing efforts.
  - Research and resolve any broken automation scripts that fail
    during execution
  
  Requirements:
  
  - 2+ years of technical experience strongly related to Quality
    Assurance/Testing and evaluation of system architecture
    and web applications
  - 2+ years of developing and maintaining frontend automation
    frameworks, preferably in Groovy/Java
  - Experience with at least one automation framework (e.g.,
    Cypress, Selenium, Playwright, Katalon, TestNG, Robot
    Framework).
  - Good understanding of API testing, database validation,
    performance testing, and load testing tools (e.g., JMeter,
    Locust, Gatling).
  - Exposure to CI/CD environments and infrastructure-as-code
    principles.
  - Experience testing on mobile devices (iOS and Android)
  - Experience planning, designing, and implementing testing
    strategies and automation infrastructure for large scale
    system software
  - Experience with Git or equivalent source control system,
    including basic concepts of code branching methodologies
  - Experience with issue tracking tools (Jira preferred)
  - Experience serving as a subject matter expert within a
    testing team on test process development and software
    quality measurements
  - Browser, infrastructure, and remote device testing
    (including debug tools)
  - Ability to communicate effectively and in a concise manner,
    both verbally and in writing
  - Adhere to all organizational information security policies
    and protect all sensitive information including but not
    limited to ePHI and PHI in accordance with organizational
    policy and Federal, State, and local regulations
  
