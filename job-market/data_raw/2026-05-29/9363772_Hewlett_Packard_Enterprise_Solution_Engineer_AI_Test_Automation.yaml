description: |
  Solution Engineer – AI Test Automation
  
  
  
  This role has been designed as ‘’Onsite’ with an expectation
  that you will primarily work from an HPE office.
  
  Who We Are:
  
  Hewlett Packard Enterprise is the global edge-to-cloud
  company advancing the way people live and work. We help
  companies connect, protect, analyze, and act on their data
  and applications wherever they live, from edge to cloud, so
  they can turn insights into outcomes at the speed required
  to thrive in today’s complex world. Our culture thrives on
  finding new and better ways to accelerate what’s next. We
  know varied backgrounds are valued and succeed here. We have
  the flexibility to manage our work and personal needs. We
  make bold moves, together, and are a force for good. If you
  are looking to stretch and grow your career our culture will
  embrace you. Open up opportunities with HPE.
  
  Job Description:
  
  
  
  What you will do :
  
  Responsibilities
  
  - Design, develop, troubleshoot, and debug software modules
    for networking, security, and systems‑level components.
  - Implement and enhance features across areas such as
    operating systems, networking stacks, utilities, security
    functions, and data‑path modules.
  - Participate in code reviews, unit testing, integration
    testing, and performance validation to ensure high‑quality
    deliverables.
  - Collaborate with cross‑functional teams including program
    managers, hardware engineers, architects, and QA teams to
    support feature development and issue resolution.
  - Contribute to performance engineering activities, such as
    benchmarking, profiling, load testing, and optimization in
    distributed environments.
  - Identify and troubleshoot performance bottlenecks across
    networking, security, and data‑path layers.
  - Support continuous performance monitoring and regression
    analysis across releases to maintain stability and
    performance.
  - Develop automation scripts and tools (primarily in Python)
    to improve testing efficiency and routine validation
    tasks.
  - Participate in process improvement initiatives aimed at
    better productivity and software quality.
  - Work with internal and external technical teams when
    necessary to understand integration requirements, clarify
    feature expectations, and ensure timely alignment.
  
  What you will bring :
  
  Education & Experience
  
  - Bachelor’s degree in Computer Science, Electronics,
    Communication, or related field (or equivalent hands‑on
    experience).
  - 6-10 Yrs of relevant experience in software development,
    networking, or security domains.
  
  Knowledge & Skills
  
  - Basic understanding of AI/ML concepts and familiarity with
    LLM-based tools or APIs to enhance automation, analytics,
    or troubleshooting workflows.
  - Strong understanding of networking and security technologies
    including Web Filtering, IDS/IDP, IPS, SSL Inspection,
    VPN, Proxy, DNS Security, DLP, Application Control, and
    Threat Prevention.
  - Hands-on knowledge in configuring, troubleshooting, and
    supporting enterprise network security and next-generation
    firewall solutions.
  - Experience with Juniper SRX/MX platforms is a plus but not
    mandatory.
  - Understanding of how real‑world networking and security
    solutions are deployed.
  - Strong programming and automation skills (Python preferred).
  - Ability to contribute to testing and automation when
    required.
  - Strong analytical, debugging, and problem‑solving skills.
  - Good communication skills and ability to work effectively
    with cross‑functional teams.
  - Understanding of scalable software architectures,
    high‑availability concepts, and distributed system design.
  - Experience with performance tuning, analyzing system
    bottlenecks, and optimizing CPU, memory, and data‑path
    operations.
  - Familiarity with performance KPIs, SLOs, benchmarking
    techniques, and load/performance testing tools.
  
  Additional Skills:
  
  Cloud Architectures, Cross Domain Knowledge, Design
  Thinking, Development Fundamentals, DevOps, Distributed
  Computing, Microservices Fluency, Full Stack Development,
  Security-First Mindset, Solutions Design, Testing &
  Automation, User Experience (UX)
  
  What We Can Offer You:
  
  Health & Wellbeing
  
  We strive to provide our team members and their loved ones
  with a comprehensive suite of benefits that supports their
  physical, financial and emotional wellbeing.
  
  Personal & Professional Development
  
  We also invest in your career because the better you are,
  the better we all are. We have specific programs catered to
  helping you reach any career goals you have — whether you
  want to become a knowledge expert in your field or apply
  your skills to another division.
  
  Unconditional Inclusion
  
  We are unconditionally inclusive in the way we work and
  celebrate individual uniqueness. We know varied backgrounds
  are valued and succeed here. We have the flexibility to
  manage our work and personal needs. We make bold moves,
  together, and are a force for good.
  
