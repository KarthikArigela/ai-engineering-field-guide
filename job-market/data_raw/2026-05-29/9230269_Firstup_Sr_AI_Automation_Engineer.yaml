description: |
  Who We Are
  
  At Firstup, our mission is to improve the employee
  experience at every moment that matters, large and small. As
  the communication pipeline for the world's workforce, we now
  serve 40 of the Fortune 100 companies, reaching and
  connecting more than 17 million employees daily.
  
  Our employees are experts in the employee experience,
  workforce communications and technology.
  
  Joining Firstup means joining a movement to make work better
  for every worker. As the world’s first intelligent
  communication platform, Firstup meaningfully engages
  employees at every moment from hire to retire, and delivers
  engagement insights to help companies support, promote and
  retain their talent. Our movement has taken root and is
  evident in our world-class customer base. Now we need your
  help. Ready to make a difference in the world?
  
  Position Overview
  
  
  
  We are hiring a Sr. AI Automation Engineer to transform how
  work gets done at Firstup by eliminating manual processes
  and increasing operational throughput using AI-driven
  systems. This role focuses on building and deploying
  automation pipelines, AI agents, and internal tools that
  deliver measurable business impact and scalable efficiency.
  
  Responsibilities
  
  - Identify high-friction workflows and replace them with AI-
    driven automation  systems
  - Design, build, and deploy AI agents and automation pipelines
    across business  functions
  - Redesign workflows to transition from human-assisted to
    fully automated  execution where viable
  - Integrate AI systems with internal platforms such as CRM,
    analytics, and support  tools
  - Develop RAG-based knowledge systems and internal copilots to
    improve access to  information
  - Rapidly prototype, test, and deploy production-grade AI
    solutions
  - Define KPIs and measure the impact of automation and AI
    initiatives
  - Optimize systems for performance, cost efficiency, and
    scalability
  
  Minimum Qualifications
  
  - Bachelor’s degree in computer science, engineering, or
    related field, or equivalent  practical experience
  - 5+ years of experience deploying AI/ML systems in production
    environments
  - Strong experience with LLMs, RAG architectures, vector
    databases, and agent  frameworks
  - Proficiency in Python or similar programming languages and
    strong software  engineering fundamentals (APIs, system
    design, scalability)
  - Experience integrating AI systems into enterprise tools and
    workflows
  - Familiarity with automation/orchestration tools and
    evaluation frameworks
  - Strong analytical and problem-solving skills with a metrics-
    driven mindset
  - Ability to operate with high execution velocity from
    prototype to production
  
  Firstup expects the base salary for this role to be between
  $120,000-$175,000. The starting rate of pay may vary based
  on factors including, but not limited to, position offered,
  location, education, training, and/or experience.
  
  Why Firstup?
  
  
  
  Because you care - about people, the work you do, and the
  connections you make. Work is such a large part of life; it
  only makes sense to make it awesome.
  
  
  
  If you want to engage brilliant minds in a high-growth and
  inclusive environment where ideas are rewarded regardless of
  who they come from, join us. This is a rapidly changing
  space so if you thrive on ambiguity, are hungry for a
  challenge, and have the guts to speak your mind, you could
  be a perfect fit.
  
  
  
  We offer an excellent PTO program, great health benefits, a
  casual and friendly environment, remote work, and a
  leadership team who truly believes in your growth – both
  personally and professionally.
  
  
  
  Firstup is committed to providing equal employment
  opportunities to all applicants for employment and to all
  employees, without regard to race, color, religion, gender,
  sexual orientation, gender identity or expression, national
  origin, age, protected disability, veteran status, or any
  other protected status in accordance with applicable
  federal, state or local laws.
  
