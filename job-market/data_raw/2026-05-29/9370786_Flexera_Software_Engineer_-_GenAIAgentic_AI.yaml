description: |
  Flexera saves customers billions of dollars in wasted
  technology spend. A pioneer in Hybrid ITAM and FinOps,
  Flexera provides award-winning, data-oriented SaaS solutions
  for technology value optimization (TVO), enabling IT,
  finance, procurement and cloud teams to gain deep insights
  into cost optimization, compliance and risks for each
  business service. Flexera One solutions are built on a set
  of definitive customer, supplier and industry data, powered
  by our Technology Intelligence Platform, that enables
  organizations to visualize their Enterprise Technology
  Blueprint™ in hybrid environments—from on-premises to SaaS
  to containers to cloud.
  
  We’re transforming the software industry.  We’re Flexera.
   With more than 50,000 customers across the world, we’re
  achieving that goal. But we know we can’t do any of that
  without our team.  Ready to help us re-imagine the industry
  during a time of substantial growth and ambitious plans? 
  Come and see why we’re consistently recognized by Gartner,
  Forrester and IDC as a category leader in the marketplace.
  Learn more at flexera.com
  
  We are looking for an AI Software Engineer with strong
  Python skills and hands on experience building GenAI and
  Agentic AI applications.
  
  Responsibilities
  
  - Build AI agents and multi agent workflows
  - Develop GenAI applications using LLMs, RAG, embeddings, and
    vector databases
  - Create APIs and backend services using Python
  - Integrate AI systems with enterprise tools and APIs
  - Optimize AI performance, latency, and token usage
  - Deploy scalable AI applications using cloud and container
    technologies
  
  Required Skills
  
  - Strong Python programming
  - Experience with LLMs and GenAI applications
  - Hands on experience with frameworks like LangChain,
    LangGraph, CrewAI, AutoGen, or Semantic Kernel
  - Good understanding of:
    - RAG
    - Prompt engineering
    - Function calling
    - Vector databases
    - AI agent orchestration
  - Experience with FastAPI or Flask
  - Experience with Docker, GitHub Actions, and CI/CD
  - Familiarity with AWS Bedrock, SageMaker, Azure OpenAI, or
    Vertex AI
  
  Good to Have
  
  - Kubernetes and microservices experience
  - AI observability and evaluation frameworks
  - Experience building enterprise AI copilots or automation
    agents
  
  Qualification
  
  - Bachelor’s degree in Computer Science or related field
  - 3+ years in software engineering
  - Experience building production ready AI solutions
  
  We are looking for someone who can independently design,
  build, and deploy AI powered systems end to end.
  
