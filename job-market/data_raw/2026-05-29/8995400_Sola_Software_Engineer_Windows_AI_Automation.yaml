title: Software Engineer, Windows AI Automation
company: Sola
location: USA
remote: true
work_type: FULL_TIME
description: |
  Join Us in Building the Future of Digital Work
  
  At Sola, we’re transforming the way work is done. We’re
  developing AI agents that make powerful automation
  effortless, enabling any user to record a workflow and
  instantly scale it up to millions of executions.
  
  Sola today powers enterprise workflows in Fortune 100
  companies, with a horizontal platform that works across
  healthcare, finance, legal, logistics, and more. We’ve
  raised $21M in funding from a16z, Conviction (Sarah Guo),
  and Y Combinator, and are looking for passionate engineers
  to help us continue to scale.
  
  If you’re interested in being on the forefront of agentic
  automation, we’d love to hear from you!
  
  What to expect
  
  We're solving one of the most interesting problems in AI
  today: building reliable, deterministic execution on top of
  non-deterministic AI models.
  
  The desktop is the most challenging frontier of computer use
  automation. Modern enterprise environments mix legacy Win32
  software, Citrix virtual desktops, and modern .NET
  applications, each requiring a different approach to
  perception and control. We're looking for a scrappy
  generalist to lead this work, someone comfortable across
  Windows / .NET and Linux server-side, excited to move
  between the desktop controller, the VM platform, and server-
  side AI execution.
  
  This role is open to full-time remote or in-person at our HQ
  in New York. Our team today is split between both. If you're
  in New York (or open to relocating) you'll be in-person
  every day with a tight-knit founding team. If you're remote,
  you'll have the opportunity to come to NY for frequent
  meetups when we bring the remote teams together.
  
  What you'll do
  
  - Lead our desktop automation platform, setting technical
    direction across the desktop controller, the VM platform,
    and server-side AI execution
  - Build and operate the desktop controller and the Windows VM
    fleet it runs on: session management, remote access,
    screen capture, and integration with the AI pipeline
  - Move across the Windows / .NET stack and Linux server-side
    as the project demands, partnering with backend & AI-
    focused engineers as needed
  - Drive reliability and observability across the desktop
    platform
  
  What we're looking for
  
  - You've shipped production software and are comfortable with
    Windows / .NET development, not afraid to drop into Win32
    or COM when needed
  - You're a generalist at heart, excited to move across
    different parts of the stack, with strong instincts about
    how to build in reliability and observability end-to-end
  - You're interested in being in-person 5 days a week in our NY
    office (we'll cover relocation), or you have a proven
    track record of working remotely (self-motivated,
    proactive, and a great communicator)
  
  You might excel if
  
  - You have deep knowledge of Windows desktop internals:
    accessibility APIs (UIA, MSAA), Win32, COM, or remote
    desktop protocols (VNC/RFB, RDP)
  - You have experience deploying Windows applications at scale
    or operating Windows VM fleets
  - You're an expert in some or all of our stack: TypeScript,
    Python, .NET / C#, Appium, VNC/RFB, Tailscale, Temporal,
    Kubernetes
  
  Why Sola
  
  - $21M raised from top-tier VCs (a16z, Conviction,
    YCombinator) and growing incredibly fast
  - Proven traction with Fortune 100 customers, with horizontal
    applicability across a variety of domains (including
    finance, healthcare, legal, logistics, and more)
  - Leading-edge agentic AI tech, solving deep problems in
    partnership with the AI labs (ex. Anthropic, AWS AGI Lab)
  - Small team, early stage, with an opportunity for outsized
    impact on the company’s future
  - Work closely with founders Jessica Wu (ex-Citadel, Thrive
    Capital) and Neil Deshmukh (MIT Quest for Intelligence
    Lab), alongside David Fullerton (ex-CTO Heap, Stack
    Overflow)
  
  Compensation & Benefits
  
  Sola offers competitive salary plus meaningful equity at
  Series A stage. Exact compensation is based on experience
  and level.
  
  We offer comprehensive medical, dental, and vision benefits,
  401(k) matching, daily meals together in the office,
  flexible PTO (4 weeks per year), and relocation support for
  candidates not already based in NYC.
