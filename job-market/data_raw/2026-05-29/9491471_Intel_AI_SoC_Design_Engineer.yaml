description: |
  Job Details:
  
  Job Description:
  
  Join Intel's AI Revolution. Intel's new AI SoC organization
  develops cutting-edge products powering a wide range of AI
  applications, from edge devices to data center accelerators.
  If you are an engineer with strong technical and
  communication skills who thrives in a fast-paced environment
  with abundant learning opportunities, you are the ideal
  candidate for this role. Join us to shape the future of AI
  hardware.
  
  This role is at the heart of Intel's product development
  process, combining technical expertise, creative problem-
  solving, and disciplined execution. By joining our team, you
  will work alongside some of the brightest minds in the
  industry to define and build next-generation computing
  platforms that enable transformative experiences for
  billions of users worldwide.
  
  Key Responsibilities
  
  - Define microarchitecture and implement RTL for SoC blocks
  - Collaborate with IP providers to integrate IPs into the SoC
  - Collaborate with verification and firmware teams to meet
    functional and performance goals
  - Own design quality including clock/reset/power domain
    crossings and timing constraints
  - Collaborate with physical design teams to meet
    timing/area/power goals
  - Drive high-quality design handoffs to partner teams
    (verification, physical design, firmware, packaging)
  - Contribute to next-generation architecture discussions
  
  Qualifications:
  
  You must possess the minimum qualifications to be initially
  considered for this position. Experience listed below would
  be obtained through a combination of your school
  work/classes/research and/or relevant previous job and/or
  internship experiences.
  
  
  Minimum Qualifications
  
  4+ years of experience with a Bachelor's degree, 2+ years
  with a Master's degree, or a PhD in Electrical Engineering,
  Computer Engineering, Computer Science, or a related field,
  with experience in the following:
  
  - RTL design, coding, and simulation using SystemVerilog
  - Microarchitecture and SoC architecture
  - System-level design principles like power, performance, and
    area trade-offs/optimizations
  
  Preferred Qualifications
  
  - Passion for continuous learning, including an understanding
    of AI models and how they shape AI hardware architectures
  - Proven ability to effectively communicate across
    multidisciplinary teams
  - Track record of disciplined execution and delivering high-
    quality designs under tight deadlines
  - Proficiency in implementing clock, reset, power domain
    crossings both logically and physically
  - Experience in driving innovative solutions to complex design
    challenges
  
  Join us to push the boundaries of technology and make a
  lasting impact on the future of computing.
  
  
  
  Job Type:Experienced Hire
  
  Shift:Shift 1 (India)
  
  Primary Location: India, Bangalore
  
  Additional Locations:
  
  Business group:At the Data Center Group (DCG), we're
  committed to delivering exceptional products and delighting
  our customers. We offer both broad-market Xeon-based
  solutions and custom x86-based products, ensuring tailored
  innovation for diverse needs across general-purpose compute,
  web services, HPC, and AI-accelerated systems. Our charter
  encompasses defining business strategy and roadmaps, product
  management, developing ecosystems and business
  opportunities, delivering strong financial performance, and
  reinvigorating x86 leadership. Join us as we transform the
  data center segment through workload driven leadership
  products and close collaboration with our partners.
  
