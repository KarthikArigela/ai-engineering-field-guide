description: |
  Company Description
  
  Founded and headquartered in Switzerland, Avaloq is
  continuously expanding its global footprint with around
  2,500 colleagues in 12 countries, and more than 170 clients
  in 35 countries. We are an industry-leading provider of
  wealth management technology and services for financial
  institutions around the world, including private banks and
  wealth managers, investment managers, as well as retail and
  neo banks. Our research led approach and continual
  innovation is powered by the passion and creativity of our
  colleagues. We are always looking for talented people to
  join us on our mission to orchestrate the financial
  ecosystem and democratize access to wealth management.
  Avaloq offers the opportunity to work closely with some of
  the world’s leading financial institutions as we jointly
  develop and shape careers. Championing a collaborative,
  supportive and flexible work environment empowers our
  colleagues to reach their full potential.
  
  Job Description
  
  About Us: we are the Data Platform domain teams in the
  Product and Development Business Area, enabling financial
  institutions to adopt, govern, and analyze data from Avaloq
  products across complex enterprise ecosystems.
  
  Our mission is to create trusted, analytics and AI‑ready
  data platforms, turning Avaloq Core data into governed,
  reusable data products that power reporting, analytics,
  automation, and next‑generation AI use cases. We believe
  that AI success starts with strong data foundations,
  semantics, and governance.
  
  
  
  What We’re Looking For: We are looking for a senior
  Snowflake Data & AI Platform Engineer with proven, hands‑on
  experience building production‑grade analytical data
  platforms.
  
  You will play a key role in scaling our Snowflake‑based
  analytics platform, shaping data products, governance, and
  AI enablement, and acting as a technical reference for both
  internal teams and clients. This role is designed for
  experienced professionals who think platform‑first, not
  project‑first.
  
  
  
  Key Tasks
  
  Snowflake Analytics & Platform Engineering:
  
  - Design and evolve Snowflake‑native analytical data products.
  - Build reusable, governed semantic datasets for positions,
    transactions, cash, performance, P&L, and risk.
  - Leverage Snowflake native capabilities such as Dynamic
    Tables, Streams and Tasks, Secure Views, RBAC, data
    sharing, and cost and workload optimization strategies.
  
  Data Semantics & Modeling
  
  - Translate Avaloq Core Platform (ACP) structures into
    business‑meaningful analytical models.
  - Apply modern modeling approaches such as dimensional
    modeling and medallion or data‑product‑oriented
    architectures.
  - Define consistent metrics, KPIs, and analytical domains
    reusable across clients.
  - Ensure datasets are discoverable, well‑documented, and
    trustworthy.
  
  Governance, Security & Quality Implement Snowflake‑native
  governance frameworks including masking policies, row‑level
  security, object tagging, and access policies. Build data
  quality, security, and trust into the platform by design.
  
  AI & Advanced Analytics Enablement
  
  - Prepare the platform for enterprise‑grade AI usage.
  - Enable AI and advanced analytics use cases using Snowflake
    Cortex, Snowpark ML, vector search, and document
    intelligence.
  - Focus on AI enablement and operationalization rather than
    pure data science experimentation.
  - Support analytics, intelligence, and automation scenarios
    across banking domains.
  
  Collaboration & Technical Leadership
  
  - Act as a senior technical reference for Snowflake within the
    team.
  - Collaborate with Product Managers, Architects, Analysts, and
    Engineers across locations.
  - Support proofs of concept, client onboarding, and production
    rollouts.
  - Drive documentation, standards, and best practices for the
    data platform.
  
  Qualifications
  
  Must‑Have
  
  - Strong, hands‑on experience building Snowflake‑based data
    platforms.
  - Hands‑on experience with dbt or similar
    analytics‑engineering tools.
  - Proven production track record, not limited to PoCs.
  - Excellent SQL skills and strong Python proficiency.
  - Deep understanding of analytical data modeling and data
    semantics.
  - Experience integrating enterprise data sources such as
    Oracle and Kafka.
  - Cloud‑native mindset, including CI/CD and automation.
  - Fluency in spoken and written English.
  
  Strong Advantages
  
  - Experience in financial services or banking.
  - Knowledge of Avaloq Core Platform or similar core banking
    systems.
  - Hands‑on experience with Snowflake Cortex, Native Apps, or
    Marketplace.
  - Experience with data governance and data quality frameworks.
  - Ability to think platform‑first with long‑term scalability
    and reuse in mind.
  - 3+ years of experience in fintech or the financial services
    industry
  - Knowledge of the Avaloq Banking Suite
  - Familiarity with Oracle Cloud (OCI)
  
  Additional Information
  
  We realize that managing work life balance is a challenge we
  all face in our daily lives and in order to support with
  this we are pleased to offer hybrid and flexible working for
  most of our Avaloqers to maintain work life balance and
  still continue our fantastic Avaloq culture in our global
  offices.
  
  In Avaloq we are proud to embrace diversity and understand
  the success of our business is built on the power of
  different opinions, we are whole heartedly committed to
  fostering an equal opportunity environment and inclusive
  culture where you can be your true authentic self.
  
  We hire, compensate and promote regardless of origin, age,
  gender identity, sexual orientation or any other fantastic
  traits that make us all unique, we have done our best to
  write this advert in an inclusive and neutral way.
  
  Please be aware that we will not accept speculative CV
  submissions for any of our roles from recruitment agencies,
  and any unsolicited candidate submissions will be exempt
  from any payment expectations.
  
  
  
