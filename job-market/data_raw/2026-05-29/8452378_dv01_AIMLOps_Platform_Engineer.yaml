title: AI/MLOps Platform Engineer
company: dv01
location: USA
work_type: FULL_TIME
description: |
  dv01 is lifting the curtain on the largest financial market
  in the world: structured finance. The $16+ trillion market
  is the backbone of everyday activities that empower
  financial freedom, from consolidating credit card debt and
  refinancing student loans, to buying a home and starting a
  small business.
  
  dv01’s data analytics platform brings unparalleled
  transparency into investment performance and risk for
  lenders and Wall Street investors in structured products. As
  a data-first company, we wrangle critical loan data and
  build modern analytical tools that enable strategic
  decision-making for responsible lending.  In a nutshell,
  we're helping prevent a repeat of the 2008 global financial
  crisis by offering the data and tools required to make
  smarter data-driven decisions resulting in a safer world for
  all of us.
  
  More than 400 of the largest financial institutions use dv01
  for our coverage of over 100 million loans spanning
  mortgages, personal loans, auto, buy-now-pay-later programs,
  small business, and student loans. dv01 continues to expand
  coverage of new markets, adding loans monthly, and
  developing new technologies for the structured products
  universe.
  
  YOU WILL:
  
  Build and operate an AI infrastructure platform: You will
  design, build, and operate cloud-native infrastructure and
  platform tooling that accelerates AI development across the
  company. This includes enabling teams to develop, deploy,
  and operate AI-powered services safely and efficiently in
  production environments.
  
  Own the DevOps and infrastructure side of AI Ops and Agentic
  Systems: You will focus on the operational foundations of AI
  systems, including CI/CD for AI workloads, scalable
  inference infrastructure, observability, cost management,
  and reliability. You will establish repeatable patterns and
  shared services that reduce friction for teams building AI-
  enabled applications.
  
  Enable AI services, agents, and runtime platforms: You will
  build and maintain infrastructure to support AI services
  such as LLM-backed APIs, Model Context Protocol (MCP)
  servers, and agentic systems used by production
  applications. You will enable secure tool access, runtime
  orchestration, and isolation boundaries for AI-driven
  workloads.
  
  Integrate AI Ops capabilities into platform operations: You
  will apply MLOps concepts to improve platform operations,
  including using AI-driven approaches for monitoring,
  alerting, anomaly detection, and incident response across AI
  and non-AI systems. You will help evolve how the platform
  observes and operates complex AI-enabled systems at scale.
  
  Establish governance, security, and operational guardrails:
  You will help define and implement infrastructure-level
  governance for AI systems, including access controls,
  deployment policies, auditability, and secure-by-default
  patterns. You will partner with security and compliance
  teams to ensure AI infrastructure aligns with organizational
  risk and regulatory requirements.
  
  Provide technical leadership and enablement: You will act as
  a technical leader, influencing platform architecture and
  best practices across teams. You will mentor engineers and
  work closely with product, data, and application teams to
  align AI platform capabilities with business goals.
  
  YOU HAVE:
  
  A senior cloud and platform engineer: You have 8+ years of
  experience in cloud infrastructure, DevOps, or platform
  engineering roles, with deep expertise designing and
  operating distributed systems in production.
  
  Experienced with AI Ops and agentic platforms: You have
  direct exposure to ML/GenAIOps practices, such as
  monitoring, anomaly detection, predictive alerting, or
  automated remediation, applied to real production systems.
  5+ years of MLOps experience is required.
  
  Strong in cloud-native infrastructure: You are proficient in
  building and managing cloud environments, Kubernetes,
  containerized workloads and infrastructure-as-code tools
  such as Terraform.
  
  Comfortable supporting AI workloads: You have hands-on
  experience supporting platforms that and host/run deep
  neural networks, including LLM runtimes (e.g., vLLM,
  llama.cpp), ML compiler stacks (e.g., LLVM/MLIR), and
  PyTorch-based production systems.
  
  Security- and operations-minded: You have a strong
  understanding of infrastructure security, IAM, secrets
  management, and operational risk as it relates to AI-enabled
  systems.
  
  A platform-focused technical leader: You operate effectively
  as a technical leader, influencing architecture and
  standards while remaining hands-on. You communicate clearly,
  collaborate well cross-functionally, and thrive in ambiguous
  problem spaces.
  
  Forward-thinking and pragmatic: You are proactive and
  innovative, with the ability to introduce emerging agentic
  patterns while balancing operational maturity and long-term
  maintainability. You will help design and operate scalable
  benchmarking and evaluation frameworks for agentic AI
  systems, enabling quantitative measurement of accuracy,
  reliability, cost–performance tradeoffs, regression
  detection, and the impact of model, prompt, or architecture
  changes (including techniques such as LLM-as-a-judge), with
  tooling that is reusable and accessible across the
  organization.
  
  Additionally, you will:
  
  - Contribute to dv01’s AI and data roadmap
  - Establish technical direction and strategy
  - Mentor and provide technical guidance to junior engineers
  
  Nice To Have:
  
  - Experience with Pulumi
  - Experience with GCP, and Cloudflare
  - Experience with GHA and Harness
  - Experience with Go lang
  - Experiencing supporting Data Engineering Platforms
  - Exposure to Data Warehousing and ETL/ELT Tools or Operations
  
  In good faith, our salary range for this role is
  $185,000–$200,000, but we are not tied to it. Final offer
  amount will be at the company’s sole discretion and
  determined by multiple factors, including years and depth of
  experience, expertise, and other business considerations.
  Our community is fueled by diverse people who welcome
  differing points of view and the opportunity to learn from
  each other. Our team is passionate about building a product
  people love and a culture where everyone can innovate and
  thrive.
  
  BENEFITS & PERKS:
  
  - Unlimited PTO. Unplug and rejuvenate, however you
    want—whether that’s vacationing on the beach or at home on
    a mental-health day.
  - $1,000 Learning & Development Fund. No matter where you are
    in your career, always invest in your future. We encourage
    you to attend conferences, take classes, and lead
    workshops. We also host hackathons, brunch & learns, and
    other employee-led learning opportunities.
  - Remote-First Environment. People thrive in a flexible and
    supportive environment that best invigorates them. You can
    work from your home, cafe, or hotel. You decide.
  - Health Care and Financial Planning. We offer a comprehensive
    medical, dental, and vision insurance package for you and
    your family. We also offer a 401(k) for you to contribute.
  - Stay active your way! Get $138/month to put toward your
    favorite gym or fitness membership — wherever you like to
    work out. Prefer to exercise at home? You can also use up
    to $1,650 per year through our Fitness Fund to purchase
    workout equipment, gear, or other wellness essentials.
  - New Family Bonding. Primary caregivers can take 16 weeks off
    100% paid leave, while secondary caregivers can take 4
    weeks. Returning to work after bringing home a new child
    isn’t easy, which is why we’re flexible and empathetic to
    the needs of new parents.
  
  dv01 is an equal opportunity employer and all qualified
  applicants and employees will receive consideration for
  employment opportunities without regard to race, color,
  religion, creed, sex, sexual orientation, gender identity or
  expression, age, national origin or ancestry, citizenship,
  veteran status, membership in the uniformed services,
  disability, genetic information or any other basis protected
  by applicable law.
