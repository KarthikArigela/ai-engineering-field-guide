description: |
  Job Description:
  
  Job Title: Senior AI Engineer, AVP
  
  Location: Pune, India
  
  Role Description:
  
  - The Deutsche India is seeking a talented Senior AI Engineer
    to join our growing team. At the “Service Solutions and
    AI” Domain, our mission is to revolutionize our Private
    Bank process landscape by implementing holistic, front-to-
    back process automation. And being a Private Bank AI
    Centre of Excellence we are responsible for strategy
    building and execution of AI innovation, governance, and
    delivery across Private Bank, ensuring standardization,
    compliance, and accelerated adoption of AI solutions. We
    are dedicated to leveraging the power of data to drive
    innovation, optimize operations, and deliver exceptional
    value to our customers. We are committed to enhancing
    efficiency, agility, and innovation, with a keen focus on
    aligning every step of our process with the customer’s
    needs and expectations. Our dedication extends to driving
    innovative technologies, such as AI & workflow services,
    to foster continuous improvement. We aim to deliver “best
    in class” solutions across products, channels, brands, and
    regions, thereby transforming the way we serve our
    customers and setting new benchmarks in the industry.
  - Join our innovative team as a Senior AI Engineer, where you
    will be instrumental in the end-to-end design,
    development, and deployment of cutting-edge AI solutions.
    We are seeking a highly skilled and motivated individual
    to expertly leverage advanced AI models and platforms,
    tackling complex business challenges and driving digital
    transformation. You will contribute to projects ranging
    from intelligent automation to advanced conversational AI,
    utilizing a modern technology stack to create impactful
    and scalable applications. This role offers a significant
    opportunity to be at the forefront of AI innovation,
    contributing directly to solutions that redefine user
    experiences and operational efficiencies.
  
  What we’ll offer you
  
  As part of our flexible scheme, here are just some of the
  benefits that you’ll enjoy
  
  - Best in class leave policy
  - Gender neutral parental leaves
  - 100% reimbursement under childcare assistance benefit
    (gender neutral)
  - Sponsorship for Industry relevant certifications and
    education
  - Employee Assistance Program for you and your family members
  - Comprehensive Hospitalization Insurance for you and your
    dependents
  - Accident and Term life Insurance
  - Complementary Health screening for 35 yrs. And above
  
  Your key responsibilities
  
  AI Solution Architecture & Development:
  
  - End-to-End AI Development: Lead the design, development, and
    implementation of robust AI-powered applications and
    services utilizing Python, FastAPI/Flask, and Google
    VertexAI.
  
  Advanced AI Model Management:
  
  - Model Integration & Fine-tuning: Expertly integrate and
    fine-tune large language models, with a specific focus on
    the Gemini Model, for a diverse range of NLP tasks and
    generative AI applications.
  
  Conversational & Agentic AI Systems:
  
  - Conversational AI Development: Architect and enhance
    sophisticated conversational AI agents using Dialogflow
    CX, specializing in advanced natural language
    understanding and response generation.
  - Agentic AI Orchestration: Implement cutting-edge Agentic AI
    patterns and orchestrate complex AI workflows using
    frameworks like ADK and LangGraph to build robust,
    intelligent, and autonomous systems.
  
  System Integration & Infrastructure:
  
  - API Integration: Design and implement seamless API
    integrations with various internal and external systems,
    ensuring optimal data flow and functionality across the
    ecosystem.
  - Cloud Infrastructure & Data Processing: Lead the deployment
    and management of AI solutions on cloud platforms,
    leveraging services like GCP CloudRun/GKE, BigQuery,
    CloudSQL, Cloud Composer, and GCS for resilient data
    processing and infrastructure management.
  
  Quality Assurance & Operations:
  
  - Code Quality & Best Practices: Champion the adherence to and
    implementation of clean, maintainable, and well-documented
    code, strictly following best practices for software
    development and AgentOps.
  - Testing & Deployment Oversight: Develop and execute
    comprehensive test strategies for AI solutions, actively
    assisting in the efficient deployment and continuous
    monitoring of models within production environments.
  
  Strategic Growth & Collaboration:
  
  - Research & Innovation Leadership: Proactively stay current
    with the latest advancements in AI, machine learning, and
    natural language processing, driving the proposal and
    implementation of innovative solutions.
  - Cross-Functional Collaboration: Work closely with product
    managers, data scientists, and other engineering teams to
    ensure the successful delivery of high-quality, impactful
    AI products.
  
  Your skills and experience
  
  Educational Foundation:
  
  - Academic Background: Bachelor’s, Master’s, or PhD in a
    relevant field such as Computer Science, AI/ML
    Engineering, Statistics, Mathematics, or Engineering.
  
  Professional Expertise:
  
  - Extensive AI Engineering Experience: Proven experience (8+
    years) in an AI Engineer role, demonstrating the
    successful application of AI skills and techniques to
    solve complex, real-world problems.
  
  Technical Proficiency:
  
  - Programming Mastery: Strong proficiency in programming
    languages commonly used in data science, particularly
    Python (with libraries like scikit-learn, pandas, NumPy),
    SQL, etc.
  - Web Frameworks for APIs: Extensive experience with web
    frameworks like FastAPI or Flask for building robust and
    scalable APIs.
  - Google VertexAI Platform Expertise: Hands-on experience and
    proven expertise with the Google VertexAI platform.
  - Large Language Model (LLM) Specialization: Demonstrated
    experience working with large language models, with
    expertise in the Gemini Model.
  - Conversational AI Development: Proficiency in developing and
    optimizing conversational AI solutions using platforms
    like Dialogflow CX.
  - Agentic AI & Orchestration: Solid understanding and
    familiarity with Agentic AI principles, design patterns,
    and orchestration frameworks such as ADK, LangGraph for
    managing AI agents and workflows.
  - API Design & Management: Extensive experience with API
    design, integration, and comprehensive management.
  
  Cloud & Data Technologies:
  
  - Google Cloud Platform (GCP) Expertise: Strong experience
    with Google Cloud Platform (GCP) services including
    CloudRun/GKE, BigQuery, and CloudSQL.
  - Infrastructure as Code (Nice to have): Familiarity with
    infrastructure as code tools like Terraform is an asset.
  
  Deployment & UI/UX:
  
  - AgentOps Practices: Strong familiarity and practical
    experience with AgentOps (Agent Operations) practices and
    tools for deploying and managing AI models.
  - UI Frameworks (Nice to have): Experience with Svelte,
    Angular, Django, Streamlit, or Taipy for building user
    interfaces is a plus.
  
  Problem-Solving & Core Competencies:
  
  - Analytical & Problem-Solving Acumen: Excellent analytical
    and problem-solving abilities with a strong attention to
    detail, capable of translating complex business
    requirements into effective technical solutions.
  - Communication & Collaboration: Strong communication and
    collaboration skills, with the ability to work effectively
    in a team environment and articulate technical concepts
    clearly to diverse stakeholders.
  - Proactive & Self-Motivated: Proactive and self-motivated
    with a demonstrable passion for continuous learning and
    embracing new technologies.
  - Project & Priority Management: Proven ability to manage
    multiple priorities effectively and deliver high-quality
    work within established deadlines.
  
  Domain Knowledge (Preferred): Experience in the financial
  services industry, particularly Private Banking, is highly
  desirable.
  
  How we’ll support you
  
  - Training and development to help you excel in your career.
  - Coaching and support from experts in your team.
  - A culture of continuous learning to aid progression.
  - A range of flexible benefits that you can tailor to suit
    your needs.
  
  About us and our teams
  
  Please visit our company website for further information:
  
  https://www.db.com/company/company.html
  
  We strive for a culture in which we are empowered to excel
  together every day. This includes acting responsibly,
  thinking commercially, taking initiative and working
  collaboratively.
  
  Together we share and celebrate the successes of our people.
  Together we are Deutsche Bank Group.
  
  We welcome applications from all people and promote a
  positive, fair and inclusive work environment.
