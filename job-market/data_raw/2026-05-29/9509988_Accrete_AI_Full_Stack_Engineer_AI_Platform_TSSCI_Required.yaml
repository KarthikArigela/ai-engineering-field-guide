description: |
  Office Location:Lower Manhattan, NY (4 days per week)
  
  TS/SCI Required
  
  Accrete is a dual-use AI software company that licenses its
  Knowledge Engine Platform and Expert AI Agents to government
  and enterprise clients. The platform creates a unified
  semantic representation of an organization’s ground
  truth—capturing tacit domain knowledge, understanding
  contextual relevance, and connecting information
  silos—enabling expert agents to reason across complex data
  and support high-stakes decisions with confidence.
  
  From national security to commercial use cases, Accrete
  delivers mission-critical decision intelligence and
  automation on a single platform.
  
  We are looking for a highly technical Full-Stack Engineer
  with strong full-stack engineering capabilities to help
  build and deploy AI-powered applications for mission-
  critical environments.
  
  What You’ll Do
  
  - Design, build, and deploy AI-enabled applications used by
    government and enterprise customers
  - Develop full-stack product features across frontend,
    backend, APIs, and infrastructure
  - Build and integrate LLM-powered workflows, AI agents,
    retrieval systems, and semantic search capabilities
  - Collaborate closely with product, design, infrastructure,
    and applied AI teams
  - Work directly with end users and stakeholders to rapidly
    prototype and iterate on solutions
  - Optimize application performance, reliability, scalability,
    and security
  - Contribute to architecture decisions and engineering best
    practices across the platform
  - Deploy and maintain applications in secure and regulated
    environments
  - Help shape internal tooling and developer workflows
    leveraging modern AI-assisted engineering practices
  
  Qualifications
  
  - Active TS/SCI Clearance required
  - 4+ years of software engineering experience
  - Strong full-stack engineering experience building
    production-grade applications
  - Proficiency with modern frontend frameworks such as React,
    Next.js, or TypeScript-based web applications
  - Strong backend development experience with Python, Node.js,
    or similar technologies
  - Experience building and consuming APIs and distributed
    systems
  - Familiarity with AI/ML systems, including LLMs, retrieval
    pipelines, vector databases, or agentic workflows
  - Experience working with cloud infrastructure such as AWS,
    Azure, or GCP
  - Strong understanding of databases, authentication, and
    secure application design
  - Ability to operate in fast-paced, ambiguous environments
    with high ownership
  
  Preferred Qualifications
  
  - Experience supporting government or defense-related programs
  - Experience deploying applications in classified or air-
    gapped environments
  - Familiarity with Kubernetes, Docker, CI/CD pipelines, and
    infrastructure-as-code
  - Experience with graph databases, knowledge systems, or
    semantic technologies
  - Prior startup or high-growth technology company experience
  - Strong product intuition and ability to work cross-
    functionally with end users
  
  Salary Range: 170k-235k
  
  The salary range provided reflects the estimated
  compensation for this role based on the expected
  qualifications and experience level. The final offer may
  vary depending on factors such as skills, experience, and
  alignment with role requirements.
  
  Core Values & Expectations:Impact
  
  You take full ownership and accountability for your work,
  consistently seeing projects through from inception to
  completion with a strong bias for action. Proactively
  identifying challenges, you drive solutions rather than
  waiting for direction, and hold yourself and others to the
  highest standards for delivering results. With strategic
  thinking and a problem-solving mindset, you make informed
  decisions leveraging data and expertise, always looking for
  ways to improve processes, optimize workflows, and enhance
  outcomes beyond your immediate responsibilities.
  
  Collaboration
  
  You work seamlessly across teams, prioritizing shared goals
  and team success over individual credit. Engaged listening
  and open, candid communication are at the heart of your
  approach, ensuring alignment and synergy throughout the
  organization. You value diverse perspectives, seeking input
  from others to drive better results. By treating colleagues
  with respect and professionalism, you help build a culture
  of trust, supporting each other through challenges,
  celebrating successes, and constructively addressing
  conflicts to strengthen relationships and improve outcomes.
  
  Passion for AI & Innovation
  
  You are deeply excited about the transformative potential of
  AI and committed to contributing to a company shaping the
  future of work. With curiosity and a growth mindset, you
  continuously seek to learn, adapt, and stay at the forefront
  of new developments. Your enthusiasm for innovation drives
  you to explore new ideas, challenge the status quo, and find
  creative solutions that deliver meaningful impact. You
  approach your work with energy and a desire to advance both
  technology and the way we work.
  
  Company Benefits
  
  - Competitive Salary: Aligned with experience and market
    standards
  - Comprehensive Insurance: Health, dental, and vision coverage
    for you and your family
  - 401(k) Plan: Build your financial future with our retirement
    savings plan
  - Growth & Development: Access professional learning
    opportunities and career advancement support
  - Onsite Perks: Enjoy catered lunches, snacks, and a fully
    stocked kitchen
  - Team Bonding: Company-sponsored happy hours and social
    events to connect and unwind
  
  Accrete is an equal opportunity/affirmative action employer.
  All qualified applicants will receive consideration for
  employment without regard to sex, gender identity, sexual
  orientation, race, color, religion, national origin,
  disability, protected Veteran status, age, or any other
  characteristic protected by law.
