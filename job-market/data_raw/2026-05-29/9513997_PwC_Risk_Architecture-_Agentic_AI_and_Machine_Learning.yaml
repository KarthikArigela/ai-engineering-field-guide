description: |
  The Opportunity As a Risk Architecture- Agentic AI and
  Machine Learning Developer- Experienced Associate, you will
  play a pivotal role in transforming raw data into actionable
  insights, enabling informed decision-making and driving
  business growth. Within our Risk Consulting practice, you
  will apply data, algorithms, and software engineering to
  build and deploy AI and Machine Learning solutions at scale.
  Your work will involve designing AI systems, data wrangling,
  and software implementation to enable the AI models to be
  useful and scalable. As an Associate, you will focus on
  learning and contributing to client engagement and projects
  while developing your skills and knowledge to deliver
  quality work. You will be exposed to clients to learn how to
  build meaningful client connections, manage and inspire
  others, and grow your personal brand by deepening your
  technical knowledge of firm services and technology
  resources. You will be expected to anticipate the needs of
  your teams and clients, embrace ambiguity, ask questions,
  and use these challenges as opportunities for growth. In
  this role, you will take ownership and consistently deliver
  quality work that drives value for our clients and success
  as a team. You will build a brand for yourself, opening
  doors to more opportunities. Responsibilities
  - Designing and implementing AI and machine learning solutions
    to transform raw data into actionable insights
  - Developing and deploying scalable AI models using
    programming languages such as Python and Java
  - Collaborating with team members to integrate AI systems into
    existing data infrastructure
  - Conducting complex data analysis to identify patterns and
    inform decision-making processes
  - Utilizing machine learning libraries like TensorFlow and
    Scikit-Learn to enhance model performance
  - Building and maintaining data pipelines to support AI and
    machine learning initiatives
  - Engaging in data wrangling and data quality assessments to
    improve data reliability
  - Applying natural language processing techniques to develop
    advanced text analytics solutions
  - Participating in client support activities to address AI-
    related challenges and opportunities
  - Continuously learning and adapting to new AI technologies
    and methodologies to drive innovation
  What You Must Have
  - At least a Bachelor's degree
  What Sets You Apart
  - Preference for at least one of the following fields of
    study: Management Information Systems, Computer and
    Information Science, Systems Engineering, Mathematics,
    Engineering, Electrical Engineering, Chemical Engineering,
    Industrial Engineering, Mathematics, Statistics, or
    Mathematical Statistics, Data
    Processing/Analytics/Science, Artificial Intelligence and
    Robotics
  - At least one of the following: Certifications aligned to
    data engineering, machine learning, and cloud platforms,
    including AWS, Google Cloud, Microsoft Azure, Databricks,
    Snowflake, or related data and AI credentials
  - Demonstrating proficiency in Python and Java programming
    languages
  - Utilizing machine learning libraries such as TensorFlow and
    Scikit-Learn
  - Engaging in complex data analysis and pattern recognition
  - Applying AI implementation skills in client-facing
    environments
  - Developing neural network models for advanced AI solutions
