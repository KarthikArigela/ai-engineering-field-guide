description: |
  What's the role?
  
  We are looking for a Principal Agentic AI Engineer to build
  and integrate next-generation AI-driven system capabilities.
  
  You will work hands-on across modern agentic frameworks,
  implementing interaction patterns, integrating data sources,
  and enabling systems to take action through tools and
  structured workflows.
  
  This role is highly experimental and execution-focused,
  requiring rapid iteration, strong engineering fundamentals,
  and comfort working across multiple technologies.
  
  - Advanced System Design & Implementation: Design and
    implement complex system logic for AI-driven workflows and
    interactions. Development of reusable components and
    scalable system patterns. Integrate multiple services,
    models, and data sources into cohesive systems.
  - System Development & Integration: Design and implement
    system logic enabling AI-driven workflows and
    interactions. Integrate multiple data providers and
    services into unified execution flows. Bridge backend
    systems, models, and user-facing interaction layers.
  - Agentic Patterns & Tooling: Implement and experiment with
    different system interaction patterns and workflows.
    Enable systems to act through structured tool interfaces
    and APIs. Build reusable components for interaction
    handling and execution.
  - Rapid Experimentation: Prototype, test, and iterate quickly
    on new approaches and technologies. Evaluate trade-offs
    between performance, cost, and reliability.
  - User Interaction & Sessions: Support development of UI-
    facing components, reference clients, and interaction
    flows. Implement session handling and context management
    where needed.
  
  Who are you?
  
  - Degree in Computer Science, Machine Learning, Data Science,
    or related field.
  - 10+ years of professional engineering experience, including
    4+ years of hands-on experience building modern AI/ML
    models, LLM-based applications, or agentic AI systems.
  - Strong experience in Rust, TypeScript, and Python (multiple
    preferred).
  - Experience working with APIs, distributed systems, and
    service integration.
  - Comfortable experimenting with modern AI frameworks and
    tools.
  - Hands-on mindset with ability to move quickly from idea to
    implementation.
  - Solid understanding of system design and data flow.
  
  What we offer:
  
  - Hybrid model of work
  - Challenging problems to solve
  - Collaborative and encouraging colleagues
  - Opportunities to learn, grow and develop: company
    hackathons, technical talks, and trainings
  - Regular feedbacks
  - Paid vacation days
  - A great work-life balance
  - Flexible working hours
  - Competitive salary plus bonus
  - Diverse team of fantastic & talented people from 60+
    countries worldwide.
  - Brown bag talks, team events, BBQ on the rooftop and more!
  
  Change is HERE. Apply Now!
  #LI-MM3 #LI-HYBRID
  
  Our culture is founded on openness, collaboration and
  honesty, with colleagues who are brilliant in their field,
