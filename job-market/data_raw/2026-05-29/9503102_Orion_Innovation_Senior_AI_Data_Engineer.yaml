  entertainment, life sciences, ecommerce, and education.
  
  Job Overview: We are looking for a hands-on AI & Data
  Engineer with 6+ years of overall experience to accelerate
  the delivery of AI-driven analytics for front-office trading
  teams. This role is ideal for an experienced consultant who
  thrives in fast‑paced trading environments, can work
  independently, and is comfortable owning solutions
  end‑to‑end—from rapid prototyping to production‑hardened
  delivery.
  
  Location: Bangalore (Hybrid)
  
   Mandatory Skills:
  
  - Strong, hands‑on experience with Databricks and Apache
    Spark.
  - Advanced expertise in PySpark and SQL.
  - Proven data engineering consulting experience (ingestion,
    modeling, performance).
  - Solid foundation in statistics, econometrics, and
    time‑series analysis.
  - Practical experience delivering LLM‑based or AI analytics
    solutions.
  - Experience working in trading, financial services, or
    commodity markets is highly preferred.
  - Comfortable operating independently in a delivery‑oriented
    role.
  
   Key Skills:
  
  Data Engineering (Databricks & Azure)
  
  - Build and optimize scalable, reusable data pipelines using:
  - Ingest and process live/streaming and batch market data.
  - Ensure high performance, cost efficiency, data quality, and
    reliability.
  
  Apply best practices for data modelling, partitioning, and
  performance tuningPreferred
  
   LLM & Agentic AI Implementation
  
  - Implement LLM‑based analytics workflows, including:
  - Integrate AI workflows with market data, analytics services,
    and internal tools.
  - Apply guardrails, logging, and observability to AI
    solutions.
  
  
  
