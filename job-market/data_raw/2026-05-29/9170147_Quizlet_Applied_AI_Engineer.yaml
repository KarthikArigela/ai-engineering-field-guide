  Compensation, Benefits & Perks:
  
  Why Join Quizlet?
  
   🌎 Massive reach: 60M+ users, 1B+ interactions per week
  
   🧠 Cutting-edge tech: Generative AI, adaptive learning,
  cognitive science
  
   📈 Strong momentum: Top-tier investors, sustainable
  business, real traction
  
   🎯 Mission-first: Work that makes a difference in people’s
  lives
  
   🤝 Inclusive culture: Committed to equity, diversity, and
  belonging
  
  We strive to make everyone feel comfortable and welcome!
  
  We work to create a holistic interview process, where both
  Quizlet and candidates have an opportunity to view what it
  would be like to work together, in exploring a mutually
  beneficial partnership.
  
  We provide a transparent setting that gives a comprehensive
  view of who we are!
  
  In Closing:
  
  At Quizlet, we’re excited about passionate people joining
  our team—even if you don’t check every box on the
  requirements list. We value unique perspectives and believe
  everyone has something meaningful to contribute. Our culture
  is all about taking initiative, learning through challenges,
  and striving for high-quality work while staying curious and
  open to new ideas. We believe in honest, respectful
  communication, thoughtful collaboration, and creating a
  supportive space where everyone can grow and succeed
  together.”
  
  Quizlet’s success as an online learning community depends on
  a strong commitment to diversity, equity, and inclusion.
  
  As an equal opportunity employer and a tech company
  committed to societal change, we welcome applicants from all
  backgrounds. Women, people of color, members of the LGBTQ+
  community, individuals with disabilities, and veterans are
  strongly encouraged to apply. Come join us!
  
  To All Recruiters and Placement Agencies:
  
  At this time, Quizlet does not accept unsolicited agency
