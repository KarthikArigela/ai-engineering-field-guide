description: |
  About Quizlet:
  
  At Quizlet, our mission is to help every learner achieve
  their outcomes in the most effective and delightful way.
  We’re a $1B+ learning platform used by two-thirds of U.S.
  high school students and half of college students, powering
  over 1 billion learning interactions each week.
  
  We blend cognitive science with machine learning to
  personalize and enhance the learning experience for
  students, professionals, and lifelong learners alike. We’re
  energized by the potential to power more learners through
  multiple approaches and various tools.
  
  Let’s Build the Future of Learning
  
  Join us to design and deliver AI-powered learning tools that
  scale across the world and unlock human potential.
  
  About the Team (Applied AI):
  
  Our mission is to invent and deploy the next generation of
  intelligent, personalized, and adaptive learning
  experiences. We’re consolidating AI efforts across the
  company into a unified portfolio and are accountable for a
  disproportionate share of Quizlet’s growth and product
  differentiation. You’ll partner closely with Product, Data
  Science, and the AI & Data Platform to deliver an AI‑driven
  learning coach that’s recognized as best‑in‑class.
  
  About the Role:
  
  We are looking for Applied AI Engineers at Staff and Sr.
  Staff levels (note: leveling decisions will be made during
  the interview process).
  
  You’ll be working at the forefront of our AI strategy,
  shaping Quizlet’s AI development in one of the two
  complementary domains:
  
  Personalization & Ranking – retrieval and ranking systems
  that match learners with the right content, experiences, and
  monetization moments across surfaces (search, feed,
  notifications, ads).
  
  Generative AI & Agentic Systems – LLM‑powered tutoring,
  content understanding/synthesis, and tools that boost
  learner outcomes and creator productivity.
  
  You will work on a variety of models and modeling systems
  (from Two‑Tower retrieval and multi‑task rankers to RAG/LLM
  pipelines), ensure robust evaluation, and responsible
  deployment
  
  We’re happy to share that this is an onsite position in
  either our Denver, San Francisco, Seattle, or NYC. To help
  foster team collaboration, we require that employees be in
  the office a minimum of three days per week: Monday,
  Wednesday, and Thursday and as needed by your manager or the
  company. We believe that this working environment
  facilitates increased work efficiency, team partnership, and
  supports growth as an employee and organization.
  
