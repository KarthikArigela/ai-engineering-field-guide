description: |
  This is a remote position.
  
  
  
      SoftSnow is an AI consulting company. Our mission is to
  empower businesses to navigate the complexities of AI
  adoption and accelerate their journey toward realizing its
  full potential. SoftSnow is the leading partner for mid-
  market companies, helping to strategically leverage AI to
  transform business operations, achieve unparalleled
  efficiency, and foster sustainable growth.
  
  
  
  
  
  
  
  
  
   Position Overview
  
  
  
  
  
  
  
  
  
      SoftSnow is seeking a highly analytical and creative
  individual to join our team as an AI Prompt Engineer. In
  this role, you’ll work at the forefront of generative AI,
  crafting precise, high-impact prompts that drive the
  behavior of large language models (LLMs) across a wide
  variety of enterprise use cases. This role is ideal for
  those with a deep understanding of language, context, and AI
  interaction dynamics who want to shape how AI agents
  respond, create, and support users.
  
  
  
  
  
  
  
  
  
      You’ll collaborate with Trainers, Integrators, and
  Product teams to optimize prompts, test variants, and ensure
  consistent, grounded outputs aligned with client objectives.
  If you’re excited by the nuances of human-AI language and
  eager to build prompt libraries that power intelligent
  systems, this role is for you.
  
  
  
  
  
  
  
  
  
   Key Responsibilities
  
  
  
  
  - Develop reusable prompt templates for client use cases such
    as customer support, content creation, internal
    operations, and data summarization.
  - Conduct A/B tests on prompt variations to evaluate model
    responses and iterate toward optimal performance.
  - Collaborate with AI Trainers and Integrators to embed
    prompts into AI workflows, memory systems, and RAG
    pipelines.
  - Refactor and maintain prompt libraries to reflect updated
    knowledge, tone guidelines, and client branding.
  - Stay up to date on emerging prompt engineering techniques,
    LLM behavior research, and advances in foundation models.
  
  Requirements
  
   Education:
  
  
  
  
  - Bachelor’s degree in Linguistics, Computer Science,
    Communications, or a related field.
  
  
  
  
  
  
  
  
   Experience:
  
  
  
  
  - 1–3 years of experience working with LLMs, conversational AI
    systems, or NLP applications.
  - Hands-on experience with tools such as OpenAI, Claude,
    Anthropic, or similar.
  - Demonstrated success crafting effective prompts across
    multiple use cases.
  
  
  
  
  
  
  
  
   Knowledge, Skills & Abilities:
  
  
  
  
  - Exceptional language intuition and understanding of prompt-
    response dynamics.
  - Ability to abstract task requirements into prompt formats
    that steer AI behavior.
  - Familiarity with context window limits, tokenization, and
    RAG methodology.
  - Strong critical thinking and experimental mindset.
  - Proficiency in Python or other scripting languages is a
    plus.
  - Excellent collaboration and documentation skills.
  
  Benefits
  
   What We Offer:
  
  
  
  
  - Comprehensive Training – Learn AI development through hands-
    on experience and mentorship.
  - Exciting Growth Opportunities – Join a fast-growing industry
    with endless possibilities.
  - Collaborative Environment – Work alongside top AI
    professionals in a supportive team.
  - Innovative Work – Be part of cutting-edge AI projects that
    shape the future of business.
  - Flexible Work Environment – Remote work opportunities with a
    results-driven approach.
  - Competitive Benefits - Designed to focus on our team's
    personal, professional and financial goals.
