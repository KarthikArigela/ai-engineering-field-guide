description: |
  The Calix platform enables Communication Service Providers
  (CSPs) of all sizes to transform and future-proof their
  businesses. Through real-time data, automation, and
  actionable insights delivered via Calix One — our cloud-
  first, AI-powered platform — CSPs can simplify operations,
  collapse cost, and accelerate innovation. Calix One brings
  together the automation of everything and the experience of
  one, empowering customers to deliver differentiated
  subscriber experiences while driving acquisition, loyalty,
  and revenue growth. This is the Calix mission: to enable
  CSPs of all sizes to simplify, innovate, and grow,
  strengthening both their businesses and the communities they
  serve. We’re at the forefront of a once in a generational
  change in the broadband industry. Join us as we innovate,
  help our customers reach their potential, and connect
  underserved communities with unrivaled digital experiences.
  
  Calix is where passionate innovators come together with a
  shared mission: to reimagine broadband experiences and
  empower communities like never before. As a true pioneer in
  broadband technology, we ignite transformation by equipping
  service providers of all sizes with an unrivaled platform,
  state-of-the-art cloud technologies, and AI-driven solutions
  that redefine what’s possible. Every tool and breakthrough
  we offer is designed to simplify operations and unlock
  extraordinary subscriber experiences through innovation.
  
  We are looking for a passionate and skilled AI Agent
  Development Engineer to join our team and build intelligent,
  autonomous agents that transform workflows and customer
  experiences. This is a hands-on role requiring strong
  technical expertise in AI agent frameworks and integration
  with enterprise systems.
  
  This is a remote-based position located in the United States
  or Canada. Please note that as part of the recruitment and
  hiring process, there is an in-person meeting that will take
  place.
  
  Key Responsibilities
  
  - Design & Build AI Agents: Develop and deploy agents capable
    of perception, reasoning, and autonomous action.
  - Integration: Integrate agents with existing external systems
    using REST APIs, microservices, and cloud platforms.
  - Optimization: Implement best practices for performance,
    scalability, and security in multi-agent environments.
  - Collaboration: Work with product managers and data
    scientists to align agent capabilities with business
    needs.
  - Innovation: Explore emerging technologies in Generative AI,
    LLM orchestration, and multi-agent frameworks.
  
  Required Skills & Qualifications:
  
  - 10+ years in software development with exposure to AI/ML
    projects.
  - Bachelor’s or Master’s in Computer Science, AI/ML, or
    related field.
  - Hands-on experience in developing AI agents using frameworks
    like Google ADK, LangChain, CrewAI, AutoGen, or similar.
  - Strong programming skills in Go, Rust, or Python (experience
    with PL/SQL or Java is a plus).
  - Familiarity with LLM integration, prompt engineering, and
    orchestration of multi-agent workflows.
  - Knowledge of vector databases, embeddings, and retrieval-
    augmented generation (RAG).
  - Understanding of Generative AI, NLP, and reinforcement
    learning concepts.
  
  Preferred:
  
  - Experience building custom AI agents for enterprise
    workflows (e.g., service request triage, summarization,
    proactive support).
  - Working with agent lifecycle management and AI profiles for
    model selection and orchestration.
  - Exposure to multi-agent collaboration and autonomous
    decision-making systems
  
  Why Join Us?
  
  - Be part of a team driving AI innovation in telecom and cloud
    solutions.
  - Opportunity to work on cutting-edge projects impacting
    millions of users.
  - Collaborative culture with continuous learning and growth.
  - Competitive Benefits and Vacation package.
  
  #LI-Remote
  
