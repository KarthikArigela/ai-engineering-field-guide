description: |
  McKesson is an impact-driven, Fortune 10 company that
  touches virtually every aspect of healthcare. We are known
  for delivering insights, products, and services that make
  quality care more accessible and affordable. Here, we focus
  on the health, happiness, and well-being of you and those we
  serve – we care.
  
  What you do at McKesson matters. We foster a culture where
  you can grow, make an impact, and are empowered to bring new
  ideas. Together, we thrive as we shape the future of health
  for patients, our communities, and our people. If you want
  to be part of tomorrow’s health today, we want to hear from
  you.
  
  We are seeking a highly skilled and experienced Senior AI
  Full Stack Software Engineer to join our innovative team at
  CMM. This role involves designing, developing, and deploying
  end-to-end AI-powered solutions, from robust backend
  services to intuitive user interfaces, to enhance our
  healthcare and decision-making platforms.
  
  
  
  Key Responsibilities
  
  - Lead AI-Driven Healthcare Solutions: Design and deploy AI
    applications that support decision-making, patient
    engagement, and operational efficiency.
  - Integrate AI into EHRs and Clinical Systems: Build scalable
    systems that incorporate LLMs, voice/image recognition,
    and document parsing into existing healthcare IT
    infrastructure.
  - Develop and Optimize Data Pipelines: Ensure secure, HIPAA-
    compliant data pipelines for training and deploying AI
    models using structured and unstructured healthcare data
    (e.g., clinical notes, imaging, lab results).
  - Model Evaluation and Compliance: Apply rigorous evaluation
    metrics (e.g., sensitivity, specificity, AUC-ROC) and
    ensure models meet regulatory and ethical standards.
  - Mentor and Lead: Guide junior engineers and contribute to
    the strategic direction of AI initiatives within the
    organization.
  - Rapid AI prototyping and iteration with product
    representatives to vet multiple concepts
  
  Minimum Qualifications
  
  - 10+ years of software engineering experience, with 4+ years
    in AI/ML development.
  - B.S. degree in Computer Science or related engineering
    discipline, or equivalent experience
  
  
  
  Critical Skills
  
  - 2+ years of experience building AI solutions in healthcare
    or life sciences.
  - Deep understanding of healthcare data standards (e.g., HL7,
    FHIR) and compliance frameworks (e.g., HIPAA, GDPR).
  - Healthcare AI Expertise: Proven ability to build AI models
    for clinical NLP, medical imaging, patient risk
    stratification, and care personalization.
  - LLM & RAG Systems: Skilled in building retrieval-augmented
    generation systems using tools like Pydantic, Semantic
    Kernel, LangChain, LlamaIndex, and vector databases.
  - Experienced in creating custom AI agents or spec-driven
    tools.
  - Experience writing skills for Claude, Copilot, Codex etc.
  - Prompt Engineering & Optimization: Advanced techniques for
    prompt tuning, caching, and benchmarking.
  - Full Stack Development: Proficiency in Python, Node.js, and
    modern web frameworks.
  
  
  
  Preferred Skills
  
  - Cloud & DevOps: Experience with secure cloud environments
    (AWS/GCP/Azure), containerization (Docker, Kubernetes),
    and CI/CD pipelines.
  - AI Tooling: Familiarity with OpenAI, Hugging Face, PyDantic
    AI, TensorFlow, PyTorch, and healthcare-specific AI
    libraries.
  - Communication & Leadership: Ability to communicate complex
    AI concepts to clinical and executive stakeholders and
    lead cross-functional teams.
  - Experience mentoring and developing juniors in development
    an AI concepts/best practices.
  
  
  
