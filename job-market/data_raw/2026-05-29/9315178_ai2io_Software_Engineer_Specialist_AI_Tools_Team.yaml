description: |
  AI2IO helps organizations navigate the complex landscape of
  technology solutions, from foundational IT services and
  system support to advanced software integration, automation,
  and cutting-edge AI implementations. Our expertise spans IT
  infrastructure management, custom software development,
  seamless system integrations, and optimization of low-code
  business automation, empowering clients to maximize their
  existing technology investments.
  
  Join us and be part of a team where your voice matters, your
  work makes an impact, and your growth is a shared priority.
  
  Position Title
  
  Software Engineer Specialist – AI Tools Team
  
  
  
  Position Location
  
  Remote – work virtually from anywhere in the United States
  
  
  
  Salary
  
  AI2IO recognizes salary ranges from job boards do not
  necessarily reflect our pay ranges.  In many instances we
  out-compete those ranges for well-qualified candidates.
  
  
  
  Job Summary
  
  As a Software Engineer Specialist, you will play a key role
  in designing, developing, and maintaining AI-focused
  software solutions and toolchains. In this role, you will
  collaborate with engineering colleagues to deliver
  intelligent applications and services that leverage
  technologies such as Azure AI Foundry, M365 Copilot
  Extensibility, the M365 Agents SDK, and Agent Framework. You
  will help create scalable, reliable, and user-friendly
  solutions that streamline workflows, enhance collaboration,
  and deliver meaningful AI capabilities.
  
  
  
  This position operates with limited day-to-day supervision
  and receives general guidance on new projects, tasks, and
  assignments. The successful candidate will contribute to
  work of complex scope and exercise sound judgment in
  addressing challenges independently.
  
  
  
  The successful candidate will perform responsibilities in
  alignment with organizational values, business objectives,
  and departmental priorities.
  
  
  
  Essential Functions
  
  Software Development
  
  - Design, develop, and maintain AI-focused software tools and
    services, ensuring they are scalable, reliable, and user-
    friendly.
  - Demonstrate proficiency in object-oriented programming and
    SOLID design principles, with practical on-the-job
    application in production software development.
  - Write and maintain high-quality, reusable, and testable code
    in either C# or Python, utilizing SDKs such as Agent
    Framework and M365 Agents SDK.
  
  AI Tools & Integration
  
  - Develop solutions leveraging M365 Copilot Extensibility,
    M365 Agents SDK, Agent Framework, and other agentic AI
    platforms to build intelligent assistants, agents, and
    conversational experiences.
  - Incorporate Azure AI Search to enhance software
    functionality and build RAG- and GraphRAG-based
    applications on Azure with integrations between Azure
    OpenAI Service and Azure Machine Learning.
  
  AI Model Optimization & Workflow
  
  - Utilize AI language models and prompt-engineering best
    practices to analyze, refine, and optimize code.
  - Leverage AI/ML techniques to streamline workflows, improve
    user experiences, and increase overall system performance.
  - Implement intelligent features, such as auto-completion,
    natural language queries, and context-aware insights,
    within custom applications.
  
  Collaboration
  
  - Collaborate with software engineers and related technical
    teams to support the seamless integration of AI
    components, microservices, and plugins within existing
    systems.
  - Collaborate effectively within the team and across
    engineering groups to support solution design,
    implementation, and delivery.
  - Communicate technical concepts clearly and effectively with
    team members and engineering partners to support
    collaboration and execution.
  
  Technical Expertise
  
  - Proficiency in either C# or Python and DevOps practices,
    with proven experience using Azure DevOps or similar CI/CD
    platforms.
  - Proficiency in AI development, with hands-on experience in
    at least one of the following areas: Azure AI Foundry,
    M365 Copilot Extensibility, the M365 Agents SDK, Agent
    Framework, or similar AI technologies.
  - Strong grasp of AI/ML concepts, such as LLMs, NLP, model
    fine-tuning, RAG, and GraphRAG, and the ability to
    implement solutions that leverage these concepts
    effectively.
  
  Completion of Assigned Tasks and Deliverables on Time and on
  Budget
  
  - Performs Other Related Duties as Assigned
  
  
  
  Position Requirements
  
  - Skilled in completing assignments accurately and with
    attention to detail.
  - Excellent problem-solving skills and attention to detail in
    designing and building AI solutions that meet or exceed
    user expectations.
  - Ability to communicate effectively in both oral and written
    form, including explaining complex technical concepts
    clearly to team members and engineering partners.
  - Ability to work successfully both independently and as a
    member of a team with minimal supervision.
  - Experience participating in code reviews, with the ability
    to provide insights related to performance tuning,
    scalability, and maintainability.
  - Stay up to date with the latest trends and advancements in
    AI, LLMs, and cloud-based development.
  - Demonstrated aptitude for learning new technologies and
    adapting to evolving requirements in the AI space.
  
  Travel / Relocation Requirements
  
  - Up to 5%, this may include travel to any or all 50 US states
  - Travel is defined as physically leaving home on behalf of
    business activities including but not limited to client
    sites, meetings with other employees, meeting for business
    development purposes, running errands on behalf of the
    business, attending industry conferences, etc.
  
  
  
  Education / Experience Requirements
  
  - Minimum of 5 years of experience in IT or software
    development, including at least 2 years in a role focused
    on AI tools and development.
  - Bachelor’s degree in IT, Information Systems, Computer
    Science, or a related discipline.
  
  Benefits
  
  AI2IO offers a very competitive benefits package; highlights
  include
  
  - Choice of comprehensive medical plans (including two PPO-
    style plans and a HDHP w/ HSA option)
  - Flex spending accounts (FSA)
  - Dental and vision plans
  - Comprehensive medical, dental and vision benefits extended
    to spouse / domestic partner and dependent children up to
    age 26
  - 401k with company match and self-directed brokerage account
    option
  - PTO including additional paid time off during the last week
    of the year
  - Company paid life insurance coverage for employees and their
    eligible dependents
  - Short and long-term disability, AD&D coverage
  - Professional development opportunities, tuition
    reimbursement and professional licensing assistance
  - Paid parental leave after one year of employment
  
  CO, CA, IL, NY, WA, and Washington DC residents only: In
  accordance with CO, CA, IL, NY, WA, and Washington DC law,
  the range provided is AI2IO's reasonable estimate of the
  base compensation for this role. The actual amount may
  differ based on non-discriminatory factors such as
  experience, knowledge, skills, abilities, and location.
  
  AI2IO is an EEO/Affirmative Action Employer and participates
  in the E-Verify program with the Department of Homeland
  Security. We encourage diversity in our workforce.
  
  Are you ready to challenge yourself and redefine standards
  in the AEC industry? Apply now and join our award-winning
  team!
  
