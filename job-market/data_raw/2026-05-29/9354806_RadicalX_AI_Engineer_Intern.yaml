description: |
  This is a remote job
  
  About Radical AI:
  
  Radical AI is at the forefront of developing open-source AI
  tools to enhance education and career opportunities,
  fostering a future where technology benefits all. Our Social
  Good Lab is a dynamic collaborative space where we tackle
  real-world challenges, advancing AI for global good. We
  champion a culture of open development, crafting tools that
  support educators and learners worldwide. At Radical AI, we
  believe in learning by doing, building impactful AI tools
  while providing a platform where people can grow their
  skills and advance their careers.
  
  Role Overview:
  
  As an Artificial Intelligence Engineer Intern at Radical AI,
  your role is pivotal in sculpting the future of AI
  applications. You'll harness the power of groundbreaking
  foundational models and platforms to create, enhance, and
  fine-tune intelligent systems. You will contribute to
  projects such as Kai (https://kai.radicalai.app/) and our
  other digital workers including an AI Teaching Assistant, AI
  Career Coach, and AI Project Manager.
  
  Key Responsibilities:
  
  - Collaborate on AI projects such as an AI Teaching Assistant,
    AI Career Coach, and AI Project Manager, focusing on
    development and refinement.
  - Design, code, and test software solutions as part of a team.
  - Research and apply the latest AI technologies and methods.
  - Enhance internal processes by implementing automation and
    optimizing data usage.
  
  Requirements
  
  - Strong interest in AI, Machine Learning, and Natural
    Language Processing.
  - Excellent skills in analyzing problems, solving them, and
    thinking creatively.
  - Good at communicating and working well with others.
  - Preferably experienced with Python and AI development tools
    like TensorFlow and PyTorch.
  - A background in Computer Science, AI, or similar areas, with
    at least a Bachelor's degree, is preferred.
  
  Benefits
  
  - This internship is unpaid, but it offers great chances for
    personal and professional development.
  - You'll get to use top-notch AI tools and productivity
    software.
  - This is an excellent learning opportunity with a team that
    is passionate about AI and its ability to improve
    education.
  - You can choose your own work hours, offering flexibility in
    your schedule.
