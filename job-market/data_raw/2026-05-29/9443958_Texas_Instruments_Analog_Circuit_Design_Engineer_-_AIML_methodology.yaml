description: |
  About the Opportunity
  
  Are you an engineer who thinks in circuits and code? Texas
  Instruments is looking for an Analog Design Engineer to join
  a first-of-its-kind team where classical analog IC design
  meets artificial intelligence. This is a rare opportunity to
  be part of a small, high-impact group that is actively
  shaping how analog products are built at one of the world's
  leading semiconductor companies.
  
  What You Will Work On
  
  As an Analog Design Engineer, you will create integrated
  circuit designs that help bring new TI products to life and
  make our customers' visions a reality. You will define,
  design, model, implement, and document analog integrated
  circuits (ICs) across a wide range of end equipment,
  including audio, imaging, high-speed, interface, clocking,
  medical, high volume linear, automotive, storage, power
  supply, battery management, and linear power applications.
  
  You will work on state-of-the-art wafer processes, learning
  from and collaborating with industry experts in a unique
  interdisciplinary team with a fast-paced, startup-like
  environment. Your day-to-day work will include designing and
  drawing schematics, simulating for functionality and
  parametric performance, and assisting in IC layout and post-
  layout extracted simulations.
  
  Beyond traditional analog design, you will apply AI/ML-
  enabled tools and flows to accelerate product development
  and create novel circuits. You will own and drive the
  adoption of these tools and flows across TI product teams,
  and you will have the creative freedom to develop novel
  ideas that can be patented and published. You will also gain
  exposure to Design Verification and Digital Design through
  formal learning, projects, and on-the-job experiences that
  will broaden your knowledge and accelerate your growth at
  TI.
  
  Bring your programming and AI/ML skills to this role and
  make an impact across the company!
  
  Qualifications
  
  Minimum requirements:
  
  - Bachelor's in Electrical Engineering, Computer Engineering,
    Electrical and Computer Engineering, or a related field
  - 2 to 5 years experience
  - Cumulative 3.0/4.0 GPA or higher
  
   Preferred qualifications:
  
  - Strong fundamentals in analog circuit design concepts with
    relevant coursework and design projects
  - Course project or internship experience in the design,
    simulation, and layout of one or more analog IPs, such as
    band-gap reference, ADC, DAC, amplifier, oscillator,
    comparator, IO cells, and power-management blocks like LDO
    and DCDC.
  - Familiarity with corners, statistical analysis, and post-
    layout concepts is a plus.
  - Working knowledge of Cadence Virtuoso ADE, including Maestro
    and SPECTRE simulator
  - Foundational proficiency in Python and one or more packages
    such as Pandas, PyTorch, TensorFlow, scikit-learn, and
    Matplotlib
  - Foundational knowledge of machine learning concepts such as
    Neural Networks, Graphs, Clustering and Regression
    techniques, and Decision Trees
  - Strong verbal and written communication skills
  - Demonstrated analytical and problem-solving skills,
    especially in new domains
  - Ability to work in teams across time zones and collaborate
    effectively with people in different functions
  - Ability to take initiative and drive for results in a timely
    manner
  
  About Us
  
  
  
   Why TI?
  
  
  
  
  
  - Engineer your future. We empower our employees to truly own
    their career and development. Come collaborate with some
    of the smartest people in the world to shape the future of
    electronics.
  - We're different by design. Diverse backgrounds and
    perspectives are what push innovation forward and what
    make TI stronger. We value each and every voice, and look
    forward to hearing yours. Meet the people of TI
  - Benefits that benefit you. We offer competitive pay and
