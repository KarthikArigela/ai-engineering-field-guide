description: |
  About the Job:
  
  As an App Engineer focused on AI and Automation within
  LaunchDarkly’s IT and Internal AI team, you will build AI-
  powered workflows, agents, and automations that improve how
  employees work. You will partner with teams across the
  company and contribute to solutions that scale productivity
  across a global organization.
  
  Responsibilities:
  
  - Build and deploy AI-powered agents, scripts, and automations
    that reduce manual work and improve employee productivity
  - Translate defined requirements into working solutions using
    Python, AI coding tools, and automation platforms
  - Integrate workflows with internal systems and data sources
    in partnership with the data team
  - Measure and track the impact of your solutions using metrics
    such as time saved, adoption, and cost efficiency
  - Improve existing automations by debugging issues, increasing
    reliability, and incorporating user feedback
  - Reuse internal AI platform capabilities such as shared
    services, skills, or MCP servers when available
  - Collaborate with global teams, including US-based
    stakeholders, to align on priorities and deliver solutions
    across time zones
  
  Qualifications:
  
  - Experience building applications, scripts, or automations
    using Python or similar languages
  - Hands-on experience using AI-assisted development tools such
    as Claude Code or similar
  - Working experience with data systems, including querying
    databases and working with structured datasets
  - Experience using no-code or low-code automation and AI tools
    such as Workato, Glean, or similar
  - Ability to deliver working solutions to clearly defined
    problems with appropriate guidance
  - Experience contributing to production systems using version
    control, testing, and deployment practices
  - Exposure to building or working with AI agents beyond
    prompt-based workflows
  - Experience integrating APIs or multiple systems into a
    single workflow
  
  About LaunchDarkly:
  
  Modern software delivery was supposed to be the foundation
  for a thriving digital business but reality has proven
  otherwise. Slow, inefficient development cycles, costly
  outages, and fragmented customer experiences are preventing
  developers from building their best software. The
  LaunchDarkly platform helps developers innovate on new
  features faster while protecting them with a safety valve to
  instantly rewind when things go wrong. Developers can target
  product experiences to any customer segment and maximize the
  business impact of every feature. And by gradually rolling
  out new application components, they escape nightmare "big-
  bang" technology migrations.
  
  The LaunchDarkly platform was built to guide engineers to
  the next frontier of DevOps by:
  
  - Improving the velocity and stability of software releases,
    without the fear of end customer outages
  - Delivering targeted experiences by easily personalizing
    features to customer cohorts
  - Maximizing the business impact of every feature through the
    ability to experiment and optimize
  - Coordinating the release and optimization of software to
    provide consistent experiences across mobile platforms and
    device types
  - Improving the effectiveness and productivity of engineering
    teams, by providing insights into engineering cadence and
    stability
  
