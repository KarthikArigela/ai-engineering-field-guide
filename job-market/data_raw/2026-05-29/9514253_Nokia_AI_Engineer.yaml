description: |
  As an AI R&D Engineer student  at Nokia, you will be
  responsible for engaging R&D of cutting-edge AI solutions
  that can effectively leverage Generative AI, Agents, Deep
  Learning, and Machine Learning to power a wide range of
  products & platforms – from analytics to security to telecom
  core capabilities.  Nokia relies on innovative AI research
  and applications that you will help us build.
  
  
  Responsibilities
  
  - Collaborate with world-class engineers and researchers.
  - Develop and deploy advanced AI models and applications.
  - Explore emerging technologies like GenAI and autonomous
    agents.
  - Turn ideas into impactful solutions used at a global scale.
  
  Qualifications
  
  Must have:
  
  - Machine learning, optimization algorithms, and deep-learning
    techniques.
  - Machine learning frameworks (e.g., TensorFlow, PyTorch).
  - Search engines and vector databases, along with their
    underlying algorithms.
  - Big data frameworks and technologies such as Spark, Kafka,
    and Cassandra.
  
  - Excellent communication skills and is a team player.
  
  Nice to have:
  
  - Previous Nokia intern or co-op experience.
  
  About Us
  
   Advancing connectivity to secure a brighter world.
  
  
  
  Nokia is a global leader in connectivity for the AI era.
  With expertise across fixed, mobile and transport networks,
  powered by the innovation of Nokia Bell Labs, we’re
  advancing connectivity to secure a brighter world.
  
   Learn more about life at Nokia.
  
  
  
  
  
  
  
