title: Software Engineer II, GTM AI Agents
company: Toast
location: USA
remote: true
work_type: FULL_TIME
description: |
  Toast creates technology to help restaurants and local
  businesses succeed in a digital world, helping business
  owners operate, increase sales, engage customers, and keep
  employees happy.
  
  Toast is looking for a driven Software Engineer (SE2) to
  join the GTM & AI Strategy Engineering team. In this role,
  you will be a key contributor to building 0-to-1 tools
  designed to revolutionize how our sales teams operate. You
  will focus on writing clean, scalable code and implementing
  intelligence models that eliminate friction across the Go-
  To-Market stack.
  
  Working alongside Senior and Staff engineers, you will help
  build and productionize agentic workflows and RAG pipelines
  to automate sales processes. You will integrate AI services
  into our tech stack while ensuring high standards for code
  quality, observability, and performance.
  
  A day in the life (Responsibilities)
  
  - Hands-on Execution: Spend the majority of your time coding
    and developing backend services and ML pipelines, ensuring
    they meet Toast’s standards for reliability.
  - Feature Development: Contribute to the development of new
    internal products that leverage LLMs and Agentic AI to
    automate account research and lead prioritization.
  - Integration & Maintenance: Build and maintain the backend
    connections between our custom quoting engine, Salesforce,
    and internal data lakes to ensure a seamless data flow.
  - Technical Problem Solving: Collaborate with the team to
    solve synchronization challenges and ensure GTM systems
    remain scalable and resilient.
  - Deliver Core Capabilities: Take defined product requirements
    and turn them into well-tested, production-ready code.
  - Operational Excellence: Participate in code reviews and help
    maintain deep observability for every service the team
    ships.
  
  What you'll need to thrive (Requirements)
  
  - Backend Proficiency: Proven experience in backend languages
    (such as Java, Go, or Python) with a solid understanding
    of building and maintaining web services.
  - Practical AI/ML Interest: Exposure to or professional
    experience working with LLMs, prompt engineering, or RAG-
    based applications.
  - Solid Engineering Fundamentals: Experience with RESTful
    APIs, relational databases, and writing clean,
    maintainable, and well-tested code.
  - Collaborative Mindset: Ability to work effectively within a
    team, take technical direction, and contribute to
    architectural discussions.
  - Education: Bachelor’s degree in Computer Science, or a
    related technical field.
  
  What will help you stand out (Nonessential Skills/Nice to
  Haves)
  
  - Familiarity with cloud infrastructure, specifically AWS
    (Lambda, SQS, or SageMaker).
  - Experience with event-driven architectures or message
    queues.
  - A passion for automation and simplifying complex manual
    workflows.
  
  #LI-Remote
  
