  Inclusion @ Rubrik
  
  At Rubrik, we are dedicated to fostering a culture where
  people from all backgrounds are valued, feel they belong,
  and believe they can succeed. Our commitment to inclusion is
  at the heart of our mission to secure the world’s data.
  
  Our goal is to hire and promote the best talent, regardless
  of background. We continually review our hiring practices to
  ensure fairness and strive to create an environment where
  every employee has equal access to opportunities for growth
  and excellence. We believe in empowering everyone to bring
  their authentic selves to work and achieve their fullest
  potential.
  
  Our inclusion strategy focuses on three core areas of our
  business and culture:
  
  - Our Company: We are committed to building a merit-based
    organization that offers equal access to growth and
    success for all employees globally. Your potential is
    limitless here.
  - Our Culture: We strive to create an inclusive atmosphere
    where individuals from all backgrounds feel a strong sense
    of belonging, can thrive, and do their best work. Your
    contributions help us innovate and break boundaries.
  - Our Communities: We are dedicated to expanding our
    engagement with the communities we operate in, creating
    opportunities for underrepresented talent and driving
    greater innovation for our clients. Your impact extends
    beyond Rubrik, contributing to safer and stronger
    communities.
  
