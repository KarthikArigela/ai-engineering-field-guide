description: |
  FactSet creates flexible, open data and software solutions
  for over 200,000 investment professionals worldwide,
  providing instant access
  
  to financial data and analytics that investors use to make
  crucial decisions.
  
  At FactSet, our values are the foundation of everything we
  do. They express how we act and operate, serve as a compass
  in our decision-making, and play a big role in how we treat
  each other, our clients, and our communities. We believe
  that the best ideas can come from anyone, anywhere, at any
  time, and that curiosity is the key to anticipating our
  clients’ needs and exceeding their expectations.
  
  The Services organization focuses on evolving FactSet’s
  global service delivery model by streamlining operational
  workflows and improving data quality, transparency, and
  efficiency. This includes core platforms such as Portfolio
  Reconciliation Utility, Portfolio Health, Lifecycle
  Dashboards, and Portfolio Services Dashboards—foundational
  capabilities that support FactSet’s growing Managed Services
  and Portfolio Services business.
  
  The Services Engineering team builds and operates workflow-
  and data-intensive platforms that provide transparency into
  data processing pipelines, ensure data accuracy and
  completeness, and deliver reliable, presentation-ready
  outputs at scale.
  
  We are seeking a Senior Software Engineer to join our
  Services Engineering team as a senior individual
  contributor. This role focuses on improving Services
  efficiency by building scalable platforms and tooling that
  help automate workflows and scale the Services platform. The
  ideal candidate combines strong hands-on engineering skills
  with architectural thinking and the ability to lead through
  technical influence.
  
  As a key member of the team, you will collaborate closely
  with the FactSet AI group, working with cutting-edge agentic
  technologies to deliver our Services Agent workflow. You’ll
  leverage your deep engineering expertise and architectural
  vision to influence technical decisions, shape best
  practices, and mentor fellow engineers.
  
  What You'll Do
  
  - Design, build, and evolve scalable software solutions and
    tooling to improve operational efficiency and scalability
    across the Services platform
  
  - Design and implement an evaluation framework for MCP servers
    and tools in the Services ecosystem
  
  - Lead technical implementation of automation and tooling
    initiatives that support growth of managed and operational
    services
  
  - Contribute hands-on to complex codebases, system
    integrations, and critical production workflows
  
  - Partner with Product Management, Operations, and other
    engineering teams to translate business needs into
    effective technical solutions
  
  - Participate in technical design reviews and help guide
    architectural decisions to ensure maintainability and
    long-term scalability
  
  - Collaborate with clients and internal stakeholders to
    understand service workflows, constraints, and evolving
    requirements
  
  - Mentor and support other engineers through code reviews,
    technical guidance, and best practice sharing
  
  - Help drive engineering excellence around code quality,
    testing, reliability, and operational best practices
  
  What We're Looking For
  
  Required Skills
  
  - 5+ years of professional software engineering experience
  
  - Strong hands-on full stack development experience with
    Python, VueJS/Typescript, PostGres or similar relational
    database
  
  - Familiarity with LangChain, LangSmith, or similar AI
    frameworks.
  
  - Familiarity with MCP protocol implementation and related
    standards.
  
  - Solid foundation in system design and architecture for
    scalable, production-grade systems
  
  - Experience building or operating data-intensive, workflow-
    driven, or service-oriented platforms
  
  - Strong understanding of data structures, algorithms, and
    software engineering principles
  
  - Strong communication skills and ability to collaborate
    effectively across teams
  
  Desired Skills
  
  - Experience designing and building chat-based interfaces,
    agent-driven systems, or conversational workflows
  
  - Experience with C#, NodeJS
  
  - Familiarity with patterns for orchestration, automation, and
    event-driven systems
  
  - Familiarity with cloud-native architectures and modern data
    platforms
  
  - Experience designing tooling to improve operational
    efficiency
  
  - Experience working in Agile development environments
  
  Company Overview:
  
  FactSet (NYSE:FDS | NASDAQ:FDS) helps the financial
  community to see more, think bigger, and work better. Our
  digital platform and enterprise solutions deliver financial
  data, analytics, and open technology to more than 8,200
  global clients, including over 200,000 individual users.
  Clients across the buy-side and sell-side, as well as wealth
  managers, private equity firms, and corporations, achieve
  more every day with our comprehensive and connected content,
  flexible next-generation workflow solutions, and client-
  centric specialized support. As a member of the S&P 500, we
  are committed to sustainable growth and have been recognized
  among the Best Places to Work in 2023 by Glassdoor as a
  Glassdoor Employees’ Choice Award winner. Learn more
  at www.factset.com and follow us on X and LinkedIn.
  
  At FactSet, we celebrate difference of thought, experience,
  and perspective. Qualified applicants will be considered for
  employment without regard to race, color, religion, national
  origin, sex, sexual orientation, gender identity,
  disability, protected veteran status or other
  characteristics protected by law. FactSet participates in
  E-Verify
