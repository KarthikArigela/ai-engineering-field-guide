description: |
  Hello, We’re Built In
  
  What We’re Up To
  
  Built In is the only recruitment and employer reputation
  platform that helps companies measure and shape their
  reputation in AI search — so they can be visible, trusted,
  and chosen by top talent.
  
  The HR tech space is filled with AI noise, but the real
  disruption is happening on the candidate side. By 2028, more
  candidates will use AI assistants like ChatGPT and
  Perplexity to discover and apply for jobs — fundamentally
  changing how talent and employers connect. Built In is the
  first to build for this new reality, giving companies the
  ability to understand and influence how they appear in AI-
  driven search.
  
  Our platform already reaches millions of tech professionals
  each month, and our 1,800+ customers — from startups to
  Fortune 100 companies — rely on us to tell authentic
  stories, showcase opportunities, and attract top talent.
  With our newest AI-powered tools, we’re evolving Built In
  into a data-rich, reputation-driven platform that’s shaping
  the future of hiring
  
  What You’ll Be a Part Of
  
  Built In is 14 years strong but operates with the energy and
  pace of a startup. We ship fast, learn constantly, and build
  with purpose. As an engineer here, you’ll have the chance to
  design and deliver products at the intersection of AI,
  reputation, and search — directly influencing how millions
  of professionals and thousands of companies connect.
  
  You’ll join a team that values curiosity, accountability,
  and being good humans first. Our engineering culture is
  rooted in collaboration, trust, and continuous improvement.
  
  If you want to build products that matter, shape how AI
  transforms the future of work, and make a visible impact
  inside a company that’s redefining its category — this is
  the opportunity for you
  
  
  
  We’re looking for an Applied AI Principal/Staff Engineer
  
  We are looking for an Applied AI Principal/Staff Engineer to
  design and build the autonomous systems that power Built
  In’s product suite. Our platform already generates deep
  analytical insights for customers—your job is to build the
  Agentic Action Layer that turns those insights into
  outcomes. You will create multi-agent systems that don’t
  just surface data but take intelligent, supervised action
  across the major AI frontiers: ChatGPT, Google Gemini, and
  Perplexity.
  
  The ideal candidate has already shipped production agentic
  systems and knows where orchestration frameworks help versus
  where they get in the way. You operate with a human-in-the-
  loop mindset, using agentic tooling to compress what would
  traditionally be a team-sized effort into individual
  throughput—without sacrificing reliability.
  
  How You’ll Contribute
  
  - Architect Agentic Systems: Design and implement production-
    grade agentic workflows—including Reflection, Self-
    Correction, Planning, and Multi-Agent Orchestration
    patterns—to power a growing portfolio of AI-driven product
    capabilities.
  - Operationalize Agents in Production: Own the full lifecycle
    from rapid prototype to production deployment. Build agent
    systems with real-world constraints in mind: token
    budgets, latency targets, graceful degradation, and cost
    observability.
  - Evolve Multi-Model Intelligence: Develop systems that
    synthesize outputs from ChatGPT, Gemini, and Perplexity to
    identify sentiment discrepancies, detect brand
    hallucinations, and surface actionable intelligence for
    customers.
  - Build Scalable Cloud Infrastructure: Design and maintain
    serverless backend services using Python and AWS Lambda,
    ensuring agents perform efficiently at scale with proper
    observability.
  - Drive Evaluation and Quality: Build LLM-as-a-Judge
    evaluation frameworks, trace-based testing pipelines, and
    quality feedback loops that keep agent output reliable as
    models and prompts evolve.
  - Collaborate Across Teams: Work closely with Software
    Engineers and Product Managers to integrate agentic
    behaviors into production frameworks, ensuring AI systems
    are stateful, observable, and resilient.
  
  What You Bring
  
  - 10 + years of deep experience designing and shipping
    autonomous systems using patterns like ReAct, Planning,
    Reflection, and Multi-Agent Orchestration. You’ve moved
    agents from demo to production and dealt with the hard
    parts: failure handling, state management, and non-
    deterministic outputs.
  - Expert-level implementation experience with frontier model
    APIs from OpenAI, Google, and Perplexity, including
    function calling, structured outputs, and streaming.
  
  - You are a power user of agentic developer tools (e.g.,
    Claude Code, Cursor, or custom agentic CLI workflows). You
    use these to architect, refactor, test, and ship—not just
    autocomplete.
  - Demonstrated ability to manage multiple autonomous agents
    across a codebase: writing, testing, and auditing code
    with minimal manual intervention.
  
  - Strong proficiency in Python for AI orchestration, plus
    working knowledge of C# / .NET. Our core platform runs on
    .NET, and you’ll need to integrate your agent systems with
    it—not just work alongside it.
  - Practical experience deploying and operating serverless
    architectures on AWS (Lambda, Step Functions, EventBridge)
    for high-frequency, agentic workloads.
  
  - Experience building custom evaluation frameworks (LLM-as-a-
    Judge, trace-based testing, regression suites) to maintain
    and improve agent output quality over time. You understand
    that the hardest part of production agents isn’t building
    them—it’s knowing when they’re wrong.
  
   Why Work With Us
  
  - Help shape intelligent systems that act autonomously in
    real-world environments
  - Be part of a product-led, engineering-driven culture
  - Remote-first team with collaborative, flexible work
    structure
  - Opportunities for leadership and technical ownership in AI
    development
  
   What We Value
  
  We’re revolutionizing tech recruitment. So we question
  everything, because the best answers sit just to the right
  of a question mark. That’s our heritage as a disruptive
  company — as a company whose future depends on our capacity
  to innovate with a sense of drive, purpose and urgency. If
  you join Built In, you will work from this set of values:
  
  - Be Inclusive, Always. We’re committed to a culture where all
    people are respected, have a say and can be their whole
    selves. We will uplift and advocate for one another.
    Always.
  - Be Unreasonably Passionate. Our passion is borderline
    obsessive, and we’re ok with that. No one ever built
    anything great on a “meh.” We work with outsized passion
    to fulfill our mission.
  - Be Humble. You don’t have all the answers. Luckily, you
    don’t have to. Don’t worry about being right. Be humble
    instead.
  - Stay Curious. Curiosity is a springboard to the future. It
    can transform the wisp of an idea into a breakthrough. We
    ask “what if.” We work with wonder. It’s how we innovate.
  - Lead with Solutions. Question everything. But offer
    solutions as you do. Raise issues. But propose a few
    answers. For every hole you poke, offer a way to patch it
    up.
  - Own the Result. We have no time for blame or shame. When you
    stumble, own it, learn from it + get back to business.
  - Do More. Do more than your job description. Take initiative.
    Take charge. No job is beneath you, and no job is too big.
    Be a leader and do more — do whatever it takes.
  
   Be Inclusive, Always
  
  Research shows that women and other marginalized groups tend
  to apply to roles only when they check every point on a job
  description. We encourage you to apply if you meet the
  majority of qualifications and this role is aligned with
  your career trajectory.
  
  Built In is an equal employment opportunity employer.
  Qualified candidates are considered for employment without
  regard to race, religion, gender, gender identity, sexual
  orientation, national origin, age, military or veteran
  status, disability, or any other characteristic protected by
  applicable law.
  
  Built In is guided by principles of diversity, equity and
  inclusion (DEI). We are committed to this work over the
  long-term, but here’s some of what’s in place today:
  
  - We have three thriving ERG groups: BuiltOut, United We
    Parent and Women United in Tech.
  - We are proud to be led by a woman CEO and founder, and that
    more than half of our managers and employees identify as
    women
  
