description: |
  NVIDIA has been transforming computer graphics, PC gaming,
  and accelerated computing for more than 25 years. It’s a
  unique legacy of innovation that’s fueled by great
  technology—and amazing people. Today, we’re tapping into the
  unlimited potential of AI to define the next era of
  computing. An era in which our GPU acts as the brains of
  computers, robots, and self-driving cars that can understand
  the world. Doing what’s never been done before takes vision,
  innovation, and the world’s best talent. As an NVIDIAN,
  you’ll be immersed in a diverse, supportive environment
  where everyone is inspired to do their best work. Come join
  the team and see how you can make a lasting impact on the
  world.
  
  We are seeking a Machine Learning Compiler Engineer with
  deep expertise in compiler technologies to join our team.
  The ideal candidate will bring broad experience across the
  machine learning landscape—including reinforcement learning,
  genetic/evolutionary algorithms, predictive modeling,
  complex systems, and the analysis/manipulation of high-
  dimensional data—while also having strong foundations in
  compiler design and domain-specific languages.
  
  What you'll be doing:
  
  Become part of the team committed to progressing novel and
  inventive solutions in compilers and development tools,
  focusing on applied machine learning and artificial
  intelligence.
  
  Join committed team members in leading tech sectors.
  Innovate in machine learning, system design, and more.
  Influence global products.
  
  What we need to see:
  
  - BS/MS/PhD in Computer Science or related field (or
    equivalent experience) with focus on machine learning and
    compiler development tools
  - 8+ years of software engineering and ML experience (tools
    development preferred)
  - Strong knowledge of compilers, code generation, and GPU
    architecture
  - Demonstrated technical proficiency and hands-on experience
    in Python, C/C++, Julia, and Lisp/Scheme
  - Solid mathematical and scientific foundation relevant to ML
    and compiler technologies
  
  Ways to Stand Out From the Crowd:
  
  - Familiarity with reinforcement learning,
    genetic/evolutionary algorithms, predictive modeling, and
    complex systems
  - Expertise in developing and deploying AI/ML solutions to
    production environments and embedded systems
  - Hands-on experience building compilers or compiler
    components using the LLVM framework, including
    optimization passes, code generation, or frontend
    integration
  
  With highly competitive salaries and a comprehensive
  benefits package, NVIDIA is widely considered to be one of
  the technology industry's most desirable employers. We have
  some of the most brilliant and hardworking people in the
  world working with us and our product lines are growing fast
  in some of the hottest state of the art fields such as
  Virtual Reality, Artificial Intelligence, Deep Learning and
  Autonomous Vehicles.
  
  Your base salary will be determined based on your location,
  experience, and the pay of employees in similar positions.
  The base salary range is 184,000 USD - 287,500 USD.
  
  You will also be eligible for equity and benefits.
  
  Applications for this job will be accepted at least until
  May 16, 2026.
  
  This posting is for an existing vacancy.
  
