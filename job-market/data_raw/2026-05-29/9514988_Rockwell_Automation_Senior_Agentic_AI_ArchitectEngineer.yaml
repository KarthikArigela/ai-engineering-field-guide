description: |
  Rockwell Automation is a global technology leader focused on
  helping the world’s manufacturers be more productive,
  sustainable, and agile. With more than 28,000 employees who
  make the world better every day, we know we have something
  special. Behind our customers - amazing companies that help
  feed the world, provide life-saving medicine on a global
  scale, and focus on clean water and green mobility - our
  people are energized problem solvers that take pride in how
  the work we do changes the world for the better.
  
  We welcome all makers, forward thinkers, and problem solvers
  who are looking for a place to do their best work. And if
  that’s you we would love to have you join us!
  
  Job Description
  
  As a Senior Agentic AI Architect/Engineer, you will be a
  technical leader within our AI Engineering organization. You
  will implement our enterprise AI vision by architecting
  Generative AI and Agentic AI solutions. You have experience
  leading projects, optimizing ML systems for performance, and
  building MLOps infrastructure in cloud-native environments.
  You will report to the Director of Agentic AI. You will work
  remote.
  
  Primary Responsibilities:
  
  Agentic AI Application and Pipeline Engineering:
  
  Architect AI Agents that use Tools and Skills including
  instantiation of MCP clients and servers.
  
  Additionally, architect scalable end-to-end Retrieval-
  Augmented Generation (RAG) pipelines. These pipelines
  include data ingestion, document processing, and promoting
  generation, such as using Azure OpenAI embeddings or Gemini
  embeddings. Additionally, they involve integration with
  vector and NoSQL databases.
  
  Performance Optimization: Increase model serving layers and
  high-throughput data processing pipelines, employing
  advanced libraries (e.g., Polars) to ensure ultra-low
  latency and efficient resource use across the cloud
  environment.
  
  System Architecture & Security: Designing and implementing
  secure system architectures for all new AI products. These
  architectures ensure strict compliance with enterprise-wide
  data governance and security policies through mechanisms
  such as PII filtering and guarded conversation frameworks.
  
  Infrastructure Automation & CI/CD: Understand how to use
  Terraform for provisioning and manage Azure infrastructure-
  as-code. Understand centralized observability (logging and
  alerting) to support automated and reproducible Continuous
  Integration/Continuous Deployment (CI/CD) pipelines.
  
  The Essentials - You Will Have
  
  - Bachelor's Degree in Relevant Field or Equivalent Years of
    Relevant Experience.
  - We require legal authorization to work in the U.S. We will
    not sponsor individuals for employment visas, now or in
    the future, for this job opening.
  
  The Preferred - You Might Also Have:
  
  - Typically requires 8+ years of relevant work experience.
  - Expert-level proficiency in Python and SQL.
  - Hands-on experience developing and deploying Generative AI
    solutions, RAG pipelines, and multi-agent frameworks,
    regardless of the underlying cloud vendor.
  - 5+ years of experience with major cloud platforms,
    specifically Microsoft Azure, AWS, or Google Cloud
    Platform (GCP).
  - 1+ years of experience working with and integrating with ERP
    solutions like IFS Cloud
  - 1+ years of experience working with and managing partners
    through end-to-end solution design through delivery
  - Worked on core MLOps and orchestration tools, including
    Docker, Airflow
  - Worked with vector search platforms like Azure Cosmos DB for
    PostgreSQL, Redis, Azure AI Search, or pgvector/Mongo
    Atlas.
  - Familiarity with classical ML modeling techniques such as
    Causal Inference, Matrix Factorization, XGBoost
  - Familiarity with Scaled Agile Framework (SAFe)
    methodologies.
  
  What We Offer:
  
  - Health Insurance including Medical, Dental and Vision
  - 401k
  - Paid Time off
  - Parental and Caregiver Leave
  - Flexible Work Schedule where you will work with your manager
    to enjoy a work schedule that can be flexible with your
    personal life.
  - To learn more about our benefits package, please visit at
    www.raquickfind.com.
  
  For this role, the total target compensation is from
  $146,880.00 - $220,320.00 USD Annual. Actual pay will be
  based on factors such as skills, knowledge, education, and
  experience.
  
  At Rockwell Automation we are dedicated to building a
  diverse, inclusive and authentic workplace, so if you're
  excited about this role but your experience doesn't align
  perfectly with every qualification in the job description,
  we encourage you to apply anyway. You may be just the right
  person for this or other roles.
  
  This position is part of a job family. Experience will be
  the determining factor for position level and compensation.
  
