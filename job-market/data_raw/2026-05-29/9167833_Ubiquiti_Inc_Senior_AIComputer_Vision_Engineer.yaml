description: |
  About Ubiquiti
  
  At Ubiquiti Inc., we create technology platforms for
  Businesses, Smart Homes, and Internet Service Providers,
  driven by our goal to connect everyone, everywhere. To date,
  Ubiquiti has shipped over 100 million devices worldwide,
  from ISP networking products to next generation of IT
  solutions. Our growth is made possible by the dedicated team
  of hundreds behind the scenes. From software developers and
  product managers to designers and strategists, Team UI is
  driven to achieve our common goal: Rethinking IT. At
  Ubiquiti, you’ll heighten your potential and broaden your
  horizons - all while shaping the future of connectivity.
  
  We’re looking for a Senior AI/Computer Vision Engineer to
  build AI systems end to end, from defining the problem and
  data requirements to training models, validating them,
  deploying on edge devices, and integrating them into C++
  pipelines.
  
  This is a hands-on engineering role for someone who can take
  applied AI projects from concept to production and is
  comfortable working across modeling, evaluation, deployment,
  and system integration.
  
  Responsibilities:
  
  - Own AI and computer vision projects end to end, from
    technical definition to production deployment;
  - Translate product needs into system, data, model, and
    evaluation requirements;
  - Define data collection, annotation, and validation
    strategies;
  - Train and optimize deep learning models for real-world
    vision and multimodal applications;
  - Build testing, benchmarking, and failure analysis workflows;
  - Optimize models for edge devices with attention to latency,
    memory, throughput, and accuracy tradeoffs;
  - Integrate models into production inference systems,
    including C++ edge pipelines;
  - Work closely with software and product teams to ship
    reliable AI features at scale.
  
  Requirements:
  
  - MS or PhD in Computer Science, Electrical Engineering, or a
    related field, or equivalent practical experience;
  - Strong Python skills;
  - Solid experience with PyTorch, TensorFlow, or similar
    frameworks;
  - 4+ years of experience building and shipping computer vision
    and/or applied AI systems;
  - Hands-on experience with tasks such as detection,
    classification, segmentation, tracking, embeddings, or
    multimodal perception;
  - Experience beyond model training, including evaluation,
    deployment, and production support;
  - Experience optimizing models for edge or embedded
    environments;
  - Strong software engineering skills, including C++ production
    pipelines or inference systems;
  - Fluent in English.
  
  Nice to have:
  
  - Experience with LLMs or multimodal models in production;
  - Experience with ONNX, TensorRT, OpenVINO, or TFLite;
  - Experience with MLOps and experiment tools such as MLflow,
    Weights & Biases, or DVC;
  - Familiarity with model monitoring and post-deployment
    analysis.
  
  Benefits:
  
  - International work environment and work with global
    development teams;
  - Ability to deliver software that is used by millions of
    people across the globe;
  - Opportunity to leverage and integrate modern AI tools into
    product development;
  - Access to all Ubiquiti products;
  - Hybrid approach - office in Berlin (city centre);
  - Flexible work hours;
  - Compensation package matching global standards, including
    competitive salary depending on your qualification and
    background (starting from 6000 up to 10000 Euro gross
    monthly).
