description: |
  About the job
  
  What You ‘ll Do
  
  - You will join our high-performance engineering team and
    contribute to building scalable, AI powered, and
    enterprise grade frontend applications using modern
    Angular technologies.
  - Build scalable, reusable, and high performing frontend
    applications using Angular.
  - Develop and integrate AI driven solutions such as chatbots,
    recommendation engines, intelligent document processing,
    and Generative AI functionalities using platforms like
    OpenAI, Gemini, Claude, and Azure OpenAI.
  - Collaborate with product, backend, AI, and design teams to
    deliver innovative digital transformation solutions.
  - Optimize applications for maximum speed, scalability,
    responsiveness, and seamless user experience across
    devices and browsers.
  - Participate in architecture discussions, technical design
    reviews, and code review processes to ensure engineering
    excellence.
  - Develop reusable Angular components, modules, and micro
    frontend architectures for enterprise applications.
  - Work on cutting edge product initiatives involving AI driven
    customer experiences and intelligent automation.
  - Ensure code quality through unit testing, CI/CD
    implementation, and adherence to development best
    practices.
  - Implement and integrate REST APIs, state management
    solutions, and component driven frontend architectures.
  - Stay updated with emerging technologies in Angular, AI/ML,
    cloud platforms, and modern frontend ecosystems.
  - Collaborate effectively within Agile/Scrum teams and
    contribute towards continuous improvement initiatives.
  
  What We Seek in You
  
  - 4 to 6 years of experience in Frontend Development with
    strong expertise in angular.
  - Strong hands-on experience in Angular, TypeScript,
    JavaScript, HTML5, CSS3, RxJS, and Angular
    lifecycle/hooks.
  - Experience integrating AI/ML or Generative AI services using
    APIs such as OpenAI, Gemini, Azure OpenAI, Claude, or
    similar AI platforms.
  - Good understanding of AI concepts including prompt
    engineering, Retrieval-Augmented Generation (RAG), AI
    agents, chatbot integration, and intelligent automation.
  - Hands on experience working with REST APIs, state management
    frameworks such as NgRx, and component driven
    architecture.
  - Strong understanding of scalable frontend application
    development and performance optimization techniques.
  - Awareness of cross browser compatibility issues and client
    side performance considerations.
  - Good understanding of Git branching workflows and CI/CD
    practices.
  - Experience working in Agile/Scrum development environments.
  - Knowledge of CSS frameworks such as Bootstrap, Tailwind CSS,
    or Angular Material.
  - Strong analytical, debugging, and problem solving skills.
  - Experience working with cloud platforms such as Azure, AWS,
    or GCP is an added advantage.
  - Excellent communication and stakeholder collaboration
    abilities.
  - Passion for learning emerging technologies and driving
    frontend engineering excellence.
  
  Life At Next
  
  At our core, we're driven by the mission of tailoring growth
  for our customers by enabling them to transform their
