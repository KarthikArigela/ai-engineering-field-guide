job_id: 9185341
title: AI Native Engineer, Growth Marketing
company: CookUnity
location: USA
work_type: FULL_TIME
description: |
  About CookUnity:
  
  Food has lost its soul to modern convenience. And with it,
  it has lost the power to nourish, inspire, and connect us.
  So in 2018, CookUnity was founded as the first-of-its-kind
  platform that connects the world with the source of truly
  great food: chefs. Today, CookUnity delivers 50 million
  meals a year from the industry’s best chefs to homes all
  over the country. Fresh. Ready-to-eat. And crafted with the
  passion that nourishes body and soul.
  
  Unwilling to stop there, CookUnity is expanding beyond
  delivery to become an ever-innovating marketplace focused on
  our singular mission: empower Chefs to nourish the world.
  
  If that mission has you hungry in more ways than one, you’ve
  found the right job posting.
  
  The Role
  
  AI is no longer a roadmap item — it's the operating system
  for how modern growth teams win. We're hiring a AI Native
  Engineer, Growth Marketing to be the hands-on builder who
  embeds AI into every corner of how our Growth team works:
  performance marketing, creative production, CRM, landing
  pages, growth ops, and beyond.
  
  This is a rare hybrid role. You're equal parts engineer and
  growth practitioner — someone who can write a Python script
  in the morning, ship a Braze-connected AI workflow by
  afternoon, and explain the business impact to a non-
  technical stakeholder by EOD. You don't need to have done
  this at scale before — you need to be obsessed with building
  at the frontier of what's possible and have the technical
  chops to make it real.
  
  You'll report directly to the Head of Growth and work across
  every subteam in the Growth org as their embedded AI
  engineer.
  
  Responsibilities:
  
  - Performance Marketing: Build AI-powered tools to automate
    bid strategy analysis, budget pacing alerts, creative
    performance scoring, and anomaly detection across paid
    channels (SEM, Meta, Affiliate, YouTube, etc.)
  - Creative Studio: Develop AI workflows for ad copy
    generation, creative brief automation, image asset
    variation at scale, and creative performance feedback
    loops between analytics and the studio team
  - CRM & Lifecycle: Implement AI-driven personalization and
    send-time optimization across email, SMS, push, and in-app
    channels; build agentic workflows that pull Snowflake
    data, generate segment logic, and trigger Braze campaigns
    with minimal manual intervention
  - Landing Pages & Conversion: Automate LP variant generation,
    headline testing ideation, and personalization logic by
    audience segment or traffic source
  - Growth Ops: Build internal AI tools — dashboards, Slack
    bots, report generators — that reduce repetitive
    analytical work and accelerate decision-making across the
    team
  - Growth Product: Partner with Product and Engineering to
    identify where AI-powered features (recommendations,
    dynamic content, smart nudges) can accelerate funnel
    conversion and retention
  - Tooling & Infrastructure: Evaluate, implement, and maintain
    the AI/ML toolstack that powers Growth — from LLM APIs to
    workflow orchestration tools to data pipelines
  
  What Success Looks Like
  
  - A measurable reduction in manual hours across mundane Growth
    through AI-driven automation
  - At least 5-10 production-grade AI tools or workflows live
    and actively used by the team within the first 4 months
  - CRM campaigns that are more personalized, faster to launch,
    and higher-performing because of AI assist
  - Creative output volume increases without a proportional
    increase in headcount
  - The Growth team thinks of you first when they want to do
    something smarter, faster, or at scale
  
  Qualifications:
  
  - 2–5 years of engineering or technical experience, with
    meaningful hands-on work applying AI/LLMs to real business
    problems (side projects count — we care about what you've
    built, not just where)
  - Proficiency in Python or Typescript and comfort working with
    APIs (OpenAI, Anthropic, or similar LLM providers)
  - Build repeatable skills or plugins for popular LLM clients
    to empower your team
  - Educate and mentor team members to become more AI-Native
  - A builder's mentality: you'd rather ship a working prototype
    than write a spec about one
  - Ability to work cross-functionally and translate between
    technical and non-technical stakeholders
  
  Preferred requirements:
  
  - Experience with workflow orchestration tools (Agent SDK,
    n8n, Make, Zapier, or custom Typescript/Python pipelines)
  - Prior work at a DTC subscription company or growth-stage
    startup
  - Familiarity with prompt engineering, RAG architectures, or
    fine-tuning
  - Experience building internal tools used by non-technical
    teams
  - Familiarity with marketing platforms and data infrastructure
    — ideally some combination of Braze, Google Ads, Meta Ads
    Manager, Snowflake, or equivalent
  - Strong enough understanding of growth marketing to ask the
    right questions and build tools that practitioners
    actually want to use
  
  Technologies You'll Use
  
  - LLM APIs: OpenAI, Anthropic, and/or open-source models
  - CRM & Marketing: Braze, Google Ads, Meta Ads Manager
  - Data: Snowflake, SQL, Tableau, dbt, Hex
  - Orchestration: Typescript, Agent SDK, Vercel AI SDK, Python,
    n8n, Make, or similar
  - Collaboration: Slack, Notion, Jira, Google Workspace
  
  Benefits
  
  🩺  Health Insurance coverage
  
  🌅 401k Plan
  
  ⛱ Unlimited PTO
  
  🗓️ 5- year Sabbatical: After 5 years with CookUnity, you get
  a 4-week paid sabbatical
  
  🐣 Paid Family leave
  
  🕯 Compassionate Leave: 3-5 days each time the need arises
  
  🥘 A generous amount of CookUnity credits to enjoy our
  amazing meals, added to your account, monthly
  
  🧘🏽‍♀️ Wellness perks: access to fitness subsidies to build a
  healthy lifestyle
  
  🤖 AI-forward workplace: enterprise access to ChatGPT and
  Claude to help you work smarter and grow faster.
  
  👩🏾‍🏫 Personalized Spanish coach
  
  🚀 Awesome opportunity to join a company that is looking to
  change how we eat and how chefs work!
  
  CompensationAll final pay rates will be determined by
  candidates experience, knowledge, skills, and abilities of
  the applicant, internal equity, and alignment with market
  data.
  
  Pay Range for this position
  
  $130,000—$140,000 USD
  
  If you’re interested in this role, please submit your
  application, and if we think you might be a fit, we'll get
  in touch with you. Thank you for your time!
  
  CookUnity is an Equal Opportunity Employer. We are dedicated
  to creating a community of inclusion and an environment free
  from discrimination or harassment. All qualified applicants
  will receive consideration for employment without regard to
  race, color, religion, sex, age, sexual orientation, gender
  identity, national origin, citizenship status, protected
  veteran status, genetic information, or physical or mental
  disability.
  
  A quick note for all candidates We’ve recently seen an
  increase in recruitment scams across the industry, and we
  want to make sure you (and your data) stay safe while
  applying to CookUnity. We also want you to know that we take
  this seriously — sometimes, as part of our process, we may
  ask for a brief “proof of humanity” to confirm that we’re
  connecting with a real person, not an impersonator. Here are
  a few tips to help you protect yourself and know what to
  expect from us:
  
  - Apply only through our official channels. All open roles are
    listed on our official careers page: careers.cookunity.com
  - Our recruiters are real people — and easy to verify. You can
    always find them on LinkedIn with verified profiles. If
    you’re unsure, feel free to reach out to us on our
    official LinkedIn Company Page.
  - We only communicate through official CookUnity channels.
    That means emails ending in @cookunity.com and interviews
    held through official company platforms (Google Meet or
    Zoom) — never WhatsApp, Telegram, or SMS.
  - We’ll never ask for payment or personal financial details.
    If anyone does, please don’t share any information and let
    us know right away.
  
  If something ever feels off or you’re unsure about a
  message, we’d much rather you double-check with us. You can
  always contact us directly through any of our social media
  channels. We appreciate your interest in joining CookUnity —
  and we care about keeping your experience (and safety) as
  genuine as possible.
