description: |
  Sr. Distinguished AI Engineer (Agentic AI Platform)
  Overview: At Capital One, we are creating responsible and
  reliable AI systems, changing banking for good. For years,
  Capital One has been an industry leader in using machine
  learning to create real-time, personalized customer
  experiences. Our investments in technology infrastructure
  and world-class talent - along with our deep experience in
  machine learning - position us to be at the forefront of
  enterprises leveraging AI. From informing customers about
  unusual charges to answering their questions in real time,
  our applications of AI & ML are bringing humanity and
  simplicity to banking. We are committed to continuing to
  build world-class applied science and engineering teams to
  deliver our industry leading capabilities with breakthrough
  product experiences and scalable, high-performance AI
  infrastructure. At Capital One, you will help bring the
  transformative power of emerging AI capabilities to
  reimagine how we serve our customers and businesses who have
  come to love the products and services we build. Team
  Description: The Intelligent Foundations and Experiences
  (IFX) team is at the center of bringing our vision for AI at
  Capital One to life. We work hand-in-hand with our partners
  across the company to advance the state of the art in
  science and AI engineering, and we build and deploy
  proprietary solutions that are central to our business and
  deliver value to millions of customers. Our AI models and
  platforms empower teams across Capital One to enhance their
  products with the transformative power of AI, in responsible
  and scalable ways for the highest leverage impact. In this
  role, you will:
  
  - Partner with a cross-functional team of engineers, research
    scientists, technical program managers, and product
    managers to deliver AI-powered products that change how
    our associates work and how our customers interact with
    Capital One.
  - You will contribute to the north star platform architecture,
    continuously publishing and refining living diagrams and
    canonical APIs that cover agent orchestration, RAG
    pipelines, prompt libraries and multi-tenant policy
    enforcement.
  - A major emphasis is around standardizing and automating
    agentic workflows: you will evaluate agentic frameworks
    such LangGraph, AutoGen, Semantic Kernal, CrewAI and
    LlamaIndex and then harden / blend patterns that best meet
    enterprise SLAs do that 90% of new apps adopt them.
  - Developer experience is another cornerstone. You will
    contribute to crafting an end to end GenAI SDK, CLI and
    starter kits that let AI engineers spin up secure,
    observable agentic workflows in under minutes, shrinking
    prototyping to production timelines by 30%.
  - Trust and safety remain paramount; you will help bring
    together a vision of central guardrail services - prompt
    firewalls, content-filter hooks, red team harnesses and
    audit APIs - consumed by every application to ensure zero
    Sev4 incidents.
  - You will collaborate with cross organization architects to
    drive end to end performance by optimizing orchestration -
    level batching, retrieval caching, heuristic tuning to
    achieve reductions in per token spend. You will accelerate
    innovation by incubating proof of concepts and driving
    RFCs such as hierarchical agent memory, multimodal
    guardrails, multimodal RAG.
  - You'll own central Helm charts, operators and CRDs that auto
    scale agents to hit tenant SLAs
  - Finally you will coach and evangelize - hosting architecture
    office hours, mentoring Staff, Principal and Senior
    engineers, authoring technical design documents and blogs
    and representing Capital One at Tier1 AI conferences - to
    amplify platform vision across internal and external
    communities.
  
  The Ideal Candidate:
  
  - You love to build systems, take pride in the quality of your
    work, and also share our passion to do the right thing.
    You want to work on problems that will help change banking
    for good.
  - Passion for staying abreast of the latest research, and an
    ability to intuitively understand scientific publications
    and judiciously apply novel techniques in production.
  - You adapt quickly and thrive on bringing clarity to big,
    undefined problems. You love asking questions and digging
    deep to uncover the root of problems and can articulate
    your findings concisely with clarity. You have the courage
    to share new ideas even when they are unproven.
  - You are deeply Technical. You possess a strong foundation in
    engineering and mathematics, and your expertise in
    hardware, software, and AI enable you to see and exploit
    optimization opportunities that others miss.
  - You are a resilient trail blazer who can forge new paths to
    achieve business goals when the route is unknown.
  
  Basic Qualifications:
  
  - Bachelor's degree in Computer Science, Engineering, or AI
    plus at least 10 years of experience developing AI and ML
    algorithms or technologies, or Master's degree plus at
    least 8 years of experience developing AI and ML
    algorithms or technologies
  - At least 10 years of experience programming with Python, Go,
    Scala, or Java
  
  Preferred Qualifications:
  
  - 9 years of experience deploying scalable and responsible AI
    solutions on cloud platforms (e.g. AWS, Google Cloud,
    Azure, or equivalent private cloud)
  - 2+ years of experience supporting Agentic Frameworks
    (LangChain, CrewAI, Semantic Kernel (Microsoft), or
    AutoGen)
  - 2+ years of experience with LLMOps (Google Cloud Vertex AI,
    Amazon SageMaker, Azure Machine Learning)
  - 8+ years of experience designing mission-critical machine
    learning platforms
  - 2+ years of experience architecting, designing, developing,
    integrating, delivering, and supporting complex AI systems
  - Demonstrated ability to lead and mentor multiple engineering
    teams and influence cross-functional stakeholders up to
    the VP level
  - Experience developing AI and ML algorithms or technologies
    (e.g. LLM Inference, Similarity Search and VectorDBs,
    Guardrails, Memory) using Python, C++, C#, Java, or Golang
  - Master's degree in Computer Science, Computer Engineering,
    or relevant technical field
  - Experience developing and applying state-of-the-art
    techniques for optimizing training and inference software
    to improve hardware utilization, latency, throughput, and
    cost
  - Excellent communication and presentation skills, with the
    ability to articulate complex AI concepts to peers
  - Experience leading GenAI or LLM-Powered application
    architectures in production
  - Deep understanding of Responsible AI, data privacy and
    multi-tenant security patterns
  - K8s mastery (multi-region clusters, service mesh)
  - Experience staying abreast of the latest AI research and AI
    systems and applying novel techniques in production
  
  Capital One will consider sponsoring a new qualified
  applicant for employment authorization for this position.
