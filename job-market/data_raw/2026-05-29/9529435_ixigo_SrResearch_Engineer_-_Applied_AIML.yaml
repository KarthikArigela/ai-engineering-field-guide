description: |
  Company Description
  
  Launched in 2007 by Aloke Bajpai & Rajnish Kumar, ixigo (Le
  Travenues Technology Limited) is a technology company
  focused on empowering Indian travellers to plan, book and
  manage their trips across rail, air, buses and hotels. ixigo
  assists travellers in making smarter travel decisions by
  leveraging artificial intelligence. The ixigo, ConfirmTkt
  and AbhiBus apps allow travellers to book train tickets,
  flight tickets, bus tickets, hotels, and cabs, and provide
  travel utility tools and services developed using in-house
  proprietary algorithms and crowd-sourced information. With
  over 54 crore Annual Active Users in Fiscal 2025, ixigo is
  the leading OTA for Next Billion Users in India. For more
  information, please visit http://www.ixigo.com
  
  Job Description
  
  As a Senior Research Engineer, you will be responsible for
  Research & Innovation, technology development including
  quick architecture, design & development of prototypes and
  ensuring timely evolution of prototypes into products. The
  primary objective of this role will be to ensure the
  constant launch of innovative products for online travel
  consumers with the help of a small team of highly qualified
  research technologists/developers.
  
  Must have
  
  - Thorough understanding of machine learning algorithms
    (supervised as well as unsupervised), including experience
    in predictive or statistical modelling, applied
    programming, data management, data transformation, data
    visualization, etc
  
  - Thorough understanding of NLP and conversational AI
    algorithms including experience in predictive or
    statistical modelling, applied programming, data
    management, data transformation, data visualization, etc
  - Strong understanding of data mining, ML in NLP and the
    ability to translate them into production quality code.
  - Good understanding of model selection approaches, model
    evaluation techniques.
  - Ability to perform Exploratory Data Analysis and to explain
    the key outcomes from that analysis.
  - Creativity to handle large as well as small datasets.
  - Ability to explain the results clearly.
  - Good scripting as well as programming techniques.
  - Exceptional Problem Solving ability
  - Good knowledge of Algorithms/Data Structures.
  - Development experience in Python.
  - Proven development experience for API design and software
    architecture.
  
  Good to have:
  
  - Working knowledge of Apache Spark.
  - Good knowledge of deep learning, PyTorch or TensorFlow.
  - A PhD in Computer Science or related field.
  - Good knowledge about architecture and software design is a
    plus.
  - Awareness about the State-of-the-Art techniques in AI
    research.
  
  Skills & Qualifications:
  
  - At least an undergraduate degree in Computer Science,
    Mathematics
  
  - 3-5 years of experience at cutting-edge organizations or
    startups, 2+ years for PhD Candidates.
  - Experience with e-business/e-commerce applications and
    business environment will be a plus.
  - Must be comfortable in software development using
    Python(Django), with good knowledge of machine learning &
    deep learning libraries.
  
  Additional Information
  
  Responsible for safeguarding sensitive company data against
  unauthorized access, use, or disclosure, and for reporting
  any suspected security incidents in line with the
  organization's ISMS (Information Security Management System)
  policies and procedures.
