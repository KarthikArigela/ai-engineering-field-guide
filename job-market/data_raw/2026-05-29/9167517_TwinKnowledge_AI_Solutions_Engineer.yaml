title: AI Solutions Engineer
company: TwinKnowledge
location: New York, USA
work_type: FULL_TIME
company_size: 20 Employees
description: |
  About Us
  
  TwinKnowledge is one of the fastest-growing AI companies in
  the design, construction, and operations (AECO) industry.
  Our R&D defines the state of the art in applied AI for our
  market, and we are building the agentic knowledge layer that
  connects the information running the built world to frontier
  AI systems. We are growing the AI Solutions team to further
  our status as the premier provider in this market,
  delivering for clients such as, Toll Brothers (Fortune’s #1
  homebuilder in America), and the Port Authority of New York
  and New Jersey (largest transit agency in the US). You will
  work closely with the Head of AI Solutions, a founding team
  member, former structural engineer, and Harvard GSD graduate
  obsessed with unlocking human agency in the age of AI.
  
  We're looking for a Solutions Engineer to sit at the
  intersection of our product and our clients — someone early
  in their career who deeply understands the AEC industry and
  is genuinely excited about what AI can do for it.
  
  The Role
  
  You'll be the person that our clients trust to deliver
  results. Owning the pre-sales and pilot phase, you'll listen
  carefully to understand their needs, map those to our
  products, and demonstrate results. You will innovate on
  behalf of our customers developing prototypes to demonstrate
  the art of the possible, and be responsible for securing the
  win.
  
  This is a high-impact, client-facing role that combines
  technical depth in AI, AEC domain knowledge, and the hustle
  of an early-stage startup.
  
  What You'll Do
  
  - Own the pilot experience for new clients; configure our
    products for customer use cases, run analyses on their
    documents, and deliver results that demonstrate clear
    value.
  - Develop a deep understanding of each client's workflows,
    pain points, and document environments (drawings, specs,
    submittals, RFIs, etc.) and identify the maximum return on
    investment using our technology.
  - Prototype new solutions using AI APIs and tools when
    customer needs extend our offerings, translating ambiguous
    needs into concrete demonstrations that anchor product
    conversations.
  - Serve as the internal voice of the client, synthesizing
    feedback from pilots into sharp, prioritized product
    insights for our engineering and research teams.
  - Build the playbooks, templates, and documentation that scale
    across our client portfolio.
  - Lead pre-sales conversations supporting demos, scoping
    discussions, and technical Q&A with sophisticated buyers
    at firms like Toll Brothers, KPF, HOCHTIEF, and the Port
    Authority of New York & New Jersey.
  
  What We're Looking For
  
  - 1–3 years of experience in a technical role, ideally at a
    technology company. You've shipped something, supported
    something, or built something for real users.
  - A background in architecture, engineering, construction, or
    a related field. You understand project delivery, drawing
    sets, and what happens when coordination breaks down.
  - Genuine curiosity about AI and working knowledge of current
    tools (LLM APIs, prompt engineering, RAG pipelines, or
    similar) with enough knowledge to prototype quickly and
    communicate what's possible.
  - Strong communicator who can translate between the language
    of a project engineer and a product team.
  - The instinct to listen before you pitch. You ask good
    questions and you actually absorb the answers.
  - Comfortable with ambiguity, fast iteration, and figuring
    things out without a full playbook.
  
  Why TwinKnowledge
  
  - You'll work with some of the most sophisticated owners,
    designers, and builders across the globe, and you'll have
    real influence over how they adopt AI.
  - Your work will directly shape our product roadmap and our
    go-to-market motion.
  - Competitive salary and equity.
  - Full medical, dental, and vision coverage.
  - Flexible PTO and a team with a big vision and ambitions
  
  Ready to help build the AI layer for the built world?
  Contact TwinKnowledge today.
