description: |
  Detection alone is not security. Every day, security teams
  are forced to make critical decisions on incomplete data.
  Binalyze changes that. Our platform, AIR, gives
  investigators the full picture — turning alerts into
  understanding in minutes, not days. We're scaling globally
  and beyond, building the category-defining investigation
  platform the industry has been missing. We're now hiring for
  an AI & Process Automation Engineer for a 12 month fixed
  term contract. We're hiring someone to design and build AI-
  powered automations that free up real capacity across the
  business starting with our GTM teams and expanding from
  there.
  
  You'll map the problems yourself, design the solutions,
  build the workflows, and bring the people using them along
  so they can extend what you create. Your tools are n8n,
  Claude, and whatever else gets the job done. Your measure of
  success is measurable capacity gained — time reclaimed,
  manual work eliminated, and teams operating faster and
  smarter because of what you built.
  
  You'll also help us build the foundation that makes AI and
  automation actually work by improving how our data,
  documentation, and processes are structured so that what you
  build has clean, reliable inputs to run on.
  
  This role reports to the VP People and works closely with
  the VP Operations with priorities come from People,
  technical sign-off and security validation come from Ops.
  
  You'll thrive here if you
  
  Get energy from finding the real problem before jumping to a
  solution. You map processes, talk to stakeholders, and
  design from scratch rather than automating what currently
  exists. You:
  
  - Build things that work in production — you monitor, measure,
    document, and iterate
  - Are naturally good at making technical concepts land with
    non-technical people
  - Want to shape a role from the ground up in a company that's
    serious about AI adoption, not just talking about it
  
  What you'll bring
  
  - Experience mapping and redesigning business processes
  - Hands-on experience building automation workflows in n8n,
    Make, Zapier, or similar platforms (n8n experience
    specifically is a strong plus)
  - Comfortable working with APIs, webhooks, and system
    integrations across business tools (CRMs, HR platforms,
    comms tools)
  - Practical experience using AI tools (Claude, ChatGPT, or
    similar) in real business workflows
  - The ability to autonomously manage your own workload across
    multiple concurrent builds
  
  Nice to have
  
  - Experience in a SaaS or technology company
  - Familiarity with GTM tooling (HubSpot, Gong, or similar)
  - Experience measuring and reporting the impact of automation
    work (time saved, adoption rates, error reduction)
  
  What we offer
  
  - Generous annual leave plus wellbeing days and your birthday
    off
  - Private medical insurance, including family cover
  - Home office setup support
  - Monthly wellbeing and entertainment allowances
  - Wellbeing support through Oli
  - Fully remote and flexible working
  - This is a 12 month fixed term contract opportunity initially
  
  Benefits are tailored by location — we'll share full details
  during the hiring process.
  
  ____________________________________________________________
  ______________
  
  We're committed to building a team that reflects a wide
  range of backgrounds, perspectives, and experiences. If you
  don't meet every requirement listed, we'd still encourage
  you to apply.
  
  ✨ If this sounds like the kind of problem you'd like to
  spend your time on, we'd love to hear from you.
  
  Applicants must have the legal right to work in the country
  where the position is based, without the need for visa
  sponsorship. This role does not offer visa sponsorship.
