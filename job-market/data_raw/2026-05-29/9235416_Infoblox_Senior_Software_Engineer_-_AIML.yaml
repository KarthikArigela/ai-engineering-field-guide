  Senior Software Engineer
  
  We are looking for a Senior Software Engineer  to join our
  NIOS Platform team, based in Bangalore, India, reporting to
  the Director of Software Engineering. In this role you will
  be a a key contributor to Infoblox’s next-generation
  development and DDI services, you will influence the
  integration of AI into software design & development,
  strengthen product security, and optimize platform
  scalability and performance. You’ll collaborate closely with
  Distinguished Engineers, Architects, QA, Product Security,
  and Customer Escalation teams to deliver scalable, secure,
  and reliable solutions
  
  Be a Contributor — What You’ll Do
  
  - Translate product requirements into detailed technical
    specifications
  - Design and implement high-quality, maintainable, and
    testable code
  - Produce comprehensive design and test documentation
  - Participate in code reviews and contribute to continuous
    improvement
  - Collaborate across teams to resolve complex technical
    challenges
  - Design, develop, and debug software modules for the NIOS DDI
    platform
  - Write high-quality code using Linux, C, Python, JAVA and
    XML.
  - Apply your knowledge of DNS, DHCP, Linux internals, and
    kernel networking stacks.
  - Understand various performance trade-offs as they relate to
    CPU time, memory usage, debuggability, and traceability
    when introducing new software.
  - Actively leverage modern AI enabled practices like vibe
    coding, use of Githum copilot/ClaudeCode in software
    development and testing.
  
  Be Prepared — What You Bring
  
  - Minimum 7+ years of professional experience in software
    engineering.
  - Over 1 year of hands-on experience in AI/ML, MCP, and RAG
    workflows, with a strong grasp of core principles and
    fundamentals. Proven track record of delivering
    production-ready AI features.
  - Expert level programming skill in Python, Linux, C/C++.
  - Excellent problem-solving skill combined with effective
    interpersonal skills.
  - Excellent communication and collaboration skills to work
    effectively with cross-functional teams
  - Bachelor’s degree in CS, CE or EE is required; master’s
    degree preferred
  
  Be Successful — Your Path
  
  First 90 Days: Immerse in our culture, connect with mentors
  (Blox Buddies), and map the systems and meet with key
  stakeholders that rely on your work. Discuss and create
  short/long term goals.
  
  Six Months: Understand key functionalities of the core
  NIOS/vNIOS platforms. Contribute and participate in NIOS
  team AI product and feature development.
  
  One Year: Provide technical leadership for the NIOS AI team.
  Play a major role in analyzing, designing, delivering, and
  maintaining AI agents and platforms.
  
  Belong— Your Community
  
  Our culture thrives on inclusion, rewarding the bold ideas,
  curiosity, and creativity that move us forward. In a
  community where every voice counts, continuous learning is
  the norm. So, whether you code, create, sell, or care for
  customers, you’ll grow and belong here.
  
  Be Rewarded — Benefits That Help You Grow, Thrive, Belong
  
  - Comprehensive health coverage, generous PTO, and flexible
    work options
  - Learning opportunities, career-mobility programs, and
    leadership workshops
  - Sixteen paid volunteer hours each year, global employee
    resource groups, and a “No Jerks” policy that keeps
    collaboration healthy
  - Modern offices with EV charging, healthy snacks (and the
    occasional cupcake), plus hackathons, game nights, and
    culture celebrations
  - Charitable Giving Program supported by Company Match
  - We practice pay transparency and reward performance. Offers
    reflect role location, internal equity, experience,
    skills, education, and certifications
  
  Ready to Be the Difference?
  
  Infoblox is an Affirmative Action and Equal Opportunity
  Employer, and all qualified applicants will receive
