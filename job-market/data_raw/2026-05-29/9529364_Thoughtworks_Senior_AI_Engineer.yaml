  AI Engineer : Senior Consultant
  
  We are looking for an AI Engineer who can effectively
  leverage modern AI-powered
  
  development tools (e.g., GitHub Copilot, Cursor, Claude,
  etc.) and Agentic AI to accelerate
  
  software development while maintaining high standards of
  code quality, scalability, and
  
  security. This role sits at the intersection of software
  engineering and applied AI / Agentic AI
  
  — ideal for engineers who not only write code but also know
  how to collaborate with AI
  
  systems to design, build, test, and optimize applications /
  build Agentic AI applications.
  
  Key Responsibilities
  
  - AI-Assisted Development
  - Use AI coding assistants (e.g., GitHub Copilot, Cursor,
    Claude) to enhance
  - productivity across the SDLC
  - Design effective prompts and workflows for code generation,
    debugging, refactoring,
  - and documentation
  - Evaluate, validate, and harden AI-generated code for
    production readiness
  - Continuously experiment with emerging AI tools and integrate
    them into development
  - workflows
  - Design and development of Agentic AI applications
  - Software Engineering
  - Design, develop, and maintain scalable backend systems and
    APIs
  - Write clean, maintainable, and testable code in languages
    such as Python
  - EDDDParticipate in architecture design and technical
    decision-making
  - Implement robust testing strategies (unit, e.g. integration
  - AI/ML Integration
  - Integrate LLMs and AI services into applications (e.g., via
    APIs like OpenAI,
  - Anthropic, etc.)
  - Working with Agentic AI frameworks like LangGraph,
    LangChain, CrewAI etc
  - Build AI-powered features such as chatbots, copilots,
    automation pipelines, and
  - intelligent workflows
  - Work with embeddings, vector databases, and retrieval-
    augmented generation (RAG)
  - patterns
  - Optimize prompts, latency, and cost for AI-driven features
  
  DevOps & Delivery
  
  - Collaborate with DevOps teams for CI/CD pipeline integration
  - Ensure code quality through code reviews and automated
    checks
  - Adept working in agile ways of working
  - Model Deployment (FastAPI, Hugging face etc) and MLOps
    knowledge
  - Collaboration
  - Work closely with product managers, designers, and other
    engineers. Sometimes in
  - co-sourced client teams as well.
  - Mentor junior engineers on AI-assisted development practices
  - Contribute to internal best practices and knowledge sharing
  
  Required Skills & Qualifications
  
  Technical Skills
  
  - Strong programming experience in:
  - Python
  - Experience with modern frameworks:
  - Python: FastAPI, Flask, Django
  - Good understanding of:
  - Data structures, algorithms, and system design
  - RESTful APIs and microservices architecture
  - Version control (Git) and Cloud platforms (AWS or Azure)
  - AI & Tooling
  - Hands-on experience with AI coding tools:
  - GitHub Copilot, Cursor, Claude, or similar
  - Familiarity with LLM concepts - Prompt engineering & Context
    Engineering (e.g.
  - OpenAI functions, MCP, Claude etc)
  - Experience integrating LLM APIs into applications
  - AI Application Development Experience with: RAG pipelines,
    Vector databases, LangChain, LlamaIndex, or
  - similar frameworks. Basic understanding of ML concepts.
  
  Professional Skills
  
  - You enjoy influencing others and always advocate for
    technical excellence while being open to change when
    needed
  - Presence in the external tech community: you willingly share
    your expertise with others via speaking engagements,
    contributions to open source, blogs and more
  - You’re resilient in ambiguous situations and can approach
    challenges from multiple perspectives
  
