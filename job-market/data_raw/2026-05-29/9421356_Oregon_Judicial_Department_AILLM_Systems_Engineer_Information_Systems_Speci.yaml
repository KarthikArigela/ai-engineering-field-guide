  Job Description:
  
  If this opportunity aligns with your strengths, background,
  and commitment to fostering inclusivity, we encourage you to
  apply! At the Oregon Health Authority (OHA), we value
  diversity and encourage applicants from all backgrounds and
  experiences to help us build a stronger, more equitable
  future for all.
  
  This position requires both a resume and a cover letter, the
  cover letter will need to address how you meet minimum
  qualifications, and the desired attributes listed in this
  job posting. Candidates will be declined who don’t follow
  these instructions.
  
  Opportunity Awaits, Apply Today! – AI/LLM Systems Engineer
  (Information Systems Specialist 6) Hybrid work options
  
  As an AI/LLM Systems Engineer, you will play a pivotal role
  in planning, developing, integrating, implementing, and
  coordinating projects and activities related to Artificial
  Intelligence and Large Language Models (LLMs). This
  specialist position focuses software development that
  integrates with AI/LLM models, business analysis, research,
  problem-solving, and system administration.
  
  The AI/LLM Systems Engineer will design, develop, and
  maintain software systems that integrate AI/LLM components,
  collaborating with staff and management to turn business
  needs into practical solutions. You will participate in
  system development lifecycle planning, contribute to
  technical recommendations, and support both new development
  and ongoing system modifications and updates.
  
  The AI/LLM Systems Engineer is assigned work in terms of
  program and project objectives, priorities, and timelines.
  This position consults with supervisors and team leads to
  resolve policy questions and problems in coordinating
  activities with other programs. Typically, work is subject
  to technical and administrative control in which review is
  made of program or project accomplishments and adherence to
  policies, directives, and desired results.
  
  For a full review of the position description, please click
  here.
  
  What We Are Looking For
  
  Minimum Qualifications: These qualifications must be
  reflected in your application for consideration.
  
  (a) Five (5) years of information systems experience in
  Software Development/Data Management or related field.
  
  OR
  
  (b) An Associate's degree in Computer Science, Information
  Technology, or related field,
  
  OR
  
  completion of a two (2) year accredited vocational training
  program in information technology or related field.
  
  AND
  
  three (3) years of information systems experience in
  Software Development/Data Management or related field.
  
  OR
  
  (c) A Bachelor's degree in Information Technology, Computer
  Science, or related field
  
  AND one (1) year of information systems experience in
  Software Development/Data Management or related field.
  
  OR
  
  (d) Master's degree in Information Technology, Computer
  Science, or related field.
  
  Desired Attributes: The following are desired attributes
  that we have identified as key to success for this role at
  OHA. These are the attributes we are looking for in our top
  candidate. If you have any of these, please let us know in
  your application.
  
  - Ability to work with some guidance when performing
    development functions, establishing personal work
    priorities, resolving issues in alignment with business
    priorities, technical standards, organization practices,
    enterprise frameworks and paradigms.
  - Experience with one or more of the following common Software
    Development technologies such as: Microsoft Azure, .NET,
    Python, Azure DevOps, Microsoft OS and SQL Server, and an
    expectation to gain skills in the remaining skillsets.
  - Develop and implement solutions using Large Language Models
    to enhance search functionality within our internal
    documentation systems.
  - Develop and build scalable and efficient search systems that
    leverage LLMs for better retrieval and contextual
    understanding of documentation.
  - Ability to integrate systems and applications using RESTful
    APIs, Azure API Management, and other Azure services.
  - Strong knowledge of Azure Integration services such as Logic
    Apps, API Management, Service Bus, and Event Grid for
    building scalable and secure integration solutions.
  - Some experience using modern DevOps tools including source
    control systems, testing practices, code and design review
    tools and processes such as ADOS, Git, SonarQube and Burp
  - Experience in advancing health equity, addressing systemic
    health disparities, and collaborating with diverse,
    vulnerable, and underrepresented populations.
  
  Preference Statement:
  
  Preference may be given to candidates who are bilingual or
  multilingual and can assist with AI model translation,
  language validation, and cross-linguistic quality review.
  
  Application Guidance
  
  Your candidate profile and application are your opportunity
  to showcase your skills and interest in this role.
  Submissions will be reviewed for clarity, consistency, and
  communication skills, and for alignment with the guidance
  provided in the below:
  
  Submission Requirements:
  
  - Resume – Attach your current resume that clearly outlines
    your education and work experience relevant to this
    position.
  - Cover Letter – A cover letter is required.
  - Supplemental Questions – Answer all supplemental questions
    completely and accurately.
  - Final Check! – Before submitting, confirm that all required
    materials are included, and your Workday Job History is
    current. The information in your application will be used
    to complete an Equal Pay Analysis to determine salary
    placement upon hire. Visit the Equal Pay Analysis Webpage
    for more information.
  
  How to Apply:
  
  - External Candidates:  Visit the State of Oregon job
    opportunities webpage or click the “Apply” tab above to
    submit your application, following all submission
    requirements.
  - Internal Candidates: Current State of Oregon employees must
    apply through their employee Workday login, following all
    submission requirements.
  
  After You Apply:
  
  - Complete any pending tasks in Workday under “My
    Applications” prior to the application deadline.
  - Check your email (including junk folder) and Workday inbox
    regularly for updates on your application.
  
  Reminders:
  
  - Eligible veterans and Oregon National Guard servicemembers
    (current and former) who meet the qualifications of the
    position will be awarded candidate preference. To protect
    your information and ensure correct processing, please
    follow the instructions for submitting your Veterans’
    Preference documentation.
  - Please download and save a copy of this job announcement and
    linked position description, as it is not available after
    the application deadline.
  
  About the Team & Benefits of Joining
  
  We offer a workplace that balances productivity with
  enjoyment; promote an atmosphere of mutual respect,
  dedication, and enthusiasm. You will collaborate with a team
  of bright individuals to work with and learn from.
  
  If you're driven by the passion to do something meaningful
  that changes lives, the Oregon Health Authority is the place
  for you. We also offer a competitive benefits package
  including:
  
  - Excellent, low-cost medical, vision, and dental coverage for
    you and your family.
  - Optional benefits like life insurance, disability coverage,
    deferred compensation, and FSA options for health and
    childcare.
  - Generous paid time off: 11 holidays, 3 personal days,
    monthly sick leave, and vacation accrual starting at 8
    hours/month.
  - Potential eligibility for the Public Service Loan
    Forgiveness Program.
  - Retirement security through Public Employees Retirement
    System (PERS)/Oregon Public Service Retirement Plan
    (OPSRP).
  - Training and development opportunities to grow your career
    with the State of Oregon.
  
  Additional Details
  
  - This announcement is for 1, full-time, permanent, SEIU
    represented, AI/LLM Systems Engineer (Information Systems
    Specialist 6) position based in Salem Oregon.
  - This is a hybrid position. “Review Section 4: Working
    Conditions” in the position description (linked above) for
    more information.
  - The salary listed is the non-PERS qualifying range. If the
    successful candidate qualifies for PERS, the salary range
    will increase by 6.95%. For more information, see the
    Classification and Compensation page.
  - The State of Oregon does not request or require your age,
    date of birth, attendance or graduation dates from an
    education institution during the application process.
  - This position does not provide visa sponsorship. Within
    three days of hire, you will be required to complete I-9
    documentation and confirm authorization to work in the
    United States. OHA will use E-Verify to verify work
    authorization. If your employment eligibility depends on
    sponsorship now or in the future, you will not meet the
    requirements for this position.
  - We evaluate candidates based on their own skills and
    experience. Unless explicitly approved, outside resources
    – including Artificial Intelligence (AI) tools – are not
    permitted during assessments or interviews. Use of
    unauthorized resources will disqualify a candidate from
    further consideration.
  
