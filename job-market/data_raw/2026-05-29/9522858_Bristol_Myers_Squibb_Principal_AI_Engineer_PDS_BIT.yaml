  Position Summary:
  
  The Senior Manager role will architect and develop
  autonomous multi-agent systems that power analytics,
  diagnostics, and decision support across Product Development
  and Supply. This role focuses on building graph-based
  orchestration workflows that combine LLM reasoning with
  business logic, real-time data integration, and enterprise
  security patterns.
  
  You will design agent platforms that go beyond
  conversational interfaces to deliver autonomous analytical
  workflows, automated validations, and intelligent routing
  across diverse business domain
  
  Delivery lead – Hyderabad
  
  Key Responsibilities:
  
  Multi-Agent System Architecture & Platform Development: •
  Design and implement autonomous agent workflows using
  orchestration frameworks (LangGraph, CrewAI, Autogen, or
  similar) • Build complex state machines with conditional
  routing, parallel execution, and error recovery patterns for
  analytical and diagnostic tasks • Develop graph-based
  workflows with 10+ nodes involving agent collaboration, task
  decomposition, and sequential/parallel execution • Create
  reusable agent node libraries and extensible platform
  patterns supporting multiple business domains • Design
  versioning strategies and testing frameworks for agent
  workflows (unit, integration, end-to-end)
  
  Backend Development & API Design: • Build production FastAPI
  applications with async I/O patterns for PostgreSQL, Redis,
  and external services • Implement Server-Sent Events (SSE)
  and WebSocket protocols for real-time agent streaming
  responses • Design RESTful APIs and event-driven
  architectures for agent orchestration • Develop robust error
  handling, graceful degradation, and enterprise security
  integration (LDAP, SSO, access control) • Handle concurrent
  async operations and deploy containerized services using
  Docker and CI/CD pipelines
  
  LLM Integration, Orchestration & Tool Calling: • Integrate
  cloud-based LLM providers (AWS Bedrock, Azure OpenAI,
  Anthropic Claude, OpenAI GPT-4) • Design prompt management
  systems with versioning, templating, and dynamic compilation
  • Implement conversation state persistence using Redis
  checkpointing for multi-turn agent interactions • Build
  tool-calling protocols (Model Context Protocol, function
  calling) for external data sources and APIs • Develop
  response transformation pipelines converting raw data into
  structured analytical outputs (charts, insights) • Create
  hybrid intelligence patterns combining LLM reasoning with
  rule-based logic and statistical analysis
  
  LLMOps, Observability & Optimization: • Integrate
  observability platforms (Langfuse, LangSmith, or similar)
  for end-to-end agent tracing and telemetry • Build
  monitoring systems tracking agent performance, LLM usage,
  latency, costs, and quality metrics • Implement evaluation
  frameworks measuring agent success rates, reasoning quality,
  and output accuracy • Optimize token usage and manage LLM
  costs across production workflows
  
  
  Cross-Functional Collaboration: • Partner with data
  engineers and business analysts to translate requirements
  into agent workflows • Collaborate with UX teams on
  streaming interfaces and visualization requirements • Mentor
  junior engineers on async Python patterns, agent design, and
  LLMOps best practices • Participate in architecture reviews
  and contribute to documentation and knowledge sharing
  
  
  
  Desired Experience* | Required: • Bachelor's or Master's
  degree in Computer Science, Engineering, AI, Data Science,
  or related field • 9+ years of software engineering
  experience with 2+ years building production LLM-powered
  applications • Expert-level async Python programming
  (asyncio, async/await patterns) • Experience with agentic
  orchestration frameworks: LangGraph (preferred), LangChain,
  CrewAI, Autogen, or similar • Production FastAPI or similar
  async web frameworks • Integration with cloud LLM providers:
  AWS Bedrock, Azure OpenAI, Anthropic, or OpenAI • Docker
  containerization and Git version control • Cloud platform
  experience: AWS, Azure, or Google Cloud
  
  Critical Agentic AI Experience: • Built autonomous agent
  systems performing multi-step tasks beyond simple chatbots •
  Designed complex workflows with conditional logic and state
  management • Implemented tool-calling patterns for external
  system integration • Prompt engineering at scale
  (templating, versioning, optimization) • Understanding of
  agentic design patterns (ReAct, Plan-and-Execute, tool-use
  agents) • Strong problem-solving, communication, and ability
  to work in globally distributed teams
  
  Ideal Candidates Would Also Have:
  
  - Prior experience in global life sciences especially in the
    PDS functional area will be a plus
  - Experience working internationally with a globally dispersed
    team including diverse stakeholders and management of
    offshore technical development team(s)
  - Strong communication and presentation skills
  
  Other Qualifications:
  
  - Bachelor’s degree in AI, Data Science, Computer Science,
    Information Systems, Computer Engineering or equivalent is
    preferred
  - Experience in implementing Agentic AI solution or MCP is
    preferred
  
