description: |
  As the global leader in high-speed connectivity, Ciena is
  committed to a people-first approach. Our teams enjoy a
  culture focused on prioritizing a flexible work environment
  that empowers individual growth, well-being, and belonging.
  We’re a technology company that leads with our
  humanity—driving our business priorities alongside
  meaningful social, community, and societal impact.
  
  How You Will Contribute:
  
  You will report to R&D team and play a key role in designing
  and developing AI-enabled applications for Ciena’s Navigator
  Network Control Suite. Your work will directly contribute to
  enhancing network performance, automation, and operational
  efficiency through cutting-edge AI/ML solutions.
  
  In this role, you will:
  
  - Design, develop, and deliver AI applications using
    Generative AI, LLMs, Classical ML, and Agentic AI
    techniques.
  - Collaborate with cross-functional teams to integrate AIOps
    capabilities into Ciena's Navigator platform.
  - Analyze large datasets to uncover actionable insights and
    support data-driven decisions.
  - Fine-tune and train AI models tailored to Ciena’s product
    and network application needs.
  - Participate in code reviews, testing, and deployment to
    ensure high-quality, scalable software.
  - Research the latest AI technologies and help define best
    practices for solution development and deployment.
  
  The Must Haves:
  
  - Bachelor’s degree in Artificial Intelligence, Computer
    Science, Engineering, or a related field.
  - 5+ years of experience in developing AI software,
    particularly for AIOps or Data Science use cases.
  - Hands-on experience with LLMs, transformers, agentic
    frameworks, and RAG (Retrieval-Augmented Generation)
    techniques.
  - Strong programming skills in Python, Java, or C++.
  - Experience with machine learning frameworks like TensorFlow
    or PyTorch.
  - Familiarity with cloud platforms (e.g., AWS, Azure) and
    containerization tools such as Docker and Kubernetes.
  - Proven experience building microservice-based software
    systems.
  - Strong grasp of network management protocols and principles.
  - Effective communicator with the ability to work
    independently and collaboratively.
  
  Assets:
  
  - Experience with Ciena network management solutions.
  - Understanding of AIOps tools and practices.
  - A Master’s or advanced degree in a related field.
  - Passion for innovation, continuous learning, and solving
    complex problems.
  
