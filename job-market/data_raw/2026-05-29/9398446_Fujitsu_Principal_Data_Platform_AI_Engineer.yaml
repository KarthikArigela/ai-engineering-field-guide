description: |
  Principal Data Platform & AI Engineer
  
  Location: Belgium, Netherlands, Luxemburg (Benelux) (Hybrid)
  Employment Type: Full-time Department: Data & AI
  
  Shape the Future of Data & AI with Fujitsu Benelux
  
  At Fujitsu Benelux we combine human-centric innovation with
  world-class technology to help organizations solve complex
  societal and business challenges. Rooted in our Japanese
  heritage and long-term partnership approach, we believe
  technology should create trust, sustainability, and
  meaningful impact.
  
  As part of our growing Data & AI practice in the Benelux, we
  are looking for a Principal Data Platform & AI Engineer to
  lead the design, architecture, and delivery of modern
  enterprise data platforms and AI solutions.
  
  This is a strategic and hands-on leadership role for someone
  who thrives at the intersection of architecture,
  engineering, customer engagement, and innovation. You will
  work closely with leading enterprises, public sector
  organizations, and regulated industries to modernize their
  data ecosystems and unlock business value through cloud-
  native platforms, analytics, and AI.
  
  Your Role
  
  As a Principal Data Platform & AI Engineer, you will act as
  both trusted advisor and technical leader, helping customers
  define and implement scalable, secure, and future-ready data
  architectures.
  
  You will lead initiatives spanning:
  
  - modern cloud data platforms,
  - lakehouse and data mesh architectures,
  - enterprise AI enablement,
  - advanced analytics,
  - governance and security,
  - and intelligent automation.
  
  You are equally comfortable discussing enterprise strategy
  with executives as you are designing scalable pipelines,
  reviewing code, or mentoring engineering teams.
  
  Key Responsibilities
  
  
  
  Architecture & Platform Leadership
  
  - Define and lead target-state architectures for modern data
    platforms using technologies such as Databricks, Microsoft
    Fabric, Azure Synapse, Snowflake, and cloud-native
    services.
  - Design scalable data lakehouse environments, ingestion
    frameworks, semantic layers, and analytics architectures.
  - Architect secure, governed, and high-performing enterprise
    data solutions aligned with customer strategy, compliance,
    and European data regulations.
  - Lead the adoption of modern architectural frameworks
    including Medallion Architecture, Data Mesh, and AI-ready
    data platforms.
  - Collaborate with enterprise architects and customer
    stakeholders to align technical roadmaps with business
    objectives.
  
  
  
  Engineering & Delivery
  
  - Lead end-to-end implementation of data platforms and AI
    solutions from advisory and proof-of-concept through
    production deployment.
  - Build and optimize ETL/ELT pipelines, streaming solutions,
    and transformation frameworks using Python, PySpark, SQL,
    and cloud-native technologies.
  - Implement best practices for CI/CD, Infrastructure as Code,
    DevOps, automation, monitoring, and platform lifecycle
    management.
  - Establish standards for data quality, metadata management,
    governance, observability, and security.
  - Support and mentor engineering teams while contributing
    hands-on when needed.
  
  
  
  AI & Advanced Analytics
  
  - Help customers operationalize AI and machine learning
    capabilities on top of modern data platforms.
  - Enable enterprise AI use cases including generative AI,
    intelligent search, forecasting, and advanced analytics.
  - Guide customers in creating AI-ready architectures with
    trusted and governed data foundations.
  - Stay ahead of emerging trends in Data & AI and contribute
    thought leadership internally and externally.
  
  
  
  Customer Engagement & Consulting
  
  - Act as a strategic advisor to customers on data
    modernization, cloud transformation, and AI adoption.
  - Translate complex technical concepts into clear business
    value and actionable outcomes.
  - Build trusted relationships with both technical and
    executive stakeholders.
  - Contribute to proposals, workshops, customer presentations,
    and strategic initiatives.
  
  Your Profile
  
  You are a senior Data & AI professional with strong
  architectural vision, consulting capabilities, and hands-on
  engineering expertise.
  
  You enjoy solving complex challenges, working
  collaboratively across teams, and creating long-term value
  for customers.
  
  Required Experience & Skills
  
  - Bachelor’s or Master’s degree in Computer Science,
    Engineering, Information Systems, or equivalent
    experience.
  - 7+ years of experience in data engineering, platform
    architecture, analytics, or AI-related roles.
  - 3+ years of deep hands-on experience with Databricks in
    enterprise environments.
  - Strong experience designing and implementing enterprise data
    platforms in Azure, AWS, or GCP environments.
  - In addition to Databricks, deep expertise in one or more
    modern data platform technologies such as:
    - Microsoft Fabric,
    - Azure Synapse,
    - Snowflake,
  - Strong programming skills in Python, PySpark, and SQL.
  - Experience with ETL/ELT frameworks, Delta Lake, data lakes,
    and cloud-native architectures.
  - Solid understanding of data modelling techniques including
    dimensional modelling and Data Vault.
  - Experience implementing CI/CD, Infrastructure as Code, Git-
    based workflows, and DevOps practices.
  - Knowledge of data governance, metadata management, security,
    and compliance frameworks.
  - Strong communication and stakeholder management skills.
  - Ability to work both strategically and hands-on in customer-
    facing environments.
  - Professional proficiency in Dutch and English, spoken and
    written.
  
  Preferred Qualifications
  
  - Databricks certification(s): Databricks Certified Data
    Engineer Professional, Databricks Certified Solutions
    Architect.
  - Certifications within Azure, Microsoft Fabric, AWS, or GCP.
  - Experience with Power BI, DAX, and Power Query M.
  - Experience with AI/ML platforms, MLflow, or generative AI
    solutions.
  - Previous consulting experience or leadership in enterprise
    transformation programs.
  - Experience working in agile environments such as Scrum or
    Kanban.
  
  Why Fujitsu Benelux?
  
  At Fujitsu Benelux, you will become part of a collaborative
  and inclusive culture where innovation, trust, and
  continuous learning are highly valued.
  
  We offer:
  
  - The opportunity to shape enterprise-scale Data & AI
    transformations.
  - Work with leading organizations across commercial and public
    sectors.
  - Exposure to innovative cloud and AI technologies.
  - A flexible hybrid working environment.
  - A strong focus on personal growth, certification, and
    continuous learning.
  - A people-first culture built on collaboration, diversity,
    and long-term partnerships.
  - The opportunity to contribute to sustainable and responsible
    digital transformation.
  
  If you are passionate about building modern data platforms
  and enabling the next generation of AI-driven organizations,
  we would love to hear from you.
