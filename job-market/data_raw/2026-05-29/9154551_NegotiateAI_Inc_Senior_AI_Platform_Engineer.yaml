description: |
  Senior Software Engineer – AI Platform
  
  NegotiateAI (Menlo Ventures–backed)
  
  About NegotiateAI
  
  NegotiateAI is building an enterprise AI platform to
  modernize procurement for manufacturing and industrial
  companies. Procurement today is fragmented, manual, and
  opaque. We’re changing that by giving teams clean data,
  real-time visibility, and AI-driven workflows that actually
  get used.
  
  We focus on indirect spend - MRO, services, and long-tail
  categories - where inefficiency quietly costs enterprises
  millions every year. Our platform combines agentic AI, LLMs,
  and Retrieval-Augmented Generation (RAG) to turn messy
  procurement data into actionable decisions and measurable
  savings.
  
  Backed by Menlo Ventures and founded by a former Apple
  supply-chain leader, we’re building real systems used by
  real enterprises.
  
  About the Role
  
  This is a hands-on senior execution role working alongside
  with the founding engineers. You’ll help build and scale the
  core platform across backend services, AI workflows, and the
  Buyer Portal frontend.
  
  You’ll be expected to move fast using modern AI-assisted
  development tools (e.g., Cursor, Copilot-style workflows) to
  iterate quickly, refactor aggressively, and ship production-
  quality code. This is not a research role - it’s about
  building systems that work.
  
  What You’ll Do
  
  - Build and extend backend services that power NegotiateAI’s
    AI-driven procurement platform
  - Implement LLM- and RAG-based pipelines for spend
    categorization, benchmarking, and supplier analysis
  - Develop and maintain agentic workflows that automate
    analysis, recommendations, and follow-ups
  - Contribute to the Buyer Portal frontend (React), building
    clean, usable interfaces for procurement teams
  - Use AI-assisted coding tools (e.g., Cursor) to accelerate
    development, debugging, and iteration
  - Integrate with customer data sources (ERPs, invoices,
    supplier files) and handle messy, real-world datasets
  - Collaborate closely with the founding engineer on
    architecture, trade-offs, and execution
  - Write clear, maintainable code with strong attention to
    performance, reliability, and observability
  
  Must Haves
  
  - 6+ years of professional software engineering experience
  - Strong backend experience building APIs and data pipelines;
    comfort working across the stack
  - Experience shipping products in fast-moving startup or
    startup-like environments
  - Hands-on experience with Node.js and React
  - Practical experience building or integrating AI-powered
    systems (LLMs, RAG, embeddings, or agentic workflows)
  - Comfortable using AI-assisted development tools (Cursor,
    Copilot, or similar) to move faster without sacrificing
    quality
  - Strong product and design sense and ability to balance speed
    with correctness
  - Ownership mindset: you see problems through to completion
  - Full tech stack + ML + product sense must. Can code and
    iterate quickly and scrappily, but can also step back and
    architect the stack, experience with Node & React.
  - A+ player, exceptionally good technically, exceptional
    leader
  - Hungry to build a $B+ VC backed AI enterprise solution
  
  Additional nice to haves:
  
  - Some large company experience early in career
  - Experience with building consumer software and familiar with
    how to build consumer-grade software
  - Experience in scaling and working with enterprise clients
