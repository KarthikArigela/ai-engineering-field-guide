description: |
  About Life360
  
  Life360’s mission is to keep people close to the ones they
  love. Our category-leading mobile app,Tile tracking devices,
  and Pet GPS tracker empower members to protect the people,
  pets, and things they care about most with a range of
  services, including location sharing, safe driver reports,
  and crash detection with emergency dispatch. Life360 serves
  approximately 97.8 million monthly active users (MAU), as of
  March 31, 2026, across more than 180 countries.
  
  Life360 delivers peace of mind and enhances everyday family
  life with seamless coordination for all the moments that
  matter, big and small. By continuing to innovate and deliver
  for our customers, we have become a household name and the
  must-have mobile-based membership for families (and those
  friends who are basically family).
  
  Life360 has more than 500 (and growing!) remote-first
  employees. For more information, please visit life360.com.
  
  Life360 is a Remote-First company, which means a remote work
  environment will be the primary experience for all
  employees. All positions, unless otherwise specified, can be
  performed remotely (within the US) regardless of any
  specified location above.
  
  We are AI Native
  
  We are building an AI native company where AI is an integral
  part of how we build and operate. AI tool usage during
  interviews varies by role. You may be asked to demonstrate
  proficiency with AI tools, discuss how you leverage AI, or
  complete interview exercises without AI assistance. Your
  Recruiter will provide clear guidance as you move through
  the interview process.
  
  Undisclosed use of AI not previously discussed with or
  approved by your Recruiter may impact your candidacy.
  
  About The Team
  
  The IT team enables every Life360 employee to do their best
  work — owning helpdesk, identity and access, hardware, in-
  office technology (yes, we still have offices!), and the
  business applications that run the company. We’re a small,
  high-leverage team that treats internal IT as a product,
  automating the repetitive parts so engineering effort across
  the company goes toward work that compounds.
  
  About the Job
  
  Reporting to the IT Engineering Manager, the Senior IT
  Automation Engineer II is the senior individual contributor
  responsible for the automation surface across our SaaS,
  identity, and infrastructure stack. You’ll bring deep,
  hands-on engineering depth in API integrations, role-based
  access control (RBAC), and SOX control automation — while
  helping us evolve our operating model from script- and
  workflow-based automation toward agentic, AI-driven IT
  operations. This role is a force multiplier for the IT team
  and partners closely with Security, Compliance, and People
  Operations. You’ll inherit and operate the existing
  portfolio of low-code automations from prior owners while
  building new work — using judgment across low-code (Tray),
  code (AWS Lambda), and AI to put each workflow in the right
  home.
  
  The US-based salary range for this position is $91,000 to
  $169,000. We take into consideration an individual’s
  background and experience in determining final salary;
  therefore, base pay offered may vary considerably depending
  on geographic location, job-related knowledge, skills, and
  experience. The compensation package includes a wide range
  of medical, dental, vision, financial, and other benefits,
  as well as equity.
  
  What You’ll Do
  
  - Design, build, and maintain SOX control automation that
    reduces manual work for IT and control owners, partnering
    with Compliance to define time-based and event-based
    triggers that keep controls executing correctly and on
    schedule.
  - Build API-driven integrations across our SaaS and
    infrastructure stack — Okta, Google Workspace, GitHub,
    AWS, and Atlassian — using Tray, Terraform, GAM, and
    codeless tooling where appropriate.
  - Extend our RBAC and access governance tooling, with a focus
    on automated provisioning, deprovisioning, and entitlement
    reviews.
  - Develop AI- and agent-based workflows that go beyond
    traditional scripting — building, evaluating, and
    operating LLM-powered agents (e.g., MCP servers, Claude
    Code sub-agents) for IT operations, monitoring, and
    remediation.
  - Extend existing workflow systems (Jira, GitHub, AWS) with
    automation touchpoints to eliminate manual handoffs, and
    recommend improvements to automations as they age.
  - Operate across the trinity of Tray, code (AWS Lambda), and
    AI — using judgment to graduate stable, low-touch
    workflows from low-code to code-first homes when the cost-
    benefit shifts, with AI as the leverage that makes the
    migration cheap.
  - Develop automated monitoring to detect and proactively self-
    remediate issues, and serve as a senior escalation point
    for the IT Operations team.
  - Maintain clear, current documentation for automation
    processes, agent behaviors, and integration patterns;
    mentor teammates on building scalable, observable
    automation.
  - Participate in on-call rotations.
  
  What We’re Looking For
  
  - Demonstrated experience designing and operating production
    automation across enterprise SaaS, with deep working
    knowledge of Okta, Google Workspace, GitHub, AWS, and
    Atlassian administration and integration.
  - Deep understanding of REST APIs, authentication patterns
    (OAuth, SAML, OIDC, SCIM), and integration tooling such as
    Postman, Tray, Zapier, GAM, and Terraform.
  - Working knowledge of programming concepts in at least one
    scripting language (Python, JavaScript, Go, Groovy, etc.)
    — comfortable describing a solution in pseudocode before
    implementation.
  - Hands-on experience implementing role-based access control
    (RBAC) and supporting SOX or equivalent compliance control
    automation.
  - Comfortable working with IaC frameworks (i.e. Terraform)
  - Daily use of AI as a leverage tool in your engineering
    practice (e.g., Claude, ChatGPT, Copilot — generating
    code, debugging integrations, drafting docs), with the
    curiosity and capability to evolve toward agentic
    operating methods (MCP, Claude Code, AI sub-agents,
    autonomous workflows) as the team matures.
  - Clear written communication and the ability to produce
    training materials and standalone documentation that other
    engineers can pick up and run with.
  - Comfort taking over existing low-code automation work — able
    to read, troubleshoot, and safely modify workflows you
    didn’t author. Tray experience is a strong plus; equally
    welcomed: demonstrated ability to ramp on a new low-code
    platform fast (e.g., a Workato or Zapier expert who can
    pick up Tray within weeks).
  - Highly Preferred: Tray, Airtable, Groovy/ScriptRunner,
    and/or experience building MCP servers or AI agents in
    production.
  
  Our Benefits
  
  - Competitive pay and benefits
  - Medical, dental, vision, life and disability insurance plans
    (100% paid for employees)
  - 401(k) plan with company matching program
  - Mental Wellness Program & Employee Assistance Program (EAP)
    for mental well-being
  - Flexible PTO, 13 company-wide days off throughout the year
  - Winter and Summer Weeklong Synchronized Company Shutdowns
  - Learning & Development programs
  - Equipment, tools, and reimbursement support for a productive
    remote environment
  - Free Life360 Platinum Membership for your preferred circle
  - Free Tile Products
  
  Life360 Values
  
  Our company’s mission driven culture is guided by our shared
  values to create a trusted work environment where you can
  bring your authentic self to work and make a positive
  difference.
  
  - Be a Good Person - We have a team of high integrity people
    you can trust.
  - Be Direct With Respect - We communicate directly, even when
    it’s hard.
  - Members Before Metrics - We focus on building an exceptional
    experience for families.
  - High Intensity, High Impact - We do whatever it takes to get
    the job done.
  
  Our Commitment to Diversity
  
  We believe that different ideas, perspectives and
  backgrounds create a stronger and more creative work
  environment that delivers better results. Together, we
  continue to build an inclusive culture that encourages,
  supports, and celebrates the diverse voices of our
  employees. It fuels our innovation and connects us closer to
  our customers and the communities we serve. We strive to
  create a workplace that reflects the communities we serve
  and where everyone feels empowered to bring their authentic
  best selves to work.
  
  We are an equal opportunity employer and value diversity at
  Life360. We do not discriminate on the basis of race,
  religion, color, national origin, gender, sexual
  orientation, age, marital status, veteran status, disability
  status or any legally protected status.
  
  We encourage people of all backgrounds to apply. We believe
  that a diversity of perspectives and experiences create a
  foundation for the best ideas. Come join us in building
  something meaningful. Even if you don’t meet 100% of the
  below qualifications, you should still seriously consider
  applying!
  
