description: |
  At PwC, our people in business application consulting
  specialise in consulting services for a variety of business
  applications, helping clients optimise operational
  efficiency. These individuals analyse client needs,
  implement software solutions, and provide training and
  support for seamless integration and utilisation of business
  applications, enabling clients to achieve their strategic
  objectives. In Oracle data and analytics at PwC, you will
  utilise Oracle's suite of tools and technologies to work
  with data and derive insights from it. You will be
  responsible for tasks such as data collection, data
  cleansing, data transformation, data modelling, data
  visualisation, and data analysis using Oracle tools like
  Oracle Database, Oracle Analytics Cloud, Oracle Data
  Integrator, Oracle Data Visualization, and Oracle Machine
  Learning. Enhancing your leadership style, you motivate,
  develop and inspire others to deliver quality. You are
  responsible for coaching, leveraging team member's unique
  strengths, and managing performance to deliver on client
  expectations. With your growing knowledge of how business
  works, you play an important role in identifying
  opportunities that contribute to the success of our Firm.
  You are expected to lead with integrity and authenticity,
  articulating our purpose and values in a meaningful way. You
  embrace technology and innovation to enhance your delivery
  and encourage others to do the same. Examples of the skills,
  knowledge, and experiences you need to lead and deliver
  value at this level include but are not limited to: Analyse
  and identify the linkages and interactions between the
  component parts of an entire system. Take ownership of
  projects, ensuring their successful planning, budgeting,
  execution, and completion. Partner with team leadership to
  ensure collective ownership of quality, timelines, and
  deliverables. Develop skills outside your comfort zone, and
  encourage others to do the same. Effectively mentor others.
  Use the review of work as an opportunity to deepen the
  expertise of team members. Address conflicts or issues,
  engaging in difficult conversations with clients, team
  members and other stakeholders, escalating where
  appropriate. Uphold and reinforce professional and technical
  standards (e.g. refer to specific PwC tax and audit
  guidance), the Firm's code of conduct, and independence
  requirements. The Opportunity As part of the Data and
  Analytics Engineering team, you will serve as both a
  technical leader and a trusted advisor to clients, combining
  AI/ML knowledge with business acumen to design and deliver
  AI solutions that drive measurable client outcomes. As a
  Manager, you will lead teams of data scientists and ML
  engineers, manage client relationships, and translate
  complex business challenges into AI-driven strategies and
  solutions. This role offers the chance to shape AI solution
  architecture while driving innovation and excellence in
  client engagements. Responsibilities
  - Lead and mentor teams of data scientists and ML engineers
  - Manage client relationships and promote satisfaction with
    deliverables
  - Translate intricate business challenges into AI-driven
    strategies
  - Design and implement AI solution architectures
  - Drive innovation and excellence in client engagements
  - Analyze data to derive actionable insights and solutions
  - Collaborate with stakeholders to align on project objectives
  - Uphold exceptional standards of quality and integrity in
    every task
  What You Must Have
  - Bachelor's Degree
  - At least 7 years of experience in AI/ML engineering, data
    science, or a related technical role
  What Sets You Apart
  - Master's Degree in Computer Science, Artificial
    Intelligence, Data Science, Software Engineering, or
    related field preferred
  - Experience with Large Language Models and prompt engineering
  - Building scalable, cloud-native microservices and
    containerized deployments
  - Proficiency with MLOps tooling and CI/CD pipelines for ML
  - Experience with vector databases and semantic search
    architectures
  - Translating complex business problems into AI solution
    designs
  - Contributing to business development and proposal writing
  - Cloud certifications in AI/ML or solutions architecture
    preferred
  - Familiarity with Responsible AI principles and bias
    mitigation practices
