  Job Description:
  
  In our company, your core responsibilities include:
  
  - Integrate AI tools into existing .NET and C++ applications.
  - Develop, train and optimize approaches on Windows systems.
  - Develop interfaces and wrappers for model interaction within
    the apps.
  - Handle deployment processes (installers, updates).
  - Monitor and maintain AI components for reliability and
    performance.
  - Collaborate with software engineers and AI engineers
  
  Requirements for this role are:
  
  - Strong experience with .NET (C#) and C++ development.
  - Familiarity with AI/ML model handling, in particular focused
    on open-source solutions
  - Experience with Conception, Training, Optimization and Fine
    Tuning of Machine Learning algorithms, e.g. Neural
    Networks
  - Experience with state of the art technology in Generative
    AI, e.g. Large Language Models
  - Experience with state of the art sandboxing solutions
  - Ability to optimize models for CPU/GPU performance on
    Windows.
  - Experience with packaging and deploying software in offline
    setups.
  - Good understanding of performance tuning and resource
    management
  - Familiarity with basic MLOps concepts for versioning and
    testing.
  
  Skills:
  
  C++ Programming Language, Git, Machine Learning Operations,
  Python (Programming Language)
  
  Education & Experience:
  
  Minimum of 8 years of related experience with a Bachelor’s
  degree; or 6 years and a Master’s degree; or a PhD with 3
