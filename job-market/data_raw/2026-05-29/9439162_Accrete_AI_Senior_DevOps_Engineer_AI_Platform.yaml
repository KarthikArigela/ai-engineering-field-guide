description: |
  Office Location: Lower Manhattan, NY (4 days per week in the
  office)
  
  About Accrete:
  
  Accrete is a dynamic and innovative company focused on
  transforming the future of artificial intelligence. We
  specialize in creating advanced AI solutions that turn
  complex data into actionable insights, driving real-world
  impact for businesses and government organizations. Our team
  thrives on creativity and collaboration, working together to
  push the boundaries of AI technology.
  
  At the core of our offerings are our AI agents, designed to
  autonomously analyze data, generate insights, and make
  intelligent recommendations. These agents help businesses
  streamline operations, improve decision-making, and also
  empower government entities to enhance security,
  intelligence, and operational efficiency
  
  About Role: The Senior DevOps Engineer is a senior technical
  leader responsible for designing, implementing, and
  maintaining scalable and reliable infrastructure and
  deployment pipelines. This role drives the automation,
  monitoring, and continuous integration/continuous delivery
  (CI/CD) processes to enable fast, secure, and efficient
  software delivery. The Senior AI Platform Engineer,
  Infrastructure collaborates with engineering teams to
  optimize system performance, reliability, and security while
  mentoring and guiding junior team members.
  
  Key Responsibilities:
  
  - Lead the design, implementation, and management of cloud
    infrastructure and deployment pipelines.
  - Develop and maintain automation tools for build, test,
    deployment, and infrastructure provisioning.
  - Collaborate with software engineers, QA, and security teams
    to ensure robust CI/CD processes.
  - Monitor system performance, troubleshoot issues, and
    implement improvements for scalability and reliability.
  - Define and enforce best practices for infrastructure,
    configuration management, and security.
  - Drive initiatives for disaster recovery, backup, and system
    resilience.
  - Mentor and guide DevOps engineers and other technical team
    members.
  - Stay current with emerging technologies, tools, and industry
    trends to continuously improve DevOps capabilities.
  - Participate in architecture and design discussions to align
    DevOps strategies with business goals.
  
  Qualifications & Experience:
  
  - Bachelor’s or Master’s degree in Computer Science,
    Engineering, or related experience.
  - 5+ years of experience in DevOps, system administration, or
    related roles.
  - Deep expertise with cloud platforms (AWS, Azure, GCP) and
    infrastructure-as-code tools (Terraform, Terragrunt, and
    Helm).
  - Strong scripting and programming skills (Python, Bash, Go,
    etc.).
  - Experience with containerization and orchestration (Docker,
    Kubernetes).
  - Proficient in CI/CD tools such as Jenkins, GitLab CI,
    CircleCI, or similar.
  - Knowledge of security best practices and compliance
    requirements.
  - Experience with monitoring and logging tools (Prometheus,
    Grafana, ELK Stack).
  
  Skills & Competencies:
  
  - Proven experience supporting FedRAMP-authorized
    environments, including implementing, maintaining, and
    operating controls in accordance with FedRAMP Moderate or
    High requirements.
  - Strong leadership and mentorship skills.
  - Excellent problem-solving and analytical abilities.
  - Ability to design scalable, secure, and fault-tolerant
    systems.
  - Effective communication and collaboration skills across
    teams.
  - Proactive approach to continuous improvement and innovation.
  - Ability to manage complex projects and multiple priorities.
  
  Cultural Fit & Values At Accrete, success goes beyond
  technical expertise—we value innovation, collaboration, and
  accountability. Our team members embody:
  
  - Ownership & Accountability: Drive projects to completion
    with high standards and proactive problem-solving
  - Transparency & Communication: Share information openly and
    give/receive constructive feedback
  - Strategic Thinking & Problem-Solving: Analyze challenges
    critically and implement effective solutions
  - Collaboration & Professionalism: Contribute meaningfully as
    a team player and uphold mutual respect
  - Passion for AI & Innovation: Stay curious, continuously
    learn, and push AI’s potential
  - Going Beyond the Job Description: Seek opportunities to
    contribute beyond core responsibilities
  
  These principles shape our culture, performance evaluations,
  and growth opportunities, ensuring we build a mission-driven
  organization together.
  
  Company Benefits
  
  - Competitive Salary: Aligned with experience and market
    standards
  - Comprehensive Insurance: Health, dental, and vision coverage
    for you and your family
  - 401(k) Plan: Build your financial future with our retirement
    savings plan
  - Flexible PTO & Hybrid Work: Take time off when needed and
    enjoy remote flexibility per company guidelines
  - Growth & Development: Access professional learning
    opportunities and career advancement support
  - Onsite Perks: Enjoy catered lunches, snacks, and a fully
    stocked kitchen
  - Team Bonding: Company-sponsored happy hours and social
    events to connect and unwind
