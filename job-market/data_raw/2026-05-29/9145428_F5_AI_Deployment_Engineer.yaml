description: |
  At F5, we strive to bring a better digital world to life.
  Our teams empower organizations across the globe to create,
  secure, and run applications that enhance how we experience
  our evolving digital world. We are passionate about
  cybersecurity, from protecting consumers from fraud to
  enabling companies to focus on innovation.
  
  
  Everything we do centers around people. That means we obsess
  over how to make the lives of our customers, and their
  customers, better. And it means we prioritize a diverse F5
  community where each individual can thrive.
  
  Position Summary
  
  We are seeking an AI Deployment Engineer to join the Central
  Operations team at F5. This role focuses on designing,
  building, and deploying AI agents and automation solutions
  that improve operational workflows across the business.
  
  You will collaborate with AI Infrastructure Engineers,
  Digital (IT), and business stakeholders to turn operational
  needs into practical AI solutions. Responsibilities include
  building agents and apps, integrating advanced AI models,
  designing prompts, automations, and workflows for
  productivity gains.
  
  Candidates must have hands-on experience deploying agentic
  applications with modern AI models like OpenAI GPT and
  Anthropic Claude, strong automation skills, and expertise in
  prompt engineering for ethical, user-focused AI. Problem-
  solving ability, repeatable solution development, and clear
  communication in cross-functional settings are essential.
  
  The role combines prompt engineering, agent development, and
  operational deployment, ensuring solutions are reliable,
  scalable, and aligned with enterprise governance standards.
  You will partner with Digital to ensure architectural
  alignment while collaborating with business teams to refine
  workflows, iterate on solutions, and drive adoption.
  
  Success in this role requires strong technical curiosity,
  the ability to translate real operational problems into AI-
  enabled solutions, and the capability to rapidly prototype
  and deploy automation through short execution cycles.
  
  Primary Responsibilities / What You’ll Do
  
  - Develop and deploy AI agents, apps, and automation solutions
    that improve operational workflows.
  - Design, test, and refine prompts and agent behaviors to
    ensure reliable and high-quality outputs from generative
    AI systems.
  - Work closely with the AI Data Engineer to translate
    identified use cases into practical AI-enabled solutions.
  - Collaborate with Digital (IT) to ensure solutions align with
    enterprise governance, security, and architecture
    standards.
  - Build and deploy solutions using agentic AI models such as
    Microsoft Copilot, Google Gemini, and other enterprise AI
    platforms.
  - Operationalize AI-powered automation solutions across
    business functions including Services, Customer Success,
    Sales, and Operations.
  - Measure solution performance, troubleshoot issues, and
    continuously improve agent interactions and automation
    workflows.
  - Support rapid pilot development and execution sprints to
    validate use cases and demonstrate value.
  - Document best practices and help scale successful AI
    solutions across teams.
  - Partner with business stakeholders to iterate on solutions
    and drive adoption through enablement and feedback loops.
  - Assist with Security and privacy reviews as needed.
  
  Qualifications / What You’ll Bring
  
  - Bachelor’s degree in Computer Science, Engineering, Data
    Science, or related technical field (or equivalent
    experience).
  - 5+ years of engineering experience: AI engineering, prompt
    engineering, automation engineering, or AI solution
    development.
  - Hands-on experience working with AI platforms such as
    OpenAI, Anthropic, Microsoft Copilot, Google Gemini, or
    similar enterprise AI environments.
  - Experience building AI Agents(teams/slack), AI-assisted
    applications (Kubernetes deployment) or similar workflow
    solutions
  - Familiarity with automation platforms, deployment
    environments and workflow tools (Python,
    typescript/javascript, docker, Kubernetes, etc.).
  - Strong understanding of prompt engineering, AI interaction
    design, and responsible AI practices.
  - Ability to translate business requirements into AI-enabled
    automation solutions.
  - Strong problem-solving skills with a practical, user-centric
    approach to AI deployment.
  - Excellent communication and partnership skills with the
    ability to operate in cross-functional environments.
  - Knowledge of AI ethics and responsible AI prompt design
    principles.
  - Problem-solving mindset and user-centric development
    approach, with an innate ability to translate user
    requirements into AI-based solutions.
  - Strong interpersonal skills, high emotional intelligence,
    and ability to develop effective partnerships across the
    company to engage, align, and gain stakeholder buy-in.
  
  The Job Description is intended to be a general
  representation of the responsibilities and requirements of
  the job. However, the description may not be all-inclusive,
