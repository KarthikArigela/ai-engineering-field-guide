description: |
  Meet Aperture
  
  
  
  Aperture is a growth consultancy and advertising partner for
  some of the world's most ambitious ecommerce brands. We
  plan, build, and manage performance marketing programmes
  across Meta, TikTok, Google, and beyond — with a strong
  focus on creative strategy and paid social.
  
  
  
  We work across performance marketing, creative strategy, and
  now, increasingly, proprietary tooling that gives us and our
  clients an edge.
  
  
  
  Founded in 2022 and based across London, we work with
  clients across the US and Europe. We're a small, senior team
  that moves fast, thinks carefully, and holds ourselves to a
  high standard.
  
  
  
  Our job is to make growth happen.
  
  
  
  Our culture
  
  
  
  - Client success is our success. Period.
  - We're direct. We say what we mean and we mean what we say.
  - We do the work. No one here is above anything.
  - We hire people we trust and we trust the people we hire.
  - We move fast, but we don't cut corners where it matters.
  - We operate with high standards and low ego.
  - We're here to build something good, not just something big.
  - We back our people when it counts.
  
  
  
  The role
  
  
  
  Aperture OS is an internal tool we've built to give us an
  operational edge. It helps us track performance, manage
  creative workflows, and surface insights across our client
  portfolio in ways that off-the-shelf tools don't.
  
  
  
  Now we want to scale it.
  
  
  
  We're looking for someone to own it. Not manage it. Own it.
  
  
  
  You will be the primary engineer and technical decision-
  maker for Aperture OS. You'll define what it becomes, how
  it's built, and how it serves the team. You'll work directly
  with the founder and client teams to understand what's
  needed and build it — properly.
  
  
  
  This is a serious ownership opportunity at a fast-moving
  company that knows what it wants and gives its people room
  to deliver it.
  
  
  
  What you'll own
  
  
  
  - The full Aperture OS codebase — architecture, quality, and
    evolution.
  - Feature development end-to-end: scoping, building, shipping,
    iterating.
  - API integrations — pulling data from ad platforms, creative
    tools, and internal systems.
  - AI and LLM integrations — we use AI heavily in our creative
    and analysis workflows.
  - Database design and data modelling as the product grows.
  - Infrastructure, hosting, and deployment — keeping things
    running reliably.
  - Security, access control, and compliance for a multi-client
    environment.
  
  
  
  Who this is for
  
  
  
  This is for a serious engineer who also builds. You don't
  wait to be told what to do — you figure it out, propose it,
  and do it.
  
  
  
  You're comfortable with ambiguity and you thrive in
  environments where the spec isn't always written in advance.
  You can move quickly when speed is needed and slow down when
  precision matters.
  
  
  
  You care about the product you're building, not just the
  code. You think about the person using it, the problem it
  solves, and whether it's actually good.
  
  
  
  You've probably worked in a startup or early-stage
  environment before. You know how to operate without a lot of
  support infrastructure.
  
  
  
  You use AI tools in your daily workflow — not as a crutch,
  but as a force multiplier. You know when to trust them and
  when to check the output.
  
  
  
  You might have a background in performance marketing,
  growth, or adtech — or you might not, but you're genuinely
  curious about it.
  
  
  
  If something breaks at 2am and it's your product, you feel
  it. That's the kind of ownership we're looking for.
  
  
  
  How we work
  
  
  
  Aperture is remote-first and impact-first.
  
  
  
  You can work from wherever you are most productive. We care
  about the output, not the hours. We do occasional team
  meetups and we'll bring you in when it makes sense.
  
  
  
  You'll have direct access to the founder and the team. No
  layers, no slow approvals, no bureaucracy.
  
  Requirements
  
  - Proven track record shipping with AI-first development
    tools: Lovable, Cursor, or similar.
  - Experience owning a full codebase, not just contributing to
    one.
  - Strong command of TypeScript and React on the frontend; and
    serverless/edge functions for backend logic.
  - Good working knowledge of Supabase for authentication and
    database (Postgres).
  - Experience integrating third-party APIs, especially AI and
    LLM APIs.
  - Solid working knowledge of DNS, domain management, SSL/TLS,
    and hosting configuration.
  - Experience scaling systems in a multi-tenant SaaS
    environment, with asynchronous processing such as worker
    fleets, pub/sub, queues and streams.
  - A sensible approach to testing: you know what needs a test
    and what doesn't.
  - You think about security and data compliance as you build,
    not as an afterthought.
  - Strong product instincts: you know the difference between
    something that works and something that is right.
  - Ability to set priorities and make tradeoffs without
    constant direction.
  - Familiarity with performance marketing, ad creative testing,
    or growth tooling.
  
  Benefits
  
  - Work from anywhere, with flexibility around how you
    structure your day.
  - Regular team meetups and events.
  - Travel to team meetups covered.
  - Direct exposure to a fast-growing business and its founder.
  - Real ownership of a product people use every day.
  - A high-trust role with responsibility from day one.
