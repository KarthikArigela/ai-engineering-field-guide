description: |
  Senior Solution Engineer – AI Test Automation
  
  
  
  This role has been designed as ‘’Onsite’ with an expectation
  that you will primarily work from an HPE office.
  
  Who We Are:
  
  Hewlett Packard Enterprise is the global edge-to-cloud
  company advancing the way people live and work. We help
  companies connect, protect, analyze, and act on their data
  and applications wherever they live, from edge to cloud, so
  they can turn insights into outcomes at the speed required
  to thrive in today’s complex world. Our culture thrives on
  finding new and better ways to accelerate what’s next. We
  know varied backgrounds are valued and succeed here. We have
  the flexibility to manage our work and personal needs. We
  make bold moves, together, and are a force for good. If you
  are looking to stretch and grow your career our culture will
  embrace you. Open up opportunities with HPE.
  
  Job Description:
  
  
  
  Responsibilities
  
  - Lead the design, development, and delivery of complex
    software modules across networking, security, and system-
    level components.
  - Drive architectural decisions and provide technical
    direction for features spanning operating systems,
    networking stacks, security functions, utilities, and data
    path modules.
  - Own end-to-end feature delivery, including design reviews,
    coding standards, unit testing, integration testing, and
    performance validation.
  - Mentor and guide engineers through code reviews, design
    discussions, and best practices to ensure high-quality
    deliverables.
  - Collaborate closely with cross-functional teams including
    program managers, architects, hardware engineers, and QA
    teams to align on requirements, timelines, and issue
    resolution.
  - Lead performance engineering initiatives such as
    benchmarking, profiling, load testing, and optimization in
    distributed systems.
  - Identify system-wide performance bottlenecks and drive
    corrective actions across networking, security, and data
    path layers.
  - Establish and oversee continuous performance monitoring,
    regression analysis, and release performance stability.
  - Drive the development of automation frameworks, tools, and
    scripts (primarily using Python) to improve efficiency and
    scalability of testing and validation.
  - Champion process improvements, engineering excellence, and
    innovation to enhance productivity and software quality.
  - Act as a technical point of contact for internal and
    external stakeholders, ensuring clarity in integration
    requirements and feature expectations.
  
  Education & Experience
  
  - Bachelor’s degree in Computer Science, Electronics,
    Communication, or related field (or equivalent practical
    experience).
  - Master’s degree is a plus.
  - 10-15 years of relevant experience in software development,
    networking, or security domains.
  - Proven experience in software development within networking,
    security, or distributed systems domains.
  
  Knowledge & Skills
  
  - Working knowledge of AI/ML and LLM technologies, with the
    ability to identify use cases, integrate intelligent
    automation, and drive adoption in networking, security,
    and system performance domains.
  - Deep expertise in networking and security technologies such
    as Web Filtering, IDS/IDP, IPS, SSL Inspection, VPN,
    Proxy, DNS Security, DLP, Application Control, and Threat
    Prevention.
  - Strong hands-on experience with enterprise network security
    solutions and next-generation firewalls.
  - Experience with Juniper SRX/MX platforms is a plus.
  - Strong understanding of real-world deployment scenarios in
    networking and security environments.
  - Advanced programming and automation skills (Python
    preferred).
  - Strong foundation in scalable architectures, high
    availability systems, and distributed system design.
  - Expertise in performance tuning, bottleneck analysis, and
    optimization across CPU, memory, and data path layers.
  - Familiarity with performance KPIs, SLOs, benchmarking
    methodologies, and performance testing tools.
  - Excellent problem-solving, analytical, and debugging skills.
  - Strong leadership, mentoring, and communication skills with
    the ability to influence cross-functional teams.
  
  Additional Skills:
  
  Cloud Architectures, Cross Domain Knowledge, Design
  Thinking, Development Fundamentals, DevOps, Distributed
  Computing, Microservices Fluency, Full Stack Development,
  Security-First Mindset, Solutions Design, Testing &
  Automation, User Experience (UX)
  
