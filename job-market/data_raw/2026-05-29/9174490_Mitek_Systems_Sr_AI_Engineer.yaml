description: |
  Mitek (NASDAQ: MITK) is a global leader in digital &
  biometric identity authentication, fraud prevention, and
  mobile deposit solutions. Our verified identity platform and
  advanced image capture solutions are built on the latest
  advancements in biometric recognition, artificial
  intelligence, computer vision and machine learning, and
  trusted by over 7,500 organizations worldwide. We are
  headquartered in San Diego, California, with operations in
  the United Kingdom, Spain, France, Mexico, and the
  Netherlands. Visit us at www.miteksystems.com.
  
  We are Virtual 1st! Whether you choose to work remotely from
  your home office or in-person from one of Mitek’s offices,
  our practices, processes and tools are designed to enable
  your success. At Mitek, the Future of Work is about
  flexibility and preference wherever and whenever we are
  working. Because we care about our candidates, employees and
  customers, we include an in-person meeting as part of our
  hiring process. It’s one of the ways we live our mission to
  “Protect What’s Real.”
  
  At Mitek, we believe that teams are more resilient,
  effective, and innovative when they benefit from a wide
  range of ideas, lived experiences, and perspectives. The
  strength of our organization is deeply rooted in the people
  who power it. We know that a workforce reflecting the
  richness of our communities and customers helps us better
  serve their needs.
  
  Summary
  
  We are looking for an AI Engineer with a strong machine
  learning (ML) background and hands-on experience building
  modern AI systems. This role is best suited for someone who
  started in ML, applied modeling, or NLP, and later expanded
  into large language models (LLMs) and agentic AI systems. We
  are looking for someone with an evaluation-first mindset who
  believes AI systems should be designed with clear success
  criteria, testing methods, and monitoring plans from the
  start.
  
   The ideal candidate brings solid ML foundations, experience
  working with third-party and open-source LLMs, and practical
  experience building multi-step AI workflows for real
  business problems. This background helps ensure these
  solutions are accurate, reliable, scalable, and grounded in
  sound evaluation practices.  Humility, accountability, and a
  growth mindset are must-haves for this role. The right
  candidate is comfortable admitting mistakes, learning from
  feedback, and adjusting quickly when evidence shows a better
  path.
  
   Why This Role Matters
  
  This role matters because we need more than someone who can
  build AI features. We need someone who can build AI systems
  in a thoughtful and reliable way. That means starting with a
  clear plan for how quality, risk, and business impact will
  be measured, and carrying that through design, launch, and
  ongoing improvement. This role will also help strengthen how
  we run AI in practice, with solid MLOps and LLMOps across
  ML, LLM, and agentic AI systems.
  
