description: |
  About Atomic Vest
  
  We are a fast-growing, mission-driven company powering the
  expansion of financial services and wealth creation
  globally. We build critical financial infrastructure that
  allows consumer-facing companies to offer engaging investing
  experiences to their customers in a frictionless way. We
  host advanced investing capabilities ranging from ESG
  investing to multi-currency trading across 60 global
  markets. We are a team of financial empowerment enthusiasts
  that have come together from various industries including
  tech, banking, finance, and law.
  
  The company closed its Series B and we are positioned to
  rapidly scale. Come join an exciting opportunity to make a
  lasting impact!
  
  About the role
  
  We’re looking for an entry-level AI & Automation Engineer
  who’s excited to leverage AI tools and automation to enhance
  team efficiency, streamline operations, and drive
  innovation. You’ll work across engineering and business
  functions to prototype, implement, and maintain smart
  internal tools and workflows.
  
  This role is ideal for a recent graduate passionate about
  AI, automation, and the fintech space. You’ll have the
  opportunity to work with leading-edge technologies and see
  your work have a real impact on the company.
  
  You’ll get hands-on experience with cutting-edge
  technologies and work directly with engineers, product
  managers, and operations teams to identify real-world
  problems and build solutions that scale.
  
  Once here, you will:
  
  - Research, prototype, and implement automations using AI
    tools and APIs (e.g., OpenAI, Zapier, Python scripts,
    Slackbots, etc.).
  - Assist in developing internal tools that reduce manual work
    across departments.Evaluate and document AI tools to help
    teams adopt the most effective solutions.
  - Collaborate with engineering and Operations teams to
    optimize internal systems and contribute to code quality
    through documentation and simple scripts.
  - Explore opportunities for integrating AI into customer-
    facing products in a compliant and secure way.
  
  What we are looking for
  
  - A recent graduate or early-career professional in Computer
    Science, Engineering, Data Science, or a related technical
    field.
  - Eager to apply your skills in a fast-paced, collaborative,
    and mission-driven environment.
  - Proficient in Python or JavaScript/TypeScript (for scripting
    or tooling).
  - Comfortable picking up new tools and frameworks quickly.
  - Familiarity with APIs and SaaS automation tools (e.g.,
    Zapier, Make, Retool, LangChain)
  - Experience working on side projects or coursework involving
    AI, automation, or fintech.
  
  Our Tech Stack
  
  - Languages: Go, TypeScript, Python
  - Infrastructure: PostgreSQL, AWS, Kubernetes (EKS), Istio
  - Tools: Temporal, GRPC, Jaeger, OpenAI APIs, GitHub Copilot
  
