description: |
  Full-Stack Builder • Product-Minded Engineer • Customer-
  Obsessed Problem Solver
  
  Overview:
  
  We’re looking for an AI Product Engineer who blends the
  instincts of a product thinker with the execution chops of a
  strong engineer. This role is perfect for builders who
  thrive at the intersection of discovery, design, rapid
  prototyping, and shipping real customer-facing features.
  
  You’ll own problems end-to-end — from understanding the
  customer need to designing an elegant solution to shipping
  polished, reliable, AI-powered experiences. You won’t be
  confined to “product” or “engineering” boxes. You’ll do
  both. And you'll move fast.
  
  About Nerdy:
  
  At Nerdy (NYSE: NRDY) -  the company behind Varsity Tutors -
  we’re redrawing the blueprint of learning. Our Live + AI™
  platform fuses real-time human expertise with proprietary
  generative-AI systems, setting a new bar for measurable
  academic impact at global scale.
  
  We recruit the kind of technologists and operators you’d bet
  on as solo founders - people who turn ambiguous problems
  into shipping code, iterate faster than markets move, and
  compound their advantage with every data point. In an era
  where great employees can deliver 10-times the leverage of
  the merely good, we back those who play to win.
  
  Fortune favors the bold. Join us.
  
  How we compete:
  
  - AI-Native at every levelFrom the CEO to day-one hires,
    everyone builds and ships with generative AI. If you’re
    not wielding AI, you’re not done.
  - Entrepreneurial velocityMove at founder speed, prototype in
    hours, and measure in real user outcomes. Slow teams die.
  - Free-market rigor Ideas rise or fall on merit and results -
    no committees, no politics, no cap on upside.
  - Full-stack ownership You design, build, and run what you
    ship; accountability is a feature, not a bug.
  - Reward for contributionPay rises with impact, not years.
    Outstanding results earn outsized rewards. We evaluate
    both what you achieve and how you achieve it: living our
    leadership principles and using AI effectively are
    formally measured and rewarded.
  - Relentless explorationPush the frontier of generative AI in
    live learning and - because only the paranoid survive -
    questioning every legacy assumption along the way.
  - Is ApoliticalYou stay focused on mission-aligned outcomes,
    not distractions or unrelated causes.
  
  If you’re a technically minded builder who thrives on open
  competition, personal responsibility, and the chance to
  redefine how the world learns - while continually stretching
  the limits of what generative AI can do - come do the most
  ambitious and rewarding work of your career here. Learn more
  at nerdy.com.
  
  Nerdy’s shareholder letters below explain our latest
  products and strategy:
  
  - Q1-2026 Shareholder Letter
  - Q4-2025 Shareholder Letter
  - Q3-2025 Shareholder Letter
  
  Qualifications:
  
  - Strong engineering skills in one or more areas: front-end,
    back-end, full-stack, systems, or similar.
  - Demonstrated ability to own a problem from concept through
    shipped solution.
  - Experience building software products, internal tools,
    prototypes, or applications.
  - Comfort working across product and engineering boundaries —
    writing specs, designing workflows, and building the
    solution.
  - Experience using AI tools to accelerate development (e.g.,
    chat-based coding assistants, automation tools, rapid
    prototyping tools).
  - Excellent communication skills across cross-functional
    teams.
  - A customer-obsessed mindset — grounding decisions in user
    needs, outcomes, and real behavior.
  - Ability to move quickly, make sound tradeoffs, and iterate
    based on evidence.
  - Familiarity with cloud environments (any major provider).
  - Comfort analyzing data, defining success metrics, and
    interpreting signals to guide product improvements.
  - Experience working in fast-paced, highly iterative
    environments.
  
  Responsibilities:
  
  - Identify and deeply understand customer problems through
    data, feedback, and direct observation.
  - Define AI-powered features or improvements, including
    writing crisp problem statements, user flows, and success
    criteria.
  - Prototype and build end-to-end solutions, spanning front-
    end, back-end, and AI-powered logic.
  - Integrate AI into products thoughtfully, prioritizing user
    value and reliable outcomes over novelty.
  - Collaborate closely with product, design, and engineering to
    deliver high-quality features quickly.
  - Own quality and performance, ensuring what you ship is fast,
    reliable, and delightful.
  - Set up measurement and feedback loops to continuously
    improve features.
  - Operate like an owner, accountable for the impact of what
    you build.
  
  Unleash Your Potential at Nerdy:
  
  At Nerdy, you'll earn your success through meritocracy and
  exceptional outcomes. Our benefits reward performance and
  initiative:
  
  - Competitive Compensation & Advancement: Market-leading
    salary paired with clear promotion pathways and equity
    (RSUs) - become an owner in our success.
  - Retirement Made Simple: 401(k) plan with company match and
    immediate vesting.
  - A Remote-First Culture: We embrace flexibility across time
    zones and working styles to attract top talent and meet
    learners where they are.
  - Flexible Time Off: Recharge on your terms, ensuring maximum
    productivity.
  - Continuous Learning: Access an all-inclusive learning
    membership for you and your household, including 1:1
    tutoring hours, unlimited on-demand classes, and our full
    suite of learning products and services.
  - Supercharge with AI: Leverage cutting-edge AI tools to
    accelerate your workflow.
  - You’re Covered: Medical, dental, vision, life, STD & LTD
    plans plus strong maternity, paternity, and adoption
    leaves - numerous options for you and your family.
  
  The Bottom Line:
  
  If you're driven by impact, energized by ownership, and
  excited to help shape what’s next, you’ll thrive here. We
  move fast, think big, and reward those who deliver. This
  isn’t a traditional corporate environment - it’s a place to
  do the most meaningful work of your career.
