title: Staff Android Engineer, AI Native (Experiences)
company: Life360
location: USA
remote: true
work_type: FULL_TIME
description: |
  About Life360
  
  Life360’s mission is to keep people close to the ones they
  love. Our category-leading mobile app,Tile tracking devices,
  and Pet GPS tracker empower members to protect the people,
  pets, and things they care about most with a range of
  services, including location sharing, safe driver reports,
  and crash detection with emergency dispatch. Life360 serves
  approximately 97.8 million monthly active users (MAU), as of
  March 31, 2026, across more than 180 countries.
  
  Life360 delivers peace of mind and enhances everyday family
  life with seamless coordination for all the moments that
  matter, big and small. By continuing to innovate and deliver
  for our customers, we have become a household name and the
  must-have mobile-based membership for families (and those
  friends who are basically family).
  
  Life360 has more than 500 (and growing!) remote-first
  employees. For more information, please visit life360.com.
  
  Life360 is a Remote-First company, which means a remote work
  environment will be the primary experience for all
  employees. All positions, unless otherwise specified, can be
  performed remotely (within the US) regardless of any
  specified location above.
  
  We are AI Native
  
  We are building an AI native company where AI is an integral
  part of how we build and operate. AI tool usage during
  interviews varies by role. You may be asked to demonstrate
  proficiency with AI tools, discuss how you leverage AI, or
  complete interview exercises without AI assistance. Your
  Recruiter will provide clear guidance as you move through
  the interview process.
  
  Undisclosed use of AI not previously discussed with or
  approved by your Recruiter may impact your candidacy.
  
  About The Team
  
  The Experiences Department is responsible for the core
  member experience that defines how families use Life360
  every day. Our teams build the surfaces and systems that
  answer essential questions like: How is my family right now?
  How do we stay coordinated and connected? Where has my
  family been? We create the foundations and interactions that
  support real-time awareness, history, communication,
  insights, and everyday family coordination.
  
  Our 2026 focus is to deliver a fast, cohesive, and
  emotionally resonant free user experience that reflects the
  company’s long-term Magic of Location vision. We partner
  closely with Design, Product, and engineering teams across
  Location Platform, Intelligence, and Cloud to bring this
  vision to life at scale.
  
  This role reports directly to the Senior Director of
  Engineering for Experiences and operates horizontally across
  all teams within Experiences. You will help unify across the
  department and ensure we build toward a consistent, high-
  quality vision.
  
  About the Job
  
  This role sits horizontally across Experiences, not inside
  one team. The job is making sure what we build across Maps,
  Realtime, Feed, Notifications, and History actually fits
  together into something coherent. Right now that's not
  always the case and it's costing us.
  
  The core product journeys are the focus: where is my family,
  how do we stay connected, where have we been. These are what
  91M monthly users interact with every time they open the
  app. The technical and experiential decisions made here have
  real reach.
  
  We need someone who operates as an owner. That means shaping
  what gets built, not waiting for a spec. Influencing product
  and design direction, writing the technical framing for how
  we sequence work, seeing how the pieces add up (or don't).
  There's a real gap today between individual features
  shipping and a coherent experience coming out the other
  side. Closing that is a big part of this job.
  
  Working in an AI-native way is a real expectation here, not
  a nice-to-have. We're building toward a model where AI owns
  the development loop and engineers direct and are
  accountable for what ships. We expect this person to already
  work that way — directing agents through the full
  development cycle, writing clear problem statements AI can
  run against, holding the quality bar on output. If you're
  using AI to go faster at the same tasks you'd do anyway,
  that's not the shift we're making.
  
  The role is hands-on. Deep reviews, prototyping, unblocking
  things stuck in the middle. The leverage isn't in your
  direct output though — it's in how much the teams around you
  move because you're involved.
  
  For candidates based in the US, the salary range for this
  position is $167,000 to $280,500 USD. For candidates based
  out of Canada, the salary range for this position is
  $194,000 to $260,000 CAD. Note: Please be aware that the job
  title for positions in Canada will be "Developer" in lieu of
  "Engineer." We take into consideration an individual's
  background and experience in determining final salary -
  therefore, base pay offered may vary considerably depending
  on geographic location, job-related knowledge, skills, and
  experience. The compensation package includes a wide range
  of medical, dental, vision, financial, and other benefits,
  as well as equity.
  
  What You’ll Do
  
  - Help drive and define Android experiences across Maps,
    Realtime, Feed, Notifications, History, and coordination
    features.
  - Work closely with technical leads across individual teams to
    align on patterns, architectural guardrails, and execution
    plans.
  - Provide direction that helps teams sequence work effectively
    and build toward a cohesive, long-term experience.
  - Unblock complex technical challenges, deliver prototypes,
    perform deep reviews, and raise the bar for engineering
    quality across the department.
  - Write production code while focusing on high-leverage
    activities that accelerate teams and improve architectural
    consistency.
  - Direct AI agents through the development loop, from problem
    framing through code, review, and ship. Own what comes
    out.
  - Build with instrumentation and quality gates from the start,
    not after. Every feature needs a signal on whether it's
    actually working.
  - Push AI-native practices across the Experiences team
    (agentic workflows, automated tracking, LLM-assisted
    validation). This is part of what a Staff engineer does
    here now.
  - Collaborate closely with Design to deliver polished,
    intuitive, and emotionally expressive interactions.
  
  What We’re Looking For
  
  - 8+ years of experience building consumer-facing Android
    applications at scale, ideally in high-engagement, high-
    MAU products.
  - Deep expertise in Kotlin and modern Android development
    practices such as Jetpack Compose, Coroutines, and
    Architecture Components.
  - Strong architectural skills and the ability to define
    patterns and guide technical direction across multiple
    teams.
  - Experience leading complex, multi-team initiatives and
    delivering cohesive end-to-end user experiences.
  - Ability to influence product direction through technical
    insight, clear framing, and thoughtful evaluation of
    tradeoffs.
  - Demonstrated strength as a hands-on technical multiplier
    through mentorship, deep reviews, prototyping, and
    unblocker-level problem solving.
  - Active use and development of AI coding agents in your day-
    to-day work, with real examples of AI-directed output you
    owned and shipped.You think in problems, not tasks. There
    should be examples where you shaped what got built, not
    just how.
  - Bachelor's degree in Computer Science, Software Engineering,
    Computer Engineering, Mathematics, or a related technical
    field
  
  Our Benefits
  
  - Competitive pay and benefits.
  - Medical, dental, vision, life and disability insurance plans
    (100% paid for US employees). We offer supplemental plans
    for medical and dental for Canadian employees.
  - 401(k) plan with company matching program in the US and RRSP
    with DPSP plan for Canadian employees.
  - Employee Assistance Program (EAP) for mental wellness.
  - Flexible PTO and 12 company wide days off throughout the
    year.
  - Learning & Development programs.
  - Equipment, tools, and reimbursement support for a productive
    remote environment.
  - Free Life360 Platinum Membership for your preferred circle.
  
  Life360 Values
  
  Our company’s mission-driven culture is guided by our shared
  values to create a trusted work environment where you can
  bring your authentic self to work and make a positive
  difference
  
  - Be a Good Person - We have a team of high integrity people
    you can trust.
  - Be Direct With Respect - We communicate directly, even when
    it’s hard.
  - Members Before Metrics - We focus on building an exceptional
    experience for families.
  - High Intensity, High Impact - We do whatever it takes to get
    the job done.
  
  Our Commitment to Diversity
  
  We believe that different ideas, perspectives and
  backgrounds create a stronger and more creative work
  environment that delivers better results. Together, we
  continue to build an inclusive culture that encourages,
  supports, and celebrates the diverse voices of our
  employees. It fuels our innovation and connects us closer to
  our customers and the communities we serve. We strive to
  create a workplace that reflects the communities we serve
  and where everyone feels empowered to bring their authentic
  best selves to work.
  
  We are an equal opportunity employer and value diversity at
  Life360. We do not discriminate on the basis of race,
  religion, color, national origin, gender, sexual
  orientation, age, marital status, veteran status, disability
  status or any legally protected status.
  
  We encourage people of all backgrounds to apply. We believe
  that a diversity of perspectives and experiences create a
  foundation for the best ideas. Come join us in building
  something meaningful. Even if you don’t meet 100% of the
  below qualifications, you should still seriously consider
  applying!
  
