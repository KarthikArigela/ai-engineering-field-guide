description: |
  About DoubleVerify:
  
  DoubleVerify is a leading software platform for digital
  media measurement, data and analytics. DV’s mission is to be
  the definitive source of transparency and data-driven
  insights into the quality and effectiveness of digital
  advertising for the world’s largest brands, publishers and
  digital ad platforms. DV’s technology platform provides
  advertisers with consistent and unbiased data and analytics
  that can be used to optimize the quality and return on their
  digital ad investments. Since 2008, DV has helped hundreds
  of Fortune 500 companies gain the most from their media
  spend by delivering best in class solutions across the
  digital advertising ecosystem, helping to build a better
  industry. Learn more at www.doubleverify.com.
  
  About the role:
  
  DoubleVerify is seeking an AI Prompt Developer with strong
  language skills, exceptional attention to detail, and a
  passion for data-driven decisions. In this role, you will
  convert complex content policies into concise prompts that
  LLMs can easily interpret, ensuring alignment with evolving
  business needs.
  
  You will also:
  
  - Test, refine, and document changes based on performance
    metrics and stakeholder feedback.
  - Contribute to prompt development methodologies and
    evaluation frameworks.
  - Collect qualitative and quantitative data, performing root-
    cause analyses on misclassifications.
  - Report findings through clear, structured communication
    (charts, written reports, demos).
  - Partner with Policy, Legal, and Data Science teams to ensure
    prompt accuracy and alignment.
  - Identify gaps in policies and offer data-driven
    recommendations.
  - Document best practices and contribute to a centralized
    knowledge base.
  
  Minimum Qualifications:
  
  - Bachelor’s degree or equivalent experience in fields such as
    Policy, Linguistics, Communications, Social Sciences,
    Business, or STEM.
  - Excellent written and communication skills, with the ability
    to simplify the complex for diverse audiences.
  - Highly analytical with an understanding of established
    research methodologies
  - Ability to interpret large data sets, identify trends or
    errors, and propose solutions.
  - Comfortable using spreadsheets, BI tools, or basic scripting
    to conduct data analyses.
  - Comfortable working closely with global teams across
    timezones
  - Able to adjust to shifting priorities, and propose
    actionable solutions in ambiguous scenarios.
  
  Preferred (But Not Required)
  
  - 1-2 years experience in roles dealing with technical
    writing, content moderation, policy analysis, data
    analytics, or research assistance.
  - You have a foundational grasp of AI/ML concepts (especially
    LLMs) and are open to learning new tools.
  - Knowledge of software for data visualization (Tableau,
    Looker, Power BI).
  - Experience with academic or industry publications or
    collaborative research projects.
  
  ---- #Hybrid
  ----- The successful candidate’s starting salary will be
  determined based on a number of non-discriminating factors,
  including qualifications for the role, level, skills,
  experience, location, and balancing internal equity relative
  to peers at DV. The estimated salary range for this role
  based on the qualifications set forth in the job description
  is between [$92,000 - $132,000]. This role will also be
  eligible for bonus/commission (as applicable), equity, and
  benefits. The range above is for the expectations as laid
  out in the job description; however, we are often open to a
  wide variety of profiles, and recognize that the person we
  hire may be more or less experienced than this job
  description as posted.
  
  Not-so-fun fact: Research shows that while men apply to jobs
  when they meet an average of 60% of job criteria, women and
  other marginalized groups tend to only apply when they check
  every box. So if you think you have what it takes but you’re
  not sure that you check every box, apply anyway!
