description: |
  Company Description
  
  As the world’s pioneering local delivery platform, our
  mission is to deliver an amazing experience, fast, easy, and
  to your door. We operate in around 65 countries worldwide
  powered by tech, designed by people. As one of Europe’s
  largest tech platforms, headquartered in Berlin, Germany.
  Delivery Hero has been listed on the Frankfurt Stock
  Exchange since 2017 and is part of the MDAX stock market
  index. We enable creative minds to deliver solutions that
  create impact within our ecosystem. We move fast, take
  action and adapt. No matter where you're from or what you
  believe in, we build, we deliver, we lead. We are Delivery
  Hero.
  
  Job Description
  
  We are on the lookout for a Senior/Product Manager, to join
  the Agentic AI Developer Tools team within Tech foundations
  on our journey to always deliver amazing experiences.
  
  As a member of this team, you’ll support Delivery Hero’s
  rapid innovation and growth. You’ll work on foundational
  systems that enable faster feature development, security,
  and reliability across our global engineering community.
  Every enhancement you make will contribute to our teams'
  ability to build, scale, and deliver quality
  features—ultimately impacting millions of users worldwide.
  
  As a PM in the Tech Foundation Team, you will be the bridge
  between cutting-edge AI capabilities and the daily workflows
  of Delivery Hero’s global engineering community. You won’t
  just be rolling out tools; you will be defining the future
  of how software is built at scale. Your mission is to
  transform the "Agentic IDE" from a technical concept into a
  high-adoption product that fundamentally changes our
  engineering velocity.
  
  The Agentic IDEs team is central to the Agentic Engineering
  focus area, which has the bold Northstar of achieving 100%
  daily AI-usage of engineers in 2026.
  
  
  
  What you will do
  
  - Product Strategy & Roadmap: Own the product vision for
    Agentic IDEs and CLIs. You will define the roadmap that
    transitions our global engineering force from "AI-assisted
    coding" to "AI-guided feature generation."
  - User Research & Empathy: Deep-dive into the developer
    experience (DevEx). Conduct interviews and surveys across
    our global entities (eFood, Glovo, Talabat) to understand
    friction points and identify opportunities for agentic
    automation.
  - Measurement & ROI: Define and track the success metrics for
    AI adoption. You will move beyond "vanity metrics" to
    measure true impact on PR velocity, Time-to-Market, and
    the Human-to-AI code ratio.
  - Contextual Integration Strategy: Partner with engineering to
    prioritize which internal data sources (APIs, Engineering
    Manifesto, Slack, GDrive) provide the highest leverage
    when integrated into the agentic ecosystem.
  - Go-to-Market (GTM) & Internal Adoption: Treat the IDE
    rollout like a product launch. Develop upskilling
    programs, documentation, and feedback loops to ensure the
    tool isn't just "available," but "essential" to every
    engineer’s workflow.
  - Stakeholder Management: Align with tech leadership across
    the group to ensure the agentic stack meets the security,
    reliability, and scalability standards of a distributed
    global ecosystem.
  
  Qualifications
  
  What you need to be successful
  
  To be successful in this role, you should bring a blend of
  product discovery frameworks, a technical mindset, and the
  influence required to drive behavioral change across a
  massive organization.
  
  - Developer-as-a-Customer: Experience in Product Management,
    ideally within Developer Tools, Internal Platforms, or B2B
    SaaS.
  - Data-Informed Decision Making: Ability to use Northstar
    metrics to prioritize a backlog and say "no" to features
    that don't drive core adoption goals.
  - Modern Dev Workflows: A strong conceptual understanding of
    how engineers work (Git, CI/CD pipelines, IDE
    environments). You don't need to write the code, but you
    must speak the language.
  - AI & LLM Curiosity: A foundational understanding of Large
    Language Models and agentic workflows. You should
    understand the "art of the possible" regarding what AI can
    do for code generation and debugging.
  - Evangelism: You are a natural storyteller who can articulate
    the "Why" behind Agentic Engineering to both junior
    developers and C-suite stakeholders.
  - Collaborative Problem Solving: Ability to navigate the
    diverse needs of different regional brands to create a
    unified yet flexible developer toolset.
  
  Additional Information
  
  What’s in it for you
  
  Ensuring you and all our Heroes are looked after, happy, and
  healthy is always on the menu. Because if you’re in good
  shape, then we’re in good shape.
  
  - Make the most of our hybrid working model and join the team
    for face-to-face connection and collaboration in our
    beautiful Berlin campus 2 days a week
  - We offer 27 days holiday with an extra day on 2nd and 3rd
    year of service
  - We will support you in developing yourself and your career
    growth opportunities: 1.000 € Educational Budget, Language
    Courses, Parental Support and access to the Udemy Business
    platform to explore a variety of online courses.
  - Get moving and release those wonderful, mind-boosting
    endorphins: Health Checkups, Meditation, Gym & Bicycle
    Subsidy
  - Cash. Dough. Cheddar. Whatever you call it, we’ll help you
    with it: Employee Share Purchase Plan, Sabbatical Bank,
    Public Transportation Ticket Discount, Life & Accident
    Insurance, Corporate Pension Plan
  - The power of getting together over some food is unrivaled.
    Here are a few ways to help you do that. All the yum:
    Digital Meal Vouchers, Food Vouchers, Corporate Discounts.
    Courses.
  - Wondering what relocating to Berlin is like? In this
    article, we’ve put together 10 things you should know
    about moving to Berlin  and how Delivery Hero can support
    you. You can also visit our relocation hub and check out
    more information about moving to Berlin.
  - Ready to prepare for your interview? Check out the list of
    the 5 most common interview questions and answers created
    in collaboration with our recruiters.
  
  Ready to join our team? If you’re excited to grow,
  collaborate and be part of the world’s leading delivery
  platform, we’d love to hear from you. Apply today!
  
