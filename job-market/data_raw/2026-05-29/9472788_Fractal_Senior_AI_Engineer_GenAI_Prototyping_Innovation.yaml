description: |
  It's fun to work in a company where people truly BELIEVE in
  what they are doing!
  
  We're committed to bringing passion and customer focus to
  the business.
  
  GenAI Prototyping Specialist
  
  Location Central London (Hybrid Onsite - Tues / Wed / Thurs)
  
  
  
  ABOUT FRACTAL
  
  Fractal Analytics is a strategic AI partner to Fortune 500
  companies with a vision to power every human decision in the
  enterprise. Fractal is building a world where individual
  choices, freedom, and diversity are the greatest assets. An
  ecosystem where human imagination is at the heart of every
  decision. Where no possibility is written off, only
  challenged to get better. We believe that a true Fractalite
  is one who empowers imagination with intelligence.
  
  For more information, please visit fractal.ai
  
  ROLE SUMMARY
  
  We are looking for a GenAI Prototyping Specialist to be
  embedded within Fractal’s EMEIA team, focused 100% on new
  capability development. This is not a reporting or
  maintenance role - it is a fast-paced, innovation-first
  position where you will rapidly conceptualize, build, and
  iterate on proof-of-concept AI solutions using cutting-edge
  LLM tooling.
  
  You will work in close collaboration with the Fractal
  Engagement Manager and client stakeholders to identify high-
  value GenAI use cases aligned to client priorities, progress
  the strongest concepts from initial POC through to business-
  prototype stage suitable for senior stakeholder
  demonstration, and contribute to showcase deliverables
  targeting global leadership audiences.
  
  The work is adaptive in nature - there is no fixed project
  plan or pre-defined requirements document. Priorities are
  set collaboratively on a rolling basis in response to the
  client’s emerging needs, making this ideal for someone who
  thrives in ambiguity, moves fast, and gets energy from
  building things that didn’t exist yesterday.
  
  KEY RESPONSIBILITIES
  
  Rapid Prototyping & POC Development
  
  - Rapidly conceptualize, build, and iterate on proof-of-
    concept GenAI solutions using LLM tooling including Claude
    Code, and client-specific LLM platforms and tools.
  
  - Generate and evaluate new POC ideas on a rolling basis,
    aligned to client priorities identified in weekly sessions
    with the Fractal lead and client stakeholders.
  
  - Progress high-value POCs from initial concept through to
    business-prototype stage, suitable for demonstration to
    senior stakeholders including global leadership.
  
  - Apply strong product intuition to identify which concepts
    have the highest potential for business impact and
    scalability and focus effort accordingly.
  
  Collaboration & Stakeholder Engagement
  
  - Attend in-person working sessions at the client’s London
    office on Tuesdays, Wednesdays, and Thursdays each week.
  
  - Participate in brief daily or weekly sync sessions with the
    Fractal Engagement Manager to align on priorities, share
    progress, and incorporate feedback.
  
  - Present prototypes and technical approaches to client
    stakeholders, articulating both the business value and
    technical underpinnings of each solution.
  
  - Operate as a self-directed contributor within a small, high-
    trust team - comfortable navigating ambiguity and taking
    ownership without detailed specifications.
  
  Documentation & Handoff
  
  - Document prototypes, technical approaches, architectural
    decisions, and outcomes to a standard suitable for handoff
    into the client’s global product pipeline.
  
  - Contribute to a showcase deliverable targeting mid-June
    2026, presenting select POCs to client stakeholders
    including global leadership.
  
  - Create lightweight but clear technical documentation that
    enables other engineers to understand, extend, or
    productionize prototype solutions.
  
  REQUIRED QUALIFICATIONS
  
  - 5 + years of professional experience in software
    engineering, ML engineering, or applied AI development.
  
  - Strong proficiency in Python for rapid prototyping, data
    manipulation, API integration, and ML model
    experimentation.
  
  - Hands-on experience with GenAI/LLM application development -
    including prompt engineering, RAG architectures, tool use,
    and agentic workflows.
  
  - Demonstrated experience using AI-assisted coding tools
    (e.g., Claude Code, GitHub Copilot, Cursor) as a core part
    of the development workflow to accelerate prototyping
    velocity.
  
  - Working knowledge of ML fundamentals: classification,
    regression, clustering, NLP, embeddings, and model
    evaluation.
  
  - Ability to move from idea to working prototype extremely
    quickly - comfort with imperfect code, fast iteration, and
    progressive refinement over waterfall planning.
  
  - Strong communication skills - able to demo prototypes,
    explain technical concepts to non-technical stakeholders,
    and articulate the “so what” of each solution.
  
  - Self-directed and adaptable - comfortable working without
    detailed specifications in a fast-changing, priority-
    shifting environment.
  
  
  
  PREFERRED QUALIFICATIONS
  
  - Experience with multiple LLM providers and platforms
    (Anthropic Claude, OpenAI, open-source models via Hugging
    Face) and the ability to select the right model for the
    task.
  
  - Familiarity with front-end development (React, HTML/CSS,
    Streamlit, Gradio) for building interactive demo
    interfaces around AI prototypes.
  
  - Experience with cloud AI services (Azure OpenAI, AWS
    Bedrock, GCP Vertex AI) for model hosting and API
    integration.
  
  - Background in marketing technology, digital marketing, or
    consumer-facing product development.
  
  - Experience working in embedded consulting or contractor
    roles within large enterprise environments.
  
  - Familiarity with vector databases (Pinecone, ChromaDB,
    Weaviate) and semantic search architectures.
  
  - Prior experience building and presenting POCs or demo
    prototypes to senior/executive stakeholders.
  
  - Experience with multi-agent frameworks (LangGraph, AutoGen,
    CrewAI) or workflow orchestration tools.
  
  ENGAGEMENT MODEL & WORKING ARRANGEMENT
  
  - Engagement Type: Fractal FTE, embedded within Client’s EMEIA
    team at the client’s London office.
  
  - Primary Location: Client office, Central London
  
  - In-Person Days: Tuesday, Wednesday, Thursday each week.
  
  - Remote Days: Monday and Friday (flexible).
  
  EDUCATION
  
  Bachelor’s degree in computer science, Data Science, Machine
  Learning, Software Engineering, or a related technical
  field. Master’s degree is a plus but not required. Self-
  taught engineers with strong portfolios and demonstrated
  prototyping ability are welcome.
  
  If you like wild growth and working with happy, enthusiastic
  over-achievers, you'll enjoy your career with us!
  
