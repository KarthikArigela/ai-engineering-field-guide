description: |
  At LTV.ai, we're redefining email marketing for e-commerce
  brands by automating a lot of the day-to-day manual grunt
  work that goes into email marketing, from segmentation, to
  creating campaigns without designers, to personalization.
  
  While increasing LTV and driving measurable growth, we help
  brands stay focused on what matters most - the customer.
  
  Why join us?
  
  We're a fast-moving team building a high-growth company
  that's transforming the e-commerce industry.
  
  As an early engineering hire, you'll own meaningful surface
  area from day one — shipping AI features, shaping
  architecture, and building the data infrastructure that
  powers the platform.
  
  You'll have the autonomy to drive features end-to-end and
  the leverage of unlimited AI tokens to move at a pace most
  teams can't match.
  
  Recent wins
  
  - Went from 0 to $1M ARR in 6 months and just closed a growth
    round of funding
  - Built a segmentation engine that personalizes interactions
    across 70m+ consumers per month (growing 10% MoM) using
    e-commerce platform data, in a compliant manner, at scale
  - Stood up a data pipeline handling millions of events daily
  - Built an agentic tool-calling chat flow that automates email
    campaign production at scale
  - Built a chat-to-DB layer that proactively suggests customer
    lists to send to
  - Enabled multi-LLM routing for a single interaction,
    optimized for performance while reducing costs
  
  We'd like to work on
  
  - Deepening our AI infrastructure: customer-level memory,
    agentic workflows, smarter model routing, and self-
    optimizing conversation engines
  - Scaling our data pipelines to handle the next order of
    magnitude of events without compromising latency or cost
  - Expanding self-service so any e-commerce brand can onboard
    and get value from LTV.ai without white-glove handoff
  - Pushing our image and content generation capabilities so
    brands can ship a wider range of emails at lower cost
  - Driving proactivity across the platform — from recommending
    the right customer lists and campaigns to expanding beyond
    email into multi-channel
  
  Role Responsibilities
  
  - Own features end-to-end — from architecture and data
    modeling through implementation, rollout, and iteration in
    production
  - Work across the full backend surface: AI features, core
    platform architecture, and data pipelines that move
    millions of events daily
  - Use AI coding tools aggressively (unlimited tokens) to ship
    faster — while taking full responsibility for the quality,
    correctness, and maintainability of every line that lands
    in main
  - Design and build AI-native systems: multi-agent workflows,
    model routing, evals, and real-time feedback loops
  - Make architectural calls that hold up under growth — and
    revisit them when they don't
  - Pair closely with product, AI, and data on the highest-
    leverage work, not just the assigned tickets
  - Raise the engineering bar: code review, design review, and
    pushing back when something isn't ready for production
  
  What we're looking for (ideally)
  
  - 4+ years of backend engineering experience with a track
    record of owning systems end-to-end in production
  - Strong engineering taste — you know the difference between
    shipped code and AI-generated slop, and you ship the
    former. Lines of code are not a flex; durable, well-
    reasoned systems are.
  - AI-native mindset — you instinctively reach for AI tools to
    move faster, but you treat their output as a draft, not a
    deliverable. You can oversee AI-generated work and catch
    what it gets wrong.
  - Experience scaling production systems in fast-moving SaaS,
    messaging, or e-commerce environments
  - Comfortable with TypeScript (NestJS) and AWS-based
    infrastructure, or able to ramp quickly
  - Real interest in LLMOps, AI application infrastructure, and
    the tooling around evals, prompt management, and agentic
    systems
  - Pragmatic and adaptable — you can hold speed and quality at
    the same time and don't see them as a tradeoff
  - Founder mentality — you build systems, you don't wait to
    inherit them
  
  Our Stack
  
  - Frontend: React (TypeScript)
  - Backend: NestJS (TypeScript)
  - Infrastructure: AWS managed with Terraform
  - Databases: PostgreSQL & ClickHouse
  
  Compensation + Benefits
  
  - Competitive compensation, equity, and a commitment to your
    personal and professional growth.
  
  If this role sounds like it could be a fit, we'd love to
  hear from you! Feel free to reach out to our founder
  directly - asad@ltv.ai.
  
  Not looking but know someone who would make a great fit?
  Refer them! We pay up to $5000 per
