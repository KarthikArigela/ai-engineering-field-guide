description: |
  Join the team rewriting the rules in private markets.
  
  Moonfare delivers what few others can: the highly sought-
  after funds and hidden-gem investments that go beyond what
  most private banks offer. Every opportunity is subjected to
  a ruthless vetting process; the bar is unforgivingly high.
  The result? Institutional-quality portfolios for investors
  who demand more.
  
  Our team combines finance veterans with talent from tech,
  consulting, law and industries you’d never expect.
  Headquartered in Berlin, we operate from eight offices
  across Europe, the US and Asia.
  
  If you're ready to build what's next in private markets,
  let's talk.
  
  GTM AI Engineer (m/f/d)
  
  This newly created role will join Moonfare’s AI &
  Transformation team as part of the GTM Engineering function.
  You will be responsible for building and scaling Moonfare’s
  commercial systems and processes. The team sits at the
  intersection of Investor Relations (Sales), Account
  Management, Marketing, and Product, owning the
  infrastructure, data, and automation that power revenue
  generation. As we’re getting started, we will automate 1-2
  processes per quarter. This team is responsible for the CRM
  system, commercial processes, and performance monitoring.
  
  You will turn manual processes into automated and agentic
  workflows across lead generation, scoring, routing, and
  outreach, directly impacting revenue and efficiency. The
  challenge is making AI work in a complex regulated system
  with a long sales cycle and not just in theory. This is a
  high-impact role shaping how AI is applied in production
  across our commercial teams.
  
  Your Mission:
  
  - Build and maintain automation in HubSpot (workflows, lead
    routing, lifecycle management)
  - Define and own the architecture of Moonfare's AI-driven GTM
    engine, setting the standards for how automation and AI
    are built, evaluated, and scaled across commercial teams
  - Design and implement lead scoring models (rules-based + AI-
    assisted)
  - Manage HubSpot connectors to Claude and other tools
  - Improve data, lead generation, and enrichment processes
    (within compliant sources)
  - Turn manual GTM processes and turn them into scalable
    agentic processes
  - Continuously build and implement AI-driven automation use
    cases across GTM engineering and commercial teams, from
    idea to production
  
  The next Moonfarian:
  
  - You bring an extensive track record working with HubSpot
  - Strong understanding of CRM architecture and data models
  - Experience with complex workflows and automation
  - Hands-on use of LLMs (e.g. Claude) in production workflows
    via tools like n8n, APIs, or similar automation frameworks
  - Passion to coach others on AI and multiply the knowledge
  - Experience applying AI to lead scoring, prioritization,
    personalization, data classification, enrichment
  - Familiarity with APIs and integrations
  - Ability to integrate AI into systems
  
  If you feel you do not meet all of the requirements, we
  still encourage you to apply!
  
  Please Note: We can only accept applications from those
  eligible to live and work in Berlin. This is a hybrid role
  with office attendance required 4 days/week. We do not
  accept applications sent by email. You should submit your
  application directly through our careers website.
  
  Invest in yourself:
  
  - Ownership and Impact: You are empowered to bring ideas, make
    decisions, and see your work directly contribute to
    Moonfare's success.Transparent Environment: We believe in
    open communication. You will receive regular updates on
    company strategy, performance against our KPIs, and key
    business decisions.
  - Personal Growth: We support your development with an
    individual growth budget of €1,500 or 2% of your base
    salary (whichever is higher).
  - Invest in Your Future: We support your long-term financial
    goals with a company pension scheme, providing a 20%
    employer contribution.
  - Relax and Recharge: You start with 25 vacation days and
    you’ll receive one additional day for each year of tenure,
    up to a maximum of 30 days.
  - Daily Lunch: Enjoy a free lunch every day that you are in
    the Berlin office, with a weekly changing menu that
    includes salads, curries, pastas, and a variety of vegan
    and vegetarian options.
  - Subsidised Public Transport: We support your commute with a
    monthly subsidy for the Deutschland job ticket, making
    your travel easier and more affordable.
  - Fitness and Wellbeing: Stay active with a subsidised Urban
    Sports Club membership, giving you flexible access to a
    wide variety of sports and wellness activities across
    Germany.
  - A Culture of Excellence: Join a team of ambitious, smart,
    and committed professionals who are passionate about
    revolutionising private market investing.
  
  Our Values:
  
  - Client-Centric Focus: Our clients come first, Moonfare comes
    second, and we prioritise ourselves third. Putting clients
    first means creating value for them is essential. Placing
    Moonfare second signifies that our individual professional
    future at Moonfare depends on the company's commercial
    success. Prioritising ourselves third reflects our
    humility in putting clients and Moonfare before personal
    interests.
  - Commitment to Excellence: We pursue excellence and honor our
    promises. We hold ourselves to the highest standards,
    taking responsibility for our failures, and celebrating
    our successes. We commit to deadlines and stick to them
    and we learn from our mistakes.
  - Win together: We are here to win and to celebrate our
    collective achievements. We are mission-focused and think
    and act like owners. We exemplify the attitude we expect
    and each of us commits to do what it takes to succeed.
  - Growth and Merit: We foster personal growth but each of us
    earns our place as a Moonfarian through merit. We hire,
    retain, and develop exceptional people and invest in
    empowering them to excel. We must all earn our place at
    the table every day.
  
  We understand the important role that diversity plays in our
  success. Different backgrounds, experiences and ideas push
  us further and raise the bar. We’re committed to developing
  an inclusive and safe culture where everyone—regardless of
  colour, race, religion, sex, origin, sexuality, disability,
  marital status, citizenship or gender identity—knows that
  they are an integral part of the team and can bring their
  full potential to their work.
