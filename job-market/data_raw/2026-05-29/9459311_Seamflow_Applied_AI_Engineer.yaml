description: |
  ABOUT THE JOB
  
  We’re removing one of the last great barriers to progress in
  the physical world. While software moves fast, industries
  like aerospace, healthcare, and energy are still slowed by
  outdated, manual systems.
  
  We are rapidly growing with 7-figure revenue, backed by a
  14× oversubscribed $4.5m seed round from Tier-1 VCs such as
  Coinbase, Reddit, Klarna, and Spotify. Our world-class team
  includes former unicorn founding engineers and talent from
  X, Google, Amazon, and Yandex. We value people who want to
  win and thrive in high-ownership environments.
  
  We’re building the system that lets complex, real-world work
  move at software speed.
  
  WHO WE ARE LOOKING FOR
  
  We're looking for an Applied AI Engineer who thinks in user
  workflows and model behavior, not benchmarks or isolated
  prompts.  This is a role for someone who wants to decide
  what AI should do, build it end-to-end, and put it in users'
  hands. You will fit right in if you have experience with:
  
  - Applied AI — Design and build LLM-powered features that
    solve real workflows, from prompt to production
  - Model Behavior — Reason about why models fail, when to use
    which model, and how to make them reliable in production
  - Evals & Iteration — Build evals that actually catch
    regressions and drive improvements, not vanity metrics
  - Agents & Tooling — Design multi-step agents, tool use, and
    orchestration for complex domain workflows
  - Document Intelligence — Extract structured data from messy
    real-world documents (PDFs, scans, forms, tables)
  - Product Judgment — Be opinionated about what AI should do,
    what it shouldn't, and when "good enough" ships
  
  WHAT YOU WILL DO
  
  - Ship from Day 1 — Deploy AI features to production
    immediately and own a real user-facing surface area
  - Own it end-to-end — From problem definition to prompts,
    evals, monitoring, and iteration
  - Solve real problems — Sit in customer calls, look at real
    documents, debug bad outputs, and make the system better
  
  WHAT WE ARE LOOKING FOR TECHNICALLY
  
  - Strong experience with Python and modern LLM tooling
    (OpenAI/Anthropic/Azure OpenAI SDKs, structured outputs,
    function calling)
  - Experience building production AI systems beyond a wrapper
    around a chat API
  - Comfortable with evals, prompt engineering, and reasoning
    about model failure modes
  - Ability to work across the stack to integrate AI into real
    product workflows (TypeScript/React frontend, Python
    backend)
  - Ability to reason about complex domain workflows, not just
    prompt-response
  
  Strong plus if you have:
  
  - Founder or ex-founder experience
  - Early-stage or stealth startup background
  - Founder fellowships or similar environments (EF, YC, Antler,
    etc.)
  - Experience building AI-powered products in production
  - Experience working where requirements were unclear and
    evolving
  
  YOUR FIRST MONTH
  
  - Ship an AI feature to production from day one
  - Own problems end-to-end, from prompt to eval to deployment
  - Do what needs doing, including looking at hundreds of real
    outputs, debugging edge cases, and customer interaction
  
  WE OFFER
  
  - Pace and purpose — In-person in London (visa sponsorship
    available)
  - No friction — Relocation, visas, meals, and tools fully
    covered
  - A tight-knit team — High standards, high trust, no politics
