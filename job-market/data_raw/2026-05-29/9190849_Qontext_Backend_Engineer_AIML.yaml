title: Backend Engineer – AI/ML
company: Qontext
location: Berlin, DEU
work_type: FULL_TIME
company_size: 5 Employees
description: |
  We’re building the independent context layer for AI – a
  missing piece of infrastructure that allows every AI process
  in a company to act on relevant and up-to-date context.
  We’re a fast-moving, well-funded team based in Berlin,
  backed by HV Capital, Zero Prime and the founders of n8n,
  neo4j, Cognigy, make.com, Celonis and Nabla.
  
  The Opportunity
  
  In this role, you’ll design and scale the backend systems
  that power how a company’s “brain” functions – the logic
  that lets AI reason over live company knowledge instead of
  static data.
  
  You’ll own the architecture behind our ingestion and
  retrieval layers, transforming unstructured information into
  structured, queryable context. Your work will directly
  define how AI systems across our customers’ organizations
  access relevant, up-to-date context in real time.
  
  Qontext is already getting used by 10+ design partners and
  we are aiming to launch v1 of our platform in Q2 2026.
  
  If you enjoy deep technical challenges, working from first
  principles, and shipping products that define a new category
  – this role is for you.
  
  What You’ll Do
  
  - Design and implement the core backend logic of our AI
    context engine
  - Build and optimize our data ingestion pipeline –
    transforming raw tool data into structured knowledge
    graphs
  - Develop high-performance retrieval and ranking systems,
    combining vector search, rule-based logic, and entity
    recognition
  - Productize complex processes via APIs and modular components
    (MCP, SDK)
  - Create evaluation and experimentation frameworks to
    continuously improve performance and contextual accuracy
  
  You’ll Thrive Here If You…
  
  - Love building distributed systems and tackling high-
    complexity logic problems
  - Are fluent in TypeScript or Python and have an eye for
    clean, scalable architecture
  - Enjoy turning research and theory into production-grade
    products
  - Have a bias for ownership, and thrive in fast-paced, early-
    stage environments
  - Are endlessly curious, pragmatic, and care about how AI can
    be made truly useful
  
  Why Join Us
  
  - Challenge: Highly complex intellectual & logical challenge
  - Cutting Edge: Turning latest research into a product used by
    the masses
  - Mission: Build the foundational context infrastructure for
    AI processes
  - Impact: Shape the company and architecture from day one
  - Ownership: Competitive salary + meaningful early equity
  - Culture: Deep-tech mindset, transparency, radical candor and
    fast execution
  
  Process
  
  - Get to know each other – 30 min
  - Technical interview – 30 min
  - Technical take-home case – 3 h
  - Case discussion – 45 min
  - Offer
  
  Practical Info
  
  - Location: Berlin
  - Start date: ASAP
  - Type: Full-time
  - Compensation: €65k - €100k + equity package
