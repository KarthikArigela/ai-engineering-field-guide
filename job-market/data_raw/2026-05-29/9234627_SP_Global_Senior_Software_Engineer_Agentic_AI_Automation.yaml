description: |
  About the Role:
  
  Grade Level (for internal use):
  
  10
  
  The Team: Join the engine room of S&P Global’s AI
  transformation. Our team builds "Agentic
  Workflows"—intelligent systems that don't just follow
  instructions but reason through problems, plan multi-step
  solutions, and execute actions across a vast enterprise
  ecosystem. We operate in a multicloud environment, utilizing
  the best of GCP (Gemini), AWS (Bedrock), and Azure AI
  Foundry, integrated through the Moveworks action platform.
  
  The Impact: As a Senior Software Engineer, you are a key
  builder of our autonomous future. You will develop the
  "Agentic Loops" and technical integrations that allow our AI
  to solve complex business challenges. Your work moves the
  organization beyond simple chatbots toward truly autonomous
  agents that act as intelligent partners for every global
  employee.
  
  Responsibilities
  
  - Agentic Development: Build and refine autonomous AI agents
    capable of reasoning and planning. You will implement
    adaptive workflows using frameworks like LangChain or
    LangGraph to solve specific business use cases.
  - Cloud AI Implementation: Integrate LLMs across a multicloud
    stack. You will be responsible for the hands-on deployment
    and configuration of models like Gemini (GCP) and Claude
    (AWS) within our automation pipelines.
  - Hybrid Workflow Building: Execute the "low-code/pro-code"
    hybrid strategy. Configure Moveworks SparkActions for
    front-end interaction while writing robust Python backends
    to handle complex logic and data processing.
  - Connector Engineering: Develop and maintain secure API
    connectors that allow AI agents to "talk" to enterprise
    systems like ADO, ServiceNow, Concur, and Jira.
  - Code Quality & Peer Review: Participate in rigorous code
    reviews, ensure high standards of documentation, and
    assist in maintaining the scalability and security of our
    AI tools.
  - Collaborative Problem Solving: Work closely with Technical
    Leads and Business Analysts to turn high-level
    requirements into functional, automated agentic flows.
  
  What We’re Looking For: REQUIRED SKILLS/QUALIFICATIONS
  
  Technical Expertise:
  
  - 5-8 years of experience in Software Engineering, Workflow
    Automation, or Systems Integration. We value candidates
    who have a strong background in implementing business
    processes using platforms like ServiceNow, PowerPlatform,
    or Workato.
  - Workflow Execution: 3+ years focused on building intelligent
    workflows. You have a proven ability to connect disparate
    business systems (APIs, databases, SaaS) into a single
    functional journey.
  - Platform & Tools: Experience with Moveworks (Creator
    Studio/SparkActions) or similar conversational AI
    platforms. Familiarity with cloud environments (GCP, AWS,
    or Azure) to host and manage automation logic.
  - AI Integration: Hands-on experience or a deep interest in
    using Generative AI (Gemini/GPT) to make workflows
    "smarter"—specifically using LLMs for data extraction and
    intent recognition.
  - API Proficiency: Deep experience with REST/SOAP APIs. You
    are comfortable navigating complex documentation to build
    bridges between AI agents and platforms like ADO,
    ServiceNow, or Salesforce.
  - The "Pro-Code" Core: Proficient in Python or Node.js. You
    enjoy writing clean, efficient code for serverless
    functions and custom integrations.
  - Cloud Fundamentals: Familiarity with the GCP or AWS
    ecosystem—specifically IAM, Secret Manager, and API
    Gateway for secure automation hosting.
  
  Soft Skills:
  
  - Conversational Mindset: You think about the "User Journey."
    You care about how a user interacts with a chat-based bot
    (Slack/Teams).
  - Ownership: You enjoy taking a requirement from an initial
    "idea" all the way to a production-ready automation.
  - Analytical Problem Solving: You have the ability to untangle
    a complex business process into a clear, automated
    workflow.
  
  Nice to Have:
  
  - Certifications: AWS Certified AI/ML, Google Associate Cloud
    Engineer, or ServiceNow Developer certs.
  - Agentic Frameworks: Exposure to frameworks like LangChain,
    CrewAI, or AutoGen.
  - Data Handling: Experience with JSON, SQL, and basic Vector
    Database concepts.
  - DevOps Basics: Familiarity with Git, CI/CD pipelines, and
    Docker.
  
  Why Join Us?
  
  - Build the Future: Work with the latest "Agentic AI" tech
    stack (Gemini/Bedrock/Moveworks) in a high-growth field.
  - Multicloud Exposure: Expand your skills across Google Cloud,
    AWS, and Azure simultaneously.
  - Professional Growth: Join a culture that values technical
    discovery, mentorship, and career progression in the AI
    space.
  
  Build the future of agentic automation. Join S&P Global.
  
  What’s In It For You?
  
  Our Mission:
  
  Advancing Essential Intelligence.
  
  Our People:
  
  We're more than 35,000 strong worldwide—so we're able to
  understand nuances while having a broad perspective. Our
  team is driven by curiosity and a shared belief that
  Essential Intelligence can help build a more prosperous
  future for us all.From finding new ways to measure
  sustainability to analyzing energy transition across the
  supply chain to building workflow solutions that make it
  easy to tap into insight and apply it. We are changing the
  way people see things and empowering them to make an impact
  on the world we live in. We’re committed to a more equitable
  future and to helping our customers find new, sustainable
  ways of doing business. Join us and help create the critical
  insights that truly make a difference.
  
  Our Values: Integrity, Discovery, Partnership
  
  Throughout our history, the world's leading organizations
  have relied on us for the Essential Intelligence they need
  to make confident decisions about the road ahead. We start
  with a foundation of integrity in all we do, bring a spirit
  of discovery to our work, and collaborate in close
  partnership with each other and our customers to achieve
  shared goals. Benefits:
  
  We take care of you, so you can take care of business. We
  care about our people. That’s why we provide everything
  you—and your career—need to thrive at S&P Global. Our
  benefits include:
  
  - Health & Wellness: Health care coverage designed for the
    mind and body.
  - Flexible Downtime: Generous time off helps keep you
    energized for your time on.
  - Continuous Learning: Access a wealth of resources to grow
    your career and learn valuable new skills.
  - Invest in Your Future: Secure your financial future through
    competitive pay, retirement planning, a continuing
    education program with a company-matched student loan
    contribution, and financial wellness programs.
  - Family Friendly Perks: It’s not just about you. S&P Global
    has perks for your partners and little ones, too, with
    some best-in class benefits for families.
  - Beyond the Basics: From retail discounts to referral
    incentive awards—small perks can make a big difference.
  
  For more information on benefits by country visit:
  https://spgbenefits.com/benefit-summaries
  
