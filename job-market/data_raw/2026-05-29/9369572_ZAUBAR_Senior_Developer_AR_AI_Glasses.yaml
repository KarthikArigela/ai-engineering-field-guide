description: |
  ZAUBAR builds location-based AR experiences that turn cities
  into interactive layers of stories, knowledge, and
  entertainment. We work with leading cultural institutions,
  brands, and destinations to create immersive experiences in
  the real world. Our next step: bringing these experiences to
  AI-powered glasses and enabling creators to build and
  monetize them through the ZAUBAR platform. The Role We’re
  looking for a senior developer who takes ownership from
  architecture to deployment. You will shape the core of our
  AR platform across mobile and emerging AR glasses. This is a
  hands-on role in a small team where your decisions directly
  impact the product. You will be working with the latest AI
  and AR glasses prototypes before everyone else has access.
  Tasks * Own the architecture of our AR platform across
  mobile and AR glasses * Build and ship features across
  Unity, native apps, and backend systems * Develop and
  optimize real-time, location-based AR experiences * Work
  closely with ML engineers to integrate computer vision into
  production * Ensure performance across iOS, Android, and
  wearable devices * Set up and improve testing, CI/CD, and
  release pipelines * Collaborate with product, design, and
  creative teams on new features * Review code and mentor
  other developers Requirements * 5+ years experience in
  software development * Proven track record of shipping and
  maintaining products * Strong experience in one or more of:
  Unity, mobile development, real-time 3D * Experience with
  performance optimization on constrained devices * Ability to
  design systems end-to-end and take full ownership * Interest
  in AR, spatial computing, or AI-driven interfaces *
  Pragmatic problem solver who gets things done _Nice to
  have:_ * Experience with computer vision or ML integration *
  Experience with AR frameworks or wearable devices *
  Familiarity with cloud infrastructure (e.g. GCP) *
  Experience with WebGL or cross-platform stacks Benefits *
  Access to latest AR/AI glasses hardware before everyone else
  * Build real-world AR experiences used by millions of people
  * Work on cutting-edge use cases for AI glasses * High
  ownership and fast iteration cycles * Small, experienced,
  interdisciplinary team * Equity potential with real upside *
  Flexible work setup (Berlin or remote in EU) We're looking
  forward to your application! Please include a portfolio when
  submitting.
