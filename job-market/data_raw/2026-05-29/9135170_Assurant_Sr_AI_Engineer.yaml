  enhanced customer experience through mobile device
  solutions, extended service contracts, vehicle protection
  services, renters insurance, lender-placed insurance
  products, and other specialty products.
  
  AI and Biometric Usage
  
  Assurant supports the responsible use of Artificial
  Intelligence (AI), but we want to know the real you. Visit
  our AI Usage Guidelines page to understand what we expect
  from applicants regarding their use of AI during the
  application process.
  
  Employment is contingent upon completion of a required
