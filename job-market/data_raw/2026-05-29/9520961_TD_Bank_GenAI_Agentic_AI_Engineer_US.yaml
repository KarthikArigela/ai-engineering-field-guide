  Who We Are:
  
  TD is one of the world's leading global financial
  institutions and is the fifth largest bank in North America
  by branches/stores. Every day, we strive to make every
  interaction, product, and experience remarkably human and
  refreshingly simple for over 27 million households and
  businesses in Canada, the United States and around the
  world. More than 95,000 TD colleagues bring their skills,
  talent, and creativity to foster deeper relationships,
  ensure disciplined execution, and build a simpler, faster
  banking experience. TD is deeply committed to being a leader
  in client experience, that is why we believe that all
  colleagues, no matter where they work, are client facing.
  Together, we are reimagining what banking can be for our
  clients, colleagues and communities.
  
