  Job Description:
  
  As a mid‑level GenAI / Agentic AI Engineer, you’ll build,
  harden, and operate AI solutions built using Azure OpenAI
  and Python. You’ll implement RAG pipelines, prompt chains,
  evaluation tests, and secure service integrations to build
  end-to-end Gen AI solutions. You’ll collaborate with
  product, architects, and risk partners to ship reliable,
  responsible GenAI and Agentic AI capabilities.
  
  This person develops and maintains technical solutions that
  adhere to engineering and architectural design principles
  while meeting business requirements. Provides technical
  expertise with a focus on efficiency, reliability,
  scalability, and security; includes planning, evaluating,
  recommending, designing, operationalizing, and supporting
  solutions in compliance with enterprise and industry
  standards.
  
  Depth & Scope:
  
  - Expert knowledge of specific domain or range of engineering
    frameworks, technology, tools, processes and procedures,
    as well as organization issues
  - Expert knowledge of TD applications, systems, networks,
    innovation, design activities, best practices,
    business/organization, Bank standards, and may fulfill a
    governance role
  - Expert knowledge and experience in own discipline;
    integrates knowledge of business and functional priorities
  - Acts as a key contributor in a complex and critical
    environment
  - May provide leadership to teams or projects; shares
    expertise
  - Applies in-depth skills and broad knowledge of the business
    to address complex problems and non-standard situations
  
  Education & Experience:
  
  - Bachelor's or Graduate degree
  - Strong academic background (e.g., computer science,
    engineering)
  - 7 + years relevant experience
  
  Preferred Qualifications:
  
  - 2+ years of experience developing and deploying AI-enabled
    applications, such as LLMs, RAG, GraphRAG and agentic
    workflows
  - 7+ years of direct experience with Python and other
    applicable programming languages.
  - Hands‑on with Azure OpenAI (completions/chat), embeddings,
    vector search (Azure AI Search or similar), and RAG
    basics; comfort with Git, CI/CD, and monitoring.
  - Experience with LangChain, LangGraph, AKS; familiarity with
    enterprise auth (OAuth2/PingFed), APIM, and secret
    management (Key Vault).
  - Understanding of responsible AI guardrails
  - Experience in building backend services and APIs that
    orchestrate LLM prompts, retrieval, and post‑processing
    with Azure OpenAI and Azure AI Search
  
