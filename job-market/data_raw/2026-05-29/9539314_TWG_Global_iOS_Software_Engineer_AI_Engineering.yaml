title: iOS Software Engineer, AI Engineering
company: TWG Global
location: Santa Monica, USA
work_type: FULL_TIME
description: |
  At TWG Group Holdings, LLC (“TWG Global”), we drive
  innovation and business transformation across a range of
  industries—including financial services, insurance,
  technology, media, and sports—by leveraging data and AI as
  core assets. Our AI-first, cloud-native approach delivers
  real-time intelligence and interactive business
  applications, empowering informed decision-making for both
  customers and employees.
  
  We prioritize responsible data and AI practices, ensuring
  ethical standards and regulatory compliance. Our
  decentralized structure enables each business unit to
  operate autonomously, supported by a central AI Solutions
  Group, while strategic partnerships with leading data and AI
  vendors fuel game-changing efforts in marketing, operations,
  and product development.
  
  You will collaborate with management to advance our data and
  analytics transformation, enhance productivity, and enable
  agile, data-driven decisions. By leveraging relationships
  with top tech startups and universities, you will help
  create competitive advantages and drive enterprise
  innovation.
  
  At TWG Global, your contributions will support our goal of
  sustained growth and superior returns, as we deliver rare
  value and impact across our businesses.
  
  The Role
  
  We are hiring a Senior iOS Software Engineer to own the
  native mobile experience for our agentic AI platform. You
  will lead iOS development end-to-end: architecture, UI,
  networking, on-device ML, and release management. You will
  work closely with backend and AI engineers to surface agent
  capabilities in a polished, performant native client, and
  you will help define the standards and patterns the iOS
  codebase grows around.
  
  Key Responsibilities:
  
  - Architect and build the iOS application using Swift and
    SwiftUI, establishing patterns for UI, state management,
    and data flow that the team can scale
  - Integrate with backend AI agent services, including
    streaming responses, tool-call results, and multi-step
    workflow state
  - Implement push notifications (APNs), background refresh, and
    local persistence to support real-time agent interactions
  - Own the App Store release process end-to-end: builds,
    certificates, provisioning, TestFlight distribution, and
    production releases
  - Build and maintain networking layers that handle
    authenticated API calls, streaming, retries, and offline
    resilience
  - Explore and implement on-device ML capabilities, including
    CoreML models, NLContextualEmbedding, and audio pipelines
    (Whisper, TTS) where they improve the user experience
  - Drive code quality and testing discipline through unit
    tests, UI tests, and code review
  - Partner with product and design to deliver polished,
    accessible UI that meets the quality bar of a top-tier
    consumer app
  - Mentor junior engineers and raise engineering standards
    across the mobile codebase
  
  Requirements
  
  - 5+ years of iOS development experience with Swift, including
    production apps in the App Store
  - Deep proficiency with SwiftUI and UIKit, and strong opinions
    about when to use each
  - Demonstrated experience with APNs, background modes, and the
    full App Store release lifecycle
  - Strong networking fundamentals: URLSession or equivalent,
    REST API integration, streaming, and auth flows
  - Experience building apps that interact with AI or LLM-
    powered backends, including streaming and stateful
    conversation UI
  - Solid understanding of iOS memory management, performance
    profiling (Instruments), and crash analysis
  - Experience with unit testing (XCTest) and UI testing
    frameworks
  - Bachelor's degree in CS, Engineering, or equivalent
    practical experience
  
  Strongly Preferred:
  
  - On-device ML experience with CoreML, NLContextualEmbedding,
    or audio pipelines (Whisper, TTS)
  - Familiarity with LLM and agent platform concepts: tool
    calls, multi-step workflows, prompt/response streaming
  - Experience working with multi-provider LLM APIs (Anthropic,
    OpenAI, Google) from a mobile client
  - Exposure to MCP (Model Context Protocol) server or client
    integration
  - Experience in a multi-tenant SaaS environment with non-
    trivial auth (OAuth, RBAC)
  - Prior experience working with Palantir Foundry is a plus
  
  Benefits
  
  - Work on real-world AI applications with high-impact clients
  - Collaborate with world-class data scientists, engineers, and
    product leaders
  - Flat org structure, high trust, high autonomy
  - Competitive salary + performance-based incentives
  
  Position Location
  
  This is an onsite position preferred to be located in Santa
  Monica, CA, or New York, NY. Relocation support can be
  provided to the right candidates.
  
  Compensation
  
  The target base pay for this position is $190,000-$200,000.
  A bonus will be provided as part of the compensation
  package, in addition to the full range of medical,
  financial, and/or other benefits.
