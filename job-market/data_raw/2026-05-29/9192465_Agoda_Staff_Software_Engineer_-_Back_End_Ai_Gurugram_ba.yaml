description: |
  About Agoda
  
  At Agoda, we bridge the world through travel. Our story
  began in 2005, when two lifelong friends and entrepreneurs,
  driven by their passion for travel, launched Agoda to make
  it easier for everyone to explore the world.
  
  Today, we are part of Booking Holdings [NASDAQ: BKNG], with
  a diverse team of over 7,000 people from 90 countries,
  working together in offices around the globe. Every day, we
  connect people to destinations and experiences, with our
  great deals across our millions of hotels and holiday
  properties, flights, and experiences worldwide.
  
  No two days are the same at Agoda. Data and technology are
  at the heart of our culture, fueling our curiosity and
  innovation. If you’re ready to begin your best journey and
  help build travel for the world, join us.
  
  Get to Know our Team:
  
  In Agoda’s Back End Engineering department, we build the
  scalable, fault-tolerant systems and APIs that host our core
  business logic. Our systems cover all major areas of our
  business: inventory and pricing, product information,
  customer data, communications, partner data, booking
  systems, payments, and more. These mission-critical systems
  change frequently with dozens of releases per day, so we
  must employ state-of-the-art CI/CD and testing techniques in
  order to make sure everything works without any downtime. We
  also ensure that our systems are self-healing, responding
  gracefully to extreme loads or unexpected input. In order to
  accomplish this, we use state-of-the-art languages like
  Scala and Go, data technologies like Kafka and Aerospike,
  and agile development practices. Most importantly though, we
  hire great people from all around the world and empower them
  to be successful. Whether it’s building new projects like
  Flights and Packages or reimagining our existing business,
  you’ll make a big impact as part of the Back End Engineering
  team.
  
  The Opportunity:
  
  Agoda is building next-generation backend systems that
  handle millions of user requests daily across our global
  travel  platform. We're looking for a Staff Backend Engineer
  to lead distributed systems architecture, mentor engineering
  teams, and drive technical strategy across our backend
  organization. In this role, you'll work on mission-critical
  systems: APIs serving millions of search requests, real-time
  booking infrastructure, and high-performance microservices
  powering the world's largest travel marketplace.
  
  In this Role, you'll get to
  
  - Own end-to-end backend platform architecture — design
    scalable microservices and distributed systems across
    critical domains from vision through production
  - Drive architectural decisions and establish REST API design
    standards that influence multiple teams and system domains
  - Lead large-scale technical initiatives that improve service
    reliability, high availability, and performance at scale
  - Identify and resolve performance bottlenecks in high-
    throughput systems, surface technical debt, and build
    credible prioritized plans to address it
  - Lead development of complex features and systems with full
    ownership
  - Mentor engineers at multiple levels, coach them to grow, and
    review code and designs in a way that builds capability
  - Translate complex architectural trade-offs (cloud
    infrastructure, scalability, fault tolerance) into clear
    narratives for leadership and stakeholders
  - Lead incident response in production, find root causes,
    mitigate impact, and keep stakeholders updated
  - Exemplify technical excellence, build team culture rooted in
    feedback and continuous improvement, and serve as a role
    model for the backend organization
  
  What You’ll Need to Succeed
  
  - Atleast 7 + years of experience building performance-
    critical applications in production environments using
    Scala, Java, Kotlin, Python, Go, or C#
  - Demonstrate proven track record designing and evolving
    distributed systems architecture at massive scale
    (millions of requests/day)
  - Demonstrate strong foundation in microservices, REST APIs,
    SQL/NoSQL databases, algorithms, and system design
  - Lead large-scale technical initiatives with deep cross-team
    ownership and influence through quality of   Thinking
  - Show passion for software craftsmanship, mentor and elevate
    engineering teams, and communicate complex system   design
    to all audiences
  - Excellent communication: can articulate complex system
    design to engineers and non-technical stakeholders alike
  
  It’s Great If You Have
  
  - Experience with Scrum/Agile development methodologies
  - Experience building large-scale distributed products
  - Core engineering infrastructure tools like Git for source
    control, TeamCity for Continuous Integration and Puppet
    for deployment
  - Hands-on experience working with technology like queueing
    systems (Kafka, RabbitMQ, ActiveMQ, MSMQ), Spark, Hadoop,
    NoSQL (Cassandra, MongoDB), Play framework, Akka library
  
