description: |
  About the Role:
  
  Grade Level (for internal use):
  
  13
  
  The Team:
  
  The team focuses on developing content and solutions to help
  facilitate faster and more convenient Exploratory Data
  Analysis and Workflow Solutions for professionals across the
  markets and segments we serve. This creative team of experts
  collaborates to drive continuous improvements in product
  innovation and usability.
  
  The Impact:
  
  - Pioneer AI-driven data delivery: Spearhead the modernization
    of the trial and data delivery experience within CIQ
    Workbench using cutting-edge artificial intelligence.
  - Architect next-generation conversational interfaces:
    Engineer sophisticated YAML andContext bundles that
    empower users to seamlessly interrogate and interact with
    our massive, proprietary Xpressfeed datasets using
    intuitive natural language.
  - Opportunity to work with multiple teams across the MI
    organization.
  - Exposure to our advanced data delivery platforms, and the
    overall data feeds business.
  - Help drive improvement to products, product usability and
    client experience.
  - Become a member of one of the fastest-growing business
    segments within Market Intelligence.
  
  Key Responsibilities:
  
  - Architect and scale a cloud-native analytics platform
    supporting high concurrency and real-time data workflows
  - Lead development of Generative AI and agentic systems,
    including multi-agent orchestration and tool integration
  - Build and enhance data pipelines and analytics capabilities
    using Databricks/Spark to drive product insights
  - Translate business requirements into scalable, revenue-
    driving product features that improve user engagement and
    conversion, through close collaboration with product
    managers and stakeholders
  - Establish performance, observability, and reliability
    frameworks for both platform and AI systems
  - Provide technical leadership and mentorship to a global
    engineering team, driving best practices and cross-team
    collaboration
  
  What We’re Looking For:
  
  Basic Required Qualifications:
  
  - 10-18 yrs strong expertise in distributed systems and cloud-
    native architecture (AWS, Databricks)
  - Hands-on experience with data platforms (Databricks, Apache
    Spark, Delta Lake) and large-scale data processing
  - Expertise in DevOps practices and CI/CD pipelines using
    GitHub Actions and Terraform
  - Solid understanding of Generative AI and LLM-based systems,
    including prompt design and agent orchestration
  - Experience designing high-performance, scalable, and low-
    latency systems for enterprise applications
  - Strong problem-solving skills with the ability to translate
    business needs into technical solutions
  
  About S&P Global Market Intelligence At S&P Global Market
  Intelligence, a division of S&P Global we understand the
  importance of accurate, deep and insightful information. Our
  team of experts delivers unrivaled insights and leading data
  and technology solutions, partnering with customers to
  expand their perspective, operate with confidence, and make
  decisions with conviction. For more information, visit
  www.spglobal.com/marketintelligence.
  
  What’s In It For You?
  
  Our Mission:
  
  Advancing Essential Intelligence.
  
