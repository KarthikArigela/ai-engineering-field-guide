title: Intermediate Software Engineer - Artificial Intelligence (AI)
company: Tucows
location: USA
work_type: FULL_TIME
description: |
  Tucows Domains is the world’s largest wholesale domain
  registrar, responsible for maintaining the health,
  neutrality, and openness of an important—but largely
  invisible part of the Internet: the domain name system
  (DNS).
  
  As part of Tucows—one of the world’s largest Internet
  companies—Tucows Domains has a rich history of helping make
  the Internet better, operating globally under the Ascio,
  Enom, Hover and OpenSRS brands.
  
  We embrace a people-first philosophy that is rooted in
  respect, trust, and flexibility. We believe that whatever
  works for our employees is what works best for us. It’s also
  why the majority of our roles are remote-first, meaning you
  can work from anywhere you can connect to the Internet!
  Today, over one thousand people from over 20 countries are
  part of our team.
  
  If this sounds exciting to you, join the herd!
  
  About the Opportunity
  
  We’re looking for a passionate Intermediate Software
  Engineer specializing in Artificial Intelligence to join our
  growing team. In this role, you’ll help shape and build
  innovative AI-powered systems that transform how users
  interact with domain-related tools and services. You’ll work
  both with your team of forward-thinking engineers and with
  colleagues across business functions to prototype, develop,
  and deploy intelligent solutions using both commercial and
  open-source models along with modern infrastructure.
  
  This is a remote position open to applicants in Canada or
  USA.
  
  What You’ll Do
  
  - Design and build AI-driven features for our domain services
    platform using Python and Golang.
  - Integrate and fine-tune open-source models with cutting-edge
    architectures via tools like Ollama.
  - Research, evaluate, and implement emerging AI technologies
    that align with our vision for smarter, more intuitive
    products and services.
  - Collaborate with internal stakeholders and fellow engineers
    to rapidly prototype and iterate on machine learning and
    LLM-based features.
  - Contribute to a modern AI development stack, ensuring
    scalability, performance, and ethical usage of models.
  - Actively participate in the open-source ecosystem and bring
    relevant tools and techniques back to the team.
  - Implement software solutions with “intelligent” features,
    helping teams automate tedious and repetitive tasks.
  
  Key Skills and Experience
  
  - Bachelor’s degree in software engineering, computer science,
    or related field, with strong proficiency in Python and
    Golang.
  - 3+ years of professional software engineering experience in
    production environments.
  - Solid understanding of modern AI/ML/LLM concepts,
    particularly transformer-based and open-source models.
  - Hands-on experience with frameworks such as TensorFlow,
    Hugging Face, or similar.
  - Experience using open-source models (e.g., LLaMA, Mistral,
    Mixtral) in real-world applications.
  - Strong foundation in software design principles and service-
    oriented architecture.
  - Experience contributing to scalable system and component-
    level architecture.
  - Ability to design and build RESTful APIs for model serving
    and AI-enabled workflows.
  - Understanding of API best practices, including versioning,
    security, and error handling.
  - Working knowledge of relational and/or SQL databases and
    data modeling for AI use cases.
  - Experience with containerization and cloud-native deployment
    of AI services.
  - Strong collaboration, communication skills, and enthusiasm
    for emerging AI technologies.
  
  The base salary range for this position is $100,000 -
  $115,000 USD for US residents OR $100,350 - $111,500 CAD for
  Canadian residents Other countries will differ. Range may
  vary on a number of factors including, but not limited to:
  location, experience and qualifications. Tucows believes in
  a total rewards offering that includes fair compensation and
  generous benefits
  
  Want to know more about what we stand for? At Tucows we care
  about protecting the open Internet, narrowing digital
  divide, and supporting fairness and equality.
  
  We also know that diversity drives innovation. We are
  committed to inclusion across race, religion, color,
  national origin, gender, sexual orientation, age, marital
  status, veteran status or disability status. We celebrate
  multiple approaches and diverse points of view.
  
  We will ensure that individuals with disabilities are
  provided reasonable accommodation to participate in the job
  application or interview process, to perform crucial job
  functions, and to receive other benefits and privileges of
  employment. Please contact us to request an accommodation.
  
  Tucows and its subsidiaries participate in the E-verify
  program for all US employees.
  
  Learn more about Tucows, our businesses, culture and
  employee benefits on our site here.
