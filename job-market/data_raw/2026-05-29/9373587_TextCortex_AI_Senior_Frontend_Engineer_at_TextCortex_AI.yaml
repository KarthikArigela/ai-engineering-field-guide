description: |
  \*\*Make sure that you add your portfolio as a URL,
  otherwise your application will be rejected. Are you a
  senior developer who crafts elegant frontends with React &
  TypeScript, and thrives in an engineering culture of
  innovation and ownership?\*\* At TextCortex AI, you’ll join
  a core team of ambitious builders on a mission to transform
  how organizations harness AI. We’ve scaled from a few
  thousand users to millions in just two years, earning
  recognition as a Top 10 AI product of 2025 on G2 and serving
  over 2 million users. As a Senior Frontend Engineer, you
  will have a massive impact on a product at the forefront of
  AI – all while working side by side with passionate
  engineers in Berlin who set a high bar for code quality,
  product thinking, and continuous improvement. Tasks Lead
  Frontend Development: Own the design and implementation of
  intuitive, responsive UIs for our AI knowledge platform
  using React and TypeScript, impacting thousands of users
  daily from day one. Feature Ownership: Work closely with
  product and design teams to translate user needs into
  features – from concept, through architectural design, to
  polished release. You’ll build everything from rich web app
  interfaces to Chrome extension features, with an eye for
  detail and robustness. Code Quality & Performance: Write
  clean, maintainable code and unit tests, and conduct peer
  code reviews to ensure a high-quality codebase. Optimize for
  performance and scalability so our frontend remains fast and
  stable as usage grows. Cross-Stack Collaboration:
  Collaborate with backend engineers to integrate APIs
  seamlessly and influence overall architecture. You’ll
  frequently dive into the full stack to ensure end-to-end
  excellence in delivering features. Innovation & Improvement:
  Continuously improve our frontend tooling and developer
  experience. We experiment with new technologies – even
  leveraging AI coding agents like Cursor to complete complex
  tasks in hours– so you’ll be encouraged to automate,
  innovate, and bring in best practices that push our velocity
  and quality forward. Mentorship: As a senior member, guide
  and mentor junior developers by sharing knowledge and
  leading by example. Foster an environment where “no endless
  meetings, no debugging marathons – just shipping great code”
  is the norm. Requirements Technical Skills & Experience: *
  Expertise in React & TypeScript: You have extensive
  experience (5+ years or equivalent skill) building modern
  web applications with React. You’re fluent in TypeScript and
  care about type-safe, well-structured code as part of your
  craft. * Frontend Architecture: Deep understanding of state
  management (hooks, context, etc.), component design, and
  performance optimization. You can design frontend
  architecture that scales to large, complex applications
  without sacrificing maintainability. * Quality Mindset:
  Strong commitment to code quality – you write clean,
  readable code and cover critical logic with tests. You’ve
  driven code reviews and appreciate constructive feedback to
  uphold a high engineering standard. * User-Centric Approach:
  Eye for great UI/UX and empathy for the end user. You think
  beyond just “making it work” – you strive to make it
  delightful and intuitive. * Debugging & Problem Solving:
  Ability to quickly diagnose and fix issues across the stack.
  You’re comfortable with browser dev tools, performance
  profiling, and resolving tricky asynchronous bugs or memory
  leaks in a complex SPA. * Tooling & Workflow: Proficiency
  with modern development tools (Git, CI/CD pipelines, testing
  frameworks). Bonus: you already use or are excited to use
  AI-based dev tools (our engineers often pair program with AI
  – e.g. GitHub Copilot or Cursor – to boost productivity!). *
  Full-Stack Familiarity (Bonus): While your focus is
  frontend, you can navigate backend code when needed.
  Experience with Node.js, REST/GraphQL APIs, or cloud
  infrastructure is a plus. It helps you understand the full
  picture and collaborate effectively. Benefits * Urban Sports
  Club membership – for free! Stay active and healthy with
  full access to Berlin’s best gyms, studios, and sports
  facilities. * Stock options in one of Europe’s hottest AI
  startups—share in our journey and success as we scale. * The
  chance to work side-by-side with a highly ambitious,
  talented team at the cutting edge of AI. * An agile,
  product-driven culture with low bureaucracy and high
  ownership. * Support for your personal and professional
  growth, including new tools, courses, or events. *
  Relocation and onboarding assistance for candidates moving
  to Berlin. Cultural Fit & Mindset: Product-First Mentality:
  You care about _why_ you’re building something. We value
  engineers who understand the business and user context of
  their work. Our culture encourages curiosity and
  collaboration so that every developer grasps the real goals
  behind a feature – you won’t be treated as a “code scribe”
  but as a key thought partner in shaping the product.
  Ownership & Drive: You take responsibility from day one.
  When you build something, you own it end-to-end – from
  planning to release to monitoring. You thrive in
  environments where trust is given and high accountability is
  expected. Entrepreneurial & Proactive: You excel in a
  dynamic startup setting, adapting quickly and proactively
  fixing problems or improving processes. There’s minimal
  bureaucracy here – if you see a way to do something better,
  you will be empowered to drive that change. Collaboration &
  Communication: Strong communication skills and a team-
  oriented attitude. You enjoy brainstorming solutions with
  peers, pair-programming, and openly exchanging feedback. In
  our tight-knit team, _everyone’s ideas matter_ and the best
  idea wins. Continuous Learner: Technology moves fast – and
  so do we. You should embrace learning new tools or concepts
  (whether it’s a cutting-edge AI API or a new frontend build
  tool) and share learnings with the team. If you have side
  projects, open-source contributions, or interests across
  software, you’ll fit right in with our diverse engineering
  team. Berlin On-Site: This role is based in Berlin. We
  believe in the energy of having our team collaborate in-
  person, so you should be currently in Berlin or willing to
  relocate. _(We’ll support the right candidate with
  relocation assistance – join us in Europe’s startup
  capital!)_
