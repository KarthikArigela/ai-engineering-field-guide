description: |
  At PwC, our people in data and analytics engineering focus
  on leveraging advanced technologies and techniques to design
  and develop robust data solutions for clients. They play a
  crucial role in transforming raw data into actionable
  insights, enabling informed decision-making and driving
  business growth. Those in data science and machine learning
  engineering at PwC will focus on leveraging advanced
  analytics and machine learning techniques to extract
  insights from large datasets and drive data-driven decision
  making. You will work on developing predictive models,
  conducting statistical analysis, and creating data
  visualisations to solve complex business problems. Enhancing
  your leadership style, you motivate, develop and inspire
  others to deliver quality. You are responsible for coaching,
  leveraging team member's unique strengths, and managing
  performance to deliver on client expectations. With your
  growing knowledge of how business works, you play an
  important role in identifying opportunities that contribute
  to the success of our Firm. You are expected to lead with
  integrity and authenticity, articulating our purpose and
  values in a meaningful way. You embrace technology and
  innovation to enhance your delivery and encourage others to
  do the same. Examples of the skills, knowledge, and
  experiences you need to lead and deliver value at this level
  include but are not limited to: Analyse and identify the
  linkages and interactions between the component parts of an
  entire system. Take ownership of projects, ensuring their
  successful planning, budgeting, execution, and completion.
  Partner with team leadership to ensure collective ownership
  of quality, timelines, and deliverables. Develop skills
  outside your comfort zone, and encourage others to do the
  same. Effectively mentor others. Use the review of work as
  an opportunity to deepen the expertise of team members.
  Address conflicts or issues, engaging in difficult
  conversations with clients, team members and other
  stakeholders, escalating where appropriate. Uphold and
  reinforce professional and technical standards (e.g. refer
  to specific PwC tax and audit guidance), the Firm's code of
  conduct, and independence requirements. The Opportunity As
  part of the Data and Analytics Engineering team you will
  lead the development of innovative AI solutions that drive
  remarkable client outcomes. As a Manager you will supervise,
  develop, and coach teams while managing client service
  accounts, securing the delivery of quality results that meet
  and exceed expectations. This role offers the chance to
  cultivate powerful client relationships and drive continuous
  improvement initiatives, all while embracing technology and
  innovation to enhance project delivery. Responsibilities
  - Manage client accounts and secure the delivery of
    exceptional results
  - Foster sturdy relationships with clients to understand their
    needs
  - Analyze complex data sets to derive actionable insights
  - Confirm adherence to quality standards and established
    practices in deliverables
  What You Must Have
  - High School Diploma
  - At least 4 years of experience
  What Sets You Apart
  - Master's Degree in Computer Engineering, Data
    Processing/Analytics/Science, Computer
  Science, Software Engineering, Artificial Intelligence and
  Robotics preferred
  - Demonstrating exceptional team leadership abilities
  - Managing client service accounts to deliver exceptional
    outcomes
  - Fostering a collaborative environment for innovation
  - Analyzing complex data sets for actionable insights
  - Implementing industry standards for project management
  - Cultivating relationships with clients to understand needs
  - Driving continuous improvement initiatives within teams
  - Understanding production-grade quality gates and monitoring
