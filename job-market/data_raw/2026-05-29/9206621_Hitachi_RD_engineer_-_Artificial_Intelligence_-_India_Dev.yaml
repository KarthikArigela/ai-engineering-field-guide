  Job Description:
  
  The opportunity:
  
  As a R&D Engineer – Artificial Intelligence for HVDC Digital
  R&D Unit you will be a part of the respective local
  department but also report to the R&D Team Manager.
  
  The candidate should also have enthusiasm for
  troubleshooting, analyzing, and resolving complex problems,
  must demonstrate strong problem solving and communication
  skills, and be prepared to be an expert performance
  engineering resource on multiple initiatives of diverse
  scope.
  
  How you’ll make an impact:
  
  - To Run, within the Artificial Intelligence field,
    feasibility studies propose, and develop new technical
    concepts, design, and implement new solutions.
  - You will be responsible for Integrating AI projects within
    our production, leading the way towards the industry 4.0
    revolution.
  - You will contribute to organizing prototyping and testing
    activities to validate new technologies/algorithms.
  - To provide technical support to factories in the field of
    operational excellence and improving the processes as well
    as data analysis of different stages of production.
  - To have global collaboration with scientists of Hitachi
    energy’s research teams and technology centers, technology
    managers and engineers from the various factories.
  - To be an active member in further strengthening the
    collaboration with universities and research institutes.
  - You will be responsible for ensure compliance with
    applicable external and internal regulations, procedures,
    and guidelines.
  - Living Hitachi Energy’s core values safety and integrity,
    which means taking responsibility for your own actions
    while caring for your colleagues and the business.
  
  Your background:
  
  - Required relevant degree in fields such as Computer Science,
    Electrical Engineering, Computer Engineering, or related
    disciplines (Bachelor's or Master's).
  - Expert-level Python skills and hands-on model development
    experience for Regression, Classification, and computer
    vision-related tasks.
  - Proficient in Computer vision with hands-on experience in
    Object detection, Image classification, and Image
    processing.
  - Best practices in deploying computer vision models in a
    production environment.
  - Extensive hands-on experience with Python packages such as
    Scikit-learn, NumPy, Pandas etc.,
  - Hands-on experience in Cloud technologies like Azure or AWS
    and GCP is a plus.
  - Experience with Agile software delivery environments.
  - You have experience working in the field of Data Science and
    a degree in software engineering or equivalent.
  - You also have experience in integration of a system with
    different existing hardware as well as building new setups
    from scratch. Experience with Artificial Intelligence
    Vision Systems is a plus.
  - You have sound analytical skills and have ambition towards
    applying new and innovative solutions to improve the
    current solutions.
  - You are a team player who enjoys collaborating with others
    to achieve great results.
  - Preferably you also have experience in, or ability to
    develop, project management and technical leadership
    skills.
  - You have good communication skills and are fluent in
    English, both written and spoken.
  
