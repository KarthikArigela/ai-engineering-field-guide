job_id: 9273950
title: Principal Software Engineer, AI Enablement - Central Product
company: Riot Games
location: Los Angeles, USA
work_type: FULL_TIME
description: |
  Riot engineers bring deep knowledge of specific technical
  areas but also value the opportunity to work in a variety of
  broader domains.  We work with both new and current
  technology, creating innovative solutions to solve complex,
  large-scale challenges and deliver player value.  As a
  Principal Software Engineer, you’ll lead the development of
  key features and model high standards of engineering
  excellence.
  
  As a Principal Software Engineer on Riot’s AI Enablement
  team, you are a technical force multiplier. You will embed
  directly with any team at Riot to accelerate their adoption
  of modern AI development (e.g., generative AI, LLMs,
  reinforcement learning). Operating as part of an elite,
  highly mobile strike team, you will build production-ready
  AI integrations, develop robust developer tools, and level
  up partner engineers through side-by-side collaboration.
  Once a team is empowered and systems are successfully handed
  off, you will deploy to the next challenge. You will be at
  the forefront of cutting-edge AI in the game industry,
  bridging the gap between new technologies and live
  environments to shape how Riot develops products and games.
  You will be accountable to Riot’s Head of AI Product.
  
  Responsibilities:
  
  - Implement and Integrate: Lead the technical execution of
    integrating modern AI practices into existing engines,
    tools, and pipelines.
  - Embed and Accelerate: Deploy onto partner teams across Riot
    to break down complex AI implementation problems,
    establish technical direction, and deliver scalable,
    highly performant solutions.
  - Mentorship and Handoff: Train and coach embedded team
    engineers through pair programming, technical reviews, and
    hands-on collaboration. Ensure a seamless transition of
    code ownership before deploying to your next assignment.
  - Evangelize Best Practices: Share engineering best practices,
    security guardrails, and performance standards for AI
    usage across Riot’s development ecosystem.
  - Build Foundations: Identify when industry-standard tools are
    insufficient and develop new foundations, middleware, or
    APIs to connect AI research with practical development.
  - Manage Ambiguity: Actively navigate highly complex,
    uncharted technical spaces, communicating trade-offs and
    building consensus among engineering and product
    leadership.
  
  Required Qualifications:
  
  - BS in Computer Science (or equivalent experience) with 8-12
    years of software engineering experience.
  - Extensive experience with systems integration, technical
    leadership, and early-stage software development.
  - Deep programming proficiency in C++ and at least one other
    language (e.g., Python, C#).
  - Shipped at least one AAA game or large-scale, high-
    concurrency live service product.
  - Proven track record of managing high ambiguity, setting
    technical strategy, and leading multi-month/year
    initiatives.
  - Practical experience utilizing, integrating, or building
    modern AI tools, APIs, or infrastructure.
  
  Desired Qualifications:
  
  - Experience extending or developing within Unreal Engine
    (C++).
  - Familiarity with ML frameworks (e.g., PyTorch, TensorFlow)
    or LLM orchestration.
  - Background working on shared engine technology, central
    tools, or platform engineering teams.
  - Familiarity with the Runeterra and VALORANT IPs.
  
  For this role, you'll find success through craft expertise,
  a collaborative spirit, and decision-making that prioritizes
  the delight of players. We will be looking at your past
  studies, experience, and your personal relationship with
  games. If you embody player empathy and care about players'
  experiences, this could be your role!
  
  Our Perks:
  
  Riot focuses on work/life balance, shown by our open paid
  time off policy and other perks such as flexible work
  schedules. We offer medical, dental, and life insurance,
  parental leave for you, your spouse/domestic partner, and
  children, and a 401k with company match. Check out our
  benefits pages for more information.
  
  At Riot Games, we put players first. That mission drives
  every decision in our quest to create games and experiences
  that make it better to be a player. Whether you’re working
  directly on a new player-facing experience or you’re
  supporting the company as a whole, everyone at Riot is part
  of our mission. And just like in our games, we’re better
  when we work together. Our goal is to create collaborative
  teams where you are empowered to bring your unique
  perspective everyday. If that sounds like the kind of place
  you want to work, we’re looking forward to your application.
  
  It’s our policy to provide equal employment opportunity for
  all applicants and members of Riot Games, Inc. Riot Games
  makes reasonable accommodations for handicapped and disabled
  Rioters and does not unlawfully discriminate on the basis of
  race, color, religion, sex, sexual orientation, gender
  identity or expression, national origin, age, handicap,
  veteran status, marital status, criminal history, or any
  other category protected by applicable federal and state
  law. We consider for employment all qualified applicants,
  including those with criminal histories, in a manner
  consistent with applicable federal, state and local law,
  including the California Fair Chance Act, the City of Los
  Angeles Fair Chance Initiative for Hiring Ordinance, the Los
  Angeles County Fair Chance Ordinance for Employers, the San
  Francisco Fair Chance Ordinance, and the Washington Fair
  Chance Act.
  
  Per the Los Angeles County Fair Chance Ordinance, the
  following core duties may create a basis for disqualifying
  candidates with relevant criminal histories:
  
  - Safeguarding confidential and sensitive Company data
  - Communication with others, including Rioters and third
    parties such as vendors, and/or players, including minors
  - Accessing Company assets, secure digital systems, and
    networks
  - Ensuring a safe interactive environment for players and
    other Rioters
  
  These duties are directly related to essential operations,
  safety, trust, and compliance obligations within our
  organization. Please note that job duties may evolve based
  on business needs and additional responsibilities may be
  assigned as necessary to maintain operational efficiency and
  security.
