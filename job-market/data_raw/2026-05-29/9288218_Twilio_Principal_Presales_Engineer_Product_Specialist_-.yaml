description: |
  Who we are
  
  At Twilio, we’re shaping the future of communications, all
  from the comfort of our homes. We deliver innovative
  solutions to hundreds of thousands of businesses and empower
  millions of developers worldwide to craft personalized
  customer experiences.
  
  Our dedication to remote-first work, and strong culture of
  connection and global inclusion means that no matter your
  location, you’re part of a vibrant team with diverse
  experiences making a global impact each day. As we continue
  to revolutionize how the world interacts, we’re acquiring
  new skills and experiences that make work feel truly
  rewarding. Your career at Twilio is in your hands. We use
  Artificial Intelligence (AI) to help make our hiring process
  efficient. That said, every hiring decision is made by real
  Twilions!
  
  .
  
  See yourself at Twilio
  
  Join the team as Twilio’s next Principal Presales Engineer,
  Product Specialist - CDP, Martech, AI
  
  About the job
  
  This position is needed to act as the "bridge" between our
  most complex enterprise accounts and our Product teams. You
  will scope, design, and validate how complex multi-product
  solutions fit into the client’s ecosystem and help paint the
  long-term Twilio vision for our customers. You will be a
  critical partner cross-functionally, working with product,
  engineering, and marketing to identify and share technology
  patterns and shifts from our clients (and prospects) to
  influence product strategy.
  
  Responsibilities
  
  In this role, you’ll:
  
  - Develop your expertise of the Twilio platform, use cases and
    buyer personas, while staying current on Customer Data
    Platform, AI, and data engineering trends
  - Architect the Technical Win: Scope, design, and build multi-
    product solution architecture and compelling presentations
    to secure the Technical Win, in partnership with core
    sales, core SE, and Enterprise Strategist teams
  - Design creative solutions across customer data flows, AI
    decisioning, and end-to-end customer journey design
  - Educate cross-functional teams on product specific
    knowledge, enablement, strategy, and solutions / use cases
    (Sales, Presales, Marketing, Enablement, CS, Product,
    etc.)
  - Mentor sales and SE team members on value-selling strategies
    and complex solution selling
  - Document recent patterns and technology shifts with our
    clients and prospects to influence Product and R&D
    strategy via GTM interlock and Product Life Cycle
    processes
  - Drive Thought Leadership: Proactively contribute to the
    Specialist Org strategy and the multi-product GTM motion
  
  Qualifications
  
  Twilio values diverse experiences from all kinds of
  industries, and we encourage everyone who meets the required
  qualifications to apply. If your career is just starting or
  hasn't followed a traditional path, don't let that stop you
  from considering Twilio. We are always looking for people
  who will bring something new to the table!
  
  *Required:
  
  - Demonstrated ability to lead complex solutions sales cycles,
    including novel solution scoping, design, and validation
  - Expert stakeholder collaboration and influencing skills
  - 6+ years of progressive presales experience, including
    complex solution architecture
  - 2+ years of demonstrated expertise in CDP and/or martech
    related platforms - including data engineering, data
    modeling, and/or cloud data warehouse
  - Strong track record of excellent verbal and written
    communication skills, and  driving deal strategy with
    creative and compelling storytelling
  - Experience selling and designing solutions across multiple
    product areas within a CDP or Martech-related platform
  - Confidence influencing and engaging with a highly skilled
    and experienced audiences including C-level executives
  
  Desired:
  
  - Experience working in an overlay or specialist presales
    capacity
  - Experience collaborating with product on strategy,
    positioning, and roadmap
  
  Location
  
  This role will be remote but must be based in the United
  Kingdom or Ireland
  
  Travel
  
  We prioritise connection and opportunities to build
  relationships with our customers and each other. For this
  role, approximately 20% travel is anticipated to help you
  connect in-person in a meaningful way.
  
  What We Offer
  
  Working at Twilio offers many benefits, including
  competitive pay, generous time off, ample parental and
  wellness leave, healthcare, a retirement savings program,
  and much more. Offerings vary by location.
  
  Twilio thinks big. Do you?
  
  We like to solve problems, take initiative, pitch in when
  needed, and are always up for trying new things. That's why
  we seek out colleagues who embody our values — something we
  call Twilio Magic. Additionally, we empower employees to
  build positive change in their communities by supporting
  their volunteering and donation efforts.
  
  So, if you're ready to unleash your full potential, do your
  best work, and be the best version of yourself, apply now!
  If this role isn't what you're looking for, please consider
  other open positions.
  
  Twilio is proud to be an equal opportunity employer. We do
  not discriminate based upon race, religion, color, national
