description: |
  Company Overview:
  
  Accrete AI is a dynamic and innovative company focused on
  transforming the future of artificial intelligence. We
  specialize in creating advanced AI solutions that turn
  complex data into actionable insights, driving real-world
  impact for businesses and government organizations. Our team
  thrives on creativity and collaboration, working together to
  push the boundaries of AI technology.
  
  At the core of our offerings are AI agents—autonomous
  systems that analyze multimodal data, generate insights, and
  make intelligent recommendations. These agents help
  businesses streamline operations, improve decision-making,
  and empower government entities to enhance security,
  intelligence, and operational efficiency.
  
  Job Description:
  
  As an Applied Research Engineer, you will design, build, and
  operationalize advanced AI systems, working alongside AI
  scientists to turn research ideas into high-impact models
  and agentic workflows, and alongside engineering teams to
  integrate those capabilities into production platforms. You
  will work across NLP, computer vision, multimodal models,
  and agent-based systems, owning the path from experimental
  prototypes to scalable, reliable components. This role
  values strong hands-on engineering, fluency with modern AI
  models and tooling, and the judgment to balance innovation
  with performance, robustness, and real-world constraints.
  
  Key Responsibilities:
  
  - Design, implement, and operationalize advanced AI models and
    agentic workflows, translating research ideas into robust,
    production-ready systems.
  - Work closely with AI scientists to prototype, experiment,
    and evaluate models across NLP, computer vision,
    multimodal learning, and agent-based systems.
  - Partner with machine learning engineers and application
    teams to integrate research artifacts into products,
    services, and platforms.
  - Build and optimize model pipelines, inference workflows, and
    tooling with attention to performance, scalability, and
    reliability.
  - Contribute to model evaluation, benchmarking, and
    validation, ensuring research outputs meet real-world
    constraints and quality standards.
  - Support the deployment, monitoring, and iteration of AI
    models, helping systems evolve as data, requirements, and
    environments change.
  - Stay current with advances in AI and machine learning,
    applying new techniques where they meaningfully improve
    system capabilities.
  - Contribute to a culture of high-quality engineering,
    including code reviews, documentation, testing, and
    knowledge sharing.
  
  Required Qualifications:
  
  - Bachelor’s degree in Computer Science, Engineering, or a
    closely related field with 2+ years of hands-on experience
    building AI/ML systems; or a Master’s degree in a relevant
    field.
  - Strong software engineering skills in Python, with
    experience implementing and maintaining AI or ML-driven
    systems.
  - Practical experience working with modern AI models,
    including large language models, deep learning models for
    natural language processing or computer vision systems.
  - Experience developing agentic or tool-using AI workflows,
    including orchestration, reasoning loops, or pipeline-
    based execution.
  - Familiarity in model training, fine-tuning, and evaluation,
    and the ability to collaborate effectively with research
    scientists.
  - Experience deploying AI or ML components into production or
    near-production environments, with awareness of
    performance, reliability, and scaling considerations.
  - Comfort working across the stack with machine learning
    engineers and application teams to operationalize research
    outputs.
  - Strong problem-solving skills and the ability to quickly
    learn new models, tools, and systems.
  - Clear communication skills and the ability to work
    effectively in cross-functional teams.
  
  Career Progression:
  
  At Accrete we value professional growth and development of
  our employees. As a Applied Research Engineer, you will have
  access to a variety of career advancement opportunities and
  growth within the organization. We provide ongoing training,
  mentorship, and opportunities to take on leadership roles
  within your team and work with leaders across departments.
  
  Why Join Us:
  
  - Innovative Environment: Be part of a team that's at the
    forefront of technological innovation, utilizing GenAI and
    ML to create groundbreaking solutions.
  - Collaborative Culture: Work in a collaborative environment
    where your ideas are valued, and you have the opportunity
    to make a real impact.
  - Professional Growth: We're committed to your professional
    growth and development, offering opportunities for
    learning and advancement.
  - Competitive Compensation: Enjoy a competitive compensation
    and benefits package, including medical insurance.
  
  Join us at Accrete (https://www.accrete.ai/) and be part of
  our team. Apply now and embark on an exciting journey of
  innovation and growth!
