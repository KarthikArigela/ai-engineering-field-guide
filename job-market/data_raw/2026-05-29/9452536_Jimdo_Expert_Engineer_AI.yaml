description: |
  About Jimdo
  
  We exist to unleash the power of the self-employed - helping
  solopreneurs and micro-businesses thrive by doing what
  they're passionate about and removing the complexity of
  building lasting, successful businesses.
  
  Jimdo started in 2007 when three school friends built a
  website builder in a Northern German farmhouse to help
  everyone build a presence online. Today, we're a profitable,
  remote-first company with 220+ people from 50+ nationalities
  working across 15+ countries. We've helped build over 36
  million websites to get online across the world.
  
  We're more than just a website builder. We're an AI-powered
  platform that helps self-employed people actually run and
  build successful businesses — from getting found online,
  winning customers and running their business with a peace of
  mind by knowing exactly what to do next to move forward.
  
  At the heart of Jimdo is a strong belief in personalized,
  data-driven guidance. Our platform combines design, business
  tools, and an AI-powered core that turns real customer data
  into clear insights and next steps helping our customers
  focus on what moves their business forward.
  
  Role Overview :
  
  We're building Jimdo Companion — an agentic AI system that
  is becoming the central intelligence of our platform.
  Companion orchestrates multiple AI agents to deliver
  personalized user journeys, automate key business tasks, and
  provide real-time assistance to microbusiness owners. The AI
  team owns the Companion product and builds the underlying AI
  platform that enables other product teams across Jimdo to
  create their own AI-powered experiences. Our stack includes
  a recommendation engine, a business assistant
  (conversational AI), agent orchestration, and feedback loops
  that connect customer actions to measurable business
  outcomes.
  
  We're looking for an expert full-stack engineer to join this
  team as a senior hands-on builder. You'll design and ship
  core parts of the Companion system — from the agent
  orchestration layer and LLM-powered workflows to the
  frontend experiences our customers interact with daily.
  You'll also play a key role in shaping our AI platform so
  that other teams can build on top of what we create. Beyond
  building the product, you'll set the standard for AI-
  augmented engineering within the team. We expect you to
  leverage AI coding assistants as a core part of how you
  work, moving fast without compromising quality, and helping
  the engineers around you do the same.
  
  Your impact:
  
  - Architect and build core Companion services: the agent
    orchestration layer, recommendation engine, Business
    Assistant, and the APIs that connect them — enabling
    personalized, data-driven guidance at scale.
  - Ship production AI agents and agentic workflows that help
    microbusiness owners complete real business tasks like
    creating content, setting up bookings, and optimizing
    their online presence.
  - Design and evolve our AI platform so other product teams at
    Jimdo can build their own domain-specific AI agents and
    experts without reinventing the infrastructure.
  - Own features end-to-end across the full stack — from LLM
    orchestration and backend services (Node.js/TypeScript,
    AWS) to the React frontend that hundreds of thousands of
    users see.
  - Improve the intelligence of the system over time: refine
    prompt strategies, tune agent handoffs, implement
    guardrails, and close the loop between customer actions
    and measurable business outcomes.
  - Drive technical decisions on how we integrate LLM providers,
    manage cost and latency, and build resilience (e.g.,
    multi-provider fallback, caching strategies,
    observability).
  - Collaborate with product managers, designers, data analysts,
    and engineers across teams to define what Companion does
    next — translating product vision into working software
    that increases customer transactions and retention.
  - Proactively identify technical debt, architectural risks,
    and scalability bottlenecks in a fast-moving AI product —
    and drive pragmatic improvements.
  
  What you bring:
  
  - 8+ years of software engineering experience, with at least 2
    years in a senior or technical leadership role.
  - Strong full-stack proficiency: Node.js/TypeScript backends
    and React frontends.
  - Deep experience with RESTful APIs, microservices
    architecture, and cloud platforms (AWS preferred).
  - Solid foundation in Kubernetes, Terraform, and GitHub
    Actions.
  - Proven system design and architectural leadership
    capabilities.
  - Hands-on experience building with LLMs: prompt engineering,
    LLM API integration, agentic workflows, or AI-powered
    product features. You've gone beyond experimenting —
    you've shipped AI features to real users.
  - Expert-level proficiency with AI coding assistants (Cursor,
    Claude Code, or similar) — you use them daily to
    dramatically increase your development velocity and you
    can help others do the same.
  - Ability to critically evaluate AI-generated code and know
    when to accept, modify, or reject suggestions.
  - Proven ability to rapidly understand new domains and
    codebases and make meaningful contributions with minimal
    onboarding.
  - Strong product sense — you care about what you're building
    and why, not just how.
  
  What we offer:
  
  Inspiring Mission: At our core, we are driven by a
  meaningful mission - to  empower solopreneurs and small
  businesses to succeed and  to contribute to the
  sustainability and vibrancy of the communities they serve.
  
  Flexibility and Trust: Our work environment thrives on
  flexibility and trust. We offer fully remote work set-up
  with opportunities for in-person collaboration. You can
  manage your working hours flexibly because we prioritize the
  results you deliver over the number of hours you put in.
  
  An International Diverse Team: Our team is a mosaic of over
  248 individuals hailing from 50+ different countries and
  working across 15+ diverse locations. We take pride in our
  openness and inclusivity, with an Employee-led DEI Council
  and active ERGs that ensure everyone's voices are heard.
  
  Continuous  Growth and Career Development: We invest in your
  growth with company-wide access to LinkedIn Learning and
  Hack Weeks, Deep Work Thursdays, conferences and access to
  technical eLearning platforms. From day one, you have the
  chance to contribute your ideas and create a meaningful
  impact. Our flat hierarchies and swift decision-making
  processes provide an open platform for your career
  progression.
  
  Competitive Benefits Package:
  
  - Annual compensation reviews to ensure you're rewarded
    fairly.
  - A remote office set-up bonus to enhance your workspace.
  - An employee assistance program, offering resources and
    counseling.
  - Plus, a perk that keeps giving: up to three free Jimdo
    websites for your personal or professional projects that
    you get to keep forever.
  
  Jimdo is proud to be an equal opportunity employer. This
  means that we don’t discriminate based on race or ethnic
  origin, color, the language(s) you speak, where you (or your
  parents) are from, or whether or not you consider yourself
  to have a disability. Neither will your age, gender, gender
  identity, sexual orientation, religion, beliefs, or
  political opinions play a part in your application with us.
  Our diverse team values and celebrates the uniqueness of
  each individual. We embrace differences and believe that
  they enrich our organization, making us stronger and more
  innovative. Join us, and let's continue to create a
  workplace where everyone can thrive, regardless of
  background or identity.
  
