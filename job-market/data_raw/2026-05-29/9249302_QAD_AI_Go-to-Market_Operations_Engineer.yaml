description: |
  Company Description
  
  QAD is a world-class SaaS company, and we are growing. We
  are looking for talented individuals who want to join us on
  our mission to help solve relevant real-world problems in
  manufacturing and the supply chain.
  
  Job Description
  
  We are seeking a visionary and highly technical AI Go-To-
  Market (GTM) Engineer to sit at the core of our revenue
  engine. This is not a traditional operations role; it is a
  hybrid of software engineering, data science, and revenue
  strategy. You will be responsible for architecting an AI-
  first GTM ecosystem that bridges the gap between Marketing,
  Sales, RevOps, and Customer Success.
  
  
  
  Your goal is to ensure that every individual in our GTM
  organization and every piece of our technology stack is
  augmented by Artificial Intelligence. You will build the
  bridges that allow us to generate more pipeline, accelerate
  deal velocity, and eliminate administrative friction, all
  while optimizing our tech spend.
  
  
  
  Responsibilities:
  
  1. AI Architecture & Custom Integration
  
  - Design, code, and deploy custom AI integrations from scratch
    to connect our CRM, Marketing Automation, and Sales
    Engagement platforms.
  - Build proprietary internal LLM-based tools to automate lead
    enrichment, personalized outbound messaging, and customer
    health scoring.
  - Develop agentic workflows that handle routine administrative
    tasks (e.g., CRM data entry, meeting summaries, and
    follow-up scheduling) across the revenue organization.
  
  2. Revenue Ecosystem Optimization
  
  - Partner with Marketing Ops and  RevOps to audit the existing
    tech stack, identifying redundancies where AI can replace
    high-cost, low-utility third-party vendors.
  - Implement predictive modeling to identify high-intent
    pipeline and provide Sales with real-time "Next Best
    Action" recommendations.
  - Ensure data integrity across all platforms, creating a
    "single source of truth" that AI models can leverage for
    accurate forecasting.
  
  3. Cross-Functional Efficiency
  
  - Collaborate with Customer Success to build AI-driven
    retention loops and automated renewal triggers.
  - Consult with Marketing leadership on AI-driven content
    distribution and performance marketing automation to lower
    Customer Acquisition Cost (CAC).
  - Act as an internal consultant, training GTM teams on how to
    effectively "prompt" and utilize deployed AI tools to
    maximize their individual output.
  
  Qualifications
  
  - 5+ years of experience in Marketing/Revenue Operations or
    GTM Engineering. Deep understanding of the "Leads-to-
    Revenue" funnel and "Best-in-Class" SaaS ecosystems.
  - Ability to write and maintain production integrations —
    Python, JavaScript, html, or equivalent — connecting AI
    agents to CRM, MAP, and sequencing tools via APIs. You
    don't need to be a software engineer, but you need to ship
    working code, not just configure no-code tools.
  - Deep working knowledge of the modern B2B GTM stack —
    specifically Salesforce (as CRM and data hub), Marketo,
    ABM tools, Outreach or Salesloft, Gong or Chorus, and
    real-time chat/qualification tools like Qualified.
  - Proven track record of consolidating tech stacks and
    reducing vendor spend without sacrificing performance.
  - Understanding of pipeline math and unit economics: you
    should be able to work backward from a revenue target to
    SQLs required, conversion rates by stage, and the specific
    AI interventions that move each number. If someone says
    "we need 67 SQLs per quarter at 20% win rate and $75K
    ASD," you should immediately know where AI can compress
    that funnel.
  - Experience with AI agent orchestration — managing multiple
    AI agents working different segments or functions
    simultaneously, resolving conflicts, preventing duplicate
    outreach, and maintaining data quality in the hub
    (Salesforce).
  - Demonstrated ability to build prompt libraries, training
    datasets, and refinement workflows for AI agents —
    treating agent training as a discipline, not a one-time
    setup.
  - Strong opinions on when AI should replace human effort
    versus augment it — and the judgment to know that bad AI
    automation destroys deals faster than no automation at
    all.
  
  
  
  What You’ll Bring to the Team:
  
  - A proactive mindset with a passion for enabling marketing
    success through AI.
  - Ability to bridge the gap between strategy and execution -
    bringing ideas to life through strong operational
    planning.
  - Flexibility and resilience in the face of a high-growth,
    ever-evolving SaaS environment.
  
  - A collaborative spirit and willingness to roll up your
    sleeves to help the team succeed.
  
  Additional Information
  
  - Your health and well being are important to us at QAD. We
    provide programs that help you strike a healthy work-life
    balance.
  - Opportunity to join a growing business, launching into its
    next phase of expansion and transformation.
  - Collaborative culture of smart and hard-working people who
    support one another to get the job done.
  - An atmosphere of growth and opportunity, where idea-sharing
    is always prioritized over level or Hierarchy.
  - Compensation packages based on experience and desired skill
    set
  
