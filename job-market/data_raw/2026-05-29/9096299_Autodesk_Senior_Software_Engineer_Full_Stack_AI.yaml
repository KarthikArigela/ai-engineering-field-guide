  Position Overview
  
  
  As a global leader in 3D design, engineering, and
  entertainment software, Autodesk helps people imagine,
  design and create a better world. Autodesk accelerates
  better design through an unparalleled depth of experience
  and a broad portfolio of software to give customers the
  power to solve their design, business, and environmental
  challenges. In addition to designers, architects, engineers,
  and media and entertainment professionals, Autodesk helps
  students, educators, and casual creators unlock their
  creative ideas through user-friendly applications.
  
  
  Are you excited by solving technical challenges that come
  with building a scalable, highly available, performant
  platform used by millions of users worldwide? Come join us
  at Autodesk!  Autodesk's Growth Experience Technology (GET)
  organization is seeking a passionate Senior Software
  Engineer to join a team of diverse, smart, and driven
  engineers who are responsible for building .com and Commerce
  Engineering which powers Autodesk’s digital experience and
  commerce platforms, enabling seamless customer journeys from
  discovery and evaluation to purchase, account management,
  and support. This engineer will collaborate within a high-
  performing Scrum team where the code, infrastructure, and
  services you develop will have a direct, positive impact on
  millions of users of our products. This experience is key to
  our business and one of our top initiatives around
  transformation and customer experience.
  
  
  Responsibilities
  
  - Design, develop, and maintain scalable backend services
    using Node.js and TypeScript
  
  - Contribute to system architecture, design discussions, and
    technical decision-making across engineering teams
  
  - Write clean, maintainable, and production-grade code, while
    promoting engineering best practices such as code reviews,
    automated testing, and documentation
  
  - Take ownership of code quality by writing automated tests
    and ensuring adequate test coverage across services and
    APIs
  
  - Leverage AI-assisted development tools to improve
    engineering productivity and code quality
  
  - Collaborate closely with Architects, DevOps, Product, and
    Support teams to deliver reliable and high-quality
    software solutions
  
  - Translate business requirements into technical designs,
    implementation plans, and effort estimates
  
  - Troubleshoot and resolve complex technical issues across
    distributed systems and microservices
  
  - Evaluate and recommend tools, frameworks, and processes to
    improve engineering productivity, system performance, and
    code quality
  
  - Participate in a rotating on-call schedule to support
    production systems and ensure high availability and
    reliability
  
  - Mentor junior engineers and contribute to a strong
    engineering culture through design reviews and knowledge
    sharing
  
  Minimum Qualifications
  
  - Bachelor’s or Master’s degree in Computer Science or a
    related technical field
  
  - 6–9 years of software development experience, with strong
    expertise in Node.js, TypeScript, and modern JavaScript
    frameworks (e.g., React)
  
  - Experience designing and building REST and/or gRPC APIs
    within microservices architectures
  
  - Solid understanding of cloud-native architecture and
    experience with AWS services
  
  - Experience implementing automated testing strategies
    including unit, integration, and end-to-end testing using
    tools such as Playwright, Cypress, Jest, or similar
    frameworks
  
  - Experience with SQL and NoSQL databases
  
  - Familiarity with containerization technologies such as
    Docker and CI/CD tools like Jenkins or Spinnaker
  
  - Experience creating technical design documentation (HLDs,
    LLDs, RFCs)
  
  - Strong problem-solving skills, with the ability to work
    effectively in collaborative and fast-paced environments
  
  - Excellent communication and technical writing skills
  
  The Ideal Candidate
  
  - Passionate about designing and building highly scalable,
    reliable distributed systems
  
  - Writes clean, testable, and maintainable code, and actively
    contributes to improving engineering standards within the
    team
  
  - Comfortable working across the full software development
    lifecycle from design to production operations
  
  - Continuously explores and adopts new technologies to solve
    business problems effectively
  
  - Experience using AI-assisted development tools (e.g.,
    Cursor, GitHub Copilot) and applying prompt engineering
    techniques
  
  - Familiarity with observability and monitoring tools such as
    Splunk, Dynatrace, or similar platforms
  
