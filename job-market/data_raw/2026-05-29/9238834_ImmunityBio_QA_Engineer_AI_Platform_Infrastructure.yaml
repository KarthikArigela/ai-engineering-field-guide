description: |
  Company Overview ImmunityBio, Inc. (NASDAQ: IBRX) is a
  commercial-stage biotechnology company developing cell and
  immunotherapy products that are designed to help strengthen
  each patient’s natural immune system, potentially enabling
  it to outsmart the disease and eliminate cancerous or
  infected cells. We envision a day when we no longer fear
  cancer, but can conquer it, thanks to the biological wonder
  that is the human immune system. Our scientists are working
  to develop novel therapies that harness that inherent power
  by amplifying both branches of the immune system, attacking
  cancerous or infected cells today while building
  immunological memory for tomorrow. The goal: to reprogram
  the patient’s immune system and treat the host rather than
  just the disease. Why ImmunityBio? • ImmunityBio is
  developing cutting-edge technology with the goal to
  transform the lives of patients with cancer and develop
  next-generation therapies and vaccines that complement,
  harness and amplify the immune system to defeat cancers and
  infectious diseases. • Opportunity to join a publicly traded
  biopharmaceutical company with headquarters in Southern
  California. • Work with a collaborative team with the
  ability to work across different areas of the company. •
  Ability to join a growing company with professional
  development opportunities.
  
  Position Summary
  
  The QA Engineer is a hands-on, engineering role integrating
  test automation, software quality assurance, and platform
  reliability engineering. The role involves close interaction
  with backend, frontend, AI/ML, and DevOps engineering
  functions. The QA Engineer will serve as the subject matter
  expert (SME) for quality assurance activities across the
  organization's AI platform and web applications and will
  work with cross-functional teams to ensure successful
  delivery of reliable, performant software. The QA Engineer
  will support engineering leadership in driving appropriate
  quality standards, preparing and adhering to test plans and
  schedules, building automated test infrastructure, and
  providing technical support for daily development and
  release operations across a modern stack spanning Docker,
  Kubernetes, Next.js, Svelte, Bun, Python, TypeScript, React,
  and AI frameworks including LangChain, CrewAI, and
  LlamaIndex.
  
  Essential Functions
  
  - Subject Matter Expert for the design, maintenance, and
    implementation of automated and manual test frameworks
    covering backend APIs, frontend components, containerized
    services, and AI/LLM-powered workflows.
  - Design, implement, and maintain CI/CD-integrated QA
    pipelines using Docker Compose and Kubernetes
    environments.
  - Conduct performance and load testing for containerized and
    GPU-enabled applications, identifying bottlenecks and
    reliability risks.
  - Validate AI workflow correctness, including LangChain
    pipelines, CrewAI task orchestration, and LlamaIndex
    document processing flows.
  - Develop internal testing tools and frameworks in TypeScript,
    Python, or Bun to improve platform reliability and
    developer velocity.
  - Reproduce, isolate, and report defects with high-quality
    context; work closely with developers to drive rapid
    resolution.
  - Consult and collaborate with SMEs across Engineering,
    Product, DevOps, and AI/ML teams to define quality
    standards and establish test plans for new services and UI
    components.
  - Lead the creation, modification, and maintenance of QA
    documentation, including test plans, test case libraries,
    defect reports, and quality metrics dashboards.
  - Influence cross-functional groups regarding testability,
    technical feasibility, and quality requirements during
    design and development phases.
  - Assist with the planning and implementation of QA-driven
    process improvements and tooling upgrades in collaboration
    with cross-functional teams.
  - Lead integration, regression, and acceptance testing
    activities for new features and infrastructure changes.
  - Provide technical mentoring and oversight to less
    experienced engineers on testing best practices, tooling,
    and defect management.
  - Create, edit and adhere to Standard Operating Procedures
    (SOPs), process improvements, and standardization of
    templates.
  - Performs ad-hoc and cross-functional duties and/or projects
    assigned to support business needs and provide
    developmental opportunities.
  
  Education & Experience
  
  - Bachelor’s degree in computer science, Software Engineering,
    or a related field is required.
  - 3+ years of experience in software QA or test automation is
    required.
  - Experience with containerized environments (Docker, Docker
    Compose, Kubernetes) is required.
  - Experience with Python and TypeScript for writing tests and
    automation scripts is required.
  - Experience with modern web frameworks (React, Next.js,
    Svelte) and E2E/UI testing tools such as Playwright or
    Cypress is required.
  - Experience with CI/CD workflows (GitHub Actions, Jenkins, or
    similar) is required.
  - Experience with AI systems testing, particularly LangChain,
    CrewAI, or LlamaIndex, is preferred.
  - Experience with performance testing or benchmarking AI-
    driven applications is preferred.
  
  Knowledge, Skills, & Abilities
  
  - Excellent interpersonal skills and ability to work
    effectively in a collaborative team environment.
  - Excellent technical writing, communication, and
    organizational skills.
  - Demonstrated deep technical knowledge of test automation
    principles, frameworks, and tooling.
  - Strong knowledge of API testing frameworks (e.g., Pytest,
    Postman, REST Assured).
  - Familiarity with observability and monitoring tools
    (Prometheus, Grafana, OpenTelemetry).
  - Strong analytical and problem-solving skills, with
    experience validating asynchronous or distributed systems.
  - Strong leadership skills and the ability to influence
    quality standards across engineering teams.
  
  Working Environment / Physical Environment
  
  - This position will either work in El Segundo, CA or remotely
    based on the candidate’s location
  - Regular work schedule is Monday – Friday, within standard
    business hours.  Flexibility is available with manager
    approval.
  - Must possess mobility to work in a standard office setting
    and to use standard office equipment, including a
    computer.
  - Lift and carry materials weighing up to 20 pounds
  - This position requires extensive use of computer keyboards
    and monitors.
  
  This position is eligible for a discretionary bonus and
  equity award. The annual base pay range for this position is
  below. The specific rate will depend on the successful
  candidate’s qualifications, prior experience as well as
  geographic location.
  
  
  
  National Market (all markets unless identified as Premium)
  
  $130,500 (entry-level qualifications) to $145,000 (highly
  experienced) annually
  
  
  
  Premium Market (Premium markets include Los Angeles, San
  Diego, San Francisco, New York City, Chicago, & Boston)
  
  $135,000 (entry-level qualifications) to $150,000 (highly
  experienced) annually
  
  
  
  The application window is anticipated to close on 60 days
  from when it is posted or sooner if the position is filled
  or closed.
  
