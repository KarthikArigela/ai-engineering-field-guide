description: |
  In the Technology division, we leverage innovation to build
  the connections and capabilities that power our Firm,
  enabling our clients and colleagues to redefine markets and
  shape the future of our communities. This is a Software
  Engineering  position at the Director level, which is part
  of the job family responsible for developing and maintaining
  software solutions that support business needs.
  
  Morgan Stanley is an industry leader in financial services,
  known for mobilizing capital to help governments,
  corporations, institutions, and individuals around the world
  achieve their financial goals. Interested in joining a team
  that’s eager to create, innovate and make an impact on the
  world? Read on.
  
  About Us
  
  The Firm Market Risk Technology Team develops software to
  measure and monitor Market Risk and Capital for the Firm’s
  global portfolio. We are responsible for designing and
  implementing technology solutions that calculate and assess
  the Market Risk of the Firm. Our systems support daily risk
  simulations and analytics that estimate potential losses
  across different time horizons.
  
  We work closely with Risk Managers, Market Risk Analytics
  teams, Senior management, and various regulatory bodies
  globally.  Market Risk team constantly updates its current
  suite of risk management tools, frameworks and processes or
  builds new ones to meet frequently changing business and
  regulatory landscape.
  
  Role Overview  As a Market Risk Technology Director, you
  will lead the development of Python-based AI applications
  and frameworks that empower business teams to onboard their
  own datasets and seamlessly leverage advance tooling. Your
  solutions will provide a platform for intuitive data access,
  AI-driven insights and automation working closely with the
  Market Risk business teams to help gain productivity and
  make faster, smarter decisions.
  
  You will design and implement scalable solutions for risk
  data processing, RESTful services, and agentic workflows
  that support “talk to data” interfaces and Generative AI
  driven commentary. You will own technical direction,
  architectural decisions, and be accountable for production,
  reliability, and evolution of AI systems used by Market Risk
  teams. This is a hands on role requiring strong technical
  expertise in Python, Gen-AI and modern engineering
  practices.
  
  What you’ll do in the role:
  
  - Build and own Python-based AI applications leveraging
    natural language interfaces, Large Language Models, data
    analytics, and automation.
  - Deliver innovative applications and tools that allow
    business users onboard and manage their datasets and
    leverage self-service analytics.
  - Architect and manage RESTful services for large-scale
    enterprise solutions using open standards.
  - Optimize data ingestion and processing pipelines for
    efficiency and performance.
  - Collaborate with Firm Risk Management stakeholders to
    understand requirements and deliver AI solutions.
  - Provide technical leadership and mentorship to developers
    within the agile squad.
  
  What you’ll bring to the role:
  
  - Strong hands-on application development experience in
    Python, including building service APIs using frameworks
    such as FastAPI or Flask.
  - Proven experience designing and delivering production-grade
    AI or LLM-based applications.
  - Solid understanding of data engineering fundamentals
    including SQL, data modeling and data lifecycle
    management.
  - Hands-on experience with concurrency and performance
    optimization (multiprocessing, multithreading,
    asynchronous I/O).
  - Practitioner of unit testing, integration and performance
    testing.
  - Experience owning systems in production, including
    reliability, incident management, and continuous
    improvement.
  - Ability to set technical direction make architectural
    decisions, and mentor senior engineers.
  
  Desired Qualifications
  
  - Experience with agentic workflows, natural language or
    “talk-to-data” systems.
  - Hands-on experience with OpenTelemetry and observability
    tooling (Grafana, Prometheus).
  - Experience with cloud-native architectures, including Docker
    and Kubernetes
  - Familiarity with data streaming, messaging, or caching
    technologies (Kafka, Redis).
  - Exposure to CI/CD, DevOps, or GitOps practices (e.g.,
    Jenkins, GitHub Actions).
  
  
  Soft Skills
  
  - Strong problem-solving and analytical thinking.
  - Ability to act autonomously and make complex decisions.
  - Excellent communication and collaboration skills across
    global teams and time zones.
  
  
  Qualifications
  
  - Bachelor’s or Master’s degree in Computer Science or related
    field, or equivalent experience.
  - 5+ years of related experience.
  
  This role offers the opportunity to:
  
  - Build platforms and frameworks that transform how business
    teams interact with risk data.
  - Drive productivity improvements by enabling self-service
    onboarding and AI-powered analytics.
  - Combine Python engineering excellence with modern
    architecture and automation to deliver high-impact
    solutions.
  - Collaborate with top-tier risk professionals and influence
    firm-wide decision-making.
  
  WHAT YOU CAN EXPECT FROM MORGAN STANLEY:
  
   At Morgan Stanley, we raise, manage and allocate capital
  for our clients – helping them reach their goals. We do it
  in a way that’s differentiated – and we’ve done that for 90
  years.  Our values - putting clients first, doing the right
  thing, leading with exceptional ideas, committing to
  diversity and inclusion, and giving back - aren’t just
  beliefs, they guide the decisions we make every day to do
  what's best for our clients, communities and more than
  80,000 employees in 1,200 offices across 42 countries. At
  Morgan Stanley, you’ll find an opportunity to work alongside
  the best and the brightest, in an environment where you are
  supported and empowered. Our teams are relentless
  collaborators and creative thinkers, fueled by their diverse
  backgrounds and experiences. We are proud to support our
  employees and their families at every point along their
  work-life journey, offering some of the most attractive and
  comprehensive employee benefits and perks in the industry.
  There’s also ample opportunity to move about the business
  for those who show passion and grit in their work.
  
  To learn more about our offices across the globe, please
  copy and paste https://www.morganstanley.com/about-
  us/global-offices into your browser.
  
  Expected base pay rates for the role will be between
  $120,000 and $165,000 per year at the commencement of
  employment.  However, base pay if hired will be determined
  on an individualized basis and is only part of the total
  compensation package, which, depending on the position, may
  also include commission earnings, incentive compensation,
  discretionary bonuses, other short and long-term incentive
  packages, and other Morgan Stanley sponsored benefit
  programs.
  
  Morgan Stanley is an equal opportunity employer committed to
  building and maintaining a workforce that is diverse in
  experience and background.  Our recruiting efforts reflect
  our strong commitment to a culture of inclusion, where
  individuals are hired, developed, and advanced based on
  their skills and talents.
  
  Our workforce reflects a broad cross-section of the global
  communities in which we operate, bringing a variety of
  backgrounds, talents, perspectives, and experiences.
  
  For more information, please visit:
  https://www.morganstanley.com/people-opportunities/eeo.
