description: |
  Alloy is where you belong!
  
  Alloy helps solve the identity risk problem for companies
  that offer financial products by enabling them to outpace
  fraud and confidently serve more people around the world.
  Over 800 of the world’s largest financial institutions and
  fintechs turn to Alloy to take control of fraud, credit, and
  compliance risk, and grow with the clearest picture of their
  customers.
  
  Through our values: Be Bold, Go Fast, Collaborate, and
  Celebrate Our Differences, we are creating a workplace where
  you can grow, thrive, and belong. See how we’ve been
  continuously recognized and named one of Inc. Magazine’s
  Best Workplaces, Forbes America’s Best Startup Employers,
  Best Fintech to Work for by American Banker, year after
  year.
  
  Check out our investors and read more about us here.
  
  About the team
  
  Alloy is looking for an Applied AI Engineer to sit within
  our centralized Ops team and drive meaningful AI
  transformation across the entire business. This is a high-
  impact, cross-functional role for someone who loves finding
  inefficiencies, designing elegant solutions, and enabling
  people to work smarter.
  
  You'll be the connective tissue between cutting-edge AI
  capabilities and the practical, day-to-day needs of our
  teams — identifying where automation and AI can reduce toil,
  accelerate workflows, and unlock capacity for higher-value
  work.
  
  Alloy operates in a hybrid-work environment. We look to
  foster collaboration and community by having our local
  employees onsite three days a week.
  
  What you'll be doing
  
  - Identify high-impact automation and AI opportunities across
    the business, prioritized against strategic goals
  - Design, build, and deploy AI-powered solutions — from
    lightweight automations to more sophisticated LLM-based
    workflows
  - Partner with teams across Alloy to understand their pain
    points and translate them into scalable technical
    solutions
  - Champion and enable AI adoption across the organization —
    running enablement sessions, building internal tooling,
    and helping teams become more self-sufficient
  - Establish best practices, tooling standards, and frameworks
    for how Alloy builds and evaluates AI solutions
  - Operate the internal stack like a product, running
    experiments, creating feedback loops, and continuously
    improving productivity across the whole organization.
  - Measure the impact of what you ship and continuously iterate
  
  Who we’re looking for
  
  - Hands-on experience building with LLMs and AI APIs (e.g.
    OpenAI, Anthropic, etc.) in production environments
  - Strong engineering fundamentals — comfortable writing clean,
    maintainable code in Python or similar
  - Experience with workflow automation tools (e.g. Zapier,
    Make, n8n, or custom-built pipelines)
  - A business-minded approach: you think about ROI and impact,
    not just technical elegance
  - Excellent communication skills — you can explain complex AI
    concepts to non-technical stakeholders and bring people
    along on the journey
  - Comfort with ambiguity and a bias toward shipping
  
  Nice to have
  
  - Experience in an ops, revenue operations, or business
    systems role
  - Familiarity with data tooling (SQL, dbt, etc.)
  - Background in a fast-growing startup environment
  
  You'll have a rare combination of autonomy and breadth —
  working across every team at Alloy, with a direct line to
  business impact. This isn't a role where you'll be handed a
  backlog. You'll define the roadmap, build the solutions, and
  see the results.
  
  We're a lean team, so your impact will be felt immediately,
  and opportunities will grow as the company scales up. If
  this all sounds like a good fit for you, why not join us?
  
  Alloy is committed to fair and equitable compensation
  practices. Below is the anticipated starting base
  compensation range for this role; however, pay may vary
  depending on job-related knowledge, in-demand skills,
  relevant experience, and/or geography. In addition to a
  competitive base salary, this position is also eligible for
  equity awards in the form of stock options (ISOs) as well as
  a competitive total benefits package. Your recruiter will be
  happy to walk you through the details and what compensation
  could look like for you specifically!
  
  This position has a salary range of $150,000 to $180,000.
  
  Benefits and Perks
  
  - Unlimited PTO and flexible work policy
  - Employee stock options
  - Medical, dental, vision plans with HSA (monthly employer
    contribution) and FSA options
  - 401k with 100% match up to 4% of annual employee
    compensation
  - Eligible new parents receive 16 weeks of paid parental leave
  - Home office stipend for new employees
  - Annual Learning & Development annual stipend
  - Well-being benefits include access to ClassPass, OneMedical,
    UrbanSitter, and Spring Health
  - Hybrid work environment: employees are expected to work
    Tuesdays through Thursdays from our HQ in Union Square,
    Manhattan. Tasty lunches catered from a variety of local
    restaurants and frequent employee-organized cultural
    events contribute to our positive office energy. On
    Monday/Friday most employees Zoom into work from home
    while some take advantage of the quieter office.
  
