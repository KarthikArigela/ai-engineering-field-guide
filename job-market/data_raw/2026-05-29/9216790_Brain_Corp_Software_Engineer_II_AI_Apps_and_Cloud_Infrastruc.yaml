title: Software Engineer II, AI Apps and Cloud Infrastructure
company: Brain Corp
location: USA
remote: true
work_type: FULL_TIME
description: |
  Brain Corp is a San Diego, California, USA-based AI company
  creating transformative core technology for the robotics
  industry. Our purpose is to create autonomous technology
  that helps the real world work better. Brain's robotic and
  AI solutions help retailers ensure that the right product is
  on the right shelf at the right price, in a clean
  environment. Through the BrainOS® Robotics Platform, which
  powers the largest global fleet of the Autonomous Mobile
  Robots (AMRs) in operation in commercial public spaces,
  Brain Corp delivers insightful and efficient automated
  solutions in both commercial floor cleaning and inventory
  management, empowering organizations and their employees to
  achieve more. Brain Corp currently powers more than 30,000
  AMRs, representing the largest fleet of its kind in the
  world. Brain Corp is funded by the SoftBank Vision Fund,
  Clearbridge, and Qualcomm Ventures.
  
  Named a top workplace by the San Diego Union Tribune and USA
  today in 2025, we make life-changing impacts through
  innovation, helping workers globally unlock thier abilties
  in orchestration with intelligent machinges.
  
  Position Overview:
  
  As a member of the Software Engineering team, theSoftware
  Engineer II, Apps and Cloud Infrastructure will play a
  crucial role on our AI team. As a key driver on the team,
  you will spearhead feature development aimed at massively
  scaling our AI infrastructure, fine-tuning cloud efficiency,
  and delivering services that power our next phase of growth.
  
  Essential Job Functions:
  
  - Develop, and maintain scalable and reliable cloud
    infrastructure on BrainOS Google Cloud Platform (GCP).
  - Collaborate with the Applied ML team and R&D team to design
    and implement efficient cloud services, ensuring high data
    quality and integrity.
  - Develop APIs and services to facilitate seamless integration
    between the sense cloud platform and various web and
    robotic applications.
  - Work closely with the web and application teams to
    understand their requirements and provide technical
    guidance and support.
  - Participate in testing activities, including unit testing,
    integration testing, and system testing, to ensure the
    reliability, performance, and quality of the cloud
    platform.
  - Monitor and optimize cost, performance and reliability of
    the sense cloud platform, identifying and resolving any
    issues or bottlenecks.
  - Stay up-to-date with the latest advancements in cloud
    technologies, sharing knowledge and best practices with
    the team.
  - Assist in other duties and responsibilities as assigned.
  
  
  
  Required Education and Work Experience:
  
  - Bachelor’s Degree in Computer Science, Software Engineering
    or a related field.
  - 2-4 years of demonstrated experience in software
    development.
  - Experience in cloud engineering, with a focus on Google
    Cloud Platform (GCP).
  
  Required Knowledge, Skills, Abilities and Other
  Characteristics
  
  - Familiar with programming languages such as Go, Python, and
    TypeScript, with a demonstrated ability to write clean,
    maintainable code and using version control systems like
    git.
  - Familiarity with cloud infrastructure and related
    technologies (compute, storage, networking, etc.) on GCP.
  - Experience with infrastructure-as-code tools like Pulumi or
    similar technologies.
  - Familiar with designing and implementing scalable data
    engineering workflows and data pipelines.
  - Familiar with containerization technologies such as Docker
    and orchestration frameworks like Kubernetes.
  - Understanding of RESTful APIs and the ability to design and
    develop them.
  - Experience leveraging GenAI tools and coding assistants to
    accelerate development, enhance code quality, and automate
    routine engineering tasks.
  - Strong problem-solving and debugging skills, with a
    proactive and results-oriented approach.
  - Strong communication and collaboration skills, with the
    ability to work effectively in a team environment.
  - A passion for robotics, automation and technology.
  - Ability to multitask and flexibility to adjust to changing
    priorities.
  
  
  
  Things that make a difference:
  
  - Master’s Degree  in Computer Science, Software Engineering
    or a related field.
  - Experience with implementing and managing ML inference
    services at scale.
  - Experience with robotic software development or working with
    robotics-related technologies.
  - Familiar with CI/CD pipelines and related tools (e.g.,
    Jenkins, GitLab CI/CD).
  - Knowledge of event-driven architectures and messaging
    systems (e.g., Pub/Sub, Kafka).
  - Familiarity of Agile methodologies
  - Knowledge of all phases of the software development
    lifecycle
  
  
  
  Physical Demands:
  
  
  
  The physical demands described here are representative of
  those that must be met by an employee to successfully
  perform the essential functions of this job. Reasonable
  accommodations may be made to enable individuals with
  disabilities to perform the essential functions. Essential
  functions may require maintaining the physical condition
  necessary for sitting, walking or standing for periods of
  time; operating a computer and keyboard; use of hands to
  finger and grasp; talk and hear at normal room levels;
  visual acuity to determine the accuracy, neatness, and
  thoroughness of the work assigned or to make general
  observations of facilities or structures; push or pull up to
  20 pounds.
  
  
  
  Work Environment:
  
  
  
  The work environment characteristics described here are
  representative of those an employee encounters while
  performing the essential functions of this job. The noise
  level in the work environment is usually quiet to moderate.
  Employees are exposed to the typical office environment with
  computers, printers and telephones.
  
  Salary Range:
  
  The anticipated salary for candidates who will work in San
  Diego, California is $130,000. The final salary offered to a
  successful candidate will be dependent on several factors
  that may include but are not limited to the type and length
  of experience within the job, type and length of experience
  within the industry, education, etc. Brain Corp is a multi-
  state employer and this salary range may not reflect
  positions that work in other states.
