description: |
  Who are we?
  
  At Finastra, we’re a global leader in financial services
  software, dedicated to expanding access to financial
  services and shaping what’s next for the industry. Our
  technology powers mission‑critical solutions across Lending,
  Payments and Universal Banking, supporting over 7,000
  customers, including 80% of the world’s top 50 banks, in
  more than 110 countries.
  
  What will you contribute?
  
  As part of the Head of Payment Services Strategy &
  Architecture team, the Full Stack Gen AI Engineer designs,
  develops, analyzes, and maintains high-quality software
  product applications.  This position is located in Pune
  office.
  
  Responsibilities & Deliverables: We are seeking a skilled
  and motivated Full Stack GenAI Developer with 2–5 years of
  professional experience. The ideal candidate will possess
  strong full‑stack engineering expertise along with hands‑on
  experience in Generative AI, LLM integration, prompt
  engineering, and modern cloud‑native development. This role
  involves working across the entire application
  lifecycle—design, development, deployment, and optimization
  of AI‑driven solutions
  
  Key Responsibilities Generative AI:
  
  • Develop, fine‑tune, and integrate LLM‑based solutions
  (OpenAI, Azure OpenAI, Llama, Gemini, etc.).
  
  • Build end‑to‑end pipelines for prompt engineering, RAG
  (Retrieval‑Augmented Generation), embedding workflows, and
  model evaluation.
  
  • Implement and maintain vector databases such as Pinecone,
  Milvus, ChromaDB, Weaviate, or cloud‑native vector stores.
  
  • Utilize frameworks such as LangChain, LlamaIndex, and
  Hugging Face for AI workflow orchestration.
  
  Full Stack Development:
  
  • Design and develop scalable, secure, and high‑performance
  web applications. • Frontend: React.js, Next.js, Angular, or
  Vue
  
  • Backend: Python (FastAPI, Flask).
  
  • Build and integrate RESTful APIs, microservices, and
  event‑driven components.
  
  • Incorporate AI workflows seamlessly into both frontend and
  backend systems.
  
  Required Skills & Experience:
  
  • 2–5 years of experience in full‑stack development. •
  Strong proficiency in Python and JavaScript/TypeScript.
  
  • Hands‑on experience working with LLMs, GenAI APIs, or RAG
  pipelines.
  
  • Experience with modern frontend frameworks (React,
  Next.js, Angular).
  
  • Expertise in building and consuming REST APIs.
  
  • Practical understanding of vector databases, embeddings,
  and AI orchestration frameworks.
  
  • Experience working with Azure, AWS, or GCP, including
  containerization (Docker/Kubernetes).
  
  • Understanding of scalable software architecture and system
  design principles.
  
  Good to Have:
  
  • Experience with fine‑tuning using LoRA, QLoRA, or PEFT
  methods.
  
  We are proud to offer a range of incentives to our employees
  worldwide. These benefits are available to everyone,
  regardless of grade, and reflect the values we uphold:
  
  ·       Flexibility: Enjoy unlimited vacation, based on your
  location and business priorities. Hybrid working
  arrangements, and inclusive policies such as paid time off
  for voting, bereavement, and sick leave.
  
  ·       Well-being: Access Confidential one-on-one therapy
  through our Employee Assistance Program, find support from
  our network of Wellbeing Champions and Gather Groups, and a
  calendar of monthly events and initiatives designed to help
  you thrive - Inside and Outside of work.
  
  ·       Medical, life & disability insurance, retirement
  plan, lifestyle and other benefits*
  
  ·       Sustainability: Benefit from paid time off for
  volunteering and donation matching.
  
  ·       DEI: Participate in multiple DE&I groups for open
  involvement (e.g., Count Me In, Culture@Finastra,
  Proud@Finastra, Disabilities@Finastra, Women@Finastra).
  
  ·       Career Development: Access online learning and
  accredited courses through our Skills & Career Navigator
  tool.
  
  ·       Recognition: Be part of our global recognition
  program, Finastra Celebrates, and contribute to regular
  employee surveys to help shape Finastra and foster a culture
  where everyone is engaged and empowered to perform at their
  best.
  
  *Specific benefits may vary by location.
  
  At Finastra, each individual is unique, bringing their own
  ideas, thoughts, cultural beliefs, backgrounds, and
  experiences together. We learn from one another, embrace and
  celebrate our differences, and create an environment where
  everyone feels safe to be themselves.
  
  Be unique, be exceptional, and help us make a difference at
  Finastra!
