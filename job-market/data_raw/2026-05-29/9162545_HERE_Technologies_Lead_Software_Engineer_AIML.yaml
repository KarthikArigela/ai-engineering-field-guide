title: Lead Software Engineer (AI/ML)
company: HERE Technologies
location: Berlin, DEU
work_type: FULL_TIME
company_size: 6,000 Employees
description: |
  What's the role?
  
  We are looking for a highly experienced engineer to build
  next-generation agentic AI solutions for the logistics
  industry. The systems developed by this team optimize
  deliveries at scale—improving driver efficiency, increasing
  delivery reliability, reducing operational costs, and
  lowering environmental impact.
  
  In this role, you will work on complex intelligent agent
  systems leveraging HERE location and routing APIs to solve
  real-world challenges in last-mile and middle-mile
  logistics.
  
  You will operate as a Lead-level Individual Contributor (no
  people management) within a team of experienced engineers.
  This role focuses on deep technical ownership, solving
  ambiguous and complex problems, and delivering production-
  grade systems. You are expected to act as a technical expert
  at the problem and system level driving design decisions,
  challenging assumptions, and raising the engineering bar
  across the team.
  
  This is a hands-on role with a strong emphasis on building
  scalable, production-grade AI systems and pushing the
  technical boundaries of what the team can achieve.
  
  What You’ll Do:
  
  - Design and build production-grade AI systems, including LLM-
    based agents, RAG pipelines, and integrations with HERE
    APIs and external data systems
  - Take end-to-end ownership of complex technical problems from
    exploration and prototyping to production deployment and
    optimization
  - Write high-quality, maintainable, and performant code in
    Python and/or TypeScript, setting a high bar for
    engineering excellence
  - Contribute significantly to system design and architecture
    discussions, especially in areas such as agent
    orchestration, geospatial data processing, and distributed
    systems
  - Prototype new AI approaches rapidly and convert them into
    robust, scalable solutions
  - Work closely with product managers, domain experts, and
    engineers to translate logistics workflows into efficient
    technical implementations
  - Drive improvements in system reliability, performance,
    observability, and cost efficiency
  - Leverage modern AI-assisted development workflows (e.g.,
    coding agents) to accelerate development and improve code
    quality
  - Act as a technical sounding board for peers, challenging
    assumptions, refining designs, and raising the overall
    technical quality of the team
  
  Who are you?
  
  - 7+ years of software engineering experience with a strong
    track record of building complex, production-grade systems
  - Deep hands-on expertise in Python, with strong experience in
    backend systems and APIs
  - Strong experience designing and building LLM-based systems
    and agent architectures (e.g., RAG, tool-using agents,
    orchestration frameworks)
  - Proven ability to take AI systems from prototype to
    production, with focus on scalability, reliability, and
    maintainability
  - Strong system design skills, including experience with
    distributed systems and integration of AI, data platforms,
    and APIs
  - Experience with cloud infrastructure (AWS/ GCP or Azure) and
    modern CI/CD practices
  - Experience with frameworks such as LangChain, AutoGen, or
    similar, and experience with AI-assisted development tools
  - Ability to independently drive complex technical initiatives
    with minimal guidance
  - Strong problem-solving mindset with attention to detail and
    quality
  - Effective collaboration and communication skills in cross-
    functional environments
  
  What We Offer:
  
  - A great work-life balance
  - Hybrid model of work
  - Challenging problems to solve
  - Collaborative and encouraging colleagues
  - Opportunities to learn, grow and develop: company
    hackathons, technical talks, and trainings
  - Regular feedbacks
  - 30 paid vacation days
  - Flexible working hours
  - Competitive salary plus bonus
  - BVG company ticket
  - German language course
  - Access to Insight Timer app for sessions on meditation,
    yoga, etc.
  - Diverse team of fantastic & talented people from 60+
    countries worldwide.
  - Brown bag talks, team events, BBQ on the rooftop and more!
  
  Change is HERE. Apply Now!
  
  #LI-AK8   #LI-HYBRID
  
  Life at HERE in Poland comes with a competitive total
  rewards package designed to support your health, wellbeing,
  and performance. This includes a base salary, a Short-Term
  Incentive (STI) bonus (percentage based on role), a creative
  tax advantage for eligible positions, private medical care
  (including dental), life insurance, a meal allowance, vision
  reimbursement, a remote work allowance (if applicable),
  access to MyBenefit and Multisport programs, and various
  wellbeing initiatives. Paid time off, sick leave, and
  parental leave are provided in accordance with the Polish
  Labor Code.
  
  As part of HERE Technologies employment process, candidates
  will be required to successfully complete a pre-employment
  screening process. This offer and any related claims are
  subject to the successful completion of a pre-employment
  screening. This will involve employment, education, and
  criminal verification if applicable.
  
  HERE is an equal opportunity employer. We evaluate qualified
  applicants without regard to race, color, age, gender
  identity, sexual orientation, marital status, parental
  status, religion, sex, national origin, disability, veteran
  status, and other legally protected characteristics.
  
  Who are we?
  
  HERE Technologies is a location data and technology platform
  company. We empower our customers to achieve better outcomes
  – from helping a city manage its infrastructure or a
  business optimize its assets to guiding drivers to their
  destination safely.
  
  At HERE we take it upon ourselves to be the change we wish
  to see. We create solutions that fuel innovation, provide
  opportunity and foster inclusion to improve people’s lives.
  If you are inspired by an open world and driven to create
  positive change, join us. Learn more about us on our YouTube
  Channel.
