description: |
  The Opportunity:
  
  As a Senior Developer, you’ll have significant autonomy to
  shape how some of the world’s largest telecom operators
  communicate with  consumers and detect issues across their
  networks. You’ll help evolve the platform into a proactive,
  intelligent system built around Observe - Think - Act
  workflows, designing autonomous, AI‑driven operations that
  surface insights, trigger actions, and streamline complex
  network processes at scale.
  
  
  
  You’ll work across the full stack, building intuitive
  interfaces in React and architecting resilient Python
  backend systems capable of handling massive volumes of
  time‑series telemetry. You’ll join a dynamic, experienced
  global product and engineering team, collaborating with
  specialists across mobile SDKs, cloud platforms, and
  large‑scale distributed systems, while working directly with
  global customers.
  
  If you’re excited by the challenge of building intelligent
  systems, solving complex data problems, and driving
  meaningful impact at global scale, this role offers the
  scope and technical depth to do your best work.
  
  Key Responsibilities:
  
  - Full-Stack Development: Develop and maintain robust,
    scalable web applications using React, Redux, and modern
    backend frameworks.
  - Modernize Workflows: Move the platform from reactive
    reporting to proactive operations by implementing
    "Observe-Think-Act" loops for network outage detection and
    communication.
  - Maintain Technical Quality: Write clean, maintainable, and
    efficient code while conducting high-signal code reviews
    to elevate engineering standards.
  - Collaborate Cross-Functionally: Work closely with Product
    teams to translate emerging AI capabilities into high-
    performance features for our global operator clients.
  - AI ‘Features’ Development: Architect and deploy AI native
    operations, specifically building autonomous systems for
    complex operational workflows.
  - Scale Data Processing: Help maintain and optimize backend
    services capable of handling high-volume network telemetry
    and time-series data.
  
  
  
  Job Qualifications:
  
  - 5 to 8 years of professional software engineering
    experience. Experience in mentoring or leadership.
  - Expert proficiency in Python (FastAPI or Django) and
    experience designing scalable RESTful APIs.
  - Proficient in React and Redux with hands-on experience
    building complex, data-heavy web applications.
  - Hands-on experience using AWS to build and scale web
    applications, including containerization
    (Docker/Kubernetes).
  - Systems Thinker: Strong ability to break down complex manual
    problems into deliverable, automated technical sub-tasks.
  - PLUS: AI Frameworks: Exposure to tools like LangChain,
    LangGraph, or LlamaIndex.
  - PLUS: Data Privacy: Experience with anonymization techniques
    and PII protection (GDPR).
  - PLUS: Domain Knowledge: Understanding of network monitoring,
    telecommunications data, or performance testing.
  
  About
  
   Ookla® is a global leader in connectivity intelligence,
  offering unparalleled network insights through the combined
  expertise of Speedtest®, Downdetector®, RootMetrics®, and
  Ekahau®. Ookla’s complementary datasets combine crowdsourced
  and controlled, public and private collection methods, QoS
  and QoE metrics, and more to unlock correlations and
  actionable insights — helping organizations optimize
  networks, enhance digital experiences, and create better
  connected experiences for end-users.
  
  Our team is a group of people brought together through
  passion and inspired by possibility. We are looking for team
  members who love solving problems, are motivated by
  challenges, and enjoy turning clever ideas into exceptional
  products. When you work for us, you are using Ookla data and
  insights to advance our mission of better connectivity for
  all.
  
  
  
  About Ziff Davis
  
  Ziff Davis (NASDAQ: ZD) is a vertically focused digital
  media and internet company whose portfolio includes leading
  brands in technology, shopping, gaming and entertainment,
  connectivity, health, cybersecurity, and martech. Today,
  Ziff Davis is focused on seven key verticals – Technology,
  Connectivity, Shopping, Entertainment, Health & Wellness,
  Cybersecurity and Marketing Technology.  Its brands include
  IGN, Mashable, RetailMeNot, PCMag, Humble Bundle,
  Spiceworks, Ookla (Speedtest), RootMetrics, Everyday Health,
  BabyCenter, Moz, iContact and Vipre Security.
  
  
  
  Our Benefits
  
  Ookla offers competitive salaries in addition to robust,
  health and wellness-focused benefits.  We are committed to
