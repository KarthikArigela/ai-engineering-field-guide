description: |
  The Opportunity As a Risk Architecture- Agentic AI and
  Machine Learning Developer- Senior Associate, you will play
  a pivotal role in transforming raw data into actionable
  insights, enabling informed decision-making and driving
  business growth. Within our Risk Consulting practice, you
  will leverage advanced technologies and techniques to design
  and develop robust data solutions for clients. Your work
  will involve applying data, algorithms, and software
  engineering to build and deploy AI and Machine Learning
  solutions at scale, focusing on designing AI systems, data
  wrangling, and software implementation. As a Senior
  Associate, you will focus on building meaningful client
  connections and learning how to manage and inspire others.
  You will navigate increasingly complex situations, growing
  your personal brand and deepening your technical skills. You
  are expected to anticipate the needs of your teams and
  clients, delivering quality work while embracing increased
  ambiguity. This role offers the opportunity to use a broad
  range of tools and methodologies to generate new ideas and
  solve problems, while developing a deeper understanding of
  the business context and how it is evolving.
  Responsibilities
  - Designing and implementing AI and machine learning solutions
    to transform raw data into actionable insights
  - Developing scalable AI systems using advanced algorithms and
    software engineering techniques
  - Collaborating with clients to understand their needs and
    deliver tailored data solutions
  - Utilizing data wrangling and integration skills to prepare
    data for AI model deployment
  - Applying machine learning libraries such as TensorFlow and
    Scikit-Learn to enhance model performance
  - Conducting complex data analysis to inform decision-making
    and drive business growth
  - Building and maintaining data pipelines and infrastructure
    to support AI initiatives
  - Leveraging programming languages like Python and Java for AI
    system development
  - Engaging in continuous learning to stay updated with the
    latest AI and machine learning advancements
  - Mentoring junior team members and guiding them in AI project
    execution
  What You Must Have
  - At least a Bachelor's degree
  - At least 2 years of experience
  What Sets You Apart
  - Preference for at least one of the following fields of
    study: Management Information Systems, Computer and
    Information Science, Systems Engineering, Mathematics,
    Engineering, Electrical Engineering, Chemical Engineering,
    Industrial Engineering, Mathematics, Statistics, or
    Mathematical Statistics, Data
    Processing/Analytics/Science, Artificial Intelligence and
    Robotics
  - At least one of the following: Certifications aligned to
    data engineering, machine learning, and cloud platforms,
    including AWS, Google Cloud, Microsoft Azure, Databricks,
    Snowflake, or related data and AI credentials
  - Utilizing AI implementation and machine learning libraries
    like TensorFlow and Scikit-Learn
  - Demonstrating proficiency in programming languages such as
    Python and Java
  - Excelling in complex data analysis and data modeling
    techniques
  - Navigating ambiguity while building meaningful client
    connections
  - Developing insights through data interpretation and
    analytical thinking
