description: |
  Thanks for your interest in Success Academy! Running a
  large, fast-growing, and high-performing network of public
  charter schools takes a village - families, children,
  teachers, staff and faculty, advocates, and supporters
  alike. We are growing fast in New York and expanding to
  Florida, and we would love to welcome you to our community!
  We work tirelessly every day to ensure children have access
  to a fun, rigorous, whole-child education regardless of zip
  code or economic status. When you join SA, you play a part
  in giving every student who walks through our doors a fair
  shot at reaching his or her potential.
  
  As the fastest growing, highest-performing charter school
  network in New York State, Success Academy is reimagining
  K-12 public education. Nationally recognized for our
  innovative, whole-child school model and outstanding
  academic results, Success Academy educators are empowering
  children from all backgrounds with the knowledge, skills,
  and self-belief to succeed in college and in life. We now
  need a results-driven AI Software Engineer/ Integration
  Specialist to join our AI Enablement team.
  
  Department
  
  The Technology Division at Success Academy is the chief
  provider of technology infrastructure, application services,
  security, and support. The Division partners with teams
  across the organization to equip students, teachers,
  leaders, and staff with the innovative technology tools and
  know-how necessary to achieve academic and operational
  excellence.
  
  We are looking for an AI Software Engineer to play a
  critical role in connecting AI tools with school systems.
  This role ensures that AI-powered solutions seamlessly
  integrate with existing School Information Systems (SIS),
  Learning Management Systems (LMS), and other educational
  technologies.
  
  The ideal candidate has a strong background in software
  integration, API development, automation, and cloud-based
  solutions. They should be comfortable working with education
  technology platforms while designing scalable, automated
  workflows to enhance school operations using AI.
  
  Requirements:
  
  - 4+ years of experience in software integration, API
    development, or automation engineering.
  - Experience working with SIS, LMS, and education technology
    platforms.
  - Strong proficiency in API development, automation workflows,
    and event-driven architectures.
  - Knowledge of cloud-native integration tools in AWS, GCP, or
    Azure.
  - Excellent problem-solving skills and an automation-first
    mindset.
  - Strong ability to collaborate with AI, cloud, and data
    engineering teams to create scalable AI-driven solutions.
  - Familiarity with LLMs and AI-powered automation is a plus.
  
  Responsibilities:
  
  - Design and implement integrations between AI models and
    school systems (SIS, LMS, student data platforms, and
    assessment tools).
  - Work with common SIS & LMS platforms such as PowerSchool,
    Infinite Campus, Blackbaud, Canvas, Moodle, Google
    Classroom, and Microsoft Teams for Education.
  - Develop middleware, APIs, and automation scripts to enable
    AI-enhanced workflows for grading, student engagement
    analysis, and predictive insights.
  - Build, deploy, and manage RESTful APIs, GraphQL APIs, and
    Webhooks to enable seamless communication between AI and
    school infrastructure.
  - Automate data extraction, transformation, and
    synchronization between systems using ETL pipelines and
    API-driven workflows.
  - Develop integrations with LLM-based AI assistants, chatbots,
    and recommendation engines to enhance learning
    experiences.
  - Leverage low-code and no-code automation tools where
    applicable for rapid deployment of solutions.
  - Ensure real-time data flow between AI tools and student
    management systems using Pub/Sub, Kafka, or event-driven
    architectures.
  - Implement secure authentication and authorization protocols
    (OAuth 2.0, SAML, JWT) to protect student and faculty
    data.
  - Ensure compliance with FERPA and other education data
    privacy regulations.
  - Work with identity and access management (IAM) solutions to
    control AI system permissions.
  - Work closely with AI teams, data engineers, and DevOps to
    deploy integrations in AWS and GCP.
  - Develop serverless functions (AWS Lambda, Google Cloud
    Functions, Azure Functions) for lightweight, scalable
    automation.
  - Implement event-driven architectures using Step Functions,
    Pub/Sub, and Webhooks.
  - Collaborate with educators and administrators to define
    integration requirements and automation opportunities.
  
  Technical Stack & Tools:
  
  Integration & API Development:
  
  - RESTful APIs, GraphQL, gRPC
  - OAuth 2.0, JWT, SAML, OpenID Connect
  - Postman, Swagger (OpenAPI), API Gateway
  
  Cloud & Infrastructure:
  
  - AWS (Lambda, Step Functions, API Gateway, EventBridge, S3,
    DynamoDB)
  - GCP (Cloud Functions, Pub/Sub, Firestore, BigQuery)
  - Azure (Azure Functions, Event Grid, Cosmos DB)
  
  Automation & Data Pipelines:
  
  - Python, Node.js, FastAPI, Flask, Express.js
  - ETL tools (Talend, dbt)
  - Messaging & Streaming: Kafka, RabbitMQ, Redis Pub/Sub
  
  Security & Compliance:
  
  - IAM & Role-Based Access Control (RBAC)
  - Data encryption, secure API access
  - Compliance with FERPA
  
  Exact compensation may vary based on skills and experience.
  This position is not bonus eligible.
  
  Compensation Range
  
  $180,000—$200,000 USD
  
