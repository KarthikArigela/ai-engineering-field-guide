description: |
  Why join Conveyor?
  
  Hi, we’re Conveyor 👋, creators of the #1 Customer Trust AI
  automation platform.
  
  We solve problems that our customers “hate with the fury of
  1000 suns” (actual quote!) - the dreaded customer security
  review and RFP processes. These are key parts of the B2B
  sales cycle, but both still involve too much time, effort,
  and mental anguish from those involved.
  
  Enter Conveyor, where our mission is to eliminate all of the
  misery from B2B customer trust with maximum automation.
  We’ve made a lot of progress – we have an awesome customer
  list whose lives we’ve significantly impacted through
  product, this year we launched the first AI agents for
  security reviews (Sue) and RFPs (Phil), and we just raised a
  $20M Series B from SignalFire and OVF! (TechCrunch) But we
  have ambitious goals and we’re looking for our next Staff AI
  Engineer to help make them a reality!
  
  The top 3 1/2 reasons you should be interested in working at
  Conveyor:
  
  - You’ll be selling a great product with a slam dunk AI use
    case while building sales processes and foundations to
    help scale the business.
  - Everyone on the team is amazing at their jobs. We care
    deeply about psychological safety, and believe that the
    ability to take risks and exist in the learning zone is
    critical to our success. This also comes with high
    accountability, which isn’t for everyone. But, you have
    the potential to have an outsize impact on the direction
    and success of the company.
  - We’re highly transparent and collaborative. Giving
    constructive, thoughtful feedback and asking hard
    questions are highly encouraged! We come together to
    figure it out when times are hard, and in celebration when
    we get our wins.1/2. Plus, we’ll even teach you how to
    saber a bottle of champagne
  
  About the Role
  
  As one of the first AI engineers on the team, this is a
  unique opportunity to shape Conveyor’s AI core capabilities,
  and create a huge impact on a critical pillar in our product
  strategy. Reporting directly to the CTO, you’ll play a
  critical role in building and optimizing our AI development
  process and further building the team.
  
  What you’ll do:
  
  - You will analyze our AI quality and performance, propose and
    experiment with new technologies and ideas, then implement
    and improve Conveyor products.
  - You will define and implement metrics and processes to
    evaluate and improve AI quality.
  - You'll autonomously manage and own individual project
    priorities, deadlines, and deliverables.
  - You’ll scope and implement project-level solutions with
    minimal guidance.
  - You’ll collaborate and pair frequently with teammates and
    peers.
  - You'll inform the product roadmap and implementation
    decisions based on feasibility.
  - You'll ensure that our product is maintainable, meaning that
    other engineers are able to contribute new functionality
    easily, and without frequent technical debt.
  - You'll partner with Product and Design to effectively plan
    new features, avoiding bottlenecks and maximizing velocity
    when it comes time to implement.
  
  What we’re looking for:
  
  We are looking for candidates with 8+ years of experience in
  technical leadership roles, with a focus on AI/ML
  technologies in recent years. Strong preference for
  experience in startup environments.
  
  Required Skills
  
  - Strong software engineering foundations, building and
    shipping products. Your designs should be performant,
    maintainable (for years, not months), and evolvable.
  - Recent experience in the AI/ML space, and specifically LLMs.
    Familiarity with key concepts, frameworks, tools and
    technologies. Experience evaluating different approaches
    and technologies, prompt engineering, evals and
    observability, RAG flows, search technologies, agent
    frameworks, etc.
  - Able to perform both research/analysis and production
    software development work
  - Curiosity and Continuous Learning: You are up to speed on
    developments in the fast-paced AI/ML world, and constantly
    thinking about how to apply new technologies and offerings
    to our real-world problems.
  - Bias for action: Startup mentality, get things done, fast
    iterations, strong problem-solving and decision-making
    capabilities. Previous experience in a small startup (or
    as a founder) is highly preferred.
  - Product Sense: You seek to understand the features you're
    working on, and actively propose positive changes.
    Collaborate with product and design to inform roadmap
    decisions.
  - Team Player: You have excellent communication skills (verbal
    and written), enjoy collaborating with others and
    mentoring team members.
  - Deliver Legendary Customer Experience: You have experience
    building and scaling products that delight real users.
  - Ownership: Strong sense of ownership and accountability,
    honor commitments and be transparent about challenges.
  
  Job Location
  
  This position is available in the United States and Canada.
  
  We are a remote-first company so you’ll be working from home
  most of the time, traveling for in person sessions a few
  times a year. Preferred location: San Francisco Bay Area
  
  Ready to join our team and have a tremendous impact? We’d
  love to hear from you. Also, we know it’s tough, but please
  try to avoid the confidence gap. You don’t have to match all
  the listed requirements exactly to be considered for this
  role.
