description: |
  Our Mission
  
  Our mission is to restore cell health and resilience through
  cell rejuvenation to reverse disease, injury, and the
  disabilities that can occur throughout life.
  
  For more information, see our website at altoslabs.com.
  
  Our Value
  
  Our Single Altos Value: Everyone Owns Achieving Our
  Inspiring Mission.
  
  Diversity at Altos
  
  Altos Labs has been named one of the Top 3 Biotech Companies
  and ranked for the second year on the Forbes 2026 Best
  Startups in America list.  At Altos, exceptional scientists
  and industry leaders from around the world work together to
  advance a shared mission. Our intentional focus is on
  Belonging, so that all employees know that they are valued
  for their unique perspectives. We are all accountable for
  sustaining a diverse and inclusive environment.
  
  What You Will Contribute To Altos
  
  Altos Labs is building a world-class AI ecosystem to solve
  the most complex problems in biology. As the demand to
  leverage new AI technologies accelerates, we are seeking a
  hands-on AI Implementation Engineer to build the foundation
  for the safe and effective adoption of AI tools across the
  company. You will play a key role in enabling our scientific
  and corporate teams by understanding requirements across all
  departments and implementing robust systems for AI tool
  configuration, evaluation, and operational intelligence.
  
  Responsibilities
  
  - Roadmap & Strategy: Collaborate with Altos leadership to
    identify requirements, develop rollout strategies, and
    maintain an enterprise AI roadmap. Provide technical
    insights and feasibility assessments on new technologies
    and integration strategies.
  - Tool Evaluation & Onboarding: Perform technical due
    diligence on new AI tools and platforms. Collaborate with
    IT, Cybersecurity, and Legal to validate security and
    compliance, ensuring a secure and standardized onboarding
    process.
  - Infrastructure & Operations: Design, build, and maintain the
    core infrastructure for our AI tools. Develop telemetry
    systems, implement strategies for managing compute
    resources, and create automated workflows for reporting on
    usage and cost.
  - Enablement & Best Practices: Develop technical
    documentation, tutorials, and best-practice guides to
    support our teams. Establish and promote standards for the
    responsible and efficient use of AI tools.
  - Reporting & Analytics: Build and manage the systems that
    provide key metrics on AI tool adoption, cost, and impact.
    Ensure data is accessible and provides actionable insights
    for technical and business stakeholders.
  
  Who You Are
  
  We are looking for a hands-on builder who is passionate
  about operationalizing the potential of AI. You are a
  pragmatic problem-solver who can take high-level objectives
  and help define clear, actionable engineering projects. You
  excel at cross-functional collaboration, working directly
  with cybersecurity, legal, and other engineering teams to
  build secure, compliant, and scalable solutions. You have a
  talent for execution and are motivated to drive technical
  initiatives from initial evaluation through to successful
  implementation. You have strong communication skills and
  feel comfortable working with staff of all levels, including
  executive leadership.
  
  Minimum Qualifications
  
  - Education: Bachelor's degree in Computer Science,
    Information Technology, Engineering, or a related field.
  - Technical Experience:
  - AI/ML Knowledge: A strong working knowledge of the current
    AI landscape, including generative AI models, platforms,
    and their enterprise applications.
  - Cross-functional Collaboration: Demonstrated ability to work
    effectively with diverse teams, including IT, security,
    legal, and research departments.
  - Communication Skills: Excellent written and verbal
    communication skills, with experience creating technical
    documentation and communicating project status.
  
  Preferred Qualifications
  
  - Direct experience with the technical integration or rollout
    of AI tools (e.g., Claude Enterprise, ChatGPT, Copilot)
    and LLM APIs.
  - Experience contributing to or managing technology governance
    and best-practice frameworks.
  - A background working in a scientific, biotech, or research-
    focused environment.
  - Familiarity with Responsible AI principles and frameworks.
  
  The salary range for Redwood City, CA:
  
  - AI Automation Engineer I: $152,600 - $195,600
  - Sr. AI Automation Engineer: $200,900 - $257,500
  
  Exact compensation may vary based on skills, experience, and
  location.
  
