description: |
  About Customuse
  
  Customuse is building an AI creative engine for image,
  video, and 3D. We bring leading AI models and pro creation
  tools into one workflow, helping creators and teams ideate,
  generate, edit, animate, texture, and produce publish-ready
  assets.
  
  We are trusted by 15M+ creators and used across gaming,
  Roblox, animation, ecommerce, product design, architecture,
  and creative teams. The next chapter is turning Customuse
  into the default creative workspace for AI-native media
  production.
  
  We are backed by Connect Ventures, Adjacent, and
  angels/operators from companies like Snap, Stripe, and
  SpaceX, with an investor network behind category-defining
  companies including Revolut and RevenueCat.
  
  Location: London, with occasional customer-facing work and
  travel where useful
  
  Type: Full-time
  
  About the role
  
  We are hiring a Forward-Deployed Engineer to work directly
  with customers and help them build with Customuse's AI
  creative technology.
  
  You will sit at the intersection of engineering, product,
  and customer success. One week you might be embedded with a
  gaming studio designing an AI asset workflow; the next, you
  might be shipping a feature, prototyping an image/video/3D
  pipeline, or turning messy customer needs into a productized
  internal tool.
  
  What you'll do
  
  - Work directly with customers to understand creative
    workflows, technical needs, and product requests
  - Build prototypes, integrations, scripts, tools, and
    production features that help customers succeed with
    Customuse
  - Translate customer feedback into clear product and
    engineering requirements
  - Rapidly iterate on AI workflows for image, video, 3D asset
    creation, customization, and deployment
  - Partner with gaming studios, creator teams, brands, and
    enterprise customers to help them adopt Customuse
    effectively
  - Debug issues across product, AI workflows, asset pipelines,
    APIs, integrations, and content delivery
  - Identify repeatable customer needs and turn them into
    scalable product features
  
  You might be a fit if
  
  - You are a product-minded engineer who likes being close to
    users and customers
  - You can build and ship quickly across the stack with
    TypeScript, JavaScript, React, Node.js, Python, or similar
  - You have hands-on experience with AI tools, APIs, agents,
    LLMs, image generation, 3D generation, video, or creative
    automation workflows
  - You communicate clearly with both engineers and non-
    technical customers
  - You can turn vague customer requests into concrete product
    decisions and distinguish one-off asks from platform
    opportunities
  - You enjoy fast iteration, customer calls, demos, debugging,
    and hands-on implementation
  
  Bonus points
  
  - Experience with 3D tools, gaming studios, Roblox, Unity,
    Unreal, Blender, UEFN, WebGL, Three.js, or asset pipelines
  - Experience in forward-deployed engineering, solutions
    engineering, founding engineering, product engineering, or
    another customer-facing technical role
  - Experience building internal tools, customer integrations,
    automation workflows, APIs, SDKs, or AI-powered prototypes
  - Background in creative software, design tools, game
    development, AI tooling, or developer platforms
  
  What we offer
  
  - Competitive salary and stock options
  - Real ownership from day one on a product used by millions of
    creators
  - Work at the intersection of AI, media creation, gaming, 3D,
    and creative tools
  - A small, ambitious team with direct feedback, high trust,
    and high standards
  - Central London office
  
  Hiring process
  
  - Screening call
  - Role-specific interview
  - Practical working session or case study
  - Culture fit interview and meet the team
  - Reference check and offer
  
  We value ambition and trajectory over years of experience.
  We move quickly and hold a high bar, but you will get real
  ownership, direct feedback, and the chance to do career-
  defining work with a small, ambitious team.
