description: |
  We Make Remote Work Remarkable • TopTalent from LatAm
  
  Hello! We are GoFasti, a Talent-as-a-Service. GoFasti
  bridges the gap between world-class developers and designers
  from LatAm and first-class companies around the globe.
  
  We need an AI Platform Engineer (Generative AI), based in
  the United States, available to work remotely. We are
  looking for someone with exceptional communication and
  relationship-building skills, who embraces changes while
  maintaining strong attention to detail. An interested and
  proactive person, who's constantly learning and improving
  their skills.
  
  Are you the one we are looking for?
  
  Responsibilities:
  
  - Design, build, and deploy scalable Generative AI platforms
    and applications.
  - Develop AI solutions leveraging AI Agents, RAG pipelines,
    and/or Knowledge Graph architectures.
  - Write clean, scalable, production-quality code using Python
    or Java.
  - Own end-to-end platform development and deployment within a
    DevOps environment.
  - Implement and maintain CI/CD pipelines using GitHub Actions
    and/or Jenkins.
  - Develop and manage Infrastructure as Code (IaC) using
    Terraform.
  - Deploy and manage solutions on AWS serverless services
    and/or Kubernetes-based infrastructure.
  - Collaborate with cross-functional teams to improve platform
    scalability, reliability, performance, and security.
  - Monitor, troubleshoot, and optimize AI platform operations
    in production environments.
  - Stay current with emerging AI technologies and recommend
    platform improvements and best practices.
  
  Requirements:
  
  - 8+ years of professional experience in software engineering,
    AI engineering, platform engineering, or related fields.
    (Internship, academic, prototype, and personal project
    experience will not be considered toward the required
    experience.)
  - Strong programming skills in Python or Java.
  - Hands-on production experience with:  Generative AI systems
    (AI Agents, RAG) OR Knowledge Graph technologies (Graph
    databases, Metadata Ontology, Graph RAG)
  - Experience working within a DevOps culture and owning
    solutions end-to-end.
  - Experience implementing CI/CD automation using GitHub
    Actions and/or Jenkins.
  - Strong experience with Infrastructure as Code (IaC),
    preferably Terraform.
  
  Compensation:
  
  - The Salary range offered for this position varies from (USD)
    $13,200 - $14,000 per month, depending on seniority and
    skillset.
  - This position is for an independent contractor, through a
    payroll platform.
  - The talent will work REMOTELY allocated at our client.
  
  Here are the steps for this process: Application
  review/approval > Screening interview with GoFasti's team >
  We build and send your profile to our client > Profile
  review/approval by client > Interview with the client >
  Hiring and onboarding.
  
  Once you apply for the job, our team will review your
  resume. If it meets the requirements, we will contact you
  and move forward in the process.
  
  Note for Candidates Approached Directly: If you were
  contacted directly by a member of our team and are
  interested in this opportunity, please do not apply through
  this link. Instead, reach out to the person who contacted
  you to coordinate a meeting. Thank you!
