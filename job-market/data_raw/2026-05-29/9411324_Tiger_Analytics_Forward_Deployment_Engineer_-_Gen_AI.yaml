description: |
  Description
  
  Tiger Analytics is looking for experienced Forward
  Deployment Engineer (Generative AI) with Gen AI experience
  to join our fast-growing advanced analytics consulting firm.
  Our employees bring deep expertise in Machine Learning, Data
  Science, and AI. We are the trusted analytics partner for
  multiple Fortune 500 companies, enabling them to generate
  business value from data. Our business value and leadership
  has been recognized by various market research firms,
  including Forrester and Gartner.
  
  We are looking for top-notch talent as we continue to build
  the best global analytics consulting team in the world.
  
  Role Overview
  
  The Forward Deployment Engineer (FDE) drives the on-site
  deployment, integration, and scaling of our enterprise
  Generative AI solutions. This role embeds directly within
  customer engineering teams to operationalize Large Language
  Models (LLMs) and retrieval systems across multi-cloud
  environments (AWS, Azure, GCP). You will bridge the gap
  between AI research and production-grade cloud
  infrastructure.
  
  You will collaborate with cross-functional teams and
  business partners and will have the opportunity to drive
  current and future strategy by leveraging your analytical
  skills as you ensure business value and communicate the
  results.
  
