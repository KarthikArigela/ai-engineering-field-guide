description: |
  Overview
  
  
  
  Cigna International Health is seeking a skilled Gen AI
  Engineer to architect, develop, and optimise robust AI data
  solutions on cloud platforms. This role is pivotal in
  building and maintaining the foundational AI and Data
  infrastructure that supports scalable, secure, and high-
  performance applications for our business.
  
  
  
  The ideal candidate will engineer technical solutions,
  produce clean code, and ensure successful delivery of
  software solutions aligned with business goals.
  
  
  
  Responsibilities
  
  - Technical Leadership:
  
  - Provide direction and be responsible for the output of Cloud
    and AI platform within the application development.
  
  - Implement AI platform strategy, ensuring that it aligns with
    the overall business and product objectives.
  
  - Own AI and Data platform stack for the solution aligned with
    the product vision as defined by the solution product
    owner.
  
  - Contribute to the definition of applications development
    policies, standards, and procedures.
  
  - Mentoring:
  
  - Lead and mentor junior software development team members,
    fostering a culture of innovation, automation,
    collaboration, and excellence.
  
  - Take active part in career development and performance of
    junior software development team members.
  
  - Project Delivery:
  
  - Execute software projects, ensuring they are delivered on
    time, within budget, and meet quality standards.
  
  - Execute project plans and application designs to ensure
    projects are aligned with standards and IT strategy.
  
  - Follow the design principles, and development best practices
    to ensure scalable, secure, and efficient solutions,
    collaborating with other senior leads.
  
  
  
  Requirements
  
  - Experience:
  
  - 5+ years in Data engineering / AI engineering roles, with a
    strong track record in cloud-native AI solutions.
  
  - Proven expertise in AWS services (e.g., Lambda, S3, IAM,
    KMS, API Gateway,).
  
  - Experience with building GenAI solutions in Cloud using
    Azure AI, AWS Bedrock or GCP.
  
  - Experience with GenAI agents and frameworks such as
    LangChain / LangGraph, monitoring tools such as LangSmith.
  
  - Proficiency in SQL (preferred) and Python (required for
    automation and data processing).
  
  - Experience with using Guardrails, data masking and sensitive
    data handling.
  
  - Experience in using AI productivity tools such as Cursor and
    exposure to Prompt Engineering.
  
  - Leadership & Communication:
  
  - Demonstrated ability to mentor technical teams.
  
  - Excellent communication and collaboration skills.
  
  - Education:
  
  - Bachelor’s or Master’s degree in Computer Science,
    Software/Data Engineering, Data Science, or a related
    field.
  
  - Desirable:
  
  - Experience working in regulated environments or with multi-
    region/multi-currency systems.
  
  - Familiarity with agile methodologies and iterative delivery.
  
  - Exposure to Jira or similar project management tools.
  
  About The Cigna Group
  
  Cigna Healthcare, a division of The Cigna Group, is an
  advocate for better health through every stage of life. We
  guide our customers through the health care system,
  empowering them with the information and insight they need
  to make the best choices for improving their health and
  vitality. Join us in driving growth and improving lives.
