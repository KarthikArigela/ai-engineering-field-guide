title: Senior AI Engineer, Applied AI
company: Clarium
location: USA
work_type: FULL_TIME
description: |
  Why Clarium?
  
  The healthcare industry overspends on its supply chain by
  over $25B each year, the result of fragmented data,
  inefficient workflows, and wasted supplies. Clarium is
  fixing that. Our AI-powered platform, Astra OS, gives
  hospitals end-to-end visibility into their supply chain
  operations, automating workflows and surfacing actionable
  insights so supply chain teams can focus on what matters
  most: patient care. We're trusted by some of the world's
  leading health systems, including Yale New Haven Health,
  Stanford, Geisinger, Cleveland Clinic, and Kaiser
  Permanente.
  
  Founded in 2020, Clarium has raised $43M in total funding.
  Our Series A was led by Northzone, with participation from
  General Catalyst, AlleyCorp, Kaiser Permanente Ventures,
  Texas Medical Center Ventures, and 1984 Ventures.
  
  The Opportunity
  
  Clarium is scaling its AI capabilities, and we're looking
  for an AI Engineer to join the AI team. You'll work closely
  with our Head of AI alongside engineering, data, and product
  to build the backend systems and AI applications that power
  Clarium's healthcare supply chain platform.
  
  This isn't a research role, you'll be shipping production
  systems that real healthcare providers rely on every day. If
  you want to own meaningful work at an early-stage, well-
  funded company where AI is the core product, this is the
  role.
  
  In This Role You Will
  
  - Architect and develop robust backend systems that integrate
    with LLM APIs to power Clarium's AI features
  - Design and build scalable backend services in Python and
    FastAPI
  - Take full ownership of critical system components from REST
    APIs to AI agent implementation
  - Collaborate with product managers and customers to ensure
    what you build maps directly to real-world healthcare
    workflows
  - Participate actively in code reviews and sprint planning
  
  What You'll Bring
  
  - 5+ years of backend engineering experience
  - 1+ years of hands-on experience building and deploying AI
    applications in production
  - Solid understanding of backend architecture principles and
    AI application design
  - Experience building and consuming RESTful APIs and
    integrating third-party services
  - Strong command of database technologies (relational and/or
    NoSQL)
  - Self-motivated, strong communicator, and a clear problem-
    solver
  
  Nice to Have
  
  - Prior experience at an early-stage startup
  - Familiarity with healthcare data or supply chain domains
  
  Skills & Tools You'll UseNeed to Know: Python · FastAPI ·
  SQL · RESTful APIs · LLM APIs (OpenAI, Anthropic)Nice to
  Know: Kubernetes · Terraform · Vector databases
  
  What You Get at Clarium
  
  - Incentive Stock Options proportionate to your salary
  - Fully remote — we're a distributed team across multiple time
    zones
  - Unlimited PTO
  - Top-tier health, vision, and dental benefits
  - The opportunity to build on a strong foundational team with
    deep data and engineering roots at a stage where your work
    genuinely shapes the product
