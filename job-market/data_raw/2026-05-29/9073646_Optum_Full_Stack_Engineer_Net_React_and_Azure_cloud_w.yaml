    delivery tools, REST API development, serverless
    architecture, containerization, IaC, public / private
    cloud, web applications, web services, application
    observability and/or messaging/ stream architecture
  - IT full-stack engineering experience
  - AI/ML for team productivity or Business effectiveness
  - Instrumenting apps with Azure AppInsights, and creating
    effective alarms and dashboards
  
