description: |
  We’re seeking a future team member for the role of Director,
  AI / Machine Learning Engineer to join our AI Hub team. This
  role is located in New York, NY.
  
  This role is located in our AI Hub and is focused on
  building AI-powered tools and platforms that improve the way
  engineers design, build, test, and operate software. This is
  a highly visible leadership opportunity for a hands-on
  technical leader who can combine deep applied AI expertise
  with strong software engineering judgment to deliver
  practical, scalable solutions in an enterprise environment
  while leading and developing a high-performing engineering
  team.
  
  In this role, you’ll make an impact in the following ways:
  
  - Lead the design, development, and delivery of applied AI
    solutions hands-on, providing technical direction and
    execution leadership for machine learning and artificial
    intelligence products.
  - Bring deep knowledge of Applied AI, LLMs, fine tuning, model
    evaluation, and approaches to building fit-for-purpose
    models, copilots, and agents for engineering use cases.
  - Drive technical discovery, prototyping, and experimentation
    to evaluate tools, frameworks, and model approaches,
    translating findings into practical recommendations and
    scalable implementation plans.
  - Partner closely with engineering and business stakeholders
    to understand roadmaps, pain points, and workflows, and
    define success measures that demonstrate developer,
    engineering, and business impact.
  - Lead and manage a team of AI / machine learning engineers,
    supporting performance, coaching and development, and
    creating a strong culture of technical excellence,
    accountability, and collaboration.
  - Bring expertise in applying AI to improve the software
    development lifecycle and empower builders, designers, and
    developers through trusted, secure, and production-grade
    capabilities.
  - Contribute to the achievement of Application Development
    objectives by establishing strong practices across
    architecture, delivery, reliability, and responsible AI
    adoption.
  
  
  
  To be successful in this role, we’re seeking the following:
  
  - Bachelor's degree in computer science engineering or a
    related discipline, or equivalent work experience
    required; advanced degree is beneficial.
  - 12+ years of experience in software development required;
    experience in the securities or financial services
    industry is a plus.
  - Advanced experience, preferably 10+ years, in applied AI/ML,
    model development, and software engineering, including
    experience deploying solutions into production
    environments.
  - Demonstrated experience managing technical teams, mentoring
    engineers, and balancing people leadership with hands-on
    technical direction and delivery ownership.
  - Ability to lead as a hands-on technical leader,
    collaborating with, mentoring, and guiding engineers while
    driving architecture, implementation, and delivery
    decisions.
  - Strong understanding of enterprise software practices, MLOps
    / LLMOps, evaluation frameworks, and how to create secure,
    scalable, and sustainable AI architectures.
  - Ability to communicate technical ideas clearly and influence
    a range of audiences, including engineers, product
    partners, and senior business stakeholders.
  
