description: |
  We Breathe Life Into Data
  
  At Komodo Health, our mission is to reduce the global burden
  of disease. And we believe that smarter use of data is
  essential to this mission. That’s why we built the
  Healthcare Map — the industry’s largest, most complete,
  precise view of the U.S. healthcare system — by combining
  de-identified, real-world patient data with innovative
  algorithms and decades of clinical experience. The
  Healthcare Map serves as our foundation for a powerful suite
  of software applications, helping us answer healthcare’s
  most complex questions for our partners. Across the
  healthcare ecosystem, we’re helping our clients unlock
  critical insights to track detailed patient behaviors and
  treatment patterns, identify gaps in care, address unmet
  patient needs, and reduce the global burden of disease.
  
  As we pursue these goals, it remains essential to us that we
  stay grounded in our values: be awesome, seek growth,
  deliver “wow,” and enjoy the ride. At Komodo, you will be
  joining a team of ambitious, supportive Dragons with diverse
  backgrounds but a shared passion to deliver on our mission
  to reduce the burden of disease — and enjoy the journey
  along the way.
  
  The Opportunity at Komodo Health
  
  Our Forward Deployed Engineering team is a key part of the
  Revenue Organization, serving as technical experts who work
  directly with customers. We leverage our deep product
  knowledge to solve complex challenges, ensuring successful
  implementations and driving customer satisfaction. By
  bridging the gap between our engineering and sales teams, we
  play a critical role generating revenue and improving the
  customer experience.
  
  As a Forward Deployed Engineer, you will lead our
  initiatives to build custom solutions that allow us to fully
  unlock the potential of our healthcare data map and platform
  capabilities - joining both together to advance Komodo's
  full-stack strategy.  Your work will be instrumental in
  creating and implementing algorithms, API’s, and custom
  features that enable our customer's use cases.  You will
  closely collaborate with Data and Product teams to introduce
  and educate others on best-in-class rigorous methodologies
  that address domain-specific problems to execute deployed
  solutions. You will foster a culture of trust, transparency,
  and technical expertise that is founded on constructive
  feedback and open evolution in thinking and approaches.
  
  Looking back on your first 12 months at Komodo Health, you
  will have accomplished…
  
  - Managed, coordinated, and delivered on key projects that
    advance our ability to bring new Technical and Data
    Services to market.
  - Developed a deep understanding of healthcare-specific
    challenges and introduced innovative algorithms and
    software techniques that address them.
  - Partnered with Product, Data, and Engineering teams to
    develop technical requirements, project roadmaps, and the
    delivery of robust solutions.
  - Actively collaborated with team members to solicit
    requirements and rigorously take command of them.
  
  These are the essential job duties you will be responsible
  for …
  
  - Act as a technical subject matter expert, partnering
    directly with customers to resolve complex issues by
    designing and implementing technical solutions to ensure
    they achieve success with our platform.
  - Serve as a crucial liaison between customers and our
    engineering teams, helping to shape our product roadmap
    based on real-world feedback.
  - Provide technical and engineering leadership and support the
    development of new technologies within the team and across
    the enterprise.
  - Mentor and guide more junior engineers, providing technical
    leadership and fostering a culture of collaboration and
    innovation.
  - Solve a range of complex technical problems or issues,
    analyzing possible solutions and assessing each using
    standard procedures.
  
  What you bring to Komodo Health (required):
  
  - Deep expertise in software and data or related fields in
    healthcare and technology.
  - Extensive experience building scalable, best-in-class
    solutions that combine theoretical rigor with
    implementation efficiency.
  - Demonstrated record of thought leadership and solution
    design that spans from high-level conceptual frameworks to
    detailed execution plans.
  - Strong ability to communicate clearly and openly with both
    technical and non-technical teams.
  - Knowledge of large-scale data and computational
    technologies.
  - Experience with privacy-preserving database solutions.
  - Proficiency in programming languages, such as Python or
    equivalent.
  - Demonstrated experience in API-driven Engineering and or
    operations.
  
  AI requirements:
  
  - Judgement & Creativity:
    - Applies AI strategically, knowing how to use the right tools
      at the right time to solve problems or generate new
      ideas.
    - Uses AI to accelerate feedback loops, test ideas, and make
      informed decisions faster.
    - Applies both judgment and creativity when working with AI
      and understands its limitations.
  
  Strongly Preferred:
  
  - Experience in life sciences, biotech or healthcare.
  - Experience in product or program management.
  - Experience interacting with, managing, or building with AI
    agentic workflows
  
  Komodo's AI Standard
  
  At Komodo, we're not just witnessing the AI revolution –
  we're leading it. This is a pivotal moment in time, where
  being first to market with AI transforms industries and sets
  the bar. We've already established industry leadership in
  leveraging AI to revolutionize healthcare, and we expect
  every team member to contribute. AI here isn't optional;
  it's foundational. We expect you to integrate AI into your
  daily work – from summarizing documents to automating
  workflows and uncovering insights. This isn't just about
  efficiency; it's about making every moment more meaningful,
  building on trust in AI, and driving our collective success.
  
  Join us in shaping the future of healthcare intelligence.
  Where You’ll Work
  
  Komodo Health has a hybrid work model with hubs in San
  Francisco, New York City, and Chicago. Roles vary — some can
  be performed from anywhere in the country, others are scoped
  to a specific region, and some are based near one of our
  hubs. For hub-based Dragons, we're building intentional in-
  office rhythms alongside the flexibility that's core to how
  we work. Whatever your setup, expectations will always be
  clear before you join.
  
  Equal Opportunity Statement
  
  Komodo Health provides equal employment opportunities to all
  applicants and employees. We prohibit discrimination and
