description: |
  At NiCE, we don’t limit our challenges. We challenge our
  limits. Always. We’re ambitious. We’re game changers. And we
  play to win. We set the highest standards and execute beyond
  them. And if you’re like us, we can offer you the ultimate
  career opportunity that will light a fire within you.
  
  So, what’s the role all about?
  
  Within Actimize, the AI Platform is developing the next
  generation advanced analytical cloud platform that will
  harness the power of data to provide maximum accuracy for
  our clients’ Financial Crime programs. As part of the
  PaaS/SaaS development group, you will be responsible for
  developing this platform for Actimize cloud-based solutions
  and to work with cutting edge cloud technologies.
  
  How will you make an impact?
  
  NiCE Actimize is the largest and broadest provider of
  financial crime, risk and compliance solutions for regional
  and global financial institutions & has been consistently
  ranked as number one in the space
  
  At NiCE Actimize, we recognize that all employee’s
  contributions are integral to our company’s growth and
  success. To find and acquire the best and brightest talent
  around the globe, we offer a challenging work environment,
  competitive compensation, and benefits, and rewarding career
  opportunities. Come share, grow and learn with us – you’ll
  be challenged, you’ll have fun and you’ll be part of a fast
  growing, highly respected organization.
  
  This new SaaS platform will enable our customers (some of
  the biggest financial institutes around the world) to create
  solutions on the platform to fight financial crime.
  
  - Design, and develop scalable, resilient, and enterprise-
    grade products from the ground up, serving as a technical
    leader within the development team.
  - Drive end-to-end technical tasks and initiatives, defining
    the technical approach and ensuring alignment with
    business goals.
  - Serve as a technical subject matter expert, providing
    guidance, mentorship, and expert-level code reviews to
    ensure high-quality, maintainable, and efficient
    solutions.
  - Pitch ideas and innovate continuously to take the team and
    project to the next level.
  - Own the technical challenges for high-availability systems,
    ensuring they meet stringent performance, reliability, and
    security standards.
  - Collaborate effectively in multi-disciplinary Agile teams,
    adopting Agile methodologies and tools.
  - Provide expert-level code reviews, guiding the team in
    translating complex business requirements into elegant and
    scalable technical artifacts.
  - Implement and improve system monitoring, alerting, and
    observability.
  - Create infrastructure through automation for hosting
    services on AWS.
  - Collaborate with multiple teams and stakeholders to achieve
    business goals.
  - Display a strong sense of ownership and proactiveness, and
    must have delivered applications that are performant,
    resilient, and efficient from a cost and operations
    perspective.
  
  Have you got what it takes?
  
  - 4+ years of experience working in the software industry as a
    software engineer (part of a SW development team and not a
    support team).
  - Experience building GenAI products using tools like AWS
    Bedrock and OpenAI is must.
  - Good experience on Prompt Engineering and advanced prompt
    techniques.
  - Expert-level proficiency in Python and a proven track record
    of implementing Cloud Native solutions on AWS.
  - Deep expertise in designing and deploying solutions within
    the AWS ecosystem, with an in-depth understanding of AWS
    networking, security, and costing.
  - Experience working in and driving Continuous Integration and
    Delivery (CI/CD) practices using industry-standard tools
    such as Jenkins, Docker, Kubernetes, and Artifactory.
  - Must have architected and deployed complex microservices
    from scratch on a cloud ecosystem, owning the entire
    lifecycle from design to production.
  - Must have experience in creating docker containers and
    hosting the same using EKS/ECS.
  - Huge advantage: Hands-on experience with AWS components like
    API Gateway, Glue, EC2, Lambda, S3, CloudWatch, DynamoDB,
    SQS, AWS Bedrock, etc.
  - Experience with DevOps practices and tools like JIRA,
    Confluence, and Terraform.
  - A team player that demonstrates a strong work ethic,
    creativity, assertiveness, and flexibility
  - Prior experience in the Finance, Fraud, or Anti-Money
    Laundering (AML) domains is a plus.
  - Exposure to GenAI tools like GitHub / Co-pilot is also
    required.
  
  What’s in it for you?
  
  Join an ever-growing, market disrupting, global company
  where the teams – comprised of the best of the best – work
  in a fast-paced, collaborative, and creative environment! As
  the market leader, every day at NiCE is a chance to learn
  and grow, and there are endless internal career
  opportunities across multiple roles, disciplines, domains,
  and locations. If you are passionate, innovative, and
  excited to constantly raise the bar, you may just be our
  next NiCEr!
  
  Enjoy NiCE-FLEX!
  
  At NiCE, we work according to the NiCE-FLEX hybrid model,
  which enables maximum flexibility: 2 days working from the
  office and 3 days of remote work, each week. Naturally,
  office days focus on face-to-face meetings, where teamwork
  and collaborative thinking generate innovation, new ideas,
  and a vibrant, interactive atmosphere.
  
