description: |
  Join us as a Software Engineer, AI
  
  - This is an opportunity for a driven Software Engineer to
    take on an exciting new career challenge
  - Day-to-day, you'll build a wide network of stakeholders of
    varying levels of seniority
  - It’s a chance to hone your existing technical skills and
    advance your career
  - We're offering this role at assocate vice president level
  
  What you'll do
  
  In your new role, you’ll engineer and maintain innovative,
  customer centric, high performance, secure and robust
  solutions. You’ll be working within a feature team and using
  your extensive experience to engineer software, scripts and
  tools that are often complex, as well as liaising with other
  engineers, architects and business analysts across the
  platform.
  
  You’ll also be:
  
  - Producing complex and critical software rapidly and of high
    quality which adds value to the business
  - Working in permanent teams who are responsible for the full
    life cycle, from initial development, through enhancement
    and maintenance to replacement or decommissioning
  - Collaborating to optimise our software engineering
    capability
  - Designing, producing, testing and implementing our working
    code
  - Working across the life cycle, from requirements analysis
    and design, through coding to testing, deployment and
    operations
  
  The skills you'll need
  
  You’ll need at least nine years of experience designing,
  building, and implementing end-to-end AI solutions spanning
  data pipelines, model training, and production deployment,
  with a strong ability to drive strategic decisions on AI
  infrastructure, model selection, governance frameworks, and
  scalable deployment patterns. You'll need expertise in LLM
  fine-tuning, prompt engineering, and optimizing models for
  domain-specific outcomes, alongside designing data pipelines
  and deployment strategies tailored to financial and
  regulatory use cases.
  
  You'll also need experience in establishing CI/CD pipelines,
  model lifecycle management, versioning, and monitoring is
  essential, along with delivering production-ready AI
  solutions across risk management, fraud detection, trading,
  and customer analytics, supported by a solid understanding
  of banking, financial reporting, and regulatory compliance
  requirements.
  
  You’ll also need:
  
  - Experience of working with development and testing tools,
    bug tracking tools and wikis
  - Experience in multiple programming languages or low code
    toolsets
  - Experience of DevOps, Testing and Agile methodology and
    associated toolsets
  - A background in solving highly complex, analytical and
    numerical problems
  - Experience of implementing programming best practice,
    especially around scalability, automation, virtualisation,
    optimisation, availability and performance
  
  Hours
  
  45
  
