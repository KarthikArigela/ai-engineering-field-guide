description: |
  WHO WE ARE
  
  Zeta Global (NYSE: ZETA) is the AI-Powered Marketing Cloud
  that leverages advanced artificial intelligence (AI) and
  trillions of consumer signals to make it easier for
  marketers to acquire, grow, and retain customers more
  efficiently. Through the Zeta Marketing Platform (ZMP), our
  vision is to make sophisticated marketing simple by unifying
  identity, intelligence, and omnichannel activation into a
  single platform – powered by one of the industry’s largest
  proprietary databases and AI. Our enterprise customers
  across multiple verticals are empowered to personalize
  experiences with consumers at an individual level across
  every channel, delivering better results for marketing
  programs. Zeta was founded in 2007 by David A. Steinberg and
  John Sculley and is headquartered in New York City with
  offices around the world. To learn more, go to
  www.zetaglobal.com.
  
  The Role
  
  As a Lead Software Engineer on our AI Platform Team, you
  will drive the design and development of the next generation
  of agentic, reliable, and scalable GenAI platforms
  supporting state-of-the-art large language models,
  evaluation systems, and secure developer tooling. You will
  play a key role in shaping technical direction, ensuring
  architectural excellence, and mentoring peers while
  collaborating across the company to infuse AI into real-
  world production solutions.
  
  Responsibilities:
  
  - Set technical direction and architect multi-tenant GenAI
    platform systems
  - Lead the development of secure, scalable platforms and
    developer tooling for agentic coding and experimentation
  - Integrate generative AI frameworks, LLMs, and evaluation
    platforms into enterprise-grade solutions
  - Solve complex technical challenges, ensuring reliability,
    security, and performance at scale
  - Mentor engineers and collaborate with Research, Product, and
    Engineering teams to deliver impactful solutions
  
  Qualifications:
  
  - 8+ years engineering experience; proficient in C#, Java,
    JavaScript, Go, or Python
  - Experience with generative AI, large language models (LLMs),
    and cloud infrastructure
  - Familiarity with GenAI platform technologies (MCP,
    LangGraph, OpenAI, Bedrock)
  - Strong architecture, design, and problem-solving skills with
    a focus on security and reliability
  - Proven ability to mentor engineers and influence
    architectural decisions
  
  BENEFITS & PERKS
  
  - Unlimited PTO
  - Excellent medical, dental, and vision coverage
  - Employee Equity
  - Employee Discounts, Virtual Wellness Classes, and Pet
    Insurance And more!!
  
  SALARY RANGE
  
  The salary range for this role is $200,000 - $215,000,
  depending on location and experience.
  
  PEOPLE & CULTURE AT ZETA
  
  Zeta considers applicants for employment without regard to,
  and does not discriminate on the basis of an individual’s
  sex, race, color, religion, age, disability, status as a
  veteran, or national or ethnic origin; nor does Zeta
  discriminate on the basis of sexual orientation, gender
  identity or expression.
  
  We’re committed to building a workplace culture of trust and
  belonging, so everyone feels invited to bring their whole
  selves to work. We provide a forum for employees to
  celebrate, support and advocate for one another. Learn more
  about our commitment to diversity, equity and inclusion
  here:  https://zetaglobal.com/blog/a-look-into-zetas-ergs/
  
