description: |
  Who we are:
  
  Motive empowers the people who run physical operations with
  tools to make their work safer, more productive, and more
  profitable. For the first time ever, safety, operations and
  finance teams can manage their drivers, vehicles, equipment,
  and fleet related spend in a single system. Combined with
  industry leading AI, the Motive platform gives you complete
  visibility and control, and significantly reduces manual
  workloads by automating and simplifying tasks.
  
  Motive serves nearly 100,000 customers – from Fortune 500
  enterprises to small businesses – across a wide range of
  industries, including transportation and logistics,
  construction, energy, field service, manufacturing,
  agriculture, food and beverage, retail, and the public
  sector.
  
  Visit gomotive.com to learn more.
  
  About the Role
  
  We are looking for a passionate and experienced Senior
  Enterprise Systems Engineer (Cloud & AI) to join our dynamic
  team. In this role, you will be the cornerstone of our
  internal cloud DevOps infrastructure, responsible for
  building and maintaining the scalable, reliable, and secure
  platforms that power our Employee Experience and
  Productivity (EEP) products. If you are driven by
  automation, obsessed with reliability, and thrive on solving
  complex challenges, we want to hear from you.
  
  What You’ll Do:
  
  - Architect & Innovate: Design, build, and maintain scalable
    cloud infrastructure (AWS/GCP), applying a strong product
    mindset to create the robust, scalable APIs and backend
    services that power our mission-critical, self-service
    application platforms.
  - Automate Everything: Champion and expand our Infrastructure
    as Code (IaC) strategy using Terraform, ensuring our
    complex cloud environments are automated, repeatable, and
    resilient.
  - Ensure Peak Performance: Drive a culture of reliability by
    developing and implementing comprehensive observability
    solutions (monitoring, alerting, dashboards) to track and
    improve key performance indicators (KPIs) such as DORA
    metrics and system uptime.
  - Lead Incident Response: Serve as a key leader in diagnosing
    and resolving production issues, minimizing impact and
    maintaining high levels of service availability through
    methodical troubleshooting and decisive action.
  - Collaborate & Empower: Partner closely with other teams to
    architect elegant, efficient solutions that meet business
    goals, and provide expert guidance to enhance monitoring
    and operational processes across the organization.
  
  What We’re Looking For:
  
  - A Bachelor’s degree in Computer Science, Engineering, a
    related technical field, or equivalent practical
    experience.
  - 5+ years of progressive experience managing scalable cloud
    infrastructure (AWS/GCP), with deep expertise in
    containerization and orchestration for applications
    running in Kubernetes.
  - 5+ years of proven, hands-on experience managing large-scale
    environments with Terraform.
  - 5+ years of deep expertise in architecting and managing
    CI/CD  pipelines using modern tools like GitHub Actions
    (or Gitlab, Tekton, etc.).
  - Strong proficiency in scripting and automation using
    languages such as Python or Bash - and experience driving
    Copilot or Cursor.
  - A meticulous, problem-solving mindset with a proven ability
    to troubleshoot complex technical challenges under
    pressure.
  - Excellent communication and collaboration skills, with the
    ability to document sophisticated systems and thrive
    within a cross-functional, Agile team.
  - A proactive and ownership-driven mentality, dedicated to
    maintaining high service availability and continuously
    improving system resilience.
  - A foundational understanding of AI concepts and their
    practical applications within a modern infrastructure
    context.
  
  Bonus Skills To Have:
  
  - Design, operate, and secure cloud environments under strict
    regulatory frameworks like SOX and SOC 2, leveraging deep
    expertise in security architecture, data governance, and
    least-privilege Identity and Access Management (IAM).
  - Partner directly with internal and external auditors to
    implement auditable controls, demonstrate compliance, and
    achieve system certification.
  - Take full ownership of our production and non-production
    environments, ensuring their health, stability, and
    performance through robust monitoring and proactive
    incident management. You will also collaborate with
    relevant teams to implement and maintain security best
    practices and least-privilege access controls.
  
  Creating a diverse and inclusive workplace is one of
  Motive's core values. We are an equal opportunity employer
  and welcome people of different backgrounds, experiences,
  abilities and perspectives.
  
