description: |
  우리는 게이머의 로망을 실현하기 위해, 누구도 가지 않는 길을 갑니다. 예상을 뛰어넘는 과감한 상상력과
  기술로, 전 세계 팬들이 잊지 못할 세상을 만들기 위해 담대하게 도전하고 개척합니다.
  
  We pioneer the path to players' dreams. With bold
  imagination and breakthrough technology, we create
  unforgettable worlds for fans across the globe.
  
  AI Engineer
  
  We are KRAFTON – a collective of independent game
  development studios brought together to create innovative
  and engaging entertainment experiences for gamers across the
  world.
  
  Since the release of our flagship title – PUBG:
  BATTLEGROUNDS – in 2017, it has become one of the highest-
  selling video games of all time with over 70 million copies
  sold.
  
  We are headquartered in Seoul, South Korea, with regional
  KRAFTON offices located across the globe. Our Amsterdam
  office is home to KRAFTON Europe, with several key product
  and publishing teams focused on Western markets based here,
  along with our Esports team. It is also home to the Black
  Budget development team, who are busy working on our
  upcoming new title.
  
  The AI Ops Team sits within West Publishing Services (WPS)
  as KRAFTON Publishing's internal AI product team, embedded
  with Global Publishing teams, studios, and leadership -
  owning Community & Creator data across KRAFTON and turning
  it into decision-grade outputs and operational workflows for
  the stakeholders we serve.
  
  You will join a four-person team (Lead, two PMs, one AI
  Engineer), deeply integrated in KRAFTON's Publishing work
  and in charge of building and shipping AI products with
  measurable impact on our publishing efforts.
  
  Basic Roles and Responsibilities:
  
  - Ideate, design, build and ship AI systems for community,
    creator, localization, and playtest publishing workflows
    as reliable, repeatable, accountable systems
  
  - Own reliability, evaluation, observability, and security for
    AI products that interact with external stakeholders
    (e.g., creator email outreach, Community Manager response
    drafting, Steam key distribution under NDA)
  
  - Develop the MCP-first intelligence layer over AI Ops'
    Creator and Community databases and reporting ecosystems
  
  - Build and harden multi-agent systems with approval-gated
    workflows (CRM creator outreach, CM response assistance,
    PR agent workflows, title risk analysis)
  
  - Drive the Community Alert System (real-time sentiment-drop
    and issue-spike detection with Slack escalation and CM-
    facing response support)
  
  - Contribute to an in-game dialogue framework R&D
    (Unity/Unreal-importable, safety-controlled)
  
  
  
  Required experience:
  
  - Software engineering experience, including building
    production AI/ML or LLM-based systems in a professional
    environment.
  
  - Strong understanding of reliability, evaluation,
    observability, and security practices for AI systems that
    interact with external services or end users
  
  - Proficiency in Python and modern AI/ML tooling
  
  - Experience building and maintaining data pipelines at
    meaningful scale (millions of records per month)
  
  - Strong analytical and structured problem-solving skills,
    with the ability to ship working systems independently and
    operate them in production
  
  - Ability to explain and communicate technical problems and
    solutions clearly to non-technical colleagues and teams
  
  - Business-level proficiency in English
  
  
  
  “Nice to have” experience:
  
  - Bachelor’s degree (or higher) in a related field
  
  - Experience or knowledge (or interest!) in the video games
    industry.
  
  - Experience with the AI APIs (prompt-engineering, tool use,
    and evaluation at scale)
  
  - Experience designing and operating MCP servers and
    integrating LLM tools with structured data sources
  
  - Some proficiency in the Korean language would be great, but
    not in any way required!
  
  
  
  What we offer:
  
  - A competitive salary
  
  - An allowance to cover the Dutch mandatory health insurance
  
  - 25 paid + 4 extra paid working days off a year
  
  - Relocation package
  
  - Pension scheme
  
  - A commuter allowance
  
  - Lunch allowance and a range of snacks & drinks
  
  - Health and Wellness allowance
  
  - Full assistance with visas and the 30% ruling applications
    when the candidate is eligible
  
  More about our Amsterdam office…
  
  Our office is situated in the Amsterdam Zuid area, a buzzing
  business hub in the southern part of the city.  Close to our
  office you can find a broad choice of cuisine – such as the
  iconic Market 33 Food Hall, offering vibrant social
  settings. Also, nearby is one of the main public
  transportation hubs – Amsterdam Zuid train, metro, tram &
  bus station, bringing the city’s highlights close, be it one
  of the many museums, canals, parks, or culinary experiences
  you are interested in. Likewise, our Amsterdam team reflects
  the city’s diverse atmosphere – being mainly expats, we
  currently represent more than 40 different nationalities,
  and we are still expanding our team!
  
  We welcome all applications!
  
  We are proud to have such a multicultural environment and we
  strive to create a safe, inclusive, and harmonious
  atmosphere for everyone to thrive in. We invite applications
  from all genders, sexual orientations, races, colors,
  religions, and ages.
  
  If this sounds like a good fit for your skills and
  experience, then apply right away!
  
