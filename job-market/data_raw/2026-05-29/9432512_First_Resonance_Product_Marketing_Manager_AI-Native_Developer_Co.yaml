job_id: 9432512
title: Product Marketing Manager (AI-Native, Developer Community)
company: First Resonance
location: Los Angeles, USA
work_type: FULL_TIME
description: |
  Role summary
  
  First Resonance is building the Factory OS for
  high‑consequence manufacturing. We’re looking for a Product
  Marketing Manager (Developer Community) to help our
  developer ecosystem grow — including engineers, technical
  operators, solutions teams, partners, and builders who
  extend, integrate, and advocate for our platform.
  
  This PMM will own the strategy and execution of developer
  community + developer marketing: from messaging and content
  to programs, events, advocacy, and measurable pipeline
  impact. The ideal candidate is AI-native and uses modern AI
  tooling to research, draft, iterate, measure, and scale.
  
  What you’ll doBuild & lead developer community programs
  
  - Design and run a developer community strategy that grows
    awareness, engagement, and advocacy.
  - Launch community programs (office hours, working groups,
    champions/ambassadors, partner spotlights, community
    challenges).
  - Develop a community calendar across in‑person and virtual
    touchpoints (meetups, conference activations, webinars,
    roundtables).
  - Establish feedback loops that translate community signals
    into product, documentation, and roadmap inputs.
  
  Own developer messaging & narratives
  
  - Craft clear, technical, developer-resonant positioning for
    our platform and key product areas (integrations, data,
    APIs, automation, AI features).
  - Maintain an opinionated point of view on where manufacturing
    software is going (agentic workflows, traceability,
    quality systems, modern data platform patterns) and
    translate that into content and talk tracks.
  - Create and continuously refine developer personas and
    journey maps (from first touch → activation → adoption →
    advocacy).
  
  Create high-impact developer content
  
  - Produce developer-facing content: quickstarts, integration
    guides, best-practice playbooks, sample projects, release
    messaging, and technical blog posts.
  - Build “content systems” (templates, reusable outlines,
    distribution checklists, repurposing pipelines) to scale
    output without sacrificing accuracy.
  - Partner with Product/Engineering to turn product knowledge
    into assets that reduce friction and increase adoption.
  
  Drive adoption and revenue outcomes
  
  - Define and measure funnel metrics for developer programs
    (activation, retention, advocacy) and connect them to
    downstream business outcomes (SQL/SQO influence,
    expansion, partner-sourced opportunities).
  - Build launch playbooks for developer-facing releases and
    integrations (announcement, docs, community amplification,
    enablement).
  - Collaborate with Sales, Solutions, and Customer Success on
    enablement assets tailored to technical buyers and
    champions.
  
  Who you’ll work with
  
  - Product & Engineering (for roadmap, technical accuracy,
    launches)
  - Forward Deployed Engineering (for real customer workflows
    and field learnings)
  - Sales & RevOps (for pipeline impact, enablement, target-
    account programs)
  
  Minimum qualifications
  
  - Experience in product marketing, developer marketing,
    community, or technical marketing.
  - Track record building communities and/or developer programs
    that drive measurable engagement and business impact.
  - Strong writing and storytelling skills for technical
    audiences (engineers, builders, operators).
  - Comfortable collaborating deeply with technical teams and
    translating product capabilities into developer-friendly
    value.
  - Strong project management and ability to run cross-
    functional programs end-to-end.
  
  “AI-native” requirements (critical)
  
  You don’t just “use AI” — you operate differently because of
  it:
  
  - You have a repeatable workflow for AI-assisted research,
    synthesis, writing, editing, and iteration (while
    maintaining factual accuracy).
  - You can build lightweight automation around content
    production and distribution (prompt libraries, templates,
    evaluation checklists, repurposing pipelines).
  - You use AI tools to instrument and analyze performance
    (content effectiveness, community engagement signals,
    attribution insights).
  - You have strong judgment about when AI helps and when human
    craft and technical validation are required.
  
  Preferred qualifications (nice to have)
  
  - Experience in hardtech / industrial / manufacturing /
    aerospace / defense / energy / robotics markets.
  - Familiarity with developer ecosystems: APIs, integrations,
    SDKs, docs, technical enablement, product-led growth.
  - Experience working with or marketing data platforms,
    workflow software, or AI-driven products.
  - Experience running conference activations, meetups, or
    ambassador programs in technical communities.
