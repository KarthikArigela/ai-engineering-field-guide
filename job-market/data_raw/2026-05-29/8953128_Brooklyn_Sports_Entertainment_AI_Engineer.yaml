description: |
  Brooklyn Sports & Entertainment creates bold, authentic, and
  unforgettable experiences that redefine sports,
  entertainment, and hospitality, The Brooklyn Way. As the
  parent company of marquee properties including the Brooklyn
  Nets, NY Liberty and Barclays Center, Brooklyn Sports &
  Entertainment operates at the intersection of live
  entertainment, premium hospitality, and community
  engagement.
  
  As it expands its existing portfolio, Brooklyn Sports &
  Entertainment now includes a media portfolio including BK
  Mag, as well as Brooklyn Wine Club, and a hospitality
  business developing several location-based entertainment
  properties.
  
  Whether on the court, on stage, or in the workplace,
  Brooklyn Sports & Entertainment is driven by a pursuit of
  excellence—constantly evolving, innovating, and pushing
  boundaries to elevate its business and expand its fan base.
  The company is deeply committed to fostering a culture of
  belonging and inclusion, ensuring that every interaction
  reflects its values of growth mindset, integrity,
  accountability and care.
  
  We are guided by our core values:
  
  - Integrity: Be intellectually honest at all times.
    Demonstrate the highest professional and ethical
    standards.
  - Care: Care for everything and everyone around us. Practice
    empathy, respect, and inclusion to promote an environment
    of excellence and success.
  - Growth Mindset: Develop ourselves and those around us.
    Experiment, learn, and improve from everything we do.
  - Accountability: Deliver on our word, take responsibility for
    our actions, and work in the interest of our team.
  
  SUMMARY
  
  The AI Engineer builds agent-based systems and intelligent
  workflows that power Brooklyn Sports & Entertainment’s AI
  platform. This role focuses on developing agentic
  applications that automate business workflows across
  ticketing, venue operations, partnerships, HR, and internal
  development processes.
  
  Working primarily within an AWS and Amazon Bedrock
  environment, the AI Engineer builds agent workflows using
  frameworks such as LangGraph and contributes to the
  organization’s internal CodeAI platform for AI-assisted
  development.
  
  The team operates with shared responsibility for building
  and operating AI systems in production. Engineers
  participate in development, deployment, monitoring, and
  incident response while maintaining deeper expertise in
  their focus areas.
  
  This role reports into the VP, Artificial Intelligence.
  
  WHAT YOU WILL DO
  
  Agent Development for Business Workflows
  
  - Design and build agent-based workflows that automate
    internal processes across departments such as ticketing,
    partnerships, HR, digital products, and venue operations.
    Examples of workflows include but are not limited to:
    - A Ticketing Meeting Preparation Agent that gathers relevant
      sales insights, CRM data, and historical context to help
      ticketing teams prepare for client meetings.
    - Early prototypes of a Generalized "AI Coworker" agent
      capable of assisting teams across departments with
      research, reporting, and operational tasks.
  - Develop agent orchestration patterns using LangGraph and
    Amazon Bedrock.
  - Build integrations with systems such as Salesforce, internal
    APIs, analytics dashboards, and operational data
    platforms.
  - Implement reliable tool-calling patterns that allow agents
    to safely execute operational tasks.
  
  CodeAI Development Agents
  
  - Build CodeAI agents that support engineering workflows
    including code generation, test creation, documentation,
    debugging, and pull request analysis.
  - Work with AI-assisted developer tools including, Codex,
    Cursor, Claude Code, Claude Code agents.
  - Contribute to internal AI-assisted development pipelines and
    guardrails for “vibe coding.”
  
  Shared Production Ownership
  
  - Participate in deployment, monitoring, and incident response
    for AI systems.
  - Improve agent reliability through evaluation pipelines,
    observability metrics, and tool-call success monitoring.
  - Collaborate with the LLMOps Engineer to ensure workflows
    meet operational reliability standards.
  
  WHAT YOU WILL BRING
  
  - 2–5 years of software engineering experience building
    production systems.
  - Strong programming experience with Python or TypeScript.
  - Familiarity with AWS cloud services and API-driven
    applications.
  - Experience working with LLM APIs or AI frameworks.
  - Exposure to agent frameworks such as LangGraph or similar
    orchestration tools.
  - Familiarity with Amazon Bedrock or other LLM platforms.
  - Experience using AI-assisted development tools such as
    Codex, Cursor, or Claude Code.
  
  WHO YOU ARE
  
  - You enjoy turning complex workflows into reliable
    automation.
  - You are curious about emerging AI technologies and
    continuously experiment with new tools and frameworks.
  - You demonstrate a strong growth mindset and actively learn
    as the AI ecosystem evolves.
  - You thrive in fast-moving environments where experimentation
    and iteration are encouraged.
  - You take ownership of the systems you build and are
    comfortable supporting them in production.
  
  COMPENSATION
  
   $125,000 - $150,000 per year
  
  Full-time employees are eligible for a robust slate of total
  rewards, including:
  
  - Bonus eligibility
  - Medical, dental, and vision coverage; HSA and FSA
    eligibility
  - 401k Employer Match at 4%
  - Competitive PTO policy & Company Holidays
  - Parental leave policy eligible after 6 months of service
  - Access to events at Barclays Center, subject to ticket
    availability
  - Free lunch onsite Monday - Thursday; onsite barista bar
  - And more!
  
  WORK ENVIRONMENT
  
  Works primarily in an office environment and may be expected
  to contribute additional hours to support system
  implementations.
  
