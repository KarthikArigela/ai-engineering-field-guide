  Job Title: AI Applications Engineer II
  
  Location: Bangalore/ Chennai, India
  
  About the Role
  
  We’re looking for a passionate AI Applications Engineer II
  to join our growing Enterprise AI Team. In this role, you’ll
  help manage, support, and optimize our Google Gemini
  Enterprise agentic AI platform, ensuring it operates
  securely, efficiently, and at scale across the organization.
  
  You’ll spend most of your time focused on Gemini Enterprise
  platform administration, governance, and support, along with
  some dedicated time to enhancing/building/doing POC work on
  agentic and automation projects that furthers performance,
  user experience, and integration with Five9 enterprise
  systems.
  
  If you’re driven by innovation, precision, and the
  opportunity to shape how AI supports a global business, this
  is the role for you.
  
  Key Responsibilities
  
  - Administer, configure, and optimize Gemini Enterprise and
    related AI agentic functionality to ensure seamless
    performance and compliance within Five9 environments.
  - Manage user provisioning, license assignments, access
    controls, and security policies, ensuring consistency with
    IT, Infosec and compliance governance standards.
  - Oversee appropriate Google Cloud Platform (GCP) resources —
    including Project services, AI/ML engine, storage, and
    Gemini AI models — focusing on reliability, performance,
    and cost management.
  - Support cloud run workflows, CI/CD automation pipelines, and
    containerized environments, leveraging tools such as
    Terraform, Docker, and Kubernetes.
  - Partner with data engineers, DevOps teams, and business
    stakeholders to troubleshoot issues, implement updates,
    and ensure timely support for production workloads.
  - Conduct prompt engineering and workflow optimization to
    improve agentic AI accuracy, responsiveness, and
    relevance.
  - Maintain and update documentation, runbooks, and best
    practice guides for platform operations, deployment, and
    support.
  - Deliver training and enablement sessions to end users and
    power users on Gemini Enterprise capabilities and AI use
    cases.
  - Continuously evaluate emerging Google AI and Gemini agentic
    technologies, recommending improvements that enhance
    scalability and automation.
  
  Key Requirements
  
  - Bachelor’s or Master’s degree in Computer Science,
    Information Systems, or a related field (AI or data
    systems focus preferred).
  - Minimum of 3 years of GCP experience & 1 year of Claude
    experience supporting or developing AI/ML solutions on
    Google platform.
  - Hands on experience with AI/ ML solutions/apps and
    operational best practices (ML Ops experience is
    advantageous).
  - Proficiency with GCP/Claude services such as Compute Engine,
    IAM, Kubernetes, VPC, BQ, etc.
  - Experience in automation and scripting using Python, Bash,
    and Infrastructure as Code (IaC) tools such as Terraform
    or Deployment Manager.
  - Familiarity with Gemini Enterprise or similar enterprise AI
    frameworks, including prompt engineering, AI agent
    configuration, and data governance.
  - Strong understanding of security, compliance, and auditing
    practices, including DLP, Access Transparency, and data
    residency standards.
  - Excellent problem-solving, analytical, and troubleshooting
    skills.
  - Strong interpersonal and communication abilities, with the
    capacity to explain technical topics to non-technical
    audiences.
  - A passion for innovation, continuous learning, and driving
    impactful AI adoption across the enterprise.
  
  Why You’ll Love Working Here
  
  - Be part of a forward-thinking Enterprise AI Team, driving
    next-generation innovation across the company.
  - Work hands-on with cutting-edge technologies like Google
    Gemini Enterprise and other agentic AI tools that power
    real-world business applications.
  - Collaborate with skilled engineers, data scientists, and
    business leaders on high-visibility projects that make a
    measurable impact.
  - Enjoy a culture that values experimentation, continuous
    learning, and teamwork, with opportunities to grow your
    skills in cloud operations and AI engineering.
  - Play a key role in transforming enterprise workflows through
    AI innovation, scalability, and operational excellence.
  
  Five9 embraces diversity and is committed to building a team
  that represents a variety of backgrounds, perspectives, and
  skills.  The more inclusive we are, the better we are. 
  Five9 is an equal opportunity employer.
  
