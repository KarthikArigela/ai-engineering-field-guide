  About the Role
  
  We are looking for a motivated Embedded AI & Data Analytics
  Engineer to work on next-generation data-driven and AI-
  powered embedded systems. This role focuses on data
  analytics, machine learning, and LLM-based workflows, with
  an emphasis on processing and analyzing data from
  embedded/edge platforms.
  
  You will contribute to building intelligent analytics
  pipelines, observability frameworks, and AI-driven insights
  for automotive and embedded applications.
  
  What You Will Do
  
  - Develop and implement data analytics solutions for embedded
    and edge systems
  - Apply statistical and machine learning techniques for:
    - Regression
    - Classification
    - Data modeling and analysis
  - Build and support LLM-based analytics workflows for
    intelligent data processing
  - Work on data pipelines and observability frameworks ,
    including:
    - Telemetry data collection
    - Monitoring and performance tracking
  - Develop data processing scripts and tools using Python / C++
  - Perform data validation, analysis, and reporting to support
    system insights
  - Collaborate with cross-functional teams to integrate
    analytics into embedded software systems
  - Support development of AI-driven use cases in areas like
    diagnostics, monitoring, and system optimization
  
  What You Need to Be Successful
  
  - 1–3 years of experience in Data Analytics / Machine Learning
    / Software Development
  - Strong hands-on experience in:
    - Python programming (NumPy, Statsmodels, Pandas preferred)
    - Data analysis and statistical modeling
  - Understanding of:
    - Regression and classification techniques
    - Data preprocessing and feature engineering
  - Exposure to LLM-based analytics workflows and basic prompt
    engineering
  - Knowledge of data observability concepts, including
    telemetry pipelines and monitoring frameworks
  - Good programming skills in:
    - Python (preferred)
    - C++ (added advantage)
  
  Bonus Points If You Have
  
  - Exposure to embedded systems or edge AI environments
  - Experience working with real-time data streams
  - Knowledge of distributed systems or microservices-based data
    pipelines
  - Automotive software development experience
  
  What Makes You Eligible
  
  - Degree in:
    - Computer Science
    - Information Technology
    - Communication Technology
    - Or related field
  - Strong analytical and problem-solving skills
  - Interest in AI, data-driven systems, and embedded
    technologies
  - Good communication and teamwork abilities
  
