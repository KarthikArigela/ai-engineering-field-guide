  Role: AI Engineer  (MLE Architect - Agentic Workflows &
  Enterprise Integration)
  
  Experience Level: 5 plus
  
  Work Location: US (Remote)
  
  Role Overview:
  
  Quantiphi is seeking an experienced AI Engineer to help
  build a next-generation, AI-driven workflow platform
  leveraging agentic architecture to power intelligent,
  scalable solutions. This role focuses on translating inputs
  from customer requirements and internal product teams into
  robust, multi-agent workflows that drive efficiency,
  innovation, and business impact.
  
  You will operate in a human-in-the-loop development model,
  guiding AI coding assistants and autonomous agents while
  owning end-to-end system design, enterprise integration,
  security, and scalability. Working across the full stack,
  Python back-end services, React front-end applications, and
  cloud-native (AWS) environments, you will deliver
  production-grade platforms that integrate seamlessly within
  complex enterprise ecosystems.
  
  Key Responsibilities:
  
  - Architect and build full-stack, enterprise-grade platforms
    using reusable and modular  agentic workflow patterns
  - Translate inputs from internal product teams into scalable,
    AI-powered workflows and services
  - Design and implement agentic workflows, including task
    decomposition, agent orchestration, tool invocation,
    memory/state handling, and evaluation
  - Apply enterprise integration patterns to connect AI
    workflows with internal  platforms, shared services, and
    external customer systems
  - Guide and supervise coding assistants and AI agents
    (ChatGPT, Cursor,  Claude. Github copilot) to accelerate
    delivery while ensuring correctness, security, and
    maintainability
  - Design and operate event-driven architectures using AWS
    native services and  messaging middleware
  - Build secure Python back-end services for AI agents,
    workflow execution, and  enterprise integrations
  - Develop React-based front-end applications supporting
    complex, AI assisted user workflows
  - Design and enforce identity, authentication, authorization,
    and tenant isolation models for enterprise and customer-
    facing systems
  - Build and operate multi-tenant architectures with strong
    guarantees around  security, scalability, and compliance
  - Support customer deployments, including occasional on-site
    builds and integrations
  - Contribute to CI/CD pipelines, infrastructure as code,
    observability, and operational readiness
  
  Basic Qualifications:
  
  - Agentic Workflows & AI Systems
  - Expert-level understanding of agentic workflow patterns,
    Multi-agent orchestration
    - Tool-based reasoning and execution
    - Human-in-the-loop controls
    - Workflow state, memory, and evaluation
  - Strong proficiency in Python, with hands-on experience
    building AI agents and  workflow systems
  - Expert-level experience with LangGraph or equivalent agent
    orchestration  frameworks
  - Deep experience using and supervising coding assistants
    (ChatGPT, Cursor,  Claude) in production environments
  - Proficiency with ChatGPT tools, structured prompting, and
    multi-agent  collaboration
  - Enterprise Integration & Architecture
  - Expert-level understanding of enterprise integration
    patterns, including:
    - Event-driven and asynchronous integration
    - API-based and message-based communication
    - Workflow orchestration and choreography
    - Integration with shared enterprise services
  - Strong understanding of web architecture, distributed
    systems, and cloud native design
  - Proven experience designing and operating multi-tenant
    platforms
  - Deep knowledge of identity and access management, including
    authentication, authorization, RBAC, and policy
    enforcement
  - Front End, Cloud & Delivery
  - Advanced experience building React web applications
  - Expert-level understanding of AWS, including:
    - DynamoDB
    - EventBridge
    - Messaging systems (e.g., RabbitMQ)
    - Middleware and integration services
    - VPC networking, IAM, and security boundaries
  - Strong experience with CI/CD pipelines and automated
    deployments
  - Ability to operate effectively in a human-plus-AI
    development model, where  AI produces code and engineers
    provide architectural oversight
  - Occasional travel for customer or on-site builds may be
    required
  
  Other Qualifications (OQs):
  
  - Experience in Life Sciences or Healthcare, particularly
    clinical or commercial  platforms
  - Familiarity with FHIR and HL7 standards
  - Experience building customer-facing enterprise platforms
  - Background in platform engineering or internal developer
    platforms (IDPs)
  
