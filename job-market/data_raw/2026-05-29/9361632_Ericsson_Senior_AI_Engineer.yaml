description: |
  Grow with us About this opportunity: Within BCSS CNE
  Architecture & Technology, the Innovation & Prototyping unit
  develops and delivers AI-native products and operations. Its
  key focus areas include robust agentic systems, foundation
  model enablers, software development for autonomous
  networks, the semantic layer foundation, and serviceability.
  Innovation & Prototyping unit in Asia will fast-track our AI
  strategy execution, using state-of-the-art AI and deliver
  Proof of concepts and prototypes. You will do: Reporting to
  the Head of I&P Asia, this role is pivotal in aligning AI
  solutions with business objectives, embracing the AI
  advancements and pushing forward AI solutions that make high
  impact in our products and services. We would love to hear
  from you if you are passionate about cutting-edge AI
  technologies and thrive in a collaborative environment.
  
  - Portfolio Case studies: Demonstrate portfolio value and
    growth potential via cross-portfolio use cases. Play a
    critical role in supporting customer transformation, and
    demonstrate value using joint case studies
  - Implementation: Support the shaping of the AI technology
    strategy through the execution of the PoCs in our main
    target areas
  - AI Native R&D transformation: Exploration of AI native
    evolution as per the AI strategy of the unit, using AI
    tools, agents, skills
  - Team Collaboration: Collaborate closely with data
    scientists, software engineers, and other stakeholders to
    integrate AI models into applications and systems.
  - Technology Evaluation: Stay updated with advancements in AI
    algorithms, frameworks, and cloud platforms to identify
    suitable technologies for projects.
  
  You will bring:
  
  - Degree in Computer Science, Data Science, AI, Machine
    Learning, Electrical Engineering, or related fields from a
    reputable institution (Bachelor's, Master's)
  - 10 years of overall industry experience, with at least 5+
    years in AI software development.
  
  - Experience in Gen AI-based systems with hands-on experience
    in working with ML, LLM, RAGs, embedding models, LLM
    Orchestration frameworks (e.g. Langchain), and Agentic
    frameworks (e.g., LangGraph).
  
  - Strong programming skills in Python
  
  - Expertise in containerization and Kubernetes in cloud
    environments.
  
  - Experience with cloud platforms, especially AWS and
    utilising services like Bedrock and Generative AI models.
  - Competence in Codebase repository management, like Git and
    any CI/CD pipelines.
  - Extensive experience in life-cycle-management in one or more
    industry/application domains
  
  - Thrives on accountability and is motivated to achieve beyond
    expectations.
  - Collaborative mindset, with the ability to work effectively
    as part of a team.
  - A customer-first mindset, proactively embedding this
    approach within the team.
  
