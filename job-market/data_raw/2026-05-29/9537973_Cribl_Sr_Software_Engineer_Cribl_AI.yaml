title: Sr Software Engineer, Cribl AI
company: Cribl
location: USA
work_type: FULL_TIME
description: |
  Join the company that’s building the telemetry
  infrastructure for the AI era. At Cribl, we partner with IT
  and Security teams at many of the world’s biggest
  enterprises, including half of the Fortune 100, to bridge
  the gap between AI ambition and infrastructure reality. As
  the AI Platform for Telemetry, we give customers the choice,
  control, and flexibility to manage and analyze telemetry for
  both humans and agents, so they can build what’s next.
  
  We’re one of the fastest‑growing private companies and a
  leading player in a massive, fast‑moving market. With a
  global workforce, we’re remote‑first and grounded in a
  simple idea: software is a people business. Cribl is the
  place where curious, collaborative people can do their best
  work, grow fast, and bring their full selves to the herd.
  
  Why You'll Love This Role
  
  You will work closely with the founding team and a group of
  highly-skilled engineers to shape the future of search and
  analytics of observability data. You will play a central
  role in bringing integrating cutting-edge Generative AI
  technologies with the Cribl Product suite to help solve real
  customer problems. You will work closely with development
  partners and key stakeholders to iteratively design,
  develop, and deliver products and surfaces that will delight
  our customers. On top of it all you will have fun. Cribl
  strives to be a great place to work for everyone.
  
  As An Active Member Of Our Team, You Will...
  
  - Productionize, launch, and operate AI-based technology
    integrations into Cribl’s core products with the goal of
    solving real customer problems
  - Partner with product & design leaders to prototype and
    experiment with new AI features
  - Stay up-to-date with the latest AI technologies and trends
  - This position will require stand-by, on-call, or off-hours
    duties
  
  If You've Got It - We Want It
  
  - 5+ years of professional software engineering experience
    building AI features end to end in production across
    product, backend, and model integration layers
  - Proven fullstack experience, including designing and scaling
    React-based UIs and backend services or APIs, with
    strength in backend and systems thinking
  - Deep expertise in TypeScript or JavaScript plus experience
    with at least one backend language or runtime such as
    Node.js, Go, Java, or similar
  - Professional experience building AI agent-driven product
    experiences, including conversational interfaces, tool-
    calling patterns, RAG, prompt engineering, evaluation or
    guardrail techniques, and agent orchestration connected to
    reliable backend and data systems
  - Professional experience with Model Context Protocols (MCPs),
    agent frameworks, orchestration layers, and integrating
    external tools and data sources into LLM-based systems
  - Machine learning experience, ideally in applied settings
    where models or AI systems were shipped, integrated,
    evaluated, or operated in production
  - Familiarity with data and infrastructure patterns for AI
    systems, including databases, APIs, observability, and
    integrating external tools, services, and data sources in
    production environments
  - Ability to problem-solve from first principles, make sound
    engineering trade-offs aligned with product and business
    goals, and drive work independently through ambiguity
  - Excellent communication skills, both verbal and written,
    with the ability to explain complex technical topics to
    cross-functional stakeholders in a remote or distributed
    environment
  
  #LI-JB1 #LI-Remote
  
  The salary for this role is dependent on geographic location
  and will be based on the individual candidate's job-related
  knowledge, skills, and experience. In addition to base
  salary, for sales and some sales-adjacent roles, employees
  are eligible to earn incentive compensation (commission).
  For all other roles, employees are eligible to participate
  in the Cribl Corporate Bonus Program. In addition to a
  competitive salary, Cribl also offers a generous benefits
  package which includes health, dental, vision, short-term
  disability, and life insurance, paid holidays and paid time
  off, a fertility treatment benefit, 401(k), and equity.
  
  Base Salary Range
  
  $185,000—$215,000 USD
  
  Bring Your Whole Self
  
  Diversity drives innovation, enables better decisions to
  support our customers, and inspires change for the better.
  We’re building a culture where differences are valued and
  welcomed, and we work together to bring out the best in each
  other. All qualified applicants will receive consideration
  for employment without regard to race, color, religion, sex,
  sexual orientation, gender identity, national origin, or any
  other applicable legally protected characteristics in the
  location in which the candidate is applying.
  
  Interested in joining the Cribl herd? Learn more about the
  smartest, funniest, most passionate goats you’ll ever meet
  at cribl.io/about-us.
