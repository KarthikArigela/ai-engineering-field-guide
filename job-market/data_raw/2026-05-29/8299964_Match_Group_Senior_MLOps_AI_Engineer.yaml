description: |
  At Meetic, a Match Group company, we have been pioneering
  online dating for over 20 years, leveraging our legacy to
  reinvent how people meet, connect, and build meaningful
  relationships across Europe and beyond.
  
  As part of Match Group, we manage a diverse portfolio of
  brands, from iconic names like Meetic, Match, Lexa, and
  LoveScout24 to tailored experiences for singles over 50,
  OurTime, DisonsDemain, Zweisam, and single parents, Even and
  Stir.
  
  Our teams design, build, and scale platforms across 20+
  countries and 18 languages, ensuring every single finds the
  right match for their lifestyle and lifestages. We also
  drive growth for other Match Group brands like The League,
  OkCupid, Archer, Salams, and Plenty Of Fish, expanding our
  impact worldwide.
  
  When it comes to dating, the connection starts online, but
  the real magic happens once you meet in real life (IRL). We
  think the same is true for creating the best platforms, so
  we work together IRL 3 days / week in our office, 53 rue de
  Chateaudun, 75009 Paris.
  
  Role overview
  
  Meetic relies heavily on data to drive and grow its
  business. As a truly data-driven company, data is our daily
  compass for decision-making.
  
  
  
  The Data Science team sits at the crossroads of the
  company’s key challenges and makes the most of all the
  information contained in our data. It is part of Meetic’s
  Data Hub, which brings together all data-related
  stakeholders (Data Science, ML/Data Engineers, DBAs, BI).
  
  
  
  Our extensive data ecosystem allows us to work across all
  business domains: profile recommendations for our users,
  pricing and optimization of business models, optimization of
  subscription and à-la-carte offers, customer knowledge and
  experience, detection and prevention of harmful behaviors,
  marketing analytics and acquisition, image processing …and
  much more!
  
  
  
  Our technical environment: Google Vertex AI, BigQuery,
  Elasticsearch, Kafka, Scala, Python, Spark, SQL, AWS…
  
  
  
  We are looking for creative and passionate people who enjoy
  working in a dynamic and international environment.
  
