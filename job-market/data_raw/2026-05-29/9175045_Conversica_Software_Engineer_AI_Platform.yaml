description: |
  Conversica is building the next generation of our
  conversational AI platform, and we’re looking for a Software
  Engineer to help us expand and scale our backend systems.
  Our platform powers automated, human-like conversations
  across email, SMS, and chat, helping businesses engage
  customers and qualify opportunities through AI-driven
  interactions.
  
  In this role, you’ll work closely with experienced engineers
  to build backend services, APIs, and infrastructure that
  support AI-powered systems used in real production
  environments. This role is well suited for early-career
  engineers who enjoy backend development and are excited
  about building practical AI applications.
  
  What You'll Do
  
  - Build and improve backend services that power our
    conversational AI platform
  - Develop APIs and integrations with internal systems and
    external data sources
  - Work with modern AI technologies and large language models
    (LLMs) in production environments
  - Design and implement scalable cloud infrastructure and data
    pipelines
  - Collaborate with engineers, product managers, and data
    scientists to ship new features
  - Contribute to system reliability, performance improvements,
    and monitoring
  
