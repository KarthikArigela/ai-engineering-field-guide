description: |
  Articulate is hiring an AI & Automation Engineer (Workato)
  to join our IT Business Solutions team. This is a hands-on
  role focused on building and supporting AI-powered workflows
  and automations that improve how our teams operate.. You
  will work from a defined backlog to design and build AI-
  powered workflows and automations that make our teams faster
  and smarter — across Go-To-Market, Finance, Support,
  Operations, and People.
  
  You will partner closely with IT, Security, and business
  stakeholders to ship automation that reduces manual work,
  improves decision-making, and scales with the company. This
  is not a theoretical role. We move fast, we ship real
  things, and we want someone who thrives in that environment.
  
  Why Articulate
  
  
  
  Articulate is a fully remote company building the world's
  leading workplace learning platform. We move fast, operate
  with a high degree of ownership, and invest seriously in the
  tools and systems that make our teams effective. This role
  sits at the intersection of AI and operations — you will
  have real influence over how we work.
  
  
  
  We offer competitive compensation, comprehensive benefits,
  and a culture that values autonomy, craft, and impact.
  
  
  
