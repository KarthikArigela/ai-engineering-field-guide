  About us
  
  
  
  Articulate Global, LLC, is the leading SaaS provider of
  creator platforms for online workplace training. Founded by
  Adam Schwartz in 2002, Articulate provides creator tools and
  services that make it simple for enterprises and SMBs to
  develop, deliver, and analyze online workplace training
  that’s engaging and effective.  Increasingly, organizations
  must reskill employees for ever-changing remote and hybrid
  work environments, create learning cultures that attract and
  retain employees in a tight labor market, and use training
  to build more equitable, empowering, and engaging
  workplaces. Articulate helps organizations address these
  critical business needs with its creator platform for
  workplace training. Articulate 360—a suite of creator tools
  for online courses—was named the 7th most-loved product in
  the world by TrustRadius in 2021. And Rise—an all-in-one
  online training system that makes online training easy to
  create, enjoyable to take, and simple to manage—is the first
  creator platform for SMBs and departments within the
  enterprise. Articulate has more than 118,000 customers in
  170 countries and counts all 100 of the Fortune 100
  companies as customers.
  
  
  
  Named one of Inc. Magazine’s Best Workplaces 2022 and a
  leader in building a human-centered organization, Articulate
  is guided by a commitment to provide the best value to
  customers, do right by employees, and create an equitable,
  empowering workplace for all. As a human-centered
  organization, we honor people’s humanity knowing that each
  person’s unique history, vulnerabilities, and social
  location inform how we show up with one another. We embrace
  our connectedness, aware that what we do and say impacts
  others. We give each other grace because we are all works in
  progress, learning and evolving every day. And we take
  responsibility for ourselves and are serious about our
  accountability to each other.  In all we do, we strive to
  create an equitable, sustainable, and empowering workplace
  while we drive results for the business and make a positive
  impact in the world. Read more about our values here.
  
  
  
