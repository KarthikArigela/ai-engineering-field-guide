title: Full Stack Engineer - AI Enabled – Senior Vice President
company: Citi
location: London, GBR
work_type: FULL_TIME
company_size: 223,850 Employees
description: |
  Engineer the future of global finance. At Citi, our Tech
  team doesn’t just support finance – we are helping to
  redefine it. Every day, $5 trillion crosses through our
  network. We do business in 180+ countries operating at a
  scale few can match. From deploying advanced AI to helping
  shape global markets, we build systems that matter. Look to
  join a team where your work helps influence economies, your
  ideas can drive innovation and outcomes, and your growth is
  backed by mentorship, continuous learning and flexibility
  with potential hybrid work opportunities. Help solve real-
  world challenges that touch millions and get the opportunity
  to build the future of finance with Citi Tech.
  
  Citi is looking for a highly skilled and innovative Full
  Stack Engineer with a strong background in modern enterprise
  architecture and a passion for Artificial Intelligence. This
  role will be instrumental in designing, developing, and
  implementing robust, scalable, and AI-enabled solutions
  across our platforms. The successful candidate will possess
  deep expertise in Java, Angular, microservices, and event-
  based architectures, combined with a proven ability to
  leverage agentic AI to create intelligent agents that solve
  complex business challenges. This is an exciting opportunity
  to contribute to Citi's digital transformation by
  integrating advanced AI capabilities into our core
  engineering practices.
  
  
  Key Responsibilities
  
  - Design, develop, and maintain high-performance, scalable,
    and secure full-stack applications using Java, Angular,
    microservices, and event-based architectures.
  - Lead the integration of AI capabilities into existing and
    new applications, focusing on creating and deploying
    agentic AI solutions for various business use cases.
  - Collaborate with data scientists, AI researchers, product
    managers, and other engineering teams to translate
    business requirements and AI models into production-ready
    software.
  - Architect and implement microservices and event-driven
    systems that are resilient, fault-tolerant, and
    performant.
  - Develop front-end user interfaces using Angular, ensuring an
    intuitive and responsive user experience.
  - Contribute to the entire software development lifecycle,
    including requirements gathering, design, coding, testing,
    deployment, and operational support.
  - Promote and implement best practices in software
    engineering, including code quality, testing, CI/CD,
    security, and documentation.
  - Stay abreast of emerging technologies and trends in full-
    stack development, AI, and agentic systems, recommending
    and implementing innovative solutions.
  - Mentor junior developers and actively participate in code
    reviews, fostering a culture of technical excellence and
    continuous learning.
  
  QualificationsEducation
  
  - Bachelor's or Master's degree in Computer Science, Software
    Engineering, or a related technical field.
  
  Experience
  
  - Significant hands-on experience in full-stack software
    development.
  - Proven experience in designing and building scalable, high-
    performance microservices.
  - Demonstrated experience with event-driven architectures
    (e.g., Kafka, RabbitMQ).
  - Solid experience with modern front-end frameworks,
    specifically Angular.
  - Experience with AI technologies, including machine learning,
    natural language processing, or other AI domains.
  - Specific experience with agentic AI development, including
    designing, building, and deploying intelligent agents for
    business applications.
  
  Technical Skills
  
  - Languages: Expert proficiency in Java and
    TypeScript/JavaScript.~
  - Back-end:
    - Strong expertise in Java development, including Spring Boot,
      Spring Cloud.
    - Extensive experience with microservices architecture
      principles and patterns.
    - Hands-on experience with message brokers and event streaming
      platforms (e.g., Apache Kafka, RabbitMQ).
    - Proficiency with relational and NoSQL databases (e.g.,
      PostgreSQL, MongoDB, Cassandra).
  - Front-end:
    - Expertise in Angular framework (versions 2+), including NgRx
      or other state management patterns.
    - Strong understanding of HTML5, CSS3, and responsive web
      design.
  - DevOps & Cloud:
    - Experience with containerization technologies (Docker) and
      orchestration (Kubernetes).
    - Proficiency with CI/CD pipelines (e.g., Jenkins, GitLab CI,
      Azure DevOps).
    - Experience with cloud platforms (e.g., AWS, Azure, GCP) and
      their relevant services.
  - AI/ML:
    - Familiarity with AI/ML concepts and frameworks (e.g.,
      Python, TensorFlow, PyTorch, LangChain, LlamaIndex).
    - Direct experience in developing, integrating, and deploying
      agentic AI systems.
  
  Leadership & Soft Skills
  
  - Excellent problem-solving, analytical, and critical thinking
    skills.
  - Strong communication and interpersonal skills, with the
    ability to articulate technical concepts to both technical
    and non-technical audiences.
  - Ability to work effectively in a fast-paced, agile, and
    collaborative team environment.
  - Proactive, self-motivated, and results-oriented with a
    strong sense of ownership.
  
  Preferred Qualifications
  
  - Experience in the financial services industry.
  - Knowledge of domain-driven design and clean architecture
    principles.
  - Experience with observability tools (e.g., Prometheus,
    Grafana, ELK stack).
  - Contributions to open-source projects or active
    participation in developer communities.
  
  What we’ll provide you
  
  By joining Citi London, you will not only be part of a
  business casual workplace with a hybrid working model (up to
  2 days working at home per week), but also receive a
  competitive base salary (which is annually reviewed), and
  enjoy a whole host of additional benefits such as:
  
  - 27 days annual leave (plus bank holidays)
  - A discretional annual performance related bonus
  - Private Medical Care & Life Insurance
  - Employee Assistance Program
  - Pension Plan
  - Paid Parental Leave
  - Special discounts for employees, family, and friends
  - Access to an array of learning and development resources
  
  Visit our Global Benefits page to learn more.
  
  Alongside these benefits Citi is committed to ensuring our
  workplace is where everyone feels comfortable coming to work
  as their whole self, every day. We want the best talent
  around the world to be energized to join us, motivated to
  stay and empowered to thrive.
  
