description: |
  About Nutrient
  
  At Nutrient, we’re revolutionizing how the world works with
  documents. Our tools transform static files into
  intelligent, secure workflows, empowering businesses to
  innovate faster and smarter. Trusted by thousands of
  organizations across 80 countries—including Fortune 500
  companies and public sector leaders—our products streamline
  processes, accelerate digital transformation, and unlock new
  possibilities.
  
  Our platform supports nearly a billion end users globally,
  and our products are embedded in the infrastructure of
  industries where documents aren’t just files—they’re
  mission-critical. We tripled revenue and nearly doubled ARR
  year-over-year, and we’re just getting started.
  
  Your Role at Nutrient...
  
  We’re looking for a curious, execution-focused AI Developer
  to help us design and build the next generation of AI-
  powered document features. You’ll work on everything from
  conversational chat interfaces to fully agentic
  workflows—building systems that genuinely change how people
  interact with documents. You’ll join a globally distributed
  engineering team working directly with a world-class
  document platform used by over a billion end users.
  
  This is a role for someone who cares deeply about the craft
  of engineering, stays close to the frontier of AI tooling,
  and is energized by turning complex problems into clean,
  reliable systems. A degree isn’t what we’re looking for—we
  need someone who ships, thinks clearly under ambiguity, and
  brings genuine curiosity to every problem they touch.
  
  What You'll Work On...
  
  - Design and build AI-powered systems—from conversational chat
    interfaces to fully agentic document editing and
    understanding workflows
  - Integrate AI capabilities into Nutrient’s SDKs and developer
    tools, collaborating closely with product, engineering,
    and design
  - Architect modular, well-structured systems that make AI
    integrations feel simple and reliable for developers
    downstream
  - Optimize the performance, reliability, and efficiency of AI
    features across a large-scale, production platform
  - Stay at the forefront of AI and software engineering
    developments, bringing new approaches and tooling into the
    team
  - Contribute across a codebase spanning multiple languages
    (TypeScript, Python, C++, Elixir)—depth in any one area is
    valued, curiosity across all of them even more so
  
  What You'll Bring...
  
  - 3–4+ years of software engineering experience, with at least
    2 years working meaningfully in AI—whether building
    integrations, systems, or AI-powered products
  - Hands-on experience with AI frameworks such as LangChain,
    CrewAI, or LlamaIndex, and a clear understanding of how to
    build reliable, production-grade AI applications
  - Strong systems design instincts—you think in abstractions,
    write maintainable code, and know what “good” looks like
    in a fast-moving codebase
  - A passion for the craft—side projects, open-source
    contributions, or other evidence of continuous learning
    outside work hours are strong signals
  - Comfort with ambiguity and a bias toward action—you can
    operate without heavy process, make judgment calls, and
    keep momentum moving
  - Excellent written and spoken English—you’ll work across a
    globally distributed team and own your own communication
    end-to-end
  
  Who Thrives Here...
  
  At Nutrient, we’re not just hiring for skills — we’re hiring
  for mindset. The people who thrive here are:
  
  - Collaborators: You collaborate openly, listen actively, and
    prioritize team success over ego.
  - Hungry Learners: Rapid learning fuels progress and career
    growth.
  - Curious Thinkers: You dig deep to uncover the “why,” valuing
    understanding over simply being right.
  - Self-Starters: You take action without waiting for
    direction, turning obstacles into opportunities with
    creativity and persistence.
  - Owners: You take responsibility for solutions and outcomes,
    always looking for ways to improve what’s within your
    control.
  - Doers: You’re energized by progress, motivated to create
    meaningful impact, and eager to tackle challenges.
  
  Why You'll Love Working Here...
  
  At Nutrient, we build tools that reshape how businesses and
  developers work with documents. Our culture is centered on
  continuous growth and collaboration—every team member has
  room to learn, innovate, and drive meaningful change.
  
  - You’ll work on a genuinely mission-critical
    product—Nutrient’s document platform is trusted by 15%+ of
    the Global 500 across 80+ countries. This isn’t a nice-to-
    have tool; it’s infrastructure.
  - The team is at the forefront of how engineering
    evolves—actively rolling out agentic coding practices and
    AI tooling internally. You’ll be working the way you
    believe engineering should work, not playing catch-up.
  - Real ownership and real impact—Nutrient tripled revenue and
    nearly doubled ARR year-over-year. You’ll join a company
    with serious market traction and genuine room to shape how
    it grows.
  - Fully remote and globally distributed—work from anywhere
    within UTC −5 to UTC+7, alongside teammates across Europe,
    the US, and beyond.
  - Backed by Insight Partners with a strong acquisition track
    record (ORPALIS, Aquaforest, Integrify)—well-resourced,
    stable, and growing fast.
  
  Nutrient believes in equal opportunity. We employ people
  from many cultures and countries, celebrate diversity, and
  are committed to building a team that represents a variety
  of backgrounds, skill sets, and perspectives. We do not
  discriminate on the basis of race, color, religion, age,
  marital status, national origin, ancestry, physical or
  mental disability, medical condition, sexual orientation,
  gender identity or expression, or any other non-merit
  factor.
