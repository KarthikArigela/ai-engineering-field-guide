description: |
  Your mission You don't just want to build features - you
  want to build AI products that solve real problems for real
  users, with React as your primary tool and Python as a solid
  backend foundation? Then you're in the right place. We're a
  family-owned scale-up headquartered in Munich with over 400
  employees across five locations in Europe. Our platform
  gives thousands of people worldwide a flexible, self-
  determined way to work - and we're still growing. AI is not
  a trend for us: we've been running AI features in production
  long before the hype started - backed by a strong research
  team in NLP, Speech and Computer Vision. Now we're building
  a dedicated AI Unit that owns AI products end-to-end - like
  a startup inside a scale-up. We're looking for you: a
  (Senior) Full Stack Engineer (m/f/d) with a strong React
  foundation who lives end-to-end ownership and builds AI
  products that users can rely on every single day. Work fully
  remote or hybrid from our offices in Munich, Berlin or Sofia
  (Bulgaria). * __React-first UI development:__ You build
  complex, high-performance frontends with React Router 7+,
  TypeScript and deliberate component design - for voice
  interfaces, coaching tools and AI QA dashboards used by
  agents on a daily basis. * __AI integration from UI to
  service layer:__ You wire LLM APIs, voice models and NLP
  services into production-ready systems - and build the
  Python backends (FastAPI/Django) that make those
  integrations run reliably. * __End-to-end ownership:__ You
  take systems through their full lifecycle - from MVP and
  pilot to high-scale production systems processing thousands
  of calls per day. Performance, stability and monitoring
  (Prometheus/Grafana) are always on your radar. * __Solve
  real problems:__ Working closely with Product Managers, AI
  Engineers and other engineering teams, you translate
  business requirements into technical solutions that actually
  ship - pragmatic, impactful and user-focused. Good UX starts
  in the code. * __Creative freedom:__ You bring your own
  ideas to architecture decisions, component design and
  development processes. Your perspective shapes how our AI
  products look and work. Your skillset * __React expertise
  (must-have):__ You bring several years of hands-on
  experience with React and TypeScript - component
  architecture, state management, performance optimization and
  testing are part of your daily work, not just theory. You
  use React Router 7+ and modern patterns (Hooks, Composition)
  as a matter of course. * __Full stack breadth:__ You build
  solid Python backends with FastAPI or Django and are
  comfortable with BFF patterns, REST APIs and database
  integrations (PostgreSQL, MongoDB). Our stack: Python 3.11,
  React Router 7 with TypeScript, type hints and pre-commit
  hooks for clean code. * __AI integration experience:__
  You've shipped LLM APIs, voice services or NLP models into
  production systems - not just side projects. You know how to
  embed AI outputs into UIs that actually feel good to use. *
  __Tooling & infrastructure:__ Docker, Git and CI/CD
  pipelines are part of your everyday workflow. You're
  comfortable on Linux systems and ensure stable development
  and deployment processes. "You build it, you run it" -
  Prometheus and Grafana are familiar territory. * __Ownership
  & pace:__ You turn rough requirements into concrete tasks,
  work proactively with cross-functional teams, and know when
  clean code matters and when shipping fast matters more. Your
  winning deal * __Your Benefits:__ 30 vacation days, monthly
  lunch allowance (€69), "Givve" card topped up with
  €50/month, discounts via Corporate Benefits, JobRad leasing,
  pension scheme support, and legendary team/company events. *
  __Your Workplace:__ A modern, dog-friendly office and
  flexible hybrid working model. Plus: 2 weeks of "Workation"
  per year within the EU (for EU passport holders). * __Your
  Footprint:__ A key role in a profitable company where you’ll
  have the freedom and trust to shape our journey and help
  define the future of work. * Our Culture: We offer an open,
  authentic, and supportive team culture. We value bold
  decisions, fresh thinking, and humor – and we’re excited to
  take the next steps with you. * __Your Opportunity:__ From
  day one, you'll have the chance to take ownership, drive
  innovation, and grow together with a team of experts –
  shaping both the company and your career.
