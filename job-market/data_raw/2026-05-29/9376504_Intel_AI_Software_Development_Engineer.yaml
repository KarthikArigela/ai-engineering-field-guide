  Job Details:
  
  Job Description:
  
  Do Something Wonderful Intel put the Silicon in Silicon
  Valley. No one else is this obsessed with engineering a
  brighter future. Every day, we create world changing
  technology that enriches the lives of every person on earth.
  So, if you have a big idea, let's do something wonderful
  together. Join us, because at Intel, we are building a
  better tomorrow. Who We Are Decision Engineering Portfolio
  Systems team is on a mission to improve the speed and
  quality of Intel's decision-making and execution through the
  availability of data and analytics -- helping Intel's
  Product Groups (DCAI, CCG, etc.) and Engineering teams
  harness and direct their organizational capabilities and
  resources to make timely decisions, listen to customers and
  build the most technologically advanced products on Earth.
  In this role, you will work closely with architects, data
  scientists, engineers and product owners to design, develop,
  test, and debug the Portfolio Systems suite of software.
  This is an excellent opportunity to join a high performing
  team and help deliver on solutions that improve Intel's
  decision-making execution.
  
  Who You Are The ideal candidate must exhibit the following
  skills and behavioral traits.
  
  • Design, develop, troubleshoot, and debug software programs
  
  • Proven ability to collaborate across organizations and
  geographies
  
  • Proficiency to analyze software issues, and deliver top
  quality production software
  
  • Effective communication with the ability to present ideas
  in an organized fashion to various stakeholders
  
  • Strong desire to learn and explore new technologies
  
  • Demonstrate good analysis and problem-solving skills
  
  • Zeal for optimizing and maintaining quality code
  
  • High tolerance for ambiguity Join us at Intel and become a
  driving force in shaping tomorrow's innovations.
  
  Qualifications:
  
  You must possess minimum required education and minimum
  qualifications to be initially considered for this position.
  
  Preferred qualifications are in addition to the minimum
  requirements and are considered a plus factor in identifying
  top candidates.
  
  Minimum Qualifications
  
  - Bachelor's degree in electrical engineering or related field
    plus 4+ years of industry work experience, or?
  - Master's degree in electrical engineering or related field
    plus 3+ years of industry work experience, or
  - PhD in Electrical Engineering or related field plus 1 year
    of industry work experience
  - Industry work experience should include the following:
  - Developing and maintain complex C# or equivalent
    application.
  - Advanced proficiency with SQL.
  - Experience with software development lifecycle, and
    proficiency with debugging and software utility tools.
  - Solid understanding of prompt engineering, tool calling, and
    LLM-based workflows.
  
  Preferred Qualifications• Proficiency with .NET and VSTO.  •
  Experience with interop libraries. • Advanced proficiency
  with DB optimizations and indexes. • Experience with Unit
  Test and concept of Test Automation. • Experience with Web
  Service, Web API. • Experience with JavaScript. • Experience
  with NOSQL DB and MongoDB . • Experience with containerized
  technology and experience to write a docker file . • Ability
  to design and implement end-to-end AI applications (backend
  + API / light frontend). • Familiarity with retrieval-
  augmented generation (RAG) and external data integration.
  
  
  
