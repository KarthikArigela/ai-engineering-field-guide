description: |
  Who is Forcepoint?
  
  Forcepoint simplifies security for global businesses and
  governments. Forcepoint’s all-in-one, truly cloud-native
  platform makes it easy to adopt Zero Trust and prevent the
  theft or loss of sensitive data and intellectual property no
  matter where people are working. 20+ years in business. 2.7k
  employees. 150 countries. 11k+ customers. 300+ patents. If
  our mission excites you, you’re in the right place; we want
  you to bring your own energy to help us create a safer
  world. All we’re missing is you!
  
  JOB DESCRIPTION
  
  Prof III AI Engineer
  
  Engineering  •  Full-Time  •  AI Agents & Automation
  
  
  
  About the Role
  
  We’re looking for a curious and driven Junior AI Engineer to
  join our growing AI team. In this role, you’ll help design,
  build, and maintain intelligent automation systems and AI
  agents that drive real operational impact. This is an AI-
  first position — you’ll be expected to approach every
  problem with an AI-native mindset, exploring agent-based
  solutions before falling back to traditional approaches.
  
  Key Responsibilities
  
  - Build and maintain AI agents using frameworks such as
    LangChain, AutoGen, CrewAI, or similar agentic toolkits.
  
  - Develop automation pipelines that integrate LLMs with
    external tools, APIs, and data sources.
  
  - Assist in designing multi-agent workflows for task
    orchestration and autonomous decision-making.
  
  - Write clean, maintainable, well-tested backend code in
    Golang or Python — including unit and integration tests
    for AI-generated code.
  
  - Integrate AI agents with third-party services (databases,
    messaging platforms, REST APIs, etc.).
  
  - Monitor and debug agent behavior in production, identifying
    failure modes and improving reliability.
  
  - Collaborate with senior engineers and product teams to
    define agent capabilities and scope.
  
  - Document agent designs, configurations, and workflows
    clearly.
  
  Required Qualifications
  
  - 5-8 years of software engineering experience; hands-on
    AI/agent projects (personal, academic, or professional)
    are equally valued.
  
  - AI-first approach — demonstrated ability to think through
    problems using AI and automation before conventional
    solutions.
  
  - Proficiency in at least one of: Golang or Python (Python
    preferred for agent development; Golang for performance-
    critical services).
  
  - Hands-on experience with LLM APIs (OpenAI, Anthropic,
    Gemini, or open-source equivalents) and prompt engineering
    fundamentals, including tool/function calling.
  
  - Fluent with AI coding assistants (Claude Code, Cursor,
    GitHub Copilot, or similar) — skilled at providing clear
    context to get production-quality output, and able to
    critically review, debug, and refactor AI-generated code
    (your own and teammates’) rather than accepting it
    blindly.
  
  - Strong code ownership — you understand and can explain every
    line of code you submit, regardless of how it was
    generated, and follow secure coding practices.
  
  - Comfort working with REST APIs, JSON, and version control
    (Git).
  
  - Actively experiments with new AI coding workflows and shares
    learnings with the team.
  
  Nice to Have
  
  - Experience with agentic frameworks (LangChain, LlamaIndex,
    AutoGen, CrewAI, Haystack).
  
  - Exposure to vector databases or semantic search for agent
    memory/retrieval.
  
  - Familiarity with workflow automation tools (n8n, Zapier,
    Airflow).
  
  - Knowledge of both Golang and Python.
  
  - Any personal AI projects, bots, or automation tools you’ve
    shipped.
  
  
  
  Don’t meet every single qualification? Studies show people
  are hesitant to apply if they don’t meet all requirements
  listed in a job posting. Forcepoint is focused on building
  an inclusive and diverse workplace – so if there is
  something slightly different about your previous experience,
  but it otherwise aligns and you’re excited about this role,
  we encourage you to apply. You could be a great candidate
  for this or other roles on our team.
  
