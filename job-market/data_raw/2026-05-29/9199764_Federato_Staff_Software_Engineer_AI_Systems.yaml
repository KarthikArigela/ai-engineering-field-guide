title: Staff Software Engineer, AI Systems
company: Federato
location: USA
work_type: FULL_TIME
description: |
  Federato is on a mission to defend the right to efficient,
  equitable insurance for all. We enable insurers to provide
  affordable coverage to people and organizations facing the
  issues of today - the climate crisis, cyber-attacks, social
  inflation, etc. Our vision is understood and well funded by
  those behind Salesforce, Veeva, Zoom, Box, etc. Federato is
  the only AI-native platform that spans the full policy
  lifecycle and changes the way insurance work gets done.
  Better decisioning is built-in, not bolted on: insurers'
  unique portfolio goals, strategies, rules, and appetite are
  part of the workflow so underwriters win the right deals,
  faster. From the moment a submission hits an underwriter’s
  inbox, AI is put to work, triaging submissions with a focus
  on high-appetite business, delivering real-time feedback on
  the portfolio, and consolidating workflows into a single
  proven system. Federato drives better business outcomes.
  
  Role Overview:
  
  We are looking for an Software Engineer, AI Systems to help
  build the backend architecture behind our emerging agent
  systems. This role sits at the intersection of software
  engineering, data infrastructure, and applied AI. You will
  work across the stack to design and implement systems that
  power LLM-driven product capabilities — from orchestration
  and tool integration to evaluation and production
  deployment. You’ll collaborate closely with product
  managers, designers, and engineers to bring AI-powered
  workflows directly into our underwriting platform. This is a
  high-impact role with significant ownership over both
  experimentation and production implementation. This role is
  ideal for engineers who enjoy working across layers of the
  stack and are excited about shaping how agent systems
  operate inside real production software. What You'll Be
  Doing:
  
  - Design and implement agent workflows and orchestration
    systems for AI-powered product features
  - Build backend services that integrate LLMs with structured
    insurance data and platform APIs
  - Develop infrastructure for tooling, context management, and
    agent execution
  - Contribute to internal frameworks supporting prompt
    iteration, evaluation, and observability
  - Partner with product and design to translate underwriting
    workflows into AI-enabled product experiences
  - Help define architectural patterns for building reliable AI-
    native features in production
  - Work across backend systems, data infrastructure, and
    product integrations to ship user-facing capabilities
  
  Who We Hope You Are:
  
  - 10+ years of experience in backend engineering, data
    engineering, or related roles
  - Strong experience building production backend systems and
    APIs
  - Professional experience working with LLMs, agent systems, or
    generative AI applications
  - Hands-on experience with prompt design, tool-based agent
    architectures, or LLM workflows
  - Proficiency in Python or similar backend languages
  - Experience working with cloud infrastructure and distributed
    systems
  - Comfort working across layers of the stack, from
    infrastructure to product integration
  - Strong curiosity about emerging AI architectures and agent
    patterns
  - Comfortable navigating ambiguity and working in a fast-
    paced, collaborative environment
  
  Bonus Points if...
  
  - Experience building production systems involving LLMs,
    agents, or prompt pipelines
  - Experience designing internal platforms or developer tooling
  - Familiarity with insurance, fintech, or B2B SaaS
  - Contributions to open-source AI or data infrastructure
    projects
  - Experience with Typescript
  
  Why This Role Matters
  
  You will help build the core infrastructure that powers the
  next generation of Federato’s platform. Your work will shape
  how AI systems interact with underwriting workflows and how
  intelligent automation is delivered to customers. This is an
  opportunity to work on foundational architecture for agent-
  driven software, with real-world impact in one of the
  world’s largest industries.
  
  Base Salary: $215,000 - $250,000 a year Final offer amounts
  are determined by multiple factors including candidate
  location, experience and expertise and may vary from the
  amounts listed above. Total compensation package includes
  stock options, benefits and additional perks.
  
  Here at Federato, your capabilities are important, but
  culture fit is essential. We move fast, are eager to listen
  to our users, take a first principles approach to solving
  problems, and value learning and the ability to change our
  minds. Most importantly, we're here to have fun. Our ability
  to make a difference starts with our people. We would love
  to work with you!
  
  We are an equal-opportunity employer and value diversity at
  our company. We do not discriminate on the basis of race,
  religion, color, national origin, sex, gender expression,
  sexual orientation, age, marital status, veteran status or
  disability status. We will provide reasonable accommodation
  to individuals with disabilities to participate in the job
  application or interview process, to perform essential job
  functions, and to receive other benefits and privileges of
  employment. Please contact us to request accommodation at
  talent@federato.ai
