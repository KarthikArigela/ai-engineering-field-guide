description: |
  Location: Remote  Contract: 3–6 months (with potential to
  convert to permanent)
  
  ABOUT US |
  
  Whiteshield is a global advisory firm operating at the
  intersection of strategy, public policy, and digital
  transformation. We partner with governments and leading
  enterprises to design and deliver initiatives that drive
  economic competitiveness, digital enablement, and long-term
  growth.
  
  Our work combines strategic advisory with hands-on
  execution. We support senior decision-makers in navigating
  complex regulatory, economic, and technological
  environments, translating ideas into structured programmes,
  delivery frameworks, and measurable outcomes.
  
  Unlike traditional consultancies that focus solely on
  recommendations, we remain engaged through implementation;
  ensuring transformation is not only designed but realised.
  
  WHERE YOU FIT IN |
  
  We’re looking for a hands-on Senior Full Stack Developer who
  loves building real things.
  
  You will be joining us at an exciting stage, working across
  a mix of greenfield builds, product improvements, and AI-
  enabled features. We move fast, solve real problems, and
  care about clean, scalable code.
  
  This role is suited to engineers who have repeatedly taken
  ownership of complex systems end-to-end and can demonstrate
  deep technical judgement across the full stack. You’ve
  solved genuinely hard problems, not just implemented
  features, and you understand the trade-offs, architecture,
  and long-term implications of the solutions you build. We
  expect a high degree of autonomy, strong product thinking,
  and the ability to drive features from concept through to
  production with minimal oversight.
  
  WHAT YOU WILL DO |
  
  - Design and build end-to-end features across backend and
    frontend
  
  - Work with AI Tools (Primarily Claude Code/Cursor) to
    accelerate development
  
  - Develop scalable APIs and services using .NET
  
  - Create clean, responsive UIs using React (ideally with
    TypeScript)
  
  - Work with cloud infrastructure (Azure preferred)
  
  - Collaborate closely with product, design, and data teams
  
  - Contribute to system design decisions and improving
    architecture over time
  
  - Explore and integrate AI capabilities into products and
    workflows
  
  WHAT YOU CAN DO |
  
  - You can design solutions and not just implement
  
  - You ask the right questions before jumping into code
  
  - You can break down and solve real-world technical problems
  
  - You have practical experience building and shipping
    production-grade systems
  
  - You are comfortable working across the stack (.NET + React
    preferred)
  
  - You are curious about and have practical exposure to AI
    tools or integrations
  
  Requirements
  
  WHAT YOU’LL BRING |
  
  - Strong full stack experience (backend + frontend)
  
  - Solid experience with .NET / ASP.NET Web API
  
  - Frontend experience with React (ideally TypeScript)
  
  - Good understanding of APIs, databases, and system design
  
  - Experience working with cloud platforms (Azure preferred)
  
  - Exposure to CI/CD pipelines, testing, and modern dev
    practices
  
  - Bonus if you’ve worked with AI/LLM integrations or
    automation workflows
  
   (We are not looking for a pure architect but someone who is
  hands-on and practical and who enjoys building and shipping.
  
   WHAT WE VALUE |
  
   Curiosity and action: You take initiative and explore new
  ideas
  
  - Empathy and clarity: You’re a strong communicator and
    collaborator
  
  - Delivery and impact: You’re focused on outcomes, not just
    outputs
  
  - Passion and adaptability: You bring energy, depth, and
    flexibility to your work
  
  Benefits
  
  Meaningful impact Your work helps shape products used at
  national scale - enabling people to access services,
  opportunities, and support that make a real difference in
  everyday lives.
  
  Creative freedom You will have room to explore ideas, test
  approaches, and raise the bar for design quality - even in
  complex, regulated environments. We value thoughtful
  experimentation and encourage new ways of working.
  
  High-calibre collaboration You’ll work alongside talented
  people across policy, data, design, and technology -
  bringing different perspectives together to solve complex
  problems well.
  
  Flexibility that works We operate in an outcome-driven,
  remote-friendly way that respects individual working styles.
  Trust, autonomy, and balance are core to how we work.
  
  Supportive culture You will join a team that values respect,
  inclusion, and wellbeing - where people are encouraged to do
  their best work without burning out.
