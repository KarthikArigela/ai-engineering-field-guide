description: |
  NVIDIA has been transforming computer graphics, PC gaming,
  and accelerated computing for more than 25 years. It’s a
  unique legacy of innovation that’s fueled by great
  technology—and amazing people. Today, we’re tapping into the
  unlimited potential of AI to define the next era of
  computing. An era in which our GPU acts as the brains of
  computers, robots, and self-driving cars that can understand
  the world. Doing what’s never been done before takes vision,
  innovation, and the world’s best talent. As an NVIDIAN,
  you’ll be immersed in a diverse, supportive environment
  where everyone is inspired to do their best work. Come join
  the team and see how you can make a lasting impact on the
  world.
  
  We are seeking an AI Compiler Engineer with deep expertise
  in compiler technologies to join our team. The ideal
  candidate brings broad experience across machine learning,
  including reinforcement learning, genetic/evolutionary
  algorithms, predictive modeling, complex systems, and high-
  dimensional data analysis, along with strong foundations in
  compiler design and domain-specific languages. This role is
  focused on building AI-driven compiler intelligence for
  production compiler pipelines, delivering measurable
  improvements in performance and efficiency, and advancing
  LLM-enabled workflows for compiler decisioning and developer
  productivity.
  
  What you'll be doing:
  
  - Join a team driving innovative solutions in compilers and
    developer tools through applied machine learning and AI.
  - Collaborate with world-class engineers to shape next-
    generation compiler capabilities that power large-scale,
    high-impact products.
  - Design and implement end-to-end compiler optimization
    workflows, from feature engineering and model development
    to compiler integration and production rollout.
  - Develop and integrate learning-based decision systems into
    compiler passes, code generation flows, and optimization
    pipelines.
  - Build robust interfaces between LLM systems and compiler
    infrastructure for optimization recommendations, decision
    support, and workflow automation.
  - Partner with compiler, architecture, and performance teams
    to validate impact on representative workloads and
    benchmark suites.
  - Lead experimentation, evaluation, and deployment with strong
    standards for reliability, scalability, and performance.
  
  What we need to see:
  
  - BS/MS/PhD in Computer Science or a related field (or
    equivalent experience), with a focus on machine learning
    and compiler/developer tools.
  - 8+ years of software engineering and AI/ML experience,
    preferably in tools or systems development.
  - Strong knowledge of compilers, code generation, and GPU
    architecture.
  - Demonstrated proficiency in Python and C/C++.
  - Strong mathematical and scientific foundation relevant to
    AI/ML and compiler technologies.
  - Hands-on experience with LLVM/MLIR-based compiler
    development, including optimization passes, code
    generation, or frontend integration.
  - Experience building or integrating LLM-based systems,
    agents, or developer tooling in production environments.
  
  Ways to Stand Out From the Crowd
  
  - Deep familiarity with reinforcement learning,
    genetic/evolutionary algorithms, predictive modeling, and
    complex systems.
  - Proven track record of deploying AI/ML solutions in
    production and embedded environments.
  - Strong experience integrating LLMs into systems workflows
    with attention to reliability, latency, and evaluation
    quality.
  - Demonstrated measurable outcomes such as runtime gains,
    compile-time improvements, or efficiency improvements on
    real-world workloads.
  - Publications, open-source contributions, or patents in
    compilers, AI/ML systems, or performance engineering.
  
  With competitive salaries and a generous benefits package,
  we are widely considered to be one of the technology world’s
  most desirable employers. We have some of the most forward-
  thinking and hardworking people in the world working for us
  and, due to unprecedented growth, our exclusive engineering
  teams are rapidly growing. If you're a creative and
  autonomous program manager with a real passion for
  technology, we want to hear from you.
  
  Your base salary will be determined based on your location,
  experience, and the pay of employees in similar positions.
  The base salary range is 184,000 USD - 287,500 USD.
  
  You will also be eligible for equity and benefits.
  
  Applications for this job will be accepted at least until
  May 19, 2026.
  
  This posting is for an existing vacancy.
  
