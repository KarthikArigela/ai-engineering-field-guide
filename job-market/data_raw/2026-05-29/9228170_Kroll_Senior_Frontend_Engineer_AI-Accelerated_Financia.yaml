description: |
  Our team is building a global platform for illiquid asset
  management, running on Azure and Kubernetes, with a modern
  React frontend and backend stack spanning C# and Python
  APIs. Our system interfaces heavily with SQL server,
  including legacy business logic embedded in stored
  procedures.
  
  We are looking for a Senior Front-end Engineer who amplifies
  their output using AI tools, and who has experience building
  financial or highly-data intensive enterprise systems in
  cloud-native environments. This is a frontend-primary role
  for an engineer who can rapidly design, build, and ship
  high-quality UI systems in a complex, domain-heavy
  environment.
  
  Day-to-Day Responsibilities:
  
  - Lead development of complex, data-intensive UI features
    using React and TypeScript
  - Build scalable, maintainable component architectures and
    design systems
  - Translate complex backend and financial logic (including
    SQL-heavy workflows) into intuitive user experiences
  - Collaborate closely with backend teams (C#, Python APIs) to
    design clean, efficient API contracts
  - Optimize frontend performance, state management, and
    rendering efficiency
  - Operate as an AI-augmented engineer, using modern AI tools
    to significantly increase your development speed and
    quality – while maintaining strong engineering
    fundamentals
  - Use AI tools (Copilot, ChatGPT, Cursor, etc.) to scaffold
    components and accelerate day-to-day development
  - Pilot and orchestrate AI agents to handle multi-step
    engineering tasks, refactor and modularize codebases
    efficiently using AI assistance
  - Rapidly prototype and iterate on UI/UX flows, produce and
    maintain automated test coverage with AI-generated support
  - Debug performance and state issues using AI-driven
    workflows, know when AI helps and when to write it
    yourself
  - Build interfaces aligned to real-world financial and
    investment workflows
  - Design for complex use cases such as portfolio management,
    asset tracking, valuation or reporting while reducing
    friction in data-heavy user journeys
  - Optimize for usability, speed, and minimal cognitive load
    while partnering with product and domain experts to
    eliminate workflow bottlenecks
  - Build and operative effectively in Azure -hosted,
    Kubernetes-based environments
  - Understand how frontend systems interact with containerized
    backend services
  - Work within distributed architectures and understand
    performance implications end-to-end
  
  Essential Traits:
  
  - Five (5) + years of frontend engineering experience
  - Deep expertise in Reach and modern frontend architecture
  - Strong proficiency in TypeScript / JavaScript
  - Strong proficiency in State management (Redux, Zustand, or
    similar)
  - Experience with API integration (REST, GraphQL is a plus)
  - Experience building data-heavy, enterprise-grade
    applications
  - Experience building financial platforms or data-intensive
    systems, such as: asset management platforms, trading
    systems, portfolio analytics tools, and risk, valuation or
    reporting systems
  - Strong understanding of complex domain workflows and data
    models
  - Ability to translate domain complexity into clear, usable UI
  - Familiarity with the Azure ecosystem (DevOps, pipelines,
    cloud-hosted environments)
  - Practical, hands-on experience using AI tools in your daily
    development workflow
  - Ability to pilot AI agents and orchestrate multi-step AI-
    assisted tasks and a proven track record of shipping
    production-quality code with AI assistance
  - Strong ability to work across complex systems and ambiguous
    requirements and collaborate with backend teams
  - Strong UX intuition for complex, data-driven applications
  - Familiarity with C# and/or Python backend systems and
    experience building or maintaining design systems is a
    plus
  
  Your recruiter will be happy to walk you through your
  U.S.-specific benefits, which include:
  
  - Healthcare Coverage: Comprehensive medical, dental, and
    vision plans.
  - Time Off and Leave Policies: Generous paid time off (PTO),
    paid company holidays, generous parental and family leave.
  - Protective Insurances: Life insurance, short- and long-term
    disability coverage, and accident protection.
  - Compensation and Rewards: Competitive salary structures,
    performance-based incentives, and merit-based compensation
    reviews.
  - Retirement Plans: 401(k) plans with company matching.
  
  Please note that benefits may vary by region, department and
  role. We encourage you to speak with your recruiter to learn
  more about the specific benefits available for your
  position.
  
