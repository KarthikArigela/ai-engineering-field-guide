description: |
  About the Role:
  
  Grade Level (for internal use):
  
  09
  
  The Team: Our team is responsible for the design,
  architecture, and development of our client facing
  applications using a variety of tools that are regularly
  updated as new technologies emerge. You will have the
  opportunity every day to work with people from a wide
  variety of backgrounds and will be able to develop a close
  team dynamic with coworkers from around the globe.
  
  
  Responsibilities & Impact:
  
  The work you do will be used every single day, it’s the
  essential code you’ll write that provides the data and
  analytics required for crucial, daily decisions in the
  capital and commodities markets.
  
  - Solve problems, analyze and isolate issues.
  - Provide technical guidance and mentoring to the team and
    help them adopt change as new processes are introduced.
  - Champion best practices and serve as a subject matter
    authority.
  - Develop solutions to develop/support key business needs.
  - Engineer components and common services based on standard
    development models, languages and tools
  - Produce system design documents and lead technical
    walkthroughs
  - Produce high quality code
  - Collaborate effectively with technical and non-technical
    partners
  - As a team-member should continuously improve the
    architecture
  
  What We’re Looking For: Basic Qualifications:
  
  - 4-6 years of hands-on software development experience with
    strong engineering fundamentals.
  - Proficiency in Python (primary) for building AI services and
    integrations.
  - Experience with LLM application development (prompting,
    structured outputs, function/tool calling, conversation
    state, eval-driven iteration).
  - Strong understanding of Agentic AI concepts:
    planners/executors, tool routing, memory,
    reflection/critique loops, and failure recovery.
  - Practical experience using agent frameworks such as
    LangGraph, CrewAI, OpenAI Agents SDK, Semantic Kernel, or
    similar.
  - Working knowledge of MCP (Model Context Protocol):
    building/consuming MCP servers, defining tool schemas,
    connecting agents to external systems (files, DBs, SaaS),
    and managing permissions/scopes.
  - Experience building RAG pipelines: chunking strategies,
    embeddings, re-ranking, metadata filtering, and grounding
    responses with citations.
  - Experience with production concerns: observability
    (traces/metrics/logs), prompt/agent telemetry,
    cost/latency optimization, rate limits, and fallback
    strategies.
  - Knowledge of security and data handling for AI systems: PII
    controls, secrets management, access control, and safe
    tool execution/sandboxing.
  - Cloud and deployment experience (any): AWS,
    Docker/Kubernetes, serverless, and scalable API design.
  
  Preferred Qualifications:
  
  - Search Technologies: Query and indexing content for Apache
    Solr, Elastic Search
  - Working knowledge on CI/CD build/deployments
  - Big Data Technologies: Apache Spark, Spark SQL, Hadoop,
    Hive, Airflow
  - Data Science Search Technologies: Personalization and
    Recommendation models, Learn to Rank (LTR)
  - Database Technologies: MS SQL Server platform, stored
    procedure programming experience using Transact SQL.
  - Ability to lead, train and mentor.
  
