description: |
  About Nevis
  
  Nevis is building the world’s first AI wealth management
  platform. In just 9 months, Nevis has grown to have over $50
  billion of assets under management on its platform and is on
  track to have over $100 billion by the end of this year.
  
  Nevis is also backed by world leading investors and has
  raised a total of $40 million from Sequoia Capital, ICONIQ
  and Ribbit. Together it makes Nevis one of the highest
  funded and fastest growing Series A startups in Europe.
  
  The Role
  
  We are looking for a talented and driven AI Engineer to join
  our core team at Nevis where you will play a pivotal role in
  shaping the next-generation AI-first wealthtech product. You
  will address critical challenges faced by our business
  clients by building LLM-driven agentic automation pipelines.
  
  You’ll work with cutting-edge LLM models and collaborate
  with leading vendors to enhance our product’s reasoning
  capabilities and elevate the quality of our models’ outputs
  to industry-leading standards - constantly raising the bar
  higher.
  
  As part of a small, world-class team of engineers and
  product builders, including the former Head of AI at
  Revolut, you’ll have a unique opportunity to make a profound
  impact on one of the world’s largest industries.
  
  What You’ll Do
  
  - Design and build LLM and ML-powered products and features
    across Nevis’ platform.
  - Collaborate with engineers and product builders to bring new
    AI capabilities from experiment to production.
  - Establish best practices and design novel approaches for AI
    development, testing, observability, and reliability.
  - Continuously monitor and improve AI products performance and
    reasoning quality.
  - Partner with product and design teams to prototype and
    iterate on new AI features and products.
  - Stay ahead of the latest advances in Gen AI space, including
    agentic systems, reasoning capabilities and context
    engineering.
  
  Who You Are
  
  - Hands on experience with LLMs
  - Proven track record of solving real-world problems with AI /
    ML
  - Advanced statistical and data analysis skills
  - STEM degree from top university
  - Passionate about transformative AI technologies
  - Product-driven mindset: prioritizing practical ML solutions
    for better client outcomes
  - Proactive problem solver with "get it done" attitude
  - Excellent communication skills for effective team
    collaboration
  - Thrive in a fast-paced, high-growth environment and take
    ownership end-to-end
  
  Nice to Have
  
  - Prior experience in AI startups
  - Strong publications or GitHub profile
  
  Why Join Nevis?
  
  - Work alongside a high-calibre founding team backed by some
    of the best investors in the world.
  - A fast-paced, high-growth environment with the opportunity
    to shape how the business operates.
  - Be part of a mission-driven company transforming the wealth
    management industry with huge potential for global impact.
  - 25 days’ annual leave.
  - Private medical insurance.
  - Competitive salary and benefits package, including company
    equity.
