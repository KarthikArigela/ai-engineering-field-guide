description: |
  At Arctic Wolf, you will not just watch the cybersecurity
  industry evolve – you will help lead the change. Our global
  team is made up of people who thrive on solving complex
  problems, moving quickly, and building technology that
  protects organizations around the world. We are proud to be
  recognized by Forbes, CNBC, Fortune, CRN, Gartner Peer
  Insights, and International Data Corporation MarketScape.
  What matters most is the work behind these recognitions:
  delivering real outcomes for customers through award-winning
  innovation such as our Aurora Platform.
  
  If you are looking for meaningful work, smart teammates, and
  the opportunity to make a real impact in a high-growth
  company that is redefining security operations, Arctic Wolf
  is the right place for you.
  
  Our mission is simple: End Cyber Risk.
  
  We are looking for a Senior Quality Engineer - Artificial
  Intelligence Integration to help achieve this mission.
  
  The Senior Quality Engineer will contribute to our
  Engineering organization by building scalable automation
  frameworks and quality engineering solutions for artificial
  intelligence, machine learning, and cybersecurity
  applications. This role will focus on ensuring reliability,
  scalability, performance, and quality across distributed
  systems, cloud-native services, and large language model-
  driven applications. The Arctic Wolf security operations
  platform ingests and processes more than 600 billion events
  per day from a wide variety of on-premises devices and cloud
  platforms. The security pipeline is a distributed system of
  loosely coupled microservices that power real-time analysis
  and threat detection systems. These services transform
  incoming events into actionable intelligence used by Arctic
  Wolf Security Services teams to help protect customers.
  
  IN THIS ROLE, YOU WILL:
  
  • Create and extend software frameworks and tools to
  execute, monitor, and report on automated tests • Build and
  maintain automation frameworks and continuous integration
  and continuous delivery pipelines • Review testing
  strategies, approaches, and test plans while providing
  guidance to development teams • Architect, design, and build
  automation solutions for application programming interface
  validation, performance testing, load testing, and fuzz
  testing • Develop and maintain testing frameworks for
  generative artificial intelligence and machine learning
  applications • Validate model behavior, prompt-response
  consistency, hallucination detection, and regression testing
  for artificial intelligence inference application
  programming interfaces • Implement evaluation pipelines to
  measure large language model accuracy, latency, bias,
  toxicity, and reliability • Collaborate with highly skilled
  software engineering professionals across teams •
  Continuously improve engineering quality, automation
  practices, and testing methodologies • Learn and adopt
  emerging technologies in artificial intelligence,
  cybersecurity, cloud engineering, and distributed systems
  
  OUR TECHNOLOGY STACK INCLUDES:
  
  • Selenium • Playwright • Docker • Kubernetes • Amazon Web
  Services including Bedrock, Lambda, Simple Queue Service,
  and Simple Storage Service • LangChain • Large language
  model evaluation frameworks such as Ragas • OpenAPI •
  PostgreSQL • Linux
  
  YOU WILL BE SUCCESSFUL IN THIS ROLE IF:
  
  • You are excited to work at the intersection of artificial
  intelligence, machine learning, big data, and cybersecurity
  • You have more than 8 years of experience delivering high-
  quality software solutions • You are passionate about
  driving software quality through automation and testing •
  You have experience deploying services on cloud computing
  platforms such as Amazon Web Services, Microsoft Azure, or
  Google Cloud Platform • You have strong expertise with tools
  used for functional testing, load testing, and fuzz testing
  such as Locust and CATS • You have experience building
  automation frameworks and continuous integration and
  continuous delivery pipelines • You have experience working
  with distributed systems and microservices architectures •
  You possess strong programming, debugging, and problem-
  solving skills in modern software engineering environments •
  You continuously adapt to emerging technologies, testing
  methodologies, and engineering best practices
  
  Nice to have:
  
  • Experience testing artificial intelligence or machine
  learning applications • Familiarity with large language
  model evaluation techniques and prompt engineering •
  Experience working within cybersecurity or cloud-native
  environments • Experience building scalable testing
  infrastructure for distributed systems
  
  WHAT SUCCESS LOOKS LIKE:
  
  • Scalable and reliable automated testing frameworks
  supporting high-throughput distributed systems • Improved
  software quality, reliability, and deployment confidence
  across engineering teams • Comprehensive validation
  pipelines for artificial intelligence and machine learning
  systems • Proactive identification of quality, performance,
  and scalability issues before production deployment • Strong
  collaboration across engineering teams to deliver resilient
  and high-performing systems
  
  Do not meet all the requirements? That is okay. We still
  encourage you to apply. We have many opportunities and are
  always looking for strong talent.
  
  On-Camera Policy
  
  To support a fair, transparent, and engaging interview
  experience, candidates interviewing remotely are expected to
  be on camera during all video interviews. Being on camera
  fosters authentic connection, improves communication, and
  allows for full engagement from both candidates and
  interviewers. We understand that technical, bandwidth, or
  location-related challenges may occasionally prevent video
  use. If this applies, candidates are required to notify us
  in advance so we can explore appropriate accommodations.
  
  At Arctic Wolf, we foster a collaborative and inclusive work
  environment that thrives on diversity of thought,
  background, and culture. This is reflected in our multiple
  awards, including Top Workplace United States, Best Places
  to Work United States, Great Place to Work Canada, Great
  Place to Work United Kingdom, and Kununu Top Company
  Germany. Our commitment to bold growth and shaping the
  future of security operations is matched by our dedication
  to customer satisfaction, with over 10,000 customers
  worldwide and more than 2,000 channel partners globally. As
  we continue to expand and enhance our technology, Arctic
  Wolf remains a trusted name in the industry.
  
  Our Values
  
  Arctic Wolf recognizes that success comes from delighting
  our customers, so we work together to ensure that happens
  every day. We believe in diversity and inclusion and value
  the unique perspectives all employees bring to the
  organization. By protecting sensitive data and working to
  end cyber risk, we contribute to an industry that serves the
  greater good.
  
  We celebrate diverse perspectives through our Pack Unity
  program and encourage employees to participate in or create
  new alliances.
  
  We also believe in corporate responsibility and have joined
  the Pledge One Percent movement to give back to our
  communities.
  
  All employees receive compelling compensation and benefits
  packages, including:
  
  • Equity for all employees • Flexible annual leave, paid
  holidays, and volunteer days • Training and career
  development programs • Comprehensive private benefits plan
  including medical insurance for you and your family, life
  insurance equal to three times compensation, and personal
  accident insurance • Fertility support and paid parental
  leave
  
  Arctic Wolf is an equal opportunity employer and considers
  applicants for employment without regard to race, color,
  religion, sex, orientation, national origin, age,
  disability, genetics, or any other basis forbidden under
  applicable law. We are committed to fostering a welcoming,
  accessible, and inclusive environment.
  
  Security Requirements
  
  • Conduct duties in accordance with Arctic Wolf information
  security policies, standards, and controls • Background
  checks are required for this position • This role may
  require access to information protected under United States
  export control laws and regulations
