description: |
  Description
  
  Founded in 2004, BME Strategies is a Massachusetts-based
  consulting firm specializing in the design, implementation,
  and evaluation of public health programs for local,
  regional, and state government partners. Our work supports
  evidence-based, community-driven solutions that strengthen
  public health systems and advance equity across the
  communities we serve. At BME, our clients are on the front
  lines of Public Health. Priorities may shift but our
  commitment to supporting our partners does not. We take
  pride in having multi-year, multi-project engagements, often
  working closely as an extension of their staff. Our success
  comes from our shared values: a bias toward action;
  optimistically collaborative; willingness to navigate
  ambiguity; minimal ego - no job is too small or big;
  pursuing the equitable solution; always learning, and;
  committed to quality at every stage.
  
  Position Overview
  
  BME Strategies is seeking a Junior Engineer, AI to help
  design and build AI-powered tools that advance our public
  health capabilities. Reporting to the AI Committee Lead,
  you'll work across multiple cloud platforms and AI
  ecosystems to develop real solutions to real problems.
  
  This is a hands-on role ideal for someone who loves building
  things and wants their work to make a lasting impact. This
  role will translate emerging AI technologies into practical
  tools that help our team work smarter and serve clients
  better.
  
  RequirementsKey Responsibilities
  
  - AI Tool Development [70%]
  - Communication & Collaboration [20%]
  - Research & Quality [10%]
  
  Experience, Qualification, & Skills
  
  Required:
  
  - 1 year of relevant experience and a Bachelor's degree
    required; recent college graduates encouraged to apply.
  - Strong Python (or similar) programming skills.
  - Proven experience designing and implementing retrieval-
    augmented generation (RAG) systems.
  - Hands-on experience with at least one major cloud platform
    (GCP, AWS, or Azure).
  - Experience with vector databases, including open-source
    solutions, and cloud-native vector search offerings.
  - Experience working with LLM APIs (OpenAI, Anthropic Claude,
    Gemini, etc.).
  - Familiarity with Google AppScript or similar automation
    tools.
  - Experience testing LLM outputs for accuracy, reliability,
    and performance.
  - Strong communication skills with non-technical audiences.
  - Ability to work independently and as part of a team in a
    fast-paced remote consulting environment.
  - And an alignment with BME’s shared values.
  
  Preferred:
  
  - Experience with frameworks like LangChain, LlamaIndex, or
    similar.
  - Familiarity with MLOps tools and practices for deploying,
    monitoring, and managing models in production (e.g.,
    Docker).
  - Experience writing production-level SQL and working with
    data warehousing solutions (e.g., BigQuery, Snowflake).
  - Experience with data privacy tools such as Google DLP.
  - Interest in or experience within public health, healthcare,
    or government sectors.
  - Optimistic and solution-focused.
  - Ability to concisely summarize technical ideas.
  
  Work Environment
  
  - BME Strategies in a remote-first organization; this is a
    full-time position based in a home office environment
    within the U.S.
  
  BenefitsCompensation & Benefits
  
  - BME Strategies offers a competitive compensation package
    that includes:
  
  - The salary range for this position is $70,720 - $83,200
    annually.
  
  Please note: New employees are typically brought into the
  organization at a salary between the range minimum and the
  salary range midpoint, dependent upon internal equity and
  the budgeted amount for the position.  While we do our best
  to align the starting salary with the needs of the new hire,
  BME Strategies does not negotiate starting salary offers.
  
  How to Apply
  
  - To apply for this position, please complete and submit all
    information in the application link.
  - We expect a large volume of applicants for this position and
    only those candidates invited to move forward in the
    interview process will be contacted.
  - Important Notice on Recruitment Fraud: BME Strategies
    communicates with applicants only through email addresses
    ending @bmestrategies.com. We do not use third-party
    domains for recruitment outreach. If you receive
    communication from a different email address, please do
    not respond and report it to us at info@bmestrategies.com
  - Please note that BME Strategies is unable to sponsor work-
    related visas.
  - BME Strategies is made up of individuals with different
    strengths, experiences, and backgrounds. Diversity not
    only includes race and gender identity but also age,
    disability status, veteran status, sexual orientation,
    religion, and many other parts of one’s identity. These
    varied points of view are key to our success, and
    inclusion is everyone's responsibility. BME Strategies is
    an equal opportunity employer. All qualified applicants
    will be considered for employment without unlawful
    discrimination based on race, color, creed, national
    origin, sex, age, disability, marital status, sexual
    orientation, military status, prior record of arrest or
    conviction, or current employment status.
