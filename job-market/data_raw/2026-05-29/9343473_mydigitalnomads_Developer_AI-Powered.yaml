  Job Description -
  
  About us:
  
  My Digital Nomads are a truly global collective of people
  who can band together and power your business, giving you a
  global presence without the hassle.
  
  We position ourselves between clients who need teams and
  services and the world of digital nomads and remote workers
  in order to power the services our clients need and power
  the lives our nomads want.
  
  We work in an environment of growth, creativity, and
  collaboration, we aim to create a workplace where our team
  thrive, grow, and achieve their full potential.
  
  Job Description
  
  Job Overview: We are seeking an AI-Powered Developer who
  embraces the future of software development through AI-
  assisted coding tools and agentic AI methodologies. This
  role is perfect for frontend specialists, backend
  specialists, or full-stack developers who want to leverage
  AI tools to expand their capabilities and accelerate their
  development workflow. You'll work in a dynamic R&D
  environment where we continuously experiment with cutting-
  edge AI development tools like Cursor, Kilocode, and
  emerging technologies. Our tech stack evolves rapidly—what
  we use today may change by the time you join—so we
  prioritize adaptability, learning agility, and a deep
  understanding of how to harness AI as your development
  partner. Currently, our stack includes CodeIgniter REST
  APIs, PHP, Alpine.js, and Tailwind CSS, but your ability to
  learn and adapt with AI assistance matters more than
  specific framework experience.
  
   This role is primarily remote. However, candidates must be
  UK based, as training sessions and strategy retreats are
  regularly held in Cheshire.
  
  ⚠️ Important: Strong Fundamentals Required
  
  We use AI extensively to accelerate development, but we need
  developers with solid programming fundamentals who can
  architect solutions, debug complex issues, and write quality
  code independently. AI is a powerful tool in your hands—not
  a replacement for understanding how things work.
  
  Key Responsibilities:
  
  - AI-Assisted Full Stack Development: Utilize AI-powered
    development tools (Cursor, Kilocode, GitHub Copilot) to
    accelerate development across our entire stack—from REST
    APIs and backend architecture to responsive frontends.
    Currently working with CodeIgniter, PHP, Alpine.js, and
    Tailwind CSS across public websites, admin panels, and
    user dashboards. Critically review and refactor all AI-
    generated code to ensure it meets production standards.
  - Agentic AI Integration & Innovation: Understand and
    implement agentic AI concepts in the development workflow,
    including autonomous code generation, intelligent
    refactoring, and automated testing. Participate actively
    in our R&D initiatives to experiment with new AI tools and
    shape our evolving methodologies.
  - Code Quality & Problem Solving: Write clean, maintainable,
    well-documented code with comprehensive testing.
    Independently diagnose and fix complex bugs using
    systematic debugging approaches. Make informed
    architectural decisions and technical trade-offs that
    balance AI assistance with human expertise.
  - Rapid Adaptation: Quickly learn and adapt to our evolving
    tech stack as we research and adopt new technologies. Use
    AI as your learning accelerator while maintaining deep
    understanding of underlying concepts.
  - Collaboration: Work effectively with project managers,
    designers, and developers in our fully remote environment.
    Communicate technical concepts clearly and contribute
    meaningfully to architectural decisions.
  
  Qualifications:
  
  - Strong Programming Fundamentals: Solid understanding of data
    structures, algorithms, object-oriented programming, and
    design patterns. Comfortable explaining how your code
    works and making informed architectural decisions.
  - Proven Experience: Minimum 2-3 years of professional
    software development with a portfolio or GitHub profile
    showing real contributions. Strong foundation in frontend,
    backend, or full-stack development.
  - AI Development Proficiency: Demonstrated experience using
    AI-assisted development platforms (Cursor, GitHub Copilot,
    Kilocode) as productivity enhancers while maintaining code
    quality. Understanding of agentic AI concepts in software
    development contexts.
  - Technical Skills: Experience with RESTful API development,
    modern JavaScript frameworks, responsive design, database
    design, and Git workflows. Familiarity with our current
    stack (PHP/CodeIgniter, Alpine.js, Tailwind CSS) is
    helpful but not required—learning agility matters more.
  - Problem-Solving & Communication: Strong analytical and
    debugging skills with ability to work independently and
    explain technical concepts clearly in a remote
    environment.
  
  Technical Assessment:
  
  Candidates will complete a practical coding assessment
  evaluating both technical skills and ability to work
  effectively with AI tools.
  
  Working Conditions:
  
  - Role Type: Digital Nomad, Fully Remote
  - Contract Type: Contractor / Freelancer (Not Direct Cyprus
    Hire)
  - Rate Type: Day Rate
  - Working Days: 5 Days per week on offer
  - Working Hours: Based on identified needs, flexible
  - Wellbeing Allowance: Yes
  
