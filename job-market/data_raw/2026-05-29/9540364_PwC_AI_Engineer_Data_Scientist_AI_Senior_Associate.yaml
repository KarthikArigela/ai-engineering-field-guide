title: AI Engineer / Data Scientist, AI Senior Associate
company: PwC
location: Los Angeles, USA
work_type: FULL_TIME
description: |
  At PwC, our people in audit and assurance focus on providing
  independent and objective assessments of financial
  statements, internal controls, and other assurable
  information enhancing the credibility and reliability of
  this information with a variety of stakeholders. They
  evaluate compliance with regulations including assessing
  governance and risk management processes and related
  controls. Those in data, analytics and technology solutions
  at PwC will assist clients in developing solutions that help
  build trust, drive improvement, and detect, monitor, and
  predict risk. Your work will involve using advanced
  analytics, data wrangling technology, and automation tools
  to leverage data and focus on establishing the right
  processes and structures to enable our clients to make
  efficient and effective decisions based on accurate
  information that is complete and trustworthy. Focused on
  relationships, you are building meaningful client
  connections, and learning how to manage and inspire others.
  Navigating increasingly complex situations, you are growing
  your personal brand, deepening technical expertise and
  awareness of your strengths. You are expected to anticipate
  the needs of your teams and clients, and to deliver quality.
  Embracing increased ambiguity, you are comfortable when the
  path forward isn't clear, you ask questions, and you use
  these moments as opportunities to grow. Examples of the
  skills, knowledge, and experiences you need to lead and
  deliver value at this level include but are not limited to:
  Respond effectively to the diverse perspectives, needs, and
  feelings of others. Use a broad range of tools,
  methodologies and techniques to generate new ideas and solve
  problems. Use critical thinking to break down complex
  concepts. Understand the broader objectives of your project
  or role and how your work fits into the overall strategy.
  Develop a deeper understanding of the business context and
  how it is changing. Use reflection to develop self
  awareness, enhance strengths and address development areas.
  Interpret data to inform insights and recommendations.
  Uphold and reinforce professional and technical standards
  (e.g. refer to specific PwC tax and audit guidance), the
  Firm's code of conduct, and independence requirements. The
  Opportunity As part of the Audit and Assurance team, you
  will engage in the evaluation and assessment of AI
  solutions, securing compliance and governance. As a Senior
  Associate, you will lead efforts in managing AI/ML controls
  while collaborating with diverse teams to enhance
  transparency and reporting. This position provides an
  exciting opportunity to shape the future of AI governance
  and contribute to innovative thought leadership in the
  industry. Responsibilities
  - Evaluate and assess AI solutions to confirm compliance with
    governance standards
  - Lead initiatives for managing AI/ML controls across diverse
    teams
  - Enhance transparency and reporting processes within AI
    projects
  - Collaborate with stakeholders to develop innovative thought
    leadership
  - Analyze and interpret data to inform governance strategies
  - Provide guidance on recommended practices for AI compliance
  - Support the implementation of impactful reporting frameworks
  - Drive continuous improvement in AI governance practices
  What You Must Have
  - Bachelor's Degree
  - At least 2 years of experience
  What Sets You Apart
  - Bachelor's Degree in Statistics, Management Information
    Systems & Accounting, Accounting & Technology, Business
    Administration/Management, Regulatory Compliance, Physics,
    Economics and Finance & Technology, Computer Science, Data
    Processing/Analytics/Science, or Mathematics preferred
  - Experience in AI/ML model and testing and validation, risk
    management, controls testing, or audit related to AI,
    analytics, or information systems, governance or
    compliance roles focused on AI, emerging technology, or
    digital systems
  - Experience with model evaluation frameworks and testing
    protocols
  - Familiarity with data science and AI lifecycle
  - Understanding of data governance and model deployment
    disciplines
  - Leading AI/ML and emerging technology control efforts
  - Coaching teams on emerging data technologies
  - Translating technical concepts for non-technical
    stakeholders
  - Subject matter knowledge to support thought leadership
  The salary range for this position is: $72,000 - $184,440.
  For residents of Washington state the salary range for this
  position is: $72,000 - $212,000. Actual compensation within
  the range will be dependent upon the individual's skills,
  experience, qualifications and location, and applicable
  employment laws. All hired individuals are eligible for an
  annual discretionary bonus. PwC offers a wide range of
  benefits, including medical, dental, vision, 401k, holiday
  pay, vacation, personal and family sick leave, and more. To
  view our benefits at a glance, please visit the following
  link: https://pwc.to/benefits-at-a-glance As PwC is an equal
  opportunity employer, all qualified applicants will receive
  consideration for employment at PwC without regard to race;
  color; religion; national origin; sex (including pregnancy,
  sexual orientation, and gender identity); age; disability;
  genetic information (including family medical history);
  veteran, marital, or citizenship status; or, any other
  status protected by law. PwC does not intend to hire
  experienced or entry level job seekers who will need, now or
  in the future, PwC sponsorship through the H-1B lottery,
  except as set forth within the following policy:
  https://pwc.to/H-1B-Lottery-Policy. Learn more about how we
  work: https://pwc.to/how-we-work For only those qualified
  applicants that are impacted by the Los Angeles County Fair
  Chance Ordinance for Employers, the Los Angeles' Fair Chance
  Initiative for Hiring Ordinance, the San Francisco Fair
  Chance Ordinance, San Diego County Fair Chance Ordinance,
  and the California Fair Chance Act, where applicable, arrest
  or conviction records will be considered for Employment in
  accordance with these laws. At PwC, we recognize that
  conviction records may have a direct, adverse, and negative
  relationship to responsibilities such as accessing sensitive
  company or customer information, handling proprietary
  assets, or collaborating closely with team members. We
  evaluate these factors thoughtfully to establish a secure
  and trusted workplace for all.
