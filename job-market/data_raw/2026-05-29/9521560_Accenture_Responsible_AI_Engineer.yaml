description: |
  Project Role : Responsible AI Engineer Project Role
  Description : Assess AI systems for adherence to predefined
  thresholds and benchmarks related to responsible, ethical
  and sustainable practices. Design and implement technology
  mitigation strategies for systems to ensure ethical and
  responsible standards are achieved. Must have skills :
  Responsible AI Good to have skills : NA Minimum 5 year(s) of
  experience is required Educational Qualification : 15 years
  full time education Summary: As a Responsible AI Engineer,
  you will engage in the critical assessment of artificial
  intelligence systems to ensure they meet established
  thresholds and benchmarks for responsible, ethical, and
  sustainable practices. Your typical day will involve
  designing and implementing technology mitigation strategies
  that uphold ethical standards, collaborating with various
  teams to address challenges, and contributing to the
  development of innovative solutions that promote responsible
  AI usage across the organization.
  
  Roles & Responsibilities:
  - Expected to be an SME.
  - Collaborate and manage the team to perform.
  - Responsible for team decisions.
  - Engage with multiple teams and contribute on key decisions.
  - Expected to provide solutions to problems that apply across
    multiple teams.
  - Facilitate training sessions to enhance team understanding
    of responsible AI practices.
  - Monitor and evaluate the effectiveness of implemented
    strategies to ensure compliance with ethical standards.
  
  Professional & Technical Skills:
  - Must To Have Skills: Proficiency in Responsible AI & Python
  - Strong understanding of ethical AI frameworks and
    guidelines.
  - Experience with risk assessment methodologies related to AI
    systems.
  - Ability to analyze and interpret data to inform decision-
    making.
  - Familiarity with regulatory requirements and compliance
    standards in AI.
  
  Additional Information:
  - The candidate should have minimum 3 to 5 years of experience
    in Responsible AI.
  - This position is based at our Bengaluru office.
  - A 15 years full time education is required.
  
  15 years full time education
  
