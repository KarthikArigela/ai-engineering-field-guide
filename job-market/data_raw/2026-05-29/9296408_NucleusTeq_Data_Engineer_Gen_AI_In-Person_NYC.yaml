  Role Data Engineer + Gen AI  Location NYC (Hybrid) Duration:
  12+ Months Interview Mode In-Person Interview
  
  Company Description
  
  NucleusTeq is a global leader in software services,
  specializing in Generative AI, Machine Learning, Data
