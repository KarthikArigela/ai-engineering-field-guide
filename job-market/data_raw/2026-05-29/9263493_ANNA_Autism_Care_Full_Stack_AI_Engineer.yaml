description: |
  Full-Stack AI Engineer
  
  Poland (Remote)
  
  ﻿$40 - $80 USD per hour / zł143.93 - zł287.52 per hour
  
  About ANNA (Allied Network for Neurodevelopmental
  Advancement)
  
  ANNA is on a mission to transform how autism care is
  delivered, leveraging technology to standardize the highest
  quality of clinical care for autistic individuals across
  specialties, at scale.
  
  We believe the future of neurodevelopmental care is AI-
  native: where every clinician is enabled by intelligent
  tooling, every workflow is optimized for impact, and every
  child receives care anchored in real-time data and evidence.
  We're rebuilding the operating model from the ground up —
  using AI to drive operational excellence, clinician
  enablement, and clinical quality simultaneously.
  
  That means building high-impact AI agents and products with
  velocity across the full stack, from RCM automation and
  scheduling to clinical decision support and longitudinal
  outcome tracking. Our stack is React, Django, FastAPI, and
  Postgres — with pgvector powering the retrieval layer and
  MCP servers as our composability layer.
  
  Position Overview
  
  We're looking for a Full-Stack AI Engineer based in Warsaw
  to join our engineering team, working closely with our US-
  based VP of Engineering and clinical stakeholders to build
  the agentic infrastructure and product surfaces that power
  ANNA's platform.
  
  This is a hands-on, high-ownership role. You'll ship across
  the full stack — building both the AI agent backends and the
  clinician-facing product surfaces they power — while
  contributing to the shared data ontology and MCP server
  suite that makes ANNA's architecture composable across
  specialties. Warsaw's CET/CEST timezone gives you natural
  afternoon overlap with our US East Coast team, enabling
  meaningful real-time collaboration alongside deep focus time
  in your mornings.
  
  Key Responsibilities
  
  AI Agent Development
  
  - Build and maintain production-grade AI agents that take
    action across ANNA's clinical and operational workflows —
    scheduling, intake, RCM, clinical decision support — using
    LLM reasoning over our shared data ontology.
  - Design and implement tool use, state management, and failure
    handling for multi-agent workflows, ensuring reliability
    and quality in production.
  - Contribute to ANNA's MCP server suite, exposing core data
    and product surfaces — Salesforce, scheduling, RCM, HR —
    to AI agents in a standardized, composable way.
  - Implement and optimize RAG pipelines using pgvector,
    including embedding strategies and vector search, to
    surface relevant clinical history at the point of care.
  
  Full-Stack Product Development
  
  - Build and iterate on clinician-facing product surfaces in
    React, ensuring they integrate seamlessly with ANNA's AI
    agent backend and fit the real-world workflows of clinical
    teams.
  - Own features end-to-end: from backend API design in
    Django/FastAPI through to the front-end experience, with a
    high bar for quality at every layer.
  - Iterate quickly in the open with clinical and operational
    end users, incorporating feedback and shipping
    improvements with velocity.
  
  Data & Infrastructure
  
  - Contribute to ANNA's clinical data ontology — the shared,
    specialty-agnostic data foundation that powers all AI
    agents, decision support, and outcome measurement across
    the platform.
  - Write clean, well-documented, HIPAA-compliant code and
    contribute to CI/CD pipelines and engineering best
    practices as the team scales.
  - Participate in architecture discussions and help make
    pragmatic build vs. buy decisions across the stack.
  
  Qualifications
  
  - 4+ years of software engineering experience, with
    demonstrated full-stack capability across front-end
    (React) and back-end (Django, FastAPI, or equivalent
    Python frameworks).
  - Hands-on experience building AI agents or agentic workflows,
    with practical understanding of LLM tool use, prompt
    design, and production reliability considerations.
  - Experience with RAG pipelines, vector databases (pgvector,
    Pinecone, Weaviate, or similar), and embedding-based
    retrieval in production or near-production contexts.
  - Familiarity with MCP or equivalent tool-calling/integration
    protocols a strong plus.
  - Experience working in healthcare or other regulated
    environments (HIPAA, GDPR) preferred; genuine care for
    data privacy and security readiness.
  - Professional proficiency in English
  
  Skills & Competencies
  
  - Strong product instincts — you think about the end user, not
    just the technical implementation, and hold a high bar for
    what you ship.
  - Comfort with velocity: shipping fast, iterating in the open,
    and maintaining quality under pressure.
  - Clear written communicator who can engage effectively with
    non-technical clinical and operational stakeholders across
    time zones.
  - Mission alignment and genuine interest in the role
    technology can play in improving outcomes for autistic
    children and their families.
  
  What We Offer
  
  - Competitive rates benchmarked to the Warsaw market
  - Engaged via a Contractor of Record (CoR) arrangement — we
    handle all local compliance, contracting, and payments so
    you can focus on the work.
  - Fully remote within Poland
  - Flexible working hours with meaningful afternoon overlap
    with our US East Coast team (EST/EDT).
  - High-ownership, high-autonomy role with direct impact on a
    platform that touches real children and families.
  - A collaborative, mission-driven team building something
    genuinely novel in one of the most underserved areas of
    pediatric healthcare.
  
  ANNA is an equal opportunity employer. We’re committed to
  creating a diverse, inclusive, and supportive workplace. If
  you’re passionate about our mission but don’t meet every
  qualification listed, we still encourage you to apply. Your
  unique perspective might be exactly what we need.
