description: |
  About Zuora
  
  At Zuora, we help businesses grow smarter and adapt faster.
  Our platform powers modern business models — from
  subscriptions and usage-based pricing to AI-driven and
  outcome-based offerings — helping companies launch new
  products, automate complex billing, and unlock predictable,
  recurring revenue.
  
  We’ve led the Subscription Economy for more than a decade.
  Now we’re evolving again by building the definitive platform
  for quote to cash and helping companies monetize their
  products and services with an adaptable, AI-ready
  foundation.
  
   The Opportunity
  
  As a Senior AI Engineer, you will be a high-velocity builder
  within our Corporate Operations team, bridging the gap
  between raw LLM capabilities and functional enterprise
  software.
  
  You will thrive in a vibe coding environment, using AI to
  accelerate development, rapidly prototype ideas, and
  maintain a flow state while shipping impactful code. This is
  an opportunity to contribute to a forward-thinking company
  during a critical transformative phase, where your expertise
  will directly shape our business evolution.
  
  In this role, you will:
  
  - Design and build the glue between AI agents and core
    business systems such as Salesforce, NetSuite, Slack, and
    other internal platforms using APIs, events, and webhooks
  - Leverage modern AI coding assistants such as Cursor and
    Codex to accelerate development, generate boilerplate,
    debug issues, and refactor quickly
  - Rapidly prototype and ship AI-powered internal tools in a
    high-velocity environment, moving from concept to
    production with strong engineering judgment
  - Parse, understand, and enhance existing internal codebases,
    integrating AI capabilities into brownfield systems
    without disrupting production workflows
  - Architect advanced RAG pipelines and agentic workflows that
    bring context-aware intelligence to internal knowledge and
    operational systems
  - Implement rigorous evaluation and testing approaches for AI
    outputs to ensure speed does not compromise accuracy,
    security, or trust
  - Collaborate with stakeholders across the enterprise to
    deliver solutions that improve how work gets done
  - Assist colleagues with design and coding best practices,
    including code reviews, documentation, and maintainable
    implementation patterns
  - Partner with Enterprise Architecture and adjacent teams to
    ensure AI integrations align with the broader digital
    ecosystem
  - Lead troubleshooting for production issues in AI-enabled
    workflows, perform root-cause analysis, and help build
    support-ready systems
  
  Your work will directly influence company objectives by
  accelerating internal tool delivery, improving how teams
  interact with enterprise systems, and making AI genuinely
  actionable inside Corporate Operations.
  
   About You
  
  You are a passionate and experienced builder who enjoys
  solving meaningful business problems with practical AI-
  powered solutions. You are equally comfortable thinking big
  picture and diving deep into technical details, and you
  thrive in fast-moving environments where experimentation and
  iteration are valued.
  
  You likely bring:
  
  - 8+ years of relevant work experience and a Bachelor’s degree
    in Computer Science or a related technical discipline
  - 5+ years of experience as a full-stack developer
  - Strong experience building integrations with REST APIs,
    webhooks, and middleware technologies
  - Demonstrated expertise in AI-augmented programming and vibe
    coding, using LLMs to write code, explore new libraries
    quickly, and automate repetitive engineering work
  - Exceptional ability to jump into existing codebases in
    Python and JavaScript/TypeScript, understand the logic,
    and implement enhancements or integrations safely
  - Familiarity with LangChain, LlamaIndex, vector databases,
    prompt engineering, and RAG design patterns
  - Experience designing or contributing to agentic workflows
    and context-aware AI applications
  - Strong problem-solving instincts and the ability to figure
    out how systems work without waiting for perfect
    documentation
  - Excellent listening, communication, and presentation skills
  - The ability and desire to learn new technologies and
    development tools
  
   About the Team
  
  - Join a team of skilled professionals in a collaborative and
    innovative environment that values continuous learning,
    creativity, and challenge.
  - Our team is focused on shaping the future of how work gets
    done at Zuora through intelligent automation,
    interoperability, and rapid iteration. You’ll work on
    challenging projects that stretch your skills and
    creativity, whether that means building integrations
    between AI agents and enterprise systems, prototyping new
    internal tools, or enhancing existing applications with
    LLM capabilities.
  - You’ll also have the opportunity to grow professionally by
    working with cutting-edge technologies, collaborating with
    industry experts, and expanding your skill set.
  - Our tech stack includes: JavaScript/TypeScript, Python, LLM
    APIs, LangChain, LlamaIndex, vector databases, MCP, RAG,
    REST APIs, webhooks, Slack, Salesforce, Jira, and internal
    enterprise systems.
  - If you want, I can also make this read more like a polished
    job description versus a direct website posting.
  
   Benefits
  
  Zuora offers a comprehensive total rewards package designed
  to support ZEOs’ wellbeing, growth, and flexibility. While
  specific offerings may vary by country, we typically
  provide:
  
  - Competitive compensation, variable bonus and performance-
    based reward opportunities, and retirement programs
  - Medical, dental, and vision insurance
  - Generous, flexible time off, plus paid holidays, wellness
    days, and a company-wide year-end break
  - Paid parental leave (including fully paid leave for eligible
    ZEOs, subject to local policy)
  - Learning & development stipend to support ongoing growth
  - Opportunities to volunteer and give back, including
    charitable donation matching where available
  - Mental wellbeing resources and support
  
  *Benefits may vary by location; details will be shared
  during the interview process
  
  
  
  #ZEOLife at Zuora
  
  ZEOs (our employees) are empowered to take ownership,
  challenge the status quo, and make a real impact. We:
  
  - Collaborate deeply across teams and regions
  - Learn constantly and iterate often
  - Build an inclusive, high-performance culture where people
    feel inspired, connected, and valued
  
  Our Commitment to an Inclusive Workplace
  
  Think, be and do you. At Zuora, different perspectives,
  experiences, and contributions matter — everyone counts.
  
  
  
  Zuora is proud to be an Equal Opportunity Employer committed
  to creating an inclusive environment for all. We do not
  discriminate on the basis of, and consider individuals
  seeking employment with Zuora without regard to, race,
  religion, color, national origin, sex (including pregnancy,
  childbirth, reproductive health decisions, or related
  medical conditions), sexual orientation, gender identity,
  gender expression, age, status as a protected veteran,
  status as an individual with a disability, genetic
  information, political views or activity, or other
  applicable legally protected characteristics.
  
  
  
  We encourage candidates from all backgrounds to apply.
  Applicants in need of special assistance or accommodation
  during the interview process or in accessing our website may
  contact us by sending an email to assistance@zuora.com (or
  local equivalent, where applicable).
  
  The base pay details represent the annualized salary range
  for the posted position. While we share a comprehensive
  range, a candidate’s final base salary will fall within
  these guidelines and will be determined based on multiple
  factors including but not limited to: qualifications of the
  candidate, job related knowledge, prior related experience,
  specific and unique skills, the location of the role,
  internal equity and internal budget. Base pay is only one
  element of Zuora’s Total Rewards Package. Additional
  elements may also include bonus/variable compensation,
  equity and comprehensive benefits, more details found here.
  
  Base Pay Details
  
  $124,500—$171,250 USD
