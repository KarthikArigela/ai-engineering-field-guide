description: |
  Are you a visionary at the intersection of AI innovation and
  executive influence? Do you thrive on shaping the future of
  visual understanding and AI-driven operational intelligence?
  If you’re a bold, strategic problem solver with deep
  technical expertise in modern computer vision, foundation
  models, and AI agents — this is your opportunity to lead
  from the front and help redefine what’s possible in the
  world of Physical AI.
  
  As a Senior Developer Relations Manager for NVIDIA
  Metropolis, you’ll be a key force driving the adoption of
  next-generation AI technologies that transform how cities,
  industries, and infrastructure think, see, and act. You’ll
  engage with innovative ISVs, global enterprise leaders, and
  ecosystem partners to unlock the full potential of visual
  understanding and automation. This is your chance to be a
  trailblazer in an era where perception meets reasoning,
  helping to accelerate the evolution from traditional AI
  pipelines to multimodal Vision-Language Models (VLMs) and
  intelligent agents capable of real-world decision making.
  
  What You’ll Be Doing
  
  - Identify, build, and guide strategic relationships across
    the AI ecosystem, from startups to enterprise CEOs,
    driving real-world adoption of NVIDIA’s advanced Vision AI
    and VLM capabilities
  - Engage developers and partners working on video analytics,
    perception, and AI agent use cases to bring breakthrough
    use cases to life
  - Provide hands-on technical leadership, augmenting CNN-based
    models with Vision Language Model (VLM) architectures into
    applications for video understanding, safety, operational
    intelligence, etc.
  - Partner closely with NVIDIA’s engineering, product, and
    marketing teams to guide developers and accelerate
    innovation within intelligent environments
  - Lead thought leadership discussions and get-to-market
    strategies to expand NVIDIA’s footprint in next-generation
    visual computing and AI ecosystems
  
  What We Need To See
  
  - Deep technical expertise in AI and computer vision,
    including hands-on experience with CNN architectures,
    Vision-Language Models (VLMs), and AI agent systems
  - Proven track record working directly with executive
    collaborators (C-suite, CTOs, founders) to shape technical
    strategy and drive measurable business outcomes
  - Strong background in AI for video understanding, public
    safety, ITS, industrial operational intelligence, safety
    compliance, or related domains
  - 8+ years of experience in technical roles that bridge
    innovation, strategy, and relationship management
  - Bachelor’s degree or equivalent experience in Computer
    Science, Engineering, or related field (Master’s or Ph.D.
    highly preferred)
  - Exceptional communication, executive presence, and ability
    to navigate complex technical and business dynamics
  
  Ways To Stand Out From The Crowd
  
  - Experience building and deploying AI solutions for physical
    environments — robotics, manufacturing, intelligent spaces
  - Familiarity with NVIDIA platforms such as Metropolis,
    DeepStream, CUDA-X, Omniverse
  - Proven success in empowering developer ecosystems and
    accelerating partner adoption in emerging AI fields
