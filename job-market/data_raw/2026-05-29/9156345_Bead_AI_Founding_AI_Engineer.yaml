description: |
  What you'll do
  
  - Develop and scale the backbone of our core audit product.
    You’ll scope, build, and launch product features that will
    enable our customers to replace work that has
    traditionally been done manually with a fully agentic
    approach.
  - Take ownership of end-to-end AI workflows. Including data
    processing, model fine-tuning, evaluation, and deployment.
  - Help set product direction. You’ll contribute to the
    roadmap, balancing customer feedback with long-term
    product health.
  
  You…
  
  - Are an AI Engineer with experience building, launching, and
    scaling agentic systems
  - Can balance research curiosity with engineering pragmatism
  - Want to move quickly, own problems end-to-end, and iterate
    with limited guidance
  - Flourish in autonomy, complexity, and ambiguity
  - Are comfortable working client-facing when needed
  
  This is a great fit if you…
  
  - Enjoy building great products and are happy to take
    ownership end-to-end to get there
  - Have previously or want to found something yourself in a few
    years time
  - Would like to move from London to SF next year (with visa
    support)
  - Have high agency and a constant drive for impact
  - Flourish in autonomy, complexity, and ambiguity
  - Want to work in-person from our office in London
  - Deeply fascinated by artificial intelligence, and how it
    will shape the future
  
  This won't be the right role if you…
  
  - Are uncomfortable with ambiguity. We are still very early
    and are constantly adjusting based on what we learn.
  - Are looking to manage others. We're firmly looking for
    someone who, for now, wants to be an individual
    contributor.
  - Get satisfaction predominantly by learning new technologies.
    We are building something new in an old industry, we need
    to use boring but proven methods where possible.
  - Currently don't have the right to work in either the UK or
    the US. We're happy to provide visa support in either
    direction, but not both.
  
  What we offer
  
  - Generous compensation: $160k - $210k cash, 0.8-1.5% equity
  - Full medical insurance
  - Relocation and visa support
