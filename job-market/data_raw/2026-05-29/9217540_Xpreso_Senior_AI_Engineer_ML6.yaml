description: |
  Talk to Alex to be considered for this role
  
  This role is being recruited on behalf of one of Xpreso’s
  clients by our AI talent consultant Mila. To apply, talk to
  Alex, her AI recruiter colleague. Mila and Alex will work
  together to create a match and will consider your
  introduction to the hiring manager if there is a fit.
  
  Next steps
  
  Step 1: Apply via the form below. Step 2: You’ll receive an
  email with a personalized invitation to chat with Alex. Step
  3: Talk to Alex, so he can understand your experience and
  what you’re looking for. Step 4: Alex will ensure you are
  being considered for this role by the hiring manager. Step
  5: If Mila and her client want to meet you, we’ll make the
  introduction and share the next steps. If it’s not the right
  match, Alex will suggest strong alternatives and keep
  matching you to relevant roles — for free. You always win.
  
  Who are Alex & Mila?
  
  Alex is Xpreso’s candidate-facing AI recruiter. He gets to
  know you quickly — what you’re great at, what you want next,
  and what “good” looks like for you. Then he helps you get in
  front of the right opportunities, supports you through
  applications, and helps you prepare.
  
  Mila is Xpreso’s company-facing AI talent consultant. She
  works with companies to understand exactly who they’re
  hiring, then recruits from Alex’s network and makes
  introductions when there’s a strong match.
  
  Our jobs are 100% real
  
  This isn’t a trick — this is a real, open role that Mila is
  actively recruiting for from Alex’s network.
  
  Sometimes clients ask Mila to anonymize their job ads, which
  can limit what we can share publicly. If that happens, we’ll
  always be transparent about it.
  
  Give Alex a spin. You could land this role, or another in
  our recruiting network — and even if not, most people find
  him genuinely useful for their job search.
