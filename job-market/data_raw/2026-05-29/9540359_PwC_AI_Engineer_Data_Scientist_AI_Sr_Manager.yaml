title: AI Engineer / Data Scientist, AI Sr. Manager
company: PwC
location: Los Angeles, USA
work_type: FULL_TIME
description: |
  At PwC, our people in audit and assurance focus on providing
  independent and objective assessments of financial
  statements, internal controls, and other assurable
  information enhancing the credibility and reliability of
  this information with a variety of stakeholders. They
  evaluate compliance with regulations including assessing
  governance and risk management processes and related
  controls. Those in data, analytics and technology solutions
  at PwC will assist clients in developing solutions that help
  build trust, drive improvement, and detect, monitor, and
  predict risk. Your work will involve using advanced
  analytics, data wrangling technology, and automation tools
  to leverage data and focus on establishing the right
  processes and structures to enable our clients to make
  efficient and effective decisions based on accurate
  information that is complete and trustworthy. Growing as a
  strategic advisor, you leverage your influence, expertise,
  and network to deliver quality results. You motivate and
  coach others, coming together to solve complex problems. As
  you increase in autonomy, you apply sound judgment,
  recognising when to take action and when to escalate. You
  are expected to solve through complexity, ask thoughtful
  questions, and clearly communicate how things fit together.
  Your ability to develop and sustain high performing,
  diverse, and inclusive teams, and your commitment to
  excellence, contributes to the success of our Firm. Examples
  of the skills, knowledge, and experiences you need to lead
  and deliver value at this level include but are not limited
  to: Craft and convey clear, impactful and engaging messages
  that tell a holistic story. Apply systems thinking to
  identify underlying problems and/or opportunities. Validate
  outcomes with clients, share alternative perspectives, and
  act on client feedback. Direct the team through complexity,
  demonstrating composure through ambiguous, challenging and
  uncertain situations. Deepen and evolve your expertise with
  a focus on staying relevant. Initiate open and honest
  coaching conversations at all levels. Make difficult
  decisions and take action to resolve issues hindering team
  effectiveness. Model and reinforce professional and
  technical standards (e.g. refer to specific PwC tax and
  audit guidance), the Firm's code of conduct, and
  independence requirements. The Opportunity As part of the
  Audit and Assurance team, you will lead the design and
  deployment of enterprise AI/ML solutions, setting
  architecture standards and reusable patterns. As a Senior
  Manager, you will serve as a strategic advisor, aligning
  clients and cross-functional teams on scope, roadmap,
  metrics, and delivery across workstreams. This role offers
  the chance to champion Responsible AI governance and mentor
  future leaders while driving productivity and reliability in
  AI-assisted development. Responsibilities
  - Lead the design and implementation of enterprise AI and
    machine learning solutions
  - Establish architecture standards and reusable frameworks for
    development
  - Collaborate with clients and cross-functional teams to
    define project scope and delivery
  - Drive the governance of Responsible AI, maintaining
    compliance with privacy and security
  - Promote MLOps practices to enhance operational effectiveness
    and reliability
  - Mentor and develop future leaders within the team
  - Oversee project performance, including resource allocation
    and budget management
  - Provide timely updates and communication regarding project
    progress
  What You Must Have
  - Bachelor's Degree
  - At least 8 years of professional AI/ML development,
    engineering, or testing experience
  What Sets You Apart
  - Master's Degree in Engineering, Computer Science, Data
    Processing/Analytics/Science preferred
  - At least 3 years of experience leading teams and delivering
    complex initiatives as a technical lead, engineering
    manager, or data science manager
  - Proven track record leading multi-team programs
  - Managing stakeholders and delivering measurable business
    outcomes
  - Translating business problems into well-engineered AI
    solutions
  - Analyzing and building data models and transformation
    routines
  - Experience with modern LLM applications and proficiency in
    end-to-end development
  - Championing MLOps and AI-assisted development to improve
    effectiveness
  - Hiring and mentoring leaders to manage performance
  - Establishing Responsible AI governance
  The salary range for this position is: $119,000 - $299,930.
  For residents of Washington state the salary range for this
  position is: $119,000 - $337,000. Actual compensation within
  the range will be dependent upon the individual's skills,
  experience, qualifications and location, and applicable
  employment laws. All hired individuals are eligible for an
  annual discretionary bonus. PwC offers a wide range of
  benefits, including medical, dental, vision, 401k, holiday
  pay, vacation, personal and family sick leave, and more. To
  view our benefits at a glance, please visit the following
  link: https://pwc.to/benefits-at-a-glance As PwC is an equal
  opportunity employer, all qualified applicants will receive
  consideration for employment at PwC without regard to race;
  color; religion; national origin; sex (including pregnancy,
  sexual orientation, and gender identity); age; disability;
  genetic information (including family medical history);
  veteran, marital, or citizenship status; or, any other
  status protected by law. PwC does not intend to hire
  experienced or entry level job seekers who will need, now or
  in the future, PwC sponsorship through the H-1B lottery,
  except as set forth within the following policy:
  https://pwc.to/H-1B-Lottery-Policy. Learn more about how we
  work: https://pwc.to/how-we-work For only those qualified
  applicants that are impacted by the Los Angeles County Fair
  Chance Ordinance for Employers, the Los Angeles' Fair Chance
  Initiative for Hiring Ordinance, the San Francisco Fair
  Chance Ordinance, San Diego County Fair Chance Ordinance,
  and the California Fair Chance Act, where applicable, arrest
  or conviction records will be considered for Employment in
  accordance with these laws. At PwC, we recognize that
  conviction records may have a direct, adverse, and negative
  relationship to responsibilities such as accessing sensitive
  company or customer information, handling proprietary
  assets, or collaborating closely with team members. We
  evaluate these factors thoughtfully to establish a secure
  and trusted workplace for all.
