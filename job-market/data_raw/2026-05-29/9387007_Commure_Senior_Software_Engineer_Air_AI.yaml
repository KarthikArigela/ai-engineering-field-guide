description: |
  At Commure, we're building the AI Operating System for
  healthcare, the foundation that defines how care is
  delivered, documented, and financed. Our platform spans the
  full care journey: Ambient AI and Dictation eliminating
  documentation burden at the point of care, intelligent
  Agents automating patient and revenue workflows, and
  autonomous RCM processing billions in claims, all on a
  single AI-native platform integrated with 60+ EHRs.
  
  Healthcare carries a $1 trillion administrative burden and
  we're at the center of transforming it. Today, 500,000+
  clinicians across 500+ healthcare organizations nationwide
  trust Commure to handle $25B+ in annual claims and support
  over 200 million patient interactions. Our latest $70M raise
  at a $7B valuation reflects the confidence the market has
  placed in this mission.
  
  Our team works directly alongside clinicians, not through
  layers of process, which means the gap between what you
  build and its impact on patient care is immediate. We move
  fast, deploy daily, and take full ownership from early
  thinking to production. If you're energized by hard
  problems, high stakes, and a team that holds itself to a
  high bar, you'll find your people here.
  
  The future of healthcare is being built right now. Come
  deliver this transformation.
  
  About the Role
  
  At Commure, our Air AI team is building the intelligence
  layer that lives inside the clinical workflow, that listens,
  documents, reasons, and acts so clinicians don't have to.
  You'll work across documentation that transcribes patient
  visits and structures them into clinical notes in real-time,
  a conversational clinical assistant grounded in live patient
  context and medical literature, and an extensible AI Skills
  Library of reusable agents and workflows that automates
  clinical tasks across the platform. If you want to build AI
  that clinicians trust with their most critical work, this is
  that team.
  
  What You'll Do
  
  - Leverage and build on top of AI/LLM technologies to
    accelerate product development and deliver intelligent,
    automated experiences to clinicians and patients
  - Design and influence decisions that shape our fullstack
    architecture for scalable, AI-powered healthcare solutions
  - Lead or contribute to technical planning for new features,
    balancing feasibility, clinical usability, and business
    impact
  - Establish best practices for code quality, testing,
    deployment, and observability
  - Mentor engineers across the team, raising the bar on design
    patterns, code standards, and technical thinking
  - Collaborate with product managers, designers, and clinical
    experts to ship intuitive solutions that work in real
    clinical environments
  - Be part of a fast-moving team that celebrates large
    ambition, ships daily, and makes decisions quickly
  
  What You Have
  
  - Bachelor’s or Master’s degree in Computer Science,
    Engineering, or a related field, required
  - 4+ years of professional software engineering experience,
    ideally in a high-growth or startup environment
  - Strong fullstack skills — Python on the backend (required),
    TypeScript/React on the frontend, with working knowledge
    of containers and cloud (Docker, Kubernetes)
  - Hands-on experience integrating LLM APIs or building AI-
    powered features in production
  - Track record of driving work from early ideation to
    successful production deployment
  - Strong debugging and problem-solving skills with a history
    of demonstrated resourcefulness
  - Strong communication skills — comfortable working with both
    engineers and non-technical stakeholders including
    clinical teams
  - Experience in fast-moving environments where shipping
    quickly is the norm
  
  Please be aware that all official communication from us will
  come exclusively from email addresses ending in
  @getathelas.com, @commure.com or @augmedix.com. Any emails
  from other domains are not affiliated with our organization.
  
  Employees will act in accordance with the organization’s
  information security policies, to include but not limited to
  protecting assets from unauthorized access, disclosure,
  modification, destruction or interference nor execute
  particular security processes or activities. Employees will
  report to the information security office any confirmed or
  potential events or other risks to the organization.
  Employees will be required to attest to these requirements
  upon hire and on an annual basis.
