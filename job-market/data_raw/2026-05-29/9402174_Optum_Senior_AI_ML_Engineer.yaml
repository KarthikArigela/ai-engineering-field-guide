description: |
  Requisition Number: 2358526 Optum is a global organization
  that delivers care, aided by technology to help millions of
  people live healthier lives. The work you do with our team
  will directly improve health outcomes by connecting people
  with the care, pharmacy benefits, data and resources they
  need to feel their best. Here, you will find a culture
  guided by inclusion, talented peers, comprehensive benefits
  and career development opportunities. Come make an impact on
  the communities we serve as you help us advance health
  optimization on a global scale. Join us to start Caring.
  Connecting. Growing together. We are seeking a highly
  skilled Oracle BI & HCM Reporting Specialist to design,
  develop, and optimize reporting solutions across Oracle HCM
  modules. This role is hands-on and requires deep expertise
  in OTBI, BI Publisher, HCM Extracts, and HDL, with solid SQL
  skills and a proven ability to deliver accurate, scalable
  reporting solutions in a fast-paced environment. Primary
  Responsibilities:
  
  - Develop end-to-end training and fine-tuning of Large
    Language Models (LLMs), including both open-source (e.g.,
    Qwen, LLaMA, Mistral) and closed-source (e.g., OpenAI,
    Gemini, Anthropic) ecosystems
  - Deep knowledge and extensive experience with Machine/Deep
    Learning frameworks including transformer architectures,
    state space models, large language models, and agentic
    approaches
  - Knowledge of algorithms and techniques within a
    computational domain with emphasis on text processing
  - Architect and implement GraphRAG pipelines, including
    knowledge graph representation and retrieval for enhanced
    contextual grounding
  - Design, train, and optimize semantic and dense vector
    embeddings for document understanding, search, and
    retrieval
  - Develop semantic retrieval systems with advanced document
    segmentation and indexing strategies
  - Build and scale distributed training environments using NCCL
    and InfiniBand for multi-GPU and multi-node training
  - Apply reinforcement learning techniques (e.g., RLHF, RLAIF)
    to align model behavior with human preferences and domain-
    specific goals
  - Experience with Hybrid NLP solutions that combine symbolic
    and machine learning approaches
  - Collaborate with cross-functional teams to translate
    business needs into AI-driven solutions and deploy them in
    production environments
  - Comply with the terms and conditions of the employment
    contract, company policies and procedures, and any and all
    directives (such as, but not limited to, transfer and/or
    re-assignment to different work locations, change in teams
    and/or work shifts, policies in regards to flexibility of
    work benefits and/or work environment, alternative work
    arrangements, and other decisions that may arise due to
    the changing business environment). The Company may adopt,
    vary or rescind these policies and directives in its
    absolute discretion and without any limitation (implied or
    otherwise) on its ability to do so
  
  Required Qualifications:
  
  - PhD or Master's degree in computer science, Machine
    Learning, or related field
  - 10+ years of experience in applied AI/ML with statistics,
    with a strong track record of delivering production-grade
    models
  - Experience with Azure ML and/or AWS
  - Experience with Exploratory Data Analysis (EDA)
  - Experience with PyTorch
  - Experience with LLM training and fine-tuning (e.g., GPT,
    LLaMA, Mistral, Qwen)
  - Experience with Graph-based retrieval systems (GraphRAG,
    knowledge graphs)
  - Experience with Embedding models (e.g., BGE, E5, SimCSE)
  - Experience with Semantic search and vector databases (e.g.,
    FAISS, Weaviate, Milvus)
  - Experience with Document segmentation and preprocessing
    (OCR, layout parsing)
  - Experience with Model fusion and ensemble techniques
    (stacking, boosting, gating)
  - Experience with Optimization algorithms (Bayesian, Particle
    Swarm, Genetic Algorithms)
  - Experience with Reinforcement learning (e.g., RLHF, PPO,
    DPO, GRPO), Supervised Fine Tuning (SFT), LoRA, QLoRA,
    axolotl
  - Experience with Prompt optimization framework (AutoPrompt,
    GreaterPrompt, DSPy), GEPA
  - Deep expertise in: NLP, Fundamental machine learning, deep
    learning, transformer, state space-based architecture
  - Proven solid in Python coding, SQL and database queries,
    data preparation, and analysis
  
  At UnitedHealth Group, our mission is to help people live
  healthier lives and make the health system work better for
  everyone. We believe everyone-of every race, gender,
  sexuality, age, location and income-deserves the opportunity
  to live their healthiest life. Today, however, there are
  still far too many barriers to good health which are
  disproportionately experienced by people of color,
  historically marginalized groups and those with lower
  incomes. We are committed to mitigating our impact on the
  environment and enabling and delivering equitable care that
  addresses health disparities and improves health outcomes -
  an enterprise priority reflected in our mission.
