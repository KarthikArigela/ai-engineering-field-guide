description: |
  Location: Fully remote (EMEA timezone) Start date: ASAP
  Language: Fluent English required Industry: AI / Fintech /
  B2B SaaS Marketplace / Graph AI
  
  About the Company
  
  Pragmatike is recruiting on behalf of an early-stage,
  venture-backed startup in Europe building an AI-native B2B
  SaaS product.
  
  The company is developing a data-driven platform powered by
  modern AI technologies, with a strong focus on scalability,
  product experience, and intelligent automation. The product
  is already live, and the team is now focused on scaling,
  improving core features, and strengthening its technical
  foundation.
  
  The environment is fast-paced, product-driven, and highly
  collaborative.
  
  About the Role
  
  We’re looking for a Fullstack Engineer who is a strong
  builder and comfortable working across the stack, with a
  modern AI-assisted development workflow (e.g. Cursor, Claude
  Code, or similar tools).
  
  This is a hands-on, product-focused role — you’ll be
  shipping features end-to-end, contributing to both frontend
  and backend systems, and leveraging AI tools to move fast
  and build efficiently.
  
  You’ll work closely with the founders to scale the platform,
  improve user experience, and integrate AI-driven
  capabilities into the core product.
  
  Key Responsibilities
  
  - Build and ship end-to-end product features across frontend
    and backend
  - Develop scalable backend services and APIs
  - Contribute to frontend applications with a strong focus on
    UX and performance
  - Integrate AI-powered features into the product (LLMs,
    workflows, automation)
  - Use AI coding tools (Cursor, Claude Code, etc.) to
    accelerate development and productivity
  - Improve and maintain data pipelines (email, LinkedIn, CRM
    integrations)
  - Optimize onboarding flows and drive fast “aha moments” for
    users
  - Collaborate on system design, architecture, and technical
    decisions
  - Ensure performance, reliability, and scalability of the
    platform
  - Work closely with founders on product direction and
    iteration cycles
  
  Required Experience & Profile
  
  - 3–8+ years of experience in software engineering (fullstack
    or backend-leaning)
  - Strong ability to build and ship products end-to-end
  - Comfortable working across the stack (language-agnostic
    mindset)
  - Experience using modern AI coding tools (e.g. Cursor, Claude
    Code, Copilot, etc.)
  - Experience integrating or building AI/LLM-powered features
  - Solid understanding of APIs, system design, and scalable
    architectures
  - Experience with cloud environments (AWS or similar)
  - Familiarity with data pipelines and third-party integrations
  - Strong ownership, autonomy, and product mindset
  - Ability to thrive in a fast-paced startup environment
  
  Nice to Have
  
  - Experience with graph-based systems or recommendation
    engines
  - Exposure to Graph RAG, knowledge graphs, or AI agents
  - Experience in fintech, marketplaces, or data-heavy products
  - Experience with CRM, email, or LinkedIn integrations
  - Background in early-stage or startup environments
  - Track record of shipping products from 0 → 1 or scaling
    early products
  
  What We Offer
  
  - Founding-level role with high impact on company direction
  - Full ownership of the AI and Graph platform development
  - Opportunity to build a large-scale AI-driven network
    platform
  - Highly autonomous and fast-moving environment
  - Fully remote setup with flexible work style
  
