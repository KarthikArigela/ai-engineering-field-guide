  About us 🏢
  
  🚀 We’re on a mission to make real estate transactions
  smarter, faster, and friction-free.
  
  🏢 Real estate is the world’s largest asset class, yet the
  legal processes and tools behind it remain slow, manual, and
  underinvested. Lawyers must review dense documents line by
  line and piece together information across silos, all while
  clients demand faster, more transparent due diligence.
  
  🤖 That's where we come in. Orbital Copilot is the AI
  assistant built exclusively for commercial real estate law.
  Developed with former practicing real estate lawyers, it
  accelerates complex due diligence by up to 70% while
  delivering legal-grade precision.
  
  💰 We’ve just raised a $60m Series B to accelerate our UK/US
  expansion.
  
  🤝 We're trusted by leading firms like Goodwin, BCLP, and
  Ropes & Gray to remove the busywork so legal teams can focus
  on what they do best: applying sharp legal judgment,
  delivering standout client service, and getting deals over
  the line faster.
  
  💡 Working at Orbital means joining a team that's reimagining
  how real estate transactions get done - moving fast, working
  collaboratively, and giving people the ownership to make a
  real impact from day one.
  
  Our vision 🏆
  
  We’re building an AI assistant with the expertise of a high-
  performing real estate associate at a law firm. We believe
  property deals in the 21st century shouldn’t hinge on
  overworked lawyers sifting through paperwork and drafting
  reports. It’s time for smarter, faster, tech-driven
  transactions.
  
  Our mission 💪🏽
  
  Our mission is to help any professional or individual
  involved in a property transaction to properly understand
  what they are getting into, from the outset, before
  incurring legal fees.
  
  Our values 🐸
  
  - We are Bold & Ambitious ⚡ (changing an entire industry is
    hard!)
  - We give Power to our People 💪 (we give exceptional people
    autonomy to succeed)
  - We Question or Commit 🙋 ****(we welcome debate, but love
    reaching quick decisions)
  - … and we Eat that Frog! 🐸 (we take on the hardest thing
    first)
  
  Role Overview 🔎
  
  We are seeking AI Engineers, across all experience levels,
  to join our team as we build and scale innovative AI-driven
  products that make commercial real estate transactions
  smarter, faster, and friction-free. Our current product
  transforms the way real estate professionals conduct due
  diligence, streamlining the analysis of extensive property
  portfolios previously involving tens of thousands of
  documents reviewed manually by legal teams. We’re now
  evolving this product and developing new offerings to add
  even more value to our users.
  
  At Orbital, we leverage the most intelligent, bleeding edge
  models from leading AI labs like OpenAI, Google, Gemini and
  Anthropic. This is an exciting opportunity for someone who
  is passionate about LLMs, AI agents, and agentic
  architecture, and who wants to work at the forefront of AI
  technology in production use cases.
  
  We are looking for Software Engineers who have transitioned
  into AI Engineering, or who have an interest in making that
  transition, where you will be working on our cutting edge AI
  agent, Orbital Copilot. Commercial experience shipping and
  maintaining production software is essential for this role —
  what matters most is that you’ve delivered real systems used
  by real users, and owned them through deployment,
  monitoring, and iteration. You’re an exceptional technical
  problem solver, excited to apply that skill set using LLMs
  and agentic principles.
  
  You’ll own the end-to-end design and development of AI-
  driven features and systems, working alongside a dynamic and
  fast-paced team focused on quality, usability, and impact.
  You will play a critical role in every stage of the
  development lifecycle, from discovery and design to
  implementation, deployment, and continuous improvement.
  Supported by a cross-functional team, you will deliver
  impactful solutions initially to lawyers and then to a
  broader B2B customer base.
  
  You’ll get a chance to: 👩‍💻 👨‍💻
  
  - Take ownership of key AI technology decisions and lay the
    groundwork for the company’s ambitious growth plans.
  - Design, develop, and deploy AI-driven systems and features,
    integrating state-of-the-art LLMs.
  - Collaborate with a cross-functional team (AI Engineers, AI
    product managers, VP of AI, real estate legal domain
    experts and software engineers) to define user stories,
    rapidly experiment, and ship new features directly to
    customers to use
  - Explore and implement advanced concepts such as multi-agent
    systems, retrieval-augmented generation (RAG), agentic
    architectures and next generation document understanding
    pipelines
  - Champion quality and reuse across the product and the
    codebase — including evaluation, monitoring, and
    reliability patterns for AI systems.
  - Work across the business to ensure the features you develop
    have a real impact on customers and move key business
    metrics as we design and build a brand-new product that
    doesn’t yet exist in the market.
  - Participate in architecture and code reviews to continuously
    improve the quality, maintainability, security, and
    scalability of our applications.
  
  You should apply if: ✍️
  
  - You’re AGI-pilled: you have real conviction about where AI
    is heading, and you’re excited to build with frontier
    models in production (not just talk about them).
  - You can demonstrate excellence in something — evidence
    you’ve reached a high bar (technical, academic,
    competitive, creative, or otherwise).
  - You have a generalist mindset and enjoy working across
    boundaries (engineering, product, design, domain experts)
    to get to the best outcome.
  - You have proven experience delivering large, complex
    software and/or AI systems.
  - You value shipping early and often to get customer feedback
    and then iterating quickly to improve the product.
  - You have excellent verbal and written communication skills
    in English.
  
  It would also be nice if you have:
  
  - Prior experience with LLMs (OpenAI’s GPT-5, and Claude
    models from Anthropic) or agentic systems.
  - Any Frontend experience.
  - Proven expertise in building highly secure, fault-tolerant
    APIs.
  - Experience building high-performance, distributed systems at
    scale.
  - A strong understanding of modern dev practices like 12
    Factor, CI/CD, and observability tools such as Datadog or
    Prometheus.
  - Exposure to GraphQL APIs and WebSockets for real-time
    interactions.
  
  🔒 As part of our commitment to information security, all
  employees are expected to adhere to company security
  policies and procedures, participate in mandatory security
  awareness training, and ensure the secure handling of
  sensitive data in line with ISO 27001 standards. Reporting
  potential risks or incidents is a key part of fostering our
  culture of security and compliance.
  
  Benefits: 🌟
  
  - Competitive starting salary
  - Matched pension contributions and equity options in a fast
    growing start-up
  - Flexible working hours and location
  - 25 days paid holiday (plus bank holidays)
  - Professional equipment and personal development budget along
    with training opportunities to learn and develop your
    skills
  - Cycle-to-work scheme
  - An inclusive community enjoying all-company off-sites,
    lunches and socials
  
  💡 We value diversity at Orbital, and would particularly
  encourage applications from those who are traditionally
  underrepresented in tech. We’d love to hear from you even if
  you don’t match all of the above criteria or are seeking
  other opportunities that we’re not currently advertising.
  
  🔒 Security is everyone’s responsibility at Orbital. We ask
  all team members to follow our security policies, complete
  regular awareness training, and handle sensitive data with
  care in line with ISO 27001 standards. Spot something
  unusual? Reporting risks or incidents quickly helps us
  maintain the strong culture of security and compliance we
  all depend on.
  
  💡 At Orbital, we’re committed to building a diverse and
  inclusive team. We especially welcome applications from
  people who are traditionally underrepresented in tech. Even
  if you don’t meet every single requirement, or if the right
  role isn’t listed yet, we’d still love to hear from you.
  
  💰 This hiring range is a reasonable estimate of the base pay
  range for this position at the time of posting. Pay is based
  on several factors, which may include job-related knowledge,
  skills, experience, and business requirements.
