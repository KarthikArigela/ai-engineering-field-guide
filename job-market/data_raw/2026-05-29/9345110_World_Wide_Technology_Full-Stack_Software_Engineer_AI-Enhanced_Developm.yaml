description: |
  Job Summary & ResponsibilitiesRequired Qualifications:
  
  - Minimum of 8+ years of professional full-stack software
    development experience.
  - Demonstrated daily workflow use of multiple AI code
    assistants with the judgment to know which to reach for
    when rapidly developing, testing, and iterating on
    software.
  - Strong engineering fundamentals with a focus on code
    quality, maintainability, and best practices.
  - Full-stack experience with frontend frameworks, backend
    languages, and database integration.
  - Experience implementing performance, scalability, and
    security at all levels of application architecture.
  - Strong command of architectural and design patterns, with
    the judgment to choose the right approach for a given
    problem and to critically evaluate AI-generated solutions
    against those standards.
  - Strong proficiency with Git, CI/CD pipelines, automated
    testing, and static code analysis.
  - Experience with multiple platform environments, including
    LINUX, Mac OS, and/or Windows.
  - Strong eye for documentation that actually serves its
    audience by knowing what's worth capturing, ensuring
    accuracy, and critically reviewing AI-generated material
    before it reaches clients or teammates.
  - Strong critical thinker who communicates clearly across
    audiences and can translate complex technical concepts
    into language that resonates with both engineers and
    clients.
  - Able to support occasional travel (less than 10%) in support
    of project-related activities or training. Additional
    travel may be required for new hires for employee
    onboarding activities. Travel is most often to client
    sites or to our facilities.
  - Proven ability to develop engineers across technical craft,
    consulting judgment, engineering discipline, and modern
    AI-assisted workflows.
  - Demonstrated ability to share knowledge at scale through
    talks, internal trainings, written guides, or community
    contributions that raise the bar for engineers beyond your
    own team.
  - Strong grounding in test-first development, iterative
    refinement, and collaborative coding practices.
  
  What Sets You Apart:
  
  - You embrace AI as a force multiplier for productivity while
    maintaining high code quality standards.
  - You understand when to leverage AI assistance and when human
    expertise is critical.
  - You have a growth mindset and actively experiment with
    emerging AI development tools.
  - You can articulate the benefits and limitations of AI-
    assisted development to both technical and non-technical
    stakeholders.
  - You view AI code assistants as collaborative partners in the
    development process, not replacements for engineering
    judgment.
  
  Want to learn more about Solutions Consulting & Engineering?
  Check us out on our platform:
  https://www.wwt.com/community/scande/about
  
