  Preferred Qualifications
  
  Please note: This role requires demonstrated proficiency in
  leveraging AI code assistants — agentic IDEs (i.e. Cursor or
  Windsurf), autonomous agents (i.e. Devin), inline assistants
  (i.e. GitHub Copilot, etc.) — as a core part of your daily
  workflow to rapidly develop, test, and iterate on software
  solutions.
  
  Why WWT
  
  At World Wide Technology, we work together to make a new
  world happen. Our important work benefits our clients and
  partners as much as it does for our people and communities
  across the globe. WWT is dedicated to achieving its mission
  of creating a profitable growth company that is also a Great
  Place to Work for All. We achieve this through our world-
  class culture, generous benefits, and by delivering cutting-
  edge technology solutions for our clients.
  
  Founded in 1990, WWT is a global technology solutions
  provider leading the AI and Digital Revolution. WWT combines
  the power of strategy, execution, and partnership to
  accelerate digital transformational outcomes for
  organizations around the globe. Through its Advanced
  Technology Center, a collaborative ecosystem of the world's
  most advanced hardware and software solutions, WWT helps
  clients and partners conceptualize, test and validate
  innovative technology solutions for the best business
  outcomes and then deploys them at scale through its global
  warehousing, distribution and integration capabilities.
  
  With over 14,000 employees across WWT and Softchoice and
  more than 60 locations around the world, WWT's culture,
  built on a set of core values and established leadership
  philosophies, has been recognized 14 years in a row by
  Fortune and Great Place to Work® for its unique blend of
  determination, innovation and creating a great place to work
  for all.
  
  
  
  Want to work with highly motivated individuals on high-
  performance teams? Join WWT today!
  
  What is the Solutions Consulting & Engineering Team and why
  join?
  
  Solutions Consulting & Engineering is an organization that
  is customer-focused and solutions-led. We deliver end-to-end
  and emerging solutions to drive customer satisfaction and
  increase profitability and growth. Our world-class
  management consulting, delivery excellence, and engineering
  brilliance enable our success. We embody the OneWWT mindset
  by bringing the right talent at the right time from anywhere
  within WWT to solve our customer’s problems. Our goal is to
  bring together business acumen with full-stack technical
  know-how to develop innovative solutions for our clients’
  most complex challenges.
  
  You'll work as both consultant and builder, a trusted
  partner who helps clients shape the right solution and then
  delivers it. Every engagement is a different problem to
  solve: a legacy system that needs to evolve, a product that
  needs to ship, a platform that needs to scale, a workflow
  that needs to disappear. What stays constant is what you
  bring to each one: technical depth, consulting judgment, and
  the modern AI-assisted craft to move faster without cutting
  corners.
  
  
  
  You will draw upon your extensive knowledge of programming
  languages and computer operating systems, exemplary
  analytical, critical thinking, and problem-solving skills,
  deep software development experience, and a passion for
  creating reliable and maintainable systems. You should be
  open to new challenges, effective at multitasking,
  innovative, creative, self-directed, and a great team
  player.
  
  Responsibilities:
  
  - Work effectively both independently and as part of a team,
    partnering directly with clients to understand their
    requirements, advise on technical trade-offs, and design
    and develop software solutions that deliver real business
    value.
  - Leverage AI code assistants to accelerate development
    cycles, refactor code, generate comprehensive test suites,
    validate code quality, and explore technical solutions.
  - Develop distributed/scalable systems and high-volume
    transaction applications, deployed in a 24/7 availability
    environment.
  - Apply Agile, Lean, and/or Scrum principles daily.
  - Adapt fluidly across project types and programming
    languages, picking up whatever stack each engagement
    demands.
  - Approach customer interactions with a consultant mindset,
    advising clients on the risks and opportunities associated
    with their decisions.
  - Demonstrate best practices for AI-assisted development,
    including prompt engineering, code review of AI-generated
    code, and effective human-AI collaboration.
