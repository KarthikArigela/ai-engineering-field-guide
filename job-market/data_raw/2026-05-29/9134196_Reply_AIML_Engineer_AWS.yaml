description: |
  Valorem Reply, part of the Reply Network, is a leader in
  Microsoft-based IT solutions. We support and advise our
  Giant Tech customers in all aspects of Microsoft, and other
  industry-leading technologies. From designing and developing
  custom solutions and low-code solutions, to implementing and
  managing them seamlessly, Valorem Reply helps customers
  unlock the potential of their IT infrastructure to enable
  their sales and partner initiatives.
  
  As a Senior Developer, you will play a key role in building
  and evolving ML/AI applications and services on AWS. You
  will work closely with product, architecture, and
  engineering teams to deliver reliable, high-quality
  solutions that meet business and customer needs. You should
  be comfortable contributing across the software development
  lifecycle, from design and implementation through
  deployment, support, and continuous improvement.
  
