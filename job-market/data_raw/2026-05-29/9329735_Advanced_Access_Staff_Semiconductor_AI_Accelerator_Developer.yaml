description: |
  Join the forefront of the AI revolution by designing next-
  generation semiconductors that power artificial intelligence
  applications. This role focuses on developing cutting-edge
  AI/ML accelerators and advanced node semiconductors for the
  world's leading technology companies.
  
   Key Responsibilities:
  
  - Design and develop AI-optimized semiconductor architectures
    for machine learning workloads
  - Lead advanced node semiconductor development (7nm, 5nm, 3nm
    processes)
  - Collaborate with AI software teams to optimize hardware-
    software co-design
  - Perform circuit design, simulation, and verification for
    AI/ML accelerators
  - Develop memory subsystems and interconnect architectures for
    AI processing units
  - Optimize power efficiency and performance for edge AI and
    data center applications
  - Work with foundry partners on advanced manufacturing process
    development
  - Lead cross-functional teams including layout, verification,
    and packaging engineers
  
  
  
  RequirementsMaster's or PhD in Electrical Engineering,
  Computer Engineering, or related field 5+ years experience
  in semiconductor design with focus on AI/ML applications
  Expertise in advanced node processes (≤16nm) and EUV
  lithography Proficiency in industry-standard EDA tools
  (Cadence, Synopsys, Mentor Graphics) Strong understanding of
  AI/ML algorithms and their hardware requirements Experience
  with ASIC design flow from RTL to tape-out Knowledge of
  memory architectures (HBM, GDDR, emerging memories)
  Experience with AI frameworks (TensorFlow, PyTorch) and
  their hardware acceleration
  
  
  
  Benefits
  
   Compensation Range: $180,000 - $350,000+ plus CHIPS Act
  project bonuses
