description: |
  About Jampack
  
  Jampack is an AI-native platform that automates the entire
  wholesale order-to-cash lifecycle for CPG brands. We're
  building the operating engine for high-growth CPG brands
  like Fishwife, Immi, Ghia, and Sanzo – handling everything
  from purchase order ingestion to freight coordination to
  invoicing and payment reconciliation.
  
  Wholesale is 7x the size of e-commerce, yet the
  infrastructure is stuck in the 1990s. We're building the
  agentic operating system that gives operators superpowers
  and replaces spreadsheets, email chains, and manual data
  entry with autonomous workflows that just work.
  
  We recently raised a $3.2M seed round led by Maveron. We're
  a small, high-agency team and we're looking for founding
  engineers who want to build what doesn't exist yet.
  
  The Role
  
  We're hiring a founding engineer to own our AI agent layer –
  the autonomous systems that execute multi-step workflows
  across ordering, freight, reconciliation, and exception
  management on behalf of our customers.
  
  You'll architect and deploy specialized agents that operate
  inside real supply chain systems – coordinating across ERPs,
  3PLs, freight brokers, and retailer portals with zero
  tolerance for error.
  
  What You'll Do
  
  - Architect and deploy agentic systems that handle ordering,
    freight tendering, reconciliation, and exception
    management end-to-end
  - Develop robust tool-use, retrieval, and planning mechanisms
    with production-grade safety guardrails
  - Optimize models through fine-tuning on real order and
    fulfillment data as volume scales, evaluation frameworks,
    and human feedback systems
  - Partner directly with customers to transform their
    operational workflows into automated agent-driven
    solutions
  - Lead end-to-end – from research to deployment – on
    capabilities that ship to real customers processing real
    orders
  
  What We're Looking For
  
  - 4+ years building ML/AI products in operational or
    production environments (startup experience preferred)
  - Deep expertise with LLMs, retrieval-augmented generation,
    function-calling, and evaluation frameworks
  - Strong software engineering fundamentals in TypeScript/Node,
    Python, and cloud infrastructure
  - You thrive in ambiguity, move fast, and take ownership of
    outcomes – not just outputs
  - You care about the problem as much as the technology. You
    want to understand how a freight broker actually works
    before you automate it
