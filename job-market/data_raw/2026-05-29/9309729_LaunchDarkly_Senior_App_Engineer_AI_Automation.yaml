description: |
  About the Job:
  
  As a Senior App Engineer focused on AI and Automation, you
  will lead the design and delivery of AI-powered systems that
  improve productivity across LaunchDarkly. You will work
  closely with the CIO and cross-functional partners to
  identify opportunities, define architecture for internal AI
  workflows, and bring solutions into production at scale.
  
  Responsibilities:
  
  - Lead end-to-end delivery of AI-powered agents and automation
    systems, from problem definition through production
    deployment and continuous improvement
  - Design architectures for AI workflows that span multiple
    systems, tools, and data sourcesPartner with the CIO to
    evaluate opportunities and provide input on internal AI
    strategy and priorities
  - Make and document build vs buy decisions, including
    participating in vendor evaluation and selection processes
  - Establish and apply production standards, including
    reliability, observability, and safe handling of data
  - Define how success is measured and ensure systems deliver
    measurable improvements in productivity, speed, or cost
  - Reuse and extend internal AI platform capabilities such as
    shared services, skills, and MCP servers
  - Mentor AI engineers by reviewing work, guiding design
    decisions, and helping structure projects
  - Collaborate with global teams, including US-based
    stakeholders, to align on priorities and deliver solutions
    across time zones
  
  Qualifications:
  
  - Strong experience building applications or systems using
    Python or similar languages
  - Hands-on experience designing and implementing AI-powered
    workflows or agents in real-world use cases
  - Strong data background, including working with databases,
    data modeling, or analytics workflows
  - Experience integrating and scaling solutions across multiple
    systems, APIs, or platforms
  - Experience using and extending no-code or low-code
    automation and AI tools such as Workato, Glean, or similar
  - Demonstrated ability to lead projects end-to-end, including
    scoping, architecture, implementation, and
    productionization
  - Experience building and operating production systems with
    testing, deployment, and monitoring practices
  - Experience mentoring engineers or providing technical
    guidance
  - Experience evaluating tools and contributing to vendor
    selection decisions
  
  
  
  About LaunchDarkly:
  
  Modern software delivery was supposed to be the foundation
  for a thriving digital business but reality has proven
  otherwise. Slow, inefficient development cycles, costly
  outages, and fragmented customer experiences are preventing
  developers from building their best software. The
  LaunchDarkly platform helps developers innovate on new
  features faster while protecting them with a safety valve to
  instantly rewind when things go wrong. Developers can target
  product experiences to any customer segment and maximize the
  business impact of every feature. And by gradually rolling
  out new application components, they escape nightmare "big-
  bang" technology migrations.
  
  The LaunchDarkly platform was built to guide engineers to
  the next frontier of DevOps by:
  
  - Improving the velocity and stability of software releases,
    without the fear of end customer outages
  - Delivering targeted experiences by easily personalizing
    features to customer cohorts
  - Maximizing the business impact of every feature through the
    ability to experiment and optimize
  - Coordinating the release and optimization of software to
    provide consistent experiences across mobile platforms and
    device types
  - Improving the effectiveness and productivity of engineering
    teams, by providing insights into engineering cadence and
    stability
  
