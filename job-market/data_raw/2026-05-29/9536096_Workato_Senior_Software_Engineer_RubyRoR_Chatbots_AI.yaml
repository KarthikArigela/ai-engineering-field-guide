  Responsibilities
  
  We are looking for an exceptional Senior Backend Developer
  (Ruby) to join our growing team. In this role, you will have
  an opportunity to work on Workbot - our innovative platform
  to build interactive chatbots for Slack & MS Teams which are
  used by many enterprise customers including Slack itself.
  This role is a blend of complex backend development,
  bleeding-edge application platforms and conversational user
  experiences. Do note that this role is a remote role.
  
  In this role, you will also be responsible to:
  
  - Build complex Ruby on Rails services within the Workato
    platform
  - Continuously research Slack & MS Teams ecosystems,
    understand trends, track changes
  - Contribute in all phases of the development lifecycle
  - Write well-designed, testable, efficient code
  - Evaluate and propose improvements to the existing system
  - Support continuous improvement by investigating alternatives
    and technologies, and presenting these for architectural
    review
  
  RequirementsQualifications / Experience / Technical Skills
  
  - BS/MS degree in Computer Science, Engineering or a related
    subject
  - 5+ years of strong experience developing, shipping and
    maintaining Rails applications
  - Excellent debugging, analytical, problem-solving, and social
    skills
  - Solid knowledge of object-oriented programming and design
  - Experience with Go - nice to have
  - Experience with JavaScript frameworks (AngularJS, React,
    etc) - nice to have
  - Knowledge of MS Teams or Slack platform & API is a plus
  
  Soft Skills / Personal Characteristics
  
  - Understanding of what a good user experience looks like
  - Readiness to work remotely with teams distributed across the
    world and time zones
  - Spoken English (Intermediate or higher)
  
