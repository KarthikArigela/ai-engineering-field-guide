description: |
  Company Description
  
  Working at Allegis Global Solutions (AGS) is more than just
  a job. It’s a career. It’s a community of people who invest
  in your development and empower you to blaze your own trail.
  Each of us is here to create real, measurable impact that
  moves needles. We operate beyond "roles" or "jobs" to
  realize the opportunity to make meaningful contributions to
  a bigger idea. Because we believe that when you build a
  workforce that’s designed to harness human enterprise, you
  design a workforce that’s built for impact.
  
  At AGS, we help companies all over the world transform their
  people into a competitive advantage. It’s not about filling
  seats. It’s about designing workforces to meet missions and
  unleash the most transformative power in business today: The
  power of human enterprise.
  
  With services around the globe, we have a point of view on
  the future of work that enables us to be a transformative
  partner in the way work gets done for our clients’
  organizations. Meeting clients where they are, we design a
  plan and guide them along a transformational journey,
  applying bold actions and diverse minds to solve the most
  complex challenges – from permanent and extended workforce
  management to services procurement, consulting, direct
  sourcing and our Universal Workforce Model™.
  
  We also represent over 100 countries and speak dozens of
  languages. So as you’re building relationships and doing
  your job, you’ll be exposed to other cultures and
  advancement opportunities while expanding your knowledge of
  global markets and strategies.
  
  As a workplace, we focus on relationships – with each other,
  our clients and our candidates - in fact serving others is
  one of our core values. We support open communication and
  recognize that giving constructive criticism can be even
  harder than receiving it. We appreciate the fearless and the
  passionate, who force us to be better. Everything we do sits
  on a pillar of diversity - diverse perspectives, backgrounds
  and ideas drive innovation and make us successful.
  
  See what it’s like to work at AGS by searching #LifeAtAGS on
