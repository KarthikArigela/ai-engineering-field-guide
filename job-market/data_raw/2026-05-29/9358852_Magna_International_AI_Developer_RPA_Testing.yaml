description: |
  Job descriptions may display in multiple languages based on
  your language selection. What we offer: At Magna, you can
  expect an engaging and dynamic environment where you can
  help to develop industry-leading automotive technologies. We
  invest in our employees, providing them with the support and
  resources they need to succeed. As a member of our global
  team, you can expect exciting, varied responsibilities as
  well as a wide range of development prospects. Because we
  believe that your career path should be as unique as you
  are. Group Summary: Magna is more than one of the world's
  largest suppliers in the automotive space. We are a mobility
  technology company built to innovate, with a global,
  entrepreneurial-minded team. With 65+ years of expertise,
  our ecosystem of interconnected products combined with our
  complete vehicle expertise uniquely positions us to advance
  mobility in an expanded transportation landscape. Job
  Responsibilities: Magna is seeking a skilled and forward-
  thinking AI Developer, RPA & Testing to join our Intelligent
  Automation and Testing organization. This role will play a
  key part in designing and implementing AI-driven solutions
  that elevate automation, improve testing efficiency, and
  strengthen decision support across HR, Payroll, and Finance
  functions. As part of the Intelligent Automation team, you
  will collaborate closely with test automation engineers, RPA
  developers, business analysts, and business stakeholders to
  build AI-enabled prototypes and production-ready solutions.
  You will leverage Azure AI Foundry, Copilot Studio,
  Databricks, and enterprise APIs to create scalable, secure,
  and maintainable AI components that transform how data,
  workflows, and quality processes operate across the
  organization. This position is ideal for candidates who
  enjoy combining AI/ML, automation, and modern software
  engineering to deliver real-world business impact. Key
  Responsibilities
  
  - Design, develop, and maintain AI-powered solutions,
    prototypes, and POCs using Azure AI Foundry, Azure AI
    services, and Copilot Studio.
  - Integrate AI capabilities into RPA workflows and test
    automation frameworks, supporting automation developers
    and QA engineers.
  - Build data processing, orchestration, and integration logic
    using Python and/or C#, following clean coding and modular
    design principles.
  - Work with Databricks, SQL, Microsoft Fabric and data
    pipelines to prepare, transform, and analyze datasets from
    HR, Payroll, and Finance systems.
  - Connect AI components with enterprise applications using
    REST APIs, event-driven architectures, and secure
    integration patterns.
  - Apply best practices in prompt engineering, model tuning,
    and evaluation to improve solution accuracy, safety, and
    relevance.
  - Implement comprehensive logging, monitoring, observability,
    and testing (unit, integration, functional) across AI and
    automation flows.
  - Ensure solutions adhere to internal standards for security,
    privacy, compliance, and data governance, particularly for
    sensitive HR/Payroll data.
  - Participate in requirements gathering, technical design
    sessions, sprint planning, and review ceremonies,
    providing technical leadership and estimates.
  - Document solution designs, architecture decisions, and
    operational/handover materials for support and maintenance
    teams.
  - Stay current with emerging AI, automation, and testing
    capabilities across Azure AI, Copilot Studio, Databricks,
    and Power Platform.
  - Contribute to building a library of reusable AI components,
    prompt templates, best practices, and internal
    accelerators.
  
  Required Qualifications
  
  - Bachelor's degree in Computer Science, Software Engineering,
    Data Science, Information Systems, or related field; or
    equivalent practical experience.
  - 5-7 years of hands-on experience in software development,
    AI/ML engineering, data engineering, or intelligent
    automation.
  - Practical experience building solutions with Azure-based AI
    services (Azure AI Foundry, Azure OpenAI, or similar).
  - Experience using Copilot Studio, Power Platform, or similar
    chatbot/automation technologies to build AI copilots or
    automated workflows.
  - Strong proficiency in Python and/or C#, including writing
    clean, maintainable, and testable code.
  - Solid understanding of SQL and relational databases, with
    experience writing complex queries and optimizing data
    interactions.
  - Experience integrating solutions using REST APIs
    (authentication, error handling, JSON processing).
  - Understanding of RPA or test automation tools and concepts
    (e.g., UiPath, Power Automate, Selenium, Playwright,
    etc.).
  - Strong analytical and problem-solving abilities, with a
    track record of turning business requirements into
    technical AI/automation solutions.
  - Effective communication and collaboration skills, with
    experience working in cross-functional teams (HR, Payroll,
    Finance, IT).
  
  Nice-to-Have / Preferred Skills
  
  - Hands-on experience with Databricks/Microsoft Fabric for
    data engineering, ML, or analytics workloads.
  - Experience building solutions using LLMs, advanced prompt
    engineering, or model evaluation methodologies.
  - Understanding of DevOps practices, including CI/CD,
    deployment pipelines, and environment/configuration
    management.
  - Knowledge of test automation best practices, test strategy,
    regression testing, or quality engineering methodologies.
  - Exposure to enterprise systems such as Workday, SAP, Oracle
    HR/Finance, or similar platforms.
  - Experience working in Agile/Scrum development environments.
  - Professional certifications in Azure AI, Azure Data,
    Databricks, RPA tools, or AI/ML engineering.
  
