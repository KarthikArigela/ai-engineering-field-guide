description: |
  We are a global team of innovators and pioneers dedicated to
  shaping the future of observability. At New Relic, we build
  an intelligent platform that empowers companies to thrive in
  an AI-first world by giving them unparalleled insight into
  their complex systems. As we continue to expand our global
  footprint, we're looking for passionate people to join our
  mission. If you're ready to help the world's best companies
  optimize their digital applications, we invite you to
  explore a career with us!
  
  Your Opportunity
  
  Our Product Analytics team is looking for an AI Systems
  Engineer to modernize and automate our data governance,
  build the agentic infrastructure that standardizes our
  customer and user engagement data, and deliver high-
  integrity, AI-ready intelligence to Product leadership. Our
  goal is maturing the automation capabilities of our
  organization by deploying self-healing data pipelines and
  realizing what is possible when our massive scale of
  business and telemetry data is harnessed by autonomous AI
  agents.
  
  Who You are
  
  You’re a self-starter who’s able to work in a fast-paced,
  ambiguous environment. Proven technical precision and an
  absolute mastery of leveraging AI-assisted development tools
  will enable you to successfully partner with Marketing,
  Sales, Product, and Engineering to build automated
  workflows, data contracts, and agentic systems.
  Additionally, you will architect idempotent pipelines and
  deliver reliable data foundations that empower our internal
  AI models to act with high fidelity and predictable results.
  You will succeed by having an eye on the big-
  picture—designing systems that solve today’s observability
  gaps while building the scalable AI architecture of the
  future.
  
  What You’ll Do
  
  - Develop and Deploy Agentic Workflows: Build LLM-based agents
    to automate critical data tasks including metadata
    standardization, entity resolution, and autonomous data
    anomaly diagnosis.
  - Establish Governance as Code (Observability): Implement and
    maintain automated testing frameworks and observability
    tools (e.g., Monte Carlo, Soda) to identify and alert on
    "silent failures" like timezone smearing or usage
    divergence.
  - Build AI-Ready Data Pipelines: Develop and maintain the
    Semantic Layer and data models in Snowflake that enable
    internal AI agents to query our usage and billing data
    with accuracy.
  - Champion AI-First Development: Act as a power user of AI-
    assisted coding tools (Claude Code, Gemini Enterprise) to
    rapidly prototype and iterate on the team's data
    infrastructure.
  - Maintain Pipeline Integrity: Build "replayable" data
    pipelines and monitor production workflows to ensure our
    data "immune system" stays updated as the business
    evolves.
  
  Your Qualifications
  
  Must-have:
  
  - 3+ years of experience in Data Engineering, AI Systems, or a
    related technical field with a strong focus on automation.
  - AI Orchestration: Hands-on experience using frameworks like
    LangChain or LlamaIndex to build functional, multi-step AI
    applications.
  - AI-Assisted Coding Proficiency: Mastery of LLM-based
    development tools to accelerate delivery and automate
    documentation.
  - Core Technical Stack: Proficiency in Python (FastAPI,
    Pandas) and SQL; experience working within Snowflake.
  - Reliability Mindset: A strong understanding of data quality
    principles and experience setting up automated alerts,
    monitors, and data contracts.
  
  Nice-to-have:
  
  - Experience with Vector Databases (e.g., Pinecone, Weaviate)
    for retrieval-augmented generation (RAG).
  - Experience in Fintech, Billing, or RevOps environments where
    mathematical reconciliation is a core requirement.
  - Background in building RLHF loops to turn analyst
    corrections into training data for automation engines.
  
  Please note that visa sponsorship is not available for this
  position.
  
