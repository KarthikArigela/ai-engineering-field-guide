description: |
  Senior Software Engineer (AI-Native Development)
  
  At Benivo, we believe the next generation of strong software
  engineers will combine deep engineering judgment with the
  ability to orchestrate AI agents to design, implement, test,
  and ship software faster.
  
  We are hiring a Senior Software Engineer (AI-Native
  Development) to help us build software significantly faster
  and better using tools such as Codex, Claude, GitHub
  Copilot, and similar tools.
  
  This is not an AI/ML or research role. It is a hands-on
  software engineering role for someone who can use AI
  effectively across the full development lifecycle while
  remaining fully responsible for quality, design,
  maintainability, security, and production outcomes.
  
  What you will do
  
  - Build new product capabilities from requirements through
    release
  - Work confidently inside a large, evolving codebase with
    technical debt and business-critical logic
  - Set up and use multiple AI agents or agentic workflows to
    accelerate requirements analysis, implementation, testing,
    refactoring, unit testing, and documentation
  - Review and strengthen AI-generated output rather than
    relying on it blindly
  - Write maintainable, production-grade code and automated
    tests
  - Make sound technical decisions across architecture,
    performance, security, and maintainability
  - Help raise the bar for AI-native engineering practices
    across the organisation
  
  What we value
  
  - Strong engineering fundamentals
  - Ability to produce significantly more engineering output by
    orchestrating AI tools effectively, not simply writing
    code faster manually
  - High ownership
  - Fast execution with quality
  - Sound judgment
  - Comfort operating in real production complexity
  - Business-result orientation
  
  Requirements
  
  - Experience building and shipping production software
  - Demonstrated ability to design effective prompts, agent
    workflows, and AI-assisted development processes using
    tools such as Codex, Claude, Copilot, Cursor, or similar
    systems
  - Experience structuring sophisticated engineering tasks so
    that AI agents can execute them effectively
  - Ability to evaluate, debug, and refine AI-generated outputs
    through prompt iteration and workflow design
  - Experience in both creating new systems and improving
    established ones
  - Strong understanding of APIs, databases, testing, debugging,
    and system design
  - Experience setting up and operating multiple AI agents or
    agentic workflows across requirements analysis, code
    generation, refactoring, code review, testing,
    refactoring, unit testing, and documentation
  - Strong ability to evaluate code quality, correctness, and
    security
  - Ability to work independently and take responsibility for
    outcomes
  
  Preferred background
  
  - Experience with C# / .NET, React, APIs, and automated
    testing
  - Experience in SaaS product companies
  - Experience with CI/CD and modern development workflows
  - Experience with legacy code modernisation
  - Experience in improving engineering productivity across a
    team
  
  About Benivo
  
  Benivo is a leading SaaS company in the Global Mobility
  space. We value small, smart teams, practical problem
  solving, and engineers who can combine speed, judgment, and
  ownership.
  
  We are not looking for engineers who simply “use AI.” We are
  looking for engineers who can use AI well to produce better
  software and better outcomes.
  
  Benefits
  
  - Hybrid working: one to two days per week in the office
    (King’s Cross)
  - 33 days paid annual leave, including bank holidays which are
    flexible - you may choose to work on bank holidays and
    take the day off elsewhere in the year.
  - Flexible start-end times (core hours are 10am - 4pm)
  - Learning & development - every Friday afternoon is a half
    day to focus on your self-development and interests
  - A yearly generous wellbeing cash-allowance
  - PayLater cash advance - financial assistance for large
    personal expenses (e.g moving house, furniture, etc)
  - Work remotely from 30+ countries for one month per calendar
    year.
  
  - Share options in the employee’s options plan
  - Company social events and team celebrations
  
  Benivo is an equal-opportunity employer. We celebrate
  diversity and are committed to creating an inclusive
  environment for all employees. All qualified applicants will
  receive consideration for employment without regard to race,
  color, religion, gender, gender identity or expression,
  sexual orientation, national origin, genetics, disability,
  age, or veteran status.
  
  We encourage individuals from all backgrounds to apply and
  are eager to create a workforce that reflects the diversity
  of our community.
