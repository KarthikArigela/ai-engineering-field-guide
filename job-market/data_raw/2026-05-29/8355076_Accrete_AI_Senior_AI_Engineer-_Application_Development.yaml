description: |
  Company Overview:
  
  Join our innovative team at Accrete
  (https://www.accrete.ai/), a leading product development
  company specializing in GenAI and ML-powered solutions.
  We're dedicated to pushing the boundaries of technology and
  delivering exceptional software products that redefine
  products and solutions to deliver business outcomes across
  industries. We specialize in developing cutting-edge
  technology products that leverage advanced algorithms and
  data analytics to drive business growth and innovation. Our
  culture is built on collaboration, continuous learning, and
  a commitment to excellence. We are a diverse and inclusive
  team where everyone's voice is valued, and we strive to
  provide an environment that fosters creativity and
  professional growth.
  
  Position Overview:
  
  We are seeking a highly skilled Senior Developer with
  expertise in Python technologies to work with our
  engineering team in developing GenAI products. As a Senior
  Developer, you will play a crucial role in designing robust
  architectures and ensuring the successful implementation of
  our software products. You will work with a team of
  developers and data engineers to leverage your expertise in
  Python, data engineering technologies, and cloud platforms
  to drive the development process. Additionally, you will
  work closely with a Technical Architect to understand and
  implement the solution architecture and develop effective
  strategies to debug issues in production.
  
  Responsibilities:
  
  - Design and implement scalable, efficient, and maintainable
    software solutions.
  - Develop and maintain data scraping/integration solutions to
    collect and process large volumes of data.
  - Collaborate with product managers, machine learning
    engineers, and other stakeholders to understand
    requirements and deliver high-quality products.
  - Work closely with the Technical Architect to understand the
    solution architecture and implement it effectively.
  - Deliver high-quality, well-documented, and maintainable
    code.
  - Finalize and maintain detailed sequence diagrams and
    architectural documentation.
  - Implement and manage thorough testing processes, including
    automated testing.
  - Develop effective strategies to debug issues that arise in
    production environments.
  - Implement best practices for coding standards, testing, and
    deployment.
  - Stay updated with the latest industry trends and
    technologies to ensure our products are cutting-edge.
  - Mentor and guide junior developers and data engineers,
    fostering a collaborative and innovative environment.
  - Capable of handling complex problems and guiding teams. Be
    able to contribute to high-level technical decisions and
    ensure that best practices are followed.
  
  Required Skills and Experience:
  
  Education: Bachelor's or Master's degree in Computer
  Science, Engineering, or a related field.
  
  Experience:
  
  - Minimum 5 years experience in software development.
  - Knowledge of data privacy and security best practices.
  - Familiarity with agile development methodologies.
  - Have a good knowledge of architecture, design patterns, and
    advanced software development techniques
  
  Technical Skills:
  
  - Python: Advanced proficiency in Python programming and
    experience with its libraries and frameworks such as
    Pandas, NumPy, Flask, Django, FastAPI etc.
  - Data Scraping: Extensive experience with data scraping tools
    and frameworks such as BeautifulSoup, Scrapy, Selenium,
    Playwright etc. Experience with data pipeline tools such
    as Airflow, kafka, Spark would be a plus
  - AWS:
  - Compute Services: Proficiency with AWS compute services such
    as EC2, Lambda, EKS and ECS.
  - Storage Services: Experience with AWS storage services like
    S3 and EBS.
  - Databases: Knowledge of AWS database services including RDS
    (e.g., PostgreSQL, MySQL) and MongoDB.
  - Networking: Understanding of AWS networking services like
    VPC, Route 53, and CloudFront.
  - Security: Experience with AWS Identity and Access Management
    (IAM), AWS Key Management Service (KMS), and other
    security services.
  - Deployment and Management: Experience with CI/CD pipelines
    and tools like Jenkins, GitLab CI and
    Terraform/Terragrunt, Flux CD
  - Monitoring and Logging: Familiarity with AWS CloudWatch and
    AWS CloudTrail, DataDog, PagerDuty
  - Containerization: Experience with Docker and container
    orchestration tools like Kubernetes. Ability to create and
    manage Docker containers for deploying applications.
  - Database Management: Strong understanding of SQL and
    database management systems. Experience with relational
    databases such as PostgreSQL, MySQL, NoSQL databases like
    Mongodb, ElasticDB. Experience with graph databases would
    be an advantage
  - API Development: Experience in designing and consuming
    RESTful APIs. Familiarity with API management and
    documentation tools such as Swagger or Postman.
    Proficiency with FastAPI and FlaskAPI.
  - Version Control: Proficiency with version control systems
    like Git, including branching, merging, and pull requests.
  - Testing Automation: Experience in setting up and using
    automated testing tools and frameworks, such as Selenium,
    PyTest, or JUnit.
  - Documentation: Ability to create and maintain detailed
    sequence diagrams and architectural documentation.
  - Debugging: Proficiency in developing effective strategies to
    debug issues that arise in production environments.
  
  Soft Skills:
  
  - Problem-Solving: Strong analytical and problem-solving
    skills.
  - Communication: Excellent verbal and written communication
    skills.
  - Collaboration: Ability to work collaboratively with cross-
    functional teams.
  - Adaptability: Ability to adapt to new technologies and
    methodologies quickly.
  
  Career Progression:
  
  At Accrete we value professional growth and development of
  our employees. As a Senior Developer, you will have access
  to a variety of career advancement opportunities and growth
  within the organization. We provide ongoing training,
  mentorship, and opportunities to take on leadership roles
  within your team and work with leaders across departments.
  
  Why Join Us:
  
  Innovative Environment: Be part of a team that's at the
  forefront of technological innovation, utilizing GenAI and
  ML to create groundbreaking solutions. Collaborative
  Culture: Work in a collaborative environment where your
  ideas are valued, and you have the opportunity to make a
  real impact. We provide a flexible work environment.
  Professional Growth: We're committed to your professional
  growth and development, offering opportunities for learning
  and advancement. Competitive Compensation: Enjoy a
  competitive compensation and benefits package, including
  medical insurance. We offer a competitive salary, benefits
  package, and opportunities for growth and advancement within
  the company. If you are an innovative and results-driven
  leader, we encourage you to apply for this exciting
  opportunity.
  
  Accrete is an equal opportunity/affirmative action employer.
  All qualified applicants will receive consideration for
  employment without regard to sex, gender identity, sexual
  orientation, race, color, religion, national origin,
  disability, protected Veteran status, age, or any other
  characteristic protected by law.
