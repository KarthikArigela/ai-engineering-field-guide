description: |
  Requisition Number: 2354926 Optum is a global organization
  that delivers care, aided by technology to help millions of
  people live healthier lives. The work you do with our team
  will directly improve health outcomes by connecting people
  with the care, pharmacy benefits, data and resources they
  need to feel their best. Here, you will find a culture
  guided by inclusion, talented peers, comprehensive benefits
  and career development opportunities. Come make an impact on
  the communities we serve as you help us advance health
  optimization on a global scale. Join us to start Caring.
  Connecting. Growing together. Primary Responsibilities:
  Snowflake
  
  - Strong SQL skills (complex joins, CTEs, window functions).
  - Experience working with large, enterprise-scale semi
    structured datasets.
  - Understanding of Snowflake concepts like warehouses,
    performance optimization, and cost management.
  - Experience building analytics-ready data models (facts,
    dimensions, proper grain).
  - Knowledge of data security, roles, and access controls.
  
  Power BI
  
  - Strong experience in Power BI report and dashboard
    development.
  - Strong DAX (time intelligence, KPIs, trend and driver
    analysis).
  - Semantic model design (not just visuals).
  - Performance optimization (Import vs DirectQuery, model size,
    cardinality).
  - Experience with deployment pipelines, security (RLS), and
    production support Gen AI (Applied to Analytics)
  - Good understanding of Generative AI concepts like Agentic
    AI, RAG, Prompt Engg etc
  - Experience using GenAI for:
    - Insight generation and explanations
    - Trend and anomaly interpretation
    - Narrative and business-friendly summaries
  - Familiarity with LLMs (Azure OpenAI or similar).
  - Ability to design prompts and validate AI outputs.
  - Clear understanding of limitations and guardrails for
    enterprise use. AI / ML Techniques
  - Working knowledge of ML concepts (regression,
    classification, clustering).
  - Experience applying ML to real business problems (e.g.,
    drivers, anomalies, predictions).
  - Hands-on experience with Python for analysis/modeling
    preferred.
  - Ability to explain model outcomes in simple business terms.
  
  Required Qualifications:
  
  - Bachelor's degree in Computer Science, Engineering, Data
    Science, Artificial Intelligence, or a related
    quantitative field; advanced degree preferred
  - 8+ years of overall experience across AI/ML engineering,
    data engineering, and analytics roles, with demonstrated
    ownership of production grade ML systems
  - Hands-on experience with BI and analytics tools, such as
    Power BI, Tableau, or equivalent enterprise BI platforms,
    including semantic models, KPIs, and analytical dashboards
  - Solid hands-on experience designing, building, and deploying
    machine learning and generative AI solutions using Python
    based ML/DL frameworks (e.g., scikit learn, PyTorch,
    TensorFlow)
  - Experience integrating AI/ML outputs into BI and decisioning
    workflows, including explainable insights, forecasting,
    and predictive metrics for business users
  - Proven experience across the end to end ML lifecycle,
    including data preparation, feature engineering, model
    training, evaluation, deployment, and monitoring (MLOps)
  - Solid understanding of data modeling, metrics definition,
    and analytical layer design, enabling translation of
    business KPIs into ML ready features and AI driven
    insights
  - Advanced proficiency in SQL and experience working with
    large scale analytical datasets in data warehouses or
    lakehouse environments
  
  At UnitedHealth Group, our mission is to help people live
  healthier lives and make the health system work better for
  everyone. We believe everyone-of every race, gender,
  sexuality, age, location and income-deserves the opportunity
  to live their healthiest life. Today, however, there are
  still far too many barriers to good health which are
  disproportionately experienced by people of color,
  historically marginalized groups and those with lower
  incomes. We are committed to mitigating our impact on the
  environment and enabling and delivering equitable care that
  addresses health disparities and improves health outcomes -
  an enterprise priority reflected in our mission.
