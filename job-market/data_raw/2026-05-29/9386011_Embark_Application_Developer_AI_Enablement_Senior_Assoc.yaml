  What you'll be doing:
  
  As a Senior App Developer Consultant at Embark, you will
  work on small teams, collaborating with other consultants
  while partnering with clients to implement real-world
  solutions for their complex accounting and business
  problems. Learn to estimate, gather requirements, develop,
  test, manage projects, architect and deliver. We do it all!
  Explore different technologies and develop applications in
  languages including: C#, .NET, Python, Java, JavaScript, and
  SQL, Web technologies like Cloud technologies like AWS,
  Azure, Google Cloud, and Data Driven solutions, IoT, Machine
  Learning, DevOps, and more. This role is ideal for someone
  with a solid technical foundation in software and data
  architecture and engineering, who is eager to grow and make
  a significant impact in a dynamic environment.
  
  
  Key Responsibilities:
  
  - Define, design, develop, test, and deploy software solutions
    utilizing a variety of technologies
  - Work alongside process experts, consultants, and client
    resources as a technical expert, developer, and lead
    wizard
  - Design and implement RESTful APIs to support various
    applications and services typically surrounding the
    finance and accounting ecosystem
  - Collaborate with cross-functional teams to understand
    requirements and develop effective solutions
  - Set up and configure development environments, including
    version control systems, IDEs, and necessary tools where
    necessary
  - Develop SQL queries and build data structures to support
    application requirements
  - Ensure code quality through code reviews, unit testing, and
    integration testing. Trouble-shoot and debug software
    applications to resolve issues promptly
  - Document software designs, technical specifications, and
    procedures
  - Identify and implement AI-enabled features and automations
    (e.g., GenAI-assisted workflows) within client-facing
    applications
  - Typical compensation range of $100,000- $125,000 based on
    experience
  
  Required Qualifications:
  
  - Bachelor’s degree in Computer Science, Engineering, or a
    related technical field
  - 1-3 years of relevant experience in software development
  - Proven experience in software development using C# and .NET
    framework
  - Strong understanding of object-oriented programming
    principles and design patterns. Experience developing
    RESTful APIs and familiarity with API design standards
  - Proficiency in setting up development environments
    independently
  - Knowledge of version control systems such as GitProficiency
    in SQL, creating and maintaining database structures
  - Familiarity with modern AI/GenAI concepts and the ability to
    integrate AI services/APIs into production software
  - Strong problem-solving abilities and a detail-oriented
    mindset
  - Excellent communication skills and the ability to work
    effectively in a team
  
  Preferred Qualifications
  
  - Experience with programming languages such as C#, .NET,
    Python, and JavaScript
  - Experience supporting core financial and accounting systems,
    understanding of business processes, ERP datasets
  - Experience with big data technologies (e.g., Hadoop, Spark)
  - Experience in ETL technologies, Azure Data Factory, SSIS
  - Familiarity with cloud platforms (AWS, Azure, or GCP)
  - Experience building or deploying AI/GenAI solutions in cloud
    environments with attention to security and data
    governance
  
