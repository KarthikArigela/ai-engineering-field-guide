  Job Description
  
  Overview  We’re looking for a hands‑on Senior Full Stack
  Developer with strong proficiency in React and Node.js to
  build high‑performance web and mobile applications. You’ll
  work on scalable platforms, integrating modern frontend
  frameworks with robust backend services. Exposure to AI
  models and implementation of AI‑based solutions will be a
  valuable addition, as we continue to explore intelligent
  features across our products.
  
  Job Description: Roles and Responsibilities
  
  - Work in a collaborative environment, with architect and
    technical leaders to understand the product requirements
    and vision
  - Seek to understand problems thoroughly before implementing
    solutions; ask questions to clarify requirements when
    ambiguities are present
  - Write code that meets standards and delivers desired
    functionality using the technology selected for the
    project
  - Execute in a fast‑paced delivery mode and focus on
    delivering tasks to meet the product release goal
  - Understand performance parameters and assess application
    performance
  - Demonstrate understanding of Agile software development
    lifecycle and distinguish the core inputs and outputs in
    each cycle
  - Seek and provide feedback on design and development;
    articulate the need for scalability and emphasize
    improving quality through testing
  - Adapt to new environments and changing requirements; pivot
    quickly as needed and seek information from other sources
    when coached
  - Overall, be a strong problem solver with a go‑getter
    attitude to overcome technical challenges
  
  Education Qualifications
  
  - Bachelor’s degree in computer science/IT or equivalent
    combination of education/experience
  
  What We Are Looking For
  
  - 5+ years of experience in Full Stack Web development, with a
    proven track record of delivering high‑quality software
  - Strong expertise in JavaScript/TypeScript libraries for Web
    development like React, Redux/RTK
  - Build and maintain backend services using Node.js
    (Express/Hapi), integrating with PostgreSQL, Redis, and
    DynamoDB
  - Collaborate with product teams to deliver features across
    healthcare, ecommerce, and enterprise domains
  - Optimize performance, security, and maintainability of
    applications
  - Good to have design experience with Micro frontend‑based
    architecture
  - Deep understanding of HTML5, CSS3, SCSS and modern web
    development practices
  - Proficiency with styling libraries like TailwindCSS,
    PostCSS, MaterialUI, etc.
  - Experience with testing methodologies like TDD/BDD and tools
    such as Karma, Jasmine, Jest, Chai, Mocha, Puppeteer,
    Playwright
  - Strong understanding of Object‑Oriented Design (OOD),
    Programming (OOP), and UML
  - Experience with RESTful APIs and general data management
    flows
  - Experience with cloud platforms (Azure preferred) and
    containerization
  - Familiarity with CI/CD pipelines, version control systems
    like Git, and agile methodologies
  - Familiarity with industry software development practices,
    tools, and environments including configuration management
    systems, defect tracking tools, and debuggers
  - Exposure to AI models and practical implementation of
    AI‑based solutions within applications
  
  Nice to Have
  
  - Experience with deployable containers using Docker &
    Kubernetes
  - Experience with cloud computing environments such as
    AWS/Azure, and microservices
  - Experience with creating CI/CD pipelines using tools like
    Jenkins
  - Background in healthcare technology or working with large,
    distributed systems
  - Prior experience in Serverless architecture, GraphQL
  - Proficiency in additional programming languages or
    frameworks beneficial to frontend or full stack
    development
  
