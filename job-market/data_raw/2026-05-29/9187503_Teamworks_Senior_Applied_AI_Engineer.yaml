title: Senior Applied AI Engineer
company: Teamworks
location: USA
remote: true
work_type: FULL_TIME
description: |
  I'm Michael Song, Senior Director, Engineering at Teamworks,
  and I'm hiring a Senior Applied AI Engineer to build GenAI
  inside our Hub product. We're investing heavily in GenAI to
  help sports organizations make better decisions faster, and
  I need someone who can turn that ambition into production-
  grade reality. The work is shipping features that real teams
  depend on in high-stakes environments.
  
  Teamworks Hub powers more than 6,500 sports organizations
  and is now expanding into high-performance tactical
  environments through the Army's H2F program. On the Hub
  team, you'll own GenAI features that reach a broad and
  demanding user base, and you'll help shape the platform
  capabilities other Teamworks products depend on every day.
  
  The Role
  
  - Design, build, and ship production-grade GenAI features that
    help teams explore data, ask better questions, and trust
    the answers they get
  - Own GenAI features end-to-end, from system design and LLM
    integration through deployment, monitoring, and iteration
  - Build and maintain reusable GenAI platform components that
    make it easier and safer for teams across Teamworks to
    ship AI-powered features
  - Establish and document best practices for building, testing,
    and operating GenAI systems reliably in production
  - Make architectural decisions that balance speed,
    scalability, reliability, security, and cost in a multi-
    tenant data environment
  - Partner with Product, Design, and domain subject-matter
    experts to deliver trustworthy, explainable AI experiences
    that align with real user workflows
  
  What I'm Looking ForWhat You Must Bring
  
  - 6+ years of professional software engineering experience
    building and operating production systems with real
    customer impact
  - Proven experience shipping GenAI-powered or ML-enabled
    features to production, with ownership beyond prototypes
    or demos
  - Strong proficiency in TypeScript and Node.js, including
    building and maintaining backend services and APIs
  - Solid system design and architecture skills, with experience
    designing distributed, reliable, and observable services
  - Strong data reasoning and SQL fundamentals, including
    aggregation, time-based analysis, and performance
    considerations
  - Hands-on experience designing and operating production GenAI
    systems with prompts, tool interfaces, guardrails, and
    failure handling in cloud environments (AWS preferred)
  
  Even Better If
  
  - You have experience integrating AI-driven workflows into
    React-based user interfaces
  - You're familiar with Infrastructure as Code (Terraform or
    similar) and cloud-native deployment practices
  - You have experience with observability and evaluation for
    AI-powered systems (logging, metrics, regression checks)
  - You have exposure to data platforms or lakehouse-style
    architectures
  
  Why This Role
  
  GenAI is moving from a feature to a foundation at Teamworks,
  and the person in this role will help define how the entire
  engineering organization builds with it. You'll have real
  architectural ownership, a platform mandate, and the
  opportunity to set standards that outlast any single
  feature.
  
  About Teamworks
  
  We're the Operating System for Sports™, powering 6,500+
  organizations worldwide, from collegiate programs to every
  major pro league. Founded in 2006, we've evolved from a
  messaging tool for college football into the leading sports
  tech platform, with 500+ global teammates building the
  future of sports tech. Our solutions span Personnel,
  Coaching, Performance, Operations, and Intelligence -
  helping teams recruit smarter, train better, stay compliant,
  and win. Teamworks is an equal opportunity employer - if you
  live our core values every day and are honest, hardworking,
  humble, committed, innovative, and an all-around exceptional
  person, you'll thrive at Teamworks. We are committed to
  building a diverse and inclusive workforce and take
  affirmative action to not discriminate based on race,
  religion, color, national origin, ancestry, physical
  disability, mental disability, medical condition, genetic
  information, marital status, sex, gender, gender identity,
  gender expression, age, sexual orientation, veteran or
  military status, or any other legally protected
  characteristics. This policy applies to all employment
  practices within our organization, including but not limited
  to recruiting, hiring, promotion, termination, compensation,
  benefits, and training. Teamworks is committed to providing
  reasonable accommodations for candidates with disabilities
  who need assistance during the hiring process. To request a
  reasonable accommodation, please email talent@teamworks.com.
  
  To all recruitment agencies: Teamworks does not accept
  agency resumes. Please do not forward resumes to our jobs
  alias, Teamworks employees or any other organization
  location. Teamworks is not responsible for any fees related
  to unsolicited resumes.
