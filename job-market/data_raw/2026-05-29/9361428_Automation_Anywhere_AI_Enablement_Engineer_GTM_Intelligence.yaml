description: |
  About Us
  
  Automation Anywhere is the leader in Agentic Process
  Automation (APA), transforming how work gets done with AI-
  powered automation. Its APA system, built on the industry’s
  first Process Reasoning Engine (PRE) and specialized AI
  agents, combines process discovery, RPA, end-to-end
  orchestration, document processing, and analytics—all
  delivered with enterprise-grade security and governance.
  Guided by its vision to fuel the future of work, Automation
  Anywhere helps organizations worldwide boost productivity,
  accelerate growth, and unleash human potential.
  
  About the Role
  
  Automation Anywhere is redefining how work gets done through
  Agentic Process Automation, combining AI agents, automation,
  and orchestration to help enterprises automate work more
  intelligently. As we bring APA, Aisera, and our broader AI-
  led story to market, we are looking for a technical AI-
  native builder who can help create the next generation of
  enablement intelligence. This is not a traditional sales
  enablement role. We are looking for someone with a computer
  science or software engineering background, strong hands-on
  AI fluency, and the ability to build practical AI workflows,
  prototypes, and systems that help sellers position, prepare,
  and execute more effectively. Business and sales
  understanding is helpful, but not mandatory. The core
  requirement is the ability to build.
  
  What You’ll Build
  
  AI-Powered Enablement Intelligence
  
  - Build AI-assisted workflows to analyze and summarize call
    intelligence, seller feedback, deal signals, content
    usage, and win/loss inputs.
  - Create repeatable workflows that convert unstructured inputs
    into structured enablement insights.
  - Help identify patterns across discovery, qualification,
    MEDDPICC discipline, value articulation, objections,
    competitive positioning, and deal progression.
  - Use tools such as Chorus, Clari, Salesforce, ChatGPT,
    Claude, Gemini, Microsoft Copilot, and other platforms to
    reduce manual review and surface useful insights.
  
  AI Workflows and Prototypes
  
  - Create prompt libraries, custom GPTs or Projects,
    lightweight agents, automations, and reusable AI
    workflows.
  - Prototype tools for call analysis, content generation,
    seller preparation, coaching insights, and microlearning
    creation.
  - Convert fuzzy business requirements into working AI-enabled
    workflows.
  - Document workflows clearly so they can be reused, improved,
    and scaled by the broader team.
  
  AI-Accelerated GTM Content
  
  - Use AI to accelerate creation, repackaging, personalization,
    and improvement of enablement content.
  - Help simplify concepts such as Agentic Process Automation,
    Aisera, Process Reasoning Engine, and the Autonomous
    Enterprise into seller-ready narratives.
  - Build content variants by audience, segment, use case, sales
    stage, and seller need.
  - Work with Enablement and GTM teams to ensure outputs are
    grounded in customer pain, business value, and real sales
    conversations.
  
  What Great Looks Like
  
  Success will be measured against signals like:
  
  - AI workflows reduce manual effort in analyzing calls, deal
    signals, and seller feedback.
  - Enablement insights are generated faster and more
    consistently.
  - Seller-ready content can be created, repackaged, and
    personalized more efficiently.
  - Prompt libraries, custom GPTs, Projects, or agentic
    workflows are reused by the broader enablement team.
  - Sales Enablement leaders see this role as building the AI
    operating layer for enablement.
  
  Who You Are
  
  Software engineering and technical problem-solving,
  foundation. You have a computer science, software
  engineering, or equivalent technical background. You are
  comfortable thinking in systems, workflows, data, APIs,
  automation, and repeatable processes. AI-native building,
  differentiator. You do not just use AI tools. You build with
  them. You have created prompt libraries, custom GPTs or
  Projects, lightweight agents, workflow automations, scripts,
  prototypes, or internal tools that make work faster and
  smarter. GTM and business understanding, helpful but
  developable. Some understanding of enterprise sales, SaaS,
  automation, business value, or GTM workflows is helpful. You
  do not need to be a sales enablement expert. We will help
  you learn the sales motion, APA messaging, MEDDPICC, value
  selling, and enablement craft on the job. Other essentials.
  You are curious, structured, hands-on, and comfortable with
  ambiguity. You can simplify complexity, communicate clearly,
  and turn a fuzzy business problem into a working prototype.
  
  Preferred Background
  
  - 5-10 years of experience in software engineering, AI
    engineering, automation, data analysis, solution
    engineering, technical consulting, RevOps systems, or a
    related technical role.
  - Computer science, engineering, information systems, or
    equivalent technical background preferred.
  - Strong hands-on experience with AI tools such as ChatGPT,
    Claude, Gemini, Microsoft Copilot, or similar tools.
  - Experience building custom GPTs, AI Projects, prompt
    libraries, workflow automations, lightweight agents,
    internal tools, or prototypes.
  - Comfort with scripting, APIs, data workflows, or low-
    code/no-code automation tools is strongly preferred.
  - Exposure to Salesforce, Chorus, Gong, Clari, Mindtickle, or
    content platforms is helpful.
  - Business, sales, or consulting exposure is a plus, but not
    required.
  
  All unsolicited resumes submitted to any
  @automationanywhere.com email address, whether submitted by
  an individual or by an agency, will not be eligible for an
  agency fee.
