title: Senior Software Engineer II AI-Native, Circle Expansion
company: Life360
location: USA
work_type: FULL_TIME
description: |
  About Life360
  
  Life360’s mission is to keep people close to the ones they
  love. Our category-leading mobile app,Tile tracking devices,
  and Pet GPS tracker empower members to protect the people,
  pets, and things they care about most with a range of
  services, including location sharing, safe driver reports,
  and crash detection with emergency dispatch. Life360 serves
  approximately 97.8 million monthly active users (MAU), as of
  March 31, 2026, across more than 180 countries.
  
  Life360 delivers peace of mind and enhances everyday family
  life with seamless coordination for all the moments that
  matter, big and small. By continuing to innovate and deliver
  for our customers, we have become a household name and the
  must-have mobile-based membership for families (and those
  friends who are basically family).
  
  Life360 has more than 500 (and growing!) remote-first
  employees. For more information, please visit life360.com.
  
  Life360 is a Remote First company, which means a remote work
  environment will be the primary experience for all
  employees. All positions, unless otherwise specified, can be
  performed remotely (within the US and Canada) regardless of
  any specified location above.
  
  We are AI Native
  
  We are building an AI native company where AI is an integral
  part of how we build and operate. AI tool usage during
  interviews varies by role. You may be asked to demonstrate
  proficiency with AI tools, discuss how you leverage AI, or
  complete interview exercises without AI assistance. Your
  Recruiter will provide clear guidance as you move through
  the interview process.
  
  Undisclosed use of AI not previously discussed with or
  approved by your Recruiter may impact your candidacy.
  
  About The Team
  
  The Circle Expansion team at Life360 is building the next
  frontier of meaningful connection — deepening Life360’s
  peace-of-mind platform beyond the core family circle: aging
  parents staying safely independent, pre-teens navigating the
  world with wearables, and extended families and loved ones
  living apart. Our mission is to unlock more value for these
  members and the families around them, with features that
  help people stay safe, connected, and sane amidst the chaos
  of everyday family life.
  
  We are a product-minded, AI-Native engineering team. That
  means AI isn’t just a tool we use — it’s how we work. We’ve
  redesigned our team workflows around AI, treating it as a
  first-class collaborator at every stage: ideation, coding,
  testing, review, and iteration. We ship faster and go deeper
  because of it, and we’re looking for someone who wants to
  help define what that looks like at scale.
  
  About the Job
  
  Life360 is hiring an  AI-Native Engineer — a senior full-
  stack engineer who doesn’t just use AI tools, but thinks
  natively in them. You’ll be central to how the Circle
  Expansion team builds product, where AI has reshaped how the
  entire team designs, builds, and ships.
  
  You’ll design and build features that serve some of our most
  important and fastest-growing member segments: aging parents
  who want to stay safely connected with their families, pre-
  teens with wearables taking their first steps toward
  independence, sports teams that need real-time coordination,
  and school communities simplifying carpool logistics.
  
  You’ll build and evolve  our modern AI-Native engineering
  workflows — from how we write code, to how we run standups,
  to how we think about team velocity. You’ll evolve the
  standard others follow.
  
  Mobile experience is strongly preferred (iOS or Android),
  though exceptional full-stack or backend engineers are also
  encouraged to apply.
  
  For candidates based in the US, the salary range for this
  position is $148,000 to $216,000 USD. For candidates based
  out of Canada, the salary range for this position is 171,500
  to 201,000 CAD.
  
  Note: Please be aware that the job title for positions in
  Canada will be "Developer" in lieu of "Engineer." We take
  into consideration an individual's background and experience
  in determining final salary- therefore, base pay offered may
  vary considerably depending on geographic location, job-
  related knowledge, skills, and experience. The compensation
  package includes a wide range of medical, dental, vision,
  financial, and other benefits, as well as equity.
  
  AI-Native Expectations
  
  We use AI coding tools as a professional standard on this
  team. Here's what that means in practice:
  
  - Daily use: You use AI coding assistants (we support Claude
    Code, Cursor, and GitHub Copilot) for real, substantive
    tasks: analysis, coding, refactoring, testing, navigating
    codebases, and documentation. Not just research or
    autocomplete.
  - Judgment and ownership: AI-generated code gets the same
    review you'd give any PR. You are accountable for
    everything you ship.
  - Velocity: We expect senior engineers who use AI well to
    operate with meaningful leverage — doing more with the
    same time, taking on problems that would otherwise require
    a larger team.
  - Team leadership: You share what works. You automate
    prompting strategies that others can build on and help
    teammates earlier in their AI workflow adoption get up to
    speed.
  - Continuous learning: The tooling is changing fast. You stay
    current and bring recommendations to the team when
    something would meaningfully improve how we work.
  
  What You’ll Do
  
  - Design and build high-quality features for aging parents,
    pre-teen wearable users, and community groups —
    experiences that are safe, intuitive, and genuinely
    useful.
  - Work with AI (Claude Code) as a first-class collaborator —
    your primary workflow involves orchestrating agents to
    create specs, generate code and tests, verify results, and
    perform reviews.
  - Help define and codify AI-Native engineering practices for
    the Circle Expansion team, establishing playbooks the
    broader org can adopt.
  - Build across the full stack as needed — shipping polished,
    performant, and reliable experiences to tens of millions
    of users.
  - Collaborate closely with product managers and designers to
    turn complex user problems into elegant, scalable
    engineering solutions.
  - Contribute to architectural decisions, code reviews, and a
    culture of craft and continuous improvement.
  - Participate in on-call rotation and incident response.
  - Use agentic workflows to dramatically increase the delivery
    of strong outcomes — moving faster without sacrificing
    quality.
  - Mentor team members and contribute to team processes,
    technical standards, and help evolve the team's AI-native
    engineering practices.
  - Support performance, reliability, and accessibility across
    the features you own.
  
  What We’re Looking For
  
  - 7+ years of experience building high-quality, consumer-scale
    software products.
  - At least 1 year of hands-on experience prompting,
    evaluating, and building with LLMs.
  - Strong proficiency in mobile development (iOS or Android) —
    you know what great mobile UX feels like and how to build
    it. Web and backend experience (Java, Kubernetes, AWS) are
    valued alternatives.
  - Deep experience with agentic workflows, prompt engineering,
    context window management, and MCP/function calling.
  - A track record of using AI tooling to multiply your own
    output — not just as autocomplete, but as a genuine
    development partner.
  - Strong communication and collaboration skills — you work
    well with product, design, and platform engineers.
  - A genuine excitement for defining what it means to be AI-
    Native — you’re not waiting for the playbook, you want to
    write it.
  - Empathy for the humans behind the product — an aging parent
    trying to stay independent, a parent tracking their pre-
    teen, a coach wrangling 20 families on game day.
  - Bachelor’s Degree in a Technical field, or equivalent
    experience.
  
  Our Benefits
  
  - Competitive pay and benefits
  - Medical, dental, vision, life and disability insurance plans
    (US and Canada)
  - 401(k) plan with company matching (US) / RRSP with DPSP
    matching (Canada)
  - Employee Assistance Program (EAP) for mental well-being
  - Flexible PTO, plus several company-wide days off throughout
    the year
  - Winter and Summer week-long synchronized company shutdowns
  - Learning & Development programs
  - Equipment, tools, and reimbursement support for a productive
    remote environment
  - Free Life360 Platinum Membership for your preferred circle
  - Free Tile Products
  
  Life360 Values
  
  Our company’s mission-driven culture is guided by our shared
  values to create a trusted work environment where you can
  bring your authentic self to work and make a positive
  difference.
  
  - Be a Good Person — We have a team of high-integrity people
    you can trust.
  - Be Direct With Respect — We communicate directly, even when
    it’s hard.
  - Members Before Metrics — We focus on building an exceptional
    experience for families.
  - High Intensity, High Impact — We do whatever it takes to get
    the job done.
  
  Our Commitment to Diversity
  
  We believe that different ideas, perspectives and
  backgrounds create a stronger and more creative work
  environment that delivers better results. Together, we
  continue to build an inclusive culture that encourages,
  supports, and celebrates the diverse voices of our
  employees. It fuels our innovation and connects us closer to
  our customers and the communities we serve. We strive to
  create a workplace that reflects the communities we serve
  and where everyone feels empowered to bring their authentic
  best selves to work.
  
  We are an equal opportunity employer and value diversity at
  Life360. We do not discriminate on the basis of race,
  religion, color, national origin, gender, sexual
  orientation, age, marital status, veteran status, disability
  status or any legally protected status.
  
  We encourage people of all backgrounds to apply. We believe
  that a diversity of perspectives and experiences create a
  foundation for the best ideas. Come join us in building
  something meaningful. Even if you don’t meet 100% of the
  above qualifications, you should still seriously consider
  applying!
  
