description: |
  Job Summary
  
  We are seeking a skilled Full Stack Developer with strong
  experience in modern JavaScript-based frontend frameworks,
  backend development, and growing expertise in Generative AI
  (GenAI) and Large Language Model (LLM) solutions. The role
  involves building scalable, secure, and AI-powered web
  applications, integrating intelligent automation, and
  deploying cloud-native, event-driven architectures.
  
  You will work closely with cross-functional teams—including
  AI, data, design, and product stakeholders—to deliver end-
  to-end AI-enabled solutions, from ingestion and model
  integration to user-facing applications.
  
  Key Responsibilities Frontend Development
  
  - Develop responsive, high-performance web applications using
    React or Angular
  - Build intuitive user interfaces for AI-powered features such
    as chatbots, intelligent search, recommendations, and
    dashboards
  - Ensure cross-browser compatibility, accessibility, and
    optimal user experience
  
  Backend & API Development
  
  - Design, develop, and maintain scalable backend services
    using .NET, Java, and Python
  - Build and consume RESTful APIs using frameworks such as
    FastAPI and Spring Boot
  - Implement clean, maintainable, well-documented, and reusable
    code
  - Troubleshoot, debug, performance-tune, and upgrade existing
    systems
  - Participate in code reviews and contribute to best
    engineering practices
  
  GenAI & LLM Solutions
  
  - Develop LLM-powered applications using modern Generative AI
    design patterns
  - Build, optimize, and maintain RAG (Retrieval-Augmented
    Generation) pipelines, including:
    - Data ingestion
    - Embeddings generation
    - Vector storage and retrieval
  - Evaluate, integrate, and productionize LLM platforms and
    APIs (e.g., OpenAI, Azure OpenAI, AWS Bedrock, Google AI)
  - Integrate AI-driven capabilities such as conversational
    interfaces, summarization, recommendations, and
    intelligent automation
  - Work closely with AI and data teams to support deployment
    and usage of machine learning and LLM models in
    applications
  
  Cloud & Event-Driven Systems
  
  - Design and build cloud-native applications on AWS,
    including:
    - AWS Bedrock
    - AWS Lambda
    - Amazon S3
    - DynamoDB
  - Implement event-driven and asynchronous architectures for
    scalable systems
  - Support real-time and near-real-time processing use cases
  - Optimize applications for performance, scalability, cost
    efficiency, and reliability
  
  Data, Security & Performance
  
  - Work with SQL and NoSQL databases for application and AI
    workloads
  - Ensure application security best practices are followed
  - Optimize applications for maximum speed, scalability, and
    reliability
  - Implement proper logging, monitoring, and error-handling
    strategies
  
  Required Skills & Qualifications Technical Skills
  
  - 4–6 years of professional experience as a Backend OR
    platform engineering
  - Strong proficiency in Java & Python
  - Solid understanding of RESTFUL APIs, web services, and
    system design
  - Experience with FastAPI and/or Spring Boot
  - Practical experience or strong exposure to LLMs, RAG
    pipelines, or GenAI applications
  - Hands-on experience with AWS services such as Bedrock,
    Lambda, S3, DynamoDB
  - Strong knowledge of SQL and relational databases; exposure
    to NoSQL databases is a plus
  - Experience using Git-based version control systems
  
  AI & Cloud (Preferred / Plus)
  
  - Basic to intermediate understanding of AI/ML concepts, such
    as:
    - Natural Language Processing (NLP)
    - Machine Learning fundamentals
    - Generative AI
  - Experience integrating AI/ML APIs and intelligent automation
    into web applications
  - Familiarity with cloud-native, event-driven, and
    microservices architectures
  
  Soft Skills
  
  - Strong problem-solving skills and attention to detail
  - Excellent communication and collaboration skills
  - Ability to work effectively in a cross-functional team
    environment
  - Willingness to learn, experiment, and adapt to emerging AI
    technologies
  
  Requirements
  
  Educational Requirements
  
  - Bachelor’s degree in Computer Science, Information
    Technology, or a related field(or equivalent practical
    experience)
