description: |
  The job in short
  
  Together with your team you will maintain and extend our
  mobile product offering. Are you ready to take our mobile
  apps to the next level?
  
  Meet the job
  
  Developers all over the world will use your code when
  developing state-of-the-art mobile apps for the fintech
  industry. That’s why you will constantly create stunning
  products with remarkable user experience.
  
  As you know, mobile banking trends are constantly changing.
  It’s your job to adapt to these changes and see into the
  future. You enjoy coming up with innovative features and
  turning them into new tools for our customers. Our product
  is never finished. Are you up for the challenge?
  
  What about you?
  
  - You’ve earned your stripes designing and building Android
    apps, and at least one can be found on Google Play;
  - Your friends would define you as the “getting things done”
    type;
  - The Agile philosophy is your lifestyle;
  - We won’t have to tell you anything about mobile development
    for Android. You’ll be the one teaching us your best
    practices;
  - An additional bonus for us would be your experience with
    testing frameworks (JUnit, Mockito, Espresso), scripting
    languages (Gradle, Groovy, Python), and/or Jenkins.
