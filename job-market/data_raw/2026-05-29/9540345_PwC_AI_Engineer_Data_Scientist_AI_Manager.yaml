title: AI Engineer / Data Scientist, AI Manager
company: PwC
location: Los Angeles, USA
work_type: FULL_TIME
description: |
  At PwC, our people in audit and assurance focus on providing
  independent and objective assessments of financial
  statements, internal controls, and other assurable
  information enhancing the credibility and reliability of
  this information with a variety of stakeholders. They
  evaluate compliance with regulations including assessing
  governance and risk management processes and related
  controls. Those in data, analytics and technology solutions
  at PwC will assist clients in developing solutions that help
  build trust, drive improvement, and detect, monitor, and
  predict risk. Your work will involve using advanced
  analytics, data wrangling technology, and automation tools
  to leverage data and focus on establishing the right
  processes and structures to enable our clients to make
  efficient and effective decisions based on accurate
  information that is complete and trustworthy. Enhancing your
  leadership style, you motivate, develop and inspire others
  to deliver quality. You are responsible for coaching,
  leveraging team member's unique strengths, and managing
  performance to deliver on client expectations. With your
  growing knowledge of how business works, you play an
  important role in identifying opportunities that contribute
  to the success of our Firm. You are expected to lead with
  integrity and authenticity, articulating our purpose and
  values in a meaningful way. You embrace technology and
  innovation to enhance your delivery and encourage others to
  do the same. Examples of the skills, knowledge, and
  experiences you need to lead and deliver value at this level
  include but are not limited to: Analyse and identify the
  linkages and interactions between the component parts of an
  entire system. Take ownership of projects, ensuring their
  successful planning, budgeting, execution, and completion.
  Partner with team leadership to ensure collective ownership
  of quality, timelines, and deliverables. Develop skills
  outside your comfort zone, and encourage others to do the
  same. Effectively mentor others. Use the review of work as
  an opportunity to deepen the expertise of team members.
  Address conflicts or issues, engaging in difficult
  conversations with clients, team members and other
  stakeholders, escalating where appropriate. Uphold and
  reinforce professional and technical standards (e.g. refer
  to specific PwC tax and audit guidance), the Firm's code of
  conduct, and independence requirements. The Opportunity As
  part of the AI Engineering team, you will design, test, and
  deploy innovative AI/ML solutions that drive productivity
  and innovation. As a Manager, you will lead teams, mentor
  junior staff, and leverage your knowledge to secure
  successful project delivery while cultivating meaningful
  client relationships. This role offers a unique chance to
  stay at the forefront of industry trends and champion AI-
  assisted development, making a significant impact on our
  processes and solution design. Responsibilities
  - Design, test, and implement advanced AI and machine learning
    solutions
  - Collaborate with diverse teams to secure project alignment
    and success
  - Stay updated on industry advancements and practices for
    continuous improvement
  - Advocate for the use of AI tools to enhance operational
    productivity
  - Provide mentorship and constructive feedback to junior staff
  - Inspire and motivate team members to achieve exceptional
    performance
  - Manage project timelines and deliverables to meet client
    expectations
  - Analyze complex problems and develop innovative solutions
  What You Must Have
  - Bachelor's Degree
  - At least 5 years of professional AI / ML development or
    testing experience
  - At least 1 year of experience as a technical lead or
    engineering / data science manager
  What Sets You Apart
  - Bachelor's Degree in Accounting, Business Analytics,
    Analytics, Software Engineering, Computer Engineering
    preferred
  - Ability to implement AI thinking in teams
  - Driving efficiencies across engineering or data science
    workflows
  - Testing AI effectively
  - Analyzing and building data models
  - Preprocessing and handling large datasets
  - Developing and deploying models in PyTorch, TensorFlow, or
    JAX
  - Staying current on industry trends and tools
  - Mentoring junior team members with coaching and feedback
  The salary range for this position is: $99,000 - $252,450.
  For residents of Washington state the salary range for this
  position is: $99,000 - $297,000. Actual compensation within
  the range will be dependent upon the individual's skills,
  experience, qualifications and location, and applicable
  employment laws. All hired individuals are eligible for an
  annual discretionary bonus. PwC offers a wide range of
  benefits, including medical, dental, vision, 401k, holiday
  pay, vacation, personal and family sick leave, and more. To
  view our benefits at a glance, please visit the following
  link: https://pwc.to/benefits-at-a-glance As PwC is an equal
  opportunity employer, all qualified applicants will receive
  consideration for employment at PwC without regard to race;
  color; religion; national origin; sex (including pregnancy,
  sexual orientation, and gender identity); age; disability;
  genetic information (including family medical history);
  veteran, marital, or citizenship status; or, any other
  status protected by law. PwC does not intend to hire
  experienced or entry level job seekers who will need, now or
  in the future, PwC sponsorship through the H-1B lottery,
  except as set forth within the following policy:
  https://pwc.to/H-1B-Lottery-Policy. Learn more about how we
  work: https://pwc.to/how-we-work For only those qualified
  applicants that are impacted by the Los Angeles County Fair
  Chance Ordinance for Employers, the Los Angeles' Fair Chance
  Initiative for Hiring Ordinance, the San Francisco Fair
  Chance Ordinance, San Diego County Fair Chance Ordinance,
  and the California Fair Chance Act, where applicable, arrest
  or conviction records will be considered for Employment in
  accordance with these laws. At PwC, we recognize that
  conviction records may have a direct, adverse, and negative
  relationship to responsibilities such as accessing sensitive
  company or customer information, handling proprietary
  assets, or collaborating closely with team members. We
  evaluate these factors thoughtfully to establish a secure
  and trusted workplace for all.
