description: |
  What is Pakket?
  
  Pakket is building the operating system for the physical
  world of warehouses.
  
  Today, most warehouse operations run on a patchwork of
  spreadsheets, radios, and outdated software. The actual
  activity on the floor — forklifts moving, trucks arriving,
  people working — is largely invisible to software systems.
  
  We change that.
  
  Pakket uses cameras and AI to create a real-time, live map
  of warehouse operations. We track forklifts, people,
  trailers, and yard movement — turning physical activity into
  structured, actionable data.
  
  This unlocks:
  
  - Real-time visibility into operations
  - Automated alerts (delays, congestion, detention risk)
  - Historical analytics on performance
  - A system of record for the warehouse floor
  
  Our goal is simple: make every warehouse measurable,
  optimizable, and autonomous.
  
  Pakket is already live — deployed in warehouses across
  America, tracking real forklifts, real trailers, and real
  operations right now. This isn't a pilot waiting to be
  proven. It's a product that's working, and we're scaling
  fast. Come join us in transforming the logistics world.
  
  The Role
  
  You'll be an early hire at Pakket on the technical team,
  working directly alongside the founder. Your job is to keep
  the system running and help ship fast — whether that means
  debugging an edge server in the field, improving the CV
  pipeline, or building a new backend feature for a customer
  demo.
  
  This is not a siloed backend role. You'll touch everything:
  the Python CV pipeline running on-site at warehouses, the
  API backend on Render, the Linux edge server, and the
  frontend when needed. The ability to debug across the full
  stack and move quickly matters more than deep
  specialization.
  
  If you join, you will:
  
  - Debug and improve the computer vision pipeline — including
    YOLO-based detection and geometric positioning
  - Own backend reliability — FastAPI, PostgreSQL, async
    SQLAlchemy, and the edge-to-cloud data pipeline
  - Build and ship customer-facing features: alerts, dashboards,
    historical playback, and zone monitoring
  - Manage edge server deployments at warehouse sites — Linux
    configuration, process management, remote access
  - Containerize and harden the system using Docker for
    consistent deployments across edge hardware
  - Identify and fix performance bottlenecks across compute,
    VRAM, storage, and networking
  - Work with the founder on architecture decisions as the
    system scales from 1 warehouse to many
  
  Qualifications
  
  - 3–6 years of backend or full-stack engineering experience
  - Strong Python — you write clean, readable code and can
    navigate an existing codebase quickly
  - Experience with FastAPI or similar async Python frameworks,
    and SQL databases
  - Solid Linux skills — comfortable SSHing into a remote
    machine, debugging processes, and managing services
  - Docker proficiency — you containerize applications and
    understand multi-service setups
  - Experience with cloud infrastructure (AWS, GCP, Render,
    DigitalOcean, or similar)
  - A debugging mindset — when something breaks at 2am in a
    warehouse, you figure it out
  - Comfortable with ambiguity and building in an early-stage
    environment
  
  Bonus points if you:
  
  - Have worked with computer vision libraries — OpenCV,
    YOLO/Ultralytics, or similar
  - Have experience with GPU compute, CUDA, or TensorRT
  - Have worked with RTSP video streams, FFmpeg, or HLS
    pipelines
  - Have deployed and maintained systems on edge hardware
    outside of a data center
  - Have experience with real-time systems — WebSockets,
    pub/sub, or streaming architectures
  
  Why Pakket
  
  - You'll be a founding engineer — owning architecture
    decisions from day one, not maintaining someone else's
    system
  - The problem is real and the market is large: warehouses are
    a $1T+ industry still running on spreadsheets and radios
  - You'll see the direct impact of your work — your code runs
    live on a warehouse floor
  - Competitive salary, meaningful equity, and the opportunity
    to help build the company from the ground up
