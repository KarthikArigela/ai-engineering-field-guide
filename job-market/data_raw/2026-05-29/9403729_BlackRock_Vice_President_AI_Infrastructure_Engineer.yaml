description: |
  About this role
  
  AI Infrastructure Engineer
  
  At BlackRock, technology underpins everything we do. AI is a
  core strategic priority for the firm, embedded across
  Aladdin and our investment, client, and operational
  platforms. We are seeking an AI Infrastructure Engineer to
  help build and operate the foundational infrastructure that
  enables AI systems to scale safely, securely, and reliably
  across the enterprise.
  
  This role sits within Aladdin Platform Engineering and
  focuses on the infrastructure and platform services required
  to support machine learning models, large language models
  (LLMs), and emerging AI capabilities in production. The
  successful candidate will work closely with AI Engineers,
  Data Scientists, Platform Engineers, Security, and Product
  partners to deliver resilient, cloud‑native AI platforms in
  a highly regulated environment.
  
  Key Responsibilities
  
  - Design, build, and operate AI focused‑focused infrastructure
    platforms supporting model development, training,
    evaluation, and inference.
  
  - Engineer scalable, reliable, and secure cloud native‑native
    services to support AI workloads across AWS, Azure, and
    hybrid environments.
  
  - Partner with AI Engineering and Data Science teams to
    improve developer experience, performance, and operational
    stability of AI systems.
  
  - Enable production deployment of ML models and LLMs within
    governed enterprise environments, aligned with firmwide
    risk and compliance standards.
  
  - Implement and maintain infrastructure‑as‑code and automation
    to ensure repeatable, auditable platform provisioning.
  
  - Build and operate observability, monitoring, and alerting
    solutions for AI platforms, ensuring availability,
    performance, and cost transparency.
  
  - Collaborate with Security and Risk partners to integrate
    identity, access controls, data protection, and governance
    into AI infrastructure.
  
  - Contribute to architectural decisions and technical
    standards for AI platforms across Aladdin.
  
  - Participate in on-call rotations and operational support as
    required‑call rotations and operational support as
    required for critical platforms.
  
  - Continuously evaluate emerging AI infrastructure
    technologies and apply them pragmatically within
    BlackRock’s enterprise context.
  
  Qualifications
  
  Required
  
  - Strong experience in cloud infrastructure, platform
    engineering, or systems engineering roles.
  
  - Hands-on expertise‑on expertise with AWS and/or Azure and/or
    GCP, including Azure ML, Azure Foundry, AWS Bedrock,
    Google Vertex, as well as cloud compute, networking,
    storage, and security services.
  
  - Understanding of ML platform operations and governance
    concepts, including model deployment strategies, lifecycle
    management, monitoring/observability, and Disaster
    Recovery
  
  - Experience supporting LLMs, generative AI platforms, or
    model serving infrastructure.
  
  - Experience supporting AI and machine learning workloads,
    with exposure to managed compute for model training and
    fine‑tuning, experimentation over large datasets, and
    end‑to‑end MLOps pipeline flow including data ingestion,
    training, validation and deployment.
  
  - Proficiency with Infrastructure as Code‑as‑code tools (e.g.,
    Terraform, ARM/Bicep, CloudFormation).
  
  - Strong programming or scripting skills (e.g., Python, Bash,
    or similar).
  
  - Experience building and operating containerized and
    Kubernetes based‑based platforms.
  
  - Solid understanding of reliability, scalability,
    observability, and operational best practices.
  
  - Ability to work effectively in cross‑functional teams and
    communicate complex technical concepts clearly.
  
  Preferred
  
  - Familiarity with GPU or accelerator‑based infrastructure.
  
  - Experience working in financial services or other highly
    regulated industries.
  
  - Familiarity with multi‑cloud architectures and enterprise
    governance requirements.
  
  For New York, NY Only the salary range for this position is
  USD$162,000.00 - USD$215,000.00 . Additionally, employees
  are eligible for an annual discretionary bonus, and benefits
  including healthcare, leave benefits, and retirement
  benefits. BlackRock operates a pay-for-performance
  compensation philosophy and your total compensation may vary
  based on role, location, and firm, department and individual
  performance.
  
  Our benefits To help you stay energized, engaged and
  inspired, we offer a wide range of benefits including a
  strong retirement plan, tuition reimbursement, comprehensive
  healthcare, support for working parents and Flexible Time
  Off (FTO) so you can relax, recharge and be there for the
  people you care about.
  
  Our hybrid work model
  
  BlackRock’s hybrid work model is designed to enable a
  culture of collaboration and apprenticeship that enriches
  the experience of our employees, while supporting
  flexibility for all. Employees are currently required to
  work at least 4 days in the office per week, with the
  flexibility to work from home 1 day a week. Some business
  groups may require more time in the office due to their
  roles and responsibilities. We remain focused on increasing
  the impactful moments that arise when we work together in
  person – aligned with our commitment to performance and
  innovation. As a new joiner, you can count on this hybrid
  model to accelerate your learning and onboarding experience
  here at BlackRock.
  
  About BlackRock
  
  At BlackRock, we are all connected by one mission: to help
  more and more people experience financial well-being.  Our
  clients, and the people they serve, are saving for
  retirement, paying for their children’s educations, buying
  homes and starting businesses. Their investments also help
  to strengthen the global economy: support businesses small
  and large; finance infrastructure projects that connect and
  power cities; and facilitate innovations that drive
  progress.
  
  This mission would not be possible without our smartest
  investment – the one we make in our employees. It’s why
  we’re dedicated to creating an environment where our
  colleagues feel welcomed, valued and supported with
  networks, benefits and development opportunities to help
  them thrive.
  
