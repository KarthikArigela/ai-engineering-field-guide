  About the Role
  
  We are looking for a deep expert in Large Language Models
  (LLMs) to lead the architectural development of our new
  "Super Agent" within Chatly. You will move beyond simple
  chat interfaces to build autonomous agents capable of
  complex reasoning, tool usage, and seamless integration with
  external workflows.
  
  Key Responsibilities
  
  - Agent Architecture: Design and implement stateful agentic
    workflows (using frameworks like LangGraph or custom
    Python/TypeScript solutions) that can plan, execute, and
    self-correct
  - Integration Ecosystem: Build the "hands" of the agent.
    Develop robust integration layers that allow the LLM to
    interact with our internal APIs, databases, and third-
    party tools reliably
  - Latency & Reliability: Optimize inference pipelines for
    speed (streaming, token optimization) and reliability
    (handling hallucinations, structured output validation)
  - Memory Systems: Architect advanced RAG (Retrieval-Augmented
    Generation) systems to give the Super Agent persistent
    memory and context awareness across sessions
  - Evaluation & Observability: Establish a rigorous testing
    framework for non-deterministic model outputs to ensure
    the agent behaves as expected in production
  
  Technical Requirements
  
  - Core Stack: Deep proficiency in Python (or TypeScript) and
    the modern AI stack (LangChain, LlamaIndex, DSPy)
  - Model Internals: Strong grasp of how to leverage specific
    model strengths (e.g., GPT-4o for reasoning, Haiku/Flash
    for speed) and experience with Function Calling/Tool Use
  - Vector Search: Hands-on experience with vector databases
    (Pinecone, Milvus, Weaviate) and embedding strategies
  - System Design: Experience designing event-driven
    architectures where agents respond to triggers, not just
    user prompts
  
