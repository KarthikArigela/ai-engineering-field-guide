title: Forward Deployed AI Engineer
company: Lleverage
location: Amsterdam, NLD
work_type: FULL_TIME
company_size: 25 Employees
description: |
  About us
  
  Hey there! We’re Lleverage and we’re making AI automation
  actually achievable for businesses. We enable teams to
  capture, automate, and integrate AI-driven workflows and
  agents into their business, because AI is only useful when
  it actually fits into daily operations.
  
  We’re a team of entrepreneurs and innovators, who believe
  the future of work is 80% creativity, strategy, and human
  interaction, because AI takes care of the rest. If that
  sounds something you want to help build, we’d love to have
  you on board!
  
  About the role
  
  We brought Silicon Valley’s hottest job to the Netherlands.
  Now we're looking for an extra FDE to join our FDE team and
  to bridge the gap between our sales team and our clients'
  technical needs. You'll be the technical expert who works
  with potential clients during the sales process, designs
  custom AI solutions, and ensures successful implementation
  on our platform. This role is perfect for someone who’s
  fascinated by the technical possibilities of AI, enjoys
  working directly with clients (pre and post sales) and loves
  to solve real business problems while navigating a
  complicated stakeholder field.
  
  Our core philosophy about FDE’s is captured perfectly by:
  "Everyone wants a magical AI experience that can replace
  human workflows overnight. But that type of agentic
  experience is generally impossible without some hands-on
  help. Customers buying AI are like your grandma getting an
  iPhone. They really want to use it, but they need you to set
  it up.
  
  Responsibilities
  
  - Pre-Sales Support: Join the sales team in technical scoping
    calls with potential clients, answering complex questions
    and demonstrating technical feasibility.
  - Solution Design: After successful sales, take ownership of
    designing tailored AI solutions that meet our customers'
    specific needs.
  - Implementation: Work with project managers to build AI
    solutions on the Lleverage platform, either independently
    or collaboratively with customers. You will also take on
    some project management responsibilities within the
    project.
  - Quality Improvement: Take responsibility for improving
    quality metrics once solutions are live, ensuring they
    deliver measurable business value.
  - Customer Success: Serve as a technical advisor throughout
    the customer journey, from initial interest to successful
    implementation.
  - Platform Expertise: Become an expert on the Lleverage
    platform capabilities and help shape the product roadmap
    based on customer needs.
  - Voice of the Customer: Represent customers’ needs when
    discussing improvements to the Lleverage platform.
  
  Job specific requirements
  
  - Technical Background: Deep interest and hands-on experience
    with LLMs and prompt engineering. Technical proficiency in
    API integration, data analysis, troubleshooting, and basic
    programming.
  - Communication Skills: Excellent ability to explain complex
    technical concepts to non-technical stakeholders.
  - Solution-Oriented: Proven track record of designing and
    implementing technical solutions for business problems.
  - Customer-Focused: Experience working directly with clients
    in a technical advisory role.
  - Self-Starter: Ability to take ownership of projects and
    drive them to completion with minimal supervision.
  - Adaptability: Comfortable in a fast-paced startup
    environment where priorities and technology are constantly
    evolving.
  
  - Entrepreneurial: We are a fast growing startup, so you will
    be responsible for designing your processes.
  
  Nice to haves
  
  - Experience in a pre-sales or solutions architecture role
  - Background in SaaS or enterprise software
  - Knowledge of low-code/no-code platforms
  - Project management experience
  - A carry-on ice cream bar (it's becoming our thing)
  
  We offer
  
  You are ready for the ride of a lifetime with experienced
  entrepreneurs and innovators who aim for hyper growth on a
  global scale. We look for an enormous drive and hands-on
  mentality. Somebody who can work with us in creating the
  best AI low code solution out there!
  
  We offer a good salary, a highly experienced (and very
  entertaining...) team and considerable share packages.
