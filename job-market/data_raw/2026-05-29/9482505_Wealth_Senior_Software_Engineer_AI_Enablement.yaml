description: |
  Title: Senior Software Engineer, AI Enablement
  
  Location: Hybrid — New York, NY
  
  About Us
  
  Wealth.com is the industry’s leading AI wealth management
  platform, empowering financial institutions to modernize how
  they deliver planning advice to clients. Trusted by the
  largest firms in wealth management, Wealth.com combines
  proprietary AI, enterprise-grade security, and deep legal
  and tax expertise to power scalable, compliant, and
  personalized planning experiences across the full client
  lifecycle.
  
  The company has been widely recognized for innovation and
  leadership, winning Top Estate Planning Technology and Top
  Estate Planning Implementation at the 2025
  WealthManagement.com Industry Awards, and earning #1 in
  estate planning market share in the 2025 Kitces AdvisorTech
  Study.
  
  At Wealth.com, our team is core to everything we build. We
  foster a collaborative, high-performing environment that
  values innovation, ownership, and continuous improvement.
  Wealth.com is proud to be certified as a Great Place to
  Work®.
  
  The Role
  
  We are seeking a Senior Software Engineer, AI Enablement to
  build the internal AI systems that power how Wealth.com
  operates. This is a builder role. You will design and ship
  production grade AI agents and modular Claude Skills that
  connect to our systems of record and our internal data layer
  — not prototypes or demos. You will operate at the
  intersection of AI, internal product, and full-stack
  engineering, taking ambiguous business processes and turning
  them into legible, reusable, and composable systems. Your
  work will directly shape how our sales, marketing,
  operations, and engineering teams scale with AI as their
  force multiplier.
  
  What You Will Do
  
  Build Claude Skills and internal AI tooling
  
  - Design and implement modular Claude Skills that connect to
    our core systems (Salesforce, Google Drive, Slack,
    internal data sources)
  - Create clean abstractions that let non-technical teammates
    compose these primitives into useful workflows without
    writing code
  
  Ship autonomous AI agents
  
  - Build agents that operate independently across sales,
    marketing, finance and operations, handling research, data
    enrichment, proposal generation, and routine decision-
    making
  - Design systems that balance autonomy, control, and
    reliability, with clear escalation paths when human
    judgment is needed
  
  Own the AI development environment
  
  - Establish and maintain the infrastructure that lets the team
    build with AI tools — Claude Code, Cursor, and whatever
    emerges next
  - Create templates, patterns, and documentation that
    accelerate everyone's ability to ship
  
  Design for composability
  
  - Think deeply about interface design between AI components
  - Build systems where outputs from one tool become inputs to
    another, and where complex capabilities emerge from
    simple, well-designed primitives
  
  Drive quality and performance
  
  - Build evaluation and feedback loops
  - Implement guardrails and monitoring
  - Optimize for latency, cost, and accuracy
  
  Work across the stack
  
  - Backend services, APIs, data pipelines, and internal
    frontend experiences
  - Ship quickly and iterate based on real usage from internal
    teammates
  
  Qualifications
  
  - Degree in Computer Science, Engineering, or equivalent
    practical experience
  - Strong software engineering fundamentals (system design,
    data structures, clean code)
  - Proven track record of building and shipping production AI
    systems
  - Proficiency in Python and TypeScript, and comfort working
    across a polyglot stack, picking up new languages and
    frameworks as needed
  - Hands-on experience building AI agents that run in
    production — systems that operate autonomously, handle
    edge cases, and know when to escalate
  - Practical, working knowledge of prompt engineering, context
    management, and structured outputs
  - Extensive experience coding with AI tools like Claude Code
    or Cursor and modern LLM APIs
  - Strong product instincts — you build backwards from user
    needs and have shipped internal tools that non-technical
    teammates actually enjoy using
  
  Preferred Qualifications (Bonus Points)
  
  - Experience building end-to-end agentic applications
  - Experience with:
  - RAG systems and vector databases
  - Agent frameworks (LangGraph, LangChain, etc.)
  - Evaluation / observability systems for LLM applications
  - Workflow automation platforms (n8n, Zapier, Make, etc.)
  - Experience designing AI-native UX where users collaborate
    with agents
  - Experience integrating with CRMs, marketing platforms, or
    other systems of record
  - Experience with cloud infrastructure: GCP (Cloud Run) or AWS
    (ECS, Lambda)
  - Experience in regulated domains (FinTech, LegalTech, etc.)
  
  Benefits & Perks
  
  - Competitive salary
  - Hybrid work arrangement in the New York area (4 days in
    office)
  - Excellent medical, dental, and vision insurance options,
    with low-cost premium structures that demonstrate our
    commitment to offering great value to our employees
  - 100% company-paid basic life insurance, short-term and long-
    term disability insurance
  - 100% paid parental leave upon eligibility
  - Company equity managed through Carta
  - 401k with match and 100% vesting upon hire
  - Flexible PTO in an environment where taking time off to
    relax or recharge is supported and encouraged
  - Take time off for holidays — and yes, your birthday counts
    too. Celebrate, relax, and recharge without thinking
    twice.
  
  Wealth is an equal opportunity employer and encourages
  people from all backgrounds to apply. Should you have a
  disability or special need that requires accommodation,
  please let us know.
