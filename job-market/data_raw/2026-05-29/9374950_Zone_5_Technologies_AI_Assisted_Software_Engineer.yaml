description: |
  At Zone 5 Technologies, we're redefining what's possible in
  unmanned aircraft systems. Our team of engineers and
  innovators is developing cutting-edge autonomous solutions
  that push the boundaries of UAS technology - solving complex
  challenges that matter.
  
  We're building the future of UAS capabilities, and we're
  looking for exceptional talent to join us. If you're driven
  by hard problems, energized by rapid innovation, and ready
  to make an impact on next-generation flight systems, you
  belong here.
  
  We are seeking an experienced AI-Assisted Software Engineer
  / Enterprise Systems Builder to design, prototype, and
  deploy enterprise-grade software solutions using modern AI-
  assisted development tools. This role combines software
  engineering, systems architecture, product thinking, and
  rapid iteration to build internal applications, workflow
  automation, and a custom ERP platform that supports core
  business operations.
  
  The ideal candidate is a highly autonomous full-stack
  engineer who can transform loosely defined business
  challenges into scalable, production-ready systems while
  maintaining high standards for security, reliability, and
  maintainability.
  
  KEY RESPONSIBILITIES:
  
  - Use AI-assisted coding tools to accelerate the development
    of enterprise applications and internal systems
  - Architect and develop a custom ERP platform supporting
    inventory management, purchasing and procurement,
    manufacturing workflows, scheduling and planning, CRM and
    customer management, finance and accounting integrations,
    and reporting and operational dashboards.
  - Translate complex business processes into scalable software
    solutions
  - Build workflow automation tools and operational applications
  - Design and maintain APIs and third-party integrations
  - Create and optimize database schemas while ensuring data
    integrity
  - Develop responsive web applications, portals, and
    administrative dashboards
  - Rapidly prototype new concepts and iterate directly with
    stakeholders
  - Leverage AI tools for: code generation, refactoring,
    documentation, testing, architecture brainstorming, and
    debugging support.
  - Review and validate AI-generated code for quality,
    maintainability, and security
  - Establish development standards, deployment pipelines, and
    engineering workflows
  - Collaborate cross-functionally with operations, leadership,
    and end users to improve business systems and efficiency
  
  REQUIRED QUALIFICATIONS:
  
  - Bachelor’s degree in Computer Science, Software Engineering,
    or related technical field
  - 5+ years of professional software engineering experience
  - Strong full-stack development experience building enterprise
    or operational software systems
  - Experience architecting and developing scalable business
    applications
  - Proficiency with AI-assisted development workflows and tools
  - Strong understanding of: system architecture, relational
    databases, API design and integrations, authentication and
    authorization, enterprise security practices, scalable
    application design.
  - Experience with modern technologies such as:
    TypeScript/JavaScript, Python, React/Next.js, Node.js,
    PostgreSQL, Docker, Cloud Platforms.
  - Strong debugging, analytical, and problem-solving skills
  - Ability to work independently in a fast paced environment
    from ambiguous requirements and drive projects to
    completion
  - Comfortable operating in a fast-paced, startup-style
    environment
  - S. Citizenship
  
  PREFERRED QUALIFICATIONS
  
  - Experience building ERP, MES, manufacturing, or supply-chain
    systems
  - Experience with multi-tenant applications, workflow engines,
    RBAC and permissions systems, reporting and BI platforms,
    AI agents and orchestration tools, OCR and document
    processing, EDI integrations, DevOps and could
    infrastructure.
  - Experience integrating LLM’s into internal business tools
    and work flows.
  
  The ideal candidate combines the mindset of both a software
  engineer and product owner, with the ability to deeply
  understand business operations and translate complex
  workflows into scalable software solutions. They leverage AI
  as a tool to accelerate development while maintaining strong
  engineering standards, enjoy simplifying processes through
  automation, and thrive in fast-paced, highly autonomous
  environments focused on execution and problem solving.
  
  Pay ranges for Onsite (San Luis Obispo, CA) and remote vary.
  See salary bands below: Onsite (San Luis Obispo, CA) $141k -
  $207k
  
  Remote - $135k - $192k
  
  Pay range for this role
  
  $135,000—$225,000 USD
  
  What's in it for you:
  
  Benefits:
  
  - Competitive total compensation package
  - Comprehensive benefit package options include medical,
    dental, vision, life, and more.
  - 401k with company-match
  - 4 weeks of paid time off each year
  - 12 annual company holidays
  
  Why Join Zone 5 Technologies?
  
  - Innovative Environment: Work on cutting-edge technology that
    is shaping the future of defense and aerospace.
  - Collaborative Culture: Join a team of passionate
    professionals dedicated to pushing the boundaries of
    what’s possible.
  - Career Growth: Opportunities for professional development
    and career advancement.
  
  If you are passionate about unmanned aircraft technology and
  want to be a part of a dynamic and growing company, we would
  love to hear from you. Apply today and join the Zone 5
  Technologies team!
  
