description: |
  To get the best candidate experience, please consider
  applying for a maximum of 3 roles within 12 months to ensure
  you are not duplicating efforts.
  
  Job Category
  
  Sales
  
  Job Details
  
  About Salesforce
  
  Salesforce is the #1 AI CRM, where humans with agents drive
  customer success together. Here, ambition meets action. Tech
  meets trust. And innovation isn’t a buzzword — it’s a way of
  life. The world of work as we know it is changing and we're
  looking for Trailblazers who are passionate about bettering
  business and the world through AI, driving innovation, and
  keeping Salesforce's core values at the heart of it all.
  
  Ready to level-up your career at the company leading
  workforce transformation in the agentic era? You’re in the
  right place! Agentforce is the future of AI, and you are the
  future of Salesforce.
  
  Applications for this position will be accepted on an
  ongoing basis.
  
  Salesforce is hiring an AI & Data Integration Solution
  Engineer to join our Global Public Sector team, specifically
  supporting the US Federal region. The AI revolution is a
  data evolution, and this critical role sits at the forefront
  of making agentic AI a reality for our government customers.
  
  
  As an AI & Data Integration specialist, you are more than a
  technical expert - you are a strategic architectural partner
  who consolidates expertise across MuleSoft (Integration),
  Tableau (Analytics), Data 360 (Unified Data Management), and
  agentic AI to solve complex data and AI challenges for
  [area] customers. In this role, you will bridge the gap
  between legacy system connectivity and modern mission
  outcomes, acting as a trusted advisor who can navigate
  everything from API management and real-time data
  unification to advanced analytics and intelligent agentic
  systems.
  
  
  The Solution Engineer role focuses on closing sales
  opportunities - collaborating with account executives,
  customers, and partners to formulate a comprehensive
  technical account strategy and secure the technical win. You
  will lead activities to support the sales process including
  product demonstrations, technical workshop delivery,
  architecture strategy sessions, and other customer
  engagements. You will contribute to the success of customers
  by conducting holistic discovery, defining the “data-to-
  agentic-AI journey,” and designing compliant, AI-ready
  architectures that deliver actionable insights from
  disparate silos while enabling intelligent, autonomous
  agents.
  
  
  What you get working for the AI & Data Integration SE Team:
  
  - A Unified Mission: Work in a specialized team that owns the
    entire data-to-AI lifecycle.
  - Outcome-First Leadership: Opportunities to lead high-impact
    discovery sessions that start with agency mission outcomes
    (e.g. citizen services, public safety, legacy
    modernization) rather than product features.
  - Strategic Growth: Support from leaders committed to your
    mastery of the “Data 360 + Agentic AI” vision, including
    integration, analytics, unified data management, and
    intelligent agentic capabilities.
  - Innovation at Scale: Work for the #1 AI CRM company,
    building the trusted data foundations and agentic
    architectures required for the next generation of
    autonomous AI agents that accelerate defense outcomes.
  
  Required Qualifications:
  
  - B.S. Computer Science, Software Engineering, MIS
  - Knowledge of related applications, relational database and
    web technology
  - Solid oral, written, presentation, collaboration and
    interpersonal communication  skills
  - Ability to work as part of a team to solve technical
    problems in varied political environments
  - Minimum of 4 years of professional experience
  
  Other Qualifications you’ll need to be successful:
  
  - Architectural Mindset: Design secure, composable
    architectures that scale within regulated government
    environments (including FedRAMP High and Impact Level
    4/5/6).
  - Multi-Platform Technical Depth: Previous hands-on experience
    or deep conceptual knowledge across Integration
    (MuleSoft), Data Analytics (Tableau), Unified Data
    Management (Data 360), and agentic AI platforms. A
    qualified candidate will have expertise in two of the core
    data/integration capabilities plus demonstrated prior
    experience with agentic AI; a great candidate will have
    exposure across all.
  - Agentic AI Experience: Demonstrated experience (2+ years is
    highly valued) with agentic AI solutions, including prior
    hands-on work designing or deploying intelligent agents,
    LLM integration strategies, orchestration frameworks,
    prompt engineering, and Retrieval-Augmented Generation
    (RAG) patterns.
  - Strategic Communication: Excellent ability to reframe
    technical challenges into mission and business value for
    C-level government executives and technical stakeholders
    alike.
  - AI Readiness: Deep understanding of “Trusted Context
    Foundations” for AI, including data grounding, metadata
    intelligence, and how unified data enables reliable
    agentic workflows.
  - Collaboration & Influence: Proven ability to partner early
    with Account Executives to drive sales strategy and lead
    “Data + Agentic AI Discovery” from day one.
  - Experience: Minimum of 5 years of professional experience in
    Solution Engineering, Enterprise Architecture, or Digital
    Transformation, with previous hands-on delivery experience
    in AI/data/integration projects.
  - Technical Foundations: Degree in Computer Science/IT or
    other relevant training; prior experience with APIs, cloud
    infrastructure (AWS, Azure, GCP), and modern development
    practices is preferred.
  - US citizenship required
  
  Preferred Qualifications:
  
  - Salesforce Certifications
  - Previous experience as a solution/sales engineer
  - Certifications: One or more of the following: MuleSoft
    Certified Architect, Tableau Desktop/Server Specialist,
    Salesforce Data 360 Consultant, AI Associate credentials,
    or equivalent.
  - Industry Knowledge: Deep understanding of Public Sector/DoD
    compliance (FedRAMP, IL4/5/6) and common government data
    silos.
  - Ecosystem Expertise: Familiarity with enterprise data
    platforms, data governance and MDM tools, plus prior
    exposure to agentic AI frameworks or orchestration
    patterns.
  - Regulated Industry Experience: Background delivering AI
    solutions in highly regulated or mission-critical
    environments.
  
  What you’ll achieve:
  
  3 months:
  
  - Master the Stack: Complete intensive onboarding courses and
    certification paths for MuleSoft Anypoint Platform, Data
    360, Tableau, and agentic AI capabilities.
  - Build Your Point of View: Align with the go to market plan
    and begin building your “Data-to-Agentic AI Journey”
    whiteboarding and workshop skills.
  - Shadow & Learn: Join active Public Sector engagements to
    observe how to lead discovery and architects multi-product
    AI + data solutions.
  
  12 months:
  
  - Own the Technical Win: Serve as the lead architect on
    complex, multi-cloud data and agentic AI opportunities,
    delivering higher win rates and faster deal cycles.
  - Evangelize the Vision: Execute high-impact architectural
    workshops that showcase the power of unified data as the
    foundation for trustworthy intelligent agents.
  - Enable the Ecosystem: Mentor account teams and partners on
    how to position “Data + Integration + Agentic AI” as the
    foundation for mission transformation.
  - Drive Mission Outcomes: Successfully architect solutions
    that unify citizen/operational data, modernize legacy
    systems, enable real-time analytics, and deploy agentic AI
    capabilities that accelerate defense decision-making and
    operational excellence.
  
  Unleash Your Potential
  
  When you join Salesforce, you’ll be limitless in all areas
  of your life. Our benefits and resources support you to find
  balance and be your best, and our AI agents accelerate your
  impact so you can do your best. Together, we’ll bring the
  power of Agentforce to organizations of all sizes and
  deliver amazing experiences that customers love. Apply today
  to not only shape the future — but to redefine what’s
  possible — for yourself, for AI, and the world.
  
