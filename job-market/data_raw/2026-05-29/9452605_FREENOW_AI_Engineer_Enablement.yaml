description: |
  AI Engineer / AI Enablement Engineer (m/f/d)
  
  Location: Flexible — Hamburg, Berlin
  
  About FREENOW
  
  FREENOW empowers smarter mobility decisions, helping people
  move freely and cities thrive. As Europe’s leading Mobility
  Super App, we serve more than 54 million users across 16
  markets and 170+ cities.
  
  AI is becoming core to how we build products, operate the
  platform, and support our teams. To move from
  experimentation to real, measurable impact, we are building
  a central AI Enablement & Evaluation team — and we’re
  looking for a Senior AI Engineer to help turn AI into a
  reliable, scalable capability across the company.
  
  If you enjoy building AI systems that actually ship, scale,
  and deliver value — not just demos — this is your next ride
  🚕
  
  Your Mission
  
  As a Senior AI Engineer, you will sit at the intersection of
  AI engineering, evaluation, and enablement. Your role is to
  ensure that AI systems at FREENOW are production-ready,
  measurable, and safe, while accelerating adoption across
  product and engineering teams.
  
  You will help transform AI from isolated pilots into
  reusable platforms, tools, and workflows used across the
  organization.
  
  Your Daily Adventures Will Include
  
  - Designing, building, and maintaining production-grade AI
    systems using LLMs, agents, and retrieval-based
    architectures
  - Owning and evolving the AI Evaluation Framework, including:
  - Partnering with Product, Engineering, Legal, and Security to
    ensure AI solutions are compliant, observable, and
    trustworthy
  - Supporting and scaling internal AI products such as
    FreenowGPT and domain-specific AI assistants
  - Enabling teams through shared tooling, patterns, and best
    practices (e.g. Gemini enablement, prompt & agent
    patterns)
  - Building reusable AI components (RAG pipelines, agent
    orchestration, model access layers)
  - Helping define standards for agent-ready architecture (MCP
    integrations, model abstraction, permissions)
  - Monitoring AI system performance, cost, and reliability in
    production
  - Acting as a technical reference point for AI across squads —
    from experimentation to rollout
  
  Our AI & Tech Stack
  
  Python | LLM APIs (Gemini, OpenAI) | Retrieval-Augmented
  Generation (RAG) Databricks | Cloud Infrastructure | APIs &
  Backend Services Evaluation tooling | Observability &
  monitoring | Internal developer tooling
  
  (Exact tools matter less than strong engineering
  fundamentals — the stack will evolve.)
  
  To Be Successful in This Role
  
  - You have strong experience as an AI Engineer, ML Engineer,
    or Senior Software Engineer working with modern AI systems
  - You’ve built or operated LLM-based systems in production,
    not just prototypes
  - You understand the failure modes of LLMs (hallucinations,
    non-determinism, evaluation challenges)
  - You consistently balance speed, quality, and pragmatism;
    knowing when to ship, when to iterate, and when
    correctness is non-negotiable in production AI systems.
  - You are comfortable designing evaluation frameworks and
    defining quality metrics for AI behavior
  - You have solid backend engineering fundamentals (APIs,
    services, data access)
  - You enjoy working across teams and explaining complex AI
    concepts clearly
  - You care about reliability, safety, and real business
    impact, not hype
  - You are fluent in English
  
  Nice to Have
  
  - Experience with agentic systems or multi-step workflows
  - Familiarity with AI governance, risk, or compliance
    considerations (e.g. GDPR, EU AI Act)
  - Experience enabling other teams through platforms, SDKs, or
    internal tools
  - Prior work in marketplaces, mobility, or large-scale
    consumer products
  
  Why This Role Matters
  
  Most companies experiment with AI. Very few manage to scale
  it responsibly and profitably.
  
  This role is central to:
  
  - reducing AI risk in customer-facing systems (support,
    dispatch, booking),
  - unlocking company-wide productivity through internal AI
    products,
  - and building the technical foundations that allow FREENOW to
    move fast without breaking trust.
  
  You’ll help define how AI is built at FREENOW for years to
  come.
  
  BENEFITS & PERKS IN A NUTSHELL:
  
  - Flexible working arrangements
  
  - LinkedIn Learning
  
  - Sabbatical & special leave policies
  
  - WeRoad partnership
  
  - Birthday, 24th + 31st December off
  
  - Short term EU work policy
  
  - Mobility Credit
  
  - Health insurance
  
  - Employee assistance program
  
  Plus more local benefits depending on your work location!
  
  DIVERSITY, EQUITY & INCLUSION:
  
  Freenow is an equal opportunity employer and we consider
  qualified applicants regardless of race, religion, national
  origin, gender, gender identity, sexual orientation,
  disability or age. We want you to grow and evolve, bring
  your true self to work.
  
  ABOUT US:
  
  Freenow by Lyft empowers smarter mobility decisions, helping
  people to move freely and cities to thrive. Through our
  multi-mobility app, we feature broad options for everyone
  across 9 European markets and over 180 cities. Millions of
  passengers can access services including taxis, private hire
  vehicles, carsharing, car rental, e-scooters, e-bikes,
  e-mopeds, and public transport within a single app.
  
  In July 2025 Freenow was acquired by Lyft, a global mobility
  platform, which connects riders and drivers for billions of
  rides across North America and Europe. Together, Freenow and
  Lyft are creating a more caring and connected world, with
  transportation for everyone. We are a global, diverse,
  highly motivated, and collaborative team that strives for
  excellence and likes to have fun. Ready for your next ride?
