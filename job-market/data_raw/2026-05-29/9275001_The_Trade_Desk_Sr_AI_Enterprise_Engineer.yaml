description: |
  The Trade Desk is a global technology company and the
  world’s leading independent platform for digital
  advertising, with nearly 4,000 employees across more than 30
  offices. Our technology helps advertisers reach the right
  audiences across the open internet — from streaming TV and
  podcasts to mobile apps, news, and more.   Advertising
  powers the content people love. By making it more
  transparent, effective, and responsible, we help support
  trusted journalism, quality entertainment, and creators
  worldwide. The world’s brands and agencies rely on us to
  reach their customers and grow their businesses responsibly.
  The scale of our platform brings unique technical challenges
  — from processing massive datasets in real time to building
  systems that operate reliably on a global scale. When you
  work here, your impact is worldwide. We welcome diverse
  perspectives, encourage curiosity, and build teams that
  learn from one another. If you’re driven to solve meaningful
  challenges, we’d love to meet you.
  
  What we do
  
  You’ll join a business engineering team building internal AI
  solutions that support teams across The Trade Desk. We
  leverage large language models, retrieval‑augmented
  generation (RAG), agentic systems, and enterprise platforms
  like Microsoft Copilot and Anthropic Claude to improve
  productivity, streamline workflows, and reduce operational
  friction.
  
  Our team also plays a key role in AI enablement across the
  company—supporting teams as they adopt Copilot, Claude and
  similar tools, designing and deploying custom AI agents, and
  guiding partners through their AI journey from idea to
  impact.
  
  As a Sr AI Enterprise Engineer on this team, you’ll be an
  end-to-end owner—collaborating closely with stakeholders,
  identifying opportunities, and delivering tools that make a
  real impact. We’re a nimble, fast-paced, and highly
  collaborative group that thrives on transforming the way
  teams operate and driving greater value across The Trade
  Desk.
  
  What you’ll do:
  
  Some of the work that you will be doing to help us deliver
  on our mission is:
  
  - Design and deploy intelligent agentic systems that integrate
    large language models (LLMs) with enterprise data, tools,
    and workflows using frameworks like LangChain, LlamaIndex,
    and Semantic Kernel.
  - Contributring to Retrieval-Augmented Generation (RAG)
    applications using tools like Azure AI Search, vector
    databases, and secure enterprise connectors to deliver
    contextual insights.
  - Build and deploy agents using Microsoft Copilot, Copilot
    Studio, Anthropic Claude, and similar platforms to help
    teams operationalize solutions within enterprise
    guardrails.
  - Build and iterate on conversational agents that solve real-
    world problems, meet stakeholder needs, and deliver
    measurable business value.
  - Deliver high-impact features by collaborating across teams,
    leading through ambiguity, and aligning technical
    solutions with business goals.
  - Drive quality and performance through automated testing,
    monitoring, and data-driven evaluation of success
    criteria, user adoption, and operational efficiency.
  - Mentor teammates and contribute to a culture of innovation,
    technical excellence, and continuous learning.
  
  Who you are:
  
  - You have a Bachelor’s/Master’s level degree in computer
    science or relevant engineering-related field or
    equivalent experience.
  - You have 8-10+ years of software engineering experience,
    including 1-2+ years working on AI-powered systems or
    products.
  - You have knowledge of Python and comfortable with additional
    languages such as C#, SQL, or TypeScript/React.
  - You’re excited about AI enablement, including helping teams
    adopt platforms like Microsoft Copilot, Anthropic Claude
    and Copilot Studio, building agents, and guiding others
    through their AI journey.
  - You are skilled in data ingestion and transformation using
    APIs, ETL pipelines, and connectors, and familiar with
    vector databases and retrieval strategies.
  - You communicate clearly across technical and non-technical
    audiences and thrive in a collaborative, cross-functional
    environment.
  - You are a fast learner who adapts quickly to new
    technologies and solves complex problems with creativity
    and pragmatism.
  
  #LI-TP1
  
  A variety of technical opportunities is one of the best
  things about working at The Trade Desk as a software
  engineer, which is why we do not expect you to know every
  technology we use when you start. What we care about is that
  you can learn quickly and find solutions to complex problems
  using the optimum tools for the job. What you know is less
  important than how well you learn and innovate. We are not
  seeking engineers who know all the answers; we need
  engineers who can invent answers no one has thought of yet
  and find answers to the questions yet to be asked.
  
  The Trade Desk does not accept unsolicited resumes from
  search firm recruiters. Fees will not be paid in the event a
  candidate submitted by a recruiter without an agreement in
  place is hired; such resumes will be deemed the sole
  property of The Trade Desk. The Trade Desk is an equal
  opportunity employer. All aspects of employment will be
  based on merit, competence, performance, and business needs.
  We do not discriminate on the basis of race, color,
  religion, marital status, age, national origin, ancestry,
  physical or mental disability, medical condition, pregnancy,
  genetic information, gender, sexual orientation, gender
  identity or expression, veteran status, or any other status
  protected under federal, state, or local law.
  
  [LA JOBS ONLY] The Trade Desk will consider qualified
  applicants with criminal histories for employment in a
  manner consistent with the requirements of the Los Angeles
  Fair Chance Initiative for Hiring, Ordinance No. 184652.
  
  [SF JOBS ONLY] Pursuant to the San Francisco Fair Chance
  Ordinance, we will consider for employment qualified
  applicants with arrest and conviction records.
  
  #LI-TP1
  
