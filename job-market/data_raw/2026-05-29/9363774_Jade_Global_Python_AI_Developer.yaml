description: |
  Python + AI Developer2
  
  We are looking for a talented Developer with strong
  expertise in Python, modern web frameworks, and AI model
  integration. The ideal candidate will build and integrate
  scalable web applications with AI/ML components, ensuring
  seamless interaction between frontend, backend, and
  intelligent systems.
  
  
  Key Responsibilities:
  
  - Design, develop, and maintain end-to-end web applications
    using Python (Django/FastAPI/Flask).
  - Integrate AI and ML models (e.g., OpenAI, LangChain, Hugging
    Face, TensorFlow, PyTorch) into web applications and APIs.
  - Build and optimize RESTful  APIs for scalable data
    processing.
  - Work closely with data scientists and ML engineers to deploy
    and serve AI models in production.
  - Implement secure authentication, authorization, and data
    handling mechanisms.
  - Optimize applications for performance, scalability, and
    reliability.
  - Collaborate with DevOps teams to automate deployment and
    CI/CD workflows (Docker, Kubernetes, etc.).
  - Write clean, maintainable, and well-documented code
    following best practices.
  
  Required Skills & Experience:
  
  - Bachelor’s degree or higher in Computer Science or
    Engineering
  - 4 to 7 years of Strong experience in Python and one or more
    web frameworks (FastAPI, Django, or Flask).
  - Hands-on experience with AI/ML model integration and working
    with APIs from platforms like OpenAI, Anthropic, or
    Hugging Face.
  - Proficient in JavaScript/TypeScript.
  - Solid understanding of database technologies (PostgreSQL,
    MongoDB, or MySQL).
  - Experience with API design, testing, and documentation.
  - Familiarity with containerization and deployment tools
    (Docker, AWS, Azure, GCP, Kubernetes).
  - Strong problem-solving skills and ability to work in an
    agile, collaborative environment.
