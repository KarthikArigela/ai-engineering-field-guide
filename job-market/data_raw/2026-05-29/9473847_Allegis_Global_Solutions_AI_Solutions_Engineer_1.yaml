  sourcing and our Universal Workforce Model™.
  
  We also represent over 100 countries and speak dozens of
  languages. So as you’re building relationships and doing
  your job, you’ll be exposed to other cultures and
  advancement opportunities while expanding your knowledge of
  global markets and strategies.
  
  As a workplace, we focus on relationships – with each other,
  our clients and our candidates - in fact serving others is
  one of our core values. We support open communication and
  recognize that giving constructive criticism can be even
  harder than receiving it. We appreciate the fearless and the
  passionate, who force us to be better. Everything we do sits
  on a pillar of diversity - diverse perspectives, backgrounds
  and ideas drive innovation and make us successful.
  
