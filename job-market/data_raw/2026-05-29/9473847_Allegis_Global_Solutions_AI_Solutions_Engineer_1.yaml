  Company Description
  
  Working at Allegis Global Solutions (AGS) is more than just
  a job. It’s a career. It’s a community of people who invest
  in your development and empower you to blaze your own trail.
  Each of us is here to create real, measurable impact that
  moves needles. We operate beyond "roles" or "jobs" to
  realize the opportunity to make meaningful contributions to
  a bigger idea. Because we believe that when you build a
  workforce that’s designed to harness human enterprise, you
  design a workforce that’s built for impact.
  
  At AGS, we help companies all over the world transform their
  people into a competitive advantage. It’s not about filling
  seats. It’s about designing workforces to meet missions and
  unleash the most transformative power in business today: The
  power of human enterprise.
  
  With services around the globe, we have a point of view on
  the future of work that enables us to be a transformative
  partner in the way work gets done for our clients’
