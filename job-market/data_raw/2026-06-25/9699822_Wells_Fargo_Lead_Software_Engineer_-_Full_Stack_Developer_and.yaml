description: |
  About this role: Wells Fargo is seeking a Lead Software
  Engineer In this role, you will:
  
  - Lead complex technology initiatives including those that are
    companywide with broad impact
  - Act as a key participant in developing standards and
    companywide best practices for engineering complex and
    large scale technology solutions for technology
    engineering disciplines
  - Design, code, test, debug, and document for projects and
    programs
  - Review and analyze complex, large-scale technology solutions
    for tactical and strategic business objectives, enterprise
    technological environment, and technical challenges that
    require in-depth evaluation of multiple factors, including
    intangibles or unprecedented technical factors
  - Make decisions in developing standard and companywide best
    practices for engineering and technology solutions
    requiring understanding of industry best practices and new
    technologies, influencing and leading technology team to
    meet deliverables and drive new initiatives
  - Collaborate and consult with key technical experts, senior
    technology team, and external industry groups to resolve
    complex technical issues and achieve goals
  - Lead projects, teams, or serve as a peer mentor
  
  Required Qualifications:
  
  - 5+ years of Software Engineering experience, or equivalent
    demonstrated through one or a combination of the
    following: work experience, training, military experience,
    education
  
  Desired Qualifications:
  
  - Strong experience in Python (must have), FAST API/REST API
    Development
  - Experience building:Scalable, production-ready AI
    servicesModular and extensible architectures
  - Exposure to:Async processing, concurrency, performance
    tuningDeep expertise in non-relational databases
  - Hands-on experience with CI/CD pipelines (Azure DevOps,
    GitHub Actions, Harness, etc.)
  - Exposure to Gen AI technologies (LLMs, prompt engineering,
    API integration, AI-powered apps, context management,
    hallucination handling)
  - Design and implementation experience of End to end RAG
    pipelines, Semantic chunking, embeddings, vector DBs
    (PGVector, Pinecone, Qdrant, FAISS, etc.)
  - Google ADK / LangGraph / LangChain Agents, Multi-agent
    orchestration, Tool usage & function calling
  - Ability to build:Stateful workflowsMulti-step reasoning
    pipelinesAutonomous task execution systems
  - Strong understanding of microservices architecture, REST
    APIs, and distributed systems
  - Familiarity with containerization and orchestration (Docker,
    Kubernetes)
  - Solid understanding of modern frontend technologies (React,
    Angular, or similar)
  
  Job Expectations:
  
  - Proven ability to lead complex, cross-functional initiatives
  - Highly self-driven, ownership-oriented, and proactive
    problem solver
  - Strong collaboration and communication skills
  - Ability to work effectively as both a team player and
    technical leader
  - Experience mentoring engineers and influencing technical
    direction
  - Comfortable operating in ambiguous, fast-paced environments
  
