description: |
  About Wati
  
  Started as a WhatsApp team inbox in 2020, Wati has evolved
  into an AI-powered customer engagement platform that goes
  beyond a single channel. Designed for businesses that sell,
  support, and grow through conversations, Wati observes
  customer intent in real time, decides the next best revenue
  action, and executes it across marketing, sales, and support
  — on WhatsApp, Instagram, Facebook, TikTok, SMS, and more.
  
  Trusted by over 16,000 customers across 190+ countries, Wati
  simplifies complex operations and business conversations
  with a unified inbox, no-code automation, and our
  intelligent AI layer, Astra.
  
  Proudly backed by Tiger Global, Sequoia Capital, DST Global,
  and Shopify, and recognised as a Premium Partner of Meta and
  Google.
  
  Wati, the AI-Powered Customer Engagement Platform for
  Revenue Growth.
  
  About the role
  
  You will be the technical backbone of our mid-market
  customer journey — owning everything from go-live through
  expansion. Sitting in the CS org, you'll translate complex
  business workflows into live WhatsApp automations, API
  integrations, and AI agent deployments on Wati and Astra.
  Your work directly reduces churn, shortens time-to-value,
  and unlocks x-sell opportunities.
  
  What you'll do
  
  - Own technical onboarding and go-live for mid-market and
    Enterprise accounts
  - Design and deploy AI agents on Astra to automate customer
    workflows
  - Build and configure WhatsApp Business API integrations,
    webhooks, and chatbot flows
  - Integrate Wati with CRMs (HubSpot, Salesforce) and third-
    party platforms
  - Consult customers on AI strategy — identify automation
    opportunities and drive adoption
  - Partner with CSMs and AMs to surface expansion signals and
    upsell opportunities
  - Serve as escalation point for complex technical issues post-
    launch
  - Contribute to internal playbooks, integration templates, and
    reusable assets
  
  Requirements
  
  - 5+ years in solutions engineering, implementation, or
    technical CSM roles
  - Hands-on with REST APIs, webhooks, and integration patterns
  - Experience deploying or consulting on AI agents / LLM-
    powered workflows
  - Proficient with WhatsApp Business API or comparable
    messaging platforms
  - CRM integration experience — HubSpot or Salesforce preferred
  - Strong customer-facing communication; can translate
    technical complexity for business stakeholders
  - Self-directed; comfortable managing multiple mid-market
    accounts concurrently
industries:
