description: |
  Who We Are: Galaxy is a global leader in digital assets and
  data center infrastructure, delivering solutions that
  accelerate progress in finance and artificial intelligence.
  We believe that blockchain and digital asset innovation will
  transform how value moves through the world – and we’re
  building the products and services to make that future a
  reality.
  
  Our institutional digital assets platform spans trading,
  investment banking, asset management, staking, self-custody,
  and tokenization technology. We also invest in and operate
  cutting-edge data center infrastructure to power AI and
  high-performance computing, addressing the growing demand
  for scalable energy and compute in the U.S.
  
  We work at the intersection of finance and technology,
  helping institutions, startups, and developers navigate a
  digitally native economy. Led by CEO and Founder Michael
  Novogratz, our team blends deep crypto expertise with
  institutional experience and a shared commitment to shaping
  the future of Web3 and AI.
  
  Galaxy is headquartered in New York City, with offices
  across North America, Europe, the Middle East, and Asia.
  
  To learn more about our businesses and products, visit
  www.galaxy.com.
  
  What We Value:
  
  We are a diverse team of free thinkers, and fast movers
  united to help investors and creators energize the global
  economy. We are looking for individuals who thrive in a
  culture of builders and overachievers and embrace high
  performance, transparent feedback, and a mission-first
  approach. Our culture shapes our way of working and gets us
  where we want to be.
  
  - Seek Excellence.
  - Be Selective To Be Effective.
  - Be Highly Aligned, Loosely Coupled.
  - Disagree Transparently.
  - Encourage Independent Decision-Making.
  - Build Dream Teams.
  
  Who You Are:
  
  We are looking for a highly capable, adaptable, and
  proactive team member who can support the day-to-day
  management, rollout, and ongoing evolution of modern AI
  platforms and related technology initiatives across the
  organization.
  
  This role is ideal for someone who is comfortable operating
  across multiple domains. The right person will help manage
  enterprise AI tools, connectors, settings, access,
  governance, and API-related work, while also being ready to
  assist with broader IT, security, and AI engineering needs
  as priorities shift.
  
  This person should be organized, dependable, and willing to
  jump in where needed — whether that is helping evaluate new
  AI features, supporting connector setup and administration,
  assisting with cleanup and operational tasks, documenting
  processes, coordinating follow-ups, or contributing to
  technical and security-related initiatives.
  
  The ideal candidate is someone who can help bring more
  structure, follow-through, and proactive support to a fast-
  moving environment. They should be curious about emerging AI
  capabilities, comfortable learning new tools quickly, and
  able to translate requests into action independently.
  
  What You’ll Do:
  
  In this role, you will support the administration,
  coordination, and continuous improvement of a growing set of
  AI tools and related technical programs. Responsibilities
  may include:
  
  - Helping manage enterprise AI platforms, including
    configuration, access, settings, connectors, permissions,
    and operational support
  - Tracking and evaluating new features, releases,
    integrations, and connector capabilities across AI tools
    such as ChatGPT, Claude, Cursor, and related platforms
  - Supporting governance, risk review, and general oversight of
    AI tooling, including coordination with IT and security
    considerations
  - Assisting with API-related work, documentation, testing, and
    operational follow-up for AI-driven initiatives
  - Handling operational cleanup, organization, process follow-
    through, and general support tasks to improve efficiency
    and reduce manual overhead
  - Partnering on AI engineering efforts where needed, including
    testing, implementation support, and coordination of
    technical tasks
  - Providing support on adjacent IT and security work based on
    business needs and team priorities
  - Helping move work from reactive to proactive by identifying
    gaps, organizing next steps, and ensuring important items
    do not get missed
  - Taking ownership of assigned tasks and executing reliably
    across a wide range of responsibilities
  
  What We’re Looking For:
  
  - 4+ years experience working with enterprise technology
    tools, IT operations, security, or technical program
    coordination
  - Strong interest in AI platforms, emerging features,
    integrations, and real-world enterprise use cases
  - Ability to work across both strategic and operational tasks
  - A hands-on mindset with strong follow-through and attention
    to detail
  - Comfort working in a dynamic environment where priorities
    can change quickly
  - Strong communication, organization, and documentation skills
  - Willingness to take on a broad range of tasks and help
    wherever needed
  
  What We Offer:
  
  - Competitive base salary and discretionary bonus
  - Hybrid/Flexible Working Arrangements
  - Flexible Time Off (paid)
  - 3% 401(k) company contribution
  - Company-paid health and protective benefits for employees,
    partners, and other dependents
  - Generous paid Parental Leave
  - Competitive family planning benefits for US employees
  - Opportunities to learn about the Crypto industry
  - Smart, entrepreneurial, and fun colleagues
  - Free daily snacks and weekly breakfasts/lunches
  - Employee Resource Groups
  - Free coaching and counseling sessions through Headspace
  
  Apply now and join us on our mission to engineer a new
  economic paradigm.
  
  The base salary ranges included below will be commensurate
  with candidate experience, expertise and local market. Final
  offer amounts are determined by multiple factors, including
  candidate experience and expertise. At Galaxy, we maintain a
  total compensation philosophy which consists of a
  competitive base salary, annual bonus, and equity
  incentives.
  
  Base Salary Range
  
  $100,000—$125,000 USD
  
  Galaxy respects diversity and seeks to provide equal
  employment opportunities to all employees and job applicants
  for employment without regard to actual or perceived age,
  race, color, creed, religion, sex or gender (including
  pregnancy, childbirth, lactation and related medical
  conditions), gender identity or gender expression (including
  transgender status), sexual orientation, marital or
  partnership or caregiver status, ancestry, national origin,
  citizenship status, disability, military or veteran status,
  protected medical condition as defined by applicable state
  or local law, genetic information or predisposing genetic
  characteristic, or other characteristic protected by
  applicable federal, state, or local laws and ordinances.
  
  We will endeavor to make a reasonable accommodation to the
  known limitations of a qualified applicant with a disability
  unless the accommodation would impose an undue hardship on
  the operation of our business. If you believe you require
  such assistance to complete the application process or to
  participate in an interview, please contact
  careers@galaxy.com.
