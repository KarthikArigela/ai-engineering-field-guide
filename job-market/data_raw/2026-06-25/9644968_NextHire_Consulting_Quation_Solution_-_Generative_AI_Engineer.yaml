description: |
  Job Title: Generative AI Engineer
  
  Location: ITPL, Whitefield, Bangalore
  
  Experience: 5+ Years
  
  Job Description:
  
  We are seeking an experienced Generative AI Engineerto join
  our team and drive innovation in AI-driven solutions. The
  ideal candidate will have a strong background in machine
  learning, deep learning, and generative models, with a
  proven track record of building and deploying AI systems at
  scale.
  
  Key Responsibilities:
  
  - Design, develop, and deploy cutting-edge Generative AI
    models (e.g., GANs, VAEs, Diffusion Models, LLMs) for
    various applications.
  - Optimize and fine-tune large-scale deep learning models to
    enhance performance, efficiency, and scalability.
  - Work with transformer-based architectures (GPT, BERT, T5,
    LLaMA, etc.) to create state-of-the-art AI solutions.
  - Develop pipelines for data preprocessing, model training,
    evaluation, and deployment.
  - Stay up-to-date with the latest research in generative AI
    and implement innovative techniques.
  - Collaborate with cross-functional teams, including Data
    Scientists, ML Engineers, and Product Managers, to
    integrate AI capabilities into products.
  - Ensure models adhere to ethical AI principles, including
    bias mitigation, explainability, and fairness.
  - Write and maintain technical documentation, research papers,
    and patents as needed.
  
  Required Skills & Qualifications:
  
  - 5+ years of hands-on experience in machine learning, deep
    learning, or AI development.
  - Strong expertise in Python and deep learning frameworks such
    as TensorFlow, PyTorch, JAX.
  - Experience with NLP, computer vision, multimodal AI, and
    foundation models.
  - Proficiency in generative AI techniques, including diffusion
    models, GANs, VAEs, transformers, and reinforcement
    learning.
  - Experience deploying models in cloud environments (AWS, GCP,
    Azure) and using MLOps tools.
  - Knowledge of vector databases, prompt engineering, fine-
    tuning LLMs, and retrieval-augmented generation (RAG).
  - Familiarity with Hugging Face, LangChain, OpenAI, Stability
    AI, or similar frameworks.
  - Strong problem-solving skills and ability to work in a fast-
    paced environment.
  
  Preferred Qualifications:
  
  - Master’s or PhD in Computer Science, AI, Machine Learning,
    Statistics, or related fields.
  - Experience with real-time AI applications, personalization
    engines, or AI-driven content generation.
  - Contributions to open-source AI projects or publications in
    top-tier AI conferences (NeurIPS, ICML, CVPR, ACL, etc.).
  - Experience in reinforcement learning, multi-agent systems,
    or generative agents.
  
  Why Join Us?
  
  - Opportunity to work on cutting-edge AI projects with state-
    of-the-art models.
  - Collaborative and dynamic work environment with AI experts
    and industry leaders.
  - Competitive compensation, stock options, and benefits.
  - Continuous learning opportunities and access to top AI
    conferences & workshops.
  
  If you are passionate about pushing the boundaries of
  Generative AI and want to make a meaningful impact, apply
  now!
