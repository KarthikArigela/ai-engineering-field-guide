description: |
  OpenGov is the leader in AI and ERP solutions for local and
  state governments in the U.S. More than 2,000 cities,
  counties, state agencies, school districts, and special
  districts rely on the OpenGov Public Service Platform to
  operate efficiently, adapt to change, and strengthen the
  public trust. Category-leading products include enterprise
  asset management, procurement and contract management,
  accounting and budgeting, billing and revenue management,
  permitting and licensing, and transparency and open data.
  These solutions come together in the OpenGov ERP, allowing
  public sector organizations to focus on priorities and
  deliver maximum ROI with every dollar and decision in sync.
  Learn about OpenGov’s mission to power more effective and
  accountable government and the vision of high-performance
  government for every community at OpenGov.com.
  
  Job Summary
  
  OpenGov’s Professional Services (PS) team is expanding its
  AI capabilities to accelerate product implementations,
  streamline customer workflows, and deliver transformative
  efficiencies to state and local governments.
  
  As a 'AI Developer - Implematation’, you will split your
  time between:
  
  - Building AI agents, tools, automations, and reusable PS
    assets, and
  - Partnering directly with implementation teams and customers
    to configure, deploy, and optimize AI-driven workflows
  
  This role is ideal for a technical builder who is equally
  comfortable writing code, understanding government business
  processes, collaborating cross-functionally, and supporting
  delivery teams with AI and integration expertise. You will
  help define OpenGov’s standards for AI-enabled
  implementations and shape how our PS organization scales
  using AI-first practices.
  
  
  
  Key Responsibilities
  
  AI Capabilities & Agent Development
  
  - Design, build, test, and deploy AI agents, automations,
    prompts, retrieval systems, and workflow utilities that
    accelerate implementation timelines and reduce manual
    effort.
  - Apply modern agent architectures and orchestration
    frameworks (e.g., LangGraph, MCPs, LlamaIndex, CrewAI) to
    deliver reliable, production-grade solutions.
  - Implement guardrails, evaluation frameworks, observability,
    and versioning to ensure safe, consistent, auditable agent
    performance.
  - Maintain reusable libraries, templates, and modules that PS
    consultants can configure independently.
  
  Inter Suite Operability and Integrations
  
  - Serve as the technical owner responsible for designing,
    building, testing, and deploying robust integrations
    between our product suites and/or customer owned / third-
    party enterprise systems. The ultimate goal is to optimize
    complex end-to-end business workflows and maximize
    operational efficiency for the customer.
  - Select, implement, and maintain the most appropriate and
    high-performing integration patterns (like API Driven,
    Event Driven, File Based, Batch Triggers etc) based on
    data volume, velocity, and customer infrastructure
    limitations
  - Ensure all implemented integration points adhere to strict
    enterprise security standards and maintain high
    performance and low latency.
  - Proactively identify common integration requirements across
    multiple implementations (e.g., common ERP connectors,
    standard transformation logic); design, create, and
    rigorously maintain high-quality, reusable code artifacts
    and integration templates.
  - Build these reusable assets to be configurable, allowing
    Professional Services consultants to deploy them for new
    clients with no-to-minimal customization.
  - Produce comprehensive technical documentation, including
    data flow diagrams, integration specifications, and
    deployment guides for all integration patterns, ensuring
    the knowledge is easily transferable and maintainable by
    the wider PS team.
  
  Embedded Delivery Support
  
  - Serve as an embedded AI specialist within active customer
    implementations, partnering with Project Managers,
    Implementation Analysts and Data Solution Engineers to
    design AI-driven processes.
  - Translate business workflows into automated AI solutions.
  - Configure AI-enhanced features within OpenGov products based
    on customer requirements, data, and local/state government
    context.
  - Troubleshoot and optimize agent behavior for real-world
    customer scenarios.
  
  Workflow Optimization & Scale
  
  - Identify patterns in implementation activities where AI can
    reduce effort, accelerate delivery, or improve quality.
  - Build internal tools that improve implementation
    repeatability, cross-team collaboration, and operational
    scalability.
  - Analyze logs, data flows, and performance metrics to
    iteratively improve reliability and efficiency.
  
  Cross-Functional Collaboration & Evangelism
  
  - Work closely with R&D, Data Engineering, Customer Success,
    Field Enablement, and Product Management to align AI
    capabilities with broader OpenGov strategy.
  - Provide product feedback based on customer interactions and
    implementation learnings.
  - Enable PS colleagues through documentation, training, and
    best-practice AI usage guidelines.
  - Help customers understand the value of AI features and drive
    adoption of new capabilities.
  
  Project & Delivery Management
  
  - Contribute technical effort estimates and assist with
    implementation planning where AI components are required.
  - Manage work across multiple concurrent engagements while
    maintaining high standards of quality and responsiveness.
  - Ensure timely delivery of AI components within broader PS
    project timelines.
  
  Required Qualifications
  
  - 3+ years experience designing or implementing AI-driven
    solutions for automation, workflow optimization, or data-
    driven insights.
  - 1+ years hands-on experience building AI agents or
    orchestration workflows using modern frameworks and model
    APIs.
  - 2+ years of hands-on experience in enterprise application
    integration (EAI) in a Professional Services or consulting
    setting.
  - Strong proficiency with LLM prompt engineering,
    retrieval/RAG architectures, vector stores, evaluation
    methods, and safety/guardrail patterns.
  - Working knowledge of AI tools and standards such as MCP-
    based architectures, LangChain/LangGraph, LlamaIndex, or
    similar.
  - Experience integrating third-party AI APIs and embedding LLM
    outputs into larger application workflows.
  - Technical fluency in at least one programming language like
    Python, JavaScript or Java with ability to write
    maintainable, modular code.
  - Proficiency in designing and developing integrations using
    REST / SOAP APIs, File Based data exchanges, Event Based
    triggers (Webhook, Kafka etc) and protocols. Strong
    understanding of security standards (e.g., OAuth 2.0,
    JWT), and API documentation tools (e.g., Swagger/OpenAPI).
  - Ability to map complex business processes into structured
    workflows and automated solutions.
  - Proven success working in fast-paced, iterative environments
    with cross-functional stakeholders.
  - Exceptional written and verbal communication skills; ability
    to explain AI concepts to non-technical audiences.
  - Strong analytical thinking with systems, data, and process-
    improvement mindset.
  
  Preferred Qualifications
  
  - Experience in GovTech, public-sector workflows, budgeting,
    permitting, procurement, or financial management.
  - Familiarity with responsible AI practices, privacy
    considerations, and compliance requirements applicable to
    government customers.
  - Background in Professional Services, consulting, or
    customer-facing technical roles.
  - Experience building reusable tooling or platform
    capabilities for services teams.
  
  Success Metrics (Examples)
  
  Within 6–12 months, success may include:
  
  - Reduction of implementation hours by 20–40% through AI
    tooling and workflow improvements.
  - Delivery of 3–5 reusable AI modules, integrations or
    templates adopted across PS engagements.
  - Demonstrated improvement in agent reliability through
    evaluation scores, logs, and documented refinements.
  - Positive impact on implementation timelines, customer
    satisfaction, and cross-team efficiency.
  - Increased adoption of AI features across customer
    implementations.
  
  Why Join OpenGov Professional Services
  
  You will be on the front line of transforming how
  governments deploy technology by embedding AI deeply into
  their operational workflows. As part of our PS team, you
  will:
  
  - Shape the future of AI-enabled implementations at scale.
  - Work with a mission-driven team focused on real-world
    government impact.
  - Build modern AI capabilities while seeing them applied
    directly to customer transformation.
  - Influence product direction, implementation design, and the
    evolution of OpenGov’s AI-first services model.
  
  Why OpenGov?
  
  A Mission That Matters.
  
  At OpenGov, public service is personal. We are passionate
  about our mission to power more effective and accountable
  government. Government that operates efficiently, adapts to
  change, and strengthens public trust.  Some people say this
  is boring.  We think it’s the core of our democracy.
  
  Opportunity to Innovate
  
  The next great wave of innovation is unfolding with AI, and
  it will impact everything—from the way we work to the way
  governments interact with their residents. Join a trusted
  team with the passion, technology, and expertise to drive
  innovation and bring AI to local government. We’ve touched
  2,000 communities so far, and we’re just getting started.
  
  A Team of Passionate, Driven People
  
  This isn’t your typical 9-to-5 job; we operate in a fast-
  paced, results-driven environment where impact matters more
  than simply clocking in and out. Our global team of 800+
  employees is united in our commitment to challenge the
  status quo. OpenGov is headquartered in San Francisco and
  has offices in Atlanta, Boston, Chicago, Dubuque, Dallas,
  and Pune.
  
  A Place to Make Your Mark
  
  We pride ourselves on our performance-based culture, where
  every employee is encouraged to jump in head-first and take
  action to help us improve. If you have a great idea, we want
  to hear it. Excellent performance is recognized and
  rewarded, and we love to promote from within.
  
  Benefits That Work for You
  
  Enjoy an award-winning workplace with the benefits to match,
  including:
  
  - Comprehensive healthcare options for individuals and
    families
  - Flexible vacation policy and paid company holidays
  - 401(k) with company match
  - Paid parental leave, wellness stipends, and HSA
    contributions
  - Professional development and growth opportunities
  - A collaborative office environment with weekly catered
    lunches.
