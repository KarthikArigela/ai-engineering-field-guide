description: |
  About OUTFRONT
  
  We are one of North America’s most innovative media
  companies.  We leverage the power of creative excellence,
  unbeatable locations and smart audience data to change the
  game for advertisers.  Our purpose as a company is to help
  people, places and businesses grow stronger.  To do this, we
  make meaningful connections between brands and people when
  they are outside of their homes through one of the largest
  and most diverse sets of out-of-home assets including
  billboards, transit and mobile displays across the U.S.  We
  connect diverse audiences across over 150 markets and
  conduct our business considering all our stakeholders, from
  clients and employees, to the communities where we operate.
  We are committed to creating a diverse and inclusive work
  environment that promotes the growth of our people.  Come
  join our industry-leading team!
  
  What We Offer
  
  OUTFRONT offers a comprehensive benefits program including:
  
  - Medical, Dental, Vision (including same and opposite-sex
    domestic partners)
  - HSA and FSA plans, Family Benefits, Pet Benefits
  - 401(k) Plan with an Employer Match
  - Paid Time Off, Commuter Benefits, Educational Assistance
  - Robust Diversity, Equity and Inclusion program including 7
    Employee Resource Groups (ERGs)
  
  About the Role
  
  OUTFRONT runs on a lot of email chains, spreadsheets, and
  tribal knowledge. We're hiring a Senior AI Automation
  Engineer to change that. You'll embed with teams across
  Finance, Real Estate, HR, Sales Ops, Legal, and Marketing,
  find the workflows that are slow and broken, and ship the
  automations and AI agents that fix them. You'll move fast,
  ship in weeks, and own what you build.
  
  This is a senior engineering role where picking the right
  tool for each problem is half the job. We use Microsoft's
  Power Platform (Copilot Studio, Power Apps, Power Automate,
  Dataverse) for personal-productivity workflows that live
  inside the M365 surface. We use AWS (Bedrock, AgentCore,
  Lambda, Step Functions) when problems require autonomous
  agents, system data, or capabilities that don't fit the M365
  envelope. The hard part of the job, and the part we're
  hiring for, is knowing which is which.
  
  You'll also contribute to OUTGPT, our internal AI platform
  built on the Vercel AI SDK and AWS Bedrock. You won't own it
  (the Lead AI Platform Engineer does), but you'll build
  features, integrations, and agents on top of it as your work
  demands.
  
  What You'll Work On
  
  - Embedded automation delivery. Sit with business teams. Find
    the highest-impact manual processes. Design and ship
    automations that run in production. Measure the time
    saved.
  - Agent building. Design and ship AI agents in Copilot Studio
    for M365-native use cases (document summarization,
    intelligent routing, natural-language querying of
    SharePoint and Teams content) and in Bedrock when the
    workflow needs autonomous behavior or system data.
  - OUTGPT contributions. Build agents, integrations, and
    capabilities into our internal AI platform. Add value
    where it makes OUTGPT more useful for the business teams
    you serve.
  - Integration work. Stand up the connections that automations
    depend on: REST APIs, webhooks, OAuth flows, Snowflake
    queries, Salesforce reads, Power Platform connectors. When
    connectors don't exist, build them.
  - Tool selection. Evaluate the right tool for each problem.
    Document the call. Know when not to build is the right
    answer.
  - Mentorship. Pair with our AI Automation Engineer (a more
    junior teammate) and our intern. Raise their ceiling.
  
  What We're Looking For
  
  - 5+ years building production software, with a strong track
    record of delivering end-to-end solutions that real users
    depend on. Full-stack background preferred.
  - You've shipped multiple LLM-backed systems to production
    users and learned where they break. Prototypes don't
    count.
  - Practical AWS experience, particularly in serverless and AI
    services (Lambda, Step Functions, Bedrock). Comfort with
    IAM, RDS, and the surface area required to deploy AI
    workloads safely.
  - Experience with Microsoft Power Platform (Copilot Studio,
    Power Apps, Power Automate, Dataverse), or strong
    Microsoft 365 development background with a clear ramp
    into Power Platform.
  - Strong API integration skills. REST, webhooks, OAuth, JSON.
    You've connected disparate systems and you know where the
    failure modes live.
  - Proficiency in Python, TypeScript/Node, or both. Comfort
    with SQL.
  - You can sit with a non-technical business partner, listen to
    a fuzzy problem, and walk away with a concrete plan you
    can ship in two weeks. Communication and judgment matter
    as much as the code.
  - Bachelor's degree in a technical field, or a portfolio of
    delivered solutions that speaks for itself.
  
  Nice to Have
  
  - Experience in advertising technology, particularly OOH or
    DOOH.
  - Familiarity with Snowflake, Sigma, or modern analytics
    stacks.
  - Experience with the Vercel AI SDK or Next.js.
  - Familiarity with MCP, A2A, or other agent frameworks.
  - Experience with Salesforce development or integration.
  
  Tech Stack You'll Touch
  
  Microsoft (Copilot Studio, Power Apps, Power Automate,
  Dataverse, M365), AWS (Bedrock, AgentCore, Lambda, Step
  Functions, RDS), TypeScript/Node, Python, Vercel AI SDK,
  Next.js, PostgreSQL, Snowflake, Salesforce, Sigma,
  Bitbucket, Kiro, Claude Code.
  
  Reporting and Team
  
  Reports to the VP of AI. Works alongside the Lead AI
  Platform Engineer (your platform partner), a Solutions
  Engineer, and an intern.
  
  For New York, New Jersey, and California, the salary range
  for this role is $150,000-$185,000 per year.  Compensation
  is determined during our interview process by assessing a
  candidate’s experience and skills relative to internal peers
  and market benchmarks evaluated for the scope and
  responsibilities of the position.  Please note that the
  foregoing compensation information is a good-faith
  assessment associated with this position only and is
  provided pursuant to the corresponding Salary Transparency
  Laws.
  
