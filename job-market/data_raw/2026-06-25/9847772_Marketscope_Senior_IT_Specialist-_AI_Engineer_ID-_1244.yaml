  • Frameworks: LangChain,
  
  • APIs & Backend: FastAPI, Flask, REST API design.
  
  • Databases: Vector databases (Milvus, PGVector),
  PostGRESQL.
  
  • Cloud & MLOps: Azure AI Foundry; Docker, Kubernetes, CI/CD
  pipelines.
  
