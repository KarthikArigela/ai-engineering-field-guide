title: Senior Applied AI Engineer
company: Omada Health
location: USA
remote: true
work_type: FULL_TIME
description: |
  Omada Health is on a mission to bend the curve of chronic
  disease.
  
  Job overview:
  
  Omada Health is a digital care provider that empowers
  individuals to reach their health goals through sustainable
  behavioral change. Exceptional software with targeted AI
  applications is essential for delivering effective care at a
  broad scale. As a Senior AI Engineer at Omada, you will lead
  the deployment of sophisticated AI models and applications
  using state-of-the-art tools and platforms. This is a
  critical role that combines deep technical expertise with a
  practical understanding of applying AI in impactful ways.
  
  About you:
  
  - 5+ years of experience deploying AI models with demonstrated
    business impact.
  - Proven track record of designing, deploying, and managing
    end-to-end AI solutions, with a particular emphasis on
    Generative AI, prompt engineering techniques, and fine
    tuning.
  - Deep Expertise in utilizing tools for Generative AI
    interaction (OpenAI, Bedrock, Huggingface TGI, Ollama,
    langchain, llamaindex)
  - Expertise in machine learning tools (e.g., AWS SageMaker,
    PyTorch, Hugging Face)
  - General experience in cloud ML platforms (AWS, Azure, GCP),
    especially with their ML services (Sagemaker and Azure ML)
  - Successful monitoring of model performance post-deployment,
    with an ability to link AI solutions to tangible business
    impacts.
  - Strong capability for cross-team collaboration, working
    seamlessly with stakeholders across functional areas to
    deploy AI solutions that meet broader business needs.
  - A natural problem-solver, comfortable with navigating
    ambiguity and making decisions in complex environments.
  - A lifelong learner, continuously seeking to stay updated on
    new technologies and methodologies in the fast-evolving AI
    landscape.
  - Familiarity with Agile methodologies, demonstrating
    effectiveness in a fast-paced, iterative development
    environment.
  - BA/BS in Computer Science or a related technical field or
    equivalent practical experience
  - Interest in the intersection of healthcare and AI
  
  Your impact:
  
  Design and Development: Lead the creation of AI solutions
  specifically harnessing the power of LLMs. Play a pivotal
  role in influencing business outcomes by deploying new
  solutions, working closely with product and business
  collaborators.
  
  Deployment and Impact: Work with industry-standard LLM APIs
  to inject cutting-edge AI functionalities into broader
  applications using your experience with cloud platforms like
  AWS and Azure.
  
  Performance Monitoring: Create models that drive business
  outcomes and make iterative improvements based on data-
  driven insights. Ensure deployed models operate at peak
  efficiency, requiring a vigilant approach to performance
  monitoring and adjustment.
  
  Agile Collaboration: Deploy models within an Agile
  development framework, showcasing flexibility, rapid
  iteration, and a commitment to constant improvement.
  Proactively collaborate within the Applied AI team and
  cross-functionally with other development teams, product and
  business stakeholders to iterate on ideas, solve problems,
  and achieve shared goals.
  
  Benefits:
  
  - Competitive salary with generous annual cash bonus
  - Equity grants
  - Remote first work from home culture
  - Flexible Time Off to help you rest, recharge, and connect
    with loved ones
  - Generous parental leave
  - Health, dental, and vision insurance (and above market
    employer contributions)
  - 401k retirement savings plan
  - Lifestyle Spending Account (LSA)
  - Mental Health Support Solutions
  - ...and more!
  
  It takes a village to change health care. As we build
  together toward our mission, we strive to embody the
  following values in our day-to-day work. We hope these hold
  meaning for you as well as you consider Omada!
  
  - Cultivate Trust. We listen closely and we operate with
    kindness. We provide respectful and candid feedback to
    each other.
  - Seek Context. We ask to understand and we build connections.
    We do our research up front to move faster down the road.
  - Act Boldly. We innovate daily to solve problems, improve
    processes, and find new opportunities for our members and
    customers.
  - Deliver Results. We reward impact above output. We set a
    high bar, we’re not afraid to fail, and we take pride in
    our work.
  - Succeed Together. We prioritize Omada’s progress above team
    or individual. We have fun as we get stuff done, and we
    celebrate together.
  - Remember Why We’re Here. We push through the challenges of
    changing health care because we know the destination is
    worth it.
  
  About Omada Health: Omada Health (Nasdaq: OMDA) is reverse
  engineering the way healthcare is delivered in America,
  putting the space between doctor visits–where health is won
  or lost–at the center of care. Today's healthcare system
  poorly serves chronic conditions that require ongoing
  support outside of the exam room, like obesity, diabetes,
  hypertension, cholesterol, and musculoskeletal conditions.
  Omada’s virtual-first model combines human-led care teams,
  connected devices, and AI-enabled technology to deliver
  personalized care at scale, including support for GLP-1
  therapy. Omada has served more than two million members
  since launch across 2,000+ employers, health plans, pharmacy
  benefit managers, and health systems. Learn more at
  omadahealth.com.
  
