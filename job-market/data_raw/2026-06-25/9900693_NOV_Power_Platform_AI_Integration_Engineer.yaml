description: |
  We are hiring for a Power Platform Engineer to design,
  develop, and support a Quality Management System (QMS) using
  Microsoft Power Apps, Power Automate, SharePoint, and Power
  BI. The role will work closely with Quality, Manufacturing,
  and IT teams to digitalize QMS processes and drive
  compliance, traceability, and continuous improvement.
  
  Responsibilities
  
  - Design, develop, and support a Quality Management System
    (QMS) using Microsoft Power Platform technologies,
    including Power Apps, Power Automate, SharePoint, and
    Power BI.
  - Build and maintain Canvas and Model-driven Power Apps to
    support core QMS processes.
  - Develop automated workflows using Power Automate for
    approvals, escalations, alerts, and notifications.
  - Create Power BI dashboards and reports to track quality KPIs
    and support data-driven decision-making.
  - Digitalize and streamline quality processes such as Non-
    Conformance Reports (NCR), Corrective and Preventive
    Actions (CAPA), audits, document control, change
    management, and training.
  - Design and manage SharePoint Online lists, libraries,
    metadata structures, and permissions to support secure and
    efficient information management.
  - Ensure solutions align with ISO 9001 and other applicable
    quality and compliance standards.
  - Identify opportunities to automate manual quality processes
    and improve operational efficiency, traceability, and
    compliance.
  - Collaborate closely with Quality, Manufacturing, and IT
    teams to understand business requirements and deliver
    effective digital solutions.
  - Support continuous improvement initiatives by enhancing
    system usability, reporting, and process effectiveness.
  
  Requirements
  
  - Bachelor’s degree in engineering, Computer Science,
    Information Technology, or a related field.
  - 3–7 years of relevant experience, with flexibility based on
    depth of technical and functional expertise.
  - Strong hands-on experience with Microsoft Power Apps and
    Power Automate.
  - Experience with SharePoint Online and Power BI.
  - Good understanding of data modelling, reporting, and
    analytics
  - Hands-on experience working with Quality Management Systems
    (QMS)
  - Strong knowledge of quality processes such as NCR, CAPA,
    audits, and document control.
  - Familiarity with ISO 9001 or other similar quality standards
  - Understanding of manufacturing processes; experience in
    manufacturing or industrial environments is an advantage.
  - Strong collaboration and communication skills, with the
    ability to work effectively across cross-functional teams.
  - Quality certifications are an added advantage.
  
