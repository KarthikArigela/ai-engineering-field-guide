title: Software Engineer - AI
company: Uplimit
location: USA
work_type: FULL_TIME
description: |
  A billion jobs will be reshaped by AI. The way we learn and
  reskill must evolve just as fast. Uplimit is an AI-native
  learning platform built from the ground up to power
  continuous learning with generative AI — where every piece
  of content, feedback loop, and learning experience is
  created, adapted, and delivered by AI.
  
  We’re rethinking education from first principles — from
  course creation and assessment to motivation and mastery —
  using LLMs, fine-tuned models, and dynamic orchestration
  systems. As an AI Engineer, you’ll design and ship the
  intelligence layer behind the product.
  
  Responsibilities 👩🏽‍💻👨‍💻
  
  - Build and ship LLM-powered systems that drive learning:
    adaptive content generation, evaluators, tutors,
    motivation engines, and analytics.
  - Design and maintain AI pipelines for prompt orchestration,
    retrieval-augmented generation (RAG), embeddings, fine-
    tuning, and evaluation.
  - Prototype, evaluate, and productionize models for diverse
    modalities — text, code, and data tasks — optimizing for
    accuracy, latency, and cost.
  - Work on features like AI tutors, automated course creation,
    practice engines, and personalized learning journeys.
  - Define best practices for AI safety, evaluation,
    observability, and feedback loops within the product.
  - Collaborate with product, design, and full-stack teams to
    turn raw AI capabilities into elegant user experiences.
  - Continuously measure and improve system performance using
    real learner outcomes and engagement data.
  
  Background 🔰
  
  - Proven experience building and shipping AI or ML products
    (preferably LLM-based).
  - Deep understanding of modern ML stacks — model APIs, vector
    databases, prompt/runtime design, evaluation frameworks.
  - Strong coding skills in Python, Go, TypeScript, or similar.
  - Familiarity with cloud infrastructure (GCP/AWS), CI/CD for
    ML systems, and data pipeline design.
  - Ability to translate model capabilities into real user
    impact — pragmatic, fast, and experimental mindset.
  - Comfort working across the full lifecycle: research,
    prototyping, deployment, monitoring, iteration.
  - Strong communication and collaboration skills across
    disciplines.
  
  Why Uplimit?
  
  You’ll help define how AI teaches, guides, and evaluates
  human learning — at scale. You’ll work with engineers and
  educators who care about building a future where AI doesn’t
  just automate, but amplifies human potential. You’ll ship
  fast, experiment responsibly, and leave a mark on how the
  world learns.
  
  Details 📍
  
  - Location: San Mateo, CA (hybrid). Remote across US & Canada
    considered.
  - Compensation: Base salary between $120,000 – $190,000,
    depending on experience, plus equity and full benefits.
  - Equal Opportunity: We welcome applicants from all
    backgrounds and experiences.
