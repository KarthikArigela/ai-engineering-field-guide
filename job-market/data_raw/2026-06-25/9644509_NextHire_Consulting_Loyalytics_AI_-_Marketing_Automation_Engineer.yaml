title: Loyalytics AI - Marketing Automation Engineer
company: NextHire Consulting
location: Bengaluru, IND
work_type: FULL_TIME
company_size: 100 Employees
description: |
  Job Summary
  
  As a Marketing Automation Engineer, you are passionate about
  engineering scalable, data-driven marketing automation
  solutions that deliver personalised customer experiences
  across the full life-cycle. You will work within a highly
  cross-functional environment, partnering with marketing,
  analytics, and product teams to design and implement CRM
  programs that drive engagement, retention, and revenue. You
  bring deep hands-on expertise in enterprise CRM
  platforms—particularly Salesforce Marketing Cloud—and thrive
  at the intersection of technical architecture and marketing
  strategy. You understand that trust is built through
  relevant, timely, and compliant communications, and you
  leverage data to make every interaction meaningful. You are
  excited by the challenge of building scalable systems that
  operate across global audiences. Responsibilities
  
  - Design, develop, and maintain complex email and SMS
    marketing programs in Salesforce Marketing Cloud (SFMC),
    leveraging Journey Builder, Automation Studio, AMPscript,
    and SSJS to deliver personalised, triggered communications
    at scale.
  - Architect and manage data extensions, data flows, and
    integration pipelines between SFMC and upstream CRM and
    data systems including Salesforce CRM, CDP platforms, and
    third-party data sources.
  - Partner with marketing, analytics, and product teams to
    translate campaign requirements into scalable technical
    solutions, ensuring alignment across all communication
    touch points.
  - Build and maintain reusable AMPscript and SSJS libraries,
    dynamic content blocks, and shared data frameworks to
    accelerate campaign velocity and enforce governance
    standards.
  - Develop REST and SOAP API integrations to synchronise
    subscriber data, trigger transactional sends, and enable
    real-time personalization across channels.
  - Implement and enforce CRM governance practices including
    data quality standards, suppression list management,
    permission-based marketing
  - compliance (CAN-SPAM, GDPR, CASL), and audit logging.
  - Collaborate with QA and delivery teams to establish pre-send
    validation workflows, ensuring content accuracy, link
    integrity, personalization correctness, and regulatory
    compliance before every deployment.
  - Define and maintain a roadmap for CRM platform enhancements,
    new channel integrations, and automation capabilities
    aligned to business growth objectives.
  - Monitor and analyze campaign performance metrics—open rates,
    click rates, conversion, deliverability—and use insights
    to drive continuous optimisation of programs and
    infrastructure.
  
  Education & Experience Recommended
  
  - Bachelor's degree in Computer Science, Information Systems,
    Marketing Technology, or a related field
  - MBA or advanced business degree a plus
  - 5+ years of hands-on experience with enterprise CRM
    platforms, preferably Salesforce Marketing Cloud
  
  Preferred Certifications Salesforce Marketing Cloud
  certifications (Email Specialist, Developer, Consultant)
  strongly preferred Knowledge & Skills
  
  - Deep expertise in Salesforce Marketing Cloud: Journey
    Builder, Email Studio, Automation Studio, MobileConnect,
    and Audience Builder
  - Advanced proficiency in AMPscript and SSJS for dynamic
    content rendering, data lookups, and real-time
    personalization logic
  - Strong working knowledge of REST and SOAP APIs for CRM
    integrations, transactional sends, and subscriber data
    synchronisation
  - Experience designing relational data extension schemas,
    segmentation queries, and SQL-based audience filters
    within SFMC
  - Solid understanding of email deliverability principles
    including IP warming, sender authentication (SPF, DKIM,
    DMARC), and ISP engagement signals
  - Familiarity with CRM data privacy regulations (GDPR, CAN-
    SPAM, CASL) and how they shape data architecture and
    campaign execution
  - Experience with CDP or data lake integrations feeding CRM
    activation layers
  - Strong analytical skills with the ability to interpret
    campaign performance data and translate findings into
    platform or strategy improvements
  - Excellent cross-functional communication skills with the
    ability to bridge marketing strategy and technical
    implementation
  - Highly organised with a strong attention to detail, capable
    of managing multiple concurrent programs without
    compromising quality or compliance
