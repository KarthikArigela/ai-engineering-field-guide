description: |
  Sequencing is building the interface between humanity and
  its DNA.
  
  Using clinical-grade whole genome sequencing, AI, and a
  rapidly expanding ecosystem of genomic applications, we help
  people better understand themselves, their health, and their
  future through their DNA.
  
  The human genome is one of the most valuable and
  underutilized resources in the world. Our mission is to
  transform the human genome into a lifelong source of
  personalized guidance and build the trusted home for every
  genome on Earth.
  
  As the world’s largest direct-to-consumer whole genome
  sequencing platform, Sequencing is helping define the future
  of AI-powered personalized health.
  
  We’re a profitable, venture-backed, fully remote company
  building category-defining products that help people better
  understand themselves through their DNA.
  
  The Position
  
  At Sequencing, you'll build and operate the evaluation and
  validation infrastructure that keeps our AI systems correct,
  reliable, and regression-protected. This is an execution-
  focused role: you'll design, implement, and maintain the
  benchmarking systems that continuously test AI outputs
  against curated genomic datasets, partnering closely with
  the AI Bioinformatics Engineering Lead to turn
  interpretation standards into measurable, operational
  systems. You are detail-oriented, have a systems-thinking
  mindset and you notice the one VCF out of ten thousand that
  doesn't look right
  
  The Impact
  
  - Build and run automated evaluation pipelines for AI outputs
    end-to-end.
  - Expand regression datasets that cover variant normalization,
    transcript ambiguity, and disease-level mapping.
  - Execute large-scale validation runs across curated VCF
    datasets, track performance over time, and surface
    accuracy regressions the moment they appear.
  - Grow a structured question bank using and related datasets,
    encoding the edge cases that matter most.
  - Ship automated regression tests for every AI release and
    build dashboards that make variant-level and case-level
    accuracy visible to the whole team.
  - Partner with engineering to wire validation directly into
    CI/CD, and diagnose and document failure modes as they
    emerge.
  
  Dominant and Recessive Traits
  
  - Degree in Bioinformatics, Computational Biology, Genetics,
    or a related field.
  - Deep, hands-on experience with VCFs and real-world genomic
    datasets.
  - Fluency with ClinVar, dbSNP, HGVS standards, and transcript
    mapping.
  - A track record building evaluation frameworks or testing
    pipelines, Langfuse or similar.
  - Experience evaluating LLM-based systems and standing up
    automated QA at scale.
  
  .
  
  Benefits Overview
  
  - Comprehensive medical, dental, and vision insurance coverage
  - 401(k) with company matching
  - Paid time off (PTO)
  - Paid volunteer time off
  - Fully remote work with home office stipend
  - Parental bonding leave
  - Clinical-grade whole genome sequencing for you and your
    family (private and confidential)
  
  Join Sequencing
  
  - Redefine how people understand themselves through their DNA
  - Build category-defining products alongside scientists,
    engineers, and innovators
  - Contribute to technology that will improve and extend
    millions of lives
  - Shape one of the most important emerging categories in AI
    and healthcare
  
