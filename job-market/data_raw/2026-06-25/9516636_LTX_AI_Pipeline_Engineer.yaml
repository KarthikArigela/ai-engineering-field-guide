job_id: 9516636
title: AI Pipeline Engineer
company: LTX
location: Los Angeles, USA
work_type: FULL_TIME
description: |
  Lightricks is an AI-first company creating next-generation
  content creation technology for businesses, enterprises, and
  studios with a mission to bridge the gap between imagination
  and creation. At our core is LTX-2, an open-source
  generative video model, built to deliver expressive, high-
  fidelity video at unmatched speed. It powers both our own
  products and a growing ecosystem of partners through API
  integration.
  
  The company is also known globally for pioneering consumer
  creativity through products like Facetune, one of the
  world’s most recognized creative brands, which helped
  introduce AI-powered visual expression to hundreds of
  millions of users worldwide. We combine deep research, user-
  first design, and end-to-end execution from concept to final
  render to bring the future of expression to all.
  
  What you will be doing:
  
  - Be the primary technical point of contact for strategic
    partners, from early scoping through to implementation
    handoff. You’ll uncover partner requirements, define POCs,
    build demos and prototypes, and advise on improving
    workflows using LTX technologies.
  - Architect and implement AI-enhanced solutions that integrate
    LTX capabilities into partners' existing production
    pipelines, making them faster, more capable and scalable,
    and production-ready.
  - Translate partner needs into clear internal briefs; surface
    recurring market signals; assess opportunities for
    technical feasibility and strategic fit; be a
    knowledgeable and resourceful thought-partner to the
    Partnerships team.
  - Collaborate closely with R&D, Engineering, Product,
    Research, and Marketing to coordinate resources and move
    partner initiatives forward.
  - Stay sharp on developments across LTX and the broader
    generative AI landscape; keep partners informed of what's
    relevant.
  - Support ad-hoc partner-facing operations and initiatives by
    offering creative insight, production expertise, and
    technical know-how.
  
  Your skills and experience:
  
  - Portfolio required, including AI-native work. Shipped
    projects, workflows, or prototypes that demonstrate both
    creative craft and technical fluency.
  - Solid grounding in creative production fundamentals, with
    hands-on experience across linear content (film/TV, VFX,
    animation) and interactive/immersive workflows -
    sufficient to understand how AI can meaningfully improve
    or extend them. Deep knowledge of tools such as After
    Effects, Premiere, Houdini, Nuke, DaVinci Resolve, Maya,
    Blender, Unreal Engine, or Unity.
  - Expertise with AI-native tools. Proficiency with ComfyUI is
    required, including building and maintaining complex
    multi-node workflows and writing custom nodes. Experience
    fine-tuning models and training custom LoRAs across
    stylistic and utility use cases is required.
  - Python scripting proficiency, specifically for pipeline
    development, API integration, and tooling within AI
    workflows.
  - Exceptional communication and presentation skills. You can
    advise senior creative, technology, and business leaders
    with clarity and confidence.
  - Willingness to travel up to 25% of the time.
  
  Nice to Have
  
  - Experience in a client-facing technical role: solutions
    engineering, technical consulting, or similar.
  - Experience in a Creative Technologist, Technical Director,
    or similar role bridging creative production and
    technology.
  - Experience working alongside or in support of AI/ML research
    teams in an applied or translational capacity.
  
  Who You Are
  
  A creative technologist: you have craft sensibility and
  understand how creative work gets made. You've lived inside
  production pipelines, know what artists and directors care
  about, and can earn credibility in both creative and
  technical rooms.
  
  An AI practitioner: you know what current models can and
  can't do, and you know how to build with them. You've
  shipped AI workflows, built extensively in ComfyUI or with
  code, fine-tuned LoRAs, and understand model deployment well
  enough to architect reliable solutions.
  
  A resourceful self-starter: you have a track record of
  creating things from scratch in fast-moving, ambiguous
  environments. You can prototype, test, and iterate without
  waiting for perfect information.
  
  A clear communicator: you move naturally between technical,
  creative, and business contexts, and can present to artists,
  engineers, researchers, and business executives alike.
  
  Benefits:
  
  - Expected salary range is $160,000-$180,000. Actual
    compensation will vary based on a candidate’s
    qualifications, experience, and other relevant factors.
  - Stock options.
  - Health/dental/vision with the majority of premiums paid by
    the company.
  - 401k with company match. (Up to 4%)
  - $3,000 per year is provided for lunch.
  - $1,000 Yearly Learning, Development, and Wellness budget.
  - Work from home stipend.
  - 21 Days of PTO.
  - Birthdays off! Take a free day off during your birthday
    month to celebrate.
  - Talented teammates and a strong work culture supporting a
    healthy work-life balance.
  
  Why join us:
  
  We’re here to push the boundaries of what’s possible with AI
  and video - not for the buzz, but for the craft, the
  challenge, and the chance to make something genuinely new.
  
  We believe in an environment where people are encouraged to
  think, create, and explore. Real impact happens when people
  are empowered to experiment, evolve, and elevate together.
  
  At Lightricks, every breakthrough starts with great people
  and a collaborative mindset. If you're looking for a place
  that combines deep tech, creative energy, and zero buzzword
  culture, you might be in the right place.
