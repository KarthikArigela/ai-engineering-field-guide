title: Data Engineer, AI/ML III/IV
company: Zone 5 Technologies
location: USA
work_type: FULL_TIME
description: |
  At Zone 5 Technologies, we're redefining what's possible in
  unmanned aircraft systems. Our team of engineers and
  innovators is developing cutting-edge autonomous solutions
  that push the boundaries of UAS technology - solving complex
  challenges that matter.
  
  We're building the future of UAS capabilities, and we're
  looking for exceptional talent to join us. If you're driven
  by hard problems, energized by rapid innovation, and ready
  to make an impact on next-generation flight systems, you
  belong here.
  
  We are seeking a Data Analyst to build production-grade user
  interfaces and visualization systems for complex autonomy
  datasets. You will transform data insights into polished,
  intuitive dashboards, develop frontend components for
  analytics applications, and create compelling visual
  narratives that enable engineers to understand flight test
  results, sensor performance, and system behavior at a
  glance.
  
  Responsibilities:
  
  Frontend Development & Dashboard Implementation
  
  - Build responsive, production-ready web dashboards using
    modern frontend frameworks (React, TypeScript)
  
  - Develop reusable UI components and visualization libraries
    for internal analytics applications
  
  - Implement interactive features including filtering,
    brushing, zooming, and coordinated views across multiple
    charts
  
  - Create polished user experiences with attention to
    performance, accessibility, and visual design
  
  - Manage state, data flow, and API integration in complex
    single-page applications
  
  Advanced Data Visualization
  
  - Design and implement sophisticated visualizations for time-
    series, geospatial, and multi-dimensional data
  
  - Build custom chart types and interactive graphics tailored
    to autonomy and flight test use cases
  
  - Develop 3D trajectory viewers, map-based displays, and
    sensor visualization overlays
  
  - Create real-time data streaming visualizations for live
    monitoring of autonomous systems
  
  - Implement animation and transition effects that clearly
    communicate data changes over time
  
  UI/UX Design & Data Presentation
  
  - Design intuitive interfaces that make complex technical data
    accessible to diverse engineering audiences
  
  - Create visual hierarchies and information architectures that
    guide users to critical insights
  
  - Develop design systems and style guides for consistent
    visual language across analytics tools
  
  - Conduct user testing and iterate on designs based on
    feedback from engineering teams
  
  - Translate data insights into clear visual narratives that
    communicate findings effectively
  
  Data Integration & Analytics Tools
  
  - Connect frontend applications to data APIs, databases, and
    analytics backends
  
  - Implement client-side data processing and aggregation for
    responsive user experiences
  
  - Build query interfaces and parameter controls that allow
    users to slice and filter datasets
  
  - Develop export and reporting features for sharing insights
    with stakeholders
  
  - Collaborate with data scientists and platform engineers to
    optimize data delivery for UI performance
  
  Qualifications:
  
  - Bachelor's in Computer Science, Data Science, Human-Computer
    Interaction, Design, or related field – equivalent
    industry experience also welcome
  
  - 5-8+ years of experience in frontend development with focus
    on data-intensive applications
  
  - Expert-level proficiency in JavaScript/TypeScript and modern
    frontend frameworks (React, Vue, or Angular)
  
  - Strong experience with data visualization libraries (D3.js,
    Plotly, Recharts, or similar)
  
  - Deep understanding of UI/UX design principles and best
    practices for data presentation
  
  - Proficiency in HTML, CSS, and responsive design techniques
  
  - Experience with Python for data manipulation and analysis
    (Pandas, NumPy)
  
  - Understanding of RESTful APIs, GraphQL, and frontend data
    fetching patterns
  
  - Strong visual design skills and ability to create
    aesthetically pleasing, functional interfaces
  
  Preferred:
  
  - Experience building dashboards for engineering, robotics, or
    technical domains
  
  - Familiarity with 3D visualization libraries (Three.js,
    Deck.gl, Cesium)
  
  - Knowledge of geospatial data visualization and mapping
    libraries (Mapbox, Leaflet)
  
  - Understanding of time-series data and real-time streaming
    visualization
  
  - Experience with WebGL, canvas rendering, or high-performance
    graphics
  
  - Background in interaction design, information visualization,
    or visual analytics
  
  - Familiarity with design tools (Figma, Sketch) for mockups
    and prototyping
  
  - Knowledge of accessibility standards (WCAG) and inclusive
    design practices
  
  - Experience with state management libraries (Redux, MobX,
    Zustand)
  
  - Understanding of ROS2 data formats or flight test data
    structures
  
  - Background in statistical visualization or exploratory data
    analysis
  
  - Experience with testing frameworks for frontend applications
    (Jest, React Testing Library)
  
  Compensation:
  
  Level III - $130k - $157k
  
  Level IV - $157k - $187k
  
  Pay range for this role
  
  $130,000—$187,000 USD
  
  What's in it for you:
  
  Benefits:
  
  - Competitive total compensation package
  - Comprehensive benefit package options include medical,
    dental, vision, life, and more.
  - 401k with company-match
  - 4 weeks of paid time off each year
  - 12 annual company holidays
  
  Why Join Zone 5 Technologies?
  
  - Innovative Environment: Work on cutting-edge technology that
    is shaping the future of defense and aerospace.
  - Collaborative Culture: Join a team of passionate
    professionals dedicated to pushing the boundaries of
    what’s possible.
  - Career Growth: Opportunities for professional development
    and career advancement.
  
  If you are passionate about unmanned aircraft technology and
  want to be a part of a dynamic and growing company, we would
  love to hear from you. Apply today and join the Zone 5
  Technologies team!
  
  In compliance with federal law, all persons hired will be
