description: |
  AI Engineer
  
  
  
  About ArangoDB
  
  Arango makes your business data AI-ready, giving agents,
  apps, and assistants trusted context at scale. Every answer
  traceable. Every decision is governed. No more stitching
  together a vector store, a graph database, a search index,
  and a governance layer added as an afterthought. Arango’s
  Contextual Data Platform has it all built in, not bolted on.
  
  Trusted by organizations including NVIDIA, HPE, Zscaler, the
  London Stock Exchange, the U.S. Air Force, NIH, Siemens, and
  Articul8, Arango helps enterprises move from AI pilots to
  reliable production systems faster while lowering
  infrastructure complexity and total cost of ownership.
  Arango is a proud member of the NVIDIA Inception Program and
  the AWS ISV Accelerate Program.
  
  Stop building Frankenstacks. Start building with Arango.
  Learn more at arango.ai
  
  We believe great innovation happens when curious, driven
  people collaborate. We are committed to building a diverse
  and inclusive team and supporting our employees and interns
  as they learn, grow, and contribute to shaping the future of
  enterprise AI. Location
  
  ** All candidates in India will be considered. ** About the
  Role As part of our team, you oversee the technical
  development of Arango’s capabilities within the AI universe.
  Your responsibilities include:
  
  
  
  
  - Design and own Python-based features for Arango’s Contextual
    Data Layer Platform
  - Evaluate the latest developments and innovations in the
    Agentic AI, context engineering and Python fields,
    applying them effectively in your work
  - Build solutions for GenAI use cases such as data pipelines,
    retrieval-augmented generation (RAG), and advanced
    analytics
  - Develop and refine agentic workflows: build, orchestrate,
    and optimize autonomous agents for complex tasks within
    distributed environments
  - Integrate and manage private and cloud-hosted LLMs with a
    focus on secure, scalable deployment
  - Build and scale Arango solutions within Kubernetes
    environments, ensuring robust operation and performance
    for AI workloads.
  - Other duties as assigned from time to time.
  
   Your Skills
  
  - Strong English communication skills
  - Very strong analytical and problem solving skills and high
    creativity, as demonstrated by published works (videos,
    posts, papers), open source projects, hackathon wins, or
    similar public evidence.
  - Candidates without public evidence of very strong analytical
    and problem solving skills and high creativity will not be
    considered
  - Ability to learn and master new AI topics very fast
  - Strong foundation in Python, RAG systems, LLM-based systems,
    agents, software design and architecture, focusing on
    writing readable, maintainable, and production-grade code.
  - Solid expertise in testing software across all levels,
    including unit tests, integration tests, and end-to-end
    testing strategies.
  - Hands-on experience with NoSQL/SQL, Mac or Linux, Docker and
    Kubernetes
  - Passionate about solving complex problems, using an
    analytical approach
  - Bonus points for:
    - Experience with database systems and Data/ML ecosystem
    - Experience working with highly connected, complex systems,
      and the ability to mentally model and navigate intricate
      architectures
    - Experience with Cloud-native development (AWS,
      Kubernetes,...)
    - Strong exposure to Machine Learning and Agentic AI workflows
    - Background in working with or designing graph data
      architectures
    - Familiarity with deploying and integrating Large Language
      Models (LLMs), including private and cloud-based LLMs
  
   What Makes Arango Special?
  
  At Arango, we believe that AI is only as powerful as the
  data foundation. Our mission is to help organizations build
  AI systems that can reason, decide and act based on unified,
  current, and trusted business context at scale. We are
  helping define a new category of infrastructure: the
  contextual data layer for AI.
  
  Working at Arango means:
  
  - Contributing to cutting-edge AI and data infrastructure
  - Collaborating with experienced engineers, marketers, and
    product leaders
  - Helping shape how enterprises build AI-powered applications
  
  If you're excited about the intersection of AI, data, and
  social media, we’d love to hear from you.
