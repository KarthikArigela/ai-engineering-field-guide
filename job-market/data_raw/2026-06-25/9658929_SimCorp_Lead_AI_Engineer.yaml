description: |
  WHAT MAKES US, US
  
  Join some of the most innovative thinkers in FinTech as we
  lead the evolution of financial technology. If you are an
  innovative, curious, collaborative person who embraces
  challenges and wants to grow, learn and pursue outcomes with
  our prestigious financial clients, say Hello to SimCorp!
  
  At its foundation, SimCorp is guided by our values — caring,
  customer success-driven, collaborative, curious, and
  courageous. Our people-centered organization focuses on
  skills development, relationship building, and client
  success. We take pride in cultivating an environment where
  all team members can grow, feel heard, valued, and
  empowered.
  
  If you like what we're saying, keep reading!
  
  WHY THIS ROLE IS IMPORTANT TO US
  
  We are seeking a Lead AI Engineer to serve as a core builder
  within the SMBS AI team, working under the technical
  direction of the Director, AI Solutions. The Senior AI
  Engineer takes AI agent solutions from design through
  production — ensuring they are built to production-grade
  standards and integrate into the wider SimCorp AI ecosystem,
  infrastructure, and compliance frameworks.
  
  With typically 5+ years of experience in production AI/ML
  engineering, this role is the hands-on delivery engine of
  the team — implementing agent logic, translating prioritised
  use cases into working solutions, and ensuring everything
  shipped meets the technical bar set by the Director. The
  focus is on speed with quality: moving from use case to
  production with a short time to market cycle, without
  compromising on reliability or maintainability.
  
  The principle of ownership is clear: who builds it,
  maintains it. There are no handoffs between build and run.
  The Senior AI Engineer owns the agents they develop end-to-
  end — from implementation through production monitoring
  through iterative improvement based on operational feedback.
  The solutions you build are part of a larger ecosystem and
  must comply with the platform and integration standards that
  govern how AI is built across SimCorp.
  
  WHAT YOU WILL BE RESPONSIBLE FOR
  
  In your daily work, you will:
  
  - Build AI agent solutions from technical design through
    production deployment, following the solution framework
    and standards defined by the Director, AI Solutions.
  - Implement agent logic, prompt engineering, retrieval-
    augmented generation pipelines, and LLM API integrations.
  - Develop and execute testing strategies for agent behaviour,
    including edge case handling, accuracy validation, and
    performance testing.
  - Deliver production-ready agents within sprint timelines,
    managing technical complexity and communicating risks
    proactively.
  - Own agents in production, including monitoring, incident
    response, and iterative improvement.
  - Resolve bugs and address agent behaviour issues identified
    through operator feedback and usage tracking.
  - Adapt agents when underlying data sources, operational
    processes, or platform infrastructure changes require
    updates.
  - Participate in support rotations once multiple agents are
    live in production.
  - Participate in code reviews, both giving and receiving, to
    maintain code quality and shared technical understanding.
  - Support the Director, AI Solutions in evaluating new tools,
    frameworks, and approaches.
  - Mentor AI Engineers on implementation practices, debugging
    approaches, and production readiness.
  - Collaborate with Data Engineers to define data requirements
    and ensure agent data pipelines are reliable and
    performant.
  
  WHAT WE VALUE
  
  - Strong proficiency in Python and modern development tooling.
  - Practical experience with LLM APIs, prompt engineering, RAG
    architectures, and vector databases.
  - 5+ years of experience in software engineering with a focus
    on AI/ML, NLP, or data-intensive applications.
  - Experience deploying and maintaining AI/ML models or
    applications in production environments.
  - Ability to work autonomously on complex implementations
    while aligning with broader solution standards.
  - You take full ownership of what you build — you are not done
    when the agent is deployed, you are done when it works
    reliably in production.
  - You can communicate technical issues and agent behaviour
    clearly to non-technical operators and stakeholders.
  - Experience in financial services or operational environments
    is beneficial.
  
  BENEFITS
  
  - Global hybrid work policy — We ask you to work 2 days a week
    from the office. If you choose, you can work remotely the
    other days. Of course you are welcome at the office if
    that is your preference.
  - Growth and innovation — Every 6th sprint is reserved for
    planning and innovation. So, with regular intervals you
    have a chance to explore and learn new skills or improve
    something that you believe will be beneficial to you, your
    team, or the organization.
  - Self-Direction — High degree of self-organization. Each team
    member has a high degree of freedom to plan, organize, and
    design their work.
  - Inclusive and diverse company culture.
  - Work-life balance — We believe that an equilibrium between
    professional responsibilities makes us all the best
    version of ourselves, both in private life and as
    colleagues in the workplace.
  - Empowerment — We believe that all voices are valuable and
    must be heard. You will be involved in shaping our work
    processes.
  
  NEXT STEPS
  
  Please send us your application in English via our career
  site as soon as possible, we process incoming applications
  continually. Please note that only applications sent through
  our system will be processed. At SimCorp, we recognize that
  bias can unintentionally occur in the recruitment process.
  To uphold fairness and equal opportunities for all
  applicants, we kindly ask you to exclude personal data such
  as photo, age, or any non-professional information from your
  application. Thank you for aiding us in our endeavor to
  mitigate biases in our recruitment process.
  
  If you are interested in being a part of SimCorp but are not
  sure this role is suitable, submit your CV anyway. SimCorp
  is on an exciting growth journey, and our Talent Acquisition
  Team is ready to assist you discover the right role for you.
  The approximate time to consider your CV is three weeks.
  
  We are eager to continually improve our talent acquisition
  process and make everyone's experience positive and
  valuable. Therefore, during the process we will ask you to
  provide your feedback, which is highly appreciated.
  
  WHO WE ARE
  
  For over 50 years, we have worked closely with investment
  and asset managers to become the world's leading provider of
  integrated investment management solutions. We are 3,000+
  colleagues with a broad range of nationalities, educations,
  professional experiences, ages, and backgrounds.
  
  SimCorp is an independent subsidiary of the Deutsche Börse
  Group. Following the recent merger with Axioma, we leverage
  the combined strength of our brands to provide an industry-
  leading, full, front-to-back offering for our clients.
  
  SimCorp is an equal opportunity employer and welcomes
  applicants from all backgrounds, without regard to race,
  gender, age, disability, or any other protected status under
  applicable law.
  
  We are committed to building a culture where diverse
  perspectives and expertise are integrated into our everyday
  work. We believe in the continual growth and development of
  our employees, so that we can provide best-in-class
  solutions to our clients.
  
