title: Senior Sales Engineer, AI and Cloud Security
company: Silverfort
location: USA
remote: true
work_type: FULL_TIME
description: |
  Description
  
  Silverfort is on a mission to bring identity security
  everywhere – to every human, machine, and AI agent, both on-
  prem and in the cloud. Our unique technology secures
  identities & access at runtime, in ways that weren’t
  possible before. With the broadest identity security
  platform in the market, trusted by more than 1,000 customers
  including many Fortune 100 companies, Silverfort is uniquely
  positioned to lead the fast-growing identity security
  category.
  
  Joining Silverfort means becoming part of a fast-moving team
  with a culture of innovation and collaboration, that goes
  above and beyond to help our customers and each other, on a
  journey to reshape the future of identity security.
  
  As a Senior Sales Engineer in an overlay capacity, you will
  be the primary technical expert for AI agent security and
  cloud identity engagements across North America. Working
  alongside existing account teams, you will be engaged
  wherever AI and cloud identity complexity requires dedicated
  technical depth — leading discovery, designing POC
  frameworks, and driving strategic wins to close. In your
  first year, success looks like a defined AI agent security
  playbook, measurable wins in cloud identity accounts, and
  trusted partnerships with the account teams you support.
  
  Responsibilities
  
  - Serve as the deep technical expert on AI agent security and
    cloud identity across North American account teams
  - Lead technical scoping, POC design, and architecture
    workshops for accounts with complex cloud and AI
    environments
  - Design and execute POC environments for securing AI agent
    identities, non-human service accounts, cloud workload
    identities, and machine-to-machine authentication across
    AWS, Azure, and GCP
  - Build repeatable delivery assets — technical guides, demo
    environments, and battle cards — that account teams can
    activate on AI and cloud identity opportunities
  - Partner cross-functionally with AEs, CSMs, and the
    Silverfort product team to drive AI and cloud identity
    wins to close
  - Bridge Silverfort's identity platform and the emerging AI
    and cloud identity threat landscape for customers
  
  Requirements
  
  - 5+ years of experience in a pre-sales, sales engineering, or
    technical security role
  - Deep knowledge of cloud identity platforms (Azure AD / Entra
    ID, AWS IAM, GCP, Okta)
  - Hands-on experience securing AI agent identities, non-human
    service accounts, API keys, or automation pipelines in
    production cloud environments
  - Experience working in an overlay or specialist SE capacity,
    or demonstrated ability to operate without direct account
    ownership
  - Strong understanding of how AI tooling (Copilot, Claude,
    Cursor, etc.) is expanding the attack surface
  - Ability to manage multiple concurrent engagements across
    different account teams
  - Security certifications (CISSP, CCSP, Microsoft SC-300,
    CyberArk Defender, Okta Professional)
  - Experience working with MSSP, VAR, or channel partners in a
    pre-sales capacity
  - Background in regulated industries (financial services,
    healthcare, critical infrastructure)
industries:
