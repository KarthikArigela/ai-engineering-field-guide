  Job Description – AI Engineer
  
  Location: Bangalore, India Experience: 4+ Years (Immediate
  Joiners Only) Employment Type: Full-time / Permanent
  
   About the Role
  
  We are seeking a highly skilled AI Engineer with expertise
  in Python, Generative AI, Machine Learning (ML), Deep
  Learning (DL), and Natural Language Processing (NLP). The
  ideal candidate will have strong hands-on experience in
  designing, developing, and deploying AI/ML models on cloud
  platforms (AWS or GCP). You will work closely with data
  scientists, product teams, and cloud engineers to build
  intelligent solutions that scale.
  
   Key Responsibilities
  
  - Design, develop, and optimize AI/ML/DL models for real-world
    business use cases.
  - Build and fine-tune Generative AI and NLP models for
    advanced applications.
  - Deploy, monitor, and manage ML models on AWS / GCP cloud
    environments.
  - Collaborate with cross-functional teams to integrate AI
    solutions into products and services.
  - Stay up to date with the latest research, tools, and trends
    in AI, ML, DL, and NLP.
  - Ensure scalability, performance, and security of deployed AI
    applications.
  
   Required Skills & Qualifications
  
  - Strong proficiency in Python and ML frameworks (TensorFlow,
    PyTorch, Scikit-learn, etc.).
  - Proven experience with Generative AI (LLMs, Transformers,
    Diffusion Models, etc.).
  - Hands-on expertise in NLP techniques (text classification,
    embeddings, summarization, conversational AI).
  - Solid understanding of Deep Learning architectures (CNNs,
    RNNs, LSTMs, Transformers).
  - Experience with cloud platforms (AWS or GCP) for ML model
    deployment and MLOps pipelines.
  - Familiarity with Docker, Kubernetes, CI/CD for AI/ML
    deployment is a plus.
  - Strong problem-solving and analytical skills.
  
   Nice to Have
  
  - Knowledge of Vector Databases (Pinecone, Weaviate, FAISS,
    etc.).
  - Experience in LangChain, RAG, Prompt Engineering.
  - Prior exposure to large-scale data engineering and big data
    ecosystems.
  
   What We Offer
  
  - Opportunity to work on cutting-edge AI/GenAI projects.
  - A fast-paced, collaborative environment in the heart of
    Bangalore’s tech hub.
  - Competitive compensation and benefits.
  - Immediate onboarding for the right candidate.
