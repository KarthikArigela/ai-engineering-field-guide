description: |
  Who We Are
  
  Having surpassed $300M ARR and continuing to grow, Optro is
  the leading audit, risk, ESG, and InfoSec platform on the
  market. More than 50% of the Fortune 500, including 7 of the
  Fortune 10, leverage our award-winning technology to move
  their businesses forward with greater clarity and agility.
  And our customers love us: Optro is top-rated on G2.com and
  Gartner Peer Insights. At Optro, we inspire each other to
  innovate and are proud of what we are producing. We spend
  each day thinking of new ways to help our customers and
  contribute to the greater good of our company and our
  surrounding communities. We are all about assisting each
  other and breaking through barriers to create the most loved
  audit, risk, ESG, and InfoSec platform by our customers.
  This is how we have become one of the 500 fastest-growing
  tech companies in North America for the seventh year in a
  row, as ranked by Deloitte!
  
  Remote, Canada
  
  Why This Role is Exciting
  
  We are seeking a passionate and skilled Machine Learning
  Engineer to join our effort to push the frontiers of risk
  management. This role offers the opportunity to work with
  cutting-edge Large Language Models (LLMs), utilizing
  techniques like Retrieval-Augmented Generation (RAG), Few-
  Shot Learning, Prompt Engineering, Fine-Tuning, Semantic
  Search, and Knowledge Distillation, etc. You will apply your
  expertise to build advanced AI/ML solutions, enhancing our
  AuditBoard product portfolio with features like chat
  systems, agentic workflows, intelligent data extraction, and
  personalized insights. If you're excited about leveraging
  modern AI/ML techniques to transform the industry, this role
  is for you. Join our customer-focused team dedicated to
  continuous learning and innovation.
  
  Key Responsibilities
  
  - Build, ship, and own product features end-to-end
  - Work with designers, and product managers to create high-
    performing product features.
  - Apply a range of techniques—from classical ML to LLM-based
    approaches (RAG, prompt engineering, fine-tuning, semantic
    search)—with a strong focus on reliability, performance,
    and maintainability
  - Write well-designed, maintainable, and testable code
  - Write clear and well-defined design documentation
  - Troubleshoot, debug, and resolve software bugs
  - Be product-minded and think about the customer
  - Stay updated on AI/ML advancements and explore new
    techniques and tools.
  - Participate in an Agile software development life cycle
  - Work with Python, JavaScript, Node.JS, Docker, PostgreSQL,
    Kubernetes, etc
  
  Attributes of a Successful Candidate
  
  - Bachelor’s or Master’s degree in Computer Science,
    Statistics, Mathematics, or a related field
  - 4 plus years of hands-on experience in developing and
    deploying machine learning models
  - Ability to write scalable production-quality code
  - Proficiency in classical machine learning methods and
    familiarity with newer techniques like LLMs
  - Excellent programming skills in Python, Java, or similar
    languages
  - Experience with machine learning frameworks such as
    TensorFlow, PyTorch, Hugging Face, Keras, MXNet, or
    scikit-learn.
  - Familiarity with search/information retrieval, and ranking
    systems
  - Strong communication skills and ability to work
    collaboratively
  - Analytically minded with a focus on metrics and evaluation
  - Motivation to work hard and always be learning
  
  Preferred
  
  - Experience with Node.JS and modern ES6 or TypeScript
  - Experience working on SaaS web applications
  - Basic understanding of distributed systems
  - Bonus: Docker, Kubernetes experience, AWS/Azure cloud
    infrastructure
  
  Perks (Canada)
  
  - Launch a career at one of the fastest-growing SaaS companies
    in North America and EMEA!
  - Live your best life (LYBL)! $200/mo (USD) for anything that
    enhances your life
  - Comprehensive employee health and life insurance coverage
  - Competitive compensation & bonus program
  - Statutory vacation + Flexible vacation
  - Time off for your birthday & volunteering
  - Employee resource groups
  - Opportunities for team and company-wide get-togethers!
  
  *perks may vary based on eligibility/location
  
  Our Company Values
  
  - Customer obsession: It starts and ends here. Consistently
    ask yourself how what you’re doing creates value for our
    customers. It’s a mindset.
  - Gritty resilience: Make it happen. Find a way. Move fast,
    stay positive, and do what it takes.
  - Drive innovation: Create the future. Continuously improve
    what exists and invent what’s next.
  - Win, together: One team. No silos, no egos. Drive to be the
    best and support each other’s success.
  - Growth mindset: 10x, not 10%. Think in orders of magnitude,
    not increments. Seek feedback, learn, and improve.
  
  Please note that background checks are required. Qualified
  Applicants with arrest or conviction records will be
  considered for Employment in accordance with the Los Angeles
  County Fair Chance Ordinance for Employers and the
  California Fair Chance Act. This role may have access to
  highly sensitive data, including employee data, customer
  data, company financials, and proprietary product
  information. We love building strong partnerships, but
  please note that Optro cannot accept unsolicited resumes
  from agencies. Any submissions without a signed agreement in
  place will not create a fee obligation.
  
  
  
