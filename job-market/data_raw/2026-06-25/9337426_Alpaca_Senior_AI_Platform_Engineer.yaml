title: Senior AI Platform Engineer
company: Alpaca
location: USA
work_type: FULL_TIME
description: |
  Who We Are:
  
  Alpaca is a US-headquartered self-clearing broker-dealer and
  brokerage infrastructure for stocks, ETFs, options, crypto,
  fixed income, 24/5 trading, and more. Our recent Series D
  funding round brought our total investment to over $320
  million, fueling our ambitious vision.
  
  Amongst our subsidiaries, Alpaca is a licensed financial
  services company, serving hundreds of financial institutions
  across 40 countries with our institutional-grade APIs. This
  includes broker-dealers, investment advisors, wealth
  managers, hedge funds, and crypto exchanges, totalling over
  9 million brokerage accounts.
  
  Our global team is a diverse group of experienced engineers,
  traders, and brokerage professionals who are working to
  achieve our mission of opening financial services to
  everyone on the planet. We're deeply committed to open-
  source contributions and fostering a vibrant community,
  continuously enhancing our award-winning, developer-friendly
  API and the robust infrastructure behind it.
  
  Alpaca is proudly backed by top-tier global investors,
  including Portage Ventures, Spark Capital, Tribe Capital,
  Social Leverage, Horizons Ventures, Unbound, SBI Group,
  Derayah Financial, Elefund, and Y Combinator.
  
  Our Team Members:
  
  We're a dynamic team of 380+ globally distributed members
  who thrive working from our favorite places around the
  world, with teammates spanning the USA, Canada, Japan,
  Hungary, Nigeria, Brazil, the UK, and beyond! We're
  searching for passionate individuals eager to contribute to
  Alpaca's rapid growth. If you align with our core
  values—Stay Curious, Have Empathy, and Be Accountable—and
  are ready to make a significant impact, we encourage you to
  apply.
  
  Your Role
  
  Alpaca is building an AI Enablement function to move the
  company from scattered AI experimentation to durable,
  company-wide productivity gains. As Senior AI Platform
  Engineer, you will own the technical capability layer that
  makes that possible.
  
  You will build and maintain the platform infrastructure,
  connectors, execution patterns, and self-service tooling
  that lets engineering and business teams use AI safely at
  scale by turning one-off setups and ad hoc tooling into
  reusable infrastructure, secure deployment standards, and
  productized onboarding.
  
  This role requires hands-on experience building with agentic
  AI systems. This is not classical ML pipelines, but the
  emerging stack of LLM-powered agents, tool use, evaluation
  loops, and autonomous workflow execution. You should know
  this space well enough to make opinionated decisions about
  execution patterns, isolation boundaries, and what "safe and
  reliable" actually means for agents with real tool access.
  
  This is a startup-inside-a-scaleup role. You will need to
  move fast with limited resources while meeting the standards
  a regulated fintech environment requires. You will work
  closely with DevOps, Security, IT, and engineering teams
  across the company.
  
  Things You Get To Do
  
  - Own the connector and service integration layer that powers
    AI workflows across the company.
  - Design and ship execution environments for agents and
    higher-autonomy AI workflows, including isolation
    boundaries and access controls.
  - Build reusable platform services, golden paths, and self-
    service templates that reduce setup friction for teams
    building on AI.
  - Productize onboarding so it works reliably for both
    developers and non-developers without depending on manual
    intervention or tribal knowledge.
  - Define and enforce technical standards for agent execution,
    evaluation loops, and deployment.
  - Partner with Security and IT to ship deployable patterns for
    higher-risk AI capabilities.
  - Own the AI governance layer: access controls, audit trails,
    approval criteria, and deployment boundaries for agentic
    workflows.
  - Set the reliability, observability, and operational bar for
    AI-specific infrastructure.
  - Act as the technical escalation point when onboarding or
    platform issues block rollout.
  - Reduce the company's dependence on individual heroics by
    turning exception handling into repeatable paths.
  
  Who You Are (Must-Haves)
  
  - 8+ years in software, platform, infrastructure, or adjacent
    engineering roles.
  - Hands-on experience building agentic AI systems: LLM-powered
    workflows, tool-calling agents, evaluation loops, or
    autonomous execution — using frameworks like the Claude
    SDK, Google Agent Development Kit (ADK), LangGraph, or
    similar. Not classical ML or data pipelines.
  - Direct experience with GCP. We run on Google Cloud and you
    should be comfortable there.
  - Strong experience with APIs, auth, OAuth, secrets, CLI
    tooling, and deployment patterns.
  - Cloud-native systems experience with containers,
    orchestration (Kubernetes), and infrastructure-as-code.
  - Experience implementing AI governance controls: access
    boundaries, audit logging, approval workflows, and safe
    deployment standards for higher-autonomy systems.
  - Comfortable operating in both fast-moving, low-process
    environments and more structured, compliance-aware ones.
    You know when to move fast and when to slow down.
  - Strong bias toward simplification, standardization, and
    operational reliability over clever one-off solutions.
  - Excellent communication skills with the ability to work
    across engineering, security, and non-technical
    stakeholders.
  
  Who You Might Be (Nice-to-Haves)
  
  - Shipped production agentic systems with real external tool
    access (filesystems, APIs, staging systems).
  - Hands-on experience with Google Agent Engine (Vertex AI
    Agent Builder) or equivalent managed agent execution
    platforms.
  - Direct experience with AI-native coding environments (eg.
    Cursor, Claude Code). You have strong opinions on how
    these tools fit into a real engineering workflow.
  - Designed or operated agent sandboxing, isolation, or
    evaluation frameworks.
  - Built self-service developer platforms or golden paths used
    by multiple teams.
  - Has startup experience and knows how to build durably with
    limited resources.
  - Familiarity with fintech, regulated environments, or
    compliance-aware deployment.
  
  How We Take Care of You:
  
  - Competitive Salary & Stock Options
  - Health Benefits
  - New Hire Home-Office Setup: One-time USD $500
  - Monthly Stipend: USD $150 per month via a Brex Card
  
  Alpaca is proud to be an equal opportunity workplace
  dedicated to pursuing and hiring a diverse workforce.
  
  Recruitment Privacy Policy
