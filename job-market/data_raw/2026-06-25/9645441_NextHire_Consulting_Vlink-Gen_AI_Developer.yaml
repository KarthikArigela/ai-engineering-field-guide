description: |
  Position: GenAI Developer
  
  Experience: 6+ Years (Minimum 2+ Years in GenAI Projects)
  
  Shift Time- Normal Shift(10-7 PM)
  
  Location: Bangalore, Gurgaon, Pune, Chennai
  
  Key Responsibilities:
  
  Design, develop, and deploy Generative AI solutions using
  Agentix AI frameworks and AWS services. Build, fine-tune,
  and optimize LLMs for enterprise use cases. Develop and
  integrate AI agents leveraging Agentix AI and Python for
  automation and decision-making. Implement end-to-end
  solutions on AWS cloud (Bedrock, SageMaker, Lambda, API
  Gateway, etc.). Collaborate with cross-functional teams to
  define use cases, build POCs, and scale AI solutions. Ensure
  performance, security, and scalability of deployed GenAI
  systems.
  
  Required Skills:
  
  Strong hands-on experience in Python (data handling, API
  integration, backend development).
  
  Expertise in AWS services (AI/ML ecosystem preferred:
  Bedrock, SageMaker, EC2, Lambda, S3).
  
  Proven experience working with Agentix AI for developing
  autonomous AI agents.
  
  Good understanding of LLMs, prompt engineering, and vector
  databases (e.g., Pinecone, FAISS, Weaviate).
  
  Knowledge of REST APIs, microservices architecture, and
  containerization (Docker, Kubernetes).
  
  Familiarity with data pipelines, model deployment, and MLOps
  best practices.
  
  Good to Have:
  
  Experience with LangChain, RAG (Retrieval Augmented
  Generation), or similar frameworks.
  
  Knowledge of transformer architectures, NLP techniques, and
  fine-tuning methods.
  
  Exposure to generative AI applications like chatbots,
  copilots, and autonomous systems.
  
  Qualifications:
  
  Bachelor’s/master’s in computer science, AI/ML, Data
  Science, or a related field.
  
