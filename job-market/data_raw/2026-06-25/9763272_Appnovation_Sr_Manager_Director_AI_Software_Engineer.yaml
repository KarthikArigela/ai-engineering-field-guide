description: |
  About us
  
  Appnovation is a global, full-service digital partner that
  combines Strategy, Experience & Design, Engineering and
  Managed Services. We build digital solutions that deliver
  real impact today and serve as foundations for future
  growth.  Bold ambition. Practical action. Endless
  possibilities.
  
  Technology is foundational to all of Appnovation’s
  offerings, from consulting to digital innovation, to digital
  product and service creation. The technology department is
  focused on delivering software solutions that enable rich
  consumer experiences, from mobile and web applications to
  advanced analytics and machine learning, to content and
  engagement management service enablement platforms.
  
  Inherent throughout our tech capabilities is deep expertise
  in the Software Development Life Cycle, a drive for
  creativity, a passion for the craft, and collaboration with
  other disciplines - all foundational ingredients in
  successful digital experiences and client partnerships.
  
  As a Senior Fullstack Developer, you will join a highly
  motivated and experienced team, building web and mobile
  applications as well as providing strategy consulting for
  Appnovation’s clients. We are looking for people who can
  bring a strong, consulting and solution focused mindset and
  contribute to architectural decisions, best practices and
  get things done.
  
  QUALIFICATIONS
  
  - Bachelor’s Degree in Computer Science, or equivalent.
  - 5+ years of experience in software engineering with a strong
    focus on fullstack development.
  - Experience developing and optimizing code using AI-powered
    tools such as Claude Code and GitHub Copilot to enhance
    productivity and code quality.
  - Deep expertise in Python for backend development and
    scripting.
  - Proficiency in modern frontend frameworks, specifically
    React and Vue.js, along with ES6 and TypeScript.
  - Strong experience with backend development using Node.js and
    Express.js.
  - Strong experience in database design and management,
    including both RDBMS (MySQL, PostgreSQL) and NoSQL
    databases (MongoDB, DynamoDB).
  - Experience designing, developing, and consuming RESTful APIs
    and microservices.
  - Experience with unit testing, integration testing, and
    modern DevOps practices (e.g., Git, CI/CD pipelines).
  - Experience with Cloud Computing and Serverless Architecture,
    preferably AWS.
  - Strong understanding of agile principles and methodologies.
  
  WHO YOU ARE
  
  - You think about how to scale, automate and operate, not just
    how to build a solution to an immediate problem
  - You understand lean thinking
  - You set high standards for code quality,
    performance/scalability and security and seek continuous
    improvement
  - You have solid analytical, problem solving and decision-
    making skills
  - You have customer first mindset and a devotion to customer
    service
  - You engage and build positive internal and external client
    relationships, while managing multiple initiatives, often
    with competing priorities
  - You have strong self-initiative, passion, interpersonal,
    oral and written communication and collaboration skills
    with the ability to work, influence and make an impact in
    a cross-functional environment with all levels of the
    organization
  - You are responsive and thrive in a fast-paced diverse high-
    performance environment with rapidly changing business
    needs
  - You actively seek out things outside your comfort zone with
    the ability to rapidly learn and take advantage of new
    concepts, business models, and technologies
  - You have prior experience in consulting
  - Prior experience and connections in the Life Sciences
    industry is preferred
  
  Thank you for your interest in a career with Appnovation
  Technologies! Please note that only those selected for an
  interview will be contacted.
  
  
  
  At Appnovation, we recognize that diverse teams are the
  strongest teams. Diversity, Equity & Inclusion is not only
  something that we embrace - we celebrate it! We are proud to
  be an Equal Opportunity Employer and we encourage applicants
  from all backgrounds, lived experiences and industries to
  apply. Come join us at Appnovation, and learn more about how
  we stay true to our company values as we build better lives
  through better digital.
  
  Accommodations are available upon request throughout the
  recruitment process.
