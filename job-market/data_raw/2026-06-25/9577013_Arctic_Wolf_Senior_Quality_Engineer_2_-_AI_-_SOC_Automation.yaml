description: |
  About the Role
  
  At Arctic Wolf, our AI-driven Security Operations Cloud
  (AISOC) processes hundreds of billions of security signals
  every day from a wide range of on-premises and cloud
  environments. Using advanced  AI and automation, our
  platform turns complex data into meaningful insights that
  help detect and respond to threats faster and more
  effectively.
  
  Behind the scenes, our platform is powered by a scalable,
  distributed architecture built on microservices that enable
  real-time analysis and continuous improvement in threat
  detection.
  
  As part of our Concierge Security® approach, these insights
  are paired with expert human analysis to provide proactive
  protection for our customers.
  
  We are looking for passionate and experienced Quality
  Engineers to join our team and help build and enhance our
  next-generation testing platforms. In this role, you’ll
  contribute to ensuring the reliability, performance, and
  quality of systems that are critical to delivering AI-
  powered security outcomes.
  
  You Will:
  
  - Create and extend software frameworks and tools to run,
    monitor, and report on automated tests.
  - Have experience building and maintaining Automation
    frameworks and CI/CD pipeline.
  - Review testing strategies, approaches, and test plans and
    provide insight to development teams.
  - Architect, design and build software to automate a variety
    of testing methods (e.g. API validation, performance/load
    testing, fuzzing, etc.)
  - Develop and maintain test frameworks for GenAI-based and
    AI/ML applications, including model validation, LLM
    prompt-response consistency, hallucination detection, and
    regression testing for AI inference APIs.
  - Implement evaluation pipelines to test LLM accuracy,
    latency, bias, toxicity, and reliability.
  - Our Technology Stack: Pytest, Robot, RestAPIs, Python,
    Playwright, Docker, Kubernetes, AWS (Bedrock, Lambda, SQS,
    S3, etc.), LangChain, LLM evaluation frameworks (e.g.,
    Ragas), OpenAPI, Postgres, Linux.
  
  You:
  
  - Are excited to work at the intersection of AI/ML, Big Data
    and the Cybersecurity problem space
  - Have experience deploying services on cloud computing
    platforms (e.g, AWS, Azure, GCP)
  - Continuously learn and expand your technical horizons
  - Work as part of a team of highly skilled software
    professionals.
  - Are an expert using common tools for executing functional,
    load and fuzz testing (e.g. Locust, CATS)
  - Have worked on distributed systems and microservices
    architecture (preferred)
  
  On-Camera Policy
  
  To support a fair, transparent, and engaging interview
  experience, candidates interviewing remotely are expected to
  be on camera during all video interviews. Being on camera
  fosters authentic connection, improves communication, and
  allows for full engagement from both candidates and
  interviewers. We understand that technical, bandwidth, or
  location-related challenges may occasionally prevent video
  use. If this applies, candidates are required to notify us
  in advance so we can explore appropriate accommodations.
  
  
  
  About Arctic Wolf
  
  At Arctic Wolf, we foster a collaborative and inclusive work
  environment that thrives on diversity of thought,
  background, and culture. This is reflected in our multiple
  awards, including Top Workplace USA (2021-2025), Best Places
  to Work – USA (2021-2025), Great Place to Work – Canada
  (2021-2024), Great Place to Work – UK (2024-2026), and
  Kununu Top Company – Germany (2024-2026). Our commitment to
  bold growth and shaping the future of security operations is
  matched by our dedication to customer satisfaction, with
  over 10,000 customers worldwide and more than 2,000 channel
  partners globally. As we continue to expand globally and
  enhance our technology, Arctic Wolf remains the most trusted
  name in the industry.
  
  
  
  Our Values
  
  Arctic Wolf recognizes that success comes from delighting
  our customers, so we work together to ensure that happens
  every day. We believe in diversity and inclusion and truly
  value the unique qualities and unique perspectives all
  employees bring to the organization. And we appreciate
  that—by protecting people’s and organizations’ sensitive
  data and seeking to end cyber risk— we get to work in an
  industry that is fundamental to the greater good.
  
  
  
  We celebrate unique perspectives by creating a platform for
  all voices to be heard through our Pack Unity program. We
  encourage all employees to join or create a new alliance.
  See more about our Pack Unity here.
  
  
  
  We also believe and practice corporate responsibility, and
  have recently joined the Pledge 1% Movement, ensuring that
  we continue to give back to our community. We know that
  through our mission to End Cyber Risk we will continue to
  engage and give back to our communities.
  
  
  
