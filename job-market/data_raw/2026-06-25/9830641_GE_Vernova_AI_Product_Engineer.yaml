description: |
  Job Description SummaryWind DT has launched Wind.AI, a
  vision to enable and accelerate the transformation of the
  Wind business through embedding AI in every business
  process. A highly agile, multi-disciplinary data & AI-
  focused team will be created to shape this vision and work
  with all Wind DT functions for successful execution of this
  vision Wind.AI is the Wind business’s platform for
  accelerating the use of data and AI in ways that are secure,
  scalable, and aligned to business priorities. The platform
  is designed to help teams move from isolated experimentation
  to repeatable delivery by providing common tools, standards,
  workflows, and enablement across a range of use cases.
  Wind.AI supports efforts such as: ● enabling AI-powered
  workflows and applications ● improving RAPID access to
  trusted data and reusable platform services ● supporting
  faster experimentation, prototyping, and deployment ●
  establishing common patterns for governance, safety, and
  responsible AI use ● helping business and technical teams
  collaborate more effectively around AI solutions
  
  Job Description
  
  In support of this, we are hiring technical and product
  management individuals who will be within the Wind AI COE
  and focus on different areas including: product management,
  architecture, AI solutioning, AI prompting & configuration
  and AI-Enabled development as well as a strong focus on data
  engineering.
  
  This is not a traditional program but the creation of a
  focused way to work and deliver. From day one, you will own
  real work, collaborate with senior stakeholders, and
  directly shape how Wind.AI capabilities are delivered and
  adopted across the Wind business. The cohort structure means
  you will grow alongside peers across disciplines, creating a
  network of practitioners who understand both the technical
  and strategic dimensions of AI-enabled delivery in an
  industrial and renewable energy environment.
  
  Required Skills & Focus Opportunities
  
  - Own and prioritize the product backlog for assigned Wind.AI
    modules and capabilities
  - Facilitate discovery sessions with stakeholders across the
    Wind business
  - Define acceptance criteria and success metrics for AI-
    enabled features
  - Coordinate sprint planning, demos, and retrospectives
  - Track adoption and surface insights to inform roadmap
    decisions
  - Conduct opportunity assessments to identify AI use cases
    with business value
  - Design end-to-end solution concepts in collaboration with
    engineering and platform teams
  - Evaluate AI vendors, models, and APIs for fit, feasibility,
    and scalability
  - Document solution blueprints and present recommendations to
    stakeholders
  - Support pilots and proof-of-concept initiatives through to
    handoff or production planning
  - Develop and iterate on system prompts, prompt libraries, and
    reusable templates
  - Design multi-step AI workflows using no-code and low-code
    tooling where appropriate
  - Test model outputs for accuracy, tone, safety, and relevance
  - Build evaluation frameworks to measure prompt and model
    performance
  - Collaborate with product and engineering teams to embed
    prompts into Wind.AI features and workflows
  - Develop features and integrations that extend Wind.AI
    capabilities
  - Build data pipelines, APIs, and automation scripts
  - Contribute to code reviews with a focus on AI-generated code
    quality, maintainability, and safety
  - Integrate LLM APIs and third-party AI services into platform
    modules
  - Document technical implementations and support knowledge
    sharing across the team
  
  Qualifications
  
  - Completion of the DTDP leadership program
  - Bachelor’s degree in any discipline (Business, Computer
    Science, Engineering, Data Science, Liberal Arts, and
    others are all welcome)
  - Genuine curiosity and passion about AI and data-driven ways
    of working
  - Strong communication skills with the ability to explain
    complex ideas clearly to mixed audiences
  - Comfort with ambiguity and a bias toward action in fast-
    moving environments
  - Collaborative mindset with the ability to work across
    product, technology, and business teams
  - Interest in contributing to the digital and AI
    transformation of the Wind business
  
  Preferred
  
  - Exposure to product management frameworks (Agile, Scrum,
    Jobs-to-be-Done)
  - Familiarity with AI/ML concepts, APIs, or solution design
    patterns
  - Experience with prompt engineering, LLM tools, or
    conversational AI platforms
  - Proficiency in Python, JavaScript, SQL, or similar;
    experience with Git
  
  What You’ll Work On
  
  You may contribute to initiatives such as:
  
  - shaping AI-enabled workflows that improve how teams operate
    across the Wind business
  - helping define and scale reusable capabilities within
    Wind.AI
  - supporting platform adoption through practical tools,
    patterns, and user-centered design
  - accelerating experimentation while maintaining appropriate
    governance and quality standards
  - translating business needs into AI-enabled solutions that
    can be delivered responsibly and at scale
  
  Additional Information
  
  Relocation Assistance Provided: No
