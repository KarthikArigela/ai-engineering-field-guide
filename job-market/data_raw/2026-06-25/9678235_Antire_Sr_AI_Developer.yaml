description: |
  AI Developer – Pune, India
  
  Join one of the fastest-growing Nordic tech consultancies –
  now expanding in India.
  
  At Antire, we don’t just talk about AI — we build it. We’re
  a team of engineers, designers, and innovators creating real
  value through data, automation, and intelligence. Now we’re
  looking for an AI Developer in Pune to help us shape the
  next generation of agentic AI solutions — systems that can
  reason, plan, and act.
  
  About the role
  
  You’ll work at the intersection of AI, software, and data,
  developing intelligent systems that move beyond static
  automation — towards autonomy and reasoning.
  
  Some days you’ll be coding deep within the logic of a multi-
  agent system. Other days, you’ll be designing reusable
  frameworks and scalable components that help our AI think,
  learn, and act smarter.
  
  You write code that’s not just functional — it’s beautiful,
  maintainable, and built to last. Code that others can read,
  reuse, and build upon.
  
  We’re not looking for someone who just uses AI — we’re
  looking for someone who creates it.
  
  We believe you have
  
  - 5–8 years of experience in software development
  - Strong coding skills in Python and Java
  - Hands-on experience with AI/ML frameworks (OpenAI,
    LangChain, LlamaIndex, etc.)
  - Proven ability to write clean, modular, and reusable code
  - Experience with cloud environments (Azure, AWS, or GCP)
  - Curiosity for autonomous systems, reasoning engines, and
    multi-agent design
  - Based in or near Pune, and comfortable collaborating across
    time zones
  
  Who we are
  
  Antire is a Nordic tech consultancy specializing in AI, ERP,
  Cloud, and Data. We’ve been recognized as one of Norway’s
  Gaselle Companies of 2024, and we’re now expanding in India
  to strengthen our global AI innovation footprint.
  
  Here, technology meets creativity — and execution meets
  exploration.
  
  Why join us
  
  - Build real-world agentic AI solutions with international
    clients
  - Work in a human-first, innovation-driven Nordic culture
  - Collaborate with AI specialists and engineers across
    continents
  - Grow in an environment where craftsmanship and curiosity
    matter
  
  Hvorfor Antire?
  
  Fordi du får bygge ting som har en plass i fremtiden . Hos
  oss er det fag, ikke hierarki, som teller. Vi bygger med
  data, sky og AI – og vi gjør det sammen. Her får du kolleger
  som både kan utfordre deg faglig og backe deg sosialt. Vi
  heier på frihet, eierskap og læring – og vi gir deg rommet
  til å skape ting du faktisk er stolt av.
  
  Ready to code the next generation of intelligent systems?
  Send us an application and let’s get to know each other.
