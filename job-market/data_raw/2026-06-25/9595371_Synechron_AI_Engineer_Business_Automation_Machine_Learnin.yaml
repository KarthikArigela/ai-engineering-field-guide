description: |
  Job Summary Synechron is seeking an experienced AI Engineer
  specializing in Business Requirement Automation to lead the
  design, development, and deployment of intelligent
  automation solutions. This role involves leveraging emerging
  technologies such as AI, blockchain, and IoT to streamline
  business processes, improve efficiency, and enable data-
  driven decision making. The successful candidate will play a
  key role in driving innovation, mentoring team members, and
  ensuring the successful delivery of complex automation
  projects aligned with organizational goals.
  
  Software Requirements
  
  
  Required Software Skills:
  
  - Strong expertise in AI technologies, including machine
    learning, natural language processing, and automation
    tools
  - Proficiency in programming languages such as Python, Java,
    or R, with experience in developing AI models and
    algorithms
  - Familiarity with AI frameworks like TensorFlow, PyTorch, or
    Keras
  - Experience working with cloud platforms such as AWS, Azure,
    or GCP for deploying AI solutions
  - Knowledge of data management, ETL processes, and data
    pipeline development
  - Understanding of software development lifecycle and Agile
    methodologies
  - Experience with version control systems like Git
  
  Prioritized skills include experience with automation tools,
  API integration, and data privacy/security protocols.
  
  Optional but preferred:
  
  - Experience with blockchain, IoT, and other emerging digital
    technologies
  - Knowledge of DevOps practices and automation pipelines
  
  Overall Responsibilities
  
  - Lead the development and implementation of AI-driven
    automation projects to enhance business processes and
    operational efficiency
  - Mentor and guide technical team members in AI, machine
    learning, and automation best practices
  - Evaluate and recommend new technology solutions to improve
    existing business workflows
  - Collaborate with cross-functional teams including business
    analysts, data scientists, and IT to define requirements
    and deliver scalable solutions
  - Stay current with the latest trends in AI, automation, and
    emerging technologies to ensure innovative project
    delivery
  - Conduct technical reviews, ensure best coding practices, and
    manage project documentation
  - Oversee the deployment, testing, and performance tuning of
    AI models and automation workflows
  
  Technical Skills (By Category)
  
  - Programming Languages: Python (required), Java, R, or others
    (required)
  
  - AI Frameworks & Libraries: TensorFlow, PyTorch, Keras
    (required)
  
  - Data Management: Data pipelines, ETL tools, SQL and NoSQL
    databases
  
  - Cloud Technologies: AWS, Azure, GCP (preferred)
  
  - Automation Tools: RPA frameworks, scripting, API
    integrations
  
  - DevOps & CI/CD: Jenkins, Docker, Kubernetes (preferred)
  
  - Security & Compliance: Data privacy regulations, security
    protocols for AI deployment
  
  Experience Requirements
  
  - Minimum of 7+ years of experience in AI, automation, or
    related enterprise technology projects
  - Proven track record of leading automation initiatives that
    leverage AI, Blockchain, or IoT technologies
  - Demonstrable success in managing cross-functional teams and
    delivering end-to-end projects
  - Experience in designing scalable machine learning models and
    deploying them in production environments
  - Prior experience in industries such as finance, banking, or
    enterprise solutions is advantageous
  - Alternative experience pathways: extensive experience in AI-
    driven projects or certifications in emerging technologies
  
  Day-to-Day Activities
  
  - Manage and oversee development, testing, and deployment of
    AI and automation solutions
  - Provide technical mentorship and training to junior team
    members
  - Lead cross-functional collaboration to align technical
    solutions with strategic objectives
  - Conduct evaluations of new tools, frameworks, and emerging
    technologies for automation potential
  - Troubleshoot implementation issues and optimize AI models
    for performance and accuracy
  - Ensure compliance with data governance, security, and
    privacy standards
  - Facilitate agile ceremonies such as planning, stand-ups, and
    retrospectives
  
  Qualifications
  
  - Bachelor’s or Master’s degree in Computer Science, Data
    Science, Information Technology, or related field
  - Relevant certifications in AI, Machine Learning, or Digital
    Innovation (e.g., TensorFlow Developer Certificate, RPA
    certifications)
  - Continuous learning attitude to stay updated on industry
    advancements and technological trends
  
  Professional Competencies
  
  - Strong analytical and problem-solving skills, with the
    ability to translate business needs into technical
    solutions
  - Leadership qualities to guide and motivate cross-functional
    teams
  - Excellent communication skills to manage stakeholder
    expectations and explain complex technical concepts to
    non-technical audiences
  - Adaptability to rapid technological changes and evolving
    project priorities
  - Innovation mindset, focusing on scalable and sustainable
    automation solutions
  - Effective time management and organizational skills to
    deliver results within tight deadlines
  
