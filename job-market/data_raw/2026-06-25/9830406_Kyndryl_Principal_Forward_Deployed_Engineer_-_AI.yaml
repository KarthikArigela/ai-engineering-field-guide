description: |
  Who We Are
  
  At Kyndryl, we run and reimagine the mission-critical
  technology systems that drive advantage for the world’s
  leading businesses.  We are at the heart of progress; with
  proven expertise and a continuous flow of AI-powered
  insight, enabling smarter decisions, faster innovation, and
  a lasting competitive edge. For our people—Kyndryls—that
  means doing purposeful work that powers human progress. Join
  us and experience a flexible, supportive environment where
  your well-being is prioritized and your potential can
  thrive.
  
  The Role
  
  About the Role :
  
  At Kyndryl, we don’t just build technology - we deploy it
  where it matters most. As a Forward Deployed Engineer,
  you’ll work at the intersection of AI innovation and real-
  world impact, embedding with customers to solve their
  toughest challenges. You’ll have the autonomy to move fast,
  the backing of a global AI ecosystem, and the chance to
  shape solutions that redefine industries. If you want to own
  outcomes, not just code, and thrive in environments where
  speed and creativity win, this is your next mission.
  
  This isn't traditional consulting or pure software
  engineering - it's a hybrid model built for the complexity
  of real-world AI deployment, where you're accountable for
  outcomes, not just deliverables.
  
  This role blends deep engineering expertise with client
  engagement, enabling you to deliver tailored solutions that
  drive measurable business outcomes.  You’ll operate in
  dynamic environments, working closely with client teams, on-
  site as needed, to scope, prototype, and deploy solutions at
  speed. You’ll leverage cutting-edge technologies such as
  Generative AI, Agentic AI architectures, policy-as-code, and
  multi-agent ecosystems, while feeding insights back into
  Kyndryl’s platforms and frameworks to accelerate future
  deployments.
  
  If you thrive on solving complex problems, enjoy working
  directly with customers, and want to shape the future of
  enterprise AI, this role is for you.
  
  Key Responsibilities
  
  - Owns client relationship, scoping, delivery assurance,
    escalation, and team coordination across FDE squads for AI
    solutions
  - Sets technical direction, advise C-suite, shape strategy,
    lead multiple squads
  - Interacts with Client teams, understand the requirements,
    datasets to determine and refine objectives.
  - Contribute to building the solution and own the end-to-end
    technical delivery of workstream's including Hands-On
    delivery of Agentic AI solutions
  
  - Continuously monitor progress and measure alignment with
    expected customer outcomes.
  - Mentor FDEs on potential solutions and contribute to their
    upskill.
  - Rapid Prototyping: Build and iterate custom AI solutions
    tailored to customer needs, leveraging agentic AI
    frameworks.
  - Ownership, Deployment & Partnership: Own delivery end to
    end, from scoping to production. Working as part of the
    customer team to engineer and deploy production‑ready
    solutions that drive adoption and measurable business
    outcomes.
  - Optimisation: Troubleshoot and enhance system performance,
    scalability, and reliability.
  - Field Intelligence: Systematically capture deployment
    learnings, document best practices, and proactively share
    insights to inform enhancements to Kyndryl’s core
    platforms and frameworks.
  - Continuous Learning: Adapt quickly to emerging technologies
    and evolving customer requirements by engaging in ongoing
    professional development.
  - Platform Contribution: Actively contribute to the evolution
    of Kyndryl’s AI platforms through feedback, code
    contributions, and collaboration with product teams.
  
  Your Future at Kyndryl Every position at Kyndryl offers a
  way forward to grow your career. We have opportunities that
  you won’t find anywhere else, including hands-on experience,
  learning opportunities, and the chance to certify in all
  four major platforms. Whether you want to broaden your
  knowledge base or narrow your scope and specialize in a
  specific sector, you can find your opportunity here.
  
  Who You Are
  
  You’re good at what you do and possess the required
  experience to prove it. However, equally as important – you
  have a growth mindset; keen to drive your own personal and
  professional development. You are customer-focused – someone
  who prioritizes customer success in their work. And finally,
  you’re open and borderless – naturally inclusive in how you
  work with others.
  
  Required Skills:
  
  - 8+ years of relevant IT experience in which at least 2 years
    of working experience in GenAI/Agentic AI Frameworks,
    Orchestration, Deployment and at least 3 years on AI
    solutions along with overall 4-5 years experience on
    software development with delivery/team ownership.
  - Proven experience of client engagement, Solutioning , owning
    and driving delivery of Agentic AI workstreams and
    delivering successful production grade systems.
  - Hands on experience with at least 2 Agentic AI frameworks
    like Langchain/Langraph, CrewAi, Google ADK or Azure AI
    Agents SDk and delivering at least 1 Agentic Solution on
    Production.
  - Hands on experience (At least 2 years) in setting up Vector
    Databases and RAG solutions.
  - Hands on with Python/Java, SQL, API development with at
    least 3-4 years hands on experience in these technologies.
  - Experience with technical delivery including hands-on
    contribution of at least 3 AI projects other than
    GenAI/Agentic AI.
  - At least 1 year experience with Data cleaning, ETL,
    batch/stream processing, orchestration
  - Solid understanding of SDLC, version control (Git & GitHub)
    and demonstrated experience of leading 1-2 projects.
  - Experience in deployment and observability of Agentic AI
    systems and workflows.
  - Excellent communication and collaboration skills.
  - Cloud Systems: Experience with cloud AI platforms (AWS,
    Azure, Google AI).
  - Willingness to travel.
  
  Education: Bachelor’s degree in Computer Science,
  Informatics, Data Science, Engineering, or related field (or
  equivalent practical experience).
  
  
  Why join us?
  
  - You will become part of a team that values pace, autonomy,
    and tangible impact. At Kyndryl, you will have full
    visibility of the delivery lifecycle, with opportunities
    to lead engagements and shape strategic direction. Our
    triad delivery model means you will work alongside experts
    in engineering, product, and consulting, fostering
    continuous learning and innovation. Career progression is
    clearly defined, from Junior to Principal levels, with
    pathways to influence the evolution of our AI platforms.
    You will contribute directly to platform development and
    see the results of your work in real-world applications.
    If you are seeking an environment where your ideas are
    valued and execution drives results, this is the place to
    make a difference.
  
  If you want to work where innovation meets execution, apply
  now
  
  Being You
  
  The “Kyn” in Kyndryl means kinship, which represents the
  strong bonds we have with each other, our customers and our
  communities. We focus on ensuring all Kyndryls feel included
  and we welcome people of all cultures, backgrounds, and
  experiences. Even if you don’t meet every requirement, we
  encourage you to apply. We believe in growth, and we’re
  excited to see what you can bring. At Kyndryl, employee
  feedback has told us that our number one driver of employee
  engagement is belonging. That sense of belonging — being a
  valued, respected, trusted member of the team — is
  fundamental to our culture and fueling great experiences for
  our customers. This dedication to welcoming everyone into
  our company means that Kyndryl gives you the ability to
  thrive and contribute to our culture of empathy and shared
  success. That’s The Kyndryl Way.
  
  What You Can Expect
  
  Your career with us isn’t just a job—it’s an adventure with
  purpose.  We offer a dynamic, hybrid-friendly culture that
  supports your well-being and empowers you to grow. Our Be
  Well programs are thoughtfully designed to support your
  financial, mental, physical, and social health—because we
  know that when you feel your best, you do your best.  From
  your very first day, you’ll dive into impactful work that
  powers the systems our customers rely on every day. You
  won’t just contribute—you’ll make a difference, tackling
  meaningful projects that sharpen your skills and fuel your
  growth. We’re here to champion your journey. With powerful
  tools to chart your career path, personalized development
  goals aligned with your ambitions, and continuous feedback
  to keep you inspired and on track, you’ll have everything
  you need to thrive and evolve. You’ll develop in-demand
  skills to grow your career and achieve your ambitions with
  access to cutting-edge learning opportunities—from
  certifications with Microsoft, Google, and Amazon to
  coaching and hands-on experiences. And through it all,
  you’ll be part of a culture that values empathy, restless
  learning, and a devotion to shared success. We want you to
  thrive here—and we’re committed to helping you do just that.
  Ready to make an impact? Join us and help shape what’s next.
  
  Get Referred!
  
  If you know someone that works at Kyndryl, when asked ‘How
  Did You Hear About Us’ during the application process,
  select ‘Employee Referral’ and enter your contact's Kyndryl
  email address.
