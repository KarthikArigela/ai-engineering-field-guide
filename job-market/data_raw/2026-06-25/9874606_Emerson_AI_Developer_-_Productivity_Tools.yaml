description: |
  In this Role, Your Responsibilities Will Be:
  
  In this role, you’ll help shape the future of intelligent
  engineering and plant operations by developing AI/ML
  solutions that simplify work, boost productivity, and unlock
  new possibilities.
  
  - You’ll create smart tools that automate control logic,
    graphics, reporting, and workflow freeing engineers to
    focus on innovation. By analyzing system data, you’ll
    uncover patterns and build predictive tools that empower
    data-driven decision-making.
  - You’ll also bring Generative AI and natural language
    processing to life, turning everyday language into
    powerful configuration elements and intelligent support
    tools.
  - Your solutions will make a difference for operators too,
    through dashboards, SOP recommendations, automated
    reports, and smarter alarm management that improve safety
    and plant performance.
  - With predictive maintenance and anomaly detection, you’ll
    help prevent issues before they happen and keep operations
    running smoothly.
  - Collaboration is at the heart of this role. Working with
    engineers, developers, and operators, you’ll design user-
    friendly tools that integrate seamlessly, all while
    ensuring security, compliance, and reliability.
  - Join us to drive innovation, share knowledge, and make AI an
    empowering force in industrial automation.
  
  Who you Are:
  
  We are looking for a proactive professional who excels in
  dynamic, fast-paced environments. You demonstrate
  exceptional initiative, confidently tackling complex
  challenges in power plant control and optimization. With a
  strong commitment to innovation and excellence, you set
  ambitious goals and uphold the highest standards in every
  project.
  
  For This Role, You Will Need:
  
  - A Bachelor’s degree (or equivalent experience) in
    Engineering, Artificial Intelligence, Data Science,
    Electrical/Computer Engineering, or a related field.
  - 2–5 years of hands-on experience in AI/ML model development,
    deployment, and optimization, with a track record of
    driving innovation and efficiency in real-world
    applications.
  
  
  
  Preferred Qualifications That Make You Stand Out:
  
  - We’re looking for someone with strong expertise in machine
    learning, deep learning, and generative AI, including LLMs
    and advanced techniques that drive automation,
    optimization, and decision support.
  - Proficiency in Python, TensorFlow/PyTorch, and MLOps is
    essential, along with hands-on experience deploying AI in
    real-world, industrial environments.
  - A background in power plant operations—such as boilers,
    turbines, combustion, and load optimization—combined with
    knowledge of control theory (PID, MPC, fuzzy logic,
    multivariable control) will help you apply AI/ML to
    optimize performance.
  - Experience with Emerson Ovation DCS or similar control
    systems is highly valued, particularly in integrating AI
    modules into engineering workflows.
  - You should bring experience in predictive maintenance,
    anomaly detection, and process optimization using time-
    series data.
  - Familiarity with responsible AI practices—such as
    explainability, bias detection, and compliance—is
    important to ensure safe adoption in critical
    infrastructure.
  - Strong communication and collaboration skills will enable
    you to connect AI innovations with domain experts and
    deliver practical, impactful solutions.
  
  Our Culture & Commitment to You:
  
  At Emerson, we prioritize a workplace where every employee
  is valued, respected, and empowered to grow. We foster an
  environment that encourages innovation, collaboration, and
  diverse perspectives—because we know that great ideas come
  from great teams. Our commitment to ongoing career
  development and growing an inclusive culture ensures you
  have the support to thrive. Whether through mentorship,
  training, or leadership opportunities, we invest in your
  success so you can make a lasting impact. We believe diverse
  teams, working together are key to driving growth and
  delivering business results.
  
  We recognize the importance of employee wellbeing. We
  prioritize providing flexible, competitive benefits plans to
  meet you and your family’s physical, mental, financial, and
  social needs. We provide a variety of medical insurance
  plans, with dental and vision coverage, Employee Assistance
  Program, 401(k), tuition reimbursement, employee resource
  groups, recognition, and much more. Our culture offers
  flexible time off plans, including paid parental leave
  (maternal and paternal), vacation and holiday leave.
  
