description: |
  About The Weather Company:
  
  The Weather Company is the world’s leading weather provider,
  helping people and businesses make more informed decisions
  and take action in the face of weather. Together with
  advanced technology and AI, The Weather Company’s high-
  volume weather data, insights, advertising, and media
  solutions across the open web help people, businesses, and
  brands around the world prepare for and harness the power of
  weather in a scalable, privacy-forward way. The world’s most
  accurate forecaster globally, the company reaches hundreds
  of enterprise clients and more than 360 million monthly
  active users via its digital properties from The Weather
  Channel (weather.com) and Weather Underground
  (wunderground.com).
  
  Job brief:
  
  The Consumer Weather Science team sits inside Science and
  Forecast Operations. We are the science engine behind
  weather.com, the Weather Channel mobile apps, and
  labs.weather.com, TWC’s experimentation surface where
  vertical consumer experiences (sailing, kiteboarding, golf,
  pollen, hiking, ski, fishing, gardening) are incubated,
  validated, and graduated into flagship products. We are a
  small, senior team of scientist-engineers who own the path
  from atmospheric model output to consumer experience,
  working closely with product, design, and engineering across
  the company. You will own the technical and scientific
  delivery of one or more consumer vertical experiences. That
  means translating model output, observations, and AI-derived
  insights into APIs, data services, and product integrations
  that serve hundreds of millions of users. Your portfolio
  will begin with outdoor sports with room to expand into
  adjacent verticals as the labs pipeline evolves. You will
  act as the science-side product owner for those verticals:
  scoping each experience with product and design partners,
  building or evolving the data backend, orchestrating model-
  evaluation work with our research scientists, integrating
  LLM-driven content generation (AI briefings, condition
  explanations, alerts), and shepherding experiences from lab
  experiments into flagship. This is a senior individual
  contributor role. You will set technical direction for your
  verticals and serve as the science-and-engineering voice in
  cross-functional working groups.
  
  The impact you'll make:
  
  - Science-side delivery of consumer vertical experiences from
    model output through production APIs to user-facing
    features
  - Data pipelines and APIs that serve forecast products derived
    from GRAF, MPAS, ECMWF, and TWC ML models to labs
    experiments and flagship apps
  - LLM-driven content generation in consumer experiences,
    including prompt engineering, evaluation harnesses, and
    guardrails
  - Reduction-to-practice work with research scientists
  - Labs-to-flagship graduations, partnering with product
    owners, designers, and front-end engineers
  - Day-to-day use of AI coding assistants and agentic workflows
    as part of how the team builds
  
  What you've accomplished:
  
  - 4+ years of software engineering with demonstrated ability
    to take projects from concept to production at consumer
    scale
  - Strong Python in a Linux/Unix environment. TypeScript or
    JavaScript for front-end integration is a plus
  - Working knowledge of atmospheric science, NWP, or a closely
    adjacent earth-science domain. You should be a credible
    scientific partner to our research scientists and able to
    make sound product calls under scientific uncertainty
  - Demonstrated daily use of AI coding assistants (Claude Code,
    Cursor, Cline, or similar)
  - AWS experience (S3, Lambda, ECS, API Gateway, SQS/SNS) and
    modern DevOps practices (CI/CD, IaC)
  - Hands-on production experience with LLM APIs, including
    prompt engineering, evaluation, guardrails, and
    observability
  - Comfort working across scientists, designers, product, and
    external partners. Strong translation skills between
    scientific nuance and product reality
  - Strong written and verbal communication; comfortable
    presenting in cross-functional and leadership settings
  
  Nice to have:
  
  - Advanced degree (M.S. or PhD) in Atmospheric Science,
    Meteorology, Oceanography, or a related field
  - Experience with meteorological data formats (GRIB, NetCDF,
    HDF, Zarr) and geospatial processing
  - Experience building consumer or outdoor vertical products
    (sailing, kiteboarding, golf, ski, hiking, fishing,
    agriculture)
  - Operationalisation of ML or AI-derived forecast products
    (downscaling, ensemble post-processing, emulators)
  - Familiarity with LLM observability and routing
    infrastructure (LiteLLM, Langfuse)
  - Experience working alongside designers and PMs in a
    labs/experimentation context
  
  Base Salary: $150,000 - $190,000
  
  The base salary offered will take into account internal
  equity and may vary depending on the candidate’s geographic
  region of work premises, job-related knowledge, skills, and
  experience, among other factors.
  
  TWCo Benefits/Perks:
  
  - Flexible Time Off program
  - Hybrid work model
  - Variety of medical insurance options including a $0 cost
    premium employee coverage
  - Benefits effective day 1 of employment include competitive
    401K match with no vesting requirement, national health,
    dental, and vision plans
  - Progressive family plan benefits
  - An opportunity to work for a global and industry-leading
    technology company
  - Impactful work in a collaborative environment
