description: |
  Founding AI Engineer
  
  Company: Valent
  
  Our LinkedIn Company Page:
  https://www.linkedin.com/company/valentprocure/ Location:
  Remote — India Type: Full-time Experience: 3+ years
  preferred
  
  About Valent
  
  Valent is building AI workflow software for compliance-heavy
  manufacturers.
  
  Our initial focus is contract manufacturers and cosmetic
  manufacturers, where teams spend enormous amounts of time
  collecting supplier documents, preparing customer evidence
  packets, responding to retailer audits, and chasing down the
  information required to keep production and commercial
  relationships moving.
  
  These workflows are high-stakes, repetitive, fragmented
  across systems, and still heavily manual. Valent turns that
  operational burden into structured, auditable, AI-assisted
  workflows that help teams move faster without losing
  control.
  
  We are looking for an AI Engineer based in India who wants
  to build real enterprise software where AI is not a novelty
  layer, but a practical system for document understanding,
  workflow automation, retrieval, reasoning, and human review.
  
  The role
  
  As an AI Engineer at Valent, you will help design and build
  the core intelligence layer of the product.
  
  You will work across document extraction, retrieval,
  workflow orchestration, evaluation, agentic task execution,
  structured data generation, and user-facing AI features.
  This is a hands-on engineering role for someone who likes
  turning messy real-world business processes into reliable
  software.
  
  You should be excited by the challenge of making AI systems
  useful in environments where accuracy, traceability, and
  user trust matter.
  
  Because Valent is an early-stage company, this role is best
  suited for someone who is comfortable with ambiguity,
  communicates clearly in a remote environment, and can take
  ownership of technical problems without needing every detail
  specified upfront.
  
  What you’ll work on
  
  You will help build systems that:
  
  - Extract structured information from supplier documents,
    specifications, certificates, declarations,
    questionnaires, audit evidence, and regulatory files.
  - Power AI-assisted workflows for document collection,
    evidence packet assembly, customer requests, and audit
    preparation.
  - Use retrieval, ranking, and document understanding to help
    users find the right evidence across fragmented sources.
  - Generate draft responses, summaries, checklists, and
    compliance artifacts that remain reviewable and auditable
    by humans.
  - Build evaluation pipelines to measure quality, reduce
    hallucination, and improve reliability over time.
  - Design AI workflows that know when to act autonomously and
    when to escalate to a human.
  - Integrate AI features into a polished enterprise product
    experience.
  
  What we’re looking for
  
  You may be a strong fit if you:
  
  - Have strong software engineering fundamentals and experience
    shipping production systems.
  - Have built with LLMs, retrieval systems, document AI,
    agents, or applied machine learning.
  - Are comfortable working across the stack when needed.
  - Can write clean, maintainable code and make sound technical
    tradeoffs.
  - Care about reliability, observability, testing, and product
    quality.
  - Can reason from first principles about when AI should
    automate, assist, or stay out of the way.
  - Are interested in messy operational workflows, not just
    clean demos.
  - Communicate clearly in writing and are comfortable working
    remotely.
  - Can overlap for part of the day with U.S. Eastern Time.
  - Want to join early and help shape the technical foundation
    of a company.
  
  Helpful experience
  
  Experience with any of the following is valuable, but not
  required:
  
  - LLM application development
  - RAG systems and vector databases
  - Document parsing, OCR, extraction, or classification
  - Evaluation frameworks for AI systems
  - Workflow automation or agentic systems
  - Enterprise SaaS
  - Compliance, supply chain, manufacturing, regulatory, or
    quality workflows
  - React, TypeScript, Node.js, Python, Postgres, or cloud
    infrastructure
  
  What makes this role different
  
  This is not a role focused on building generic chatbots.
  
  Valent is building AI for real operational work: collecting
  evidence, understanding documents, coordinating follow-ups,
  checking gaps, preparing for audits, and helping teams
  execute workflows that currently live across email,
  spreadsheets, shared drives, ERPs, and tribal knowledge.
  
  The right person will care about making AI systems that are
  accurate, useful, inspectable, and trusted by the people who
  rely on them.
  
  Why join
  
  - Work remotely from India on a U.S.-based enterprise AI
    product.
  - Build AI into workflows where the value is operational,
    measurable, and immediate.
  - Join early enough to have meaningful influence over
    architecture, product, and culture.
  - Work on hard problems at the intersection of AI, enterprise
    workflow, compliance, and manufacturing.
  - Help define what modern compliance operations software
    should look like.
  
  How to apply
  
  Send your resume, LinkedIn profile, GitHub, portfolio, or
  anything else that shows how you think and build.
  
  We are especially interested in examples of products,
  systems, or AI workflows you have shipped.
  
  Please follow our LinkedIn company page so we know you are
  not a bot :)
