title: Developer Marketer - AI observability
company: PostHog
location: USA
remote: true
work_type: FULL_TIME
description: |
  About PostHog
  
  Product development used to mean manually writing code,
  running analysis, diagnosing bugs, and rolling out changes
  using dozens of tools.
  
  PostHog is the only platform that acts like a co-pilot for
  you (and your AI agents) to do it all – autonomously.
  
  We started with open-source product analytics, launched out
  of Y Combinator's W20 cohort. We've since shipped more than
  a dozen products, including:
  
  - PostHog Code, the only AI devtool that understands your
    product, not just your codebase.
  - A built-in data warehouse, so users can query product and
    customer data together using custom SQL insights.
  - PostHog AI, an AI-powered analyst that answers product
    questions, helps users find useful session recordings, and
    writes custom SQL queries.
  
  We are:
  
  - Product-led. More than 450,000 organizations have installed
    PostHog, mostly driven by word-of-mouth. We have intensely
    strong product-market fit.
  - Default alive. Revenue is growing incredibly quickly, and
    we're very efficient. We raise money to push ambition and
    grow faster, not to keep the lights on.
  - Well-funded. We've raised more than $180m from some of the
    world's top investors. We're set up for a long, ambitious
    journey.
  
  We're focused on building an awesome product for end users,
  hiring exceptional teammates, shipping fast, and being as
  weird as possible.
  
  
  
  Things we care about
  
  - Transparency: Everyone can read about our roadmap, how we
    pay (or even let go of) people, our strategy, and how we
    work, in our public company handbook. Internally, we share
    revenue, notes and slides from board meetings, and
    fundraising plans, so everyone has the context they need
    to make good decisions.
  - Autonomy: We don’t tell anyone what to do. Everyone chooses
    what to work on next based on what's going to have the
    biggest impact on our customers, and what they find
    interesting and motivating to work on. Engineers lead
    product teams and make product decisions. Teams are
    flexible and easy to change when needed.
  - Shipping fast: Why not now? We want to build a lot of
    products; we can't do that shipping at a normal pace.
    We've built the company around small teams – autonomous,
    highly-efficient groups of cracked engineers who can
    outship much larger companies because they own their
    products end-to-end.
  - Time for building: Nothing gets shipped in a meeting. We're
    a natively remote company. We default to async
    communication – PRs > Issues > Slack. Tuesdays and
    Thursdays are meeting-free days, and we prioritize heads
    down building time over perfect coordination. This will be
    the most productive job you've ever had.
  - Ambition: We want to solve big problems. We strongly believe
    that aiming for the best possible upside, and sometimes
    missing, is better than never trying. We're optimistic
    about what's possible and our ability to get there.
  - Being weird: Weird means redesigning an already world-class
    website for the 5th time. It means shipping literally
    every product that relates to customer data. It means
    building an objectively unnecessary developer toy with
    dubious shareholder value. Doing weird stuff is a
    competitive advantage. And it's fun.
  
  Other companies would call this being a Product Marketer,
  but we're looking for someone with devtool experience, so:
  Developer Marketer.
  
  As a Developer Marketer, your job is to distil the sometimes
  chaotic happenings within PostHog into into launch plans,
  email announcements, ad concepts, growth tactics, and more.
  You'll focus on on driving awareness, adoption, and
  engagement of all our products, and you'll use a mix of
  strong communication and engineering skills to do it. You'll
  collaborate with our sales team, engineers, marketers, and
  users to strengthen our position as the default all-in-one
  devtool.
  
  In 2026, we already have a lot of new launches planned. They
  will each be entering markets with billion dollar
  competitors and it's up to you to help them break through
  and succeed. You'll have a huge amount of freedom to decide
  how to approach this, and a fun brand behind you that won't
  limit your available tactics to "another webinar, I guess".
  
  Marketers at PostHog are hands-on, T-shaped people who take
  on a lot of varied responsibilities to support users and
  other teams. You’ll be one of the key voices for our company
  and will be comfortable being very visible to users, often
  taking the lead on our newest launches or weirdest ideas.
  
  What you will be doing
  
  - Running GTM for our AI observability products. You’ll own
    the GTM strategy and execution for all our AI
    observability products. You'll take the lead on driving
    their success, from value prop to co-marketing. Expect to
    collab with other major devtools, drive beta adoption, and
    plan multiple major launches per quarter.
  - Owning launches from zero to done. You'll shape the story
    for our AI observability team. That means crafting GTM
    plans, writing announcements, managing positioning, and
    supporting adoption long after launch day. You'll help new
    ideas succeed in markets with billion-dollar incumbents.
  - Being the voice of PostHog for engineers You'll work closely
    with product engineers to make sure our products land
    well. The more comfortable you are decoding jargon and
    communicating with developers, the better.
  - Shipping. A lot. This is not a job where you write a
    strategy deck and wait. You’ll be shipping work every week
    — and learning fast from it. You'll be working across our
    Y Combinator and Startup programs, our most visible
    launches, our biggest customer comms, and more. And that's
    just on Monday.
  
  Example public issues/projects:
  
  - Product Launch: LLM Observability
  - Product Launch: Endpoints GA
  
  What you won't be doing
  
  ❌ Writing whitepapers, mission statements, or brand
  guidelines that nobody asked for.
  
  ❌ Focusing on strategy alone. You'll need to make the plan,
  then do the plan.
  
  ❌ Spending multiple quarters planning big projects which
  don't have immediate impact.
  
  ❌ Running yawn-worthy webinars and bombarding users with
  invitations to attend.
  
  ❌ Chasing vanity metrics or asking people to swap their
  email for your exec summary.
  
  Requirements
  
  - Excellent writing, researching, and communication skills
  - Development experience, though not necessarily in a formal
    role - vibecoded side projects still count
  - Experience targeting developers as customers or writing for
    technical audiences
  - Experience running email campaigns, GTM campaigns, sales
    enablement
  - Familiarity with what AI observability tools do - ideally
    you've tried ours!
  
  Nice to have
  
  - Familiarity or experience working with devtool products
  - Experience working as a product marketer, growth marketer,
    or content marketer
  
  If you have a disability, please let us know if there's any
  way we can make the interview process better for you - we're
  happy to accommodate!
  
