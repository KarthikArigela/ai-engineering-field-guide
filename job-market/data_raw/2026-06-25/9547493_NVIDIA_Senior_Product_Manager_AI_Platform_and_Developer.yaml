title: Senior Product Manager, AI Platform and Developer Productivity
company: NVIDIA
location: 
work_type: FULL_TIME
description: |
  We are seeking a Product Manager to lead strategic AI
  platform initiatives across infrastructure, silicon, and
  developer experience. You will define product vision and
  execution across AI observability, profiling, agentic
  automation, and AI-native developer workflows. Partnering
  closely with engineering, architecture, and platform teams,
  you will deliver AI-powered capabilities that improve how
  large-scale systems are built and operated across the
  organization.
  
  This is a high-visibility, high-ambiguity role requiring
  strong product judgment, systems thinking, and the ability
  to drive clarity and alignment across complex cross-
  functional initiatives. Hardware Infrastructure serves as
  the foundational platform for silicon development. We build
  and operate the systems, environments, and tools that enable
  hardware engineers to design, simulate, validate, and tape
  out chips. In addition, we support software teams
  specifically through our source control platforms, enabling
  development of new products. Our mission is to accelerate
  engineering velocity while maintaining the performance,
  efficiency, and reliability required to deliver world-class
  silicon, while ensuring seamless collaboration where
  hardware and software development intersect.
  
  What You'll Be Doing:
  
  - Define product strategy and execution across a portfolio of
    AI platform initiatives, translating ambiguous technical
    challenges into clear problem statements, product
    direction, and prioritized roadmaps.
  - Develop deep empathy for internal developers and engineering
    teams through direct engagement, turning user challenges
    into intuitive, high-impact platform capabilities.
  - Drive roadmap planning across short- and long-term horizons,
    balancing customer impact, technical feasibility,
    scalability, and strategic business priorities.
  - Identify and evaluate high-value opportunities for AI-
    powered tooling, agentic automation, and developer
    productivity improvements, with a strong focus on
    measurable adoption and operational impact.
  - Establish product success metrics and use data-driven
    insights to continuously refine prioritization, feature
    scope, and user experience.
  - Champion developer experience and UX quality by
    understanding real engineering workflows, trust dynamics
    in AI-assisted tooling, and the factors that drive
    sustained platform adoption.
  - Communicate product strategy, trade-offs, and execution
    plans clearly across technical and executive audiences,
    influencing decisions at all levels of the organization.
  - Lead cross-functional collaboration across engineering,
    infrastructure, architecture, and design teams, driving
    alignment and execution in a highly matrixed environment.
  
  What We Need to See:
  
  - BS or MS in Computer Engineering, Computer Science, or a
    related technical field, or equivalent experience.
  - 12+ years of product management experience building
    developer platforms, infrastructure products or AI/ML
    systems at scale.
  - Experience leading products that incorporate LLM-powered
    agents, autonomous workflows or AI-accelerated developer
    experiences.
  - Strong technical depth in AI/ML infrastructure, including
    distributed training, inference optimization, GPU-
    accelerated computing, and large-scale systems
    performance.
  - Experience defining and delivering observability, telemetry,
    profiling, or performance tooling for engineering
    organizations.
  - Proven experience in fostering adoption of complex
    developer-facing products across large organizations.
  - Deep familiarity with modern SDLC tooling and developer
    workflows across build, test, deployment, and runtime
    environments.
  - Outstanding systems thinking with capacity to reason across
    the stack - from hardware and infrastructure layers
    through APIs, platforms, and end-user developer
    experiences.
  - Excellent written and verbal communication; able to distill
    ambiguous technical problems into clear product
    narratives.
  
  Ways to Stand Out from the crowd:
  
  - Background in semiconductor, hardware, or systems software
    companies.
  - Experience driving enterprise quality AI product adoption -
    defining UX, measuring engagement, and working with
    internal champions.
  
  NVIDIA offers highly competitive salaries and a
  comprehensive benefits package. We have some of the most
  forward-thinking and hardworking people in the world on our
  team and our collaborative talent continues to drive
  NVIDIA's growth. We are seeking creative and independent
  engineers with real passion for technology! #LI-Hybrid
  
  Your base salary will be determined based on your location,
  experience, and the pay of employees in similar positions.
  The base salary range is 208,000 USD - 327,750 USD.
  
  You will also be eligible for equity and benefits.
  
  Applications for this job will be accepted at least until
  June 2, 2026.
  
  This posting is for an existing vacancy.
  
