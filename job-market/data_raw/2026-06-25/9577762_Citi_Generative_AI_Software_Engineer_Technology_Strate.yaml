description: |
  Do you thrive on solving complex problems and building full-
  stack solutions that make an impact? Ready to influence big
  tech decisions and help shape the technology strategy of a
  global bank?"
  
  The Chief Technology Office (CTO) is building out its
  Technology Strategy practice, which is responsible to
  develop and maintain Citi’s Technology Strategy in support
  of firm’s Businesses and Functions. As part of the
  Technology Strategy Team, the candidate will be joining an
  existing global team of technology strategy analysts,
  project/product managers and engineers.
  
  We are seeking a Generative AI Software Engineer with
  expertise in modern AI technologies and a passion for
  building exceptional AI‑first product experiences. The role
  is hands-on development role to join existing engineering
  team based out US, UK and India.
  
  You will take part in design and development of user‑facing
  capabilities for our Technology Strategy platform and our
  next generation of AI agents — including the Tech Strategy
  Assistant and the AI Metrics Assistant.
  
  What You Bring
  
  - Generative AI & LLM EngineeringExperience range – 8 to 12
    YearsStrong hands-on experience building applications
    using LLMs.Experience with Prompt Engineering, RAG
    architectures, vector databases, agent frameworks, and
    evaluation techniques.Exposure to frameworks such as
    LangChain, LangGraph, Google ADK, AutoGen, CrewAI, or
    similar.Full Stack EngineeringStrong proficiency in Python
    and modern backend development.Experience with
    TypeScript/JavaScript and modern front-end frameworks such
    as React.Ability to build end-to-end products from concept
    through deployment.Cloud & Platform EngineeringExperience
    with Docker, Kubernetes, and cloud-native
    architectures.Knowledge of AWS, Azure, or GCP
    services.Familiarity with CI/CD, observability, and
    production deployment practices.Data &
    PersistenceExperience with PostgreSQL and NoSQL
    databases.Understanding of data modeling, APIs, and
    scalable application design.Engineering ExcellencePassion
    for clean architecture, maintainable code, testing, and
    documentation.Ability to thrive in a collaborative, fast-
    paced environment.
  
  Why Join Us
  
  You will join a high-discipline, AI-first engineering team
  within Technology Strategy, building and scaling enterprise-
  grade AI agents and modernising our core strategic platform
  
