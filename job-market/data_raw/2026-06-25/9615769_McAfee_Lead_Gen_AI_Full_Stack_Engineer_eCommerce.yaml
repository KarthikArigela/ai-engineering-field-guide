description: |
  Role Overview:
  
  Join our eCommerce Team as a Lead Gen AI Full Stack, owning
  the full stack end-to-end to design and ship production
  GenAI products on AWS that transform how engineering,
  operations, and business teams work —while improving
  eCommerce products and user experience for millions of
  customers. Building intelligent, real-time experiences by
  engineering the full stack modern UIs, high-through put
  backend services, RAG systems and autonomous AI agents — on
  AWS with Claude, Bedrock and the modern LLM ecosystem.
  Success requires rapidly understanding complex distributed
  systems, debugging across the stack and shipping from
  prototype to production. This is a Hybrid position located
  at our Bangalore, India development center. You will be
  required to be on-site 2 to 3 days per week. When you are
  not working on-site, you will be working from your home
  office. We are only considering candidates within a
  commutable distance to our Bangalore office and are not
  offering relocation assistance at this time.
  
  About The Role:
  
  - Collaborate with business and engineering stakeholders to
    translate requirements into technical specifications and
    execute end-to-end delivery.
  - Engineer the full stack: modern frontends and backend
    services for our eCommerce platform serving millions of
    customers, leveraging databases to deliver scalable, high-
    performance experiences.
  - Work closely with senior leadership to drive architecture
    decisions and technical direction for GenAI initiatives —
    developing solutions that improve organizational
    productivity and customer experience.
  - Design and ship production LLM products — conversational
    chatbots, AI summarization, operational copilots powered
    by RAG pipelines (vector search, reranking), and
    autonomous AI agents with tool orchestration and safety
    guardrails.
  
  About You
  
  - 8 to 12 years of full-stack engineering with proven product
    ownership and large-scale production experience; 2+years
    shipping production LLM applications with measurable
    business impact (eCommerce domain experience is a plus).
  - Expert across modern full-stack: TypeScript, Node.js
    (NestJS), React 18, Next.js, Python (FastAPI), SQL/NoSQL
    databases, and big data ecosystem (Spark, Hadoop, Kafka,
    data lakes).
  - Strong cloud and infrastructure experience: distributed
    systems (microservices, event-driven architecture, API
    design), cloud-native AWS delivery with hands-on
    experience in Lambda, ECS/EKS, API Gateway, DynamoDB, RDS,
    S3, CloudWatch, SQS/SNS, and CI/CD pipelines.
  - Deep GenAI experience: Claude, OpenAI, AWS Bedrock,
    LangGraph, RAG systems (vector search and reranking),
    prompt engineering, and evaluation — with hands-on use of
    AI coding tools (Claude Code, Cursor, GitHub Copilot) to
    ship at high velocity.
  - Strong observability expertise — uses metrics, logs, and
    traces to understand complex distributed systems, identify
    bottlenecks, surface insights, and resolve production
    issues across the full stack.
  
  #LI-Hybrid
  
