description: |
  About the Role
  
  You will build and own payment products used by 10,000+
  merchants—payment gateways,
  
  merchant dashboards, KYC systems, and subscription engines.
  You'll work in a small squad (2-4
  
  engineers) with end-to-end responsibility from database
  schema to production deployment.
  
  AI tools (Cursor, Claude, Copilot) are part of daily
  workflow. You'll use them to accelerate
  
  development—scaffolding, debugging, documentation—while
  applying your judgment for
  
  security, edge cases, and business logic.
  
  Roles & Responsibilities
  
   Build and maintain merchant-facing products—onboarding
  flows, dashboards,
  
  payment checkout pages, transaction history
  
   Develop payment APIs—transaction processing, webhook
  handling,
  
  settlement reconciliation, refund workflows
  
   Integrate with banking and payment partners—UPI/NPCI, card
  networks, net
  
  banking, wallets, eKYC providers
  
   Design database schemas and write optimized queries for
  high-throughput
  
  transaction processing
  
   Use AI coding tools (Cursor, Claude, Copilot) to
  accelerate development—
  
  code generation, debugging, documentation, refactoring
  
   Review and validate AI-generated code for security
  vulnerabilities, edge
  
  cases, performance issues, and business logic correctness
  
   Ship features end-to-end—from understanding requirements
  to production
  
  deployment and monitoring
  
   Debug production issues, respond to incidents, and
  maintain system
  
  reliability
  
  Tech Stack
  
  React, Next.js, TypeScript, Node.js, Python, PostgreSQL,
  Redis, MongoDB, AWS, Docker,
  
  Kubernetes
  
  Requirements
  
   3-5 years building web applications with at least one
  product shipped to
  
  production
  
   Proficiency in React/Next.js and Node.js or Python
  
   Solid SQL skills—writing queries, understanding indexes,
  query optimization
  
   Experience using AI coding tools (Copilot, Cursor, or
  similar) in development
  
  workflow
  
   Ability to review and validate AI-generated code for
  correctness and security
  
   Comfortable working with ambiguous requirements and
  iterating based on
  
  feedback
  
  Good to Have
  
   Experience with payment systems, UPI integration, or
  fintech domain
  
   Exposure to LLM APIs, prompt engineering, or AI-powered
  feature
  
  development
  
   Open-source contributions or side projects demonstrating
  initiative
  
  Benefits
  
   Competitive compensation + equity
  
   Hybrid work — 3 days in office
  
   Health insurance for you and family
  
   Learning budget for courses and conferences
  
   Equipment of your choice
  
  About SabPaisa
  
  SabPaisa is an RBI-approved Payment Aggregator building
  inclusive payment infrastructure for
  
  10,000+ merchants across education, healthcare, retail, and
  services.
