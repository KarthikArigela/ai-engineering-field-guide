description: |
  Senior AI/ML Engineer – T (Remote)
  
  Experience: 5–10 Years
  
  Location: Remote
  
  Employment Type: Full-Time
  
  Important Note
  
  We are specifically looking for immediate joiners or
  candidates serving a short notice period. Candidates with
  valid career gaps are welcome to apply, provided they
  possess relevant experience and strong technical expertise.
  
  About the Role
  
  We are seeking a highly skilled and forward-thinking Senior
  AI/ML Engineer to drive AI innovation, strategy, and
  solution design across the organization. The ideal candidate
  will possess deep expertise in emerging AI technologies,
  including Agentic AI frameworks, Large Language Models
  (LLMs), Explainable AI (XAI), Federated Learning, and
  Responsible AI practices.
  
  This role requires a combination of technical leadership, AI
  research capabilities, strategic thinking, and business
  acumen to help shape the organization's future AI vision and
  roadmap.
  
  Key Responsibilities
  
  AI Strategy & Innovation
  
  - Contribute to the development and execution of enterprise AI
    strategy, roadmap, and capability-building initiatives.
  - Identify emerging AI trends, technologies, frameworks, and
    industry best practices.
  - Evaluate the business impact, feasibility, and scalability
    of new AI technologies.
  - Drive innovation initiatives and future-state AI vision
    planning.
  
  AI Solution Design
  
  - Design and architect AI-driven solutions to solve complex
    business and industrial challenges.
  - Recommend innovative AI approaches leveraging LLMs, Agentic
    AI systems, and advanced machine learning techniques.
  - Assess solution viability, scalability, risk, and expected
    business value.
  
  Research & Technology Evaluation
  
  - Conduct market research, competitive analysis, and
    technology scouting.
  - Evaluate emerging AI platforms, tools, models, and
    frameworks.
  - Analyze opportunities for AI adoption across business
    functions and operational processes.
  
  AI Governance & Responsible AI
  
  - Establish AI governance frameworks, policies, and standards.
  - Define ethical AI guidelines and responsible AI practices.
  - Ensure compliance with regulatory, security, privacy, and
    risk management requirements.
  - Drive Explainable AI (XAI) adoption to improve transparency
    and trustworthiness of AI systems.
  
  Stakeholder Collaboration
  
  - Partner with business leaders, product teams, architects,
    and engineering teams to align AI initiatives with
    organizational objectives.
  - Present AI strategy recommendations, technical assessments,
    and innovation proposals to leadership teams.
  - Facilitate cross-functional collaboration to accelerate AI
    adoption and transformation.
  
  Advanced AI Capabilities
  
  - Explore and implement advanced AI concepts including:
  - Agentic AI Frameworks
  - Large Language Models (LLMs)
  - Explainable AI (XAI)
  - Federated Learning
  - Responsible AI & Governance
  - AI Agents & Multi-Agent Systems
  - AI Orchestration Frameworks
  - Generative AI Solutions
  
  Required Skills & Qualifications
  
  Must-Have Skills
  
  - AI Strategy & Roadmap Development
  - Agentic AI Frameworks
  - Large Language Models (LLMs)
  - AI Governance & Responsible AI
  - AI Research & Technology Evaluation
  - Explainable AI (XAI)
  - Federated Learning
  - AI Solution Design & Innovation
  
  Technical Expertise
  
  - Strong understanding of Machine Learning and Deep Learning
    architectures.
  - Hands-on experience with Generative AI and Foundation
    Models.
  - Experience with AI orchestration frameworks such as
    LangChain, LangGraph, CrewAI, AutoGen, or similar.
  - Knowledge of RAG (Retrieval-Augmented Generation)
    architectures.
  - Experience evaluating and integrating AI platforms and cloud
    AI services.
  - Familiarity with MLOps and AI deployment best practices.
  
  Preferred Qualifications
  
  - Experience defining enterprise AI governance policies and
    frameworks.
  - Knowledge of AI risk management and compliance standards.
  - Experience working with multi-agent systems and autonomous
    AI workflows.
  - Strong analytical, problem-solving, and strategic planning
    skills.
  - Excellent communication and stakeholder management
    abilities.
  
  Education
  
  Bachelor's or Master's degree in Computer Science,
  Artificial Intelligence, Machine Learning, Data Science, or
  a related field.
  
  Why Join Us?
  
  - Opportunity to shape enterprise-wide AI strategy and
    innovation.
  - Work on cutting-edge AI technologies including Agentic AI
    and Generative AI.
  - Fully remote work environment.
  - High-impact role with significant visibility and leadership
    exposure.
  - Opportunity to influence the future AI vision of the
    organization.
  
