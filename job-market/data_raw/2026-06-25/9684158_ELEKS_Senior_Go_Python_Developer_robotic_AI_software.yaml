description: |
  ELEKS Software Engineering and Development Office is looking
  for a Senior Python + Go Developer in Eastern Europe or
  Argentina.
  
  
  
  ABOUT PROJECT
  
  Our client is one of the leading companies in robotic AI
  software, powering the world’s largest fleet of autonomous
  mobile robots (AMRs) operating in commercial public spaces.
  These robots are transforming industrial cleaning and
  e-commerce by solving real-world challenges - and you’ll
  have the opportunity to contribute to this innovative
  project.
  
  REQUIREMENTS
  
  - Strong experience with Python and Golang, including
    developing microservices and backend services
  - Hands-on experience with BigQuery, including configuration
    and integration
  - Experience with large-scale data processing solutions using
    Apache Beam and Google Cloud Dataflow
  - Strong understanding and hands-on experience with RESTful
    API design and development
  - Practical experience working with Google Cloud Platform
    (GCP)
  - Experience working with cloud-native architectures,
    distributed systems, and service integrations
  - Hands-on experience with Infrastructure as Code (IaC) using
    Pulumi and TypeScript
  - Proven ability to test, debug, and troubleshoot distributed
    systems
  - Upper-Intermediate level of English or higher (written and
    spoken)
  
  RESPONSIBILITIES
  
  - Design, develop, and maintain Python- and Go-based
    microservices for customer data ingestion and processing
  - Build and integrate backend services with BigQuery and other
    cloud-based data platforms
  - Design, implement, and maintain REST APIs and service
    integrations
  - Develop and optimize scalable data processing solutions in a
    cloud environment
  - Test, debug, troubleshoot, and improve the reliability of
    distributed systems
  - Analyze requirements, review technical designs, and estimate
    implementation efforts following project methodologies
    (Agile, Waterfall, etc.)
  - Proactively identify opportunities for code refactoring,
    performance optimization, and system improvements
  - Support less experienced developers through knowledge
    sharing, mentoring, and technical guidance
  - Stay up to date with modern technologies and software
    engineering best practices
  
  WHAT YOU WILL GET WITH ELEKS
