description: |
  We're looking for a Staff Engineer who can lead both product
  engineering and cloud infrastructure across a mature .NET
  platform running on AWS. Your immediate focus will be
  helping modernize and scale a business-critical application
  using C#, .NET, React, TypeScript, AWS, and CI/CD
  automation.
  
  What's particularly interesting about this opportunity is
  where the platform is headed next.
  
  As part of the long-term technology strategy, you'll play a
  key role in evaluating and driving the evolution of the
  platform toward a more modern architecture centered around
  React, Node.js, AWS Cloud Services, AI-powered capabilities,
  and cloud-native engineering practices. This means you'll
  not only help solve today's engineering challenges but also
  influence the future technical direction of the product.
  
  For engineers who enjoy owning architecture, cloud
  infrastructure, DevOps, and product delivery end-to-end—and
  who are excited by the opportunity to work with the
  technologies shaping the next generation of software
  platforms—this role offers the chance to have a significant
  impact at the Staff Engineer level.
  
  
  
  What You’ll Do
  
  - Lead architecture and development across enterprise .NET
    applications using C#, ASP.NET MVC, and modern backend
    engineering practices
  - Design and maintain AWS cloud infrastructure using AWS CDK
    in TypeScript across multi-environment deployments
  - Build and optimize CI/CD pipelines using AWS CodePipeline
    and CodeBuild, including Windows-based build agents for
    .NET workloads
  - Own infrastructure provisioning, deployment orchestration,
    release automation, and environment management strategies
  - Develop and maintain React and TypeScript frontend
    applications integrated with .NET backend services
  - Drive modernization initiatives including clean architecture
    adoption, refactoring, and technical debt reduction
  - Design scalable PostgreSQL and MSSQL database solutions with
    strong focus on schema design, query optimization, and
    performance tuning
  - Troubleshoot complex infrastructure, deployment, and
    platform issues across application and cloud environments
  - Champion DevOps best practices including automation,
    operational excellence, monitoring, governance, and
    deployment reliability
  - Monitor platform health, cloud costs, observability, and
    incident response processes across AWS environments
  - Collaborate with engineering teams to improve developer
    workflows, reduce operational toil, and increase
    engineering efficiency
  - Mentor engineers on cloud engineering, CI/CD, AWS best
    practices, software design, and scalable system
    architecture
  - Contribute to future platform evolution initiatives
    including MERN stack modernization planning and cloud-
    native architecture adoption
  
  What You’ll BringRequired Qualifications
  
  - 10+ years of experience delivering scalable enterprise
    software solutions while owning both application
    development and cloud infrastructure
  - Strong expertise in C# and .NET technologies including
    ASP.NET MVC, Web Forms, and enterprise backend
    architecture
  - Proven experience leading technical initiatives, mentoring
    engineers, and influencing engineering standards across
    teams
  - Strong understanding of modern software design principles
    including SOLID principles, clean architecture, and
    scalable engineering practices
  - Hands-on experience designing and operating AWS cloud
    infrastructure in production environments
  - Experience building secure, scalable CI/CD pipelines and
    deployment automation systems
  - Bachelor’s degree in Computer Science, Engineering, or
    equivalent professional experience
  
  Hands-On Technical ExpertiseApplication Development
  
  - C#, .NET, ASP.NET MVC
  - React and TypeScript frontend development
  - PostgreSQL and MSSQL database design and optimization
  - REST APIs and enterprise application architecture
  
  AWS Cloud & Infrastructure
  
  - AWS CDK in TypeScript
  - Lambda, EC2, ECS, S3, IAM, VPC
  - CloudWatch, Secrets Manager, Systems Manager
  - CodePipeline, CodeBuild, CloudFormation
  - Infrastructure as Code and deployment automation
  
  DevOps & Platform Engineering
  
  - CI/CD pipeline architecture and release engineering
  - Windows build agents for .NET applications
  - Monitoring, observability, and operational excellence
  - Scalability, security, governance, and cloud reliability
    best practices
  
  Nice to Have (We’ll Support You If You Don’t Yet)
  
  - Docker and ECS for containerized workloads
  - GitHub Actions or additional CI/CD tooling
  - Multi-account AWS environments and AWS Organizations
  - Node.js ecosystem experience relevant to MERN modernization
    initiatives
  - Monitoring and observability platforms such as Datadog or
    Grafana
  - Enterprise security and compliance standards including SOC
    2, ISO, or PCI
  - AWS cost optimization and FinOps practices
  - Exposure to AI/ML integrations including AWS Bedrock, MCP
    servers, or RAG-based systems
  
  About Us
  
  Diligent is the AI leader in governance, risk and compliance
  (GRC) SaaS solutions, helping more than 1 million users and
  700,000 board members to clarify risk and elevate
  governance. The Diligent One Platform gives practitioners,
  the C-Suite and the board a consolidated view of their
  entire GRC practice so they can more effectively manage
  risk, build greater resilience and make better decisions,
  faster.
  
  At Diligent, we're building the future with people who think
  boldly and move fast.  Whether you're designing systems that
  leverage large language models or part of a team reimaging
  workflows with AI, you'll help us unlock entirely new ways
  of working and thinking.  Curiosity is in our DNA, we look
  for individuals willing to ask the big questions and
  experiment fearlessly - those who embrace change not as a
  challenge, but as an opportunity.  The future belongs to
  those who keep learning, and we are building it together.
  At Diligent, you’re not just building the future - you’re an
  agent of positive change, joining a global community on a
  mission to make an impact.
  
  Learn more at diligent.com or follow us on LinkedIn and
  Facebook
  
  What Diligent Offers You
  
  - Creativity is ingrained in our culture. We are innovative
    collaborators by nature. We thrive in exploring how things
    can be differently both in our internal processes and to
    help our clients
  - We care about our people. Diligent offers a flexible work
    environment, global days of service, comprehensive health
    benefits, meeting free days, generous time off policy and
    wellness programs to name a few
  - We have teams all over the world. We may be headquartered in
    New York City, but we have office hubs in Washington D.C.,
    Vancouver, London, Galway, Budapest, Munich, Bengaluru,
    Singapore, and Sydney.
  - Diversity is important to us. Growing, maintaining and
    promoting a diverse team is a top priority for us. We
    foster and encourage diversity through our Employee
    Resource Groups and provide access to resources and
    education to support the education of our team, facilitate
    dialogue, and foster understanding.
  
  Diligent created the modern governance movement. Our world-
  changing idea is to empower leaders with the technology,
  insights and connections they need to drive greater impact
  and accountability – to lead with purpose. Our employees are
  passionate, smart, and creative people who not only want to
  help build the software company of the future, but who want
  to make the world a more sustainable, equitable and better
  place.
  
  Headquartered in New York, Diligent has offices in
  Washington D.C.,  London, Galway, Budapest, Vancouver,
  Bengaluru, Munich, Singapore and Sydney.   To foster strong
  collaboration and connection, this role will follow a hybrid
  work model. If you are within a commuting distance to one of
