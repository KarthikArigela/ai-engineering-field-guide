description: |
  Description
  
  AI/Data Engineer – Snowflake, DBT, Python Focus
  
  We are seeking a highly motivated AI/Data Engineer with
  strong expertise in Snowflake, DBT, and Python to design,
  build, and scale modern data platforms that enable advanced
  analytics and AI-driven use cases.
  
  This role is ideal for a candidate with a strong data
  engineering foundation who can support AI initiatives,
  rather than a purely research-focused AI profile. Basic
  exposure to AI/ML concepts is sufficient.
  
  Key Responsibilities
  
  - Design, build, and maintain scalable data platforms,
    pipelines, and data products to support analytics and AI
    use cases
  - Develop robust and production-grade data workflows using
    Python, Snowflake, and DBT
  - Build and optimize ELT/ETL pipelines for large-scale
    structured and unstructured datasets
  - Leverage DBT for data transformation, modeling, testing, and
    documentation
  - Optimize Snowflake architecture, performance, and cost
    efficiency for enterprise data workloads
  - Develop and maintain data models, data marts, and semantic
    layers
  - Support AI/ML initiatives by preparing high-quality datasets
    and enabling downstream model consumption
  - Collaborate with Data Scientists and ML Engineers to
    operationalize basic AI/ML workflows
  - Build APIs and backend services to expose data and AI
    capabilities
  - Ensure high standards of data quality, governance, security,
    and scalability
  
  Required Skills & Experience
  
  - 3–7 years of experience in Data Engineering, AI Engineering,
    or related roles
  - Strong hands-on expertise in:
  - Python (core requirement)
  - Snowflake (core requirement)
  - DBT (core requirement)
  - Advanced SQL skills and strong understanding of data
    modeling and data architecture
  - Proven experience building scalable ETL/ELT pipelines in
    cloud environments
  - Experience working with modern data stacks and cloud
    platforms (AWS, Azure, or GCP)
  - Strong experience in data transformation, data warehousing,
    and pipeline optimization
  - Ability to work independently in a fast-paced, delivery-
    focused environment
  
  AI / Machine Learning (Secondary Requirement)
  
  - Basic understanding of machine learning concepts and
    workflows
  - Exposure to AI/ML or Generative AI use cases (nice to have,
    not mandatory)
  - Familiarity with concepts such as LLMs, embeddings, or RAG
    architectures is an advantage, but not required
  
  Preferred Qualifications
  
  - Experience with workflow orchestration tools (e.g., Airflow,
    Prefect)
  - Exposure to API development and microservices architecture
  - Familiarity with modern AI frameworks (LangChain, Hugging
    Face, etc.)
  - Experience in high-growth or fast-paced environments
  
