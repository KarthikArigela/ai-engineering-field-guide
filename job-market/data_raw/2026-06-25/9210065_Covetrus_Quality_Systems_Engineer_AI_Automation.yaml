job_id: 9210065
title: "Quality Systems Engineer (AI & Automation)"
company: Covetrus
location: USA
work_type: FULL_TIME
description: |
  Covetrus is a global animal-health technology and services
  leader dedicated to empowering veterinary practice partners
  to drive improved health and financial outcomes. We bring
  together products, services, and technology into a single
  platform that connects our customers to the solutions and
  insights they need to work best. Our passion for the well-
  being of animals and those who care for them drives us to
  advance the world of veterinary medicine.
  
  Summary
  
  The Quality Systems Engineer (Automation & AI Focus) is
  responsible for designing, building, and optimizing
  technology-enabled quality systems across In-Clinic and
  Pharmacy Quality & Regulatory Operations.
  
  This role goes beyond traditional quality engineering by
  translating quality processes into structured, automated
  workflows and system logic. The position leverages AI tools,
  low-code platforms, and system integrations to drive
  scalable, data-driven execution of core quality processes
  (e.g., Complaint → Nonconformance → CAPA).
  
  Working closely with Quality, IT, and Operations, this role
  serves as a builder of digital quality infrastructure,
  ensuring compliance while enabling speed, consistency, and
  operational clarity. This role reports to the Quality and
  Regulatory Systems Manager.
  
  Responsibilities
  
  Automation & System Design (Core Focus)
  
  - Design, build, and deploy automated workflows and decision
    logic across quality processes using low-code platforms
    (e.g., Power Automate, Salesforce Flow) and AI-assisted
    tools.
  - Translate ambiguous or manual processes into structured,
    deterministic workflows that drive consistent execution.
  - Develop automation solutions for:
  
  - Complaint intake, triage, and escalation
  
  - Nonconformance and CAPA workflows
  
  - Supplier quality monitoring and triggers
  
  - Recall and traceability processes
  
  - Integrate systems (Salesforce, QMS, data platforms) to
    enable end-to-end process visibility and control.
  
  Technology & Data Utilization
  
  - Leverage AI tools (e.g., Copilot, ChatGPT, Claude) to:
  
  - Accelerate analysis and root cause identification
  
  - Improve workflow efficiency
  
  - Support decision-making frameworks
  
  - Build and maintain dashboards, automated reporting, and data
    pipelines to monitor quality signals and trends.
  - Identify and prioritize opportunities to eliminate manual,
    repetitive, or error-prone activities through automation.
  
  Quality Systems Ownership
  
  - Administer and enhance QMS and related platforms to ensure:
  
  - Data integrity (ALCOA+)
  
  - System reliability
  
  - Regulatory compliance
  
  - Implement system-based controls that reduce variability and
    enforce process consistency.
  
  Quality Operations Enablement
  
  - Apply engineering and system-based solutions to improve:
  
  - Complaint investigations
  
  - Nonconformance management
  
  - CAPA effectiveness and timeliness
  
  - Drive improvements in:
  
  - Recall systems and traceability
  
  - Supplier quality systems and performance monitoring
  
  - DSCSA-related data exchange and system controls
  
  - In-Clinic product onboarding workflows
  
  Collaboration & Continuous Improvement
  
  - Partner with Quality, IT, Supply Chain, and Operations to
    design scalable, system-enabled solutions.
  - Provide guidance and training on automation tools,
    workflows, and system capabilities.
  - Support audits, inspections, and system validations with a
    focus on system integrity and traceability.
  - Continuously evaluate emerging technologies and apply them
    to improve quality system performance.
  
  Required Knowledge and Skills
  
  - Hands-on experience building automated workflows using low-
    code/no-code platforms (e.g., Power Automate, Salesforce
    Flow) or equivalent tools.
  - Demonstrated ability to translate processes into structured
    system logic and decision frameworks.
  - Experience leveraging AI tools (e.g., ChatGPT, Copilot,
    Claude) for workflow optimization, analysis, or
    automation.
  - Strong understanding of system integration concepts (APIs,
    data flow, platform connectivity preferred).
  - Experience with Quality Management Systems (QMS) and
    regulated environments.
  - Strong data analysis skills and experience with
    visualization tools (e.g., Tableau, Power BI).
  - Proven ability to identify automation opportunities and
    independently drive solutions from concept through
    implementation.
  - Strong technical writing skills with the ability to document
    workflows, logic, and system requirements clearly.
  - Ability to work cross-functionally and translate between
    technical and non-technical stakeholders.
  - Strong problem-solving skills with a focus on scalable,
    sustainable solutions.
  
  Preferred
  
  - Experience with Salesforce ecosystem (Flows, integrations,
    or admin-level capabilities)
  - Experience in pharmaceuticals, healthcare, or regulated
    environments
  - Knowledge of DSCSA and system-based compliance requirements
  - Experience with Computer System Validation (CSV)
  - Lean Six Sigma or similar continuous improvement
    certification
  
  Education & Experience
  
  - Bachelor’s degree in Engineering, Computer Science,
    Information Systems, or related technical field
  - 3–5+ years of experience in:
  
  - Quality systems, or
  
  - Process automation, or
  
  - Technical systems roles in regulated environments
  
  We offer the following benefits for you to take advantage of
  while you are here provided you meet the eligibility
  requirements under each governing program:
  
  - 401k savings & company match
  - Paid time off
  - Paid holidays
  - Maternity leave
  - Parental leave
  - Military leave
  - Other leaves of absence
  - Health, dental, and vision benefits
  - Health savings accounts
  - Flexible spending accounts
  - Life & disability benefits
  - Identity theft protection
  - Pet insurance
  - Certain positions may include eligibility for a short-term
    incentive plan
  
  Salary may vary depending on factors such as confirmed job-
  related skills, experience, and location. It is not typical
  for an individual to be hired at or near the top end of the
  range for their role. Compensation decisions are dependent
  upon the facts and circumstances of each case. Sales
  Positions are eligible for a Variable Incentive.
  
  The pay range for this position is as follows:
  
  $67,100-$95,800
  
  Covetrus is an equal opportunity/affirmative action
  employer. All qualified applicants will receive
  consideration for employment without regard to sex, gender
  identity, sexual orientation, race, color, religion,
  national origin, disability, protected Veteran status, age,
  or any other characteristic protected by law.
