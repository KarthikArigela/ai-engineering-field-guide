description: |
  Job Summary & Responsibilities
  
  Responsibilities include but are not limited to:
  
  - Analyze current-state business processes and identify
    opportunities for automation and AI-driven enhancement.
  - Design, develop, and maintain automation solutions using RPA
    platforms (e.g., UiPath) and AI services.
  - Build and support intelligent workflows that integrate AI
    Agents, decision logic, and orchestration across
    enterprise systems.
  - Develop and maintain Intelligent Document Processing (IDP)
    solutions leveraging OCR, document classification, data
    extraction, and validation techniques.
  - Collaborate with business and technology stakeholders to
    translate requirements into scalable automation and AI
    solutions.
  - Create and maintain technical documentation, solution
    designs, process maps, and operating procedures.
  - Perform testing, monitoring, and optimization of deployed
    automation and AI solutions to ensure reliability and
    performance.
  - Gather and analyze process and model performance metrics to
    drive continuous improvement.
  - Provide operational support and enhancements for existing
    automation and AI solutions.
  
  Preferred Qualifications
  
  Required Skills:
  
  - Understanding of business process analysis.
  - Understanding of the principles and common frameworks of
    successful business process analysis and change
    management.
  - Understanding of Robotics Process Automation (RPA) and
    tools, such as UiPath.
  - Understanding AI Tools and Industry Trends.
  - Proven ability to understand business processes and
    translate business requirements into application
    functionality.
  - Working knowledge of macro creation, as well as programming
    and SQL languages.
  - Experienced usage of the MS Office toolset (Word, Excel,
    PowerPoint, Visio).
  - Proven experience in providing service to internal
    stakeholders to achieve successful project outcomes.
  - Demonstrated capability for problem solving, decision
    making, sound judgment, assertiveness.
  - Strong analytical and trouble shooting skills -- general
    scripting skills a plus.
  
  Preferred Skills:
  
  - Experience with Agentic AI and AI workflow orchestration.
  - Exposure to Generative AI (LLMs, prompt engineering,
    copilots, or AI assistants).
  - Experience building or supporting Intelligent Document
    Processing (IDP) solutions.
  - Knowledge of OCR, Computer Vision, and document
    classification/extraction techniques.
  - Familiarity with Machine Learning concepts, model
    integration, or ML platforms.
  - Experience integrating AI and automation solutions with
    enterprise platforms (e.g., CRM, ServiceNow, core banking
    systems).
  
  Required Experience:
  
  - High School Diploma or GED equivalent.
  - Minimum of four (4) years of process analytics.
  - Familiarity with RPA technology and AI Technology.
  
  Preferred Experience:
  
  - Bachelor of Science in Computer Science, MIS, or related
    degree.
  - Financial industry or banking background.
