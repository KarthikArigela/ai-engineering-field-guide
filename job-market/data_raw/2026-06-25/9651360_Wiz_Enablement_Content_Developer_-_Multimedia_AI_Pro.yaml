  Content Developer - Multimedia & AI Production (Technical
  Enablement)
  
  SUMMARY The Content Developer is the execution powerhouse of
  our Technical Learning Design & Development team (our
  "Construction Crew"). Reporting to the Manager, Technical
  Learning Design & Development, you will bring instructional
  visions to life. Working from storyboards and design
  documents created by our Learning Experience Designers
  (LXDs) and Subject Matter Experts (SMEs), you will build,
  assemble, and polish the high-fidelity multimedia assets,
  including product demonstration videos, AI-generated video
  content, and graphics, that power our "Ramp-Readiness"
  engine.
  
  WHAT YOU’LL DO
  
  - Media & AI Production: Produce, record, and edit technical
    product walkthroughs, screencasts, and explainer videos.
    Leverage Synthesia to rapidly generate and scale AI-avatar
    videos for product updates. Create supporting visual
    assets, infographics, and job aids that simplify complex
    cloud security concepts.
  - The Execution Engine: Act as the critical execution arm for
    our core instructional assets. Turn the architectural
    blueprints from the Technical Enablement Programs team
    into reality, and equip our Technical Enablement Delivery
    & Operations team (the "Driving Instructors") with the
    high-quality materials they need to train our new hire
    cohorts.
  - Quality Assurance & Media Readiness: Rigorously test all
    visual assets for user experience (UX) and branding
    compliance before publishing. Ensure seamless integration
    and rendering within our platforms.
  - Agile Maintenance: Keep pace with our rapid product release
    cycle by quickly updating Synthesia scripts, replacing
    outdated video clips, and maintaining a highly organized
    library of raw media and project source files.
  
  WHAT YOU’LL BRING
  
  - 2+ years of hands-on experience in multimedia production,
    instructional media, or a similar execution-focused role.
  - Strong multimedia editing skills, with proficiency in
    screencasting and video editing tools (e.g., Camtasia,
    Adobe Premiere Pro) as well as graphic design basics
    (e.g., Illustrator, Photoshop, Canva).
  - Experience with AI video generation platforms, (e.g.
    Synthesia, Descript), to scale content production.
  - Expertise in rapid authoring tools, specifically the
    Articulate 360 suite (Rise, Storyline).
  - A keen eye for visual design, typography, and layout, with a
    portfolio demonstrating clean, modern, and engaging
    digital content.
  - Cloud Infrastructure: 3+ years of hands-on experience
    deploying and maintaining AWS, Azure, or GCP
    infrastructure.
  - Kubernetes & Virtualization: Direct experience configuring
    and troubleshooting Kubernetes clusters and virtualized
    environments.
  - Security & Monitoring: Practical experience managing hybrid-
    cloud identity, security protocols, and monitoring/logging
    pipelines.
  
  NICE TO HAVE
  
  - Experience working with SaaS, cloud infrastructure, or
    cybersecurity product content.
  - Animation skills (e.g., Vyond, After Effects) or
    professional voiceover experience.
  - Experience working with Learning Management Systems (LMS),
    specifically Skilljar and Intellum, and digital credential
    management (e.g. Credly, Accredible).
  - Experience using Gemini Pro as an enablement development
    tool, as well as Gemini Gems for development pipeline
    automation and learner engagement activities.
  
