description: |
  The Opportunity
  
  Euna Solutions is looking for a Staff AI Developer to help
  define and drive the technical direction of our grant
  research platform. This is a hands-on, individual
  contributor role where you’ll shape architecture, build
  critical systems, and push the boundaries of AI-enabled
  software development.
  
  You’ll work across two complementary systems:
  
  - A multi-tenant, cloud-native SaaS application built with
    Ruby on Rails (7+)
  - A Python-based data and discovery platform powered by
    FastAPI, PostgreSQL, Redis, and AI-driven ingestion
    workflows
  
  If you’re an AI-forward engineer who enjoys solving complex
  problems, working deeply in the code, and influencing system
  design at scale—this role is for you.
  
  What You’ll Do
  
  - Partner with Product to translate roadmap priorities into
    technical designs, implementation plans, and delivery
    strategies
  - Design and implement features across application, data, and
    infrastructure layers
  - Own and evolve core platform architecture across both Rails
    and Python systems
  - Make high-impact architectural decisions (service
    boundaries, modularization, data access patterns,
    scalability)
  - Build and optimize high-scale background processing systems
    (notifications, scoring, ingestion, exports, etc.)
  - Develop workflows spanning APIs, background jobs, ingestion
    pipelines, search/discovery, and reporting
  - Investigate production issues, identify root causes, and
    improve platform reliability
  - Implement AI-powered features including LLM orchestration,
    prompt workflows, and observability controls
  - Leverage AI-assisted development tools for coding, testing,
    refactoring, and documentation
  - Document architectural decisions and system behavior for
    long-term maintainability
  - Collaborate with Engineering, Product, Customer Success, and
    Support teams to continuously improve the platform
  
  What You Bring
  
  - Proven experience as a Senior or Staff-level engineer
    building production SaaS or data platforms
  - Deep expertise in Ruby on Rails, including performance,
    architecture, and long-lived systems
  - Strong hands-on experience with Python (FastAPI or similar
    frameworks preferred)
  - Experience across both application platforms and data
    systems (APIs, ingestion, pipelines, reporting)
  - Strong background in background processing systems (e.g.,
    Sidekiq, Redis, queues, schedulers)
  - Solid understanding of PostgreSQL schema design and
    performance optimization
  - Experience designing and operating production APIs (REST,
    auth, versioning, validation)
  - Comfort working in cloud-native, containerized environments
  - Experience with search and discovery systems (full-text,
    semantic, vector search)
  - A demonstrated AI-first development approach, using LLMs and
    automation tools
  - Strong understanding of security best practices (auth, data
    isolation, secrets management)
  - Experience with CI/CD pipelines, testing frameworks, and
    code quality tooling
  - Excellent communication skills, especially around technical
    decision-making
  
  Nice to Have
  
  - Experience with enterprise or government-adjacent
    applications (compliance, auditability, security)
  - Familiarity with modern Rails frontend patterns (Hotwire,
    Turbo, Stimulus, Tailwind, ViewComponent)
  - Experience with async Python, Redis Streams, or workflow
    orchestration systems
  - Hands-on experience with LLM tools (OpenAI, Anthropic),
    embeddings, or vector databases
  - Experience with observability tools (Sentry, New Relic,
    Honeybadger, etc.)
  
  Location:
  
  This position will be remote with preference given for EST
  time zone.
  
  AI Mindset at Euna Solutions We believe the future of work
  is human + AI. At Euna Solutions, we encourage our team
  members to leverage AI tools to enhance creativity,
  efficiency, and decision-making. We’re looking for people
  who are curious about emerging technologies, eager to
  experiment, and committed to using AI responsibly to
  augment—not replace—their expertise.
  
  If you enjoy exploring new ways to solve problems, learning
  continuously, and applying AI to make your work smarter and
  more impactful, you’ll thrive here.
  
