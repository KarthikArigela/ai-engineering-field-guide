description: |
  About Platform Engineering
  
  Platform Engineering (platformengineering.org) is home to
  the world's largest community of platform engineers. Through
  events like PlatformCon, which brings together over 35,000+
  participants every year, we connect thousands of
  professionals, share best practices, and help shape the
  future of how teams build and scale internal developer
  platforms.
  
  We're looking for an AI Systems Engineer to own and evolve
  the systems and data infrastructure that power our
  operations, from CRM pipelines and integrations to the
  technical backbone of our content production engine.
  
  This position is fully remote and is open to applicants
  based in Europe.
  
  What You Will Do
  
  - Own and evolve our data infrastructure: Supabase, n8n
    workflows, HubSpot integrations, and the pipelines
    connecting external platforms like Skilljar and
    HockeyStack.
  - Take technical ownership of our content factory: tooling,
    automation pipelines, and agent orchestration that let a
    small team produce at scale.
  - Think through the user journey and create UI integrations
    into existing solutions (e.g., Airtable) or buy or build
    and maintain simple UI interfaces for databases, etc.
    (search, export data, import to other workflows).
  - Keep our stack modular and replaceable, evaluating tools
    continuously and making changes before we become dependent
    on the wrong ones.
  - Reduce manual overhead systematically by building
    automations and agent workflows that replace repetitive
    processes.
  - Work with leadership as a peer on architectural decisions
    and infrastructure direction, not just as an implementer.
  
  What We're Looking For
  
  - Strong technical background: database schemas, REST/GraphQL
    API integrations, vector databases, and automation
    pipelines, end-to-end and without hand-holding.
  - Fluency with AI as a development tool. You use Claude Code,
    Cursor, or similar and actively think about where agents
    can replace manual work.
  - Commercial mindset and strong prioritization: you know which
    systems move the needle and focus there.
  - Senior enough to own a roadmap and hold architecture
    conversations with leadership.
  - Bonus: a background in software development, experience with
    HubSpot APIs, AI agent frameworks, or marketing/content
    automation.
  
  Why You'll Love Working With Us
  
  - Your work will directly enable a community of 35,000+
    platform engineers worldwide.
  - Real ownership of core infrastructure, with the autonomy to
    shape it.
  - Fully remote across Europe, strong async culture, low-ego
    team.
  - Competitive salary and room to grow as our ambitions scale.
  
  If this sounds like a fit, we would love to hear from you!
  Have questions before applying? Reach out to us at
  careers@platformengineering.org
