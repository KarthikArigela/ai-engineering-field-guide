description: |
  Scope:
  
  - The Partner Network team is responsible for the
    Commercialization of the Trading Partners on the Blue
    Yonder Network (BYN)
  - Trading Partners are companies that have joined the Blue
    Yonder ecosystem due to their partner signing up with Blue
    Yonder (BY), e.g. the Suppliers and Carriers of a Retail
    will join BYN to work with the Retailer. The Partner
    Network team works with the Carriers and Suppliers who are
    now part of the Network.
  - This Position sits at the center of the Trading Partner
    Network’s success — ensuring that strategy translates into
    execution, and that every partner interaction drives value
    for both the partner and the business.
  
  Technical Environment:
  
  - Database: Oracle, MySql
  - Reporting/Analytics: Excel, PowerBI
  
  What you’ll do:
  
  - Own the development and management of Trading Partner
    Network analytics, including dashboards, KPIs, and
    reporting to provide visibility into partner performance,
    adoption, and revenue
  - Deliver actionable insights to leadership through data
    analysis, enabling informed decision-making and continuous
    improvement
  - Utilize tools such as Power BI, SQL, Python, and other
    analytics platforms to build scalable reporting and
    perform advanced analysis
  - Apply AI/ML techniques (e.g., forecasting, trend analysis,
    anomaly detection) to enhance reporting accuracy and
    business insights
  - Define and standardize end-to-end partner processes and
    operating workflows, ensuring scalability and efficiency
  - Develop, maintain, and enforce Standard Operating Procedures
    (SOPs) across onboarding, engagement, and billing
    functions
  - Identify process gaps and lead optimization and automation
    initiatives to improve performance and reduce friction
  - Ensure pricing, billing, and commercialization models are
    accurately implemented and executed
  - Partner with Accounting and other teams to ensure complete
    and accurate revenue capture across all partner activities
  - Establish and maintain governance frameworks to ensure
    consistency, compliance, and scalability of partner
    monetization
  - Act as a cross-functional leader, collaborating with
    Product, Sales, Marketing, and Operations to align on
    partner strategy and execution
  - Support internal teams with insights into partner behavior,
    engagement trends, and pricing clarity
  - Lead the rollout of new processes, tools, and initiatives;
    develop supporting materials and train stakeholders as
    needed
  - Identify and recommend continuous improvement opportunities,
    and support implementation of strategic initiatives
  
  What we are looking for:
  
  - Bachelor’s degree in computer science, IT, or related field
    with 5–8 years of relevant experience.
  - Experience with Data Analysis and visualization tools (e.g.,
    Power BI, Excel, etc.) and SQL
  - Strong experience in perations, analytics, or business
    operations roles
  - Experience with Python, Git,  AI/ML Coding Tools (GitHub
    CoPilot, Claude Code, etc…) is Good to have
  - Proficiency in tools like JIRA, Confluence, Kibana, Lucid
    Charts, Visio is Good to have
  - Proven ability to design and scale processes in complex
    environments
  - Ability to translate data into insights and influence
    decisions
  - Strong cross-functional leadership and communication skills
  - Experience working with pricing, billing, or revenue
    operations is highly preferred
  - High ownership mindset with a bias for execution and results
  
  Our Values
  
  If you want to know the heart of a company, take a look at
  their values. Ours unite us. They are what drive our success
  – and the success of our customers. Does your heart beat
  like ours? Find out here: Core Values
  
