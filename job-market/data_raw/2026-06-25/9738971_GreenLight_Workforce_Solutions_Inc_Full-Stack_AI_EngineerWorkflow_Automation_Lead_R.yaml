description: |
  Location: Remote
  
  Type: Contract or Full-Time
  
  Company: GreenLight.ai
  
  About GreenLight.ai
  
  GreenLight operates at the intersection of global workforce
  infrastructure, compliance, operations, and AI.
  
  We provide workforce solutions for businesses and talent
  marketplaces, including EOR, AOR, freelancer management,
  onboarding, payments, and compliance operations across
  multiple countries. Our clients include some of the most
  innovative tech companies in the world and we are growing
  rapidly.
  
  We are building AI-native systems to automate complex
  operational workflows, improve decision-making, and scale
  global workforce operations without scaling headcount.
  
  This role is for someone who wants to build practical AI
  systems that solve messy real-world problems - not research
  prototypes.
  
  The Role
  
  We are looking for a hands-on Full-Stack AI Engineer who has
  experience building and shipping AI-powered products, tools,
  and operational systems in production environments.
  
  This is fundamentally a software engineering role focused on
  designing, building, and deploying AI-powered workflows,
  internal tools, assistants, and platform capabilities that
  improve scalability across GreenLight's operations and
  products.
  
  You will work directly with leadership, product, operations,
  and engineering teams to identify opportunities, build
  solutions quickly, and deploy systems that create meaningful
  operational leverage.
  
  We value builders who can move from idea to production with
  minimal oversight and who thrive in fast-moving startup
  environments.
  
  Why This Role Matters Right Now
  
  GreenLight is actively evolving into a more AI-native
  platform and operational model.
  
  Over the next 6–12 months, AI will become deeply integrated
  into:
  
  - workflow automation
  - onboarding and operational tooling
  - support systems
  - internal knowledge and retrieval systems
  - operational decision workflows
  - client and worker experiences
  
  This role will have direct influence over that direction
  from the beginning.
  
  We are looking for a hands-on Full-Stack AI Engineer who has
  experience building and shipping AI-powered products, tools,
  and operational systems in production environments.
  
  This is fundamentally a software engineering role focused on
  designing, building, and deploying AI-powered workflows,
  internal tools, assistants, and platform capabilities that
  improve scalability across GreenLight's operations and
  products.
  
