description: |
  At Relativity Space, we’re building rockets to serve today’s
  needs and tomorrow’s breakthroughs. Our Terran R vehicle
  will deliver customer payloads to orbit, meeting the growing
  demand for launch capacity. But that’s just the start.
  Achieving commercial success with Terran R will unlock new
  opportunities to advance science, exploration, and
  innovation, pioneering progress that reaches beyond the
  known.
  
  Joining Relativity means becoming part of something where
  autonomy, ownership, and impact exist at every level. Here,
  you're not just executing tasks; you're solving problems
  that haven’t been solved before, helping develop a rocket, a
  factory, and a business from the ground up. Whether you’re
  in propulsion, manufacturing, software, avionics, or a
  corporate function, you’ll collaborate across teams, shape
  decisions, and see your work come to life in record time.
  Relativity is a place where creativity and technical rigor
  go hand in hand, and your voice will help define the stories
  we’re writing together. Now is a unique moment in time where
  it’s early enough to leave your mark on the product, the
  process, and the culture, but far enough along that Terran R
  is tangible and picking up momentum. The most meaningful
  work of your career is waiting. Join us.
  
  About the Team:
  
  The Finance team spans FP&A, corporate development, and
  business operations, combining financial rigor with deep
  technical context. From shaping the company’s long-term
  strategy to supporting capital raises and driving
  operational insights, this team sits at the center of
  critical decision-making. With a small, high-impact team,
  you’ll have the opportunity to stretch across disciplines,
  influence the trajectory of the company, and deliver
  meaningful value back into the business every day.
  
  About the Role:
  
  As a Senior Data & AI Analytics Developer II you will be
  responsible for the development of enterprise-scale BI
  solutions that drive financial visibility and decision-
  making across Finance, Accounting, and partner
  organizations. This includes building complex data models,
  developing AI-driven reporting experiences, and defining our
  AI Analytics architecture. Operating with a high degree of
  autonomy, you are expected to own large-scale projects end-
  to-end, influence department-level BI strategy, and serve as
  a technical anchor and mentor for the broader team.
  
  - Architect and govern AI-powered analytics solutions across
    the organization — including deploying and optimizing
    Agentic BI platforms like Aperium to replace traditional
    BI dashboards with conversational, AI-driven insights and
    self-service analytics
  - Design and implement AI-native reporting experiences that
    deliver operational and financial insights for Finance,
    Accounting, and leadership — enabling natural language
    querying, automated insight generation, and intelligent
    data exploration
  - Own the end-to-end development of analytical data models and
    dashboards, including requirements gathering, data
    modeling, dashboard design, validation, and ongoing
    enhancements
  - Develop complex SQL transformations to build reliable models
    from multiple source systems (ERP, MES, HRIS), ensuring
    accuracy through robust testing and reconciliation
  - Communicate findings, model logic, and analytics roadmap
    clearly to both technical peers and executive audiences;
    drive alignment across Data Engineering and Finance
    stakeholders on data architecture decisions
  - Monitor solution performance, data freshness, and usability
    to ensure AI Analytics products remain reliable and
    actionable
  - Champion a culture of quality, documentation, and continuous
    improvement within the team
  
  About You:
  
  - 7+ years of experience in data modeling and business
    intelligence, including at least 2 years focused on
    financial or accounting data
  - Experience implementing or working with AI-powered analytics
    tools (Aperium, Tableau Pulse, ThoughtSpot, or similar
    agentic BI platforms)
  - Expertise in SQL and working with ERP data systems
  - Experience using GitLab, dbt, and CI/CD pipelines for data
    workflow automation
  - Strong understanding of semantic layers and data structures
    optimized for AI model consumption
  - Expert in data visualization, data storytelling, and
    Microsoft Office applications
  - Excellent communication and leadership skills to document
    models, define metrics, and train end users
  
  Nice to haves but not required:
  
  - Experience with Infor LN or comparable ERP systems
  - Experience in aerospace or manufacturing industries
  - Background in Power BI or traditional BI tools (helpful for
    migration/replacement projects)
  - Familiarity with LLM capabilities, prompt engineering, or
    RAG architecture
  
  At Relativity Space, we are committed to transparency and
  fairness in our compensation practices. Actual compensation
  will be determined based on experience, qualifications, and
  other job-related factors. Compensation is only one part of
