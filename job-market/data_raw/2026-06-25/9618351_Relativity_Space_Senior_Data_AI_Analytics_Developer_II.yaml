  competitive salary and equity, a generous PTO and sick leave
  policy, parental leave, an annual learning and development
  stipend, and more! To see some of the benefits & perks we
  offer, please visit here.
  
  Hiring Range:
  
  $117,000—$160,500 USD
  
  We are an equal opportunity employer and value diversity at
  our company. We do not discriminate on the basis of race,
  religion, color, national origin, gender, sexual
  orientation, age, marital status, veteran status, or
  disability status.
  
  If you need a reasonable accommodation, please contact us at
  accommodations@relativityspace.com.
