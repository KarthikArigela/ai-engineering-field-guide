   Key Responsibilities
  
  
  
  
  - Develop, test, and maintain RESTful API connectors for
    enterprise systems such as Salesforce, Workday, SAP,
    Oracle, and AWS.
  - Use AI-assisted tools such as ChatGPT, GitHub Copilot, or
    similar platforms to enhance productivity and generate
    clean, efficient code.
  - Design and implement the normalization layer to map identity
    and entitlement data into a unified schema for YouAttest.
  - Build automation for data synchronization, delta detection,
    and versioning using PostgreSQL or DynamoDB.
  - Develop and maintain modern web applications and dashboards
    using Next.js and React for connector health monitoring,
    system metrics, and administrative workflows.
  - Implement secure, read-only authentication methods (OAuth2,
    SCIM, API keys) and ensure compliance with data protection
    requirements.
  - Collaborate with project managers, architects, and QA teams
    to meet defined milestones.
  - Maintain detailed documentation, reusable code, and version
    control practices.
  
  Requirements
  
  
  
  
  
  
   Tools and Technologies
  
  
  
  
  - Languages: Python, Node.js, TypeScript, JavaScript
  - Frameworks: FastAPI, Express.js, Next.js
  - Databases: PostgreSQL, DynamoDB
  - Frontend: Next.js, React
  - AI Tools: ChatGPT, GitHub Copilot, OpenAI API, Codeium
  - Cloud: AWS (EC2, Lambda, Secrets Manager, CloudWatch)
  - Version Control: GitHub
  
  
  
   Required Skills
  
  
  
  
  - Strong background in Python or Node.js (preferably both).
  - Strong hands-on experience with Next.js and React, including
    server-side rendering (SSR), API routes, and modern
    frontend development practices.
  - Experience with RESTful APIs, GraphQL, and authentication
    protocols (OAuth2, OpenID Connect).
  - Practical experience using AI-assisted programming tools
    such as ChatGPT, GitHub Copilot, Codeium, or TabNine.
  - Knowledge of relational and NoSQL databases such as
    PostgreSQL or DynamoDB.
  - Hands-on experience integrating with enterprise APIs such as
    Salesforce, Workday, SAP, Okta, and AWS.
  - Solid understanding of JSON structures, webhooks, and data
    normalization.
  - Excellent debugging, problem-solving, and documentation
    skills.
  
