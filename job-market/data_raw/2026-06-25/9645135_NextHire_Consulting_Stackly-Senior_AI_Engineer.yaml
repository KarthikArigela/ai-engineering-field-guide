  Job Description
  
  Position: Senior AI Developer
  
  Location: Indore (Remote) Company: Stackly / Preyfox LLC
  --- About the Role:Stackly / Preyfox LLC is looking for a
  highly skilled and experienced Senior AI Developer to join
  our growing team. The ideal candidate will bring deep
  expertise in designing, developing, and deploying advanced
  AI and Machine Learning (ML) solutions to address complex
  business challenges. This role demands strong technical
  capabilities, strategic thinking, and collaboration across
  teams to drive innovation.
  --- Key Responsibilities:•
  
  AI/ML Model Development: Design, build, and optimize
  advanced AI/ML models aligned with business objectives
  
  • Data Engineering: Handle large-scale datasets, including
  data collection, preprocessing, and analysis for high-
  quality model training
  
  • Cross-Functional Collaboration: Work closely with
  stakeholders and internal teams to define requirements and
  deliver scalable AI solutions
  
  • Deployment & Monitoring: Deploy models into production,
  monitor performance, and continuously optimize outcomes
  
  • Innovation & Best Practices: Stay updated with the latest
  AI/ML trends and implement industry best practices
  
  • Documentation: Maintain clear and detailed documentation
  of models, workflows, and processes
  
  • Conversational AI: Develop and integrate conversational AI
  solutions using tools like ChatGPT and other generative AI
  frameworks
  --- Qualifications & Experience:
  
  • Strong hands-on experience in AI/ML model development,
  optimization, and deployment• Proven expertise in data
  engineering and large-scale data processing
  
  • Experience working with generative AI and conversational
  AI platforms (e.g., ChatGPT)
  
  • Proficiency in programming languages such as Python, R, or
  similar
  
  • Familiarity with AI frameworks and cloud platforms
  (TensorFlow, PyTorch, AWS, GCP)
  
  • Excellent analytical, problem-solving, and communication
  skills• Strong leadership and collaboration abilities
  
  At Stackly, we believe in building innovative solutions that
  simplify your digital world.We are a team of creative
  designers, developers, and strategists who are passionate
  about crafting digital experiences. With years of experience
  under our belt, we bring a combination of technical
  expertise and creativity to every project we undertake.
