title: "Sr. IT Systems Engineer, AI & Business Solutions"
company: Dave Inc.
location: USA
work_type: FULL_TIME
description: |
  Dave vs. Goliath. We’re Dave.
  
  Dave is a financial app on a mission to build products that
  level the financial playing field. It is redefining the
  financial landscape by leveraging technology to create an
  affordable, transparent, and user-centric access to
  liquidity for millions of Americans. As a leading innovator
  in the U.S. financial services sector, Dave’s digital
  financial platform offers products designed to meet the
  credit needs of those underserved by traditional financial
  institutions. Dave’s offerings include its flagship
  ExtraCash product, providing members up to $500 within
  minutes. The company is on track to launch several new
  product offerings in 2026, including a Buy Now Pay Later
  (BNPL) option.
  
  Dave is focused on serving Americans who are financially
  vulnerable or living paycheck to paycheck. Dave is leading
  the charge in creating a new era of credit products that
  prioritizes speed, affordability, and accessibility, making
  it the go-to financial partner for those who need it most.
  
  We’re hiring a Senior IT Systems Engineer to help design and
  scale how we manage compliance, security, and audit
  readiness at Dave. This role focuses on building systems and
  automation that make compliance continuous, reliable, and
  embedded into how we operate.
  
  The Opportunity
  
  You’ll operate at the intersection of IT, security, and
  compliance, and you’ll be an influential contributor for a
  team that helps design systems to replace manual audit work
  with automated, scalable solutions. This includes automating
  evidence collection, strengthening IT General Controls, and
  integrating tools so compliance becomes part of day-to-day
  workflows rather than a periodic exercise.
  
  This is a high-impact role with real ownership. You’ll help
  shape how we scale our internal process through better
  systems, working across teams to turn requirements into
  durable, low-friction solutions.
  
  What You’ll Build & Own
  
  - Automate or optimize high-volume manual processes (audit
    evidence collection, data gathering, compliance reporting)
    using APIs and workflows to reduce manual effort and human
    error
  - Build integrations that pull data from systems of record
    (Okta, Workspace, GitHub, Security tools, Google Cloud,
    Snowflake) and consolidate it in BigQuery for audit
    readiness and analytics
  - Design and implement agentic workflows that allow non-
    engineering stakeholders to interact with company data and
    reports through conversational interfaces, reducing their
    need to manually query or compile information
  - Own the operational lifecycle of integrations: monitoring,
    alerting, troubleshooting, and evolving them as business
    requirements change
  - Identify manual handoffs and repetitive tasks across IT,
    audit, and business functions, then build automation or
    agent-driven solutions to eliminate them
  - Work cross-functionally with business teams to understand
    pain points, translate them into technical solutions, and
    measure the impact on time savings and compliance
    readiness
  - Build scalable, resilient, and secure systems
  
  The Impact
  
  Your work will enable Dave to scale securely with greater
  confidence, reducing audit overhead while increasing trust
  in our systems and controls.
  
  What We’re Looking For
  
  Experience & Technical Foundation
  
  - 5–7 years of experience in IT systems engineering,
    automation, internal web services or a related technical
    role
  - Proficiency in scripting or programming (e.g., Python) for
    building integrations and automation
  - Experience building agents and end-to-end automation across
    systems using APIs, scripting, or workflow platforms
  - Hands-on experience with GCP (Compute Engine, Cloud
    Functions, Cloud Run, BigQuery, Cloud Storage) and
    understanding infrastructure as code (e.g. terraform)
  - Hands-on experience with GitHub or equivalent version
    control, including CI/CD automation (GitHub Actions,
    automated testing, deployments)
  - Strong foundation in consuming and integrating APIs:
    handling authentication, rate limits, retries, and
    failures in multi-system flows
  - Experience integrating identity systems (Okta), security
    tooling, and SaaS platforms into cohesive workflows
  - Observability and runbook writing: designing monitoring,
    logging, and operational documentation so systems can be
    maintained at scale
  - Experience working with stakeholders to gather requirements
    and informing buy vs build decisions, including scoping
    POC’s with vendors
  - Experience with LLM API’s (ChatGPT, Claude, Gemini)
  
  Bonus
  
  - Familiarity with compliance frameworks (SOC 2, SOX, ITGC,
    GDPR) and how to build systems that support audit and
    control requirements
  - Experience with data pipelines and BigQuery ELT patterns,
    schema design, data validation, and understanding how data
    flows to business users and reporting
  - Knowledge of encryption, and PII handling in the context of
    compliance and data governance
  
  What Makes Someone Successful Here
  
  You take responsibility for outcomes and think beyond
  individual controls to how systems should work end-to-end.
  You care about building solutions that hold up over time,
  and you’ll reduce manual effort while improving accuracy and
  trust in our systems.
  
  You work well across boundaries, partnering with Business &
  Engineering functions to drive business value with tools. As
  requirements evolve, you’re comfortable navigating
  ambiguity, asking thoughtful questions, and adjusting your
  approach while continuing to move work forward.
  
  What to Expect
  
  This is a hands-on role with meaningful ownership and
  influence. You’ll balance near-term audit and compliance
  needs with longer-term system design, helping us move toward
  more automated and continuous approaches to compliance.
  
  Why Join Dave
  
  - Help redefine how compliance is implemented through systems
    and automation
  - Work on problems that connect security, IT, and the broader
    business
  - Build solutions that scale with the company and reduce
    operational overhead
  - Have real ownership in shaping a more efficient, modern
    compliance function
  
  Ready to build for the underdog?
  
  Reports to: Manager, Systems Engineering
  
  Don’t let imposter syndrome get in the way of an incredible
  opportunity. We’re looking for people who can help us
  achieve our mission and vision, not just check off the
  boxes. If you’re excited about this role, we encourage you
  to apply. You may just be the right candidate for this or
  other roles.
  
  Why you’ll love working here:
  
  At Dave, our people are just as important as our product.
  Our culture reflects the values that guide who we are, how
  we work, and what we aspire to be. Daves are member-centric,
  helpful, transparent, persistent, and better together. We
  strive to create an environment where all Daves feel valued,
  heard, and empowered to do their best work. As a virtual-
  first company, team members can live and work anywhere in
  the United States, except Hawaii.
  
  A few of our benefits & perks:
  
  💚 Opportunity to tackle tough challenges, learn and grow
  from fellow top talent, and help millions of people reach
  their personal financial goals
  
  💻 Flexible hours and virtual-first work culture with a home
  office stipend
  
  🏥 Premium Medical, Dental, and Vision Insurance plans
  
  👶 Generous paid parental and caregiver leave
  
   💰 401(k) savings plan with matching contributions
  
  📈 Financial advisor and financial wellness support
  
  🏖️ Flexible PTO and generous company holidays, including
  Juneteenth and Winter Break
  
  🎉 All-company in-person events once or twice a year and
  virtual events throughout to connect with your team members
  and leadership team
  
  Dave Operating LLC is proud to be an Equal Employment
  Opportunity employer and is dedicated to cultivating a
  diverse and inclusive workplace. We will consider for
  employment all qualified applicants and do not discriminate
  on any basis protected by federal, state, or local law,
  including the City of Los Angeles’ Fair Chance Initiative
  for Hiring Ordinance relating to an applicant's criminal
  history.
  
