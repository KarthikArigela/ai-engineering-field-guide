description: |
  PJT Partners is a global advisory-focused investment bank.
  Our team of senior professionals delivers a wide array of
  strategic advisory, shareholder advisory, restructuring and
  special situations and private fund advisory and placement
  services to corporations, financial sponsors, institutional
  investors and governments around the world. We offer a
  unique portfolio of advisory services designed to help our
  clients achieve their strategic objectives. We also provide,
  through PJT Park Hill, private fund advisory and fundraising
  services for alternative investment managers, including
  private equity funds, real estate funds and hedge funds.
  
  From the beginning, PJT Partners has firmly believed that
  having the best people is key to building an enduring
  franchise. Our perspective was, and remains, that a great
  team brings in both top tier clients and appeals to a wide-
  range of diverse, talented colleagues. Fostering an
  inclusive culture, which welcomes differing perspectives and
  beliefs, enables us to provide the best advice and insights
  to our clients.
  
  To learn more about PJT Partners, please visit our website
  at www.pjtpartners.com.
  
  Responsibilities
  
  The PJT Partners Technology team is responsible for creating
  and continuously improving a robust and secure technology
  foundation that supports the firm’s business activities. Our
  Technology team is seeking a Data and AI Infrastructure
  Engineer to build secure, scalable platforms and pipelines
  that power the firm’s AI initiatives. This is a platform
  engineering role — the focus is building the infrastructure
  and developer tooling that enables teams to rapidly develop
  and deploy AI-powered Python applications using Azure AI
  Foundry and the Claude API (Anthropic), not training custom
  models. You will work with data engineers, application
  developers, architects, and business stakeholders to deliver
  AI-ready infrastructure that meets the firm’s security and
  compliance requirements.
  
  Responsibilities include:
  
  AI Platform & Developer Infrastructure
  
  - Design, build, and operate the firm’s AI platform, enabling
    developers to build and deploy Python-based AI
    applications;
  - Implement and manage Azure AI Foundry environments: model
    deployments, AI hubs, project workspaces, and access
    controls;
  - Integrate and operationalize third-party AI APIs (Anthropic
    Claude API, Azure OpenAI) with secure access patterns, API
    gateway controls, rate limiting, and cost monitoring;
  - Build internal developer tooling and SDK scaffolding to
    accelerate AI application development across the firm.
  
  Data Infrastructure & Pipelines
  
  - Build and maintain data pipelines using Azure Data Factory
    and Azure Databricks to serve AI application data needs;
  - Implement vector search and document retrieval
    infrastructure (Azure AI Search) to support RAG-based
    applications;
  - Manage structured and unstructured data stores including
    Azure Data Lake, Azure SQL, and Cosmos DB.
  
  Cloud Infrastructure & DevOps
  
  - Provision and maintain secure, scalable infrastructure on
    Azure (primary) and AWS using Infrastructure-as-Code
    (Terraform or Bicep);
  - Build and maintain CI/CD pipelines for AI application
    deployment via Azure DevOps or GitHub Actions;
  - Manage containerized workloads using Docker and Kubernetes
    (AKS) for AI application hosting and API services;
  - Drive Secure DevOps practices including secrets management,
    dependency scanning, and policy enforcement.
  
  Security, Governance & Compliance
  
  - Implement data access controls, encryption, and audit
    logging aligned with SEC and FINRA requirements;
  - Design MNPI data segregation controls and enforce AI
    governance guardrails including content filtering and
    usage logging for all AI API integrations;
  - Manage identity and access for AI platforms using Azure
    Entra ID, RBAC, and managed identities;
  - Collaborate with Compliance and Legal to ensure AI usage
    policies are enforced at the infrastructure level.
  
  Collaboration & Documentation
  
  - Produce architecture designs, runbooks, and technical
    documentation for all platform components;
  - Support application developers building AI-powered
    applications with platform guidance and troubleshooting;
  - Partner with solution architects, data engineers, and
    business stakeholders to translate requirements into
    infrastructure.
  
  Qualifications
  
  PJT Partners seeks to hire individuals who are highly
  motivated, intelligent and have demonstrated excellence in
  prior endeavors. In addition, qualified candidates will
  possess the following:
  
  - Bachelor’s degree in computer science, Computer Engineering,
    or related field (Master’s degree is a plus);
  - 8+ years in infrastructure engineering, cloud platform
    engineering, or data engineering;
  - Demonstrated experience building shared platforms or
    developer services in an enterprise environment;
  - Azure expertise: Azure AI Foundry, Azure Data Factory, Azure
    Databricks, AKS, Azure API Management, Azure Key Vault,
    Azure Entra ID;
  - Strong Python skills: backend services, REST APIs (FastAPI
    or Flask), and automation scripting; PowerShell for
    infrastructure tasks;
  - Infrastructure-as-Code: Terraform and/or Bicep; container
    orchestration with Docker and Kubernetes;
  - Experience integrating LLM APIs (Anthropic Claude, Azure
    OpenAI) in production including token cost management and
    observability;
  - RAG pipeline experience: vector search (Azure AI Search or
    pgvector), document processing, and retrieval patterns;
  - Familiarity with LLM application frameworks such as
    LangChain or Semantic Kernel;
  - Cloud security fundamentals: RBAC, managed identities,
    private endpoints, Key Vault, and network segmentation;
  - DevSecOps practices: secrets management, SAST tooling, and
    secure CI/CD pipeline design;
  - Familiarity with AWS (Bedrock, S3, IAM) and agentic
    application frameworks (AutoGen, LangGraph);
  - Experience with Microsoft Fabric, Databricks Unity Catalog,
    or Azure Synapse;
  - Azure certifications: AI-102, DP-203, or AZ-305;
  - Prior experience in investment banking or regulated
    financial services environments.
  
  Expected annualized base salary of $175,000 to $215,000.
  
  This range represents the low and high ends of the expected
  annualized base salary for this position. The specific base
  salary received by any employee will be informed by a number
  of factors, including but not limited to, role level and
  scope, location, candidate’s relevant qualifications, skills
  and experience.
  
  Base salary is one component of PJT Partners’ compensation
  structure. In addition to base salary, PJT Partners’
  compensation structure may include additional rewards,
  incentives and benefits, including but not limited to, a
  discretionary bonus component.
  
