  AI Platform builds and operates the LLM and agent
  infrastructure every team at Coinbase builds on, and ships
  high impact AI agents on top of it. We are the company's
  single path to LLMs and the substrate for the full agent
  lifecycle: build, deploy, run, observe, improve.
  
  What you'll do:
  
  - LLM Gateway: one API for 60+ models across all major
    providers, including self hosted open weight models, with
    auth, PII redaction, quotas, fallbacks, and cost
    optimization
  - AI Hub: single front door for agents, skills, MCP servers,
    knowledge bases, models, memories, and keys
  - Agent and MCP runtime: microVM sandboxes per agent run, a
    governed MCP gateway over 125+ servers, cross trust agent
    identity, tier 1 agents for code, analytics, and exec
    personas
  - Knowledge Bases: connect any data source, auto provision
    vector and markdown stores, queryable by any agent over
    MCP
  - AI Spend Hub: FinOps for AI, spend attribution and
    governance across the company
  - Evaluation and observability: in house LLM as judge harness
    with full tracing and eval tooling
  - Company wide chat and low code workflow surfaces, thousands
    of weekly actives each
  - Applied AI: we embed with teams to build production agents,
    build the feedback loops that let subject matter experts
    refine them, and apply traditional ML including fine
    tuning where it beats prompting
  - Utilizes and builds generative AI responsibly, maintaining
    human oversight to deliver business-ready outputs and
    drive measurable improvements in workflow efficiency,
    cost, and quality
  
  Required Skills and Experience:
  
  - Own multi quarter, high impact initiatives on the platform
    (gateway, runtime, knowledge, governance) or the applied
    agents on top. Partner across engineering, security,
    legal, finance, and product, and work directly with our
    partners at the frontier labs and major cloud providers.
  
  Public blog posts and talks showcasing the team's work:
  
    - NodeSmith: AI-Driven Automation for Blockchain Node Upgrades
    - Making Smarter Decisions, Faster with AI at Coinbase
    - CB-GPT - The opportunity and the vision for GenAI at
      Coinbase
    - Lessons from launching Enterprise-grade GenAI solutions at
      Coinbase
    - AWS re:Invent 2025 - Scaling support, compliance, &
      productivity with conversational AI at Coinbase
  
