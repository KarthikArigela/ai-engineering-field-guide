title: AI Product Engineer
company: Employ Inc.
location: USA
work_type: FULL_TIME
description: |
  Employ is transforming how hiring gets done. With our three
  ATS solutions - Jobvite, Lever, and JazzHR - plus cutting-
  edge AI Companions, we free recruiters from admin work and
  give them more time for what matters: connecting with
  people. More than 23,000 global customers rely on Employ to
  make millions of candidate connections each year, helping
  them hire smarter, faster, and at scale. From growing
  startups to the world’s most recognized brands, we’re
  redefining what’s possible in talent acquisition.
  
  
  
  We’re a fast-moving, remote-first team of builders and
  innovators who live our people-first philosophy every day.
  We back it up with flexible work scheduling and paid time
  off, comprehensive benefits, and career development
  opportunities that help you thrive. At Employ, you won’t
  just grow your career - you’ll help millions of others grow
  theirs.
  
  
  
  Come join our team where we have each other’s backs,
  champion our customers, hold ourselves accountable, and
  shape what’s next in talent acquisition.
  
  
  
  Candidate Safety Notice
  
  Please note, employ takes candidate safety seriously. Employ
  recruiters and employees communicate only via official
  @employinc.com email addresses. We will never request
  payment or personal financial information during the hiring
  process. If you receive suspicious outreach claiming to be
  from Employ, please report it to security@employinc.com.
  
  In this senior-level role, you will lead the architecture
  and evolution of AI-powered systems that transform
  probabilistic model outputs into reliable, production-grade
  product capabilities. You will design and ship systems
  around agents, retrieval pipelines, orchestration layers,
  and evaluation frameworks, while defining the architectural
  standards that ensure AI-driven features operate safely and
  at scale across our platform.
  
  This is not a feature-delivery role — it is a systems-
  definition role. Your decisions will shape how AI
  capabilities are built, evaluated, and deployed across the
  organization.
  
  About the Team
  
  Our AI Foundations team is building the foundation for how
  AI will power the next generation of products at Employ.
  This is a high-ownership, high-autonomy team responsible for
  turning rapidly evolving model capabilities into reliable,
  customer-facing systems.
  
  What You'll Do:
  
  What You Bring:
  
  - 4+ years building AI-augmented product capabilities (LLMs,
    RAG systems, agents, orchestration frameworks).
  - Event-Driven & Asynchronous Systems: Experience designing
    decoupled systems using queues such as Kafka, SQS, or
    BullMQ, and implementing asynchronous workflows that
    prevent blocking operations in user-facing systems.
  - State Management Strategy: Experience persisting state
    across sessions, managing context windows efficiently, and
    handling concurrency and race conditions when multiple
    agents interact with shared data.
  - Structured Data Enforcement: Experience enforcing structured
    outputs using schema validation tools such as Pydantic,
    Zod, or JSON Schema to ensure AI-generated outputs are
    reliable and machine-readable.
  - API Design & Integration: Strong understanding of REST,
    GraphQL, or RPC interface design, along with
    authentication, rate limiting, and idempotent API
    patterns.
  
  Tech Stack & Hard Skills:
  
  Why You’ll Love Working Here:
  
  Make an impact: Your work will directly shape how thousands
  of employees experience total rewards at Employ — ensuring
  programs that attract, engage, and retain top talent across
  the globe.
  
  Meaningful, mission-driven work: Join a team where
  operational excellence in HR directly supports Employ’s
  mission to improve hiring outcomes for both people and
  businesses.
  
  Remote-first culture: Work from where you’re most productive
  while staying connected to a collaborative, high-energy team
  through virtual-first rituals and regular in-person meetups.
  
  Unlimited PTO: Trust-based time off so you can recharge and
  bring your best self to work.
  
  Comprehensive benefits: Medical, dental, and vision coverage
  to support you and your family’s health and well-being.
  
  Learning & development programs: Access to training,
  mentorship, and development resources to grow your skills —
  from HR operations to total rewards strategy.
  
  
  
  At Employ, we believe that when people from different
  backgrounds and perspectives come together, amazing things
  happen. We’re proud to be an Equal Opportunity Employer, and
  we’re committed to creating an environment where everyone
  feels welcomed, respected, and able to thrive.
  
  
  
  We do not discriminate based on race, color, religion, sex,
  sexual orientation, gender identity, national origin, age,
  disability, veteran status, or any other characteristic
  protected by law. We believe that when people feel they
  belong, they can do their best work and we want every member
  of our team to feel that sense of belonging.
  
  
  
  If you need accommodation at any stage of the hiring
  process, please reach out. We’ll be glad to support you.
  
  
  
  Recruitment Fraud Notice:
  
  Employ takes candidate safety seriously. Please be aware
  that Employ recruiters and interviewers will only
  communicate with candidates using official email addresses
  ending in @employinc.com.
  
  
  
  We will never ask for payment, banking information, or
  personal financial details at any stage of the hiring
  process, and we do not conduct interviews via messaging apps
  or social media platforms.
  
  
  
  If you receive communication that appears suspicious or
  claims to represent Employ but does not come from an
  @employinc.com email address, do not respond or continue
  engaging with the sender. Please report the message to
  security@employinc.com.
