title: Senior Full-Stack Developer (AI-Accelerated Solutions, GCP Focus) - LATAM
company: Sell2Rent Corporation
location: USA
work_type: FULL_TIME
description: |
  This is a remote position.
  
  
  
   We are seeking a dynamic and entrepreneurial Senior Full-
  Stack Developer to spearhead the rapid development and
  deployment of innovative solutions in a fast-paced startup
  environment. This role demands a hands-on leader with deep
  expertise in Google Cloud Platform (GCP), AI/ML integration,
  and prompt engineering to accelerate product development and
  deliver impactful MVPs. You will be instrumental in driving
  our technological vision, leveraging cutting-edge tools to
  build and scale robust, cloud-first applications.
  
  
  
  
  
  
  
  
  
   Key Responsibilities:
  
  
  
  
  
  
  
  
  
  - Lead AI-Driven Development: Architect and implement full-
    stack solutions that integrate AI/ML models and prompt
    engineering techniques to enhance product functionality
    and accelerate time-to-market.
  - GCP Mastery: Design, develop, and deploy scalable
    applications on Google Cloud Platform, utilizing services
    like Compute Engine, Cloud Functions, Cloud SQL, and
    Vertex AI.
  - Startup Agility: Drive rapid prototyping and MVP
    development, ensuring alignment with agile methodologies
    and a focus on iterative improvement.
  - Full-Stack Leadership: Lead a team of developers, providing
    technical guidance, mentoring, and fostering a
    collaborative environment.
  - Technical Architecture & Strategy: Define and implement
    robust architectural patterns, ensuring code quality,
    performance, and maintainability.
  - Cross-Functional Collaboration: Partner with product
    managers, designers, and other stakeholders to translate
    business requirements into technical solutions.
  - DevOps & CI/CD: Implement and maintain CI/CD pipelines to
    automate deployment and ensure continuous integration and
    delivery.
  - Innovation & Exploration: Stay abreast of the latest
    advancements in AI, cloud technologies, and full-stack
    development, and drive the adoption of new tools and
    techniques.
  - Documentation & Best Practices: Create and maintain
    comprehensive technical documentation, and enforce coding
    standards and best practices.
  
  Requirements
  
  - 5-7+ years of professional full-stack development
    experience, with a proven track record of delivering high-
    quality web applications.
  - 3-5 years of experience working in fast-paced startup
    environments with successful product launches.
  - Extensive experience with Google Cloud Platform (GCP) and
    its core services.
  - Proficiency in prompt engineering and utilizing AI/ML tools
    for solution acceleration.
  - Strong expertise in modern front-end technologies (React,
    Angular, Vue.js) and back-end technologies (Node.js,
    Python, Java).
  - Deep understanding of RESTful APIs, microservices,
    Kubernetes, and cloud database architectures (e.g., Cloud
    SQL, Snowflake).
  - Experience with cPanel, WHS, Laravel, Redis, Postman and
    Git.
  - Proven ability to lead and mentor development teams,
    fostering a culture of collaboration and innovation.
  - Excellent communication, problem-solving, and critical
    thinking skills.
  - Bachelor's degree in Computer Science or a related field.
  - Experience with DevOps practices and CI/CD pipelines.
  
  
  
  
  
  
  
  
   Preferred Qualifications:
  
  
  
  
  
  
  
  
  
  - Experience with specific AI/ML frameworks and libraries
    (e.g., TensorFlow, PyTorch).
  - Experience with advanced database solutions.
  
  Benefits
  
      If you are a passionate and driven Senior Full-Stack
  Developer with a desire to build cutting-edge solutions
  using AI and cloud technologies in a dynamic startup
  environment, we want to hear from you. This is an
  opportunity to make a significant impact and shape the
  future of our products.
