description: |
  About Us
  
  Oh is building the OpenAI of the spicy content industry.
  We’re a company at the forefront of the generative AI
  revolution, combining cutting-edge models developed in-
  house, with proprietary data sources and distribution via
  our consumer platform, OhChat, and market-leading API.
  
  OhChat now has over 250,000 users and hosts Digital Twins of
  household names, and our API is integrated into some of the
  biggest platforms in the adult content space, distributing
  those Digital Twins across the internet. Backed by $10M in
  venture funding, we’re quickly establishing ourselves as the
  dominant, essential layer for adult creators and platforms
  to adopt AI.
  
  Our aim is for OhChat to be the leading “AI OnlyFans”
  platform and our API to be the go-to for all adult platforms
  wanting the technology and our Digital Twins’ IP, in a
  combined package - ultimately we aim to be the most dominant
  AI player in the entire adult industry, ahead of expansion
  to adjacent industries such as companionship and more
  general creator industry.
  
  Websites: oh.xyz & ohchat.com
  
  Job Overview
  
  We’re looking for a MarTech & AI Automation Developer to
  build the automation backbone of our marketing engine — and
  lay the technical groundwork for AI agent integration across
  the business. Starting in marketing and growth, your work
  will scale into other departments as we build toward a fully
  agent-enabled organisation.
  
  This role is part growth engineer, part automation
  architect, part AI agent integrator — with a clear path to
  own how intelligent automation gets rolled out company-wide.
  This is a highly cross-functional role, working closely with
  Growth, Marketing, Product, and Engineering to build,
  connect, and optimise the tools and workflows that power our
  customer journey, from first touch through to loyal, high-
  value users.
  
  Key Responsibilities
  
  AI-Enhanced Marketing Automation
  
  - Architect and implement marketing automation workflows using
    tools like Customer.io, Make.com, or HubSpot with AI agent
    triggers (e.g. auto-responders, AI DMs, onboarding
    guides).
  - Integrate AI agents (e.g. GPT-4o, Claude, Gemini) to support
    lifecycle touchpoints from lead capture and email
    composition to campaign reporting and churn prediction.
  - Build and maintain intelligent workflows across paid,
    organic, and lifecycle channels
  
  AI Agent Infrastructure (Starting in Marketing)
  
  - Help prototype and deploy lightweight internal AI agents
    using frameworks like LangChain, CrewAI, or Autogen.
  - Define data flows and context windows that allow agents to
    act intelligently across CRM, analytics, support, and
    campaign data.
  - Connect AI agents to company tools (via Zapier, Make, custom
    scripts, or native APIs).
  
  Data, Analytics & Attribution
  
  - Set up and manage marketing event tracking across all
    surfaces (e.g. Segment, PostHog, Google Tag Manager,
    Mixpanel).
  - Own end-to-end attribution, funnel tracking, and customer
    journey analysis — including SEO and content performance
    monitoring.
  - Build dashboards and reports that support fast
    experimentation and insight-driven decisions.
  
  Platform & Tooling Integration
  
  - Extend and customise CRM, CMS, landing page tools, and
    campaign platforms (e.g. Webflow, Unbounce, Looker
    Studio).
  - Create internal tools and helper scripts in Python or
    Node.js to automate workflows and reduce manual effort for
    go-to-market teams.
  - Maintain and evolve API, webhook, and data pipeline
    integrations across all marketing systems.
  
  Collaboration & Enablement
  
  - Work closely with Product, Engineering, and Growth to ensure
    AI agents and automations have the right access, triggers,
    and feedback loops.
  - Act as the internal champion for automation-first thinking
    across departments.
  - Help define the roadmap for broader AI agent rollout to
    other functions (e.g. support, operations, creator
    onboarding).
  
  Your Toolkit
  
  Core MarTech & Automation
  
  - Customer.io, HubSpot, ActiveCampaign, or similar
  - Make.com (Integromat), Zapier, Pipedream
  - Segment, RudderStack, PostHog, Amplitude, Mixpanel
  - GA4, Looker Studio, Google Tag Manager
  - Webflow, Unbounce, basic HTML/CSS/JS
  
  AI Agent Development (Nice to Have)
  
  - LangChain, CrewAI, AutoGen, Semantic Kernel
  - OpenAI APIs, Claude, Google Gemini
  - Vector stores (Weaviate, Pinecone, Chroma)
  - Prompt templating, memory storage, context injection
  - Lightweight orchestration of agents via Make or CLI
  
  Technical Integration & Scripting
  
  - REST API integration, webhook chaining
  - Python or Node.js scripting for workflow logic
  - Git for version control
  
  What You’ll Bring
  
  - 2–3 years’ experience in MarTech, automation, or technical
    growth roles.
  - Strong knowledge of CRM customisation and automation
    workflows.
  - Experience working with APIs, event tracking, and data
    pipelines.
  - Strong interest or experience in AI tools, agent
    architecture, or prompt engineering
  - Passion for optimisation, scalability, and measurable
    results.
  - Excellent problem-solving skills and the ability to work
    cross-functionally in a fast-moving environment.
  
  Why Join Us
  
  - Shape the growth infrastructure of a next-generation global
    AI platform.
  - Work on cutting-edge marketing and automation technologies
    that redefine how users discover and interact with AI-
    powered characters.
  - Join a diverse, ambitious, and creative team pushing
    technical and creative boundaries.
  - High-impact role with opportunities to lead and grow
    alongside the company.
  - Flexible, remote-first culture.
  - Competitive compensation
  - Startup energy with the reach and excitement of a global
    product.
  
  If you’re passionate about building the systems and
  automations that supercharge growth, and want to work at the
  forefront of AI, content, and creator technology — we’d love
  to hear from you.
  
  Ready to help create the most immersive AI experiences on
  the planet? We’d love to hear from you.
