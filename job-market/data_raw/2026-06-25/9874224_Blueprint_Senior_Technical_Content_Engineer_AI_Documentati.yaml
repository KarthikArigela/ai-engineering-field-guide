description: |
  Who is Blueprint?
  
  We are a technology solutions firm headquartered in
  Bellevue, Washington, with a strong presence across the
  United States. Unified by a shared passion for solving
  complicated problems, our people are our greatest asset. We
  use technology as a tool to bridge the gap between strategy
  and execution, powered by the knowledge, skills, and the
  expertise of our teams, who all have unique perspectives and
  years of experience across multiple industries. We’re bold,
  smart, agile, and fun.
  
  What does Blueprint do?
  
  Blueprint helps organizations unlock value from existing
  assets by leveraging cutting-edge technology to create
  additional revenue streams and new lines of business. We
  connect strategy, business solutions, products, and services
  to transform and grow companies.
  
  Why Blueprint?
  
  At Blueprint, we believe in the power of possibility and are
  passionate about bringing it to life. Whether you join our
  bustling product division, our multifaceted services team or
  you want to grow your career in human resources, your
  ability to make an impact is amplified when you join one of
  our teams. You’ll focus on solving unique business problems
  while gaining hands-on experience with the world’s best
  technology. We believe in unique perspectives and build
  teams of people with diverse skillsets and backgrounds. At
  Blueprint, you’ll have the opportunity to work with multiple
  clients and teams, such as data science and product
  development, all while learning, growing, and developing new
  solutions. We guarantee you won’t find a better place to
  work and thrive than at Blueprint.
  
  In This Role
  
  You will support a knowledge engineering and content
  transformation function focused on improving the
  documentation lifecycle through AI-enabled tools,
  automation, and modern docs-as-code practices. This role
  sits at the intersection of technical content development,
  content operations, and software engineering-adjacent
  workflows.
  
  You will help plan, develop, test, and improve AI-powered
  documentation solutions, including agent skills, automation
  workflows, internal knowledge resources, and technical
  content programs. The ideal candidate will be comfortable
  writing and maintaining developer-facing content while also
  working in technical environments that include Markdown,
  Git-based collaboration, CI/CD publishing workflows,
  scripting, and AI-assisted coding tools.
  
  This is not a traditional technical writing role. The right
  candidate will bring strong technical content experience
  along with hands-on comfort using modern engineering tools,
  automation, and AI-assisted workflows to improve
  documentation quality, speed, consistency, and scalability.
  
  Responsibilities
  
  - Plan, scope, and manage technical content programs from
    ideation through authoring, review, user acceptance
    testing, publication, and ongoing maintenance.
  - Author, edit, and review technical content such as internal
    wiki articles, how-to guides, UAT plans, process
    documentation, and contributor guidance.
  - Support docs-as-code workflows using Markdown, code editors,
    Git-based collaboration, pull requests, issues, and CI/CD
    publishing processes.
  - Facilitate user acceptance testing, gather participant
    feedback, document findings, and recommend next steps.
  - Monitor adoption, usage, feedback, and success metrics for
    documentation tools, agent skills, and AI-enabled content
    workflows.
  - Track documentation quality indicators such as engagement,
    satisfaction, time-to-resolution, content freshness,
    accessibility, and issue resolution.
  - Triage and resolve content bugs from feedback channels,
    analytics, and issue backlogs.
  - Partner cross-functionally with content, engineering,
    product, design, and transformation stakeholders to
    coordinate workstreams and ensure documentation accuracy.
  - Apply content quality standards, including voice and tone,
    accessibility, information architecture, metadata,
    taxonomy, localization readiness, and content reuse
    practices.
  - Use technical authoring and publishing tools such as Visual
    Studio Code or similar editors, Markdown linters, static-
    site publishing systems, and documentation repositories.
  - Apply software engineering practices such as branching
    strategies, code review, automated validation, and testing
    to content development workflows.
  - Use AI-assisted and agentic coding tools to accelerate
    content creation, automate repetitive documentation tasks,
    and prototype workflow improvements.
  - Identify opportunities to integrate AI-assisted authoring,
    content generation, quality assurance, and automation into
    the documentation lifecycle.
  - Contribute to or build lightweight scripts, tools,
    extensions, or automation using languages such as Python,
    JavaScript, TypeScript, or similar technologies.
  
  Required Qualifications
  
  - Bachelor’s degree in Computer Science, Technical
    Communication, English, Information Science, or a related
    field, or equivalent practical experience.
  - 4+ years of experience in technical content development,
    technical writing, or content program management for
    software, developer, or cloud-based products.
  - 2+ years of experience with docs-as-code workflows,
    including Markdown authoring, Git-based collaboration,
    pull request workflows, and CI/CD publishing pipelines.
  - Experience using Visual Studio Code or a comparable code
    editor as a primary authoring environment.
  - Familiarity with large-scale developer documentation
    platforms or enterprise documentation ecosystems.
  - Experience managing content at scale, including information
    architecture, metadata, taxonomy, localization
    considerations, and content reuse strategies.
  - Solid understanding of software development concepts such as
    version control, APIs, SDKs, command-line tools,
    scripting, and developer workflows.
  - Strong written and verbal communication skills with the
    ability to explain complex technical topics clearly for
    developer and technical audiences.
  - Strong program or project management skills, including the
    ability to manage multiple workstreams, prioritize
    effectively, and deliver on schedule.
  - Ability to collaborate with engineering, content, product,
    design, and cross-functional stakeholders in a fast-paced
    technical environment.
  
  Preferred Qualifications
  
  - Prior software engineering experience or experience in a
    role that involved writing, reviewing, or maintaining
    code.
  - Hands-on experience with AI-assisted or agentic coding tools
    such as AI pair-programming tools, terminal-based coding
    assistants, or coding automation harnesses.
  - Proficiency in Python, JavaScript, and/or TypeScript for
    automation, content tooling, workflow improvements, or AI-
    enabled documentation processes.
  - Experience with cloud services, including deploying,
    managing, or documenting solutions on a major cloud
    platform.
  - Familiarity with AI/ML development platforms used to build,
    evaluate, or deploy models, agents, or AI-powered workflow
    solutions.
  - Experience building or contributing to developer tools, CLI
    utilities, code editor extensions, documentation
    automation scripts, or publishing pipeline improvements.
  - Experience supporting open-source or community contribution
    workflows, including reviewing external pull requests,
    managing contributor guidelines, and supporting
    contributor engagement.
  - Experience using analytics tools or query/reporting
    platforms to measure content effectiveness, adoption,
    engagement, and quality.
  - Knowledge of accessibility standards such as WCAG and
    inclusive content design principles.
  - Experience working with technical documentation for
    security, cloud, developer tools, enterprise software, or
    AI-enabled platforms.
  
  
  
  Salary Range
  
  At Blueprint, we strive to offer competitive pay that
  reflects the value of our team members. Compensation for
  this role is influenced by a variety of factors, including
  skills, education, responsibilities, experience, and
  geographic market. For candidates based in Washington State,
  the anticipated salary range is $100,000– $120,000 per
  annum.  Please note that we typically do not hire new
  employees at the top of the posted range. Actual starting
  pay will be determined based on experience, skills, and
  internal equity. The final salary and job title may vary
  depending on the selected candidate’s qualifications and
  could fall outside the stated range.
  
