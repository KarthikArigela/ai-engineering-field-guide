description: |
  ReqID: FEQ327R328
  
  Recruiter: Dina Hussain
  
  Location:  London, United Kingdom - Hybrid
  
  Skills: Data Science, Machine Learning, AI, LLM, GenAI
  
  As a Senior Specialist Solutions Engineer (SSE), ML
  Engineering, you will be the trusted technical ML expert to
  both Databricks customers and the Field Engineering
  organisation. You will work with Solution Architects to
  guide customers in architecting production-grade ML
  applications on Databricks, while aligning their technical
  roadmap with the evolving Databricks Data Intelligence
  Platform. You will continue to strengthen your technical
  skills through applying the latest technologies in GenAI,
  LLMOps, and ML, while expanding your impact through
  mentorship and establishing yourself as an ML expert.
  
  You will be reporting to the Manager, Field Engineering
  (Specialist Team)
  
  The impact you will have:
  
  - Lead the architectural design of production-grade ML
    workloads on our unified platform, encompassing the entire
    MLOps lifecycle from end-to-end pipeline creation and
    optimization (training/inference) to seamless integration
    with cloud-native services.
  - Provide advanced technical support to the Solution
    Architects during the technical sales cycle by building
    MVPs, leading deep-dive technical sessions, and
    strategically aligning ML/data science solutions to
    complex customer business challenges using relevant real-
    world examples.
  - Serve as the trusted technical advisor for customers
    developing GenAI solutions, specializing in the design and
    implementation of RAG architectures on enterprise
    knowledge bases, enabling natural language querying of
    structured data, and establishing content generation and
    monitoring frameworks.
  - Drive community growth and platform adoption through thought
    leadership activities, including the creation of technical
    tutorials and training materials, as well as leading
    hackathons and presenting at industry conferences.
  
  What we look for:
  
  - Experienced, technical, customer-facing, and with a
    background in Data Science / Machine Learning, and Data
    Engineering.  Looking to learn and develop in a customer-
    facing technical role as a subject matter expert (SME) in
    a pre-sales environment.
  - Pre-sales or post-sales experience working with external
    clients across a variety of industry markets
  
  Data Science/ML Skills
  
  - Hands-on industry ML experience in at least one of the
    following:
  - Hands-on experience working with Distributed Spark based
    systems.
  - Graduate degree in a quantitative discipline (Computer
    Science, Engineering, Statistics, Operations Research,
    etc.) or equivalent practical experience
  - Experience communicating and teaching technical concepts to
    non-technical and technical audiences alike
  - Passion for collaboration, life-long learning, and driving
    our values through ML
  - [Preferred] 2+ years customer-facing experience in a pre-
    sales or post-sales role
  - [Preferred] Experience working with Apache Spark™ to process
    large-scale distributed datasets
  - Can meet expectations for technical training and role-
    specific outcomes within 3 months of hire
  - Can travel up to 30% when needed
  
  About Databricks
  
  Databricks is the data and AI company. More than 10,000
  organizations worldwide — including Comcast, Condé Nast,
  Grammarly, and over 50% of the Fortune 500 — rely on the
  Databricks Data Intelligence Platform to unify and
  democratize data, analytics and AI. Databricks is
  headquartered in San Francisco, with offices around the
  globe and was founded by the original creators of Lakehouse,
  Apache Spark™, Delta Lake and MLflow. To learn more, follow
  Databricks on Twitter, LinkedIn and Facebook. Benefits At
  Databricks, we strive to provide comprehensive benefits and
  perks that meet the needs of all of our employees. For
  specific details on the benefits offered in your region
  click here.
  
