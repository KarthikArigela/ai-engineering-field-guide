  Cloud Data Migration & AI Systems Engineer
  
  - Type: Long-term contract (9 months)
  - Location: Remote (India or Brazil)
  - 8 hours per day with an overlap of 8 hours with PST.
  - Commitment: 40 hours/week, 8 hours PST overlap
