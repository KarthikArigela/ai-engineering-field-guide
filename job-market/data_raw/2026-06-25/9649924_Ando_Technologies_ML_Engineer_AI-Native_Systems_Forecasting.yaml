  disability, age, veteran status, or any other legally
  protected status.
  
  And yes, we are proudly DEI. We believe diverse perspectives
  make teams stronger, systems smarter, and outcomes more
  equitable. Building infrastructure for the frontline
  workforce demands empathy, representation, and respect, and
  we take that responsibility seriously. These values are core
  to how we work. Candidates who share them tend to thrive at
  Ando.
  
  By applying for this role, you acknowledge that any
