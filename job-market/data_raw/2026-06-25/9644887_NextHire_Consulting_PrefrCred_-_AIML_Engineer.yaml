description: |
  About CRED
  
  CRED is a members-only club that rewards individuals for
  their timely credit card bill payments by providing them
  with exclusive offers and access to premium experiences. It
  is a platform that allows credit card users to manage
  multiple cards along with an analysis of their credit score.
  Members with a high Experian or CRIF score are eligible for
  exclusive rewards upon payment of their credit card bills
  through the app. Among many of the features in the app are
  CRED's credit card spend tracking and management feature
  which provided the user with analysis of spend tracking and
  efficiency of usage of the card.CRED is also equipped with
  the CRED protect feature which is an AI backed system that
  keeps track of every single nuance of a credit card payment
  journey - right from due date reminders, spend patterns and
  other card usage statistics. Additionally, when a member
  makes a credit card payment through the app, they are
  eligible to a variety of rewards of various forms such as
  access to events, experiences, gift cards and upgrades from
  brands like Diesel, Cure.Fit, Myntra, Olive Bar & Kitchen
  among many more. How to apply for a CRED membership? Since
  CRED is only for a select few, you can apply for a
  membership by signing up with your full name and a valid
  Indian mobile number on the app. Once your credit score is
  checked from credit bureaus like CIBIL, Experian and CRIF,
  and your score falls above the accepted eligibility score,
  you will be accepted as a member of CRED. Once you become a
  member, you will be able to access the curated set of
  exclusive rewards and privileges that are offered by CRED.
  
  Job Description - AI/ML Engineer
  
  About the Role We are looking for a passionate and
  technically strong AI/ML Engineer to join our core team
  driving the intelligence behind our lending platform. This
  is an L4-level role where you'll build high-performance ML
  frameworks, scale decision systems, and lay the foundation
  for the next evolution: agentic AI systems that autonomously
  extract insights, support business decisions, and power
  internal copilots. If you are someone who enjoys solving
  hard problems at the intersection of software engineering
  and ML, and are excited about the future of AI agents in
  real-world systems, we want to hear from you.
  
  What You'll Do ● Own and evolve core frameworks powering the
  loan decision-making process across the company ● Design,
  develop, and optimize scalable ML infrastructure and
  software frameworks that integrate seamlessly with
  production systems ● Partnering with senior engineers and
  domain leads to lay groundwork for agentic systems – from
  auto-insight generation to internal decision copilots (e.g.,
  AI for BI)
  
  ● Helpdevelop data and model lifecycle: from ingestion and
  feature engineering to deployment and monitoring ● Build
  generalized systems that support multi-tenant use across
  verticals be it policy or data for analytics ● Continuously
  monitor production performance to ensure that live systems
  behave as expected, and proactively propose improvements ●
  Document learnings, scale reusable patterns, and drive
  adoption of best practices in ML system design You should
  apply if you ● Have 3+ years of experience building
  production-grade software systems in Java / Scala / Python ●
  Have familiarity with ML lifecycle and deployment practices,
  even if not deep modeling experience ● Exhibit deep business
  understanding by translating technical capabilities into
  impactful solutions, ensuring that frameworks contribute
  directly to business outcomes
  
  ● Are comfortable working in a fast-paced, startup
  environment and taking end-to-end ownership ● Possess a
  strong sense of compounding, capable of building modular,
  iterative solutions that grow in capability over time,
  especially in the context of Agentic AI frameworks
