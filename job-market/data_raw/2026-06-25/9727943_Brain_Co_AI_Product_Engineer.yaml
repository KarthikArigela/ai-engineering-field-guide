description: |
  About Brain Co.
  
  Brain Co. is an applied AI startup co-founded by Jared
  Kushner and Elad Gil, and backed by leading Silicon Valley
  builders including Patrick Collison and Andrej Karpathy. We
  are building AI applications for the world’s most important
  institutions, delivering impact on real-world problems
  across governments, healthcare systems, and critical
  industries. Our progress so far:
  
  - Automated construction permitting for a sovereign government
    → 80% faster, unlocking $375M+ in value
  - Optimized supply chains for a leading global energy company
    → 30% lower cost, 99% reliability, preventing $100M+ in
    losses
  - Streamlined hospital patient care across national health
    systems → 40% better outcomes, 80% less admin work
  
  Company momentum:
  
  - Raised a $55M Series A from leading investors
  - Built a team of 70+ AI experts from Tesla, Google DeepMind,
    NVIDIA, and Databricks
  
  At Brain Co., we focus on applying frontier AI to real
  institutional challenges, working alongside governments,
  healthcare systems, and critical industries to modernize how
  essential services operate. We are looking for leaders who
  want to help bring new technology into institutions that
  impact millions of people.
  
  About The Role
  
  As an AI Product Engineer at Brain Co., you will play a
  pivotal role in building and deploying state-of-the-art
  software solutions to automate various real-world problems.
  You will work directly with the customer to develop the
  product spec and building from zero. From designing robust
  front-end interfaces to developing scalable back-end
  systems, you will turn research breakthroughs into practical
  solutions for various nation states. This role is your
  opportunity to make a significant impact by making AI
  technology both accessible and influential.
  
  In This Role, You Will:
  
  - Innovate and Deploy: Design, develop, and deploy advanced
    software solutions that integrate AI to tackle real-world
    problems, particularly in automating complex, manual
    processes in government and industrial sectors. Utilize
    modern web frameworks, microservices architecture, and
    cloud computing to build applications that apply AI to
    intricate optimization challenges.
  - Make a Big Impact: Interact directly with key customer
    stakeholders to apply pioneering AI solutions while
    working alongside experienced ex-founders, government
    officials/ministers, AI researchers, and engineers.
    Understand complex business challenges and deliver
    software solutions powered by AI. Join a dynamic team
    where ideas are exchanged freely, and creativity
    flourishes. You will wear many hats: software development,
    product management, sales, and interpersonal skills.
  - Optimize and Scale: Build scalable data pipelines, integrate
    industrial sensor networks, optimize application
    performance and reliability, and prepare systems for
    production. Engage in projects including but not limited
    to optimizing the world's most advanced energy production
    systems, modernizing core government workflows, or
    improving patient outcomes in advanced public healthcare
    systems.
  - Learn and Lead: Stay abreast of the latest developments in
    software engineering and AI. Participate in code reviews,
    share knowledge, and set an example with high-quality
    engineering practices. Mentor junior engineers and lead by
    example.
  - Make a Difference: Monitor and maintain deployed
    applications to ensure they continue delivering value
    across various governments worldwide. Work directly with
    customer engineers and SMEs to develop and tune
    applications that optimize their workflows and deliver
    tangible upside. Your work will directly impact how AI
    benefits individuals, businesses, and society at large.
  
  You will thrive if you:
  
  - Minimum 2+ years of experience and an appetite for working
    directly with the customer to develop the software spec
    and build from zero
  - Experience with front-end and back-end technologies,
    microservices, and cloud platforms
  - Experience with modern web tooling such as React,
    Typescript, RESTful APIs, and database management systems
  - Possess a strong foundation in software design principles,
    data structures, and algorithms
  - Exhibit excellent problem-solving and analytical skills,
    with a proactive approach to challenges
  - Enjoy working collaboratively with cross-functional teams
  - Thrive in fast-paced environments where priorities or
    deadlines may compete.
  - Eager to own problems end-to-end and willing to acquire any
    necessary knowledge to get the job done
  - Hold a Bachelor’s/Master’s degree in Computer Science,
    Software Engineering, or a related field
  
  Benefits
  
  - Competitive salary
  - Medical, Dental, and Vision (100% Coverage)
  - Paid Maternity and Paternity Leave
  - 401(k)
  - Daily Lunches
  - Commuter Benefits
  - Unlimited PTO
  
  Why Join Us
  
  - Ship quickly, iterate constantly and see your work deployed
    at global scale
  - Collaborate with industry veterans from Tesla, DeepMind,
    Databricks, and more
  - Accelerate your career with ownership based on impact, not
    tenure
  - Earn competitive compensation + meaningful equity in a high-
    growth company
  - Thrive in a culture built on speed, curiosity, and impact
  
  If you want to see your work deployed at scale with real
  impact, Brain Co. is the place to build.
