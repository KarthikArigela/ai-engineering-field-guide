description: |
  We are seeking a highly motivated Senior Software Engineer
  to join our growing engineering team. This role offers an
  exciting opportunity to design and build scalable,
  production grade backend systems that power mission-critical
  applications within the broadcast and media technology
  domain. As a Senior Software Engineer, you will combine
  strong software engineering fundamentals with modern AI-
  assisted development practices. You will work on the
  evertz.io microservices and backend platform, building
  systems designed to handle concurrency, timing, and data
  consistency at scale. Key Qualification Requirement
  
  - 5+ years of software engineering experience in a strongly
    typed language; Java preferred (Python, Rust, Go, C++, or
    C# also considered)
  - Strong experience with Java, Spring Boot, and scalable
    backend development
  - Proficient in using AI coding tools (e.g., Claude, GitHub
    Copilot) and validating AI-generated code for correctness,
    security, and maintainability
  - Expertise in AWS, cloud-native applications, and
    microservices architecture
  - Hands-on experience with Lambda, API Gateway, DynamoDB, SQS,
    and serverless technologies
  - Familiarity with prompt engineering and MCP servers
  - Strong knowledge of concurrency, data structures, design
    patterns, and OOP
  - Experience building distributed systems, real-time
    processing platforms, or other large-scale backend
    services
  - Proven skills in production debugging, monitoring, and
    incident investigation
  - Comfortable contributing to large, complex codebases
  
  Additional Skills That Will Be Useful
  
  - Java ecosystem: Java frameworks, Gradle, JUnit, Mockito
  - Familiarity with CI/CD tools and workflows such as Jenkins,
    Git, and CodePipeline
  - Prior experience in broadcast, media, or real-time systems
  
  What You'll Do
  
  - Design and develop backend microservices for the evertz.io
    SaaS platform
  - Design and deliver new features on the Mediator enterprise
    product — working across a large, mature Java codebase
    with full ownership from scoping to production
  - Investigate and resolve complex production issues in
    Mediator — tracing distributed failures, analysing logs,
    profiling performance bottlenecks, and leading post-
    incident investigations
  - Participate in architecture and technical design discussions
    with product owners, engineering leads, and stakeholders
  - Take features from requirement scoping through to production
    launch
  - Write high-quality, well-tested, maintainable code
  - Use AI-assisted development (Claude, Copilot) as a daily
    practice including structured prompting, iterative
    refinement, and AI-assisted debugging
  - Review, validate, and harden AI-generated code through
    testing, peer review, edge-case analysis, and verification
    of correctness, scalability, and thread safety
  - Collaborate with QA on automated log analysis and testing
    workflows
  
  Who We're Looking For
  
  - Passionate about solving complex backend engineering
    challenges
  - Strong analytical, debugging, and problem-solving skills
  - Curious about modern software engineering practices,
    including AI-assisted development
  - Effective communicator who can collaborate across
    engineering, product, and QA teams
  - Self-motivated with a strong sense of ownership and
    accountability
  - Comfortable working in fast-paced, collaborative, and highly
    technical environments
  
