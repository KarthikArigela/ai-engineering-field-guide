description: |
  Would you like to learn from the best technical minds?
  
  Do you enjoy taking projects?
  
  Take your career to the next level The Early Career
  Traineeship is designed for fresh graduates where Baker
  Hughes will train fresh talent who meet the required
  criteria to perform their traineeship in a specific
  business. The traineeship duration is 11 months and will
  develop your technical knowledge and soft skills and provide
  on the job learning and exposure.
  
  As part of our Early Career Traineeship, we are looking for
  a Data Science and Analytics Trainee to join the Cordant
  analytics team. The ideal candidate should have a strong
  foundation in engineering and be prepared to apply
  analytics, physics-based modelling, and digital tools to
  practical challenges.
  
  Fuel your passion  Responsibilities
  
  - Support the development and operation of AI services across
    the delivery lifecycle
  - Contribute to the design, implementation, testing, and
    integration of AI model serving solutions and backend
    services
  - Assist in validation, troubleshooting, and performance
    testing
  - Prepare technical documentation
  - Collaborate with cross-functional teams, including Platform
    & MLOps, Reliability & Support, Security, Data, and
    Product teams
  
  To be successful in this traineeship you will:
  
  - Graduate of Bachelor’s or Master’s degree in Computer
    Science, Software Engineering, Artificial Intelligence, or
    a related technical field from an accredited university
  - Graduated within the past 12 months
  - Minimum cumulative GPA of 7 (on a 10 scale)
  - Fluent in English, with strong communication skills
  - Demonstrates curiosity and eagerness to learn
  - Be legally entitled to work within the country in which you
    are applying, without sponsorship or time restrictions.
  
  Work in a way that works for you
  
  We recognize that everyone is different and that the way in
  which people want to work and deliver at their best is
  different for everyone. During this traineeship, we can
  offer some flexible working patterns. Talk to us about your
  desired flexible working options when you apply.
  
  Working with us
  
  Working at Baker Hughes means being at the forefront of the
  energy transition. Our people are diverse, ambitious and
  collaborative. Were on a mission to redefine the energy
  sector by unlocking the power of engineering, data and
  science.
  
  The Good Stuff
  
  Our inventions have revolutionized energy for over a
  century. But to keep going forward tomorrow, we know we have
  to push the boundaries today. We prioritize rewarding those
  who embrace challenge with a package that reflects how much
  we value their input
  
  The Baker Hughes internal title for this role is: Early
  Career Trainee
