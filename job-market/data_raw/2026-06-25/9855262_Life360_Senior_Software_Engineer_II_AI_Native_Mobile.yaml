title: Senior Software Engineer II, AI Native, Mobile
company: Life360
location: USA
remote: true
work_type: FULL_TIME
description: |
  About Life360
  
  Life360’s mission is to keep people close to the ones they
  love. Our category-leading mobile app,Tile tracking devices,
  and Pet GPS tracker empower members to protect the people,
  pets, and things they care about most with a range of
  services, including location sharing, safe driver reports,
  and crash detection with emergency dispatch. Life360 serves
  approximately 97.8 million monthly active users (MAU), as of
  March 31, 2026, across more than 180 countries.
  
  Life360 delivers peace of mind and enhances everyday family
  life with seamless coordination for all the moments that
  matter, big and small. By continuing to innovate and deliver
  for our customers, we have become a household name and the
  must-have mobile-based membership for families (and those
  friends who are basically family).
  
  Life360 has more than 500 (and growing!) remote-first
  employees. For more information, please visit life360.com.
  
  Life360 is a Remote First company, which means a remote work
  environment will be the primary experience for all
  employees. All positions, unless otherwise specified, can be
  performed remotely (within the US and Canada) regardless of
  any specified location above.
  
  We are AI Native
  
  We are building an AI native company where AI is an integral
  part of how we build and operate. AI tool usage during
  interviews varies by role. You may be asked to demonstrate
  proficiency with AI tools, discuss how you leverage AI, or
  complete interview exercises without AI assistance. Your
  Recruiter will provide clear guidance as you move through
  the interview process.
  
  Undisclosed use of AI not previously discussed with or
  approved by your Recruiter may impact your candidacy.
  
  About The Team
  
  The Experimentation & ML Intelligence team at Life360 is the
  engine behind how we learn what actually moves the needle
  for our members. We design, ship, and analyze high-velocity
  experiments across the mobile app — onboarding, activation,
  feature awareness, subscription conversion, and retention —
  so every product decision is grounded in evidence rather
  than instinct. Our work directly shapes how nearly 100
  million people experience Life360.
  
  We are a product-minded, AI-Native engineering team. That
  means AI isn't just a tool we use — it's how we work. We've
  redesigned our team workflows around AI, treating it as a
  first-class collaborator at every stage: ideation, coding,
  testing, review, and iteration. We ship faster and go deeper
  because of it, and we're looking for someone who wants to
  help define what that looks like at scale.
  
  About the Job
  
  Life360 is hiring an AI-Native Senior Software Engineer II,
  Mobile — a senior engineer who doesn't just use AI tools,
  but thinks natively in them. You'll be central to how the
  Experimentation & ML Intelligence team designs and ships
  growth experiments across the Life360 app, and how we use AI
  for development going forward.
  
  You'll design and build the features, flows, and experiments
  that drive activation, conversion, and retention — running
  dozens of concurrent tests safely and confidently to learn
  what moves the needle for our members. You'll evolve our
  modern AI-Native engineering workflows — from how we write
  code, to how we run standups, to how we think about team
  velocity. You'll publish AI-native engineering playbooks the
  broader mobile org adopts.
  
  This role is Android-first, but our AI-Native journey
  rewards engineers who treat platform boundaries as fluid —
  willing to build across iOS, web, or backend when an
  experiment or member needs calls for it.
  
  In your first year, success looks like owning end-to-end
  delivery across multiple concurrent experiment surfaces and
  having at least one AI-native workflow adopted beyond this
  team.
  
  For candidates based in the US, the salary range for this
  position is $118,500 to $216,500 USD. For candidates based
  out of Canada, the salary range for this position is
  $171,500 to $201,000 CAD. Note: Please be aware that the job
  title for positions in Canada will be "Developer" in lieu of
  "Engineer." We take into consideration an individual's
  background and experience in determining final salary -
  therefore, base pay offered may vary considerably depending
  on geographic location, job-related knowledge, skills, and
  experience. The compensation package includes a wide range
  of medical, dental, vision, financial, and other benefits,
  as well as equity.
  
  What You’ll Do
  
  - Design and build high-quality Android growth features and
    experiments — across onboarding, activation, feature
    awareness, subscription conversion, and retention —
    running dozens of concurrent tests across the Life360 app.
  - Partner with product, design, data science, and analytics to
    translate hypotheses into shippable experiments, and turn
    results into the next decision.
  - Work with AI (Claude Code) as a first-class collaborator —
    your primary workflow involves orchestrating agents to
    create specs, generate Kotlin code and tests, verify
    results, and perform reviews.
  - Instrument experiments accurately — exposure logging and
    analytics — so the results downstream teams rely on are
    trustworthy.
  - Ship polished, performant, and reliable Android experiences
    to tens of millions of users — with strong attention to
    startup time, memory, battery, ANR, and crash-free rates.
  - Help define and codify AI-Native Android engineering
    practices for the team, establishing playbooks the broader
    mobile org can adopt.
  - Contribute to architectural decisions, code reviews, and a
    culture of craft and continuous improvement on the Android
    codebase.
  - Participate in on-call rotation and incident response for
    mobile experiments and releases.
  - Use agentic workflows to dramatically increase the delivery
    of strong outcomes — moving faster without sacrificing
    quality.
  - Mentor team members and contribute to team processes,
    technical standards, and help evolve the team's AI-native
    engineering practices.
  - Support performance, reliability, and accessibility across
    the Android features you own.
  
  What We’re Looking ForTechnical foundation:
  
  - 6+ years of Android software engineering experience shipping
    production apps at consumer scale.
  - At least 1 year of hands-on experience prompting,
    evaluating, and building with LLMs.
  - Strong proficiency with Kotlin and Jetpack Compose (and the
    Android View system); deep familiarity with the modern
    Android toolchain (Android Studio, Kotlin Coroutines,
    Flow).
  - Experience with Android architecture patterns (MVVM, MVI,
    Clean Architecture, Jetpack/ViewModel/Navigation, Hilt or
    Dagger) in a large, multi-team codebase.
  - Comfort with mobile experimentation concepts: feature
    flagging, A/B testing, exposure logging, holdouts, and
    guardrail metrics.
  - Solid grounding in mobile performance, memory, battery, ANR,
    and crash diagnostics (Android Studio Profiler,
    Perfetto/Systrace, Macrobenchmark, Crashlytics or
    equivalent).
  - Experience with CI/CD for Android (Gradle, Fastlane, GitHub
    Actions, Bitrise, or similar) and modular build systems
    (Gradle modules, Maven).
  - Deep experience with agentic workflows, prompt engineering,
    context-window management, and MCP/function calling — you
    understand the research-plan-implement cycle but don't
    outsource thinking to agents.
  - Bachelor's degree in a technical field, or equivalent
    experience.
  
  What matters most to us:
  
  - Growth mindset - You structure problems precisely, you learn
    quickly, you can show interest outside “your lane”, and
    you are always happy to try something new
  - Collaborative approach - You communicate clearly, work well
    across teams, and value diverse perspectives
  - Ownership mentality - You take responsibility for your work
    from design through production and beyond
  - AI-native working style - You use AI tooling (Claude Code or
    equivalent) as a genuine development partner: delegating
    discrete tasks, reviewing outputs critically, and running
    parallel workstreams rather than hand-holding one agent at
    a time
  - Thoughtful communication - You can explain technical
    tradeoffs and articulate ideas effectively
  - We believe culture fit and problem-solving ability matter
    more than checking every technical box. We're happy to
    help you grow into areas where you have less experience.
  
  Nice-to-Have
  
  - Experience working with an experimentation platform
    (Statsig, LaunchDarkly, Optimizely, Eppo, GrowthBook, or
    similar).
  - Background in mobile analytics pipelines (Amplitude,
    Segment, Snowflake/Databricks downstream).
  - Familiarity with Bayesian or sequential testing methods and
    how they affect client-side implementation.
  - Previous work on subscription, paywall, or onboarding
    surfaces at consumer scale.
  - Contributions to mobile open source or internal developer
    tooling.
  
  AI-Native Expectations
  
  We use AI coding tools as a professional standard on this
  team. Here's what that means in practice:
  
  - Daily use: You use AI coding assistants (we support Claude
    Code, Cursor, and GitHub Copilot) for real, substantive
    tasks: analysis, coding, refactoring, testing, navigating
    codebases, and documentation. Not just research or
    autocomplete.
  - Judgment and ownership: AI-generated code gets the same
    review you'd give any PR. You are accountable for
    everything you ship.
  - Velocity: We expect senior engineers who use AI well to
    operate with meaningful leverage — doing more with the
    same time, taking on problems that would otherwise require
    a larger team.
  - Team leadership: You share what works. You automate
    prompting strategies that others can build on and help
    teammates earlier in their AI workflow adoption get up to
    speed.
  - Continuous learning: The tooling is changing fast. You stay
    current and bring recommendations to the team when
    something would meaningfully improve how we work.
  
  
  
  Our Benefits
  
  - Competitive pay and benefits.
  - Medical, dental, vision, life and disability insurance plans
    (100% paid for US employees). We offer supplemental plans
    for medical and dental for Canadian employees.
  - 401(k) plan with company matching program in the US and RRSP
    with DPSP plan for Canadian employees.
  - Employee Assistance Program (EAP) for mental wellness.
  - Flexible PTO and 12 company wide days off throughout the
    year.
  - Winter and Summer Weeklong Synchronized Company Shutdowns
  - Learning & Development programs.
  - Equipment, tools, and reimbursement support for a productive
    remote environment.
  - Free Life360 Platinum Membership for your preferred circle.
  - Free Tile Products
  
  Life360 Values
  
  Our company’s mission driven culture is guided by our shared
  values to create a trusted work environment where you can
  bring your authentic self to work and make a positive
  difference
  
  - Be a Good Person - We have a team of high integrity people
    you can trust.
  - Be Direct With Respect - We communicate directly, even when
    it’s hard.
  - Members Before Metrics - We focus on building an exceptional
    experience for families.
  - High Intensity, High Impact - We do whatever it takes to get
    the job done.
  
  Our Commitment to Diversity
  
  We believe that different ideas, perspectives and
  backgrounds create a stronger and more creative work
  environment that delivers better results. Together, we
  continue to build an inclusive culture that encourages,
  supports, and celebrates the diverse voices of our
  employees. It fuels our innovation and connects us closer to
  our customers and the communities we serve. We strive to
  create a workplace that reflects the communities we serve
  and where everyone feels empowered to bring their authentic
  best selves to work.
  
  We are an equal opportunity employer and value diversity at
  Life360. We do not discriminate on the basis of race,
  religion, color, national origin, gender, sexual
  orientation, age, marital status, veteran status, disability
  status or any legally protected status.
  
  We encourage people of all backgrounds to apply. We believe
  that a diversity of perspectives and experiences create a
  foundation for the best ideas. Come join us in building
  something meaningful. Even if you don’t meet 100% of the
  below qualifications, you should still seriously consider
  applying!
  
  
  
