description: |
  Company Description
  
  We Elevate. Digitally.
  
  SQLI is a European leader in digital transformation and
  customer experience, helping major international brands
  drive growth through technology. From strategy to
  implementation, we design and deliver high-performance
  architectures and engaging digital experiences by combining
  advanced technologies, proven methodologies, and deep
  technical expertise.
  
  With 2,200 people across 12 countries, we’re looking for
  passionate individuals who share our values: Creative
  Spirit, Commitment, and Forward Thinking.
  
  Job Description
  
  About the role
  
  The AI Engineer is the build engine of our AI practice. You
  turn business requirements into working AI solutions, fast,
  using coding agents and frontier models, then take the ones
  that prove their worth into production with the security,
  compliance, and reliability that enterprise clients demand.
  
  This is not a model-training role. We are not building or
  fine-tuning models from scratch. You build agentic workflows
  and LLM-powered applications on top of frontier models, wire
  them into real enterprise systems, and make them safe to
  run.
  
  You will work as part of the delivery team alongside
  consultants, business analysts, and architects. The
  consultant carries the client relationship and the architect
  owns the hard architectural calls. You own the build and you
  make real engineering decisions, not just execute someone
  else’s spec. You are proactive about spotting better ways to
  build, and trusted to deliver without close supervision.
  
  What you will do
  
  - Use coding agents to prototype AI solutions quickly against
    real client requirements, so the team can validate value
    before committing to a full build
  - Build, deploy, and maintain LLM-powered applications and
    agents that align with enterprise architecture principles
    and standards, with evaluation, monitoring, and token
    tracking in place from day one
  - Set up MCP connectors and permissions against client
    systems, taking real care over data handling, access
    control, and what an agent is and is not allowed to do
  
  - Build production solutions that meet client security
    requirements and European data protection obligations,
    including GDPR. This is not optional and not an
    afterthought
  
  - Collaborate with consultants, business analysts, and
    architects to break business requirements down into
    solutions that are feasible, maintainable, and safe
  
  - Create reusable AI assets and accelerators for the practice,
    including skills, plugins, and MCP servers that make
    future engagements faster
  
  - Support Data & AI teams with best practices around AI-
    assisted development, documentation, and automation, and
    coach less experienced colleagues on agentic build
    patterns and security standards
  
  - Document deployment, upgrade paths, and maintenance so SQLI
    and our clients can own what you build after handover
  
  Qualifications
  
  
  
  - Proven experience with AI-assisted development. You have
    shipped something real with Claude or another agent
    platform, not just followed tutorials
  
  - Strong TypeScript and/or Python for agentic glue code,
    custom MCP work, and evaluation
  
  - Experience building RAG applications
  
  - Hands-on with creating and using agent plugins, skills, and
    MCP servers for repeatable agentic workflows
  
  - Skilled at engineering the prompts and context that let
    agents do work as autonomously as is safe and sensible
  
  - Solid grasp of security, access control, and data protection
    (including GDPR) when building systems that act against
    real client data with real permissions
  
  - Experience setting up CI/CD pipelines and automation
  
  - Able to take a prototype through to a production-grade
    build, not just one or the other
  
  - Strong collaboration and communication skills, ideally from
    an agency or consulting setting
  
  - Proactive and autonomous, able to spot opportunities, make
    sound engineering decisions, and own delivery rather than
    wait to be told how to build
  
  - Business-level English, able to understand business
    requirements directly from clients and communicate clearly
    in calls and in writing
  
  Nice to have
  
  - Familiar with Microsoft Azure, particularly Azure AI
    infrastructure, as our primary cloud for production AI
  - Hands-on with Anthropic’s managed agent infrastructure
    (Claude managed agents, the agents API)
  
  - Prior work on evaluation methods for LLM outputs
  
  - Experience in e-commerce, or from an AI, agentic, or
    workflow automation background
  
  - Comfortable presenting technical work and learnings to a
    non-engineering audience
  
  Additional Information
  
  How we will work together
  
  You will report into the Data & AI service line leadership
  and work as part of client delivery teams across the service
  line and the wider SQLI group. The role is primarily
  billable client work. You will occasionally join client
  sessions for technical depth, but the consultant carries the
  relationship. We are looking for someone who can own
  technical decisions on the build, not only execute, with
  room to grow toward an AI Architect track as the practice
  scales.
  
  How to apply
  
  Send a short note covering:
  
  - One thing you have built recently with Claude Code or a
    Claude-based agent, with a link if possible
  
  - How you would take an agent that touches real client systems
    from a quick prototype to something safe to run in
    production
  
  - Your notice period and earliest start date
  
  Why you’ll love working at SQLI?
  
  - A flexible remote working policy: 3 days per week
  - Continuous learning opportunities and certifications to
    support your development
  - Personalised support: career follow-up, diverse projects,
    and strong team collaboration
  - Regular rituals: internal communications on tech and AI
    topics, internal events, and meet-ups
