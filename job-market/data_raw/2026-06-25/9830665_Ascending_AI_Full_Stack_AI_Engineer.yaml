description: |
  We're looking for a builder who can own and ship across the
  entire stack, from low-level systems and backend plumbing to
  polished UIs and whatever wild thing we need next (mobile?
  embedded? lets go!). You'll work shoulder-to-shoulder with
  our integrated product and tech teams to build something
  that actually changes how people live with AI.
  
  If you're the kind of engineer who prototypes on weekends,
  ships MVPs that aren't perfect but work, and gets a rush
  from seeing your code in users' hands the next day, this is
  your playground. We only want top-tier people with an
  entrepreneurial streak who thrive when projects are on fire
  (in a good way) in a world that can shift overnight.
  
  Why we exist
  
  AI is everywhere, shaping how we live and work. We believe
  in AI that helps people stay in control of their choices,
  build real connections, and pursue long-term goals.
  Autonomy, relationships, and purpose are the foundations of
  a meaningful life and Ascending AI builds tools that
  strengthen all three.
  
  We deeply believe in this mission and invested €5M of our
  own capital to stay initially independent and focused on
  what matters most.
  
  What we’re building
  
  Agents will be rapidly replacing apps on the consumer level.
  We are starting with building agents that allow users to use
  AI in a way that strengthens their choice and autonomy. We
  are also building more sophisticated tools that allow people
  to control the AI systems in their life. Along the way we
  are encountering lots of challenges, ranging from everything
  RAG and context engineering, dynamic model evaluation,
  agentic interaction, cyber and DevOps related.
  
  Remuneration
  
  The remuneration for this position is highly competitive.
  
  The role
  
  We're looking for a senior Full-Stack Engineer who can own
  and ship across the entire computing stack, from low-level
  systems to polished user interfaces. You'll work directly
  with the founders and a lean product-tech team to build
  products that genuinely matter.
  
  We only consider top-tier candidates with an entrepreneurial
  mindset who thrive in demanding, fast-moving environments.
  If you're the kind of engineer who ships first and asks
  questions while iterating, this role is for you.
  
  What we’re looking for
  
  We're looking for a great generalist who can specialize when
  needed and doesn't find anything boring. Our current stack
  is Rust, Python, and TypeScript, but if the job requires
  building an iOS app from scratch tomorrow, that should
  excite you, not scare you.
  
  - 5+ years of software engineering experience across the full
    stack
  - Full-stack versatility: comfortable moving from low-level
    systems to frontend to mobile, across whatever the problem
    demands. Strong theoretical and practical foundations
    matter more than familiarity with any specific language.
  - Outcome orientation: you care about shipping and delivery,
    not hours logged. You define success by what's working in
    production
  - Startup adaptability: experienced in small teams with
    shifting priorities and rapid iteration cycles
  - Product ownership mindset: you use and test your own code,
    identify UX friction, and fix it without being asked
  - Analytical autonomy: ability to independently identify and
    define technical problems before jumping to solutions
  - Continuous learning: demonstrated capacity to quickly master
    new technologies, languages, and frameworks as required
  - Experience with distributed systems and cloud-native tooling
    such as Docker, Kubernetes, Vercel, and AWS
  - Strong communication skills; able to collaborate with
    product, founders, and other engineers in a fast-paced
    environment
  - Able to mentor junior engineers and contribute to
    architecture decisions
  - Critical thinking, low ego, collaborative mindset, ready to
    roll up your sleeves
  - Fluent English required
  
  How we hire
  
  We keep the process lean and respect your time:
  
  - HR call (30 min)
  - Technical interview with senior and founding engineers (45
    to 50 min)
  - Founder interview (45 to 60 min)
  - Take-home assignment
  - Assignment Presentation (60 min)
  
  Why join us now?
  
  You work directly with the founders and a small product-tech
  team to shape a company built to make AI serve humanity, not
  the other way around. We’re Amsterdam based but offer a
  hybrid option and relocation support to Amsterdam if
  applicable. In addition to the salary, there is the
  opportunity to participate in our success through stock
  based rewards. This is your chance to build fast, design
  with purpose, and leave a real mark on how humans and AI
  coexist.
