  Job Description
  
  About the Role
  
  We are building a production-grade AI platform designed to
  support advanced machine learning systems at scale. We are
  seeking a senior infrastructure engineer or AI
  infrastructure consultant who combines deep platform
  expertise with hands-on experience using modern AI coding
  agents to accelerate development.
  
  This role is ideal for someone who has architected and
  operated enterprise AI systems, understands modern MLOps and
  cloud-native infrastructure, and actively leverages AI-
  assisted development tools to move faster without
  sacrificing reliability, security, or performance.
  
  You will help design, harden, and scale the infrastructure
  backbone supporting AI workloads across training, inference,
  and application layers.
  
  What You Will Do
  
  - Architect and implement scalable infrastructure for AI and
    ML workloads (training, evaluation, inference).
  - Design and operate Kubernetes-based platforms for multi-
    tenant, production AI systems.
  - Build and refine MLOps pipelines covering model versioning,
    experiment tracking, CI/CD, deployment, monitoring, and
    rollback.
  - Establish DevOps best practices across infrastructure,
    application, and ML layers.
  - Lead security-first infrastructure design (access control,
    secrets management, isolation, observability,
    auditability).
  - Deploy and operate enterprise-grade production systems with
    strong uptime and reliability standards.
  - Leverage modern AI coding agents and developer copilots to
    accelerate engineering workflows.
  - Partner with ML engineers and application teams to translate
    research and product requirements into scalable
    infrastructure capabilities.
  
  Qualifications
  
  What We Are Looking For
  
  - 8-12+ years of experience in infrastructure, platform
    engineering, or distributed systems.
  - Proven experience building and operating enterprise-grade
    production systems.
  - Deep hands-on expertise with Kubernetes in production
    (autoscaling, networking, upgrades, reliability patterns).
  - Strong background in MLOps and ML platform lifecycle
    management.
  - Experience with cloud platforms (AWS, GCP, or Azure) and
    Infrastructure-as-Code (Terraform, Pulumi, etc.).
  - Practical, hands-on use of AI coding agents / AI-assisted
    development tools.
  - Strong programming ability in Go, Python, or similar
    infrastructure-oriented languages.
  
  Nice to Have
  
  - Experience supporting GPU workloads and large-scale
    training/inference.
  - Familiarity with enterprise security standards (SOC2, ISO,
    zero-trust architectures).
  - Experience building internal developer platforms serving
    multiple teams.
  - Background supporting AI systems in regulated or high-
    reliability environments.
  
