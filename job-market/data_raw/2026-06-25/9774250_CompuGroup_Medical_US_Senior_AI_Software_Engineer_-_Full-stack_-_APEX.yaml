description: |
  Your Impact:
  
  • You design, build and operate modern web applications
  across our SaaS portfolio, working fluently across frontend,
  backend and DevOps.
  
  • You build AI-native features and agentic experiences into
  our products, using LLMs, retrieval, tool use and structured
  workflows to deliver tangible value to clinicians and
  patients.
  
  • You design, evolve and operate cloud-native services with
  a strong focus on reliability, security and developer
  productivity, and you contribute to the team's shared
  agents, skills, pipelines and harnesses.
  
  • You collaborate closely with product management, UX,
  architects and other engineers; you actively raise the
  engineering bar and the AI-engineering bar within your team.
  
  • You stay close to the user, understand healthcare
  workflows, and bring an entrepreneurial, outcome-driven
  mindset to feature delivery.
  
  Your Profile:
  
  • Several years of senior-level full-stack experience
  covering modern web applications, with depth in at least one
  frontend (React or Angular) and one backend stack
  (Java/Spring Boot or Python).
  
  • Solid working knowledge of our core technologies —
  React/Angular, Java Spring Boot, Python, C#, Kafka,
  Terraform — and the cloud and DevOps practices that surround
  them (Kubernetes, Helm, ArgoCD). Exposure to LLM tooling
  (Azure OpenAI, Anthropic SDK, MCP) is a strong plus.
  
  • Demonstrated effective use of AI in software engineering.
  Hands-on experience with Claude Code or similar — building
  agents, skills and workflows — is preferred; AI pipelines,
  harnesses and context engineering are a strong plus.
  
  • Completed degree in computer science, software engineering
  or a comparable technical field.
  
  • Strong problem solving, innovation and proactivity;
  understanding of productmanagement processes is a plus;
  alignment with our healthcare purpose.
  
  • Fluent English; German is a plus
