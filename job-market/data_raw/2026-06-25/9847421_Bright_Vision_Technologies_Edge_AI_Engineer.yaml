  mission of transforming business processes through
  technology. This is a fantastic opportunity to join an
  established and well-respected organization offering
  tremendous career growth potential. Edge AI EngineerJob
  Title: Edge AI Engineer Salary Range:
  100k$/Annum-150k$/Annum Location: 100% Remote (Continental
  United States) Position Type: In-house Bright Vision
  Technologies SOW engagement (no third-party client or
  vendor) Experience: 6+ years Sponsorship: No new H1B
  sponsorship available. H1B transfers welcomed for qualified
  candidates. Employment Type: Full-time, direct W2 with
  Bright Vision Technologies (no C2C, no 1099, no third-party)
  Engagement: Long-term, multi-year, aligned to the Bright
  Vision SOW delivery roadmap Compensation: Competitive base
