description: |
  We're a small fast-moving team building AI Agents to solve
  real-world cybersecurity challenges - things like threat
  detection, log analysis, and incident response automation.
  This isn't about flashy demos. We care deeply about
  correctness, reliability, and systems that actually perform
  under pressure. We're looking for a talented engineer with
  expertise taking complex systems from design all the way to
  production. The right candidate is excited to tackle
  difficult challenges using a blend of out-of-the-box
  thinking and proven software engineering best practices.
  
  Key Responsibilities
  
  What will you do? Design, develop, and productionize
  advanced agentic systems that:
  
  - Handle large volumes of security event data
  - Operate with resilience in noisy, real-world environments
  - Continuously evolve as new attack patterns and tools emerge
  - Improve and harden existing agentic systems
  - Work with LLMs in production environments, not just
    prototypes
  - Engineer robust context pipelines for large-scale data
    ingestion and reasoning
  - Optimize systems for performance, reliability, and failure
    handling
  - Evaluate and integrate new agent frameworks, tools, and
    approaches
  - Rapidly hypothesize -> build -> test -> validate -> iterate
  
  Skills, Knowledge, and Expertise
  
  What do you need to succeed?
  
  Must-have:
  
  - Strong Python (or equivalent modern language) engineering
    skills.
  - Deep understanding of language performance and internals
    (eg. GIL, concurrency tradeoffs, memory constraints).
  - Proven experience building production-grade AI agents. Not
    just demos. Systems that run, recover, and scale.
  - Thorough understanding of LLMs and agentic systems. You
    understand how they actually work under the hood.
  - Strong context engineering skills. Able to curate, compress,
    and structure large datasets foreffective LLM use.
  - Experience evaluating, testing, and monitoring agents and
    LLM interactions using the latesttechniques or frameworks.
  - Experience handling large-scale high-volume data workflows.
  - Portfolio of shipped work (GitHub, case studies, or
    equivalent).
  - Bachelor of Computer Science/Engineering or above.
  - Must be a US Citizen.
  
  Nice-to-have
  
  - Experience with cybersecurity tools (CrowdStrike, Splunk,
    Mandiant, etc.)
  - Familiarity with multiple agent frameworks (Claude Agent
    SDK, LangGraph, AutoGen, custom systems, etc.)
  - Experience evaluating tradeoffs between frameworks vs.
    custom orchestration.
  
  Why DeepSeas?
  
  At Deep Seas, we like to say that heart rates go down,
  careers take off, and security programs mature. Our values
  provide the ultimate guide for our daily behavior and
  decisions. Without these values, we aren’t Deep Seas. They
  preserve the essence of our organization, reflect the
  personalities of our Deeps (how we affectionately refer to
  our teammates), and enable us to exceed expectations. Our
  values are:
  
  - We are client obsessed.
  - We stand in solidarity with our teammates.
  - We prioritize personal health and well-being.
  - We believe in the power of diversity.
  - We solve hard problems at the speed of cyber.
  
  This is your chance to join a supportive crew of teammates
  and an industry-leading organization that values
  opportunities for growth. If DeepSeas sounds like a good fit
  for you, send us your resume and let’s talk! Information
  security is everyone’s responsibility:
  
  - Understanding and following DeepSeas’s information security
    policies and procedures.
  - Remaining vigilant and reporting any suspicious activity or
    possible weaknesses in DeepSeas’s information security.
  - Actively participating in DeepSeas’s efforts to maintain and
    improve information security.
  - DeepSeas considers this position is as Moderate Risk with a
    potential to view/access/download restricted/private
    client/internal data.
  - This information must be treated with sensitivity and in the
    most secure manner.
  - HR reserves the right to perform random background/drug
    screens to ensure the safety of client/DeepSeas data
  
  About With nearly 30 years of experience in cyber defense,
  DeepSeas is trusted by 350+ clients, including Fortune 100
  enterprises and mid-market organizations. Leveraging deep
  expertise that combines world-class cyber threat detection
  and response with industry-leading analysts, tailored threat
  intelligence, and accredited incident responders, DeepSeas
  is always on, always watching. Its Managed Detection &
  Response offering, DeepSeas MDR+, is anchored by its
  acquisition of Booz Allen Hamilton’s commercial Managed
  Threat Services (MTS) business in 2022. DeepSeas is the
  first and only MDR provider that covers the entire converged
  attack surface for the mid-market, including OT, IT, cloud,
  and mobile. Its full-spectrum cyber threat monitoring
  service is award-winning and backed by world-renowned
  researchers, data scientists, and mathematicians who have
  published over 250 papers and created a broad base of
  intellectual property, while achieving a number of
  scientific breakthroughs in the areas of big data, machine
  learning, and artificial intelligence as it applies to the
  detection of advanced and unknown cyber threats.
