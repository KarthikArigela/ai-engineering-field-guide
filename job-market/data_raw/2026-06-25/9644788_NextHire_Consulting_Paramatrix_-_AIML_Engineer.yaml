description: |
  Requirement - AI/ML Engineer
  
  Experience (Years): 6+ years
  
  Work Location: Western Suburb, Mumbai
  
  Job Description
  
  • Design, develop, and maintain scalable, efficient, and
  reliable systems to support GenAI and machine learning,based
  on applications and use cases
  
  • Lead the development of data pipelines, architectures, and
  tools to support data-intensive projects, ensuring high
  performance, security, and compliance
  
  • Collaborate with other stakeholders to integrate AI and ML
  models into production-ready systems
  
  • Work closely with non-backend expert counterparts, such as
  data scientists and ML engineers, to ensure seamless
  integration of AI and ML models into backend systems
  
  • Ensure high-quality code, following best practices, and
  adhering to industry standards and company guidelines
  
  Desired Profile
  
  • Senior backend engineer with a proven track record of
  owning the backend portion of projects
  
  • Experience collaborating with product, project, and domain
  team members
  
  • Strong understanding of data pipelines, architectures, and
  tools
  
  • Proficiency in Python (ability to read, write, and debug
  Python code with minimal guidance)
  
  • Strong communication and interpersonal skills, with the
  ability to work with stakeholders at all levels
  
  Mandatory Skills:
  
  • Machine Learning: experience with machine learning
  frameworks, such as scikit-learn, TensorFlow, or PyTorch
  
  • Python: proficiency in Python programming, with experience
  working with libraries and frameworks, such as NumPy,
  pandas, and Flask
  
  • Natural Language Processing: experience with NLP
  techniques, such as text processing, sentiment analysis, and
  topic modeling
  
  • Deep Learning: experience with deep learning frameworks,
  such as TensorFlow or PyTorch
  
  • Data Science: experience working with data science tools
  
  • Backend: experience with backend development, including
  design, development, and deployment of scalable and modular
  systems
  
  • Artificial Intelligence: experience with AI concepts,
  including computer vision, robotics, and expert systems
  
  • Pattern Recognition: experience with pattern recognition
  techniques, such as clustering, classification, and
  regression
  
  • Statistical Modeling: experience with statistical
  modeling, including hypothesis testing, confidence
  intervals, and regression analysis
  
  Qualification: Bachelor's degree in a relevant field
  
  About Company :
  
  Paramatrix delivers wide array of services such as Bespoke
  Software Development, IT Staff Augmentation, Database
  Management, Business Process Outsourcing and System
  Integration. The Mumbai headquartered company largely
  focuses on developing software applications and technology
  solutions for large enterprises and mid-size businesses on
  web and mobile platforms.
  
  BFSI, Retail and Sports are some of key growth verticals of
  Paramatrix. However, we also have technology practices for
  other verticals such as Manufacturing, Pharmaceutical,
  Shipping and Logistics.
  
  Paramatrix has strong knowledge, expertise and working
  experience in application development and technology
  solutions using latest technologies, frameworks and
  platforms such as Microsoft's .Net, Microsoft SQL, Azure,
  Cross Platform Mobile Application, Java technology, and
  others.
  
  Vision : At Paramatrix, we envision a future where
  technology serves as a force for good, enriching lives and
  empowering organizations to thrive in an ever-changing
  global landscape. We aspire to be at the forefront of this
  technological revolution, leading by example and inspiring
  others to embrace technological innovation for good.
  
  Mission : Our mission at Paramatrix is clear -to be the
  catalyst for transformation in the digital realm. We aim to
  pioneer advancements that enhance efficiency, foster
  creativity, and promote sustainable growth for our clients
  across sectors. With an unwavering commitment to innovation
  and customer satisfaction, we aim to exceed expectations and
  set new industry standards.
  
