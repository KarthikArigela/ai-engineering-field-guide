description: |
  WHO ARE WE LOOKING FOR: We are looking for an experienced
  Senior Cloud Software Engineer AI (m/f/d) for our team
  working on the productization of our prize-winning redaction
  pipeline. You will work on the design, development, and
  operations for the cloud and on-premise product variants.
  YOUR ROLE AND RESPONSIBILITIES: * Together with the team,
  you will participate in the design and continuous
  improvement of the existing cloud landscape. * You are
  responsible for the scalability of compute-intensive
  workloads. * You guide the team in cloud architecture
  decisions. * You work across teams to improve problem
  visibility and translate issues into concrete solutions. *
  You reduce cycle times and introduce continuous delivery. *
  You steer technical projects from conception through
  implementation and ensure handover to operations during the
  testing phase. IN ORDER FOR YOU TO BE SUCCESSFUL, YOU BRING:
  * You have 3+ years of professional experience building
  resilient, scalable systems and troubleshooting whole-system
  issues—a degree is not required, but proven experience is. *
  You have several years of experience with Microsoft Azure or
  AWS and associated services. * You have solid expertise in
  at least one programming language, either Python or C++. *
  You have several years of experience implementing cloud
  infrastructure solutions, specifically IaC with Terraform
  and Kubernetes. * You enjoy working in an agile team with
  daily scrum-based sprints and consider yourself a good team
  player. * You have business-fluent English skills. WHAT WE
  OFFER: * Friendly cooperation at eye level—We live and
  breathe flat hierarchies with a positive feedback culture. *
  Innovation where it matters—A challenging position in a
  company that is changing the world of video data: Withyouwe
  will make history. * Creative and entrepreneurial playground
  - Get a chance to be your own master, define your own tasks,
  actively contribute and implement your ideas. Grow yourself
  and grow the success of the company with direct influence
  from day one. * Team spirit celebrates diversity—Numerous
  events to get to know the teams and meet our great
  visionaries. * Flexible working hours - Trust-based and
  goal-oriented working culture. * Benefits to smooth your
  ride in life - Public transport ticket with a 50% subsidy
  and a huge discount on Urban Sports Club memberships. *
  Boost your learning—we’ll fund it - We offer a generous
  learning budget so you can improve your skills. * Loft-
  office in central Berlin - With free drinks and a large
  balcony with barbecue. WHY YOU SHOULD WORK HERE: We are a
  diverse, ambitious team with a great passion for data
  privacy and generative AI. Our office is in the heart of
  Berlin, one of the coolest, most vibrant cities worldwide.
  We enjoy teamwork and celebrating successes together. If you
  are looking for a new challenge with real impact from day
  one, check out our job openings and apply today!
