title: ABAP AI Developer
company: Conduct (conduct.ai)
location: London, GBR
work_type: FULL_TIME
company_size: 21 Employees
description: |
  TL;DR: We're looking for exceptional ABAP engineers eager to
  build the AI layer for operating the world’s most complex IT
  setups. This role moves beyond just ABAP: you’ll develop
  software across the stack, design AI harnesses and agents,
  influence product direction, and work with customers.
  
  Why Conduct
  
  Today, no single person fully understands their ERP setup:
  decades of customisation, millions of lines of ABAP, and
  undocumented changes from thousands of consultants has led
  to spiralling complexity. As a result, projects take years
  and migrations costs hundreds of millions.
  
  Conduct lets IT teams run faster. Teams collaborate
  alongside AI agents to accelerate their work, be it fit-gap
  analyses, hypercare support, deciphering business processes,
  writing ABAP, and more.
  
  We believe this is a generation-defining mission: by
  accelerating IT, businesses can evolve faster, unlocking
  productivity across industries. Major enterprises already
  trust us with their most critical systems, we just closed a
  $50M+ Series A from top-tier funds, and we're still early
  enough that what you build here defines the company.
  
  We're a small, talent-dense team doing our life's work at
  Conduct. We value ownership, high velocity, and low-ego
  collaboration. If you bring that same drive, we'll make sure
  this is the place you do yours too.
  
  Who We Hire
  
  We're looking for an developer who understands ABAP inside
  out, down into implementation and runtime details, and is
  excited about what becomes possible when you put AI on top
  of it.
  
  You'll stand out if you:
  
  - Have 5+ years of hands-on ABAP and SAP development
    experience: technical consultant, ABAP developer,
    solutions architect, or similar
  - Understand how SAP systems are actually structured beneath
    the surface: data models, BAPIs, IDocs, function modules,
    enhancement frameworks
  - Have worked within or alongside large SAP implementations
    and migrations, understanding the complexities that arise
    from these
  - Are eager to work beyond ABAP, including in writing AI
    agents, backend and frontend, infrastructure, etc.
  - Bring strong, pragmatic engineering instincts and care about
    code that holds up in production at enterprise scale
  
  We hire the best, wherever they come from: we sponsor visas
  and are based in London. We believe diverse teams build
  better products and especially encourage underrepresented
  groups in tech to reach out.
  
  What You'll Own
  
  We don’t box people by background or role: if you have a
  strength in an area, we’d love for you to contribute. This
  means everything from writing developing our connector in
  ABAP, developing AI agents that execute ABAP development
  tasks, to contributing to product direction and
  implementation.
  
  You'll speak to customers, shape product direction, and ship
  things that run inside some of the most complex enterprise
  environments in the world. As an SAP specialist you’ll catch
  the edge cases, constraints, and quirks that only someone
  with that experience would spot.
  
  Our Stack
  
  Our stack prioritises what matters: shipping to
  customers—fast—without compromising on quality and
  engineering.
  
  Fundamentals are more important to us than familiarity with
  any technology or tool: if you're strong, we’re sure you'll
  pick it up fast. Here’s our setup:
  
  - ABAP: Custom reports to integrate ABAP-based systems with
    the Conduct platform
  - React, Vite, TanStack frontend
  - Kotlin backend: Modern and expressive, paired with the
    maturity, tooling, and depth of the Java ecosystem. Lets
    us ship fast now without painting ourselves into a corner
    later.
  - Temporal and PortKey: Absorbs infrastructure complexity
    around durable execution and enterprise-compliant LLM
    routing, so we can focus on shipping instead.
  - Specialised LLM Harness: Built from hard-earned experience
    to give agents maximum freedom and intelligence without
    compromising on enterprise control, governance, or
    reliability.
