description: |
  Job Role: AI Developer Intern (LLM + MCP + AI Trends)
  
  Role Overview: We are hiring an AI Developer Intern who can
  both:
  
  - Build AI systems (LLMs, MCP servers, APIs)
  - Continuously track and evaluate new AI tools & releases
  
  This is a builder + researcher hybrid role, but execution >
  research.
  
  Key Responsibilities:
  
  - AI Development (Primary Focus)
    - Build applications using: OpenAI, Anthropic, Google DeepMind
    - Implement: Tool/function calling, Context handling, Prompt
      pipelines
  - MCP Server & AI Systems
    - Build and maintain MCP (Model Context Protocol) servers
    - Create tools that LLMs can use: APIs, Internal systems
    - Design: Multi-step workflows, Structured outputs
  - AI Tools & Trends Tracking (Important)
    - Stay updated with: New AI tools launches, Model updates, Dev
      frameworks
    - Sources to track: Twitter (AI builders), Product Hunt,
      GitHub trending
    - Filter: What is useful vs hype
  - Rapid Prototyping
    - Build quick POCs using new tools
    - Example: Try new model → integrate → test → report
    - Convert useful tools into: Internal features, Product
      improvements
  - Weekly Intelligence Reports
    - Share: 5–10 new tools, 2 tools worth implementing, 1 working
      demo/POC
  
  Required Skills:
  
  - Must-Have: Python or JavaScript (strong basics), API
    understanding, Basic LLM knowledge: Tokens, Context
    Prompting, Critical (Filter Here), Can build, not just
    explore, Understands: MCP / tool calling, How LLM apps
    actually work, Cursor, Antigravity
  - Good to Have: RAG / vector DB, FastAPI / Node backend,
    GitHub projects
  
  Ideal Candidate:
  
  - Builds side projects
  - Actively explores new AI tools
  - Thinks: “How can I use this in real product?”
  - Not a YouTube learner, a doer
