description: |
  Joining Amex Tech means discovering and shaping your
  contribution to something big. Here, you can work alongside
  talented tech teams and build a unique career with the
  Powerful Backing of American Express. With a range of
  opportunities to work with the latest technologies, and a
  commitment to back the broader engineering community through
  open source, our mission is to power your success. Because
  Amex Tech is powered by our technology, our culture, and our
  colleagues.
  
  The Technology organization enables and accelerates the
  company’s growth strategies, delivering global capabilities
  and services in support of Amex’s customers and colleagues,
  while maintaining 24/7 servicing and availability to ensure
  an uninterrupted, high-quality customer experience.
  Technology provides the foundation for everything we do in
  the company while driving differentiation through building
  and leveraging innovative technology and data insights.
  
  At American Express, AI is reshaping the future of commerce
  and redefining the experiences our commercial customers and
  card members expect. Within Amex Technology, we are building
  platforms, products, and governance that enable agentic AI
  systems to operate responsibly and at scale across the
  enterprise.
  
  Our focus is on agentic AI development: designing
  intelligent, adaptive systems that can plan, reason, and act
  across complex workflows with appropriate levels of
  autonomy. These systems power autonomous workflows, decision
  support, and customer-facing experiences—while meeting the
  high standards for security, explainability, reliability,
  and compliance required in financial services.
  
  We partner closely with product, design, and business teams
  to deliver agentic capabilities that reduce operational
  friction, improve decision-making, and transform how
  customers interact, transact, and grow.
  
  The Role
  
  As a Senior AI Engineer I – Agentic AI, you will be a core
  builder responsible for turning complex, ambiguous problems
  into production-grade agentic systems that operate on real
  financial data, serve real customers, and meet real
  regulatory requirements.
  
  You will work end to end: shaping solutions with product and
  design, building and shipping production code, and owning
  what you deliver after launch. The scope of this role spans
  customer-facing LLM-powered features, agentic systems that
  automate financial workflows, and internal AI capabilities
  that enable other engineers to build with AI safely and
  efficiently.
  
  This is not a research-only role. We are looking for
  engineers who are comfortable operating with autonomy,
  exercising sound judgment, and pushing the technical
  envelope within the realities of a regulated financial
  environment.
  
  Responsibilities
  
  - Design, build, and ship LLM-powered and agentic product
    features that change how customers manage their finances.
  - Build agentic AI systems that reason over context, invoke
    tools, take real actions, and recover gracefully from
    failure.
  - Architect and implement production-grade RAG pipelines over
    sensitive financial data, with strict requirements for
    correctness, auditability, and safety.
  - Contribute to shared AI infrastructure, including LLM
    services, agent orchestration frameworks, and evaluation
    and monitoring tooling, that scales agentic development
    across Amex Technology.
  - Own the systems you build in production, including
    reliability, latency, cost, and failure modes.
  - Work closely with product and design partners; engineers in
    this role are expected to think in terms of customer
    outcomes, not just technical execution.
  
  Technical Environment
  
  We don’t hire to a narrow checklist, but candidates should
  be comfortable operating in a modern, enterprise-scale
  environment with a strong emphasis on agentic AI.
  
  Core engineering stack
  
  - Languages: Python, Go, TypeScript
  - Cloud and infrastructure: AWS and/or GCP, Kubernetes
  - APIs and services: REST, gRPC
  - Distributed systems: event-driven architectures, including
    Kafka
  
  Agentic AI and ML
  
  - Commercial and open-source LLMs integrated into agentic
    workflows
  - Tooling for agent orchestration, retrieval-augmented
    generation, vector storage, and evaluation
  - Strong schema, validation, and state management practices
  
  AI-assisted development
  
  - Fluency with AI-assisted and agentic development workflows
    for design, implementation, testing, debugging, and
    refactoring
  - Thoughtful use of these tools while maintaining production-
    quality engineering standardsAll systems are built to meet
    high standards for reliability, security, and
    auditability, reflecting the responsibility of deploying
    autonomous AI in a financial services environment.
  
  Qualifications
  
  - 5+ years of software engineering experience, including
    meaningful production experience with LLMs or applied ML
    systems.
  - A track record of shipping AI-powered or agentic systems
    that real users depend on.
  - Strong engineering fundamentals across backend systems,
    APIs, data pipelines, and cloud infrastructure.
  - Hands-on experience with modern LLM tooling and agentic
    patterns and architectures.
  - Fluency with AI-assisted and agentic development workflows.
  - Strong sense of ownership and sound technical judgment.
  - Comfort operating with ambiguity and turning it into shipped
    reliable product.
  - A strong product mindset and customer orientation.
  
  Preferred Qualifications
  
  - Experience building agentic systems in fintech or other
    regulated industries.
  - Experience as a founding engineer or early technical
    contributor in high-growth environments.
  - Demonstrated ability to ship technically complex systems in
    regulated contexts that customers actively rely on.
  - Meaningful open-source contributions, particularly in AI or
    developer tooling.
  - Depending on factors such as business unit requirements, the
    nature of the position, cost and applicable laws, American
    Express may provide visa sponsorship for certain
    positions.
  
  About Us
  
  At American Express, our culture is built on a 175-year
  history of innovation, shared values and Leadership
  Behaviors, and an unwavering commitment to back our
  customers, communities, and colleagues. From delivering
  differentiated products to providing world-class customer
  service, we operate with a strong risk mindset, ensuring we
  continue to uphold our brand promise of trust, security, and
  service.
  
  As part of Team Amex, you’ll experience our powerful backing
  with comprehensive support for your holistic well-being and
  many opportunities to learn new skills, develop as a leader,
  and grow your career. Here, your voice and ideas matter,
  your work makes an impact, and together, you will help us
  define the future of American Express.
  
  About the Team
  
  We back you with benefits that support your holistic well-
  being so you can be and deliver your best. This means caring
  for you and your loved ones' physical, financial, and mental
  health, as well as providing the flexibility you need to
  thrive personally and professionally:
  
  - Competitive base salaries
  - Bonus incentives
  - 6% Company Match on retirement savings plan
  - Free financial coaching and financial well-being support
  - Comprehensive medical, dental, vision, life insurance, and
    disability benefits
  - Flexible working model with hybrid, onsite or virtual
    arrangements depending on role and business need
  - 20+ weeks paid parental leave for all parents, regardless of
    gender, offered for pregnancy, adoption or surrogacy
  - Free access to global on-site wellness centers staffed with
    nurses and doctors (depending on location)
  - Free and confidential counseling support through our Healthy
    Minds program
  - Career development and training opportunities
  
  For a full list of Team Amex benefits, visit our Colleague
  Benefits Site.
  
