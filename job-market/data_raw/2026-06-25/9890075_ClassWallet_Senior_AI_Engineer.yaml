title: Senior AI Engineer
company: ClassWallet
location: USA
work_type: FULL_TIME
description: |
  ClassWallet, a leading financial technology company in the
  United States, is seeking to hire a Senior AI Engineer to
  join our team.
  
  ClassWallet is a financial technology company serving
  agencies delegated responsibility to manage public funds.
  Agencies use ClassWallet to get public funds to the right
  people, and ensure the funds are used for the right purpose.
  ClassWallet’s suite of products and services empowers agency
  administrators to dramatically increase efficiency of funds
  distribution and spend compliance, reduce programmatic
  costs, maximize the full potential impact of the program,
  and satisfy the needs and expectations of policymakers,
  constituents and public reporting. ClassWallet has processed
  over $3.5 Billion to date and serves public agencies across
  33 states.
  
  The Company has developed an industry-defining digital
  wallet solution which has gained rapid traction among state
  and local agencies and school districts across America.
  ClassWallet ranks as the 61st fastest growing software
  company on the prestigious Inc. 5000 list of fastest-growing
  private companies and the 21st fastest growing financial
  technology company on the Deloitte Technology Fast 500 in
  2023.
  
  While the Company delivers immense business value, the
  social impact of ClassWallet is a fabric that runs through
  its mission and corporate culture. As a result of
  ClassWallet’s innovation, public programs run with
  exponentially more efficiency and the impact and breadth of
  the programs for the individuals they serve is dramatically
  higher. This mission compliments the Company mission-based
  culture with focus on gratitude and work-life balance.
  
  About the Role
  
  The Senior AI Engineer is the technical force multiplier
  behind ClassWallet’s AI transformation. Partnering directly
  with the Sr. Director, AI & Automation, you will design,
  build, and ship the AI agents, automations, and internal
  tools that accelerate how every team in the company gets
  work done — and you will selectively contribute AI
  capabilities into our customer-facing products.
  
  This is a hands-on, builder-first role. You will spend your
  days writing code, prototyping agents, embedding with
  business teams to understand their workflows, and turning
  ambiguous problems into shipped solutions that produce
  measurable results in days and weeks — not quarters. You’ll
  set the technical bar for how AI is built and operated at
  ClassWallet.
  
  If you light up at the idea of giving every employee a
  meaningful AI capability, watching teams transform their
  throughput, and occasionally putting that same craft into a
  product millions of dollars in public funds flow through,
  this is your role.
  
  What You’ll Do
  
  Build and Ship
  
  - Design, prototype, and deploy AI agents, LLM-powered
    workflows, and automations that measurably accelerate
    internal work across operations, finance, support,
    compliance, sales, and engineering
  - Build production-grade integrations between AI systems and
    ClassWallet’s stack — CRM, support, finance, ops, and
    engineering tools
  - Develop reusable components, prompt libraries, evaluation
    frameworks, and internal platforms so AI adoption scales
    across the company
  - Contribute AI capabilities to customer-facing product
    features in partnership with Product & Engineering
  
  Embed and Translate
  
  - Sit alongside business teams to understand their workflows,
    identify high-leverage AI opportunities, and ship
    solutions to those teams directly
  - Pair with non-technical employees to build, refine, and
    operationalize their own AI workflows
  - Translate ambiguous business problems into concrete,
    shippable systems
  
  Set the Technical Bar
  
  - Make pragmatic choices across the AI stack: LLMs, RAG, agent
    frameworks, RPA, low-code automation, and traditional
    software engineering — picking the right tool for the job
  - Establish standards for AI development at ClassWallet: code
    quality, evaluation, monitoring, prompt management, and
    cost control
  - Stay ahead of a fast-moving field and bring relevant
    innovations into the company before they’re obvious
  
  Operate Responsibly
  
  - Partner with the Sr. Director, AI & Automation and
    Legal/Compliance on responsible AI practices, data
    privacy, and regulatory alignment appropriate to fintech
    and public-sector data
  - Build evaluation and observability into AI systems so we
    know they are working, improving, and behaving as intended
  
  Requirements
  
  - 6+ years of professional software engineering experience,
    with 2+ years building AI/ML or LLM-based systems in
    production
  - Strong proficiency in Python and modern AI development
    tooling — OpenAI, Anthropic Claude, LangChain/LangGraph,
    LlamaIndex, or comparable agent and RAG frameworks
  - Demonstrated experience designing and shipping AI agents and
    LLM workflows that solved real business problems with
    measurable outcomes
  - Working fluency with automation platforms (Zapier, n8n,
    Make, UiPath, or similar) and the judgment to choose
    between code and low-code for the job at hand
  - Comfort with APIs, webhooks, and integrating across SaaS
    systems (Salesforce, HubSpot, Jira, Slack, Google
    Workspace, etc.)
  - Pragmatic engineering instincts — bias to ship, comfort with
    ambiguity, ability to deliver value quickly
  - Strong communication skills; able to move fluently between
    executive stakeholders, business users, and engineers
  - Based in the US and able to work effectively in a remote or
    hybrid setup, with periodic travel to HQ as needed
  
  Preferred
  
  - Experience in fintech, govtech, or other regulated
    industries
  - Familiarity with vector databases, embeddings, evaluation
    frameworks (e.g., Ragas, OpenAI Evals), and AI
    observability tooling (e.g., LangSmith, Helicone,
    Langfuse)
  - Experience building internal AI platforms or developer tools
    that scaled across an organization
  - Prior work shipping customer-facing AI features in a SaaS
    product
  - Background in product engineering, data engineering, or
    applied ML
  - A track record of coaching non-technical colleagues into
    productive AI users
  
  Benefits
  
  ClassWallet is a positive, family-oriented team environment.
  Our focus is on encouragement, positive reinforcement, and
  gratitude. We work hard and are highly motivated to win but
  with a healthy perspective on life.
  
  We offer an excellent salary and benefits commensurate with
  experience.
  
  ClassWallet.com is proud to be an Equal Opportunity
  Employer. Applicants are considered for all positions
  without regard to race, color, religion, sex, national
  origin, age, disability, sexual orientation, marital or
  veteran status.
