title: Senior AI Engineer, Media
company: Acquisition.com
location: USA
work_type: FULL_TIME
description: |
  Role
  
  ACQ Media is the in-house media engine behind
  Acquisition.com, producing long-form series, podcasts, and
  daily social content at studio scale for millions of
  viewers. We are building an AI-native production system that
  makes our team measurably faster, more consistent, and more
  capable than any team operating without it.
  
  The Senior AI Engineer, Media is the technical builder who
  ships that system. You design, construct, and maintain the
  agentic workflows, internal AI tools, and generative media
  pipelines that power every department in our studio
  operation. This is a production engineering role: prototype
  rapidly, but ship to a bar production teams can rely on
  every day.
  
  This is a senior individual-contributor engineering role.
  You are not managing a team, and you do not own the
  strategic roadmap — the Head of AI does. You make
  architectural and shipping decisions inside that roadmap,
  flag what will not work, and ship on a timeline production
  can plan against.
  
  You report to the Head of AI, Media with a dotted line to
  the CTO. A second hire — a generative-media specialist
  focused on the creative tooling layer — will follow this one
  and partner with you on the deepest creative work.
  
  Responsibilities
  
  - Design, build, and maintain agentic AI workflows, owning the
    full lifecycle from prototype through production
    monitoring. Framework choice is yours —
    LangChain/LangGraph, CrewAI, Google ADK, Anthropic’s
    managed agents, OpenAI Agents SDK, or no framework at all
    if that is the right call
  - Build and operate generative media pipelines (video, audio,
    captioning, thumbnails, long-form to short-form
    repurposing) using ComfyUI, Fal, and direct model APIs.
    You will partner with the generative-media specialist on
    the deepest creative-tooling work once that role is filled
  - Ship internal AI tools and dashboards (including search,
    retrieval, and MCP-exposed surfaces) that give Post, Art,
    Content, and Marketing teammates direct access to AI
    workflows without engineering support
  - Build evaluation, monitoring, and failure-recovery systems
    for every workflow you deploy, including managed compute,
    model hosting, and API cost optimization
  - Partner with the CTO and Tech team on infrastructure,
    deployment, security, and IP and data handling standards
    across all AI systems
  - Translate department pain points into engineered solutions
    with measurable outcomes, train the receiving teams, and
    document every system you ship
  
  Requirements
  
  - 5+ years building production software, with strong Python,
    API design, databases, and cloud infrastructure
    fundamentals. Enough frontend competence to ship a usable
    internal tool without a dedicated frontend engineer
  - 2+ years building production agentic AI systems — framework-
    based (LangChain, LangGraph, CrewAI, Google ADK, Anthropic
    managed agents, OpenAI Agents SDK, AutoGen, or equivalent)
    or framework-free with custom orchestration. Hands-on
    experience with RAG (including multi-modal), evaluation,
    and prompt engineering
  - Strong instincts for agent-tool interface design. Direct MCP
    experience is a plus; the bar is the ability to reason
    clearly about tool surfaces, schemas, granularity, and
    statefulness
  - Proven track record building internal tools, dashboards, and
    API integrations that non-technical users actually adopt.
    Comfort partnering directly with creative roles — editors,
    writers, producers, designers — and translating their
    workflows into systems
  - Demonstrated ability to operate in ambiguity, prototype
    rapidly, and ship production-grade systems without a fully
    scoped specification
  
  Preferred (not required)
  
  - Direct, professional experience running media production AI
    workflows with tools like ComfyUI, Fal, and similar
    generative platforms (including video diffusion, LLMs, and
    audio generation models)
  - Experience working inside or directly supporting media,
    video production, or content operations teams
  
  Results
  
  - Two or more production-grade AI workflows deployed and
    actively used by department teams within 90 days, with
    monitoring and evaluation in place. The first will be a
    multi-modal search and retrieval tool for our long-form
    content library, surfaced both as a web portal and an MCP
    server
  - Measurable reduction in turnaround time for at least one
    major production pipeline (editing, thumbnails,
    repurposing, or captioning) within 90 days
  - Within 12 months, the AI systems you ship are demonstrably
    enabling content output to scale faster than headcount on
    the production teams using them, measured against pre-
    launch baselines
  - Within 12 months, external AI agency and contractor spend is
    reduced to near-zero for work that falls within the
    systems you have shipped (excludes foundation model API
    costs)
  - Every deployed system has documentation, a named owner on
    the receiving team, a success metric, and a maintenance
    plan
  
  Schedule
  
  - Standard business hours, Pacific or Mountain time alignment
    preferred for studio overlap, with occasional flexibility
    for production deadlines and launch windows
  
  Location
  
  - Full-time, remote (US-based)
  - Light travel may be required for studio events
  
  Compensation:
  
  - $175,000 - $200,000 base salary
  - The salary range may be inclusive of several levels that
    would be applicable to the position. Final salary will be
    based on a number of factors including, level, relevant
    prior experience, skills, and expertise. This range is
    only inclusive of base salary, not benefits (more details
    below).
  
  Benefits:
  
  We offer a comprehensive, evolving benefits package designed
  to support your health, family, and wellbeing. Some key
  offerings:
  
  - Flexible Unlimited Paid Time Off and Company-wide Holidays
  - Employer sponsored Medical, Dental, & Vision plans
    - $1,950 annual Employer HSA contribution
    - FSA options including dependent care
    - Employee assistance program and mental health resources
  - Employer match program for 401(k), eligible for both
    Traditional and Roth accounts
  - $1,200 annual wellness reimbursement through JOON that
    supports health, family care, pet care, fitness, and more!
  - For local or visiting team members, enjoy access to a state
    of the art gym at our HQ in Las Vegas
  
  * Benefits eligibility applies only to full-time roles.
  
  ACQ Core Values:
  
  Our core values are the heart and soul of this incredible
  company. The right person for this role will appreciate each
  of these values, personally subscribe to them, and
  understand why each is critical to having a great business.
  
  Competitive Greatness
  
  Be at your best when your best is needed. Enjoyment of a
  hard challenge. Those who have the drive to constantly
  improve, the superior intellect and long term commitment to
  see incremental improvements become compounding returns.
  
  Sincere Candor
  
  Have the self awareness to accurately perceive and
  communicate hard truths that improve others and self, the
  courage to do so, and the humility to accept them, even when
  it hurts. Nothing great can be built without feedback:
  internally or externally.
  
  Unimpeachable Character
  
  Be the type of person with whom people are always proud to
  associate, personally and professionally. We look for true
  alignment of thoughts, words, and actions towards a goal
  worth pursuing.
