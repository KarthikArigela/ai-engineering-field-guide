description: |
  Position: Frontend Developer Location: Noida, India Work
  Mode- Onsite Experience Required: 5+ Years
  
  Job Summary
  
  We are seeking an experienced Frontend Developer with strong
  expertise in modern web technologies to design and develop
  scalable, high-performance web applications. The ideal
  candidate should have deep experience in React development,
  Micro-Frontend architecture using Webpack Module Federation,
  and modern JavaScript/TypeScript frameworks.
  
  You will collaborate closely with backend engineers, UI/UX
  designers, and DevOps teams to build responsive, secure, and
  user-friendly web applications.
  
  Key ResponsibilitiesFrontend Development
  
  - Develop high-quality, scalable, and maintainable frontend
    applications using React.js.
  - Implement Micro-Frontend architecture using Webpack Module
    Federation.
  - Build reusable components and front-end libraries for future
    use.
  - Write clean, efficient, and well-documented JavaScript /
    TypeScript code.
  
  API Integration
  
  - Integrate frontend applications with backend services via
    REST APIs.
  - Collaborate with backend teams (Java-based services) to
    design and consume APIs effectively.
  - Ensure secure data communication between frontend and
    backend systems.
  
  Authentication & Security
  
  - Implement authentication and authorization mechanisms using
    OAuth, JWT, and SSO.
  - Ensure compliance with security best practices and data
    protection standards.
  
  UI/UX Development
  
  - Translate UI/UX designs into responsive, high-performance
    web applications.
  - Ensure applications are fully responsive across devices and
    browsers.
  - Optimize application performance and user experience.
  
  DevOps & CI/CD
  
  - Participate in CI/CD pipelines to automate builds, testing,
    and deployments.
  - Work with DevOps teams to ensure smooth integration and
    deployment workflows.
  - Maintain code quality through testing, code reviews, and
    best practices.
  
  Collaboration
  
  - Work closely with Java backend teams to ensure seamless
    integration.
  - Participate in sprint planning, code reviews, and agile
    ceremonies.
  - Mentor junior developers and promote best development
    practices.
  
  Required Skills (Must Have)
  
  - 5+ years of professional frontend development experience
  - Strong expertise in React.js
  - Experience with Micro-Frontend architecture (Webpack Module
    Federation)
  - Strong knowledge of JavaScript (ES6+) and TypeScript
  - Experience integrating REST APIs
  - Knowledge of authentication protocols including OAuth, JWT,
    and SSO
  - Experience working with CI/CD pipelines
  - Strong experience in Responsive UI/UX development
  - Experience collaborating with Java backend teams
  - Familiarity with version control systems (Git)
