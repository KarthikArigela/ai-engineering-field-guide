description: |
  Job Description:
  
  Roles & Experience
  
  - At least 8 - 10 years of Test Automation experience
  - Prompt Engineering: Have good command on prompt engineering
  - Programming Languages: Proficiency in JavaScript or
    TypeScript or similar languages for AI and automation.
  - AI & Machine Learning: Understanding of machine learning
    concepts & LLMs
  - GitHub Copilot – experience in using GitHub Copilot
  - Automation Tools: Experience with Playwright test automation
    tool and ability to integrate AI models.
  - Software Testing: Strong grasp of testing methodologies and
    test case design & willingness to perform manual testing
    if necessary
  - Problem-Solving: Ability to solve complex testing challenges
    using AI.
  - Communication: Clear articulation of AI testing strategies
    to stakeholders.
  - Adaptability: Willingness to learn new AI technologies and
    adjust strategies.
  - Planning & Execution: Capability to plan and manage AI-
    driven testing projects.
  - Continuous Learning: Commitment to staying updated with
    advancements in AI and testing.
  - Strong knowledge of Software Testing concepts, Standard Test
    Methodologies and best practices.
  - Familiarity with Test Management and Defect Tracking tools.
  - Effective communication and interpersonal skills to
    collaborate with diverse stakeholders.
  - Ability to prioritize and manage multiple tasks in a dynamic
    work environment.
  - Knowledge of agile development methodologies (e.g., Scrum,
    Kanban) is a plus.
  
