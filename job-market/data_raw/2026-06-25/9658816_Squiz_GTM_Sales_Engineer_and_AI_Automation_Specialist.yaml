job_id: 9658816
title: GTM Sales Engineer and AI Automation Specialist
company: Squiz
location: Los Angeles, USA
work_type: FULL_TIME
description: |
  We're looking for a GTM Sales Engineer and AI Automation
  Specialist to build and scale the systems that power our go-
  to-market engine.
  
  This is a hands-on role for someone who understands AI,
  modern sales technology, revenue operations, and the rapidly
  evolving AI landscape. You will sit at the intersection of
  sales, engineering and RevOps, working with our global Sales
  and Marketing functions, and reporting to our CRO.
  
  You'll be responsible for designing and implementing the
  tools, workflows, automations, and intelligence systems that
  help our teams identify the right accounts, prioritize
  opportunities, and engage prospects and leads more
  effectively.
  
  Rather than relying on sales reps to manually research
  accounts and determine where to focus their time, you'll
  build the underlying systems that continuously analyze data,
  surface opportunities, and automate decision-making across
  the customer lifecycle.
  
  Key Responsibilities
  
  Sales Automation & Revenue Operations
  
  - Design and build automated sales workflows that identify,
    prioritise, route prospect and lead opportunities based on
    account signals and revenue data.
  - Create systems that determine which accounts should be
    engaged, then they should be engaged and why they matter
  - Leverage AI at the centre of our operation to support Sales
    Reps outbound activity
  - Automate repetitive operational processes across the revenue
    organisation
  - Improve forecasting, pipeline management, and lifecycle
    visibility through scalable systems and automation
  
  Systems & Workflows
  
  - Own and optimise the go-to-market technology stack across
    Sales
  - Design integrations and workflows that ensure data moves
    seamlessly between systems
  - Build automated processes that eliminate manual handoffs
  - Evaluate and implement new technologies that improve
    productivity and scalability
  
  Revenue Intelligence & Data Operations
  
  - Develop systems that combine customer, account, and
    behavioural data to generate actionable insights
  - Implement automated enrichment, segmentation, and account
    monitoring processes
  - Build reporting frameworks and operational dashboards that
    improve decision-making
  - Improve data quality, governance, and visibility across the
    revenue organisation
  
  Cross-Functional Enablement
  
  - Partner with Sales leaders to understand operational
    challenges and identify automation opportunities
  - Help the sales team adopt new systems, workflows, and best
    practices
  - Serve as a subject matter expert on modern RevOps, sales
    automation, and AI-powered workflow design
  
  What Success Looks Like
  
  In this role, success means:
  
  - Building automated systems that consistently identify and
    prioritize the highest-value accounts and opportunities
  - Reducing the amount of manual research and administrative
    work required from sales teams
  - Creating workflows that automatically surface the right
    accounts, contacts, and actions at the right time
  - Improving pipeline quality, forecasting accuracy, and
    revenue visibility
  - Connecting data to create a unified view of the customer
    journey
  - Leveraging AI-powered tools and data signals to improve
    targeting, qualification, engagement, and expansion
    efforts
  
  Key Skills and Experience
  
  - You have strong AI skills, with an “AI first” mindset, and
    know how to increase efficiencies through the use of AI
    for yourself and for sales teams
  - You understand the broad sales stack ecosystem and know how
    to evaluate what works best for different GTM use cases
  - You have worked in Revenue Operations, GTM Systems, Sales
    Automation, AI Operations, GTM Engineering or similar role
    within a B2B SaaS environment
  - Strong understanding of modern GTM technology ecosystems,
    CRM architecture, systems integration, and revenue
    operations best practices
  - Hands-on experience building AI-powered automation workflows
    using platforms such as Clay, n8n, Make, Zapier, OpenAI,
    Anthropic, and AI agent frameworks
  - Advanced proficiency with tools including HubSpot,
    Salesforce, Outreach, Salesloft, Apollo, 6sense, Segment,
    Gong, and related sales and data platforms
  - Experience designing and managing autonomous signal-to-
    outreach pipelines and lifecycle automation
  - Strong analytical and systems-thinking capability with the
    ability to architect scalable operational processes and
    improve forecasting, pipeline visibility, and GTM
    performance
  - Skilled in leveraging data to drive account prioritisation,
    personalization, and revenue insights
  - Builder mindset with strong problem-solving capability,
    stakeholder communication skills, and a passion for
    operational efficiency
  - Bonus: Experience with ABM frameworks, technographic tools,
    custom scripting (Python or JavaScript), and advanced Clay
    workflow development
  
  Why This Role Matters to us:
  
  This role is foundational to how we scale.
  
  You’ll help build the operational backbone of the GTM team,
  designing the AI-powered systems and workflows that allow us
  to move faster and operate smarter.
  
  Our sales team is experienced and relationship-driven. The
  gap is systematic signal intelligence and automation. You’ll
  build the engine that knows which accounts to prioritise and
  when to engage.
  
  If you’re excited by AI, obsessed with systems, and
  passionate about building the future of GTM operations, we’d
  love to hear from you.
  
  About Squiz
  
  Squiz helps complex, service-led organisations harness the
  power of digital, improving the services they offer online.
  
  Founded in 1998, Squiz grew during the rise of the internet.
  Since then, we have evolved from a simple web content
  management system into a full digital experience platform
  (DXP), helping customers make the shift from being content
  managers to experience creators.
  
  The Squiz DXP brings together content, search, data and
  applications in one place. To get the most out of the
  platform, customers can collaborate with our digital experts
  to design solutions and adapt as demands change.
  
  We are headquartered in Australia, with teams and customers
  across the globe, and offices in New Zealand, the United
  States, the United Kingdom and Poland.
  
  Our Benefits
  
  - Squiz Flex - flexibility to work from home or one of our
    WeWork co-working spaces
  
  - 25 Days Paid Time Off, 5 Days Sick Leave
  - US Federal Holidays Observed
  - Compassionate Leave
  - Paid Parental Leave
  - Health, Dental and Vision under Aetna
  - $200 Annual Healthy Lifestyle Allowance
  - 401K Employee Contributions
  - Excellent Career Development Opportunities
  
  Salary: $95,000 - $135,000 USD
