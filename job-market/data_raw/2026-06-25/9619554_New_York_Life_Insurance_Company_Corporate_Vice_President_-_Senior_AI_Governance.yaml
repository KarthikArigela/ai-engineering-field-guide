title: "Corporate Vice President - Senior AI Governance & Platform Operations Engineer, Microsoft 365"
company: New York Life Insurance Company
location: New York, USA
work_type: FULL_TIME
company_size: 12,000 Employees
description: |
  Location Designation: Hybrid - 3 days per quarter  Role
  Overview We are seeking a Senior AI Governance & Platform
  Operations Engineer to lead the enablement, governance, and
  day-to-day operationalization of Microsoft Copilot and Power
  Platform AI capabilities across the enterprise M365
  ecosystem. This role sits at the intersection of AI platform
  operations, enterprise governance, vendor management, and
  change enablement. The ideal candidate is a hands-on
  technologist who can run Copilot and Power Platform at scale
  while navigating the compliance, licensing, and data-
  security landscape that accompanies AI adoption in a
  regulated environment. You will partner with enterprise
  architects, IT operations, Legal, Risk, Information
  Security, Procurement, and business stakeholders to ensure
  Microsoft's AI tools are deployed securely, governed
  rigorously, and adopted effectively. The focus is platform
  operations and governance-not custom AI model development.
  What You'll Do: M365 Copilot - Governance & Operations
  
  - Lead enterprise-wide deployment, configuration, and
    lifecycle management of Microsoft Copilot across Teams,
    Outlook, Word, Excel, and other M365 applications
  - Manage tenant-level Copilot controls including branding,
    agent settings, and admin surface configurations
  - Run Copilot pilots to evaluate new features, assess
    enterprise readiness, and report findings to leadership
  - Translate Copilot usage and licensing telemetry into
    executive-ready adoption metrics
  - Monitor and mitigate Copilot risk surfaces-oversharing, data
    boundary exposure, and interaction with sensitivity labels
  
  Power Platform - Licensing, Credits & Governance
  
  - Own the governance lifecycle for Power Platform licensing
    (Power Apps, Power Automate, premium SKUs), AI Builder
    credits, and the transition to the Copilot Credit model
  - Forecast credit consumption, enforce environment-level caps,
    and triage enforcement issues across Power Automate and
    agent flows
  - Apply tenant-wide governance standards including default-
    environment policies and credit-cap controls
  - Scope and execute against Microsoft funding programs such as
    ECIF
  
  AI Risk, Compliance & Data Security
  
  - Lead AI vendor risk reviews in coordination with Legal,
    Risk, and Information Security teams
  - Operationalize Microsoft Purview, sensitivity labeling, and
    Data Security Posture Management (DSPM) workflows-
    including content scanning, label recommendations, and
    governance automation
  - Coordinate AI-related submissions through enterprise risk
    and steering committees
  - Advise on eDiscovery, compliance, and data boundary
    considerations for Copilot and generative AI data
  
  Microsoft Partnership & Vendor Management
  
  - Serve as the primary AI technical liaison with Microsoft
    FastTrack, Unified Support, and product engineering teams
  - Run recurring technical briefings and roadmap reviews with
    Microsoft
  - Negotiate funding mechanisms and manage partner-led
    engagements to accelerate enterprise AI initiatives
  - Escalate and drive resolution of complex support cases
    across Copilot and Power Platform
  
  SharePoint & Collaboration AI
  
  - Deploy and govern AI features across SharePoint Online and
    OneDrive, including Copilot for SharePoint and content-
    readiness agents
  - Drive content hygiene, retention, and labeling strategies
    that directly improve Copilot answer quality
  - Manage enterprise SharePoint governance tooling (AvePoint or
    comparable) to maintain compliance at scale
  
  Analytics, Automation & Executive Reporting
  
  - Build usage-analytics dashboards and lightweight automations
    using Power BI, Power Automate, or comparable tools
  - Translate M365 and Power Platform telemetry into KPIs that
    resonate with senior stakeholders
  - Deliver actionable insights to leadership on adoption
    trends, platform ROI, and optimization opportunities
  
  Communications & Change Management
  
  - Draft and execute AI rollout communications for non-
    technical audiences-leadership updates, AMAs, and training
    campaigns
  - Lead an internal AI/Copilot community of practice and
    facilitate cross-functional working groups
  - Develop enablement programs including training sessions,
    onboarding materials, and self-service resources
  
  What You'll Bring: Experience
  
  - 7+ years in Microsoft 365 engineering, administration, or
    platform operations
  - 3+ years of hands-on experience deploying, governing, or
    enabling Microsoft Copilot (or comparable enterprise AI
    tooling) at scale
  - Demonstrated experience managing Power Platform licensing
    and AI Builder / Copilot Credit governance across multiple
    environments
  - Track record of leading AI vendor risk reviews and
    navigating enterprise risk and steering committee
    processes
  - Direct experience working with Microsoft FastTrack, Unified
    Support, or product engineering teams
  
  Technical Knowledge
  
  - Strong understanding of M365 architecture, tenant-level
    administration, Entra ID (Azure AD), and Microsoft Graph
  - Working knowledge of Microsoft Purview, sensitivity
    labeling, AI-specific risk frameworks (Purview AI Hub, AI
    baseline assessments), and DSPM concepts
  - Familiarity with enterprise SharePoint governance tooling
    and content-readiness practices that affect Copilot
    quality
  - Proficiency with Power BI, Power Automate, or comparable
    tools for building analytics dashboards and lightweight
    automations
  - Awareness of eDiscovery and compliance considerations
    specific to generative AI data
  
  Leadership & Soft Skills
  
  - Comfort acting as the senior voice on Copilot, Power
    Platform, and AI governance topics in cross-functional
    forums
  - Ability to operate fluidly across Technology, Security,
    Legal, Procurement, and business stakeholders
  - Strong vendor-management and contract-stewardship instincts,
    including decommission planning for replaced tools
  - Excellent communication skills with the ability to translate
    technical details into executive-ready narratives
  
  Preferred Qualifications
  
  - Microsoft certifications such as MS-600, MS-700, AZ-104,
    SC-400, or equivalent
  - Experience with Azure OpenAI, ChatGPT for Enterprise, or
    comparable enterprise AI platforms
  - Experience in regulated industries (financial services,
    insurance, or healthcare)
  - Familiarity with ITIL or other IT service management
    frameworks
  - Awareness of Microsoft's transition from AI Builder credits
    to the Copilot Credit model and its enterprise licensing
    impact
  
  Pay Transparency Salary Range: $147,500-$211,000 Overtime
  eligible: Exempt Discretionary bonus eligible: Yes Sales
  bonus eligible: No Actual base salary will be determined
  based on several factors but not limited to individual's
  experience, skills, qualifications, and job location.
  Additionally, employees are eligible for an annual
  discretionary bonus. In addition to base salary, employees
  may also be eligible to participate in an incentive program.
