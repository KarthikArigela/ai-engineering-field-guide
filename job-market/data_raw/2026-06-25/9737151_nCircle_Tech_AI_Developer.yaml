description: |
  Job Summary
  
  We are looking for a skilled AI Developer with strong
  experience in React.js and MERN technologies to design,
  develop, and deploy intelligent, scalable web applications.
  The ideal candidate will have hands-on experience in
  integrating AI/ML models into modern web applications and
  building responsive, high-performance user interfaces.
  
  Key Responsibilities
  
  - Design, develop, and maintain AI-driven web applications
    using React.js and MERN stack
  - Integrate Machine Learning / AI models (NLP, recommendation
    systems, chatbots, etc.) into frontend and backend systems
  - Build scalable backend APIs using Node.js and Express.js
  - Work with MongoDB for data storage, retrieval, and
    optimization
  - Collaborate with data scientists to productionize AI/ML
    models
  - Optimize application performance for speed, scalability, and
    security
  - Develop reusable UI components and maintain frontend
    architecture
  - Implement RESTful APIs and manage third-party AI
    integrations (OpenAI, Azure AI, AWS AI, etc.)
  - Write clean, maintainable, and well-documented code
  - Participate in code reviews, sprint planning, and technical
    discussions
  
  Required Skills & Qualifications Frontend
  
  - Strong experience with React.js (Hooks, Context API, Redux)
  - Proficiency in HTML5, CSS3, JavaScript (ES6+)
  - Experience with responsive design and modern UI frameworks
  
  Backend
  
  - Solid experience with Node.js, Express.js
  - Strong knowledge of MongoDB and data modeling
  - Experience building and consuming REST APIs
  
  AI / ML
  
  - Hands-on experience with AI/ML concepts (NLP, ML models,
    LLMs, embeddings, etc.)
  - Experience integrating AI services like OpenAI, Azure AI,
    Hugging Face, or AWS AI
  - Understanding of Python for AI/ML workflows is a plus
  - Experience deploying AI models into production environments
  
  General
  
  - Experience with Git/GitHub, CI/CD pipelines
  - Understanding of cloud platforms (AWS, Azure, or GCP)
  - Strong problem-solving and analytical skills
  - Good communication and collaboration skills
