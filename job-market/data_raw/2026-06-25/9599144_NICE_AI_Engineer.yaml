description: |
  At NiCE, we don’t limit our challenges. We challenge our
  limits. Always. We’re ambitious. We’re game changers. And we
  play to win. We set the highest standards and execute beyond
  them. And if you’re like us, we can offer you the ultimate
  career opportunity that will light a fire within you.
  
  Join us in shaping the future of financial market
  compliance. We're investing in a new AI capability at our
  R&D group in Alkmaar, and we're looking for an AI Engineer
  to help build it from the ground up.
  
  Our goal: build world-class AI models that help compliance
  officers sleep well at night — AI they can trust, and AI
  that gives them proof. To get there, we're investing in
  serious infrastructure (including dedicated high-end GPUs)
  and, more importantly, in the experts who know how to make
  the most of it. If you want to help shape this future and
  change the world of communication, market, and trade
  surveillance — we'd love to hear from you.
  
  What You'll Do
  
  - Co-found and shape our new AI engineering team in NiCE
    Netherlands — you'll influence architecture, tooling, and
    culture from day one
  - Train and fine-tune LLMs, SLMs, and other ML/DL models for
    compliance use cases such as communication surveillance,
    market surveillance, and trade surveillance
  - Architect training pipelines that integrate cleanly with our
    data capture platforms
  - Optimize inference pipelines to deliver AI capabilities
    cost-efficiently at scale
  - Evaluate emerging AI techniques (RAG, agents, distillation,
    fine-tuning strategies, etc.) and bring the most promising
    ones into production
  - Own explainability and auditability end-to-end — from
    choosing the right interpretation technique (SHAP,
    attention analysis, custom audit trails) to producing
    model cards and evidence artefacts that satisfy compliance
    officers and regulators. This is a first-class engineering
    concern here, not an afterthought.
  
  What We're Looking For
  
  - MSc or PhD in Computer Science, AI/ML, or a related field —
    or equivalent hands-on experience
  - Solid experience with modern ML/DL frameworks (PyTorch,
    TensorFlow, Hugging Face)
  - Experience training and/or fine-tuning LLMs or SLMs
  - Strong NLP foundations applied to real-world problems — for
    example: sequence classification, named entity
    recognition, semantic search, or RAG over unstructured
    financial communications. Familiarity with the quirks of
    financial and regulatory text (abbreviations, jargon,
    high-stakes edge cases) is a plus
  - Familiarity with ML infrastructure: training pipelines, GPU
    clusters, MLOps
  - Pragmatic mindset — you care about getting models into
    production, not just into notebooks
  - Bonus: experience in financial services, RegTech, or any
    highly regulated domain
  
  What We Offer
  
  - A rare opportunity to help build a new AI engineering team
    from day one
  - Access to dedicated high-end GPU infrastructure for model
    training and experimentation
  - A rock-solid data platform (NTR-X) on which to run your
    models
  - Competitive salary and strong benefits package
  - Personal development budget for training, conferences, and
    certifications
  - A dynamic, international company with a collaborative team
    culture
  - Hybrid working: 2 days in the office, 3 days from home
  - Meaningful work on systems used by some of the world's
    largest financial institutions
  
  About Us
  
  We're an energetic, technically-minded team of software
  builders based in Alkmaar. Our belief: AI-First is AI-Proof
  — meaning that the teams who embed AI deeply into how they
  build and operate will be the ones who remain relevant and
  competitive as the technology matures. We care deeply about
  engineering quality, craftsmanship, and building products
  that matter — and we're using AI to do it faster and better
  than ever before.
  
  Our culture is grounded in three pillars: competence,
  craftsmanship, and trustworthiness. We work in a social,
  international, and inclusive environment where your ideas
  shape our technology. Our office is easy to reach, our
  culture is collaborative, and we value a healthy work/life
  balance.
  
  The AI features we're actively building include false-
  positive elimination, automated investigation workflows, and
  advanced compliance search — capabilities that were
  previously intractable and are now unlocked by AI. Engineers
  joining now will be core contributors to this platform from
  the ground up.
  
  About NiCE
  
  NICE Ltd. (NASDAQ: NICE) software products are used by
  25,000+ global businesses, including 85 of the Fortune 100
  corporations, to deliver extraordinary customer
  experiences, fight financial crime and ensure public
  safety. Every day, NiCE software manages more than 120
  million customer interactions and monitors 3+ billion
  financial transactions.
  
  Known as an innovation powerhouse that excels in AI, cloud
  and digital, NiCE is consistently recognized as the market
  leader in its domains, with over 8,500 employees across 30+
  countries.
  
  NiCE is proud to be an equal opportunity employer. All
  qualified applicants will receive consideration for
  employment without regard to race, color, religion, national
  origin, age, sex, marital status, ancestry, neurotype,
  physical or mental disability, veteran status, gender
  identity, sexual orientation or any other category protected
  by law.
