title: AI Product Engineer
company: Forgent AI GmbH
location: Berlin, DEU
work_type: FULL_TIME
company_size: 20 Employees
description: |
  Intro
  
  Forgent AI is on a mission to build AI products for better
  public procurement. We are looking for a talented Product
  Engineer to join our founding technical team in Berlin.
  You'll play a crucial role in shaping our product and
  technology and building reliable, impactful software for a
  domain where it truly matters.
  
  The role
  
  As a Product Engineer at Forgent AI, you'll translate
  complex user needs within the public procurement sector into
  robust, user-facing AI applications. This is a unique
  opportunity to join an early-stage, mission-driven company
  and significantly influence its trajectory. You will work in
  an environment with unique technical constraints, applying
  state-of-the-art AI and full-stack techniques in novel ways
  to deliver frictionless, reliable user experiences. Working
  closely with founders and early users, you'll have
  substantial ownership, driving product features from concept
  to deployment and helping define our engineering culture.
  
  The day-to-day
  
  - Design, build, and iterate on full-stack features using our
    tech stack (Frontend: Vite, Typescript, React, and
    Tailwind; Backend: Python with FastAPI, and SQLAlchemy;
    Infra: AWS), integrating LLMs to solve core user problems
    while optimizing for performance, reliability, and
    security.
  - Work closely with founders and customers to deeply
    understand user challenges and ensure our product
    effectively addresses their needs.
  - Take full ownership of features from design through
    deployment and iteration, including contributing to stack
    maintenance, improving reliability, scalability, and
    managing/removing technical debt.
  - Actively collaborate with colleagues through code reviews,
    design discussions, knowledge sharing, and presenting your
    work in demos to foster learning and gather feedback.
  - Proactively identify opportunities for improvements –
    whether in the product, technical stack, or team processes
    – and take initiative to address them.
  
  You should apply if you
  
  - Are a skilled full-stack engineer with 3+ years of
    professional experience writing maintainable code and
    familiarity with common API patterns (e.g., REST). Note:
    We always make exceptions to this rule for exceptional
    engineering talent!
  - Have demonstrated that you can successfully translate
    complex ideas into working prototypes and shipping robust,
    real-world applications, particularly in secure or data-
    intensive domains.
  - Are an excellent communicator (written and verbal English)
    who thrives on deep collaboration, including code reviews
    and asynchronous design discussions.
  - Are a hard worker with a strong sense of urgency, who
    thrives in a fast-moving, high-responsibility environment
    where direct communication is the norm and speed matters
    as much as quality.
  - Are motivated by ownership, love to work in a fast-paced
    early-stage startup environment, are genuinely excited by
    our mission, and actively seek to improve yourself, your
    colleagues, and the team culture.
  - Have impressive achievements from previous careers and from
    side projects — we’re excited to hear about these!
  
  Nice to have
  
  - Practical experience building applications leveraging LLMs
    (e.g., using frameworks like LangChain or LlamaIndex) and
    with prompt engineering.
  - Experience with evals for LLM applications.
  - Experience with, or a strong interest in, UX/UI design
    principles.
  - Previous experience founding a company or working in an
    early-stage startup.
  - Good understanding of German (as the initial product is in
    German).
