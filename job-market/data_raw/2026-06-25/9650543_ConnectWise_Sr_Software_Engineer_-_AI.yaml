  General Summary:
  
  The Senior AI Engineer (2 + years of experience) is
  responsible for designing and implementing intelligent,
  scalable AI/ ML solutions with a focus on Machine Learning,
  Retrieval-Augmented Generation (RAG), Agentic AI and Modular
  Cognitive Processes (MCP). This role is ideal for
  individuals who are passionate about the latest AI & ML
  advancements and eager to apply them in real-world
  applications. The engineer will collaborate with cross-
  functional teams to deliver high-quality, production-ready
  AI systems aligned with business goals and technical
  standards.
  
  Location: Bangalore
  
  Work Type: Hybrid
  
  Essential Duties and Responsibilities:
  
  - Design, develop, and deploy AI-driven applications using RAG
    and Agentic AI frameworks.
  - Builds/ Optimizes machine learning models
  - Build and maintain scalable data pipelines and services to
    support AI workflows.
  - Implement RESTful APIs using Python frameworks (e.g.,
    FastAPI, Flask) for AI model integration.
  - Collaborate with product and engineering teams to translate
    business needs into AI solutions.
  - Debug and optimize AI systems across the stack to ensure
    performance and reliability.
  - Stay current with emerging AI tools, libraries, and
    research, and integrate them into projects.
  - Contribute to the development of internal AI standards,
    reusable components, and best practices.
  - Work with vector databases, embeddings, and LLMs (e.g.,
    GPT-4, Claude, Mistral) for intelligent retrieval and
    reasoning.
  - Participate in code reviews, testing, and validation of AI
    components using frameworks like pytest or unittest.
  - Document technical designs, workflows, and research findings
    for internal knowledge sharing.
  - Adapt quickly to evolving technologies and business
    requirements in a fast-paced environment.
  
  Knowledge, Skills, and/or Abilities Required:
  
  - 2–5 years of experience in AI/ML engineering.
  - Familiarity with AI/ ML concepts and application development
    using Generative AI.
  - Strong Python programming skills with a solid foundation in
    OOP and software engineering principles.
  - Hands-on experience with AI frameworks such as LangChain,
    LlamaIndex, Haystack, or Hugging Face.
  - Proficiency in CI/CD tools and workflows (e.g., Git, Docker,
    Jenkins, Airflow).
  - Exposure to cloud platforms (AWS, Azure, or GCP) and
    services like S3, SageMaker, or Vertex AI.
  - Understanding of vector databases (e.g., OpenSearch,
    Pinecone, Weaviate) and embedding techniques.
  - Strong problem-solving skills and ability to work
    independently or in a team.
  - Interest in exploring and implementing cutting-edge AI/ ML
    tools and technologies.
  - Experience with SQL/NoSQL databases and data manipulation.
  - Ability to communicate technical concepts clearly to both
    technical and non-technical audiences.
  
  Educational/Vocational/Previous Experience Recommendations:
  
  - Bachelor/ Master degree in CS or related field.
  - 2+ years of relevant experience
  
  Working Conditions:
  
  Onsite/Hybrid/Remote depending on location
  
