description: |
  Location: Remote (UAE preferred) Type: Full-time
  Compensation: Salary + equity
  
  About the Opportunity
  
  An early-stage climate technology startup backed by global
  accelerator programs is building a platform designed to help
  data centers plan and manage their energy procurement.
  
  As AI infrastructure grows, data centers face increasing
  challenges in forecasting energy demand, securing reliable
  power supply, and managing complex energy contracts. The
  company is developing a SaaS platform that helps data
  centers plan energy strategy, execute procurement, and
  monitor contract performance.
  
  The founding team is now looking for a Technical Director /
  Founding Engineer to lead the technical development of the
  platform and help build the engineering team.
  
  This role offers the opportunity to shape the product
  architecture, build the core system, and grow into a future
  CTO position.
  
  What You’ll Work On
  
  The platform is being built around three core modules:
  
  Planning Module
  
  A forecasting system that helps data centers model their
  future energy demand and optimize energy procurement
  strategies.
  
  Contracting Module
  
  A workflow platform that enables organizations to issue
  RFPs, negotiate power purchase agreements (PPAs), and
  execute energy procurement contracts.
  
  Monitoring Module
  
  A system that tracks contract performance and evaluates
  energy procurement against organizational KPIs.
  
  Key Responsibilities
  
  - Architect and build the core SaaS platform
  - Develop forecasting and data-processing systems for energy
    demand modeling
  - Implement AI-enabled tools using AWS technologies such as
    Bedrock and SageMaker
  - Work closely with the founders and a power systems engineer
    to translate business logic into software architecture
  - Lead and mentor a small team of engineers
  - Recruit additional developers as the platform scales
  - Prepare technical demonstrations for investors and customers
  
  The role is expected to be hands-on, combining software
  development with technical leadership.
  
  Technical Environment
  
  Technologies currently used include:
  
  - AWS cloud infrastructure
  - AWS Bedrock
  - SageMaker
  - Full-stack development frameworks
  - Data modeling and forecasting systems
  
  Ideal Candidate Profile
  
  We are looking for someone who:
  
  - Has strong full-stack software development experience
  - Is comfortable building products in early-stage startup
    environments
  - Has experience with AWS infrastructure
  - Understands machine learning, forecasting models, or
    generative AI tools
  - Has experience leading engineering teams
  - Can translate business problems into technical solutions
  
  Experience with the following areas is highly valuable:
  
  - Energy markets or power systems
  - Trading platforms
  - Contracting or regulatory software
  - Data center technologies
  
  Leadership Expectations
  
  The successful candidate will take ownership of the
  technical roadmap and work closely with the founders to
  deliver the first version of the platform.
  
  This role is expected to evolve into a Chief Technology
  Officer position as the company scales.
  
  Compensation
  
  - Competitive startup salary
  - Equity participation starting at ~2%
  - Potential to increase equity up to 10% upon transition to
    CTO
  - Standard 4-year vesting schedule
  
  Why Join
  
  - Build a platform addressing the energy challenges of AI
    infrastructure
  - Join an early-stage startup backed by major accelerator
    programs
  - Lead the technical direction of the company from the ground
    up
  - Opportunity to grow into a founding CTO role
