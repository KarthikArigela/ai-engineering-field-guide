description: |
  Java Full Stack Developer (Artificial Intelligence)
  
  
  
  This role has been designed as ‘Hybrid’ with an expectation
  that you will work on average 2 days per week from an HPE
  office.
  
  Who We Are:
  
  Hewlett Packard Enterprise is the global edge-to-cloud
  company advancing the way people live and work. We help
  companies connect, protect, analyze, and act on their data
  and applications wherever they live, from edge to cloud, so
  they can turn insights into outcomes at the speed required
  to thrive in today’s complex world. Our culture thrives on
  finding new and better ways to accelerate what’s next. We
  know varied backgrounds are valued and succeed here. We have
  the flexibility to manage our work and personal needs. We
  make bold moves, together, and are a force for good. If you
  are looking to stretch and grow your career our culture will
  embrace you. Open up opportunities with HPE.
  
  Job Description:
  
  
  
  HPE Operations is our innovative IT services organization.
  It provides the expertise to advise, integrate, and
  accelerate our customers’ outcomes from their digital
  transformation. Our teams collaborate to transform insight
  into innovation. In today’s fast paced, hybrid IT world,
  being at business speed means overcoming IT complexity to
  match the speed of actions to the speed of opportunities.
  Deploy the right technology to respond quickly to market
  possibilities. Join us and redefine what’s next for you.
  
  What you'll do:
  
  Job Family Definition:
  
  Designs, develops, troubleshoots and debugs software
  programs for software enhancements and new products.
  Develops software including operating systems, compilers,
  routers, networks, utilities, databases and Internet-related
  tools. Determines hardware compatibility and/or influences
  hardware design.
  
  
  
  Management Level Definition:
  
  Contributions include applying developed subject matter
  expertise to solve common and sometimes complex technical
  problems and recommending alternatives where necessary.
  Might act as project lead and provide assistance to lower
  level professionals. Exercises independent judgment and
  consults with others to determine best method for
  accomplishing work and achieving objectives.
  
  
  
  Responsibilities:
  
  - Designs enhancements, updates, and programming changes for
    portions and subsystems of systems software, including
    operating systems, compliers, networking, utilities,
    databases, and Internet-related tools.
  - Analyzes design and determines coding, programming, and
    integration activities required based on general
    objectives and knowledge of overall architecture of
    product or solution.
  - Writes and executes complete testing plans, protocols, and
    documentation for assigned portion of application;
    identifies and debugs, and creates solutions for issues
    with code and integration into application architecture.
  - Leads a project team of other software systems engineers and
    internal and outsourced development partners to develop
    reliable, cost effective and high quality solutions for
    assigned systems portion or subsystem.
  - Collaborates and communicates with management, internal, and
    outsourced development partners regarding software systems
    design status, project progress, and issue resolution.
  - Represents the software systems engineering team for all
    phases of larger and more-complex development projects.
    Provides guidance and mentoring to less- experienced staff
    members.
  - Provides guidance and mentoring to less- experienced staff
    members.
  
  What you need to bring:
  
  
  
  Education and Experience Required:
  
  - Bachelor's or Master's degree in Computer Science,
    Information Systems, or equivalent.
  - Typically 6-8 years experience.
  
  
  
  Knowledge and Skills:
  
  - Primary skills as Java/J2EE,Java Script, RESTful WS
  - Experience in Spring framework, Spring Boot
  - UI skills like React JS/Node JS, jQuery
  - Strong analytical and problem solving skills.
  - Knowledge of Continuous Delivery and Integration
    CI/CD(Jenkins, Maven, Ansible), test automation frameworks
    would be an added advantage.
  - Designing software systems running on multiple platform
    types like  like Unix/Linux and Windows Server OS.
  - Worked on backend DB, SQL queries.
  - Have experience of Testing tools such as
    Fitnesse/Selenium/Junit [Nice to have]
  - Proficiency in programming languages such as Python, Gen AI
    technology/framework and any Vector db (like for eg
    Mongodb) [Nice to have]
  
  Additional Skills:
  
  Cloud Architectures, Cross Domain Knowledge, Design
  Thinking, Development Fundamentals, DevOps, Distributed
  Computing, Microservices Fluency, Full Stack Development,
  Security-First Mindset, Solutions Design, Testing &
  Automation, User Experience (UX)
  
  What We Can Offer You:
  
  Health & Wellbeing
  
  We strive to provide our team members and their loved ones
  with a comprehensive suite of benefits that supports their
  physical, financial and emotional wellbeing.
  
  Personal & Professional Development
  
  We also invest in your career because the better you are,
  the better we all are. We have specific programs catered to
  helping you reach any career goals you have — whether you
  want to become a knowledge expert in your field or apply
  your skills to another division.
  
  Unconditional Inclusion
  
  We are unconditionally inclusive in the way we work and
  celebrate individual uniqueness. We know varied backgrounds
  are valued and succeed here. We have the flexibility to
  manage our work and personal needs. We make bold moves,
  together, and are a force for good.
  
  Let's Stay Connected:
  
  Follow @HPECareers on Instagram to see the latest on people,
  culture and tech at HPE.
  
