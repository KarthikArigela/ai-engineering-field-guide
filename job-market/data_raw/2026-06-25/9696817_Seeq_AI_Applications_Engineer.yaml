title: AI Applications Engineer
company: Seeq
location: USA
work_type: FULL_TIME
description: |
  The AI Applications Engineer designs, builds, and delivers
  production-grade agentic AI solutions on the Seeq platform
  to accelerate time-to-value for process manufacturers (O&G,
  Chemicals, Pharma, Power, Pulp & Paper, Food & Beverage,
  Semiconductor, and related industries). This role pairs the
  customer-facing solution engineering responsibilities of an
  Applications Engineer with deeper software engineering
  skills focused on building, extending, and operationalizing
  custom AI agents that interface with Agent Q, Seeq’s
  advanced agentic AI Analyst, along with Agent Builder,
  Document Access, and Agent Extensibility capabilities.
  
  The AI Applications Engineer leads end-to-end Seeq
  Intelligence implementations — from use case discovery and
  solution architecture, through Python-based agent and Skill
  development, to enablement and lifecycle ownership. Typical
  solution patterns include anomaly-to-action workflows that
  integrate with Industrial Software technologies (historian,
  CMMS, APM, etc), Microsoft Copilot integrations, AI-
  generated operational reporting, and customer internal
  documentation and SME knowledge. Seeq builds advanced
  analytics and decision intelligence software for industrial
  process data and operates as a remote-first company with a
  strong culture of collaboration and iteration.
  
  RequirementsDesign and Build Agentic AI Solutions
  
  - Author scalable AI agents utilizing that extend and
    orchestrate Agent Q for repeatable, multi-step industrial
    workflows (e.g., AI-generated operational reports, batch
    deviation analysis, root cause investigations, condition-
    monitor-driven investigations).
  - Build custom AI agents outside of Seeq to interface
    applications in the broader industrial technology stack
    with Agent Q and Seeq’s AI platform.
  - Design and implement Skills and Code Tools in Python (Seeq
    Data Lab, SPy library) that give agents reliable, governed
    access to enterprise systems — CMMS, historians, document
    stores, and customer-built AI services.
  - Build solution components (accelerators, templates,
    calculators, KPIs, dashboards, condition monitors, Vantage
    Rooms) in Seeq Workbench, Organizer, Vantage, and Data Lab
    that the agent layer can act on and reason about.
  - Package agentic solutions for reuse with documented
    prompts/instructions, journals, example datasets,
    validation plans, and success criteria ready for partner
    and customer delivery.
  - Configure Agent Extensibility to wire Seeq Intelligence into
    customer ecosystems (CMMS, integrity tools, MES, Power
    BI/Teams, Microsoft Copilot, Snowflake, Databricks).
  
  Software Engineering and Architecture
  
  - Write production-quality Python for agent Skills, Data Lab
    notebooks, scheduled/event-triggered workflows; apply
    modern software engineering practices (version control,
    code review, testing, CI/CD where applicable).
  - Author and consume REST/HTTPS APIs for third-party AI agents
    and enterprise systems; manage authentication patterns
    (SSO, delegated permissions, SAS URIs) for governed agent
    access.
  - Connect solutions to enterprise data ecosystems and
    downstream tools (e.g., OPC UA/OPC HDA; AVEVA PI/PI AF;
    SQL databases, data lakes/warehouses; Databricks; Azure
    ML; AWS Lambda; Power BI/Tableau; Microsoft 365 /
    SharePoint) following security, scalability, and
    performance best practices.
  - Apply prompt engineering, agent instruction design, and
    evaluation techniques to make agent behavior consistent,
    trustworthy, and reproducible at an industrial scale.
  
  Collaborate Cross-Functionally
  
  - Partner with the Software Team, Industry Principals, Product
    Management, and Revenue Teams to align Intelligence
    solutions to roadmap and close capability gaps.
  - Support Product Marketing, Solution Consulting, and Sales
    with credible Intelligence demos, narratives, and GTM
    assets; assist targeted pre-sales engagements where
    agentic solution expertise is required.
  
  Enable Customers and Partners
  
  - Create enablement kits (deployment guides, reference
    architectures, agent design playbooks, sample
    Skills/notebooks) and mentor Seeq partners and customer
    champions to scale agentic delivery globally.
  - Coach customer subject matter experts on encoding their
    expert reasoning into agent instructions, journals, and
    custom agent workflows so institutional knowledge becomes
    shareable and operational.
  
  Continuous Improvement
  
  - Gather field feedback, monitor agent adoption and quality,
    and iterate on solution reliability, trustworthiness, and
    learnability; contribute reusable agent patterns into
    Seeq’s solution library and training content.
  
  Benefits
  
  About Seeq
  
  Seeq is a remote-first (only) company founded by serial
  entrepreneurs. Our executive team and board of directors
  have extensive experience with successful startup ventures
  in high-growth environments.
  
  We are founded on the idea that companies need better
  solutions for quickly and easily getting business insight
  from their industrial process data. Our mission is to
  provide software and services that convert that data into
  meaningful information that the business can use to improve
  profitability.
  
  We have a wonderful, kind-hearted, talented team that loves
  to collaborate, lead by example, and exceed our customers’
  expectations. We are certified as a great place to work, an
  emerging startup, the Technology Fast 500, and Inc.
  Magazine's Best Places to Work.
  
  The Perks of Working at Seeq
  
  - Competitive salary plus bonus
  - Benefits:
  
  Seeq provides equal employment opportunities (EEO) to all
  employees and applicants for employment without regard to
  race, color, religion, sex, national origin, age,
  disability, or genetics.
  
  You must be authorized to work in the country in which you
  reside. Seeq does not sponsor US F1 or H-1B work visas.
