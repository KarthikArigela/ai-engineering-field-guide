description: |
  We are looking for Software Engineers to work with a leading
  Frontier LLM Lab to help accelerate their Agentic Data Cloud
  roadmap by building and scaling tools for next-generation
  AI-powered data systems. You will work on developing MCP
  tools, improving AI-assisted developer workflows, and
  expanding platform capabilities across the Data Cloud
  ecosystem.
  
  What does day-to-day life look like?
  
  - MCP Tool Development: Implement a variety of MCP tools for
    both managed MCP servers and the open-source MCP Toolbox
    for Databases.
  - Agentic Integration: Expand test coverage and functionality
    for tools and skills utilized by leading agentic coding
    assistants (e.g., Gemini CLI, Claude Code, and other IDE-
    integrated agents).
  - Code Maintenance & Refactoring: Take ownership of the MCP
    Toolbox for Databases codebase, focusing on refactoring
    legacy components and maintaining high-quality test
    suites.
  - Technical Documentation: Bridge the gap between engineering
    and community adoption by converting technical blog posts
    into functional toolbox sample code and comprehensive
    documentation.
  - R&D Support: Build and maintain a realistic, high-fidelity
    data application using QueryData. Use this environment as
    a primary testbed to support ongoing Product R&D, with a
    specific focus on advancing the Context Engineering Agent.
  
  Requirements
  
  - Build and enhance MCP tools for both proprietary and open-
    source environments
  - Expand test coverage for tools used by AI coding assistants
    (e.g., Gemini CLI, Claude Code)
  - Refactor, maintain, and improve existing test frameworks and
    codebases
  - Convert technical blogs into production-ready sample code
    and documentation
  - Develop real-world data applications (e.g., using QueryData)
    to support product R&D and experimentation
  - Collaborate with cross-functional teams to accelerate
    adoption of agentic AI capabilities
  
  Nice to have
  
  - Experience contributing to open-source projects on GitHub
    (at least some team members expected)
  - Advanced SQL expertise (preferred for some team members)
  
  Perks of Freelancing with our client:
  
  - Work in a fully remote environment.
  - Opportunity to work on cutting-edge AI projects with leading
    LLM companies.
  - Potential for contract extension based on performance and
    project needs.
  
  Offer Details:
  
  - Commitments Required: 40 hours per week with overlap of 6
    hours with PST
  - Engagement type: Contractor (no medical/paid leave)
  - Duration of contract: 6 months with opportunity to extend;
    [expected start date is 1st week of Jun-2026]
  - Location: North America and LATAM
