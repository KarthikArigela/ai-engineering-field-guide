description: |
  kAIgentic is building the intelligence layer for the world's
  most ambitious enterprises. Headquartered in Singapore with
  teams in India and Japan, our software platform helps large
  organizations evolve as fast as technology itself by turning
  the tacit know-how locked inside their people into safe,
  governed, AI-powered operations.
  
  The hardest part of enterprise transformation is not
  strategy. It is execution. Institutional knowledge lives in
  people's heads, systems are fragmented, and risk tolerance
  is low. kAIgentic captures how work actually happens,
  designs better workflows, and runs them inside an
  intelligence layer that is observable, auditable, and
  engineered for the most regulated environments on earth. The
  outcome is an enterprise that continuously improves.
  
  We are backed by SMBC Group as our founding partner and
  customer zero, and our platform is already being proven
  inside one of the most complex, regulated operating
  environments in the world. That means real problems, real
  data, and real production impact from Day 1.
  
  The Role
  
  As a Principal Engineer for AI Platform & Infrastructure,
  you define the technical direction of kAIgentic's durable
  orchestration platform. This is an organization-wide role:
  you set foundational architecture decisions and own them
  through to production. You shape how every engineering team
  thinks about durable execution and stateful AI, and you act
  as kAIgentic's primary technical authority in conversations
  with enterprise customers, partners, and the broader
  enterprise AI infrastructure ecosystem. You operate at the
  intersection of distributed systems depth, intelligence-
  layer systems innovation, and enterprise compliance, a
  combination that is genuinely rare in the market. You lead a
  lean, embedded technical team on your highest-priority
  platform programs.
  
  What You'll Do
  
  - Define the technical roadmap for kAIgentic's durable
    orchestration platform and make the architectural bets
    that shape product and engineering investment.
  - Set org-wide engineering standards for how stateful, long-
    running workflows are designed, tested, and operated
    across all product teams.
  - Own the hardest unsolved platform problems: clock-skew-
    resistant workflow semantics and sub-millisecond interrupt
    latency for human-in-the-loop scenarios.
  - Establish kAIgentic's external technical identity in the
    enterprise AI infrastructure ecosystem through
    publications, conference talks, and open-source
    contributions.
  - Serve as the final technical escalation for architectural
    disputes across AI Infrastructure, DevOps/MLOps, and AI
    Research, mentor Staff and Lead Engineers across the org
    on distributed systems and orchestration architecture, and
    lead a lean embedded technical team on your highest-
    priority platform programs.
  - Lead technical due diligence for strategic partnerships,
    acquisitions, and enterprise customer onboarding.
  
  What You'll Bring
  
  - Proven expertise in backend, platform, or infrastructure
    engineering with deep ownership of distributed systems at
    scale, including platform architecture decisions that held
    at 10x to 100x scale and recognized technical authority
    through publications, patents, open-source leadership, or
    equivalent industry impact.
  - Expert-level mastery of Go and Python including runtime
    semantics, concurrency models, and production behavior
    under load. AI-native velocity as a default mode of
    working (mandatory).
  - Built and operated durable execution systems in production,
    including Temporal or Cadence internals (scheduler design,
    replay semantics), distributed consensus, state-machine
    replication, and long-running workflow systems with
    guaranteed execution and audit integrity.
  - Architecture experience for building the control plane of a
    high-concurrency, low-latency enterprise platform,
    including multi-agent orchestration across state
    partitioning and coordination protocols, cross-language
    service architecture (gRPC, Protobuf, service mesh), and
    observability at multi-tenant scale.
  - Experience taking research prototypes into safe platform
    primitives the rest of engineering can build on, with
    strong instincts for the developer experience and AI-
    facing surfaces (streaming, human-in-the-loop
    interactions, error states, SDK ergonomics) that sit on
    top of the platform.
  
  Why join kAIgentic?
  
  We are a global team of builders who thrive in ambiguity,
  care deeply about the customers we serve, and believe the
  intelligence layer is how enterprise work will be reshaped
  over the next decade. We are building the connective tissue
  that lets large companies operate with the speed of a
  startup and the trust of an institution.
  
  We look for people who:
  
  - Combine technical excellence with genuine customer empathy.
  - Are entrepreneurial and energized by zero-to-one problems
    with no playbook.
  - Lead with ownership, integrity, and collaboration, not
    titles.
  - Want to help define a new category of enterprise AI, not
    just ship inside an existing one.
  - Working here means being surrounded by peers who challenge
    assumptions, celebrate progress, and build with both
    courage and care.
  
  Life at kAIgentic
  
  - Intelligence layer at the core. You will be shaping the
    substrate that turns institutional knowledge into
    governed, production-grade operations. This is enterprise
    infrastructure with real consequences.
  - Innovation at enterprise scale. Startup velocity meets the
    depth, scale, and stakes of mission-critical, regulated
    environments. Both are non-negotiable.
  - Ownership from Day One. Your work directly shapes the
    product, the culture, and the outcomes our customers see.
  - Learning and growth. You will work alongside seasoned
    leaders from leading enterprises who have built and scaled
    global businesses.
  - A culture of trust. Psychological safety, transparent
    disagreement, and disciplined experimentation are how we
    operate, not slogans on a wall.
  - Global collaboration. Teams across Singapore, India, Japan,
    Europe, and the US, working as one.
  - A mission worth the effort. Building something the world has
    not seen before: anintelligence layer that helps
    enterprises continuously improve how they run.
