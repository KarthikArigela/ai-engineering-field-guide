description: |
  Restream is looking for a Design Engineer to develop the
  user interface of our product and build new marvelous
  features that not only function seamlessly but are also
  visually appealing and have an intuitive user experience. As
  a Design Engineer, your primary responsibility would be to
  ensure that our products and features are user-friendly,
  well-crafted, and provide value to our users.
  
  As a member of our team, you will be at the forefront of
  ideating, developing, and shipping groundbreaking
  experiences. We believe in small teams where each member
  contributes significant value.
  
  What You'll Do
  
  - Craft every detail of new product features, from an idea to
    design to the implementation
  - Design and implement the UI/UX and business logic necessary
    to support new and existing features
  - Build and iterate on features to drive user engagement and
    conversion
  - Collaborate closely with product, marketing, and customer
    support teams to define your features and contribute to
    the overall direction of your product area
  - Give and receive code review feedback with the team
  - Maintain a pulse on emerging technologies and discover
    hidden opportunities in our environment
  
  What We Look For
  
  - Deep understanding of the UX design process and strategy
  - Attention to detail and strive for an excellent user
    experience
  - Proficient with Figma or any other design and prototyping
    tool
  - A strong portfolio of previous design projects
  - Knowledge of JavaScript, React, and at least one of React’s
    major state management systems
  - Comfortable working with Figma, React, TypeScript, MobX,
    AWS, and continuous deployment workflow
  - Strong written and verbal communication skills
  - Self-directed, analytical, and work well in a team
    environment
  - Passionate about the Restream product
  
  Back in 2015, Restream was founded in Ukraine. We had a
  burning passion for helping creators to be seen and heard.
  As the #1 multistreaming solution, Restream inspires over 11
  million people worldwide to share their stories through live
  video and follow their dreams. We believe that a small but
  highly driven and focused team can make a lasting impact in
  people's lives.
  
  What We Offer
  
  - A startup environment and a flat company structure
  - Work closely with founders and team to build and grow the
    product
  - Opportunity to make an impact on the evolution of the
    product
  - Ability to create something that influences people's lives
  - Equity packages for you to truly be a part of the Restream
    journey
  - The tech you need to get your job done
