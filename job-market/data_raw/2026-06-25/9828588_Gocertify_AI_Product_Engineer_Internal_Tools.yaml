  Job Title: AI Product Engineer (Internal Tools)
  
  Department: Product
  
  Reports to: Head of Product
  
  Employment Type: Full-time
  
  Salary: £70,000-£80,000
  
  Location: Remote (UK-based, with monthly London meetups)
  
  About Gocertify
  
  Gocertify is a bootstrapped UK tech start-up helping brands
  run smarter, more targeted reward campaigns.
  
  We verify eligible audiences such as students, key workers
  and seniors, so brands can move away from broad discounting,
  protect brand value and offer the right rewards to the right
  customers.
  
  We are trusted by 500+ brands, including Samsung,
  Sainsbury’s and FARFETCH. We work with 2m+ shoppers a year,
  drive £125m+ in retail sales, and have grown profitably and
  bootstrapped since 2020.
  
  We are a remote team of around 20 people, with monthly
  meetups in London. We’ve scaled profitably by staying lean
  and being deliberate about where we create leverage.
  Internal tooling, automation and AI are core to how we
  operate, allowing a tight team to move incredibly fast and
  eliminate manual friction. We care about shipping practical,
  widely used systems that people actually want to use, rather
  than over-engineering for the sake of it.
  
  Job Purpose
  
  As the AI Product Engineer (Internal Tools), you will be
  building and shaping the internal operating system that
  powers our Go-to-Market strategy. Your tools will enable
  Gocertify to understand our prospects and customers deeply,
  identify the strongest growth opportunities and execute
  efficiently on the highest value areas of work. This is a
  high-ownership, high-impact role where technical excellence
  delivers strategic GTM execution.
  
  Do you love building? Are you constantly using the latest
  LLMs, APIs and agentic engineering tools? Have an interest
  in Marketing/Sales? Then this could be for you!
  
  At Gocertify, we’re at the forefront of internal tooling, AI
  and automation. We’re fortunate to have a passionate team
  that is consistently identifying ways custom tools can save
  time and deliver a stronger solution - and then building
  them themselves in Claude Code, Lovable, ChatGPT Agents etc,
  including:
  
  - Elton: our retailer research agent that collects 500+ fields
    about current and potential clients, from sources
    including Google, Similarweb, Semrush, and surfaces these
    insights through multiple internal tools used by the team
    every day.
  - Client Hub; an app we use to deliver exceptional client
    experiences, it fetches information from our custom-built
    client CRM and Elton to surface what opportunities should
    be worked on next
  - Pitch Page; a lovable app which creates a personalised
    landing page for each prospect simply by typing in the URL
    of a company
  - Sales Hub; an internal wiki used by our sales team to create
    custom forecasts and pitch assets
  
  These tools are already creating enormous value, and we’re
  looking to bring on a dedicated person dedicated to
  improving them, adding more, and syncing them all together -
  creating a key lever for our next stage of growth.
  
  Key Responsibilities
  
  Infrastructure & Data Foundations
  
  Building GTM Tools
  
  Enabling Self-Serve Tooling
  
  Product Thinking & Discovery
  
  This is an overview of your responsibilities, but there may
  be occasions where you are asked to take on additional tasks
  beyond your outlined duties.
  
  Who will thrive
  
  This role is a great fit for a builder who gets genuine
  energy from seeing their work help a team move faster, make
  better decisions and spend more time on high-value work.
  
  - The balance of speed and logic: Constant experimentation
    with the latest LLMs, APIs and automation workflows should
    come naturally. AI should be treated as an execution
    accelerator, not a shortcut for sloppy logic. Success
    means knowing when to build a solid relational foundation
    so the data does not break, and when to ship a scrappy
    automated prototype to keep momentum moving.
  - Autonomous product discovery: Technical depth needs to be
    paired with strong product judgement. Rather than waiting
    for a perfect brief, the right person will be comfortable
    shadowing internal users, asking sharp questions, and
    working out the real operational bottleneck before jumping
    into a build.
  - Pragmatism over perfection: Working close to a fast-moving
    Revenue team should feel motivating. This role is about
    turning messy, fragmented internal workflows into useful
    tools that people actually want to use, without over-
    engineering the solution or slowing down the team.
  
  Requirements
  
  - Strong software engineering fundamentals, with experience in
    databases and SQL, APIs and integrations across third-
    party systems (e.g. Airtable, Hubspot, Make.com)
  
  - Experience building internal tooling or operational
    software, ideally in a high-growth startup or scale-up
    environment (A bonus if it's for Revenue teams!)
  - Strong understanding of UI and UX principles so you can
    create intuitive designs quickly
  - Familiarity with low-code platforms (e.g. Lovable or
    similar) and an understanding of how to design foundations
    that others can build on.
  - Comfortable working cross-functionally, partnering with
    product, data and revenue teams to identify and deliver
    the highest-impact work.
  - Strong communicator who can translate business problems into
    technical solutions and explain technical decisions to
    non-technical colleagues.
  
  Work Environment & Tools
  
  - Fully remote (UK-based) with monthly in-person meetings in
    London.
  - Core working hours: 10am-4pm UK time with flexible remote
    work.
  - Tools: Agentic Engineering tools (e.g. Claude Code, ChatGPT
    agents), SQL and relational databases, REST/GraphQL APIs,
    low-code platforms (e.g. Lovable, Make.com), and
    integration tooling across our stack (Hubspot, Shopify,
    Airtable). Familiarity with our data environment
    (BigQuery, dbt) and production stack (Ruby on Rails)
  
  Benefits
  
  - Salary: £70,000 - £80,000, with some flexibility for an
    exceptional fit.
  - 25 days annual leave + UK bank holidays
  - Private health insurance with AVIVA, including optical and
    dental cashback and the option to self-fund
    partners/dependents
  - EMI share options
  - Work-from-home budget
  - Flexible remote work in many countries around our core
    hours, 10am-4pm UK
  - Unlimited access to coworking spaces in 48+ countries
    through Hubble
  - Access to incredible Gocertify offers
