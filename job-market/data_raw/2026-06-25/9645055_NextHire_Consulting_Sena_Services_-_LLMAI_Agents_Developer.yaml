description: |
  Position - LLM/AI Agents Developer
  
  Type: Full-time
  
  About the Role
  
  We are looking for a highly skilled LLM/AI Agents Developer
  to design, build, and optimize AI agents capable of
  interacting across multiple modalities, including text,
  image, video, and audio. The ideal candidate should have
  experience integrating these AI agents with existing
  enterprise and consumer
  
  software solutions, ensuring seamless interaction within
  real-world applications.
  
  Key Responsibilities
  
  • Develop and optimize multi-modal AI agents that can
  process and respond to text, images, videos, and audio.
  
  • Fine-tune LLMs for specific tasks, optimizing for latency,
  accuracy, and contextual understanding.
  
  • Integrate AI agents into existing software ecosystems,
  such as CRMs, ERPs, cloud platforms, and industry-specific
  solutions.
  
  • Design retrieval-augmented generation (RAG) pipelines and
  knowledge augmentation techniques for improving agent
  responses.
  
  • Implement prompt engineering, contextual memory, and fine-
  tuning for various business and consumer use cases.
  
  • Develop API-based and embedded agent solutions that can
  work across different platforms (web, mobile, desktop).
  
  • Build and optimize speech recognition (ASR) and text-to-
  speech (TTS) models for voice-based agents.
  
  • Ensure scalability, security, and performance of AI-driven
  solutions.
  
  • Collaborate with product, design, and backend teams to
  deploy AI agents in production environments.
  
  Required Skills & Experience
  
  • Strong experience with LLMs and AI frameworks (OpenAI GPT,
  Claude, Mistral, LLaMA, etc.).
  
  • Prior experience working with AI agents.
  
  • Exposure to multi-agent systems and how AI agents can
  collaborate.
  
  • Experience with multi-modal AI (text, image, video, and
  audio processing).
  
  • Proficiency in Python and ML libraries (PyTorch,
  TensorFlow, Hugging Face, LangChain alternatives).
  
  • Hands-on experience in fine-tuning and deploying LLMs.
  
  • Knowledge of software integrations, including working with
  APIs, SDKs, and enterprise software  (Salesforce, SAP, Odoo,
  etc.).
  
  • Experience with RAG systems, embeddings, and vector
  databases (FAISS, ChromaDB, Pinecone,etc.).
  
  • Familiarity with ASR and TTS technologies (Whisper,
  Deepgram, etc.).
  
  • Experience with cloud platforms and MLOps (AWS, Azure,
  GCP, Docker, Kubernetes).
  
  • Strong problem-solving skills and the ability to optimize
  AI models for real-world applications.
  
  ‘Nice to Have’s
  
  • Familiarity with edge AI deployments for mobile and
  embedded devices.
  
  • Experience with graph neural networks (GNNs) for knowledge
  graphs and reasoning tasks.
  
  • Knowledge of Reinforcement learning techniques
  
  Why Join Us?
  
  • Work on cutting-edge multi-modal AI solutions that push
  the boundaries of intelligent agents.
  
  • Opportunity to integrate AI into real-world enterprise
  applications used globally.
  
  • Competitive salary, flexible work environment, and a
  chance to shape the future of AI agents.
  
  If you're passionate about multi-modal AI and intelligent
  agent development, we’d love to hear from you!
