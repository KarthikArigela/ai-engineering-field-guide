description: |
  Founded in 2012, H2O.ai is on a mission to democratize AI.
  As the world’s leading agentic AI company, H2O.ai converges
  Generative and Predictive AI to help enterprises and public
  sector agencies develop purpose-built GenAI applications on
  their private data. With a focus on Sovereign AI—secure,
  compliant, and infrastructure-flexible deployments—H2O.ai
  delivers solutions that align with the highest standards of
  data privacy and control.
  
  Our open-source technology is trusted by over 20,000
  organizations worldwide, including more than half of the
  Fortune 500. H2O.ai powers AI transformation for companies
  like AT&T, Commonwealth Bank of Australia, Chipotle,
  Workday, Progressive Insurance, and NIH.
  
  H2O.ai partners include NVIDIA, Dell Technologies, Deloitte,
  Ernst & Young (EY), Snowflake, AWS, Google Cloud Platform
  (GCP), VAST Data and MinIO. H2O.ai’s AI for Good program
  supports nonprofit groups, foundations, and communities in
  advancing education, healthcare, and environmental
  conservation. With a vibrant community of 2 million data
  scientists worldwide, H2O.ai aims to co-create valuable AI
  applications for all users.
  
  H2O.ai has raised 256 million from investors, including
  Commonwealth Bank, NVIDIA, Goldman Sachs, Wells Fargo,
  Capital One, Nexus Ventures and New York Life.
  
  For more information, visit www.h2o.ai.
  
  About This Opportunity
  
  As an AI Engineer, you will directly collaborate with the
  Kaggle GM team to bootstrap the development and deployment
  of transformative AI solutions from concept to market. In
  this role, you will collaborate on the end-to-end
  pipeline—data engineering, model development, backend and
  frontend, system integration, and scalable deployment. You
  know how to quickly adopt new technologies and utilize
  modern tooling for development. Preferred location Europe,
  DACH highly preferred.
  
  What You Will Do
  
  - End-to-End Development: Collaborate on the design,
    development, and implementation of AI applications across
    the full stack, ensuring seamless integration between
    frontend, backend, and AI components.
  - API and Backend Development: Create robust backend services
    and APIs to support AI functionalities, enabling efficient
    data flow and integration.
  - Frontend Development: Develop intuitive user interfaces that
    provide exceptional user experiences, turning complex AI
    functionalities into user-friendly applications.
  - Deployment and Scaling: Deploy AI models and applications
    using cloud platforms, ensuring scalability, reliability,
    and performance in production environments.
  - Tool Utilization: Leverage advanced development tools and
    AI-assisted coding platforms to enhance productivity and
    code quality.
  
  What We Are Looking For
  
  - Bachelor's, Master's or PhD degree in Computer Science,
    Engineering, or a related field preferred, but not
    mandatory
  - Proven experience as a Full Stack Engineer or similar role
    in software development
  - Hands-on experience in data engineering, machine learning
    model development, and full-stack application development
  - Contribution on open source projects
  - Public track record of AI experience
  
  Technical Skills:
  
  - Programming Languages: Core proficiency in Python, some
    experience in JavaScript expected.
  - AI/ML Frameworks: Proficient in PyTorch, Basic understanding
    of how to fine-tune deep learning models focusing on LLMs.
  - Backend: Python, FastAPI, SQL/NoSQL/S3.
  - Frontend: Experience with frontend frameworks such as React
    and NextJS.
  - Deployment: Docker, Kubernetes, CI/CD pipelines, Experience
    with cloud services, deploying LLMs efficiently.
  - GenAI tools: OpenAI API endpoints, agents, and integration
    into applications.
  - Tools: Ability to utilize AI-assisted coding tools and
    platforms to accelerate development.
  - Problem-Solving: Excellent analytical and problem-solving
    skills with a keen attention to detail. Can quickly adopt
    new technologies.
  
  How to Stand Out From the Crowd
  
  - Innovative Projects: Demonstrated experience in bringing AI
    solutions from concept to market, with a portfolio
    showcasing successful projects.
  - Advanced Knowledge: Expertise in advanced Deep Learning
    topics, prime focus on Natural Language Processing.
  - Open Source Contributions: Active participation in the AI
    and software development community through contributions
    to open-source projects.
  - Creativity and Passion: A demonstrated passion for
    innovation, with the ability to think outside the box and
    propose creative solutions to complex problems.
  - Adaptability: Comfortable working in a fast-paced
    environment with a willingness to embrace new technologies
    and methodologies.
  
  Why H2O.ai?
  
  - Market Leader in Total Rewards
  - Remote-Friendly Culture
  - Flexible working environment
  - Be part of a world-class team
  - Career Growth
  
  H2O.ai is committed to creating a diverse and inclusive
  culture. All qualified applicants will receive consideration
  for employment without regard to their race, ethnicity,
  religion, gender, sexual orientation, age, disability status
  or any other legally protected basis.
  
  H2O.ai is an innovative AI cloud platform company, leading
  the mission to democratize AI for everyone. Thousands of
  organizations from all over the world have used our cutting-
  edge technology across a variety of industries. We’ve made
  it easy for people at all levels to generate breakthrough
  solutions to complex business problems and advance the
  discovery of new ideas and revenue streams. We push the
  boundaries of what is possible with artificial intelligence.
  
  H2O.ai employs the world’s top Kaggle Grandmasters, the
  community of best-in-the-world machine learning
  practitioners and data scientists. A strong AI for Good
  ethos and responsible AI drive the company’s purpose.
  
  Please visit www.H2O.ai to learn more.
  
