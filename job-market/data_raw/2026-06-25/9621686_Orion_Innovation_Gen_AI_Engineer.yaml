description: |
  Orion Innovation is a premier, award-winning, global
  business and technology services firm.  Orion delivers game-
  changing business transformation and product development
  rooted in digital strategy, experience design, and
  engineering, with a unique combination of agility, scale,
  and maturity.  We work with a wide range of clients across
  many industries including financial services, professional
  services, telecommunications and media, consumer products,
  automotive, industrial automation, professional sports and
  entertainment, life sciences, ecommerce, and education.
  
  Job Overview:
  
  Join a dynamic team working on cutting-edge projects
  leveraging Generative AI technologies. This role focuses on
  applying advanced machine learning techniques, integrating
  Large Language Models (LLMs), and delivering innovative AI
  solutions to meet strategic goals.
  
  Key Responsibilities:
  
  Technical Skills
  
  - Hands-on proficiency in ReactJS (hooks, state management,
    component architecture)
  - Hands-on proficiency in Python (APIs, data pipelines, LLM
    integration)
  - Experience building or integrating Generative AI / LLM-based
    features (RAG, agents, prompt engineering, tool use)
  - Familiarity with REST APIs and async patterns
  - Version control with Git
  
  AI-Assisted Development
  
  - Demonstrated ability to use AI coding tools such as Cursor
    or Claude Code for accelerated development
  - Comfortable working in AI-augmented workflows for code
    generation, review, and debugging
  
  Soft Skills
  
  - Self-directed with a bias for shipping
  - Comfortable with ambiguity in early-stage project
    environments
  - Strong written communication
  
  Additional Responsibilities
  
  - Design and implement Python-based AI backend services (LLM
    orchestration, agent pipelines, embeddings)
  - Build and maintain React frontend components that surface AI
    outputs
  - Integrate with LLM APIs (Anthropic, OpenAI, or similar)
  - Own end-to-end features from prompt design to deployed UI
  
  Nice to Have
  
  - Experience with LangChain, LlamaIndex, or similar frameworks
  - FastAPI or Flask for building AI microservices
  - Vector databases (Pinecone, Weaviate, pgvector)
  
