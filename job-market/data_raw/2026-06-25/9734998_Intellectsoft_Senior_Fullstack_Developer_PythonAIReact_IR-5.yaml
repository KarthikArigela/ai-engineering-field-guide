  Our client is an AI consulting and technology company that
  helps businesses adopt and scale artificial intelligence
  solutions, including generative AI, automation, and data-
  driven applications. The company works with organizations to
  identify AI opportunities, develop custom AI solutions, and
  integrate AI capabilities into existing business processes
  to drive productivity and innovation.
  
  We are looking for a Full Stack Developer to build and
  maintain modern web applications with a focus on AI-enabled
  product layers, including vector databases and RAG
  workflows.
  
  Requirements
  
  Basic:
  
  - Strong experience with Python backend development.
  - Hands-on experience with FastAPI.
  - Strong working knowledge of React and modern JavaScript.
  - Experience building and consuming REST APIs.
  - Familiarity with relational databases such as PostgreSQL or
    MySQL.
  - Ability to work with and improve an existing codebase.
  - Strong debugging and problem-solving skills.
  - Basic understanding of authentication, authorization, user
    flows, and application security.
  - Familiarity with Git-based development workflows.
  - Ability to write clean, maintainable, and scalable code.
  
  AI / Data Science Awareness:
  
  This role requires a basic understanding of vector
  databases, semantic search, embeddings, RAG workflows, and
  LLM integration.
  
  - Vector databases and semantic search.
  - Embeddings and how they are used for retrieval.
  - Retrieval-Augmented Generation workflows.
  - Document ingestion, chunking, and indexing.
  - Connecting backend application logic with LLM-based
    responses.
  - Debugging and maintaining AI-powered product features.
  
  Nice to have
  
  - Experience deploying applications on cloud platforms such as
    AWS, Azure, GCP, Render, or Railway.
  - Familiarity with Docker.
  - Experience with background jobs, queues, or scheduled tasks.
  - Experience working with file uploads, document processing,
    or search systems.
  - Prior experience with AI, chatbot, analytics, or knowledge-
    management applications.
  - Understanding of basic data pipelines and ETL workflows.
  
  Responsibilities
  
  - Develop, maintain, and improve backend services using Python
    and FastAPI.
  - Build, update, and debug React frontend components.
  - Design, consume, and maintain REST APIs.
  - Work with databases, application logic, and integrations
    across the stack.
  - Understand and improve existing codebases, architecture, and
    workflows.
  - Debug issues across frontend, backend, database, and AI-
    related layers.
  - Support features involving vector databases, embeddings,
    semantic search, and RAG workflows.
  - Work with existing data pipelines and document ingestion
    processes.
  - Improve application performance, reliability, security, and
    maintainability.
  - Collaborate with product, design, and technical stakeholders
    to translate requirements into working features.
  - Write clean, readable, well-documented, and production-ready
    code.
  - Participate in testing, deployment, monitoring, and release
    processes.
  
