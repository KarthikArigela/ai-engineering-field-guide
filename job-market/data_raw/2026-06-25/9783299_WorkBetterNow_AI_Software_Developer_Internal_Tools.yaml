   Job Description
  
  
  
  
  
  
  
  
  
   AI Software Developer (Internal Tools)
  
  
  
  
  
  
  
  
  
   The AI Software Developer designs, builds, and ships
  internal applications that streamline operations, reduce
  software licensing costs, and scale with business growth.
  Using AI-assisted development tools (Replit, Claude Code,
  Copilot), you'll rapidly prototype and deliver production-
  ready tools that replace selected third-party software and
  manual workflows. This role combines hands-on engineering
  with a product mindset, turning business problems into
  working software quickly, securely, and cost-effectively.
  
  
  
  
  
  
  
  
  
   Key Responsibilities:
  
  
  
  
  - Build, ship, and maintain internal web applications using
    AI-assisted development environments, translating business
    requirements into working software quickly while
    maintaining reliability and security standards
  - Partner with leadership to identify high-cost or underused
    software that can be replaced with purpose-built internal
    tools, and estimate cost savings delivered by each
    replacement project
  - Write clean, documented, and maintainable code following
    source control and deployment best practices; apply
    security and data protection standards to all internal
    tools
  - Work directly with stakeholders across departments to scope,
    prioritize, and demo new tools; maintain transparent
    backlog communication and document each tool thoroughly
    for organizational continuity
  - Stay current on AI development tools and techniques,
    establish and report on delivery KPIs (tools shipped, cost
    savings, adoption, uptime), and propose new opportunities
    for internal tooling
  
  Requirements
  
  - Live in LATAM or The Caribbean
  - 3+ years of experience building and shipping web
    applications with a track record of delivering working
    software quickly
  - Fluent in English (written and spoken) – able to communicate
    effectively with US-based teams and stakeholders
  - Hands-on experience with AI-assisted development tools
    (Replit, Claude Code, Copilot, GitHub Copilot, or similar)
  - Proficiency in modern web stack: JavaScript/TypeScript,
    React, Node.js, Python
  - Experience building applications that connect to third-party
    SaaS platforms via REST APIs
  - Proven experience working in Scrum/Agile frameworks with
    sprint planning, standups, retrospectives, and iterative
    delivery
  - Sound judgment on build-versus-buy decisions and ability to
    prioritize work for business impact
  
  
  
   Technical Requirements
  
  
  
  
  - Processor: Intel 11th Gen (or AMD Ryzen 5000 series) for
    Windows | M2 for Macs
  - RAM: 16 GB minimum
  - Internet: Stable connection of 25-50 Mbps minimum
  
  
  
   Preferred:
  
  
  
  
  - Experience replacing paid SaaS tools with custom-built
    internal applications
  - Familiarity with HubSpot, Microsoft 365, SharePoint, or Zoho
    Recruit APIs
  - Understanding of data privacy, security, and compliance
    fundamentals
  - Hands-on containerization experience (Docker and/or
    Kubernetes) in cloud environments
  
  
  
  
  
  
  Benefits
  
  - 100% remote work – enjoy the comfort and flexibility of
    working from home
  - 18 paid vacation days + U.S. federal holidays
  - Paid maternity/paternity leave (up to 2 months with 50%
    salary coverage after 1 year)
  - A supportive, people-first environment where your voice
    matters
  - Two in-person team gatherings per year, hosted in your local
    city
  - Training and development support to keep your skills sharp
    and current
  - Work hours: 9:00 am – 6:00 pm EST/CST/MST/PST, with a one-
    hour lunch break
