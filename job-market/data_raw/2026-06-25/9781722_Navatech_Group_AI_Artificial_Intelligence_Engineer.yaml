description: |
  Company Overview
  
  Join Navatech Labs, where innovation meets excellence. Our
  forward-thinking team is dedicated to advancing the
  construction industry through artificial intelligence. As a
  vital member of our AI team, you will be at the forefront of
  groundbreaking projects utilising GenAI, Natural Language
  Processing (NLP), Large Language Model (LLM) training and
  tuning, MLOps, and Cloud
  
  Key Responsibilities
  
  - Develop and implement cutting-edge AI algorithms and models
    to solve complex business challenges.
  - Leverage computer vision techniques for image and video
    analysis in construction projects.
  - Apply reinforcement learning techniques for developing
    intelligent automation solutions.
  - Participate in the end-to-end lifecycle of machine learning
    models, from training and validation to deployment and
    monitoring. Collaborate with cross-functional teams to
    establish effective MLOps practices, ensuring seamless
    deployment, monitoring, and management of AI models.
  - Integrate AI solutions into existing platforms, working
    closely with various teams.
  - Utilize cloud platforms for scalable and efficient AI
    solutions, leveraging services like AWS or Google Cloud.
  
  Requirements
  
  Professional Experience
  
  - Proven experience (2-3 years) in developing and deploying AI
    models, with a focus on computer vision, predictive
    analytics, or reinforcement learning.
  - Experience in integrating AI solutions into business
    operations or products.
  
  Technical Skills
  
  - Strong programming skills in languages such as Python and
    C++, and proficiency with AI frameworks (e.g., TensorFlow,
    PyTorch).
  - Experience with computer vision libraries (e.g., OpenCV,
    Keras) and techniques for image processing and analysis.
  - Proficiency in developing predictive models using
    statistical and machine learning techniques, Familiarity
    with reinforcement learning frameworks and algorithms.
  - Experience with MLOps tools and practices for model
    deployment, monitoring, and automation.
  - Familiarity with cloud services and infrastructure for AI
    applications, Strong understanding of AI patterns, model
    optimization, and hyperparameter tuning techniques.
  - Excellent problem-solving skills and a team-oriented
    mindset. Strong communication skills to convey complex
    technical concepts to both technical and non-technical
    stakeholders.
  
  Benefits
  
  What We Offer
  
  - Competitive salary and benefits package.
  - Opportunity to work on cutting-edge AI projects
  - Collaborative and inclusive team environment.
  - Continuous learning and professional development
    opportunities.
