description: |
  Build the Operating System Behind One of America's Fastest-
  Growing Luxury Hospitality Brands
  
  BOLT FARM is building America’s most iconic romantic luxury
  retreat brand: nature-immersed, high-experience, and
  emotionally transformative. Backed by 3,300+ five-star
  reviews, 1M+ followers, and features across Forbes, Travel +
  Leisure, and Netflix, we’re scaling from a high-performing
  flagship into a national portfolio.
  
  We're looking for an experienced AI Systems & Automation
  Engineer who can help build the internal operating systems,
  automations, and AI-powered infrastructure that will support
  that growth. If you want to operate at the ground floor of a
  brand with real momentum, high standards, and a team
  obsessed with doing it right, this is your seat. 🚀
  
  Compensation
  
  We are targeting top-tier talent and have updated
  compensation by market:
  
  - India: $5,000–$7,000 USD/month
  - LATAM: $6,000–$9,000 USD/month
  - Philippines: $4,500–$6,500 USD/month
  
  Compensation will be determined based on experience,
  demonstrated capability, technical depth, AI-native workflow
  proficiency, and overall fit for the role.
  
  What You'll Love About Working at BOLT FARMBuild Real Tools
  for Real Problems
  
  This is not theoretical software work. You'll build systems
  people actually use to make the business run better.
  
  Use AI as Leverage
  
  We want builders who are already using tools like Cursor,
  Claude Code, Copilot, or similar to move faster and think
  better.
  
  Work Close to the Business
  
  Feedback loops are tight, users are accessible, and the
  impact of what you build is visible quickly.
  
  Avoid Corporate Tech Bloat
  
  No endless committee work or over-engineered nonsense. We
  care about practical solutions that ship.
  
  Help Create the Operating System for a Growing Company
  
  Your work will help connect teams, reduce friction, and make
  BOLT FARM more scalable.
  
  You Know You're a Great Fit for This Role If...
  
  You like turning messy, open-ended problems into working
  tools. You are comfortable asking questions, understanding
  how work happens today, and building something better.
  
  You are not looking for a narrow ticket queue. You want to
  build across the system, move quickly, use AI heavily, and
  ship useful internal software that helps the business
  operate smarter.
  
  The Core Mission
  
  Build internal tools, automations, and AI-assisted systems
  that reduce friction, improve execution, and help BOLT FARM
  scale with better infrastructure.
  
  Why This Role Matters
  
  BOLT FARM is growing, and growth creates operational
  complexity. The technology team helps solve that by building
  smarter internal systems, connecting workflows, and
  replacing disconnected manual processes with practical
  tools.
  
  This role is for a builder who can work from business
  context to technical solution — not just write code in
  isolation.
  
  Key Responsibilities
  
  - Build internal tools, workflows, and automations that solve
    real operational problems across the business
  - Turn open-ended requests into practical solutions that
    improve speed, clarity, and execution
  - Contribute to full-stack development work in a JavaScript
    and TypeScript environment
  - Build and improve applications using frameworks and
    databases similar to Next.js and Postgres
  - Use AI-native development tools as a core part of the build
    process
  - Work across the system from data layer to end user, not just
    one narrow part of the stack
  - Debug, troubleshoot, and refine systems in both local and
    production environments
  - Help move solutions from development into production using
    sound deployment and production-readiness practices
  - Prototype, test, and improve solutions based on real user
    feedback
  - Help create a more integrated internal software environment
    that reduces reliance on disconnected third-party tools
  
  What Success Looks Like
  
  - Useful internal tools ship quickly and solve real business
    problems
  - Teams spend less time fighting disconnected systems, manual
    workflows, and unclear processes
  - AI becomes a real development multiplier, not a buzzword
  - You build with enough speed to create momentum and enough
    discipline to keep systems reliable
  
  Minimum Requirements
  
  - 5+ years of professional experience building software,
    automations, internal tools, or technical products in
    JavaScript or TypeScript environments
  - Recent hands-on use of AI-native development tools such as
    Cursor, Claude Code, Copilot, or similar as a meaningful
    part of a real shipping workflow
  - Clear examples of how AI tools improved speed, debugging,
    prototyping, code generation, or delivery quality
  - Working knowledge of Git-based development and testing or
    test-suite fundamentals
  - Experience contributing in a modern full-stack web
    environment using frameworks and databases similar to
    Next.js and Postgres
  - Experience taking loosely defined technical or workflow
    problems and turning them into working solutions
  - Experience debugging and troubleshooting software in local
    and production environments
  - Comfort working through deployment workflows and production-
    readiness practices
  
  Nice to Have
  
  - Recent GitHub or other public project work that shows active
    building
  - Startup, failed-startup, freelance, or entrepreneurial
    builder experience
  - Experience building internal tools, workflow software, or
    operational systems
  - Experience in booking, scheduling, service operations, or
    other workflow-heavy environments
  - A pattern of building side projects, hobby projects, or
    exploratory technical work outside of core job
    responsibilities
  - Clear signs that technology is a genuine long-term interest,
    not just a narrow job skill
  
  Who Thrives Here
  
  People who thrive here are practical builders. They are
  curious, resourceful, AI-native, and comfortable figuring
  things out without needing every detail handed to them.
  
  They enjoy solving business problems, not just technical
  problems. They can move from ambiguity to execution and care
  more about shipping useful systems than chasing perfect
  architecture.
  
  If you want to build tools that make a real business faster,
  cleaner, and smarter, this is your seat. 🚀
