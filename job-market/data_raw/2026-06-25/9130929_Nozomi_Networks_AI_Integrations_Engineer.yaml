title: AI Integrations Engineer
company: Nozomi Networks
location: USA
remote: true
work_type: FULL_TIME
description: |
  Now is an amazing time to join Nozomi Networks as we build
  the future of OT and IoT cybersecurity.
  
  We defend some of the world’s largest organizations and
  critical infrastructure in more than 68 countries and we’re
  just getting started. Our AI-powered cybersecurity platform
  secures operational technology (OT) and Internet of Things
  (IoT) infrastructures for enterprises and government
  entities across energy, manufacturing, transportation,
  resources, and critical infrastructure.
  
  Nozomi Networks is looking for an AI Integrations Engineer
  to build the connective tissue that lets our business users
  get the most out of our AI tool stack. You will partner with
  users across a variety of business functions to build
  cutting-edge agentic solutions. Your job will be to make
  sure those agents have everything they need to be useful:
  secure connections to our systems, clean data from our
  warehouse, well-designed APIs, and a robust Google
  Cloud–based architecture that scales.
  
  This is a high-leverage role. Every integration you build
  may be reused across dozens of agents and hundreds of users.
  You'll work closely with data, security, and platform teams,
  and you'll be the go-to expert when business users hit the
  limits of what their no-code agents can do on their own.
  
  In this role you will:
  
  - Build and maintain Model Context Protocol (MCP) servers that
    expose internal systems, data, and tools to our AI
    platforms in a secure, governed way
  - Develop and document APIs that AI agents can call to read
    from and write to our CRM, ERP, and other systems of
    record
  - Design and implement the backend AI architecture on Google
    Cloud, including Vertex AI, Vertex AI Agent Builder,
    Apigee, Cloud Run, Cloud Functions, Workflows, and related
    services
  - Build and optimize data pipelines that feed our data
    warehouse with the clean, structured, AI-ready data that
    agents depend on
  - Partner with business users building agents — help them
    scope what's possible, unblock them when integrations are
    needed, and turn their prototypes into production-grade
    workflows
  - Implement authentication, authorization, logging, and
    observability across all integrations so we have a clear
    picture of how AI is being used and what it's accessing
  - Establish patterns, reusable connectors, and internal
    documentation so each new integration is faster than the
    last
  - Collaborate with security and compliance teams to ensure AI
    access to sensitive data follows the right controls
  
   To be successful in this opportunity, you will have:
  
  - 5+ years of professional software or data engineering
    experience
  - Strong data engineering skills: SQL, dimensional modeling,
    ETL/ELT pipelines, and hands-on experience with a modern
    cloud data warehouse (e.g. BigQuery, Snowflake,
    Databricks, or Redshift)
  - Hands-on integration experience with at least one major CRM
    and at least one major ERP— including their APIs, data
    models, and quirks
  - Proficiency with Google Cloud services for application and
    data workloads — Cloud Run or Cloud Functions, Apigee or
    API Gateway, Secret Manager, Cloud IAM, and one of
    BigQuery, Dataflow, or Cloud Data Fusion
  - Strong programming skills in Python and/or TypeScript
  - Experience designing and shipping REST APIs that other teams
    or systems consume
  - Solid understanding of authentication and authorization
    patterns (OAuth 2.0, OIDC, service accounts, Workload
    Identity Federation)
  
  Preferred Qualifications
  
  - Direct experience building MCP servers or other AI
    tool/function-calling integrations
  - Experience with vector databases, embeddings, and retrieval-
    augmented generation (RAG) patterns — including Vertex AI
    Vector Search or AlloyDB / BigQuery vector capabilities
  - Background supporting business or "citizen developer" users
    — comfort translating non-technical asks into technical
    design
  - Knowledge of data governance, PII handling, and AI
    safety/compliance frameworks
  
  #LI-Remote
  
  Nozomi Networks is committed to fair and equitable
  compensation practices. The base pay scale for this position
  is $139,600 to $175,883. This is the range the company
  reasonably and in good faith expects to pay for the position
  taking into account factors including job-related knowledge,
  skillset, experience, education and training,
  certifications, and other relevant business factors.
  Applications outside the range are welcome to apply.
  
  Additional Compensation and Benefits: The company also
  offers a wide range of competitive benefits, including
  medical, dental, vision, life insurance, and disability
  insurance for eligible employees.  The successful candidate
  may also be eligible to participate in the company’s equity
  program and/or variable bonus program, subject to the rules
  governing such programs.
  
  In addition, eligible employees are able to enroll in a
  401(k) plan along with the employer matching program. Nozomi
  Networks also offers eligible employees flexible paid time
  off, paid holidays and paid parental leave.
  
  Who we are and what we stand for:
  
  Nozomi Networks is the leader in OT and IoT Cybersecurity.
  We protect the world's critical infrastructure, industrial
  and government organizations from cyber threats by providing
  exceptional network visibility, threat detection and
  operational insight. We’re always innovating and we hire the
  best at what they do to ensure our customers always have
  access to fast product enhancements, exceptional engineering
  support and rapid deployment across continents. If you like
  a challenge, and value integrity and customer success, we
  invite you to help Nozomi Networks build the future of OT
  and IoT cybersecurity.
  
  Diversity, Inclusion and Belonging are part of our core
  beliefs, at Nozomi Networks. Diversity of thought,
  background and culture broadens our knowledge of the world
  and helps us learn, grow, and gain new perspectives. What
  makes us all different is what makes us powerful.
  
  Our Global Benefits
  
  All of our benefits are customized to the country you are
  based in, naturally we want to get the best out of our
  Nozomiers, so we provide the best benefits packages, such
  as:
  
  - Health & Wellness
  - Financial
  - Work-Life Balance
  - Unparalleled Flexible Time-Off
  
