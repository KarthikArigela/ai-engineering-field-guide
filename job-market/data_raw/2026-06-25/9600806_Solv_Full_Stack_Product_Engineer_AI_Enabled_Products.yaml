title: Full Stack Product Engineer, AI Enabled Products
company: Solv.
location: USA
remote: true
work_type: FULL_TIME
description: |
  Being sick or injured is painful. Getting better shouldn’t
  be.
  
  Most industries have been transformed by new technology.
  Healthcare is still waiting — and you can help change that.
  
  Our mission is simple but ambitious: make healthcare
  accessible, transparent, and effortless for all. We put the
  consumer at the center, move fast and partner with forward-
  thinking providers to deliver software that makes care
  better, faster, and more human. This is work with real-world
  stakes — and you can help lead the way.
  
  Solv is building AI-powered healthcare infrastructure that
  makes everyday care easier for patients and the teams who
  care for them, from finding and receiving care to helping
  clinics reduce manual work, improve access, and run better
  operations.
  
  This role is ideal for someone who enjoys making the product
  better in whatever way is needed, whether that means
  shipping a feature, fixing a rough edge, testing a workflow,
  improving an existing surface, or helping a release get
  across the finish line.
  
  You Can Expect To:
  
  - Dive in from day one, building and improving our platform
    across the stack
  - Use AI-assisted development tools to understand code,
    implement changes, debug issues, write tests, and verify
    behavior
  - Take on the full range of product work needed to improve the
    customer experience, from new features and fixes to QA,
    rollout, and follow-through
  - Work closely with product, design, operations, customer
    success, and engineering to make sure what we ship solves
    the actual customer problem
  - Leave product areas better than you found them by improving
    usability, reliability, data quality, and operational
    workflows along the way
  
  You'll be great for this role if you
  
  - Have 2-4 years of experience building, shipping, and
    maintaining production web applications
    - Are comfortable working across frontend and backend systems
    - Can read, debug, and modify production code with confidence
    - Have experience with React or similar frontend frameworks
    - Have backend experience in Python or similar server-side
      environments
    - Have experience with SQL databases such as Postgres or
      similar relational systems
  - Are comfortable using AI-assisted development tools in real
    development work
    - Carefully review, test, and validate AI-assisted work before
      shipping
    - Use AI to help understand code, generate implementation
      options, debug issues, or verify product behavior
  - Care deeply about whether the thing you shipped actually
    works for users, not just whether the code was merged
    - Are willing to jump into practical work like testing,
      debugging, cleanup, documentation, and release follow-
      through
    - Have strong attention to detail around edge cases, user
      workflows, data correctness, and production behavior
    - Look for small opportunities to improve the product while
      you are already working in an area
  - Are energized by improving complex workflows, especially in
    products used by businesses or enterprise customers
  - Have demonstrated experience working in an agile
    environment, taking initiative, and shipping products
    while contributing to collaborative design, engineering,
    and product teams
  - Consider yourself a self-starter, eager to jump into new
    environments and learn through experience
  
  Nice to have:
  
  - Experience with enterprise SaaS
  - Experience with React, Remix, Python, FastAPI, Postgres, or
    similar technologies
  
  Salary ranges vary by location and experience:
  
  - San Francisco & New York: $145,00 - $175,000
  - Colorado: $130,000 - 165,000
  - All other locations: $130,000 - 175,000
  
  Solv offers robust benefits including:
  
  - Solv equity for full time US based employees
  - Medical, Dental, Vision Insurance - 100% for employees
  - 401k plan available
  - Up to 12 weeks of paid Parental Leave
  - Monthly Wellness Reimbursement
  - Flexible Time Off
  - Company Paid Life Insurance, LTD, and STD
  - Company contribution towards HSA
  - Medical and Dependent care FSAs available
  
  This position is being hired on an urgent basis. The
  application window may close before August 31 if a
  sufficient number of applications to select a candidate are
  received prior to that date.
  
  Unfortunately, we are unable to sponsor visas at this time.
