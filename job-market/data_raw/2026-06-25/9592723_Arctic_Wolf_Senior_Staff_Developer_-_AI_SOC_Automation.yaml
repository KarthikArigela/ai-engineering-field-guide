description: |
  At Arctic Wolf, you will not just watch the cybersecurity
  industry evolve – you will help lead the change. Our global
  team is made up of people who thrive on solving complex
  problems, moving quickly, and building technology that
  protects organizations around the world. We are proud to be
  recognized by Forbes, CNBC, Fortune, CRN, Gartner Peer
  Insights, and International Data Corporation MarketScape.
  What matters most is the work behind these recognitions:
  delivering real outcomes for customers through award-winning
  innovation such as our Aurora Platform.
  
  If you are looking for meaningful work, smart teammates, and
  the opportunity to make a real impact in a high-growth
  company that is redefining security operations, Arctic Wolf
  is the right place for you.
  
  Our mission is simple: End Cyber Risk.
  
  We are looking for a Senior Staff Developer – Security
  Operations Automation to help achieve this mission.
  
  The Senior Staff Developer will contribute to our
  Engineering organization by designing and building next-
  generation security operations automation platforms that
  improve detection reliability, incident response speed, and
  operational efficiency. This role combines advanced backend
  engineering, cloud-native architecture, cybersecurity
  automation, and applied artificial intelligence to develop
  intelligent systems that strengthen Arctic Wolf’s security
  operations capabilities.
  
  As a senior technical leader, you will help define
  architectural direction, mentor engineers, and drive
  innovation across automation frameworks, detection
  pipelines, and artificial intelligence-powered security
  workflows.
  
  ABOUT ARCTIC WOLF LABS
  
  Arctic Wolf Labs is the research-focused division of Arctic
  Wolf dedicated to advancing innovation in security
  operations. Our mission is to develop cutting-edge
  technologies and tools that strengthen Arctic Wolf’s core
  goal of ending cyber risk while bringing intelligence and
  automation to both our customers and the broader security
  community.
  
  You will collaborate with threat researchers, data
  scientists, detection engineers, platform developers, and
  security operations experts to build real-world solutions
  for complex cybersecurity challenges.
  
  IN THIS ROLE, YOU WILL:
  
  • Design, develop, test, and deploy backend automation
  systems that enhance Security Operations Center workflows
  through cloud-native, data-intensive, and artificial
  intelligence-driven architectures
  
  • Develop scalable backend services and microservices using
  Python, Go, and modern cloud-native design patterns
  
  • Build secure, highly available systems leveraging Amazon
  Web Services technologies including Relational Database
  Service, DynamoDB, Lambda, Elastic Kubernetes Service, and
  other cloud-native services
  
  • Design and maintain detection pipelines, incident response
  playbooks, enrichment services, and intelligent automation
  frameworks
  
  • Integrate software components into production-ready
  systems with strong observability, reliability,
  documentation, and maintainability
  
  • Collaborate with threat detection, incident response, data
  science, and platform engineering teams to deliver secure
  and context-aware automation solutions
  
  • Apply test-driven development methodologies and continuous
  integration and continuous delivery practices using Git,
  Jenkins, Terraform, Docker, and infrastructure-as-code
  workflows
  
  • Contribute to architectural decisions involving large
  language models, reasoning agents, and autonomous task
  execution frameworks within security operations tooling
  
  • Solve complex technical challenges across distributed
  systems using advanced debugging, troubleshooting, and
  analytical techniques
  
  • Research, prototype, and operationalize innovative
  artificial intelligence capabilities for detection, triage,
  automation, and response workflows
  
  • Drive engineering excellence through code reviews,
  architectural guidance, and technical leadership
  
  • Mentor and develop engineers while contributing to the
  growth and maturity of the engineering organization
  
  YOU WILL BE SUCCESSFUL IN THIS ROLE IF:
  
  • You have 9 or more years of experience in backend software
  development, infrastructure engineering, or security-focused
  systems development
  
  • You possess deep expertise in automation design patterns,
  distributed systems, and cloud-native application
  architectures
  
  • You have experience building and operating large-scale
  production systems using Python, Go, or similar programming
  languages
  
  • You have strong experience with cloud platforms such as
  Amazon Web Services, Google Cloud Platform, or Microsoft
  Azure
  
  • You have hands-on experience with Kubernetes, Docker,
  Terraform, and microservices-based architectures
  
  • You have experience integrating artificial intelligence or
  machine learning capabilities into production systems
  
  • You have strong knowledge of data pipelines, streaming
  architectures, and security detection workflows
  
  • You have demonstrated success leading complex technical
  initiatives and influencing architectural decisions
  
  • You can independently drive large-scale engineering
  efforts from design through production deployment
  
  • You have strong communication, collaboration, and problem-
  solving skills
  
  • You are passionate about cybersecurity, artificial
  intelligence, automation, and engineering excellence
  
  Nice to have:
  
  • Experience building security operations automation
  platforms
  
  • Experience working directly with Security Operations
  Center, threat detection, or incident response teams
  
  • Experience integrating large language models and agentic
  frameworks into production environments
  
  • Familiarity with detection engineering, threat
  intelligence, or security analytics platforms
  
  • Experience contributing to technical strategy,
  architecture reviews, or engineering leadership initiatives
  
  WHAT SUCCESS LOOKS LIKE:
  
  • Delivery of scalable automation platforms that improve
  security operations effectiveness and efficiency
  
  • Measurable improvements in detection reliability, incident
  response speed, and operational automation
  
  • Successful adoption of artificial intelligence-powered
  workflows within security operations
  
  • Development of highly available and secure cloud-native
  systems supporting global security operations
  
  • Strong technical mentorship and growth of engineering
  talent across the organization
  
  • Continuous innovation that advances Arctic Wolf’s mission
  to end cyber risk
  
  Do not meet all the requirements? That is okay. We still
  encourage you to apply. We have many opportunities and are
  always looking for strong talent.
  
  On-Camera Policy
  
  To support a fair, transparent, and engaging interview
  experience, candidates interviewing remotely are expected to
  be on camera during all video interviews. Being on camera
  fosters authentic connection, improves communication, and
  allows for full engagement from both candidates and
  interviewers. We understand that technical, bandwidth, or
  location-related challenges may occasionally prevent video
  use. If this applies, candidates are required to notify us
  in advance so we can explore appropriate accommodations.
  
  At Arctic Wolf, we foster a collaborative and inclusive work
  environment that thrives on diversity of thought,
  background, and culture. This is reflected in our multiple
  awards, including Top Workplace United States, Best Places
  to Work United States, Great Place to Work Canada, Great
  Place to Work United Kingdom, and Kununu Top Company
  Germany. Our commitment to bold growth and shaping the
  future of security operations is matched by our dedication
  to customer satisfaction, with over 10,000 customers
  worldwide and more than 2,000 channel partners globally. As
  we continue to expand and enhance our technology, Arctic
  Wolf remains a trusted name in the industry.
  
  Our Values
  
  Arctic Wolf recognizes that success comes from delighting
  our customers, so we work together to ensure that happens
  every day. We believe in diversity and inclusion and value
  the unique perspectives all employees bring to the
  organization. By protecting sensitive data and working to
  end cyber risk, we contribute to an industry that serves the
  greater good.
  
  We celebrate diverse perspectives through our Pack Unity
  program and encourage employees to participate in or create
  new alliances.
  
  We also believe in corporate responsibility and have joined
  the Pledge One Percent movement to give back to our
  communities.
  
  All employees receive compelling compensation and benefits
  packages, including:
  
  • Equity for all employees
  
  • Flexible annual leave, paid holidays, and volunteer days
  
  • Training and career development programs
  
  • Comprehensive private benefits plan including medical
  insurance for you and your family, life insurance equal to
  three times compensation, and personal accident insurance
  
  • Fertility support and paid parental leave
  
  Arctic Wolf is an equal opportunity employer and considers
  applicants for employment without regard to race, color,
  religion, sex, orientation, national origin, age,
  disability, genetics, or any other basis forbidden under
  applicable law. We are committed to fostering a welcoming,
  accessible, and inclusive environment.
  
  Security Requirements
  
  • Conduct duties in accordance with Arctic Wolf information
  security policies, standards, and controls
  
  • Background checks are required for this position
  
  • This role may require access to information protected
  under United States export control laws and regulations
