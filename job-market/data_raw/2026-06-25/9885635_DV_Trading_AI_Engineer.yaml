description: |
  About Us:
  
  Founded 20 years ago and headquartered in Chicago, the DV
  Group of financial services firms has grown to more than 600
  people operating throughout North America, Europe and Asia.
  Since spinning out of a large brokerage firm in 2016, DV
  Trading has rapidly scaled as an independent proprietary
  trading firm utilizing its own capital, trading strategies,
  and risk management methodologies to provide liquidity to
  worldwide financial markets and hedging opportunities to
  commodity producers and users. Now, DV group affiliates
  include two broker dealers, a cryptocurrency market making
  firm, and a bourgeoning investment adviser.
  
  Overview:
  
  DV Trading is building a centralized AI function to deliver
  production agent applications for teams across the firm. The
  AI Engineer ships agent-powered tools that business users
  rely on daily, building on team standards for security,
  deployment, and observability.
  
  Job Responsibilities:
  
  - Build and deploy production agent applications for business
    stakeholders
  - Integrate agents with internal databases, APIs, and
    operational data sources
  - Develop starter templates that teams can inherit for
    consistent, safe AI builds
  - Partner with teams across the firm to identify and
    prioritize new agent use cases
  - Work within established agent and MCP standards; contribute
    improvements from production learnings
  
  Requirements:
  
  - 3+ years software engineering; strong Python
  - Experience building and shipping production agent systems
    (not demos or prototypes)
  - Experience building and shipping web applications or backend
    services in production
  - Hands-on experience with LLM-powered applications or agent
    tool-calling
  - Comfort integrating with databases and internal APIs
  - Ability to work directly with business stakeholders to
    refine requirements and iterate
  - Kubernetes, CI/CD, or observability experience a plus
  
  Preferred:
  
  - Financial services or trading operations environment
  - Experience with MCP or similar tool-access patterns
  - Full-stack capability (API + UI) for internal tools
  
  Benefits:
  
  - Discretionary bonus eligibility
  - Medical, dental, and vision insurance
  - HSA, FSA, and Dependent Care Options
  - Employer Paid Group Term Life and AD&D insurance
  - Voluntary LTD, Life & AD&D insurance
  - Flexible Vacation policy
  - Retirement plan with employer match
  
  DV is not accepting unsolicited resumes from search firms.
  Only search firms with valid, written agreements with DV
  should submit resumes in response to DV’s posted positions.
  All resumes submitted by search firms to DV via e-mail, the
  Internet, personal delivery, facsimile, or any other method
  without a valid written agreement shall be deemed the sole
  property of DV, and no fee will be paid in the event the
  candidate is hired by DV. DV is proud to be an equal
  opportunity employer and committed to creating an inclusive
  environment for all employees.
  
  The range below reflects the expected base salary for this
  position. It represents a good-faith estimate of the base
  pay we anticipate offering, with actual compensation
  determined by your experience, education, skills, and
  performance throughout the interview process. This role is
  also eligible for a discretionary bonus (at DV Trading's
  discretion) and DV Trading's benefits package, including the
  benefits listed above.
  
  Base Salary Range
  
  $150,000—$250,000 USD
