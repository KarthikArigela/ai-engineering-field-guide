  Job Title: AI/ML Engineer (Gen AI)
  
  Company: Programming.com Experience: 5+ Years Location:
  Panchkula (Onsite) Shift: Night Shift
  
  About Programming.com
  
  Programming.com is a global technology services company
  delivering innovative digital solutions across AI, cloud,
  data, and modern application development. We help
  enterprises accelerate growth by leveraging cutting-edge
  technologies and strong engineering expertise.
  
  Job Summary
  
  We are looking for an experienced AI/ML Engineer –
  Generative AI to join our team onsite at Panchkula. The
  ideal candidate will have strong hands-on experience in
  building, fine-tuning, and deploying GenAI solutions using
  modern ML frameworks and LLM ecosystems. You will work
  closely with product, engineering, and data teams to design
  scalable AI-driven applications.
  
  Key Responsibilities
  
  - Design, develop, and deploy Generative AI solutions using
    LLMs (OpenAI, Azure OpenAI, Anthropic, open-source models,
    etc.)
  - Build and optimize ML pipelines for training, fine-tuning,
    evaluation, and inference
  - Implement RAG (Retrieval-Augmented Generation) architectures
    using vector databases
  - Develop prompt engineering strategies and fine-tuning
    techniques (LoRA, PEFT, RLHF – basic understanding)
  - Integrate GenAI models into production systems via APIs and
    microservices
  - Work with large datasets for data preprocessing, feature
    engineering, and model validation
  - Ensure scalability, performance, security, and cost
    optimization of AI solutions
  - Collaborate with cross-functional teams to translate
    business requirements into AI-driven solutions
  - Stay up to date with the latest advancements in AI/ML and
    Generative AI
  
  Mandatory Skills & Requirements
  
  - 5+ years of experience in AI/ML engineering or data science
  - Strong proficiency in Python and ML libraries (PyTorch,
    TensorFlow, Scikit-learn)
  - Hands-on experience with LLMs and Generative AI frameworks
    (LangChain, LlamaIndex, Hugging Face)
  - Experience with vector databases (FAISS, Pinecone, Weaviate,
    Chroma, etc.)
  - Solid understanding of NLP concepts, transformers,
    embeddings, and model evaluation
  - Experience deploying models using Docker, Kubernetes, or
    cloud platforms (AWS/Azure/GCP)
  - Strong SQL/NoSQL knowledge and experience handling large-
    scale data
  - Good communication skills and ability to work in a night-
    shift environment
  
  Good to Have
  
  - Experience with MLOps tools (MLflow, Airflow, Kubeflow)
  - Knowledge of Azure OpenAI / AWS Bedrock / Vertex AI
  - Exposure to multi-agent systems and autonomous AI workflows
  - Prior experience in client-facing or consulting projects
  
  Why Join Programming.com?
  
  - Work on cutting-edge Generative AI projects
  - Opportunity to collaborate with global clients and teams
  - Fast-paced learning environment with strong technical
    exposure
  - Competitive compensation and growth opportunities
  
