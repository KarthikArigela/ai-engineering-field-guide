description: |
  DeepIntent is leading the healthcare advertising industry
  with data-driven solutions built for the future. From day
  one, our mission has been to improve patient outcomes
  through the artful use of advertising, data science, and
  real-world clinical data. For more information visit,
  www.DeepIntent.com.
  
  What You’ll Do:
  
  We are looking for an Applied AI Engineer to embed directly
  with our US commercial and operational teams building a
  human and agentic “operating system” that powers how we work
  as a company. In this role, you will be a builder and a
  problem-solver — someone who translates day-to-day
  operational pain points into practical AI agent and
  automation solutions that free up capacity for higher-value
  work.
  
  This is an ideal role for someone who is passionate about
  applied AI, comfortable working across business and
  technical teams, and excited to see their work make an
  immediate and measurable impact.
  
  Build & Deploy AI Agents and Automations
  
  - Design, build, and deploy AI agents that automate
    administrative and repetitive workflows across commercial
    operations.
  - Identify high-value automation opportunities by working
    directly with stakeholders to map processes and surface
    inefficiencies.
  - Develop solutions using LLMs (e.g., OpenAI, Anthropic
    Claude), workflow automation tools, RESTful APIs, and
    Python scripting.
  - Prototype, iterate, and ship working solutions quickly —
    moving from problem to deployed tool with minimal
    overhead.
  
  Partner with Business Teams
  
  - Serve as the technical point of contact embedded within
    commercial and PMO teams, building strong working
    relationships with non-technical stakeholders.
  - Translate ambiguous business needs into clear technical
    requirements and executable solutions.
  - Communicate progress, surface blockers, and present
    solutions in a way that is accessible to both technical
    and non-technical audiences.
  
  Maintain & Document
  
  - Create and maintain clear technical documentation for all
    tools, workflows, and integrations you build.
  - Monitor deployed solutions and proactively identify
    opportunities to improve reliability, performance, and
    adoption.
  
  Who You Are
  
  - Bachelors or Masters degree in Computer Science, Mathematics
    or Engineering
  - Hands-on experience with AI/LLM tools, including configuring
    and prompting models from providers such as OpenAI or
    Anthropic (i.e. you’ve successfully shipped a product or
    feature using Claude Code)
  - 2+ years of hands-on software development experience,
    including internships, co-ops, or personal projects with
    deployed, real-world applications
  - Comfortable working with RESTful APIs, MCP servers, and
    integrating third-party services.
  - Scripting language (i.e. Python) proficiency — you can write
    scripts, build lightweight automations, and debug
    independently.
  - Understanding of prompt engineering best practices.
  - Naturally curious and proactive — you seek out problems,
    propose solutions, and don’t wait to be told what to build
    next.
  - Strong communicator who can work fluidly across business and
    engineering functions.
  - Comfortable with ambiguity — you can scope your own work and
    adapt as priorities shift.
  - Based in or able to work effectively within Eastern Time
    (EST).
  
  DeepIntent is proud to offer a competitive compensation
  package inclusive of a base salary range of $105,000
  -$120,000. The base salary range takes into consideration
  each candidates skills, experience and qualifications. In
  addition, we offer an annualized bonus plan and competitive
  benefits as well as many other company offerings.
  
  We believe great work starts with great support. That’s why
  DeepIntent offers a competitive, holistic benefits package
  designed to empower you both professionally and personally.
  
  Here’s what you can expect when you join our team based in
  the US: Competitive base salary plus performance based bonus
  or commission, comprehensive medical, dental, and vision
  insurance, 401K match program, Unlimited PTO policy and paid
  holidays, remote friendly culture with flexible work
  options, career development and advanced education support,
  WFH and internet stipends, plus many more perks and
  benefits!
  
  Here’s what you can expect when you join our team based in
  India: Competitive base salary plus performance based bonus,
  comprehensive medical insurance, and paid holidays. Hybrid-
  friendly culture with flexible work options, professional
  development reimbursement, WiFi reimbursement and health and
  wellness allowance plus many more perks and benefits!
  
  Here's what you can expect when you join our team based in
  Europe: Competitive base salary plus performance-based
  bonus, comprehensive medical insurance, and flexible PTO.
  Hybrid-friendly culture with flexible work options,
  professional development reimbursement, WiFi reimbursement,
  and parental leave plus many more perks and benefits!
  
