title: "Senior Integration Engineer, Client Data & AI"
company: Hummingbird Healthcare
location: USA
work_type: FULL_TIME
description: |
  Hi. We’re Hummingbird.
  
  We’re elevating patient access so patients can get
  healthcare how, when, and where they need it.  We partner
  with healthcare systems to transform how patients access
  care, enabling their providers to focus on what matters most
  – caring for patients. By managing patient access as a
  technology-enabled service, we help health systems stabilize
  costs and improve patient experience while creating good
  jobs that attract and retain talent in the industry.  Our
  team of experts is obsessed with the connection between the
  people, processes, and technology that make healthcare
  organizations hum. Join us and help build the healthcare
  experience we want for our communities, our families, and
  ourselves.
  
  Summary
  
  Responsibilities
  
  Clear the path for data to flow, so AI and the people who
  use it can do their best work.
  
  As a Senior Integration Engineer, Client Data & AI, you’ll
  own the technical pipeline that connects client healthcare
  systems to our platform. You’ll lead integrations with
  client Epic EHR systems, build and validate ETL pipelines,
  assess telephony data structures, and ingest historical data
  at the start of each client engagement. Most of your day is
  spent scoping integrations with client teams, building and
  troubleshooting pipelines, modeling data so it’s ready for
  AI to access, and documenting your work, all toward making
  each onboarding faster and more automated than the last.
  
  The role unites two things that used to live apart: getting
  data out of client systems and into ours, and shaping it to
  be usable, AI-accessible, and ready for citizen developers
  to build on. You’ll work with high independence on complex,
  ambiguous problems, framing them, making tradeoffs, and
  mentoring peers while anchoring the team with reliable
  delivery. We work AI-native, so you’ll treat AI as a partner
  you direct, not a tool you reach for occasionally.
  
  Why now: Hummingbird is moving into an AI-native way of
  working, and this team sits at the center of it. The tools
  and capabilities the rest of the company relies on are built
  and supported here, so we stay a step ahead of what everyone
  else will use next. Joining now means helping shape that
  foundation as it’s built, with your work directly enabling
  how Hummingbird leverages AI and data.
  
  What You’ll Do
  
  - Lead technical integration with client Epic EHR systems,
    building extraction and ETL pipelines across Clarity,
    Caboodle, FHIR, or other access methods.
  - Work directly with client technical teams to scope
    integrations, resolve configuration issues, and validate
    data quality before pipelines go live.
  - Assess client telephony systems and build pipelines that
    ingest historical telephony data and pair it with Epic
    clinical data in Hummingbird’s environment.
  - Model and structure ingested data so it’s readily available
    for AI to access and usable by citizen developers building
    on the platform.
  - Own the technical integration workstream during client
    onboarding, coordinating with client contacts and internal
    teams while communicating status, risks, and blockers
    clearly.
  - Design reusable integration frameworks and automation, using
    agents, templated pipelines, and self-service tooling to
    make each new onboarding faster than the last.
  - Apply AI-native development practices as a default,
    including AI-assisted coding and agent-driven monitoring,
    within the team’s CI/CD and infrastructure-as-code
    standards.
  - Document client-specific configurations, integration
    decisions, and automation tradeoffs so knowledge lives in
    the team rather than with individual engineers.
  - Mentor less experienced engineers by reviewing their
    pipeline work, walking through integration decisions, and
    coaching them through client-specific complexity.
  - Identify recurring friction points and propose process,
    tooling, or automation changes that improve efficiency,
    consistency, and quality across the team.
  
  The Details
  
  Employment Eligibility: Candidates must be legally
  authorized to work in the United States without sponsorship
  
  Work Location: Remote. You must work from a location within
  the United States with consistent Internet service
  
  Work Type: Full-time
  
  Compensation: The full range for this role is $125,000 -
  $162,500. New hires usually start between $125,000 -
  $150,000, depending on experience and internal equity. If
  your experience points to a different level, we encourage
  you to apply anyway; for the right person, we’re open to
  hiring at a more senior level with compensation to match.
  
  Benefits: Comprehensive medical, dental, and vision
  coverage; paid time off; 401(k); parental leave; career
  development support; and more
  
  Travel: 2–3 trips per year for client meetings, training or
  conferences, or internal strategy sessions
  
  Required & Desired Skills
  
  What You’ll Bring
  
  - 4 to 5+ years of consistent, independent delivery in data
    integration or platform engineering, including work in
    moderately ambiguous, client-facing contexts.
  - An architectural mindset: you’ve designed solutions and can
    reason about how a small change affects the larger system,
    rather than only executing predefined tasks.
  - Proficiency with Epic EHR data extraction, including at
    least one of Clarity, Caboodle, or FHIR, and a track
    record of building ETL pipelines with validation, error
    handling, and handoff-ready documentation.
  - Comfort across multiple systems and APIs, with the
    confidence to look at an unfamiliar piece of software and
    figure out how to get data into and out of it.
  - Hands-on fluency in at least two programming languages (for
    example SQL and Python, or others), and a background using
    CI/CD and infrastructure-as-code in production.
  - Genuine adoption of AI as a working partner you direct and
    advise, not an occasional tool, with the ability to bring
    that practice to a team.
  - A history of working directly with client technical teams to
    scope, troubleshoot, and deliver integration work, plus
    demonstrated peer mentorship or informal technical
    leadership.
  - Strong communication and critical thinking: you can clearly
    describe a problem, the path you took to a solution, the
    barriers you hit, and the steps you took to work through
    them.
  
  Nice to Have
  
  - Prior experience integrating telephony or contact center
    data systems.
  - Evidence of improving team practices or outputs through
    refinements to integration methods, tooling, or
    automation, especially in evolving client environments.
  - Experience in a start-up or rapidly growing environment, and
    comfort working remote.
  
  What Helps You Shine
  
  - Please note that we use both your resume and your written
    and oral communication throughout the hiring process to
    understand your fit for this role.
  - Thoughtful, clear responses help us see your attention to
    detail, your professionalism, and your ability to
    communicate with care, all skills that are essential for
    success on our team.
  
  A Note on Authentic Interviews
  
  We believe the best hiring conversations are real ones.
  Notes are welcome, and jotting things down during the call
  is completely fine. What we ask is that you don't use AI
  tools or similar assistance to generate your responses in
  real time.
  
  We're genuinely trying to get to know you: how you think,
  how you communicate, and what you've experienced. That
  connection matters to us, and it's hard to find when answers
  are scripted rather than interactive.
  
  We're a team that makes healthcare more human. We'd love to
  meet the person behind your application.
  
  Expectations for Focus & Presence
  
  - To support patients and each other, this role requires your
    full attention during scheduled work hours. Our Outside
    Employment Policy doesn’t allow overlapping work or “job
    stacking,” so any outside work must happen fully outside
    your Hummingbird schedule.
  - We’re a camera-ready team, and you’ll need to be on camera
    during training and when needed during the workday after
    training ends.
  - We value connection, teamwork, and being present, which is
    what keeps our patients safe and our team supported. If
    that’s what you’re looking for, you’ll feel at home here.
    If you’re hoping to hold another job during the same
    hours, this job won’t be the best match.
  
  Growth at Hummingbird
  
  This role is a key step in building out our client data and
  integration function. You’ll receive support, coaching, and
  real ownership to take on more complex work over time,
  whether that means deepening your technical expertise,
  expanding into new domains, or growing into advanced or
  leadership roles as the team grows. At Hummingbird, we
  believe good jobs should lead somewhere, and that starts
  here.
  
  #LI-JF1
  
  Please Note: The seniority level of this position may be
  adjusted during the recruitment process based on candidate
  skills and experience.
  
  The Hummingbird Approach We value a team that brings diverse
  perspectives and experiences to the work we do. While there
  are many ways to do this, people who are successful at
  Hummingbird:
  
  - Lead with Respect by valuing kindness and working to
    actively foster an environment of inclusion and respect.
  - Embrace Growth and seek out learning and growth for
    themselves and support those around them in their growth
    journey. They bring curiosity and an openness to
    innovation to all their interactions.
  - Bring a Win Together mentality by approaching conflict
    directly, listening carefully, and seeking to understand.
    They problem-solve with the goal of finding successes, not
    trade-offs, for all involved.
  
