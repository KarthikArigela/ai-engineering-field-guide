title: "Senior Golang Engineer – AI Products & Platforms"
company: Citi
location: London, GBR
work_type: FULL_TIME
company_size: 223,850 Employees
description: |
  Join Citi’s AI Product & Platform team, a high-growth
  engineering group operating with a start-up mentality inside
  one of the world’s largest financial institutions. Working
  within the Chief Technology Office, you’ll help build the
  next generation of AI-powered products and platforms that
  will shape how technology is delivered across the bank. This
  is an opportunity to work at the forefront of Generative AI,
  cloud-native engineering and distributed systems, building
  scalable solutions from the ground up while collaborating
  with some of the industry’s most talented engineers and AI
  specialists.
  
  
  Key Responsibilities
  
  - Design and build AI-powered products and platforms using
    Golang.
  - Develop high-performance backend services and APIs that
    operate at enterprise scale.
  - Build and enhance internal developer tools, frameworks and
    reusable components.
  - Partner with product, engineering and AI teams to turn
    innovative ideas into production-ready solutions.
  - Contribute to the design and implementation of cloud-native,
    microservices-based architectures.
  - Drive engineering best practices across code quality,
    testing, observability and CI/CD.
  - Solve complex distributed systems challenges, focusing on
    scalability, resilience and performance.
  - Mentor engineers and contribute to a collaborative, high-
    performing engineering culture.
  
  Skills & Experience
  
  - Golang (Go) expertise is essential, with a proven track
    record of building scalable, business-critical
    applications in production environments.
  - Strong experience designing and developing large-scale
    backend services and APIs.
  - Proven ability to build and operate systems within
    microservices and distributed environments.
  - Experience with cloud-native technologies, containerisation
    and Kubernetes.
  - Strong understanding of software engineering fundamentals,
    system design and performance optimisation.
  - Experience building products and platforms from concept
    through to production.
  - Exposure to AI, Machine Learning or LLM-powered applications
    is highly desirable.
  - A passion for modern engineering practices, continuous
    learning and solving complex technical problems.
  
  What We Believe In
  
  - We do not have boundaries between backend engineering and
    product development, and we expect all our technical staff
    to contribute to both as needed.
  - We take a product-focused approach to engineering and care
    about building solutions that are robust, scalable, and
    easy for developers to use.
  - We enjoy working in a fast-paced team tackling cutting-edge
    engineering problems by constantly testing and learning.
  - We enjoy pair programming for our platform services; we are
    lean in our approach and remove bureaucracy where we see
    it.
  - We believe in delivering working software fast, iterating
    and pivoting as we go, rather than defining the perfect
    architecture upfront.
  
  What we’ll provide you
  
  This is a unique role that will put you in the position to
  be part of a new venture and actively drive change. Every
  day there will be new challenges that will help you develop
  new skills that can drive your career.
  
  By joining Citi London, you will not only be part of a
  business casual workplace with a hybrid working model (up to
  2 days working at home per week), but also receive a
  competitive base salary (which is annually reviewed), and
  enjoy a whole host of additional benefits such as:
  
  - 27 days annual leave (plus bank holidays)
  - A discretional annual performance related bonus
  - Private Medical Care & Life Insurance
  - Employee Assistance Program
  - Pension Plan
  - Paid Parental Leave
  - Special discounts for employees, family, and friends
  
  Visit our Global Benefits page to learn more.
  
  Alongside these benefits Citi is committed to ensuring our
  workplace is where everyone feels comfortable coming to work
  as their whole self, every day. We want the best talent
  around the world to be energized to join us, motivated to
  stay and empowered to thrive.
  
