description: |
  About Noon
  
  We are on a mission to reinvent how designers work in the AI
  era. Backed by top investors from OpenAI, Google, and
  Dropbox, we’re building the next-generation AI design tool
  for product teams.
  
  
  
  The Role
  
  We’re looking for an AI Application Lead who lives at the
  intersection of AI and code. You’ll own and scale our AI-
  powered code generation, editing, and transformation
  capabilities—building production-grade systems that turn
  designs into working code and help developers ship faster.
  
  
  
  This is a hands-on technical leadership role: you’ll
  architect agentic coding systems, ship LLM-powered features
  end-to-end, and establish the technical direction for our AI
  initiatives. We need someone who understands code as a
  domain, not just a tool—someone who thinks in ASTs, diffs,
  and multi-file dependencies.
  
  
  
  Must-Have Requirements
  
  - 8+ years in Backend Engineering; 2+ years hands-on
    experience with LLM APIs, prompt engineering, and
    production deployments for code-related tasks (code
    generation, editing, transformation, or developer tools).
  - Demonstrated experience building code generation, code
    editing, or code transformation features
  - Strong proficiency in TypeScript/Node.js
  - Experience with agentic AI systems: tool calling, multi-step
    reasoning, error recovery in code generation contexts.
  - Hands on experience in model evaluation and benchmarking
  - Hands-on builder who can architect and code, not just
    provide direction
  
  
  
  Nice-to-Have Skills
  
  - Fine-tuning LLMs for code tasks (LoRA, adapters,
    distillation)
  - Code analysis tools: tree-sitter, LSP, AST manipulation
  - Real-time streaming architectures (WebSocket), queue systems
    (BullMQ, Redis)
  - Prior experience in design-to-code or developer tools domain
  
  
  
  What You’ll Build
  
  - Agentic code generation system with multi-step tool-calling
    from design inputs
  - Code editing pipelines that apply intelligent multi-file
    edits from natural language
  - Design-to-code engine converting Figma designs to production
    React components
  - Code quality infrastructure with automated benchmarking and
    production feedback loops
  
  
  
  Benefits
  
  - Base Salary: Above market; among the top ~1% of Bengaluru
    compensation bands.
  - Equity: Meaningful stock options.
  - Health Insurance: Best-in-class coverage for you and your
    entire family.
  - Location: Bengaluru.
  - Work Style: In-office, full-time. We’re a small, high-
    ownership team that collaborates very closely from our
    WeWork Marathahalli office.
