description: |
  Here at Scotts Miracle-Gro there is no such thing as a
  typical day. Our culture is constantly energized by new and
  exciting growth opportunities and at a rapid pace. Below are
  details on an open job. If the role interests you and you
  would like to be considered we encourage you to apply!
  
  AI Engineer — SAP S/4HANA & Joule About the role We are
  migrating to SAP S/4HANA and have a live sandbox ready
  today. We are hiring a senior AI Engineer who can stand up
  the AI layer of our SAP landscape from day one — building
  Joule assistants and agents, designing AI workflows on SAP
  BTP AI Core / AI Launchpad, and turning SAP Business Data
  Cloud (BDC) data products into intelligent, agentic
  experiences. This role not only addresses custom AI and
  automation needs that arise when core S/4HANA processes are
  customized, particularly where processes cross multiple
  platforms (e.g., SAP talking to Kinaxis) but also ensure we
  are fully leveraging the native AI services offered on top
  the clean core where applicable. You will partner with
  functional, data, and security leads to embed AI into core
  ERP processes while staying true to a fit-to-standard
  implementation.
  
  What you will do:
  -Design, build, and operate Joule assistants and Joule
  agents that automate finance, supply chain, R&D,
  procurement, manufacturing, and HR workflows in S/4HANA.
  -Build agentic experiences on top of SAP Business Data Cloud
  (BDC) data products — turning curated data into RAG,
  decision-support, and action-taking agents.
  -Architect and deploy AI workflows on SAP BTP using AI Core,
  AI Launchpad, Generative AI Hub, HANA Cloud Vector Engine,
  and Build Process Automation.
  -Champion a fit-to-standard approach: extend SAP cleanly via
  BTP side-by-side extensibility, key-user tools, and standard
  APIs rather than core modification.
  -Partner with functional and data leads to translate
  business processes into agent capabilities, tool calls,
  prompts, and guardrails grounded in SAP master and
  transactional data.
  -Define the reference architecture for prompt engineering,
  model selection, evaluation, observability, and human-in-
  the-loop review across the SAP landscape.
  -Implement responsible-AI controls: data classification, PII
  handling, role-based access, audit trails, and alignment
  with SAP's AI ethics and our enterprise policies.
  -Lead the AI workstream of the S/4HANA migration — including
  sandbox experimentation, MVPs, hypercare, and the operating
  model for ongoing AI delivery.
  -Mentor analysts, developers, and functional teams on
  responsible use of Joule, GenAI, and agent patterns inside
  SAP.
  
  Required experience (minimum 8 years)
  -8+ years of overall engineering experience, with at least 3
  years building production AI / ML / GenAI solutions in an
  enterprise setting.
  -Hands-on experience with SAP — S/4HANA (public or private
  cloud preferred), including a working understanding of fit-
  to-standard ERP delivery and clean-core principles.
  -Optional - Demonstrated experience designing and building
  with SAP Joule — copilots, assistants, and Joule agents —
  and integrating them with SAP business processes.
  -Production experience on SAP BTP, specifically AI Core, AI
  Launchpad, and Generative AI Hub; comfortable deploying,
  versioning, and monitoring models and prompts there.
  -Working knowledge of SAP Business Data Cloud (BDC) — data
  products, intelligent data lineage, and how to expose BDC
  data to AI agents safely.
  -Strong software engineering fundamentals in Python and/or
  Node/TypeScript; experience with REST/OData/GraphQL, event-
  driven patterns, and CI/CD.
  -Practical experience with LLM application patterns: RAG,
  function/tool calling, agentic orchestration, evaluation,
  guardrails, and cost/latency optimization.
  -Experience integrating SAP with non-SAP systems via SAP
  Integration Suite (CPI), Event Mesh, or equivalent
  middleware.
  -Demonstrated ability to work directly with business
  stakeholders and translate ambiguous requirements into
  shippable AI workflows.
  
  Nice to have
  -Experience with SAP Datasphere, HANA Cloud (including
  Vector Engine), and SAP Analytics Cloud.
  -Hands-on with SAP Build (Apps, Code, Process Automation)
  and CAP / RAP extensibility.
  -ABAP / ABAP Cloud, CDS views, and Fiori UX familiarity for
  embedded AI scenarios.
  -Experience deploying agentic frameworks (LangGraph,
  LlamaIndex, AutoGen, CrewAI) and evaluating them against
  SAP-native agent tooling.
  -Exposure to MLOps tooling (MLflow, Kubeflow, Vertex AI,
  Azure ML, AWS Bedrock/SageMaker) and how to bridge them with
  SAP AI Core.
  -SAP certifications (S/4HANA, BTP, AI) or comparable
  demonstrable expertise.
  
  What success looks like in the first 12 months
  -Reference architecture for AI on our S/4HANA + BTP + BDC
  stack is documented, reviewed, and adopted.
  -At least 3 production-like Joule agents are live across
  finance, supply chain, or commercial operations in the
  sandbox — with measurable cycle-time or accuracy gains.
  -BDC data products are exposed to agents through a governed,
  reusable pattern; at least one BDC-backed agent is in
  production-like setting.
  -An evaluation and observability framework is in place for
  every AI workflow we ship.
  -The team has a repeatable, fit-to-standard playbook for
  moving AI use cases from idea to production on SAP.
  
  
  The starting budgeted pay range for this role will generally
  fall between $140,000.00 - $164,700.00 per year. Scotts will
  consider various factors in determining the actual pay
  including your skills, qualifications, experience, and
  geographical location.In addition to the determined base
  salary, this role is also incentive eligible under our
  corporate bonus programs.For remote roles where the final
  candidate resides in Alaska, California, Colorado, Illinois,
  New York, Oregon or Washington, state required pay
  thresholds will be factored into base salary.
  
