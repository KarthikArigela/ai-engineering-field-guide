description: |
  About the Role
  
  We are seeking a Senior Azure AI Engineer to join a
  multidisciplinary AI delivery team responsible for
  developing and deploying AI-powered solutions on Microsoft
  Azure.
  
  This role is suited to experienced engineers from a range of
  backgrounds, including AI Engineering, Data & Context
  Engineering, Application Engineering, Full Stack
  Development, and Cloud Engineering. We are looking for
  individuals with deep expertise in one or more of these
  areas and a willingness to collaborate across the wider
  Azure AI ecosystem.
  
  Working within an agile AI squad, you will contribute to the
  design, development and delivery of AI-enabled services,
  intelligent assistants, retrieval systems and cloud-native
  applications.
  
  We Are Interested In Candidates With Experience In One Or
  More Of The Following AreasAI Engineering
  
  - Azure AI Foundry
  - Azure OpenAI
  - Prompt Flow
  - Prompt Engineering
  - Agentic AI solutions
  - AI orchestration and workflow automation
  - AI evaluation and optimisation
  - Responsible AI and guardrails
  
  Data & Context Engineering
  
  - Azure AI Search
  - Retrieval Augmented Generation (RAG)
  - Vector search and semantic retrieval
  - Document ingestion and processing pipelines
  - Context engineering
  - Metadata management
  - Evaluation datasets and testing frameworks
  
  Application Engineering
  
  - Full stack application development
  - React and TypeScript
  - API integration
  - Cloud-native development
  - Authentication and authorisation
  - CI/CD pipelines
  - Secure software engineering
  
  Cloud & Integration Engineering
  
  - Azure platform services
  - Logic Apps
  - Event-driven architectures
  - Enterprise integration patterns
  - Microservices
  - Platform automation and DevOps
  
  Key Responsibilities
  
  Depending on your area of expertise, you will contribute to:
  
  - Designing and developing AI-powered business solutions.
  - Building AI assistants, copilots and intelligent workflows.
  - Developing retrieval and knowledge management capabilities.
  - Creating secure and scalable cloud-native applications.
  - Integrating AI services with enterprise systems and data
    sources.
  - Implementing security, governance and operational controls.
  - Supporting deployment, testing and optimisation of AI
    solutions.
  - Collaborating with analysts, architects and delivery teams
    to deliver business outcomes.
  
  Essential Skills & Experience
  
  Candidates should demonstrate strong experience in at least
  one of the following:
  
  - Azure AI and Generative AI development.
  - Data engineering and retrieval architectures.
  - Full stack application development.
  - Cloud-native software engineering.
  - Enterprise integration and platform engineering.
  
  You should also possess:
  
  - Strong problem-solving and technical design skills.
  - Experience working within Agile delivery environments.
  - Excellent communication and stakeholder engagement skills.
  - A collaborative approach to multidisciplinary delivery.
  - This role requires active UK Security Check (SC) clearance.
    Due to programme requirements, only candidates holding
    current and transferable SC clearance at the point of
    application can be considered. Applicants must have the
    right to work in the UK and be willing to maintain
    clearance for the duration of the engagement.
  
  Desirable Experience
  
  - Azure certifications.
  - Experience with Large Language Models (LLMs).
  - Knowledge of agentic AI frameworks.
  - Experience working within secure or regulated environments.
  - Exposure to enterprise-scale AI deployments.
  
  Benefits
  
  Why people choose to grow their careers at UBDS Group
  
  Professionals choose to grow their careers at UBDS Group for
  its reputation as a dynamic and forward-thinking
  organisation that is deeply committed to both innovation and
  employee development. At UBDS Group, employees are given
