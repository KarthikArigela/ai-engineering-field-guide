description: |
  Who We Are
  
  Provenir is a global fintech company with offices across
  North America, the UK, and Singapore backed by talented
  teams across APAC, EMEA, and LATAM. Provenir helps fintechs,
  financial institutions, and payment providers make smarter
  decisions, faster. We are passionate about technology and
  empowering businesses to become industry leaders. As a
  leading provider of decisioning and analytics products for
  financial services and other industries, we empower
  businesses to create digital-first decisioning solutions
  that drive business growth. If you’d like to work at an
  innovative fintech with a global footprint that is
  redefining the industry, then we want you!
  
  What we’re looking for
  
  We are seeking a highly skilled and motivated AI Engineer to
  join our team. You will design, develop, and deploy machine
  learning models and AI systems that solve real-world
  problems. You’ll work closely with data scientists,
  engineers, and product teams to turn data into actionable
  insights and intelligent solutions.
  
  This role can be performed remotely; however, candidates
  located in or able to travel to the NYC metro area are
  preferred and should expect to attend in-person meetings at
  our NJ office approximately once a month.
  
  We are only considering candidates who are authorized to
  work in the United States without the need for current or
  future visa sponsorship.
  
  Key Responsibilities and Experience
  
  - Holds 5 Years of experience as AI Engineer
  - Strong Python development skills, including experience with
    modern frameworks (FastAPI preferred) and testing
    practices (pytest, unittest)
  - Proven ability to take ML/LLM models from prototype to
    production in containerized, cloud-native environments
  - Hands-on experience with deploying and managing services on
    Kubernetes (EKS) and Docker-based workflows
  - Expertise with AWS services: Bedrock, SageMaker, Lambda,
    EKS, S3, IAM, CloudWatch
  - Familiarity with Generative AI frameworks (LangChain,
    LlamaIndex) and Agent development (tool integration, RAG
    workflows)
  - Knowledge of vector databases and embeddings (e.g.,
    Pinecone, FAISS, OpenSearch)
  - Experience with CI/CD pipelines (GitHub Actions preferred)
    and Infrastructure as Code (Terraform, CloudFormation)
  - Solid foundation in object-oriented programming with a
    language such as Java, C#, or C++ (in addition to Python)
  - Understanding of MLOps practices including monitoring,
    logging, scaling, and secure deployment in production
  
  What you’ll be doing
  
  - Designing and developing APIs and reusable components for ML
    and GenAI deployment
  - Building and scaling ML/GenAI pipelines on AWS (Bedrock,
    SageMaker, Step Functions, Argo, Kubeflow on EKS)
  - Productionising LLMs, generative AI applications, and
    predictive models on Amazon Bedrock
  - Developing and integrating AI Agents with frameworks like
    LangChain for orchestration and tool use
  - Writing robust, testable, and maintainable Python code for
    backend services, SDKs, and ML workflows
  - Packaging and deploying containerized services on Kubernetes
    (EKS) with attention to scalability, resilience, and
    observability
  - Working in a modern MLOps environment with CI/CD,
    monitoring, and version control best practices
  - Supporting and maintaining cloud-native SaaS solutions at
    scale on AWS
  
  Our employees are our top priority; we offer comprehensive
  health and wellness plans. You will enjoy paid time off and
  company holidays, flexible and remote-friendly
  opportunities, and maternity/paternity leave.
  
  At Provenir, we recognize that diversity and inclusion make
  our teams stronger. We are committed to equal employment
  opportunity and welcome everyone regardless of race, colour,
  ancestry, religion, national origin, age, sex, gender
  identity, sexual orientation, disability, marital status,
  domestic partner status, citizenship, or veteran status or
  medical condition. We encourage people from all backgrounds
  to apply.
