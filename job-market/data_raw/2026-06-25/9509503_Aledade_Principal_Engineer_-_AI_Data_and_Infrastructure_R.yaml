job_id: 9509503
title: Principal Engineer - AI Data and Infrastructure, Remote
company: Aledade
location: USA
work_type: FULL_TIME
description: |
  As a Principal Software Engineer, you’ll be one of the most
  senior technical leaders shaping the future of our AI-
  powered data ecosystem: from architecting the high-
  performance foundations of next-generation agentic data
  platforms to scaling our infrastructure for millions of
  users worldwide.
  
  Reporting to our SVP of Engineering, you will partner with
  product and engineering leadership to translate technical
  strategy into business impact. You’ll set the direction for
  a unified data platform designed for an AI-first future,
  guiding dozens of engineering teams to bridge the gap
  between raw data and actionable AI.
  
  This role blends high-level architectural influence with
  hands-on code contributions, building systems from
  conception through global scale that are both innovative and
  production-ready. You will tackle complex problems in data
  orchestration, low-latency processing, and developer
  velocity, delivering the foundational capabilities that will
  accelerate company-wide innovation and define our next
  chapter.
  
  Primary Duties:
  
  - Architect complex systems and make critical technical
    decisions.
  - Solve challenging technical problems with innovative
    solutions.
  - Mentor engineers and promote engineering excellence across
    teams.
  - Align technical strategies with business goals through
    cross-functional collaboration.
  - Contribute to technical roadmaps and strategic planning.
  - Evaluate new technologies and lead innovation initiatives.
  
  Minimum Qualifications:
  
  - BS/BTech (or higher) in Computer Science, Engineering or a
    related field required
  - 10+ years of production-level experience as an engineer
    building highly scalable systems
  - 6+ years of experience acting as a trusted technical
    decision-maker in a team setting, solving for short-term
    and long-term business value
  - 4+ years of experience working with SQL or other database
    querying languages on large multi-table data sets
  - Experience architecting, developing, and deploying large-
    scale distributed systems at scale
  - Experience with cloud technologies, e.g., AWS, Azure, GCP
  - Experience building continuous integration and continuous
    development (CI/CD) pipelines
  - Strong familiarity with server-side web technologies (eg:
    Java, Python, Scala, C#, C++, Go)
  
  Preferred Knowledge, Skills and/or Abilities:
  
  - 10+ years of production-level experience as an engineer
    building highly scalable and reliable infrastructure
  - Strong background in architecting or implementing AI-driven
    features - with the ability to translate AI capabilities
    into scalable and performant products
  - Proven track record in end-to-end architecture and delivery
    - guiding large teams (50+ engineers) across multiple
    product areas from initial conception through maturity.
  - Ability to lead and mentor senior engineering talent,
    shaping architecture decisions and technical direction
    across multiple teams
  - Demonstrated success evaluating and adopting emerging
    technologies to drive company-wide technical strategies
  - Experience working with data ingestion systems and
    optimizing performance for handling large-scale data
    processing and analysis
  - Deep hands-on expertise with cloud infrastructure (AWS
    preferred), event streaming (Kafka), data processing
    (Databricks and Kafka), and large-scale database systems
  - Familiarity with  database replication, sharding and other
    techniques for scalability and high availability of
    databases
  - Experience engineering systems for scalability, high
    availability, and security — with a focus on sensitive or
    regulated data
  - Experience building observability platforms, performance
    monitoring, and optimization frameworks for large-scale
    systems and infrastructure.
  - Expertise in containerization/orchestration technologies
    (Docker, Kubernetes) and modern CI/CD pipelines
  - Experience with health-tech systems (like Electronic Health
    Records, Clinical data, etc.) is desired
  
  Physical Requirements:
  
  Who We Are:
  
  Aledade, a public benefit corporation, exists to empower the
  most transformational part of our health care landscape -
  independent primary care. We were founded in 2014, and since
  then, we've become the largest network of independent
  primary care in the country - helping practices, health
  centers and clinics deliver better care to their patients
  and thrive in value-based care. Additionally, by creating
  value-based contracts across a wide variety of health plans,
  we aim to flip the script on the traditional fee-for-service
  model. Our work strengthens continuity of care, aligns
  incentives and ensures primary care physicians are paid for
  what they do best - keeping patients healthy. If you want to
  help create a health care system that is good for patients,
  good for practices and good for society - and if you're
  eager to join a collaborative, inclusive and remote-first
  culture - you've come to the right place.
  
  What Does This Mean for You?
  
  At Aledade, you will be part of a creative culture that is
  driven by a passion for tackling complex issues with
  respect, open-mindedness and a desire to learn. You will
  collaborate with team members who bring a wide range of
  experiences, interests, backgrounds, beliefs and
  achievements to their work - and who are all united by a
  shared passion for public health and a commitment to the
  Aledade mission.
  
  In addition to time off to support work-life balance and
  enjoyment, we offer the following comprehensive benefits
  package designed for the overall well-being of our team
  members:
  
  Flexible work schedules and the ability to work remotely are
  available for many roles
  
  Health, dental and vision insurance paid up to 80% for
  employees, dependents and domestic partners
  
  Robust time-off plan (21 days of PTO in your first year)
  
  Two paid volunteer days and 11 paid holidays
  
  12 weeks paid parental leave for all new parents
  
  Six weeks paid sabbatical after six years of service
  
  Educational Assistant Program and Clinical Employee
  Reimbursement Program
  
  401(k) with up to 4% match
  
  Stock options
  
  And much more!
  
  At Aledade, we don’t just accept differences, we celebrate
  them! We strive to attract, develop and retain highly
  qualified individuals representing the diverse communities
  where we live and work. Aledade is committed to creating a
  diverse environment and is proud to be an equal opportunity
  employer. Employment policies and decisions at Aledade are
  based on merit, qualifications, performance and business
  needs. All qualified candidates will receive consideration
  for employment without regard to age, race, color, national
  origin, gender (including pregnancy, childbirth or medical
  conditions related to pregnancy or childbirth), gender
  identity or expression, religion, physical or mental
  disability, medical condition, legally protected genetic
  information, marital status, veteran status, or sexual
  orientation.
  
