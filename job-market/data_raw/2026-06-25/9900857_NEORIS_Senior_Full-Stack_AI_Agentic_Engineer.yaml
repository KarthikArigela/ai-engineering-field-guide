title: Senior Full-Stack AI Agentic Engineer
company: NEORIS
location: USA
remote: true
work_type: FULL_TIME
description: |
  NEORIS is a Digital accelerator that helps companies enter
  the future, having 20 years of experience as Digital
  Partners of some of the largest companies in the world. We
  have more than 4,000 professionals in 11 countries, with our
  multicultural startup culture where we cultivate innovation,
  continuous learning to create high-value solutions for our
  clients.
  
  We are looking for a Senior Full-Stack AI Agentic Engineer
  with a strong full-stack background combined with hands-on
  experience in Generative AI and Agentic AI systems. The
  ideal candidate will design, build, and deploy scalable,
  production-ready applications that integrate modern front-
  end frameworks, robust backend services, cloud-native
  infrastructure, and AI-driven automation.
  
  Key Responsibilities
  
  - Design, develop, and maintain full-stack applications using
    React and modern backend frameworks.
  - Build and integrate AI-powered and Agentic AI solutions,
    including GenAI-based workflows and automation.
  - Develop scalable backend services using Java (Spring Boot)
    and/or Python, ensuring high performance and reliability.
  - Implement and maintain CI/CD pipelines to support automated
    testing, deployment, and monitoring.
  - Design and deploy applications on cloud platforms
    (Kubernetes, Google Cloud, Azure), following cloud-native
    best practices.
  - Work with multiple database technologies (relational and
    NoSQL) to support data-driven applications.
  - Implement automated testing strategies using tools such as
    Playwright and Selenium.
  - Monitor application performance and system health using
    observability and monitoring tools.
  - Collaborate with DevOps, QA, and Product teams to ensure
    seamless delivery across environments.
  - Troubleshoot production issues, perform root cause analysis,
    and drive continuous improvement.
  - Contribute to technical documentation, architectural
    decisions, and best-practice guidelines.
  
  Required Qualifications
  
  - 5+ years of professional experience as a Full-Stack
    Engineer.
  - Strong frontend experience with React and JavaScript.
  - Backend expertise with Java, Spring Boot, Python, Groovy,
    and JUnit.
  - Hands-on experience with CI/CD tools such as Jenkins, GitHub
    Actions, and Docker.
  - Solid experience working with Kubernetes and cloud platforms
    (Google Cloud and/or Azure).
  - Experience with databases including MongoDB, PostgreSQL,
    MySQL, and/or DB2.
  - Proficiency with Linux environments and scripting using
    Bash.
  - Experience with monitoring and deployment tools such as
    Spinnaker, Grafana, and Terraform.
  - Experience implementing automation testing using Playwright
    and/or Selenium.
  - Practical experience with Generative AI and Agentic AI
    concepts and implementations.
  - Strong problem-solving skills and ability to work
    independently in complex environments.
  - Comfortable working in English-speaking environments (B2
    level or higher).
  
  Additional Skills
  
  - GenAI
  
    We offer:
  
  - Statutory & Major benefits
  - Personal Growth
  - Competitive salary
  - Attractive benefits plan
  
