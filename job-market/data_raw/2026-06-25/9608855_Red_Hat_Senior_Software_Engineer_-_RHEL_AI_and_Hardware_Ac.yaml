description: |
  About the Job: The Red Hat Ecosystems Engineering group is
  seeking a Senior Software Engineer to join our growing team.
  In this role, you will work with a diverse team of highly
  motivated engineers on delivery of software tools and
  products to Red Hat’s partners and customers.  As a Senior
  Software Engineer, you will work closely with the Product
  Engineering and Product Management teams to ensure
  integration and feature development of high-quality,
  technically polished results.  You will write new software
  as required to build products and also develop tools to
  automate software deployments, upgrades, scaling,
  monitoring, alerting and testing.
  
  What you will do: Deliver continuous integration and feature
  enhancements in an agile framework producing automated test
  software packaged as RPMs and container images Test
  advancing Red Hat AI platforms utilizing pytorch, vLLM and
  performance monitoring tools, verifying acceleration via
  advanced GPUs and networking hardware. Research and
  collaborate on the integration and development certification
  policies with subject matter experts and product managers
  for advanced hardware systems and components supporting Red
  Hat AI platforms
  
  What you will bring:
  
  - 5+ years of relevant technical experience
  - Strong experience with RHEL or other Linux distributions
  - Practical understanding and experience in continuous
    integration and continuous delivery (CI/CD) pipelines
  - Practical development experience Python
  - Managing a production services with Red Hat OpenShift or
    Kubernetes
  - Experience with building and running containers
  - Technical leadership acumen in a global team environment
  - Experience in using AI tools to accelerate development and
    improve quality
  - Excellent written and verbal communication skills; fluent
    English language skills
  
  #LI-AK1
  
  About Red Hat
  
  Red Hat is the world’s leading provider of enterprise open
  source software solutions, using a community-powered
  approach to deliver high-performing Linux, cloud, container,
  and Kubernetes technologies. Spread across 40+ countries,
  our associates work flexibly across work environments, from
  in-office, to office-flex, to fully remote, depending on the
  requirements of their role. Red Hatters are encouraged to
  bring their best ideas, no matter their title or tenure.
  We're a leader in open source because of our open and
  inclusive environment. We hire creative, passionate people
  ready to contribute their ideas, help solve complex
  problems, and make an impact.
  
  Inclusion at Red Hat Red Hat’s culture is built on the open
  source principles of transparency, collaboration, and
  inclusion, where the best ideas can come from anywhere and
  anyone. When this is realized, it empowers people from
  different backgrounds, perspectives, and experiences to come
  together to share ideas, challenge the status quo, and drive
  innovation. Our aspiration is that everyone experiences this
  culture with equal opportunity and access, and that all
  voices are not only heard but also celebrated. We hope you
  will join our celebration, and we welcome and encourage
  applicants from all the beautiful dimensions that compose
  our global village.
  
