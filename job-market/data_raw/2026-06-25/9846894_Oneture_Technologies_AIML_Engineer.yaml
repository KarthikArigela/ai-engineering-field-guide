description: |
  About the role
  
  We are hiring a AI/ML Engineer. If you are self-driven
  individuals who love to find innovative solutions and can
  perform under pressure. If you are passionate about building
  large scale, high - performance, rich web applications. If
  you are curious and collaborative, excited about learning
  new technologies, have a demonstrated engineering mind,
  passionate about tackling the hard problems in technology,
  love to create and iterate on the products/platforms and
  tools of the future, and - Collaboratively partner with our
  clients to drive their success.
  
  At Oneture we are looking for people like you, you'll be a
  part of a growing team; you will work in small, multi-
  disciplinary, fast-moving teams that co-build new digital
  products, services, and experiences based on innovative
  ideas. You will play a critical role in building solutions
  from scratch, iterating quickly, and getting them
  client/market-ready.
  
  Responsibilities
  
  - Develop and deploy advanced AI solutions using the latest
    Generative AI techniques including:
  - Retrieval-Augmented Generation (RAG) pipelines.
  - Designing and building Agentic AI systems to automate
    complex decision-making workflows.
  - Fine-tuning Foundation and Small Language Models (SLMs)
    tailored for domain specific content generation.
  - Build scalable AI workflows, adhering to robust engineering
    and code quality standards.
  - Lead end-to-end AI solution development lifecycle — from
    prototyping and experimentation to deployment on cloud
    platforms (AWS, Azure, or GCP).
  - Collaborate closely with cross-functional global teams —
    financial analysts, technology architects, and client
    stakeholders — to translate business challenges into AI-
    driven solutions.
  - Continuously evaluate emerging AI technologies and research
    to keep our AI toolkit state-of-the-art.
  
  
  
  
  
  What We’re Looking For:
  
  - 2.5 to 4 years of experience in software
    engineering/development with a minimum 2 years
    specializing in AI/ML roles.
  - Deep hands-on expertise with GenAI technologies — RAG
    frameworks, agent-based AI design patterns, fine-tuning
    techniques for SLM.
  - Strong programming skills in Python with a focus on clean,
    maintainable, and performant code.
  - Proven experience deploying AI/ML solutions on cloud
    platforms (AWS, Azure, GCP) with familiarity in
    containerization, orchestration, and CI/CD pipelines.
  - Having a public Github code repository or Kaggle profile
    will be a big plus.
  - Solid understanding of data structures, algorithms, software
    design principles, and scalable system design.
  - Exposure to NLP, knowledge graphs, ML ops, or similar
    related areas is a big plus.
  - Decent communication skills to effectively collaborate
    across global teams and handle client interactions.
  - Self-driven, proactive mindset with a passion for problem-
    solving and innovation.
  
  
  
  Educational Background:
  
  - Bachelor’s or Master’s degree from leading Indian institutes
    / Universities in:
  - Computer Science, or
  - Any Engineering discipline, or
  - Mathematics or related quantitative fields.
  
  
  
  Mandatory Skills:
  
  - Gen AI, Python, ML Ops, RAG, Language Model
  
  About Oneture Technologies
  
  Founded in 2016, Oneture is a cloud-first, full-service
  digital solutions company, helping clients harness the power
  of Digital Technologies and Data to drive transformations
  and turning ideas into business realities.
  
  Our team is full of curious, full-stack, innovative thought
  leaders who are dedicated to providing outstanding customer
  experiences and building authentic relationships. We are
  compelled by our core values to drive transformational
  results from Ideas to Reality for clients across all company
  sizes, geographies, and industries. The Oneture team
  delivers full lifecycle solutions— from ideation,
  
  project inception, planning through deployment to ongoing
  support and maintenance.
  
  Our core competencies and technical expertise includes Cloud
  powered: Product Engineering, Big Data and AI ML. Our deep
  commitment to value creation for our clients and partners
  and “Startups-like agility with Enterprises-like maturity”
  philosophy has helped us establish long-term relationships
  with our clients and enabled us to build and manage mission-
  critical platforms for
  
  them.
