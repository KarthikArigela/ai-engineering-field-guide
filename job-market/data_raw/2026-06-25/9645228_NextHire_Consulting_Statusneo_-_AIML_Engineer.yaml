description: |
  Company - Statusneo
  
  Position -  AI / ML Engineer
  
  Location - Gurgaon and Bangalore
  
  We are seeking a highly skilled and innovative AI Data
  Engineer to join our Development team. In this role, you
  will design, develop, and deploy AI systems that can
  generate content, reason autonomously, and act as
  intelligent agents in dynamic environments. Key
  Responsibilities • Design and implement generative AI models
  (e.g., LLMs, diffusion models) for text, image, audio, or
  multimodal content generation. • Develop agentic AI systems
  capable of autonomous decision-making, planning, and tool
  use in complex environments. • Integrate AI agents with
  APIs, databases, and external tools to enable real-world
  task execution. • Fine-tune foundation models for domain-
  specific applications using techniques like RLHF, prompt
  engineering, and retrieval-augmented generation (RAG). •
  Collaborate with cross-functional teams including product,
  design, and engineering to bring AI-powered features to
  production. • Conduct research and stay up to date with the
  latest advancements in generative and agentic AI. • Ensure
  ethical, safe, and responsible AI development practices.
  Required Qualifications • Bachelor’s or Master’s degree in
  Computer Science, AI, Machine Learning, or a related field.
  • 3+ years of experience in machine learning, with a focus
  on generative models or autonomous agents. • Proficiency in
  Python and ML frameworks such as PyTorch • Experience with
  LLMs (e.g., GPT, Claude, LLaMA, Cortex), transformers, and
  diffusion models. • Familiarity with agent frameworks (e.g.,
  LangChain, AutoGPT, ReAct, OpenAgents). • Experience with
  AWS and Snowflake services • Prior Healthcare experience •
  Strong understanding of reinforcement learning, planning
  algorithms, and multi-agent systems. • Excellent problem-
  solving and communication skills.
  
