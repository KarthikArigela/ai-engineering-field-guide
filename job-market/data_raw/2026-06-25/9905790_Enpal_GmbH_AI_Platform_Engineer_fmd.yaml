description: |
  At Enpal, we are not just a company; we are a movement. As a
  leading European greentech unicorn, we are on a mission to
  make clean energy simple, accessible, and scalable for
  homeowners across the continent.
  
  Through solar panels, heat pumps, home batteries, and EV
  charging, we are redefining residential energy. With Enpal
  Energy, we are building Europe’s leading platform to manage
  and orchestrate millions of distributed energy assets —
  laying the foundation for the largest Virtual Power Plant
  (VPP) in Europe.
  
  Our vision: power Europe’s transition to a fully
  decentralized, intelligent, and clean energy system.
  
  Job Description
  
  As a Senior AI Platform Engineer, you will design and build
  the internal AI Engine that powers all AI capabilities
  across Enpal Energy. This is not about wrapping APIs — it is
  about building the core infrastructure that makes AI
  reliable, scalable, and production-grade.
  
  We are looking for a systems thinker with strong engineering
  fundamentals and a deep understanding of modern AI systems.
  You care about reliability, observability, and building
  platforms that enable other engineers to move fast with
  confidence.
  
  What you will do
  
  - Own the design and development of the internal AI platform
    powering all AI features.
  - Build a robust Agent Runtime to orchestrate complex AI
    workflows in production.
  - Design scalable backend services and developer-facing APIs
    for AI systems.
  - Build internal tooling for evaluation, observability,
    tracing, and debugging (latency, cost, quality,
    reliability).
  - Define standards for AI quality, including evaluation
    frameworks, versioning, and reproducibility.
  - Collaborate closely with product and engineering teams to
    enable fast, safe, and deterministic AI feature delivery.
  - Own CI/CD pipelines, infrastructure as code, and production
    readiness of AI systems.
  - Continuously improve performance, reliability, and cost
    efficiency.
  - Contribute to architectural decisions shaping the long-term
    AI strategy.
  
  Qualifications
  
  - 5–7+ years of software engineering experience (mid to senior
    level).
  - Strong background in backend systems, platform engineering,
    or internal developer platforms.
  - Strong proficiency in TypeScript and Node.js (JavaScript
    ecosystem).
  - Solid understanding of modern AI system design, including
    agentic architectures vs. chains, tool use and function
    calling, and orchestration patterns.
  - Experience in LLM APIs (e.g. OpenAI, Anthropic, DeepSeek)
    and AI infrastructure.
  - Experience building observability, logging, tracing, and
    evaluation systems.
  - Strong focus on reliability, determinism, and production-
    grade engineering.
  - Experience building APIs and integrating complex systems.
  - Familiarity with CI/CD tools (GitHub Actions, Azure DevOps,
    or similar).
  - Strong commitment to clean, testable, and scalable code.
  - (Senior level) Experience mentoring engineers and driving
    technical decisions.
  
  Additional Information
  
  - Join Germany’s leading green unicorn and help shape the
    energy transition.
  - Work in a diverse team of 65+ nationalities united by one
    mission.
  - Hybrid work model: office or remote — your choice.
  - Our Berlin HQ offers a fully equipped startup environment
    (rooftop, gym, lounges, events).
  - Structured onboarding, including a welcome session with our
    founder.
  - Regular company updates, technical deep dives, and knowledge
    sharing sessions.
  - Strong team culture, ownership mindset, and frequent team
    events.
  - A strong feedback culture that values continuous
    improvement.
  
  At Enpal, diversity and inclusion are core values. Hiring
  decisions are made without discrimination of any kind.
