description: |
  Company Description
  
  👋🏼We're Nagarro.
  
  We are a Digital Product Engineering company that is scaling
  in a big way! We build products, services, and experiences
  that inspire, excite, and delight. We work at a scale —
  across all devices and digital mediums, and our people exist
  everywhere in the world (18500+ experts across 40 countries,
  to be exact). Our work culture is dynamic and non-
  hierarchical. We are looking for great new colleagues. That
  is where you come in!
  
  
  
  Job Description
  
  Requirements
  
  - Experience: 16+years
  - Relevant experience in software engineering and enterprise
    solution architecture.
  - Strong expertise in designing and developing enterprise
    technology solutions across multiple platforms,
    programming languages, and technology stacks.
  - Hands-on experience with cloud platforms such as Azure, AWS,
    or Google Cloud Platform.
  - Strong knowledge of Data Engineering, Artificial
    Intelligence, Machine Learning, and Generative AI
    technologies.
  - Experience designing scalable, secure, and high-performance
    enterprise architectures.
  - Ability to conceptualize innovative technology solutions by
    combining emerging technologies with business and industry
    needs.
  - Strong understanding of software architecture, system
    integration, scalability, security, and engineering best
    practices.
  - Proven experience leading complex technology engagements and
    delivering enterprise solutions for global clients.
  - Ability to remain hands-on with modern programming
    languages, frameworks, and emerging technologies when
    required.
  - Strong consulting, stakeholder management, and client
    engagement skills with the ability to influence technology
    and digital transformation strategies.
  - Experience managing multiple technology initiatives
    simultaneously within globally distributed teams.
  - Excellent analytical, problem-solving, and decision-making
    capabilities.
  - Demonstrated thought leadership through blogs, whitepapers,
    technical presentations, conference speaking, or industry
    forums.
  - Excellent verbal and written communication skills with the
    ability to present complex technical concepts to both
    technical and business audiences.
  
  Responsibilities
  
  - Define and drive the overall technology vision,
    architecture, and roadmap for enterprise projects and
    client engagements.
  - Own the technology health of assigned projects and accounts
    by ensuring architectural quality, scalability, security,
    governance, and engineering excellence.
  - Develop and execute both short-term and long-term technology
    strategies aligned with business objectives.
  - Design innovative cloud-native, data-driven, and Generative
    AI-enabled enterprise solutions.
  - Evaluate emerging technologies and identify opportunities to
    leverage Cloud, Data, AI, and Generative AI to solve
    business challenges.
  - Lead architecture design, technical solutioning, and
    implementation strategies for complex enterprise
    applications.
  - Collaborate with cross-functional teams to develop cutting-
    edge technology solutions and reusable architectural
    assets.
  - Provide technical leadership by participating in hands-on
    development, proof-of-concepts, and complex technical
    implementations when required.
  - Establish and enforce architecture standards, governance
    frameworks, coding standards, and best engineering
    practices.
  - Conduct architecture reviews, technical assessments, and
    solution validation to ensure quality and compliance.
  - Influence client technology strategy through workshops,
    consulting engagements, solution presentations, and
    executive-level discussions.
  - Identify opportunities to expand existing engagements
    through technology consulting, innovation, and AI-enabled
    offerings.
  - Drive adoption of organizational technology initiatives,
    frameworks, accelerators, and best practices across
    projects.
  - Mentor architects, technical leads, and engineering teams
    through coaching, knowledge sharing, and continuous
    feedback.
  - Build strong relationships with clients and internal
    stakeholders while serving as a trusted technology advisor
    throughout the project lifecycle.
  
  Qualifications
  
  Bachelor’s or master’s degree in computer science,
  Information Technology, or a related field.
