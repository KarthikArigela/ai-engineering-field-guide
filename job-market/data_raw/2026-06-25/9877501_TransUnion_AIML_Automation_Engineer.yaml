description: |
  TransUnion's Job Applicant Privacy Notice
  
  Team Overview
  
  This role offers the opportunity to work on complex,
  high‑impact programs, combining technical problem‑solving
  with client and business interaction. You will design and
  execute advanced test plans, analyze data to ensure accuracy
  and integrity, and independently resolve system or
  processing issues to guarantee high‑quality delivery. You
  will act as a trusted advisor to business users and clients,
  contribute to solution design for medium to high‑complexity
  programs, and play a key role in driving continuous
  improvement and change across operations. This position is
  ideal for someone who enjoys ownership, collaboration, and
  making a tangible impact on both systems and customer
  outcomes.
  
  This is a hybrid position and involves regular performance
  of job responsibilities virtually as well as in-person at an
  assigned TU office location for a minimum of two days a
  week.
  
  Role Overview And Core Responsibilities
  
  - Bachelors (4 year) degree in statistics, applied
    mathematics, financial mathematics, engineering,
    operations research, or another highly quantitative field.
  - At least four (4) years of professional experience
    performing analytic work in AI / ML roles
  - Strong analytical, critical thinking, and creative problem-
    solving skills
  - Advanced programming skills; proficiency with a statistical
    language such as R/Python; experience using other
    programming and data manipulation languages preferred
    (SQL, Hive, Pig, Python, C/C++, Java); high level of
    familiarity with Microsoft Office tools
  - Experience in ML model productionization
  - Hands-on exposure to LLMs, prompt engineering, agents, and
    RAG
  - Experience working with Google Cloud Platform (GCP) and GCP
    services such as Vertex AI and Cloud Run
  - Experience integrating with Java/C++/.NET systems
  - Strong problem-solving and communication skills
  - Versatile interpersonal and communication style with the
    ability to effectively communicate at multiple levels
    within and outside the organization; ability to work in a
    collaborative, fast-paced environment
  - Strong project management skills with the ability to manage
    multiple assignments effectively
  - Master's or PhD degree in statistics, applied mathematics,
    financial mathematics, engineering, operations research,
    or another highly quantitative field.  And, at least two
    (2) years of professional experience performing advanced
    analytic work in Financial Services, consumer credit, or a
    related industry
  - Familiarity with credit bureau data and business practices
  - Experience in risk, fraud, or decisioning systems
  - Familiarity with Ollama, LangChain, LlamaIndex, Semantic
    Kernel
  - Experience with MLOps tools
  - Operates independently in a complex and dynamic, matrixed
    environment
  - Experienced working in a company with a global presence
  - Experience with modern "big data" frameworks (Hadoop, Spark,
    cloud)
  
  Required Knowledge And Experiences
  
  - In this position you are responsible for supporting the
    development of deployment and automation framework of
    credit risk models and business intelligence analytic
    solutions through consulting engagements and research
    serving TransUnion’s clients.
  - You will partner with internal and external cross-functional
    teams to translate analytics models into production
    systems
  - You will design and write programs for data extraction,
    pipeline set-up and statistical analysis on large
    population datasets using languages such as R, Python,
    SQL, Hive, and Spark on server and cloud based computing
    platforms.
  - You will Build AI automation workflows using LLMs & create
    APIs for enterprise integration to deliver analytic
    solutions for internal and external customers.
  - You will identify strategies and opportunities to optimize
    systems for scalability and cost to deliver and adopt
    TransUnion’s analytic products and services.
  - You will drive AI adoption and innovation to foster a high
    performance culture and cultivate an environment that
    promotes excellence and reflects the TransUnion brand.
  
  TransUnion Overview:
  
  At TransUnion, we encourage and are committed to creating a
  real, positive impact and shared sense of purpose within our
  Workforce for Good, which empowers our people to grow,
  innovate and contribute to a better future for our
  communities and customers. We strive to build an environment
  where our associates are in the driver’s seat of their
  professional development— while having access to help along
  the way. We recognize that success comes when our associates
  thrive both professionally and personally; that’s why we
  prioritize work/life flexibility and offer resources for our
  teams across the globe to collaborate and drive excellence.
  
  Be a part of our Workforce for Good – you’ll work with great
  people, pioneering products and cutting-edge technology.
  
