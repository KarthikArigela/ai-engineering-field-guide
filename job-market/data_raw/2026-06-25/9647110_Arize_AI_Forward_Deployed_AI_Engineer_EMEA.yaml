description: |
  About Arize
  
  AI is rapidly transforming the world. As generative AI
  reshapes industries, teams need powerful ways to monitor,
  troubleshoot, and optimize their AI systems. That’s where we
  come in. Arize AI is the leading AI & Agent Engineering
  observability and evaluation platform, empowering AI
  engineers to ship high-performing, reliable agents and
  applications. From first prototype to production scale,
  Arize AX unifies build, test, and run in a single
  workspace—so teams can ship faster with confidence.
  
  We’re a Series C company backed by top-tier investors, with
  over $135M in funding and a rapidly growing customer base of
  150+ leading enterprises and Fortune 500 companies.
  Customers like Booking.com, Uber, Siemens, and PepsiCo
  leverage Arize to deliver AI that works.
  
  The Opportunity
  
  We are seeking an experienced Forward Deployed AI Engineer
  to work directly with client engineering teams, manage
  multiple concurrent projects, and drive technical solutions
  that extend beyond our core platform offering. This is a
  client-facing, hands-on technical role that combines deep AI
  expertise with business acumen to deliver results on tight
  timelines while building lasting client relationships. While
  we are a remote-first company, we are prioritizing
  candidates currently based in the London metro area.
  
  What You’ll Do
  
  - Partner directly with enterprise AI teams to design,
    implement, and scale production-grade GenAI observability
    and evaluation programs.
  - Lead technical discussions with customer stakeholders
    ranging from engineers to senior executives, translating
    business priorities into scalable technical solutions.
  - Build custom integrations, tooling, and workflows that
    extend the Arize platform to meet customer-specific
    requirements.
  - Manage multiple concurrent customer engagements, driving
    projects from scoping through delivery while maintaining a
    high bar for technical execution and customer experience.
  - Collaborate cross-functionally with Sales, CS, Product, and
    Engineering teams to shape implementation strategy,
    influence product direction, and expand customer impact.
  - Help define and scale best practices, technical playbooks,
    and delivery methodologies for the growing Forward
    Deployed Engineering team.
  
  What We’re Looking For
  
  - Software Development: 2-5 years of hands-on software
    development experience with strong technical foundations.
    We work extensively in Python, Java, and TypeScript, and
    expect candidates to be comfortable working in at least
    two of those languages.
  - ML/AI Engineering: Experience building MLOps pipelines
    and/or developing, deploying, and iterating on Generative
    AI applications in production environments..
  - Cloud Technologies: Experience working with public cloud
    platforms (e.g., AWS, GCP, Azure) as well as
    containerization and orchestration technologies (e.g.,
    Docker and Kubernetes).
  - Communication: Excellent communication skills with the
    ability to work effectively across both technical and
    business audiences. You should be comfortable engaging
    with senior executives on business outcomes and metrics,
    collaborating with engineers on technical implementation
    details, and translating seamlessly between the two.
  - Project Management: Proven ability to manage multiple client
    engineering engagements simultaneously and deliver high-
    quality technical outcomes under demanding timelines.
  - Adaptability: Comfortable operating in fast-paced startup or
    consulting environments, with the ability to navigate
    diverse client organizations, technical stacks, and
    evolving priorities.
  - Passion for AI: We live and breathe AI at Arize. The
    strongest candidates are genuinely excited about the space
    and energized by staying at the forefront of rapidly
    evolving AI technologies.
  
  The estimated annual salary and variable compensation for
  this role is between $125,000 - $175,000 USD, plus a
  competitive equity package. Actual compensation is
  determined based upon a variety of job related factors that
  may include: transferable work experience, skill sets, and
  qualifications. Total compensation also includes a
  comprehensive benefit package.
  
  While we are a remote-first company, we have opened offices
  in New York City and the San Francisco Bay Area, as an
  option for those in those cities who wish to work in-person.
  For all other employees, there is a WFH monthly stipend to
  pay for co-working spaces.
  
  More About Arize
  
  Arize’s mission is to make the world’s AI work—and work for
  people. Our founders came together through a shared
  frustration: while investments in AI are growing rapidly
  across every industry, organizations face a critical
  challenge—understanding whether AI is performing and how to
  improve it at scale.
  
  Learn more about what we're doing here:
  
  https://techcrunch.com/2025/02/20/arize-ai-hopes-it-has-
  first-mover-advantage-in-ai-observability/
  
  https://arize.com/blog/arize-ai-raises-70m-series-c-to-
  build-the-gold-standard-for-ai-evaluation-observability/
  
  Diversity & Inclusion @ Arize
  
  Our company's mission is to make AI work and make AI work
  for the people, we hope to make an impact in bias industry-
  wide and that's a big motivator for people who work here. We
  actively hope that individuals contribute to a good culture
  
  - Regularly have chats with industry experts, researchers, and
    ethicists across the ecosystem to advance the use of
    responsible AI
  - Culturally conscious events such as LGBTQ trivia during
    pride month
  - We have an active Lady Arizers subgroup
