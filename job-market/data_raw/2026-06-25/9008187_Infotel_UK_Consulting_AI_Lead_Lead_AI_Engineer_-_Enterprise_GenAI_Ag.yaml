  frameworks for AI deployment across various domains.
  
  AI Lead / Lead AI Engineer – Enterprise GenAI & Agentic AI
  
  **Location:** Chennai, India
  
  **Experience:** 8–15 Years
  
  **Employment Type:** Full-Time
  
  About the Role
  
  We are seeking an experienced AI Lead to drive the
  architecture, design and delivery of enterprise-scale AI and
  Generative AI solutions. This role requires strong technical
  leadership combined with deep hands-on expertise in LLMs,
  Agentic AI, RAG architectures, cloud-native AI systems and
  scalable AI engineering practices.
  
  The ideal candidate will lead AI initiatives, mentor
  engineering teams, define AI architecture standards and
  collaborate with business stakeholders to deliver measurable
  enterprise value through AI transformation.
  
  Key Responsibilities
  
  - Lead architecture and implementation of enterprise AI
    platforms and GenAI solutions
  
  - Design scalable AI systems involving:
  
    - Data pipeline
  
    - LLM applications
  
    - RAG pipelines
  
    - AI agents and orchestration frameworks
  
    - Multi-agent systems
  
    - AI automation workflows
  
  - Define AI engineering standards, best practices and reusable
    frameworks
  
  - Lead end-to-end AI delivery from discovery to production
    deployment
  
  - Mentor AI engineers and conduct technical reviews
  
  - Drive AI solution architecture discussions with customers
    and stakeholders
  
  - Establish governance, security and responsible AI practices
  
  - Collaborate with cloud, DevOps, data engineering and
    application teams
  
  - Optimize AI system performance, scalability, observability
    and operational efficiency
  
  - Evaluate emerging AI technologies and define enterprise
    adoption strategies
  
  - Support pre-sales, solutioning and innovation initiatives
  
