  Interview Process: • L1 – Virtual Interview • L2 – Face-to-
  Face Interview (Mandatory)
  
  Role Overview: The Senior AI / ML Ops Engineer will play a
  critical role in designing, deploying, and operating Agentic
  AI solutions within a highly critical production
  environment. The candidate will bridge AI engineering and
  production operations to ensure AI-driven automation is
  secure, scalable, reliable, and production-ready.
  
  Key Responsibilities: ✅ Design and develop Agentic AI
  systems using LangChain, LangGraph, LangSmith, or similar
  frameworks.
  
  ✅ Build reasoning, planning, orchestration, and decision-
  making capabilities for AI-driven production automation.
  
  ✅ Integrate AI agents with observability platforms such as
  Dynatrace, monitoring tools, logs, metrics, and tracing
  systems.
  
  ✅ Implement AI/ML Ops practices, CI/CD pipelines, lifecycle
  management, and automation workflows.
  
  ✅ Define approval workflows, rollback mechanisms,
  safeguards, and Human-in-the-Loop controls for production
  environments.
  
  ✅ Ensure compliance with security, governance, auditability,
  and reliability standards.
  
  ✅ Collaborate with SRE, Operations, DevOps, Platform
  Engineering, and Architecture teams to industrialize AIOps
  initiatives.
  
  Requirements
  
  Required Skills:
  
  • Strong Python Development
  
  • LangChain / LangGraph / LangSmith
  
  • Agentic AI & Generative AI Concepts
  
  • MLOps / AIOps
  
  • API Integrations
  
  • CI/CD & DevOps
  
  • Dynatrace / Observability Platforms
  
  • SRE / Production Operations
  
  • Incident, Problem & Change Management
  
  • Production Automation & Governance Important Note: 📌
  Candidates from other locations who are willing to relocate
  to Chennai may also apply.
  
