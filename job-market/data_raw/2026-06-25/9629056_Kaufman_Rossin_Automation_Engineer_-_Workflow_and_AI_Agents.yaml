description: |
  Why We Stand Out
  
  Seeking a new challenge where your professional and personal
  aspirations are not only possible but supported? Kaufman
  Rossin might be just the place for you!
  
  Kaufman Rossin Professional Services Private Limited’s (the
  “Company”) offices are located in the World Trade Center
  (WTC) in Bangalore, Karnataka, India, and at Udyog Vihar, in
  Gurgaon, Haryana, India.
  
  The Bangalore office provides a range of services, including
  risk management, corporate governance, tax, assurance, and
  family office services. Out of the Gurgaon office, we render
  highly specialized back-office alternative investment
  services for global hedge funds and related fund types. As
  one of the top accounting firms in the US, our foundation is
  “people first”. In the words of James Kaufman, one of our
  founders, “We prioritize our people, their development, and
  their well-being. Our values are translated into action
  every day."
  
  Kaufman Rossin, headquartered in Miami, Florida has been
  celebrated as the Best Place to Work in South Florida more
  than a dozen time. The firm has grown to over 700 employees,
  with offices spanning the tri-county area and, sister
  entities, Kaufman Rossin Wealth and Kaufman Rossin
  Alternative Investment Services.
  
  The Firm is ranked 49th among the top 100 firms in the US by
  Inside Public Accounting 2023. Internationally, the Firm has
  offices in Bangalore and Haryana in India and the Ivory
  Coast in Africa.
  
  Think you have what it takes?
  
  We are seeking a creative and technically skilled Automation
  Engineer to join our small, focused Business Intelligence
  and Automation team. This role is perfect for someone who
  loves solving problems through automation, is excited about
  AI technologies, and thrives in an environment where they
  can make a direct impact on business efficiency.
  
  As our Automation Engineer, you'll build and maintain
  workflow automations using workflow orchestration platforms
  (n8n, Azure Logic Apps or similar), develop AI agents to
  streamline processes, and integrate various enterprise
  platforms through APIs. You'll have the autonomy to design
  solutions end-to-end, explore cutting-edge AI technologies,
  and help shape our automation strategy as we continue to
  scale.
  
  How You’ll Contribute:
  
  Workflow Automation & Development
  
  - Design, build, and maintain automated workflows using
    workflow orchestration platforms for data synchronization,
    alerts, and business process automation
  - Develop and deploy AI agents for various use cases including
    data processing, content generation, decision-making, and
    task automation
  - Create internal process automations that improve team
    efficiency and data quality
  - Implement complex multi-step workflows with conditional
    logic
  - Monitor and optimize existing workflows to ensure
    reliability, performance, and proper error handling
  - Troubleshoot and resolve automation issues quickly and
    effectively
  
  API Integration & Platform Connectivity
  
  - Build and maintain API integrations connecting Salesforce,
    Azure, Domo, and other enterprise platforms
  - Work with REST APIs, webhooks, OAuth, and various
    authentication protocols to enable seamless data flow
    between systems
  - Write custom scripts (Python/JavaScript) when low-code tools
    aren't sufficient for complex requirements
  - Collaborate with the Application Developer to ensure smooth
    integration between custom apps and automated workflows
  - Handle JSON, XML, and other data formats for parsing and
    transformation
  - Research and implement new automation opportunities across
    different platforms
  
  AI & Innovation
  
  - Integrate LLM APIs (OpenAI, Anthropic Claude, etc.) into
    workflows and agents
  - Build AI-powered automations that can make intelligent
    decisions based on data
  - Leverage AI coding assistants to accelerate development and
    problem-solving
  - Stay current with emerging AI and automation technologies
  - Experiment with new automation frameworks and tools to
    improve capabilities
  - Bring creative, AI-powered solutions to business challenges
  
  Documentation & Collaboration
  
  - Create and maintain comprehensive documentation for all
    workflows and automations
  - Document API integrations, authentication methods, error
    handling, and retry logic
  - Collaborate with business stakeholders to understand
    automation requirements
  - Share knowledge and best practices with the team
  
  Requirements
  
  What Skills You’ll Bring:
  
  Education
  
  - Bachelor's degree in Computer Science, Information
    Technology, or related technical field
  - Exceptional candidates with proven experience but without a
    degree will be considered
  
  Experience
  
  - 3-6 years of professional experience in automation,
    integration, workflow engineering, or software development
  - Strong experience with workflow automation tools (n8n,
    Zapier, Make/Integromat, Power Automate, or similar
    platforms)
  - Hands-on experience building API integrations and working
    with REST APIs, webhooks, and authentication protocols
  - Experience with at least one scripting/programming language
    (Python, JavaScript, or similar)
  - Demonstrated ability to work independently and own projects
    from conception to deployment
  
  Technical Skills
  
  - Understanding of automation best practices, design patterns,
    and workflow logic
  - Experience with data transformation, ETL processes, and data
    flows
  - Proficiency with JSON and other data formats for parsing and
    manipulation
  - Ability to debug complex integration issues and troubleshoot
    API connections
  - Comfortable reading API documentation and implementing
    integrations
  - Knowledge of version control and deployment processes
  - Strong problem-solving skills and attention to detail
  - Experience implementing error handling and retry logic in
    automated workflows
  
  Soft Skills
  
  - You'll be the automation expert with minimal technical
    oversight
  - Find innovative ways to automate manual processes
  - Work effectively with a small team and explain technical
    concepts clearly
  - Genuinely excited about AI, new automation tools, and
    emerging technologies
  - Comfortable with ambiguity and evolving requirements in a
    fast-paced environment
  
  Preferred Qualifications
  
  - Hands-on experience with n8n specifically (or willingness to
    demonstrate n8n skills during interview process)
  - Experience building or working with AI agents, LLM
    integrations, or agentic workflows
  - Participation in the n8n community or contributions to
    workflow automation communities
  - Familiarity with Salesforce APIs and Salesforce automation
    tools (Flow, Process Builder, or API integration)
  - Knowledge of Azure services (Logic Apps, Functions,
    Automation Accounts, or similar)
  - Experience with Domo or other BI/analytics platforms
  - Previous work on customer-facing automations or external
    integrations
  - Understanding of business process optimization and workflow
    design
  - Experience using AI coding assistants (GitHub Copilot,
    ChatGPT, Cursor, etc.) to accelerate development
  - Portfolio of automation workflows or integration projects
    you've built
  
  Benefits
  
  - Work-Life Balance
  
  - People First Company
  - Hybrid work policy
  - Working directly with peers in the US
  
  We embrace authenticity. Kaufman Rossin is an equal-
  opportunity employer. We are committed to creating a culture
  that reflects the diversity of our firm and clients. We
  encourage understanding, acceptance, and celebration among
  all people. That includes lifestyle, education, experience,
  race, ethnicity, age, religion, physical ability, sexual
  orientation, and gender identity. Differences make unique
  varieties.
  
  Benefits
