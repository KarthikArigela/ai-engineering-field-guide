description: |
  3Pillar is an AI transformation partner on a mission to help
  enterprises build the AI-native products and intelligent
  agents that will define the next era of business. With teams
  across North America, Europe, Latin America, and Asia, we
  work with the most ambitious companies in financial
  services, healthcare, media, and technology — helping them
  move faster, modernize boldly, and compete on their own
  terms. Our HelixAI platform and Helix Pods delivery model
  put our engineers at the center of real agentic
  transformation — doing work that is open, portable, and
  built to last. We are building the future of enterprise AI
  
  
  
  We are looking Lead Data Engineer to build, operate, and
  continuously improve the data pipelines, retrieval
  infrastructure, and ML/LLMOps foundations that power our AI
  initiatives. The resource will work on turning reference
  architectures and data contracts into robust, production-
  grade implementations that serve conversational AI
  assistants, dashboard copilots, autonomous agents, RAG
  applications, and predictive ML models.
  
  Key Responsibilities:
  
  Qualifications:
  
  - 7+ years data engineering using Cloud services
  - 2+ years production AI/ML or LLM-era data infrastructure.
    Proven experience building production pipelines at scale —
    batch and streaming, Snowflake,AWS/Azure.
  - Deep expertise: Python, PySpark, Snowflake, Delta Lake,
    Kafka, Spark Structured Streaming.
  - Hands-on with vector stores, embedding pipelines, and
    retrieval infrastructure in production RAG environments.
  - Working knowledge of MLOps: MLflow, CI/CD for AI, automated
    evaluation, and production monitoring.
  - Strong grounding in data governance, quality frameworks, and
    compliance-aligned engineering.
  - Primary skills: Python, SQL, PySpark, Kafka,
    Snowflake/DataBricks, Delta Lake, AWS (S3, Glue, Kinesis,
    EKS, Redshift), Docker, Kubernetes, GitHub Actions.
  - Secondary Skills: LangChain, LlamaIndex, LLM APIs (OpenAI,
    Bedrock, Claude, HuggingFace), Pinecone, FAISS, ChromaDB,
    OpenSearch, MLflow, FastAPI, Neo4j,  LangGraph, prompt
    engineering, RLHF dataset prep, LLM fine-tuning workflows
  
  What It's Like to Work at 3Pillar:
  
