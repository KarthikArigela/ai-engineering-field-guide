description: |
  QA Engineer with strong expertise in manual testing and test
  automation.
  
  Responsibilities:
  
  - Design, develop, and execute test plans, test cases, and
    test scenarios for web, salesforce, and enterprise
    applications.
  - Perform functional, regression, integration, and end-to-end
    testing.
  - Develop and maintain automation test scripts using
    Playwright.
  - Collaborate closely with developers, product managers, and
    program managers to ensure quality throughout the
    development lifecycle.
  - Identify, log, track, and validate defects using defect
    management tools.
  - Participate in test strategy planning and quality
    improvement initiatives.
  - Contribute to building and maintaining automation frameworks
    and reusable test utilities.
  - Support CI/CD pipelines by integrating automated tests into
    the build process.
  - Ensure high test coverage and reliable automation suites.
  - Mentor junior QA engineers and promote best practices in
    quality engineering.
  
  Requirements
  
  - Bachelor's degree in Computer Science, Information
    Technology, Engineering, or a related field
  - 3-5 years of experience in Software Quality Assurance
  - Strong experience in Manual Testing
  - Hands-on experience in Automation Testing using Playwright
  - Prior experience with testing AI applications.
  - Strong programming skills in:
  - Experience testing web applications and APIs
  - Experience with Playwright-based automation frameworks
  - Knowledge of CI/CD tools (Jenkins, GitHub Actions, GitLab,
    etc.)
  - Experience with performance or security testing is a plus.
  - Exposure to cloud platforms (AWS/Azure/GCP)
  - Good understanding of SDLC, STLC, and Agile methodologies
  - Experience with test management and defect tracking tools
    (JIRA, TestRail, etc.)
  - Experience with API testing tools (Postman, RestAssured,
    etc.)
  - Experience working closely with developers, product
    managers, and program managers
  - Experience mentoring junior QA engineers
  - Professional proficiency in English
  
  
  
  Benefits
  
  Exciting Projects: We focus on industries like High-Tech,
  communication, media, healthcare, retail and telecom. Our
  customer list is full of fantastic global brands and leaders
  who love what we build for them.
  
  Collaborative Environment: You Can expand your skills by
  collaborating with a diverse team of highly talented people
  in an open, laidback environment — or even abroad in one of
  our global centres.
  
  Work-Life Balance: Accellor prioritizes work-life balance,
  which is why we offer flexible work schedules, paid time off
  and holidays.
  
  Professional Development: Our dedicated Learning &
  Development team regularly organizes Communication skills
  training, Stress Management program, professional
  certifications, and technical and soft skill trainings.
  
  Excellent Benefits: We provide our employees with family
  medical insurance, Personal Accident Insurance, Periodic
  health awareness program, extended maternity leave, annual
  performance bonuses, and referral bonuses.
  
