description: |
  About Juniper Square
  
  Private markets are one of the largest, most complex, and
  most underserved corners of global finance. Our mission at
  Juniper Square is to unlock their full potential. We’re the
  Operations Partner trusted by 2,300+ GPs, unifying
  technology, data, and fund administration services into a
  single platform that helps GPs move faster, make better
  decisions, and scale with precision. With $300B+ under
  administration and 700,000+ LPs on platform, we’ve built the
  scale to match our ambition. And with JunieAI, our purpose-
  built AI platform, we’re reimagining how private markets
  operate, embedding intelligence across every workflow.
  Founder-led since 2014, backed by $350M+ in funding, and now
  1,000+ employees strong, we’re building a company designed
  to shape the future of private markets for decades to come.
  
  Our culture is built for people who want to do ambitious,
  meaningful work alongside exceptionally talented teammates.
  We think like owners, move with urgency, and take pride in
  solving hard problems that truly matter to our customers and
  the future of private markets. We believe the best ideas
  come from open debate, deep collaboration, and diverse
  perspectives, which is why we believe transparency is the
  default and feedback makes us stronger. If you’re energized
  by high standards, rapid growth, and the opportunity to help
  define a category at a pivotal moment, come join us!
  
  Juniper Square offers employees a variety of ways to work,
  ranging from a fully remote experience to working full-time
  in one of our physical offices. We invest heavily in
  digital-first operations, allowing our teams to collaborate
  effectively across 27 U.S. states, 2 Canadian Provinces,
  India, Luxembourg, and England. We also have physical
  offices in San Francisco, New York City, Mumbai and
  Bangalore for employees who prefer to work in an office some
  or all of the time.
  
  About your role
  
  We're hiring Senior Software Engineers to join our AI-native
  engineering team. You'll design, build, and operate
  production AI systems - including AI platform capabilities,
  agentic workflow infrastructure, and LLM-powered features
  that serve institutional financial clients. This is a hands-
  on individual contributor role for engineers who are deeply
  fluent in AI-native development and want to work at the
  intersection of applied AI and backend systems engineering.
  
  What you'll do
  
  Build and Operate AI Systems
  
  • Design, build, and ship production-quality backend
  services, APIs, and AI platform components used across
  multiple engineering teams
  
  • Build and integrate LLM-powered systems such as RAG
  pipelines, AI SDKs, evaluation workflows, guardrails,
  prompt/tool orchestration, and model observability
  
  • Improve the reliability, scalability, observability, and
  operational quality of production AI systems
  
  • Build internal tools, frameworks, automation, and
  documentation that improve developer productivity and AI
  capabilities
  
  • Participate in code reviews, design reviews, debugging,
  incident response, and operational support
  
  Drive Technical Excellence
  
  • Contribute to technical design for complex projects,
  including evaluating tradeoffs and proposing pragmatic
  implementation plans
  
  • Partner with product, design, and engineering teams to
  translate platform needs into well-designed technical
  solutions
  
  • Help identify and reduce technical debt, reliability
  risks, and friction in the software development lifecycle
  
  • Collaborate with Staff and senior engineers to establish
  reusable patterns and raise engineering standards
  
  Build with AI-Native Practices
  
  • Use agentic coding tools and LLM-assisted development as a
  primary part of your workflow — this is how the entire team
  operates
  
  • Critically evaluate AI-generated code for correctness,
  edge cases, and regressions — shipping quality output
  regardless of how it was produced
  
  • Contribute to the team's evolving practices around AI-
  accelerated development and testing
  
  Qualifications
  
  Required
  
  • 5+ years of experience designing, building, and operating
  production software systems
  
  • Strong backend engineering experience with Python
  frameworks such as FastAPI, Flask, or Django
  
  • Experience building or integrating AI/LLM-powered systems
  in production - such as RAG pipelines, AI SDKs, evaluation
  workflows, guardrails, or agentic workflows
  
  • Experience with relational/NoSQL databases, including
  schema design, query optimization, and data modeling
  
  • Experience with cloud-native technologies such as AWS,
  Docker, and Kubernetes
  
  • Strong understanding of CI/CD, observability, and
  operating services in production
  
  • Ability to break down complex technical problems and
  deliver pragmatic, maintainable solutions
  
  • Strong ownership mindset, with the ability to drive
  projects independently while collaborating effectively
  
  • Clear communication skills and the ability to explain
  technical tradeoffs to engineering and cross-functional
  partners
  
  • Hands-on experience with AI-native development tools
  (e.g., Cursor, Augment); demonstrated ability to embed AI-
  driven practices to accelerate velocity and code quality
  
  • Ability to critically evaluate AI-generated code and
  outputs, including identifying failure modes, regressions,
  and edge cases
  
  Preferred
  
  • Experience with document processing pipelines, structured
  extraction from unstructured documents, or vector stores
  
  • Familiarity with evaluation frameworks for LLM output
  quality (e.g., RAGAS, custom evals, human-in-the-loop
  review)
  
  • Background in financial services or fintech
  
  Compensation
  
  Compensation for this position includes a base salary,
  equity, and a variety of benefits. The U.S. base salary
  range for this role is $185,000 – $225,000 USD. Actual base
  salaries will be based on candidate-specific factors,
  including experience, skillset, and location, and local
  minimum pay requirements as applicable.
  
  Benefits include:
  
  • Health, dental, and vision care for you and your family
  
  • Life insurance
  
  • Mental wellness coverage
  
  • Fertility and growing family support
  
  • Flex Time Off in addition to company-paid holidays
  
  • Paid family leave, medical leave, and bereavement leave
  policies
  
  • Retirement saving plans
  
  • Allowance to customize your work and technology setup at
  home
  
  • Annual professional development stipend
  
  Your recruiter can provide additional details about
  compensation and benefits.
