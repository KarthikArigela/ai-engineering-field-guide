description: |
  Epicor's Retail Propello platform is a cloud-based retail
  solution that supports modern retail operations through
  scalable and intelligent experiences. We are looking for a
  Senior QA Engineer to drive quality engineering initiatives
  across cloud-native web applications, leveraging automation,
  AI-enabled testing, and best-in-class QA practices.This role
  is ideal for a quality-focused professional who enjoys
  solving complex challenges, improving release confidence,
  and collaborating with cross-functional teams to deliver
  high-quality software. Experience in Retail ERP solutions
  and AI-driven Quality Engineering will be a strong
  advantage.What You'll Do:
  
  - Develop and execute test strategies, test plans, test cases,
    and automation suites.
  - Drive quality across functional, regression, integration,
    UI, API, exploratory, and end-to-end testing.
  - Design, enhance, and maintain scalable automation
    frameworks.
  - Apply AI-powered testing techniques to improve test
    coverage, defect detection, test optimization, and quality
    insights.
  - Validate frontend, backend, API, and cloud-based application
    workflows.
  - Partner with Product Management, Engineering, and DevOps
    teams to ensure high-quality releases.
  - Participate in requirements reviews, sprint planning, and
    design discussions, providing a quality-focused
    perspective.
  - Track quality metrics, release readiness, and automation
    effectiveness.
  - Mentor team members and promote best practices in quality
    engineering and automation.
  
  What You Bring:
  
  - Bachelor's degree in computer science, Engineering,
    Information Technology, or equivalent experience.
  - 5+ years of Quality Assurance / Quality Engineering
    experience.
  - 3+ years of hands-on automation testing experience.
  - Strong experience testing cloud-based web applications.
  - Experience driving both manual and automation-led testing
    initiatives.
  
  Technical SkillsAutomation Testing
  
  - Selenium and/or TypeScript for UI automation
  - Python-based API testing, API automation, or Unit Testing
  - Experience designing and maintaining automation frameworks
  
  Cloud & Web Technologies
  
  - Azure or AWS
  - Understanding of cloud-native architectures and modern web
    applications
  - Strong knowledge of APIs, frontend-backend integrations, and
    end-to-end workflows
  
  Quality Engineering
  
  - Strong understanding of QA methodologies, test design,
    defect management, Agile practices, and CI/CD
  - Exposure to AI-powered testing tools and intelligent
    automation practices
  
  What Could Set You Apart
  
  - Retail ERP domain experience and understanding of retail
    business processes.
  - Practical application of AI in Quality Engineering beyond
    test case or script generation.
  - Experience with intelligent test automation, quality
    analytics, or AI-assisted testing.
  - Strong communication, stakeholder management, and mentoring
    skills.
  - Contributions to patents, innovation initiatives, open-
    source projects, or other notable technical achievements.
  
