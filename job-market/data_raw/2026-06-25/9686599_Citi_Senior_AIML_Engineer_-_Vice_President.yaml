description: |
  - Strong expertise with 10+ years in microservices, RESTful
    APIs, and distributed architectures.
  - Experience in the following AI/ML technologies
    - Development: Python, FastAPI, Java, Spring AI, Async
      Programming
    - Foundational Models: Gemini, OpenAI, Claude, Llama, Local
      Models
    - Machine Learning: PyTorch, TensorFlow, Fine-tuning
    - AI Frameworks: Google’s ADK, LangChain, LlamaIndex, Hugging
      Face
    - Orchestration: LangGraph, Multi-Agent Systems
    - Retrieval Augmented Generation: PostgreSQL, Vector DBs,
      Advanced Retrieval
    - Deployment: Docker, Production APIs, Monitoring
    - Applied Methodology: Prompt Engineering, Workflow Design,
      GenAI Optimization
  - Deep experience in data engineering, including pipelines
    (ETL/ELT), data storage (warehouses, lakes), batch/stream
    processing, data modeling, governance, and big data
    technologies.
  - Proven experience in cloud-native architecture and public
    cloud platforms (AWS, Azure, GCP).
  - Familiarity with React or Angular, TypeScript, and modern
    front-end frameworks.
  - Strong understanding of SAFe Agile framework and enterprise-
    scale agile delivery.
  - Knowledge of DevOps, CI/CD, container orchestration, and
    observability tools.
  - Experience in large-scale financial services enterprise
    environments.
  - Excellent communication, stakeholder management, and
    executive reporting skills.
  
