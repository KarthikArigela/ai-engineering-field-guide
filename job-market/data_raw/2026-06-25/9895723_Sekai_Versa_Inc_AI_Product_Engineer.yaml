description: |
  Sekai is building the TikTok for mini apps — an AI-driven
  consumer platform where people create, remix, share, and
  play interactive content instantly.
  
  We are a Series A company backed by Khosla, a16z, Mayfield,
  and A*, with $30M raised to date. We are remote-first across
  all positions and are looking for ambitious, AI-native
  builders who want to help shape the next generation of
  consumer social products.
  
  About Sekai
  
  Sekai is an AI-powered consumer platform where users can
  create, remix, and play interactive content. We build
  mobile-first products at the intersection of AI, consumer
  social, and interactive entertainment. We are a Series A
  company backed by top VCs including a16z, a+, Mayfield, and
  Khosla, and have raised a total of $30m.
  
  Here are Sekai’s download links:
  
  - Android: https://play.google.com/store/apps/details?id=chat.
    sekai.app&hl=en_US
  - IOS: https://apps.apple.com/us/app/sekai-create-remix-
    play/id6504506653
  
  About the Role
  
  We are looking for a product-centric engineer who cares
  deeply about user experience, moves fast, and uses AI as a
  core part of how they build.
  
  This role is focused primarily on shipping new product
  features, while also owning production issues and fixing
  them quickly when they arise. You will work closely with
  Product and Engineering to build new user experiences,
  improve product quality, and iterate fast. The right person
  is highly AI-native, strong in ownership, and excited to
  build in a fast-moving startup environment.
  
  Responsibilities
  
  - Build and ship product features end-to-end, with most of the
    role focused on new feature development
  - Debug and fix production issues quickly, with strong
    judgment around user impact and prioritization
  - Partner closely with Product to turn ideas into shipped
    experiences and contribute to product direction and user
    experience decisions
  - Use AI aggressively in day-to-day development, debugging,
    prototyping, and iteration
  - Move quickly across the stack to improve product quality,
    speed, and usability
  - Help the team ship faster through strong execution,
    ownership, and product-minded engineering
  
  Qualifications
  
  - 2+ years of experience in software engineering, product
    engineering, full-stack engineering, or another highly
    product-oriented technical role
  - Strong product sense and clear interest in building user-
    facing features
  - Highly AI-native, with strong familiarity with modern AI
    coding tools and a habit of actively exploring new tools
    and workflows
  - Strong ownership mindset and ability to drive work end-to-
    end
  - Experience building side projects, experimenting with new
    ideas, or shipping independently outside of core job
    responsibilities
  - Comfortable working across frontend and backend
  - Able to thrive in a fast-paced startup environment
  
  Preferred Qualifications
  
  - Experience building mobile-first consumer products
  - Experience with Next.js and Python
  - Experience at an early-stage startup
  - Experience at a high-growth or top VC-backed startup
  - Active involvement in open source communities is a plus
  - Computer Science background is a plus
  - Experience working closely with Product, Design, or founders
    on user-facing decisions
  
  Benefits
  
  - Full healthcare benefits
  - Competitive compensation package, including salary and
    equity
  
  If you are excited about building at the frontier of AI,
  consumer social, and interactive entertainment, we would
  love to hear from you.
  
  At Sekai, you will work with an AI-native team, move fast,
  own meaningful problems, and have the flexibility to explore
  new ideas from an early stage.
