description: |
  About Our Company:
  
  
  
  At Patch My PC, we exist to improve lives. What started as a
  free tool to keep apps updated has grown into a trusted
  enterprise solution that helps IT and Security teams
  automate, manage, deploy, and report on third-party updates
  in Microsoft ConfigMgr, Intune, and WSUS. Our fully remote
  crew of 150 GIF-loving humans supports over 10,000 customers
  and more than 30 million devices. We make patching easier,
  boost security, and give IT teams their time back.
  
  
  
  Our core values guide how we work, how we treat each other,
  and how we grow. They keep us focused on what matters most.
  We're here to improve the lives of our customers, our team
  members, and our communities.
  
  About this Role:
  
  
  
  Are you seeking a dynamic environment where you get to dive
  deep into a range of projects bootstrapping AI development?
  
  We’re seeking a passionate and curious  Software Engineer,
  AI to join our growing emerging technology team. This
  position combines a passion for Endpoint, Security and
  Systems management technologies with hands on experience and
  knowledge of AI.
  
  This role is ideal for someone who loves to build tools and
  add-on solutions to Windows and commercial management
  systems. This role is hands-on and requires incubating
  ideas, building prototypes and working across engineering
  teams to integrate into production products.  You will use
  your AI technology experience to create compelling and
  efficient customer scenarios.  You should be comfortable
  dealing with ambiguity, making hypotheses and testing these
  with customers.  A big factor for success will be
  collaboration. You will be able to build rapport with
  customers and extract clear business requirements.  Within
  the team you will be an AI evangelist,  engaging with
  engineering teams to promote ideas, generate energy and
  refine concepts to achieve realization in product.
  
  A further aspect of this role is the enterprise systems
  management community.  You will  be familiar and have
  engaged in these forums.  Comfortable presenting webinars
  and sessions, and contributing content in the form of blogs.
  
  A differentiating factor to this role is foundational
  experience in AI and a keen interest in agentic frameworks,
  autonomous systems, and intelligent workflows.  Keeping up
  with the latest trends in AI and being able to educate and
  equip developers on AI solutions.  You will push the
  boundaries for what Patch My PC can achieve with AI,
  focusing on value and productivity for our customers.
  
  Responsibilities:
  
  - Design and develop generative AI solutions across a rapidly
    expanding product portfolio
  - Develop and deploy AI agents for internal tools and
    customer-facing applications
  - Collaborate with cross-functional teams to integrate AI tech
    into existing systems
  - Educate, inform and support product developers for AI
    integration and maintenance
  - Identify optimum data processing and structure for accurate
    AI analysis
  - Translate requirements into clear engineering deliverables,
    track progress, and communicate status through stand-ups
    and stakeholder updates
  - Conduct testing, debugging, and performance optimization of
    AI agent workflows
  - Stay up-to-date with the latest research and trends in
    commercial AI systems
  
  Required Skills:
  
  - Bachelor’s degree in Computer Science, Artificial
    Intelligence, or related field (or equivalent experience)
  - 5+ years of professional software development with C# and
    the .NET ecosystem
  - Familiarity with an AI agent framework (e.g., LangChain,
    CrewAI, AutoGPT, MetaGPT)
  - Good understanding of Large LLMs (e.g., GPT, Claude,
    Mistral) and prompt engineering
  - Experience with AI libraries (e.g., Transformers, OpenAI
    API, Hugging Face)
  - Experience with GenAI data pre-processing and embedding
  - Experience with REST APIs and at least one cloud platform
    (Azure, AWS, GCP)
  - Experience with MongoDB or similar NoSQL databases
  - Proficiency with Git workflows, branching strategies, and
    code review
  - Strong problem-solving skills and eagerness to learn in a
    fast-paced environment
  
  Nice to Have:
  
  - Knowledge of agent memory, planning, and tool-use strategies
  - Azure AI foundry
  - Familiarity with containerization (Docker) and CI/CD
    pipelines
  - Contributions to open-source AI projects or personal agent-
    based experiments
  
  Compensation & Benefits:
  
  What to Expect in the Interview Process
  
  Our interview process is designed to help us understand how
  you think, build software, and collaborate with others. It
  also gives you an opportunity to learn more about our team,
  the problems we are solving and what it is like to work at
  Patch My PC.
  
  Throughout the process we look not only at technical skills
  but also how candidates align with our core values. These
  values guide how we work together, support our customers and
  continue to grow as a team.
  
  Step 1: Technical Assessment Candidates begin with an online
  coding assessment focused on problem solving and core
  programming concepts. This helps us understand your approach
  to writing clean, efficient code and working through
  technical challenges.
  
  Step 2: Initial Screen A 20-30 minute conversation with our
  Talent team to learn more about your background, experience
  and career goals. We will also share more about Patch My PC,
  our culture and how our values guide the way we work.
  
  Step 3: Hiring Manager Interview A conversation with the
  hiring manager to discuss your technical experience,
  previous projects and how you approach building and
  supporting production systems. This discussion also provides
  an opportunity to learn more about the team, current
  priorities and expectations for the role.
  
  Step 4: Technical Interview A live technical interview with
  members of our engineering team. This session focuses on
  software engineering fundamentals such as coding, system
  design, debugging and how you approach real world
  engineering problems. You may be asked to walk through your
  thinking while solving a problem collaboratively.
  
  Step 5: Team and Leadership Conversations The next stage
  includes conversations with engineering leaders and cross
  functional team members. In addition to discussing technical
  experience we focus on collaboration, communication and how
  you contribute to a team environment grounded in humility,
  ownership, empathy, and delivering excellence.
  
  Step 6: Final Conversation with Our CEO As a final step
  candidates may meet with our CEO and Founder Justin
  Chalfant. This conversation focuses on our mission, culture,
  and values and gives you the opportunity to ask questions
  about the company vision and the impact our team is working
  to create.
  
  Additional Information Most interviews are conducted
  virtually. In some cases we may invite candidates to
  participate in an in person conversation or onsite visit,
  depending on the role, location, and stage of the process.
  
  Our goal is to keep the process efficient and respectful of
  your time while ensuring both you and our team feel
  confident about the fit both technically and culturally.
  
  Equal Opportunity Employer:
  
  Patch My PC is an Equal Opportunity Employer and is
