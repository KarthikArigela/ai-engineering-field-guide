description: |
  About this role: Wells Fargo is seeking a Senior Software
  Engineer. Individuals who have the experience and passion
  for modernizing legacy applications/system into cloud-
  native, modernized applications. In this role, you will:
  
  - Lead moderately complex initiatives and deliverables within
    technical domain environments
  - Contribute to large scale planning of strategies
  - Design, code, test, debug, and document for projects and
    programs associated with technology domain, including
    upgrades and deployments
  - Review moderately complex technical challenges that require
    an in-depth evaluation of technologies and procedures
  - Resolve moderately complex issues and lead a team to meet
    existing client needs or potential new clients needs while
    leveraging solid understanding of the function, policies,
    procedures, or compliance requirements
  - Collaborate and consult with peers, colleagues, and mid-
    level managers to resolve technical challenges and achieve
    goals
  - Lead projects and act as an escalation point, provide
    guidance and direction to less experienced staff
  
  Required Qualifications:
  
  - 4+ years of Software Engineering experience, or equivalent
    demonstrated through one or a combination of the
    following: work experience, training, military experience,
    education
  
  Desired Qualifications:
  
  - Bachelor's degree in computer science or related
    field/relevant experience in software development.
  - At least 4 years plus experience in software Engineering.
  - Deep understanding of Object-Oriented Design Principles and
    Patterns. Java 11 and above.
  - Experience in microservices (REST/GraphQL) and event-driven
    architecture.
  - Experience in Java/J2EE Web Application Development, Spring
    (Core, MVC, AOP, Batch, Springboot), Web Services (REST,
    SOAP etc.), JMS, Messaging, Kafka, RabbitMQ (streaming
    technologies), Cloud Technologies (AWS/PCF/Azure),
    Relational Database (Oracle, PostgreSQL), NoSQL (MongoDB)
    database.
  - Experience/knowledge with code management and continuous
    integration techniques and tools such as Gradle, GitHub,
    Jenkins, NPM.
  - Experience in modern application development practices such
    as CI/CD, Test Driven Development (TDD), Automation
    testing (BDD, Cucumber etc.) and DevOps.
  - Solid understanding of agile.
  - Can operate with limited level of direct supervision.
  - Experience/knowledge in monitoring and gathering metrics
    (Splunk, CloudWatch, AppDynamics, Elastic search etc)
  
  Job Expectations:
  
  - Experience with one cloud native technologies is plus like
    Azure - Azure Devops, Azure Webapp, Azure AD, AWS - EC2.
  - Experience designing and building front-end Single-Page
    Applications (SPAs) in one or more front-end framework
    (HTML5, AngularJS, ReactJS) is a plus
  - Experience / Knowledge in MongoDB, SQL, and query
    performance tuning.
  
