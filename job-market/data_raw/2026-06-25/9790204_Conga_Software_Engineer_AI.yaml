description: |
  A career that’s the whole package!
  
  At Conga, we’ve built a community where our colleagues can
  thrive. Here you’ll find opportunities to innovate and
  support growth through individual and team development, all
  within an environment where every voice is heard.
  
  Conga lines up commercial operations so companies run as
  connected, smarter businesses. By unifying the people and
  processes that drive commerce, Conga aligns pricing,
  quoting, contracting, rebates, and communications so teams
  stay in sync and buyers keep moving forward. The result is
  trusted decisions, consistent buyer experiences, and
  profitable growth. More than 10,000 customers worldwide,
  including over 50% of the Fortune 100®, trust Conga when
  commercial complexity is high and global impact is on the
  line.
  
  Job Title: Software Engineer, AI Locations: Bangalore
  Reports to: Sr. Manager, AI/ML A quick snapshot… As a
  Software Engineer, to join our dynamic team and contribute
  to the development of next-generation AI/GenAI based
  products and solutions. This role will provide you with the
  opportunity to work on cutting-edge SaaS technologies and
  impactful projects that are used by enterprises and users
  worldwide. As a Software Engineer, you will be involved in
  the design, development, testing, deployment, and
  maintenance of software solutions. You will work in a
  collaborative environment, contributing to the technical
  foundation behind our flagship products and services. Why
  it’s a big deal… You will ensure to participate in the
  entire AI development lifecycle, including data collection,
  preprocessing, model training, evaluation, and deployment.
  Assist in researching and experimenting with state-of-the-
  art generative AI techniques to improve model performance
  and capabilities. You would review code developed by other
  developers, providing feedback adhering to industry standard
  best practices like coding guidelines. Are you the person
  we’re looking for? Related experience in AI
  development. Your experience of at least 3 years in software
  development, practices and design patterns. Report bugs and
  errors to development teams and evaluate product code
  according to specifications. Work with cross-functional
  teams to ensure quality throughout the software development
  lifecycle. Skills and Tools. You have expertise as a
  developer using Python, FastAPI, PyTest, Celery and other
  Python frameworks and high-level familiarity with AI/ML,
  GenAI, and MLOps concepts.  You also have hands-on
  experience with object-oriented programming, concurrency,
  design patterns, and REST APIs. Your familiarity with CI/CD
  tooling such as Terraform and GitHub Actions and frameworks
  like LangChain, LangGraph, and databases like SQL and NoSQL
  such as MongoDB, MSSQL, or Postgres. Cloud Service Provider.
  You have experience of AWS and MS Azure and good to have
  experience with GCP. Dev Ops Model. Your understanding of
  working in a DevOps Model.  Begin to take ownership of
  working with product management on requirements to design,
  develop, test, deploy and maintain the software in
  production. Education: A bachelor’s degree in engineering or
  equivalent. Here’s what will give you an edge… Resourceful &
  Collaborative. At Conga, we achieve together-- when you have
  questions, you find answers; when you’re faced with
  challenges, you find solutions. You turn to a variety of
  resources, including your colleagues, professional network,
  Internet, articles, books -- whatever helps you get the job
  done. Then you apply that knowledge across the business
  where it makes sense. Awareness: This role should be aware
  of the company vision, goals, and requirements, and work
  towards that direction to deliver quality so participation
  in multiple forums makes this role more vital. Confident and
  deliberate communicator. You have a point of view and you’re
  completely comfortable defending it to any person or group,
  regardless of level or status. It’s a confidence that comes
  from experience. And that’s not to say you aren’t open to
  different views; but, when you feel strongly about a
  particular matter, you don’t give up easily. You’re at ease
  with lively debate, in fact, you welcome it. Your points are
  clear and concise. And you’re equally as respected for your
  knowledge and expertise as for your style and approach. #LI-
  RT1
  
