description: |
  Build Intelligent Systems to Solve Complex Security
  Challenges  VioletX is looking for an AI Engineer to develop
  cutting-edge automation and intelligent systems that tackle
  some of the most complex problems in security, compliance,
  and risk.
  
  If you’ve deployed AI solutions before and want to work on
  real-world automation for security and compliance
  challenges, this is your chance to take the lead.
  
  Why This Role?
  
  - You’ll be the lead AI engineer. You’ll architect, build, and
    deploy intelligent systems that solve security problems at
    scale.
  - This is high-impact work. The systems you develop will help
    businesses automate security decisions and reduce risk.
  - Los Angeles-based, hybrid role. AI moves fast, and the best
    work happens through tight collaboration.
  - We already have demand. This isn’t just R&D—what you build
    will be deployed immediately.
  
  What You’ll Do:
  
  - Build and optimize AI-driven automation to tackle security
    and risk challenges.
  - Develop systems that understand, analyze, and take action in
    high-stakes environments.
  - Work on real-time intelligence, workflow automation, and
    risk-based decision-making tools.
  - Engage with customers and partners to refine solutions for
    real-world application.
  
  What We’re Looking For:
  
  - You’ve built and shipped AI-driven systems for a minimum of
    3 - 5 years. You know how to move beyond a prototype to a
    working, scalable solution.
  - Experience with LLMs, automation, and decision-making
    models. You can design AI-powered workflows that solve
    complex challenges.
  - You thrive in fast-moving environments. Whether it’s
    engineering, strategy, or problem-solving, you like
    building and executing.
  - You’re based in Los Angeles, CA. This is a hybrid
    role—building at this level requires close collaboration.
  
  If you want to own something big, work at the intersection
  of AI and security, and solve real problems for real
  customers, let’s talk.
