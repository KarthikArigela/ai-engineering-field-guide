description: |
  Meet the Team
  
  We are a forward-thinking group within Cisco IT, dedicated
  to driving digital transformation through advanced
  technology and a customer-first approach. Our team is
  defined by a culture of agility, patience, and a relentless
  pursuit of excellence as we redefine how Cisco operates.
  
  - Innovating IT: We transform operations by integrating
    advanced technology, optimized business processes, and
    data-driven insights to improve the experience for
    employees, partners, and customers.
  - Culture of Excellence: Our foundation is built on speed,
    agility, and kindness, ensuring we remain a customer-
    centric and industry-leading IT organization.
  - Strategic Focus: We are committed to fostering innovation
    with a heavy emphasis on AI and security, keeping our
    solutions at the cutting edge of the industry.
  - Collaborative Environment: As part of the Enterprise Data &
    Platforms team, you will work alongside talented
    engineers, architects, and leadership to build and support
    a robust portfolio of capabilities.
  
  Your Impact
  
  As a key contributor to our team, you will be at the
  forefront of Cisco’s AI evolution. You will be responsible
  for building scalable, intuitive, and secure solutions that
  directly enhance the Cisco experience and drive our long-
  term strategic goals.
  
  - AI Development: Drive the enablement of AI and Generative
    AI, specifically focusing on the development and
    management of applications using Retrieval Augmented
    Generation (RAG) and Agentic AI.
  - AI-First Engineering: Build large-scale Gen AI applications
    by prioritizing AI-first principles, simplicity, and an
    intuitive User Experience (UX).
  - Operational Excellence: Uphold the highest standards of
    software development, ensuring all solutions are built
    with secure coding practices and a thorough focus on user
    privacy.
  - Cross-Functional Collaboration: Partner with architects and
    organizational leadership to deliver scalable, high-impact
    solutions that move the needle for the entire
    organization.
  
  Responsibilities
  
  - Develop Gen AI based applications and frameworks for both
    on-prem and cloud environments.
  - Build and optimize secure, scalable Gen AI platforms
    supporting enterprise document management, data security,
    and compliance requirements.
  - Implement end-to-end workflows for document ingestion,
    processing, classification, and retrieval within AI
    systems.
  - Maintain responsible AI practices, ensuring adherence to
    data security standards and regulatory compliance.
  - Manage automated pipelines for model fine-tuning and
    document processing, with real-time monitoring and
    alerting.
  - Troubleshoot complex production issues, participate in on-
    call rotations, and lead postmortems with root cause
    analysis.
  - Work independently with general guidance to determine
    effective approaches and deliver solutions.
  - Perform coding, testing, debugging, and overall software
    development lifecycle activities with minimal supervision.
  
  Minimum Qualifications
  
  - Bachelor's in Computer Science, Computer Engineering,
    Electrical Engineering, or a related STEM field with 5
    years of related experience OR Master's + 3 years of
    related experience.
  - Proficiency in software engineering best practices, design
    and development of containerized large-scale distributed
    applications, and use of DevOps and CI/CD tools.
  - Proficiency in Python programming language or similar.
  - Experience with frontend frameworks such as Angular, React
    or similar.
  
  Preferred Qualifications
  
  - Hands-on experience with Gen AI frameworks such as
    LangChain, LlamaIndex, LangSmith, AI operators, with
    proficiency in Python for AI operations.
  - Experience with vector databases, such as Weaviate,
    Pinecone, Milvus or similar.
  - Experience with design and development of advanced Agentic
    AI workflows orchestration.
  
