description: |
  Healthcare is at a turning point: interoperability,
  intelligent data platforms, and generative AI are
  fundamentally transforming how healthcare organizations
  operate, make decisions, and deliver patient care.
  
  At InterSystems, you will work with leading healthcare
  organizations to make this transformation a reality.
  
  As a Senior Sales Engineer, you will act as a trusted
  technical advisor on strategic customer initiatives related
  to:
  
  - Healthcare interoperability
  - Modern data platforms
  - Cloud and API architectures
  - Analytics & AI
  - Generative and agentic AI in healthcare
  
  You will combine technical excellence with strategic
  advisory, helping customers transform complex healthcare
  data landscapes into future-proof platforms. You will
  collaborate closely with experienced international experts
  across Sales Engineering, Product Management, Architecture,
  and Professional Services.
  
  Your Role
  
  You will support complex customer projects throughout the
  entire technical sales cycle — from initial strategic
  discussions to architecture workshops, proof of concepts,
  and executive presentations. Beyond being a technical
  expert, you will actively contribute to shaping modern
  healthcare and AI strategies. Your responsibilities include:
  
  - Advising customers on modern healthcare architectures and
    data platforms
  - Positioning interoperability, analytics, and AI solutions
  - Delivering executive briefings, architecture workshops, and
    product demonstrations
  - Developing solution designs and technical strategies
  - Supporting proof-of-concepts and innovation initiatives
  - Providing guidance on HL7, FHIR, IHE, APIs, and cloud
    architectures
  - Engaging in discussions on modern AI and GenAI approaches in
    healthcare
  - Collaborating with international experts across Sales,
    Product Management, and Engineering
  - Supporting strategic customers in their digital
    transformation
  
  Your Profile
  
  You have a strong technical foundation and are confident
  operating across architecture, customer advisory, and
  strategic communication. Ideally, you bring experience from
  a similar role within:
  
  - A healthcare software vendor
  - An integration platform provider
  - A cloud/data platform company
  - A consulting firm
  - Or a technical architecture/engineering role within the
    healthcare domain
  
  Additionally, you bring:
  
  - Several years of experience in presales, solution
    engineering, architecture, or software engineering
  - Strong understanding of modern healthcare interoperability
  - Experience with HL7, FHIR, APIs, and integration
    architectures
  - Knowledge of modern data platforms, analytics, and data
    fabric concepts
  - Knowledge and experience with Analytics, Data Fabric,
    Generative AI, RAG and Agent-based AI in the healthcare
    context
  - Ability to communicate complex technical topics clearly and
    persuasively
  - Confidence interacting with both technical teams and
    executive stakeholders
  - Fluent German and English skills
  
  Technologies & Topics
  
  InterSystems IRIS • HealthShare • FHIR • HL7 • REST APIs •
  Cloud Platforms • SQL • Python • Docker • Kubernetes •
  Analytics • Data Fabric • Generative AI • RAG • Agentic AI
  
  Why InterSystems?
  
  InterSystems is a global leader in healthcare data platforms
  and interoperability technologies. Our solutions power some
  of the most complex and mission-critical healthcare systems
  worldwide — from national health platforms to innovative AI-
  driven healthcare solutions.
  
  What you can expect:
  
  - Strategically impactful projects with leading healthcare
    organizations
  - Hands-on work on real AI and data platform challenges — not
    just presentations
  - High level of ownership and autonomy
  - Collaboration with highly experienced international experts
  - Exposure to modern technologies and complex architectural
    challenges
  - An environment where technical excellence is valued
  - The opportunity to actively shape the digital transformation
    of healthcare
  
  About InterSystems
  
  InterSystems, a creative data technology provider, delivers
  a unified foundation for next-generation applications for
  healthcare, finance, manufacturing, and supply chain
  customers in more than 80 countries. Our data platforms
  solve interoperability, speed, and scalability problems for
  large organizations around the globe to unlock the power of
  data and allow people to perceive data in imaginative ways.
  Established in 1978, InterSystems is committed to excellence
  through its 24×7 support for customers and partners around
  the world. Privately held and headquartered in Boston,
  Massachusetts, InterSystems has 38 offices in 28 countries
  worldwide. For more information, please visit
  InterSystems.com.
