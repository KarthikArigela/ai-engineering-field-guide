description: |
  Sokra is building an AI-powered adaptive learning platform
  that's already being tested by 50+ schools across Germany.
  Major publishers are reaching out, and we're preparing our
  angel round. We're a team of 3 founders (EXIST-backed, HU
  Berlin) looking for our first engineer — not an employee,
  but a co-builder with real ownership. Tasks * Own and shape
  the entire technical product alongside the founding team —
  from architecture decisions to shipping features * Build and
  iterate on our AI-powered learning engine (LLM agents, RAG
  pipelines, adaptive content delivery) * Develop the full-
  stack platform (Next.js, TypeScript, Python, WebSockets) *
  Work directly with schools and teachers to turn feedback
  into product improvements * Contribute to technical
  strategy, hiring decisions, and company direction as a
  founding team member Requirements * Strong full-stack
  experience with TypeScript/React/Next.js and Python * Hands-
  on experience or deep interest in AI/ML, LLMs, and RAG
  architectures * 0→1 builder mindset — you've shipped
  products, not just features * Degree in Computer Science or
  related field (graduated within the last ~5 years) * Based
  in Germany or willing to relocate to Berlin (hybrid setup) *
  Fluent in English; German is a plus but not required
  Benefits * 0.5–2% equity with 4-year vesting — real
  ownership, not a token gesture * Be founding engineer #1:
  shape the product, the culture, and the technical direction
  * Mission-driven work: AI that actually helps students
  learn, not another ad-tech tool * EXIST-funded runway (~12
  months) + angel round in preparation * Hybrid work from
  Berlin, flexible hours * Direct impact: your code is used by
  real teachers and students every day This isn't a "join our
  growing team" role. We're 3 founders looking for a 4th
  brain. If you want to build something meaningful from
  scratch and have real skin in the game, we'd love to hear
  from you. Apply now — we'll get back to you within 3 days.
  First step is a casual 20-minute call.
