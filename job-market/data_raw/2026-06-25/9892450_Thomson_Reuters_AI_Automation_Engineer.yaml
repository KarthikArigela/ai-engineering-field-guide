description: |
  AI & Automation Engineer
  
  The AI & Automation Engineer is an embedded practitioner,
  builder, and multiplier — sitting at the intersection of
  data engineering, AI systems, and operational workflows to
  assess, redesign, and transform complex manual processes
  into intelligent, automated operations.
  
  This role requires fluency in both AI and automation as
  distinct disciplines. You will assess and redesign existing
  operational processes before determining where deterministic
  automation, agentic AI, or a combination of both is the
  right solution — replacing manual, fragmented processes with
  streamlined, end-to-end intelligent systems that reduce
  friction, accelerate decisions, and embed intelligence
  directly into how work gets done.
  
  This is an embedded role operating within the Enterprise
  Analytics Center of Excellence, partnering closely with Data
  & Analytics team members, operations owners, and non-
  technical stakeholders to identify opportunities, design
  solutions, and drive adoption. You will build scalable
  systems that integrate data, AI, and user interaction —
  including natural language access to data and automated,
  push-based intelligence — embedding intelligence directly
  into how teams work.
  
  About the Role
  
  In this opportunity as an AI & Automation Engineer, you
  will:
  
  Operational AI Automation
  
  - Assess and redesign existing operational processes to
    determine the right solution — deterministic automation,
    agentic AI, or a combination — before building
  - Design and deploy event-driven, threshold-based intelligence
    systems that replace manual reporting
  - Build AI-generated narrative and push communication systems
    that deliver personalized, context-rich insights and
    initiate or guide action within operational workflows
  - Develop interactive feedback loops that allow recipients to
    respond to AI-surfaced signals (e.g., "this is expected,"
    "I have questions," "investigate further") and route those
    responses appropriately
  - Automate routine operational notifications (e.g., risk flag
    escalation) end-to-end with minimal human-in-the-loop
    dependency
  
  Natural Language Query (NLQ) & AI Integration
  
  - Integrate large language model (LLM) capabilities with
    semantic data models to enable non-technical users to
    directly interrogate data in natural language
  - Partner with the team's semantic and architect subject area
    experts to ensure semantic models are AI-grade — well-
    defined, explainable, and optimized for NLQ intent
  - Build and maintain prompt frameworks, evaluation approaches,
    and guardrails that ensure AI outputs are reliable,
    auditable, and aligned with business context
  
  Systems Architecture & Reference Implementation
  
  - Design and deliver robust, scalable reference
    implementations that serve as the foundation for broader
    adoption
  - Define patterns and guardrails for building AI-enabled
    systems, enabling consistent and extensible approaches
    across the team
  - Establish high-quality, maintainable solutions that are
    designed for reuse, durability, and evolution
  
  Coaching & Capability Building
  
  - Partner with team members to share knowledge and evolve
    solutions into team-owned, repeatable capabilities
  - Guide team members in designing and operating AI-enabled
    systems, helping shift from manual processes to automated,
    intelligent workflows
  - Engage business leaders and operations owners to identify
    high-value automation and AI opportunities, define success
    criteria, and drive adoption of deployed solutions
  - Contribute to the team’s technical direction by staying
    current on emerging AI and automation practices and
    bringing relevant innovations into the team’s approach
  
  About You:
  
  You’re a fit for the role of AI & Automation Engineer if you
  have:
  
  Required Qualifications
  
  - Demonstrated experience designing and deploying AI-powered
    systems used within operational workflows, including
    agentic workflows, orchestration, context engineering, and
    production-grade implementation with built-in evaluation
    and reliability
  - Strong understanding of data foundations, including
    preparing data for AI use and working with semantic models
    and structured pipelines
  - Experience integrating AI/LLM capabilities with structured
    data sources (e.g., semantic layers, data warehouses,
    APIs)
  - Ability to design systems end-to-end, from data signal to AI
    reasoning to user-facing output
  - Strong documentation practices, with a focus on building
    solutions that are maintainable and extensible by others
  - Interest in mentoring and enabling others, contributing to
    overall team capability and adoption
  - Ability to assess and map existing business processes,
    identifying where AI, automation, or process redesign
    delivers the most value
  - Experience with event-driven architectures and designing
    trigger-based or real-time processing systems
  - Experience designing context-aware AI systems, including
    retrieval-augmented generation (RAG) using structured
    business metadata
  
  Preferred Qualifications
  
  - Familiarity with semantic modeling approaches and how they
    support natural language and AI use cases
  - Experience integrating AI into user-facing experiences, such
    as conversational interfaces or intelligent notification
    systems
  - Experience with orchestration and automation tools (e.g.,
    dbt, Power Automate, Azure Data Factory)
  - Understanding of AI operational practices, including
    evaluation frameworks, monitoring model performance,
    human-in-the-loop design, and escalation handling
  - Experience in forward-deployed, embedded, or consultative
    engineering roles, with an emphasis on stakeholder
    partnership and solution adoption
  
  #LI-SP1
  
  What’s in it For You?
  
  - Hybrid Work Model: We’ve adopted a flexible hybrid working
    environment (2-3 days a week in the office depending on
    the role) for our office-based roles while delivering a
    seamless experience that is digitally and physically
    connected.
  - Flexibility & Work-Life Balance: Flex My Way is a set of
    supportive workplace policies designed to help manage
    personal and professional responsibilities, whether caring
    for family, giving back to the community, or finding time
    to refresh and reset. This builds upon our flexible work
    arrangements, including work from anywhere for up to 8
    weeks per year, empowering employees to achieve a better
    work-life balance.
  - Career Development and Growth: By fostering a culture of
    continuous learning and skill development, we prepare our
    talent to tackle tomorrow’s challenges and deliver real-
    world solutions. Our Grow My Way programming and skills-
    first approach ensures you have the tools and knowledge to
    grow, lead, and thrive in an AI-enabled future.
  - Industry Competitive Benefits: We offer comprehensive
    benefit plans to include flexible vacation, two company-
    wide Mental Health Days off, access to the Headspace app,
    retirement savings, tuition reimbursement, employee
    incentive programs, and resources for mental, physical,
    and financial wellbeing.
  - Culture: Globally recognized, award-winning reputation for
    inclusion and belonging, flexibility, work-life balance,
    and more. We live by our values: Obsess over our
    Customers, Compete to Win, Challenge (Y)our Thinking, Act
    Fast / Learn Fast, and Stronger Together.
  - Social Impact: Make an impact in your community with our
    Social Impact Institute. We offer employees two paid
    volunteer days off annually and opportunities to get
    involved with pro-bono consulting projects and
    Environmental, Social, and Governance (ESG) initiatives.
  - Making a Real-World Impact: We are one of the few companies
    globally that helps its customers pursue justice, truth,
    and transparency. Together, with the professionals and
    institutions we serve, we help uphold the rule of law,
    turn the wheels of commerce, catch bad actors, report the
    facts, and provide trusted, unbiased information to people
    all over the world.
  
