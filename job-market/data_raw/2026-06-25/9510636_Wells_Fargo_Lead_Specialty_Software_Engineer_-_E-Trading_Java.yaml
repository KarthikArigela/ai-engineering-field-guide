description: |
  About this role This is an exciting opportunity to join the
  team building next-generation solutions for the Wells Fargo
  Capital Markets Technology organization. We are seeking a
  Lead Specialty AI Java Software Data Engineer to play a key
  role in our automation, AI adoption, and platform
  modernization journey. If you are passionate about solving
  complex, mission-critical problems using leading-edge
  technologies, advanced analytics, and AI-assisted
  engineering practices-grounded in strong software
  engineering fundamentals-this role is well suited for you.
  In this role, you will help build and evolve strategic
  trading analytics data platforms, including the Low Touch
  Data Hub and the next-generation Equities Data & Analytics
  platform supporting all Equities Front Office trading
  groups. You will contribute to the design and delivery of
  scalable application frameworks and data services within
  Commercial and Corporate & Investment Banking Technology,
  enabling advanced analytics, AI-driven insights, and
  automation across the Equities trading lifecycle. AI-Enabled
  Engineering and Platform Responsibilities
  
  - Define and govern standard patterns for AI-assisted and LLM-
    based software development, including prompt-driven
    development, automated test generation, diagnostics,
    documentation, and developer productivity tooling
  - Architect and guide enterprise-standard LLM integrations,
    including MCP-based services, used across development
    tooling, system observability, and controlled automation
  - Establish and enforce guardrails for reliable, explainable,
    auditable, and secure AI usage within electronic trading
    technology
  - Partner with platform, security, risk, and compliance teams
    to ensure AI-enabled engineering workflows meet Wells
    Fargo standards for data protection, regulatory
    compliance, and model risk management
  - Continuously evaluate advances in GenAI, agentic AI, and
    applied machine learning to refine engineering practices
    and platform capabilities where appropriate
  
   (AI-enabled development is considered a baseline capability
  across the engineering organization; this role ensures
  architectural consistency, operational safety, and
  enterprise scale.)  Learn more about career areas and lines
  of business at wellsfargojobs.com. Key responsibilities
  Candidates applying for this position should be prepared to
  work in a fast-paced Front Office software environment with
  the following expectations:
  
  - Perform a senior-level technical and analytics role
    developing software supporting equities trading,
    analytics, and automation workflows
  - Lead the design and implementation of AI-enabled analytics
    platforms, including data pipelines that support machine
    learning, GenAI, and advanced quantitative models
  - Apply an AI-centric mindset by leveraging and enhancing
    developer productivity tools (e.g., GitHub Copilot, Claude
    Code) and building agentic AI workflows for testing,
    validation, monitoring, and operational automation
  - Provide mentorship and technical leadership to data,
    analytics, and software engineers in a high-performing
    Agile environment
  - Work directly with traders, Strat teams, and quants to
    understand requirements and translate them into robust,
    scalable technical solutions
  - Create thorough system and application designs that
    integrate cleanly into existing low-latency and
    distributed architectures
  - Write high-quality, performant, and maintainable code in
    Java and Python, applying object-oriented principles,
    design patterns, and modern server-side architectures
  - Design systems that support time-series analytics, model
    lifecycle management, and real-time decisioning use cases
  - Perform rigorous unit testing, documentation, and code
    reviews, including validation of AI-assisted outputs for
    correctness, reproducibility, and explainability
  - Solve complex technical and analytical problems requiring a
    strong understanding of equities trading workflows and
    business domains
  - Ensure quality, extensibility, and reliability of low-
    latency, highly available applications in production
  - Provide Level 2 production support as required, including
    diagnosis of data quality, performance, and model-driven
    issues
  
  In this role, you will
  
  - Lead moderately complex initiatives and deliverables within
    Equities Trading and Analytics technology environments
  - Contribute to large-scale platform strategy, including
    modernization, automation, and responsible AI adoption
  - Design, code, test, debug, and document solutions for
    platform enhancements, upgrades, and deployments
  - Review and resolve moderately complex technical challenges
    requiring deep evaluation of distributed systems, data
    platforms, and AI-enabled components
  - Apply strong understanding of business function, governance,
    policies, procedures, and compliance requirements when
    building AI-assisted systems
  - Collaborate with peers, senior engineers, product partners,
    and mid-level managers to achieve technology and business
    goals
  - Act as an escalation point and technical advisor, providing
    guidance to less experienced engineers
  
  Required qualifications
  
  - 5+ years of Specialty Software Engineering experience, or
    equivalent demonstrated through one or a combination of
    the following: work experience, training, military
    experience, education
  - 5+ years of Software Engineering experience, with a strong
    focus on data-intensive systems
  - 5+ years of experience building analytics platforms, data
    services, or data-driven applications
  - 5+ years of experience with algorithms and data structures,
    particularly as applied to analytics and data processing
  - 4+ years of experience designing and implementing
    distributed data systems
  - 4+ years of experience with time-series, relational, or
    analytical databases
  - 4+ years of experience in Java for building high-performance
    backend and data services
  - 4+ years of experience in Python for analytics, data
    processing, and automation
  
  Desired qualifications:
  
  - Advanced experience in capital markets business processes
  - Working knowledge of SEC, FINRA, and international
    regulatory considerations when building technology
    solutions
  - Cash Equities and Global Markets trading workflow knowledge;
    FIX protocol experience
  - Deep understanding of concurrency, memory management, and
    performance tuning in data-heavy systems
  - Experience with application lifecycle management from design
    through production support, including AI-enabled or
    analytics-driven systems
  - Strong understanding of distributed and client-server
    technology architectures
  - Prior team lead and/or direct or matrix management
    experience
  - Outstanding written and verbal communication skills
    appropriate for a Front Office environment
  - BS/BA degree or higher
  
  Job Expectations:
  
  - This position is not eligible for Visa sponsorship
  - Position offers a hybrid work schedule
  
  Posting End Date:  25 Jun 2026 *Job posting may come down
  early due to volume of applicants. We Value Equal
  Opportunity Wells Fargo is an equal opportunity employer.
  All qualified applicants will receive consideration for
  employment without regard to race, color, religion, sex,
  sexual orientation, gender identity, national origin,
  disability, status as a protected veteran, or any other
  legally protected characteristic. Employees support our
  focus on building strong customer relationships balanced
  with a strong risk mitigating and compliance-driven culture
  which firmly establishes those disciplines as critical to
  the success of our customers and company. They are
  accountable for execution of all applicable risk programs
  (Credit, Market, Financial Crimes, Operational, Regulatory
  Compliance), which includes effectively following and
  adhering to applicable Wells Fargo policies and procedures,
  appropriately fulfilling risk and compliance obligations,
  timely and effective escalation and remediation of issues,
  and making sound risk decisions. There is emphasis on
  proactive monitoring, governance, risk identification and
  escalation, as well as making sound risk decisions
  commensurate with the business unit's risk appetite and all
  risk and compliance program requirements. Candidates
  applying to job openings posted in Canada: Applications for
  employment are encouraged from all qualified candidates,
