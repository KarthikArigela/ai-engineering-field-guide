description: |
  Applications Development Senior Programmer Analyst
  (Associate Vice President, Software Senior Engineer)
  
  The Applications Development Senior Programmer Analyst is an
  intermediate level position responsible for participation in
  the establishment and implementation of new or revised
  application systems and programs in coordination with the
  Technology team. The overall objective of this role is to
  contribute to applications systems analysis and programming
  activities, significantly augmented by Artificial
  Intelligence capabilities.
  
  About the Role:
  
  We are seeking a highly skilled and motivated Associate Vice
  President (AVP), Software Senior Engineer, to join our
  dynamic team. This role is crucial for designing,
  developing, and maintaining robust and scalable middleware
  solutions. The ideal candidate will possess deep expertise
  in Java and Spring Boot, coupled with a strong understanding
  of database technologies such as Oracle, SQL, and MongoDB.
  Furthermore, we are looking for an individual with a keen
  interest and demonstrable exposure to Artificial
  Intelligence (AI) and a passion for leveraging AI to drive
  productivity gains, innovate our software development
  processes, and enhance solution quality. You will play a
  pivotal role in shaping our technical landscape, mentoring
  junior engineers, and contributing to high-impact projects
  through an AI-first development approach.
  
  Responsibilities (Leveraging AI):
  
  - Lead the design, development, and implementation of complex
    middleware applications using Java and Spring Boot:
    Utilize AI-powered code generation tools (e.g., Devin,
    Copilot, Codex) to accelerate development, automate
    boilerplate code, suggest optimal implementations, and
    enforce architectural patterns. Leverage AI for design
    pattern identification and complex system architecture
    validation.
  - Architect and optimize database interactions with Oracle,
    SQL, and MongoDB, ensuring high performance and data
    integrity: Employ AI to analyze database query
    performance, suggest advanced indexing strategies,
    optimize schema designs, and generate efficient SQL/NoSQL
    queries. AI-driven tools can also assist in predicting
    database load and recommending scaling solutions.
  - Drive the adoption and continuous improvement of CI/CD
    pipelines to facilitate rapid and reliable software
    delivery: Integrate AI into CI/CD processes for
    intelligent test case generation, predictive failure
    analysis, automated code vulnerability scanning, and
    optimization of pipeline execution times based on
    historical data.
  - Collaborate with cross-functional teams, including product
    management, QA, and operations, to define requirements,
    design solutions, and deliver high-quality software: Use
    AI-powered communication and summarization tools (e.g.,
    Claude) to streamline requirement gathering, document
    analysis, and stakeholder communication. AI can also
    assist in translating technical designs into accessible
    formats for various audiences.
  - Mentor and provide technical guidance to junior and mid-
    level software engineers, fostering a culture of technical
    excellence and continuous learning: Leverage AI platforms
    for personalized learning paths, automated code feedback,
    and explanations of complex technical concepts. Encourage
    junior engineers to adopt AI-driven development practices.
  - Actively research and experiment with AI technologies to
    identify opportunities for enhancing developer
    productivity, automating tasks, and improving software
    quality: Continuously explore emerging AI tools and
    techniques (such as Anti Gravity for complex problem-
    solving) and assess their applicability to our development
    ecosystem.
  - Participate in code reviews, ensuring adherence to coding
    standards, best practices, and architectural guidelines:
    Utilize AI-powered code analysis tools to pre-scan code
    for potential bugs, security vulnerabilities, performance
    bottlenecks, and style deviations, allowing human
    reviewers to focus on higher-level logic and design.
  - Troubleshoot and resolve complex technical issues, ensuring
    the stability and performance of production systems:
    Implement AI-driven anomaly detection in monitoring
    systems, leverage AI for rapid log analysis and root cause
    identification, and automate incident response workflows.
  - Contribute to the strategic planning and technical roadmap
    for our middleware platforms: Employ AI to analyze
    industry trends, forecast technology evolution, assess the
    impact of new features, and prioritize roadmap initiatives
    based on data-driven insights.
  - Conduct tasks related to feasibility studies, time and cost
    estimates, IT planning, risk technology, applications
    development, and model development: Utilize AI for data
    synthesis, predictive modeling for estimations,
    identification of potential IT risks, and accelerated
    model prototyping and validation.
  - Monitor and control all phases of the development process
    (analysis, design, construction, testing, and
    implementation) and provide user and operational support:
    Implement AI-driven dashboards and reporting for real-time
    project health, automated progress tracking, and proactive
    identification of development lifecycle bottlenecks.
  - Utilize in-depth specialty knowledge of applications
    development to analyze complex problems/issues, provide
    evaluation of business process, system process, and
    industry standards, and make evaluative judgment: Augment
    human analytical capabilities with AI-powered data
    analysis and pattern recognition to rapidly assess complex
    scenarios and inform robust decision-making.
  - Recommend and develop security measures in post-
    implementation analysis of business usage to ensure
    successful system design and functionality: Use AI-driven
    security analysis tools to continuously monitor
    applications for vulnerabilities, predict potential
    threats, and recommend adaptive security controls.
  - Consult with users/clients and other technology groups on
    issues, recommend advanced programming solutions, and
    install and assist customer exposure systems: Employ AI to
    quickly understand user pain points, simulate solution
    impacts, and generate clear documentation or prototypes
    for client review.
  - Ensure essential procedures are followed and help define
    operating standards and processes: Utilize AI for
    automated compliance checks against defined procedures and
    for suggesting improvements to operational workflows based
    on performance data.
  - Serve as advisor or coach to new or lower-level analysts:
    Provide AI-assisted guidance and training resources,
    offering personalized feedback and access to extensive
    knowledge bases.
  - Appropriately assess risk when business decisions are made,
    demonstrating particular consideration for the firm's
    reputation and safeguarding Citigroup, its clients and
    assets: Leverage AI for advanced risk analytics, scenario
    planning, and compliance monitoring, enhancing the
    accuracy and foresight of risk assessments.
  
  Required Technical Skills:
  
  - Core Java: Strong understanding of Java (JDK 8+, preferably
    Java 11/17), including multithreading, collections,
    garbage collection, and JVM internals.
  - Frameworks: Extensive experience with Spring Framework
    (Spring Boot, Spring MVC, Spring Data JPA, Spring
    Security).
  - Middleware: Proven experience in designing and developing
    RESTful APIs and microservices.
  - Database Technologies (Must):
    - Relational Databases: Strong proficiency in SQL and
      experience with Oracle databases, including schema
      design, query optimization, and stored procedures.
    - NoSQL Databases: Experience with MongoDB, including data
      modeling, querying, and performance tuning.
  - CI/CD & DevOps: Hands-on experience with CI/CD tools and
    practices (e.g., Jenkins, GitLab CI, GitHub Actions,
    Maven/Gradle, Docker, Kubernetes).
  - Version Control: Proficiency with Git and standard branching
    strategies (e.g., Gitflow).
  - Testing: Experience with unit testing frameworks (JUnit,
    Mockito) and integration testing.
  - Web Technologies (Beneficial): Familiarity with web services
    (SOAP/REST), XML, JSON.
  - AI Tools & Methodologies (Must):
    - Demonstrable exposure and practical experience with AI
      development tools such as Devin, GitHub Copilot, Claude,
      Anti Gravity, and Codex.
    - Strong understanding of AI/ML concepts, prompt engineering,
      and integrating AI into software development workflows
      (e.g., for code generation, testing, debugging, and
      documentation).
    - A keen desire to apply AI technologies to improve software
      development processes and outcomes.
  
  Qualifications:
  
  - 7-12 years of relevant experience in applications
    development, with a strong emphasis on modern software
    engineering practices and AI integration.
  - Experience in systems analysis and programming of software
    applications, demonstrating success in leveraging AI for
    efficiency and quality.
  - Experience in managing and implementing successful projects,
    including those utilizing AI-driven development
    approaches.
  - Working knowledge of consulting/project management
    techniques/methods, adaptable to AI-accelerated project
    lifecycles.
  - AI certification is plus
  - Ability to work under pressure and manage deadlines or
    unexpected changes in expectations or requirements,
    utilizing AI tools for enhanced adaptability and problem-
    solving.
  
  Education:
  
  - Bachelor’s degree/University degree or equivalent
    experience.
  
