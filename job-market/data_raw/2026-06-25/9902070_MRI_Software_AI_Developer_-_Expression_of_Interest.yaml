description: |
  Role Overview
  
  As an experienced AI Developer and Team Lead, you will
  design, develop, and deploy AI/ML models across natural
  language processing (NLP), computer vision, and structured
  data. You will also architect AI services on Azure,
  integrate with MRI's global platform, and mentor junior AI
  engineers.
  
  Key Responsibilities
  
  - Design and build LLM-based applications and Retrieval-
    Augmented Generation (RAG) systems.
  - Develop and deploy traditional ML models (classification,
    regression, clustering) for property and financial data
    analytics.
  - Implement multi-modal AI solutions combining text, vision,
    and tabular data.
  - Architect Azure-based AI services using Kubernetes (AKS),
    serverless APIs, and MLOps best practices.
  - Lead AI experiments in Vision AI (OCR, layout analysis,
    document intelligence).
  - Mentor junior AI developers and participate in technical
    reviews.
  - Contribute to AI R&D for internal patents and innovations.
  - Collaborate with product, engineering, and cloud teams
    globally.
  
  Required Skills & Qualifications
  
  - 3+ year's experience in AI/ML development across NLP,
    Vision, or ML.
  - Expertise in LLMs (OpenAI, HuggingFace, Mistral), LangChain,
    and transformers.
  - Proficiency in traditional ML pipelines, model optimization,
    and feature engineering.
  - Strong software engineering background (Python, API
    development, microservices).
  - Experience deploying AI models in cloud environments (Azure
    preferred).
  - Hands-on experience with MLOps tools for versioning and
    deployment.
  - Exposure to vector databases (Pinecone, FAISS) and
    embeddings.
  - Strong leadership, mentorship, and team collaboration
    skills.
  
  Why Join MRI AI Team in India?
  
  - Shape the future of AI innovation in PropTech
  - Hands-on experience with modern AI/ML technologies and cloud
    platforms
  - Career growth opportunities within a fast-scaling AI-first
    organization
  - Work alongside global AI experts and cross-functional
    product teams
  
  Benefits:
  
  - Annual performance-related bonus
  - 6x Flexi Holidays: knock 2.5 hours off your day on any day.
  - Medical insurance coverage for extended family members.
  - Engaging, fun & inclusive culture: check out the MRI
    Software APAC Insta feed and stories!
  
