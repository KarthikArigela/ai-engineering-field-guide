description: |
  About Edra
  
  Edra is solving one of the hardest problems in enterprise
  AI: AI models are generic but company processes are
  specific. We build AI agents that learn how processes
  actually run, and then run their operations.
  
  We're a Series A startup, backed by Sequoia and other
  leading VC firms, and we're growing our team in New York and
  London. We're a deeply technical team of engineers, AI
  researchers, and strategists with a high bar for talent and
  a shared belief that exceptional people are the foundation
  of everything great we'll build.
  
  The Role
  
  We're building a learning system that teaches AI agents how
  enterprises actually work. Our system ingests knowledge
  bases, conversations, tickets, and system logs, then
  produces written instructions that agents can execute–with
  confidence scoring to know when to automate and when to seek
  human input.
  
  We're looking for AI Engineers who have built complex,
  production LLM-based systems. Whether you've scaled LLM
  workflows handling millions of requests, built multi-agent
  systems in production, or designed evaluation frameworks for
  enterprise deployments, we want people who bring intensity
  and self-direction to their craft. You'll work directly on
  our core learning library, ship features with real
  enterprise customers, and contribute back to the platform.
  The work spans continuous learning systems, agentic
  features, human-in-the-loop feedback loops, and agent
  orchestration.
  
  What You'll Do
  
  - Build and contribute to our core context learning library,
    implementing new learning capabilities with customers then
    generalizing them back into the platform
  - Design and implement LLM-powered systems and agentic
    workflows from concept to production
  - Work directly with enterprise customers to identify new
    problems, prototype solutions, and ship them to production
  - Build agentic features for knowledge management–think agents
    that can edit, update, and maintain large knowledge bases
    autonomously
  - Build reliability and confidence systems–evaluation
    frameworks, confidence scoring, and logic for when to
    automate vs. when to escalate to a human
  - Architect async, scalable systems that handle complex AI
    orchestration
  - Contribute to the direction of our AI strategy and product
    capabilities
  
  What We’re Looking For
  
  - You've built complex, production LLM-based systems with real
    depth–something with multiple layers of engineering
    decisions you can walk through in detail
  - You've shipped something meaningful to production and can
    explain how it evolved
  - You're excited by open-ended problems where the solution
    might not exist yet
  - You have experience with (or strong interest in) how systems
    learn and improve over time: human-in-the-loop feedback,
    prompt optimization and context engineering
  - You have experience building agents and autonomous systems
  - You can navigate between research papers and production code
    with equal comfort
  - You have 3+ years of professional experience
  - You're a strong communicator who can clearly explain their
    work, both to teammates and to customers
  
  Don’t meet all of the above traits? We’d still love to hear
  from you. We’re looking for exceptional people with unique
  skills and interests, and we know that great people have
  different backgrounds and skillsets.
  
  Learn More About Edra
  
  - Watch our Series A announcement video
  - Read our blog post from our launch
  - Learn more about what we're building
  
  A Few Details
  
  Edra is an equal opportunity employer and we encourage
  applications from individuals of all backgrounds. Edra does
  not discriminate on the basis of race, color, religion, sex,
  national origin, age, disability, genetic information,
  marital status, sexual orientation, gender identity, veteran
  status, or any other legally protected characteristic.
