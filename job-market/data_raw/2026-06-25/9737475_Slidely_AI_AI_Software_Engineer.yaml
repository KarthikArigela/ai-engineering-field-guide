title: AI Software Engineer
company: Slidely AI
location: Bengaluru, IND
work_type: FULL_TIME
company_size: 5 Employees
description: |
  Slidely is a PowerPoint AI assistant used by consulting
  companies and fortune 500 teams. A typical professional
  spends 1 to 3 hours in creating one slide. With Slidely,
  they create a v1 of their entire deck in 10 minutes, and
  make changes like “turn this table to a chart” in seconds
  directly within PowerPoint.
  
  In the next 2 years, our goal at Slidely is to forever
  change the way business presentations are made.
  
  Who are we?
  
  - small, strong team of 5
  - founders are CS graduates from IIT Kharagpur with a
    specialization in AI
  - work 6 days a week from our office in HSR Layout in
    Bangalore
  - funded by Y Combinator and other amazing investors
  - used by consulting companies and fortune 500 teams
  
  Your responsibilities (in order)
  
  - Solve some of our hardest and most interesting problems,
    such as managing large context lengths, context
    engineering, AI finetuning, LLM memory, indexing and
    semantic search and much more
  - Write, test and improve AI prompts
  - Design, implement, test, and deploy full features
  - Look at usage data to iterate on features
  
  What we’re looking for
  
  - Undergraduate or masters in Computer Science or equivalent
    degree
  - 2+ years of full-stack software engineering experience
  - Experience with TypeScript (JavaScript) or Python
  - Experience and intuition of AI prompting, features like tool
    calling, and evaluation
  
  You’ll be a good fit if
  
  - You want to work on a product that can change the way a very
    large number of people work
  - The chaos of high growth and things breaking is exciting to
    you
  - You are a workaholic, looking to upskill faster than most
    people think is possible. This role is not a good fit for
    you if you’re looking to prioritize work-life balance.
  - You prefer working in-person with other smart people who are
    excited and passionate about what they’re building
  - You love solving very hard problems at a rapid pace. We
    discuss timelines in days or weeks, so you’ll constantly
    be expected ship really high-quality work.
  
  Compensation
  
  - Total CTC: ₹40 Lac to ₹60.5 Lac
  - Cash: ₹20 lac - ₹30 lac, and equity:
  - Equity: ₹20 lac - ₹30 lac
  - Relocation assistance: Up to ₹50,000
  
  Perks
  
  - Comprehensive health insurance for you and dependents
  - Workstation enhancements
  - Subscriptions to AI tools such as Cursor, ChatGPT etc.
  
  (If there's anything else we can do to make your work more
  enjoyable, just ask)
  
  How to apply
  
  - Please apply using this Dover link
  - We will get back to you within 2 weeks if you move ahead to
    the next round
  - Please do not email or Linkedin individual members to share
    your resume or ask for updates
