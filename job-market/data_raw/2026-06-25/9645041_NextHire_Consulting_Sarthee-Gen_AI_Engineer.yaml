description: |
  GenAI Engineer
  
  EXP-2-5 Years
  
  Location - Bangalore  Full-Time
  
  Role and Responsibilities:
  
  Research and Development: Conduct extensive research to
  identify emerging AI technologies, techniques, and
  methodologies relevant to the organization's business
  objectives. Stay up to date with industry trends and
  advancements in AI.
  
  AI Solution Design: Collaborate with stakeholders to
  understand business requirements and translate them into AI
  solutions. Develop strategies and roadmaps for implementing
  AI solutions that align with business goals. Design,
  implement, and deploy AI-powered capabilities utilizing
  exploratory data analysis, model training, fine-tuning, and
  evaluation.
  
  Data Analysis: Analyze large and complex data sets to
  identify patterns, trends, and insights. Apply statistical
  analysis and machine learning algorithms to extract
  meaningful information and drive data-driven decision-
  making.
  
  Model Development: Build and optimize machine learning
  models, including supervised and unsupervised learning
  algorithms, natural language processing (NLP) models,
  computer vision models, and deep learning architectures.
  Leverage state-of-the-art AI technologies like Transformer
  Neural Networks, Embeddings, Vector Stores, RESTful APIs and
  Graph APIs and LLMs to solve security challenges. Fine-tune
  models for accuracy, efficiency, and scalability.
  
  Implementation and Integration: Implement AI models and
  solutions within the existing infrastructure, ensuring
  compatibility and integration with existing systems and
  processes. Collaborate with software engineers and IT teams
  to deploy AI solutions into production environments. Help
  the team in all aspects of building AI features from
  inception to productization to monitoring in production.
  
  Performance Monitoring and Optimization: Continuously
  monitor AI models and solutions to ensure optimal
  performance, accuracy, and efficiency. Identify and address
  performance bottlenecks and optimize AI models for real-time
  and scalable processing.
  
  Mentorship and Support: Support, mentor, and guide other
  engineers and data scientists. Partner closely with Data
  Science, Product Management teams to drive AI initiatives
  and ensure successful AI project delivery.
  
  Documentation and Reporting: Document AI models, algorithms,
  methodologies, and processes. Prepare reports and
  presentations to communicate findings, insights, and
  recommendations to stakeholders and management.
  
  Collaboration and Knowledge Sharing: Work collaboratively
  with cross-functional teams, including data scientists,
  software engineers, and business analysts, to drive AI
  initiatives. Share knowledge, best practices, and insights
  related to AI technologies and methodologies.
  
  Requirements:
  
  Education: Bachelor's or Master's degree in computer
  science, Data Science, or a related field. Relevant
  certifications in AI, machine learning, or data science are
  a plus.
  
  Technical Skills:
  
  - Strong programming skills in languages like Python, R,
  - C#, React, NextJS is a plus.
  - Proficiency in machine learning frameworks and libraries
    such as TensorFlow, PyTorch, or scikit-learn.
  - Experience with data visualization tools and techniques.
  - Experience in building with Autonomous Agents, Retrieval-
    Augmented Generation (RAG) technologies, LangChain, or
    Semantic Kernel.
  - Proficiency in cloud platforms such as AWS, Azure, and other
    similar technologies.
  
  Analytical Skills: Ability to analyze complex data sets,
  identify patterns, and derive meaningful insights. Strong
  knowledge of statistical analysis, predictive modeling, and
  machine learning algorithms.
  
