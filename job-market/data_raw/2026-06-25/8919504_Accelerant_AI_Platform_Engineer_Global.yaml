description: |
  About Accelerant
  
  Accelerant is a data-driven risk exchange connecting
  underwriters of specialty insurance risk with risk capital
  providers. Accelerant was founded in 2018 by a group of
  longtime insurance industry executives and technology
  experts who shared a vision of rebuilding the way risk is
  exchanged – so that it works better, for everyone. The
  Accelerant risk exchange does business across more than 20
  different countries and 250 specialty products, and we are
  proud that our insurers have been awarded an AM Best A-
  (Excellent) rating. For more information, please visit
  www.accelerant.ai.
  
  Role Summary
  
  The AI Platform Engineer is a senior, hands-on technical
  leader responsible for building production AI agents,
  reusable AI components, and cross-organizational AI
  implementations.
  
  This role works across squads, AI Guilds, and AI driven
  development initiatives to translate AI strategy into
  practical, scalable solutions.
  
  Core Responsibilities
  
  - Build production AI agents and services
  - Develop reusable AI components and workflows
  - Prototype and productionize AI use cases
  - Support development teams on AI implementations
  - Collaborate with Compliance and ARX PS teams
  - Co-own AI workflow environments (e.g., n8n) with DevOps
  - Contribute to AI pattern development alongside AI Platform
    Architect
  - Maintain reference implementations
  - Improve AI reliability and observability
  - Design and implement Retrieval-Augmented Generation (RAG)
    pipelines.
  - Implement prompt management, versioning, and evaluation
    tooling.
  - Establish AI observability, monitoring, and cost tracking
    practices.
  
  Operating Model
  
  - Works in close partnership with AI Platform Architect
  - Engages directly with development teams
  - Provides hands-on support for AI-driven Development
    initiatives
  - Contributes to AI standards evolution through implementation
    feedback
  
  Required Experience
  
  - 6–8+ years software engineering experience
  - Production AI implementation experience
  - LLM integration experience
  - Prompt engineering expertise
  - Experience building agents or AI workflows
  - Experience with vector databases and API orchestration
  - Strong systems thinking
  
  Location: Remote Flexible
