description: |
  Are you passionate about Automation and AI and eager to make
  a significant impact? We are seeking a highly motivated
  Automation & AI Solutions Lead with strong organizational
  and technical skills.You will work closely with architects,
  developers, and business stakeholders to translate real-
  world problems into robust AI systems. The role demands deep
  expertise in LangGraph, LangChain, and AWS-based
  deployments, with accountability from discovery through
  production. Success in this role means delivering reliable,
  scalable AI solutions that create measurable business
  impact. If you're excited to make real impact, apply now and
  be part of our innovative journey!
  
  About the Role
  
  In this role as an Automation and AI Developer, you will
  
  - Engage internal SMEs to understand current processes and as-
    is workflows — translate into buildable AI requirements.
  - Demo working solutions to internal stakeholders up to
    business leadership level.
  - Support the Architect during feasibility and POC phases —
    contribute to rapid builds and validate fit.
  - Maintain stakeholder communication throughout: progress
    updates, issue escalation, solution walkthroughs.
  - Co-invest with the Architect in upfront solution design —
    design robustness directly determines build speed and test
    quality.
  - Translate architecture into implementation plans — break
    down into assignable streams for Developer and Associate.
  - Own day-to-day technical decisions during build when the
    Architect is focused on other projects.
  - Identify architectural risks early and escalate before they
    become build or production problems.
  - Build complex solution components end-to-end on AWS
    AgentCore and LangGraph — hands-on coding role.
  - Scale solutions from POC to production: performance,
    reliability, monitoring, and cost management.
  - Debug production failures: hallucination patterns, retrieval
    degradation, agent loops, latency regressions.
  - Use AI coding tools (Claude Code, GitHub Copilot, Cursor,
    Cline) to accelerate delivery. Own all generated code.
  - Build Low Code automations (Copilot Studio, Power Automate)
    when use case and bandwidth allow.
  - Guide Developer and Associate through implementation, code
    reviews, and debugging.
  - Ensure the team uses AI tools effectively — accelerating
    delivery without sacrificing code understanding.
  - Work Mode: Hybrid - 3 days from office.
  - Shift Timing: 1pm IST to 10pm IST
  
  About You
  
  You’re a fit for the role of Automation and AI Developer, if
  your background includes:
  
  - Experience — 5–8 years total; 2–4 years production
    GenAI/LLM; 12–24 months multi-agent LangGraph; 3+ systems
    owned post-deployment.
  - LangGraph — multi-agent state machines, parallel execution,
    checkpointing, HITL — non-negotiable
  - AWS Bedrock — Model deployment, knowledge bases, guardrails.
  - Database & AI Data Access — SQL proficiency, NL-to-SQL, LLM-
    powered query layers. Snowflake a plus.
  - Systems Integration — REST API development, MCP awareness,
    enterprise system connectors.
  - Advanced RAG — Hybrid search, re-ranking, query
    reformulation, retrieval evaluation.
  - Evaluation Frameworks — RAGAS / TruLens, golden test sets,
    automated regression pipelines.
  - Observability — LangSmith or LangFuse — agent tracing,
    production debugging.
  - Python — Expert-level — design patterns, async, testing,
    CI/CD.
  - Multi-Model — OpenAI, Claude, Gemini, Llama — trade-offs at
    production scale.
  - Pro Code vs Low Code — Working knowledge of Copilot Studio
    and Power Automate; build when use case fits.
  - AI Development Tools — Claude Code, GitHub Copilot, Cursor,
    or Cline — accelerate delivery; own and fix all generated
    code.
  - Stakeholder Communication — Demo AI solutions to business
    stakeholders; translate SME knowledge into requirements.
  - AWS AgentCore Deep — All services hands-on.
  - MCP / A2A — Server/client production implementation.
  - Document Intelligence — OCR, layout-aware chunking.
  - Fine-Tuning — LoRA / QLoRA for domain adaptation.
  - Certifications — AWS ML Specialty, Azure AI Engineer, GCP ML
    Engineer.
  
  #LI-VGA1
  
  What’s in it For You?
  
  - Hybrid Work Model: We’ve adopted a flexible hybrid working
    environment (2-3 days a week in the office depending on
    the role) for our office-based roles while delivering a
    seamless experience that is digitally and physically
    connected.
  - Flexibility & Work-Life Balance: Flex My Way is a set of
    supportive workplace policies designed to help manage
    personal and professional responsibilities, whether caring
    for family, giving back to the community, or finding time
    to refresh and reset. This builds upon our flexible work
    arrangements, including work from anywhere for up to 8
    weeks per year, empowering employees to achieve a better
    work-life balance.
  - Career Development and Growth: By fostering a culture of
    continuous learning and skill development, we prepare our
    talent to tackle tomorrow’s challenges and deliver real-
    world solutions. Our Grow My Way programming and skills-
    first approach ensures you have the tools and knowledge to
    grow, lead, and thrive in an AI-enabled future.
  - Industry Competitive Benefits: We offer comprehensive
    benefit plans to include flexible vacation, two company-
    wide Mental Health Days off, access to the Headspace app,
    retirement savings, tuition reimbursement, employee
    incentive programs, and resources for mental, physical,
    and financial wellbeing.
  - Culture: Globally recognized, award-winning reputation for
    inclusion and belonging, flexibility, work-life balance,
    and more. We live by our values: Obsess over our
    Customers, Compete to Win, Challenge (Y)our Thinking, Act
    Fast / Learn Fast, and Stronger Together.
  - Social Impact: Make an impact in your community with our
    Social Impact Institute. We offer employees two paid
    volunteer days off annually and opportunities to get
    involved with pro-bono consulting projects and
    Environmental, Social, and Governance (ESG) initiatives.
  - Making a Real-World Impact: We are one of the few companies
    globally that helps its customers pursue justice, truth,
    and transparency. Together, with the professionals and
    institutions we serve, we help uphold the rule of law,
    turn the wheels of commerce, catch bad actors, report the
    facts, and provide trusted, unbiased information to people
    all over the world.
  
  About Us
  
  Thomson Reuters informs the way forward by bringing together
  the trusted content and technology that people and
  organizations need to make the right decisions. We serve
  professionals across legal, tax, accounting, compliance,
  government, and media. Our products combine highly
  specialized software and insights to empower professionals
  with the data, intelligence, and solutions needed to make
  informed decisions, and to help institutions in their
  pursuit of justice, truth, and transparency. Reuters, part
  of Thomson Reuters, is a world leading provider of trusted
  journalism and news.
  
  We are powered by the talents of 26,000 employees across
  more than 70 countries, where everyone has a chance to
  contribute and grow professionally in flexible work
  environments. At a time when objectivity, accuracy,
  fairness, and transparency are under attack, we consider it
  our duty to pursue them. Sound exciting? Join us and help
  shape the industries that move society forward.
  
  As a global business, we rely on the unique backgrounds,
