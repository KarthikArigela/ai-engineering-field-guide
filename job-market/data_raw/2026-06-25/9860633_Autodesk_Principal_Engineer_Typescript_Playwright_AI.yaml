description: |
  Job Requisition ID #
  
  25WD94110
  
  Position Overview
  
  Autodesk is seeking a highly motivated, experienced
  Principal Engineer to join high-impact teams building the
  next generation of AI-powered Software Test Lifecycle
  solutions for Cloud and Desktop applications. We are looking
  for a strong technical contributor with expertise in AI-
  powered test automation, cloud services, and AI agent
  development. As an ideal candidate, you have built scalable
  applications, intelligent testing platforms, and automation
  frameworks in fast-paced Agile environments. You are
  comfortable working across cloud, desktop, and web
  technologies and bring hands-on experience integrating AI-
  driven solutions into modern software development and
  quality engineering workflows. This is an exciting
  opportunity to contribute to the evolution of engineering
  excellence in a lean/agile environment and help deliver
  high-quality, innovative solutions.
  
  Responsibilities
  
  - Design and develop AI-powered software testing tools,
    platforms, and automation solutions across desktop and
    cloud environments.
  - Contribute to software design and architecture with a strong
    focus on scalable AI-powered test lifecycle solutions.
  - Develop and maintain end-to-end, integration, and agentic
    test automation solutions using Playwright, TypeScript,
    JavaScript, and Python.
  - Build and integrate AI agents and LLM-powered workflows for
    software testing, quality engineering, and developer
    productivity.
  - Leverage AWS cloud services to design scalable and resilient
    environments.
  - Embed automated testing and quality gates into CI/CD
    pipelines using Jenkins and modern DevOps practices.
  - Collaborate with stakeholders to define priorities,
    roadmaps, architecture, and delivery plans.
  - Drive engineering excellence by identifying automation
    opportunities and improving development and testing
    efficiency.
  - Work effectively in Agile teams using JIRA, XRAY, and
    related planning and reporting tools.
  - Evaluate and adopt modern AI-assisted engineering tools such
    as Cursor, Claude Code, Windsurf, and similar platforms to
    improve developer productivity
  
  Minimum Qualifications
  
  
  
  - BS degree in Computer Science, Software Engineering, or
    related field.
  - 9–14 years of professional experience in software
    development, test automation, or quality engineering.
  - Strong programming skills in TypeScript, JavaScript, and
    Python.
  - Hands-on experience with Playwright, Cypress, and Pytest.
  - Experience designing scalable test automation frameworks and
    engineering productivity tools.
  - Experience with AWS cloud services and cloud-native
    application architectures.
  - Strong understanding of CI/CD pipelines, Jenkins, Git, and
    DevOps practices.
  - Familiarity with Agile methodologies, defect tracking, and
    test management tools.
  - Excellent communication, collaboration, and leadership
    skills.
  
  AI Technical Skills
  
  - Experience building and deploying AI agents using LangGraph,
    CrewAI, AutoGen, or similar agent frameworks.
  - Hands-on experience with LLM integration, prompt
    engineering, RAG architectures, vector databases, and AI
    orchestration frameworks.
  - Ability to design and implement AI-driven software test
    lifecycle solutions for UI, API, integration, and system
    testing.
  - Strong Python programming skills, including async/await
    patterns and scalable API development using FastAPI.
  - Experience with MCP (Model Context Protocol) or similar
    agent communication frameworks.
  - Understanding of AI evaluation frameworks, guardrails,
    observability, and agent performance monitoring.
  - Working knowledge of AI-assisted development tools such as
    Cursor, Claude Code, Windsurf, GitHub Copilot, and similar
    platforms.
  - Experience integrating AI capabilities into SDLC, developer
    workflows, and quality engineering processes.
  
