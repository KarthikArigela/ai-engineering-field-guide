description: |
  The Opportunity As a CTIO - AI Engineer - Experienced
  Associate, you will leverage advanced analytics and
  statistical techniques to transform raw data into actionable
  insights, driving data-driven decision-making and business
  growth. Within our Internal Firm Services practice, you will
  focus on learning and contributing to client engagements and
  projects, developing your skills and knowledge to deliver
  quality work. You will be exposed to clients, learning how
  to build meaningful connections, manage and inspire others,
  and grow your personal brand by deepening your technical
  knowledge of firm services and technology resources. In this
  role at PwC, you will engage in exploratory and descriptive
  analysis, statistical modeling, and creating data
  visualizations to solve complex business problems and inform
  strategic decisions. You are expected to adapt to working
  with a variety of clients and team members, each presenting
  unique challenges and scope. Every experience is an
  opportunity to learn and grow, taking ownership and
  consistently delivering work that drives value for our
  clients and success as a team. As you navigate through the
  firm, you build a brand for yourself, opening doors to more
  opportunities. Responsibilities
  - Leveraging advanced analytics and statistical techniques to
    extract insights from large datasets
  - Designing and developing robust data solutions to transform
    raw data into actionable insights
  - Applying data science algorithms and machine learning
    techniques to solve complex business problems
  - Building data pipelines and confirming data quality for
    informed decision-making
  - Conducting exploratory and descriptive analysis to inform
    strategic decisions
  - Developing predictive models using programming languages
    such as R and MATLAB
  - Utilizing TensorFlow and Scikit-Learn for deep learning and
    natural language processing tasks
  - Collaborating with team members to adapt to varying client
    challenges and scopes
  - Taking ownership of projects and consistently delivering
    quality work that drives client value
  - Engaging in active listening and communication to appreciate
    diverse perspectives and needs
  - Upholding professional and technical standards while
    adhering to the Firm's code of conduct
  What You Must Have
  - At least a Bachelor's degree
  - At least 1 years of experience
  What Sets You Apart
  - Preference for at least one of the following fields of
    study: Accounting, Analytics/Data Science, Artificial
    Intelligence/Robotics, Business Administration/Management,
    Computer Science/Information Systems, Cybersecurity,
    Engineering, Mathematics/Statistics, Operations/Supply
    Chain, Project/Technology Management, Risk
    Management/Insurance
  - Demonstrating proficiency in data science algorithms and
    workflows
  - Utilizing machine learning and deep learning techniques
    effectively
  - Excelling in complex data analysis and predictive modeling
  - Applying programming skills in MATLAB and R for data
    solutions
  - Engaging in data-driven decision making and statistical
    analysis
  - Leveraging experience with TensorFlow and Scikit-Learn
    libraries
