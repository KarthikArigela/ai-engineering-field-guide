description: |
  Title:
  
  Senior Gen AI Developer
  
  Belong. Connect. Grow. with KBR!
  
  KBR’s National Security Solutions team provides high-end
  engineering and advanced technology solutions to our
  customers in the intelligence and national security
  communities. In this position, your work will have a
  profound impact on the country’s most critical role –
  protecting our national security.
  
  KBR is seeing a Senior Gen AI Developer to join our team in
  El Segundo, CA (remote).
  
   The MILSATCOM Systems Engineering, Integration, and Test
  (MSEIT) effort provides leading edge Systems Engineering &
  Integration (SE&I) for the US Space Force’s Space Systems
  Center (SSC). We support the Space Force’s acquisition of
  state-of-the-art satellite communications systems, providing
  global secure, survivable, and protected communications for
  our nation’s warfighters. We seek technical individuals who
  will thrive in a highly collaborative work environment of
  small teams, using the most modern tools and methodologies
  to tackle the challenges of integrating complex space and
  ground communications systems.
  
  Why Join Us?
  
  - Innovative Projects: KBR’s work is at the forefront of
    engineering, logistics, operations, science, program
    management, mission IT and cybersecurity solutions.
  - Collaborative Environment: Be part of a dynamic team that
    thrives on collaboration and innovation, fostering a
    supportive and intellectually stimulating workplace.
  - Impactful Work: Your contributions will be pivotal in
    designing and optimizing defense systems that ensure
    national security and shape the future of space defense.
  
  Work Environment:
  
  - Location: El Segundo, CA (Work-from-home flexibility with
    on-site support as required)
  - Travel Requirements: Minimal
  - Working Hours: Standard
  
  Qualifications:
  
  Required:
  
  - Ability to obtain and maintain a Secret security clearance
  - Bachelor’s degree in Computer Science, Software Engineering,
    Artificial Intelligence, or a related technical discipline
  - 15+ years of software development experience, including 3+
    years building generative AI or LLM-powered applications
  - Strong proficiency in Python for AI/ML development, data
    processing, and automation
  - Hands-on experience designing, developing, and deploying
    applications using large language models (LLMs)
  - Proven experience building and optimizing Retrieval-
    Augmented Generation (RAG) pipelines using embeddings,
    vector databases, and semantic search
  - Experience with prompt engineering, LLM orchestration, and
    developing agent-based workflows
  - Familiarity with LLM frameworks such as LangChain,
    LlamaIndex, or Semantic Kernel
  - Experience integrating AI solutions with enterprise data
    sources, APIs, and knowledge graphs
  - Ability to evaluate and fine-tune model outputs for quality,
    bias, explainability, and performance
  - Experience deploying and maintaining applications in cloud-
    native environments (Azure, Kubernetes, CI/CD pipelines)
  - Solid understanding of software development lifecycle (SDLC)
    and DevOps practices for production AI systems
  
  Desired:
  
  - Master’s in Computer Science, Artificial Intelligence, or a
    related field
  - Experience integrating knowledge graphs and graph databases
    (e.g., Neo4j, ArangoDB) into LLM-driven applications
  - Exposure to multi-modal AI models (text, image, audio) and
    their application in real-world systems
  - Experience building custom LLM evaluation pipelines and
    benchmarking frameworks
  - Familiarity with model optimization techniques or edge
    deployment for constrained environments
  - Experience deploying AI solutions in defense, government, or
    other high-security environments
  - Knowledge of responsible AI practices, including bias
    mitigation, explainability, and governance
  
  Basic Compensation:  $182,000 - $228,000 in California
  
  The offered rate will be based on the selected candidate’s
  knowledge, skills, abilities and/or experience and in
  consideration of internal parity.
  
  Ready to Make a Difference? If you’re excited about making a
  significant impact in the field of space defense and working
  on projects that matter, we encourage you to apply and join
  our team.
  
  KBR Benefits
  
  KBR offers a selection of competitive lifestyle benefits
  which could include 401K plan with company match, medical,
  dental, vision, life insurance, AD&D, flexible spending
  account, disability, paid time off, or flexible work
  schedule. We support career advancement through professional
  training and development.
  
  Belong, Connect and Grow at KBR At KBR, we are passionate
  about our people and our Zero Harm culture.  These inform
  all that we do and are at the heart of our commitment to,
  and ongoing journey toward being a People First company.
  That commitment is central to our team of team’s philosophy
  and fosters an environment where everyone can Belong,
  Connect and Grow. We Deliver – Together.
  
  KBR is an equal opportunity employer. All qualified
  applicants will receive consideration for employment without
  regard to race, color, religion, disability, sex, sexual
  orientation, gender identity or expression, age, national
  origin, veteran status, genetic information, union status
  and/or beliefs, or any other characteristic protected by
  federal, state, or local law.
