description: |
  At Board, we power financial and operational planning
  solutions for the world’s best brands. Thousands of
  enterprises use our technology to optimize resources, drive
  growth, and ensure profitability. With advanced analytics
  and forecasting, plus AI-driven insights, customers
  transform complex, real-time data into actionable
  intelligence. What’s been key to our success? Our people—we
  value everyone’s unique perspective and energy they bring to
  the organization. We collaborate openly across teams and
  borders. We embrace a growth mindset to get results. And we
  celebrate shared success as goals and milestones are
  achieved. Ready to join a team where innovation meets
  collaboration? If you're driven by bold ideas and a
  customer-centric mentality, your next adventure starts here!
  Role Overview We are seeking an FP&A Solution AI Developer
  to help embed AI capabilities into our FP&A solution
  strategy and assets. In this role, you will act as the
  primary resource for implementing AI use cases across FP&A
  solutions, working at the intersection of Board development,
  financial planning processes, and enterprise AI tools. You
  will help identify where AI can improve planning,
  forecasting, reporting, analysis, user guidance, automation,
  and decision support — then translate those opportunities
  into practical, scalable solution components. We are looking
  for someone with an AI-centric mindset: curious, hands-on,
  and enthusiastic about using AI as a core part of how work
  gets done. You should be highly skilled in prompting,
  understand how to apply prompt engineering best practices,
  and be comfortable working with common enterprise LLM tools
  such as ChatGPT, Claude, or similar platforms. This role is
  ideal for someone who can combine technical solution
  development, FP&A understanding, and AI experimentation to
  create reusable capabilities that can scale across customers
  and solution assets. Key Responsibilities
  
  - Act as the primary developer for AI use cases across FP&A
    solution assets and customer-ready frameworks.
  - Design, test, and implement AI-enabled features for
    planning, forecasting, reporting, analytics, insights, and
    user assistance.
  - Translate FP&A business needs into practical AI use cases,
    prompts, workflows, and solution components.
  - Develop and maintain prompt libraries, AI workflows,
    prototypes, demos, and reusable AI solution assets.
  - Work with Product Owners, Solution Architects, FP&A experts,
    and developers to embed AI into existing solution
    frameworks.
  - Test, validate, and refine AI outputs to ensure accuracy,
    relevance, usability, consistency, and business value.
  - Document AI use cases, prompting logic, usage guidelines,
    limitations, and enablement materials for internal and
    customer-facing teams
  
  Required Skills
  
  - Proven experience working with enterprise AI and LLM tools
    such as ChatGPT, Claude, Microsoft Copilot, Gemini, or
    similar platforms.
  - Excellent prompt engineering skills, including prompt
    design, testing, refinement, evaluation, and
    documentation. Ability to translate FP&A requirements into
    AI-enabled workflows, use cases, prototypes, and scalable
    solution components.
  - Strong understanding of AI output validation, including
    accuracy checks, hallucination risk, context quality, and
    business relevance.
  - Experience integrating AI into existing business, data,
    analytics, planning, or application frameworks.
  - Ability to work independently, experiment quickly, and turn
    AI concepts into practical deliverables.
  
  Preferred Skills
  
  - Basic understanding of FP&A processes such as budgeting,
    forecasting, financial planning, management reporting,
    variance analysis, and scenario modelling.
  - Experience working within an Enterprise Performance
    Management tools
