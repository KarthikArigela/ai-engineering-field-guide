description: |
  Established in 2011, Trinetix is a dynamic tech service
  provider supporting enterprise clients around the world.
  
  Headquartered in Nashville, Tennessee, we have a global team
  of over 1,000 professionals and delivery centers across
  Europe, the United States, and Argentina. We partner with
  leading global brands,
  
  delivering innovative digital solutions across Fintech,
  Professional Services, Logistics, Healthcare, and
  Agriculture.
  
  Our operations are driven by a strong business vision, a
  people-first culture, and a commitment to responsible
  growth. We actively give back to the community through
  various CSR activities and adhere to international
  principles for sustainable development and business ethics.
  
  To learn more about how we collect, process, and store your
  personal data, please review our Privacy Notice:
  https://www.trinetix.com/corporate-policies/privacy-notice
  
  About the Role
  
  We are looking for a Senior Full Stack Developer to join an
  AI-first engineering team focused on building modern
  enterprise web applications.
  
  This role is ideal for an experienced engineer who combines
  strong technical expertise with a passion for leveraging AI
  throughout the software development lifecycle. You will work
  in a highly autonomous environment, collaborating directly
  with technical and business stakeholders while helping shape
  a modern AI-driven delivery approach.
  
  Requirements
  
  - Design, develop, and maintain enterprise-grade web
    applications using .NET and Angular.
  - Participate in the end-to-end software development
    lifecycle, from requirements gathering to deployment.
  - Build scalable, secure, and maintainable solutions following
    enterprise architecture standards.
  - Work closely with clients, product owners, and delivery
    teams to understand business requirements.
  - Utilize AI-powered development tools and workflows to
    improve productivity, quality, and delivery speed.
  - Contribute to technical decision-making and architecture
    discussions.
  - Ensure compliance with enterprise and regulatory
    requirements.
  
  Must Have
  
  - 5+ years of commercial software development experience.
  - Strong experience with .NET and C#.
  - Experience with Angular.
  - Experience building and maintaining web applications in
    production environments.
  - Strong understanding of software architecture, design
    patterns, and best practices.
  - Ability to work independently with minimal supervision.
  - Experience using AI-powered development tools such as
    Cursor, GitHub Copilot, Claude, ChatGPT, Windsurf, or
    similar.
  - Experience integrating AI services and APIs into
    applications.
  - Hands-on experience with AI agents, LLMs, RAG solutions, or
    AI-assisted development workflows.
  - Personal or commercial AI-related projects.
  - Excellent communication skills in English.
  
  What We’re Looking For
  
  We are not necessarily looking for an AI Engineer. We are
  looking for a strong Senior Full Stack Developer who
  actively embraces modern AI-driven development practices,
  learns quickly, and is excited about building software in a
  new way.
  
  The ideal candidate is technically strong, highly
  independent, curious about AI, and comfortable working
  directly with clients and stakeholders.
  
  Benefits
  
  What we offer
  
  - Continuous learning and career growth opportunities
  
  - Professional training and English/Spanish language classes
  
  - Comprehensive medical insurance
  
  - Mental health support
  
  - Specialized benefits program with compensation for fitness
    activities, hobbies, pet care, and more
  
  - Flexible working hours
  
  - Inclusive and supportive culture
