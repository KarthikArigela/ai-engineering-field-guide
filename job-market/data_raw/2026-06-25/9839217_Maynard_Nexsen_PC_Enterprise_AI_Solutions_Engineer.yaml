job_id: 9839217
title: Enterprise AI Solutions Engineer
company: Maynard Nexsen PC
location: USA
work_type: FULL_TIME
description: |
  Summary
  
  Maynard Nexsen is accelerating AI adoption across its
  practice groups and operational departments. This role is
  the firm's primary builder: designing and delivering custom
  AI agents, automated workflows, and integrated solutions
  that move the firm's AI investments from pilot to production
  at scale.
  
  The Enterprise AI Solutions Engineer works directly with
  attorneys, practice group leaders, and administrative
  leadership to translate business requirements into durable,
  governed solutions built on the firm's approved platform
  stack. This is an execution-oriented role with a meaningful
  client-facing dimension. Equal weight is placed on technical
  depth and the ability to communicate clearly with non-
  technical stakeholders at all levels of the firm.
  
  Essential Job Functions
  
  - Design, build, and deploy custom AI agents and agentic
    workflows using Azure AI Foundry, Copilot Studio, and the
    firm's approved AI platforms, including legal AI research,
    drafting, and workflow platforms.
  - Develop and maintain API-based integrations across the
    firm's AI and enterprise systems, including Microsoft 365,
    enterprise document management systems, legal practice
    management platforms, and third-party legal AI tools.
  - Configure and manage Model Context Protocol (MCP) server
    implementations that extend AI surfaces with firm-specific
    tools, data connections, and governed workflows.
  - Engage directly with practice group leaders, department
    heads, and administrative teams to surface high-value
    automation opportunities and translate requirements into
    technical solutions.
  - Own the AI solutions delivery roadmap in coordination with
    the CIO and AI Steering Committee, including intake,
    prioritization, timelines, and post-deployment support.
  - Enforce data governance controls at every integration point
    in accordance with firm security, compliance, and data
    residency requirements.
  - Maintain architecture documentation, API credential
    governance, and change control processes in line with the
    firm's security and compliance standards.
  - Evaluate new AI platforms and agent frameworks against firm
    security, ethical wall, and data residency requirements
    before recommending adoption.
  - Serve as the firm's internal subject matter expert on AI
    agent development patterns, emerging tooling, and
    enterprise deployment best practices.
  
  Necessary Knowledge, Skills, and Abilities
  
  
  
  - Demonstrated experience building and deploying AI agents or
    agentic workflows in production environments.
  - Expert-level command of the Microsoft ecosystem: Azure AI
    Foundry, Copilot Studio, Power Platform, and Microsoft
    Graph API.
  - Strong proficiency with REST APIs, webhook-based
    integrations, OAuth, and API key governance.
  - Hands-on experience integrating with enterprise document
    management system APIs (legal DMS experience strongly
    preferred).
  - Direct experience with at least one legal AI platform (legal
    AI research, drafting, or workflow platforms).
  - Excellent written and verbal communication skills, with the
    ability to present technical solutions to attorneys and
    firm leadership without translation overhead.
  
  - Polished, professional presence appropriate for a client-
    facing role in a large law firm.
  
  Educational and Experience Requirements
  
  - 5+ years in enterprise AI engineering, solutions
    architecture, or API development roles.
  - Bachelor’s degree in computer science, AI, Computer
    Engineering, or related fields.
  - Background in legal technology, professional services, or a
    similarly compliance-sensitive enterprise environment.
  - Working knowledge of Model Context Protocol (MCP) server
    configuration and deployment.
  - Familiarity with ethical walls, conflict management systems,
    and matter-based security models.
  - Experience with large language model API integration and
    enterprise AI platform deployment.
  - Exposure to legal practice management or billing system APIs
    in an integration context.
  
  Work Environment and Physical Demands
  
  - Remote
  - Ability to work extended hours when necessary.
  - Normal office environment.
  
