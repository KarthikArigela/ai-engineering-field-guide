description: |
  AI/ML Senior Cloud Developer
  
  
  
  This role has been designed as ‘Hybrid’ with an expectation
  that you will work on average 2 days per week from an HPE
  office.
  
  Who We Are:
  
  Hewlett Packard Enterprise is the global edge-to-cloud
  company advancing the way people live and work. We help
  companies connect, protect, analyze, and act on their data
  and applications wherever they live, from edge to cloud, so
  they can turn insights into outcomes at the speed required
  to thrive in today’s complex world. Our culture thrives on
  finding new and better ways to accelerate what’s next. We
  know varied backgrounds are valued and succeed here. We have
  the flexibility to manage our work and personal needs. We
  make bold moves, together, and are a force for good. If you
  are looking to stretch and grow your career our culture will
  embrace you. Open up opportunities with HPE.
  
  Job Description:
  
  
  
  What you’ll do:
  
  Job Family Definition:
  
  The AI/ML Expert Engineer designs and builds scalable,
  production-grade AI/ML solutions for mission-critical cloud
  applications. This role requires ownership of the complete
  machine learning lifecycle, including data analysis, feature
  engineering, model development, deployment, monitoring, and
  continuous improvement.
  
  The engineer applies advanced technical expertise to
  architect, prototype, and implement AI/ML and GenAI-driven
  cloud solutions using modern MLOps practices for reliable,
  reproducible, and secure deployments.
  
  Management Level Definition:
  
  Applies advanced subject matter expertise to solve complex
  technical and business problems. Works independently on end-
  to-end AI/ML systems and contributes to architectural
  decisions. Provides technical leadership, mentors team
  members, and drives best practices across cross-functional
  teams.
  
  Key Responsibilities
  
  - Responsible for design and development of complex products
    and platforms, AI/ML based cloud applications. Solution
    design, analysis, coding, testing, and integration for
    building efficient, scalable and robust systems.
  - Should know the AI/ML technologies and have hands-on
    experience with GenAI-based software development
  - Define enterprise AI/ML architecture and technical strategy.
  - Architect scalable GenAI, Agentic AI, RAG, and GraphRAG
    solutions.
  - Establish AI governance, observability, evaluation, and best
    practices.
  - Lead AI platform design, deployment standards, and
    operational excellence.
  - Mentor engineers and drive innovation across AI initiatives.
  - Evaluate and adopt emerging AI technologies and frameworks.
  - Reviews and evaluates designs, test plans, and develops code
    for compliance with cloud design and development
    guidelines and standards.
  - Deploys code and troubleshoots issues in application modules
    and the deployment environment.
  - Represents the engineering team in various technical forums
    and provides guidance and mentoring to less-experienced
    team members.
  - Drives innovation and integration of new technologies into
    projects and activities in the software systems design
    organization.
  
  What you need to bring:
  
  Required Skills
  
  - Strong programming skills in Python (Pandas, Scikit, NumPy
    ), Golang and Scripting.
  - Advanced ML, DL, NLP, and LLM expertise
  - Agentic AI, Multi-Agent Systems, RAG, GraphRAG
  - Vector Databases and Hybrid Retrieval Architectures
  - Knowledge Graph Databases (Dgraph, Neo4j, Neptune, etc.)
  - AI Evaluation and Observability (Langfuse, Ragas,
    OpenTelemetry, Arize Phoenix)
  - MLOps/LLMOps and AI Platform Engineering
  - Kubernetes, Distributed AI Systems, Cloud AI Platforms
  - AI Governance, Responsible AI, and Security
  - Strong architecture, leadership, and stakeholder management
    skills
  - AWS, Azure, or GCP
  
  Education and Experience Required:
  
  - Bachelor's or master's degree in computer science,
    engineering, information systems, or closely related
    quantitative discipline.
  - Typically, 8-10 years’ hands-on experience in mentioned
    technologies,
  
  Additional Skills:
  
  Cloud Architectures, Cross Domain Knowledge, Design
  Thinking, Development Fundamentals, DevOps, Distributed
  Computing, Microservices Fluency, Full Stack Development,
  Release Management, Security-First Mindset, User Experience
  (UX)
  
  What We Can Offer You:
  
  Health & Wellbeing
  
  We strive to provide our team members and their loved ones
  with a comprehensive suite of benefits that supports their
  physical, financial and emotional wellbeing.
  
  Personal & Professional Development
  
  We also invest in your career because the better you are,
  the better we all are. We have specific programs catered to
  helping you reach any career goals you have — whether you
  want to become a knowledge expert in your field or apply
  your skills to another division.
  
  Unconditional Inclusion
  
  We are unconditionally inclusive in the way we work and
  celebrate individual uniqueness. We know varied backgrounds
  are valued and succeed here. We have the flexibility to
  manage our work and personal needs. We make bold moves,
  together, and are a force for good.
  
  Let's Stay Connected:
  
  Follow @HPECareers on Instagram to see the latest on people,
  culture and tech at HPE.
  
