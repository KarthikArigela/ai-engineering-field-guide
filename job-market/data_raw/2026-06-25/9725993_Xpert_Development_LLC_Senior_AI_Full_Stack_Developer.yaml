title: Senior AI Full Stack Developer
company: Xpert Development LLC
location: USA
work_type: FULL_TIME
description: |
  Location: US – 100% Remote
  
  Salary: $150,000 - $200,000 base salary + equity
  
  Overview
  
  We are seeking a dynamic and passionate AI Full Stack
  Developer to join our innovative engineering team. In this
  role, you will design, develop, and maintain scalable AI-
  powered applications across both frontend and backend
  systems. You will work on cutting-edge technologies
  including agentic AI systems, LLM integrations, retrieval
  augmented generation (RAG), and modern cloud-native
  architectures. Your contributions will directly shape the
  user experience, platform scalability, and overall technical
  direction of the product. If you thrive in a fast-paced
  environment and enjoy building impactful AI-driven solutions
  from concept to production, this is an exciting opportunity
  to make a difference.
  
  Responsibilities – AI Full Stack Developer
  
  - Design and build end-to-end features for a composite AI
    platform, including frontend interfaces, backend services,
    agent-based systems, LLM integrations, and RAG pipelines.
  
  - Develop scalable and responsive web applications using
    modern frontend frameworks and backend technologies.
  
  - Define and own the technical vision and roadmap for the
    platform, making architectural decisions that enable
    scalability, reliability, and long-term evolution.
  
  - Build APIs, microservices, and cloud-native infrastructure
    to support AI-powered applications.
  
  - Collaborate closely with product, design, and engineering
    teams to deliver intuitive and high-impact user
    experiences.
  
  - Establish and promote engineering best practices, coding
    standards, architectural patterns, and AI-assisted
    development techniques to ensure system quality at scale.
  
  - Act as a senior technical leader, providing guidance on
    complex engineering and architectural trade-offs while
    shaping the overall technical direction.
  
  - Optimize application performance, security, observability,
    and scalability across the full stack.
  
  - Develop high-impact software solutions to solve complex,
    mission-critical business problems.
  
  Requirements – AI Full Stack Developer
  
  - Deep experience designing and operating large-scale,
    production-grade full stack applications with a strong
    understanding of distributed systems.
  
  - Strong proficiency in frontend technologies such as React,
    Next.js, TypeScript, HTML/CSS, and modern UI frameworks.
  
  - Strong proficiency in backend technologies including Python
    and Go for building scalable backend services and APIs.
  
  - Hands-on experience integrating LLMs, AI agents, vector
    databases, and RAG architectures into production
    applications.
  
  - Experience building and deploying cloud-native applications
    using AWS, GCP, or Azure.
  
  - Demonstrated ability to build and own software from 0-to-1,
    taking systems from initial concept through production and
    ongoing ownership.
  
  - Proven ability to influence technical direction and
    architecture at a senior or cross-team level.
  
  - Familiarity with CI/CD pipelines, containerization
    technologies (Docker/Kubernetes), and modern DevOps
    practices.
  
  - Strong understanding of database systems, caching, and
    system performance optimization.
  
  - Ability to clearly connect engineering decisions to business
    and product outcomes.
  
  - Excellent communication and collaboration skills in cross-
    functional environments.
  
  Benefits
  
  - 401(k)
  
  - Employee assistance program
  
  - Health insurance
  
  - Competitive equity package
  
  - Fully remote work environment
