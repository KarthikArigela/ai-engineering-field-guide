  paced setting, we’d love to hear from you! Tasks * Help and
  guide the team to succeed with their goals of automating the
  decision making during the supplier search. Be in charge of
  AI and Agentic Architecture from training to inference,
  ensure stable performance, quality and integration with
  other components of internal software. Continuous
  improvements of models in all aspects based on stakeholder
  requirements and develop new AI solutions * Develop scalable
  AI agents with Langgraph and NLP pipelines * Develop RAG
  systems using vector databases * Apply system design
  thinking for E2E solutions * Ensure seamless integration
  into the Alpas platform * Apply agentic workflow patterns *
  Implement MLOps pipelines for ML models * Optimize for model
  performance and inference efficiency * Maintain codebase and
  adopt good practices * Train and evaluate pytorch NLP models
  * Research and adapt new AI tech developments * Benchmark
  models and solutions * Support and mentor junior engineers *
  Less than 1% failures for search AI agent * Scalable &
  reliable integration among agents as well as agents &
  backend * Build monitoring pipeline for all AI agents at
  scale * Control cost of agentic workloads * Meet quality
  targets Requirements _If you don’t fit all the requirements,
  don’t be discouraged from applying. We are looking for the
  willingness to learn more than specific skills._ *
  Experience: * MLE/MLOPs/Software Engineer (Machine
  Learning)/Backend Engineer (ML/AI)/ SWE Data/DE/ML Platform
  Engineer/AI Engineer * 4-6 years experience * Technical
  Skills: * Python, PyTest * Argo, PubSub, CI/CD, Docker,
  FastAPI * Pandas, Scikit, Pytorch, SciPy * MLOps tools:
  MLFlow, KubeFlow, KServe or similar * Soft Skills: * End-to-
  end project ownership * Creative problem solving * Research
  skill and learning agility * Strategic thinking * Teamwork *
  Communication * Time management * Language: Fluency in
  English (C1 level) * Nice-to-Have: * NLP experience, LLMs *
  GCP (VertexAI, CloudRun, CloudFunctions), Azure AI or
  similar in other platforms * Kubernetes, Terraform *
  Software Engineering practices, BE/FE understandings
  Benefits Work on an AI-core product, develop cutting-edge ML
  models and NLP systems for automating the supplier search
  that drive innovation and deliver real impact * High
  ownership and responsibility to manage your own projects *
  See your work deliver immediate results for stakeholders and
  collaborate closely with our Product team * Work in a fast-
  paced environment with challenging tasks (zero-boredom-
  guarantee) * Rapid development with a steep learning curve *
