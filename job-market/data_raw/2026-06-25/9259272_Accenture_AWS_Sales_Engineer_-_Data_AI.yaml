description: |
  We Are:
  
  Accenture is a leading global professional services company
  that helps the world’s leading businesses, governments and
  other organizations build their digital core, optimize their
  operations, accelerate revenue growth and enhance citizen
  services—creating tangible value at speed and scale. We are
  a talent- and innovation-led company with approximately
  790,000 people serving clients in more than 120 countries.
  
  A leading partner to the world’s major cloud providers,
  including AWS, Azure, and Google and Private Cloud leaders
  like IBM, Dell, HPE, RedHat. The formation of Accenture
  Cloud First, with a $3 billion investment over three years,
  demonstrates our commitment to deliver greater value to
  our clients when they need it most and offers huge growth
  opportunities for you!
  
  Our Cloud First group of more than 150,000 cloud
  professionals delivers a full stack of integrated cloud
  capabilities across data, edge, integrated infrastructure
  and applications, deep ecosystem skills, culture of change
  along with a deep industry expertise to shape, move, build
  and operate our clients’ businesses in the cloud.  To
  accelerate our customers transformation leveraging omni
  cloud, we combine world-class learning and
  talent development expertise; deep experience in cloud
  change management; and cloud-ready operating models with a
  commitment to responsible business by design — with
  security, data privacy, responsible use of artificial
  intelligence, sustainability and ethics and compliance built
  into the fundamental changes Accenture helps companies
  achieve.
  
  The Work:
  
  You’ll own the end-to-end definition, build, and scaling of
  reusable, revenue-generating cloud and AI offerings. You’ll
  be responsible for aligning platform capabilities, industry
  priorities, and commercialization strategy to drive
  measurable business impact and scalable IP.
  
  Core Responsibilities:
  
  Offering Strategy & Portfolio Ownership:
  
  - Define 12–24 month roadmap aligned to Cloud First
    priorities.
  - Identify repeatable, scalable solution patterns.
  - Define monetization model (accelerator, managed service, AI-
    as-a-Service).
  
  Technical Architecture & Differentiation
  
  - Establish reference architectures and solution blueprints.
  - Ensure production-grade design and Responsible AI alignment.
  - Avoid duplication across Data & AI and Cloud teams.
  
  Go-to-Market & Commercialization
  
  - Package offerings for sales activation (playbooks, pricing,
    demos).
  - Partner with Business Groups to drive pipeline.
  - Track revenue contribution and adoption metrics.
  
  Hyperscaler & Ecosystem Alignment
  
  - Act as primary interface with respective Business Group.
  - Drive joint co-innovation and co-investment motions.
  
  Governance & Scale
  
  - Establish KPIs (revenue, reuse, deployments).
  - Ensure security, compliance, and Responsible AI adherence.
  
  Travel may be required for this role.  The amount of travel
  will vary from 0 to 100% depending on business need and
  client requirements.
  
  Here’s What You Need:
  
  - Minimum 12 years of experience leading cloud and Data & AI
    solutions, including ownership of reusable, multi-client
    offerings spanning solution definition, architecture, and
    go-to-market execution.
  - Minimum 5 years of experience with AWS, including a
    combination of hands-on solution architecture and pre-
    sales or offering solutioning experience across Data & AI
    services (e.g., SageMaker, Bedrock, Redshift, Glue, EKS).
  - Bachelor's degree or equivalent (minimum 12 years) work
    experience. (If Associate Degree, must have minimum 6
    years work experience)
  
  Professional Skills Requirements:
  
  - Proven ownership and scaling of multi-client, revenue-
    generating cloud or AI offerings.
  - Strong commercial and go-to-market acumen, including
    experience supporting sales enablement, deal shaping, and
    pipeline development.
  
  Compensation at Accenture varies depending on a wide array
  of factors, which may include but are not limited to the
  specific office location, role, skill set, and level of
  experience. As required by local law, Accenture provides a
  reasonable range of compensation for roles that may be hired
  as set forth below. We anticipate this job posting will be
  posted until 06/24/2026.
  
  Accenture offers a market competitive suite of benefits
  including medical, dental, vision, life, and long-term
