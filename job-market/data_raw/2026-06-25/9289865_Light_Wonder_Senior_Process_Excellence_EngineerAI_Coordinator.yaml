title: Senior Process Excellence Engineer/AI Coordinator
company: "Light & Wonder"
location: USA
work_type: FULL_TIME
description: |
  Corporate:
  
  Light & Wonder’s corporate team is comprised of incredible
  talent that works across the enterprise, defying boundaries
  to provide essential services in an extraordinary manner to
  ensure the success of the organization and the well-being of
  employees.
  
  Position Summary
  
  Light & Wonder is seeking a highly skilled and results-
  driven Senior Process Excellence Engineer to serve as a
  dual-role leader — driving Lean transformation across the
  full enterprise value stream while simultaneously
  coordinating and managing AI-enabled continuous improvement
  initiatives. This is a senior individual contributor and
  project leadership role that will partner with Operations,
  Finance, HR, Accounting, Procurement, and Technology teams
  to eliminate waste, accelerate throughput, and embed a
  culture of sustainable operational excellence.
  
  Las Vegas is strongly preferred, with a hybrid onsite
  schedule, and relocation assistance provided. The ideal
  candidate brings deep expertise in Lean methodology,
  facilitation, and Value Stream Mapping, combined with a
  working knowledge of agentic AI tools and intelligent
  automation. They will have a proven track record of leading
  large-scale, cross-functional deployments from strategy
  through sustainment — and will be comfortable operating
  across organizational boundaries at all levels of the
  business.
  
  Qualifications
  
  KEY RESPONSIBILITIES
  
  Lean Leadership & Transformation
  
  - Lead end-to-end Lean transformation initiatives across all
    value stream functions including Operations, Finance, HR,
    Accounting, and Procurement.
  - Design, facilitate, and execute workshops to identify and
    prioritize improvement opportunities across current and
    future state maps.
  - Drive Kaizen events, rapid improvement workshops, and
    structured problem-solving activities (A3, DMAIC, 8D) at
    multiple organizational levels.
  - Coach and mentor cross-functional teams, front-line staff,
    and leadership on Lean principles, waste identification,
    and continuous improvement culture.
  - Establish and track KPIs and performance metrics to validate
    the impact of Lean initiatives and ensure sustained
    results.
  
  AI Coordination & Project Management
  
  - Serve as the AI Coordinator for the Process Excellence
    function — identifying opportunities to integrate AI
    tools, machine learning models, and agentic workflows into
    improvement projects.
  - Leverage working knowledge of agentic AI platforms to
    prototype, pilot, and scale intelligent automation
    solutions that complement Lean improvements.
  - Manage a portfolio of concurrent process improvement and AI-
    enabled projects using structured portfolio and project
    management frameworks (PMI, Agile/hybrid).
  - Develop project charters, roadmaps, resource plans, risk
    registers, and communication plans for large-scale
    transformation programs.
  - Track and report on project status, milestones, and business
    outcomes to senior leadership and executive sponsors.
  - Partner with IT, Data, and Digital teams to ensure AI tool
    integration aligns with enterprise architecture, data
    governance, and compliance standards.
  
  Facilitation & Stakeholder Engagement
  
  - Design and lead highly effective facilitation sessions with
    diverse stakeholder groups ranging from front-line
    employees to C-suite executives.
  - Build and maintain strong relationships across Operations,
    Finance, HR, Accounting, Procurement, and Technology to
    ensure alignment and sponsorship.
  - Champion a culture of psychological safety, collaborative
    problem-solving, and accountability within improvement
    teams.
  - Develop training materials, playbooks, and standard work
    documentation to institutionalize process excellence
    capabilities across the organization.
  
  REQUIRED QUALIFICATIONS
  
  Education & Certification
  
  - Bachelor’s or Master’s degree preferred.
  - Lean certification and/or Six Sigma Black Belt (LSSBB)
    certification required; Master Black Belt (MBB)
    designation a strong plus.
  
  Qualifications/Essential Job Functions
  
  - Minimum of 5–10 years of progressive experience in process
    excellence, continuous improvement, or operational
    transformation roles.
  - Demonstrated experience leading large-scale, enterprise-wide
    Lean deployments involving multiple business functions,
    geographies, and hundreds of stakeholders.
  - Proven track record of leading Lean transformation beyond
    Operations — must include documented results in
    transactional and administrative functions such as
    Finance, HR, Accounting, and Procurement.
  - Experience leading and developing cross-functional teams in
    a matrixed organization, including influencing without
    direct authority.
  - Experience managing a project portfolio simultaneously,
    balancing resources, priorities, and executive stakeholder
    expectations.
  - Hands-on experience with AI tools such as large language
    models, agentic automation frameworks, or machine learning
    operations (MLOps) platforms.
  - Experience implementing Lean management systems (e.g.,
    Obeya, real-time KPI dashboards, AI-augmented daily
    management).
  - Experience with ERP systems (SAP, Oracle, or equivalent) and
    understanding of system-related process improvement
    constraints.
  - Strategic mindset and strong business acumen, with the
    ability to identify priority value opportunities by
    leveraging exceptional problem-solving and decision-making
    skills.
  - This is a Remote position with frequent travel to support
    Lean transformation and AI Sprints.
  
  The targeted pay range for this role is $140,000-$150,000.
  The total compensation package for this position may also
  include applicable incentive compensation, such as an annual
  performance bonus. Actual compensation packages are based on
  several factors that may include, but are not limited to
  skill set, depth of experience, specific work geography, as
  well as internal equity and alignment with market data.
  
  Work Conditions:
  
  The physical demands and work environment characteristics
  described here are representative of those that must be met
  by an employee to successfully perform the essential
  functions of this job. While performing the duties of this
  job, the employee is regularly required to sit, stand, walk,
  bend, use hands, operate a computer, and have specific
  vision abilities to include close and distance vision, and
  ability to adjust focus working with computer and business
  equipment. Reasonable accommodations may be made to enable
  individuals with disabilities to perform the essential
  functions.
  
  Light & Wonder and its affiliates (collectively, “L&W”) are
  engaged in highly regulated gaming and lottery businesses.
  As a result, certain L&W employees may, among other things,
  be required to obtain a gaming or other license(s), undergo
  background investigations or security checks, or meet
  certain standards dictated by law, regulation, or contracts.
  In order to ensure L&W complies with its regulatory and
  contractual commitments, as a condition to hiring and
  continuing to employ its employees, L&W requires all its
  employees to meet those requirements that are necessary to
  fulfill their individual roles.  As a prerequisite to
  employment with L&W (to the extent permitted by law), you
  shall be asked to consent to L&W conducting a due
  diligence/background investigation on you.
  
