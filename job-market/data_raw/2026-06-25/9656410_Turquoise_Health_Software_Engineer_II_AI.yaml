description: |
  This is a full remote role within the United States.
  Preference is for this person to be based in Chicago.
  
  We are looking for a Software Engineer to join our AI team
  and help eliminate the financial complexity of healthcare.
  This role is for engineers who are motivated by highly
  visible, high-impact work and excited to build and operate
  AI-enabled systems. You’ll work closely with senior
  engineers, learning firsthand how they build and ship in a
  startup environment. This is a role to grow quickly,
  contributing to AI-enabled features and workflows.
  
  Responsibilities
  
  - Build and maintain customer-facing features that are
    integrated into core product workflows
  - Contribute to internal services relied on by other engineers
  - Collaborate closely with teammates and communicate progress
  - Help ship AI-enabled features and workflows
  
  Here’s what you bring to the role:
  
  - Detail-oriented mindset, seeking to understand a problem
    before shipping the solution
  - 2+ years of experience with Python in a professional
    environment
  - Working knowledge of SQL and relational databases
  - Strong analytical ability to break down problems and turn a
    spec into a working solution
  - Resourceful in learning tools to unblock yourself as needed
  - Genuine curiosity and interest in the AI/ML space
  - Clear and proactive communication. You ask questions early
    and share your progress
  
  Benefits:
  
  - Competitive pay with equity options
  - Stellar health care plan options (Medical, Dental & Vision),
    with FSA, DCFSA, & HSA options
  - Company-sponsored disability & life insurance
  - Unlimited PTO
  - 401(k) + 4% Matching
  - Fully remote work + flexible working hours
  - $750 work-from-home setup budget
  - Paid biannual in-person company summits
  - Quarterly $150 co-hanging stipend to meet up with coworkers
  - Monthly $100 health and wellness benefit
  - Generous paid family leave
  - Annual $1,200 learning & development stipend
  
  About Turquoise Health
  
  Turquoise Health is a Series C price transparency platform
  for finance leaders across healthcare. Backed by a16z, Oak
  HC/FT, Adams Street, Yosemite, Bessemer Venture Partners,
  and others, we power price transparency for 300+ enterprise
  organizations and are building the infrastructure for a more
  open, efficient healthcare marketplace. We're a remote-
  first, US-based team that values transparency, empathy,
  inclusivity, creativity, and ownership.
  
  We operate on US business hours and work with clients
  entirely based in the US. For this role, we are seeking US-
  based candidates.
  
  We strongly encourage BIPOC, people with disabilities, and
  LGBTQIA+ folks to apply for any open roles of interest.
  Healthcare affects all people differently, but it
  significantly affects those in underserved communities. With
  a robust, diverse team, we are stronger and better equipped
  to change the future of healthcare for all.
  
