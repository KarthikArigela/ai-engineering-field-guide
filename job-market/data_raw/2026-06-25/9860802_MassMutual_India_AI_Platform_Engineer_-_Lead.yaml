  Job Description
  
  Job Title: Platform Engineer LeadLocation: Hyderabad
  
  - 8+ years in platform, infrastructure, or SRE — with a track
    record as a technical lead or staff-level IC with team-
    wide technical scope.
  - Deep expertise in cloud-native architecture: Kubernetes at
    scale, managed cloud services, networking, identity
    federation, and multi-tenancy patterns across AWS, GCP, or
    Azure.
  - Proven ownership of complex, multi-month platform
    initiatives — you’ve driven them from whiteboard to
    production, managing ambiguity and technical risk
    throughout.
  - Strong IaC and GitOps fluency — Terraform or Pulumi, ArgoCD
    — with experience standardising platform tooling and
    deployment patterns across engineering teams.
  - Hands-on experience with AI/ML infrastructure: model
    serving, inference pipelines, GPU resource management, or
    LLM integration patterns.
  - Ability to lead through technical credibility — influencing
    design decisions, driving alignment, and raising quality
    without authority over anyone.
  - Experience in enterprise environments with familiarity with
    compliance frameworks such as SOC 2, ISO 27001, or GDPR.
  - Strong written communication — you write clear design docs,
    maintain useful ADRs, and can explain architectural
    decisions to both engineers and non-technical
    stakeholders.
  
  Certifications:1. Kubernetes Certification - Mandatory2. AWS
