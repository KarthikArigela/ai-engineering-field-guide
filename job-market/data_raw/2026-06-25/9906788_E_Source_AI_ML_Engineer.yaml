title: AI / ML Engineer
company: E Source
location: USA
work_type: FULL_TIME
description: |
  At E Source, we help utilities make sense of complexity in a
  rapidly changing landscape, and we’re looking for an AI / ML
  Engineer to help shape how that impact shows up in the
  world.
  
  E Source is a research, data/analytics, and technology
  focused professional services firm focused exclusively on
  the utility industry in the US and Canada. We help utilities
  target and serve their customers more effectively, enhance
  and optimize their grid, and leverage operating best
  practices and technologies to manage their business more
  effectively. Headquartered in Texas, we have 450+ employees
  across the US and Canada. Learn more at www.esource.com
  
  Joining E Source as a Senior AI/ML Engineer is an exciting
  opportunity to work with a dynamic and talented team,
  leveraging your skills to drive meaningful impact in the
  utility industry. You’ll contribute to the next generation
  of AI and ML solutions that blend predictive modeling,
  optimization, and generative reasoning to empower
  sustainable decisions.
  
  If you are a self-motivated engineer who thrives in a
  collaborative, innovative environment, and if you’re
  passionate about building intelligent, scalable AI/ML
  systems, we invite you to apply and help shape the future of
  utilities.
  
  As a Senior AI/ML Engineer at E Source, you’ll play a
  crucial role in our machine learning engineering team.
  Collaborating with data scientists and software engineers,
  you’ll contribute to the development of cutting-edge ML and
  AI products that support our mission of building a
  sustainable future with utilities.
  
  Your expertise will be instrumental in building tools and
  pipelines for developing and scaling machine-learning
  models, including emerging AI system design components and
  agentic architectures. You’ll work across a range of use
  cases—like electrification, network reliability, geospatial
  analysis, time series forecasting, image and text
  processing, and AI-driven decision systems—using both
  traditional ML and modern generative AI approaches.
  
  In this role, you will:
  
  - Collaborate with cross-functional teams to design, develop,
    and deploy scalable software products that incorporate
    machine learning and AI models.
  - Build reusable Python packages to support the implementation
    of ML/AI algorithms and data-processing pipelines.
  - Contribute to the design of AI systems, including components
    for retrieval-augmented generation (RAG), LLM integration,
    and agent-based workflows.
  - Develop agentic evaluation and monitoring frameworks to
    assess model reasoning, consistency, and fairness.
  - Evaluate database design and create optimized performance
    queries for efficient data processing and retrieval.
  - Break down complex MLE and AI tasks into manageable user and
    technical stories, ensuring efficient and effective
    implementation.
  - Ensure high-quality test coverage of ML code and participate
    in peer reviews to provide valuable recommendations.
  - Stay updated on the latest advances in machine learning
    engineering, generative AI, and AI system orchestration,
    and incorporate relevant practices into our workflows.
  - Contribute to continuous delivery and Agile development
    processes, adhering to best practices in ML and AI
    engineering.
  
  You’re likely a great fit if you:
  
  - Master’s degree in computer science, software engineering,
    data science, or a related field (PhD preferred).
  - Minimum of 7 years of professional experience designing,
    developing, and deploying machine learning software
    products independently and collaboratively.
  - Strong programming skills in Python, with experience
    developing reusable packages and automation tools.
  - Familiarity with Databricks for scalable data processing and
    collaborative analytics.
  - Solid understanding of machine learning systems design
    concepts, including model lifecycle management, MLOps, and
    scalable inference.
  - Hands-on experience with cloud infrastructure (Azure, AWS,
    or GCP), containerization, and CI/CD pipelines.
  - Proficiency with distributed computing frameworks, machine
    learning packages, and both relational and nonrelational
    databases.
  - Familiarity with generative AI tools and frameworks (e.g.,
    AutoGen, Hugging Face, LangChain, LangGraph, LlamaIndex)
    and their integration into enterprise pipelines.
  - Experience developing or evaluating agentic AI systems, AI
    orchestration, or AI-assisted decision-making workflows is
    an asset.
  - Excellent problem-solving and analytical skills, with the
    ability to break down complex tasks into actionable steps.
  - Strong communication and collaboration skills, with a track
    record of working effectively in cross-functional teams.
  - Knowledge or experience in the utility, power, or energy
    sectors is a plus.
  - Deep knowledge in Databricks tech stack for AI and data
    engineering is a plus.·
  
  At E Source, you’ll work alongside people who are
  thoughtful, curious, and deeply knowledgeable about utility
  and energy systems. We value clarity over jargon, substance
  over flash, and collaboration over ego. You’ll have the
  opportunity to grow your skills, contribute to meaningful
  work, and help shape a company that plays a real role in how
  the energy future unfolds.
  
  What you can expect
  
  - Excellent insurance options, including medical, dental, and
    vision plans; company-paid life insurance; company-paid
    long- and short-term disability insurance; medical and
    dependent-care flexible spending plans, and paid parental
    leave.
  - A flexible time off (FTO) policy that provides paid time
    away from work, approved by your manager, while ensuring
    business needs, workload commitments, and appropriate
    coverage are maintained.
  - A 401(k)/RRSP plan with a 3% employer match.
  
  The budgeted salary for this position is $115,000–$145,000
  USD + annual bonus. Actual pay will be adjusted based on
  experience.
  
  This role will be 100% remote, with infrequent travel
  (generally 1–2 times per year).
  
  Applicants must be authorized to work for any employer in
  the US or Canada. We’re unable to sponsor or take over
  sponsorship of employment visas or Labour Market Impact
  Assessments (Cdn) at this time.
  
  All qualified applicants will receive consideration for
  employment without regard to race, color, religion, sex,
  sexual orientation, gender identity, national origin,
  disability, or status as a protected veteran.
  
  Employees of E Source are encouraged to apply. To foster a
  positive work environment and company culture, we support
  our employees in their career growth at E Source. If you are
  interested in similar job opportunities in the future, visit
  the E Source careers page for a listing of all open
  positions and contact Human Resources.
  
  We contact applicants directly via email using only our
  designated company email addresses with the domain of
  @esource.com. Please do not provide personal information to
  anyone over email and be wary of other accounts
  impersonating businesses.
  
