job_id: 9019211
title: Senior AI Developer
company: Cicero Group
location: USA
work_type: FULL_TIME
description: |
  About the Role MGT is hiring a Senior AI Developer to join
  our AI Operating Group (AI OG). The AI OG is responsible for
  both internal AI tool development and client-facing AI
  solution delivery, primarily serving the state and local
  government market. This is a deeply technical, hands-on
  role. You will build the AI systems that power our client
  engagements and internal product suite — not prototype them,
  not advise on them. You will own the code, the architecture,
  and the output. The right person for this role has real AI
  development experience, is fluent in the Microsoft Azure
  ecosystem, and takes pride in shipping things that actually
  work in production. This is not a consulting role, but you
  will work closely with client-facing teams. You should be
  comfortable translating ambiguous business requirements into
  clean technical solutions, and working across a team where
  not everyone speaks your language. What You'll Do
  
  - Build and maintain production-grade AI solutions including
    RAG pipelines, agentic workflows, and multi-agent systems
  - Develop on the Microsoft Azure AI stack, including Azure
    OpenAI Service, Azure AI Foundry, and related services
  - Architect and implement data pipelines and integration
    patterns that connect AI capabilities to client systems
    and data sources
  - Work with tool-layer integration standards such as MCP
    (Model Context Protocol) to connect agents with enterprise
    systems
  - Develop reusable components, skills, templates, and
    accelerators that scale across multiple engagements
  - Collaborate with AI Solutions Architects and project leads
    to translate solution designs into working builds
  - Contribute to and help set technical standards for the AI
    OG's code-first development practices
  - Support internal product development across MGT's AI tool
    suite
  
  Required Qualifications
  
  - 5+ years of professional software development experience,
    with at least 2 years focused on AI or machine learning
    applications
  - Hands-on experience building with LLMs, including RAG
    architectures, agentic design patterns, prompt
    engineering, or vector databases
  - Demonstrated Azure experience, including Azure OpenAI
    Service or Azure AI Foundry
  - Strong Python development skills
  - Ability to independently scope and deliver technical
    solutions with minimal oversight
  - A builder mentality: you would rather figure it out and ship
    it than wait for a detailed specification
  
  Preferred Qualifications
  
  - Experience with Microsoft Copilot Studio or Power Platform
  - Background in data architecture, ETL/ELT pipelines, or
    analytics platforms
  - Experience with frameworks such as LangChain or LangGraph
  - Prior work in consulting, professional services, or client-
    facing technical delivery
  - Bachelor's degree in Computer Science, Engineering, or
    equivalent practical experience
  
  What Success Looks Like
  
  - Within 30 days: You understand our current tool suite,
    architecture patterns, and active client engagements. You
    have shipped something.
  - Within 90 days: You are independently owning technical
    builds on client projects and contributing to internal
    product development.
  - Within 6 months: You are setting technical standards for the
    team, accelerating junior developers, and driving
    architectural decisions on complex engagements.
  
  Why MGT You will be joining a team that is actively building
  and shipping AI products, not talking about them. We have
  real tools in production, real clients using them, and a
  leadership team that understands both the technology and the
  business. This is a high-visibility role with direct access
  to senior leadership and the opportunity to shape how AI
  gets delivered across the organization. We are building the
  AI practice from the ground up, which means you will have an
  outsized impact on the tools, processes, and culture of the
  team. Our philosophy: clean data foundations first, AI
  layered on top. Process understanding before automation.
  Empowering domain experts to build, not centralizing AI
  capability in a silo. If that resonates with you, this is
  your team.
  
  NOTE: We currently do not accept candidates who require
  sponsorship, nor are we able to provide sponsorship
  opportunities to candidates. Positions are available in Salt
  Lake City, Utah; Washington, D.C.; and remote. Remote
  employees will be expected to travel to an office
  periodically.
