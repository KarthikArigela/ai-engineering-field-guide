  Project Role : AI / ML Engineer Project Role Description :
  Develops applications and systems that utilize AI tools,
  Cloud AI services, with proper cloud or on-prem application
  pipeline with production ready quality. Be able to apply
  GenAI models as part of the solution. Could also include but
  not limited to deep learning, neural networks, chatbots,
  image processing. Must have skills : Project Management
  Office (PMO) Mobilization & Run Good to have skills : NA
  Minimum 12 year(s) of experience is required Educational
  Qualification : 15 years full time education Summary: As an
  AI / ML Engineer, a typical day involves designing and
  developing advanced applications and systems that leverage
  artificial intelligence tools and cloud-based AI services.
  The role requires building robust application pipelines that
  are production-ready, whether deployed on cloud platforms or
  on-premises environments. The engineer integrates generative
  AI models into solutions and works on diverse AI
  technologies such as deep learning, neural networks,
  chatbots, and image processing. This position demands
  continuous innovation and adaptation to evolving AI
  methodologies to deliver effective and scalable AI-driven
  products and services.
  
  Roles & Responsibilities:
  - Expected to be an SME, collaborate and manage the team to
    perform.
  - Responsible for team decisions.
  - Engage with multiple teams and contribute on key decisions.
  - Expected to provide solutions to problems that apply across
    multiple teams.
  - Lead the coordination of project activities to ensure
    alignment with organizational goals and timelines.
  - Facilitate communication between technical and non-technical
    stakeholders to promote clarity and shared understanding.
  - Support junior team members by providing guidance and
    fostering a collaborative learning environment.
  
  Professional & Technical Skills:
  - Must To Have Skills: Proficiency in Project Management
    Office (PMO) Mobilization & Run.
  - Strong capability in managing project lifecycles, including
    initiation, planning, execution, monitoring, and closure.
  - Experience in coordinating cross-functional teams and
    managing resources effectively to meet project objectives.
  - Ability to analyze complex project data and generate
    actionable insights to drive continuous improvement.
  - Skilled in risk management and mitigation strategies to
    ensure project success and minimize disruptions.
  
  Additional Information:
  - The candidate should have minimum 12 years of experience in
    Project Management Office (PMO) Mobilization & Run.
  - This position is based at our Bengaluru office.
  - A 15 years full time education is required.
  
  
  15 years full time education
  
