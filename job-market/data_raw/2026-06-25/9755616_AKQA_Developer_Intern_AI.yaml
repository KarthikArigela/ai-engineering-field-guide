description: |
  Engineers at AKQA (part of WPP) apply technical craft and
  inventive thinking to strategic insight, building the tools
  and systems that bring beautiful ideas to life. Working at
  the intersection of code and creativity, they collaborate in
  a multidisciplinary environment to develop labours of love
  that delight customers and deliver results for clients.
  
  As a Developer Intern at AKQA, you will play an essential
  role in designing and building AI agents that automate and
  augment image processing across our creative content
  production pipelines. You will bring strong engineering
  thinking and hands-on craft, developing and delivering from
  concept to working tool. You’ll also explore how emerging
  technologies, including generative AI and agentic systems,
  can transform the way visual content is produced at scale.
  
  Located on the Nieuwe Herengracht canal in Amsterdam, you
  will have access to our diverse network of specialists by
  collaborating across all our European studios. You will work
  in an environment which fosters a meritocratic culture and
  encourages ownership, and you will be surrounded by some of
  the brightest minds in their fields.
  
  ROLE REQUIREMENTS
  
  Through our internship program, you will be an integrated
  part of the Creative Studio / Technology team, working
  across a mix of agent development, image-processing
  pipelines, and tooling for content production. You will
  assist, as well as own, specific tasks and deliverables,
  that may include:
  
  - Contribute individually and collaborate within cross-
    functional teams of designers, and creatives.
  - Design, build, and iterate on AI agents that automate image-
    processing tasks such as background removal, retouching,
    upscaling, format adaptation, and asset generation.
  - Prototype and integrate generative AI and computer-vision
    models into production workflows, writing clean,
    maintainable code in languages such as Python and Swift
    with Figma MCPs.
  - Research and experiment with emerging AI tooling and agentic
    frameworks to push the boundaries of automated creative
    content production.
  - Work in a fast-paced environment with a high level of
    accuracy and attention to detail, taking ownership of
    tasks from brief through to deployment, while learning the
    day-to-day dynamics of a creative agency.
  
  QUALITIES AND CHARACTERISTICS
  
  - Strong software development fundamentals, with experience in
    a language such as Python or TypeScript and a solid grasp
    of clean, maintainable code.
  - Experienced in ComfyUI
  - Familiarity with AI/ML or computer-vision libraries and
    image-processing tools (for example PyTorch, Hugging Face,
    or diffusion and vision models).
  - Exposure to agentic frameworks, LLM APIs, or workflow-
    orchestration tools, with an interest in building
    autonomous systems.
  - Knowns Figma and image models with Google
  - Detail-oriented and self-motivated, with a keen eye for
    craft.
  - Positive team player with a willingness to listen and learn
  - Confident speaking in English
  - Passionate about engineering, automation, and the creative
    possibilities of AI in content production.
  - An eagerness to explore and apply emerging AI technologies,
    including generative models and agents, to real production
    challenges.
  - An eagerness to get involved, learn, and to come up with
    fresh ideas.
  
  EU working rights are required. Either through a EU
  Citizenship or Study Programme in the Netherlands.
  
  This is a 5 days a week internship for a duration of 6
  months.
  
  We believe great work happens when we're together, fostering
  creativity, collaboration, and connection. That's why we’ve
  adopted a hybrid approach including required in-office days.
  If you require accommodations or flexibility, please discuss
  this with the hiring team during the interview process.
  
  AKQA is an equal opportunity employer and considers
  applicants for all positions without discrimination or
  regard to particular characteristics. We are committed to
  fostering a culture of respect in which everyone feels they
  belong and has the same opportunities to progress in their
  careers.
  
