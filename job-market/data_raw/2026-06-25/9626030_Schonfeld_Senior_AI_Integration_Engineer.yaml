description: |
  SCHONFELD STRATEGIC ADVISORS LLC has an opening for a Senior
  AI Integration Engineer in New York, NY.
  
  The position duties are as follows:  As a pivotal member of
  our Applied Solutions team, you will bridge the gap between
  advanced Generative AI capabilities and the strategic needs
  of our Portfolio Managers, driving the development of
  transformative chatbots and automated processes. Daily
  duties include:
  
  - Liaison between the Applied Solutions team and analysts and
    portfolio managers to analyze their daily workflows and
    experiment with ways to automate processes using
    Generative AI to enhance productivity and operational
    efficiency.
  - Design and implement new Agentic AI-powered workflows to run
    continuously in the background, analyzing market news,
    security data, SEC filings, emails, and other data sources
    and surface pertinent information that can help drive
    investment decisions.
  - Perform User Acceptance Testing with relevant stakeholders,
    and iterate on the design and implementation until
    successful
  - Present and advertise the new tools to the broader sub dept,
    department, and to the relevant investment strategy teams
    to maximize reach and adoption.
  
  The position requires a Bachelor’s degree in Computer
  Science, Information Technology, Information Systems, a
  related field or foreign equivalent, plus 4 years of
  experience in any occupation where experience in programming
  (structured and OO) with one or more high level languages,
  such as Python, Java, C/C++ is gained. Experience must
  include:
  
  - 2 years of experience working at a hedge fund manager or
    other buy-side investment firm engaged in Equities trading
  - 1 year of experience using process-diagramming software such
    as Miro.com, LucidChart, Draw.io, or similar
  - 2 years of experience gathering and documenting functional
    and technical requirements from
    users/clients/stakeholders, including defining and
    detailing measurable success criteria
  - 4 years of experience with scripting, including use of
    Python, Bash, or PowerShell;
  - 2 years of experience using monitoring tools including
    Datadog, Grafana, or ELK;
  - 1 year of experience integrating with RESTful APIs;
  - 2 years of experience developing or implementing Generative
    AI systems, including creating Agentic AI Workflows;
  - 3 years of experience with AWS, which must include
    administration and usage of Bedrock, Kendra, OpenSearch,
    S3, DynamoDB, and Lambda;
  - 2 years of experience developing and delivering Microsoft
    PowerPoint presentations to non-technical stakeholders,
    with demonstrated ability to translate complex technical
    concepts into accessible business communications
  - 2 years of experience developing professional communications
    and marketing materials, including drafting business
    emails, creating flyers and graphics, and producing
    promotional content to effectively convey new features and
    use cases to investment professionals
  
  Part-time telecommuting permitted.
  
  Offered Wage: $190,300/year
  
  Resumes to pwilck@schonfeld.com Ref. ZK26
  
