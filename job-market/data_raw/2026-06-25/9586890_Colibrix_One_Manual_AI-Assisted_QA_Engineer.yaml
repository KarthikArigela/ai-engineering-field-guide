description: |
  Join COLIBRIX.ONE - Innovating the Future of Payments
  
  At COLIBRIX.ONE*, we’re building advanced, AI-powered
  payment technologies that support Payment Service Providers
  (PSPs), Electronic Money Institutions (EMIs), and neobanks
  across the EU and the UK. As a fully licensed EMI (FCA
  reference number 927920) and a Principal Member of
  Mastercard, we offer real-world financial solutions that
  include:
  
  - Global card processing
  
  - Digital wallet infrastructure
  - Cross-border merchant accounts
  - Alternative payment methods (APMs)
  - Corporate accounts for legal entities
  
  We’re a fast-growing team with a passion for innovation,
  security, and scalability. Our culture values curiosity,
  collaboration, and impact - and we’re looking for talented
  professionals who are ready to shape the future of fintech.
  
  About the role:
  
  We are seeking an experienced Manual QA Engineer with a
  strong background in fintech and AI-assisted testing
  practices. You will be responsible for validating complex
  payment, wallet, and card flows through manual, API,
  integration, and regression testing while leveraging AI
  tools to improve test coverage, speed up analysis, and
  optimize QA processes.
  
  Tech stack:
  
  Python, Playwright, Jira,TestRail/ Zephyr/ QASE, GitLab,
  Claude Code, ChatGPT.
  
  Responsibilities:
  
  - Manual testing across active releases (feature acceptance,
    smoke testing, regression testing, integration
    verification)
  - Testing API flows and validating integrations between
    services
  - Creating, maintaining, and optimizing test cases and
    regression suites in TMS (QASE / TestRail / Zephyr)
  - Using AI tools to improve QA processes (generating test
    scenarios, analyzing requirements, speeding up exploratory
    testing, improving bug reports, assisting with log
    analysis and impact analysis, accelerating documentation
    work)
  - Performing release verification for payments, wallets,
    cards, crypto flows
  - Supporting automation QA engineers by validating automated
    regression results and helping triage failures
  - Participating in audit-related QA activities when required
  - Working with urgent business delivery tasks in fast-changing
    environments
  
  Requirements:
  
  - 3+ years in QA, with fintech experience - payments, banking,
    e-money, crypto or iGaming
  - Strong understanding of API testing, client-server
    architecture, integration testing, regression testing
  - Hands-on experience with Postman / Swagger/ Jira /
    Confluence/ TMS (QASE, TestRail ,Zephyr)
  - Practical usage of AI tools in daily QA work
  - Ability to use AI effectively for test design, exploratory
    testing, bug investigation, documentation improvement,
    data generation
  - Experience writing clear bug reports and structured test
    documentation
  
  Nice to Have:
  
  - Experience with SEPA, IBAN, card processing (Visa/Mastercard
    schemes)
  - Familiarity with crypto-to-fiat flows
  - Familiarity with PCI DSS
  
  What we offer:
  
  - Opportunity to shape the future of fintech solutions within
    a growing company
  - Collaborative, horizontal team structure that values your
    expertise and ideas
  - Continuous learning and development opportunities to enhance
    your skills and career growth
  - Competitive salary and benefits package
  - Flexible work arrangements to support work-life balance
  
  * Please note that this position is offered within the
  COLIBRIX ONE. Employment will be under the appropriate legal
  entity based on the role and location.
