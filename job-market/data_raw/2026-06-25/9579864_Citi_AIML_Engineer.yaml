description: |
  The Applications Development Intermediate Programmer Analyst
  is an intermediate level position responsible for
  participation in the establishment and implementation of new
  or revised application systems and programs in coordination
  with the Technology team. The overall objective of this role
  is to contribute to applications systems analysis and
  programming activities.
  
  Responsibilities:
  
  - Build REST endpoints
  - Refine prompts and write Agentic code
    - Adjusting LLM Inference parameters
    - Writing and refining prompts
    - Selecting context for given LLM window size and setup
    - Debugging Agent Self-Reflection loops
  - Calling external search libraries and writing formatting
    code to connect prompt templates
  - Writing code in compliance with risk restrictions
  - Documenting code to ensure compliance and reusability of
    work
  - Write SQL queries and optimize queries for LLM context
    retrieval
  - Writing unit and integration tests for LLMs
  
  Qualifications:
  
  AI ML Engineer
  
  - 3+ years of total experience
  - 1+ Years experience as a data scientist, or machine learning
    engineer (data-adjacent profession)
  - Proficient in every aspect of the data pipeline, including:
    - Data cleaning and preprocessing
    - Model Selection
    - Feature engineering
    - Model training and retraining
    - Model evaluation
    - Moving models into productions
    - Building APIs
  - Python expertise
    - Familiar with FastAPI, Flask
    - Some python library or libraries for calling LLMs (LangChain
      or similar)
    - Data manipulation libraries (Pandas, Numpy, Scipy)
  - NLPText processing and parsing library experience (SpaCy,
    NLTK, TextBlob
  - Deep LearningFamiliarity with model binaries and
    inferencing, experience with HuggingFace, PyTorch, or
    Tensorflow a plus
  - LLMs Able to write promptsUnderstanding of the fundamentals
    of Language Modeling
  - SQL
  
  Education:
  
  - Bachelor’s degree/University degree or equivalent experience
  
