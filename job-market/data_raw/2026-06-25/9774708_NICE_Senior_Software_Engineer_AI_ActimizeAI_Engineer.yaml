description: |
  At NiCE, we don’t limit our challenges. We challenge our
  limits. Always. We’re ambitious. We’re game changers. And we
  play to win. We set the highest standards and execute beyond
  them. And if you’re like us, we can offer you the ultimate
  career opportunity that will light a fire within you.
  
  So, what’s the role all about?
  
  The AI Automation Expert – Professional Services is
  responsible for designing, building, and scaling AI‑driven
  automations that improve efficiency, quality, and
  cost‑to‑serve across Actimize Professional Services. This
  role focuses on integrating enterprise systems,
  understanding professional services delivery processes
  end‑to‑end, and implementing AI solutions that deliver
  measurable business value.
  
  The role works closely with PS leadership, AI Champions, and
  enterprise AI governance teams to execute approved
  automation initiatives aligned to defined ROI and cost
  optimization priorities.
  
  How will you make an impact?
  
  AI Automation Design & Engineering
  
  - Design and implement AI‑powered automations using generative
    AI, agent‑based frameworks, and workflow orchestration
    technologies.
  - Build and maintain secure integrations (APIs, MCP‑style
    connectors) across PS systems such as CRM, project
    management, delivery tooling, ticketing, and document
    repositories.
  - Develop reusable automation components, agents, and
    frameworks that scale across PS engagements and regions.
  - Ensure solutions are production‑ready, secure, compliant,
    and aligned to enterprise AI standards.
  
  Professional Services Process Enablement
  
  - Develop deep understanding of Actimize Professional Services
    delivery models, implementation methodologies, and
    governance processes.
  - Identify high‑impact opportunities to reduce manual effort,
    cycle time, and delivery risk through AI automation.
  - Collaborate with PS stakeholders (Delivery Leads, Program
    Managers, Architects, Managed Services teams) to validate
    automation fit within existing processes.
  - Embed AI solutions into standard PS workflows rather than
    creating parallel processes.
  
  ROI & Value Realization
  
  - Execute AI automation initiatives based on cost
    optimization, ROI targets, and prioritization direction
    provided by AI Champions and leadership.
  - Define success metrics for automations (e.g., effort
    reduction, time savings, quality improvements).
  - Track and report realized benefits to stakeholders and
    continuously optimize solutions to increase value.
  - Support prioritization by providing technical feasibility
    and effort assessments.
  
  Scaling, Adoption & Governance
  
  - Package successful automations into scalable PS assets,
    playbooks, and reusable tools.
  - Support rollout and adoption of AI automations across PS
    teams through documentation, onboarding guidance, and best
    practices.
  - Partner with enterprise AI, security, and architecture teams
    to ensure responsible and compliant AI use.
  - Contribute to internal knowledge sharing and AI capability
    maturity within Professional Services.
  
  Have you got what it takes?
  
  - 4+ years of experience in automation, systems integration,
    or software engineering roles.
  - Hands‑on experience designing AI‑enabled solutions
    (generative AI, agents, workflow automation).
  - Strong experience integrating enterprise systems using APIs
    and event‑based architectures.
  - Proven ability to translate business requirements into
    scalable technical solutions.
  - Experience working within professional services, consulting,
    or delivery organizations is strongly preferred.
  
  You will have an advantage if you also have:
  
  - Experience with agent‑based architectures or MCP‑style
    integration patterns.
  - Familiarity with cloud platforms and enterprise SaaS
    tooling.
  - Experience working in regulated, security‑conscious
    environments.
  - Exposure to AI governance, risk, and compliance frameworks.
  - Strong communication skills with the ability to engage both
    technical and non‑technical stakeholders.
  
  What’s in it for you?
  
  Join an ever‑growing, market‑disrupting global company where
  teams—comprised of the best of the best—work in a
  fast‑paced, collaborative, and innovative environment. As
  the market leader, every day at NICE is a chance to learn,
  grow, and make an impact, with endless opportunities across
  roles, domains, and geographies.
  
   Enjoy NiCE-FLEX!
  
  At NiCE, we work according to the NiCE-FLEX hybrid model,
  which enables maximum flexibility: 2 days working from the
  office and 3 days of remote work, each week. Naturally,
  office days focus on face-to-face meetings, where teamwork
  and collaborative thinking generate innovation, new ideas,
  and a vibrant, interactive atmosphere.
  
