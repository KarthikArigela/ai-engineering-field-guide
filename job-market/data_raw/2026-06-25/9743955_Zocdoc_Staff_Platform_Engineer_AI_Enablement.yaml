description: |
  Our Mission
  
  Healthcare should work for patients, but it doesn’t. In
  their time of need, they call down outdated insurance
  directories. Then wait on hold. Then wait weeks for the
  privilege of a visit. Then wait in a room solely designed
  for waiting. Then wait for a surprise bill. In any other
  consumer industry, the companies delivering such a poor
  customer experience would not survive. But in healthcare,
  patients lack market power. Which means they are expected to
  accept the unacceptable.
  
  Zocdoc’s mission is to give power to the patient. To do
  that, we’ve built the leading healthcare marketplace that
  makes it easy to find and book in-person or virtual care in
  all 50 states, across +200 specialties and +12k insurance
  plans. By giving patients the ability to see and choose, we
  give them power. In doing so, we can make healthcare work
  like every other consumer sector, where businesses compete
  for customers, not the other way around. In time, this will
  drive quality up and prices down.
  
  We’re 18 years old and the leader in our space, but we are
  still just getting started. If you like solving important,
  complex problems alongside deeply thoughtful, driven, and
  collaborative teammates, read on.
  
  Your Impact on Our Mission
  
  At Zocdoc, we're on a mission to give power to the patient
  -- and that starts with enabling our engineering teams to
  build and ship software safely, efficiently, and with
  confidence.
  
  As a Staff Platform Engineer, you will design, build, and
  improve the foundational systems, tooling, and paved roads
  that create leverage across our engineering organization;
  accelerating delivery while improving reliability,
  consistency, and developer experience.
  
  This role sits within the Infrastructure organization. You
  will collaborate across the business  to turn platform
  strategy into practical, adoptable solutions. The role
  emphasizes hands-on technical leadership with meaningful
  input into platform direction, with the goal of reducing
  friction across the development lifecycle and enabling teams
  to focus on improving healthcare access rather than
  infrastructure scaffolding.
  
  You will play a key role in how developers at Zocdoc build,
  test, and deploy software. You'll do this through agentic
  AI, self-service capabilities, composable platform patterns,
  and opinionated but flexible paved roads. Your work will
  abstract operational complexity, improve testability and
  safety, and streamline the developer journey across
  frontend, backend, and mobile surfaces.
  
  You'll Enjoy This Role If You...
  
  - Enjoy building platforms that enable productivity,
    consistency, and autonomy
  - Are motivated by making other engineers more effective, not
    just shipping your own features
  - Like designing cohesive developer experiences that teams
    actually want to adopt
  - Care deeply about developer empathy, usability, and reducing
    cognitive load
  - Prefer solving real problems through thoughtful design,
    iteration, and collaboration
  - Are comfortable influencing peers and adjacent teams through
    clear communication and working code
  - Find satisfaction in building systems that scale predictably
    and help other engineers succeed
  - Enjoy learning and teaching others about leveraging AI-based
    technologies to achieve real-world results
  
  Your Day to Day
  
  - Design and build platform services and solutions that are
    secure, scalable, and intentionally easy to use --
    including CI/CD pipelines, developer tooling, and shared
    infrastructure patterns
  - Contribute to the technical direction of Zocdoc's internal
    developer platform, including paved roads, tooling, and
    shared workflows
  - Collaborate across teams to understand real developer pain
    points, validate platform bets, and drive adoption of
    platform capabilities
  - Own and deliver high-impact platform investments end to end
    -- from problem framing through implementation and rollout
  - Improve measurable developer outcomes such as build times,
    deployment safety, feedback loops, and operational
    simplicity
  - Champion platform-as-product thinking by treating internal
    engineers as users and continuously refining the developer
    experience based on their feedback
  - Advance platform capabilities in AI-assisted development,
    helping shape how engineers use AI in their daily
    workflows with the right guardrails for safety, quality,
    and testability
  - Mentor engineers and technologies across the business and
    raise the bar for technical design and code quality
  - Ensure platform patterns align with security, compliance,
    and reliability expectations without becoming a bottleneck
  
  You'll Be Successful in This Role If You...
  
  - Have 7+ years of experience building or evolving internal
    developer platforms, productivity tooling, or CI/CD
    systems used by multiple teams
  - Have designed and operated distributed systems in AWS or
    similar cloud environments
  - Bring strong judgment around platform abstractions and APIs;
    knowing when to standardize and when to stay flexible
  - Can take ambiguous problems, break them into deliverable
    pieces, and drive them to measurable outcomes
  - Communicate technical trade-offs clearly and build consensus
    with peers and stakeholders
  - Treat adoption as a first-class engineering problem, not an
    afterthought
  - Are motivated by enabling other engineers to build reliable,
    scalable, and secure systems with confidence
  - Value learning, curiosity, and operational excellence, and
    model those qualities for the team
  
  Strategy vs. Execution Split
  
  - ~20% Strategy and Influence (contributing to platform
    direction, participating in cross-team alignment,
    surfacing trade-offs and priorities)
  - ~80% Hands-On Technical Leadership (designing and building
    platform capabilities, reviewing architecture and code,
    partnering with teams on adoption and iteration)
  
  Benefits:
  
  - Flexible work environment for those based in NYC (Role is
    open to remote)
  - Unlimited Vacation
  - 100% paid employee health benefit options (including
    medical, dental, and vision)
  - 401(k) with employer funded match
  - Corporate wellness program with Wellhub
  - Sabbatical leave (for employees with 5+ years of service)
  - Competitive paid parental leave and fertility/family
    planning reimbursement
  - Cell phone reimbursement
  - Employee Resource Groups and ZocClubs to promote shared
    community and belonging
  - Great Place to Work Certified
  
  Zocdoc is committed to fair and equitable compensation
  practices. Salary ranges are determined through alignment
  with market data. Base salary offered is determined by a
  number of factors including the candidate’s experience,
  qualifications, and skills. Certain positions are also
  eligible for variable pay and/or equity; your recruiter will
  discuss the full compensation package details.
  
  NYC Base Salary Range
  
  $210,000—$270,000 USD
  
  About us Zocdoc is the country’s leading digital health
  marketplace that helps patients easily find and book the
  care they need. Each month, millions of patients use our
  free service to find nearby, in-network providers, compare
  choices based on verified patient reviews, and instantly
  book in-person or video visits online. Providers participate
  in Zocdoc’s Marketplace to reach new patients to grow their
  practice, fill their last-minute openings, and deliver a
  better healthcare experience. Founded in 2007 with a mission
  to give power to the patient, our work each day in pursuit
  of that mission is guided by our six core values. Zocdoc is
  a private company backed by some of the world’s leading
  investors, and we believe we’re still only scratching the
  surface of what we plan to accomplish.
  
  Zocdoc is a mission-driven organization dedicated to
  building teams as diverse as the patients and providers we
  aim to serve. In the spirit of one of our core values -
  Together, Not Alone, we are a company that prides itself on
  being highly collaborative, and we believe that diverse
  perspectives, experiences and contributors make our
  community and our platform better.  We’re an equal
  opportunity employer committed to providing employees with a
  work environment free of discrimination and harassment.
