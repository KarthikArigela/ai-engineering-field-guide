  Role: AI Engineer - Contract Role Seniority: Consultant -
  Senior Manager Day rate: Negotiable and outside IR35 Project
  duration: 4-6 months (3-4 days per week) Location: Hybrid in
  London We’re supporting a consultancy that specialises in
  growth and go-to-market transformation, known for fostering
  strong relationships while designing and delivering large-
  scale improvements worldwide. You'll have the opportunity
  build an AI capability from the ground up, designing agentic
  workflows that embed sales methodology into the tools teams
  use every day (Salesforce and Microsoft 365). You’ll work
  closely with GTM leadership and senior stakeholders, gaining
  exposure to commercial strategy while driving practical
  behaviour change. We’ve a preference for you to apply
  directly via the Project Blackbook website as the
  consultancy will eventually view your profile in our
  platform. If you are already in the community, feel free to
  quickly apply here or reach out to your Blackbook contact,
  but no need to re-apply directly. Tasks * Design and deliver
  AI-enabled workflows across Microsoft 365, Salesforce, and
  LLM platforms to support sales teams in their flow of work *
  Build production-ready agent solutions, including Copilot
  extensions, connectors, reusable components, monitoring,
  evaluation, and cost controls * Translate sales methodology
  and unstructured sales data into real-time coaching, CRM
  insights, and measurable business outcomes Requirements * An
  independent consultant * Hands-on experience building
  AI/agent solutions using LLM APIs, Python, and orchestration
  frameworks such as LangGraph, LangChain, LlamaIndex, CrewAI,
  or similar * Familiarity with Microsoft 365, Salesforce,
  CRM/marketing platforms, APIs, integrations, Git workflows,
  and CI/CD * Strong communicator with an interest in applying
  AI automation to real business, sales, GTM, or operational
  challenges, with awareness of evaluation, testing, security,
  and governance best practice * Comfortable with a hybrid
  setup in locations across the UK (typically London)
