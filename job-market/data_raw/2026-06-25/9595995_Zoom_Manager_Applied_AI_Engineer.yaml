title: Manager, Applied AI Engineer
company: Zoom
location: USA
work_type: FULL_TIME
description: |
  What you can expect
  
  The Zoom Virtual Agent Deployment team bridges Sales and
  Engineering through hands-on technical validation. We enable
  customers to transition from pilot to production by
  deploying intelligent voice and chat agents that deliver
  measurable business outcomes.
  
  About the Team
  
  As a Manager, you will lead a team of technical experts
  responsible for designing, deploying, and scaling AI-driven
  customer engagement solutions.
  
  Responsibilities:
  
  - Leading, mentoring, and developing a team of AI deployment
    engineers and solution specialists.
  - Overseeing proof-of-concept and production deployments
    across Zoom customer base.
  - Ensuring projects meet quality, performance, and delivery
    objectives.
  - Guiding the design and deployment of production-ready AI
    agents integrated with CRMs, telephony systems, and
    knowledge bases.
  - Reviewing and approve technical architectures for
    scalability, security, and maintainability.
  - Defining and track key performance indicators such as
    resolution rate and customer satisfaction.
  - Partnering with Product and Engineering teams to identify
    and prioritize platform enhancements.
  
  What we’re looking for:
  
  - 7+ years of experience in customer-facing technical roles,
    including at least 2 years in leadership or management.
  - Proven success deploying complex SaaS or AI/ML solutions in
    enterprise environments. • Have an understanding of LLM-
    based agent architectures, orchestration, and guardrails.
  - Have hands-on experience with voice technology stacks (ASR,
    TTS, turn-taking, barge-in) and at least one major
    provider (e.g., ElevenLabs, Azure, Cartesia).
  - Demonstrate proficiency in Python and working knowledge of
    TypeScript or Go for enterprise integrations.
  - Excellent communication and stakeholder management skills
    across technical and business audiences.
  - Have familiarity with contact center platforms (Genesys,
    Five9, NICE, Zoom Contact Center) or AI agent platforms
    (Decagon, Sierra, etc.).
  - Have experience in regulated industries (healthcare,
    financial services, telecom) is a plus.
  
  Salary Range or On Target Earnings:
  
  Minimum:
  
  $171,800.00
  
  Maximum:
  
  $375,900.00
  
  In addition to the base salary and/or OTE listed Zoom has a
  Total Direct Compensation philosophy that takes into
  consideration; base salary, bonus and equity value.
  
  Note: Starting pay will be based on a number of factors and
  commensurate with qualifications & experience.
  
  We also have a location based compensation structure;  there
  may be a different range for candidates in this and other
  locations
  
  At Zoom, we offer a window of at least 5 days for you to
  apply because we believe in giving you every opportunity.
  Below is the potential closing date, just in case you want
  to mark it on your calendar. We look forward to receiving
  your application!
  
  Anticipated Position Close Date:
  
  07/31/26
  
  Ways of Working Our structured hybrid approach is centered
  around our offices and remote work environments. The work
  style of each role, Hybrid, Remote, or In-Person is
  indicated in the job description/posting.
  
  Benefits As part of our award-winning workplace culture and
  commitment to delivering happiness, our benefits program
  offers a variety of perks, benefits, and options to help
  employees maintain their physical, mental, emotional, and
  financial health; support work-life balance; and contribute
  to their community in meaningful ways. Click Learn for more
  information.
  
  About Us Zoomies help people stay connected so they can get
  more done together. We set out to build the best
  collaboration platform for the enterprise, and today help
  people communicate better with products like Zoom Contact
  Center, Zoom Phone, Zoom Events, Zoom Apps, Zoom Rooms, and
  Zoom Webinars. We’re problem-solvers, working at a fast pace
  to design solutions with our customers and users in mind.
  Find room to grow with opportunities to stretch your skills
  and advance your career in a collaborative, growth-focused
  environment.
  
  Our Commitment
  
  At Zoom, we believe great work happens when people feel
  supported and empowered. We’re committed to fair hiring
  practices that ensure every candidate is evaluated based on
  skills, experience, and potential. If you require an
  accommodation during the hiring process, let us know—we’re
  here to support you at every step.
  
  If you need assistance navigating the interview process due
  to a medical disability, please submit an Accommodations
