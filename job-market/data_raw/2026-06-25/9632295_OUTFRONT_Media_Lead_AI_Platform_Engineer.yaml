description: |
  About OUTFRONT
  
  We are one of North America’s most innovative media
  companies.  We leverage the power of creative excellence,
  unbeatable locations and smart audience data to change the
  game for advertisers.  Our purpose as a company is to help
  people, places and businesses grow stronger.  To do this, we
  make meaningful connections between brands and people when
  they are outside of their homes through one of the largest
  and most diverse sets of out-of-home assets including
  billboards, transit and mobile displays across the U.S.  We
  connect diverse audiences across over 150 markets and
  conduct our business considering all our stakeholders, from
  clients and employees, to the communities where we operate.
  We are committed to creating a diverse and inclusive work
  environment that promotes the growth of our people.  Come
  join our industry-leading team!
  
  What We Offer
  
  OUTFRONT offers a comprehensive benefits program including:
  
  - Medical, Dental, Vision (including same and opposite-sex
    domestic partners)
  - HSA and FSA plans, Family Benefits, Pet Benefits
  - 401(k) Plan with an Employer Match
  - Paid Time Off, Commuter Benefits, Educational Assistance
  - Robust Diversity, Equity and Inclusion program including 7
    Employee Resource Groups (ERGs)
  
  About the Role
  
  We're hiring our first dedicated owner for OUTFRONT's
  internal AI platform. Today, our internal AI assistant
  (OUTGPT, built on the Vercel AI SDK and AWS Bedrock) is
  moving into production, and our external agent
  infrastructure (the Agency Connect MCP server, which exposes
  OUTFRONT inventory and campaign tools to AI buyer agents) is
  live with early partner adoption. Both need a senior
  engineering owner, and both need to grow into the foundation
  of how OUTFRONT works in an AI-native era.
  
  This is a hands-on technical leadership role. You'll own the
  architecture, write production code, set the direction for
  our AI platform, and partner closely with our CTO and VP of
  AI on what comes next. You'll also work with our newly
  forming automation team, providing the platform spine they
  build on top of.
  
  If you've wanted to build a meaningful AI platform from the
  ground up inside a company that's actually committed to it,
  this is that role.
  
  What You'll Work On
  
  - OUTGPT. Take ownership of our internal AI platform, built on
    the Vercel AI SDK and AWS Bedrock. Move it into full
    production, build the roadmap, expand model and agent
    capabilities, integrate with internal data sources, and
    make it the default surface our 75-person tech org and
    broader business reach for.
  - Agency Connect MCP. Evolve our Model Context Protocol server
    that exposes OUTFRONT's inventory, holds, and campaign
    tools to AI buyer agents. This is OUTFRONT's external bet
    on agent-native ad buying, and it's live.
  - Agent infrastructure. Design and build the shared platform
    that internal automation teams use to ship agents safely:
    model routing, evaluation, guardrails, observability,
    secrets handling, cost controls.
  - AWS Bedrock and AgentCore. Be our deepest voice on the AWS
    AI stack. Evaluate, integrate, and operationalize new
    capabilities as they ship.
  - Architectural authority. Own the technical decisions that
    span our AI surface area, from how OUTGPT integrates with
    Salesforce and Snowflake to how Agency Connect MCP scales
    with partner adoption.
  - Mentorship. Set the engineering bar for the AI & Automation
    pod (two engineers and an intern joining behind you).
    Review their designs, raise their ceiling.
  
  What We're Looking For
  
  - 7+ years building production backend or full-stack systems,
    with at least 2 years building LLM-backed systems that
    real users depend on. Prototypes don't count here. We need
    someone who's operated agents and AI services in
    production and knows where the failure modes live.
  - Deep AWS experience. Bedrock specifically is a strong plus.
    Comfort with Lambda, ECS, App Runner, RDS, and the IAM and
    networking surface that AI workloads require.
  - TypeScript/Node and/or Python proficiency. Our AI platform
    is TypeScript-forward (Vercel AI SDK, Next.js); Python
    shows up in agent infrastructure and integrations.
  - Hands-on experience with agent frameworks and protocols
    (MCP, A2A, or equivalent) or a clear track record of
    evaluating and adopting emerging frameworks quickly.
  - Strong API design instincts. You've designed APIs that both
    humans and agents consume, and you understand why those
    are different problems.
  - You've owned a platform that other engineers built on top
    of, and you understand the difference between shipping a
    feature and shipping a capability.
  - You can sit with a non-technical partner (a business
    stakeholder, a buyer-side agency) and turn a fuzzy problem
    into a working system. Communication and judgment matter
    as much as the code.
  
  Nice to Have
  
  - Experience in advertising technology, particularly
    programmatic, OOH, or DOOH.
  - Familiarity with the M365 / Power Platform surface, since
    our automation pod operates there for personal-
    productivity workflows.
  - Experience with Snowflake, Sigma, or modern analytics
    stacks.
  - Open source contributions to MCP, agent frameworks, or
    related ecosystems.
  
  Tech Stack You'll Touch
  
  AWS (Bedrock, AgentCore, Lambda, ECS/App Runner, RDS,
  Cognito), TypeScript/Node, Vercel AI SDK, Next.js, Python,
  PostgreSQL, MCP, Salesforce, Snowflake, Bitbucket, Kiro,
  Claude Code.
  
  Reporting and Team
  
  Reports to the VP of AI. Partners closely with the CTO, who
  is the current technical lead on OUTGPT and will remain a
  hands-on collaborator. Works alongside a Senior Solutions
  Engineer and Solutions Engineer focused on internal business
  automation, plus an intern.
  
  For New York, New Jersey, and California, the salary range
  for this role is $175,000-$200,000 per year.  Compensation
  is determined during our interview process by assessing a
  candidate’s experience and skills relative to internal peers
  and market benchmarks evaluated for the scope and
  responsibilities of the position.  Please note that the
  foregoing compensation information is a good-faith
  assessment associated with this position only and is
  provided pursuant to the corresponding Salary Transparency
  Laws.
  
  To all Recruitment Agencies: OUTFRONT Media LLC does not
  accept agency and unsolicited resumes. Please do not forward
  resumes to our OUTFRONT Media employees or any other company
  location.
  
  OUTFRONT Media is not responsible for any fees related to
  unsolicited resumes.
  
  OUTFRONT Media Is An Equal Opportunity Employer
  
  All applicants shall receive equal consideration without
  regard to race, color, religion, gender, marital status,
  gender identity or expression, sexual orientation, national
  origin, age, veteran status or disability. Please refer to
  the OUTFRONT Media Affirmative Action policy statement.
