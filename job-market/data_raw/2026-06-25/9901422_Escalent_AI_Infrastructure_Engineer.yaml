description: |
  Who We Are
  
  Escalent is an award-winning data analytics and advisory
  firm that helps clients understand human and market
  behaviors to navigate disruption. As catalysts of progress
  for more than 40 years, our strategies guide the world’s
  leading brands. We accelerate growth by creating a seamless
  flow between primary, secondary, syndicated, and internal
  business data, providing consulting and advisory services
  from insights through implementation. Based on a profound
  understanding of what drives human beings and markets, we
  identify actions that build brands, enhance customer
  experiences, inspire product innovation and boost business
  productivity. We listen, learn, question, discover,
  innovate, and deliver—for each other and our clients—to make
  the world work better for people.
  
  Role Overview We are looking for a skilled Infrastructure
  Engineer with 5+ years of experience to design, build, and
  manage scalable, secure, and highly available cloud
  infrastructure. The candidate will work across Azure and AWS
  environments, leveraging Terraform, Docker, and cloud-native
  services to support production-grade applications.
  
  This role requires strong experience in provisioning,
  automating, and managing infrastructure for scalable
  applications and collaborating closely with development and
  DevOps teams.
  
  Responsibilities
  
  - Design, deploy, and maintain scalable cloud infrastructure
    across AWS and Azure
  
  - Build and manage Infrastructure as Code (IaC) using
    Terraform for automated provisioning
  
  - Provision and optimize production environments through the
    development pipeline ensuring optimization for high
    availability, performance, cost and security
  
  - Implement and manage CI/CD pipelines for automated builds
    and deployments, primarily through GitHub Actions
  
  - Monitor system performance, troubleshoot issues, and ensure
    uptime across production systems
  
  - Collaborate with development teams to ensure infrastructure
    aligns with application requirements
  
  - Manage cloud services (compute, storage, networking,
    application services, database) across environments
  
  - Implement security best practices, access control, and
    compliance standards
  
  - Automate scaling, backup, and disaster recovery strategies
  
  - Continuously optimize infrastructure cost, performance, and
    reliability
  
  Required Skills
  
  - 5+ years of experience in Infrastructure / Cloud / DevOps
    engineering
  
  - Strong hands-on experience with AWS and Azure cloud
    platforms
  
  - Proficiency in Terraform (Infrastructure as Code)
  
  - Experience with Docker containerization and microservices
    deployment
  
  - Experience in provisioning and managing production-grade
    scalable applications
  
  - Knowledge of Application Services (App Services, Load
    Balancers, APIs, etc.)
  
  - Strong understanding of networking, security, and cloud
    architecture principles
  
  - Experience with monitoring & logging tools (e.g.,
    Prometheus, Grafana, ELK, etc.)
  
  - Familiarity with CI/CD tools (Jenkins / GitHub Actions /
    Azure DevOps)
  
  - Strong Linux/system administration skills
  
  - Excellent problem-solving and troubleshooting abilities
  
  - Experience with IAM, RBAC, and cloud security models (Azure
    AD, AWS IAM) Familiarity with secrets management tools
    (Vault, AWS Secrets Manager, Azure Key Vault)
    Understanding of DevSecOps practices and security scanning
    tools
  
  - Proficiency in scripting (Python, Bash, or PowerShell) for
    automation
  
  Desirable Skills
  
  - Strongly preferred experience with Kubernetes / container
    orchestration
  
  - Certifications like:
  
  - AWS Solutions Architect
  
  - Azure Administrator / Architect
  
  - Terraform Associate
  
  - Experience with multi-cloud environments and cost
    optimization
