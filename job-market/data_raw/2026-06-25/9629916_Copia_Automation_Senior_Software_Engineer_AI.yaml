description: |
  Who you are
  
  We are seeking a Software Engineer to support Copia's fast-
  growing AI vertical. You're passionate about solving
  problems through collaboration, experimentation, and
  ownership, and are happy to pair on tough issues and test
  your assumptions.
  
  
  
  You have experience building AI tooling, not just using AI
  tooling. Bonus points for experience with controls
  engineering/PLCs and hardware.
  
  
  
  In this role, you will be building AI-based tooling for
  industrial automation engineers. You will use cutting-edge
  AI tooling to enable engineering workflows for Copia's user
  base. Your product taste will help set the direction for
  integrating AI tooling into existing Copia Source Control &
  Backup products.
  
  
  
  The industrial automation space has lots of information most
  software engineers are not familiar with. In your day-to-
  day, you will learn about a wide variety of industrial
  automation topics.
  
  
  
  You’ll join a team that encourages ownership and values
  pragmatic solutions: weighing short-term needs and long-term
  goals.
  
  
  
  You’re interested in Copia’s mission (rebuilding
  manufacturing), you enjoy interacting with customers, and
  driving impact in a foundational industry. We’re looking for
  a strong contributor to the overall trajectory of the
  company.
  
  
  
  Finally, you're optimistic. At Copia, we celebrate
  successes, support each other through unexpected challenges,
  and approach problems with a positive attitude.
  
  
  
  About us
  
  Copia Automation provides best-in-class disaster and
  recovery technology for industrial automation.
  
  Our product brings modern developer tools to the OT space
  through our novel Git-based source control for automation
  professionals, with multiple delivery methods including
  self-hosted and fully hosted options. We are a well-funded
  startup with a growing list of happy customers throughout
  the industrial space.
  
  As a Copia employee, you’ll solve challenging, unique, and
  meaningful problems alongside passionate coworkers, while we
  change the way everything gets built.
  
  
  
  Why industrial automation?
  
  Manufacturing is powered by industrial
  automation—computerized systems and robotics running on
  PLCs. This ecosystem uses a unique graphical language that
  doesn’t work with typical developer tools like GitLab or
  GitHub. Instead, automation professionals rely on physical
  storage devices, incompatible tools, and incomplete
  solutions. When minutes of downtime can cost tens of
  thousands of dollars, better development tools are urgently
  needed.
  
  
  
  Engineering at Copia
  
  The Copia engineering team solves problems through
  collaboration, experimentation, and ownership. We pair on
  tough issues and look for ways to test our assumptions.
  You’ll join a team that encourages ownership and values
  pragmatic solutions, weighing short-term needs and long-term
  goals.
  
  Finally, we’re optimistic. We celebrate successes, support
  each other through unexpected challenges, and approach
  problems with a positive attitude.
  
