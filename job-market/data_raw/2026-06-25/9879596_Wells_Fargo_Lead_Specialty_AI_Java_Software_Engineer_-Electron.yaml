description: |
  About this role: Wells Fargo is seeking a Lead Specialty
  Software Engineer in Technology as part of Commercial and
  Corporate & Investment Banking Technology (CCIBT). This is
  an exciting opportunity to join the team building next-
  generation solutions for the Wells Fargo Capital Markets
  Technology organization. We are seeking a Lead Specialty
  Data Engineer to play a key role in our automation, AI
  adoption, and platform modernization journey. If you are
  passionate about solving complex, mission-critical problems
  using leading-edge technologies, advanced analytics, and AI-
  assisted engineering practices-grounded in strong software
  engineering fundamentals-this role is well suited for you.
  In this role, you will help build and evolve strategic
  trading analytics data platforms, including the Low Touch
  Data Hub and the next-generation Equities Data & Analytics
  platform supporting all Equities Front Office trading
  groups. You will contribute to the design and delivery of
  scalable application frameworks and data services within
  Commercial and Corporate & Investment Banking Technology,
  enabling advanced analytics, AI-driven insights, and
  automation across the Equities trading lifecycle. This role
  defines and governs enterprise-standard AI-assisted
  engineering patterns, including prompt-driven development,
  automated testing, diagnostics, documentation, and
  developer-productivity tooling. You will architect and guide
  controlled LLM integrations-such as MCP-based services-
  across development workflows, observability, and automation,
  while establishing guardrails to ensure secure, explainable,
  auditable, and compliant AI usage within electronic trading
  technology. In partnership with platform, security, risk,
  and compliance teams, you will ensure AI-enabled engineering
  practices meet Wells Fargo governance standards and
  continuously evaluate advances in GenAI, agentic AI, and
  applied ML to safely evolve engineering capabilities at
  enterprise scale. This role supports a fast-paced Front
  Office equity trading environment, delivering senior-level
  software and analytics solutions for trading, automation,
  and decisioning. You will build AI-enabled analytics
  platforms and low-latency systems, apply AI-centric
  engineering practices, and write high-quality Java and
  Python code while partnering closely with traders, Strats,
  and quants. The role includes technical leadership, rigorous
  testing and reviews, production reliability ownership, and
  Level-2 support for performance, data, and model-driven
  issues. Learn more about career areas and lines of business
  at wellsfargojobs.com. In this role, you will
  
  - Lead complex initiatives on selected domains
  - Ensure systems are monitored to increase operational
    efficiency and managed to mitigate risk
  - Define opportunities to maximize resource utilization and
    improve processes while reducing cost
  - Lead, design, develop, test and implement applications and
    system components, tools and utilities, models,
    simulation, and analytics to manage complex business
    functions using sophisticated technologies
  - Resolve coding, testing and escalated platform issues of a
    technically challenging nature
  - Lead team to ensure compliance and risk management
    requirements for supported area are met and work with
    other stakeholders to implement key risk initiatives
  - Mentor less experienced software engineers
  - Collaborate and influence all levels of professionals
    including managers
  - Lead team to achieve objectives
  - Partner with production support and platform engineering
    teams effectively
  
  Required qualifications
  
  - 5+ years of Specialty Software Engineering experience, or
    equivalent demonstrated through one or a combination of
    the following: work experience, training, military
    experience, education
  - 5+ years of Software Engineering experience, with a strong
    focus on data-intensive systems
  - 5+ years of experience building analytics platforms, data
    services, or data-driven applications
  - 5+ years of experience with algorithms and data structures,
    particularly as applied to analytics and data processing
  - 4+ years of experience designing and implementing
    distributed data systems
  - 4+ years of experience with time-series, relational, or
    analytical databases
  - 4+ years of experience in Java for building high-performance
    backend and data services
  - 4+ years of experience in Python for analytics, data
    processing, and automation
  
  Desired qualifications:
  
  - Advanced experience in capital markets business processes
  - Working knowledge of SEC, FINRA, and international
    regulatory considerations when building technology
    solutions
  - Cash Equities and Global Markets trading workflow knowledge;
    FIX protocol experience
  - Deep understanding of concurrency, memory management, and
    performance tuning in data-heavy systems
  - Experience with application lifecycle management from design
    through production support, including AI-enabled or
    analytics-driven systems
  - Strong understanding of distributed and client-server
    technology architectures
  - Prior team lead and/or direct or matrix management
    experience
  - Outstanding written and verbal communication skills
    appropriate for a Front Office environment
  - BS/BA degree or higher
  
  Job Expectations:
  
  - This position is not eligible for Visa sponsorship
  - Relocation assistance is not available for this position
  - Position offers a hybrid work schedule
  
  Posting Locations:
  
  - 150 E 42nd St. New York, NY 10017
  - 300 S Brevard St., Charlotte, NC 28202
  
  Pay Range Reflected is the base pay range offered for this
  position. Pay may vary depending on factors including but
  not limited to demonstrated examples of prior performance,
  skills, experience, or work location. Employees may also be
  eligible for incentive opportunities. $159,000.00 -
  $305,000.00 Benefits Wells Fargo provides eligible employees
  with a comprehensive set of benefits, many of which are
  listed below. Visit Benefits - Wells Fargo Jobs for an
  overview of the following benefit plans and programs offered
  to employees.
  
  - Health benefits
  - 401(k) Plan
  - Paid time off
  - Disability benefits
  - Life insurance, critical illness insurance, and accident
    insurance
  - Parental leave
  - Critical caregiving leave
  - Discounts and savings
  - Commuter benefits
  - Tuition reimbursement
  - Scholarships for dependent children
  - Adoption reimbursement
  
  Posting End Date: 26 Jul 2026 * Job posting may come down
  early due to volume of applicants. We Value Equal
  Opportunity Wells Fargo is an equal opportunity employer.
  All qualified applicants will receive consideration for
  employment without regard to race, color, religion, sex,
  sexual orientation, gender identity, national origin,
  disability, status as a protected veteran, or any other
  legally protected characteristic. Employees support our
  focus on building strong customer relationships balanced
  with a strong risk mitigating and compliance-driven culture
  which firmly establishes those disciplines as critical to
  the success of our customers and company. They are
  accountable for execution of all applicable risk programs
  (Credit, Market, Financial Crimes, Operational, Regulatory
  Compliance), which includes effectively following and
  adhering to applicable Wells Fargo policies and procedures,
  appropriately fulfilling risk and compliance obligations,
  timely and effective escalation and remediation of issues,
  and making sound risk decisions. There is emphasis on
  proactive monitoring, governance, risk identification and
  escalation, as well as making sound risk decisions
  commensurate with the business unit's risk appetite and all
  risk and compliance program requirements. Applicants with
  Disabilities To request a medical accommodation during the
  application or interview process, visit Disability Inclusion
  at Wells Fargo . Drug and Alcohol Policy Wells Fargo
  maintains a drug free workplace. Please see our Drug and
  Alcohol Policy to learn more. Wells Fargo Recruitment and
  Hiring Requirements: a. Third-Party recordings are
  prohibited unless authorized by Wells Fargo. b. Wells Fargo
  requires you to directly represent your own experiences
  during the recruiting and hiring process. #BI-Hybrid
