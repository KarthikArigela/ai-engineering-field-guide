  About Grey chain (https://greychaindesign.com)
  
  A Generative AI-as-a-service, Mobile & Digital
  Transformation firm helping organizations reimagine user
  experiences with Disruptive & Transformational thinking and
  partnership. Trusted by: UNICEF, BOSE, KFINTECH, WHO and
  many Fortune 500 Companies Home of over 110 Product
  Engineering nerds building the next generation of Digital
  Products. Primary Industries: Banking & Financial Services,
  Non-Profits, Retail & eCommerce, Consumer Goods and
  Consulting.
  
  Location: New Delhi / Remote
  
  We are seeking a Lead AI Engineer to spearhead the
  development of advanced agentic Workflows and large language
  model (LLM) systems. The ideal candidate should bring deep
  expertise in agent building, LLM evaluation/tracing, and
  prompt operations, combined with strong deployment
  experience at scale.
  
  Key Responsibilities:
  
  - Design and build agentic workflows leveraging modern
    frameworks.
  - Develop robust LLM evaluation, tracing, and prompt ops
    pipelines.
  - Lead MCP (Model Context Protocol) based system integrations.
  - Deploy and scale AI/ML solutions with enterprise-grade
    reliability.
  - Collaborate with product and engineering teams to deliver
    high-impact solutions.
  
  Required Skills & Experience:
  
  - Proficiency with LangChain, LlamaIndex, or similar agentic
    frameworks.
  - Hands-on experience with LLM evaluation platforms (e.g.,
    Langsmith, Arize, DeepEval).
  - Strong background in prompt engineering and prompt
    operations.
  - Expertise in deploying and managing AI/ML models in
    production environments.
  - Solid programming skills in Python and relevant AI/ML
    libraries.
  - Experience with cloud platforms (AWS, Azure, GCP) and MLOps
    practices.
  - Excellent problem-solving and communication skills.
