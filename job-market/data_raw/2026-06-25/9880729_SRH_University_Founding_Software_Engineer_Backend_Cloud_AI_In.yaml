description: |
  NexTex AI is a Berlin-based deep-tech startup building an
  AI-powered intelligence layer for textile manufacturing. Our
  platform combines industrial cameras, retrofit sensors,
  PLC/SCADA signals, edge computing and artificial
  intelligence to detect textile defects, optimize production
  processes and generate sustainability KPIs for CSRD and EU
  Green Deal compliance. We are currently preparing our EXIST
  Startup Grant application and a ProFIT Berlin R&D funding
  application. Our goal is to build and validate an MVP with
  pilot textile manufacturers during the first year and scale
  into one of Europe’s leading industrial AI platforms for
  textile production. We are looking for a Founding Software
  Engineer who wants to join the founding team and help build
  the technical backbone of the company from day one. Tasks As
  a Founding Software Engineer, you will be responsible for
  designing and building the backend systems, cloud
  infrastructure and AI deployment architecture behind NexTex
  AI. You will work closely with the founders, machine
  learning engineers and future computer vision engineers to
  create a scalable edge-to-cloud platform for industrial AI
  applications. Your responsibilities include: • Designing and
  developing scalable backend services and APIs • Building
  cloud-native infrastructure and deployment pipelines •
  Developing industrial data pipelines for machine, sensor and
  camera data • Supporting edge-to-cloud communication and
  industrial integrations • Supporting AI model deployment,
  monitoring and inference workflows • Building dashboards,
  analytics systems and internal tools • Structuring textile
  production data, defect classifications and sustainability
  KPIs • Working directly with pilot factories and industrial
  partners • Contributing to product architecture and
  technical strategy Requirements Strong software engineering
  background • Strong Python programming skills • Experience
  with FastAPI, Django, Flask, Node.js or similar frameworks •
  Experience with PostgreSQL or similar database systems •
  Experience with Docker and containerized environments •
  Experience with AWS, Azure or Google Cloud • Understanding
  of REST APIs and scalable software architectures • Fluent
  English • Ability to work independently in an early-stage
  startup environment Preferred Qualifications • Located in
  Berlin or willing to relocate to Berlin • Fluent German •
  Experience with Computer Vision systems • Experience with
  Machine Learning infrastructure • Familiarity with PyTorch,
  TensorFlow or ONNX • Experience with MLOps and model
  deployment pipelines • Experience with Edge AI deployments •
  Experience with NVIDIA Jetson, CUDA or TensorRT • Experience
  with Industrial IoT, PLC/SCADA systems or manufacturing
  environments • Experience using AI development tools such as
  ChatGPT, Claude, Cursor or GitHub Copilot • Startup or
  founding-team experience • Interest in textile
  manufacturing, sustainability and Industry 4.0 Perks &
  Benefits • Founding team position • 10% equity participation
  • Approx. €2,500/month through the German Federal EXIST
  Startup Grant during the first year • Significant
  compensation increase planned following successful MVP
  validation and funding milestones • Opportunity to build a
  deep-tech startup from day one • Access to real industrial
  production environments and pilot textile factories • Direct
  collaboration with experienced founders, advisors and
  industry partners • Startup coaching, legal support and
  mentoring through EXIST and ProFIT Berlin • Opportunity to
  shape both the product and company from an early stage
  Benefits • 10% equity participation as a founding team
