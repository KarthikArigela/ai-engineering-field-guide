description: |
  Company: Elaunch Solution Pvt. Ltd.
  
  Location: Surat (On-site)
  
  Experience: 2+ years
  
  Employment Type: Full-time
  
  We are looking for a Senior AI Engineer with a strong grasp
  of AI and Generative AI technologies who can take full
  ownership of our AI initiatives, from concept to deployment
  .This role demands a self-driven individual who can
  independently research, design, build, and deploy AI
  solutions across various domains such as Generative AI, NLP,
  computer vision, and automation. If you’ve previously built
  or fine-tuned models, developed practical AI tools, and have
  worked on multiple AI domains, this is your opportunity to
  create real impact.
  
  Key Responsibilities:
  
  Design, develop, and deploy end-to-end AI solutions
  independently.
  
  Build and integrate Generative AI and LLM-based tools using
  APIs and frameworks.
  
  Work with text-based AI applications like chatbots, content
  generation, summarization, and automation systems.
  
  Fine-tune existing open-source or commercial models (e.g.,
  GPT, LLaMA, Mistral, etc.).
  
  Implement prompt engineering, RAG, and embeddings for
  improved model performance.
  
  Stay updated with new AI frameworks, tools, and research
  trends.
  
  Build proof-of-concepts (POCs) and scale them into
  deployable systems.
  
  Required Skills & Experience:
  
  Bachelor’s or Master’s degree in Computer Science, AI/ML,
  Data Science, or related field.
  
  2+ years of hands-on experience in AI/ML development.
  
  Strong knowledge of Python, PyTorch or TensorFlow, and
  Transformers.
  
  Experience with OpenAI, Hugging Face, or LangChain
  ecosystems.
  
  Deep understanding of LLMs, NLP tasks, and Generative AI
  workflows.
  
  Practical experience with model fine-tuning, vector
  databases, and API integration.
  
  Ability to work independently, research, and deliver
  complete solutions.
  
