  Job Description – AI Engineer
  
  Company: Beacon.AI Location: Hyderabad Experience: 2+ Years
  
  About Beacon.AI
  
  Beacon.AI is building intelligent, user-centric AI solutions
  that solve real-world problems through smart automation and
  data-driven insights. We are looking for an AI Engineer who
  is passionate about building scalable, intuitive AI-powered
  applications.
  
  Role Overview
  
  As an AI Engineer at Beacon.AI, you will work closely with
  product, design, and engineering teams to develop and
  integrate AI features into web-based applications. The role
  requires strong front-end skills, logical thinking, and
  excellent communication to collaborate effectively with
  stakeholders.
  
  Key Responsibilities
  
  - Design, develop, and integrate AI-driven features into web
    applications
  - Build responsive and interactive UI components using
    JavaScript, HTML, and CSS
  - Work with AI/ML models and APIs to enable intelligent
    application behavior
  - Collaborate with cross-functional teams to translate
    business requirements into technical solutions
  - Optimize application performance and ensure scalability
  - Write clean, maintainable, and well-documented code
  - Communicate ideas, progress, and challenges clearly with
    internal teams and clients
  
  Required Skills
  
  - 2+ years of hands-on experience in software development
  - Strong proficiency in JavaScript, HTML, and CSS
  - Good understanding of AI concepts and practical
    implementation (models, APIs, automation, etc.)
  - Excellent communication skills (verbal and written)
  - Strong problem-solving and analytical abilities
  - Ability to work independently as well as in a team
    environment
  
  Good to Have
  
  - Experience integrating AI/ML APIs or tools
  - Exposure to modern JavaScript frameworks (React, Vue, etc.)
  - Basic understanding of backend services and APIs
  - Experience working in startup or fast-paced environments
  
  Why Join Beacon.AI?
  
  - Work on cutting-edge AI solutions
  - Opportunity to grow with a fast-scaling AI startup
  - High ownership and visibility of your work
  - Collaborative and innovation-driven culture
