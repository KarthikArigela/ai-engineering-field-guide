description: |
  Position Summary
  
  Assured Guaranty is seeking a Senior AI Software Engineer to
  build production-grade AI applications using our emerging
  agentic AI framework. This role focuses on translating
  business workflows into scalable, governed software that
  integrates AI agents, enterprise data, and existing
  platforms. This is a builder role—not research or
  experimentation. The expectation is to deliver working
  systems quickly, safely, and at enterprise scale.
  
  Job Responsibilities
  
  - Working directly with business teams to translate workflows
    into production AI applications
  - Building AI-powered applications embedded directly in
    business workflows (document processing, analysis,
    decision support)
  - Designing multi-step AI workflows where agents reason, take
    actions, call tools, and iterate toward outcomes
  - Integrating AI capabilities with enterprise systems (data
    platforms, APIs, internal tools)
  - Using centralized platform services (orchestration,
    identity, logging, monitoring) to deliver scalable
    solutions
  - Applying governance controls (auditability, guardrails, data
    protection) by design
  - Leveraging AI-assisted development tools (e.g., Copilot,
    Claude Code) to accelerate delivery
  
  Candidate Qualifications
  
  - Bachelor’s degree in computer science, engineering, or a
    related field, or equivalent practical experience
  - 5+ years of software engineering experience, or equivalent
    practical experience
  - Experience building production LLM-based applications
    (prompting, integration, evaluation)
  - Exposure to agent-based systems or multi-step AI workflows
  - Understanding of human-in-the-loop and validation patterns
  - Strong software development experience (Python, TypeScript,
    or similar)
  - Experience building APIs, services, and distributed systems
  - Experience integrating with structured and unstructured data
  - Strong quantitative and analytical skills to support credit
    and investment decisions
  - Ability to build within a centralized AI platform,
    leveraging shared services (identity, orchestration,
    logging, guardrails) rather than creating isolated
    solutions
  - Familiarity with cloud-native development (AWS preferred)
  - Understanding of secure coding practices and enterprise
    controls
  - Ability to build systems that are auditable, traceable, and
    compliant
  
        Compensation
  
  Annual base salary for the position is expected to be from
  $175,000 per year to $220,000 per year. The actual salary
  will depend on various factors, including but not limited to
  a candidate’s experience and credentials, salary
  expectations of applicable candidates, and other applicable
  market conditions. This position also provides applicable
  employee benefits, as well as eligibility for an annual
  discretionary bonus and long-term incentive awards.
