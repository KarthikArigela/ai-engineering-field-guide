description: |
  Who We Are
  
  Holiday Channel is a forward-thinking startup focused on
  creating innovative solutions like Digital Magazines,
  Marketplace and Streaming Platform to enhance holiday
  experiences. Holiday World is a digital media and
  entertainment company building the world’s first platform
  for ALL THINGS HOLIDAY where consumers can conveniently find
  all their holiday needs 24x7x365 — entertainment, shopping,
  trends, traditions, food, travel, DIY, and the best deals.
  We created Holiday World to inspire, celebrate, and unite
  people through holidays, as well as all the traditions and
  rituals that accompany them. As the first inclusive
  destination devoted to sharing a global lens on holiday
  celebrations and preparation, Holiday World is a catalyst
  for more diverse storytelling and cross-cultural education.
  Our mission is to give millions of people a reason to
  celebrate and savor every day, every moment, all year by
  uniting communities with more joy, more fun, and more
  compassion. Holiday World is a for-profit company that holds
  its social mission at its core. What We Offer
  
  - Immediate opportunity to make an impact on our team,
    product, and business.
  - A chance to work with a startup that has over 110K users.
  - A get-stuff-done and fun and caring culture.
  - Meaningful work and a strong shared sense of mission.
  - A remote first working environment with an office in
    Colorado Springs, CO.
  - A platform to lead and innovate within a dynamic startup
    environment, offering substantial opportunities for
    professional growth and development.
  - A unique opportunity to explore real-world AI innovation
    within a fast-moving startup environment, providing hands-
    on experience in AI systems development, deployment, and
    scaling, all while contributing to meaningful applications
    that shape how people experience holidays.
  - Sponsorship for international students on F-1 OPT ((Optional
    Practical Training)
  
  What This Role Is We are seeking talented and motivated
  individuals to join our team for an exciting opportunity to
  work on cutting-edge AI-driven technologies and projects.
  This unpaid internship is designed for aspiring AI Engineers
  who are passionate about artificial intelligence and machine
  learning, and want to enhance their skills in building real-
  world AI applications with a focus on NLP, computer vision,
  recommendation systems, and generative AI. As an AI Engineer
  Intern, you will collaborate with our engineering team to
  design, develop, and deploy AI-powered features that bring
  personalization and intelligence to our platforms. You’ll
  gain hands-on experience with end-to-end AI workflows: from
  data collection and preprocessing to model training,
  deployment, and scaling with microservices.
  
  What You'll Do
  
  - Collaborate with the development team to design and
    implement AI solutions within our applications.
  - Build, train, and fine-tune machine learning models for NLP,
    computer vision, and recommendation engines.
  - Develop and deploy AI microservices using FastAPI/RESTful
    APIs.
  - Containerize and run services on Google Cloud Run for
    scalable deployments.
  - Work with both structured and unstructured datasets to
    create data-driven solutions.
  - Integrate third-party AI services and APIs when applicable.
  - Optimize models for performance, scalability, and
    efficiency.
  - Contribute to GitHub repositories, participate in code
    reviews, and follow best practices in version control.
  - Stay updated with the latest AI research, frameworks, and
    tooling.
  
  What You'll Have
  
  - 2+ years of experience working with Python and machine
    learning frameworks (TensorFlow, PyTorch, or similar).
  - Proficiency in FastAPI for developing AI/ML microservices.
  - Strong understanding of NLP, computer vision, and
    recommender systems.
  - Hands-on experience with data preprocessing, training, and
    evaluating ML models.
  - Familiarity with GitHub for version control and
    collaborative development.
  - Experience with containerization (Docker) and deployment on
    Google Cloud Run.
  - Knowledge of PostgreSQL, SupaBase databases for storing and
    retrieving data.
  - Strong problem-solving skills, attention to detail, and a
    passion for learning.
  
  What Helps You Stand Out
  
  - Familiarity with generative AI models (text, image, or
    video).
  - Understanding of CI/CD workflows for ML pipelines.
  - Exposure to monitoring and scaling ML systems in production.
