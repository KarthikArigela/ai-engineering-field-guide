description: |
  About Company
  
  PathPresenter is an enterprise image management and workflow
  platform for digital pathology, empowering clinical care,
  remote consultations, research, and education. We are on a
  mission to democratize pathology knowledge by connecting
  pathologists with global expertise and providing seamless
  access to cutting-edge AI models.
  
  Our comprehensive platform is secure, scalable, and vendor-
  agnostic, effortlessly integrating into any hospital or
  research infrastructure. Founded by dermatopathologist and
  digital pathology pioneer Dr. Rajendra Singh, our platform
  has been built by pathologists for pathologists. With over
  300,000 hours of real-world usage and tens of thousands of
  users worldwide, PathPresenter is trusted by major
  institutions and companies for its deep domain expertise and
  unmatched flexibility.
  
  Job Title: Medical Pathology AI Developer
  
  Location: Ahmedabad, Gujarat, India
  
  Experience Required: 2-5 Years
  
  Employment Type: Full-time
  
  Job Summary:
  
  We are seeking a skilled AI Developer with experience in
  medical imaging and pathology to  design and build
  intelligent solutions for digital pathology platforms.
  
  Key Responsibilities:
  
  ● Develop and deploy AI/ML models for pathology image
  analysis (WSI, DICOM, TIFF).
  
  ● Design algorithms for detection, classification, and
  segmentation of tissue/cell structures.
  
  ● Work with large-scale image datasets and optimize model
  performance and accuracy.
  
  ● Collaborate with pathologists and product teams to
  translate clinical needs into AI solutions.
  
  ● Integrate AI models into production systems (APIs, cloud,
  or on-prem platforms).
  
  ● Ensure compliance with healthcare standards and data
  privacy regulations.
  
  ● Optimize pipelines for performance, scalability, and real-
  time inference.
  
  ● Conduct validation, testing, and continuous improvement of
  models.
  
  ● Stay updated with advancements in medical AI, computer
  vision, and deep learning.
  
  ● Document models, workflows, and maintain reproducible
  research practices.
  
  Required Skills & Qualifications:
  
   Experience with deep learning frameworks (PyTorch,
  TensorFlow)
  
   Knowledge of digital pathology workflows and whole slide
  imaging
  
   Familiarity with healthcare standards (DICOM, HL7 is a
  plus)
  
   Strong background in computer vision and image processing
