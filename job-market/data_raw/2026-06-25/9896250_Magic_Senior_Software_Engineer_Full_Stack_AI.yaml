description: |
  We're the Engineering Team at Magic.
  
  
  
  We get it. You love to build, you love to ship, and you love
  to see your code make a real difference, fast. We offer an
  environment where you can do just that. We're not about
  endless meetings or red tape. We're about empowering
  talented engineers to own projects, move quickly, and
  deliver results.
  
  We're a Y Combinator (2015) alum with strong venture backing
  (including Sequoia Capital) and over
  
  $30M in funding. We're building a world-class engineering
  team, currently at 22 strong and growing. We value impact,
  autonomy, and speed. We operate fully remote.
  
  Tech stack: TypeScript, React, Next.js, PostgreSQL through
  Supabase, Cypress, Vercel, Google Cloud, AWS, Ingest.
  
  About Magic
  
  Magic provides thoroughly vetted, cost-effective virtual
  assistants, to help scale key business functions for small-
  and medium-sized businesses.
  
  Our company came out of Y Combinator in 2015. We've grown to
  1000+ virtual assistants, with strong venture backing
  (including Sequoia Capital) and over $30M in funding to
  date. We've got 22 engineers across the world, adding more
  engineers this year. We are fully remote across the world,
  but require overlap with USA time zones. The average tenure
  in our engineering team is 3+ years. Once you join, you
  don’t want to leave.
  
  Workplace satisfaction and code quality are important to us.
  We expect you to contribute to mentoring, code reviews, and
  improvements to our processes and infrastructure. We care
  about being humble, kind, and helpful. We’re looking for
  team players who own things and get things done.
  
  
  
  The basics
  
  - Fully remote across Asia, Europe, and US time zones (we have
    no physical office and are staying 100%. Forever.)
  - Engineers self-manage, but must be available during core
    hours of 8am–5pm US Eastern Time for real-time
    collaboration and communication.
  - Have a strong learning culture
  - Actively explore, assess, and adopt new technologies
  
  Key Responsibilities
  
  Within 2 weeks, you’ll:
  
  - Complete onboarding and get familiar with our tools and
    process.
  - Get to know the team.
  - Work with colleagues to release small features and bug
    fixes.
  
  Within 1 month, you'll:
  
  - Be responsible for releasing features to production on a
    rapid agile cadence
  
  Within 2 months, you'll:
  
  - Take ownership and lead a technical project;
  - Or, become an expert on a specific technology or product
    domain.
  
  Skills, Knowledge and Expertise
  
  Required Experience:
  
  - A bachelor's or master's degree in Computer Science,
    Electrical Engineering, or a related field.
  - Experience working on complex and ground up projects
  - Javascript
  - React, NextJS
  - NodeJS
  - AWS Lambda
  - PostgreSQL
  
  To set your expectations, you should know that:
  
  - Flexible hours as long as you’re responsive during core
    business hours
  - 100% remote, equipment provided
  - Work-Life Balance
  - Government benefits (if Philippines based)
    - Medical benefits
    - PTO credits
  
  You should apply if…
  
  - Excellent communication skills and the ability to
    collaborate effectively with cross-functional teams.
  - A passion for staying current with emerging technologies and
    trends.
  - Must be a strong individual contributor at the senior level
    — not looking to move into a leadership or management
    role.
  
