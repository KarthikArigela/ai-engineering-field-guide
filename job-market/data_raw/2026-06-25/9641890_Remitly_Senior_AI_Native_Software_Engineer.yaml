description: |
  Job Description:
  
  At Remitly, we believe everyone deserves the freedom to
  access, move, and manage their money wherever life takes
  them. Since 2011, we've tirelessly delivered on our promise
  to customers sending money globally, providing secure,
  simple, and reliable ways to manage their money, ensuring
  true peace of mind. Whether it's supporting loved ones back
  home, growing a business across continents, or pursuing new
  opportunities abroad, we're not just here to move money—
  we're here to move our global customers forward. We're
  looking for builders, reimaginers, and global thinkers who
  want to work at the intersection of technology, trust, and
  transformation. If that's you and you're ready to do the
  most meaningful work of your career—we invite you to join
  over 2,800 passionate Remitlians worldwide who are united by
  our vision to transform lives with trusted financial
  services that transcend borders.
  
  About the Role:
  
  The Treasury team manages Remitly's global funding
  operations — optimising liquidity positions, managing
  funding corridors, and ensuring capital is available
  wherever it's needed. Reporting to the Head of Treasury
  Analytics & Data Science (London), this London-based
  (hybrid) role sits at the intersection of LLMs, Treasury
  operations, and data infrastructure.
  
  We're looking for a builder who moves fast from idea to
  production — someone who can own agentic systems end-to-end
  and directly increase the operational capacity of the
  Treasury team.
  
  You Will Build:
  
  Treasury Agent Automation
  
  - Cash flow monitoring agents: intraday cash position
    tracking, reconciliation, variance flagging, and automated
    daily reports across accounts and currencies.
  - Funding execution agents: instruction routing, approval
    workflows, payment scheduling, cut-off monitoring, and
    settlement tracking — encoded with business rules and risk
    parameters.
  - Narrative agents: auto-generated end-of-day and intraday
    funding commentary, exception summaries, and context-aware
    alerts delivered to the right stakeholders.
  - Discovery-to-deployment pipeline: structured sessions with
    Funding operators to identify manual tasks, then ship
    agents that eliminate them — reporting packs, utilisation
    dashboards, liquidity summaries.
  - Embed within the Funding team at the outset — running
    existing workflows end-to-end alongside operators to
    develop a first-hand understanding of day-to-day
    processes, limitations, and pain points before a single
    agent is scoped or built.
  
  Agent Infrastructure & Growth
  
  - Build reusable, modular agent components and tool libraries
    that scale as Remitly expands into new markets and
    corridors.
  - Contribute to Treasury-wide agent governance standards,
    evaluation frameworks, and shared infrastructure.
  - Research and recommend emerging LLM capabilities and agentic
    tooling to keep the Funding function ahead of the curve.
  - Partner closely with the Treasury Engineering team to
    develop the data accuracy, completeness, and timeliness
    required by Treasury Agents
  
  You Have:
  
  - Advanced proficiency with coding agents across complex
    development scenarios
  - Experience architecting multi-service systems, including
    complex persistence, integrations, and scaling
  - Understanding of distributed systems tradeoffs and cloud-
    based infrastructure design
  - AI tool fluency: orchestrators, automated workflows,
    comprehensive evaluation pipelines
  - Advanced systems architecture expertise across the full
    technology stack
  - Proficiency in customer discovery techniques and ability to
    connect technical work to business outcomes
  - Competence with design thinking, analytics tools, and funnel
    analysis
  - Experience guiding others on AI-first development approaches
  - Expertise in experiment modelling, funnel analysis, and
    data-informed decision making
  - Track record of mentoring others and elevating team
    capabilities
  
  Nice to Have:
  
  - Treasury, fintech, or payments domain knowledge (cash
    positioning, FX, liquidity).
  - LLM observability tools: LangSmith, Arize, Weights & Biases.
  - AWS (S3, Glue, Redshift, Lambda); TMS/financial data
    providers (Bloomberg, Kyriba).
  - Startup, founder, or cross-functional multi-product
    experience.
  
  Our Benefits:
  
  - Paid Vacation Days
  - Health insurance
  - Commuter benefit
  - Employee Stock Purchase Plan (ESPP)
  - Mental Health & Family Forming Benefits
  - Continuing education and corridor travel benefits
  
  Our Connected Work Culture: Driving Innovation, Together
  
  At Remitly, we believe that true innovation sparks when we
  come together. Our Connected Work Culture fosters dynamic
  in-person collaboration, where ideas ignite and challenging
  problems find solutions faster. For corporate team members,
  we have an in-office expectation of at least 50% of the time
  monthly, typically achieved by coming in three days a week.
  This creates a consistent, meaningful overlap that supports
  team norms and business needs. Managers also have the
  flexibility to set higher expectations based on their team's
  specific needs. These intentional in-office moments are
  vital for deepening relationships, fueling creativity, and
  ensuring your impact is felt where it matters most.
  
  Remitly is an E-Verify Employer
  
  At Remitly, we are dedicated to ensuring that our workplace
  offers equal employment opportunities to all employees and
  candidates, in full compliance with applicable laws and
  regulations.
  
  Remitly is an equal opportunity employer. We celebrate
  diversity and are committed to creating an inclusive
  environment for all employees.
