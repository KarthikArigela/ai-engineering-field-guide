title: "Solutions Engineer, GEO & AI Visibility"
company: ProRata.ai
location: Pasadena, USA
work_type: FULL_TIME
description: |
  The Opportunity
  
  AI is changing how people search and how businesses are
  discovered. Gist GEO is building the platform that helps
  brands understand and improve their visibility inside AI-
  generated answers. It’s a new category, and we’re moving
  fast.
  
  We're looking for a Solutions Engineer who knows the product
  inside and out. Someone who can sit alongside Sales in a
  client meeting, run admin reports, spot the difference
  between a meaningful AI visibility insight and a misleading
  one, and explain it clearly to anyone in the room.
  
  We move fast and adjust often. We put the customer first. We
  own our work and fill gaps without being asked. If that’s
  how you operate, read on.
  
  What You’ll Do
  
  Know the product better than anyone
  
  • Become the definitive product expert on the team. No one
  demos Gist GEO better than you.
  
  • Combine deep technical knowledge of how the platform works
  with sharp business acumen. Understand a prospect’s goals,
  not just their tech stack, and find the use cases that
  actually matter to them.
  
  • Stay close to product updates and bring what you hear in
  the field back to the team. Your insights shape what we
  build next.
  
  Own the technical side of every deal
  
  • Work alongside account executives to qualify
  opportunities, lead discovery, and run demos tailored to
  each client’s situation.
  
  • Lead proof of concepts, handle objections, navigate
  security reviews, and field API and integration questions.
  
  • Guide prospects through why GEO matters, and back it up
  with platform data.
  
  Own the customer relationship
  
  • Provide white-glove onboarding. Help customers get set up
  from day one.
  
  • Run admin reports for clients, interpret the data, and
  walk stakeholders through what the numbers mean and what to
  do next.
  
  • Check in on customers regularly, especially new ones, to
  make sure they’re getting value and staying engaged.
  
  • Stay close to customers after the deal closes. You’re not
  handing off, you’re following through.
  
  • Bring prospect and customer feedback back to Sales and
  Product - what’s resonating, what isn’t, and what it means
  for how we position and sell.
  
  Show up for the team
  
  • Contribute to internal training, webinars, and events.
  
  What You Bring
  
  Required
  
  • Experience in GEO, AI search, and SEO strongly desired.
  
  • 3-5 years in solutions engineering, technical pre-sales,
  or sales engineering at a SaaS company.
  
  • Comfort running enterprise deal cycles, multi-threaded
  stakeholders, complex timelines.
  
  • Technically fluent: you understand APIs, integrations, and
  data workflows.
  
  • Ability to read platform data, identify what’s meaningful,
  and explain it clearly to executives and operators alike.
  
  • Strong communicator who adjusts to the room.
  
  Nice to Have
  
  • Familiarity with digital marketing PPC, content strategy,
  or consumer behavior.
  
  • Experience in an early-stage or fast-moving SaaS
  environment.
  
  What’s in It for You
  
  - Competitive base salary + commission
  - Equity
  - Health benefits
  - Learning and conference budget
  - Ground-floor opportunity in a new category
  
  What We Offer
  
  - Opportunity to work at the forefront of AI technology
  - Collaborative and innovative work environment
  - Competitive salary and benefits package
  - Professional development and growth opportunities
  - Chance to make a significant impact on the company's success
  
  Equal Employment Opportunity
  
  - ProRata is an Equal Opportunity Employer. We celebrate
    diversity and are committed to creating an inclusive
    environment for all employees. All employment decisions
    are made based on qualifications, merit, and business
    needs.
  
  California Specific Notices
  
  - At-Will Employment: Employment at ProrataAI is at-will. This
    means that either the employee or the employer may
    terminate employment at any time, with or without cause or
    prior notice.
  - Salary Disclosure: In compliance with California law, salary
    information is provided to ensure transparency and
    fairness.
  - California Consumer Privacy Act (CCPA): ProrataAI complies
    with the CCPA. Personal information collected during the
    recruitment process will be used for employment purposes
    only.
  
  *This open position is not eligible for Company sponsorship
  of a visa that would require a new H-1B visa petition that
  is subject to the $100,000 payment requirement announced in
  the Presidential Proclamation titled “Restriction on Entry
  of Certain Nonimmigrant Workers,” dated September 19, 2025
  (or any extensions or modifications of the Proclamation).
