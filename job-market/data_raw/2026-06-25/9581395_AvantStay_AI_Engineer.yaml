work_type: FULL_TIME
description: |
  Who we are
  
  At AvantStay we run the technology platform behind 2,700+
  vacation rentals across 60+ destinations. We've raised
  $200M+ of capital, do $250M+ in ARR, and have ~30 engineers
  building custom systems that price, list, market, and
  operate the entire portfolio. Recently we shipped multiple
  production AI agents, including a lead-qualification agent,
  on-demand BI reporting agent, CX agent and infrastructure
  monitoring agent that triages on-call alerts. We also are
  building an internal system to enable agentic evolution of
  our core products.
  
  Our stack is Scala and TypeScript across the backend,
  PostgreSQL, ClickHouse, Kafka, Kubernetes on AWS. For AI we
  use Claude, OpenAI, LangGraph,, Openclaw and MCP servers we
  built ourselves.
  
  The role
  
  You will be a strong individual contributor comfortable
  working directly with stakeholders. You will be reporting to
  senior engineering leaders, working alongside ~30 people
  across backend, frontend, data, and DevSecOps. The team is
  fully remote, flat, and talent-dense. You won't be starting
  from scratch - you'll join a strong team with years of
  experience and strong understanding of our systems.
  
  What you'll do
  
  - Ship LLM systems that tightly integrate with our
    infrastructure and knowledge bases: PostgreSQL,
    Clickhouse, Kafka, APIs, MCPs.
  - Maintain autonomous and human-in-the-loop systems and ensure
    uptime and accuracy
  - Interact with users and stakeholders to understand their
    problems and design solutions
  - Stay up-to-date with the latest trends in LLMs and applied
    AI practices
  - Collaborate with a cross-functional team of engineers,
    product managers, designers, and other members to create a
    product that solves actual problems.
  - Update existing systems to be agent-accessible. Some % of
    the work is refactoring APIs that were never meant to be
    called by an LLM - be ready for that.
  - Build the patterns and tooling that let the rest of
    engineering deploy agents faster.
  
  What you've done before
  
  - Shipped at least one LLM-powered system used by real users
    (internal or external) that took actions in a real system.
  - Can talk specifically about evals, retrieval shape,
    observability of agent traces, and handling non-
    determinism in a system business operators depend on.
  - Strong software engineering fundamentals - databases, Kafka,
    GraphQL/REST, Kubernetes, AWS.
  - Proficient in TypeScript. Scala (functional, Typelevel) and
    Python are a plus, but deep Scala expertise is not
    required.
  - Product instincts. You can sit with a stakeholder for an
    hour and walk out with a concrete idea of what to build.
  - Fluent in English.
  
  Nice to have
  
  - OSS contributions to the AI ecosystem. Examples: LangGraph,
    PydanticAI, DSPy, instructor, or similar.
  - Functional programming background. Preference to use
    functional paradigm.
  - High-throughput data systems experience (Kafka, ClickHouse,
    Postgres at scale).
  
  Perks and Benefits
  
  - Equity
  - Generous paid time off including holidays
  - 100% remote - work from anywhere in the world
  - Complimentary and discounted stays at AvantStay properties
  - Periodic team gatherings
  - Budget for Greenfield AI Tooling
  
  No soliciting from staffing agencies. Thank you!
