description: |
  About Us
  
  Gramian Consultancy is a boutique consultancy specializing
  in IT professional services and engineering talent
  solutions. With a strong background in software engineering
  and leadership, we help companies build high-performing
  teams by matching them with professionals who truly fit
  their needs.
  
  Role overview
  
  Our client is building AI-native products that transform
  unstructured information into reliable, structured, and
  actionable data. Their platform combines large language
  models, multimodal AI, retrieval systems, and evaluation
  frameworks to power data-intensive workflows and user-facing
  experiences.
  
  We are looking for a hands-on Senior AI Platform Engineer
  with strong expertise in TypeScript, backend systems, LLM
  integrations, and data pipelines. This is a full-stack role
  with a clear backend focus, where you will design and build
  production-grade AI systems that leverage LLMs, vision
  models, retrieval workflows, and evaluation frameworks. The
  ideal candidate is comfortable owning projects end-to-end,
  from problem definition through deployment and operational
  excellence.
  
  CONTRACT: Long-term contractor assignment
  
  COMMITMENT: Full-time with minimum 4 hours overlap with New
  York working hours
  
  LOCATION: Remote
  
  PROCESS: Technical Interviews + Practical Evaluation
  
  NOTES: Previous experience working in BigTech company
  (Amazon, Google, Meta, Apple, Microsoft, Netflix, …) is
  mandatory!
  
  Responsibilities
  
  - Design and build AI-powered backend services, APIs, and data
    pipelines
  - Develop systems for LLM-powered extraction, classification,
    and structured reasoning
  - Build workflows that ground AI outputs in trusted data and
    verifiable evidence
  - Implement retrieval, context assembly, and answer-grounding
    systems
  - Design and maintain evaluation datasets, scoring workflows,
    and regression testing frameworks
  - Develop internal tools for reviewing and validating AI-
    generated outputs
  - Build reliable production systems with strong observability,
    monitoring, and failure handling
  - Collaborate on React-based interfaces for operational and
    reviewer workflows
  - Optimize AI workflows for performance, cost, reliability,
    and scalability
  - Work closely with product and engineering stakeholders to
    deliver production-ready solutions
  
  Requirements
  
  - 7+ years of professional software engineering experience
  - Strong experience building backend services, APIs, and data
    pipelines
  - Advanced proficiency in TypeScript and Node.js
  - Production experience integrating LLMs, multimodal models,
    or AI APIs
  - Experience building systems that use retrieval, structured
    context, or grounded AI outputs
  - Experience creating evaluation frameworks, scoring systems,
    and regression checks for AI applications
  - Working experience with React
  - Experience with PostgreSQL and modern cloud deployment
    environments
