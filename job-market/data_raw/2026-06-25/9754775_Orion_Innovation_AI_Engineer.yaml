description: |
  Orion Innovation is a premier, award-winning, global
  business and technology services firm.  Orion delivers game-
  changing business transformation and product development
  rooted in digital strategy, experience design, and
  engineering, with a unique combination of agility, scale,
  and maturity.  We work with a wide range of clients across
  many industries including financial services, professional
  services, telecommunications and media, consumer products,
  automotive, industrial automation, professional sports and
  entertainment, life sciences, ecommerce, and education.
  
  AI Engineer (SA2)
  
  6-8 years
  
  Job Overview:
  
  We are seeking a skilled AI Engineer to design, develop, and
  deploy AI-driven applications with strong full-stack
  capabilities. The role involves building scalable AI
  solutions, integrating front-end and back-end systems, and
  working with cloud and data platforms. You will collaborate
  with cross-functional teams to deliver high-performance AI
  applications aligned to business requirements.
  
  Key Responsibilities / (Person Specifications):
  
  - Design, develop, and deploy AI applications with strong
    front-end and back-end integration.
  - Build scalable solutions using containerization and pipeline
    optimization techniques.
  - Gather business requirements and translate them into
    technical solutions.
  - Develop real-time data ingestion and analytics solutions
    using Python, Spark, and cloud platforms.
  - Develop full-stack systems ensuring robust design, coding,
    and performance.
  - Provide system support and collaborate with engineering
    teams for issue resolution.
  - Operationalize AI and data analytics tools for enterprise
    applications.
  - Ensure compliance with data governance, quality, and lineage
    standards.
  - Follow SDLC processes for development, deployment, and
    delivery.
  - Develop AI frameworks using open-source and advanced data
    processing tools.
  
  Key Skills / Job Specifications (Mandatory):
  
  - Strong programming skills in Python/R and Java.
  - Experience with backend frameworks such as FastAPI, Flask,
    Django.
  - Experience in AI frameworks like LangChain, LlamaIndex,
    Semantic Kernel.
  - Full-stack development experience (React/Angular,
    JavaScript).
  - Experience building AI/ML analytical solutions.
  - Experience with Azure-based AI data platforms.
  
  Preferred Qualifications:
  
  - Experience with Databricks, Fabric, Spark Notebooks.
  - Knowledge of SQL/NoSQL databases and Redis.
  - Experience with Kafka, Hadoop, Apache Spark.
  - Big data processing experience using Azure Databricks.
  - Relevant certifications (Azure Data Engineer, Azure AI
    Engineer).
  - Bachelor’s/Master’s degree in Computer Science.
  - 6–8 years of relevant experience.
  
