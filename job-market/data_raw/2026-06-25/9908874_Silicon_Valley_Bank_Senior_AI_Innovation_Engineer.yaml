description: |
  FC Global Services India LLP (First Citizens India), a part
  of First Citizens BancShares, Inc., a top 20 U.S. financial
  institution, is a global capability center (GCC) based in
  Bengaluru. Our India-based teams benefit from the company’s
  over 125-year legacy of strength and stability. First
  Citizens India is responsible for delivering value and
  managing risks for our lines of business. We are
  particularly proud of our strong, relationship-driven
  culture and our long-term approach, which are deeply
  ingrained in our talented workforce. This is evident across
  all key areas of our operations, including Technology,
  Enterprise Operations, Finance, Cybersecurity, Risk
  Management, and Credit Administration. We are seeking
  talented individuals to join us in our mission of providing
  solutions fit for our clients’ greatest ambitions.
  
  Job Description:
  
  Value Preposition:
  
  The Senior AI & Innovation Engineer drives the exploration,
  prototyping, and delivery of next-generation AI solutions
  that accelerate business innovation and enterprise
  transformation. This role combines deep technical expertise
  with hands-on experimentation to evaluate emerging
  technologies, build proof-of-concepts, and transition
  successful innovations into scalable production solutions.
  
  Job Details
  
  Position Title:  Senior AI & Innovation Engineer
  
  Career Level:  P4
  
  Job Category: Assistant Vice President
  
  Role Type: Hybrid
  
  Job Location: Bangalore
  
  About the Team:
  
  The role collaborates closely with business stakeholders,
  product owners, architects, and engineering teams to
  identify high-value opportunities, validate AI-driven
  solutions, and accelerate adoption of modern AI capabilities
  across the organization
  
  Impact
  
  Enterprise-wide data modeling initiatives, developing data
  architecture strategies, and driving innovation in data
  modeling practices. This role serves as a subject matter
  expert, providing guidance to cross-functional teams, junior
  team members, and influencing data-related decisions at the
  organizational level.
  
  Key Deliverables AI Innovation & Solution Development
  
  - Design, prototype, and deliver GenAI, LLM-based, and agentic
    AI solutions to solve complex business challenges.
  - Rapidly evaluate emerging AI technologies, frameworks, and
    platforms through proof-of-concepts and technical
    assessments.
  - Build reusable AI accelerators, templates, and reference
    implementations to accelerate enterprise adoption.
  - Partner with business teams to translate ideas and
    opportunities into scalable AI-enabled solutions.
  - Drive experimentation and MVP development while maintaining
    focus on production readiness and measurable business
    outcomes.
  - Lead PoC-to-production transitions, ensuring operational
    readiness, observability, and cost controls.
  
  AWS-Centric AI Engineering
  
  - Design and implement AI and GenAI solutions using AWS-native
    services, including (but not limited to) Amazon Bedrock,
    SageMaker, Lambda, ECS/EKS, S3, DynamoDB, Aurora,
    OpenSearch
  - Collaborate with architecture teams to ensure AI solutions
    meet enterprise standards for scalability, security,
    reliability, and cost efficiency.
  - Ensure solutions align with AWS Well-Architected Framework
    principles and enterprise governance standards.
  - Implement and optimize scalable, secure, and resilient AI
    pipelines.
  
  Technology Leadership & Best Practices
  
  - Foster a culture of innovation through rapid
    experimentation, iterative learning, and practical
    application of emerging technologies.
  - Define and promote engineering standards that balance
    agility, scalability, and governance.
  - Collaborate with security, compliance, and governance
    partners to ensure responsible data and AI usage.
  - Mentor engineers and developers in modern AI development
    practices.
  
  Collaboration & Knowledge Sharing
  
  - Act as a trusted advisor for business and technology leaders
    on AI-driven innovation opportunities.
  - Partner across teams to embed AI-driven insights and
    automation into business processes.
  - Lead internal workshops and enablement sessions to
    accelerate AI adoption.
  - Present innovation findings, technical recommendations, and
    emerging technology opportunities to senior leadership.
  
  Technical/Business Skills:
  
  - 10+ years of experience in software engineering, AI/ML
    engineering, data engineering, or related technology
    disciplines.
  - Proven experience building and delivering AI, GenAI, LLM,
    RAG, agentic AI, or intelligent automation solutions.
  - Strong proficiency in Python, SQL, APIs, and modern cloud-
    native development frameworks.
  - Experience evaluating and implementing emerging technologies
    through prototypes, pilots, and production deployments.
  - Hands-on experience with AWS services such as Bedrock,
    SageMaker, Lambda, ECS/EKS, S3, DynamoDB, Aurora, and
    OpenSearch
  - Experience with Snowflake Cortex AI, Snowflake Native AI
    capabilities
  - Experience with distributed systems, microservices,
    containerization (Docker/Kubernetes), and modern software
    engineering practices.
  - Demonstrated ability to collaborate with business
    stakeholders and translate ideas into technical solutions.
  - Bachelor’s or Master’s degree in Computer Science,
    Engineering, or a related field.
  
  Preferred
  
  - Relevant AWS certifications in cloud architecture, AI/ML,
    generative AI, or related domains.
  - Experience leading innovation programs, technology
    evaluations, hackathons, or enterprise AI adoption
    initiatives.
  - Experience with agentic AI design patterns, autonomous
    workflow agents, and AI copilots.
  - Demonstrated ability to rapidly prototype new AI concepts
    and successfully transition PoCs into production-grade
    systems.
  
  Relationships & Collaboration
  
  - Reports to: Associate Director - Data Engineering
  - Partners: Senior leaders and cross-functional teams
  - Leads: A team of Data Engineering associates
  
