description: |
  Create the future of e-Health together with us by becoming a
  part of our Dev Center in Bangalore
  
  As a leading provider of software solutions for healthcare,
  we operate in 19 countries and employ over 9,000 passionate
  professionals. Join us and become part of a dynamic,
  innovative environment overflowing with possibilities. Your
  dedication and passion will empower you to make a lasting
  impact.
  
  Together, we are shaping the future of healthcare. Become
  part of our mission and make a difference—for a world where
  knowledge saves lives!
  
  Your Impact
  
  As a Senior AI Full Stack Software Engineer,
  
  - You design, build and operate modern web applications across
    our SaaS portfolio of products, working fluently across
    frontend, backend and DevOps.
  - You build AI-native features and agentic experiences into
    our products, using LLMs, retrieval, tool use and
    structured workflows to deliver tangible value to
    clinicians and patients.
  - You design, evolve and operate cloud-native services with a
    strong focus on reliability, security and developer
    productivity, and you contribute to the team's shared
    agents, skills, pipelines and harnesses.
  - You collaborate closely with product management, UX,
    architects and other engineers; you actively raise the
    engineering bar and the AI-engineering bar within your
    team.
  - You stay close to the user, understand healthcare workflows,
    and bring an entrepreneurial, outcome-driven mindset to
    feature delivery.
  
  Your Profile
  
  - 5+ years of senior-level full-stack experience covering
    modern web applications, with depth in at least one
    frontend (React or Angular) and one backend stack
    (Java/Spring Boot or Python).
  - Solid working knowledge of our core technologies —
    React/Angular, Java Spring Boot, Python, C#, Kafka,
    Terraform — and the cloud and DevOps practices that
    surround them (Kubernetes, Helm, ArgoCD). Exposure to LLM
    tooling (Azure OpenAI, Anthropic SDK, MCP) is a strong
    plus.
  - Demonstrated effective use of AI in software engineering.
    Hands-on experience with Claude Code or similar — building
    agents, skills and workflows — is preferred; AI pipelines,
    harnesses and context engineering are a strong plus.
  - Completed degree in computer science, software engineering
    or a comparable technical field.
  - Strong problem solving, innovation and proactivity;
    understanding of product-management processes is a plus;
    alignment with our healthcare purpose.
  - Excellent communication skills; Fluent English; German is a
    plus.
  
  What You Can Expect from Us:
  
  - High Performing Team: You will be part of a close-nit, elite
    team within CGM that will move fast, with accuracy and hit
    deadlines with confidence.
  - Hybrid Work: Enjoy the flexibility of working two days per
    week remotely and three days on-site at our Bangalore
    office.
  - Comprehensive Benefits: Extensive group health and
    accidental insurance programs.
  - Seamless Onboarding: A safe digital application process and
    a structured onboarding program.
  - Career Growth: Various career growth opportunities and a
    competitive merit increment policy.
  - Stable & Resilient domain: Healthcare is a relatively stable
    and recession-proof domain.
  
  Even if you do not meet all the requirements of this job
  post, we encourage you to apply! We are interested in your
  real-world experience, strengths, and problem-solving style
  rather than generic and theoretical assessments.
  
  Convinced? Submit your application now (including desired
  salary and earliest possible starting date). We create the
  future of e-health. Become part of a significant mission.
