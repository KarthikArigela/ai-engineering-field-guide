description: |
  Accrete is a dynamic and innovative company focused on
  transforming the future of artificial intelligence. We
  specialize in creating advanced AI solutions that turn
  complex data into actionable insights, driving real-world
  impact for businesses and government organizations. Our team
  thrives on creativity and collaboration, working together to
  push the boundaries of AI technology.
  
  At the core of our offerings are our AI agents, designed to
  autonomously analyze data, generate insights, and make
  intelligent recommendations. These agents help businesses
  streamline operations, improve decision-making, and also
  empower government entities to enhance security,
  intelligence, and operational efficiency
  
  The Role
  
  Accrete is hiring an AI Platform Engineer on our Machine
  Learning team. This role focuses on building the systems,
  infrastructure, and services that power our AI-driven
  products.
  
  Depending on the team, you may work on foundational platform
  infrastructure, backend services, model deployment systems,
  or the tooling that enables our ML researchers and product
  teams to move quickly and reliably.
  
  This is an ideal role for engineers with strong Python
  experience who enjoy building scalable systems and
  collaborating across product, research, and engineering
  teams.
  
  What You’ll Do
  
  - Design, build, and maintain scalable backend services and
    APIs in Python
  - Develop platform infrastructure and internal services
    supporting AI products
  - Build and optimize containerized applications using Docker
    and Kubernetes
  - Collaborate with ML, research, and product teams to support
    the development and deployment of AI models
  - Improve system reliability, observability, and performance
    in production environments
  - Contribute to CI/CD pipelines and infrastructure automation
  - Participate in code reviews and help establish engineering
    best practices
  
  What We’re Looking For
  
  - 3+ years of professional software engineering experience
  - Strong programming skills in Python and experience writing
    production-quality code
  - Experience building backend systems, APIs, or distributed
    services
  - Hands-on experience with cloud platforms (AWS, GCP, or
    Azure)
  - Familiarity with containerization and infrastructure tooling
    (Docker, Kubernetes, or similar)
  - Strong understanding of software engineering fundamentals
    including system design and data modeling
  - High ownership mindset with the ability to identify problems
    and drive solutions
  - Genuine curiosity about AI, emerging technologies, and
    building high-impact systems
  
  Nice to Have
  
  - Experience working with machine learning pipelines or model
    deployment
  - Exposure to MLOps, data engineering, or ML infrastructure
  - Familiarity with workflow orchestration tools such as
    Airflow, Prefect, or Dagster
  - Experience collaborating closely with ML or research teams
  
  Core Values & Expectations:Impact
  
  You take full ownership and accountability for your work,
  consistently seeing projects through from inception to
  completion with a strong bias for action. Proactively
  identifying challenges, you drive solutions rather than
  waiting for direction, and hold yourself and others to the
  highest standards for delivering results. With strategic
  thinking and a problem-solving mindset, you make informed
  decisions leveraging data and expertise, always looking for
  ways to improve processes, optimize workflows, and enhance
  outcomes beyond your immediate responsibilities.
  
  Collaboration
  
  You work seamlessly across teams, prioritizing shared goals
  and team success over individual credit. Engaged listening
  and open, candid communication are at the heart of your
  approach, ensuring alignment and synergy throughout the
  organization. You value diverse perspectives, seeking input
  from others to drive better results. By treating colleagues
  with respect and professionalism, you help build a culture
  of trust, supporting each other through challenges,
  celebrating successes, and constructively addressing
  conflicts to strengthen relationships and improve outcomes.
  
  Passion for AI & Innovation
  
  You are deeply excited about the transformative potential of
  AI and committed to contributing to a company shaping the
  future of work. With curiosity and a growth mindset, you
  continuously seek to learn, adapt, and stay at the forefront
  of new developments. Your enthusiasm for innovation drives
  you to explore new ideas, challenge the status quo, and find
  creative solutions that deliver meaningful impact. You
  approach your work with energy and a desire to advance both
  technology and the way we work.
  
  Company Benefits
  
  - Competitive Salary: Aligned with experience and market
    standards
  - Mediclaim: 10 Lacs coverage for you and your family
  - Flexible PTO & Hybrid Work: Take time off when needed and
    enjoy remote flexibility per company guidelines
  - Growth & Development: Access professional learning
    opportunities and career advancement support
  - Onsite Perks: Enjoy catered lunches, snacks
  - Team Bonding: Company-sponsored social events to connect and
    unwind
