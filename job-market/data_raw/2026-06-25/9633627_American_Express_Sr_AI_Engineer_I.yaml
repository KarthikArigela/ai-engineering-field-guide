description: |
  Digital Workplace (DW) is a part of the Technology
  organization that provides tools and services to American
  Express colleagues. Our mission is to deliver the world's
  best colleague digital experience: Everywhere. Everyday. We
  simplify work and raise productivity by empowering
  colleagues with the best digital tools and experiences. This
  role will report to the VP, DW Portfolio & Operational
  Excellence and will manage a team of managers and analysts.
  
  Sr Software Engineer I directs the end-to-end development of
  software applications, ensures adherence to best practices,
  mentors and coaches junior engineers, and collaborates with
  teams to optimize performance and integration.
  
  Responsibilities
  
  - AI-Enabled Product Management Transformation
  
  - Responsible for implementing AI into product management
    workflows (e.g., discovery, road mapping, prioritization,
    backlog management)
  - Develop against high-impact use cases to drive efficiency,
    quality, and speed to market across product teams
  - Standardize how AI is leveraged to improve product decision-
    making, insight generation, and execution
  
  - AI Solution Development & Delivery
  
  - Join a high-powered, expert team of engineers and product
    specialists to develop AI-powered tools and accelerators
  - Develop and deploy solutions using leading platforms (e.g.,
    ChatGPT, M365 Copilot, Copilot Studio, Claude, agentic AI
    frameworks)
  - Partner closely with engineering and architecture teams to
    ensure scalability, security, and integration into
    enterprise environments
  - Drive rapid prototyping and iterative experimentation to
    validate value and scale successful solutions
  - Design, build, and ship multi-agent systems
  - Build and implement Model Context Protocol (MCP) server
    infrastructure
  - Build production observability for agent systems - tracing,
    logging, and metrics that distinguish hallucination rate,
    latency, cost, and accuracy
  - Own the systems you build in production, including
    reliability, latency, cost, and failure modes
  
  - Product Intelligence & Decision Augmentation
  
  - Enable product teams to leverage AI for insight generation,
    customer understanding, and opportunity identification
  - Develop capabilities that automate synthesis of research,
    telemetry, and feedback into actionable product insights
  - Enhance roadmap planning through AI-driven scenario modeling
    and prioritization support
  
  - Operating Model & Adoption
  
  - Define AI-enabled product management, including tools,
    workflows, and guardrails
  - Partner with Product, Engineering, Risk, and Governance
    teams to ensure compliant and responsible use of AI
  - Drive adoption through enablement, training, and embedded
    playbooks for product teams
  - Establish success metrics to measure impact on speed,
    quality, and business outcomes
  
  Qualifications
  
  AI & Product Expertise
  
  - Deep experience in product management within enterprise-
    scale environments
  - Proven track record applying AI/GenAI to business or product
    workflows
  - Strong familiarity with leading AI platforms and tools
    (e.g., ChatGPT, M365 Copilot, Copilot Studio, Claude,
    agentic systems)
  - Experience translating emerging AI capabilities into
    practical, scalable solutions
  
  Technical & Delivery Capabilities
  
  - Experience leading or partnering with engineering teams to
    build and deploy software solutions
  - Understanding of AI solution design, prompt engineering, and
    orchestration frameworks
  - Ability to operate across product, engineering, and data
    domains
  
  Strategic & Leadership Skills
  
  - Strategic thinker with ability to translate innovation into
    enterprise value
  - Strong executive communication skills, able to simplify
    complex concepts
  - Experience building new capabilities, teams, or operating
    models from the ground up
  - Ability to influence across a highly matrixed organization
  
  Experience
  
  - 3+ years in product management, technology, digital
    transformation
  - 3+ years in engineering, development, or architecture
  - Strong expertise in Gen AI, AI Automation, “citizen
    development” tools
  - Experience in enterprise environments with complex
    governance and regulatory requirements
  - Demonstrated impact driving innovation and adoption at scale
  
  Depending on factors such as business unit requirements, the
  nature of the position, cost and applicable laws, American
  Express may provide visa sponsorship for certain positions.
