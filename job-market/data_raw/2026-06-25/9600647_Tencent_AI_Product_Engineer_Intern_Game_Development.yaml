description: |
  About the Hiring TeamLevel Infinite is Tencent’s global
  gaming brand. It is a global game publisher offering a
  comprehensive network of services for games, development
  teams, and studios around the world. We are dedicated to
  delivering engaging and original gaming experiences to a
  worldwide audience, whenever and wherever they choose to
  play while building a community that fosters inclusivity,
  connection, and accessibility. Level Infinite also provides
  a wide range of services and resources to our network of
  developers and partner studios around the world to help them
  unlock the true potential of their games.What the Role
  EntailsWe're looking for someone who plays games and builds
  with AI — not as separate hobbies, but as one obsession.
  You'll use Tencent's AI infrastructure alongside frontier
  models (Claude, Gemini, and Tencent's in-house tools) to
  explore what AI-native game development actually looks like
  — through hands-on prototyping, not slide decks.
  
  ⦁Prototype AI use cases across the full game dev lifecycle —
  design, art, audio, narrative, code, live ops. ⦁Evaluate
  frontier generative and agentic AI tools against real
  production constraints. ⦁Build a grounded framework for how
  AI fits into each development stage. ⦁Track the global AI ×
  games frontier and turn it into actionable team insights.
  ⦁Shape requirements for internal AI creation tools.
  
  Who We Look For
  
  ⦁ Gamer — You play games and think about them. Tell us what
  you play in your application. ⦁ AI-native — You reach for AI
  tools reflexively and stay curious about how they work. ⦁
  Builder — You turn ideas into real things, fast. ⦁
  Communicator — Fluent English; Mandarin a plus. ⦁ Any game
  dev experience (jams, projects, mods) or hands-on generative
  AI work is a strong plus. ⦁Currently enrolled or recently
  graduated — no industry experience required.
  
  Equal Employment Opportunity at Tencent
  
  As an equal opportunity employer, we firmly believe that
  diverse voices fuel our innovation and allow us to better
  serve our users and the community. We foster an environment
  where every employee of Tencent feels supported and inspired
  to achieve individual and common goals.
