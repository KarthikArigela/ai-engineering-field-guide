  Job Description
  
  Role Summary
  
  We are seeking an experienced AI Engineer to design, build,
  and deploy AI-powered solutions that automate workflows,
  enhance decision-making, and integrate seamlessly with
  enterprise systems. This role involves working with Large
  Language Models (LLMs), APIs, data pipelines, and cloud
  platforms to deliver production-grade AI applications.
  Experience required 7-10 years
  
  Key Responsibilities
  
  
  
  - Design and develop AI and machine learning solutions using
    Large Language Models (LLMs) such as OpenAI, Azure OpenAI,
    or similar platforms
  - Build AI-driven applications including chatbots, copilots,
    intelligent agents, and automation tools
  - Integrate AI models with enterprise systems, APIs,
    databases, and workflows
  - Implement advanced techniques including prompt engineering,
    Retrieval Augmented Generation (RAG), and vector search
    capabilities
  - Develop and deploy AI services using cloud platforms such as
    Azure, AWS, or Google Cloud Platform (GCP)
  - Leverage frameworks and tools including LangChain,
    LangGraph, and Databricks for AI development and
    deployment
  
  
  
  Additional Information
  
  Please Note: Fraudulent job postings/job scams are
  increasingly common. Beware of misleading advertisements and
  fraudulent communication issuing 'offer letters' on behalf
  of T-Systems in exchange for a fee. Please look for an
  authentic T-Systems email id - XYZ@t-systems.com.
  
  Stay vigilant. Protect yourself from recruitment fraud!
  
