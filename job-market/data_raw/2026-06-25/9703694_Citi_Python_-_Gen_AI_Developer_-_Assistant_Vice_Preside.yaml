title: Python - Gen AI Developer - Assistant Vice President
company: Citi
location: Pune, IND
work_type: FULL_TIME
company_size: 223,850 Employees
description: |
  We are seeking a highly skilled and motivated
  Python/Generative AI Developer to join our growing team. The
  ideal candidate will be responsible for designing,
  developing, and deploying advanced Generative AI models and
  applications, including sophisticated chat interfaces. You
  will work on various aspects of the AI lifecycle, from
  research and prototyping to production deployment,
  contributing to solutions that drive innovation and
  efficiency within our organization.
  
  Responsibilities:
  
  - Design, develop, and implement Generative AI models (e.g.,
    LLMs, GANs, VAEs, Diffusion Models) using Python and
    relevant deep learning frameworks (e.g., TensorFlow,
    PyTorch).
  - Integrate Generative AI capabilities into existing systems
    and develop new AI-powered applications.
  - Build and maintain dynamic and responsive chat interfaces
    for Generative AI solutions using React, incorporating
    features such as HTTP streaming for real-time updates,
    asynchronous processing for efficient user experience,
    secure file upload capabilities, and advanced chat
    formatting.
  - Conduct research and stay up-to-date with the latest
    advancements in Generative AI, natural language
    processing, and machine learning.
  - Optimize and fine-tune AI models for performance,
    scalability, and efficiency.
  - Develop robust data pipelines for training, evaluation, and
    deployment of AI models.
  - Collaborate with data scientists, machine learning
    engineers, and product managers to define requirements and
    deliver solutions.
  - Ensure the responsible and ethical deployment of AI models,
    adhering to best practices and regulatory guidelines.
  - Write clean, maintainable, and well-documented code,
    adhering to software development best practices.
  - Participate in code reviews, contribute to architectural
    discussions, and provide technical guidance.
  - Troubleshoot and debug AI models and applications,
    identifying and resolving performance bottlenecks and
    issues.
  
  Required Qualifications:
  
  - Bachelor's or Master's degree in Computer Science,
    Artificial Intelligence, Machine Learning, or a related
    quantitative field.
  - 8+ years of professional experience in software development,
    with a strong focus on Python.
  - Proven experience with Generative AI models, including
    hands-on experience with large language models (LLMs) or
    other generative architectures.
  - Proficiency in deep learning frameworks such as TensorFlow,
    PyTorch, or JAX.
  - Experience with Google ADK or similar Google AI/ML platforms
    and SDKs.
  - Strong front-end development skills, particularly with
    React, for building interactive user interfaces.
  - Demonstrable experience in implementing chat
    functionalities, including handling HTTP streaming,
    asynchronous operations, managing file uploads, and
    applying various chat formatting techniques.
  - Solid understanding of machine learning principles,
    algorithms, and data structures.
  - Experience with cloud platforms (e.g., AWS, Azure, GCP) and
    MLOps practices for deploying and managing AI models.
  - Familiarity with containerization technologies (e.g.,
    Docker, Kubernetes).
  - Strong problem-solving skills and the ability to work
    independently and as part of a team.
  - Excellent communication and interpersonal skills.
  
