description: |
  Job Description : AI Engineer - Computer Vision
  
  Position Overview :
  
  We are seeking a skilled and experienced AI Engineer with
  expertise in computer vision, data science, hardware setup,
  and processing requirements.
  
  The ideal candidate will have at least 3 years of
  professional experience in designing, implementing, and
  optimizing AI solutions that integrate hardware and
  software.
  
  You will play a critical role in developing and deploying
  state-of-the-art computer vision systems tailored to
  specific hardware platforms and use cases.
  
  Key Responsibilities :
  
  1. Computer Vision Development :
  
  - Design, develop, and deploy computer vision algorithms for
    applications such as object detection, recognition,
    tracking, and scene understanding.
  
  - Optimize vision models for real-time processing and
    resource-constrained environments.
  
  2. Hardware Integration :
  
  - Set up, configure, and optimize hardware platforms for AI
    solutions, including GPUs, TPUs, and embedded devices.
  
  - Ensure seamless interaction between hardware and AI models,
    including custom hardware configurations when necessary.
  
  3. Performance Optimization :
  
  - Analyze processing requirements and optimize pipelines for
    speed, memory usage, and power efficiency.
  
  - Use tools like TensorRT, OpenVINO, or ONNX to accelerate AI
    models.
  
  4. Collaboration :
  
  - Work with cross-functional teams to define hardware
    requirements and ensure compatibility with AI workflows.
  
  - Collaborate with data scientists to preprocess data and
    train robust computer vision models.
  
  5. Deployment and Maintenance :
  
  - Deploy AI solutions on various platforms, ensuring
    scalability and reliability.
  
  - Monitor and maintain AI systems to ensure optimal
    performance in production environments.
  
  Required Qualifications :
  
  - Bachelors or Masters degree in Computer Science, Electrical
    Engineering, or a related field.
  
  - Minimum of 3 years of experience in AI engineering, with a
    focus on computer vision.
  
  - Strong knowledge of deep learning frameworks such as
    TensorFlow, PyTorch, or Keras.
  
  - Experience in setting up and working with hardware
    platforms, including GPUs, FPGAs, or edge devices like
    NVIDIA Jetson or Google Coral.
  
  - Proficiency in programming languages such as Python, C++, or
    CUDA.
  
  - Hands on experience with tools for hardware acceleration
    (e.g., TensorRT, OpenVINO, or ONNX Runtime).
  
  Preferred Skills :
  
  - Familiarity with robotics or autonomous systems.
  
  - Knowledge of hardware-software co-design principles.
  
  - Experience with edge AI deployment and optimization.
  
  - Familiarity with data annotation tools and datasets for
    computer vision tasks.
  
  - Excellent problem-solving and debugging skills.
  
  Why Join Us ?
  
  - Opportunity to work on cutting-edge AI solutions with real-
    world impact.
  
  - Collaborative environment with opportunities for learning
    and growth.
  
  - Access to state-of-the-art hardware and tools for AI
    development.
