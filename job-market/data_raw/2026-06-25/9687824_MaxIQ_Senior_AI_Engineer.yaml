description: |
  Senior AI/Data Engineer - Autonomous Agentic Systems
  
  MaxIQ is building the industry’s first revenue AI platform
  that transforms how B2B SaaS companies manage customer
  journeys. Join us to pioneer autonomous agentic systems that
  empower sales teams with predictive insights and intelligent
  automation.
  
  Role Overview
  
  You’ll architect AI agents that autonomously optimize
  revenue operations for sales, customer success, and RevOps
  teams.
  
  These agents will replace fragmented workflows with
  predictive guidance, real-time customer journey analysis,
  and context- aware automation. Your work will directly
  contribute to MaxIQ’s mission of turning customer
  interactions into predictable revenue engines
  
  Key Responsibilities
  
  - Autonomous Agent Development: Build AI agents using
    LangChain, LlamaIndex, and Python/Java to automate deal
    qualification, churn prediction, provide valuable insights
    and calculate customer health scoring
  - Sales Intelligence Augmentation: Design agents that provide
    role-specific insights (e.g., deal guidance for AEs,
    renewal alerts for CSMs) while integrating with tools like
    Salesforce
  - Prompt Engineering & RAG: Evolve chat-based assistants into
    autonomous systems using retrieval-augmented generation
    and real-time data pipelines.
  - Observability Stack: Implement tracing, logging, and
    monitoring for agent decisions to ensure transparency in
    revenue-critical operations
  - Scalable Inference: Optimize LLM performance for high-
    throughput environments using quantization, model pruning,
    and cloud-native deployment
  
  Qualifications
  
  Education: BS/MS in Computer Science, Data Science, or
  related fields
  
  Technical Skills:
  
  - 5+ years with Gen AI frameworks, LLM fine-tuning, and
    agentic architectures
  - Expertise in Python/Java, AWS/GCP, and containerized
    microservices
  - Experience building observability into AI agents is a plus
  
  Cultural Fit:
  
  - Passion for solving complex revenue operations challenges in
    B2B SaaS
  - Startup mindset – thrives in fast-paced environments with
    high ownership
  
  Why MaxIQ?
  
  - Category-Defining Product: Shape the future of AI- powered
    customer journey management
  - Agentic AI Focus: Work on cutting-edge autonomous systems
    that process millions of customer interactions daily
  - Global Impact: Deploy solutions used by enterprises to drive
    reductions in sales cycle times and higher customer
    lifetime value
