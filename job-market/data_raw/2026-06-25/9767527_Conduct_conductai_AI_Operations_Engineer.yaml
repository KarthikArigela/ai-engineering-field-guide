title: AI Operations Engineer
company: Conduct (conduct.ai)
location: London, GBR
work_type: FULL_TIME
company_size: 21 Employees
description: |
  TL;DR: You'll make Conduct the most productive company per
  headcount by embedding AI into every workflow that matters -
  across GTM, finance, ops, and engineering. You understand
  what our developers are building, you can build alongside
  them, and you have the strategic instinct to know where
  automation creates the most leverage.
  
  Why Conduct
  
  We believe the world's largest companies should move at the
  speed of their ideas, not the speed of the decade-old
  systems they run on. Today they don't.
  
  Every process change, every new product line runs into SAP
  systems layered with decades of custom code and complexity
  no human mind can fully comprehend. New requirements take
  months to ship, system migrations cost $100M+ and years of
  pain.
  
  We're building the AI operating system that absorbs this
  complexity and gives enterprises back their speed and
  ambition. Major enterprises already trust us with their most
  critical systems, we've closed game-changing SI
  partnerships, just raised a $60M Series A, and demand is
  outpacing what we can service.
  
  We're a small, talent-dense team doing our life's work out
  of London and NYC. Extreme ownership, high velocity, low-ego
  collaboration. What you build here shapes the company and
  how the world's largest companies operate. We sponsor visas
  and are convinced diverse teams build better products, so we
  especially encourage underrepresented groups in tech to
  reach out.
  
  What you'll own
  
  The mandate is simple: make every team at Conduct
  dramatically more productive through AI. You'll identify the
  highest-leverage opportunities across the company, build and
  deploy the automations, and own adoption end-to-end. You'll
  work as closely with our engineering team as you will with
  sales and ops - understanding what we're building
  technically, contributing to developer productivity
  workflows, and building internal tooling that makes our
  engineers faster.
  
  In practice:
  
  - Partner directly with functional leads across GTM, product,
    finance, and ops to identify and prioritise the highest-
    impact automation opportunities
  - Build and deploy AI agents, automations, and internal
    tooling, using both code-first approaches and modern low-
    code platforms depending on what's right for the job
  - Work closely with the engineering team to understand what
    we're building technically, contribute to developer
    productivity workflows, and build automations that make
    engineers faster
  - Build and maintain internal knowledge systems that compound
    in value over time
  
  Who we hire
  
  We're looking for someone who sits at the intersection of
  technical depth and operational instinct. You've built real
  things, not just mapped processes or written strategy docs.
  You understand how software gets built, you're comfortable
  working alongside engineers, and you bring enough commercial
  awareness to know which problems are actually worth solving.
  
  In practice that tends to look like:
  
  - 2+ years in a technical operations, solutions engineering,
    internal tools, or technical product role. You've been
    close to engineering teams and you know how to work with
    them, not just around them.
  - Genuinely technical. You're comfortable with code-first
    approaches and can prototype real workflows, not just wire
    together low-code tools. You understand what our
    developers are building and can contribute meaningfully to
    engineering productivity.
  - Hands-on with modern AI tooling. You've built real workflows
    using tools like Claude Code, Cursor, n8n, Clay, Gumloop,
    or similar and you have strong opinions about when to use
    what.
  - A sharp process thinker. You spot inefficiency fast, know
    how to prioritise ruthlessly, and design solutions that
    actually get adopted.
  - High ownership, low ego. You're as comfortable doing the
    hands-on build as you are presenting a business case to
    leadership. No task is beneath you if it moves things
    forward.
