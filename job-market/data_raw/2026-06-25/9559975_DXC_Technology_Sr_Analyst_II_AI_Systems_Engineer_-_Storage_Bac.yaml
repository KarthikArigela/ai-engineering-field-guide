title: "Sr Analyst II: AI Systems Engineer - Storage & Backup"
company: DXC Technology
location: Bengaluru, IND
work_type: FULL_TIME
company_size: 86,261 Employees
description: |
  Job Description:
  
  Essential Job Functions
  
  ·         Design, code, and test Python-based components for
  OASIS storage/backup integrations — agents, MCP tool
  servers, vendor REST API connectors, and Pydantic models —
  focusing on developing and maintaining critical components
  of the team’s capabilities.
  
  ·         Develop FastAPI/Uvicorn services exposing JSON-RPC
  2.0, REST, and SSE-streamed endpoints, and consume vendor
  REST APIs via async HTTP clients (httpx, aiohttp).
  
  ·         Implement and tune LangGraph ReAct agents that
  orchestrate LLM-driven tool calls against MCP servers,
  including parallel tool execution and RAG-backed knowledge
  retrieval.
  
  ·         Take ownership of challenging technical tasks and
  collaborate with senior engineers on architectural decisions
  for your area.
  
  ·         Actively participate in design discussions and
  code reviews; produce clean pull requests with appropriate
  test coverage, changelog entries, and version increments per
  team conventions.
  
  ·         Debug and resolve complex production issues across
  the agent → MCP server → vendor API stack using structured
  logs and OpenTelemetry traces.
  
  ·         Author and maintain unit, integration, and end-to-
  end tests; contribute to CI workflows (GitHub Actions,
  CodeQL, PR gating).
  
  ·         Stay current with emerging agentic AI patterns
  (LLM tool calling, ReAct, RAG, prompt engineering); research
  and propose innovative solutions for the team’s integration
  portfolio.
  
  ·         Assist in mentoring and guiding more junior team
  members (Sr Analyst III and below); share knowledge and
  contribute to onboarding documentation.
  
  ·         Use Claude Code (or comparable AI coding
  assistants) as a routine part of the development and
  documentation workflow.
  
  Basic Qualifications
  
  ·         Bachelor’s degree in Computer Science or
  equivalent combination of education and experience.
  
  ·         Typically 4+ years of relevant software
  engineering experience, with at least 1+ years in a similar
  backend, API, or integration-focused role.
  
  ·         Strong Python proficiency, including async/await
  patterns, type hints, virtual environments, and the FastAPI
  / Pydantic v2 / httpx ecosystem.
  
  ·         Solid working knowledge of REST APIs, JSON, and
  HTTP fundamentals (auth headers, status codes, streaming).
  
  ·         Proficient with Git and Git-based code review
  workflows on GitHub or GitHub Enterprise.
  
  ·         Comfortable working in a Linux / WSL terminal,
  including reading and writing bash scripts.
  
  ·         Working familiarity with AI/LLM concepts: prompt
  engineering, tool calling, retrieval-augmented generation.
  
  ·         Proficiency in coding and debugging complex
  software components.
  
  ·         Strong problem-solving and analytical skills.
  
  ·         Effective written and verbal communication;
  effective collaboration in a distributed team.
  
  Other Qualifications
  
  ·         Hands-on experience with agentic AI frameworks and
  integration standards (LangGraph, LangChain, MCP, A2A) is a
  strong plus.
  
  ·         Experience with AWS (especially Bedrock) and
  OpenTelemetry-based observability or structured/JSON logging
  frameworks is a plus.
  
  ·         Familiarity with enterprise storage and backup
  technologies (e.g., NetApp ONTAP, Dell PowerProtect, Veeam,
  Commvault, Cohesity, Rubrik) — willingness to learn
  acceptable.
  
  ·         Exposure to GraphQL or async database drivers
  (asyncpg, oracledb) is a plus.
  
  ·         Advanced degree in a related field is a plus.
  
  ·         Relevant cloud, storage, or backup certifications
  are a plus.
  
