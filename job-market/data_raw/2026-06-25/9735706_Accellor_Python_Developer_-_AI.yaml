description: |
  Headquartered in the Silicon Valley with offices in London,
  Hyderabad and Singapore, Accellor is a Microsoft Gold
  Partner and a premier Salesforce Partner that uses best-of-
  breed Cloud technology to deliver superior customer
  engagement and business effectiveness for clients. We bring
  a deep understanding of Financial, Retail, High Tech,
  Healthcare, and Retail industries, rolling out end-to-end
  implementation of salesforce.com and powerful third-party
  apps. We also build products that are sold on the
  AppExchange and used by both boutique businesses and Fortune
  500 companies.  
  
   Majority of our team members based at Hyderabad, delivering
  best of breed cloud solutions to customers in the US, UK and
  APAC region. We’ve created an atmosphere that encourages
  curiosity, constant learning, and persistence. We encourage
  our employees to grow and explore their interests. We
  cultivate an environment of collaboration, autonomy and
  delegation – we know our people have a strong work ethic and
  a sense of pride and ownership over their work. They are
  passionate, eager, and motivated – focused on building the
  perfect solution but never losing sight of the bigger
  picture.
  
  We are looking for a highly motivated and skilled Python
  Developer to join our dynamic team. As an Python Developer,
  you will be responsible for designing, developing, and
  deploying cutting-edge AI and machine learning solutions to
  solve complex business problems. You will collaborate with
  cross-functional teams to identify opportunities for AI/ML
  integration and work on developing scalable and efficient
  algorithms. The ideal candidate should possess a strong
  background in Python, machine learning, programming, and
  data analysis, along with a passion for staying up-to-date
  with the latest advancements in the field of AI.
  
  Responsibilities:
  
  - Develop software using Python, following best practices for
    code structure, readability, and reusability.
  - Implement algorithms and data structures to solve business
    problems efficiently.
  - Participate in the software design and system architecture
    decisions.
  - Ensure that the design of the system is scalable,
    maintainable, and efficient.
  - Identify and fix bugs, errors, and issues in the code.
  - Write unit tests and ensure the software performs according
    to the specifications.
  - Conduct integration testing and system testing to ensure the
    application is reliable.
  - Work closely with other developers, designers, product
    managers, and quality assurance teams.
  - Communicate effectively to understand requirements and
    deliver results that meet user needs.
  - Work with databases such as SQL, PostgreSQL, MySQL, or NoSQL
    systems like MongoDB.
  - Design database schemas, write queries, and ensure data
    integrity.
  
  Requirements
  
  - Minimum 3 years of professional experience in Python
    development.
  - Experience building and deploying scalable, high-
    performance, applications performance optimization and
    scaling applications in hybrid environments.
  - Strong working knowledge of frameworks like Django, Flask,
    or FastAPI.
  - Proficiency in working with databases (SQL/NoSQL).
  - Hands-on experience with RESTful APIs and microservices
    architecture.
  - Familiarity with Cloud Platforms (AWS, Azure, or GCP).
  - Knowledge of CI/CD pipelines and version control tools like
    Git.
  - Excellent problem-solving skills and a collaborative
    mindset.
  
  Nice to have:
  
  - Working experience or exposure to Gen AI
  
  At Accellor, we foster a collaborative and innovative
  environment where creativity and diverse perspectives are
  valued. We are committed to pushing the boundaries of
  technology and delivering solutions that make a meaningful
  impact. Join our team and be part of shaping the future with
  AI and Machine learning.
  
  Benefits
  
  Exciting Projects: We focus on industries like High-Tech,
  communication, media, healthcare, retail and telecom. Our
  customer list is full of fantastic global brands and leaders
  who love what we build for them.
  
   Collaborative Environment: You Can expand your skills by
  collaborating with a diverse team of highly talented people
  in an open, laidback environment — or even abroad in one of
  our global centres. Work-Life Balance: Accellor prioritizes
  work-life balance, which is why we offer flexible work
  schedules, opportunities to work from home, and paid time
  off and holidays. Professional Development: Our dedicated
  Learning & Development team regularly organizes
  Communication skills training, Stress Management program,
  professional certifications, and technical and soft skill
  trainings.
  
   Excellent Benefits: We provide our employees with
  competitive salaries, family medical insurance, Personal
  Accident Insurance, Periodic health awareness program,
  extended maternity leave, annual performance bonuses, and
  referral bonuses.
  
