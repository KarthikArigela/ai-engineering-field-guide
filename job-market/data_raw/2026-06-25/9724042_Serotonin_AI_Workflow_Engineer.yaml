description: |
  Who Is Serotonin
  
  Serotonin is the top go-to-market firm for transformative
  technologies, specializing in marketing, strategy,
  recruiting, and legal services. With a global team of 90
  across 15 countries, Serotonin has supported over 300
  clients in consumer tech, crypto infrastructure, digital
  assets, venture capital, and AI since its launch in 2020.
  Delivering end-to-end go-to-market solutions across all
  major marketing channels, including public relations, growth
  marketing, on-chain analytics, content, research, social,
  and design - Serotonin accelerates global innovation. At the
  core of our business is the Serotonin Platform, serving as a
  central nucleus for the crypto ecosystem, connecting
  builders and founders with essential resources to drive
  business growth.
  
  About the Role
  
  We are building the AI layer across Serotonin's marketing
  operations.
  
  This role sits at the intersection of systems thinking, AI
  tooling, and marketing execution. You will move across our
  marketing teams spanning PR, content, growth, social, and
  design, not to go deep on one team's problems, but to find
  the friction points that show up everywhere and build things
  multiple teams can pull from.
  
  Your job is to understand how those teams work before you
  ever open a tool. That means asking the right questions,
  shadowing stakeholders, mapping actual workflows, and
  identifying where things slow down. The best outcome is
  never a custom fix for one person. It's something three
  teams are running independently six months from now.
  
  This role is best suited for someone who listens to a team
  for 30 minutes, draws a process diagram, identifies the
  friction point, and ships a working solution within a week.
  You will work directly with marketing leads and internal and
  external client teams, translating real workflow problems
  into outcomes that scale across the organization.
  
  Responsibilities
  
  - Diagnose Bottlenecks - spend real time with our different
    core marketing teams before touching any tooling.
    Interview team members, map how work actually moves, and
    identify where things slow down or break.
  - Design & Build for Multiple Teams  - build the workflow
    systems to solve them. That means AI-powered workflows,
    content and campaign pipelines, and no-code automations
    that connect into the tools teams already use: HubSpot,
    Notion, Slack, various native social platforms.
  - Workforce Adoption - You will own the operational backbone
    that makes AI adoption stick across a 90-person global
    team: prompt libraries, SOPs, workflow playbooks. You will
    be responsible for leveling up the AI proficiency across
    the team.
  - Maintain & Scale - Work directly with internal & external
    client teams to diagnose GTM bottlenecks and build AI-
    assisted solutions, from content at scale to campaign
    automation to research synthesis.
  - Upleveling - Evaluate, test, and onboard tools as the
    landscape shifts. Define how we measure impact: time
    saved, output quality, client adoption, etc and build
    reports around what is working and what isn't.
  
