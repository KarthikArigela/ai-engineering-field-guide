description: |
  Are you looking for more? Find it here. At Wells Fargo, we
  believe that a meaningful career is much more than just a
  job. It's about finding all the elements that help you
  thrive, in one place. #LivingTheWellLife means you're
  supported in life, not just work. It means having a
  competitive salary, a robust benefits package, and programs
  to support your work-life balance and well-being. It means
  being rewarded for investing in your community, celebrated
  for being your authentic self, and empowered to grow. About
  this role: Wells Fargo is seeking a Lead Foreign Exchange Ai
  Java Software Engineer in technology as part of Commercial
  and Corporate & Investment Banking Technology (CCIBT). The
  team specializes in Electronic Trading. This position is
  responsible for providing technical leadership in the
  design, development, and support of high-performance
  electronic trading platforms. The role requires close
  collaboration with product partners, traders, quants,
  technology teams, and platform engineers to ensure solutions
  are scalable, resilient, and compliant with enterprise risk
  standards. In this role, you will lead complex initiatives
  within the Electronic Trading technology domain, shaping
  long-term technical strategy and providing hands-on
  leadership across the architecture, design, development,
  testing, and production deployment of trading applications,
  services, and supporting tools. You will drive modernization
  and efficiency through process optimization, platform
  standardization, microservices adoption, and cost-efficient
  resource usage, while ensuring all systems meet enterprise
  risk, compliance, and regulatory controls. The role requires
  close collaboration with product owners, traders, quants,
  platform engineering, and production support teams to
  deliver low-latency, resilient, and scalable solutions. You
  will also apply governed AI-assisted development techniques-
  including LLM-assisted code generation, test automation,
  diagnostics, and observability-and support the adoption of
  standardized, auditable LLM integrations (such as MCP-based
  services), ensuring alignment with Wells Fargo's security,
  risk, and compliance standards. Learn more about the career
  areas and lines of business at wellsfargojobs.com. In this
  role, you will:
  
  - Lead complex initiatives on selected domains
  - Ensure systems are monitored to increase operational
    efficiency and managed to mitigate risk
  - Define opportunities to maximize resource utilization and
    improve processes while reducing cost
  - Lead, design, develop, test and implement applications and
    system components, tools and utilities, models,
    simulation, and analytics to manage complex business
    functions using sophisticated technologies
  - Resolve coding, testing and escalated platform issues of a
    technically challenging nature
  - Lead team to ensure compliance and risk management
    requirements for supported area are met and work with
    other stakeholders to implement key risk initiatives
  - Mentor less experienced software engineers
  - Collaborate and influence all levels of professionals
    including managers
  - Lead Partner team to achieve objectives with production
    support and platform engineering teams effectively
  
  Required Qualifications:
  
  - 5+ years of Specialty Software Engineering experience, or
    equivalent demonstrated through work experience, training,
    military experience, or education
  - 5+ years of experience supporting capital markets businesses
    and processes, including Fixed Income electronic trading,
    algorithmic trading, analytics, and trade lifecycle
  - 5+ years of experience architecting, designing, developing,
    and testing high-performance ECN/Exchange gateways, RFQ,
    pricing, and AMM components integrated with end-to-end
    electronic trading platforms
  - 5+ years of experience handling and troubleshooting high-
    speed market data, order routing, RFQ/RFS, quotations, and
    trading flows across multiple venues and broker-dealers
  - 5+ years of experience working directly with traders,
    business partners, technology teams, and exchanges to
    diagnose and resolve production issues related to trading
    flows, latency, and performance
  - 5+ years of experience establishing testing methodologies
    and resolving escalated issues during functional,
    integration, and performance testing
  - 5+ years of experience with high-performance programming in
    Java and/or Python and/or C++
  
  Desired Qualifications:
  
  - Experience with FIX protocol implementations
  - Advanced understanding of Foreign Exchange electronic
    trading flows, venue interaction, and position/risk
    management
  - Strong working knowledge of networking, multi-threading,
    synchronization, data structures, algorithms, and memory
    management
  - Basic understanding of SEC, FINRA, and other applicable
    regulatory requirements
  - Domain expertise in Fixed Income (Rates, Spread) and/or FX
    with hands-on experience developing electronic trading
    platforms or core components
  - Experience supporting low-latency, high-throughput
    transactional systems
  - Experience using Large Language Model (LLM)-based tools
    within enterprise development environments for
    productivity, diagnostics, or automation use cases
  - Familiarity with agentic patterns and Model Context Protocol
    (MCP)-based integrations for standardized, secure LLM
    interactions is a plus
  
  Job Expectations:
  
  - Ability to travel up to 10% of the time
  - This position offers a hybrid work schedule
  - This position is not eligible for Visa sponsorship
