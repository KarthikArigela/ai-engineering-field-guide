description: |
  Who are we?
  
  Tripledot Studios is one of the largest independent mobile
  games companies in the world.
  
  We are a multi-award-winning organisation, with a global
  2,500+ strong team across 12 studios.
  
  Our expanded portfolio includes some of the biggest titles
  in mobile gaming, collectively reaching top chart positions
  around the world and engaging over 25 million daily active
  users.
  
  Tripledot’s guiding principle is that when people love what
  they do, what they do will be loved by others.
  
  We’re building a company we’re proud of. One filled with
  driven, incredibly smart and detail-orientated people, who
  LOVE making games.
  
  Our ambition is to be the most successful games company in
  the world, and we’re just getting started.
  
  Role overview
  
  As Lead Playable Ads Developer, you will provide technical
  leadership for a growing group of playable developers,
  establishing stronger engineering practices, improving
  delivery workflows, and building a more consistent
  development framework across studio-aligned teams. A central
  part of the role is championing AI-accelerated development:
  using generative AI and automation to speed up builds, scale
  creative variants, and cut repetitive work across the team.
  You'll stay hands-on, contributing directly to playable
  creation and using your own output as a proving ground for
  the workflows you roll out.
  
  Key Responsibilities
  
  - Lead and support a team of playable developers, providing
    day-to-day technical guidance, coaching and line
    management
  - Champion and roll out AI-assisted development across the
    team, using coding assistants and agentic tools (e.g.
    Claude Code, Cursor, Copilot) to accelerate how quickly
    playables are built and iterated
  - Identify, prototype and productionise automation for
    repetitive playable work: creative variant generation,
    asset swapping, MRAID and ad-network export, QA, and video
    capture
  - Evaluate generative AI asset tools (image, video, 3D, audio)
    for playable creative and bring the promising ones into
    the team's workflow
  - Define and implement a scalable development framework for
    the playable ads function, including sensible standards
    and guardrails for AI-assisted work (code quality, review,
    IP and security)
  - Establish and promote strong software engineering practices,
    including maintainable architecture, clean code standards
    and reliable delivery
  - Improve codebase and repository management to support better
    collaboration across the team
  - Train and enable developers to adopt new frameworks,
    workflows, tools and best practices, including AI-driven
    ones
  - Remain hands-on by developing playable ads directly as part
    of the role
  - Partner with stakeholders to support successful delivery of
    playable work across multiple studio contexts
  
  Required Skills, Knowledge and Expertise
  
  - Strong experience building playable ads with a high level of
    technical confidence
  - Hands-on experience building playables in an HTML5 game or
    playable engine such as Cocos Creator, PixiJS, Phaser or
    similar
  - Hands-on experience using generative AI in a development
    context, whether AI coding assistants, automation or
    agentic workflows, or AI asset generation, plus genuine
    enthusiasm for pushing what's possible
  - Ability to evaluate fast-moving AI tooling critically and
    separate real productivity gains from hype
  - Previous experience in a leadership or people management
    capacity, or clear readiness to step into a lead role
  - Deep understanding of software engineering fundamentals and
    how to apply them in a fast-moving production environment
  - Experience setting up or improving development pipelines,
    frameworks and team workflows
  - Knowledge of codebase structure, version control and
    repository management best practices
  - Strong communication skills and the ability to explain
    technical approaches clearly to developers and
    stakeholders
  - A collaborative mindset with the ability to work across
    studio-aligned teams while maintaining shared standards
  
  Working at Tripledot
  
  - 25 days holiday: Enjoy 20 days of paid holiday plus an
    additional 5 days per annum, in addition to bank holidays
    to relax and refresh throughout the year.
  - Hybrid Working
  - Continuous Professional Development: Propel your career with
    continuous opportunities for professional development.
  - Supplemental Health Insurance: Continentale: annual budget
    of 1200 eur - reimbursement for healthcare outside of
    public plans (glasses, messages, dental treatments etc.)
  - Public Transportation reimbursement:  100% of public
    transportation to the office via BVG ticket is covered
  - Employee Assistance Program: Anytime you need it, tap into
    confidential, caring support with our Employee Assistance
    Program, always here to lend an ear and a helping hand.
  - Daily Free Lunch: Order free food from Wolt when at the
    office
  - Pension plan: Opt-in to employer contributed pension plan,
    operated with Degura
