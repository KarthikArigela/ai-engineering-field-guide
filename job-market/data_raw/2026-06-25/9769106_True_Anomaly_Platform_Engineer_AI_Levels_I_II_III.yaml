title: Platform Engineer, AI (Levels I, II, III)
company: True Anomaly
location: Long Beach, USA
work_type: FULL_TIME
description: |
  Space is a warfighting domain. True Anomaly seeks those with
  the talent and ambition to build the technology that secures
  it.
  
  OUR MISSION
  
  True Anomaly delivers decisive capabilities for space
  superiority. We build autonomous spacecraft, advanced
  payloads, mission software, and space-based interceptors —
  enabling the U.S. and its Allies to secure the space
  environment and counter threats from the ultimate high
  ground.
  
  OUR VALUES
  
  - Be the offset. We create asymmetric advantages with
    creativity and ingenuity.
  - What would it take? We challenge assumptions to deliver
    ambitious results.
  - It’s the people. Our team is our competitive advantage and
    we are better together.
  
  YOUR MISSION
  
  At True Anomaly, we're building the next generation of space
  defense. AI-assisted work is the biggest force multiplier
  available to a company at True Anomaly's stage. It
  accelerates how we build, how we deliver, and how we scale.
  We are investing in AI as a core operating capability, not a
  side experiment, and this role exists to help make that
  investment real.
  
  As a Platform Engineer on the AI team, you will build the
  infrastructure, tooling, and integrations that put AI
  directly into the hands and workflows of every team across
  the company. This is not a research role. It is a building
  role. You will implement capabilities that engineers,
  program managers, operators, and business teams use every
  day to move faster and produce better work.
  
  Your work will include building connectors between AI models
  and internal systems, developing custom AI-powered
  applications for specific workflows, implementing API
  integrations, and contributing to platform infrastructure.
  You will work closely with Senior and Staff engineers who
  will provide technical guidance, code review, and mentorship
  as you grow your expertise in AI systems and platform
  engineering.
  
  The platform engineering org, reporting to the Chief
  Security Officer, works across the enterprise, from
  engineering and product to marketing and finance. You will
  have the opportunity to see your work directly accelerate
  how a fast-growing defense technology company operates with
  AI.
  
  RESPONSIBILITIES
  
  - Build and maintain AI platform components: API integrations,
    system connectors (MCP, tool use), authentication flows,
    and data pipelines that connect AI models to internal
    tools
  - Develop custom AI-powered applications and workflows for
    specific business use cases, working from requirements and
    technical designs provided by senior engineers
  - Write clean, well-tested code in Python, TypeScript, or
    similar languages, following team coding standards and
    best practices
  - Participate in code reviews, technical discussions, and
    platform architecture decisions, contributing your
    perspective and learning from more experienced engineers
  - Help maintain documentation for AI platform services,
    including API references, integration guides, and
    troubleshooting resources
  - Support AI training and enablement efforts by contributing
    to internal resources, attending office hours, and helping
    teams adopt AI tools
  - Work with engineering, security, and IT teams to ensure AI
    implementations meet government security and compliance
    requirements
  - Stay current with AI developments and implement them into
    solutions for the company.
  
  QUALIFICATIONS
  
  - Successful candidates demonstrate strong fundamentals,
    ability to learn quickly, and growing independence in
    delivering technical work. They will be passionate about
    AI, while understanding its limitations.
  - Software engineering experience building and shipping code,
    ideally in Python, TypeScript, or similar languages common
    in AI/ML tooling
  - Experience using the latest AI powered development tools to
    deliver production code and automate routine tasks. You
    can read, write, and understand code in at least one
    common programming language like Python, Typescript.
  - Familiarity with REST APIs, webhooks, or other integration
    patterns for connecting software systems
  - Understanding of large language model APIs and concepts like
    prompting, tool use, or RAG (retrieval-augmented
    generation)
  - Ability to learn quickly, ask good questions, and work
    effectively with more senior engineers
  - Effective written and verbal communication skills
  - Comfortable working in a fast-paced environment where
    priorities shift and requirements evolve
  - US Citizenship and ability to obtain and maintain a Top-
    Secret security clearance
  
  PREFERRED SKILLS AND EXPERIENCE
  
  - Experience with cloud platforms (AWS, Azure, GCP) or
    infrastructure-as-code tools
  - Familiarity with CI/CD pipelines, testing frameworks, or
    DevOps practices
  - Experience building integrations with enterprise software
    (Slack, Jira, Confluence, etc.)
  - Background in government, defense, or regulated industries
    with security and compliance requirements
  - Experience with agent frameworks (CrewAI, Pydantic AI,
    LangChain) or embedding/vector databases
  - Active U.S. Secret or Top-Secret security clearance
  
  COMPENSATION
  
  - Colorado Base Salary (L1 to L3): $120,000–$225,000
  - California Base Salary (L1 to L3): $125,000–$235,000
  - Equity + Benefits including Health, Dental, Vision, HRA/HSA
    options, PTO and paid holidays, 401K, Parental Leave
  
  Your actual level and base salary will be determined on a
  case-by-case basis and may vary based on the following
  considerations: job-related knowledge and skills, education,
  location, and experience. ADDITIONAL REQUIREMENTS
  
  Work Location— Long Beach, CA, or Denver, CO. While we
  observe a hybrid work environment, you will need to be
  onsite as the business needs require. Onsite requirements
  are subject to change, particularly when work on classified
  systems is required. On an average week, you can expect to
  spend at least 3 days per week in office.
  
  Work environment—the work environment; temperature, noise
  level, inside or outside, or other factors that will affect
  the person's working conditions while performing the job.
  
  Physical demands—the physical demands of the job, including
  bending, sitting, lifting and driving.
  
  This position will be open until it is successfully filled.
  To submit your application, please follow the directions
  below. #LI-Onsite To conform to U.S. Government space
  technology export regulations, including the International
  Traffic in Arms Regulations (ITAR), you must be a U.S.
  citizen, lawful permanent resident of the U.S., protected
  individual as defined by 8 U.S.C. 1324b(a)(3), or eligible
  to obtain the required authorizations from the U.S.
  Department of State.
  
  To conform to U.S. Government space technology export
  regulations, including the International Traffic in Arms
  Regulations (ITAR) you must be a U.S. citizen, lawful
  permanent resident of the U.S., protected individual as
  defined by 8 U.S.C. 1324b(a)(3), or eligible to obtain the
  required authorizations from the U.S. Department of State.
  
  True Anomaly is committed to equal employment opportunity on
  any basis protected by applicable state and federal laws. If
  you have a disability or additional need that requires
  accommodation, please do not hesitate to let us.
