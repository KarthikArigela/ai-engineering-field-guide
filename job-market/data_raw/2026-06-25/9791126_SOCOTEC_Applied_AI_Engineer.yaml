description: |
  Company Description
  
  SOCOTEC is a provider of niche consulting services within
  the architecture, engineering and construction industries
  focusing on high-performance buildings and specialty
  structures. Through an integrated, holistic approach, our
  professionals provide solutions for building envelope,
  energy efficiency, sustainability, code advisory and
  construction advisory projects
  
  SOCOTEC’s combination of expertise, experience and methods
  are increasingly recognized as best-in-class fueling
  significant growth.
  
  SOCOTEC is proud to announce that it has been officially
  certified as a Great Place to Work by the renowned global
  authority on workplace culture, Great Place to Work®.
  
  Job Description
  
  As an Applied AI Engineer at SOCOTEC, you will be
  responsible for designing, developing, and deploying AI
  models that enhance our chatbot program and other AI-driven
  solutions. You will collaborate with cross-functional teams,
  including data scientists, software engineers, and business
  stakeholders, to integrate advanced AI technologies that
  address real-world challenges within our industry. You will
  focus on building scalable, efficient, and accurate machine
  learning pipelines while staying at the forefront of the
  latest AI advancements.
  
  - Developing AI Models: Design and implement machine learning
    models tailored to natural language processing (NLP) and
    other AI applications within our chatbot and enterprise
    systems.
  - Collaborating with Cross-Functional Teams: Work closely with
    product managers, data scientists, and software engineers
    to translate business requirements into intelligent AI-
    driven solutions.
  - Building and Maintaining AI Pipelines: Create and optimize
    end-to-end machine learning pipelines, from data
    preprocessing to model deployment, ensuring scalability
    and performance.
  - Optimizing Model Performance: Continuously fine-tune and
    improve the accuracy, speed, and robustness of AI models,
    leveraging techniques like hyperparameter tuning and model
    optimization.
  - Implementing Best Practices in AI/ML Development: Ensure the
    reliability and quality of AI models by following best
    practices for training, testing, and model evaluation.
  - Integrating AI Solutions: Work closely with backend
    engineers to integrate AI models into production
    environments using tools like LangChain and cloud
    services.
  - Staying Updated with AI/ML Trends: Keep up with the latest
    developments in AI, machine learning, and natural language
    processing, applying new techniques to improve our
    technology stack.
  - Documentation: Provide detailed documentation of AI
    workflows, models, and algorithms to facilitate
    collaboration and ensure long-term maintainability.
  - Perform all duties as assigned by your manager
  
  Qualifications
  
  - Proficiency in Python and experience with AI/ML libraries
    such as Scikit-learn, TensorFlow, PyTorch, and Hugging
    Face.
  - Strong understanding of natural language processing (NLP)
    and experience building chatbot or conversational AI
    systems.
  - Hands-on experience with AI model development, including
    data preprocessing, model training, evaluation, and
    deployment.
  - Familiarity with AI/ML tools like Jupyter Notebook and cloud
    platforms such as AWS, GCP, or Azure.
  - Experience with version control systems (e.g., Git, GitHub)
    and agile development methodologies.
  - Ability to optimize model performance and scale AI solutions
    for production use.
  - Experience with frameworks like LangChain for building
    conversational AI workflows.
  - The ideal candidate should have at least 2-5 years of
    experience
  
  Preferred Qualifications
  
  - Familiarity with reinforcement learning, transfer learning,
    or other advanced AI techniques.
  - Knowledge of model monitoring, A/B testing, and continuous
    improvement strategies for AI systems.
  - Experience with containerization tools like Docker for
    deploying AI solutions.
  - Passion for exploring and implementing the latest
    advancements in AI technology.
  
  We are seeking a creative and detail-oriented individual who
  is passionate about building and deploying AI-driven
  solutions. If you thrive in a collaborative environment and
  are excited about shaping the future of AI at SOCOTEC, we
  encourage you to apply.
  
  Additional Information
  
  For more information, please visit www.socotec.us
  
  Job Type: Full-Time, onsite 4 days a week
  
  Applicants must be legally authorized to work in the United
  States without the need for current or future employer
  sponsorship.
  
  All your information will be kept confidential according to
  EEO guidelines.
  
  SOCOTEC is an Equal Opportunity Employer.
