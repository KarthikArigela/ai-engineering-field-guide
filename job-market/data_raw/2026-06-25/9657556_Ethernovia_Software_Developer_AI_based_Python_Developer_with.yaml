  Job Description: Software Developer (AI-based Python
  Developer with Networking Protocol)Experience required: 5-10
  years Position Overview
  
  We are seeking a highly skilled Python Developer to design,
  build, and maintain our advanced automated testing
  frameworks and validation infrastructure. In this role, you
  will bridge the gap between software engineering, embedded
  protocols, and AI infrastructure. You will be responsible
  for ensuring the reliability, safety, and performance of our
  embedded systems using Python, Hardware-in-the-Loop (HIL)
  testing, and robust CI/CD pipelines.
  
  Key Responsibilities
  
  - Automation & Software Engineering: Design, develop, and
    maintain clean, scalable, and highly testable automated
    validation frameworks using Python. Implement Object-
    Oriented Programming (OOP) design patterns,
    multithreading, and asynchronous programming to optimize
    test execution.
  - Embedded & Network Validation: Interface Python test scripts
    with physical and simulated microcontrollers using HIL
    testing methodologies. Validate networking protocols and
    analyze traffic down to the frame level.
  - AI Infrastructure Support: Assist in building and
    maintaining the scalable underlying infrastructure
    required to train, validate, and test Machine Learning
    (ML) models at scale.
  - CI/CD & DevOps Integration: Own, script, and maintain robust
    CI/CD pipelines in Jenkins to ensure continuous
    integration and automated test execution. Utilize Docker
    for environment containerization.
  - Collaboration & Documentation: Work closely with development
    and architecture teams to define test strategies, author
    detailed technical documentation, and contribute to
    architectural design specifications.
  
  Role Requirements1. Programming & Software Engineering
  
  - Strong proficiency in Python and its core libraries, with
    demonstrable experience in asynchronous programming,
    multithreading, and OOP design patterns.
  - Proven track record of writing clean, maintainable, and
    robust test code.
  
  2. Networking & Embedded Protocols
  
  - Solid foundational knowledge of networking concepts,
    including Ethernet frame structures, VLAN tagging,
    routing, and switching.
  - Hands-on experience with industrial or automotive embedded
    protocols such as CAN (Controller Area Network) or Modbus
    (RTU/TCP).
  - Experience with Hardware-in-the-Loop (HIL) testing
    environments or interfacing software with
    physical/simulated microcontrollers.
  
  3. AI & Infrastructure (Statistical Learning Theory)
  
  - Basic understanding of AI/ML concepts, specifically
    regression models and predictive analytics.
  - Familiarity with Statistical Learning Theory (SLT) concepts
    or experience building infrastructure for ML model
    training, validation, and testing.
  
  4. DevOps & CI/CD
  
  - Strong experience setting up, maintaining, and scripting
    automated pipelines in Jenkins.
  - Proficient with version control systems (Git) and
    containerization (Docker).
  
  Preferred Qualifications (Nice to Have)
  
  - Hands-on experience with specialized Python libraries:
    python-can, pymodbus, scapy, numpy, or scikit-learn.
  - Professional background in the Automotive (e.g., Autonomous
    Driving, EV) or Industrial Automation sectors.
  - Solid knowledge of Linux system administration and shell
    scripting (Bash).
  
  Soft Skills
  
  - Self-Motivation: Highly self-motivated and capable of
    thriving both independently and within a collaborative
    team environment.
  - Communication: Excellent verbal/written communication and
    documentation skills, comfortable contributing to high-
    level architectural discussions.
  - Attention to Detail: Meticulous attention to detail,
    particularly when dealing with complex system
    architectures and safety-critical implementations.
  
  What We Offer
  
  - Pre-IPO Stock Options: Own a piece of our future success as
    we scale toward our public offering.
  - Technology Depth & Breadth: Unparalleled opportunities for
    technological growth and hands-on exposure across
    embedded, networking, and AI domains that are rare in
    larger organizations.
  - Rapid Career Growth: Significant, merit-based opportunities
    to advance your career as our company expands.
  - Cutting-Edge Tech Stack: Work with the latest advancements
    in networking, embedded systems, and predictive analytics.
  - World-Class Team: Collaborate daily with highly skilled,
    passionate, and supportive industry professionals.
  - Competitive Compensation: A strong base salary package that
    truly reflects your expertise and contributions.
  - Work Flexibility: Enjoy flexible working hours to maintain a
    healthy work-life balance.
