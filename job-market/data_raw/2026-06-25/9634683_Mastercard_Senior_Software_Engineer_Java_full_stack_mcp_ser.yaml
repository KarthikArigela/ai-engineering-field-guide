description: |
  Our Purpose  Mastercard powers economies and empowers people
  in 200+ countries and territories worldwide. Together with
  our customers, we're helping build a sustainable economy
  where everyone can prosper. We support a wide range of
  digital payments choices, making transactions secure,
  simple, smart and accessible. Our technology and innovation,
  partnerships and networks combine to deliver a unique set of
  products and services that help people, businesses and
  governments realize their greatest potential. Title and
  Summary Senior Software Engineer (Java full stack, mcp
  servers, AI engineering technologies, streaming platform)
  All About Us Mastercard is a technology company in the
  global payments business. We connect consumers, financial
  institutions, merchants, governments, and businesses
  worldwide, enabling them to use secure and convenient
  electronic forms of payment. Join one of the world's most
  innovative and engaged teams. Our employees are empowered to
  drive innovation every day in support of a more connected
  world - a world beyond cash. Overview The Mastercard
  Business Intelligence application development team leverages
  modern technologies to build scalable, data-driven solutions
  that deliver advanced analytics and reporting capabilities
  to a global customer base. We collaborate closely with
  product partners and engineering teams to enhance existing
  platforms and deliver new solutions to market. We are
  looking for a Full Stack Engineer (Hands-on Individual
  Contributor) with strong engineering fundamentals and a
  builder mindset. In this role, you will design, develop, and
  deliver production-grade systems with a focus on
  scalability, performance, security, and reliability. Role -
  Key Responsibilities In this role, you will: Design,
  develop, and own Java-based backend services and REST APIs
  in a distributed architecture Build and enhance UI
  applications using Angular and Node.js Ensure high-quality
  code through reviews, testing (unit/integration), and
  automation Drive engineering best practices, including clean
  architecture, performance optimization, and resiliency
  Troubleshoot complex production issues and perform root
  cause analysis across systems Collaborate with cross-
  functional teams to deliver high-quality, scalable solutions
  Own delivery across the lifecycle: estimate and deliver
  design/dev/test/deploy/config/documentation work; automate
  build and run aspects of software. Drive engineering
  excellence through code/test/automation reviews, adoption of
  standards and best practices, and pragmatic design trade-
  offs within the team. Troubleshoot complex issues spanning
  services and AI components, applying strong problem-solving,
  triage, and root-cause discipline. Mentor engineers via
  technical guidance and hands-on reviews (without people-
  management responsibilities), raising the bar on quality,
  operability, and AI readiness All About You - Must-Have
  Skills
  - Core Requirements (Non-Negotiable)
  Strong hands-on experience in Java, Spring Boot, and REST
  APIs Strong hands-on experience with Angular (2+) and
  Node.js Experience building and maintaining scalable,
  production-grade applications Knowledge and experience on
  working with mcp servers, AI engineering technologies,
  streaming
  - Core Engineering Skills
  Strong problem-solving and debugging skills in distributed
  systems Solid understanding of software design principles
  and best practices Experience in test-driven development
  (unit, integration testing) Strong communication and ability
  to collaborate across teams All About You - Nice-to-Have
  Skills Experience with cloud platforms (PCF, Kubernetes,
  AWS, or Azure) Exposure to CI/CD pipelines and DevOps
  practices Experience with observability tools (e.g., Splunk,
  logging, monitoring) Exposure to AI/ML systems or
  integrations with AI platforms (e.g., LLMs, Databricks)
  Corporate Security Responsibility All activities involving
  access to Mastercard assets, information, and networks comes
  with an inherent risk to the organization and, therefore, it
  is expected that every person working for, or on behalf of,
  Mastercard is responsible for information security and must:
  
  - Abide by Mastercard's security policies and practices;
  - Ensure the confidentiality and integrity of the information
    being accessed;
  - Report any suspected information security violation or
    breach, and
  - Complete all periodic mandatory security trainings in
    accordance with Mastercard's guidelines.
