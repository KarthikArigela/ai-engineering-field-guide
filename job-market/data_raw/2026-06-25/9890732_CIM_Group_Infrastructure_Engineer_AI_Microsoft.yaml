  WHAT CIM OFFERS:
  
  At CIM, we believe our success stems from our collective
  efforts, and we are committed to providing well-rounded
  support and resources for our employees. In addition to a
  competitive compensation plan, CIM offers a comprehensive
  benefits program for employees to thrive both inside and
  outside of work. Eligible employees can enjoy a wide range
  of benefits, including:
  
  - A variety of Medical, dental, and vision benefit plans
  - Health Savings Account with a generous employer contribution
  - Company paid life and disability insurance
  - 401(k) savings plan, with company match
  - Comprehensive paid time off, including: vacation days, 10
    designated holidays, sick time, and bereavement leave
  - Up to 16 hours of volunteer time off
  - Up to 16 weeks of Paid Parental Leave
  - Ongoing professional development programs
  - Wellness program, including monthly and quarterly prizes
  - And more!
  
  Actual base salary considers several factors including but
  not limited to geography, job-related knowledge, experience,
  and budget. The start of the salary range is typically
  associated with the minimum experience required. At CIM,
  base pay is one part of the total compensation package. This
  role is eligible for bonus pay in addition to base salary.
  The anticipated base salary range for the position in Los
  Angeles, CA is $108,000 - $125,000.
  
  
  
