description: |
  ABOUT CIM GROUP:
  
  CIM is a community-focused real estate and infrastructure
  owner, operator, lender, and developer. Our team of experts
  works together to identify and create value in real assets,
  benefiting the communities in which we invest. Back in 1994,
  our three founders focused on projects in Southern
  California neighborhoods. Today, we are a diverse team of
  900+ employees with projects across the Americas. Our
  projects have delivered jobs; created comfortable places to
  live, work, and relax; and provided necessary and
  sustainable infrastructure. Our focus on enhancing
  communities is unwavering, and we strive to make an even
  greater impact in the years to come. Join us and make an
  impact today!
  
  POSITION PURPOSE:
  
  As an Infrastructure Engineer, AI focused on Microsoft
  Copilot and the Microsoft Power Platform, you will own the
  design, development, governance, and operational support of
  enterprise AI and productivity solutions. This role is
  responsible for building and administering AI agents using
  Copilot Studio, developing automated workflows, and
  establishing secure, scalable governance models across the
  Power Platform.
  
  You will work directly with business users to enable
  adoption—helping teams design, build, and troubleshoot AI
  agents—while also ensuring solutions align with enterprise
  architecture, security standards, and data governance
  practices. The role operates as an individual contributor
  but will partner closely with a broader, cross-functional AI
  team.
  
