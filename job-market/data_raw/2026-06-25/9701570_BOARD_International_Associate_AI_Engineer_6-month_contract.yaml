description: |
  At Board, we help enterprises plan smarter, drive outcomes
  and lead transformation with one single Intelligent Planning
  Platform. Trusted by thousands of leading organizations,
  over the last 28 years, we have designed our Product with
  enterprise planning agility in mind and the passionate care
  of our people as our main driver. We strongly believe every
  colleague brings unique value to our whole organization. We
  collaborate openly and effectively to deliver results and
  celebrate our shared success, thrive on innovation and
  embrace a growth mindset to aim higher every day. If you’re
  a forward-thinker looking for the great next step in your
  career within an innovative and collaborative environment,
  Board is the right workplace for you! We are looking for an
  Associate AI Engineer to join our AI Center of Excellence on
  a 6-month contract. In this role, you will work alongside AI
  engineers and business stakeholders to design, build, and
  deploy AI-powered solutions that improve business processes
  and drive operational efficiency across the organization.
  You will contribute to real-world AI initiatives, leveraging
  technologies such as Large Language Models (LLMs),
  Retrieval-Augmented Generation (RAG), and agent-based
  architectures to address business challenges and deliver
  measurable impact. What you’ll do
  
  - Partner with teams across Customer Success, Support,
    Professional Services, Sales, and other business functions
    to identify and deliver high-impact AI use cases that
    improve productivity and operational efficiency.
  - Understand business objectives and technical requirements,
    and design AI-powered solutions to address real-world
    challenges.
  - Build, test, and deploy AI applications and production-ready
    prototypes using state of the art technologies.
  - Design and implement AI-enabled workflows, including
    intelligent document processing, multi-agent solutions,
    AI-based routing, and decision-support capabilities.
  - Support the end-to-end delivery of AI initiatives, from use
    case definition and solution design through deployment and
    adoption.
  - Integrate AI solutions with enterprise platforms and
    business systems, including CRM, ERP, ITSM, marketing,
    finance, and procurement applications.
  - Contribute to the development and maintenance of reusable AI
    components, tools, and internal best practices.
  - Collaborate with AI engineers and stakeholders in
    architecture reviews, testing, and knowledge-sharing
    activities.
  - Ensure AI solutions align with governance, security,
    compliance, and responsible AI standards, including
    monitoring for quality, reliability, and potential bias.
  
  What We’re Looking For
  
  - Academic background in Computer Science, Artificial
    Intelligence, Machine Learning, Data Science, Software
    Engineering, or a related field.
  - Knowledge of AI and GenAI fundamentals, either through
    academic or professional work.
  - Experience developing production-level solutions using
    Python and working with APIs, data pipelines, or AI
    frameworks.
  - Experience working with Large Language Models (LLMs),
    Retrieval-Augmented Generation (RAG), vector databases,
    and modern AI development tools.
  - Knowledge of Azure AI Services or other cloud-based AI
    platforms is a plus.
  - Understanding of software development best practices and the
    AI solution lifecycle.
  - Strong analytical and problem-solving skills, with the
    ability to translate business challenges into practical
    solutions.
  - Excellent communication skills, including the ability to
    explain technical concepts to both technical and non-
    technical audiences.
  - Collaborative mindset with the ability to build effective
    working relationships across teams.
  - Customer-focused approach and genuine interest in improving
    business outcomes through technology.
  - Curious, proactive, and eager to learn new technologies in a
    fast-paced environment.
  - Adaptable and comfortable working with ambiguity, changing
    priorities, and evolving business requirements.
  - Strong organizational and time-management skills, with
    attention to detail and a commitment to delivering high-
    quality work.
  - Creative thinker with a passion for innovation, continuous
    improvement, and emerging AI technologies.
  
  Our Commitment to Diversity, Equity and Inclusion Join a
  company that believes in the added value of diversity,
  inclusion, and belonging. We foster a working environment in
  which all people are respected and valued, for all aspects
  which make them unique. We hire you for who you are, and we
  want you to bring your true self to work every day!
