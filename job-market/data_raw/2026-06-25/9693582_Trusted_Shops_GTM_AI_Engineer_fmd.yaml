description: |
  At Trusted Shops, we’re shaping Europe’s Community of Trust
  – a space where Businesses and Consumers connect with
  confidence, transparency, and security. Every day, millions
  of Users and thousands of Companies across Europe trust us
  to deliver safe, reliable, and seamless digital experiences.
  
  To join our Revenue Operations Department, we are looking
  for a:
  
  GTM AI Engineer (f/m/d)
  
  Cologne (hybrid) or Berlin (remote) | Permanent Contract
  (Full-time) As GTM Engineer, you are the architect behind
  Trusted Shops' agentic revenue infrastructure. You build,
  deploy, and maintain the AI agents and automated workflows
  that transform how Sales, AM, and CSM teams operate day to
  day. Where others talk about AI transformation, you make it
  real: autonomous CRM updates from call transcripts, AI co-
  pilots that guide reps through deals, predictive churn
  alerts that trigger proactive outreach, and dynamic pipeline
  scoring that adapts in real time.
  
  Your Key Responsibilities:
  
  - Build and deploy AI agents that act as co-pilots for Sales,
    AM, and CSM – from deal guidance and next-best-action
    recommendations to automated follow-ups and renewal nudges
  - Implement autonomous data orchestration: agents that listen
    to calls, parse emails, and update CRM fields with high
    accuracy, keeping the data foundation "AI-ready" at all
    times
  - Develop agentic automation frameworks that go beyond simple
    "if-this-then-that" workflows – agents that reason, adapt,
    and act on complex business logic
  - Design and maintain the signal-based data architecture that
    feeds AI models with real-time behavioural, engagement,
    and usage signals
  - Build automated forecasting pipelines that deliver
    floor/ceiling predictions based on historical patterns and
    current pipeline velocity
  - Collaborate with the Process Manager to translate process
    designs into technical implementations and automated
    workflows
  - Work closely with PlatformOps, Engineering and Data teams to
    ensure seamless integration across the tech stack
    (Salesforce, Hubspot, BI)
  - Continuously evaluate and integrate new AI tools and
    platforms; stay ahead of the rapidly evolving agentic AI
    landscape
  - Monitor agent performance, accuracy, and reliability;
    implement guardrails and feedback loops
  
  Why Join Trusted Shops?
  
  - Shape the Future of AI at Scale: Drive how AI becomes an
    integral part of the product DNA of a European leading
    trust Tech Company
  - Modern Tech Stack: Work hands-on with cutting-edge
    Generative AI Frameworks, scalable Architectures, and the
    latest Technologies that power innovative digital
    Solutions
  - Growth and Learning Culture: Keep growing with dedicated
    time and budget for continuous learning, AI exploration,
    and professional development in an environment that values
    curiosity and innovation
  - Flexible Work Environment: Benefit from remote work options,
    flexible hours, and a healthy Work-Life Balance that
    supports you both professionally and personally
  - Inclusive and Purpose-Driven Culture: Join a diverse, open-
    minded Team that believes in building trust, empowering
    People, and driving meaningful progress - together
  
  - 3+ years of experience in a technical GTM, Sales
    Engineering, RevOps Engineering, or Marketing/Sales
    Automation role
  - Strong hands-on skills in building automations and
    integrations (APIs, webhooks, iPaaS platforms)
  - Profound experience with AI/ML in a business context –
    you've built or managed AI-powered workflows, chatbots,
    scoring models, or similar
  - Proficiency in prompt engineering and the ability to
    "program" AI agents to follow complex business logic
  - Familiarity with LLM-based tools and agentic AI frameworks
  - Solid understanding of CRM data models (ideally Salesforce)
    and how to maintain data quality at scale
  - Comfortable with scripting/coding (Python, JavaScript, or
    similar) – you can build prototypes and debug integrations
  - Passionate about the intersection of AI and revenue – you
    follow the space, experiment with new tools, and have
    strong opinions on what works
  - Fluent English; German is a plus
  
  What we offer you:
  
  - Hybrid work: Combine flexible remote work with team time in
    the Cologne office (on-site days depending on your
    location)
  - Workation: Temporarily work from a destination of your
    choice within the EU, Iceland, Liechtenstein or Norway
  - Permanent contract with Europe's trusted brand
  - 28 vacation days + 2.5 additional days off at Christmas, New
    Year's Eve and Carnival
  - Buddy programme (an experienced trustee is at your side)
  - Individual training opportunities
  - Events (Team Events, Unit Events, etc.)
  - Health Pass (free online and offline sports, fitness and
    health courses)
  
  BUILD A COMMUNITY OF TRUST WITH US - #cometotrust Not sure
  if you are what we are looking for? Apply! At Trusted Shops,
  we are interested in you as a person - whether you fit in
  with us is independent of gender, nationality, ethnic and
  social origin, religion/belief, disability, age, sexual
  orientation and identity. Trusted Shops is clearly committed
  to diversity and against discrimination.
