description: |
  This role is for one of the Weekday's clients
  
  Min Experience:6+ years
  
  Location: Bangalore
  
  Employment Type: Full-Time
  
  We are seeking a highly skilled Senior QA Engineer (AI) to
  join our growing Quality Engineering team. The ideal
  candidate will have strong experience in software testing,
  quality assurance, test automation, and modern Quality
  Engineering practices, along with exposure to AI-powered
  applications and intelligent systems. In this role, you will
  be responsible for ensuring the quality, reliability,
  performance, and scalability of AI-enabled products and
  platforms through comprehensive testing strategies and
  automation frameworks.
  
  As a Senior QA Engineer, you will collaborate closely with
  developers, product managers, data scientists, and DevOps
  teams to build and maintain robust testing processes across
  the software development lifecycle. You will play a critical
  role in validating both traditional software functionality
  and AI-driven features, helping deliver high-quality
  products that meet customer expectations and business
  objectives.
  
  RequirementsKey Responsibilities
  
  - Design, develop, and execute comprehensive test plans, test
    cases, and test strategies for web, mobile, API, and AI-
    driven applications.
  - Build and maintain scalable automated testing frameworks to
    improve test coverage, efficiency, and release confidence.
  - Perform functional, regression, integration, system,
    performance, and end-to-end testing.
  - Validate AI and machine learning-based features for
    accuracy, consistency, reliability, and expected behavior.
  - Collaborate with cross-functional teams to understand
    product requirements and define quality standards.
  - Identify, document, track, and verify software defects
    through resolution.
  - Participate in sprint planning, requirement reviews, and
    design discussions to ensure quality is embedded early in
    the development process.
  - Analyze test results, identify root causes of issues, and
    provide actionable recommendations.
  - Develop automated test suites for APIs, microservices, and
    user interfaces.
  - Ensure compliance with established quality engineering
    practices, standards, and processes.
  - Work closely with DevOps teams to integrate automated
    testing into CI/CD pipelines.
  - Monitor application quality metrics and contribute to
    continuous process improvement initiatives.
  - Mentor junior QA engineers and promote best practices across
    the team.
  
  Required Qualifications
  
  - Bachelor's or Master's degree in Computer Science,
    Engineering, Information Technology, or a related field.
  - 6–17 years of experience in Software Quality Assurance,
    Testing, Quality Engineering, or SDET roles.
  - Strong understanding of software testing methodologies, QA
    processes, and defect lifecycle management.
  - Hands-on experience in test automation using modern
    frameworks and tools.
  - Experience testing web applications, APIs, distributed
    systems, and enterprise platforms.
  - Strong knowledge of functional, regression, integration,
    system, and performance testing.
  - Proficiency in scripting or programming languages such as
    Java, Python, JavaScript, or similar.
  - Experience working in Agile and Scrum development
    environments.
  - Familiarity with CI/CD pipelines, version control systems,
    and test management tools.
  - Strong analytical, troubleshooting, and problem-solving
    skills.
  - Excellent verbal and written communication abilities.
  
  Good-to-Have Skills
  
  - Exposure to AI, Machine Learning, Generative AI, or Large
    Language Model (LLM)-based applications.
  - Experience evaluating AI model outputs, prompt testing, and
    AI system validation.
  - Knowledge of cloud platforms and containerized environments.
  - Understanding of data quality testing and model performance
    validation.
  - Experience with performance, security, and reliability
    testing.
  - Familiarity with modern Quality Engineering transformation
    initiatives and shift-left testing practices.
  
  What We Offer
  
  - Opportunity to work on innovative AI-powered products and
    technologies.
  - Collaborative and high-impact engineering environment.
  - Exposure to cutting-edge Quality Engineering and automation
    practices.
  - Professional growth, learning, and leadership opportunities.
  - Competitive compensation and comprehensive benefits package.
