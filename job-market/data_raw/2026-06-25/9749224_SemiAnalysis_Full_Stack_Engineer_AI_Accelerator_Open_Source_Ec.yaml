description: |
  About SemiAnalysis
  
  SemiAnalysis is an independent research and analysis firm
  specializing in the Semiconductor and AI industries. Our in-
  depth coverage spans the entire supply chain, from
  semiconductor fabrication processes to state-of-the-art AI
  Models, CUDA kernels, and GPU cloud infrastructure. We are
  recognized as the leading authority on AI infrastructure,
  with the highest concentration of industry experts within
  one team, and a deep-rooted passion for delving into the
  intricacies.
  
  We’re a global team of over 20 analysts & engineers, each
  with extensive networks across the semiconductor supply
  chain and AI ecosystem, publishing industry‑shaping articles
  while participating in 40+ conferences annually.
  
  Our newsletter reaches more than 200 000 subscribers
  worldwide, including senior management and C‑suite leaders
  at the leading semiconductor and AI companies.
  
  Some of industry-shaping articles are:
  
  - InferenceMAX: The world first open inference benchmark that
    continuous benchmarks performance of popular frontier
    models
  - MI300X vs H100 vs H200 Training: Extensive Benchmarking &
    Deep Dive into CUDA & ROCm training developer experience &
    performance
  - Trainium2 Architecture & Networking: Deep Dive into Amazon’s
    new Trainium2 rack scale system & 3D torus scale up
    topology
  
  Find out more here: https://semianalysis.com
  
  Position Overview
  
  We are seeking a highly motivated & skilled Member of
  Technical Staff to join our growing engineering team.
  
  Member of Technical Staff will play a crucial role in
  building & scaling our internal (soon to be open sourced) AI
  Accelerator Open Source Ecosystem Tracker — a full-stack
  Next.js application that tracks pull requests, test parity,
  CI health, and performance benchmarks across all open-source
  projects in the CUDA/ROCm/Trainium/TPU software ecosystem.
  You will also play a role in writing and preparing weekly
  digests & technical reports on upstream contribution health,
  ROCm/CUDA/Trainium/TPU parity trends, and cross-accelerator
  benchmark results, with the opportunity for direct
  authorship recognition.
  
  We are hiring individual contributors at all experience
  levels. Compensation will be competitive.
  
  As part of the interview process, you'll complete a paid
  coding challenge designed to reflect typical daily tasks —
  building full stack interactive apps, designing database
  schemas for PR metrics, and integrating GitHub API data
  pipelines.
  
  Qualifications
  
  - Proactive, self-motivated, and capable of working
    independently in a global team with demonstrated
    experience in React, Next.js (App Router, Server
    Components, Server Actions), TypeScript, and SQL
    (Postgres/Neon).
  - Solid understanding of at least 1 of the following:
    PostgreSQL schema design & query optimization, GitHub API
    integration & webhook-driven data pipelines, and/or AI
    accelerator stacks (ROCm, CUDA, HIP, XLA/TPU, PyTorch,
    JAX, Neuron/Trainium).
  - Strong research skills and the ability to synthesize CI test
    results, parity metrics, and benchmark data across
    multiple hardware platforms (AMD, NVIDIA, Google TPU, AWS
    Trainium) to draw actionable insights.
  - Interest in learning machine learning, AI, LLM, TPU, GPUs,
    Trainium, etc.
  - Experience with data visualization libraries (Chart.js,
    D3.js, Recharts), Vercel deployment, GitHub Actions CI/CD,
    and open-source community engagement is a plus.
  
  Why SemiAnalysis?
  
  At SemiAnalysis, you’re placed directly inside the most
  important conversations shaping the future of AI and
  semiconductors. You’ll develop a first-principles
  understanding of the technical and economic dynamics behind
  the world’s most consequential technology, with rare end-to-
  end visibility across the entire stack—from silicon and
  systems to models, software, and real-world deployment. Our
  work is read and relied upon by the people allocating
  capital, building infrastructure, and setting strategy
  across the industry, giving your research and analysis real,
  measurable impact.
  
  The environment is built for learning and autonomy. You’ll
  have the freedom to chase interesting ideas, dig into
  emerging trends early, and continuously expand your
  technical and economic toolkit, supported by generous PTO,
  office stipends, competitive healthcare (medical, dental,
  vision), and support for conferences and ongoing learning.
