description: |
  Requisition Number: 2354041 Design and scale voice & chat
  conversational AI solutions using Amazon Lex, Dialogflow
  (ES/CX), and Google CX / Agent Studio, with strong focus on
  engineering excellence across CCaaS integrations, Agile
  delivery, and AI-assisted development. Key Responsibilities
  
  - Build and deploy voice bots/chatbots (Lex, Dialogflow, CX)
  - Design intents, entities, flows, and multi-turn
    conversations
  - Integrate bots with backend systems via APIs, webhooks,
    microservices
  - Enable voice-first capabilities (STT/TTS)
  - Integrate with CCaaS platforms (Amazon Connect, Google CCAI,
    Genesys, NICE, etc.) for:
    - Call routing, IVR automation, and agent handoff
    - Real-time voice interactions and escalation workflows
  - Leverage AI tools (Copilot, GenAI) for development, testing,
    and flow automation
  - Manage model lifecycle (training, deployment, monitoring,
    tuning)
  - Optimize bots using analytics, logs, and feedback loops
  - Ensure low latency, high availability, and seamless human
    handoff
  
  Engineering & Delivery
  
  - Apply clean code, modular design, and best practices
  - Implement CI/CD, automated testing, and DevOps pipelines
  - Enable observability (logging, monitoring)
  - Work in Agile/Scrum, delivering iterative releases
  - Own end-to-end lifecycle: build → deploy → operate →
    optimize
  
  Required Skills/Experience
  
  - Hands-on experience with:
    - Amazon Lex, Dialogflow ES/CX, Google CX / CCAI
  - Experience with CCaaS integrations (Amazon Connect, Genesys,
    NICE, etc.)
  - Strong understanding of:
    - NLP, conversational design, voice UX
  - Programming: Python / Node.js / Java
  - Experience in APIs, cloud (AWS/GCP), CI/CD
  - Familiarity with AI-assisted development & prompt
    engineering
  - Knowledge of model lifecycle & deployment
  
  Preferred
  
  - Exposure to LLMs, RAG, GenAI architectures
  - Experience in enterprise contact center transformations
  - Knowledge of Docker/Kubernetes
  
