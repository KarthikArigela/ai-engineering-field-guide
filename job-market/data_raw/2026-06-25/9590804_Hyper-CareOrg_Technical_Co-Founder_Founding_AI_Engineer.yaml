description: |
  Technical Co-Founder / Founding AI Engineer
  
  Patient-Controlled Health Data Infrastructure | AI-Native |
  Remote | Founder-Track Equity
  
  About Hyper-Care (www.hyper-care.org)
  
  We are building the trust layer for patient-controlled
  health intelligence.
  
  Today, institutions collect, control, and monetize health
  data. Patients rarely control access, participation, or
  economic value. We are changing that by building secure,
  consent-aware infrastructure that allows individuals to
  control how their health data is accessed, shared, and used
  across healthcare, nonprofit, research, and life sciences
  environments.
  
  Founded by proven builders with $2B+ in aggregate exits and
  Big 4 pedigree.
  
  This is not another patient portal or app. Hyper-Care is
  foundational infrastructure for AI-native healthcare,
  designed to accelerate R&D innovation and unlock the next
  era of precision medicine.
  
   We are looking for a technical builder with founder
  instincts. Someone who thrives in ambiguity, creates
  momentum without waiting for permission, and wants to own
  the platform as a partner in the company.
  
  You will work directly with the founding team to architect,
  ship, and scale the platform. You will own the technical
  outcomes, shape product direction, define engineering
  standards, and become the person future engineers are
  measured against.
  
  What you will own
  
  - The core platform architecture for patient data custody,
    consent management, and longitudinal health data workflows
  - AI-native product workflows using LLMs, agents, RAG, MCP-
    connected tooling, and human-in-the-loop systems where
    appropriate
  - Secure API and integration architecture across EHR systems,
    nonprofit partners, and life sciences environments
  - A mobile-first patient experience built around usability,
    trust, and consent
  - The technical hiring bar, engineering culture, and build
    velocity for the company
  
  What we are looking for
  
  - Senior full-stack builder with strong product judgment and
    founder-level ownership
  - Ability to personally ship across frontend, backend, data,
    infrastructure, and AI workflows
  - Production experience with LLM-powered applications, agentic
    workflows, RAG, or AI assisted development
  - Familiarity with modern AI driven development techniques
    including spec-driven development
  - Strong systems thinking around security, privacy,
    compliance, and regulated environments
  - Ability to simplify ambiguity, make tradeoffs, and ship
    without waiting for permission
  - High-integrity collaborator who wants to build a category-
    defining company, not just write code
  - Authorized to work in the U.S. required. Background check
    and references required. No visa sponsorship
  
  Bonus points
  
  - Healthcare, life sciences, clinical data, HL7/FHIR, EHR,
    RWE, or patient data experience
  - Experience building in HIPAA, GDPR, SOC 2, or other
    regulated environments
  - Prior founding team, pre-seed, or 0-to-1 startup experience
  - Familiarity with W3C Solid Standard, decentralized identity,
    data custody, or patient-controlled data models
  
  Compensation and ownership
  
  This is a sweat-equity founding role until seed financing
  closes (Q3 2026). We are bootstrapping and pre-fundraising.
  The right person will receive meaningful founder-track
  equity, with final structure based on role scope, time
  commitment, contribution level, and mutual fit.
  
  Post-financing, the role is expected to convert to market
  salary, benefits, and executive-level compensation.
  
  If you are looking for a conventional engineering job, this
  is not it. If you want to build the trusted infrastructure
  layer for patient-controlled healthcare, we should talk.
