title: AI Developer Enablement Engineer
company: Factset
location: 
work_type: FULL_TIME
company_size: 10,310 Employees
description: |
  FactSet creates flexible, open data and software solutions
  for over 200,000 investment professionals worldwide,
  providing instant access to financial data and analytics
  that investors use to make crucial decisions.
  
  At FactSet, our values are the foundation of everything we
  do. They express how we act and operate, serve as a compass
  in our decision-making, and play a big role in how we treat
  each other, our clients, and our communities. We believe
  that the best ideas can come from anyone, anywhere, at any
  time, and that curiosity is the key to anticipating our
  clients’ needs and exceeding their expectations.
  
  What You'll Do
  
  - Design and build internal AI tooling that supports automated
    remediation and migration
  - workflows across the developer platform
  - Deploy and integrate AI tools (including LLM-based
    assistants, code analysis agents,
  - and CI/CD-integrated tooling) into existing developer
    workflows
  - Troubleshoot and support developers experiencing issues with
    AI tooling — acting as
  - the subject matter expert for AI-assisted development
  - Collaborate with teams to embed AI capabilities into build
    practices, upgrade cycles
  - and security patching pipelines
  - Measure and report on outcomes: faster upgrade cycles,
    reduced manual remediation
  - effort, and cost avoidance
  - Continuously improve tooling based on developer feedback and
    usage patterns
  
  What We're Looking For
  
  - Proficiency in **Go (Golang)**
  - Hands-on experience building or integrating AI/LLM tooling
    (e.g., Claude, OpenAI
  - APIs, GitHub Copilot, or similar)
  - comfortable in the Linux CLI or Windows
  - experience of developer workflows, CI/CD pipelines, and
    DevOps practices
  - Ability to both build new tooling from scratch and
    configure/deploy existing AI platforms
  - troubleshooting skills - comfortable being the go-to person
    when something breaks
  
  Nice to Have:
  
  - Experience with security remediation, dependency management,
    or legacy code modernization
  - Familiarity with platform engineering or internal developer
    platform (IDP) concepts
  
  What's In It For You
  
  At FactSet, our people are our greatest asset, and our
  culture is our biggest competitive advantage. Being a
  FactSetter means:
  
  - The opportunity to join an S&P 500 company with over 45
    years of sustainable growth powered by the entrepreneurial
    spirit of a start-up.
  
  - Support for your total well-being. This includes health,
    life, and disability insurance, as well as retirement
    savings plans and a discounted employee stock purchase
    program, plus paid time off for holidays, family leave,
    and company-wide wellness days.
  
  - Flexible work accommodations. We value work/life harmony and
    offer our employees a range of accommodations to help them
    achieve success both at work and in their personal lives.
  
  - A global community dedicated to volunteerism and
    sustainability, where collaboration is always encouraged,
    and individuality drives solutions.
  
  - Career progression planning with dedicated time each month
    for learning and development.
  
  - Business Resource Groups open to all employees that serve as
    a catalyst for connection, growth, and belonging.
  
  Learn more about our benefits here.
  
  Salary is just one component of our compensation package and
  is based on several factors including but not limited to
  education, work experience, and certifications.
  
  Company Overview:
  
  FactSet (NYSE:FDS | NASDAQ:FDS) helps the financial
  community to see more, think bigger, and work better. Our
  digital platform and enterprise solutions deliver financial
  data, analytics, and open technology to more than 8,200
  global clients, including over 200,000 individual users.
  Clients across the buy-side and sell-side, as well as wealth
  managers, private equity firms, and corporations, achieve
  more every day with our comprehensive and connected content,
  flexible next-generation workflow solutions, and client-
  centric specialized support. As a member of the S&P 500, we
  are committed to sustainable growth and have been recognized
  among the Best Places to Work in 2023 by Glassdoor as a
  Glassdoor Employees’ Choice Award winner. Learn more
  at www.factset.com and follow us on X and LinkedIn.
  
  At FactSet, we celebrate difference of thought, experience,
  and perspective. Qualified applicants will be considered for
  employment without regard to characteristics protected by
  law.
