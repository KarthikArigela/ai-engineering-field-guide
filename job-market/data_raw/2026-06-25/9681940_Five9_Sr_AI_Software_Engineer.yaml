description: |
  Join us in bringing joy to customer experience.  Five9 is a
  leading provider of cloud contact center software, bringing
  the power of cloud innovation to customers worldwide.
  
  Living our values everyday results in our team-first culture
  and enables us to innovate, grow, and thrive while enjoying
  the journey together. We celebrate diversity and foster an
  inclusive environment, empowering our employees to be their
  authentic selves.
  
  About the Role
  
  We are looking for a Senior Frontend Engineer to join the AI
  team at Five9, building tools that enable 3rd-party Contact
  Center and call recording platform customers to integrate
  with Five9's AI capabilities.
  
  You will own the frontend of a standalone AI application
  used by enterprise customers and sales teams, working
  closely with product, AI, and backend engineering to deliver
  fast, reliable, and intuitive experiences in a real-time
  contact center environment.
  
  What You'll Do
  
  - Build and maintain the AI Standalone frontend application,
    including data ingestion, mapping, and transformation
    workflows
  - Develop real-time UI features using WebSocket and streaming
    protocols for live agent and supervisor experiences
  - Design and deliver desktop applications (Electron or
    equivalent) alongside web-based interfaces where the use
    case demands it
  - Design intuitive interfaces for non-technical operations and
    sales users working with contact center data
  - Implement scalable frontend architectures including
    Microfrontend patterns for modular, multi-team codebases
  - Collaborate with backend and AI platform teams on
    integration patterns for real-time data and AI-driven
    features
  - Build and maintain CI/CD pipelines, automated test
    validation, and code quality checks to support fast
    delivery
  - Instrument applications with observability and session
    tooling (Sentry, LogRocket, New Relic, or equivalent)
  - Lead and mentor engineers within the team and contribute to
    frontend engineering standards and practices
  - Support expanding integrations across multiple 3rd-party
    CCaaS platforms and enterprise customers
  
  What You Bring
  
  - 4+ years of hands-on frontend engineering experience
    shipping production applications at scale
  - Proficiency in modern JavaScript/TypeScript and React
    (primary stack)
  - Proven experience building real-time applications using
    WebSocket or SSE - live dashboards, agent assist overlays,
    streaming transcripts, or similar
  - Experience building or maintaining Electron-based desktop
    applications, including packaging, auto-update, and cross-
    platform distribution
  - Understanding of Contact Center domain concepts: call flows,
    agent states, dispositions, queue management, recordings,
    and CCaaS platforms (Genesys, NICE, Avaya, Amazon Connect,
    or similar)
  - Working knowledge of Agent Assist or AI Agents platform
    development - building or consuming AI-driven features
    such as copilots, real-time transcription, or supervisor
    monitoring in a contact center context
  - Experience with Microfrontend architecture (Webpack Module
    Federation or equivalent) for large, multi-team
    applications
  - Hands-on with CI/CD tooling (Jenkins, Harness, or similar)
    and automating build validation and deployment pipelines
  - Ability to design clean, usable interfaces for enterprise
    operational users
  - Experience with cloud deployment to S3 or CDN-backed
    infrastructure
  
  Nice to Have
  
  - Background in speech analytics, conversation intelligence,
    or post-call QA platforms
  - Experience with HLS or other media streaming protocols in a
    browser or desktop context
  - Prior work on multi-tenant SaaS products serving multiple
    enterprise customers
  - Hands-on with observability and analytics tooling:
    LogRocket, Sentry, New Relic, Mixpanel, or Loggly
  - Experience with browser-based file processing: CSV parsing,
    client-side data transformation, and download workflows
  
