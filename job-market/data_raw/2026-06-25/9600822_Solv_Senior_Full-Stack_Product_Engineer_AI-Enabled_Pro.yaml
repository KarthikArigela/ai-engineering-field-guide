job_id: 9600822
title: Senior Full-Stack Product Engineer, AI-Enabled Products
company: Solv.
location: USA
work_type: FULL_TIME
description: |
  Being sick or injured is painful. Getting better shouldn’t
  be.
  
  Most industries have been transformed by new technology.
  Healthcare is still waiting — and you can help change that.
  
  Our mission is simple but ambitious: make healthcare
  accessible, transparent, and effortless for all. We put the
  consumer at the center, move fast and partner with forward-
  thinking providers to deliver software that makes care
  better, faster, and more human. This is work with real-world
  stakes — and you can help lead the way.
  
  Solv is building AI-powered healthcare infrastructure that
  makes everyday care easier for patients and the teams who
  care for them, from finding and receiving care to helping
  clinics reduce manual work, improve access, and run better
  operations.
  
  This role is for someone who can take broad product and
  business direction, shape the path forward, and drive it to
  production. We’re looking for someone who models ownership
  without ego: no useful product work is beneath you when it
  helps the team ship better software for customers.
  
  We believe in leaving the product better than you found it.
  That means improving the user experience, reliability,
  workflows, data quality, supportability, and business
  outcome as part of the work, not just changing the code.
  
  What You’ll Be Doing
  
  - Take broad product and business direction and turn it into
    shipped, high-impact product work
  - Make strong product and technical decisions with limited
    hand-holding
  - Use AI tools across the development lifecycle while
    maintaining ownership of product judgment, technical
    decisions, and production quality
  - Lead projects from problem definition through scoping,
    implementation, rollout, verification, and iteration
  - Partner closely with product managers, designers, engineers,
    and customer success to scope, plan, build, launch, and
    iterate on product improvements
  - Build and scale enterprise-grade product experiences that
    account for permissions, workflows, edge cases, reporting,
    reliability, supportability, auditability, and operational
    complexity
  - Bring strong intuition for what makes web applications
    successful in production, including performance,
    accessibility, observability, responsive design, and
    graceful degradation
  - Mentor peers by modeling pragmatic engineering judgment,
    strong ownership, and customer-focused execution
  
  You'll be great for this role if you
  
  - Have 5+ years of experience building, shipping, and
    maintaining production web applications
    - Have strong full-stack product engineering experience across
      frontend, backend, APIs, data models, and production
      debugging
    - Can quickly understand unfamiliar codebases and contribute
      safely to production systems
    - Have experience with React or similar frontend frameworks
    - Have backend experience in Python or similar server-side
      environments
    - Have experience with SQL databases such as Postgres or
      similar relational systems
  - Can independently take ambiguous requirements and turn them
    into a sensible product and technical plan
    - Are highly capable of making product decisions, not just
      implementing tickets
    - Have strong judgment around tradeoffs between speed,
      quality, product value, technical elegance, and long-
      term maintainability
    - Are business-driven and motivated by measurable customer and
      company outcomes
  - Have demonstrated fluency with AI-assisted development tools
    in real production work
    - Use AI tools thoughtfully for implementation, testing,
      debugging, code review, or product exploration
    - Stay current with emerging AI development tools and
      experiment with new capabilities that can improve speed,
      quality, or product outcomes
  - Have well-developed instincts for building web products that
    work well in the real world
    - Notice when a product area needs more than the requested
      code change, and have the judgment to improve the right
      things without boiling the ocean
    - Understand that enterprise products require more than a
      happy-path UI, including permissions, auditability, edge
      cases, data quality, operational workflows,
      supportability, reporting, reliability, and trust
  - Bring a no-ego approach to product work, with a willingness
    to jump into whatever helps the team improve the product
    and ship the right outcome
  - Have experience contributing to cross-functional technical
    efforts and coordinating across teams
  - Enjoy mentoring other engineers while still being hands-on
    and delivery-oriented
  
  Nice To Haves:
  
  - Experience with enterprise SaaS
  - Experience with React, Remix, Python, FastAPI, Postgres, or
    similar technologies
  - Experience leading projects that involved complex workflows,
    enterprise customers, or operationally sensitive product
    areas
  
  Salary ranges vary by location and experience level:
  
  - San Francisco & New York: $160,000 - $210,000
  - Colorado: $150,000 - $200,000
  - All other locations: $150,000 - $210,000
  
  Solv offers robust benefits including:
  
  - Solv equity for full time US based employees
  - Medical, Dental, Vision Insurance - 100% for employees
  - 401k plan available
  - Up to 12 weeks of paid Parental Leave
  - Monthly Wellness Reimbursement
  - Flexible Time Off
  - Company Paid Life Insurance, LTD, and STD
  - Company contribution towards HSA
  - Medical and Dependent care FSAs available
  
  This position is being hired on an urgent basis. The
  application window may close before August 31 if a
  sufficient number of applications to select a candidate are
  received prior to that date.
  
  Unfortunately, we are unable to sponsor visas at this time.
