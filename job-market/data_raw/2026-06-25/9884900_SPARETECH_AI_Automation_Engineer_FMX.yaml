description: |
  Mission
  
  We are hiring our first AI Automation Engineer to design,
  build, and scale AI-powered workflows and agents across the
  company. This role is hands-on and impact driven. You will
  partner with Product, Engineering, GTM, and Internal
  Operations to turn real operational problems into reliable,
  production-ready automations used every day, while also
  advising teams on how AI can be applied effectively in their
  domain. Your work will be visible in how teams operate, how
  fast we move, and how smart our processes become. Success
  will be measured in hours saved, error reduction, and higher
  throughput across the business. The role reports to the VP
  of Engineering and operates with a high degree of autonomy.
  
  We offer you the opportunity to
  
  - Deliver AI-powered workflows and agents with clear owners
    and measurable impact, such as hours saved, error
    reduction, and throughput gains.
  - Identify and prioritize high‑value automation opportunities,
    shaping them into scoped use cases with expected
    efficiency outcomes.
  - Set up, own, and continuously evolve the company AI
    toolchain to drive AI automations, workflows, and agents.
  - Help define and maintain the practical operating model for
    AI workflows across the company, including how they are
    requested, approved, documented, secured, monitored, and
    maintained.
  - Enable teams to use modern AI tools through short, practical
    sessions, driving measurable adoption and satisfaction.
  - Build fast AI-powered prototypes, evolve successful pilots
    into stable production workflows, and ensure reliability
    and cost efficiency.
  - Maintain reusable prompts, templates, and components that
    accelerate future automation work and improve time-to-
    delivery.
  - Monitor usage and performance through lightweight
    dashboards, driving continuous improvement based on real-
    world results.
  
  Become a part of our team if you
  
  - Have an engineering foundation with hands-on experience
    building automations or integrations, along with solid
    debugging and testing practices
  - Bring applied AI fluency, with practical experience building
    production-oriented LLM workflows, RAG architectures,
    prompt and context engineering, evaluation frameworks,
    security guardrails, and workflow automation
  - Communicate clearly and in a friendly way, able to explain
    complex ideas simply and collaborate across the company
  - Have an outcome mindset and are comfortable defining metrics
    and improving the reliability, speed, and cost of what you
    build
  - Show ownership and initiative, spotting opportunities,
    shaping them into scoped solutions, and driving them
    through to adoption
  - Demonstrate security and privacy awareness, with practical
    judgment on safe data use and compliance
  
  You can expect
  
  - A remote-yes company, where you can decide every day whether
    you work from home, at our Stuttgart or Munich office, or
    at any Design Office in Germany.
  - A permanent employment contract, 30 days of vacation, and
    the opportunity to participate in the company's success
    through our VSOP program.
  - Modern hardware and the frame for a height-adjustable desk.
  - An annual training budget of 1000,00 EURO for your
    professional development.
  - In Germany: A subsidized job bike to escape city traffic and
    a Wellpass gym membership to stay active.
  - A dynamic start-up atmosphere and an international team in
    which new ideas, creative approaches, and cooperation at
    eye level are valued.
  - To enjoy Corporate Benefits, including discounts on fashion,
    travel, and much more from various companies.
  
  About SPARETECH
  
  SPARETECH's vision is to empower the zero-waste industrial
  sharing economy by enabling maintenance and procurement
  teams at manufacturing leaders like Bosch, Porsche, and
  Nestlé to reduce MRO spend and optimize inventory through
  accurate part information, internal transparency, and market
  visibility.
  
  To achieve this, we have built, and continue to build, an
  AI-powered MRO software that connects all players in the
  spare parts ecosystem, from manufacturers and suppliers to
  the people working behind the machines. By facilitating the
  exchange of data, knowledge, and expertise, we create shared
  visibility that empowers smarter decisions, reduces waste,
  and drives seamless collaboration. This connected spare
  parts intelligence unlocks value that extends far beyond
  software.
  
  Backed by Insight Partners, SPARETECH is accelerating its
  growth with a strong focus on product innovation and team
  excellence. We take pride in our inclusive and collaborative
  culture, as well as our energetic and committed team.
