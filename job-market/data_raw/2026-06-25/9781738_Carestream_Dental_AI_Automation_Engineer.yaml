description: |
  Job Summary & Responsibilities
  
  POSITION SUMMARY:
  
  We are building an AI-powered automation function across
  three companies from the ground up. As our first AI
  Automation Lead, you will define the stack, set the
  standards, and build the foundation that everything else
  will be built on. You will work closely with our VP of AI to
  translate strategy into working agents and integrations —
  and eventually help scale those systems to our customers.
  
  
  
  KEY/SPECIFIC JOB RESPONSIBILITIES:
  
  - Design and develop AI agents across both pro-code and no-
    code platforms (Claude, Glean, Kore AI)
  - Define and document repeatable automation patterns that work
    across all three companies
  - Integrate AI platforms (Claude, Agentforce etc) with
    existing business tools via MCPs and APIs
  - Write Python scripts to handle complex integrations, data
    transformations, and edge cases
  - Lead technical decision-making around tooling, platforms,
    and architecture
  - Work directly with the VP of AI to review agent performance
    and guide workflow design
  
  
  
  KEY/CRITICAL COMPETENCIES:
  
  - 2–4 years in automation, agentic development, AI
    integration, or a similar technical role
  - Experience with developing RAG pipelines and implementing
    vector databases
  - Hands-on experience with at least one no-code automation
    platform
  - Comfort with ambiguity — you build before the blueprint is
    complete
  - Python proficiency — agentic development, scripting, API
    calls, data handling, debugging
  - Strong communicator who can explain technical decisions
    clearly
  - Experience connecting third-party platforms via REST APIs
  - Self-directed and outcome-focused — you finish what you
    start
  
  
  
  REQUIRED SKILLS/PREFERRED SKILLS:
  
  - Experience with YAML
  - Experience building voice agents in platforms like Bland,
    Retell, or ElevenLabs
  - Exposure to customer-facing automation or SaaS product
    workflows
  - Experience with LLM fine-tuning concepts
  - Experience with traditional machine learning techniques like
    gradient boosting, k-NN, and regression
  
  
  
  TRAVEL:
  
  - Minimal travel required
  
  
  
  Why this Role?
  
  - You will build AI agents and workflows from scratch — real
    ownership, not a ticket queue
  - Work directly with senior leadership who are close to the
    work and fast decision-makers
  - Grow into a team lead as the function scales across three
    companies and into customer products
  - Based in Guadalajara with fully remote flexibility and
    autonomy
  
  Compensation: $45,000 - $55,000 USD, based on experience.
