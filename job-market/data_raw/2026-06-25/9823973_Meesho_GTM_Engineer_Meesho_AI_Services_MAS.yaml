  About the team
  
  Meesho AI Services (MAS) is a new-age AI Services business
  built to deliver outcomes, not software, for enterprise and
  mid-market clients. We are in a 0-1 build phase, shaping our
  go-to-market motion, pricing models, and sales organization
  from the ground up. The GTM Engineer will be a foundational
  hire supporting this effort, working closely with the Sales
  & GTM Leader to build out the top-of-funnel engine.
  
  About the role
  
  The GTM Engineer will own the technical and execution layer
  of the sales funnel, from automated lead generation to
  client-facing demo calls. This role requires someone who can
  build systems and also get on calls to explain MAS clearly
  to prospective clients. You will work in an environment
  without an existing playbook, and will help build one.
  
  
  
