description: |
  The MicroStrategy Developer has overall responsibility for
  the BI application and platform, project creation and
  architecture, administration, object and schema creation,
  security, performance improvements, troubleshooting and
  resolving technical issues. To succeed in this role, you’ll
  need proven experience in MicroStrategy development and
  administration, as well as a strong understanding of
  enterprise reporting, data warehousing, data modelling and
  SQL.
  
  
  
  Location:  Mumbai/Bengaluru/Hyderabad/ Gurgaon (Hybrid - 3
  Day WFO)
  
  Responsibilities:
  
  - Design, develop, test, and deploy MicroStrategy Dashboards,
    Dossiers, Reports and Documents and supporting objects.
  - Collaborate with business analysts and stakeholders to
    translate business needs into technical specifications.
  - Liaise with the IT infrastructure team to manage
    MicroStrategy environments, including upgrade strategies
    and security considerations.
  - Be able to work on feature enhancement pertaining to retail
    KPIs in existing reports.
  - Interact and assist with ad-hoc reporting and access
    requests from business users.
  - Experienced in communicating and applying Best Practices on
    the use of MicroStrategy.
  - Works effectively with members of management.
  - Maintains knowledge of the latest trends in BI, business
    analytics, and other technologies
  
  Requirements
  
  - Overall 6+ years experience with BI technologies, with 4+
    years of experience in MicroStrategy development.
  - Experience with Administration tools like MicroStrategy
    Object Manager, MicroStrategy Command Manager,
    MicroStrategy Enterprise Manager in Version 11.3.
  - Ability to create MicroStrategy schemas and application
    objects such as attributes, metrics, prompts, filters,
    templates.
  - Knowledge of meta data creation (framework models/universe),
    creating report specifications, integration planning, unit
    testing planning and testing, UAT and implementation
    support.
  - Knowledge of advanced filters, conditional formatting,
    transformation and level metrics and customer groups.
  - Ability to define relationships between attributes, facts
    and other objects within MicroStrategy.
  - Ability to define Hierarchies and drill functionality within
    MicroStrategy.
  - Strong experience in writing SQL and good working knowledge
    of SQL Server databases.
  - Ability to design and develop interactive dashboards and
    visualization in MicroStrategy, leveraging advanced
    features such as drilling, filtering and dynamic content
    to enable intuitive data exploration and analysis.
  - Optimize MicroStrategy performance by fine tuning queries,
    optimizing data storage and implementing best practices
    for data modelling and schema design.
  - Provide training and support to end users and business
    analysts on MicroStrategy functionality, data modelling
    concepts and best practices for data visualization and
    analysis.
