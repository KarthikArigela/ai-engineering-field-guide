  Statement Regarding Job Recruiting Fraud Scams
  
  At Otsuka we take security and protection of your personal
  information very seriously. Please be aware individuals may
  approach you and falsely present themselves as our employees
  or representatives.  They may use this false pretense to try
  to gain access to your personal information or acquire money
  from you by offering fictitious employment opportunities
  purportedly on our behalf.
  
  Please understand, Otsuka will never ask for financial
  information of any kind or for payment of money during the
  job application process. We do not require any financial,
  credit card or bank account information and/or any payment
  of any kind to be considered for employment. We will also
  not offer you money to buy equipment, software, or for any
  other purpose during the job application process. If you are
  being asked to pay or offered money for equipment fees or
  some other application processing fee, even if claimed you
  will be reimbursed, this is not Otsuka. These claims are
  fraudulent and you are strongly advised to exercise caution
  when you receive such an offer of employment.
  
  Otsuka will also never ask you to download a third-party
  application in order to communicate about a legitimate job
  opportunity. Scammers may also send offers or claims from a
  fake email address or from Yahoo, Gmail, Hotmail, etc, and
  not from an official Otsuka email address. Please take extra
  caution while examining such an email address, as the
  scammers may misspell an official Otsuka email address and
  use a slightly modified version duplicating letters.
  
  To ensure that you are communicating about a legitimate job
  opportunity at Otsuka, please only deal directly with Otsuka
  through its official Otsuka Career website https://vhr-
  otsuka.wd1.myworkdayjobs.com/en-US/External.
  
  Otsuka will not be held liable or responsible for any
  claims, losses, damages or expenses resulting from job
  recruiting scams. If you suspect a position is fraudulent,
  please contact Otsuka’s call center at: 800-363-5670. If you
  believe you are the victim of fraud resulting from a job
  recruiting scam, please contact the FBI through the Internet
  Crime Complaint Center at: https://www.ic3.gov,  or your
  local authorities.
  
