  Application Deadline: This will be posted for a minimum of 5
  business days.
  
  Company benefits:  Comprehensive medical, dental, vision,
  prescription drug coverage, company provided basic life,
  accidental death & dismemberment, short-term and long-term
  disability insurance, tuition reimbursement, student loan
  assistance, a generous 401(k) match, flexible time off, paid
  holidays, and paid leave programs as well as other company
  provided benefits.
  
  Come discover more about Otsuka and our benefit offerings;
  https://www.otsuka-us.com/careers-join-otsuka.
  
