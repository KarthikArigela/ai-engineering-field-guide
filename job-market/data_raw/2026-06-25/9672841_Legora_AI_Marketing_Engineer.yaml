description: |
  About Us
  
  Legora is redefining how legal work gets done. Not built for
  lawyers, built with them. We work alongside the world’s best
  legal teams, who expect excellence, precision, and speed,
  and we hold ourselves to the same bar. Our AI-native
  workspace lets legal professionals move faster, think more
  clearly, and operate with sharper precision. By analysing
  thousands of documents in minutes and powering end-to-end
  workflows, we cut through complexity, teams can focus on
  what matters: judgment, strategy, and outcomes. 1,000+
  customers across 50+ countries trust us, including Cleary
  Gottlieb, Goodwin, Linklaters, White & Case, Dentons, and
  Barclays. We’ve scaled to $100M+ in ARR, with teams across
  Europe, North America and APAC, and continue to expand
  through acquisitions including Qura, Walter AI and
  Graceview. We partner with world-class performers: including
  Aaron Judge and the New York Yankees, Ludvig Åberg (and his
  caddie), and campaigns featuring Jude Law. Joining Legora
  means three things.
  
  - We lean in: ownership over titles, outcomes over intentions.
  - We fight for excellence: high standards, direct, ego-free
    feedback.
  - We grow together: as a team and with our customers.
  
  Mission before ego. Everyone contributes. No one coasts.
  
  If you’re driven by impact, pace, and raising the bar. This
  is the place.
  
  The Role
  
  We're looking for an AI Marketing Engineer to join our
  marketing team in NY or SF. This role sits at the
  intersection of marketing craft and AI engineering, working
  hand-in-hand with leaders across brand, product marketing,
  revenue marketing, and marketing ops. Your job is to
  identify bottlenecks in our marketing machine and reimagine
  those workflows with AI agents.
  
  You understand how marketing teams think and what they care
  about, which means you can design AI systems that teams
  actually adopt and trust. You're just as comfortable reading
  a competitive battle card as you are building the agent that
  generates one. You are energized by turning slow, manual,
  high-touch workflows into fast, reliable, low-touch systems
  and you know how to do it with frontier models.
  
  What You’ll Do
  
  - Reimagine Marketing Workflows with Agents: Partner with
    marketing leadership to design and deploy AI-native
    workflows with human-in-the-loop supervision.
  - Own the lifecycle from scoping to delivery: Solve one
    problem at a time, leading the full lifecycle of internal
    AI solutions from input collection, problem scoping,
    prompt engineering through to integration, testing, and
    iteration.
  - Evaluate frontier technology: Research, assess and integrate
    different models and agent frameworks to match the right
    tool to each problem.
  - Build robust integrations: Connect AI agents directly into
    our marketing data stack to ensure seamless data flow and
    execution.
  - Act as an internal evangelist: Bring a point of view on
    rapidly evolving AI landscape helping the broader team
    understand what is real and what is hype.
  
  What You Bring
  
  - Marketing Ops and Automation Roots: A strong track record of
    building automations, AI workflows with skills and tool
    integrations.
  - Hands-on AI Tinkering: Experience with LLMs, prompt
    engineering, skills and agentic orchestration frameworks;
    you know how to manage context, structure model outputs
    and chain tasks together.
  - A Builder Mindset: you see a slow or broken process and your
    first thought is "I can fix that". You have comfort
    working in fast-moving, ambiguous environments where you
    define the brief as much as execute against it
  - Strong communication skills — you can explain what you're
    building, why it matters, and how to use it to non-
    technical stakeholders
  - The Marketing Instinct: A genuine curiosity about how
    marketing works. You care about the business impact,
    whether that is about qualifying leads, delivering better
    sales enablement or personalizing marketing emails.
  
  What’s In It For You
  
  - Global collaboration: Partner with teams and clients across
    Europe, APAC, and North America.
  - Competitive package: Comprehensive salary, benefits, and
    tools for success.
  - Meaningful work: Your efforts shape how thousands of lawyers
    use AI daily.
  - In-person environment: Union Square office designed for
    ambitious builders and company provided lunch daily.
  - Benefits & Perks: We invest in our people with a
    comprehensive, thoughtfully designed benefits
    package:Medical, Dental & Vision
    - Multiple medical plan options through Aetna and Kaiser
      Permanente
    - HSA or Healthcare FSA (based on plan selection)
    - Dental plans via MetLife
    - Vision plans via Vision Care
  
  Legora is an Equal Opportunity Employer
  
  At Legora, we believe great teams are built on diversity of
  thought and experience. We’re proud to be an equal
  opportunity employer and committed to creating an inclusive,
  high-performance culture where everyone can do their best
  work. We welcome people of all backgrounds and don’t
  discriminate based on race, color, religion, national
  origin, gender, gender identity or expression, sexual
  orientation, age, disability, veteran status, or any other
  characteristic protected by law.
