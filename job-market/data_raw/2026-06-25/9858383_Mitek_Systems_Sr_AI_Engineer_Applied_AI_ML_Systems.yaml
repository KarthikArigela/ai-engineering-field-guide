  plan choices based on country specifics
  
  Financial future: retirement/pension plan contributions, MTK
  stock plan participation
  
  Income protection: life event & disability coverage
  
  Paid time off: generous annual leave, company holidays,
  volunteer time off
  
  Learning: e-learning license, tuition reimbursement,
  hackathons
  
  Home office setup allowance
  
  Additional/optional benefits: pet insurance, identity theft
  protection, legal assistance
  
  We sincerely appreciate your interest in Mitek. We know your
  time is valuable and look forward to the potential of
  speaking with you further!
