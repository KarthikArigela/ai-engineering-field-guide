  What You Will Do:
  
  
  Role Overview
  
  We are looking for an experienced AI Developer with 3–5
  years of hands-on experience to lead the development of
  enterprise-grade AI solutions. This role involves designing
  scalable AI architectures, implementing agentic AI systems,
  mentoring junior developers, and working closely with
  stakeholders to deliver impactful AI and automation
  platforms.
  
  Key Responsibilities
  
  - Architect, develop, and deploy AI solutions using LLMs,
    advanced prompt engineering, and agentic AI frameworks.
  - Design scalable REST and GraphQL APIs for AI-powered
    platforms.
  - Lead backend development using Python, FastAPI, Django, or
    Flask.
  - Build and integrate services using Node.js, Go, or Java
    (Spring Boot) where applicable.
  - Collaborate closely with front-end teams using React,
    Next.js, and Vue.js.
  - Develop and govern low-code AI automations using Copilot
    Studio and Power Apps.
  - Design cloud-native architectures on Azure and AWS.
  - Establish CI/CD pipelines using GitHub Actions and enforce
    coding standards.
  - Mentor junior developers and provide technical guidance.
  - Participate in architectural reviews, security compliance,
    and production readiness.
  
  Required Skills
  
  - AI / ML: LLMs; advanced prompt engineering; agentic AI
    systems.
  - APIs: REST API, GraphQL.
  - Backend development: Python (FastAPI / Django / Flask).
  - Additional languages: Node.js / Go / Java; Spring Boot (for
    Java-based services).
  - Front end: React / Next.js / Vue.js.
  - Low-code platforms: Power Apps, Copilot Studio.
  - Cloud platforms: Azure, AWS.
  - Code management: Git; CI/CD via GitHub Actions.
  
  What You Will Need: What Would Be Nice To Have:
  
  - Experience building enterprise AI copilots or workflow
    automation solutions.
  - Strong understanding of cloud security and compliance.
  - Prior experience leading modules or small teams.
  - Exposure to microservices and event-driven architectures.
  
  What We Offer:
  
