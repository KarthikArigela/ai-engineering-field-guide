description: |
  Join Figen AI — a mission-driven French fintech redefining
  WealthTech with vertical AI
  
  Figen AI is a Paris-based fintech applying state-of-the-art
  artificial intelligence to wealth and asset management. Our
  proprietary multi-agent architecture, combined with legally
  vetted tax and regulatory databases, has made us the
  reference for vertical AI in the WealthTech space. As a
  société à mission, we also run pro-bono AI projects with
  leading public-interest organisations.
  
  Since our launch, adoption has been rapid thanks to our
  unique mix of regulatory reliability, complex-task
  automation, data security and tailor-made integrations. We
  already gather hundreds of companies, including market
  leaders and major institutions, and our team is filled with
  former founders and top-tier specialists.
  
  If you’re passionate about AI and want to build products
  with real-world impact, we’d love to meet you.
  
  Your Role
  
  Large-Language-Model Optimisation
  
  - Fine-tune and align large language models for specialised
    financial use cases.
  - Build agentic solutions with frameworks such as LangChain
    and Autogen.
  
  Advanced Data Engineering
  
  - Work with extensive datasets; apply cutting-edge machine-
    learning techniques to create robust, scalable models that
    handle complex financial and tax information.
  
  Production-Scale Deployment
  
  - Ship and monitor models in high-demand production
    environments, guaranteeing scalability, performance and
    reliability.
  
  Tech Watch & Innovation
  
  - Stay on top of the latest AI research and tooling; keep
    Figen AI ahead of the curve by integrating emerging best
    practices before the market even asks for them.
  
  What We’re Looking For
  
  Proven technical impact — show us your GitHub commits,
  Kaggle scores or any other tangible achievements. We welcome
  diverse backgrounds, whether you studied at École 42,
  Polytechnique… or never set foot in a school.
  
  Core skills
  
  - Strong command of Laravel, Python, R and SQL.
  - Hands-on experience with TensorFlow, PyTorch, Hugging Face,
    LangChain, Autogen.
  - Demonstrated fine-tuning / optimisation of LLMs for domain-
    specific tasks.
  - French proficiency is a plus but not mandatory.
  
  Why Figen AI?
  
  - Breakthrough innovation: as a Jeune Entreprise Innovante de
    Rupture, deep R&D is our default.
  - Autonomy & trust: flexible hours, the option to work several
    consecutive months abroad each year, plus “train-from-
    home” days for low-carbon travel.
  - Direct impact: shape the next generation of AI agents in
    finance and savings.
  - Mission-driven culture: contribute to pro-bono projects with
    recognised public-interest organisations.
  
  How to Apply
  
  Send us your résumé and, above all, concrete evidence of
  what you’ve built or achieved. Ready to build the future of
  AI agents with us? Apply now!
