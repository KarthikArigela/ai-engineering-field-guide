title: Sr. AI Platform Engineer
company: ScienceLogic
location: USA
remote: true
work_type: FULL_TIME
description: |
  About ScienceLogic…
  
  ScienceLogic is redefining IT operations for the modern
  enterprise. Our AIOps platform empowers organizations to
  achieve Autonomic IT — where systems are self-healing, self-
  optimizing, and seamlessly aligned with business outcomes.
  We help enterprises and service providers gain unified
  visibility across hybrid and multi-cloud environments,
  automate workflows, and unlock performance at scale. We’re
  accelerating digital transformation through the power of
  automation, AI, and analytics — giving IT and business
  leaders the tools to deliver superior customer experiences,
  drive efficiency, and innovate with confidence.
  
  We're seeking a Senior AI Platform Engineer to join the
  Skylar initiative — ScienceLogic's next-generation AI
  platform. You'll design and build the backend services and
  APIs that power Skylar's AI and automation capabilities,
  working in Python (and at times Go) across a fast-evolving
  platform.
  
  The engineers who succeed in this role share a common
  profile: they are strong technical generalists who learn
  quickly, investigate problems thoroughly, and take ownership
  of unfamiliar systems. They are comfortable working across
  the stack, comfortable rolling up their sleeves to triage
  production issues as they are designing new services from
  scratch. Depth of curiosity and engineering judgment matter
  as much to us as the specific technologies on your resume.
  
  You'll partner closely with platform, infrastructure, and
  data engineering teams on service contracts, data semantics,
  and integration patterns. As the platform's needs around
  identity, access control, and secure service-to-service
  communication evolve, you'll have the opportunity to help
  shape and own that work.
  
  Key Responsibilities
  
  - Design, build, and maintain backend services and RESTful
    APIs that support Skylar's AI and automation capabilities.
  - Write clean, well-tested, maintainable Python code as part
    of a collaborative engineering team.
  - Investigate, triage, and resolve issues in production
    systems, including services originally built by others,
    and improve them over time.
  - Contribute to engineering standards and best practices for
    how internal teams expose data and services to the AI
    platform.
  - Partner with platform, infrastructure, and data engineering
    teams on service contracts, data semantics, and
    integration patterns.
  - Grow into ownership of authentication, authorization, and
    RBAC work as the platform's needs in those areas take
    shape.
  - Participate in technical design discussions, code reviews,
    and engineering documentation.
  
  Required Experience
  
  - 5+ years of backend software engineering experience in
    production environments.
  - Strong experience developing production services using
    Python (FastAPI, Flask) and/or Go.
  - Solid software engineering fundamentals: testing, debugging,
    code review, and version control.
  - Experience designing and maintaining backend services and
    APIs.
  - Demonstrated ability to learn unfamiliar systems quickly and
    contribute meaningfully across new domains.
  - Strong communication and collaboration skills.
  
  Preferred Qualifications
  
  - Exposure to authentication and authorization patterns,
    including RBAC models, JWT/OAuth 2.0, and SSO protocols
    (SAML 2.0, OpenID Connect).
  - Familiarity with identity providers such as Okta, Azure AD,
    or Ping Identity.
  - Experience with containerized services and Kubernetes.
  - Experience with AI-enabled, agentic, or LLM-driven systems.
  - Exposure to ClickHouse or other analytical databases.
  - Background in observability, infrastructure tooling, or
    AIOps platforms.
  - Experience contributing to engineering documentation such as
    RFCs or ADRs.
  
  Benefits & Perks
  
  - Comprehensive medical, dental and vision plans.
  - 401(k) plan with employer match.
  - Flexible Paid Time Off (FTO) so that you can take the time
    that you need to re-energize.
  - Volunteer Time Off (VTO) - take two days off per calendar
    year to volunteer with your preferred charitable
    organization.
  - 5-year Service Milestone Sabbatical.
  - Paid parental leave.
  - Generous employee referral bonus program.
  - Pet insurance.
  - HQ Office centrally located in Reston Town Center featuring
    a well-stocked kitchen with rotating snacks and beverages,
    and catered lunch on Thursdays.
  - Regular virtual company-wide events, including cooking
    classes, yoga, meditation and more.
  - The opportunity to learn and develop from some of the best
    and brightest minds in the industry!
  
  Don’t meet every single requirement? Studies have shown that
  women and people of color are less likely to apply to jobs
  unless they meet every single qualification. At
  ScienceLogic, we are dedicated to building a diverse,
  inclusive and authentic workplace, so if you’re excited
  about this role but your past experience doesn’t align
  perfectly with every qualification in the job description,
  we encourage you to apply anyways. You may be just the right
  candidate for this or other roles.
  
  All qualified applicants will receive consideration for
  employment without regard to race, color, religion, sex,
  sexual orientation, gender identity, national origin, or any
  other applicable legally protected characteristics in the
  location in which you are applying.
  
  About ScienceLogic
  
  ScienceLogic is a leader in IT Operations Management,
  providing modern IT operations with actionable insights to
  resolve and predict problems faster in a digital, ephemeral
  world. Its solution sees everything across cloud and
  distributed architectures, contextualizes data through
  relationship mapping, and acts on this insight through
  integration and automation.
  
