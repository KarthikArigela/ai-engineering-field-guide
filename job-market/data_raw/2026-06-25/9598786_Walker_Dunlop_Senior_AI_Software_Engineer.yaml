description: |
  Department:
  
  WDTech - R&D
  
  We are Walker & Dunlop.  We are one of the largest providers
  of capital to the commercial real estate industry, enabling
  real estate owners and operators to bring their visions of
  communities — where people live, work, shop, and play — to
  life. We are committed to creating meaningful social,
  environmental, and economic change in our communities.
  
  WDTech is W&D’s in-house technology team – a group of
  collaborative and highly skilled technology professionals,
  all of whom are leading experts in real estate data, data
  science, and technology.
  
  WDTech Engineering builds solutions that impact not only our
  products but also the people and processes across our
  organization. A commitment to innovation and a passion for
  disrupting the old-fashioned real estate industry are our
  highest priorities.
  
  The Impact You Will Have
  
  As a Senior AI Software Engineer on our AI Dev Team, you
  will help shape the future of our Loan Origination and
  Servicing platform and the AI systems that support how we
  build, ship and operate software across the business. You
  will design and build scalable applications, intelligent
  workflows and agentic systems that deliver real-time
  insights and operational efficiency for our teams and
  clients. You will also contribute to Atlas, our AI
  collaboration platform that powers reusable skills, agents
  and AI capabilities across WDTech. In this role, you will
  help transform complex, data-rich systems into intuitive and
  high-performing experiences through thoughtful engineering
  and applied AI.
  
  Primary Responsibilities
  
  - Design, build and maintain agentic workflows that support
    business-critical processes and operational efficiency
  - Contribute to Atlas by authoring reusable skills,
    maintaining agent definitions and improving the context
    and evaluation infrastructure that supports scalable AI
    adoption
  - Establish evaluation, observability and reliability
    standards for agentic systems, including regression
    testing, tracing and guardrail implementation
  - Collaborate with Product Management, Product Design and
    business stakeholders to translate complex requirements
    into scalable technical solutions
  - Own features end-to-end, including architecture,
    development, testing, deployment and ongoing iteration
  - Drive continuous improvement across the engineering stack,
    including performance optimization, reliability, testing
    and CI/CD practices
  - Mentor engineers and contribute to a culture of engineering
    excellence, accountability and responsible AI usage
  - Support architectural discussions and technical decision-
    making across AI and platform engineering initiatives
  - Perform other duties as assigned.
  
  Education and Experience
  
  - 8+ years of software development experience
  - Bachelor’s or master’s degree in Computer Science or a
    related field
  - Experience delivering production AI/ML systems, including
    LLM-powered applications and agentic workflows
  - Experience with modern agent frameworks, retrieval
    architectures and AI system evaluation practices
  - Hands-on experience using AI coding assistants and developer
    tools within engineering workflows
  - Experience with Amazon Web Services, event-driven
    architecture, Docker, Kubernetes and containerized
    deployments
  - Experience within Real Estate, Financial Services or Capital
    Markets environments preferred
  
  Knowledge, Skills and Abilities
  
  - Deep proficiency in Python and modern backend frameworks
    such as FastAPI, with a focus on scalable and maintainable
    architecture
  - Strong expertise with SQL databases, including schema
    design, query optimization and performance tuning
  - Experience designing efficient, well-structured backend
    systems and distributed services
  - Experience with queues, background task processing,
    scheduled jobs and caching strategies for scalable systems
  - Strong understanding of testing methodologies, including
    unit, integration and end-to-end testing
  - Working knowledge of UML and technical documentation
    practices to communicate system design effectively
  - Familiarity with Event Sourcing and Domain-Driven Design
    principles
  - Demonstrated ownership mindset with a commitment to
    continuous improvement and organizational success
  - Ability to work independently, provide proactive feedback
    and adapt to evolving priorities in an agile environment
  - Excellent verbal and written communication skills
  - Ability to show ownership of your work, take on challenges
    and acknowledge growth opportunities, and demonstrate
    patience when learning new processes
  - Courtesy, respect, and thoughtfulness in teaming with
    colleagues and other stakeholders
  
  This position has an estimated base salary of $160,000 -
  $190,000 plus a discretionary bonus. An employment offer is
  based on the applicant’s relevant work experience,
  applicable knowledge, skills, abilities, internal equity,
  and alignment with market data.
  
  #LI-MR1
  
  #LI-Remote
  
  What We Offer 
  
  - The opportunity to join one of Fortune Magazine’s Great
    Places to Work winners
  - Comprehensive benefit options* that have earned Walker &
    Dunlop the gold level of the 2025 Cigna Healthy Workforce
    Designation™, some of which include:  - Up to 83%
    subsidized medical payroll deductions  - Competitive
    dental and vision benefits  - 401(k) + match  - Pre-tax
    transit and commuting benefits  - A robust health and
    wellness program – earn cash rewards and gain access to
    resources that    promote health, engagement, and balance
    - Paid maternity and parental leave, as well as other
    family paid leave programs  - Company-paid life, short and
    long-term disability insurance  - Health Savings Account
    and Healthcare and Dependent Care Flexible Spending
  - Career development opportunities
  - Empowerment and encouragement to give back – volunteer hours
    and donation matching
  
  
  *Eligibility may vary based on average number of hours
  worked
  
