  AI Fullstack Engineer Job Description
  
  Job Type: Remote, Full-time
  
  AutoDS is looking for an AI Fullstack Engineer to join us!
  
  At AutoDS, we’re transforming the world of e-commerce by
  automating and simplifying the entire dropshipping process.
  Our platform empowers sellers by automating every step from
  product sourcing to order fulfillment.
  
  We’re focused on making e-commerce accessible and efficient,
  letting sellers spend less time managing orders and more
  time growing their businesses. Join AutoDS and be part of a
  team that's pioneering the future of e-commerce and
  innovation!
  
  As an AI Fullstack Engineer at AutoDS, you'll work across a
  heterogeneous stack - PHP/WordPress, ReactJS, Python
  services, and partner integrations. Priorities shift fast
  and we're looking for a developer who uses AI tools (Claude
  Code, Codex, etc) as a primary layer, moves comfortably
  across languages and codebases, applies engineering judgment
  to what AI produces, and ships.
  
    Key Responsibilities
  
  - Maintain and extend the WordPress-based and Python/ReactJS
    services
  - Implement and support API integrations (internal and
    external)
  - Collaborate with designers and product teams to translate
    Figma designs into functional, responsive implementations
  - Participate in code review, including reviewing AI-generated
    code
  
    Hard Skills Requirements
  
  - 5+ years of software development experience in a product
    team
  - Daily use of AI coding tools (Claude Code, Codex or open
    source alternatives)
  - Experience with context management and harness engineering
  - Solid foundation in at least one language used in the team —
    PHP/WordPress preferred, JS/TS also works
  - Familiarity with RESTful web services and API integrations
  - Experience working across unfamiliar codebases and languages
  
    Nice to Have
  
  - ReactJS fundamentals, including hooks and higher-order
    components (HOCs).
  - Experience with Next.js and Understanding of different
    rendering techniques(CSR, SSR, SSG).
  - Experience with Tanstack Query, Storybook, Lodash, AWS
    Cognito Authentication.
  
    Soft Skills Requirements
  
  - Comfortable in unfamiliar territory — tries things, breaks
    them, iterates
  - Autonomous: investigates independently, doesn't wait for
    perfect specs
  - Communicates blockers early in async environments
  - English proficiency at Upper Intermediate (B2+) level or
    higher
  - Ukrainian or Russian language proficiency is an advantage
  
  Ready to take your career to the next level with AutoDS?
  Join us and be part of a global team that’s driving the
  future of eCommerce innovation. Apply today and help us
  create cutting-edge solutions for online sellers worldwide!
