description: |
  Company: taleroo GmbH Location: Berlin (Mitte) – Hybrid (2
  days office, 3 days remote) Employment Type: Full-time,
  Permanent About Us At taleroo, we are building the digital
  platform that seamlessly connects job seekers, government
  agencies, and training providers across Germany. From skills
  profiling and AI-driven training recommendations to
  automated progress reporting – we sit at the intersection of
  B2G compliance and consumer-grade product quality. For us,
  GDPR (DSGVO) isn't a checkbox; it's a core design constraint
  built into every single feature. Tasks End-to-End Feature
  Shipping: Own features completely from ambiguous founder
  input to live production. Translate documented user journeys
  into technical specs, full-stack implementation, and
  automated E2E coverage. * AI Workflow Leadership: Set and
  maintain the team's engineering standards for working with
  coding agents (authoring CLAUDE, AGENTS, cursorrules) and
  configure MCP servers to maximize development leverage. *
  Test Automation: Build and maintain production-grade
  Playwright suites covering critical journeys (AI-generated,
  human-reviewed) to ensure a baseline of 100% journey
  coverage on revenue-critical flows. * Production Reliability
  & DevOps: Define SLOs, instrument observability (Sentry,
  OpenTelemetry), and carry incident response for your owned
  surfaces. * GDPR-Aligned Architecture: Maintain and design
  systems in compliance with data minimization, purpose
  limitation, and EU-only hosting infrastructures (Hetzner,
  Scaleway, AWS Frankfurt, Vercel EU). * Technical Decision
  Making: Document architectural decisions clearly in writing
  (ADRs) and actively participate in high-bar technical
  debates. Requirements Engineering Depth: Proven track record
  of shipping complex production systems end-to-end, ideally
  as an early engineer at a startup or within a high-bar
  product team. * Technical Stack: Fluency in TypeScript
  across the entire stack, Next.js 15+ / React 19+ (App
  Router, Server Components, Server Actions), and PostgreSQL
  with an ORM (Drizzle or Prisma). * AI-Native Mastery: Daily,
  fluent use of AI coding agents (Claude Code, Cursor, or
  equivalent) as your primary execution layer, with clear
  opinions on when agents accelerate or hinder development. *
  Testing & Operations: Production-grade experience with
  Playwright (or Cypress), on-call incident response, and
  structured logging. Baseline literacy in GDPR/BDSG (§32
  BDSG) is a strong plus. * DRI Mindset: Highly autonomous
  individual who thrives without a manager layer running
  sprints or setting tickets. You measure success by user
  outcomes, not lines of code. * Communication & Language:
  Exceptional written English (C1+) for async documentation.
  Additionally, professional proficiency in German is required
  to confidently run 30-minute calls with Jobcenter
  caseworkers without switching languages. Benefits *
  Compensation: Highly competitive, above-market base salary
  reflecting your seniority and scope. * Premium Tooling &
  Hardware: State-of-the-art equipment (MacBook) and fully
  covered premium AI subscriptions (Claude Max, Cursor Pro)
  alongside a dedicated L&D budget for conferences. * Work-
  Life Flexibility: Modern hybrid work model (2 days in our
  Berlin-Mitte office, 3 days remote) supported by an async-
  first company culture that prioritizes deep work over
  unnecessary meetings. * Impact & High Ownership: Flat
  hierarchy reporting directly to the founder. No corporate
  bureaucracy, meaning zero friction between your
  architectural decisions and real production outcomes. To
  apply, send three things: 1. Link to your AI coding workflow
  artifact (CLAUDE. md / AGENTS. md / cursorrules, MCP server,
  agent skill, blog post, or video). One sentence of context.
  2. Link to one production system you owned (deployed URL +
  GitHub repo). One sentence of context. 3. 5-minute Loom
  video walking through one of these projects, your camera on,
  no script. Show us how you think, not how you write. Apply
  now and let’s schedule a casual 30-minute intro call. We
  move fast, and we respect your time.
