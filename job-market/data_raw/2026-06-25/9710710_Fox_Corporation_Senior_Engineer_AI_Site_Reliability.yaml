title: Senior Engineer, AI Site Reliability
company: Fox Corporation
location: Pico, USA
work_type: FULL_TIME
description: |
  OVERVIEW OF THE COMPANY
  
  Fox Corporation
  
  Under the FOX banner, we produce and distribute content
  through some of the world’s leading and most valued brands,
  including: FOX News Media, FOX Sports, FOX Entertainment,
  FOX Television Stations and Tubi Media Group. We empower a
  diverse range of creators to imagine and develop culturally
  significant content, while building an organization that
  thrives on creative ideas, operational expertise and
  strategic thinking.
  
  JOB DESCRIPTION
  
  Fox is hiring a Senior Engineer, AI Site Reliability to help
  build and operate infrastructure and platforms to support
  APIs around our live direct to consumer APIs for major live
  events such as the Super Bowl, World Cup, and World Series.
  The senior engineer will serve as an SME for solving
  thundering herd problems and leading efforts to leverage AI
  to diagnose and remediate production incidents, automate
  tooling, and partnering with backend api teams to run
  deployments, load testing, and capacity planning for daily
  traffic and large live events.
  
  A collaborative, peacemaker mindset is a must as we foster a
  culture of learning and continuous improvement for the team.
  
  A SNAPSHOT OF YOUR RESPONSIBILITIES
  
  - Support existing deployment, monitoring, and alerting
    infrastructure to ensure reliability for the FOX One
    ecosystem
  - Advance existing deployment, monitoring, and alerting
    infrastructure using the latest in AI & ML to future-proof
    and enhance reliability for the FOX One ecosystem
  - Experiment and create AI powered tooling to supercharge
    developer productivity and boost performance testing
  - Support the biggest and best events in the world from the
    FIFA World Cup, to the Super Bowl and annual World Series
    games
  - Focus on performance bottlenecks and performance improvement
    techniques leveraging AI & ML
  - Help to mentor and train less senior members of the team
  - Assist with product/technology selection including
    implementation of POCs
  - Perform post-incident analysis to identify root causes and
    potential workarounds/solutions
  - Be fluid and open to change and evolving processes and tools
  - Help lead other engineers in the completion of deliverables
  - Other duties as assigned
  
  WHAT YOU WILL NEED
  
  - Expert with EKS, Kubernetes, Istio, and AWS including IAM,
    autoscaling, networking and load balancing/request routing
  - 5+ years of rigorous experience with Site Reliability or
    DevOps
  - Expert with the latest and greatest in AI & ML technologies
  - Expert in troubleshooting and triaging apis
  - Expert understanding of version control, testing, continuous
    integration, build, deployment and monitoring
  - Proven experience with solving scalability problems both up
    and down including thundering herd scenarios
  - Expert with git workflows and infrastructure as code
    (Terraform)
  - Expert with troubleshooting and root cause analysis
  - Expert with at least 2 programming languages
  - Proven experience in Golang, Python or similar languages
  - Strong analytical skills
  - Strong communication skills, both verbal and written
  - Strong teamwork and willingness to collaborate with others
  
  NICE TO HAVE, BUT NOT A DEALBREAKER
  
  - BS or equivalent
  - AWS Solutions Architect Professional certification
  
  SCHEDULE/SHIFT
  
  - Coverage during NFL Sundays and other marquee live events
    throughout the year
  - Must be willing to work extended hours and weekends when
    needed
  
  NOTE: Fox Behavioral Skills/Competencies: Dependability,
  Imitative, Teamwork, Personal Integrity, Professionalism;
  Fox Leadership Skill/Competencies: Sets Clear Goals, Seeks
  Collaborative Solutions, Delivers Constructive Feedback,
  Leadership Integrity and Compliance.
  
