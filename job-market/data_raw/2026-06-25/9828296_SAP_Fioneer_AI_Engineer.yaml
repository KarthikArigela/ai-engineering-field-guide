description: |
  About SAP Fioneer 
  
  At SAP Fioneer, innovation drives everything we do. Spun out
  from SAP, we combine agility, cutting-edge delivery, and
  financial services expertise to build the next generation of
  banking and Insurance software. 
  
  Our mission: Enable insurers to achieve speed, scalability,
  and cost-efficiency through digital innovation, cloud-native
  technology, and solutions that cover core banking processes
  end-to-end. With rapid global growth, a lean structure, and
  a collaborative culture, SAP Fioneer is the place to
  accelerate your career. 
  
   The Role 
  
  We are seeking a Senior AI Engineer (m/f/d) to lead the
  design and development of AI-driven features for our
  insurance products. As a key architect of our GenAI
  innovation, you will be responsible for building, deploying,
  and scaling production-grade AI solutions that seamlessly
  integrate with our core insurance platforms.
  
  This role is hands-on and highly technical. You will create
  prototypes, deliver robust code ready for production, and
  shape the long-term AI strategy for SAP Fioneer. In
  addition, you will mentor and expand a dedicated AI
  development team, ensuring delivery of scalable and secure
  AI solutions in line with best practices.
  
  What You’ll Do
  
  - Lead the technical design, implementation, and deployment of
    GenAI-powered features for insurance software offerings.
  
  - Drive the end-to-end innovation process: from rapid
    prototyping and demonstration to the delivery of
    enterprise-grade solutions that can be adopted by major
    insurers and banks worldwide.
  
  - Work extensively with insurance domain data and
    workflows—enabling AI agents to interpret transactional
    data, automate business processes (like claims management,
    underwriting, and risk assessment), and generate
    actionable insights and recommendations for insurers and
    their customers.
  
  - Grow and mentor a high-performing AI team by setting
    technical direction, sharing knowledge, and fostering a
    culture of collaboration and continuous improvement.
  
  - Collaborate with product managers, solution leads, and
    clients to ensure that AI features address user
    requirements and deliver measurable business value.
  
  - Provide architectural and technical guidance to
    implementation teams, including defining clear interfaces
    and integration points where AI components interact with
    SAP/ABAP and legacy insurance systems.
  
  Requirements
  
  What You Bring 
  
  Technical expertise 
  
  - 8+ years of software development experience with a strong
    record of delivering AI/ML solutions into production
    environments for enterprise insurance applications.
  
  - Deep expertise in integrating large language models (LLMs)
    into enterprise insurance products, including hands-on
    experience architecting retrieval-augmented generation
    (RAG) workflows and multi-agent systems.
  
  - Practical experience with frameworks such as LangChain,
    LangGraph, and LlamaIndex (or similar) for building
    advanced, production-scale LLM-powered features, including
    data indexing, orchestration, and agent-driven workflows.
  
  - Proficiency in modern programming languages—including
    Python, Java, JavaScript, or C++—with the ability to
    implement high-performance, scalable AI components.
  
  - Demonstrated cloud-native development skills using Azure,
    AWS, or Google Cloud, including containerization and
    orchestration using Docker and Kubernetes for deploying
    robust AI solutions at scale.
  
  - Proven ability to integrate AI technologies into enterprise-
    grade systems; prior exposure to SAP/ABAP or insurance
    core systems is highly desirable.
  
  - Experience in leading and scaling cross-functional
    development teams that specialize in AI product delivery
    for the financial and insurance sectors.
  
  - Skilled in translating complex business requirements and
    insurance domain needs into resilient, secure, and
    scalable AI solution architectures.
  
  Benefits
  
  
  
  Why Join Us? 
  
  - Drive transformation: Shape the next generation of AI in
    insurance by architecting capabilities that will define
    future industry standards and transform mission-critical
    systems.
  
  - Innovate fearlessly: Take end-to-end ownership—experiment
    boldly, iterate quickly from prototype to production, and
    see your solutions create real impact at scale.
  - Build a legacy: Be the cornerstone of a pioneering AI team,
    mentor exceptional talent, and foster a collaborative
    culture that thrives on curiosity and breakthrough
    thinking.
  - Expand your horizons: Collaborate with diverse, world-class
    colleagues and visionary clients from around the
    globe—bringing fresh perspectives to every project.
  - Work on your terms: Enjoy a remote-first environment
    designed for balance, with travel opportunities reserved
    for moments that truly matter.
  
  At SAP Fioneer, you will benefit from a flexible work
  environment that encourages creativity and encourages you to
  think outside the box, bring new ideas to the table, and
  challenge the status quo. You will become part of a diverse
  and global team that we are proud of and are constantly
  growing and reinventing. As an employee, you will have the
  chance to chart your own career path and take advantage of
  competitive compensation packages and progression
  opportunities based on merit.
  
  Join us for a rewarding career where your needs are not just
  met but exceeded
