  Hello, we’re Belong.
  
  We partner with regional payers to deliver Medicare
  Advantage and Special Needs Plan products.
  
  With a dual focus on data-driven, proactive clinical
  intervention and unwaveringly empathetic patient experience,
  Belong has completely reimagined health insurance for
  seniors and other Medicare-eligible individuals who have
  been disregarded and deprioritized for far too long.
  
  We believe that only by recognizing individuals can we make
  communities strong.
  
  Belong Health. Kinder, more supportive care.
  
  Summary
  
  The Associate Software Engineer (IT Operations & AI
  Development) is a hands-on, cross-functional role
  responsible for supporting IT Operations automation, AI and
  software development, and ongoing SOC2 and HIPAA compliance
  sustainment. This role combines workflow automation, applied
  AI experimentation, and operational problem-solving to
  improve efficiency, visibility, and reliability across the
  organization. This role works closely with Engineering, IT
  Operations, Compliance, and business stakeholders to
  automate manual processes, build AI-based proofs of concept,
  and reinforce audit-ready compliance practices, while
  integrating seamlessly into cross-functional teams.
  
  Essential Job Duties and Responsibilities
  
  - Develop AI-based proofs of concept that support productivity
    and innovation objectives.• Automate manual and
    operational IT processes, including report reconciliation
    and file status dashboards.• Build and maintain automated
    workflows that reduce manual overhead and improve
    operational visibility.• Contribute to AI development and
    software engineering efforts across IT Operations.• Assist
    in maintaining and strengthening the organization’s SOC2
    and HIPAA compliance posture.• Support compliance
    documentation, evidence gathering, and process alignment
    for audit readiness.• Investigate and troubleshoot
    operational and production issues.• Quickly learn and
    apply new tools to translate ideas into working
    solutions.• Serve as a cross-functional contributor
    bridging operations, compliance, and innovation.• Develop
    and maintain clear documentation of processes,
    automations, and solutions.
  
  Supervisory Responsibilities
  
  - This role does not directly supervise staff but may lead or
    coordinate cross‑functional technical initiatives.
  
  Required Professional Experience and Qualifications
  
  - 2 - 4 years in software engineering, IT operations, or a
    related technical role (relevant internship experience
    considered).• Experience automating manual or operational
    workflows.• Exposure to AI/ML tools and the ability to
    build working proofs of concept.• Ability to work
    effectively across engineering, operations, and compliance
    teams.• Strong communication skills and high
    responsiveness.• Demonstrated accountability and ownership
    beyond assigned tasks.• High learning agility and a
    problem-solving mindset.
  
  Preferred Professional Experience and Qualifications
  
  - Experience supporting SOC2 and/or HIPAA compliance
    initiatives.• Experience with healthcare data or other
    regulated environments.• Familiarity with scripting and
    automation tools.• Experience building dashboards or
    reporting automations.• Background in cross-functional or
    operationally embedded engineering roles.
  
  Education, Training, License and Certification
  
  - Bachelor’s degree required; degree in Computer Science,
    Engineering, or a related field preferred.
  
  Work Environment
  
  The work environment characteristics described here are
