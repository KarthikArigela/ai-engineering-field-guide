  Job Description
  
  We are seeking an AI Solution Developer to lead the
  technical development and deployment of AI use cases that
  streamline Salesforce administration work and enhance sales
  effectiveness. This role focuses on hands-on AI development
  and deployment within our team. You will be responsible for
  deploying new use cases on existing and new models (with a
  heavy focus on Gemini and Agentforce), exploring untapped
  capabilities of currently deployed models, and continually
  evaluating new AI models to compare alongside existing ones.
  
  Serving as our primary Solution developer, you will handle
  the in-house AI development for our team and partner
  directly with Salesforce IT, data owners, and other
  specialized AI teams when their support is needed to
  develop, scale, and deploy complex solutions. You will
  document and plan out basic AI use cases, and then implement
  it. Success will be measured by successful AI use case
  deployments and the reduction of manual administrative
  efforts.
  
  Responsibilities
  
  - Act as the primary hands-on AI developer for the team,
    focusing on building and deploying AI solutions and simple
    workflow automations.
  - Deploy targeted use cases and features on existing or new AI
    models, actively participating in and evaluating pilots
    and trials for core platforms like Gemini and Agentforce.
  - Continuously explore and activate unused capabilities within
    currently deployed AI models, evaluating available
    Salesforce Out-of-the-Box AI and Einstein features.
  - Evaluate and explore new external AI models and third-party
    tools that could replace or supplement existing solutions
    to improve data analysis, seller workflows, and CRM
    automation.
  - Partner collaboratively with Salesforce IT, data owners, and
    cross-functional AI teams when advanced technical support
    or enterprise-level deployment is required.
  - Build and test Solution integrations that give AI models the
    ability to safely combine multi-source data, such as
    exploring solutions to sync email communication and
    Salesforce data.
  - Ensure all AI deployments and automation workflows adhere to
    internal data privacy standards, security protocols, and
    responsible AI usage guidelines when handling sensitive
    internal and customer CRM data (especially concerning
    international deployment limits).
  
  Skills & Abilities
  
  - Deep understanding of current AI models (e.g., LLMs, Gemini,
    Agentforce) and how to deploy their capabilities
    practically to modernize business processes.
  - Demonstrated technical aptitude and ability to engage
    closely and partner with architects, Salesforce IT
    developers, and technical SMEs for solution scaling.
  - Outstanding analytical skills with the ability to
    consolidate data, troubleshoot integration issues, and
    develop custom AI logic.
  - Continuous evaluation of sales processes to remove
    administrative burdens through Solution AI applications.
  - Ability to quickly adapt to new requirements and maintain
    working relationships across intra-organization groups.
  - Familiarity with data visualization and warehousing
    platforms (e.g., Tableau, Snowflake) or specialized
    enterprise AI tools (e.g., Moveworks, Cloverleaf) a plus.
  - Familiarity with basic coding and simple automations (e.g.,
    Python, Google AppScript, basic API integrations) a plus.
  - Understanding of the sales/CRM process.
  - Salesforce platform experience with AI integrations
  
  Target Base Salary Range: $70,000 - $80,000 USD
  
