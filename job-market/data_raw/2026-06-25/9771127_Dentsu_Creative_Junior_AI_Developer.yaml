  Job Description:
  
  JD for Analyst (DCF Level 20/25 at DGS)
  
  Job Summary
  
  We are looking for enthusiastic and sharp-minded fresh
  graduates to join our data team as Analyst/ Associates/
  Software Engineer. This is an entry-level role designed to
  offer exposure across the data value chain — from data
  wrangling and engineering to analytics and predictive
  modeling.
  
  You’ll work closely with product, engineering, and business
  teams to help solve real-world problems using data. Ideal
  for individuals who are passionate about uncovering
  insights, building scalable data pipelines, and developing
  machine learning models to drive decision-making.
  
  Key Responsibilities
  
  🔍 Data Analytics
  
  - Analyze large volumes of structured and unstructured data to
    extract meaningful business insights.
  - Create dashboards, visualizations, and reports using tools
    like Power BI, Tableau, or Excel.
  - Support in identifying patterns, trends, and anomalies in
    data to support business decisions.
  
  🧪 Data Science
  
  - Assist in building, testing, and deploying machine learning
    models under supervision.
  - Work with statistical and ML techniques for classification,
    regression, clustering, etc.
  - Collaborate on experiments, hypothesis testing, and
    performance evaluation of models.
  
  🏗️ Data Engineering
  
  - Support in designing and building data pipelines and ETL
    processes.
  - Assist in data cleaning, transformation, and storage using
    SQL, Python, or cloud platforms.
  - Help maintain data integrity, quality, and documentation
    across data systems.
  
  Qualifications
  
  - Education:Bachelor’s degree in Engineering, Computer
    Science, Data Science, Gen AI or related fields. Final-
    year students or recent graduates are welcome to apply.
  - Technical Skills:
    - Strong foundation in Java, React, NodeJS, Python, SQL, and
      Excel
    - Basic understanding of data structures, databases, and
      algorithms
    - Exposure to pandas, NumPy, PySpark, scikit-learn, GenAI,
      Agentic AI or TensorFlow is a plus
    - Familiarity with BI tools (e.g., Power BI, Tableau) or cloud
      platforms (e.g., AWS, GCP) is desirable
    - Knowledge of version control (Git) is an advantage
  
  Soft Skills
  
  - Curiosity and a passion for data-driven problem solving
  - Strong analytical and logical thinking
  - Good communication and collaboration skills
  - Willingness to learn in a fast-paced environment
  - Ability to break down complex problems and document clearly
  
  Preferred (Good to Have, Not Mandatory)
  
  - Internship or academic project in data analytics, machine
    learning, or database systems
  - Participation in hackathons, coding contests, or Kaggle
    competitions
  - Exposure to Agile or collaborative tools like JIRA,
    Confluence
  
  What You’ll Gain
  
  - Hands-on experience across analytics, data science, and
    engineering tracks to solve critical Business problems.
  - Opportunity to work on live projects and scalable systems
  - Mentorship from experienced data professionals
  - Career pathways in analytics, data science, GenAI, Agentic
    AI or data engineering based on your interest and skills
  
