description: |
  Integration meets Innovation
  
  At Celigo, we believe integration should empower — not
  exhaust — innovation. As a modern Integration and Automation
  Platform (iPaaS), we’re on a mission to simplify how
  companies integrate, automate, and optimize processes.
  Powered by game-changing technology like runtime AI and
  prebuilt, mission-critical integrations, Celigo is
  redefining how businesses connect their world.
  
  We are seeking a Senior Data Integrations Engineer - AI with
  expertise in Enterprise System Integrations, Business
  Process Automation, and AI technologies. In this role, you
  will design, build, and deploy scalable integration
  solutions and automations, as well as develop AI Agents
  using various technologies across multiple domains.
  
  The Global Technology Operations team is dedicated to
  digitally transforming and scaling Celigo's business,
  enhancing productivity, and improving operational
  efficiency. We work closely with top talent across the
  company to drive both our business operations and product
  development. As an AI Integrations Engineer, you will
  support the business by seamlessly connecting systems and
  data. Additionally, you will build automations using
  integrator.io and AI concepts to eliminate redundant tasks,
  enabling teams to focus on higher-value activities.
  
  What would you do if hired?
  
  - Champion the Celigo product through transformational
    integrations that enable scalable business growth.
  - Build AI agents/integrations using Celigo’s integrator.io
    and frameworks like LangChain and LangGraph, and using
    best practices in AI SDLC.
  - Be an advocate for Celigo and show the art of the possible
    with AI for different stakeholders within Celigo and to
    Celigo customers/partners/builders.
  - Design, build, and deliver scalable data pipelines
    leveraging modern cloud architectures.
  - Collaborate with business process experts to develop
    solutions for complex systems and data platforms that
    drive revenue growth.
  - Ensure your integrations adhere to engineering best
    practices, emphasizing data quality, accuracy,
    operability, and security.
  - Build and maintain trusted relationships with technical and
    business teams.
  - Manage multiple projects concurrently, including operational
    tasks.
  - Serve as the owner and final escalation point for your
    integrations.
  - Produce clear, accurate technical documentation, develop
    support processes and procedures, and facilitate smooth
    hand-offs to peers and other organizational units.
  
  Who are we looking for?
  
  Skills & Abilities
  
  - Proven ability to interface with diverse stakeholders across
    business units and levels, gather requirements, and manage
    follow-ups.
  - Demonstrated track record of delivering projects end-to-end
    with strong accountability.
  - Thinks like an owner—takes full charge of projects from
    inception to delivery while keeping Celigo’s best
    interests in mind.
  - Willingness to work flexible hours to collaborate with India
    stakeholders effectively.
  - Excellent written communication skills; experience with data
    visualization (graphs and plots) is a significant
    advantage.
  - Able to quickly learn business processes, understand
    requirements, and communicate designs that address both
    technical and business challenges.
  - Basic knowledge of SQL, Snowflake stored procedures, AWS S3,
    along with a clear understanding of integration design
    patterns.
  - Basic knowledge of Agent SDKs and Model context protocol.
  - Familiar with various authentication mechanisms such as
    OAuth 2.0, SAML2, and JWT Bearer Tokens.
  
  Education & Experience
  
  - A BS/BA in Information Systems, Computer Science, or
    equivalent practical experience is preferred.
  - Strong expertise in developing integrations using REST and
    SOAP APIs, with at least 5+ years of experience in JSON
    and XML schema design. (must have)
  - 1+ years of experience in building AI solutions using RAG,
    LangGraph, Web scraping, or any other AI technology.
  - Proficient in JavaScript/Python for data processing within
    integration projects.
  - Good to have experience in developing AI agents or bots that
    autonomously interact with various tools and systems to
    derive and act upon business insights.
  - Good to have experience in integrating Large Language Models
    (LLMs) such as OpenAI's GPT series, Google's Gemini, or
    Anthropic's Claude with external APIs, vector databases,
    and enterprise platforms to automate workflows and enhance
    decision-making processes.
  - Solid understanding of prompt engineering, context
    management, and the orchestration of multi-step tasks
    using AI-driven solutions.
  - Knowledge of system and software engineering architecture
    principles and best practices is a plus.
  - Experience supporting business teams and a strong grasp of
    processes like Quote-to-Cash, Procure-to-Pay, Lead-to-
    Opportunity, and Hire-to-Retire.
  - Hands-on experience with cloud applications like Salesforce,
    HubSpot, NetSuite, Zendesk, Gong, Gainsight, and similar
    platforms.
  - Experience in designing and building integration solutions,
    ideally within Sales or Customer Success domains.
  
  Celigo reasonably expects to pay a base salary between
  $145,000 and $160,000 per year for this position. Actual
  starting base pay will be determined by skills, experience,
  geographic location, and other non-discriminatory factors
  permitted by law. Total compensation may also include
  variable incentives, benefits, or other perks as outlined in
  any formal employment offer made.
  
  Celigo is proud to be
  
  - A 2025 Gartner Customers’ Choice for iPaaS. The only vendor
    to receive this award.
  - Celigo is a Visionary in the Gartner Magic Quadrant for
    iPaaS for the second consecutive year
  - Celigo is ranked #1 iPaaS on G2 for multiple quarters and
    named a Leader in both B2B/EDI and API Management.
  - Celigo is a leading intelligent automation platform that
    puts the power of automation in the hands of every team,
    unifying workflows from the predictable to the fully
    agentic in a single platform.
  
  Here you'll experience
  
  - Remote-first culture, built on trust, collaboration, and
    transparency
  - A high-growth, inclusive work environment where innovation
    thrives and ideas are implemented
  - Lightspeed learning opportunities to keep you at the leading
    edge of your field
  - Exceptional coworkers who challenge and inspire you daily
  - Competitive compensation and benefits, including:
  
  Diversity, Equity, Inclusion, and Accessibility
  
