title: Senior Software Engineer, Agentic AI
company: RVO Health
location: USA
work_type: FULL_TIME
description: |
  At A Glance
  
  We are looking for a Senior AI Engineer to help build the
  next generation of AI-powered tools to accelerate our
  internal ms. This is a software engineering role first where
  you should be comfortable owning backend systems, APIs, and
  production architecture. AI/agentic experience is the layer
  on top. This is a hands-on, high-ownership role at the
  center of a growing AI Ops function within Corporate
  Technology. You will design and build AI Assistants that
  automate real workflows, integrate with enterprise tools,
  and are grounded in sound software engineering practices.
  You will not be building demos. You will be building
  production-grade systems that people at RVO Health will use
  every day.
  
  The ideal candidate is comfortable working across the full
  AI development stack: from designing AI workflow automation
  and fine-tuning prompts to building APIs and integrating
  third-party platforms. You thrive in a fast-moving
  environment, can translate a business workflow into a
  technical architecture, and care about delivering work that
  is reliable, maintainable, and secure.
  
  This role reports into the Director of AI Ops & Platform
  Engineering and works closely with the AI Ops team,
  security, IT, and platform engineering. It is an early and
  influential seat in a program that will accelerate the
  adoption and use of AI across RVO Health.
  
  Where You'll Be
  
  To prioritize togetherness, culture, and accountability, RVO
  Health operates on an in-office work schedule. We expect
  employees to work from our Charlotte, NC/Fort Mill, SC,
  Denver, CO or Minneapolis, MN office Tuesday, Wednesday and
  Thursday each week. You are welcome to work remotely Mondays
  and Fridays if you wish.
  
  (This role is also open remotely for those candidates
  outside of a hub location)
  
  What You’ll Do
  
  - Design, build, and iterate on AI Assistants integrated with
    enterprise tools including Jira, Slack, and internal data
    sources
  - Develop and maintain prompt engineering frameworks,
    evaluation pipelines, and feedback loops to continuously
    improve assistant quality and reliability
  - Build and maintain APIs, backend services, and integrations
    that connect AI capabilities to the tools teams already
    use
  - Collaborate with AI Ops, security, IT, and platform
    engineering teams to ensure systems are production-grade,
    secure, and observable
  - Contribute to a repeatable framework for building new AI
    Assistants as the program expands
  - Enable the organization by building a marketplace of shared
    skills/plugins
  - Evaluate new models, tools, and libraries and make informed
    recommendations on when and how to adopt them
  - Identify and mitigate risks related to AI outputs, data
    handling, and responsible use
  - Contribute to technical documentation, runbooks, and
    onboarding materials that help the team scale what gets
    built
  
  What We’re Looking For
  
  - 4+ years of software engineering experience, with at least 1
    year focused on building with AI and/or creating LLM-
    powered applications
  - Experience building and deploying apps in cloud
    infrastructure
  - Hands-on experience with LLM APIs (OpenAI, Anthropic, or
    similar) and the practical realities of prompt engineering
    at scale
  - Experience leveraging Claude Code for agentic coding
  - Experience integrating with third-party APIs and enterprise
    tools (Jira, Slack, or similar platforms is a plus)
  - Experience with  software engineering best practices
    including: version control, testing, CI/CD, observability,
    and code review
  - Strong communication skills and the ability to work with
    non-technical stakeholders to understand workflows and
    translate them into technical requirements
  
