description: |
  At JetBrains, code is our passion. Ever since we started
  back in 2000, we have strived to make the strongest, most
  effective developer tools on earth. By automating routine
  checks and corrections, our tools speed up production and
  free developers to focus on creativity and problem-solving.
  
  The IntelliJ AI team develops the AI-specific core of
  JetBrains IDEs. We work on agentic workflows, intelligent
  editing assistance, and new AI-powered capabilities that
  redefine how developers interact with the IDEs.
  
  We are looking for a Senior Software Developer to help us
  build the next generation of AI-powered features in
  JetBrains IDEs.
  
  In this role, you will:
  
  - Integrate state-of-the-art AI agents into our IDEs,
    continuously improving the developer experience of working
    with them.
  - Enhance agent capabilities by equipping them with the most
    intelligent tools available in our IDEs.
  - Create novel AI features with no direct market analogues,
    experimenting with and exploring the new possibilities
    brought by modern AI technologies.
  - Measure and evaluate the performance of agents and other AI
    features to achieve reliability and reproducibility.
  
  We are looking for engineers who:
  
  - Want to help build the best IDEs in the world and push the
    boundaries of developer tools.
  - Have strong knowledge of Java, Kotlin, or similar languages.
  - Are comfortable designing and developing complex software
    systems.
  - Are self-driven and able to take end-to-end ownership of
    challenging features.
  - Possess strong communication skills in English, both written
    and verbal.
  
  Experience that would be especially valuable:
  
  - Building AI-powered features, especially with LLM-based
    systems.
  - Developing IDEs, code editors, or complex desktop
    applications.
  - Working on performance-sensitive or correctness-critical
    systems.
  - Concurrent programming and performance optimization.
  
  Why join JetBrains?
  
  - Strong base salary. We offer competitive pay that reflects
    your skills and experience.
  - Flexible work location. Enjoy the freedom to work from home
    or from the office.
  - Remote work. Spend up to 30 days per year working remotely
    from abroad.
  - Extra time off. More days to relax, recharge, and do the
    things you love.
  - Medical insurance allowance. Enjoy peace of mind for you and
    your family.
  - Learning and development opportunities. Access to
    conferences, courses, and language classes.
  - Relocation support. We help make your move as smooth and
    stress-free as possible.
  - Language classes. Pick up the local language or sharpen your
    English skills.
  - Fuel your day. Enjoy a hot meal or receive a lunch allowance
    on workdays.
  - Mental health support. To help you feel your best, we
    provide easy access to professional mental health
    services.
  - Sports benefit. Enjoy an on-site gym or sports club stipend.
  - Internal events. Join company-wide celebrations and team
    gatherings.*Some benefits may vary depending on location.
  
