title: AI Solutions Engineer
company: Chainguard
location: USA
work_type: FULL_TIME
description: |
  Chainguard is the trusted source for open source. By
  delivering hardened, secure, and production-ready builds of
  all the open source software engineers and AI agents rely
  on, Chainguard helps organizations build faster, stay
  compliant, and eliminate risk.  Our customers include
  Fortune 500 enterprises and global industry leaders,
  including Anduril, Canva, Fortinet, Hewlett Packard
  Enterprise, OpenAI, Snap Inc., and Snowflake. Chainguard is
  venture-backed by leading investors, including Amplify, IVP,
  Kleiner Perkins, Lightspeed Venture Partners, Mantis VC,
  Redpoint Ventures, Sequoia Capital, and Spark Capital.
  
  The role, in a nutshell:
  
  Chainguard is becoming an AI company, and we’re hiring an AI
  Solutions Engineer to make that real in the daily work of
  every team. This is a dedicated, hands-on role with a clear
  mission: find the highest-leverage opportunities where AI
  can materially change the economics of how Chainguard
  operates — revenue, efficiency, and quality — and build the
  working prototypes that prove they work.
  
  The role is part internal consultant, part builder. You’ll
  partner with functional owners across the company
  (Engineering, GTM, Product, Operations, and beyond), the AI
  Enablement Council, and our AI Ambassadors to take
  prioritized use cases from idea to validated prototype.
  You’ll turn promising ideas into internal workflow
  automations, reusable prompt systems, AI-enabled tools and
  assistants, and early integrations — using approved tools,
  keeping humans in the loop, and holding a high security and
  quality bar.
  
  This is an applied tooling and building role, not a research
  role. You’ll work with tools like Claude Code, the Anthropic
  API, Glean, and the systems Chainguard already runs on. Your
  job is to reduce the frustration of great ideas stalling for
  lack of capacity or technical skill — and to build the
  evidence base that tells the company where to invest next.
  
  What you’ll do:
  
  - Find high-leverage opportunities: Run listening tours and
    current-state assessments across functions. Identify and
    prioritize the workflows where AI can deliver outsized
    impact, weighing impact potential against feasibility, and
    focus on opportunities that can materially bend the
    revenue/opex curve.
  - Prototype and validate: Take prioritized use cases from idea
    to working prototype — internal workflow automations,
    reusable prompt systems and templates, AI-enabled tools
    and assistants, and early workflow integrations — to test
    whether an opportunity is worth broader investment.
  - Partner across the business: Work directly with functional
    owners, the AI Enablement Council, and AI Ambassadors to
    understand real workflow needs, validate selected
    opportunities, and build the business case and evidence
    base needed to inform investment decisions.
  - Build responsibly: Build and test using approved tools and
    established Legal and Security review pathways. Validate
    outputs, ensure clear human review, and maintain strong
    data hygiene. No AI tool is used on Chainguard, customer,
    or personal data until it has cleared review.
  - Make it visible and reusable: Document what you built, the
    problem it solves, and what you learned. Share your work
    across the company through Builder Hours, demos, and
    showcases, and surface recurring technical needs and reuse
    opportunities back to the AI Enablement Council.
  - Set the standard for internal AI building: Model
    responsible, high-quality AI building so that what you
    prototype can be handed off, scaled, and maintained by the
    functional experts who own the workflow.
  
  What we’re looking for:
  
  - Experience: Minimum of 4 years building software,
    automation, or internal tooling, with excellent problem-
    solving skills and the ability to drive ambiguous, zero-
    to-one work independently.
  - Applied AI tooling: Hands-on experience using AI tools
    (e.g., Claude Code, Copilot, Cursor) in real work, and
    building on top of LLM APIs — tool/function calling,
    agents, prompt and context engineering, RAG, and patterns
    like MCP.
  - Builder and integrator: Able to wire together APIs,
    automations, and integrations across the SaaS systems a
    company runs on (e.g., Slack, Google Workspace, GitHub,
    Linear) into reliable internal tools and prototypes.
  - Product and consulting sense: Comfortable talking with non-
    technical stakeholders, framing problems, sizing impact,
    and prioritizing by impact and feasibility — translating
    fuzzy needs into shippable prototypes.
  - Development: Programming proficiency in at least one
    language, with strong preference for Go and/or Python.
  - Responsible-use mindset: Respects security, legal, and data-
    handling guardrails, and treats responsible AI use as part
    of doing the job well.
  - Communication: Strong communication skills, proficiency in
    English, and the ability to work autonomously in a remote,
    globally distributed team — taking initiative and seeking
    help proactively when needed.
  
  This role is about applying AI tooling and building internal
  prototypes across the business — not training, fine-tuning,
  or building foundation models from scratch. It also does not
  own product roadmap work, independent tool purchasing, or
  any path that bypasses Legal and Security review.
  
  Nice to haves:
  
  - Agent ecosystems: Experience building agent skills, MCP
    servers, or orchestration and automation frameworks.
  - From idea to adoption: A track record of turning internal
    workflow ideas into tools that teams actually adopt.
  - Cross-functional background: Experience in internal
    consulting, solutions engineering, or forward-
    deployed/applied roles.
  - Open Source: Actively involved in the open-source community.
  - Security: Interest in software supply chain security, secure
    SDLC, or responsible AI governance.
  
  Explore our work:
  
  - https://www.chainguard.dev
  - Chainguard Academy
  
  Base Salary Range
  
  $121,000—$142,000 USD
  
  About Us
  
  We live and breathe our company values:
  
  - We are customer obsessed — We focus on delivering solutions
    to our customers that create value and make their lives
    better.
  - We have a bias for intentional action — We prioritize, plan,
    try things, and fail fast.
  - We don't take ourselves too seriously (but we do serious
    work) — We are solving an important problem which takes
    focus, but we also like to enjoy the journey.
  - We trust each other and assume good intentions — We're
    transparent with decisions to empower team members to make
    well informed decisions.
  
  A few of the benefits we offer:
  
  - Flexible & Remote-First Culture: Work remotely with team
    meetup opportunities, bi-annual destination summits, and a
    monthly stipend for coworking spaces, phone and internet
    costs.
  - Our Approach to Equity: Receive stock options upon hire and
    promotion. Plus, you can participate in secondary
    offerings and have 10 years to exercise your options (yes,
    you read that correctly: 10 years!).
  - 100% Covered Health Insurance: We cover 100% of your health,
    vision and dental insurance premiums for you and your
    dependents. Nothing comes out of your paycheck.
  - ∞ Flexible Time Off: Take the time you need – to do our best
    work, we need to recharge and reset.
  - 18 Weeks Paid Parental Leave: We offer 18 weeks for birthing
    parents and 12 weeks for non-birthing parents, with the
    option to use it all at once or throughout your child's
    first year.
  
  If your experience is close but doesn't fulfill all
  requirements, please apply. We're building the best team in
  technology and are focused on hiring "Chainguardians" with
  unique backgrounds, perspectives, and experiences.
  
  Chainguard is an equal opportunity employer. We do not
  discriminate based upon race, religion, color, national
  origin, sex (including pregnancy, childbirth, reproductive
  health decisions, or related medical conditions), sexual
  orientation, gender identity, gender expression, age, status
  as a protected veteran, status as an individual with a
  disability, genetic information, political views or
  activity, or other applicable legally protected
  characteristics. We also consider qualified applicants with
  criminal histories, consistent with applicable federal,
  state and local law.
  
  By submitting your application, you acknowledge that
  Chainguard will process your personal data in accordance
  with Chainguard's Global Candidate Privacy Notice.
  
