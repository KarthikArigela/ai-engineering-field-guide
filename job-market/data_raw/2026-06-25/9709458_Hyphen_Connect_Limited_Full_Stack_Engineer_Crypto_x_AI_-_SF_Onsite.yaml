description: |
  We are hiring for one of our ecosystem projects, an
  innovative AI and Web3 company building an Ethereum Layer 2
  solution integrated with advanced AI agents. As the first
  engineer dedicated to this initiative, you will play a
  pivotal role in its development, with potential
  opportunities to build and lead a team in the future.
  
  Key Responsibilities
  
  - Design and implement AI platforms, encompassing both front-
    end interfaces and back-end services.
  - Collaborate with other developers and AI engineers on data
    preprocessing, model training, and optimization.
  - Deploy AI models into production environments, ensuring
    performance, scalability, and reliability.
  - Develop and maintain data processing pipelines to ensure
    data quality and consistency.
  - Stay updated on AI technology trends, advocating for the
    integration of new technologies into our products.
  - Contribute to other projects based on the company’s product
    development progress
  
  Requirements
  
  - Bachelor’s degree or higher in Computer Science, Software
    Engineering, Artificial Intelligence, or a related field.
  - 5 years of full-stack development experience, proficient in
    both front-end and back-end technologies.
  - Expertise in front-end and back-end technologies (especially
    Golang)
  - Eager to explore and could use new technologies related to
    AI that help improve working efficiency
  - Strong curiosity and willingness to explore new product
    directions, identify potential AI applications, and
    contribute to product innovation.
  - Familiarity with Web3, blockchain, and the crypto industry,
    with insights into different product models and a personal
    perspective on industry trends and innovations.
  - Excellent communication skills and a collaborative team
    spirit, with the ability to independently solve problems
    and take initiative.
  
  Preferred Qualifications
  
  - Knowledge in data processing and analysis will be a plus,
    with knowledge of SQL and NoSQL databases such as MySQL,
    PostgreSQL, or MongoDB.
  - Experience in deploying and optimizing AI agent
  - Experience contributing to open-source projects
  - Build high-performance APIs and microservices to support
    large-scale Web3 application
  - Familiarity with large-scale data processing technologies
    such as Hadoop or Spark.
