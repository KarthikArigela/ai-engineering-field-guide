  means that your data will be:
  
  - Used lawfully, fairly and in a transparent way
  - Collected only for valid purposes and not used in any way
    that is incompatible with those purposes
  - Relevant to the purposes we have told you about and limited
    only to those purposes
  - Accurate and kept up to date
  - Kept only as long as necessary for the purposes we have told
    you about
  - Kept securely
  
  If you would like to contact us about your data, please use
