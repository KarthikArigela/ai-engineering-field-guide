description: |
  About us:
  
  Amach is an industry-leading technology driven company with
  headquarters located in Dublin and remote teams in UK and
  Europe.
  
  Our blended teams of local and nearshore talent are
  optimised to deliver high quality and collaborative
  solutions.
  
  Founded in 2013, Amach was created to solve a specific
  problem in aviation: too much complexity, too little usable
  intelligence. We help airlines modernise their operating
  model using cloud, data and Al-delivered by teams with deep
  aviation domain expertise. Our goal is to maximize airlines'
  operational efficiency by optimizing resource use, reduce
  costs and increase customer experience and satisfaction.
  
  We are seeking an AI Enablement Engineer to join our team
  and lead the definition and implementation of AI-first
  governance, guardrails, and controls that enable safe,
  scalable, and auditable adoption of AI-assisted development
  tools across our software development lifecycle. This is a
  hands-on, senior-level engineering governance position where
  you will partner closely with our Software Engineering teams
  to establish standards and controls that allow AI to scale
  responsibly across coding, testing, documentation, DevOps,
  and repository workflows. You will shape how approved AI
  tools like GitHub Copilot, AWS Q Developer, AWS Transform,
  Kiro, and CodeScene ACE are used safely and effectively
  across Amach.
  
  Please note: this role operates on a hybrid model, with 2
  days per week in the London office.
  
  Key Responsibilities
  
  - Partner with Software Engineering to define and implement
    engineering standards and guardrails that enable AI to
    scale safely
  - Define how approved, in-scope AI engineering tools can be
    used safely across coding, testing, documentation, DevOps,
    repository activity, and review evidence
  - Lead on AI engineering guardrails, adoption, and control
    across tools such as GitHub Copilot, AWS Q Developer, AWS
    Transform, Kiro, CodeScene ACE, and other in-scope
    platforms, including the use of MCP servers
  - Apply engineering-specific controls for repository access,
    human review, generated artefact evidence, secure coding
    checks, and exception handling
  - Support existing engineering governance including GitHub
    Enterprise migration governance, GitHub user support,
    Copilot usage and admin support, and Q and Transform
    guardrails on the central repository
  - Track and escalate AI engineering risks, exceptions, and
    technical debt where needed
  - Create an AI engineering tool usage matrix setting clear
    perimeters for each tool, develop an AI-enabled SDLC
    playbook so developers know when and how tools may be
    used, and produce a code review, validation, and
    traceability checklist for AI-generated outputs
  - Deliver a GitHub Enterprise migration governance roadmap
    with risks and dependencies visible against the end-
    of-2026 target and maintain an AI engineering risk,
    exception, and technical debt log
  - Produce adoption material for engineering communities of
    practice to drive safe and effective AI tool usage
  
  Requirements
  
  - Proven experience defining AI SDLC guardrails, including MCP
    server allow-listing, access control, generated artefact
    review, and audit evidence
  - Strong hands-on experience with the GitHub ecosystem
    including GitHub Enterprise, GitHub Actions, and Git
    workflow
  - Familiarity with GitHub Copilot, AWS Q Developer, AWS
    Transform, Kiro, or comparable agentic development tools
  - Track record of establishing engineering standards,
    governance, and controls across delivery teams
  - Confidence engaging engineering communities of practice and
    driving adoption across technical teams
  - Ability to step in quickly and shape safe AI adoption from
    day one
  
  Nice to have
  
  - Example deliverables, templates, or accelerators you can
    bring to move quickly and accelerate implementation
  
  What’s in it for you:
  
  - An opportunity to join a fast-growing company
  - Options for career advancement
  - Learning and development opportunities
  - Flexible working environment
  - Competitive salaries based on experience
  
