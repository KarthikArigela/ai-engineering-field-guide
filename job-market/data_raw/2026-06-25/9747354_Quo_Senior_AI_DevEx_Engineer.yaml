description: |
  Small businesses represent 99.9% of all companies, yet
  they're still forced to choose between clunky, outdated
  enterprise phone systems or their personal phones. This
  multi-billion dollar market has been overlooked for decades,
  left to cobble together solutions that slow them down
  instead of helping them grow.
  
  Quo is changing that. We bring calls, texts, and customer
  information together into one easy-to-use, AI-powered
  platform. We’re not just building a phone system. We’re
  setting a new standard for how businesses connect with their
  customers.
  
  Driven by our values, we move fast, build with
  determination, and obsess over delivering value to the
  businesses that have been underserved for far too long.
  
  Today, Quo is trusted by more than 90,000 companies and
  rated #1 in customer satisfaction on G2. We’re backed by Y
  Combinator, Tiger Global, Craft Ventures, Slow Ventures, and
  other top-tier investors. It’s safe to say we’re onto
  something big.
  
  About the Role
  
  We're looking for a Senior AI Developer Experience Engineer
  to accelerate the AI tooling transformation that enables our
  teams to build, test, and ship with speed and confidence.
  You'll treat developer experience as a product - defining
  the strategy, driving platform adoption, and delivering
  measurable improvements to productivity, quality, and
  reliability across the software development lifecycle.
  
  This is a high-impact individual contributor role. You'll
  partner with senior engineering leaders across the
  organisation, influence standards and tooling decisions, and
  champion platform-first thinking - turning developer pain
  points into durable, scalable solutions that benefit
  hundreds of engineers.
  
  Some of the things you'll do:
  
  - Define and drive DevEx strategy across engineering
    organizations, partnering with senior leaders to align
    investments with business priorities
  - Design, implement, and optimise CI/CD pipelines and
    lifecycle automation platforms
  - Build developer tools and automation to simplify and
    expedite the software development lifecycle from
    requirements through release
  - Define and promote golden paths for building, deploying, and
    operating services
  - Reduce tooling fragmentation through consolidation, strong
    defaults, and principled standardisation
  - Identify and eliminate friction across build, test,
    deployment, and operations workflows
  - Improve and maintain core infrastructure across multi-cloud
    and hybrid environments
  - Collaborate with cross-functional teams to drive best
    practices in reliability, testability, and performance
  - Represent DevEx strategy in senior technical forums and
    drive engineering culture improvements
  - Iterate on evaluation frameworks that keep automation, AI-
    assisted tooling, and coding agents reliable and aligned
    with sound software engineering practices
  
  About You
  
  - 8+ years of professional software engineering experience,
    with at least 3 years focused on developer productivity,
    platform engineering, or internal tooling
  - Strong hands-on coding skills in one or more modern
    languages such as Python, Go, Java, TypeScript, Kotlin, or
    Swift
  - Deep experience with CI/CD systems, build infrastructure,
    testing frameworks, and deployment automation
  - Demonstrated ability to influence engineering practices
    across multiple teams or organisations
  - Exposure to AI-assisted engineering workflows, coding
    agents, or LLM evaluation pipelines
  - Experience improving developer productivity at a company
    with hundreds or thousands of engineers
  - Experience identifying, measuring, and systematically
    eliminating friction in the software development lifecycle
  - Ability to balance standardisation with developer autonomy -
    knowing when to enforce defaults and when to empower teams
  - Proven track record of translating technical strategy into
    measurable outcomes
  - Experience operating critical systems with high reliability,
    observability, and availability requirements
  - Clear and effective communication skills with the ability to
    engage both technical and leadership audiences
  
  Nice to have:
  
  - Experience building and scaling internal developer platforms
    as products (e.g., Backstage or similar portals)
  - Experience with application lifecycle management or
    automation at enterprise scale
  - Passion for engineering excellence and a track record of
    raising the technical bar across teams
  
  Compensation
  
  The annual base salary range for this position is as follow,
  plus equity and benefits:
  
  - SF Bay Area, Los Angeles, Seattle, Portland, Boston, New
    York, and Washington, DC Metro: $187,000 - $220,000 USD
  - All other US Locations: $169,000 - $198,000 USD
  - Canada: $172,000 - $202,000 CAD
  
  The ranges displayed reflect the target for new hire
  salaries, and within each range, individual pay is
  determined by your skills and experience, as well as
  relevant education. Your recruiter can share more and answer
  questions about the specific salary range during the hiring
  process.
  
  Salary is just one component of Quo’s total compensation
  package. Your total rewards package will include equity,
  extensive medical coverage, a monthly lifestyle stipend, and
  a flexible PTO policy.
  
  Who we are
  
  As a fully remote company, we thrive as a team. We are
  curious, ambitious, and dedicated to our work. We value
  trust above all else, and have a strong bias for action. If
  you're looking for a place to do your life's work, please
  get in touch. We'd love to hear from you.
  
  And remember, there's no such thing as a 'perfect'
  candidate. We're looking for optimists with grit and
  determination, who are excited to face the challenges of a
  growing startup. Quo is the type of company where you can
  grow, and we encourage you to apply for this role even if
  you don't think you meet all the requirements.
  
  We are committed to creating an inclusive and diverse work
  environment. It is important that you are able to bring your
  authentic self to work every day. We do not discriminate on
  the basis of race, religion, color, national origin, gender,
  sexual orientation, age, marital status, veteran status, or
  disability status. #LI-Remote #PostLI
