description: |
  Job Title: Python Django & AI/ML Developer Location: Pune
  (Work from Office) Experience: 3+ Years
  
  About the Role
  
  We are seeking a highly skilled Python/Django Developer with
  hands-on experience in Generative AI (GenAI) to join our
  growing team. The ideal candidate should have a strong
  foundation in backend development, deep understanding of
  Python and Django frameworks, and practical exposure to
  building and deploying GenAI-powered solutions. Key
  Responsibilities Design, develop, and maintain scalable web
  applications using Python and Django. Integrate Generative
  AI models (LLMs, transformers, diffusion models, etc.) into
  production systems. Work with APIs, microservices, and
  databases to build robust backend architectures. Collaborate
  with data scientists and ML engineers to fine-tune and
  deploy AI models. Optimize performance, scalability, and
  security of applications. Research and experiment with
  emerging AI/ML tools, libraries, and frameworks.
  Troubleshoot, debug, and upgrade existing applications.
  Required Skills & Experience 3+ years of hands-on experience
  in Python and Django framework. Strong experience in RESTful
  APIs, ORM, and SQL/NoSQL databases (PostgreSQL, MySQL,
  MongoDB, etc.). Knowledge and experience with Generative AI
  frameworks/libraries such as Hugging Face, LangChain, OpenAI
  APIs, or similar. Familiarity with LLMs, embeddings, vector
  databases (Pinecone, FAISS, Weaviate, etc.). Good
  understanding of cloud platforms (AWS, GCP, or Azure) and
  containerization (Docker, Kubernetes). Proficient in Git,
  CI/CD pipelines, and agile development methodologies. Strong
  problem-solving skills with the ability to learn new
  technologies quickly. Good to Have Experience with front-end
  frameworks (React, Angular, or Vue). Knowledge of prompt
  engineering and fine-tuning AI models. Prior exposure to
  MLOps tools and practices.
