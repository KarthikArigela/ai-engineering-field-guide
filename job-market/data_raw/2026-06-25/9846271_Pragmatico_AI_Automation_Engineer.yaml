job_id: 9846271
title: AI Automation Engineer
company: Pragmatico
location: USA
work_type: FULL_TIME
description: |
  Pragmatico helps companies transform the culture around AI
  so that its use becomes a daily habit, enabling them to
  achieve productivity gains quickly. We're a values-driven
  company led by exited founders, already cash-flow positive
  and well-capitalized. This is your chance to get in on the
  ground floor to shape how we deliver transformation, grow
  alongside a rapidly scaling company, and help organizations
  fundamentally reimagine how they work. As an AI Automation
  Engineer, you'll design and build intelligent automation
  systems that transform how our clients and we operate.
  You'll combine deep technical expertise with exceptional
  client skills to lead automation projects that eliminate
  manual work, connect business systems with AI at the core,
  and enable organizations to scale efficiently. This role is
  split between building our internal automation
  infrastructure and delivering automation solutions directly
  to clients undergoing AI transformation. Our approach to
  hiring: We're more interested in capability and fit than
  titles. These roles can be filled at junior, mid, or senior
  levels depending on your experience. We're ready to bring on
  full-time founding team members now - though for the right
  person in the right situation, part-time starts with a clear
  path to full-time is possible.
  
  Responsibilities
  
  - Design and implement AI-powered automation workflows across
    sales, marketing, and operations for both Pragmatico and
    our clients
  - Lead client automation projects, conducting discovery
    sessions to understand workflows and develop comprehensive
    AI automation roadmaps that prioritize high-impact
    opportunities
  - Build integrations connecting diverse business systems
    (HubSpot, Google Workspace, PandaDoc, Fireflies.ai, and
    more) using Zapier, Make.com, and custom API integrations
  - Leverage Claude API and other LLM APIs to create intelligent
    automations, including research generation, content
    creation, document analysis, meeting summarization, and
    dynamic deliverable creation
  - Present technical concepts and automation solutions to
    client stakeholders in clear ways that demonstrate
    business value
  - Train client teams on maintaining and extending the
    automations you build, ensuring long-term adoption and
    success
  - Establish automation patterns, best practices, and reusable
    frameworks that enable Pragmatico and our clients to scale
    efficiently
  - Contribute to thought leadership content positioning
    Pragmatico as a leader in practical AI implementation
  
  Qualifications
  
  - 5+ years building production automation systems with a
    proven track record of delivering business impact
  - Expert-level proficiency with Zapier and/or Make.com,
    including complex multi-step workflows with conditional
    logic, error handling, and API integrations
  - Strong hands-on experience with AI/LLM APIs (Claude API,
    OpenAI, or similar) for programmatic integration, not just
    chat interface usage
  - Proven ability to integrate diverse business systems via
    APIs, with specific experience in HubSpot API and Google
    Workspace APIs
  - Solid technical foundation including REST APIs, webhooks,
    JSON data manipulation, and workflow architecture
  - Ability to lead discovery sessions, gather requirements, and
    translate business needs into technical automation
    solutions
  - Strong communication and presentation skills - can explain
    complex technical concepts to non-technical audiences and
    build credibility with C-level executives
  - Self-directed problem solver with strong systems thinking
    and ability to design solutions, not just execute
    requirements
  
  About Pragmatico
  
  Pragmatico transforms mid-market companies into AI-native to
  win in the AI economy. Founded by exited, operational
  business leaders, the firm guides companies through every
  stage of AI transformation: AI vision, policy, psychological
  safety, training/upskilling, and adoption and ROI analytics.
  Pragmatico's mission is to make AI adoption human,
  practical, and permanent. Learn more at www.pragmatico.ai.
  
  Equal Opportunity Statement
  
  Pragmatico is an equal opportunity employer, and all
  qualified applicants will receive consideration for
  employment without regard to gender, age, race, religion, or
  any other classification that is protected by applicable
  law.
