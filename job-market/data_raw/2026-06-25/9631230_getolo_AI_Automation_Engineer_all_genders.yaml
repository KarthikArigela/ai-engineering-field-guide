  - Pet friendly office
  
  Sounds like the perfect job for you? We look forward to
  receiving your application and getting to know you!
  
  About getolo
  
  Founded in 2015, getolo GmbH is an innovative and award-
  winning InsurTech company that offers comprehensive
  supplementary insurance plans in the areas of dental, pet
  health and liability, as well as health add-on coverage.
  Under the brands dentolo, petolo, and vitolo, we serve over
  200,000 customers in Germany, providing digital and hassle-
  free protection that seamlessly integrates into their daily
  lives. We believe that prevention is always better than
  cure—which is why we focus on preventive care, customer-
  centric service, and financial security to protect our
  customers and their loved ones from unexpected costs. Thanks
  to the close collaboration of our team of market specialists
  and insurance experts, we continuously monitor industry
  developments to offer practical solutions for current
  challenges. getolo's company culture is built on
  collaboration, innovation, and agility—always with a strong
  focus on the needs of our customers. With a team of around
  200 employees, getolo is led by Daniel Gadea (CEO) and Laura
  Wulff (CGO). getolo is a partner of DA Direkt and part of
  the Zurich Group Germany.
  
  getolo is an equal opportunity and diversity employer. We
  strive to create a friendly, safe, and welcoming environment
  for all our team members, regardless of ethnicity, gender,
  gender identity and expression, sexual orientation,
  limitations and talents of any kind, physical appearance,
  social background, marital status, age, or religion (or lack
  thereof).
  
  When you apply, we focus solely on your experience and
  motivation. You decide what additional information you want
  to disclose (photo, marital status, religion, gender,
  nationality, etc.). We value and treat all applications
  equally.
  
