  Join phData, a dynamic and innovative leader in the modern
  agentic era. We don’t just modernize data stacks—we build
  Intelligence Platforms and AI applications that help clients
  grow, innovate, and compete. Enterprises are no longer
  buying “data work”; they are buying intelligence outcomes,
  and phData is focused on being the partner that builds the
  platform and delivers those outcomes with AI agents,
  analytics, and transformed processes.
  
  We think of the Intelligence Platform as more than a data
  warehouse with dashboards—it’s an AI‑native operating layer
  that turns a company’s data, knowledge, and processes into
  prescriptive, closed‑loop decisions that both humans and
  agents can act on. It extends a modern data platform with
  semantic models, AI agents, and workflow automation that
  plug directly into core systems like CRM, ERP, HR, and
  finance, so intelligence shows up in how work is
  prioritized, routed, and executed—not just in reports.
  
  phData is a remote-first global company with employees based
  in the United States, Latin America, and India.
  
  We celebrate the cultures of our team members and foster a
  community of technological curiosity, ownership, and trust.
  Even though we're growing extremely fast, we maintain a
  casual, exciting work environment. We hire top performers
  and give you the autonomy to deliver meaningful results.
  
  Role Overview
  
  We are looking for an Agentic AI Solutions Engineer to join
  our Applied AI team in our Agentic Delivery Center. In this
  role, you will design, build, and operationalize high-
  impact, production-ready agentic AI solutions that reason,
  retrieve, act, and integrate with enterprise systems to
  deliver measurable business outcomes. You will partner
  closely with clients, AI architects, forward-deployed
  engineers, data engineers, and platform teams to design
  reusable accelerators, set technical standards, and deliver
  high-quality engagements that drive real business results.
  
  Key ResponsibilitiesAgentic Engineering & Client Delivery
  
  - Build and operationalize end-to-end agentic AI solutions,
    like RAG pipelines, multi-agent workflows, and human-in-
    the-loop steps, for enterprise clients
  - Translate solution designs and business requirements into
    clean, well-tested production-grade code aligned with
    phData methodologies, standards, and best practices.
  - Build production-grade agents emphasizing reliability,
    scalability, security, observability, and evaluation and
    guardrail strategies for safe, accurate performance before
    and after deployment.
  - Ensure engagements are delivered on time, within scope, and
    with measurable business value for clients.
  
  Collaboration & Leadership
  
  - Contribute hands-on to reusable agentic accelerators and
    reference implementations aligned with the Intelligence
    Platform that can be deployed across multiple clients.
  - Help establish engineering patterns, tooling, and ways of
    working as part of the zero-to-one buildout of the India
    delivery center.
  - Collaborate with cross-functional partners, including
    forward-deployed engineers, data engineers,
    platform/DevOps engineers, and business stakeholders to
    deliver successful client engagements.
  - Ensure high-quality deliverables through code reviews,
    technical documentation, automated testing, and adherence
    to security and governance standards.
  - Partner with practice and account leaders to identify
    opportunities to expand engagements, improve delivery
    patterns, and standardize AI deployment approaches.
  
  Practice & Firm Contribution
  
  - Contribute to internal initiatives such as IP development,
    accelerators, reference architectures, templates,
    playbooks, and training for colleagues on best practices
    for AI engineering.
  - Represent phData with professionalism in all interactions,
    communicating clearly with both technical and non-
    technical stakeholders.
  
  About You
  
  You are a hands-on AI learning engineer and collaborative
  problem solver who enjoys solving ambiguous business
  problems with AI, creating robust, production-ready
  solutions. You are comfortable working across the stack—from
  data pipelines and infrastructure to APIs and monitoring—and
  partnering directly with forward-deployed engineers, data
  engineers, platform engineers, and business stakeholders.
  You thrive in an outcomes-driven environment and want to
  help build something from the ground up.
  
  Required Qualifications
  
  Experience
  
  - 4+ years of experience in AI/ML engineering, software
    engineering, or data engineering roles building and
    deploying AI/ML solutions to production.
  - Recent hands-on experience with LLM-powered or agentic
    applications
  
  Technical / Functional Skills
  
  - Hands-on understanding of Large Language Models, agentic
    architectures, and retrieval frameworks (RAG), including
    prompt design, context engineering, and tool/function
    calling
  - Experience with LLM orchestration frameworks (e.g.
    LangChain, LlamaIndex) and the broader agentic stack, such
    as multi-agent patterns, memory, planning, and protocols
    (e.g. MCP)
  - Experience designing evaluation, guardrail, and
    observability strategics for LLM and agent systems
    (LLMOps/AgentOps)
  - Hands-on experience in modern programming languages, such as
    Python, including developing APIs
  - Deep expertise in cloud-native AI/ML platforms (e.g. AWS
    Bedrock and SageMaker, Azure AI/ML, Snowflake Cortex) with
    proven experience deploying solutions into production
  - Complete software development lifecycle experience including
    design, documentation, implementation, testing,
    deployment, and ongoing operations
  - Demonstrated use of AI-assisted development tooling to
    accelerate delivery while maintaining quality
  - Strong working knowledge of SQL, including writing,
    debugging, and optimizing complex and distributed queries.
  
  Consulting / Delivery Skills
  
  - Experience delivering projects for external or internal
    clients in a professional services, product, or consulting
    environment.
  - Ability to break down complex problems into structured,
    actionable steps and drive them through to completion,
    ideally in a fixed-bid capacity.
  - Strong written and verbal communication skills in English,
    including the ability to explain technical concepts to
    both technical and non-technical audiences.
  - Proven experience presenting solutions and working directly
    with internal and/or external clients.
  
  Collaboration & Ownership
  
  - Demonstrated ability to work effectively with distributed
    and cross-functional teams across the US, LATAM, and
    India.
  - Proven track record of taking ownership, managing multiple
    priorities, and delivering high-quality work with minimal
    supervision.
  - Comfort working in client environments, quickly
    understanding new systems, and adapting solutions to fit
    existing architectures and processes.
  
  Education
  
  - Bachelor’s degree in Computer Engineering, Computer Science,
    or a related technical field, or equivalent practical
    experience preferred
  
  Preferred Qualifications
  
  - Experience building reusable accelerators, modular
    codebases, or products deployed across multiple clients.
  - Industry experience building AI/ML solutions in life
    sciences, retail, financial services, or manufacturing
  - Prior experience working in global or remote teams and
    partnering across US, LATAM, and/or India.
  - Contributions to open source projects, technical
    communities, speaking engagements, or technical writing
    related to AI and agents are a plus.
  - A Master’s or other advanced degree in data science,
    computer science, or a related field.
  
