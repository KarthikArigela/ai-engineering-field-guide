description: |
  Aledade's AI Enablement team enables, educates, and supports
  the Product, Tech, and Analytics (PTA) organization in
  adopting developer-centric AI tools (Claude Code, MCP,
  plugins, skills, hooks). The Forward-Deployed Engineer (FDE)
  embeds directly with a PTA cohort — Point of Care, Risk,
  Data, or another team — to unblock AI adoption on the
  ground: shipping plugins and skills tailored to that team's
  workflows, integrating their tools through the MCP Gateway,
  and turning hard-won lessons into reusable patterns for the
  broader platform. This is the role for engineers who think
  like internal consultants: meet teams where they are, build
  what they need today, and feed durable wins back into the
  marketplace and installer that the rest of Aledade depends
  on.
  
