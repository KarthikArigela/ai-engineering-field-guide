description: |
  About OUTFRONT
  
  OUTFRONT is one of America’s leading IRL media companies,
  built to do more than be seen.  We create breakthrough real-
  world experiences that engage, influence, and drive impact.
  Through creative excellence, high-impact environments, and
  intelligent audience data, we help brands move people, show
  up with relevance, and make a lasting impression.
  
  Our media lives where life happens, embedded in the culture
  and landscape of cities and the flow of everyday movement.
  It’s trusted, unavoidable, and part of the cultural fabric,
  creating meaningful connections between brands and the
  audiences they serve.
  
  We’re redefining out of home by bringing intelligence,
  flexibility, and digital innovation to scale, turning
  physical presence into measurable impact and real-world
  influence.  We are committed to creating a diverse and
  inclusive work environment that promotes the growth of our
  people. Come join our industry-leading team!
  
  What We Offer
  
  OUTFRONT offers a comprehensive benefits program including:
  
  - Medical, Dental, Vision (including same and opposite-sex
    domestic partners)
  - HSA and FSA plans, Family Benefits, Pet Benefits
  - 401(k) Plan with an Employer Match
  - Paid Time Off, Commuter Benefits, Educational Assistance
  - Robust Diversity, Equity and Inclusion program including 7
    Employee Resource Groups (ERGs)
  
  About the Role
  
  We're hiring an AI Automation Engineer to grow into one of
  the most interesting roles in our technology org. You'll
  partner with our Senior AI Automation Engineer to embed with
  business teams across OUTFRONT, find broken manual
  processes, and ship AI-powered automations that fix them.
  You'll spend your first year ramping fast: shipping
  production work from day one, learning our AWS and Microsoft
  stacks, building a reputation as someone who delivers.
  
  This is an engineering role first. We're hiring for software
  fundamentals (you can write good code, design clean APIs,
  debug a real production issue) and we'll teach you the rest.
  Power Platform, our internal AI tooling, OOH advertising —
  none of it is a prerequisite. We assume you'll pick those
  up. What we can't teach you in 90 days is the engineering
  chops.
  
  You'll also contribute to OUTGPT, our internal AI platform
  built on the Vercel AI SDK and AWS Bedrock. Early on, that
  means small features and integrations under review. As you
  grow, you'll own larger pieces.
  
  What You'll Work On
  
  - Automation delivery alongside the Senior. Pair on
    stakeholder engagements early. Take the lead on your own
    projects as you ramp. Ship automations that real business
    teams use every day.
  - AI agents and workflows. Build agents in Copilot Studio for
    M365-native use cases and in Bedrock for autonomous and
    system-data work. Ship, learn where they break, ship
    better ones.
  - OUTGPT contributions. Work on features, integrations, and
    capabilities for our internal AI platform. Your code gets
    reviewed by the Lead AI Platform Engineer; your bar comes
    up fast.
  - Integration work. REST APIs, webhooks, OAuth, SQL,
    Snowflake, Salesforce. The connective tissue of every
    automation we ship.
  - Mentorship in both directions. Get mentored by the Senior
    and the Lead. Mentor our intern. Both will make you
    better.
  
  What We're Looking For
  
  - 2–4 years building production software. Internships count
    toward the floor if the work was real and the systems
    shipped.
  - Strong software fundamentals. You write clean code, you
    reason about systems, you can debug a problem you didn't
    write.
  - Hands-on experience with AI/LLMs, whether through
    professional work, side projects, hackathons, or
    coursework. You've built something that uses an LLM and
    learned why it's harder than it looks.
  - Practical AWS experience. Lambda, S3, RDS, IAM at minimum.
    You don't need to be a cloud expert; you do need to be
    able to ship there.
  - Proficiency in Python, TypeScript/Node, or both. Comfort
    with SQL.
  - API integration experience. REST, JSON, OAuth basics. You've
    connected systems and seen things break.
  - You want to be in front of customers. You're comfortable
    sitting with a Finance lead or a Sales Ops manager, asking
    dumb questions, and walking away with a plan.
  - A portfolio that speaks for itself. GitHub, a side project,
    a deployed app, a meaningful internship — something we can
    look at and say "this person ships."
  
  Nice to Have
  
  - Experience with Microsoft Power Platform (Copilot Studio,
    Power Apps, Power Automate). If you don't have it, you'll
    learn it.
  - Familiarity with the Vercel AI SDK, Next.js, or modern
    TypeScript stacks.
  - Experience with MCP, A2A, or agent frameworks.
  - Snowflake, Sigma, or modern analytics stack exposure.
  - Experience in advertising technology, particularly OOH or
    DOOH.
  - CS degree or equivalent technical degree. Not required if
    your portfolio is strong.
  
  Tech Stack You'll Touch
  
  AWS (Bedrock, Lambda, Step Functions, RDS), TypeScript/Node,
  Python, Vercel AI SDK, Next.js, PostgreSQL, Microsoft
  (Copilot Studio, Power Apps, Power Automate, M365),
  Snowflake, Salesforce, Bitbucket, Kiro, Claude Code.
  
  Reporting and Team
  
  Reports to the VP of AI. Works alongside the Lead AI
  Platform Engineer (technical mentor), the Senior AI
  Automation Engineer (your day-to-day pairing partner), and
  an intern (your first mentee).
  
  For New York, New Jersey, and California, the salary range
  for this role is $125,000-$145,000 per year.  Compensation
  is determined during our interview process by assessing a
  candidate’s experience and skills relative to internal peers
  and market benchmarks evaluated for the scope and
  responsibilities of the position.  Please note that the
  foregoing compensation information is a good-faith
  assessment associated with this position only and is
  provided pursuant to the corresponding Salary Transparency
  Laws.
  
  To all Recruitment Agencies: OUTFRONT Media LLC does not
  accept agency and unsolicited resumes. Please do not forward
  resumes to our OUTFRONT Media employees or any other company
  location.
  
  OUTFRONT Media is not responsible for any fees related to
  unsolicited resumes.
  
  OUTFRONT Media Is An Equal Opportunity Employer
  
  All applicants shall receive equal consideration without
  regard to race, color, religion, gender, marital status,
  gender identity or expression, sexual orientation, national
  origin, age, veteran status or disability. Please refer to
  the OUTFRONT Media Affirmative Action policy statement.
