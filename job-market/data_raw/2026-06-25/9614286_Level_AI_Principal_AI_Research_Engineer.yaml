description: |
  Level AI is a Mountain View-based conversational
  intelligence company building the AI platform that powers
  modern contact centers. Our systems analyze millions of
  customer interactions to surface insights, automate quality
  assurance, and drive real-time agent guidance. We work at
  the frontier of applied speech and language AI, and our
  research directly shapes products used by enterprise
  customers every day.
  
  We are looking for a Principal AI Research Engineer to set
  the technical direction for our most ambitious AI
  initiatives. You will lead research on large language
  models, speech understanding, and retrieval systems—then
  translate that research into production capabilities at
  scale. This is a senior individual-contributor role for
  someone who thrives at the intersection of cutting-edge
  research and real-world deployment, and who can raise the
  technical bar across the entire AI organization.
  
  
  
