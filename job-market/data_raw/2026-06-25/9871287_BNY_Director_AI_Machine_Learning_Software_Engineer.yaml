  We’re seeking a future team member for the role of Senior
  Director, Engineering Technology Partnerships to join our
  Engineering team. This role location is Jersey City.
  
  Role Summary
  
  We are seeking a Director, Polyglot Builder—a highly
  versatile engineer who can design, build, and scale systems
  across multiple programming languages, frameworks, and
  platforms. This role sits at the intersection of engineering
  excellence, rapid prototyping, and platform thinking,
  enabling faster delivery of complex, cross-stack solutions.
  
  Core Responsibilities
  
  - Design and develop end-to-end solutions across backend,
    frontend, data, and infrastructure layers
  - Write and maintain production-grade code in multiple
    languages (e.g., Java, Python, Go, Typescript, Rust)
  - Build reusable components, services, and internal tools to
    accelerate engineering velocity
  - Architect microservices and distributed systems with
    scalability, resilience, and observability in mind
  - Partner with product, platform, and infrastructure teams to
    translate ambiguous requirements into working systems
  - Rapidly prototype new ideas and industrialize them into
    production-ready solutions
  - Drive best practices across code quality, security, testing,
    and performance optimization
  - Mentor engineers and promote a multi-language, multi-stack
    engineering mindset
  
  Required Qualifications
  
  - 15+ years of software engineering experience (level-
    dependent)
  - Proven expertise in at least 2–3 programming languages
    across different ecosystems
  - Strong experience with cloud platforms (AWS, Azure, or GCP)
  - Hands-on experience with APIs, microservices, and
    distributed architectures
  - Familiarity with databases (SQL and NoSQL) and data
    pipelines
  - Strong understanding of DevOps, CI/CD, and containerization
    (Docker/Kubernetes)
  - Ability to switch contexts and languages quickly without
    compromising quality
  
  Preferred Qualifications
  
  - Experience building internal developer platforms or
    frameworks
  - Exposure to AI/ML pipelines or data-intensive systems
  - Strong understanding of event-driven architectures and
    streaming systems
  - Contributions to open-source or multi-language codebases
  - Experience operating in high-scale, regulated environments
    (e.g., financial services)
  
  Key Competencies
  
  - Polyglot mindset: Fluent across languages, tools, and
    paradigms
  - Systems thinking: Connects components into cohesive
    architectures
  - Execution speed: Balances rapid build with production rigor
  - Abstraction skills: Builds reusable, extensible systems
  - Adaptability: Thrives in evolving tech stacks and problem
    spaces
  - Focus: Organizational capability building
  - Scope: Builds teams optimized for polyglot execution
  - Impact: Drives enterprise-wide engineering agility and reuse
  
