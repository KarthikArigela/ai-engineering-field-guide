description: |
  COMPANY OVERVIEW
  
  KKR is a leading global investment firm that offers
  alternative asset management as well as capital markets and
  insurance solutions. KKR aims to generate attractive
  investment returns by following a patient and disciplined
  investment approach, employing world-class people, and
  supporting growth in its portfolio companies and
  communities. KKR sponsors investment funds that invest in
  private equity, credit and real assets and has strategic
  partners that manage hedge funds. KKR’s insurance
  subsidiaries offer retirement, life and reinsurance products
  under the management of Global Atlantic Financial Group.
  References to KKR’s investments may include the activities
  of its sponsored funds and insurance subsidiaries.
  
  KKR's Gurugram office provides best-in-class business
  operations services and solutions to our internal
  stakeholders and clients, drives organization-wide process
  efficiency and transformation, and reflects KKR's global
  culture and values of teamwork and innovation. The office
  contains multifunctional business capabilities and is
  integral in furthering the growth and transformation of KKR.
  The office was established with an initial concentration of
  finance, operations, and technology personnel, followed by
  the expansion of additional functions and capabilities.
  KKR’s creation of a Gurugram office builds upon the firm's
  momentum in India and bolsters its existing presence in
  Mumbai.
  
  TEAM OVERVIEW
  
  KKR’s Technology team is responsible for building and
  supporting the firm’s technological foundation including a
  globally distributed infrastructure, information security,
  and the application and data platforms. The team drives a
  culture of technology excellence across the firm through
  efficient workflow automation, democratization of data
  through modern data and collaboration platforms, and more
  recently through research and development of Generative AI
  based tools and services. Technology is regarded as a key
  business enabler at KKR and is an important accelerator to
  drive towards global scale creation and business process
  transformation. The Technology team consists of highly
  technical and business-centric technologists with the
  ability to form strong partnerships across all of our
  businesses. A dedicated Program Management function along
  with the Product Managers drive execution discipline across
  multiple technology teams with a goal to consistently
  deliver excellence serving our business needs.
  
  POSITION SUMMARY
  
  We are looking for a Data Engineer to design, build, and
  maintain scalable data pipelines and platforms that enable
  analytics, reporting, and advanced data science use cases.
  You will work closely with data analysts, data scientists,
  and engineering teams to ensure data is reliable,
  accessible, and production-ready.  We are operating in a
  4-day in office, 1-day flexible work arrangement.
  
  ROLES & RESPONSIBILITIES
  
  - Design, develop, and maintain robust data pipelines for
    batch and real-time processing
  - Build and manage data ingestion frameworks from multiple
    structured and unstructured data sources
  - Develop and optimize ETL / ELT workflows, including building
    modular, tested, and version-controlled transformations
    using dbt
  - Ensure data quality, integrity, availability, and security
    across platforms
  - Collaborate with analytics, data science, and product teams
    to understand data requirements
  - Model data for analytics and reporting (dimensional
    modeling, star/snowflake schemas)
  - Monitor and troubleshoot data pipelines and resolve
    performance or reliability issues
  - Implement best practices for data governance, documentation,
    and lineage
  
  QUALIFICATIONS
  
  - 13+ years of experience with Bachelor’s degree in Computer
    Science, Engineering, or related field (or equivalent
    experience)
  - Strong proficiency in SQL and experience with relational and
    NoSQL databases
  - Hands-on experience with data processing frameworks (Spark,
    Flink, or similar)
  - Proficiency in Python, Java, or Scala
  - Experience building data pipelines using workflow
    orchestration tools (Airflow, Dagster, etc.)
  - Hands-on experience with dbt (data build tool) for
    developing, testing, and documenting analytics-ready data
    models
  - Solid understanding of data architecture, data modeling,
    warehousing, and lakehouse concepts
  - Familiarity with version control systems (Git) and CI/CD
    practices
  
  PREFERRED QUALIFICATIONS
  
  - Experience with cloud data platforms (AWS, Azure, or GCP)
  - Hands-on experience with data warehouses and lakehouses
    (Snowflake, BigQuery, Redshift, Databricks)
  - Knowledge of streaming platforms (Kafka, Kinesis)
  - Experience implementing dbt at scale, including macros,
    packages, exposures, and CI/CD integration for dbt
    projects
  - Exposure to data governance, security, and compliance
    standards
  - Experience working in agile development environments
  - Understanding of data observability and monitoring tools
  - Asset management domain experience
  
