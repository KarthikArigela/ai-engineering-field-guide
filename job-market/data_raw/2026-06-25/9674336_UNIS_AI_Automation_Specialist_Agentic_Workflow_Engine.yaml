description: |
  Description
  
  AI Automation Specialist
  
  Buena Park, CA
  
  Employment Type: Full-time
  
  Rate of Pay: $27-$29/hr
  
  We're looking for an AI Automation Specialist to join our
  team and help shape the future of AI-powered operations. In
  this role, you'll design, build, test, and deploy
  intelligent workflows, AI agents, and automation solutions
  that solve real business challenges across logistics,
  transportation, warehousing, customer service, and corporate
  functions.
  
  Success in this role means rapidly turning ideas into
  working solutions, leveraging the latest AI tools and
  frameworks to drive measurable business impact. This
  position is ideal for someone who lives at the intersection
  of AI, software engineering, automation, and
  experimentation, and thrives in fast-moving environments
  where innovation happens daily.
  
  Your Impact:
  
  As an AI Automation Specialist, you will:
  
  - Design, develop, and deploy AI agents, workflow automations,
    and intelligent applications that improve business
    processes and operational efficiency.
  - Build and maintain agentic workflows using modern AI coding
    tools, local models, multimodal AI systems, orchestration
    frameworks, and API integrations.
  - Partner with business stakeholders to identify automation
    opportunities, rapidly prototype solutions, and deliver
    production-ready applications that create measurable
    value.
  - Develop full-stack solutions, including frontend interfaces,
    backend services, databases, APIs, authentication,
    deployment pipelines, and technical documentation.
  - Deploy and support solutions across cloud, VPS, and local
    GPU environments while ensuring scalability, reliability,
    security, and performance.
  - Evaluate emerging AI technologies, frameworks, and tooling
    to continuously improve UNIS's automation capabilities and
    AI ecosystem
  
  What You Bring to the Table:
  
  - Bachelor's degree in Computer Science, Engineering, Data
    Science, Information Technology, or a related field, or
    equivalent hands-on experience.
  - 3+ years of experience in software engineering, AI
    automation, workflow orchestration, systems integration,
    or related technical roles.
  - Strong proficiency with Python, APIs, AI development
    frameworks, and modern automation platforms.
  - Hands-on experience with AI coding and automation tools such
    as Ollama, Claude Code, Cursor, Codex, OpenAI SDK, Vercel
    AI SDK, agent frameworks, and workflow orchestration
    platforms.
  - Experience building and deploying full-stack applications
    from concept to production, including cloud deployments,
    databases, authentication, and API integrations.
  - Comfortable operating in Linux and macOS terminal
    environments, utilizing SSH, Git, tmux, package managers,
    remote debugging tools, and headless server workflows.
  - Familiarity with local AI models, multimodal AI systems
    (VLMs), agent orchestration, MCP-style integrations, and
    autonomous workflow development.
  - Strong troubleshooting, debugging, and documentation skills
    with the ability to learn new technologies quickly and
    independently.
  - Experience with tools such as Next.js, Supabase, Docker,
    Vercel, Payload CMS, Coolify, ComfyUI, multi-agent
    systems, or local GPU deployments is a plus.
  - Ability to manage multiple projects simultaneously while
    collaborating effectively with both technical and non-
    technical stakeholders.
  
  About UNIS:
  
  UNIS accelerates logistics success through a powerful,
  technology-driven Transportation Management System designed
  to deliver exceptional control, real-time visibility, and
  scalable adaptability across complex supply chain networks.
  We are committed to elevating both our people and our
  operations, continuously pushing toward higher standards of
  performance and innovation.
  
  As our clients partner with UNIS, the relationship extends
  far beyond transactional logistics support. We serve as a
  strategic partner, unlocking a suite of value-added services
  powered by advanced analytics, intelligent automation, and
  data-driven insights. By unifying transportation, assets,
  and information through AI-enabled technology, UNIS helps
  clients optimize decision-making, enhance operational
  efficiency, and drive smarter, more resilient supply chains.
  
  Perks & Benefits:
  
  We believe in supporting our people both professionally and
  personally. Our benefits include:
  
  - Competitive health benefits
  - Paid time off in accordance with company policy and
    applicable state requirements
  - Leadership and professional development programs
  - Opportunities to build AI literacy through hands-on use of
    intelligent systems and automation that support human,
    data-driven decision-making.
  - Internal growth and career mobility opportunities
  - Free luncheons and on-site team events
  
  Use of AI & Technology:
  
  UNIS leverages AI-enabled tools and automation to enhance
  efficiency, insights, and decision support across our
  operations. These tools are designed to support human
  judgment—not replace it. All employment-related decisions,
  including hiring, performance management, and career
  development, are made by people, guided by data, experience,
  and our company values.
  
  Equal Opportunity Employer:
  
  We are proud to be an equal opportunity employer. UNIS
  promotes diversity and inclusivity in all forms, which helps
  to shape our company culture and industry leading third-
  party logistics. UNIS provides equal employment
  opportunities (EEO) to all employees and job applicants
  without regard to race, color, religion, national origin,
  sex, gender identity, sexual orientation, disability, age,
  or any other characteristic protected by applicable laws. We
  are committed to providing a diverse and inclusive workplace
  for all employees, and we proudly support the Crown Act.
  
  Please note that all applicants are subject to background
  checks prior to hire, and are required to provide proof of
  employment eligibility upon hire. The Company may
  participate in E-Verify, where applicable.
