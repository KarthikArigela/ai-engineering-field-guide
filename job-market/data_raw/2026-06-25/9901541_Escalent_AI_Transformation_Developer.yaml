description: |
  Who We Are
  
  Escalent is an award-winning data analytics and advisory
  firm that helps clients understand human and market
  behaviors to navigate disruption. As catalysts of progress
  for more than 40 years, our strategies guide the world’s
  leading brands. We accelerate growth by creating a seamless
  flow between primary, secondary, syndicated, and internal
  business data, providing consulting and advisory services
  from insights through implementation. Based on a profound
  understanding of what drives human beings and markets, we
  identify actions that build brands, enhance customer
  experiences, inspire product innovation and boost business
  productivity. We listen, learn, question, discover,
  innovate, and deliver—for each other and our clients—to make
  the world work better for people.
  
  Overview
  
  We are looking for an AI Developer to join our dynamic team
  and contribute to the design, development, and deployment of
  AI-powered applications and intelligent workflows. The ideal
  candidate will have a strong background in Python
  development, experience integrating AI and ML models or APIs
  into production systems, and the ability to build scalable,
  secure, and high-performance applications. Experience with
  data processing, cloud-native architectures, and modern AI
  development patterns will be highly valued.
  
  Responsibilities
  
  - Develop, test, and maintain AI-powered applications and
    intelligent workflows using Python in a cloud-native
    environment
  
  - Design and implement RESTful APIs, microservices, and
    backend services to integrate AI models, external tools,
    and enterprise systems
  
  - Build and optimize data pipelines for structured and
    unstructured data used in AI application workflows
  
  - Support the implementation of retrieval-based and prompt-
    driven AI experiences, including semantic search and
    contextual response generation
  
  - Optimize application and model integration performance for
    scalability, reliability, latency, and maintainability
  
  - Collaborate with cross-functional teams to define, design,
    and ship AI-enabled features and solutions
  
  - Implement best practices for security, testing, monitoring,
    and CI/CD automation across AI application development
  
  - Debug and resolve issues across application logic, model
    integrations, and system performance to ensure high
    availability and reliability
  
  - Write clean, structured, and well-documented code aligned
    with the team’s engineering standards and development best
    practices
  
  - Stay updated with emerging AI technologies, Python
    frameworks, and industry trends relevant to intelligent
    application development
  
  Required Skills
  
  - 5-8 years of Python development experience, with 2+ years of
    AI/ML development
  
  - Strong proficiency in Python and experience with frameworks
    such as Django, Flask, or FastAPI
  
  - Experience with API development, integration, and web
    services in production environments
  
  - Hands-on experience integrating AI or ML models, LLM APIs,
    or automation frameworks into applications
  
  - Strong knowledge of database systems including SQL, NoSQL,
    and data storage patterns for AI applications
  
  - Familiarity with cloud platforms such as AWS and Azure, and
    containerization technologies including Docker and
    Kubernetes
  
  - Understanding of asynchronous programming, performance
    optimization, and scalable backend architectures
  
  - Experience with unit testing, debugging, version control,
    and software engineering best practices
  
  - Familiarity with data processing, prompt-driven workflows,
    semantic search, or retrieval-based AI patterns is a
    strong plus
  
  - Ability to work effectively in a collaborative team
    environment with strong problem-solving and execution
    skills
  
  Desirable Skills
  
  - Experience working with Agile development methodologies
  
  - Familiarity with DevOps and MLOps practices, including CI/CD
    pipelines, infrastructure automation, and deployment
    workflows
  
  - Exposure to vector databases, embeddings, or orchestration
    frameworks used in modern AI applications
  
  - Strong written and verbal communication skills with the
    ability to document technical solutions clearly
