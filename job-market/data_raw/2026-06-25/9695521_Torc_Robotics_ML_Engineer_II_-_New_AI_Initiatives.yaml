title: ML Engineer, II - New AI Initiatives
company: Torc Robotics
location: USA
work_type: FULL_TIME
description: |
  About the Company
  
  At Torc, we have always believed that autonomous vehicle
  technology will transform how we travel, move freight, and
  do business.  A leader in autonomous driving since 2007,
  Torc has spent over a decade commercializing our solutions
  with experienced partners. Now a part of the Daimler family,
  we are focused solely on developing software for automated
  trucks to transform how the world moves freight. Join us and
  catapult your career with the company that helped pioneer
  autonomous technology, and the first AV software company
  with the vision to partner directly with a truck
  manufacturer.
  
  Meet the Team
  
  As a Machine Learning Engineer on the ML Ops team, you will
  translate ambiguous and complex business problems into
  machine learning workflows including exploratory data
  analysis, deep learning model development, batch inference,
  metric computation,  and embedded deployment. Our team is
  comprised of outstanding engineers with various backgrounds
  including start up tech sector, physical AI, consumer
  package goods, Fortune 500 SaaS companies.
  
  The New AI Initiatives, is a role which frequently bounces
  between topics to both pursue cutting edge technology and
  see their implementation through to production. As a New
  Initiatives engineer, you will regularly be working with
  numerous stakeholders and different teams to ensure Torc
  embraces state of the art technology.
  
  What You’ll Do
  
  - You will play a key role building the foundation of Torc's
    AI development tooling.
  - Independently develop data science models or algorithms
    using disciplined software development processes, making
    recommendations for developing new code or re-using
    existing code, enforcing version control, and maintaining
    documentation of created applications.
  - Operate with Data Ops to define and implement ingestion,
    data preparation, curation, and governance of large,
    multi-faceted data sets supporting analytics models and
    workflows.
  
  - Organize and lead projects, serving as project lead guiding
    less experienced team members in multiple facets of
    project execution.
  
  - Empower users with key insights, supporting visualization
    and data accessibility in a customer centric manner.
  - Develop guidelines and standards for analytics and machine
    learning models, their deployment, and associated
    processes.
  - Communicate and collaborate within the team and participate
    with the team’s interfaces to the rest of the
    organization.
  
  What You’ll Need to Succeed
  
  - Bachelor’s Degree in Computer Science, Robotics, Electrical
    Engineering or related technical field plus demonstrates
    competences and technical proficiencies typically acquired
    through 4+ years of experience or;
  - Master’s Degree in Computer Science, Robotics, Electrical
    Engineering or related technical field plus demonstrates
    competences and technical proficiencies typically acquired
    through 2+ years of experience.
  - Adventurous spirit where you can work on topics at the
    frontier and drive exploration.
  - Rigorous disposition: you will have to pass judgement on
    what is and what is not practical for Torc to implement at
    scale.
  - You will need to communicate your outcomes and progress to
    other teams so they can take your findings and reliably
    implement them.
  - You will need resilience, you must be comfortable with
    working on a project for a month that may not reach
    production.
  
  Perks of Being a Full-time Torc’r  Torc cares about our team
  members and we strive to provide benefits and resources to
  support their health, work/life balance, and future. Our
  culture is collaborative, energetic, and team focused. Torc
  offers:
  
  - A competitive compensation package that includes a bonus
    component and stock options
  
  - 100% paid medical, dental, and vision premiums for full-time
    employees
  
  - 401K plan with a 6% employer match
  
  - Flexibility in schedule and generous paid vacation
    (available immediately after start date)
  
  - AD+D and Life Insurance
  
  At Torc, we’re committed to building a diverse and inclusive
  workplace. We celebrate the uniqueness of our Torc’rs and do
  not discriminate based on race, religion, color, national
  origin, gender (including pregnancy, childbirth, or related
  medical conditions), sexual orientation, gender identity,
  gender expression, age, veteran status, or disabilities.
  Even if you don’t meet 100% of the qualifications listed for
  this opportunity, we encourage you to apply.
  
  Our compensation reflects the cost of labor across several
  geographic markets. Pay is based on a number of factors and
  may vary depending on job-related knowledge, skills, and
  experience. Torc's total compensation package will also
  include our corporate bonus and stock option plan. Dependent
  on the position offered, sign-on payments, relocation, and
  other forms of compensation may be provided as part of a
  total compensation package, in addition to a full range of
  medical, financial, and/or other benefits.
  
