description: |
  About us
  
  ClearBank was built on the belief that banking
  infrastructure would no longer slow down progress. Instead,
  it’s the catalyst that unlocks the potential to innovate.
  That’s why our clients — financial institutions from
  fintechs and crypto platforms, to banks and credit unions —
  use our API to power their banking infrastructure.
  
  But we wouldn’t be ClearBank without our people. They’re
  what powers our innovative technology and the reason we love
  what we do every day. We’re a group of spirited people who
  are never afraid to challenge the norm – becoming stronger,
  more energised, and that much better when we’re together.
  It’s our belief in fairness, autonomy and choice that means
  our people are empowered with the tools to learn, grow, and
  contribute to ours and our clients’ success. Interested in
  joining us? Read on or visit our website for more
  information.
  
  About you
  
  You’ll be joining the Developer Experience team as an AI
  Enablement Engineer (Level 4). Reporting to the Engineering
  Manager, you’ll be part of a fast-growing business that is
  challenging the market and doing things differently.
  
  You are a senior engineer motivated by improving how
  software is built at scale, not just writing code yourself.
  You are deeply curious about AI, pragmatic about its
  application, and focused on driving measurable outcomes
  rather than novelty.
  
  You enjoy partnering closely with engineers and leaders,
  understanding delivery workflows end to end, and shaping how
  teams adopt new tools and techniques safely and effectively.
  You are comfortable operating in a regulated environment and
  balancing enablement with appropriate governance.
  
  You are at your best when acting as a multiplier — setting
  direction, coaching others, influencing practices across
  teams, and remaining hands-on when needed to remove blockers
  or prove out new approaches.
  
  You will be
  
  · Lead the effective and responsible use of AI across
  ClearBank’s software engineering teams.
  
  · Act as a subject-matter expert on AI-assisted software
  engineering practices, tooling, and adoption patterns.
  
  · Shape how teams embed AI into the SDLC in ways that
  improve productivity, quality, and developer experience.
  
  · Drive alignment with stakeholders so AI adoption delivers
  measurable outcomes rather than anecdotal gains.
  
  · Champion pragmatic governance that enables progress while
  meeting regulatory and risk expectations.
  
  · Influence engineering practices across teams and help
  build a coherent AI enablement approach across the bank.
  
  What you will be doing
  
  · Master and evaluate AI tooling used in software
  engineering, including copilots, agentic tools, and
  workflow-integrated capabilities.
  
  · Collaborate directly with engineering teams to improve how
  AI is used in coding, testing, review, debugging, and
  documentation.
  
  · Introduce new AI tools, techniques, or approaches into the
  engineering community and support adoption at scale.
  
  · Define and measure success using indicators such as DORA
  and flow metrics, adoption and engagement signals, and code
  quality or operational outcomes.
  
  · Partner closely with Security, Model Risk, and other
  stakeholders to keep controls proportionate and non-
  blocking.
  
  · Occasionally build or extend missing capabilities,
  including AI-driven services, agents, or platform
  enhancements that integrate into the SDLC.
  
  · Build relationships with other teams across the bank using
  AI to share approaches, avoid duplication, and support
  coherent investment decisions.
  
  · Coach and guide engineers on effective patterns, helping
  raise capability across the engineering organisation.
  
  What we are looking for
  
  · Strong background in software engineering, platform
  engineering, DevEx, or DevOps.
  
  · Hands-on experience using AI-assisted development tools in
  real engineering environments.
  
  · Experience influencing practices and improving outcomes
  across multiple delivery teams.
  
  · Ability to evaluate tools and approaches based on evidence
  and business impact, not hype.
  
  · Strong communication skills, able to explain complex
  concepts clearly and credibly to a wide engineering
  audience.
  
  · Outcome-driven and evidence-based in decision making.
  
  · Pragmatic and risk-aware, especially within regulated
  environments.
  
  · Comfortable operating across ambiguity, rapid change, and
  emerging technology.
  
  · Collaborative, empathetic, and focused on enabling others
  to succeed.
  
  · Experience integrating AI into CI/CD pipelines, internal
  developer platforms, or SDLC tooling.
  
  · Familiarity with engineering productivity and quality
  metrics.
  
  · Experience working with governance, security, or risk
  stakeholders.
  
  · Exposure to agentic systems or AI-driven automation within
  engineering workflows.
  
  About what we offer
  
  · At ClearBank we have a flexible working philosophy,
  empowering our employees to manage their time in a way which
  allows them to meet both work and personal commitments, in
  partnership with their line manager
  
  · Spacious and well-equipped new offices in London
  
  · 27 days annual leave per year, plus flexible bank holidays
  
  · Option to work abroad for up to 30 days in a 12-month
  rolling period
  
  · Regular company-wide socials
  
  · Take a couple of days per year to volunteer with your
  chosen charity to do something bigger than ClearBank
  
  · Private healthcare and discounted dental cover, with
  employee healthy living perks and discounts
  
  · Enhanced family-friendly leave
  
  · Plus, you’ll have the opportunity to join an innovative
  team that’s building a bank fit for the future!
  
  A little bit more about us!
  
  ClearBank is Where You Can belong:
  
  At ClearBank we think about Diversity, Equity and Inclusion
  (DE&I) a lot. Not because we think we should. But because we
  know we should – how else can we build a happy workforce and
  be successful as a business. We’re committed to making sure
  our teams reflect society. And we put energy and effort into
  making this a place where everyone feels at home, where
  they’re given the trust and encouragement to do their very
  best work. Here are some of the things we’re most proud of:
  
  - 42% of our senior management roles are held by women
  - Our enhanced family leave policies
  - Launching our partnership with Code First Girls
  - Increasing awareness of neurodiversity in the workplace
    through our partnership with the Inclusive Group
  
  Our hiring process and what you can expect:
  
  Application: a member of our talent acquisition team will
  review your application against the key requirements for the
  role and let you know within two weeks whether you’re moving
  forward to the next stage;
  
  Screening: You’ll spend 30-45 minutes speaking to one of our
  recruiters learning more about the role and ClearBank, and
  we’ll get it know more about you, your experience and how
  your skills align with the role (this will be via phone or
  Teams video call). You can expect to hear back from us
  within seven days following this meeting (if things are
  taking longer than expected, we’ll let you know that too);
  
  First Interview: You’ll spend one hour with a member of our
  hiring team focusing on your skills, competencies and your
  ways of working at the same time we’ll give you time to ask
  more questions about the role, the team and learn more about
  the ClearBank culture. This will be via Teams.
  
  Second Interview: This will be a competency-based interview
  with one or more members of our team.
  
  Final Stage: You will have a final meeting with the Head of
  Department. This will be around 45-60 minutes.
  
  Offer: Congratulations! Get ready to transform banking
  forever!
  
  
  
  Our commitment to you as a candidate:
  
  We will always try our best to get back to you within seven
  days of your interview whether you’ve been successful or not
  and provide you with feedback. Sometimes things take a
  little longer, so we may not have a decision to share but we
  will get it touch to let you know we need a little more
  time.
  
  We’re unable to provide specific individual feedback at the
  application or screening stage but know that your
  application was reviewed and considered carefully.
  
  We wish you the best of luck with your application and maybe
  we’ll be celebrating your new role at ClearBank soon!
  
  Equal Opportunities
  
  ClearBank is committed to ensuring equal opportunities
  throughout every stage of the recruitment process. ClearBank
  recognises that diversity is vital to the long-term success
  of the business in the communities and markets in which it
  operates. ClearBank is also a firm believer that an
  inclusive culture fosters greater employee engagement and
  collaboration.
  
  ClearBank strives for diversity and inclusion of all forms,
  including (but not limited to): gender, age, educational and
  professional background, disability, gender reassignment,
  marital or civil partner status, pregnancy or maternity,
  race, colour, nationality, ethnic or national origin,
  religion or belief and sexual orientation.
  
  As part of the Company’s commitment to equal employment
  opportunity, we provide reasonable adjustments, to
  candidates during the recruitment process, including to
  individuals with disabilities. We want to create a safe
  space that welcomes everyone so please let us know how we
  can accommodate you. In case you have any accessibility
  requirements you can share that with our Talent Acquisition
  team prior to your interview stage, if applicable.
  
  The legal bit
  
  By submitting your CV to ClearBank Limited you are providing
  your consent for us to use the information you provide for
  recruitment purposes. For more information on how we manage
  your data go and check out our Candidate Privacy Notice on
  the ClearBank website to see how we process, manage and look
  after your data. You are also allowing us to communicate
  with you by email and telephone for recruitment purposes.
