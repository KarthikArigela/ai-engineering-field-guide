job_id: 9609308
title: "Staff Software Engineer, Marketplaces & Intelligence Data and AI"
company: Airbnb
location: USA
work_type: FULL_TIME
description: |
  Airbnb was born in 2007 when two hosts welcomed three guests
  to their San Francisco home, and has since grown to over 5
  million hosts who have welcomed over 2 billion guest
  arrivals in almost every country across the globe. Every
  day, hosts offer unique stays and experiences that make it
  possible for guests to connect with communities in a more
  authentic way.
  
  The Community You Will Join: We are currently hiring for
  multiple teams:
  
  Airbnb is powered by our Host and Guest communities. Our
  teams work on everything from driving improvements for the
  end-to-end Host and Guest experience to launching new
  product verticals from the ground up. Our job is to build
  world-class, comprehensive platforms and features to create
  high-quality experiences for our outstanding community of
  Hosts and Guests.
  
  Listings and Host Tools Data and AI (LHT-DnA) team is one of
  the 4 teams of the Marketplace-DnA org: The LHT-DnA team
  supports host personalization products and provides data
  driven solutions to achieve superior host experience on
  Airbnb. These products include but are not limited to
  managing your space (MYS), host quality standards etc. We
  own data pipelines and ML models and will build services for
  serving that are used in the above areas. Supply &
  Competitive Intelligence sits at the intersection of Data/AI
  and Airbnb’s competitive strategy. As part of this team, you
  will build systems that give Airbnb a real-time,
  comprehensive view of the global travel market — how
  competitors price, list, and supply their inventory across
  every market we operate in. Your work will feed ML models
  and data products that directly inform pricing strategy,
  supply growth, and product decisions for hundreds of
  millions of guests and hosts around the world.
  
  The Difference You Will Make:
  
  Marketplaces Data and AI team work on components related to
  users, listings and marketplace which are foundational to
  Airbnb, and the quality of their data is critical to the
  success of our products and business. To strengthen our data
  foundation and unlock greater value from our data and
  machine learning models.
  
  We are looking for a data-focused Staff Backend Engineer to
  help us craft the next generation of tools for Airbnb hosts.
  As a Staff Engineer, you will help drive the technology and
  implementation strategy to directly help hosts run their
  business day-to-day, proactively engaging with a wide range
  of teams and cross-functional partners to achieve your
  goals.
  
  A typical day:
  
  - Work with product and ML engineers to explore problem spaces
    and devise solutions to customer problems
  - Prototype new ideas and influence the product strategy
  - Proactively collaborate with other engineering teams to
    develop an iterative plan to improve our APIs and
    architecture
  - Collaborate with other product engineers and partners to
    develop backend to support data and AI solutions
  - Create technical and execution strategies for new projects
    and drive hand-ons implementation of those solutions
  - Identify areas for improvement and champion the adoption of
    best practices in product development, engineering
    architecture, and testing
  - Perform technical design reviews and code reviews
  - Mentor and grow more junior engineers.
  
  Your expertise
  
  - 10+ years industry experience
  - You have experience leading teams, setting technical
    direction, building & launching high-impact user-facing
    products
  - You have experience influencing partners such as designers
    and product managers as well as other engineering teams
  - You are excited to ideate, prototype new ideas, and
    influence product direction
  - You have excellent communication skills and the ability to
    work well within a team and across engineering teams
  - You have demonstrated an ability to mentor and grow more
    junior engineers, set and drive best practices
  
  Your Location:
  
  This position is US - Remote Eligible. The role may include
  occasional work at an Airbnb office or attendance at
  offsites, as agreed to with your manager. While the position
  is Remote Eligible, you must live in a state where Airbnb,
  Inc. has a registered entity. Click here for the up-to-date
  list of excluded states. This list is continuously evolving,
  so please check back with us if the state you live in is on
  the exclusion list . If your position is employed by another
  Airbnb entity, your recruiter will inform you what states
  you are eligible to work from.
  
  Our Commitment To Inclusion & Belonging:
  
  Airbnb is committed to working with the broadest talent pool
  possible. We believe diverse ideas foster innovation and
  engagement, and allow us to attract creatively-led people,
  and to develop the best products, services and solutions.
  All qualified individuals are encouraged to apply.
  
  We strive to also provide a disability inclusive application
  and interview process. If you are a candidate with a
  disability and require reasonable accommodation in order to
  submit an application, please contact us at:
  reasonableaccommodations@airbnb.com. Please include your
  full name, the role you’re applying for and the
  accommodation necessary to assist you with the recruiting
  process.
  
  We ask that you only reach out to us if you are a candidate
  whose disability prevents you from being able to complete
  our online application.
  
  How We'll Take Care of You:
  
  Our job titles may span more than one career level. The
  actual base pay is dependent upon many factors, such as:
  training, transferable skills, work experience, business
  needs and market demands. The base pay range is subject to
  change and may be modified in the future. This role may also
  be eligible for bonus, equity, benefits, and Employee Travel
  Credits.
  
  Pay Range
  
  $204,000—$255,000 USD
