title: AI Solution Engineer – Technical Business Development
company: Jeen.ai
location: London, GBR
work_type: FULL_TIME
company_size: 110 Employees
description: |
  Description
  
  Jeen.AI empowers enterprises with generative AI through
  advanced AI agents, automations, voice analytics, and
  knowledge-based insights across any cloud or on-premise
  environment. Trusted by industry leaders shaping tomorrow's
  technological landscape.
  
  Why Join us?
  
  Join as one of the first UK hires for an AI company
  expanding into Europe.
  
  Shape operations, culture, and technical strategy from day
  one while building C-suite relationships and driving
  strategic AI transformation.
  
  Responsibilities
  
  - Engage directly with C-suite stakeholders (CTO, CIO, CDO,
    Chief AI Officer) to shape AI strategy and influence
    investment decisions
  - Lead technical sales journey — from discovery and
    architecture design to POCs, proposals, negotiation, and
    deal close
  - Drive executive workshops aligning Jeen AI's capabilities to
    customers' business goals and transformation priorities
  - Design scalable, secure AI architectures for enterprise
    environments, including multi-cloud and hybrid landscapes
  - Build prototypes and POCs to validate and accelerate
    customer decision-making
  - Present platform demos and solutions to audiences ranging
    from data scientists to executive boards
  - Influence commercial strategy by contributing to pricing,
    solution scoping, and value-based proposals
  - Represent Jeen AI at industry events and C-level
    roundtables, contributing to thought leadership in the
    European AI ecosystem
  - Ensure seamless transition from pre-sales to delivery with
    technical integrity and customer satisfaction
  
  Requirements
  
  - 5+ years in technical pre-sales, solution engineering, or AI
    solution architecture within enterprise software or data
    platforms
  - Demonstrated success building C-suite relationships and
    influencing senior decision-makers during complex sales
    cycles
  - Experience across European markets (UK + 1–2 other regions),
    with understanding of local ecosystems and data
    regulations
  - Deep domain expertise in Financial Services, Healthcare, or
    Pharma
  - Strong hands-on experience with AI/ML platforms, data
    pipelines, APIs, cloud infrastructure (AWS, Azure, GCP,
    OpenAI), and MLOps
  - Proven ability to translate technical solutions into
    strategic business value and ROI for executive audiences
  - Exceptional communication and presentation skills for
    workshops, strategy sessions, and board-level demos
  - Entrepreneurial mindset — self-starter, thrives in ambiguity
    and high-growth environments
  - Willingness to travel frequently across Europe (20–40%)
  
  Preferred Qualifications
  
  - AI/ML certifications, publications, conference speaking, or
    OSS contributions
