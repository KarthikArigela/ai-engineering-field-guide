description: |
  In 10 years, we envision a world where every conversation
  between a business and an individual begins with hirepluto.
  We’re on a mission to build the most versatile, flexible,
  and secure voice AI on the planet—empowering businesses to
  forge deeper, more meaningful connections at scale. Our
  journey starts in recruitment with our flagship product: a
  cutting-edge, end-to-end digital interviewer designed for
  enterprise. Join us as we revolutionize the way businesses
  and people connect.
  
  We're a rapidly growing early stage startup backed by great
  investors, and are looking for exceptional founding
  engineers to join us to keep up with customer demand. As one
  of our first engineers, you'll build products from the
  ground up and grow with an ambitious team.
  
  What You'll Do
  
  - Take full ownership of building great conversational AI
    experiences to produce reliable customer outcomes.
  - You will build the platform from the ground up:
    architecting, building, and deploying our product to
    customers.
  - Work directly under our CTO to design and implement
    infrastructure and technology solutions that drive the
    company’s overall success and scalability
  
  What You Need
  
  - Winning Mindset and Attitude: A winning mindset with a
    relentless drive to succeed. Startups are hard, and thus
    willingness to go the extra mile is essential.
  - Proven Track Record: Demonstrated success in shipping high-
    quality products and features at scale. Architect and
    develop front-end and back-end systems:
  - Obsession for Growth: Desire to work in a fast-paced
    environment, continuously learn, and master your craft.
    You believe you are in the top 0.1% of engineers or can be
    in the top 0.1% if given the opportunity.
  - Bonus Points: Previous founder experience.
  
  The stack:
  
  - Frontend: React with NextJS, TailwindCSS
  - Backend: FastAPI Python
  
  Why Join Us
  
  - Extremely generous equity in the company (1%-2.5%, this is
    2x-3x market rate)
  - Ambition: you will work with smart, hard-working and
    ambitious team members building a $1t+ company.
  - Impact on customers: As one of our first engineers, you'll
    shape the product to impact small business customers'
    bottom line.
  - Grow and Learn: You thrive in an intense environment and
    love challenging work.
  - Well-funded by great investors
  
  You Might Not Be the Best Fit If...
  
  - You are seeking a typical 9-5 job: If you prefer a
    predictable role without significant responsibility, this
    may not be the right fit.
  - You don’t love change: AI and tech are evolving at an
    incredible pace, which means we need to keep up to
    leverage new capabilities and make our customers
    successful.
  
  Please feel free to reach out at founders@hirepluto.com.
  
