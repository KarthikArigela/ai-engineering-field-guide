description: |
  Requisition Number: 2356654 Optum is a global organization
  that delivers care, aided by technology to help millions of
  people live healthier lives. The work you do with our team
  will directly improve health outcomes by connecting people
  with the care, pharmacy benefits, data and resources they
  need to feel their best. Here, you will find a culture
  guided by inclusion, talented peers, comprehensive benefits
  and career development opportunities. Come make an impact on
  the communities we serve as you help us advance health
  optimization on a global scale. Join us to start Caring.
  Connecting. Growing together. Primary Responsibilities:
  
  - Contribute to the development of AI-enabled applications
    using modern tools and frameworks
  - Work with senior engineers to build, integrate, and deploy
    AI/ML models into production systems
  - Develop scalable backend services using Python or Java
    frameworks (e.g., FastAPI, Spring) with a focus on
    performance and clean design
  - Build intuitive and responsive user interfaces using
    React.js with a user-first approach
  - Participate in building cloud-native applications on
    platforms such as GCP
  - Collaborate with cross-functional teams to understand
    business problems and translate them into technical
    solutions
  - Engage in code reviews, design discussions, and Agile
    development practices
  - Write clean, testable code and contribute to unit testing
    and automation efforts
  - Monitor application performance and help troubleshoot issues
    in development and production environments
  - Continuously learn and apply core concepts in AI/ML and
    software engineering
  - Take ownership of assigned tasks and contribute proactively
    to team goals
  - Follow engineering best practices, company policies, and
    actively participate in learning and development
    initiatives
  - Comply with the terms and conditions of the employment
    contract, company policies and procedures, and any and all
    directives (such as, but not limited to, transfer and/or
    re-assignment to different work locations, change in teams
    and/or work shifts, policies in regard to flexibility of
    work benefits and/or work environment, alternative work
    arrangements, and other decisions that may arise due to
    the changing business environment). The Company may adopt,
    vary or rescind these policies and directives in its
    absolute discretion and without any limitation (implied or
    otherwise) on its ability to do so
  
  Required Qualifications:
  
  - B.E./B Tech/MCA/M Tech / Bachelor's degree Computer Science,
    Computer Engineering, or other related discipline (16+
    years of education, correspondence courses are not
    relevant) from NIT or IIT
  - Graduating in 2026 from premier institutes like NIT or IIT
  - Basic understanding of AI/ML concepts and interest in
    learning more (e.g., NLP, computer vision, LLMs).
  - Experience/Familiarity with backend development using Python
    or Java
  - Experience/Familiarity to front-end development using
    React.js or similar frameworks
  - Experience/Familiarity with relational databases (e.g., SQL
    Server, Oracle) or NoSQL systems
  - Experience/Familiarity with coding assistant tools (e.g.,
    GitHub Copilot) and a solid willingness to adopt them in
    daily development work
  - Familiarity with cloud platforms and basic cloud-native
    development practices
  - Understanding of RESTful APIs and basic integration patterns
  - Ability to work in Agile teams and contribute to sprint
    deliverables
  - Solid problem-solving skills and willingness to learn from
    senior team members.
  - Proven good communication and collaboration skills
  
  At UnitedHealth Group, our mission is to help people live
  healthier lives and make the health system work better for
  everyone. We believe everyone - of every race, gender,
  sexuality, age, location and income - deserves the
  opportunity to live their healthiest life. Today, however,
  there are still far too many barriers to good health which
  are disproportionately experienced by people of color,
  historically marginalized groups and those with lower
  incomes. We are committed to mitigating our impact on the
  environment and enabling and delivering equitable care that
  addresses health disparities and improves health outcomes -
  an enterprise priority reflected in our mission.
