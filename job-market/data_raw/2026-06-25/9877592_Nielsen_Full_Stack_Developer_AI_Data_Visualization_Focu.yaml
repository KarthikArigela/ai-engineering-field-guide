description: |
  Company Description
  
  At Nielsen, we are passionate about our work to power a
  better media future for all people by providing powerful
  insights that drive client decisions and deliver
  extraordinary results. Our talented, global workforce is
  dedicated to capturing audience engagement with content -
  wherever and whenever it’s consumed. Together, we are
  proudly rooted in our deep legacy as we stand at the
  forefront of the media revolution. When you join Nielsen,
  you will join a dynamic team committed to excellence,
  perseverance, and the ambition to make an impact together.
  We champion you, because when you succeed, we do too. We
  enable your best to power our future
  
  Job Description
  
  End-to-End Development: Design, develop, and maintain
  scalable full-stack applications using Python
  (Django/Flask/FastAPI) and modern front-end frameworks
  (e.g., React, Vue, or Angular).
  
  System Architecture: Build and optimize RESTful APIs and
  microservices to connect data layers with user-facing
  applications.
  
  Data Integration: Develop and manage workflows/pipelines to
  extract data from cloud tables (SQL, Spark) and integrate
  them into application features.
  
  AI Implementation: Leverage AI techniques and advanced
  prompting to build "intelligent" features, such as automated
  summaries, predictive text, or smart search within
  applications.
  
  Data Visualization: Integrate Tableau dashboards or custom
  JavaScript libraries (D3.js, Chart.js) into applications to
  provide interactive, "always-on" insights.
  
  Database Management: Design and maintain efficient database
  schemas and handle ETL processes necessary for application
  performance.
  
  Innovation: Stay abreast of emerging full-stack,
  visualization, and AI tools, continuously optimizing the
  software development life cycle (SDLC).
  
  Collaboration: Support ad-hoc requests and translate
  technical architecture into layman’s terms for business
  stakeholders.
  
  Qualifications
  
  - Education: Bachelor degree in Computer Science, Software
    Engineering, Mathematics, or a related technical field.
  - Experience: 2+ years of experience in Full Stack
    development, with strong expertise in Python, SQL, and
    JavaScript
  - Back-end Expertise: Proficiency in Node.js or Python-based
    frameworks, and experience with PySpark for large-scale
    data processing.
  - Front-end Expertise: Strong command of HTML5, CSS3, and
    modern JavaScript frameworks for building responsive user
    interfaces.
  - AI Mastery: Deep understanding of AI prompting techniques
    and experience integrating LLMs or machine learning models
    into production software.
  - Cloud & Data: Hands-on experience with AWS or GCP and a
    solid understanding of data warehousing and ETL concepts.
  - Visualization: Extensive knowledge of Tableau and the
    ability to embed complex visualizations into custom web
    environments.
  - Soft Skills: Excellent communication skills, strategic
    thinking, and the ability to work independently or
    collaboratively to solve complex product problems.
  
  We Offer
  
  ·A challenging work environment with opportunities for
  continuous growth in AI and Software Engineering.
  
  · The chance to build the tools that power the world's
  leading media measurement company.
  
  Additional Information
  
  Please be aware that job-seekers may be at risk of targeting
  by scammers seeking personal data or money. Nielsen
  recruiters will only contact you through official job
  boards, LinkedIn, or email with a nielsen.com domain. Be
  cautious of any outreach claiming to be from Nielsen via
  other messaging platforms or personal email addresses.
  Always verify that email communications come from an
  @nielsen.com address. If you're unsure about the
  authenticity of a job offer or communication, please contact
  Nielsen directly through our official website or verified
  social media channels.
