description: |
  About Insify
  
  Behind every insurance policy is a mountain of manual work.
  
  Underwriters reviewing applications by hand. Operations
  teams running sanctions checks one by one. Claims handlers
  triaging cases through spreadsheets and email threads.
  Customer support routing queries through a maze of rules
  that a model could learn in an afternoon. The insurance
  industry has spent decades building processes that are held
  together by human effort — and almost all of it is
  automatable.
  
  We're automating it.
  
  Insify is a high-growth scale-up backed by €43M in total
  funding from world-class investors like Accel, Munich Re
  Ventures, and Formula 1 champion Nico Rosberg. In five
  years, we’ve expanded from the Netherlands into France and
  Germany, and we're just getting started. Our mission: become
  the European leader in AI-powered SME insurance.
  
  We aren't just building a company; we're leading a
  revolution. Our culture is intense, high-stakes, and
  mission-driven. We hire smart, ambitious "owners" who
  possess a relentless drive to win. This is an environment
  for those who thrive on challenges, value intellectual
  honesty, and share our mindset of becoming a global category
  leader.
  
  Our founding team consists of seasoned entrepreneurs who
  have previously built iconic businesses like HelloFresh,
  Bloomon, and SumUp. We combine that deep fintech and
  e-commerce expertise with cutting-edge AI to stay ahead of
  the curve.
  
  About the role
  
  What you will be doing
  
  - Extend and improve SmartGuide, Insify's live AI-powered
    funnel assistant, already deployed across NL and FR.
    Expand coverage to new products and countries, improve
    accuracy, and move conversion metrics– this is AI at the
    heart of our revenue engine, and you’ll own a meaningful
    piece of it.
  - Design and ship agentic workflows that automate high-volume,
    rule-heavy insurance tasks: underwriting pre-screening,
    sanctions checks, document verification, claims triage,
    and customer support routing via Zendesk and WhatsApp.
  - Build the LLM orchestration layer and evaluation
    infrastructure needed to deploy AI features reliably in a
    regulated industry: prompt management, output validation,
    compliance guardrails, and monitoring for hallucinations
    and regressions.
  - Partner with Insurance, Operations, and Claims to identify
    automation opportunities and turn manual workflows into
    observable, auditable AI systems. Be the engineer who can
    distinguish a good use case for AI from a bad one.
  - Own AI reliability in production. When SmartGuide gives a
    wrong answer or an automated workflow fails, you'll be the
    one who diagnoses and fixes it.
  - Contribute to Insify's AI platform: shared tooling, model
    integrations (Claude, OpenAI), retrieval systems, and the
    infrastructure that makes AI features fast to build and
    safe to ship.
  - Set the standard for responsible AI engineering at Insify:
    factual grounding, auditability, regulatory compliance,
    and clear fallbacks for model uncertainty.
  
  This role is a strong fit if you:
  
  - 3+ years of professional software engineering experience,
    ideally with TypeScript and AWS (Lambda, DynamoDB, event-
    driven architectures).
  - Hands-on experience building and shipping LLM-powered
    features or agentic systems in production. You have a feel
    for where AI works reliably and where it doesn't.
  - Strong software engineering fundamentals. You are primarily
    a software engineer who uses AI effectively, not an AI
    researcher who also codes.
  - Understanding of retrieval-augmented generation (RAG),
    prompt engineering, and the evaluation practices needed to
    keep AI features honest and accurate.
  - Comfort with regulated domains. Insurance means your AI
    features have to be accurate, explainable, and compliant,
    not just impressive in a demo.
  - Comfort operating in ambiguous, cross-functional
    environments. You can walk into a team meeting, identify
    the automation opportunity, and have a working prototype
    before the week ends.
  - Ownership instinct. You ship, measure, and improve. You
    don't hand things off to a separate ML team and move on.
  - Clear communicator. You can work with non-technical
    stakeholders to find real real automation opportunities
    and say no to bad ones that aren’t ready for AI yet.
  
  Nice to have
  
  - Experience with insurance, fintech, or other regulated
    industries where AI output quality and explainability
    matter.
  - Familiarity with AI agent frameworks and orchestration
    (LangChain, LangGraph, Claude tool use, or similar).
  - Experience building evaluation pipelines, golden-set
    testing, or regression suites for LLM outputs.
  - Background building customer-facing AI features (chatbots,
    recommendation systems, document understanding).
  - Experience with Zendesk automation, customer support
    tooling, or workflow automation platforms (n8n, Zapier)
  
