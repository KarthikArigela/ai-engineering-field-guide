description: |
  **This is a remote position open to candidates in Europe and
  Turkey. For those based in the Czech Republic, a hybrid work
  model is available.
  
  ABOUT US
  
  We are a leading product development partner specializing in
  custom web and mobile application development. With Silicon
  Valley founders and top-tier European tech talent, we
  operate from Prague and have successfully delivered over 65
  software products for early-stage startups, scaleups, and
  global enterprises.
  
  - Founded in 2016
  - Headquartered in Prague
  - Built and launched 65+ products
  - 90+ team members
  - Driving product innovation for leading US companies
  
  At OAK’S LAB, we take an AI-first approach, utilizing AI on
  almost every project. From streamlining design and testing
  workflows to enhancing developer productivity, our teams
  leverage tools such as Figma MCP Server, Playwright MCP
  Server, and Cursor, and we’re actively experimenting with
  remote AI agents to push the boundaries of what’s possible
  in product development.
  
  OUR PROJECTS
  
  Here are a few from our portfolio:
  
  - Nasdaq Private Market (Series C, Finance)-
    nasdaqprivatemarket.com
  - Blackpoint Cyber (Series B, Cybersecurity) -
    blackpointcyber.com
  - OpenLoop (Series A, Healthcare) - openloophealth.com
  
  THE ROLE
  
  Our product development team is seeking a Senior Full-Stack
  Engineer who brings creative thinking, problem-solving, and
  proactive technical expertise to build outstanding web and
  mobile applications for our clients. You’ll be working on
  cutting-edge projects, solving challenges that were
  previously unsolvable without the use of AI
  
  We are specifically looking for engineers who have hands-on
  experience building AI-driven solutions and integrating AI
  models into production applications. This includes practical
  experience working with LLM APIs, AI-powered workflows,
  retrieval systems, or other AI integrations that deliver
  meaningful value to end users.
  
  In this role, you will work within a dedicated product team
  consisting of the Tech Lead for the specific product, a
  Product Manager, a Designer, and a skilled team of engineers
  to drive the product’s success. From engaging in technical
  discussions to engineering complex features, your
  involvement spans the entire product development lifecycle.
  
  RESPONSIBILITIES
  
  - Design scalable, modular, and maintainable architectures for
    AI-powered applications
  - Collaborate with product teams to understand feature
    requirements and translate them into technical solutions
    leveraging AI models
  - Integrate APIs (e.g., LLM APIs (e.g. OpenAI), Hugging Face
    API) into applications for tasks such as NLP and image
    recognition
  - Implement prompt engineering, embeddings, and other
    techniques to customize model outputs without building
    models from scratch
  - Implement vector databases in Postgres for RAG
  - Use tools like Hugging Face’s Transformers to further
    customize pre-trained models to suit specific project
    requirements
  - Optimize server-side logic to ensure efficient querying and
    integration with AI tools
  - Work with unstructured data (text, images, etc.) and convert
    it into model-ready formats
  - Validate the output quality from AI models to ensure it
    aligns with business needs and provides value to end-users
  
  SKILLS & REQUIREMENTS
  
  - 6+ years in engineering
  - 3+ years of experience in building web solutions using
    Node.js and React
  - Experienced with Javascript/Typescript
  - Hands-on experience building AI-driven solutions and
    integrating AI models or AI-powered services into
    production applications
  - Focus on code quality
  - Desire to learn new technologies
  - Strong analytical and problem-solving skills
  - Proactiveness and the capability to make a difference
  - Driven, hard work ethic, showing commitment
  - Ability to work effectively in a team environment, following
    Agile methodologies
  - Proficiency in English
  
  TECH STACK
  
  - TypeScript
  - Node.js
  - React + Next.js
  - React Native
  - GraphQL, tRPC
  - Google Cloud Platform
  - HuggingFace API, LLM APIs (eg OpenAI API), Langchain
  - Postgres/Vector Databases for RAG
  
  Important Notice: OAK'S LAB communication, including
  interview requests and job offers, are only sent from an
  "@oakslab.com" or "@oaks-lab.com" email addresses (e.g.,
  john@oakslab.com or john@oaks-lab.com). Any message from a
  different email domain is not associated with OAK'S LAB. We
  will never ask for payment information or banking details
  via email, phone, or any other communication channel during
  the interview process. If you receive messages using our
  name, domain, or brand assets in an attempt to impersonate
  us or act on our behalf, do not engage. Instead, report it
  to Econsumer.gov at Government Shutdown Notice / Aviso de
  cierre del gobierno (if you are in the EU), Federal Trade
  Commission (FTC) at Government Shutdown Notice / Aviso de
  cierre del gobierno , or the Securities and Exchange
  Commission (SEC) in case of investment fraud at SEC.gov |
  Report Suspected Securities Fraud or Wrongdoing (if you are
  in the US).
