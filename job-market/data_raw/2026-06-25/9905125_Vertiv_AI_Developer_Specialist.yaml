description: |
  Role - AI Developer
  
  
  
  About Vertiv
  
  
  
  At Vertiv, we design, build, and service products and
  solutions that keep critical applications running 24/7. From
  pioneering precision cooling for mainframes to delivering
  integrated power, thermal, and infrastructure management
  solutions for today’s digital ecosystem, Vertiv continues to
  enable the world’s most vital technologies.
  
  
  
  Vertiv operates globally with a comprehensive portfolio
  spanning power, thermal, IT infrastructure, software, and
  services—supported by nearly 250 service centers worldwide.
  As demand for digital services and computing capacity
  accelerates, Vertiv is at the forefront of innovation,
  helping customers deploy scalable, resilient, and efficient
  solutions faster and more cost‑effectively.
  
  
  
  Role Overview
  
  
  
  Vertiv is undergoing a significant digital transformation,
  and Artificial Intelligence plays a central role in
  reshaping how we engage customers, optimize marketing
  performance, and support data‑driven decision‑making.
  
  
  
  We are seeking an AI Developer to join the Global Customer
  Insights team within Marketing. This role will focus on
  designing, developing, and deploying AI and Machine Learning
  solutions that unlock insights from Pricing, marketing,
  customer, commercial, and third‑party data.
  
  
  
  The AI Developer will contribute to Vertiv’s data‑driven
  initiatives by delivering predictive models, advanced
  analytics, and AI‑powered applications that improve customer
  centricity, marketing effectiveness, and business outcomes
  globally.
  
  
  
  This position offers the opportunity to work in a
  multidisciplinary, global environment, collaborating with
  senior stakeholders across regions and functions, and
  shaping the practical application of AI at enterprise scale.
  
  
  
  Key Responsibilities
  
  
  
  The AI Developer will primarily focus on Marketing, Pricing
  and Customer Insight data domains, including but not limited
  to:
  
  
  
  - Customer master and behavioral data
  - Campaign, promotion, and engagement data
  - Customer value, segmentation, and lifecycle metrics
  - Channel partner and third‑party data
  - Product, lead, opportunity, and commercial performance data
  - Pricing
  
  
  
  Core Responsibilities
  
  
  
  - Design, develop, and maintain AI/ML and predictive models to
    support Marketing, Pricing and Customer Insight use cases
  - Translate business challenges into AI‑driven solutions,
    partnering with Marketing, IT, and Analytics stakeholders
  - Ensure timely, accurate, and consistent data ingestion for
    marketing dashboards, reports, and analytical models
  - Perform data validation and accuracy checks across source
    systems and analytical platforms
  - Identify opportunities to automate data collection and
    improve data processes, quality, and governance
  - Explain AI/ML concepts, model outcomes, and limitations
    clearly to business and leadership audiences
  - Promote responsible, ethical, and transparent AI practices
    across all solutions
  
  
  
  Essential Job Functions
  
  
  
  - Participate in functional and solution design, including
    process mapping, scenario design, prototyping, testing,
    training, and support definition
  - Document solution architecture, model logic, assumptions,
    and lessons learned
  - Design and develop AI/ML models aligned to project
    objectives and performance metrics
  - Convert AI/ML models into scalable APIs for enterprise
    consumption
  - Perform statistical analysis and feature engineering on
    large, complex datasets
  - Support the full AI lifecycle: definition, development,
    implementation, deployment, and upgrades
  - Manage AI project infrastructure, including development,
    experimentation, and production workflows
  - Support data acquisition strategies to ensure required
    depth, breadth, and quality of data
  - Collaborate with IT and Data teams to design secure,
    efficient, and scalable data and AI infrastructure
  - Monitor, sustain, and report on data quality, compliance,
    and model performance
  - Actively collaborate across teams and geographies, building
    strong working relationships
  - Communicate project status, risks, and outcomes clearly to
    stakeholders
  
  
  
  Required Qualifications
  
  
  
  - 4 to 6 years of hands‑on experience applying AI/ML to
    real‑world business or enterprise solutions
  - Bachelor’s or Master’s degree in Computer Science, Data
    Science, Artificial Intelligence, Engineering, or related
    field
  - Strong experience with Python, Machine Learning, Deep
    Learning, and NLP
  - Hands‑on experience with TensorFlow, PyTorch, or similar
    frameworks
  - Experience working with Generative AI models (e.g., GPT,
    BERT or similar)
  - Knowledge of prompt engineering and fine‑tuning techniques
    for GenAI models
  - Experience with cloud platforms (AWS, Azure, or GCP) and
    containerization (Docker/Kubernetes)
  - Familiarity with CI/CD pipelines for AI/ML model development
    and deployment
  - Proficient with tools such as Jupyter Notebook, Git, MLflow
  - Strong SQL skills; experience with data platforms such as
    Snowflake is a plus
  - Solid understanding of algorithms, data structures, and
    software engineering best practices
  - Advanced knowledge of statistics, probability, and linear
    algebra
  - Experience handling large-scale datasets and writing
    efficient, production‑ready code
  
  
  
  Soft Skills & Professional Competencies
  
  
  
  - Strong analytical, critical thinking, and problem‑solving
    skills
  - Ability to work effectively in a matrix and global operating
    model
  - Excellent time management and organizational skills
  - Strong communication and presentation skills, including with
    non‑technical stakeholders
  - Understanding of key business and financial performance
    metrics
  - Fluency in English (written and spoken)
  
  
  
  
  About the Team
  
   Work Authorization
  
  
  
   No calls or agencies please. Vertiv will only employ those
  who are legally authorized to work in the United States.
  This is not a position for which sponsorship will be
  provided. Individuals with temporary visas such as E, F-1,
  H-1, H-2, L, B, J, or TN or who need sponsorship for work
  authorization now or in the future, are not eligible for
  hire.
  
  
  
