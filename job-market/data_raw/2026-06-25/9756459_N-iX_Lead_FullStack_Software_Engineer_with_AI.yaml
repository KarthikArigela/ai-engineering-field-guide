  Canadian time zone work hours.
  
  About the client:
  
  Our customer is the European online car market, with over 30
  million monthly users and a presence in 18 countries. As a
  Lead Full Stack Engineer, you will play a pivotal role in
  shaping the future of online car markets and enhancing the
  user experience for millions of car buyers and sellers.
  
  About the role:
  
  We’re looking for a Lead Full Stack Software Engineer who
  takes end-to-end ownership, thrives in ambiguity, and wants
  to build systems that matter. This role is central to
  rethinking and rebuilding our clients’ auto repossession and
  remarketing platform, a system that directly influences how
  vehicles are recovered, processed, and remarketed across the
  big automotive ecosystem. This is an AI-first engineering
  role—not in name, but in practice. You’ll continuously
  evaluate where AI (including LLMs and agentic tools) can
  meaningfully improve engineering velocity, system quality,
  and operational efficiency, while applying strong judgment
  about where it should not be used.
  
  You’ll help shape architecture, influence technical
  direction, and own what you build—from design to production.
  
  Responsibilities:
  
  - Build & Evolve Critical Systems.
  - Rethink and reshape core workflows based on a deep
    understanding of auto repossession and remarketing
    processes.
  - Design and implement scalable, resilient systems using
    modern architectural principles: clear service boundaries,
    modularity, and observability.
  - Incorporate LLMs and AI-driven components to improve data
    validation, document processing, and operational decision-
    making.
    - Use AI-assisted and agentic coding tools to accelerate
      development—while maintaining high standards for
      correctness, security, and maintainability.
  - Own Architecture & Technical Decisions.
  - Drive architectural discussions and decisions, balancing
    pragmatism with technical excellence.
    - Set and enforce high-quality bars for new services and
      modules, with a focus on testability, performance, and
      reliability.
    - Identify and reduce technical debt in ways that measurably
      improve developer velocity and system robustness.
  - Build With an Ownership Mindset
  - Work across the full software lifecycle: design, build,
    deploy, operate, and iterate.
    - Embrace a “you build it, you own it” DevOps mindset
      alongside your team.
    - Make thoughtful trade-offs between effort, quality, and user
      value—always with accountability for outcomes.
  - Work closely with product managers, designers, and other
    engineers in an agile, cross-functional team.
  - Contribute ideas, challenge assumptions, and continuously
    improve how we build software.
  - Mentor and support other engineers through code reviews,
    design discussions, and technical leadership.
  
  Requirements:
  
  - A Lead (7+ years of experience) engineer who owns results,
    not just implementations.
  - Someone who enjoys complex problem-solving and isn’t afraid
    of legacy systems—or changing them.
  - Strong engineering fundamentals: clean code, testing
    discipline, system design, and performance awareness.
  - Strong experience with TypeScript and modern React / Next.js
  - Strong experience building production systems with .NET
    (Core / modern .NET preferred).
  - Strong experience building production systems with C#
  - Comfort operating in production environments and learning
    from real-world feedback.
  - A builder’s mindset: If you can think it, you can build it.
    If you build it, you own it.
  - Strong must: experience leveraging AI, Generative AI (GenAI)
    to enhance engineering productivity, automate repetitive
    tasks, and optimize workflows. You should demonstrate the
    ability to integrate AI-driven solutions into your daily
    work — such as code generation, debugging, reviews,
    documentation, and decision support—to improve efficiency
    for yourself and your teams. A proactive approach to
    exploring and implementing AI tools that drive innovation
    and streamline development processes is highly valued
  - Canadian time zone work hours
  
