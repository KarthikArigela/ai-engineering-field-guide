  Job Description
  
  Role Purpose:
  
  Full-Stack AI Engineer (3+ Years Experience)
  
  A Design, develop, and deploy end-to-end AI-powered
  applications, combining sophisticated Generative AI agents
  and RAG pipelines with robust full-stack architectures.
  
  Key Accountabilities
  
  · AI Orchestration: Build and optimize autonomous agents and
  multi-agent systems using LLM gateways and advanced
  orchestration frameworks.
  
  · RAG Architecture: Design production-grade RAG pipelines
  utilizing various Vector DBs and complex design patterns
  (hybrid search, query rewriting).
  
  · Full-Stack Development: Develop interactive AI interfaces
  in React JS and build scalable, secure backend services
  using Java.
  
  · Cloud Infrastructure: Develop and deploy the entire stack
  on AWS, ensuring seamless integration between AI models and
  application layers.
  
  Key Soft Skills
  
  · Analytical Thinking: Strong problem-solving skills with a
  focus on algorithm design.
  
  · Adaptability: Passion for staying current with rapidly
  evolving AI and Full-Stack frameworks.
  
  Qualifications
  
  · Experience: 3+ years of professional experience in AI/ML
  and software engineering.
  
  · AI/ML Core: Expert Python proficiency; deep knowledge of
  LLMs, Prompt Engineering, and RAG.
  
  · Frontend: Hands-on experience with React JS for building
  data-driven dashboards and AI interfaces.
  
  · Backend: Hands-on in Java (Spring Boot preferred) for
  creating enterprise-grade APIs and microservices.
  
  · Data & Cloud: Experience with Vector Databases (e.g.,
  Pinecone, Weaviate) and AWS (Lambda, ECS).
  
  · Education: Degree in Computer Science, AI, Engineering, or
  a related field.
  
