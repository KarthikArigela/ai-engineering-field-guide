  Company Description
  
  Experian is a global data and technology company, powering
  opportunities for people and businesses around the world. We
  help to redefine lending practices, uncover and prevent
  fraud, simplify healthcare, create marketing solutions, and
  gain deeper insights into the automotive market, all using
  our unique combination of data, analytics and software. We
  also assist millions of people to realize their financial
  goals and help them save time and money.
  
  We operate across a range of markets, from financial
  services to healthcare, automotive, agribusiness, insurance,
  and many more industry segments.
  
  We invest in people and new advanced technologies to unlock
  the power of data. As a FTSE 100 Index company listed on the
  London Stock Exchange (EXPN), we have a team of 22,500
  people across 32 countries. Our corporate headquarters are
  in Dublin, Ireland. Learn more at experianplc.com.
  
  Job Description
  
  - Partner with Architecture/Product/CloudOps/Engineering teams
    to design highly scalable, flexible and resilient cloud
    architectures aligned with business and technical
    requirements.
  - Designs and implements complex architectural solutions using
    AWS design principles, best practices, and industry
    standards.
  - Build and maintain robust APIs and microservices for
    internal and external consumption.
  - Design and implement AI-powered solutions using agent
    frameworks and multi-agent systems.
  - Integrate AI tools into developer workflows and enterprise
    applications.
  - Work with LLM orchestration frameworks (e.g., MCP or
    similar) to enable intelligent workflows.
  - Implement secure authentication and authorization
    mechanisms, including OAuth 2.0 and delegated access
    patterns.
  - Communicate and explain technical/architectural decisions to
    product, development, and delivery teams.
  - You will report to a Senior Engineering Manager
  
  Qualifications
  
  - BS in Computer Science or related fields; Masters preferred
  - You need to have 5+ years of professional software
    engineering experience.
  - Strong proficiency in one or more backend languages (e.g.,
    Java, Python, Go, Node.js)
  - Extensive experience designing and building APIs at scale.
  - Hands-on experience using AI coding tools such as Claude,
    Cursor, or GitHub Copilot in daily workflows.
  - Build and maintain AI-powered APIs for inference,
    orchestration, and agent-based workflows
  - Experience designing and implementing workflows using tools
    like n8n, Zapier, or similar to automate engineering,
    data, and business process.
  - Deep understanding of cloud computing technologies and
    workload transition challenges, knowledge of AWS Well-
    Architected Framework, industry standards, and best
    practices
  - Current cloud technology experience, preferably AWS (EKS,
    S3, RDS, Lambda, Aurora, ECS-Fargate ...etc.)
  - Demonstrable familiarity with CI/CD process, testing
    frameworks, and practices (Jenkins, Harness, etc.)
  - Experience integrating with async messaging, logging, or
    queues, such as Kafka, RabbitMQ, or SQS. Nice to have
  - Experience building AI agents or multi-step LLM workflows.
  - Familiarity with agent frameworks (LangChain, LlamaIndex,
    Semantic Kernel)
  - Experience building internal developer platforms or AI-
    powered dev tools
  - Exposure to observability tools for AI systems (prompt
    tracing, token usage, latency analysis).
  
