description: |
  Sequencing is building the interface between humanity and
  its DNA.
  
  Using clinical-grade whole genome sequencing, AI, and a
  rapidly expanding ecosystem of genomic applications, we help
  people better understand themselves, their health, and their
  future through their DNA.
  
  The human genome is one of the most valuable and
  underutilized resources in the world. Our mission is to
  transform the human genome into a lifelong source of
  personalized guidance and build the trusted home for every
  genome on Earth.
  
  As the world’s largest direct-to-consumer whole genome
  sequencing platform, Sequencing is helping define the future
  of AI-powered personalized health.
  
  We’re a profitable, venture-backed, fully remote company
  building category-defining products that help people better
  understand themselves through their DNA.
  
  The opportunity
  
  As a Senior AI Engineer you build and improve the AI agent
  systems that power personalized genetics based health
  guidance. You work side by side with our AI Backend
  Architect to move from simple large language model calls to
  a true multi agent brain that plans routes and checks every
  answer. When you do this well, people can have meaningful
  conversations with their DNA and receive trustworthy
  guidance that evolves alongside advances in science and AI.
  
  What you'll own
  
  - Design and improve multi agent AI systems where planner
    orchestrator worker and evaluator agents work together on
    each request.
  - Build planner and router agents that decide which worker
    agent Genome Research Health or Drug should handle each
    task.
  - Create AI agents that can pick use and chain tools on their
    own including ReAct style agents that can write and run
    code in a safe loop.
  - Set up clear interfaces and parallel execution for worker
    agents so answers stay fast even as we add more data and
    tools.
  - Build critic and review layers that check responses for
    quality safety and scientific accuracy before sending them
    to the user.
  - Reduce wait times by running agents in parallel precaching
    likely intents and making tool calls and data access as
    efficient as possible.
  - Build and maintain evaluation pipelines and benchmarks so we
    can measure answer quality response speed and reliability
    over time.
  - Design and run production AI backend services in TypeScript
    that connect agents to genomics and health data.
  - Design and evolve persistent memory, personalization, and
    learning systems that allow AI experiences to become more
    useful over time while maintaining privacy and security.
  - Build prompt flows retrieval pipelines and guardrails so
    models stay grounded in real genetic and health evidence
    not guesses.
  - Integrate and run databases queues and data systems such as
    PostgreSQL MySQL AWS SQS Redis BullMQ and AWS Glue in the
    AI backend.
  - Support backend systems that power native mobile apps so
    experiences feel fast and stable on every device.
  - Work closely with bioinformatics teammates to be sure AI
    answers match what the DNA and science actually say.
  - Partner with product and design to make AI answers feel
    simple caring and easy to act on for non experts.
  - Help shape a self improving AI system that can learn from
    patterns across many users while keeping their data
    private and secure.
  
  Who you are
  
  - 5+ years building and operating production software systems,
    including AI-powered or data-intensive applications at
    scale.
  - Expert with TypeScript and comfortable owning production
    backend services.
  - Proven experience building multi agent AI systems and
    orchestration patterns not just wiring up a single large
    language model.
  - Deep hands on work with large language model APIs such as
    Anthropic OpenAI Bedrock DeepSeek or Google AI in real
    products.
  - Experience creating high-quality evaluation datasets and
    golden Q&A sets for LLMs, including workflows that involve
    domain expert review for accuracy.
  - Practical experience preparing data for fine-tuning or
    distillation. Understanding when these techniques add real
    value versus improving RAG, prompting, or tool design.
  - Experience building structured retrieval augmented
    generation pipelines and retrieval systems.
  - Experience with hierarchical agent designs planner and
    orchestrator patterns dynamic tool use and autonomous
    agents.
  - Experience building evaluation pipelines benchmarks and
    response quality scoring plus tuning systems for low
    latency.
  - Experience with PostgreSQL DuckDB Apache Spark and service
    oriented architectures.
  - Strong understanding of how to speed up AI systems using
    parallel execution caching and efficient tool calls.
  - Familiarity with services like AWS SageMaker for model
    training and customization alongside Bedrock.
  - Strong intuition for where AI systems are headed over the
    next three years and excitement for turning emerging
    capabilities into real-world products.
  - Able to work independently in a remote setup while
    partnering closely with product engineering and
    bioinformatics.
  - Customer obsessed and quality driven with a strong respect
    for scientific accuracy and safety around health.
  - Nice to have familiarity with genomics bioinformatics or
    health data systems agent frameworks like LangGraph
    AutoGen or CrewAI self improving agent loops startup
    environments or Rust.
  
  Why this matters
  
  AI is transforming how people access information. Genomics
  is transforming how people understand themselves.
  
  This role sits at the convergence of both.
  
  You’ll help build the AI systems that enable people to
  interact with their DNA and receive personalized guidance
  throughout their lives. The systems you build will help
  millions of people better understand their health, identify
  risks earlier, make more informed decisions, and benefit
  from advances in science that would otherwise remain
  inaccessible.
  
  This is an opportunity to help create a category-defining,
  generational product and shape how humanity interacts with
  its DNA for decades to come.
  
  Benefits Overview
  
  - Comprehensive medical, dental, and vision insurance coverage
  - 401(k) with company matching
  - Paid time off (PTO)
  - Paid volunteer time off
  - Fully remote work with home office stipend
  - Parental bonding leave
  - Clinical-grade whole genome sequencing for you and your
    family (private and confidential)
  
  Join Sequencing
  
  - Redefine how people understand themselves through their DNA
  - Build category-defining products alongside scientists,
    engineers, and innovators
  - Contribute to technology that will improve and extend
    millions of lives
  - Shape one of the most important emerging categories in AI
    and healthcare
  
