description: |
  Join Goodwin’s Global Operations Team, and make a real
  impact on a global scale. At Goodwin, we work with some of
  the world’s most successful and innovative investors,
  entrepreneurs and disruptors in the life sciences, private
  equity, real estate, technology and financial industries,
  and where they converge. As part of the Global Operations
  Team – all business professionals at the firm – you’ll
  collaborate with colleagues from varied backgrounds and
  experiences, fostering an environment where cross-functional
  learning, networking, and collaboration are at the core of
  what we do. Here, we’re not just supporting a law firm;
  we’re partnering with attorneys and clients to deliver
  cutting-edge solutions in high-stakes litigation and dispute
  resolution, world-class regulatory compliance and advisory
  services, and complex transactions. Our commitment to
  integrity, ingenuity, agility, and ambition drives us, and
  we’re proud to have been recognised as the “Best Business
  Team” by The American Lawyer. This is your opportunity to
  grow professionally in a dynamic, global environment,
  surrounded by forward-thinking peers.
  
  We are seeking an AI Engineer with a passion for emerging AI
  technologies from Microsoft. This position reports to the
  Manager of Enterprise Applications and will work closely
  with cross-functional teams, including developers,
  architects, and stakeholders. The AI Engineer will play a
  crucial role in designing, developing, and maintaining
  cutting-edge generative AI applications to meet our
  organization’s needs. What You Will Do:
  
  - Design and Develop: Create AI solutions using Microsoft
    Azure-based tools (Power Automate, Power Desktop, Forms,
    Azure AI Studio).
  - Collaborate: Work with cross-functional teams to gather
    requirements, define software specifications, and provide
    technical guidance throughout the software development
    lifecycle.
  - Build and Maintain: Develop efficient, reliable, and
    scalable AI code in accordance with industry best
    practices and coding standards.
  - Utilize Azure Services: Develop cloud-based AI applications
    using Azure services and frameworks, ensuring high
    availability, security, and performance.
  - Integrate GenAI: Develop and integrate Generative AI (GenAI)
    applications, leveraging AI and machine learning
    technologies to enhance software functionality and user
    experience.
  - Azure Machine Learning: Utilize Azure Machine Learning for
    model training, deployment, and management.
  - Participate in team meetings and contribute to project
    planning and strategy discussions.
  - Assist in the development of training materials and conduct
    training sessions for team members and end-users.
  - Test and Debug: Perform comprehensive testing, debugging,
    and troubleshooting of AI applications to ensure quality
    and minimize defects.
  - Stay Updated: Keep up to date with the latest Microsoft AI
    technologies, tools, and frameworks, and identify
    opportunities for their implementation to improve AI
    development processes and efficiency.
  - Collaborate: Work with other developers, architects, and
    stakeholders to deliver AI projects on time and within
    budget.
  - Document: Document AI designs, procedures, and guidelines to
    ensure maintainability and facilitate knowledge transfer.
  - Support: Provide technical support and assistance to end-
    users, addressing AI-related issues and ensuring customer
    satisfaction.
  
  Who You Are:
  
  - Bachelor's degree required
  - Experience working with Microsoft Dynamics CRM or similar
    CRM platforms.
  - Strong attention to detail and ability to execute repetitive
    tasks with accuracy.
  - Familiarity with data entry, data analysis, and data
    management best practices.
  - Ability to identify and resolve data issues, including
    duplicates and inconsistencies.
  - Proficiency in Microsoft Excel and other data-processing
    tools.
  
  #LI-TV1
  
