description: |
  Nexthop.ai builds cutting-edge solutions for large-scale AI
  infrastructure. The team brings deep expertise in hardware,
  software, networking, cloud, and AI with a fast-moving
  startup culture. We are looking for a Lead Engineer, Agentic
  AI Workflows to build AI-powered systems where agents and
  humans work together to simplify operations and decision-
  making.
  
  What You’ll Do
  
  - Build agentic AI workflows for business operations and
    tooling.
  - Design human-in-the-loop workflows with approvals,
    escalation, guardrails, and operator feedback.
  - Develop AI copilots and assistants using LLMs, tools, APIs,
    telemetry, logs, and real-time system data.
  - Create reusable patterns for agent orchestration, tool
    calling, RAG, workflow automation, and task execution.
  - Work closely with Infrastructure, product, business teams to
    turn AI ideas into working product features.
  
  What We’re Looking For
  
  - 10+ years of software engineering experience in backend,
    full-stack, AI platforms, automation, cloud, or
    infrastructure systems.
  - Hands-on experience building AI applications using LLMs,
    agents, RAG, tool calling, copilots, or workflow engines.
  - Strong Python and/or TypeScript skills.
  - Experience integrating with APIs, databases, event streams,
    telemetry, logs, or monitoring systems.
  - Good understanding of reliability, safety, latency, cost,
    observability, and failure handling in AI workflows.
  - Strong ownership, communication, and ability to work in a
    fast-paced startup environment.
  
  Bonus
  
  - Experience with LangChain, LangGraph, LlamaIndex, Semantic
    Kernel, CrewAI, AutoGen, OpenAI APIs, Anthropic APIs, or
    similar frameworks.
  - Background in AIOps, networking, Kubernetes, observability,
    cloud infrastructure, or real-time systems.
  - Experience building chat-based assistants, operational
    copilots, or automation platforms.
  
  Why Join
  
  - Startup energy with an experienced team.
  - Build practical agentic AI systems that combine automation
    with human judgment.
  - High-impact role with ownership from concept to production
    impacting business decisions.
