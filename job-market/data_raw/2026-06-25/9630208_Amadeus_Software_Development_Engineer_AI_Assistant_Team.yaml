description: |
  Job Title
  
  Software Development Engineer, AI Assistant Team
  
  About the Department/Team:
  
  We build the production systems that connect AI Assistants
  to Amadeus’ travel capabilities. By joining our AI Assistant
  team, you’ll be part of an end-to-end product incubation
  team focused on designing, validating, and scaling AI-native
  solutions for how travelers plan, book, and service trips
  through emerging AI interfaces.
  
  About the AI Delivery Hub: The AI Delivery Hub is a key
  engine in Amadeus’ transformation toward an AI-first
  organization. It brings together focused, multidisciplinary
  teams to design, build, and deliver AI product solutions
  end-to-end. Working closely with product and platform teams
  across different business lines, the Hub accelerates
  delivery and scales AI across Amadeus’ portfolio by turning
  proven work into reusable capabilities and real product
  outcomes.
  
  Role summary: As a Software Engineer in the AI Assistant
  team, you build and operate the services, APIs, and
  integration layers that enable AI Assistants to deliver end-
  to-end travel experiences. You work in a spec-driven, AI-
  augmented engineering workflow: you write clear
  specifications, work alongside AI coding agents to generate
  implementations, and apply rigorous review and testing to
  ship systems that are production-ready, secure, and
  performant. You collaborate closely with architects on
  system design and technical direction, and with product and
  design on experience requirements. You deliver quickly
  through a disciplined, traceable workflow.
  
  In this role you'll:
  
  - Engineers in this team make AI coding tools a primary
    working method, not a side instrument. The day-to-day
    looks different from traditional software engineering in
    three ways:
  - Writing specifications is a core engineering skill. The
    clarity of what you ask for is what determines the quality
    of the result, whether the implementation is written by
    you, by a teammate, or by an AI coding agent.
  - Reviewing AI-generated specifications, code, and tests is
    part of every engineer’s craft. The bar is the same as for
    human-written code: domain correctness, security,
    performance, and architectural alignment.
  - Engineers operate with clear boundaries for what AI tools do
    autonomously (generating code, running tests, fixing lint
    errors) versus what requires human approval (merges to
    main, external API changes) or wider architectural review.
  - Write clear, well-scoped specifications that lead to high-
    quality implementations, by AI coding agents and by humans
    alike.
  - Review and steer AI-generated specifications, code, and
    tests with rigour, ensuring domain correctness, security,
    and performance.
  - Decompose work into small, well-scoped units that can be
    reasoned about completely, end-to-end.
  - Build and maintain the production-ready services, APIs, and
    integration layers that connect AI Assistant platforms to
    Amadeus travel content, availability, booking, and payment
    capabilities.
  - Collaborate with architects on system design, technical
    direction, and architectural decisions, ensuring
    implementations stay aligned with the broader system
    vision.
  - Instrument systems for observability, telemetry, and
    continuous validation. Quality is measured incrementally,
    not batch-checked at the end.
  - Work within the delivery pipeline: golden paths, automated
    compliance controls, and policy-as-code guardrails, not
    manual gates.
  - Partner with product and design to translate travel
    experience requirements into feasible technical designs.
  - Collaborate with Amadeus platform teams (Universal
    Distribution, Hospitality, Payments) to integrate the
    content and APIs that power the travel experience, and
    help turn proven work into reusable capabilities where it
    makes sense.
  - Continuously improve the practices, prompts, and patterns
    the team uses to get reliable, high-quality output from AI
    tools.
  
  About the Ideal Candidate:
  
  - 4+ years of software engineering experience, with strong
    fundamentals in system design, API development, and
    production operations.
  - Candidates must be able to work in the United States without
    current or future visa sponsorship ***
  - Proficiency in Python and at least one additional backend
    language (Java, Go, TypeScript, or similar).
  - Experience with AI-augmented development tools (AI code
    assistants, agentic coding tools, spec-driven workflows),
    or a strong appetite and aptitude to adopt them as a
    primary working method.
  - Solid understanding of modern CI/CD practices,
    containerization, and cloud-native architectures.
  - Experience building and operating APIs and microservices in
    production at scale.
  - Comfort with ambiguity and iterative delivery, this is an
    end-to-end incubation team where the landscape evolves
    rapidly.
  - Strong code review skills and attention to quality,
    security, and maintainability, especially important when
    reviewing AI-generated output.
  - Collaborative mindset: able to work closely with product,
    design, ML engineers, and cross-business platform teams.
  - Writes specifications precise enough that implementations
    succeed on the first pass, treats specification quality as
    a core engineering skill.
  - Reviews AI-generated code with the same rigour as human-
    written code; catches subtle domain errors, security
    issues, and architectural drift.
  - Thinks in systems: understands how services connect, where
    latency lives, how failures cascade, and brings the right
    questions to architects early.
  - Moves through an AI-augmented workflow with judgement
    intact, knows when to trust AI output and when to
    intervene.
  - Maintains clear traceability between specifications and the
    code that implements them.
  - Communicates clearly with architects, product, and cross-
    functional stakeholders. Translates technical constraints
    into business language.
  - Experience with AI Assistant platform integration patterns
    (plugins, skills, function calling, MCP, conversational
    APIs).
  - Familiarity with spec-driven or intent-driven development
    methodologies.
  - Background in travel, marketplace, or multi-sided platform
    domains.
  - Experience with policy-as-code, automated compliance, or
    DevSecOps practices.
  - Familiarity with LLM application patterns (RAG,
    orchestration, function calling), enough to build
    integrations, even if not the ML systems themselves.
  - Experience in innovation labs, end-to-end delivery teams, or
    incubation environments taking products from early concept
    to production.
  
  Working at Amadeus, you will find:
  
  🎯 A critical mission and purpose - At Amadeus, you will be
  powering the future of travel and pursuing a critical
  mission and extraordinary purpose.  🌎 A truly global DNA -
  Everything at Amadeus is global, from our people to our
  business, which translates into our footprint, processes,
  and culture. 🎓 Great opportunities to learn - Learning
  happens all the time and in many ways at Amadeus, through
  on-the-job training, formal learning activities, and day-to-
  day interactions with colleagues. 🤗 A caring environment -
  Amadeus fosters a caring environment, nurturing both a
  fulfilling career and personal and family life. We care
  about our employees and strive to provide a supportive work
  environment. 💰 A complete rewards offer - Amadeus provides
  attractive remuneration packages, covering all essential
  components of a competitive reward offer, including salary,
  bonus, equity, and benefits. 🌟 A flexible working model - We
  want our employees to do their best work, wherever and
  however it works best for them. 🌈 A diverse and inclusive
  community - We are committed to leveraging our uniquely
  diverse population to drive innovation, creativity, and
  collaboration across our organization. 📈 A Reliable Company
  - Trust and reliability are fundamental values that drive
  our actions and shape long-lasting relationships with our
  customers, partners, and employees.
  
  What we can offer you:
  
  Get rewarded with competitive remuneration, individual and
  company annual bonus, vacation and holiday paid time off,
  health insurances and other competitive benefits.
  
  Work a flexible hybrid schedule.
  
  Professional development to broaden your knowledge and
  enhance your skills with on-line learning hubs packed with
  technical and soft skills training that allow you to develop
  and grow.
  
  Enter a diverse and inclusive workplace, join one of the
  world’s top travel technology companies and take on a role
  that impacts millions of travelers around the globe
  
