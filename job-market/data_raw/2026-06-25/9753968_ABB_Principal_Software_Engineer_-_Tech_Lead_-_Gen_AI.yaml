  collectively, welcomes and celebrates individual
  differences.
  
  Join our dynamic team and contribute to the development of
  cutting-edge Industrial AI, Copilot solutions, Agentic AI
  capabilities, and cloud-native platforms that are shaping
  the future of intelligent industrial operations.
  
  ABB India is committed to fostering a diverse and inclusive
