description: |
  As a Senior AI Engineer, you will bridge the gap between
  experimentation and enterprise-grade delivery. You will work
  within product teams to embed AI into core insurance
  processes, with a strong focus on claims management. This is
  a hands-on role for someone who enjoys building, testing,
  and scaling real solutions.
  
  Key responsibilities
  
  - Design and integrate AI capabilities into SAP-based
    enterprise applications
  - Build prototypes and evolve them into scalable, production-
    ready features
  - Develop cloud-native applications using ABAP Cloud on SAP
    Business Technology Platform (BTP)
  - Contribute to the digital transformation of insurance
    processes, particularly claims management
  - Collaborate in customer workshops and explain technical
    concepts clearly and effectively
  
  Requirements
  
  - Proven experience integrating large language models (LLMs)
    into enterprise applications
  - Hands-on experience with frameworks such as LangChain,
    LangGraph or similar tools for orchestration and AI
    workflows
  - Solid understanding of retrieval-augmented generation (RAG)
    or comparable approaches for enterprise AI solutions
  - Experience building and scaling applications from prototype
    to product
  - Strong German and English communication skills (professional
    proficiency, minimum C1 level)
  
  Benefits
  
  You will have the opportunity to collaborate with some of
  the brightest minds in the industry on an incredibly
  ambitious product to shape the ever-evolving financial
  sector. This is an environment where you can have it all —
  the agility, enthusiasm, and dynamism of a start-up,
  combined with the established expertise, solid market
  presence, and extensive customer network of a more
  established organization.
  
  At SAP Fioneer, you will benefit from a flexible work
  environment that encourages creativity and empowers you to
  think outside the box, bring new ideas to the table, and
  challenge the status quo. You will become part of a diverse
  and global team that we are proud of and are constantly
  growing and reinventing. As an employee, you can chart your
  career path and take advantage of competitive compensation
  packages and progression opportunities based on merit.
  
  We offer a comprehensive benefits package that includes
  occupational pension provisions, support for health and
  wellbeing, various mobility options like bike leasing and
  transportation allowances, as well as additional perks such
  as celebration rewards, meal programs, jubilee recognition,
  and relocation reimbursement.
