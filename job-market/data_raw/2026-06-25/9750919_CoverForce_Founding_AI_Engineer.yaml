description: |
  About CoverForce
  
  At CoverForce, we're redefining how insurance is bought and
  sold. Our mission is simple: to make business insurance
  faster, easier, and fully digital. Thousands of insurance
  agents and corporate customers rely on our platform to
  streamline quoting, comparing, and purchasing policies. We
  partner with leading insurers like Travelers, Liberty
  Mutual, and Chubb to reduce underwriting and sales time by
  60%, setting a new standard for efficiency in the industry.
  
  Our solutions power the future of insurance distribution:
  
  ✅ Quote & Bind Platform – Used by Top 100 insurance
  distributors to generate quotes instantly and eliminate
  paperwork. ✅ Embedded Commercial Product – Enables platforms
  like Walmart, Gusto, and Uber to embed business insurance
  seamlessly into their customer journeys. ✅ Insurance’s API
  Layer – We’re building the Plaid of commercial insurance,
  providing frictionless access to policies through APIs and
  modern software.
  
  CoverForce is growing fast, and now is the time to build the
  brand, own demand generation, and drive our go-to-market
  strategy from the ground up. If you're a high-impact
  marketer who thrives in fast-moving environments, this is
  your chance to make a mark.
  
  What You'll Do
  
  This is our first dedicated AI engineer role, and you will
  play a key role in shaping how we apply AI across our
  product, platform, and internal workflows.
  
  - Design and build LLM-powered agents and workflows that
    automate complex tasks and deliver real user value
  - Use prompt engineering, embeddings, retrieval-based methods,
    and fine-tuning to improve system performance
  - Apply traditional ML techniques to structured and semi-
    structured data problems
  - Work across the stack to support scalable, production-grade
    AI infrastructure
  - Mentor and support teammates who are eager to grow their
    AI/ML skills, contributing to a strong learning culture
  - Stay current with the latest advancements in LLMs and
    machine learning, and help bring the best ideas into our
    products
  
  What We’re Looking For
  
  - 4+ years of experience in AI/ML, ideally including exposure
    to both LLMs and traditional machine learning techniques
  - Hands-on experience working with LLMs in production -
    whether through prompt design, chaining, retrieval-
    augmented generation (RAG) or fine-tuning
  - A creative approach to leveraging LLMs, thinking beyond chat
    interfaces to real-world workflows and automation
  - Ability to work independently in fast-paced, ambiguous
    environments, taking ownership from concept to deployment
  - Solid background in traditional AI/ML, with experience
    applying it to real-world data problems
  - A collaborative mindset and a genuine interest in mentoring
    teammates and sharing knowledge
  
  Why Join Us?
  
  - Build from the ground up - As the first AI engineer hire,
    you’ll lead our AI tech strategy and mentor others
  - Own your impact - You’ll work directly with our founders and
    have full ownership over your domain
  - Fast-growing startup - We’re backed by top investors and
    partnered with the biggest names in insurance.
  
  What CoverForce offers
  
  CoverForce has been a remote-first company in India since
  its inception and will always strive to be flexible to
  employees’ preferences. We know how to cultivate a
  successful and highly collaborative environment despite the
  distance. This includes:
  
  - Quarterly virtual events to connect with your team members
    while celebrating our success and accomplishments
  - Clear norms and etiquette around virtual meetings.
  - Team building activities every month to let off steam and
    relax.
  
  We offer competitive compensation packages
