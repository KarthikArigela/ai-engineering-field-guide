description: |
  At NiCE, we don’t limit our challenges. We challenge our
  limits. Always. We’re ambitious. We’re game changers. And we
  play to win. We set the highest standards and execute beyond
  them. And if you’re like us, we can offer you the ultimate
  career opportunity that will light a fire within you.
  
  What's the Role All About?
  
  The Senior Software Engineer is a customer-facing role
  responsible for implementing, configuring, and delivering
  AI-driven and Conversational AI solutions across the NiCE
  ecosystem.  As a hands-on technical contributor, you will
  build integrations, configure conversational AI platforms,
  and ensure high-quality execution of project deliverables.
  
  
  
  How Will You Make an Impact?
  
  Design, Build and integrate APIs, webhooks, and
  microservices connecting LLMs and AI models to enterprise
  platforms and workflows.
  
  Implement prompt engineering strategies, RAG pipelines, and
  agent orchestration frameworks LLM & AI Model Expertise
  
  Apply knowledge of large language models (GPT-4, Claude,
  Gemini, Llama, etc.) to design appropriate solutions for
  customer use cases.
  
  Evaluate and select the right model, fine-tuning approach,
  or retrieval strategy for each project based on accuracy,
  latency, and cost requirements.
  
  Stay current with the rapidly evolving LLM ecosystem
  including model releases, agent frameworks, and emerging AI
  tooling.
  
  Understand and work within NiCE internal processes and
  systems (e.g., CRMs, knowledge bases, ticketing/support
  tools, and operational platforms) to ensure solutions fit
  real-world constraints.
  
  
  
  Have You Got What It Takes?
  
  Bachelor’s degree in Computer Science or a related field.
  
  4–7 years of software development experience building
  scalable, high-performance enterprise applications.
  
  Strong understanding of AI and NLP technologies, including
  LLMs, RAG, AI agents, GPTs, and Copilot-style assistants.
  
  Hands-on experience with automation and orchestration tools
  such as n8n, Copilot Studio, or similar platforms.
  
  Proficiency in REST APIs, JSON, cloud SDKs, and integration
  technologies.
  
  Familiarity with vector databases, embeddings, and RAG
  architecture.
  
  Proven ability to translate business needs into practical AI
  solutions and measurable outcomes.
  
  Strong problem-solving skills with the ability to rapidly
  prototype, debug, and deliver solutions.
  
  Demonstrated passion for AI, continuous learning, and
  applying emerging technologies to improve workflows.
  
  Ability to thrive in a fast-paced environment, managing
  multiple priorities and adapting quickly to change.
  
  You will have an advantage if you also have:
  
  Experience with NiCE Cognigy (conversational AI & agent
  orchestration platform), or similar CCaaS / conversational
  AI platforms.
  
  Background in contact centre, or enterprise SaaS
  environments.
  
  Exposure to voice AI, speech-to-text/text-to-speech
  pipelines, or real-time AI in contact Centre contexts.
  
  What’s in it for you?
  
  Join an ever-growing, market disrupting, global company
  where the teams – comprised of the best of the best – work
  in a fast-paced, collaborative, and creative environment! As
  the market leader, every day at NiCE is a chance to learn
  and grow, and there are endless internal career
  opportunities across multiple roles, disciplines, domains,
  and locations. If you are passionate, innovative, and
  excited to constantly raise the bar, you may just be our
  next NiCEr!
  
  Enjoy NiCE-FLEX!
  
  At NiCE, we work according to the NiCE-FLEX hybrid model,
  which enables maximum flexibility: 2 days working from the
  office and 3 days of remote work, each week. Naturally,
  office days focus on face-to-face meetings, where teamwork
  and collaborative thinking generate innovation, new ideas,
  and a vibrant, interactive atmosphere.
  
