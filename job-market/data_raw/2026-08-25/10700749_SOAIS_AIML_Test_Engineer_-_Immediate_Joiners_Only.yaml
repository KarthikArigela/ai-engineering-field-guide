  Job Description

  The candidate will be responsible for designing and
  executing comprehensive test strategies to ensure the
  accuracy, reliability, performance, scalability, and
  robustness of AI/ML solutions.

  Key Responsibilities:

  - Design and execute test strategies, test plans, test
    scenarios, and test cases for AI/ML applications.
  - Perform functional, integration, regression, system, API,
    and end-to-end testing.
  - Validate AI/ML model outputs against expected results and
    business requirements.
  - Test data quality, data pipelines, preprocessing, feature
    engineering, and data transformations.
  - Validate model performance using appropriate metrics such as
    accuracy, precision, recall, F1-score, ROC-AUC, MAE, and
    RMSE.
  - Identify and validate issues related to model bias, data
    drift, model degradation, and inconsistent predictions.
  - Perform testing of REST APIs and AI/ML services using tools
    such as Postman.
  - Develop and maintain automation test scripts using Python
    and frameworks such as PyTest.

  Qualifications

  - Basic to good understanding of Machine Learning concepts and
    algorithms.
  - Understanding of supervised and unsupervised learning.
  - Experience validating ML model predictions and outputs

  Additional Information

  All your information will be kept confidential according to
  EEO guidelines.
