description: |
  About Farsight

  Farsight is the agentic AI platform for financial services,
  currently helping investment banks and private equity firms
  fully automate entire, highly nuanced workflows. Today,
  institutions will spend 80% of their time gathering
  information for and creating first drafts of materials by
  hand before iterating on and refining their decks, models,
  and pitches. We not only give them that time back to focus
  on what is important, but we also bring new insights and
  knowledge to their materials that they wouldn’t be able to
  uncover without the help of our financial-focused AI.

  Our Team

  Our team has had a wide range of experience that uniquely
  equips us to capture this massive opportunity. Our team
  comes from leading financial institutions like Evercore,
  General Atlantic and Menlo Ventures, supercharged by
  scalable engineering and AI skills from companies including
  Amazon, Hugging Face and the MIT Media Lab. We've learned
  the ins and outs of building successful startups from
  previous work as founders and founding engineers. We focus
  on hiring the best so that we can become the best, so we
  hope you apply!

  We are entirely based in Manhattan, New York City, and are
  in-person 4 days a week (except Fridays, which are remote).

  Job Description

  As an AI Engineer at Farsight AI, you'll play a critical
  role in advancing our state-of-the-art AI platform. You
  will:

  - Design, build, and own agentic systems that produce client-
    ready financial deliverables — decks, models, and memos —
    end to end, from data ingestion to polished output.
  - Build the evaluation and quality systems behind generated
    deliverables: deterministic document checks, model-judged
    review, grounding and fidelity verification, and
    regression suites for non-deterministic outputs.
  - Turn proprietary data from our platform and customers into
    evidence-backed insight — building pipelines that
    discover, quantify, and verify patterns, and feed them
    back into how our systems draft and check.
  - Build and refine the retrieval systems that ground our
    deliverables in unstructured and structured financial
    data, ensuring every number and claim traces to its
    source.
  - Drive the next generation of agentic capabilities on the
    Farsight platform — composability, advanced function
    calling, and modular orchestration.
  - Shape what we build next: ideate directly on customer value,
    and help prioritize across time-to-market, execution risk,
    and impact.

  Desired Qualifications

  - 2+ years of experience deploying machine learning or LLM
    systems in production.
  - Experience building agentic systems: function calling, tool
    use, orchestration, and the reliability engineering that
    keeps multi-step systems on the rails.
  - Experience building and validating evaluations for LLM
    systems. You know why "ask a model to rate it 1–10" isn't
    an answer.
  - Experience building retrieval over unstructured and
    structured data, and working with documents as structured
    artifacts (mixed text, numeric, and tabular content;
    document formats and their internals; rendered-output
    analysis).
  - A real, evolving AI-assisted development workflow, with a
    verification story proportional to what you delegate.
  - Strong Python proficiency and deep, current fluency with
    frontier model APIs and their capabilities.

  Above and Beyond Qualifications

  - Experience evaluating generated documents or other complex,
    client-facing deliverables — especially combining
    deterministic checks with model-based judging.
  - Experience extracting reliable, quantified patterns from
    large, noisy real-world datasets — discovery pipelines
    where every claimed finding traces back to specific
    evidence.
  - Deep familiarity with financial data, documents, and
    workflows.

  Compensation & Benefits

  - Salary range: $200,000 to $300,000 annually, commensurate
    with experience.
  - Comprehensive medical, dental and vision insurance
  - Unlimited PTO

  Note: You'll need valid U.S. work authorization to join us.

  Please note that a background check and employment
  verification may be required for this position. We may
  obtain one or more background screening reports about you,
  solely for employment purposes.

  Equal Opportunity

  Farsight is proud to be an Equal Employment Opportunity and
