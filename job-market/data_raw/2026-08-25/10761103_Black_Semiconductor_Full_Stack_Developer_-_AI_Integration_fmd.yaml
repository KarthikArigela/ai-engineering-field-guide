description: |
  About Us

  We see the semiconductor industry as a realm of possibility.
  We see opportunity. We see the profound impact that our
  graphene solutions will have in transforming the industry.
  We invite you to join us in driving change with our
  fundamentally human-centered approach, uniting bright minds
  around a shared vision. The vision is: Prove to everybody
  that you can make a fundamental change. Prove with your
  knowledge and skills how things can be done differently.
  Together, we can change the paradigm of how the world
  connects.

  About Our Technology

  The semiconductor industry's growing demand for more
  powerful chips with higher bandwidth and lower power finds
  its solution in our technology. We connect chips to high-
  throughput, low-delay computing networks. The key lies in
  harnessing the physical properties of graphene to combine
  electronic computing with photonic communication, allowing
  countless chips to interact almost as if they were one. Our
  graphene photonic innovation increases computing power and
  efficiency to a new order of magnitude. In short, we connect
  chips to create powerful and energy-efficient networks,
  overcoming connectivity limitations in the semiconductor
  industry. We deliver the graphene solution.

  The Role

  Black Net is our internal digital platform — the operational
  backbone that keeps the company running as we scale. It
  handles everything from time tracking and absence management
  to project reimbursements, procurement, and more. It is not
  a side project: it is how our employees get things done
  every day. Black Net is greenfield in the truest sense. The
  architecture decisions are modern, the codebase is clean,
  and the product is expanding into new territory every
  quarter.

  As we grow rapidly toward our first pilot production in
  FabONE, the demands on our internal tooling are growing just
  as fast. We are looking for a Full Stack Developer with a
  genuine passion for AI-augmented development.

  In this role, you will not just build features — you will
  also be the person who brings AI-powered development
  practices into the team. You will set up tools like Claude
  Code and similar AI coding assistants, integrate them into
  our workflow, and help your colleagues get the most out of
  them. Part builder, part enabler.

  To Join Our Team, You Should Be Excited To:

  - Design and implement full-stack features across our internal
    network (Angular, Node.js, MongoDB)
  - Champion AI-augmented development within the team: set up,
    configure, and maintain tools like Claude Code, GitHub
    Copilot, Cursor, or similar
  - Collaborate closely with the Product Owner to translate
    requirements and user stories into working software
  - Contribute to architecture decisions as Black Net expands
    its feature surface (ERP integration, procurement
    workflows, and beyond)
  - Integrate AI coding agents and automation into Black Net's
    processes
  - Participate in code reviews with an eye for quality,
    maintainability, and scalability
  - Refine existing best practices and team agreements as the
    team grows
  - Occasionally run knowledge-sharing sessions so that all team
    members can benefit from AI coding tools

  Your Qualifications

  Must have:

  - At least 3 years of hands-on experience in full stack web
    development
  - Proficiency in TypeScript and experience with a modern
    frontend framework — Angular is our stack, but strong
    React or Vue candidates will be considered
  - Backend development experience with Node.js and REST API
    design
  - Hands-on experience with a document or relational database
    (we use MongoDB)
  - Active experience with at least one AI coding assistant
    (Claude Code, GitHub Copilot, Cursor, Codeium, or similar)
    — not just awareness, but genuine daily use
  - Ability to explain AI tooling and development concepts
    clearly to colleagues with varying technical backgrounds
  - A self-starter mindset: comfortable working in a small team
    where there is no large support structure, and where you
    will often define the way things get done

  Nice to have:

  - Background in B2B environments, building enterprise
    applications, internal tooling or integrating systems like
    ERP or HR (e.g. SAP, Personio, Workday)
  - Experience with LLM APIs (Anthropic, OpenAI, etc.), prompt
    engineering, agentic AI frameworks, or background job
    orchestration
  - Familiarity with Docker containerisation and CI/CD pipelines
    (e.g. GitHub Actions)

  What Makes This Role Different

  Most developer roles ask you to use the tools. This one asks
  you to shape how the whole team uses them. You will have
  real influence over how AI-augmented development takes root
  at Black Semiconductor — and the results will be visible
  across the entire company.

  At the same time, you are joining a company at one of the
  most exciting points in its journey: construction of FabONE
  has started, pilot production is planned for 2026, and the
  team is scaling fast.

  Our Work Culture

  People Over Processes. At Black Semiconductor, flexibility
  is key—we ensure work adapts to life, not the other way
  around. We champion work-life harmony, where careers are
  meaningful and enriching. Our processes are human-centric,
  allowing you to focus on what matters.

  Let's Grow Together. Your potential is our priority. We
  provide the autonomy to make a lasting impact and nurture
  your growth through a culture of continuous learning. We
  invest in your journey for professional and personal
  development.

  Your Health and Future Matter. Your well-being is paramount.
  We offer a comprehensive benefits package with outstanding
  insurance, pension and virtual stock options for your
  mental, physical, and financial health. Your peace of mind
  is our priority — in the present and future.

  We Live Openness. Collaboration and inclusivity are the
  cornerstones of our culture. We practice openness, fostering
  trust and respect. Individuality is our collective strength,
  fueling innovation and driving us forward.

  We connect chips — and people. We encourage qualified
  individuals from any background to apply. We foster an
  inclusive and supportive work environment that values
  collaboration, innovation, and growth. Join our team and be
  part of an organization dedicated to making a difference in
  the industry.

  Can you picture yourself in this role and our company? Let's
  connect.

  If your application results in an employment relationship,
  your Applicant Data will be transferred to our personnel
  records and processed in accordance with applicable legal
  requirements; otherwise, your Applicant Data will be
  retained for up to six (6) months after completion of the
  recruitment process. Read more about our privacy policy
  here.
