description: |
  Aptiv -Help shape the future of mobility.

  Imagine a world with zero vehicle accidents, zero vehicle
  emissions, and wireless vehicle connectivity all around us.
  Every day, we move closer to making that world a reality.
  Aptiv’s passionate team of engineers and developers creates
  advanced safety systems, high-performance electrification
  solutions and data connectivity solutions so that automakers
  can bring advanced capabilities to more people around the
  globe. This is how we enable sustainable mobility and help
  to prevent accidents caused by human error.

  We’re hiring an Electrical/Electronics Engineer to design
  and develop our automotive products in the areas of Active
  Safety and User-Experience. This position is located at TCI
  Bengaluru.

  Your Role

  Experience: 6-8 Yrs

  Job Location: Chennai

  Mandatory Skills: AWS DevOps with ML Ops Frameworks like ML
  Flow/ Air Flow & Python Scripting

  - Build and operate MLOps platforms on AWS supporting
    autonomous driving ML workloads
  - Implement and maintain highly available, multi‑zone training
    and deployment environments
  - Operate distributed, multi‑GPU training setups (e.g., Ray
    clusters)
  - Assist in maintaining infrastructure standards for compute,
    storage, networking, and security
  - Troubleshoot and resolve platform‑level issues impacting ML
    productivity
  - Implement and maintain ML pipelines using:
    - Apache Airflow for orchestration
    - MLflow for experiment tracking, model versioning, and
      lifecycle management
  - Support CI/CD pipelines for ML code, models, and
    infrastructure (GitHub‑based)
  - Ensure ML workflows are:
    - Reproducible
    - Traceable
    - Auditable (aligned with automotive engineering expectations)



  Your Background:

  Key ingredients for succeeding in this role are your:

  - 5+ years' experience, Strong hands‑on experience with AWS
    for ML workloads
  - Practical experience with:
    - Multi‑GPU / distributed training (Ray or equivalent)
    - Kubernetes / EKS
    - Infrastructure as Code (Terraform)
    - Airflow and MLflow
  - Proficient Python for automation, pipelines, and tooling

  Why join us?

  - You can grow at Aptiv. Whether you are working towards a
    promotion, stepping into leadership, considering a lateral
    career move, or simply expanding your network – you can do
    it here. Aptiv provides an inclusive work environment
    where all individuals can grow and develop, regardless of
    gender, ethnicity or beliefs.
  - You can have an impact. Safety is a core Aptiv value; we
    want a safer world for us and our children, one with: Zero
    fatalities, Zero injuries, Zero accidents.
  - You have support. Our team is our most valuable asset. We
    ensure you have the resources and support you need to take
    care of your family and your physical and mental health
    with a competitive health insurance package.

  Apply today and together let’s change tomorrow!

