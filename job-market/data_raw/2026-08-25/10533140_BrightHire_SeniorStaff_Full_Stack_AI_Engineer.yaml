title: Senior/Staff Full Stack AI Engineer
company: BrightHire
location: USA
remote: true
work_type: FULL_TIME
description: |
  BrightHire is a category-creating, high-growth, Series B
  software company with a mission to give everyone the hiring
  experience they deserve.

  We deliver on this mission by transforming the way many of
  the world’s leading companies build exceptional teams. We
  created the Interview Intelligence category, and our clients
  include some of the world’s most innovative companies—Canva,
  OpenAI, Ramp, Hubspot—up to the Fortune 500.

  Location

  Remote- US

  About the Role

  We’re looking for a Full Stack AI Engineer to help us build
  the next generation of AI-powered product experiences at
  BrightHire.

  In this role, you’ll own the end-to-end delivery of
  customer-facing AI features from early prototypes and prompt
  experiments through evals, backend systems, data modeling,
  and polished product interactions. You’ll work closely with
  Product and Design to move quickly, learn from users, and
  turn ambiguous AI product ideas into reliable, production-
  ready features that customers use every day.

  This is a role for an engineer with strong product taste,
  customer empathy, and the ability to make LLMs useful in
  real workflows. You care deeply about output quality, speed,
  accuracy, safety, and tone and you know how to iterate until
  the experience feels genuinely valuable to end users.

  You’ll work on features like:

  - Voice AI interviewers that create structured, high-quality
    candidate conversations and assessments.
  - Automatic interview coaching that provides tailored feedback
    and guidance based on an interviewer’s recent interviews,
    with customizable content.
  - AI candidate skills matrices that summarize evidence from
    interviews and map it to key skills aligned with the job
    description.
  - AI assistants that let users instantly query any detail
    about a candidate, interview, or hiring process using
    natural language.
  - Customizable interview summaries that enable customers to
    generate personalized summaries using their own structure,
    criteria, and tone.
  - And many more AI-native workflows that help hiring teams
    make better decisions.

  What You’ll Do

  - Prototype, build, and productionize AI features across the
    full stack.
  - Design prompt chains, retrieval flows, eval harnesses, and
    quality feedback loops.
  - Build backend systems, APIs, data models, and product
    surfaces that support AI-powered workflows.
  - Work with structured data, unstructured text, transcripts,
    job descriptions, interview notes, and customer-specific
    configurations.
  - Evaluate AI outputs for accuracy, usefulness, tone, safety,
    latency, and customer fit.
  - Partner closely with Product and Design to shape the user
    experience, not just implement requirements.
  - Iterate quickly based on real customer usage, feedback, and
    quality signals.
  - Make pragmatic technical decisions that balance speed,
    reliability, and product quality.

  What You’ll Bring

  - Real-world experience building generative AI applications
    end to end.
  - Experience with prompt engineering, prompt chains, evals,
    retrieval/vector search, and LLM-powered workflows.
  - Strong full-stack engineering skills, especially in Python
    and JavaScript/TypeScript.
  - Comfort designing backend logic, data models, APIs, and
    system architecture.
  - Experience working with both structured data, such as SQL,
    and unstructured data, such as transcripts, documents, and
    raw text.
  - Strong product instincts and the ability to reason from the
    customer’s perspective.
  - A sharp eye for quality: accuracy, tone, personality,
    safety, speed, and reliability all matter to you.
  - The ability to move quickly and independently while knowing
    when to collaborate, pair, or pull others in.
  - Strong judgment around what LLMs are good at, where they
    fail, and how to design product experiences that use them
    well.

  About our team

  - You’ll have the opportunity to work on high-impact projects
    in small, autonomous squads, with the flexibility to lead
    initiatives or focus as an individual contributor
    depending on your goals and interests.
  - Our developer experience is thoughtfully designed, with fast
    CI (< 10 minutes), 1-click deploys, strong observability,
    and a clean codebase that enables you to move quickly and
    confidently.
  - Our culture supports sustainable, focused work with fully
    remote roles, regular working hours, no-meeting
    Wednesdays, and flexible time off to recharge when needed.
  - Our team is composed of smart, collaborative, and genuinely
    kind people, creating an environment where you can learn,
    grow, and do your best work.

  Equal Employment Opportunity (EEO) Statement

  Our company does not discriminate in employment on the basis
  of race, color, religion, sex (including pregnancy and
  gender identity), national origin, political affiliation,
  sexual orientation, marital status, disability, genetic
  information, age, membership in an employee organization,
  retaliation, parental status, military service, or other
  non-merit factor.



  *Note to Recruiters and Placement Agencies: We do not accept
  unsolicited agency resumes. Please do not forward
  unsolicited agency resumes to our website. We will not pay
  fees to any third party agency or firm and will not be
  responsible for any agency fees associated with unsolicited
  resumes. Unsolicited resumes received will be considered our
  property.
