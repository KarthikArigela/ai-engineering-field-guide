description: |
  What You'll Do:

  Our mission is to architect strategic frameworks and end-to-
  end processes that create company-wide alignment in our
  commercial ways of working. We operationalize these
  frameworks through AI-enabled workflows, ensuring scalable,
  consistent, and efficient execution across the Client
  Solutions organization.

  As an AI Agent Software Engineer, you will build and
  maintain AI agents and AI-driven workflows using enterprise
  platforms such as DUST, Glean, Microsoft Copilot,
  Agentforce, and n8n. You will work closely with product,
  business, and IT teams to translate Client solutions teams
  use cases into reliable, scalable AI workflows and Agents.

  This role is suited for an engineer with solid software
  foundations who is growing into applied AI systems, with
  support from our Criteo agentic community.

  - Design and build AI-powered workflows and agents by
    translating business requirements into clear decision
    paths and automation logic that support defined use cases.
  - Leverage and configure AI agents to interact with existing
    business tools, systems, and data sources (e.g.,
    Salesforce, knowledge bases, internal and external tools),
    in partnership with IT teams
  - Configure and extend agent behavior using platforms such as
    DUST, Glean, Copilot, Agentforce, and n8n
  - Implement structured decision logic so agents can choose
    actions based on context and inputs
  - Support the deployment, monitoring, and maintenance of AI
    agents in production
  - Troubleshoot and debug AI workflows when outputs are
    incorrect or incomplete
  - Apply safety rules, permissions, and guardrails defined by
    the IT and business teams
  - Document workflows, agent behavior, and known limitations
    for internal users
  - AI workflows and agents that reliably support day-to-day
    Client solution teams processes.
  - Drive effciency gains through well-designed AI-assisted
    workflows & Agents.
  - Stable and predictable agent behavior aligned with business
    expectations.
  - Clear documentation that enables adoption and reuse.
  - Strong collaboration with senior engineers, IT, and business
    stakeholders.

  This position is based in Gurugram, India

  Shift Time : EMEA (1:30 PM IST to 10:30 PM IST)

  Who You Are:

  - 5+ years of Experience in software engineering or business
    application development
  - Hands-on experience working with AI-powered tools or
    platforms in a business context
  - Experience leveraging APIs and connecting systems and tools
  - Strong problem-solving and logical thinking skills
  - Ability to debug workflows and understand where automation
    or AI outputs break down
  - Clear communication skills and willingness to learn in a
    fast-evolving space

  We acknowledge that many candidates may not meet every
  single role requirement listed above. If your experience
  looks a little different from our requirements but you
  believe that you can still bring value to the role, we’d
  love to see your application!

  Who We Are:

  We’re Criteo, the Commerce Intelligence Platform. Criteo
  helps businesses turn shopper signals into commerce outcomes
  while delivering more relevant experiences for shoppers. We
  use proprietary commerce intelligence and AI decisioning to
  drive relevance for shoppers and performance for businesses.
  At Criteo, our culture is as unique as it is diverse. From
  our offices across the globe or from the comfort of home,
  our 3,600 Criteos collaborate together to build an open,
  impactful, and forward-thinking environment. We foster a
  workplace where everyone is valued, and employment decisions
  are based solely on skills, qualifications, and business
  needs—never on non-job-related factors or legally protected
  characteristics.

  What We Offer:

  🏢 Ways of working – Our hybrid model blends home with in-
  office experiences, making space for both.   📈 Grow with us
  – Learning, mentorship & career development programs. 💪 Your
  wellbeing matters – Health benefits, wellness perks & mental
  health support. 🤝 A team that cares – Diverse, inclusive,
  and globally connected. 💸 Fair pay & perks – Attractive
  salary, with performance-based rewards and family-friendly
  policies, plus the potential for equity depending on role
  and level.



  Additional benefits may vary depending on the country where
  you work and the nature of your employment with Criteo.
