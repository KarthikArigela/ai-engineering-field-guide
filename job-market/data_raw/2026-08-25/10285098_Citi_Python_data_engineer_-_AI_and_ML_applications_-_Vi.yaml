description: |
  The Applications Development Technology Lead Analyst is a
  senior level position responsible for establishing and
  implementing new or revised application systems and programs
  in coordination with the Technology team. The overall
  objective of this role is to lead applications systems
  analysis and programming activities. Responsibilities:

  - Partner with multiple management teams to ensure appropriate
    integration of functions to meet goals as well as identify
    and define necessary system enhancements to deploy new
    products and process improvements
  - Resolve variety of high impact problems/projects through in-
    depth evaluation of complex business processes, system
    processes, and industry standards
  - Provide expertise in area and advanced knowledge of
    applications programming and ensure application design
    adheres to the overall architecture blueprint
  - Utilize advanced knowledge of system flow and develop
    standards for coding, testing, debugging, and
    implementation
  - Develop comprehensive knowledge of how areas of business,
    such as architecture and infrastructure, integrate to
    accomplish business goals
  - Provide in-depth analysis with interpretive thinking to
    define issues and develop innovative solutions
  - Serve as advisor or coach to mid-level developers and
    analysts, allocating work as necessary
  - Appropriately assess risk when business decisions are made,
    demonstrating particular consideration for the firm's
    reputation and safeguarding Citigroup, its clients and
    assets, by driving compliance with applicable laws, rules
    and regulations, adhering to Policy, applying sound
    ethical judgment regarding personal behavior, conduct and
    business practices, and escalating, managing and reporting
    control issues with transparency.

  Qualifications:

  - 12+ years of relevant experience in an Engineering role
  - Experience working in Financial Services or a large complex
    and/or global environment.
  - 3+ Years of experience on BigData Technologies like Apache
    Spark , Hive, Hadoop & Storm.
  - Extremely strong with data structure, algorithms and design
    patterns.
  - Strong proficiency in programming languages such as Python
    with significant experience in Python for data
    manipulation and AI/ML pipeline scripting.
  - Knowledge on technologies like ELK, Docker, Kubernetes,
    Azure Cloud, AWS S3 etc
  - Proven experience designing and implementing large-scale
    data solutions for AI/ML applications.
  - Knowledge on NOSQL Databases like MongoDB, Hbase, Cassandra
    etc.
  - Knowledge in version control systems (e.g Git) and CI/CD
    pipelines.
  - Consistently demonstrates clear and concise written and
    verbal communication
  - Comprehensive knowledge of design metrics, analytics tools,
    benchmarking activities and related reporting to identify
    best practices
  - Demonstrated analytic/diagnostic skills
  - Ability to work in a matrix environment and partner with
    virtual teams
  - Ability to work independently, multi-task, and take
    ownership of various parts of a project or initiative
  - Ability to work under pressure and manage to tight deadlines
    or unexpected changes in expectations or requirements
  - Proven track record of operational process change and
    improvement

  Education:

  - Bachelor’s degree/University degree or equivalent experience
  - Master’s degree preferred

  This job description provides a high-level review of the
  types of work performed. Other job-related duties may be
  assigned as required.

