description: |
  We're seeking a future team member for the role of Senior
  Director, AI Solution Architect to join Eliza Frontier
  Solutions, a new team within AI Hub. This role is focused on
  shaping and delivering frontier AI solutions, defining
  technical architecture, and turning emerging AI capabilities
  into secure, scalable products for the firm. The role is
  located in New York, NY.

  In this role, you'll make an impact in the following ways:

  - Lead solution architecture for frontier AI products and
    identify key business applications within Eliza Frontier
    Solutions.
  - Review and refine end-to-end technical designs for AI
    applications and agentic workflows, with a focus on
    reusability, resilience, observability and commercial
    viability.
  - Guide technical direction for new projects by aligning user
    needs, platform strategy and implementation tradeoffs,
    with a focus on establishing patterns and golden paths.
  - Establish reusable patterns for AI engineering, platform
    integration, governance, and production readiness.
  - Act as a senior technical leader and advisor for complex
    cross-functional initiatives and key architecture reviews.

  To be successful in this role, we're seeking the following:

  - Strong experience designing and delivering enterprise
    software, platform and AI solutions in complex
    environments.
  - Deep understanding of AI engineering patterns, preferably
    with a background in Machine Learning (deep learning
    ideal)
  - Hands-on knowledge of AI/ML architecture across training,
    inference, feature pipelines, model serving,
    orchestration, agent protocols, etc.
  - Strong platform engineering skills across APIs,
    microservices, cloud infrastructure, CI/CD, observability,
    and secure deployment.
  - Experience working with AI platforms, developer platforms,
    or internal enablement products.
  - Ability to translate complex technical concepts into clear
    architecture decisions, delivery plans, and business
    outcomes, and ability to spot flaws and risks in designs.
  - Strong partnership and communication skills across
    engineering, product, risk, control, and senior
    stakeholders.
  - Bachelor's degree in computer science, engineering or a
    related discipline, or equivalent work experience
    required; advanced degree is beneficial
  - 15+ years of experience in software development required;
    experience in the securities or financial services
    industry is a plus.

  Preferred technical areas:

  - Applied AI, ML/optimization, orchestration and software
    architecture, including evaluation frameworks and
    guardrail design
  - Vector databases, retrieval systems, knowledge graphs,
    memory-based agents and agentic protocols
  - MLOps, model lifecycle tooling, and production AI
    observability
  - Experience with AI for engineering practices and agentic
    SDLC design, with an eye toward production scale and
    resilience

