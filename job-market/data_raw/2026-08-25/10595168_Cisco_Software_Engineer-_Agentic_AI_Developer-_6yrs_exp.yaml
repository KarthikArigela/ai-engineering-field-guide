description: |
  Meet the Team

  Join Cisco's Global Supply Chain Product Operations team,
  where innovation meets intelligent automation. Our team is
  transforming enterprise operations by leveraging Agentic AI,
  Generative AI, and cloud-native technologies to solve
  complex business challenges and drive operational excellence
  across Cisco's global supply chain.

  As part of this team, you'll collaborate with AI engineers,
  software developers, product managers, and business
  stakeholders to build next-generation AI-powered solutions
  that redefine enterprise workflows.

  Your Impact

  As an Agentic AI Developer, you will design, develop, and
  deploy intelligent AI agents that automate complex
  enterprise workflows using the latest Agentic AI frameworks
  and Large Language Models (LLMs).

  You will:

  - Design and develop Agentic AI solutions using LangChain,
    LangGraph, and modern orchestration frameworks.
  - Build Retrieval-Augmented Generation (RAG) pipelines using
    vector databases, embeddings, and enterprise knowledge
    sources.
  - Develop multi-agent workflows with tool calling, reasoning,
    and orchestration capabilities.
  - Integrate AI agents with enterprise applications using Model
    Context Protocol (MCP) and Google Agent-to-Agent (A2A)
    standards.
  - Build scalable backend services using Python and FastAPI.
  - Develop AI-powered applications leveraging GPT, Claude, and
    open-source LLMs.
  - Integrate data from enterprise platforms including Snowflake
    and other cloud data warehouses.
  - Deploy AI applications using Docker, Kubernetes/OpenShift,
    and cloud-native infrastructure.
  - Partner with cross-functional teams to translate business
    problems into scalable AI solutions.
  - Drive continuous innovation through prompt engineering,
    automation, and AI best practices.

  Minimum Qualifications

  - Bachelor's or Master's degree in Computer Science,
    Artificial Intelligence, Data Science, or related field.
  - 6+ years of experience in Python development and AI/ML
    application development.
  - Strong hands-on experience with:
    - Python
    - LangChain
    - LangGraph
    - FastAPI
    - SQL
  - Experience building RAG pipelines, embeddings, and vector
    database solutions.
  - Strong understanding of Large Language Models (LLMs)
    including GPT, Claude, or open-source models.
  - Experience with Docker, Kubernetes/OpenShift, and CI/CD
    pipelines.
  - Excellent problem-solving, communication, and stakeholder
    management skills.

  Preferred Qualifications

  - Experience with Agentic AI architectures, multi-agent
    systems, and AI orchestration frameworks.
  - Knowledge of Model Context Protocol (MCP) and Google Agent-
    to-Agent (A2A) standards.
  - Experience with Snowflake and enterprise data platforms.
  - Familiarity with Hugging Face Transformers, NLP, fine-
    tuning, and custom chatbot development.
  - Experience with cloud platforms such as Azure, AWS, or GCP.
  - Hands-on experience with pandas, NumPy, and visualization
    tools such as Streamlit or Tableau.
  - Exposure to Angular or full-stack application development.
  - Passion for innovation, continuous learning, and applying AI
    to solve real-world business challenges.

  This version follows Cisco's latest job description style
  while emphasizing Agentic AI, LLMs, RAG, Python, and
  enterprise AI engineering, making it attractive to
  experienced AI developers.

  Why Cisco?

  At Cisco, we’re revolutionizing how data and infrastructure
  connect and protect organizations in the AI era – and
  beyond. We’ve been innovating fearlessly for 40 years to
  create solutions that power how humans and technology work
  together across the physical and digital worlds. These
  solutions provide customers with unparalleled security,
  visibility, and insights across the entire digital
  footprint.

  Fueled by the depth and breadth of our technology, we
  experiment and create meaningful solutions. Add to that our
  worldwide network of doers and experts, and you’ll see that
  the opportunities to grow and build are limitless. We work
  as a team, collaborating with empathy to make really big
  things happen on a global scale. Because our solutions are
  everywhere, our impact is everywhere.

  We are Cisco, and our power starts with you.
