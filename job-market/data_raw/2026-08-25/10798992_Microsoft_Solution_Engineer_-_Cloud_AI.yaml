description: |
  Overview

  Join Microsoft as a Cloud & AI Platform (CAIP) Apps Solution
  Engineer supporting strategic customers in the Professional
  Services Operating Unit across EMEA. In this technical sales
  role, you will help customers modernize applications, build
  AI-infused solutions, and move from experimentation to
  secure, scalable production outcomes on Azure.

  This role is designed for candidates who understand
  professional services organizations, including consulting,
  advisory, audit, tax, legal, systems integration, or related
  client-service environments. You will connect Microsoft Apps
  + AI capabilities to high-value scenarios such as client
  delivery, knowledge reuse, proposal and pursuit workflows,
  secure collaboration, productivity at scale, and AI-assisted
  service delivery.

  The role requires deep Apps + AI expertise, with working
  knowledge of Azure Infrastructure patterns needed to host,
  secure, connect, operate, and scale production intelligent
  applications.

  Customer Scope: Strategic customers in the Professional
  Services Operating Unit across EMEA

  Primary Focus: Apps + AI, application modernization,
  intelligent applications, APIs, integration, and cloud-
  native architecture.

  Secondary Focus: Azure Infrastructure foundations for
  production intelligent applications, including landing
  zones, networking, identity, security, hybrid connectivity,
  resiliency, monitoring, and cost governance.

  Microsoft’s mission is to empower every person and every
  organization on the planet to achieve more. As employees we
  come together with a growth mindset, innovate to empower
  others, and collaborate to realize our shared goals. Each
  day we build on our values of respect, integrity, and
  accountability to create a culture of inclusion where
  everyone can thrive at work and beyond.

  Responsibilities

  Responsibilities

  - Lead technical sales engagements with strategic Professional
    Services OU customers through demos, PoCs, architecture
    workshops, hands-on labs, and hackathons.

  - Guide customers across application modernization, cloud-
    native architecture, APIs, microservices, containers,
    integration patterns, and AI-infused application design.

  - Design intelligent application and agentic workflow patterns
    using Azure application platform services, Azure AI
    Foundry, and GitHub Copilot.

  - Translate Apps + AI capabilities into professional services
    business outcomes, including client delivery efficiency,
    knowledge management, regulated workflow modernization,
    and reusable AI-enabled service assets.

  - Connect application modernization plans to Azure
    Infrastructure foundations such as landing zones,
    networking, identity, security, hybrid connectivity,
    resiliency, observability, and cost governance.

  - Build trusted advisor relationships with application
    leaders, enterprise architects, platform teams,
    infrastructure teams, security stakeholders, engineering
    teams, and business decision-makers.

  - Drive GitHub Copilot and AI-assisted engineering scenarios
    that improve developer productivity, software quality, and
    secure software delivery.

  - Resolve technical blockers, influence customer architecture
    decisions, and provide product feedback to Microsoft
    engineering.

  Technical Focus

  - Advanced Apps + AI expertise: Azure App Service, Azure
    Functions, Container Apps, AKS, API Management, Event
    Grid, Service Bus, Logic Apps, cloud-native architecture,
    DevOps, resiliency, observability, and security.

  - Advanced intelligent application expertise: Azure AI
    Foundry, Azure AI services, copilots, agentic workflows,
    agent orchestration, tool integration, grounding
    strategies, and production AI application lifecycle
    management.

  - GitHub expertise: GitHub Copilot, GitHub Actions, GitHub
    Advanced Security, AI-assisted software delivery, and
    developer productivity adoption patterns.

  - Working knowledge: Azure Infrastructure foundations
    including landing zones, Azure networking, identity and
    access, security posture, hybrid connectivity, Azure
    VMware Solution, compute, storage, monitoring, backup,
    disaster recovery, and cost management.

  Qualifications



  Required Qualifications

  - Extensive experience in technical pre-sales, consulting,
    software engineering, cloud architecture, application
    platform engineering, or infrastructure architecture.

  - Professional services industry experience, either serving
    professional services customers or working in consulting,
    advisory, audit, tax, legal, systems integration, or
    related client-service environments.

  - Demonstrated expertise in application modernization, cloud-
    native application architecture, integration patterns, and
    Apps + AI solution design.

  - Working knowledge of Azure Infrastructure architecture
    patterns needed to support production applications,
    including networking, identity, security, landing zones,
    resiliency, monitoring, and hybrid connectivity.

  - Ability to engage enterprise customers and influence
    technical decision-makers across application, platform,
    infrastructure, security, engineering, and business teams.

  - Experience leading customer technical engagements such as
    PoCs, MVPs, architecture design sessions, hands-on labs,
    workshops, or hackathons.

  Preferred Qualifications

  - Hands-on experience with Azure application platform
    services, Azure AI Foundry, Azure OpenAI, agentic
    workflows, copilots, RAG patterns, and responsible AI
    practices.

  - Experience with Azure Infrastructure services such as Azure
    landing zones, Azure networking, Azure Virtual Machines,
    Azure VMware Solution, Azure Arc, Azure Monitor, Backup,
    Site Recovery, and infrastructure security controls.

  - Experience with GitHub, GitHub Advanced Security, GitHub
    Actions, and GitHub Copilot adoption or enablement.

  - Ability to shape customer strategy through technical
    leadership, storytelling, executive-ready architecture
    narratives, and hands-on execution.



