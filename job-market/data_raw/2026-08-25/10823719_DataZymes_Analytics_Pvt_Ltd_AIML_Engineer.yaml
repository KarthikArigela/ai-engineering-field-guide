description: |
  We are looking for passionate and driven professionals to
  join DataZymes, a next-generation analytics and data science
  company founded in 2016. At DataZymes, we focus on driving
  technology-led innovation and helping clients maximize the
  value of their data and analytics investments through
  cutting-edge platforms and consulting expertise. If you are
  excited about working on impactful solutions in the
  healthcare analytics space and want to be part of a high-
  performance, fast-growing team, we’d love to hear from you.
  About the Role:



  This role is a highly specialized business-facing AI team.
  We deliver professional AI products and productionize first-
  of-its-kind AI applications. We work cross-functionally to
  shape long-term strategic priorities and initiatives
  alongside engineering, product, and developer relations. We
  look for individuals with strong, unique specializations to
  improve the overall strength of the team. This role is the
  right fit for you if you love working with customers,
  teammates, and fuelling your curiosity for the latest trends
  in GenAI, LLMOps, and ML more broadly.



  Objectives of role:



  o   Develop cutting-edge GenAI solutions, incorporating the
  latest techniques from Mosaic AI research to solve business
  problems

  o   Own production rollouts of consumer and internally
  facing GenAI applications

  o   Collaborate cross-functionally with the product and
  engineering teams to influence priorities and shape the
  product roadmap

  o   Required /Proven experience with the following:

  o   Experience in building GenAI applications, including
  RAG, multi-agent systems, Text2SQL, fine-tuning, etc., with
  tools such as HuggingFace, LangChain, and DSPy

  o   Expertise in deploying production-grade GenAI
  applications, including evaluation and optimizations

  o   Extensive years of hands-on industry data science
  experience, leveraging common machine learning and data
  science tools, i.e. pandas, scikit-learn, PyTorch, etc.

  o   Experience in building production-grade machine learning
  deployments on AWS, Azure, or GCP

  o   Graduate degree in a quantitative discipline like
  Computer Science or equivalent practical experience

  o   Passion for collaboration, life-long learning, and
  driving business value through AI

  o   [Preferred] Experience in using the Databricks
  Intelligence Platform and Apache Spark? to process large-
  scale distributed datasets

  o   We require fluency in English and willingness to work
  across time zones.

  Desirable Skills:



  o   Experience in communicating and/or teaching technical
  concepts to non-technical and technical audiences alike.

  o   Highly motivated/self-starter with a sense of ownership,
  willingness to learn, and desire to succeed.

  o   Strong teamwork, problem-solving, and analytical skills.

  o   Good understanding of Pharma Quality Standards and
  Practices.

  Additional Comments:



  o   Databricks expertise is a strength for this role. We
  Prefer Immediate Joiners.
