description: |
  About Lyra Health

  Lyra Health is a leading provider of evidence-based mental
  health care, serving more than 20 million people globally in
  partnership with employers and more than 100 million through
  health plan and partner relationships. The company has
  delivered more than 15 million sessions of mental health
  care, published more than 35 peer-reviewed studies, and
  delivered unmatched outcomes in terms of access, clinical
  effectiveness, and cost efficiency. Extensive peer-reviewed
  research confirms Lyra’s transformative care model helps
  people recover twice as fast and results in a 26% annual
  reduction in overall healthcare claims costs. Lyra is
  transforming access to life-changing mental health care
  through Lyra Empower, the only fully integrated, AI-powered
  platform combining the highest-quality care and technology
  solutions.

  About the Role

  We are seeking a Staff ML/AI Engineer to define and drive
  the architectural vision for Lyra’s machine learning and
  generative AI technology landscape. In this role, you will
  serve as a technical anchor across the engineering and data
  organizations—architecting enterprise-scale AI platforms,
  setting technical strategy for high-impact AI/ML
  initiatives, and ensuring our AI products operate with top-
  tier reliability, security, and medical precision.

  The ideal candidate is a seasoned technical leader who
  excels at translating complex healthcare challenges into
  scalable platform solutions, building consensus across
  cross-functional leadership, and elevating the technical bar
  for the entire engineering organization.

  Lyra is for you if you

  - Thrive on working with brilliant teammates to solve complex,
    meaningful problems
  - Are passionate about making a social impact and supporting
    people at their most challenging moments
  - Enjoy cross-functional collaboration with physicians,
    therapists, data scientists, data analysts and product
    managers

