  About ActiveCampaign:

  ActiveCampaign is the autonomous marketing platform for
  people at the heart of the action. It empowers teams to
  automate their campaigns with AI agents that imagine,
  activate, and validate–freeing them from step-by-step
  workflows and unlocking limitless ways to orchestrate their
  marketing.

  With AI, goal-based automation, and 1,000+ app integrations,
  agencies, marketers, and owners can build cross-channel
  campaigns in minutes–fine-tuned with billions of data points
  to drive real results for their unique business.

  ActiveCampaign is the trusted choice to help businesses
  unlock a new world of boundless opportunities–where ideas
  become impact and potential turns into real results.

  As a global multicultural company, we are proud of our
  inclusive culture which embraces diverse voices,
  backgrounds, and perspectives. We don’t just celebrate our
  differences, we believe our diversity is what empowers our
  innovation and success. You can find out more about our DEI
  initiatives here.

  Perks and benefits:

  At ActiveCampaign, we prioritize employees’ well-being and
  professional growth by cultivating a culture centered on
  collaboration and innovation. When you join our team, you’ll
  not only have the opportunity to make a significant impact,
  but also enjoy a range of benefits tailored to support your
  personal and career development.

  Here are some of the benefits we offer:

  -Comprehensive Health & Wellness: Top-tier benefits package
  that includes a fully-covered High Deductible Health Plan
  (HDHP), complimentary access to telehealth services, and a
  free subscription to Calm.

  -Growth & Development: Access to LinkedIn Learning,
  professional development programs, and career growth
  opportunities in a fast-growing organization.

  -Generous Paid Time Off: Recharge and take the time you need
  to maintain work-life balance with open PTO.

  -Total Rewards: Generous 401(k) matching with immediate
  vesting, quarterly perks with commuter and lunch benefits
  for hub based employees or a stipend for remote workers, and
  a four-week paid sabbatical with bonus after five years.

  -Collaborative Culture: Work alongside brilliant, passionate
  colleagues in an environment that values innovation,
  teamwork, and mutual support.

  ActiveCampaign is an equal opportunity employer. We recruit,
  hire, pay, grow and promote no matter of gender, race,
  color, sexual orientation, religion, age, protected veteran
  status, physical and mental abilities, or any other
  identities protected by law.

  Our Employee Resource Groups (ERGs) strive to foster a
  diverse inclusive environment by supporting each other,
  building a strong sense of belonging, and creating
  opportunities for mentorship and professional growth for
  their members.
