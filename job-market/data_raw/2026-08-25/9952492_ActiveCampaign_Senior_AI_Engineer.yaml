description: |
  Are you a hands-on technical builder passionate about
  driving business innovation through cutting-edge AI
  architecture? ActiveCampaign is seeking an Sr AI Engineer -
  AI Transformation Hub who will sit at the critical
  intersection of infrastructure and business innovation. In
  this role, you will not just help build capabilities—you
  will take meaningful ownership of how key parts of our
  internal AI agent platform evolve. You will help design the
  technical foundation that enables teams across the company
  to build, deploy, operate, and improve AI agents at scale.

  This position is focused on architecting and owning the core
  capabilities that make agent development reliable, reusable,
  and scalable. You will design and improve deployment
  patterns, integrations, observability frameworks, and shared
  infrastructure that allow us to move beyond simple
  automation into complex, mission-critical business processes
  across the company. Beyond building platform capabilities,
  you will work directly with cross-functional teams to move
  agents from ambitious ideas to production-ready solutions.
  You will help define technical patterns, shape how
  capabilities should be built, and unblock teams day to
  day—ensuring our infrastructure directly supports strategic
  business impact.

  What Good Looks Like

  - Agent teams can build faster because core infrastructure,
    standards, and patterns are already in place.
  - Shared capabilities are designed with enough quality and
    reusability that multiple teams can adopt them without
    starting from scratch.
  - Agent deployment becomes more reliable, supportable, and
    scalable across a growing set of business use cases.
  - Technical blockers around integrations, permissions,
    environments, and monitoring are reduced over time because
    this role proactively addresses root causes.
  - The AI Transformation Hub has stronger technical direction
    around how core agent capabilities should be designed,
    implemented, and operated.
  - Builders across the organization are better supported
    because they have a senior technical partner who can guide
    design decisions, debug issues, and help move critical
    work forward.

