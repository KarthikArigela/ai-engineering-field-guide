description: |
  AI Firm Deployed Engineer, Private Capital Markets

  This is a role for private capital professionals who want to
  shape how AI gets used in the industry — not observe it from
  the sideline. You've executed deals, managed portfolios, and
  navigated the full investment lifecycle — and you understand
  how firms in this space actually operate, from deal sourcing
  and underwriting through to LP reporting and portfolio
  oversight. At Intapp, you'll bring that experience to bear
  as a strategic advisor, helping private equity, venture
  capital, and private credit firms deploy AI in ways that
  reflect how their work actually gets done.

  Day to day, you'll work directly with firm leadership and
  investment teams — identifying where AI creates the most
  value across the deal lifecycle, then deploying Intapp
  Celeste's AI agents, playbooks, and workflows to deliver it.
  You'll translate the unwritten methods of a firm — how they
  source, structure, diligence, and monitor — into AI-powered
  processes that run at scale. Fluency with AI tools and a
  practitioner's instinct for where risk lives in a
  transaction are what this role runs on.

  What you will do:

  As an AI Firm Deployed Engineer, Private Capital Markets,
  you can expect to:

  - Advise firm stakeholders — from managing directors and
    investment committee members to heads of operations and
    portfolio management — on where AI creates strategic value
    across deal sourcing, execution, monitoring, and LP
    relations.
  - Lead the deployment of Intapp Celeste's AI agents,
    coworkers, and playbooks, configuring them around the
    firm's investment methodology, data standards, and risk
    framework so agents reason the way the firm's own deal
    teams do.
  - Translate deal workflows into AI-ready processes — mapping
    how transactions move from sourcing through close,
    identifying where automation can accelerate execution, and
    advising on where human judgment remains essential.
  - Drive adoption across investment and operational teams by
    building credibility on practitioners' terms, running
    walkthroughs and hands-on training that meet each group
    where they are rather than asking them to adapt to the
    technology.
  - Bring real deal experience back into Intapp's product
    strategy, working with Industry Architects and Product
    leaders to ensure Celeste continues to reflect the
    realities of private capital workflows.

  What you will need:

  Intapp is looking for intellectually curious, self-motivated
  professionals who like to get hands-on to contribute to the
  overall success of the business and their team. To apply for
  this AI Firm Deployed Engineer, Private Capital Markets
  role, you will ideally have:

  - Substantive experience in private capital — private equity,
    venture capital, private credit, real assets, or
    investment banking — with hands-on exposure to deal
    execution, underwriting, portfolio management, or fund
    operations.
  - A working understanding of how a firm runs as a business —
    how deals are sourced, structured, diligenced, and
    monitored, and how that work translates into LP reporting,
    fund performance, and business development.
  - Hands-on experience applying AI to investment or commercial
    workflows — using LLMs for market analysis, deal
    screening, memo drafting, or process design — and a clear-
    eyed view of where they add value and where they introduce
    risk.
  - Practical fluency in prompt engineering, AI workflow design,
    and agentic tooling — enough to configure and iterate on
    deployments without writing code, and enough to evaluate
    outputs with a deal professional's eye for accuracy and
    consequence.
  - The credibility and communication skills to advise senior
    decision-makers, translate complex ideas clearly, and
    build trust with investment professionals who are
    skeptical of technology but open to the right
    conversation.
  - The judgment to work in open-ended, client-facing situations
    and the drive to keep learning a product and a market that
    move quickly.

  What you will gain at Intapp:

  At Intapp, you'll get the opportunity to bring your talents
  and intellectual curiosity to create better outcomes for our
  people and our clients. You'll be part of a growing public
  company, with a modern work environment that's connected yet
  flexible and where your professional growth and well-being
  are top priorities. We'll collaborate and grow together,
  supporting each other in a positive, open atmosphere that
  fosters creativity, innovation, and teamwork.

  Here, you will have the opportunity to:

  - Expand Your Skills: Unlock your potential with professional
    development opportunities supported by a community of
    experienced professionals. We offer reimbursement for
    training and continuing education to help you stay ahead
    in your career.
  - Enjoy Where You Work: Thrive in our modern, open offices
    designed to inspire creativity and collaboration. Our
    complimentary lunches and fully stocked kitchens ensure
    you have everything you need to stay energized throughout
    the day.
  - Support What Matters Most: Our comprehensive wellness and
    flexible time off programs and our benefits are designed
    to care for you and your family. Our family-formation
    benefits and support during your family-building journey
    ensure you have the resources you need when it matters
    most. We believe in giving back and supporting our
    communities with paid volunteer time off and a donation
    matching program for the causes you care about.

  Join us and be a part of a collaborative and welcoming
  culture where your contributions are valued, and your
  professional growth is a priority. Together, we are building
  a company of long-term value that we can all be proud of.

  Your actual base salary will be determined by factors such
  as relevant experience, geographic location, and internal
  equity. In addition to base salary, variable compensation
  and equity may also be included.

  Intapp provides equal employment opportunities to all
  qualified applicants and will make hiring decisions without
  regard to race, color, sex, sexual orientation, gender
  identity or expression, religion, national origin or
  ancestry, age, disability, marital status, pregnancy,
  protected veteran status, protected genetic information,
  political affiliation, or any other characteristic protected
  by federal, state or local laws.

  Please note: Intapp will not hire through text message,
  social media, or email alone. We will never extend a job
  offer unless you have been contacted directly by an Intapp
  recruiter and have participated in the interview process
  which will generally consist of 3 or more virtual or in
  person meetings. Please note that Intapp only uses company
  email addresses, which contain “@intapp.com” or
  “@dealcloud.com” to communicate with candidates via email.
  Intapp will never ask for financial information of any kind
  or for any payment during the job application process. We
  post all legitimate job openings on the Intapp Career Site
  at https://www.intapp.com/working-at-intapp/. If you believe
  you were a victim of such a scam, you may contact your local
  authorities. Intapp is not responsible for any claims,
  losses, damages, or expenses resulting from scammers.
