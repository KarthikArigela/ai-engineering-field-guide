title: "Senior Business Systems Engineer, AI & Automation"
company: Inspiren
location: USA
remote: true
work_type: FULL_TIME
description: |
  Who We Are

  Inspiren offers a complete and connected technology
  ecosystem for senior living. Founded by Michael Wang, a
  former Green Beret and cardiothoracic nurse, Inspiren was
  built on the belief that compassionate care and technology
  can and should coexist.

  Our integrated solutions fit into existing workflows and
  give senior-living operators greater visibility into what is
  happening across their communities. Supported by nurse
  specialists and powerful analytics, Inspiren helps teams
  make informed clinical and operational decisions that
  improve efficiency, outcomes, and quality of care.

  You’ll join a growing global team united by a shared
  mission, with a new NYC office designed to strengthen
  collaboration and in-person connection.

  About the Role

  Inspiren is building one of the most ambitious AI-native
  companies in digital health, and we are looking for someone
  to help us work like it. As our Senior Business Systems
  Engineer, AI & Automation, you will own two halves of the
  same problem: the core business systems Inspiren runs on:
  Salesforce and NetSuite,  and the intelligent automation
  layered on top of them. You will administer those systems
  well, keep their data trustworthy, and build the agent
  workflows that let the business do more without adding
  headcount. The person who takes this role will define how
  Inspiren operates at scale for years to come.

  Most automation roles inherit someone else's CRM and are
  told to work around it. Here you own the system of record
  and the automation on top of it, which means you can fix
  problems at the root instead of building workarounds on a
  broken foundation.

  What makes this role different from a typical business
  systems job is the coaching mandate. You will bring
  specialist-level knowledge of agentic workflow design, but
  your real measure of success is whether the teams you
  partner with can eventually solve their own automation
  problems. That means knowing when to build, when to advise,
  and when to step back so others can grow. Strong technical
  judgment and strong relationship skills are both required
  here. One without the other will not work. And the stakes
  are meaningful: the workflows you build support care for
  real seniors in real facilities, not abstract enterprise
  productivity.

  What You'll Do

  - Design & Build: Design, build, and own production-grade
    automation and agent workflows using Salesforce Flow,
    NetSuite workflows and saved searches, Claude,  Slack,
    Linear, and Notion, running the full project lifecycle
    from discovery and scoping through launch and ongoing
    iteration.
  - Data Integrity & Governance: Own data quality in both
    systems of record: deduplication, record ownership
    hygiene, field-level validation, and the accuracy of the
    revenue and pipeline metrics leadership reports on.
    Enforce data governance and PHI boundary standards across
    all automations, ensuring workflows comply with HIPAA
    requirements and Inspiren data policies by design, not as
    an afterthought.
  - Release & Change Management: Run disciplined change
    management for both platforms — sandbox-first development,
    documented change requests, tested releases, rollback
    plans, and version control so configuration is auditable
    and no change is locked to its original author.
  - Business Systems Administration: Own day-to-day
    administration of Salesforce and NetSuite — users and
    licenses, profiles, roles and permission sets, objects and
    fields, page layouts, record types, validation rules,
    approval processes, reports and dashboards. You are the
    accountable admin for both platforms, not a ticket-taker
    in front of a vendor.
  - Quote-to-Cash & Systems Integration: Build and maintain the
    integrations that connect the commercial and financial
    stack — Salesforce to NetSuite, plus HubSpot, Slack,
    Notion, and Linear — so opportunity, order, invoice, and
    revenue data stay consistent across systems without manual
    reconciliation.
  - Discovery & Prioritization: Partner with stakeholders across
    RevOps, Finance, Sales, Product Support, Clinical Support,
    Marketing, Implementation, TechOps, Product, Design, and
    Engineering to identify high-value automation and systems
    improvements, and maintain a single cross-functional
    roadmap covering both business systems work and AI
    initiatives, keeping team leads aligned on priorities and
    sequencing.
  - Strategy & Best Practices: Act as an internal thought
    partner on business systems architecture and AI automation
    strategy — knowing when a workflow deserves automation,
    when a process should be fixed instead, when configuration
    beats code, and setting best practices for responsible AI
    usage across the org.
  - Prompt Engineering & Evaluation: Engineer reliable system
    prompts and agent configurations for Claude-based
    automations, with a disciplined approach to testing and
    evaluating agent behavior before and after production
    deployment.
  - Documentation & Lifecycle: Produce clear playbooks and
    system documentation so teams can understand and extend
    what you build, and so the next admin can pick up the
    platform without archaeology.
  - Coaching & Enablement: Upskill team members across functions
    on both the business systems and the AI tooling, building
    their ability to solve their own problems, and drive
    genuine adoption through hands-on coaching and change
    management.
  - Toolset Ownership: Evaluate new platforms, maximize the
    value of existing tools, and own selection decisions as
    the stack grows.
  - Impact Measurement: Track and report the measurable business
    impact of your work: time reclaimed, error rates reduced,
    throughput improved, data quality up.

  What You Bring

  - Experience: 4+ years in business systems, technical
    operations, revenue operations, workflow automation, or a
    comparable systems role at a tech company, with clear
    accountability for measurable outcomes, not just
    delivering projects.
  - Hands-on Salesforce administration depth: you have been the
    accountable admin for a production org — permission sets
    and sharing models, custom objects and fields, Flow
    Builder, validation rules, approval processes, reports and
    dashboards, sandbox-to-production deployment. Salesforce
    Administrator certification or equivalent demonstrated
    experience.
  - ERP administration experience: hands-on NetSuite
    administration — roles and permissions, custom records and
    fields, saved searches, workflows, and the reporting
    layer. Deep experience with a comparable ERP plus a
    credible plan to ramp on NetSuite will be considered.
  - Quote-to-cash fluency: you understand how an opportunity
    becomes an order, an invoice, and recognized revenue, and
    where that chain typically breaks between CRM and ERP.
  - Data hygiene and migration chops: you have cleaned up a
    messy org — bulk data operations, deduplication, ownership
    reassignment, mass updates — and you do it carefully, with
    backups and a rollback path.
  - Specialist-level agentic workflow knowledge: you have built
    multi-step systems with real integrations, conditional
    logic, and error handling using Claude, Zapier, n8n,
    Slack, Linear, Notion, and Salesforce. You know their
    capabilities and limits intimately.
  - Prompt engineering fluency: you design and iterate on system
    prompts and agent configurations to get reliable,
    predictable behavior from LLMs, and you have a methodology
    for evaluating agent outputs and catching failure modes
    before they reach production.
  - Technical fluency, whether from a software engineering
    background or built through hands-on practice: you read
    API docs, understand data structures and payloads, debug
    integration failures, and pick up unfamiliar platforms
    without hand-holding.
  - A track record of building trust with non-technical
    stakeholders, especially in Finance and RevOps: you ask
    good questions, translate tradeoffs clearly, and drive
    adoption without requiring top-down mandates.
  - An AI-native working style: AI tools are core to how you
    work, not a feature. You can describe specific agent
    systems and AI workflows you have designed, what failed,
    and what you built next.
  - A coaching instinct: you get more satisfaction from a team
    member building their first automation independently than
    from solving it for them. You have helped non-technical
    people level up before and know how to make complex tools
    feel approachable.
  - Sound data governance judgment: you think naturally about
    PHI boundaries, HIPAA requirements, segregation of duties
    in financial systems, and responsible automation design,
    and you would never route sensitive data through a
    workflow without understanding where it goes and who can
    see it.

  Bonus Skills

  - Salesforce Advanced Administrator or Platform App Builder
    certification; NetSuite Administrator or SuiteFoundation
    certification.
  - Scripting depth in either platform: SuiteScript, or the
    ability to read and debug Apex and SOQL even if you do not
    write it day to day.
  - Experience with iPaaS or integration middleware — Celigo,
    Boomi, Workato, MuleSoft — connecting CRM and ERP.
  - CPQ, billing, or revenue recognition tooling experience.
  - Familiarity with LangChain or similar agent orchestration
    frameworks for multi-agent architectures.
  - Hardware or physical-product business model experience:
    inventory, RMA, and supply chain data in an ERP.
  - Experience at a growth-stage company building workflows
    before the playbook existed.

  What You’ll Get

  At Inspiren, you’ll help reshape how older adults live and
  age with greater safety, connection, and dignity. Here’s how
  we support the people making that possible:

  - Competitive Compensation — A strong base salary and variable
    compensation where applicable.
  - Ownership in Our Future — Equity that gives you a stake in
    the impact and value we’re building together.
  - Growth and Recognition — Semiannual reviews that recognize
    your contributions and support your continued development.
  - AI Tools and Training — Access to leading AI tools and
    company-wide training that help you work smarter and
    strengthen your skills.



  For U.S.-Based Employees

  - Health and Wellness — Comprehensive medical, dental, and
    vision coverage, mental-health resources, and employee-
    assistance programs.
  - Financial Protection — A 401(k) retirement plan, HSA and FSA
    options, and company-paid life and disability insurance.
  - Time to Recharge — Flexible PTO, five paid sick days
    annually, company-observed holidays, and company-wide
    recharge periods designated each year.
  - Family Support — Up to 12 weeks of paid parental leave for
    bonding, additional leave for birthing parents, fertility
    and family-building benefits, and paid caregiver and
    bereavement leave.
  - Flexible Work Support — Hybrid and remote arrangements based
    on the role and location, along with home-office,
    internet, or phone reimbursement where applicable.

  Don’t meet every qualification?

  Research shows that women and people of color may be less
  likely to apply unless they meet every qualification. If
  you’re excited about this role but don’t check every box, we
  encourage you to apply—we’d love to hear from you.
