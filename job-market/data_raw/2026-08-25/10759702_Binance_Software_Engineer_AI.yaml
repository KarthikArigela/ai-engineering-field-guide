description: |
  Binance is a leading global blockchain ecosystem behind the
  world’s largest cryptocurrency exchange by trading volume
  and registered users. We are trusted by over 250 million
  people in 100+ countries for our industry-leading security,
  user fund transparency, trading engine speed, deep
  liquidity, and an unmatched portfolio of digital-asset
  products. Binance offerings range from trading and finance
  to education, research, payments, institutional services,
  Web3 features, and more. We leverage the power of digital
  assets and blockchain to build an inclusive financial
  ecosystem to advance the freedom of money and improve
  financial access for people around the world.



  We're seeking an experienced AI Agent Engineer to design,
  develop, and optimize intelligent AI agents that can
  autonomously perform complex tasks. You'll be at the
  forefront of creating autonomous systems that can reason,
  plan, and execute actions to solve real-world problems.

  Responsibilities

  - Design and implement AI agent architectures that can
    understand user requests, reason through complex problems,
    and execute multi-step plans
  - Develop frameworks for AI agents to interact with various
    tools, APIs, and services
  - Create mechanisms for effective human-AI collaboration,
    including clarification, feedback, and guidance
  - Optimize agent performance for reliability, accuracy, and
    efficiency
  - Build monitoring and evaluation systems to assess agent
    performance and identify areas for improvement
  - Collaborate with cross-functional teams to integrate agents
    into products and workflows
  - Stay current with the latest research and developments in AI
    agent technology

  Qualifications

  - Bachelor’s or Master’s degree in Computer Science, AI, or
    related field
  - 3+ years of experience building AI/ML systems, with a focus
    on autonomous agents
  - Strong programming skills, particularly in Python,Golang
  - Experience with large language models (e.g., GPT, Claude,
    Gemini) and prompt engineering
  - Knowledge of agent frameworks such as LangGraph, AutoGen, or
    similar technologies
  - Understanding of reinforcement learning, planning
    algorithms, and decision-making systems
  - Familiarity with tools, APIs, and infrastructure needed for
    agent deployment
  - Experience with workflow orchestration and system design
  - Excellent problem-solving and analytical thinking skills
  - Strong communication and collaboration abilities
  - Experience developing production-grade AI agents that
    operate in real-world environments
  - Background in cognitive architectures or symbolic reasoning
    systems
  - Knowledge of safety and alignment techniques for AI agents
  - Experience with retrieval-augmented generation (RAG) systems
  - Familiarity with autonomous agent evaluation frameworks
  - Contributions to open-source agent projects or research
  - Winners of ACM, NOI and other algorithm competitions

  Why Binance

  • Shape the future with the world’s leading blockchain
  ecosystem

  • Collaborate with world-class talent in a user-centric
  global organization with a flat structure

  • Tackle unique, fast-paced projects with autonomy in an
  innovative environment

  • Thrive in a results-driven workplace with opportunities
  for career growth and continuous learning

  • Competitive salary and company benefits

  • Work-from-home arrangement (the arrangement may vary
  depending on the work nature of the business team)



  Binance is committed to being an equal opportunity employer.
  We believe that having a diverse workforce is fundamental to
  our success.

  By submitting a job application, you confirm that you have
  read and agree to our Candidate Privacy Notice.
