description: |
  Who are we?

  Smarsh empowers its customers to manage risk and unleash
  intelligence in their digital communications. Our growing
  community of over 6500 organizations in regulated industries
  counts on Smarsh every day to help them spot compliance,
  legal or reputational risks in 80+ communication channels
  before those risks become regulatory fines or headlines.
  Relentless innovation has fueled our journey to consistent
  leadership recognition from analysts like Gartner and
  Forrester, and our sustained, aggressive growth has landed
  Smarsh in the annual Inc. 5000 list of fastest-growing
  American companies since 2008.

  Smarsh is hiring a senior backend/platform engineer to build
  and scale agentic AI systems for enterprise use. You will
  build fast-moving, early-stage Python services that
  integrate AI capabilities into a production agentic
  platform. Your scope spans workflow execution, scale,
  reliability, and platform hardening as we grow.

  This is not a generic backend role. The focus is building
  and designing agentic systems, shipping working software,
  and solving hard platform problems in a fast-moving AI-
  native environment. You will join a small, high-velocity
  cross-functional group and own problems end to end,
  designing and building from scratch, making fast
  architectural calls, and driving ideas from whiteboard to
  working system with a small, high-agency team.

