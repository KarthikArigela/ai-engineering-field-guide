description: |
  Position Summary:

  As an AI Developer, you will design, build, and optimize AI-
  powered tools, automations, and workflows that enhance
  creative production across Wellcom HOME. Working closely
  with production teams, engineers, creatives, and AI
  specialists, you'll transform business challenges into
  scalable AI solutions that improve efficiency, quality, and
  innovation.

  This role combines software development, AI integration, and
  workflow automation to create production-ready systems that
  support content creation, asset management, CGI, VFX, and
  marketing operations.

  Key Responsibilities:

  - Design and develop AI-powered applications, services, and
    internal tools.
  - Build scalable automation workflows that improve creative
    and production processes.
  - Integrate Large Language Models (LLMs), computer vision,
    generative AI, and machine learning technologies into
    existing production pipelines.
  - Develop APIs and backend services that connect AI solutions
    with internal systems.
  - Collaborate with creative, production, CGI, VFX, and
    technology teams to identify automation opportunities.
  - Optimize AI models for speed, accuracy, reliability, and
    cost efficiency.
  - Build reusable components and internal frameworks that
    accelerate AI development.
  - Troubleshoot production issues and continuously improve
    system performance.
  - Maintain documentation for AI tools, workflows, and
    technical implementations.
  - Stay current with emerging AI technologies and recommend
    innovative applications that enhance Wellcom HOME.

  Required Qualifications:

  - Bachelor's degree in Computer Science, Software Engineering,
    Artificial Intelligence, or equivalent experience.
  - Strong programming experience with Python.
  - Experience building applications using modern AI frameworks
    and APIs.
  - Experience working with REST APIs and cloud services.
  - Understanding of machine learning concepts and prompt
    engineering.
  - Experience with version control (Git).
  - Strong problem-solving and analytical skills.
  - Excellent communication and collaboration abilities.

  Preferred Qualifications:

  - Experience with Generative AI platforms (OpenAI, Anthropic,
    Gemini, etc.).
  - Experience using LangChain, LangGraph, LlamaIndex, or
    similar AI orchestration frameworks.
  - Experience deploying AI applications to cloud platforms such
    as Azure, AWS, or Google Cloud.
  - Familiarity with Docker and containerized deployments.
  - Knowledge of vector databases and Retrieval-Augmented
    Generation (RAG).
  - Experience integrating AI into production, marketing, media,
    or creative workflows.
  - Experience with image, video, or 3D AI technologies.

  Technical Skills:

  Programming

  - Python
  - JavaScript / TypeScript
  - SQL

  AI & Machine Learning

  - Large Language Models (LLMs)
  - Prompt Engineering
  - Retrieval-Augmented Generation (RAG)
  - AI Agents
  - Machine Learning fundamentals

  Cloud & Infrastructure

  - Azure, AWS, or Google Cloud
  - Docker
  - Git
  - CI/CD

  Development

  - REST APIs
  - Backend development
  - Workflow automation
  - Data integration

  Success in This Role:

  A successful AI Developer will:

  - Build AI solutions that streamline production workflows.
  - Improve operational efficiency through automation.
  - Deliver reliable, scalable AI applications for internal
    teams.
  - Collaborate effectively across creative, production, and
    engineering functions.
  - Drive continuous innovation while maintaining security,
    quality, and performance standards.
