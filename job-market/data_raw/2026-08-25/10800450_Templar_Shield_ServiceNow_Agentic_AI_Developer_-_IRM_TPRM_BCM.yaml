description: |
  This is a remote position.

  ServiceNow Agentic AI Developer - IRM, TPRM & BCM (Remote -
  U.S.)

  Templar Shield is expanding its next-generation AI
  governance and automation practice, and we’re looking for a
  developer who lives at the intersection of ServiceNow,
  intelligent automation, and real-world risk management. If
  you want to help shape how enterprises deploy agentic AI on
  the ServiceNow platform, this role is the frontier.

  About Templar Shield

  Templar Shield is a boutique, high-performance consulting
  firm and ServiceNow Elite Partner specializing in Integrated
  Risk Management (IRM), Cybersecurity, Third-Party Risk
  (TPRM), Operational Resilience, and AI Governance. We
  support critical-infrastructure, financial-services,
  healthcare, energy, and public-sector clients across North
  America and EMEA.

  Our Agentic AI practice builds adaptive, autonomous
  solutions powered by ServiceNow Now Assist, AI Control
  Tower, GenAI Frameworks, and custom multi-agent
  architectures—all aligned with NIST, ISO, and emerging AI
  regulations.

  Role Overview

  The ServiceNow Agentic AI Developer designs, builds, and
  deploys agentic AI features and generative workflows for
  IRM, TPRM, BCM/OpsRes, using Now Assist and the latest LLM
  capabilities embedded in the Now Platform.

  This role blends ServiceNow development expertise with an
  understanding of risk domains and real-world business logic.
  You’ll build AI-assisted assessments, autonomous evidence
  collection, agent-driven policy workflows, generative risk
  analysis, and multi-agent orchestration patterns that reduce
  manual load and increase accuracy.

  Key Responsibilities

  Agentic AI & Now Assist Development



  - Build Now Assist experiences for IRM, TPRM, and BCM
    (assessments, risks, issues, controls, policies,
    continuity plans).
  - Design and implement agentic workflow patterns: retrieval
    agents, orchestration agents, evaluator agents, and
    autonomous task bots.
  - Use ServiceNow’s LLM APIs, vector search, and prompt
    orchestration frameworks to generate context-aware
    outputs.
  - Implement GenAI-powered automations such as: - Risk/control
    summaries - Third-party due-diligence generation -
    Automated policy mappings - Business impact analysis
    generation - Incident/impact narrative generation for BCM

  IRM, TPRM, BCM Development



  - Configure and customize IRM Workspaces, Risk Modules,
    Continuous Monitoring, Controls, Issues, and Regulatory
    Taxonomies.
  - Build TPRM intake flows, inherent/residual scoring models,
    and evidence automation.
  - Extend BCM modules for continuity planning, crisis
    management, and notification workflows.

  Technical Architecture & Integration



  - Use Script Includes, Flow Designer, IntegrationHub, and
    custom API integrations to connect external data sources
    to AI agents.
  - Implement vector database integrations, retrieval pipelines,
    and structured document ingestion for agentic AI
    retrieval.
  - Ensure performance, security hardening, and responsible AI
    safeguards are embedded into all features.

  Delivery, Documentation & Governance



  - Work with Templar Shield architects and SMEs to translate
    business problems into AI-driven solutions.
  - Document prompts, agent behaviors, evaluation criteria, and
    decision logs for auditability.
  - Support clients with AI governance alignment such as NIST AI
    RMF, ISO 42001, and emerging state/federal AI rules.






  Requirements

  Required Qualifications



  - 3+ years of ServiceNow development experience (IRM/TPI/BCM
    strongly preferred).
  - Hands-on experience with Now Assist, GenAI Frameworks, AI
    Control Tower, or LLM-powered features.
  - Strong skills in JavaScript, Script Includes, Glide APIs,
    Flow Designer, and IntegrationHub.
  - Ability to design multi-step workflows and intelligent
    automations.
  - Understanding of at least one risk domain: IRM, TPRM, BCM,
    OpsRes, Compliance, or Security.
  - Ability to write-clean prompts and evaluation logic for AI
    outputs.
  - Comfort working with JSON, APIs, and RAG-style data
    patterns.

   Preferred / Nice-to-Have



  - Experience with vector search, embeddings, or document-
    retrieval pipelines.
  - Familiarity with NIST AI RMF, ISO 42001, EU AI Act, or other
    AI governance frameworks.
  - ServiceNow certifications such as: - CSA (Certified System
    Administrator) - CAD (Certified Application Developer) -
    CIS-IRM, CIS-TPRM, CIS-BCM - AI-specific Now
    certifications (preferred)
  - Experience with Python, TypeScript, or microservices.
  - Prior consulting or professional-services delivery
    experience.






  Benefits

  What We Offer



  - Competitive compensation + annual performance-based bonus
  - 100% remote-first culture
  - Employer-sponsored health, dental, LTD, and life insurance
    coverage
  - 401(k) with company match
  - Paid training and certification sponsorship
  - Ability to work on cutting-edge AI projects across regulated
    industries
  - A collaborative culture where your process designs shape
    real industry solutions



   How to Apply

  Send your résumé and a short note describing one AI-enabled
  workflow you’ve built (on ServiceNow or elsewhere) to
  careers@templarshield.com with the subject line:ServiceNow
  Agentic AI Developer
