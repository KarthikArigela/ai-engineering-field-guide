description: |
  Job Summary

  Responsible for the design, development, implementation, and
  integration of new or existing applications, systems,
  programs, or software including documentation, testing and
  collaborating with business users to understand requirements
  and translating into technical solutions. Analyze customer
  needs and design technical solutions to meet business and
  technical requirements.

  Job Description

  MAJOR RESPONSIBILITIES:

  - Research, plan, design, document, develop, test and deploy
    high quality software that meets business requirements.
  - Troubleshoot and support all deployed software, resolving
    issues and errors and improving performance and security
    as needed in a timely manner.
  - Using appropriate technology capabilities, designs, writes,
    tests, debugs and documents new and modified processes.
  - Evaluate application and program modifications to ensure
    solutions align with business and technical requirements.
  - Collaborate with end user and product owners to prototype,
    refine, test, and debug as needed.
  - Adhere to and enforce all company standards related to
    software development including security, performance and
    resiliency standards.
  - Contribute to and promote the continuous improvement of all
    software development practices. Engage in continuous
    improvement of one’s own skill set, both technical and
    non-technical.
  - Maintain an understanding of software development industry
    trends and best practices and promote their introduction
    to the company as applicable.
  - Consult with all software system stakeholders to provide any
    necessary technical expertise and analysis.
  - Develop a solid understanding of the company business domain
    and apply this understanding to all software development
    activities.
  - Comply with all company policies and procedures and
    governmental regulatory mandates.

  MINIMUM JOB REQUIREMENTS:

  Education:

  - Typically requires a Bachelor's degree in business or IT
    related field.

  Work Experience:

  - At least 2 years of experience in software development.

  Knowledge / Skills / Abilities:

  - Knowledge of software development life cycle protocols.
  - Knowledge of applicable programming language.

