description: |
  Senior Microsoft AI & Automation Engineer

  Location

  Jammu or Gurugram - onsite (India)



  About the Role

  We are seeking a Senior Microsoft AI & Automation Engineer
  to design, build, and support AI-powered business solutions
  leveraging Microsoft technologies. The successful candidate
  will have hands-on experience implementing AI, automation,
  analytics, and Microsoft 365 integrations that deliver
  measurable business outcomes.

  This is a delivery-focused role requiring practical
  experience in deploying production-ready solutions using
  Microsoft Copilot, Power Platform, Azure AI services, and
  Microsoft 365 technologies. Security, governance, and
  compliance should be incorporated into all solutions from
  design through deployment.

  Requirements

  Key Responsibilities

  AI & Copilot Solutions

  - Design, build, and deploy AI-powered
       business solutions using Microsoft Copilot, Copilot
  Studio, Azure OpenAI, and related Microsoft AI technologies.
  - Develop AI agents and agentic workflows
       to automate business processes and improve
  productivity.
  - Integrate Large Language Models (LLMs)
       into operational and customer-facing workflows.
  - Support adoption and optimization of
       Microsoft Copilot capabilities across the organization.

  Automation & Integration

  - Build and maintain automation solutions
       using Microsoft Power Automate.
  - Integrate Microsoft 365 services
       including Teams, SharePoint, Outlook, and OneDrive.
  - Design scalable workflows that eliminate
       manual effort and improve operational efficiency.
  - Support API-based integrations with
       internal and external business systems.

  Data & Analytics

  - Develop dashboards, reports, and business
       insights using Power BI.
  - Design and optimize data models and
       reporting solutions.
  - Translate business requirements into
       meaningful analytics and KPI reporting.

  Azure & Cloud Solutions

  - Utilize Azure services to support AI
       workloads, automation pipelines, integrations, and data
  solutions.
  - Support Azure OpenAI deployments and
       related AI services.
  - Collaborate in the deployment and
       maintenance of secure cloud-based solutions.

  Governance & Security

  - Implement security, compliance, and
       governance controls across AI and automation platforms.
  - Support Microsoft Purview implementation,
       Data Loss Prevention (DLP), and information protection
  policies.
  - Promote responsible AI practices and
       compliance with organizational standards.

  Solution Delivery

  - Produce technical documentation, solution
       designs, and operational runbooks.
  - Collaborate with business stakeholders to
       translate requirements into scalable solutions.
  - Participate in testing,
       deployment, support, and continuous improvement
  activities.

  Required Skills & Experience

  - 5+ years of experience working with
       Microsoft technologies.
  - Strong hands-on experience with Microsoft
       Power Automate.
  - Experience delivering AI-powered
       automation solutions in production environments.
  - Experience with Microsoft Copilot,
       Copilot Studio, Azure OpenAI, or comparable AI
  platforms.
  - Strong Power BI dashboard development and
       data modelling experience.
  - Working knowledge of Microsoft Azure
       services and cloud architectures.
  - Experience integrating Microsoft 365
       platforms including Teams, SharePoint, and Outlook.
  - Experience using GitHub for source
       control and collaboration.
  - Strong analytical, troubleshooting, and
       problem-solving skills.
  - Excellent documentation
       and stakeholder communication abilities.

  Preferred Skills

  - Experience with Azure AI Services and
       Azure OpenAI.
  - Experience building AI agents and
       conversational AI solutions.
  - Hands-on experience with Microsoft
       Purview and DLP policies.
  - Knowledge of security, compliance, and
       governance frameworks.
  - Experience with Power Apps.
  - Experience working in enterprise or
       managed services environments.
  - Microsoft certifications in Azure, Power
       Platform, Security, or AI technologies.
  - Experience delivering
       solutions for UK, US, or global customers.

  Benefits

  - Provident Fund
  - Performance bonuses
  - Employee's State Insurance Corporation
  - Medical Insurance
  - Night Allowances
  - Pick and Drop facilities (Only for Female Staff)
  - Day outs for Staff
  - Team Lunches/Dinners
  - Maternity/ Paternity leaves
  - Retirement Benefits
  - Paid Time Off
  - Flexible work schedules and workplace perks like on-site
    snacks
  - Flexible working
