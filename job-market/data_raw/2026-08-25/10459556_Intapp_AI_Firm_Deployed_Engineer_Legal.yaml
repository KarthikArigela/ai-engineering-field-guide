description: |
  AI Firm Deployed Engineer, Legal

  This is a role for lawyers who want to shape how AI gets
  used in the profession — not observe it from the sideline.
  You've built foundational legal skills — in private practice
  or in-house — and you're drawn to the strategic and
  operational side of how firms run, not just the work product
  they produce. At Intapp, you'll use that combination to
  advise law firms on how to adopt and deploy AI, working
  directly with their leadership and practice groups to
  identify where it creates the most value.

  Day to day, you'll act as a trusted advisor to firm
  stakeholders — partners, heads of innovation, and legal
  operations leads — helping them understand what Intapp
  Celeste's AI agents and workflows can do for their specific
  context, then seeing that through to adoption. You'll shape
  how AI gets embedded into legal practice: mapping workflows,
  advising on where automation applies, and making sure
  deployments reflect how the firm actually works. Fluency
  with AI tools and a lawyer's instinct for risk and judgment
  are what this role runs on.

  What you will do:

  As an AI Firm Deployed Engineer, Legal, you can expect to:

  - Advise law firm stakeholders — from managing partners to
    innovation leads — on where AI creates strategic value,
    helping them prioritise the workflows and practice areas
    where Celeste can have the most impact.
  - Lead the deployment of Intapp Celeste's AI agents,
    coworkers, and playbooks, configuring them around the
    firm's methods, language, and risk standards so agents
    reason the way the firm's own practitioners do.
  - Translate legal workflows into AI-ready processes — mapping
    how work moves through a firm, identifying where judgment
    can be supported by automation, and advising on where
    human oversight remains essential.
  - Drive adoption across practice groups by building
    credibility with lawyers on their terms, running
    walkthroughs and training that meet each group where they
    are rather than asking them to adapt to the technology.
  - Bring client experience back into Intapp's product strategy,
    working with Industry Architects and Product leaders to
    ensure Celeste continues to reflect how legal work
    actually gets done.

  What you will need:

  Intapp is looking for intellectually curious, self-motivated
  professionals who like to get hands-on to contribute to the
  overall success of the business and their team. To apply for
  this AI Firm Deployed Engineer, Legal role, you will ideally
  have:

  - A foundation in legal practice — law firm associate or in-
    house experience — with enough exposure to understand how
    firms are structured, how decisions get made, and where
    friction lives in day-to-day legal work.
  - Hands-on experience applying AI to legal or commercial
    workflows — using LLMs for drafting, research, contract
    analysis, or process design — and a clear-eyed view of
    where they add value and where they introduce risk.
  - Practical fluency in prompt engineering, AI workflow design,
    and agentic tooling — enough to configure and iterate on
    AI deployments without writing code, and enough to
    evaluate outputs with a lawyer's eye for accuracy and
    consequence.
  - The instinct and communication skills to advise senior
    stakeholders, translate complex ideas clearly, and build
    trust with audiences who are skeptical of technology but
    open to the right conversation.
  - A record of building something — a knowledge resource, a
    process improvement, a training program, or a tool — that
    shows you can turn expertise into something others rely
    on.
  - The judgment to work in ambiguous, client-facing situations
    and the drive to keep learning a product and a market that
    move quickly.

  What you will gain:

  At Intapp, you'll get the opportunity to bring your talents
  and intellectual curiosity to create better outcomes for our
  people and our clients. You'll be part of a growing public
  company, with a modern work environment that's connected yet
  flexible and where your professional growth and well-being
  are top priorities. We'll collaborate and grow together,
  supporting each other in a positive, open atmosphere that
  fosters creativity, innovation, and teamwork.

  Here, you will have the opportunity to:

  - Expand Your Skills: Unlock your potential with professional
    development opportunities supported by a community of
    experienced professionals. We offer reimbursement for
    training and continuing education to help you stay ahead
    in your career.
  - Enjoy Where You Work: Thrive in our modern, open offices
    designed to inspire creativity and collaboration. Our
    complimentary lunches and fully stocked kitchens ensure
    you have everything you need to stay energized throughout
    the day.
  - Support What Matters Most: Our comprehensive wellness and
    flexible time off programs and our benefits are designed
    to care for you and your family. Our family-formation
    benefits and support during your family-building journey
    ensure you have the resources you need when it matters
    most. We believe in giving back and supporting our
    communities with paid volunteer time off and a donation
    matching program for the causes you care about.

  Join us and be a part of a collaborative and welcoming
  culture where your contributions are valued, and your
  professional growth is a priority. Together, we are building
  a company of long-term value that we can all be proud of.

  Your actual base salary will be determined by factors such
  as relevant experience, geographic location, and internal
  equity. In addition to base salary, variable compensation
  and equity may also be included.

  Intapp provides equal employment opportunities to all
  qualified applicants and will make hiring decisions without
  regard to race, color, sex, sexual orientation, gender
  identity or expression, religion, national origin or
  ancestry, age, disability, marital status, pregnancy,
  protected veteran status, protected genetic information,
  political affiliation, or any other characteristic protected
  by federal, state or local laws.

  Please note: Intapp will not hire through text message,
  social media, or email alone. We will never extend a job
  offer unless you have been contacted directly by an Intapp
  recruiter and have participated in the interview process
  which will generally consist of 3 or more virtual or in
  person meetings. Please note that Intapp only uses company
  email addresses, which contain “@intapp.com” or
  “@dealcloud.com” to communicate with candidates via email.
  Intapp will never ask for financial information of any kind
  or for any payment during the job application process. We
  post all legitimate job openings on the Intapp Career Site
