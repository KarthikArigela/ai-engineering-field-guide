description: |
  This is an exciting opportunity to partner with an elite
  enterprise AI consultancy and build our North American
  footprint from the ground floor. We are looking for someone
  to design 0-to-1 solutions for the world’s most premium
  luxury, fashion, beauty, travel, and entertainment brands.

  About Converteo North America

  Converteo helps enterprise organizations turn experimental
  AI pilots into production-grade agent systems. Backed by the
  massive infrastructure and stellar reputation of our
  established European parent firm - founded in 2007, with
  450+ experts serving 200+ major enterprises - headquartered
  in Paris, with offices in New York, Toronto, and Madrid. We
  are launching an aggressive expansion into the North
  American market.

  - Location: Remote (United States).
  - Travel: Occasional travel for client sessions and team
    alignment.
  - Employment Type: Full-time (W-2 Staff).
  - Eligibility Requirement: Must be a US Citizen. (Sponsorship
    or non-citizen hiring is unavailable due to client
    security frameworks).
  - Reports to: Partner, North America.

  Why This Role Exists

  Our model is product-led: engineering reusable AI agents
  adapted for enterprise clients. Because our clients are
  premium brands, visual design and interaction fluidness are
  core business drivers.

  We need a rare Senior Product Design Engineer at the
  intersection of UX and AI-accelerated frontend execution.
  Using a high-velocity "vibe coding" workflow, you will not
  just draw layouts—you will fluidly manifest designs into
  interactive code using generative tools, focusing on high-
  end visual polish.

  What Success Looks Like (Your First 90 Days)

  - First 3 Weeks: Own, architect, and stand up our core Design
    System in code.
  - First 60 Days: High-fidelity gloss-up of 4–5 existing demos
    to meet premium visual and brand standards.
  - First 90 Days: Conceive, code, and deploy 4–5 net-new,
    highly interactive demos from scratch to serve as primary
    commercial assets.

  Who You Are

  - 0-to-1 execution mindset: You love the chaos of a blank
    canvas and are energized by turning abstract, ambiguous
    ideas into functional software overnight, rather than
    optimizing legacy platforms.
  - Designer first with a high bar for craft: A product designer
    with a strong visual foundation and an uncompromising eye
    for polish. You obsess over micro-interactions, flawless
    spacing, and fluid, frictionless animations.
  - AI-native designer who builds in code: You use AI coding
    assistants like Cursor, Claude Code, v0, Bolt, and Replit
    (paired with deep mastery of Figma and design systems) to
    rapidly translate concepts into working, near-production-
    grade prototypes.
  - Shipped AI-native features to production: You understand the
    unique challenges of building with LLMs—designing for non-
    determinism, creating delightful experiences around
    unpredictable outputs, and innovating UX patterns that
    make AI feel intuitive.

  What You Will Own

  - Build & Evolve the Design System: Create reusable component
    libraries spanning Figma and code to establish strict
    platform consistency.
  - Rapid Prototyping: Use AI-assisted coding (Cursor, Claude
    Code, v0, Bolt) and automation tools (Dust, Zapier/Make)
    to turn ideas into working prototypes in days, not
    quarters.
  - Validate Before Production: Test concepts with real data and
    users to prove value before engineering commits resources.
  - Hand Off to Engineering: Deliver functional prototypes and
    validated learnings to the AI Engineer to re-architect,
    scale, and ship to production.
  - Lead Delivery: Orchestrate scope, milestones, and quality
    across core products and client engagements.
  - Inform Strategy: Guide the Partner on core platform
    direction—deciding what becomes part of the reusable
    foundation versus custom client work.
  - Drive Reuse & Productization: Templatize solutions across
    clients and feed delivery insights back into the core
    product.
  - Lead the Build Pod: Set priorities and unblock the AI
    Engineer and Product Designer through product ownership
    and influence.

  Compensation & Benefits

  - Base Salary Range: $135,000 – $185,000 USD (Based on
    geographic market tier).
  - Benefits: 20 days PTO, winter closure, 11 paid holidays,
    Summer Fridays, 401K Match
