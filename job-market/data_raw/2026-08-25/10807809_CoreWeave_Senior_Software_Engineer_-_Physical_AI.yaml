  Equal Opportunity & Accommodations

  CoreWeave is an equal opportunity employer, committed to
  fostering an inclusive and supportive workplace. All
  qualified applicants and candidates will receive
  consideration for employment without regard to race, color,
  religion, sex, disability, age, sexual orientation, gender
  identity, national origin, veteran status, or genetic
  information.

  As part of this commitment and consistent with the Americans
  with Disabilities Act (ADA), CoreWeave will ensure that
  qualified applicants and candidates with disabilities are
  provided reasonable accommodations for the hiring process,
  unless such accommodation would cause an undue hardship. If
  reasonable accommodation is needed, please contact:
  careers@coreweave.com.

  Export Control Compliance

  This position requires access to export controlled
  information. To conform to U.S. Government export
  regulations applicable to that information, applicant must
  either be (A) a U.S. person, defined as a (i) U.S. citizen
  or national, (ii) U.S. lawful permanent resident (green card
  holder), (iii) refugee under 8 U.S.C. § 1157, or (iv) asylee
  under 8 U.S.C. § 1158, (B) eligible to access the export
  controlled information without a required export
  authorization, or (C) eligible and reasonably likely to
  obtain the required export authorization from the applicable
  U.S. government agency.  CoreWeave may, for legitimate
  business reasons, decline to pursue any export licensing
  process.
