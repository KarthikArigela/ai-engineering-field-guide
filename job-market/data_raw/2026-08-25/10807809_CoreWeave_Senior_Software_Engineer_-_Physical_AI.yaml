description: |
  CoreWeave is The Essential Cloud for AI™. Built for pioneers
  by pioneers, CoreWeave delivers a platform of technology,
  tools, and teams that enables innovators to build and scale
  AI with confidence. Trusted by leading AI labs, startups,
  and global enterprises, CoreWeave combines superior
  infrastructure performance with deep technical expertise to
  accelerate breakthroughs and turn compute into capability.
  Founded in 2017, CoreWeave became a publicly traded company
  (Nasdaq: CRWV) in March 2025. Learn more at
  www.coreweave.com.

  What You’ll Do:

  The Physical AI Engineering Team at CoreWeave is responsible
  for building and scaling the core platform that powers the
  world’s most advanced engineering simulation and AI
  workflows. From evolving distributed architecture to
  enabling the next generation of agentic applications and
  physical AI, this team delivers the performant, reliable,
  and scalable foundation trusted by the world’s largest
  engineering companies.

  About the role:

  We’re seeking a Senior Software Engineer to help build and
  scale our platform as we meet growing demand from the
  world’s largest engineering companies. This is a hands-on
  engineering role where you’ll deliver critical features and
  services across the full software lifecycle – from design
  and testing to deployment, operations, and reliability.
  You’ll contribute to our platform’s evolution to a more
  distributed architecture, helping make it agentic ready for
  the next generation of AI applications.

  In this role, you will:

  - Engineering & Architecture
  - Hands-On Development
  - Team Mentorship & Collaboration

  Who You Are:

  - 6+ years of software engineering experience.
  - Solid software engineering breadth across deployment and
    CI/CD, automated testing, and production reliability
    (observability, incident response).
  - Experience with distributed systems, building and operating
    backend services end-to-end.
  - Experience designing APIs and service interfaces.
  - Security-minded development, including
    authentication/authorization (e.g., OAuth) and secure-by-
    default practices.
  - Strong Python development skills with production experience.
  - Experience with Kubernetes in production.
  - Familiarity with workflow orchestration tools (Temporal,
    Airflow, Kubeflow, or similar).
  - Cloud platform experience (AWS preferred, Azure & GCP a
    plus).
  - Familiarity with data processing frameworks (Spark, Athena,
    Ray, or similar) a plus.
  - Strong technical communication and collaboration skills.

  Wondering if you’re a good fit? We believe in investing in
  our people, and value candidates who can bring their own
  diversified experiences to our teams – even if you aren’t a
  100% skill or experience match. Here are a few qualities
  we’ve found compatible with our team. If some of this
  describes you, we’d love to talk.

  - Technical Excellence: You write clean, maintainable code and
    design systems that scale.
  - Operational Rigor: You care about testing, deployments, and
    what happens after code ships – reliability, monitoring,
    and on-call health.
  - Pragmatic Problem-Solver: You balance perfectionism with
    shipping, making smart trade-offs between short-term
    delivery and long-term goals.
  - Strong Leadership: You proactively identify problems and
    drive solutions forward.
  - Mentorship Mindset: You elevate others through knowledge
    sharing and patient guidance.
  - Ownership Mentality: You take full responsibility for
    outcomes and drive initiatives to completion.
  - Customer Obsession: You understand that our success is
    measured by our customers’ success.

  Why CoreWeave?

  At CoreWeave, we work hard, have fun, and move fast!  We’re
  in an exciting stage of hyper-growth that you will not want
  to miss out on. We’re not afraid of a little chaos, and
  we’re constantly learning. Our team cares deeply about how
  we build our product and how we work together, which is
  represented through our core values:

  - Be Curious at Your Core
  - Act Like an Owner
  - Empower Employees
  - Deliver Best-in-Class Client Experiences
  - Achieve More Together

  We support and encourage an entrepreneurial outlook and
  independent thinking. We foster an environment that
  encourages collaboration and enables the development of
  innovative solutions to complex problems. As we get set for
  takeoff, the organization's growth opportunities are
  constantly expanding. You will be surrounded by some of the
  best talent in the industry, who will want to learn from
  you, too. Come join us!

  The base salary range for this role is 98,000 GBP to 130,000
  GBP. The starting salary will be determined based on job-
  related knowledge, skills, experience, and market location.
  We strive for both market alignment and internal equity when
  determining compensation. In addition to base salary, our
  total rewards package includes a discretionary bonus, equity
  awards, and a comprehensive benefits program (all based on
  eligibility).

  What We Offer

  The range we’ve posted represents the typical compensation
  range for this role. To determine actual compensation, we
  review the market rate for each candidate which can include
  a variety of factors. These include qualifications,
  experience, interview performance, and location.

  In addition to a competitive salary, we offer a variety of
  benefits to support your needs. The benefits below reflect
  our US-based offerings for full-time employees; for roles in
  other locations, benefits vary and are shared during the
  hiring process. These include:

  - Medical, dental, and vision insurance - 100% paid for by
    CoreWeave
  - Company-paid Life Insurance
  - Voluntary supplemental life insurance
  - Short and long-term disability insurance
  - Flexible Spending Account
  - Health Savings Account
  - Tuition Reimbursement
  - Ability to Participate in Employee Stock Purchase Program
    (ESPP)
  - Mental Wellness Benefits through Spring Health
  - Family-Forming support provided by Carrot
  - Paid Parental Leave
  - Flexible, full-service childcare support with Kinside
  - 401(k) with a generous employer match
  - Flexible PTO
  - Catered lunch each day in our office and data center
    locations
  - A casual work environment
  - A work culture focused on innovative disruption

