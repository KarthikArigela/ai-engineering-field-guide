description: |
  Data AI/ML (Artificial Intelligence and Machine Learning)
  Engineering involves the use of algorithms and statistical
  models to enable systems to analyze data, learn patterns,
  and make data-driven predictions or decisions without
  explicit human programming. AI/ML applications leverage vast
  amounts of data to identify insights, automate processes,
  and solve complex problems across a wide range of fields,
  including healthcare, finance, e-commerce, and more. AI/ML
  processes transform raw data into actionable intelligence,
  enabling automation, predictive analytics, and intelligent
  solutions. Data AI/ML combines advanced statistical
  modeling, computational power, and data engineering to build
  intelligent systems that can learn, adapt, and automate
  decisions.

  A.P. Moller – Maersk is the global leader in container
  shipping services. The business operates in 130 countries
  and employs 80,000 staff. An integrated container logistics
  company, Maersk aims to connect and simplify its customers’
  supply chains. Today, we have more than 180 nationalities
  represented in our workforce across 131 Countries and this
  mean, we have elevated level of responsibility to continue
  to build inclusive workforce that is truly representative of
  our customers and their customers and our vendor partners
  too.

  The team - who are we:

  We are an ambitious team with the shared passion to use
  data, data science (DS), machine learning (ML),

  advanced simulation, optimization and engineering excellence
  to make a difference for our customers.

  We are a team, not a collection of individuals. We value our
  diverse backgrounds, our different personalities and

  strengths & weaknesses. We value trust and passionate
  debates. We challenge each other and hold each other

  accountable. We uphold a caring feedback culture to help
  each other grow, professionally and personally.



  We Offer - This Is What You Get

  You will be part of the APM Terminals team within Global
  data and analytics (GDA). We believe data and AI are crucial
  to how we will operate, grow, and shape our industry’s
  future. Our Data and AI Foundation is the platform making
  this possible – unifying trusted data across our business
  and fuelling advanced analytics and AI solutions. It’s
  central to our ambitious journey of becoming a truly data-
  driven, AI-enabled organization.

  We’re looking for a hands-on Engineering Manager to build
  and scale this foundation. This is a unique opportunity for
  someone who’s as comfortable diving into code and
  architecture as guiding a team – a leader who can inspire
  great engineers while ensuring AI is built into the core of
  our platform.

  What you’ll do

  - Lead the development of a global Data and AI platform – the
    backbone of data & AI innovation across APM Terminals.
  - Act as a hands-on technical leader – leading by example,
    owning architecture decisions, writing key parts of the
    codebase, and tackling complex problems alongside your
    team.
  - Build for reuse and scale – designing shared data models,
    KPIs, pipelines, and APIs that empower teams across APMT
    to innovate faster.
  - Infuse the platform with intelligence – applying AI to
    improve data quality, automate monitoring, and boost
    developer productivity.
  - Advance our ML / AI Ops capabilities – ensuring seamless
    model training, deployment, monitoring, and lifecycle
    management for reliable AI in production.
  - Empower teams to build and scale AI & GenAI solutions – by
    providing trusted data and robust, production-ready
    infrastructure.
  - Work with product, architecture, and business stakeholders –
    to turn real needs from operations, commercial, finance,
    and more into durable platform features.
  - Coach and mentor a talented engineering team – inspiring a
    high bar for quality, ownership, and continuous
    improvement.

  What makes this role stand out

  - Lead + build – you get to manage a team and remain deeply
    technical (no need to choose one or the other).
  - Intelligent platform – the foundation gets smarter with AI
    to constantly improve quality, speed, and scale.
  - Broad impact – your technical decisions and code will
    accelerate innovation across the company, enabling many
    teams to create value faster.
  - Global challenge, real impact – you’ll tackle complex,
    cross-domain problems at global scale, and see your
    solutions make a lasting difference.

  What we’re looking for

  - Deep engineering experience – strong background in data
    engineering, including designing and operating large-scale
    data and AI platforms.
  - Proven leadership – you’ve managed and developed engineers
    while staying technical (architecture, code reviews, even
    coding when needed).
  - Modern architecture skills – solid understanding of cloud-
    native data architectures, platform engineering, and best
    practices in building robust, scalable data systems.
  - AI/ML exposure – hands-on experience with AI/ML or data
    science systems in production, and familiarity with MLOps
    / AI Ops practices to support model deployment and
    monitoring.
  - Automation & quality mindset – experience with AI-assisted
    development or intelligent automation for data
    quality/observability.

