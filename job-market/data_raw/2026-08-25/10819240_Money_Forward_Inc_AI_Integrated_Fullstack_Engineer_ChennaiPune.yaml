description: |
  Overview

  Money Forward provides a cloud-based business platform
  called Money Forward Cloud that helps companies solve
  financial and operational challenges through integrated
  cloud and AI-powered solutions.

  Within this ecosystem, Money Forward Cloud ERP delivers
  scalable financial and business management solutions for
  mid-sized and large enterprises.

  About the ERP Cross-Functional Engineering Division

  Over the past decade, Money Forward has built many products
  across different teams and technology stacks. To scale
  better and deliver more value to customers, the ERP Cross-
  Functional Engineering Division was established in 2023 to
  unify engineering foundations and improve collaboration
  across ERP teams.

  A key initiative of the division is building a state-of-the-
  art AI Agent Platform that enables product teams to
  experiment prototype quickly, and deploy AI-powered agents.
  By providing shared infrastructure and best practices for AI
  development, the platform helps teams across ERP build AI-
  driven features faster and more efficiently.

  Responsibilities

  - This is a Platform Engineering role involving both frontend
    and backend development, focused on building the
    infrastructure and tooling for our AI ecosystem.
  - We are building an AI Agent platform that enables product
    teams to build, operate, and scale AI-powered agents
    across our ERP ecosystem.
  - Our team focuses on building the platform infrastructure —
    frameworks, SDKs, runtime systems, and tooling — that
    allow multiple teams to safely develop and deploy AI
    agents in production.
  - This role is ideal for engineers who enjoy building
    platforms used by other engineers, solving distributed
    systems challenges, and shaping how AI capabilities scale
    across a large SaaS ecosystem.

  RequirementsRequired Skills and Experience

  - 7+ years of software engineering experience building and
    operating web applications
  - Strong backend (Java or Golang) and platform engineering
    experience (APIs, microservices, distributed systems)
  - Experience building platforms, internal tools, SDKs, or
    infrastructure used by other teams
  - Hands on experience working on SDLC at backend along with
    frontend exposure (Typescript, NextJs)
  - Experience with cloud infrastructure (AWS preferred),
    Docker, Kubernetes, and Infrastructure as Code (Terraform,
    Kubernetes manifests)
  - Strong API design skills (REST/streaming) with focus on
    developer experience and reliability
  - Experience integrating LLM APIs (OpenAI, Gemini, Anthropic,
    etc.) into production systems
  - Ability to solve problems end-to-end from design through
    production rollout with strong problem-solving and
    decision-making
  - Product mindset that shows proven ability to translate high-
    level product requirements into clear, detailed technical
    solutions through close collaboration with Product
    Managers.
  - Experience mentoring engineers and contributing to technical
    design discussions
  - Comfortable using AI-assisted development tools to improve
    engineering productivity

  Preferred Skills and Experience

  - Understanding of AI agent patterns (tool use, function
    calling, memory, multi-turn conversations, guardrails)
  - Experience building multi-tenant SaaS platforms or developer
    platforms
  - Familiarity with observability tools (Datadog, logging,
    tracing)
  - Experience designing CI/CD pipelines and automated
    infrastructure workflows
  - Comfortable working cross-team with product, security, and
    other engineering teams

  Benefits

  Why Join Us?

  At Money Forward India, you'll be part of a dynamic, growth-
  oriented environment where innovation thrives. Our culture
  fosters collaboration, creativity, and professional
  development. Join us to be at the forefront of SaaS
  technology, with the security of an established corporate
  and the agility of a startup.

  - Startup-like Work Environment & Culture
  - Performance Review Twice a Year (Salary can be increased
    twice)
  - Global Work Environment
  - Flexible Work Hours & Hybrid Work Policy (WFH 2 days a week)
  - Chance to Visit Japan & Vietnam Offices on Business Trip
  - Leaves: Casual, Earned, and Sick leaves
  - Casual Dress Code (Shorts, Slippers, Sandals: All OK!)
