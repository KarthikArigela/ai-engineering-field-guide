description: |
  Location Designation: Hybrid - 3 days per week  Program
  Overview: Within the Tech, Data, AI, Ventures (TDAV)
  organization, our work is guided by a shared vision:
  deploying the power of technology, data, AI and ventures to
  accelerate sustainable competitive advantage for New York
  Life's businesses. We build solutions that power how we
  serve policy owners, agents, advisors and employees.
  Grounded in New York Life's culture of long-term commitment,
  integrity and putting people at the center of what we do,
  our work reflects a purpose-driven approach to innovation.
  We engineer complex systems that translate into measurable
  business outcomes. Across technology, data, AI, cyber,
  product, digital experience, architecture and
  infrastructure, TDAV combines the scale and investment of an
  industry leader with the opportunity to work with leading-
  edge technologies and help shape how a world-class financial
  services company competes in the AI era - all backed by the
  stability and purpose of a mutual company built to last.
  Shape your future with a dynamic internship experience at
  New York Life. Your internship journey is designed to
  challenge you through hands-on work experience that will
  equip you with valuable skills you can use anywhere. You
  will build your network through collaboration and connection
  with talented interns and experienced employees through
  team-building activities, a collaborative intern capstone,
  and fun social events. By the end of your internship, you'll
  be equipped with new skills and a network that will propel
  you forward in your career journey. What You'll Do: Focus on
  developing and maintaining cybersecurity solutions that
  protect enterprise systems, applications, and data. Assist
  with monitoring security events, analyzing alerts,
  investigating potential threats, and strengthening security
  controls across cloud and on-premises environments. Work
  with security tools, automation platforms, and threat
  intelligence resources to improve incident response
  processes and operational effectiveness. Support secure code
  changes, configuration improvements, and security
  assessments to identify and remediate vulnerabilities.
  Collaborate with cybersecurity, infrastructure, and
  engineering teams to identify vulnerabilities, enhance
  security monitoring capabilities, and leverage AI-powered
  technologies to detect, prevent, and respond to emerging
  cyber threats. Required Skills:

  - Undergraduate or Graduate student pursuing a degree in
    Cybersecurity, Computer Science, Information Systems,
    Computer Engineering, Software Engineering, or a related
    technical field
  - Strong understanding of cybersecurity fundamentals,
    including network security, network & endpoint threat
    detection, and incident response
  - Proficiency in at least one scripting or programming
    language, such as Python, PowerShell, or Bash with an
    interest in security automation and tool integration

  Eligibility Criteria:

  - Currently pursuing a bachelor's or master's degree with an
    expected graduation date of December 2027 or May 2028
  - Available to work full-time for the entire duration of the
    11-week Summer Internship Program (May 25 - August 6,
    2027)
  - Able to work in a hybrid environment, with three days per
    week on-site in New York City
  - Passionate about technology, data, AI, and innovation, with
    a collaborative mindset and a desire to learn and make an
    impact

  To be eligible for this program, you must be authorized to
  work in the U.S. We do not offer any type of employment-
  based immigration sponsorship for this program. Likewise,
  this program is not available to those authorized to work
  under optional practical training (OPT) or curricular
  practical training (CPT).  As part of the Technology, Data &
  Analytics Ventures (TDAV) Internship Program, this posting
  represents one of seven specialized internship
  opportunities: AI Engineer (MLOps), Software Engineer, Data
  Engineer, Platform Engineer, Security Engineer, Data
  Scientist, and Analyst. We encourage candidates to explore
  all available TDAV internship postings and apply for the
  role(s) that best align with their skills, interests, and
  career aspirations. Curious what it's like to intern at NYL?
  Check out #NYLEarlyCareers on LinkedIn! #AICampus#LI-CV1 Pay
