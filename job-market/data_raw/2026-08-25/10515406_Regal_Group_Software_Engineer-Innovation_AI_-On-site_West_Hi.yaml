title: Software Engineer-Innovation /AI -On-site @West Hills, CA
company: Regal Group
location: Los Angeles, USA
work_type: FULL_TIME
description: |
  Job Summary & Responsibilities

  Company: Regal Medical Group is a large, physician-led
  medical group based in Southern California, primarily
  serving patients in the San Fernando Valley, San Gabriel
  Valley, and surrounding areas. Founded in 1996, Regal
  operates as an Independent Physician Association (IPA) and
  works with major health plans including Medicare Advantage
  and Medi-Cal. The group focuses on coordinated, value-based
  care, emphasizing preventive health and chronic disease
  management. Regal is part of Heritage Provider Network,
  which ran the $3M Heritage Health Prize on Kaggle — a
  pioneer in applying machine learning to patient care.

  Background: The Department of Innovation, AI is a small,
  focused team (5 members) tasked with modernizing a large,
  multi-billion-dollar healthcare business. We're rebuilding
  core healthcare infrastructure from the ground up to take
  full advantage of the latest AI models.

  Role Summary: As a software engineer, you'll be responsible
  for embedding with various company teams to spec, build, and
  maintain new and existing AI applications. This role is
  close in nature to a forward-deployed engineering position,
  where your ability to understand business cases and own
  product outcomes will be just as important as your raw
  technical acumen.

  Requirements:

  - Bachelor's degree required. New graduates and recent alumni
    are welcome to apply.
  - Demonstrated experience in at least one programming language
    without the use of AI assistance/tools.
  - Prior work/school projects showcasing an ability to
    deconstruct business requirements into a working final
    application.
  - Strong social skills enabling you to operate effectively
    with a wide variety of personality types and roles.

  Preferred Qualifications:

  - Prior experience implementing large language models /
    generative AI in end-user applications.
  - Prior experience using AI-assisted coding tools to develop
    and maintain high-quality codebases.
  - Interest or prior experience in the healthcare or healthcare
    technology industries.

  This is a great opportunity for you if:

  - You want to work on a small, mission-driven team to achieve
    enormous, real-world patient and business outcomes.
  - You're flexible, pragmatic, and want to develop your
    business and people skills alongside your software
    engineering talent.

  The pay range for this position at commencement of
  employment is expected to be between $125,000 year to
  $200,000 year; however, base pay offered may vary depending
  on multiple individualized factors, including market
  location, job-related knowledge, licensure, skills, and
  experience.

  The total compensation package for this position may also
  include other elements, including a sign-on bonus and
  discretionary awards in addition to a full range of medical,
  financial, and/or other benefits (including 401(k)
  eligibility and various paid time off benefits, such as
  vacation, sick time, and parental leave), dependent on the
  position offered.

  Details of participation in these benefit plans will be
  provided if an employee receives an offer of employment.

  If hired, employee will be in an “at-will position” and the
  Company reserves the right to modify base salary (as well as
  any other discretionary payment or compensation program) at
  any time, including for reasons related to individual
  performance, Company or individual department/team
  performance, and market factors.

  Full Time Position Benefits:

  The success of any company depends on its employees. For us,
  employee satisfaction is crucial not only to the well-being
  of our organization, but also to the health and wellness of
  our members. As such, we are firmly dedicated to providing
  our employees the options and resources necessary for
  building security and maintaining a healthy balance between
  work and life.

  Our dedication to our staff is evident in our comprehensive
  benefits package. We offer a very generous mixture of
  benefits, including many employer-paid options.

  Health and Wellness:

  - Employer-paid comprehensive medical, pharmacy, and dental
    for employees
  - Vision insurance
  - Zero co-payments for employed physician office visits
  - Flexible Spending Account (FSA)
  - Employer-Paid Life Insurance
  - Employee Assistance Program (EAP)
  - Behavioral Health Services

  Savings and Retirement:

  - 401(k)Retirement Savings Plan
  - Income Protection Insurance

  Other Benefits:

  - Vacation Time
  - Company celebrations
  - Employee Referral Bonus
  - Tuition Reimbursement
  - License Renewal CEU Cost Reimbursement Program
  - Business-casual working environment
  - Sick days
  - Paid holidays
  - Mileage

  Employer will consider for employment qualified applicants
  with criminal histories in a manner consistent with the
  requirements of the LA City Fair Chance Initiative for
  Hiring Ordinance.

