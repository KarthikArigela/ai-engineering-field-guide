description: |
  Job Title: AI Application Engineer

  Introduction to role:

  Are you driven to turn cutting-edge AI into intuitive
  products that make a measurable difference? Can you imagine
  your code powering conversational experiences and automation
  used across a global enterprise to accelerate how we reach
  patients?

  In this role, you will build end-to-end AI applications—from
  conversational agents to web experiences—on modern cloud
  platforms. You will join a team that pairs deep scientific
  purpose with advanced technology, with the investment and
  mandate to scale what works. Your work will streamline how
  our colleagues discover insights, automate complex
  workflows, and ultimately help bring life-changing medicines
  to patients faster.

  Accountabilities:

  - Conversational AI Engineering: Design, build, and iterate
    AI-based conversational applications using C#, Node.js, or
    Python on Azure or AWS; translate complex user needs into
    reliable, human-centered experiences that get adopted.
  - Web Experience Engineering: Create performant web
    applications and thoughtful UI/UX with React or Angular;
    ship features that improve usability, accessibility, and
    measurable engagement.
  - Automation Platforms: Build, maintain, and enhance
    automation platforms using cloud and on-premise cognitive
    services; reduce cycle times and operational effort with
    resilient, reusable components.
  - Cloud Architecture and Operations: Deploy and optimize
    solutions on Azure/AWS services relevant to AI/ML/NLP and
    generative AI; design for scalability, observability, cost
    efficiency, and security.
  - Integration and Security: Integrate with enterprise systems
    via APIs, SSO, and token-based auth; safeguard data and
    ensure compliance while keeping developer and user
    experiences smooth.
  - Data and Insights: Work across SQL, NoSQL, and graph
    databases to model, retrieve, and evaluate data;
    instrument applications and use telemetry to guide
    improvements.
  - Collaboration and Delivery: Partner with product, design,
    engineering, and scientific partners to scope, build, and
    integrate solutions; plan work transparently and deliver
    iteratively.
  - Standards and Reuse: Contribute patterns, libraries, and
    documentation to accelerate future teams; champion code
    quality, testing, and version control practices.
  - Continuous Improvement: Experiment, learn, and
    refine—validate outcomes through user feedback and
    metrics; share knowledge and elevate team capabilities
    through demos, reviews, and community events.

  Essential Skills/Experience:

  - 5+ years of experience in software development.
  - 3+ years of experience in the AI/Chatbot/Generative AI
    ecosystem, including relevant tools and frameworks.
  - Strong hands-on experience with programming languages such
    as C#, Node.js, and Python.
  - Proficiency in Python libraries and frameworks for NLP and
    GenAI.
  - Experience in developing web applications using HTML, CSS,
    JavaScript, React, or Angular.
  - Expertise in Microsoft Azure/Amazon AWS cloud services
    relevant to AI/ML/NLP, generative AI, and cognitive
    services.
  - Solid analytical skills for data analysis and finding
    intuitive solutions.
  - Experience with various databases such as SQL, NoSQL, and
    Graph databases.
  - Hands-on experience with API integrations, single sign-on
    (SSO), and token-based authentication.
  - Proficient with code repositories such as GitHub.
  - Bachelor’s degree or equivalent in Computer Engineering,
    Computer Science, or a related field.

  Desirable Skills/Experience:

  - Willingness to learn and adapt to new technologies, tools,
    and programming languages based on project requirements.
  - Ability to work independently and as part of a team.
  - Excellent communication and leadership skills.
  - Ability to handle multiple assignments simultaneously.
  - Exposure to IT services processes, methods, tools, and
    business processes.
  - Experience in implementing and managing automation processes
    to improve efficiency and streamline workflows.
  - Ability to work effectively in a fast-paced, collaborative
    environment, with a passion for continuous learning and
    professional development.
  - Relevant Microsoft and Amazon certifications are considered
    a valuable addition.

  Why AstraZeneca:

  Here, meaningful purpose meets modern engineering. You’ll
  work with advanced cloud and AI platforms at enterprise
  scale, with the backing to take ideas from prototype to
  global impact. We bring unexpected teams into the same room
  to unleash bold thinking, whether through hackathons or
  hands-on experiments that remove friction from how science
  gets done. Your craft directly supports the discovery and
  delivery of medicines, and your growth is fueled by a
  culture that values curiosity, high standards, and kindness
  alongside ambition. You’ll be empowered to take ownership,
  learn continuously, and use AI and digital tools every day
  to improve outcomes—so together we can push the boundaries
  of digital healthcare.

  Call to Action:

  If you’re ready to build AI applications that matter at
  scale, Apply Now!

  Date Posted

  14-Aug-2026

  Closing Date

  AstraZeneca embraces diversity and equality of opportunity.
  We are committed to building an inclusive and diverse team
  representing all backgrounds, with as wide a range of
  perspectives as possible, and harnessing industry-leading
  skills.  We believe that the more inclusive we are, the
  better our work will be.  We welcome and consider
  applications to join our team from all qualified candidates,
  regardless of their characteristics.  We comply with all
  applicable laws and regulations on non-discrimination in
  employment (and recruitment), as well as work authorization
  and employment eligibility verification requirements.
