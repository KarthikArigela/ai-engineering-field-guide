title: "Technical Consultant - Platform Full Stack & AI Applications Engineer"
company: Blue Yonder
location: Coimbatore, IND
work_type: FULL_TIME
company_size: 5,001 Employees
description: |
  Overview:

  - The BYX Platform brings together enterprise web
    applications, APIs, AI-powered workflows and analytics to
    solve complex business and engineering problems.
  - We are seeking an astute Platform Full Stack & AI
    Applications Engineer with a strong technical foundation
    and hands-on experience building scalable, secure and
    production-ready applications across frontend, backend, AI
    and cloud technologies.

  Our current technical environment:

  - Frontend Development: Next.js, React, Vue.js, Nuxt.js,
    TypeScript, JavaScript, HTML5, Tailwind CSS, Bootstrap and
    responsive user-interface development.
  - Backend and Data: Node.js, NestJS, Express.js, Python,
    Flask, ASP.NET, REST APIs, PostgreSQL, MongoDB, MySQL and
    Firebase.
  - AI and Intelligent Applications: Large Language Models
    (LLMs), Retrieval-Augmented Generation (RAG), AI agents,
    Model Context Protocol (MCP), prompt engineering, NLP,
    Speech-to-Text, Text-to-Speech, OpenCV, PyTorch and
    TensorFlow.
  - Enterprise Applications and Integration: Micro-frontends,
    reusable components, dashboards, data visualization,
    workflow automation, API integrations, authentication and
    scalable service architecture.
  - Cloud and DevOps: AWS, Azure, Docker, Linux, Nginx, Proxmox,
    Git, GitHub/GitLab, GitHub Actions, CI/CD and self-hosted
    or cloud-native deployments.

  What you’ll do:

  - Design, develop and maintain scalable enterprise web
    applications using modern frontend, backend and cloud
    technologies.
  - Build responsive, accessible and reusable user interfaces
    with Next.js, React or Vue.js and modern CSS frameworks.
  - Develop secure backend services, REST APIs and integration
    layers using NestJS, Node.js, Python or comparable
    frameworks.
  - Design and integrate AI-powered capabilities such as
    conversational assistants, enterprise analytics,
    intelligent recommendations and workflow automation.
  - Implement and improve LLM, RAG, AI-agent, prompt-
    engineering, voice-AI and private-data processing
    workflows where applicable.
  - Create real-time dashboards for analytics, KPI monitoring,
    reporting and decision support using reusable
    visualization components.
  - Translate complex business workflows and user needs into
    intuitive, maintainable and production-ready software
    features.
  - Integrate AI services with enterprise applications and
    backend data to deliver reliable and context-aware user
    experiences.
  - Contribute to modular application architecture, including
    micro-frontends, reusable components and maintainable
    service boundaries.
  - Design data models, queries and persistence workflows using
    relational and NoSQL databases such as PostgreSQL, MongoDB
    or MySQL.
  - Integrate internal and third-party services while applying
    appropriate authentication, validation, error handling and
    observability practices.
  - Containerize, configure and deploy applications using
    Docker, Linux, Nginx, CI/CD pipelines and cloud or self-
    hosted infrastructure.
  - Improve application performance, security, reliability and
    quality through testing, code reviews, profiling and
    production diagnostics.
  - Collaborate with product, design, engineering, data and
    platform teams to translate business requirements into
    production-ready solutions.
  - Document technical designs and operational guidance, share
    knowledge and mentor junior developers when required.

  What we are looking for:

  - 3–5 years of relevant professional experience in full stack
    development, AI-enabled applications or closely related
    software engineering roles.
  - Strong programming skills in JavaScript or TypeScript, plus
    practical experience with Python; C# experience is an
    advantage.
  - Hands-on experience with React and Next.js or comparable
    modern frontend frameworks such as Vue.js or Nuxt.js.
  - Experience building backend applications and services using
    Node.js, NestJS, Express.js, Flask, ASP.NET or comparable
    frameworks.
  - Strong understanding of REST APIs, JSON, HTTP/HTTPS,
    authentication, error handling and integration patterns.
  - Practical experience with PostgreSQL, MongoDB, MySQL,
    Firebase or comparable relational and NoSQL data stores.
  - Working knowledge of LLM-based application development, RAG,
    AI agents, prompt engineering, NLP or conversational and
    voice AI.
  - Exposure to AI/ML frameworks and computer-vision tools such
    as PyTorch, TensorFlow or OpenCV is preferred.
  - Experience building dashboards, analytics solutions, data-
    driven applications or business workflow automation.
  - Strong foundation in HTML5, responsive design, component-
    based UI development and modern styling frameworks.
  - Understanding of scalable software architecture, reusable
    components, micro-frontends and maintainable service
    design.
  - Experience with Docker, Linux, Nginx and AWS, Azure or
    comparable cloud and self-hosted deployment environments.
  - Proficiency with Git-based workflows and practical knowledge
    of CI/CD, automated builds, testing and release practices.
  - Strong analytical, debugging and performance-optimization
    skills across frontend, backend and AI application layers.
  - Clear communication, documentation and collaboration skills,
    with the ability to work effectively in cross-functional
    teams.

  Our Values

  If you want to know the heart of a company, take a look at
  their values. Ours unite us. They are what drive our success
  – and the success of our customers. Does your heart beat
  like ours? Find out here: Core Values

  All qualified applicants will receive consideration for
  employment without regard to race, color, religion, sex,
  sexual orientation, gender identity, national origin,
  disability or protected veteran status.
