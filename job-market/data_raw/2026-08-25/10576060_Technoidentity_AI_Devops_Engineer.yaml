description: |
  Supercharge Your Career as a AI DevOps Engineer at
  Technoidentity!

  At Technoidentity, we're a Data & AI product engineering
  company with over 15 years of expertise in building durable
  digital products, intelligent enterprise solutions, and
  scalable Data & AI platforms. As we continue expanding
  globally, it's the perfect time to join our team of tech
  innovators and make a lasting impact.

  What’s in it for You?

  We are looking for an AI DevOps Engineer with 0–3 years of
  experience who is passionate about AI, Cloud, DevOps, and
  Automation. The role involves building, deploying, and
  managing AI-powered applications, LLM solutions, and cloud-
  native platforms while ensuring reliability, scalability,
  security, and observability.

  What Will You Be Doing?

  - Develop and deploy AI/ML and Generative AI solutions using
    Python.
  - Build applications leveraging LLMs, RAG, and AI agents.
  - Create and maintain CI/CD pipelines for AI applications.
  - Deploy and manage workloads using Docker and Kubernetes.
  - Support cloud platforms (AWS, Azure, or GCP).
  - Implement Infrastructure as Code (Terraform) and automation
    workflows.
  - Monitor applications using observability tools such as
    Prometheus, Grafana, and logging platforms.
  - Collaborate with engineering teams to ensure system
    reliability, performance, and security.
  - Contribute to MLOps practices, AI accelerators, and reusable
    frameworks.

  Requirements

  What Makes You the Perfect Fit?

  - Python programming (mandatory)
  - Understanding of Machine Learning, LLMs, Prompt Engineering,
    and RAG
  - Experience with OpenAI, LangChain, LlamaIndex, or Hugging
    Face
  - Docker, Kubernetes, Git, and CI/CD tools
  - AWS, Azure, or GCP
  - PostgreSQL; MongoDB and Vector Databases are a plus
  - Basic knowledge of MLOps, Terraform, and workflow
    orchestration tools (Airflow/Temporal)
  - Familiarity with observability and monitoring tools

  Qualifications

  - Bachelor's degree in Computer Science, AI, Data Science, IT,
    or related field
  - 0–3 years of experience in AI/ML, Software Engineering,
    Cloud, DevOps, or related areas

  Nice to Have

  - Experience with Agentic AI frameworks
  - Knowledge of MLOps and AI platform operations
  - Exposure to enterprise-grade monitoring, reliability
    engineering, and security best practices
