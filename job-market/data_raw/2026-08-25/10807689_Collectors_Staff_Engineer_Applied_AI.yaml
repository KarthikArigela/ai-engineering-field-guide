description: |
  Collectors is the leading creator of innovative technology
  that provides value-added services for collectors worldwide.
  We grade, authenticate, vault, and sell millions of record-
  setting collectibles, all while modernizing and digitalizing
  the process to further our mission of helping collectors
  pursue their passions. We’re always on the lookout for
  talented people to join our growing team.

  Our services span collectible trading cards, autographs,
  comic books, coins, video games, event tickets, and
  memorabilia. Our subsidiaries include PSA, PCGS, Beckett,
  SGC, and Card Ladder.

  Since our founding in 1986, we have graded and authenticated
  millions of items. We employ more than 3000 people across
  our headquarters in Santa Ana, California and offices in New
  Jersey, Texas, Florida, Japan, Shanghai, Hong Kong, Canada,
  Mexico, Germany, the UK, and France.

  As part of our interview process, we request that candidates
  have their cameras on during video interviews. This helps
  foster meaningful conversation and allows us to create an
  experience that closely resembles our standard working
  environment. Certain interview steps may take place by
  phone. For remote roles, and at our discretion, candidates
  may be asked to participate in an on-site interview as part
  of the final stages of the process.

  We understand there may be occasional circumstances
  requiring accommodation and are happy to discuss them as
  needed. Your recruiter will be able to clarify expectations
  and answer any questions you have.

  We're transforming the collecting experience with technology
  that brings authentication, grading, and trading into the
  modern era. Our products are equalizing the playing field by
  providing tools that make complex research analytics
  (including pricing, scarcity reports, and historic sales
  data) accessible to every collector, old or new. Our
  engineering mission is to democratize technology while
  promoting innovation, collaboration, and continuous learning
  throughout the organization.

  We're looking for a Staff Applied AI Engineer to join the
  Applied AI function at Collectors. This is an embedded,
  build-first role with portfolio-level ownership: you'll own
  a full business domain, decide which problems in it are
  worth solving with AI, and build and ship the solutions end-
  to-end. You'll still prototype fast and prove value in
  business terms, but your impact compounds beyond your own
  builds: the patterns you establish, the assets you make
  reusable, and the roadmap you shape become the way the whole
  team ships in your lane.

  This is not a traditional software engineering role, and
  it's not an architecture-only role either. We're looking for
  a product-minded builder who leads through shipped work:
  someone who can walk into an unmapped business domain, earn
  the trust of its leaders, build the first few wins
  personally, and then turn those wins into a durable
  portfolio.

  You'll report to the Head of Applied AI. Remote or hybrid
  candidates will also be considered. We believe that there is
  significant value in in-person collaboration.

  What You'll Do

  - Own a business domain, not just a use case. You'll be
    accountable for the AI opportunity across an entire lane
    (for example Operations, Marketplace, or Finance): mapping
    the workflows, sizing the opportunities, and deciding what
    gets built, in what order, and why.
  - Build the hardest use cases yourself. You spend the majority
    of your time hands-on. You take the first, riskiest, or
    most technically demanding builds in your lane from
    prototype through production, adoption, and measured
    impact.
  - Turn one-off wins into reusable patterns. You notice when
    three builds share a shape, extract the common asset (a
    connector, an eval harness, a workflow pattern), and make
    it something every builder on the team can pick up.
  - Define success up front and prove it at portfolio level. You
    instrument outcomes before you build, and you can stand in
    front of the domain's leadership and account for the
    cumulative value your lane has delivered.
  - Design for earned autonomy. You build agents with the
    traces, evals, and human-in-the-loop gates that let them
    graduate to more autonomy on evidence, not on elapsed
    time, and you help set that standard for others.
  - Operate as a power user of frontier AI. Use Claude, OpenAI,
    and our orchestration platform daily as your primary
    tools, and bring a strong, current point of view on
    models, harnesses, and tooling that informs the team's
    platform choices.
  - Win trust at the leadership level. Your stakeholders are
    function leaders, not just operators. You navigate
    competing priorities, secure sponsorship, and keep
    skeptical partners engaged through delivery.
  - Multiply the builders around you. You review designs and
    code, unblock senior and mid-level engineers, raise the
    hiring bar as an interviewer, and make the people around
    you measurably better.
  - Build production grade applications around AI systems. You
    can design and implement the application layer around
    agents and AI workflows, with strong judgement across
    frontend APIs, state latency, reliability, security and
    scalability

  Who You Are

  - A builder, first and foremost. Seniority hasn't pulled you
    away from the keyboard. You're happiest hands-on, and you
    have a strong bias toward shipping over deliberating.
  - Proven at portfolio scope. You've owned a domain, program,
    or product area where you chose the roadmap, not just
    executed it, and you can speak to the judgment calls: what
    you built, what you deliberately didn't, and how it played
    out.
  - You've shipped multiple end-to-end agents. You've deployed
    agentic or AI-powered solutions to real users more than
    once, in more than one context, and you can speak
    concretely about value delivered, tools used, trade-offs
    made, and what you'd do differently now.
  - A power user of AI. You use Claude, OpenAI, or similar
    models daily and fluently, you push them harder than most
    of the people around you, and you have informed opinions
    about frameworks, evals, and orchestration that you can
    defend with evidence.
  - Fluent at turning business pain into working software.
    You're comfortable embedded inside non-technical teams,
    and you can translate a leader's strategic frustration,
    not just an operator's task-level one, into a scoped,
    sequenced portfolio.
  - Technically strong across the stack. You can architect and
    build agent systems independently, make sound build-
    versus-reuse calls, and hold your own in design review
    with principal-level engineers.
  - Proficient in application engineering, not just AI. You have
    hands-on experience building and shipping production
    applications, preferably full-stack, and can make sound
    architectural decisions across frontend and backend
    systems.
  - Outcome-obsessed. You talk in metrics and business value,
    not feature lists, and you hold yourself accountable for
    whether the portfolio moved the numbers, not just whether
    things shipped.
  - A force multiplier. You have a track record of making other
    engineers better through review, mentorship, patterns, or
    tooling, and people you've worked with would say so
    unprompted.
  - A clear communicator. You're equally comfortable with
    operators on the floor, engineers in review, and
    executives in a readout, and you can carry a room that
    started out skeptical.
  - A continuous learner. You believe staying excellent in this
    field means never standing still. You actively track the
    latest models, tools, and techniques as they ship, form
    your own view on what matters, and bring the best of it
    back to the team.

  Salary Range: The salary range for this position is
  $165,848-$269,259. Actual compensation on this range varies
  based on a variety of non-discriminatory factors, including
  location, job level, experience, and skill set. This role
  may be eligible for bonuses, commissions, or other forms of
  compensation, please ask your recruiter for details.

  Reasons To Join Us:

  - Health Insurance: All full-time employees are eligible to
    enroll in Medical, Dental, and Vision
  - Additional Benefits: Full-time employees are eligible for
    fertility, commuter, and educational assistance benefits
  - 401(K) Matching Plan: We are proud to offer a competitive
    401k matching plan to our employees to support their
    future financial goals
  - Vacation: All salaried employees are eligible for flexible
    time-off.
  - Holiday Pay: All regular, full-time employees are eligible
    for ten company paid holidays
  - Employee Discounts: Employees receive discounts on select
    grading services for approved submissions
  - Flexible Hours: Many of our teams offer flexible schedules
    with varying shifts and will work with you to accommodate
    your needs
  - Fun Working Environment: Our team members are invited to
    participate in celebrations, holiday events, and team
    building activities
  - Additional Resources: Collectors Tech Blog, PSA

  Collectors uses e-Verify to validate your ability to work
  legally in the United States.

  We are aware that there are instances where individuals are
  receiving job offers that fraudulently allege to be from
  Collectors or one of our business units. This type of fraud
  can be carried out through false websites, through fake
  e-mails claiming to be from the company or through social
  media. We never ask for personal information such as your
  bank account, Social Security numbers or National IDs, nor
  do we send or request payments for the purchase of business-
  related equipment. If you suspect fraud, please reach out to
  interviewfraud@collectors.com.

  We are committed to equal employment opportunity regardless
  of race, color, ethnicity, ancestry, religion, national
  origin, gender, sex, gender identity or expression, sexual
  orientation, age, citizenship, marital or parental status,
  disability, veteran status, or other class protected by
  applicable law. We believe that a team that represents a
  variety of backgrounds, perspectives, and skills will better
  service the diverse community of collectors we support.

  If you require an accommodation to apply or interview with
  us due to a disability or special need, please email
  interviewaccommodation@collectors.com

  U.S. residents: for disclosures relating to personal
  information we collect during the employment application and
  recruitment process, please see our Privacy Notice for U.S.
  Applicants.
