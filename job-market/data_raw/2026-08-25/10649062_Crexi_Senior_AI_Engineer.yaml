description: |
  About Crexi

  Crexi is reimagining commercial real estate with an AI-
  powered platform built to deliver smarter, more efficient
  solutions at every stage of the deal lifecycle. From real-
  time data and market insights generated by Crexi
  Intelligence, to targeted property marketing and seamless
  deal management through Crexi PRO, and a transparent, time-
  bound bidding experience with Crexi Auction— Crexi enables
  users to evaluate opportunities, maximize exposure, and
  close with speed and confidence. To date, Crexi has
  facilitated over $1 trillion in transactions, 8.6 billion
  square feet leased, and supports a growing community of more
  than 2 million monthly active users.

  Crexi’s mission is to catalyze the next generation of
  commercial real estate through three core pillars: Access,
  Innovation, and Connection. Crexi’s platform democratizes
  CRE by providing unprecedented access to market insights and
  opportunities, accelerates CRE dealmaking with purpose-built
  technology that enhances speed and transparency; and
  empowers CRE professionals with a centralized platform
  designed for real-time collaboration and success.

  About the Role:

  The AI Engineer builds the agentic AI systems that power
  Crexi's platform, including orchestration, retrieval, and
  action layers grounded in Crexi's proprietary commercial
  real estate data. The role builds multi-step agentic
  workflows that understand user intent, orchestrate the right
  capabilities, and complete real work, not just answer
  questions, using tools like LangGraph and AWS Bedrock
  AgentCore. It exists to extend Crexi's AI-powered research,
  document generation, and zoning intelligence into unified,
  trustworthy agentic experiences for brokers, appraisers,
  lenders, and investors.

  What You'll Do:

  A typical day may include:

  - Design and implement multi-step agentic workflows, including
    routing, planning, tool use, and state management, using
    frameworks like LangGraph/LangChain to move from user
    intent to real, completed actions.
  - Build evaluation frameworks and production monitoring
    (offline evals, human-in-the-loop annotation) to measure
    quality, reliability, and business outcomes, not just
    model metrics.
  - Build context and retrieval pipelines over Crexi's
    proprietary CRE data, handling the compound, qualitative
    queries that structured filters can't answer.
  - Work primarily with Anthropic frontier models on AWS
    Bedrock, using Bedrock AgentCore for agent runtime,
    identity, and memory, and helps evaluate open-weight
    alternatives on cost, latency, and capability.
  - Implement guardrails, structured outputs, and graceful
    ambiguity handling so agentic systems ask for
    clarification rather than acting on unclear intent, and
    establishes trace-level observability across LLM calls and
    tool invocations.
  - Leverage agentic coding tools (e.g., Claude Code, Codex) for
    scaffolding, refactoring, test generation, and debugging,
    while critically reviewing AI-generated output for
    correctness, security, and performance.
  - Rapidly prototype against real user feedback, partnering
    with Product and Design, and helps convert successful
    prototypes into scalable, reusable capabilities.
  - Ensure AI outputs are explainable, source-linked, and
    trustworthy enough to inform real business decisions.

  Qualifications:

  - 5+ years of professional software development experience in
    production environments with meaningful scope/ownership,
    including 2+ years hands-on building LLM-powered
    applications in production.
  - Real experience with agentic architectures (multi-step
    pipelines, tool/function calling, state machines, memory),
    ideally with LangGraph or similar orchestration
    frameworks.
  - Strong retrieval design skills: RAG systems, embeddings,
    vector search, and the judgment to know when retrieval is
    the problem and when the data is.
  - Strong Python proficiency and real-world experience building
    backend services and APIs in production.
  - Experience with cloud infrastructure (AWS preferred) and
    modern collaborative workflows (GitHub/GitLab, code
    reviews, CI/CD).
  - Demonstrated use of agentic coding tools (e.g., Claude Code,
    Codex) in a professional workflow, without compromising
    quality.
  - Comfortable operating in ambiguity and fast iteration
    cycles; experience designing LLM evaluation pipelines
    (offline evals, production monitoring, human-in-the-loop
    annotation) is a plus.
  - Bachelor’s degree in Computer Science or related field, or
    equivalent practical experience.

  Who You Are:

  - Thrives in a fast-paced, dynamic environment.
  - Exceptional communication skills, with the ability to
    provide clear and concise information to stakeholders at
    all levels of the organization.
  - Strong analytical skills, with the ability to interpret
    complex information, identify patterns, and present
    insights clearly and accurately.
  - Excellent organizational and prioritization skills, with the
    ability to manage multiple priorities and deadlines
    simultaneously.
  - Self-starter who independently owns their own success and
    demonstrates strong initiative.
  - Responsive, action-oriented, and proactive in identifying
    and resolving issues.
  - Strong problem-solving and creative thinking skills, with
    the ability to evaluate options and implement effective
    solutions.
  - Effective collaborator and team player, with the ability to
    work cross-functionally and build strong working
    relationships.
  - Demonstrated ability to handle sensitive and confidential
    information with the utmost professionalism and
    discretion.

  Why Crexi?

  - Rapidly growing startup with a dynamic work environment
  - Flexible team structure with the ability to progress in
    career
  - Health, Dental, and Vision insurance
  - Collaborative culture and numerous team activities

  The anticipated base salary range for candidates who will
  work in our Playa Vista, California location is $179,000 to
  $241,000. The final salary offered to a successful candidate
  will depend on several factors, which may include, but are
  not limited to, the type and length of experience applicable
  to the role and within the industry, education, geographic
  location, etc. Commercial Real Estate Exchange, Inc
  (“Crexi”) is a multi-state employer, and this salary range
  may not reflect positions that work in other states.

  Crexi is an EEO Employer. Qualified applicants will receive
