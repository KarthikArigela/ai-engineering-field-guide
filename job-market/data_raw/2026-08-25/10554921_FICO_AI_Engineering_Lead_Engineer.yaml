description: |
  FICO (NYSE: FICO) is a leading global analytics software
  company, helping businesses in 100+ countries make better
  decisions. Join our world-class team today and fulfill your
  career potential!

  The Opportunity

  Come join our product development team in a hands-on
  technical role where you’ll be involved in the end-to-end
  lifecycle of software development and methodologies.  This
  role provides the opportunity to develop a deep
  understanding of our business, and work closely with
  professional services and product management to develop a
  highly feature rich product.

  What You’ll Contribute

  - Design, develop, deploy and support modules of large world-
    class enterprise-level product.
  - Participate in architectural design of product.
  - Develop high level development timelines based on project
    scope and understanding of the existing application code.
  - Evaluate new design specifications and raise quality
    standards, address architectural concerns.
  - Evaluate stability, compatibility, scalability,
    interoperability, and performance of the software product.
  - Maintain and upgrade product source codes.
  - Demonstrate technical expertise through publication,
    presentations, white papers and event participation.
  - Continually learn new technologies in related areas.
  - Serve as a source of technical expertise and mentor junior
    team members.

  What We’re Seeking

  - Bachelor’s/Master’s in Computer Science or related
    disciplines, or relevant experience in software
    architecture, design, development and testing.
  - 7+ years of overall experience.
  - Experience in software design with strong foundation of
    design models and database structures.
  - Strong knowledge of database concepts and programming.
  - Experience in writing product specifications and documenting
    product features to present them to a wider audience.
  - Excellent communication and ability to articulate the design
    with architects and discuss strategy / requirements with
    teams.
  - Business domain knowledge.
  - Ability to provide product demonstrations is an advantage.

  Our Offer to You

  - An inclusive culture strongly reflecting our core values:
    Act Like an Owner, Delight Our Customers and Earn the
    Respect of Others.
  - The opportunity to make an impact and develop professionally
    by leveraging your unique strengths and participating in
    valuable learning experiences.
  - Highly competitive compensation, benefits and rewards
    programs that encourage you to bring your best every day
    and be recognized for doing so.
  - An engaging, people-first work environment offering
    work/life balance, employee resource groups, and social
    events to promote interaction and camaraderie.

  Why Make a Move to FICO?

  At FICO, you can develop your career with a leading
  organization in one of the fastest-growing fields in
  technology today – Big Data analytics.  You’ll play a part
  in our commitment to help businesses use data to improve
  every choice they make, using advances in artificial
  intelligence, machine learning, optimization, and much more.

  FICO makes a real difference in the way businesses operate
  worldwide:

  •    Credit Scoring — FICO® Scores are used by 90 of the top
  100 US lenders.

  •    Fraud Detection and Security — 4 billion payment cards
  globally are protected by FICO fraud systems.

  •    Lending — 3/4 of US mortgages are approved using the
  FICO Score.

  Global trends toward digital transformation have created
  tremendous demand for FICO’s solutions, placing us among the
  world’s top 100 software companies by revenue. We help many
  of the world’s largest banks, insurers, retailers,
  telecommunications providers and other firms reach a new
  level of success. Our success is dependent on really
  talented people – just like you – who thrive on the
  collaboration and innovation that’s nurtured by a diverse
  and inclusive environment. We’ll provide the support you
  need, while ensuring you have the freedom to develop your
  skills and grow your career.  Join FICO and help change the
  way business thinks!

  Learn more about how you can fulfil your potential at
  www.fico.com/Careers

  FICO promotes a culture of inclusion and seeks to attract a
  diverse set of candidates for each job opportunity. We are
  an equal employment opportunity employer and we’re proud to
  offer employment and advancement opportunities to all
  candidates without regard to race, color, ancestry,
  religion, sex, national origin, pregnancy, sexual
  orientation, age, citizenship, marital status, disability,
  gender identity or Veteran status. Research has shown that
  women and candidates from underrepresented communities may
  not apply for an opportunity if they don’t meet all stated
  qualifications. While our qualifications are clearly related
  to role success, each candidate’s profile is unique and
  strengths in certain skill and/or experience areas can be
  equally effective. If you believe you have many, but not
  necessarily all, of the stated qualifications we encourage
  you to apply.

  Information submitted with your application is subject to
  the FICO Privacy policy at https://www.fico.com/en/privacy-
  policy
