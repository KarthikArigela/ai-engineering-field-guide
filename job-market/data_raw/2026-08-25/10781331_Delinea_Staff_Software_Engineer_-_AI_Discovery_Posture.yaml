description: |
  About Delinea: Delinea is a pioneer in securing human and
  machine identities through intelligent, centralized
  authorization, empowering organizations to seamlessly govern
  their interactions across the modern enterprise. Leveraging
  AI-powered intelligence, Delinea’s leading cloud-native
  Identity Security Platform applies context throughout the
  entire identity lifecycle – across cloud and traditional
  infrastructure, data, SaaS applications, and AI. It is the
  only platform that enables you to discover all identities –
  including workforce, IT administrator, developers, and
  machines – assign appropriate access levels, detect
  irregularities, and respond to threats in real-time. With
  deployment in weeks, not months, 90% fewer resources to
  manage than the nearest competitor, and a 99.995% uptime,
  Delinea delivers robust security and operational efficiency
  without compromise. Learn more about Delinea on Delinea.com,
  LinkedIn, X, and YouTube.

  Join our passionate, global team at Delinea and help us make
  the world a safer and more secure place. Our success is
  driven by world-class product leadership, outstanding
  engineers, and strategic investment from TPG. We value
  diversity, innovation, and a culture of respect and
  fairness. If you're ready to push boundaries and challenge
  the status quo in security, we want to hear from you.


  Apply today to help us achieve our mission.

  Summary:

  AI agents are appearing across the enterprise faster than
  anyone can keep track of them, and you cannot secure what
  you cannot see. In this role you will build the capabilities
  that find AI agents wherever they run, across cloud
  platforms and on endpoints, and assess their security
  posture so the rest of our AI security platform can govern
  them. This role will report directly into our Director of
  Engineering, Securing AI.

  What You'll Do:

  - Build AI agent discovery on top of Delinea's existing cloud
    discovery rather than standing up a separate inventory,
    covering Microsoft Azure today and expanding to AWS and
    Google Cloud as the platform adds those clouds.
  - Build discovery for AI agents running on endpoints, a newer
    surface for the team.
  - Assess the security posture of discovered agents: how they
    are configured, what they can access, and where they
    create risk.
  - Feed discovered agents and their context into our identity
    and attribution layer so they can be governed.
  - Partner closely with the platform teams whose discovery
    services your work builds on.

  What You'll Need:

  - Typically 8 or more years building production cloud or SaaS
    backend systems.
  - Hands-on experience with cloud provider APIs (Azure, AWS, or
    Google Cloud) and asset discovery or inventory systems.
  - Experience extending or integrating with an existing
    platform, not only greenfield builds.
  - Strong skills in a modern backend language such as C#, Go,
    Java, or Python.
  - Ability to break down complex, ambiguous problems and select
    sound technical approaches with limited direction.

  We'd Love to See:

  - Experience with endpoint agent or device management
    technologies.
  - Background in security or posture management such as CSPM or
    CIEM.
  - Familiarity with AI agent frameworks and how agents
    authenticate and act.

  For this Job, Delinea is not considering candidates that
  need any type of US work authorization now or in the future.
  This includes, but is not limited to: F1-OPT, F1-CPT, H-1B,
  TN, L-1, J1, etc.

  Why work at Delinea?

  - We're passionate problem-solvers helping the world's largest
    organizations protect what matters most: their human and
    machine identities.

  - We invest in people who are smart, self-motivated, and
    collaborative.

  - What we offer in return is meaningful work, a culture of
    innovation and great career progression.

  At Delinea, our core values are STRONG and guide our
  behaviors and success:

  - Spirited - We bring energy and passion to everything we do

  - Trust - We act with integrity and deliver on our commitments

  - Respect - We listen, value different perspectives, and work
    as one team

  - Ownership - We take initiative and follow through

  - Nimble - We adapt quickly in a fast-changing environment

  - Global - We embrace diverse people and ideas to drive better
    outcomes

  We believe weaving these core values into our day-to-day
  actions, and our process for hiring, evaluating, and
  promoting employees, helps us cultivate a work environment
  that embraces collaboration and camaraderie.

  We take care of our employees. We offer competitive
  salaries, a meaningful bonus program, and excellent
  benefits, including healthcare insurance, as well as
  pension/retirement matching, comprehensive life insurance,
  an employee assistance program, time off plans, and paid
  company holidays.

  Delinea is an Equal Opportunity and Affirmative Action
  employer and prohibits discrimination and harassment of any
  type with regard to race, color, religion, age, sex,
  national origin, disability status, genetics, protected
  veteran status, sexual orientation, gender identity or
  expression, or any other characteristic protected by
  federal, state or local laws.

  Upon conditional offer of employment, candidates are
  required to complete comprehensive criminal background
  check, verification of education, and verification of
  employment, per employment policy. In addition, all publicly
  posted social media sites may be reviewed.
