description: |
  EXL (NASDAQ: EXLS) is a global data and artificial
  intelligence ("AI") company that offers services and
  solutions to reinvent client business models, drive better
  outcomes and unlock growth with speed. EXL harnesses the
  power of data, AI, and deep industry knowledge to transform
  businesses, including the world’s leading corporations in
  industries including insurance, healthcare, banking and
  financial services, media and retail, among others. EXL was
  founded in 1999 with the core values of innovation,
  collaboration, excellence, integrity and respect.

  We are headquartered in New York and have more than 60,000
  employees spanning six continents. For more information,
  visit www.exlservice.com.

  Role Title: AI Developer & .NET developer

  BU/Segment: Analytics

  Location:   London, United Kingdom (Flexible hybrid working)
  OR Fully Remote within the United Kingdom

  Employment Type: Permanent

  Summary of the role:

  As an AI Architect & .NET developer, you will be responsible
  for designing and governing end to end AI architectures on
  Azure ecosystem that enables intelligent automation and
  decision support across insurance functions such as
  underwriting, claims, reinsurance, and document heavy
  operations.

  The role focuses on building scalable, secure, and
  production grade GenAI platforms leveraging LLMs, Agentic
  AI, OCR to process complex unstructured insurance documents
  (e.g., loss runs, policy forms, claims reports) and generate
  accurate, explainable, and auditable outputs.

  You will define architectural patterns, lead the
  implementation team, and partner with business and
  technology stakeholders to ensure AI solutions are
  enterprise ready, cost efficient, and aligned with
  regulatory and operational constraints

  As part of your duties, you will be responsible for:

  Architecture & Solution Design

  - Act as an AI Architect and SME for GenAI‑driven insurance
    use cases
  - Define end‑to‑end AI architecture for unstructured document
    ingestion, reasoning, and output generation
  - Design LLM‑centric and hybrid AI architectures combining:
    - OCR
    - RAG systems
    - Agentic workflows

  GenAI & Prompt Architecture

  - Design and govern prompt strategies and prompt frameworks
    for:
    - Loss run and insurance document extraction & normalization
    - Claims summarization, triage, and fraud signal generation
    - Underwriting risk assessment and decision support
  - Establish prompt versioning, testing, and optimization
    standards for enterprise use

  Agentic AI & Workflow Orchestration

  - Architect Agentic AI systems for multi‑step reasoning, task
    decomposition, and tool orchestration
  - Define patterns for human‑in‑the‑loop, approvals, and
    exception handling
  - Drive adoption of agent orchestration frameworks (LangGraph,
    AutoGen, CrewAI) in production scenarios

  RAG & Knowledge Architecture

  - Design RAG‑based knowledge architectures for policy, claims,
    and underwriting data
  - Define chunking, embedding, retrieval, and grounding
    strategies
  - Ensure traceability and explainability of generated outputs

  Enterprise & Platform Architecture - Azure

  - Drive architectural decisions related to:
    - Scalability and performance
    - Cost optimization of LLM usage
    - Security, data privacy, and access control
    - Auditability and regulatory compliance
  - Define reference architectures and reusable components for
    multiple insurance use cases

  Evaluation, Quality & Optimization

  - Establish evaluation frameworks for GenAI solutions,
    including:
    - Precision, recall, and F1 metrics
    - Grounding and hallucination detection
    - Consistency and explainability checks

  Collaboration & Leadership

  - Partner with business stakeholders (Underwriting, Claims,
    Actuarial, Legal) to shape AI roadmaps
  - Technical project lead experience 7
  - Guide and mentor .net developers, react developers, and
    GenAI developers
  - Define best practices, standards, and architectural
    guardrails for GenAI adoption

  Qualifications and experience we consider to be essential
  for the role:

  Technical Stack & Platform Experience

  - Programming & Frameworks
    - Strong proficiency in .NET/React

  - GenAI & LLM Platforms
    - Azure OpenAI APIs / enterprise LLM platforms

  - Architecture & Integration
    - API‑first design
    - Microservices‑based architectures
    - Experience integrating AI solutions into enterprise systems
  - .NET (Backend) and React (Frontend) Developer
  - Azure AI / Azure AI Foundry experience/ Vector Databases
    using Azure AI search
  - Prompt Engineering & LLM Design
  - Retrieval Augmented Generation (RAG) Architectures

  Skills and Personal attributes we would like to have:

  - Insurance Domain Knowledge (P&C / Commercial Lines /
    Reinsurance)
  - Agentic AI Frameworks (LangGraph, AutoGen, CrewAI, etc.)
  - OCR systems for document ingestion and classification
  - AI Governance & Token Economics

  As part of a leading global Data and AI company, you can
  look forward to:

  - A competitive salary with a generous bonus, private
    healthcare, critical illness life assurance at 4 x your
    annual salary, income protection insurance, and a
    rewarding pension.
  - EXL provides everyday financial well-being solutions, such
    as cash back cards, in which you can earn cashback while
    enjoying discounts, promotions, and offers from top
    retailers. We also offer a Cycle Scheme where you can save
    money on bikes and cycling accessories.
  - At EXL, we are committed to providing our employees with the
    tools and resources they need to succeed and excel in
    their careers. We offer a wide range of professional and
    personal development opportunities. We also support a
    range of learning initiatives that allow our employees to
    build on their existing skills and knowledge. From online
    courses to seminars and workshops, our employees have the
    opportunity to enhance their skills and stay up to date
    with the latest trends and technologies.
  - As an Equal Opportunity Employer, EXL is committed to
    diversity. Our company does not discriminate based on
    race, religion, colour, national origin, sex (including
    pregnancy, childbirth, or related medical conditions),
    sexual orientation, age, or disability status.
  - EXL employees are eligible to purchase stock as part of our
    Employee Stock Purchase Plan (ESPP).
  - At EXL, we offer a flexible hybrid working model that allows
    employees to live a balanced, healthy lifestyle while
    strengthening our culture of collaboration.

  To be considered for this role, you must already be eligible
  to work in the United Kingdom.
