title: "Senior AI Platform & Tools Engineer"
company: Crunchyroll
location: Los Angeles, USA
work_type: FULL_TIME
description: |
  About Crunchyroll

  Founded by fans, Crunchyroll delivers the art and culture of
  anime to a passionate community. We super-serve over 100
  million anime and manga fans across 200+ countries and
  territories, and help them connect with the stories and
  characters they crave. Whether that experience is online or
  in-person, streaming video, theatrical, games, merchandise,
  events and more, it’s powered by the anime content we all
  love.

  Join our team, and help us shape the future of anime!

  As a Senior AI Platform & Tools Engineer, you build the
  platform, automation, and tooling that the rest of AI
  Enablement runs on — and you operate the enterprise AI tools
  the whole company relies on. You sit on the Tools &
  Governance platform team within AI Enablement (AIEN),
  reporting to the AI Platform, Strategy & Governance Lead,
  and you work as a generalist across the full stack: the
  evaluation and governance automation that powers how
  Crunchyroll adopts AI, the reusable building blocks other
  teams ship on, and the day-to-day administration of our
  approved AI tools.

  The work spans three connected areas. You turn AI evaluation
  and governance from a manual process into an automated
  platform - structured evals, intake and scoring pipelines,
  approval routing, policy-as-code, and usage telemetry. You
  administer and configure our approved Enterprise AI tools,
  track new releases, and assess which to adopt so employees
  can get the best use and value. And you develop the golden-
  path templates, reference architectures, and reusable
  components - RAG patterns, agent scaffolding, prompt
  libraries, eval harnesses - that the Build & Partner team
  ships on.

  This is an early, small team, so you'll wear several hats,
  take features end-to-end, and help set the engineering
  patterns the function scales on. It's a role for an engineer
  who wants to build the connective tissue for AI at a fast-
  moving company - equally happy shipping production tooling,
  automating away toil, operating the tools people depend on,
  and creating the foundations other engineers build on.

  In this role, you will...

  - Build the AI evaluation platform:  automated tooling that
    runs structured evals (capability, cost, latency,
    behavior, reliability) at scale rather than as manual,
    one-off reviews
  - Instrument usage and cost telemetry across the approved AI
    stack: token usage, seat utilization, vendor spend, and
    drift detection on approved tools
  - Automate AI Governance: intake triage, scoring pipelines,
    approval routing, and policy-as-code enforcement,
    integrated with Glean agents and JSM workflows
  - Develop golden-path templates, reference architectures, and
    reusable components - RAG patterns, agent scaffolding,
    prompt libraries, eval harnesses - that the Build &
    Partner team ships on
  - Administer and configure Crunchyroll's approved enterprise
    AI tools, including ChatGPT, Glean, Claude, and Gemini;
    manage settings, access patterns, feature enablement, and
    operational changes in partnership with IT and Security
  - Track new feature releases and product changes across
    approved AI tools, assess whether Crunchyroll should adopt
    them, and drive rollout so employees get maximum use and
    value
  - Make the platform the path of least resistance, so AIEN-
    built solutions ride on the golden paths and standards by
    default, and move the metrics that matter (time-to-
    evaluate, golden-path adoption)
  - Build medium-complexity agents and workflows for non-
    technical teams using approved AI platforms, ensuring they
    comply with AIEN standards for security, governance,
    maintainability, and measurement
  - Partner with the AI Security Engineer to bake required
    controls, detection, and prevention into the platform, so
    security is enforced at the platform level rather than
    bolted on per project
  - Operate as a generalist on a small team - own features end-
    to-end from design through production, and help establish
    the engineering patterns the team will scale on

  What We're Looking ForRequired

  - 6+ years of software or platform engineering, including
    building tools or services used by other engineers
  - Hands-on experience administering, configuring, or
    supporting enterprise SaaS tools, AI platforms, or
    internal productivity platforms in a production business
    environment.
  - Strong software engineering skills (e.g., Python, plus
    Go/TypeScript or similar) - you ship production-quality
    tooling, not just prototypes
  - Working knowledge of how modern AI systems work: LLM APIs,
    RAG, agentic frameworks, evaluation methodologies, and
    inference basics
  - Experience building automation, data pipelines, or internal
    developer tooling
  - Experience building practical AI agents, assistants, or
    workflow automations for business users, including
    requirements gathering, prompt/workflow design, testing,
    rollout, and iteration.
  - Previous work owning features end-to-end on a small team -
    design, build, ship, iterate
  - Clear written communication - your tools and docs need to be
    adopted by other engineers

  Strongly Preferred

  - Experience building developer platforms, ML platforms, or
    eval/observability tooling consumed by other teams
  - Experience using and managing enterprise AI tools such as
    ChatGPT Enterprise, Glean, Claude, Gemini, or similar
    platforms.
  - Experience evaluating vendor feature releases and
    translating them into adoption recommendations,
    configuration changes, or governance controls.
  - Hands-on experience with RAG pipelines, agent frameworks,
    prompt orchestration, or eval harnesses
  - Familiarity with policy-as-code, workflow automation (e.g.,
    JSM), or governance/approval tooling
  - Cloud experience (AWS/GCP/Azure) and CI/CD for AI/ML
    workloads
  - Familiarity with AI-specific risk vectors (prompt injection,
    data poisoning, output reliability) - security is owned by
    a partner role, but the platform you build is where
    detection and prevention live
  - Exposure to AI governance and regulatory frameworks (NIST AI
    RMF, ISO 42001, EU AI Act, GDPR/CCPA)
  - Awareness of IP and content rights in media and
    entertainment

  Why you will love working at Crunchyroll

  In addition to getting to work with fun, passionate and
  inspired colleagues, you will also enjoy the following
  benefits and perks:

  - Receive a great compensation package including salary plus
    performance bonus earning potential, paid annually.
  - Flexible time off policies allowing you to take the time you
    need to be your whole self.
  - Generous medical, dental, vision, STD, LTD, and life
    insurance
  - Health Saving Account HSA program
  - Health care and dependent care FSA
  - 401(k) plan, with employer match
  - Employer paid commuter benefit
  - Support program for new parents
  - Pet insurance and some of our offices are pet friendly!

  #LifeAtCrunchyroll #LI-Hybrid

