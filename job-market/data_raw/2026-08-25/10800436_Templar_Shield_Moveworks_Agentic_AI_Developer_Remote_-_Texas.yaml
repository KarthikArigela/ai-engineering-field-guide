description: |
  This is a remote position.

  About Templar Shield

  Templar Shield is a boutique, high-performance consulting
  firm specializing in Enterprise Risk Management,
  Cybersecurity, Identity & Access Management, Operational
  Resilience, and AI Governance. As a ServiceNow Elite
  Partner, we work with highly regulated industries—critical
  infrastructure, financial services, energy, healthcare,
  telecom, and public sector—to deliver secure, modern,
  automated solutions.

  We are expanding our advanced AI practice to include
  Moveworks’ agentic AI platform, enabling enterprises to
  automate service delivery, transform employee experience,
  and accelerate IT and business operations.

  Role Overview

  The Moveworks Agentic AI Developer is responsible for
  designing, building, and deploying intelligent workflows and
  autonomous agents on the Moveworks platform. This role
  requires deep technical expertise in Moveworks AI
  capabilities, enterprise integrations, natural language
  workflows, and automation engineering.

  You will build end-to-end agentic automations that deliver
  real-time IT support, security remediation, HR and
  enterprise-service automations, and unified employee
  experiences using Moveworks’ conversational AI
  infrastructure.

  This role partners closely with architects, business process
  consultants, and client stakeholders to translate business
  outcomes into sophisticated, autonomous agent behavior.

  Key Responsibilities

  Moveworks Development & Agentic Automation



  - Design and build Moveworks autonomous agents to support IT,
    HR, Security, and Enterprise Service workflows.
  - Develop natural-language-based automations, conversational
    flows, and generative responses.
  - Configure Moveworks skills, actions, integrations, and
    domain connectors.
  - Use Moveworks APIs and custom actions to automate tasks
    across ServiceNow, Okta, Azure AD, O365, Workday, Slack,
    Teams, Jira, and other systems.
  - Tune LLM prompts, test output accuracy, adjust grounding
    logic, and refine agent decision paths.

  Systems Integration & Data Engineering



  - Build secure integrations between Moveworks and enterprise
    platforms (ServiceNow, IdP systems, HRIS, ITSM/ESM tools,
    ticketing systems, knowledge bases).
  - Automate resolution steps for common incidents, requests,
    user provisioning, password resets, and workflow tasks.
  - Implement structured data ingestion, knowledge
    synchronization, and retrieval patterns.

  Agent Intelligence & Governance



  - Define agent behavior, policies, safeguards, and escalation
    paths.
  - Implement monitoring, quality scoring, observability
    dashboards, analytics, and model-improvement loops.
  - Ensure compliance with NIST AI RMF, ISO 42001, and emerging
    U.S. AI oversight rules.
  - Maintain documentation for prompts, flows, integrations, and
    agent governance.

  Client Delivery & Advisory



  - Participate in requirements workshops, solution design
    sessions, and stakeholder demos.
  - Translate business requirements into technical
    specifications and development tasks.
  - Support UAT, deployment, and post-deployment optimization.
  - Provide training and enablement for client teams adopting
    Moveworks agents.






  Requirements

  Required Qualifications



  - 3+ years of experience developing AI-driven or automation-
    based solutions using Moveworks, ServiceNow Virtual Agent,
    MS Copilot, or similar platforms.
  - Hands-on experience with Moveworks configuration,
    integrations, and custom actions.
  - Strong proficiency with APIs, JSON, automation frameworks,
    and enterprise systems integration.
  - Solid experience in at least one ecosystem: - ServiceNow -
    Okta or Azure AD - O365 / M365 administration - HRIS
    platforms - Slack/Teams automation
  - Skilled in designing conversational experiences and natural-
    language automation logic.
  - Ability to translate complex processes into structured agent
    behavior and autonomous decision flows.

  Preferred / Nice-to-Have



  - Prior experience implementing Moveworks in enterprise-scale
    environments.
  - Familiarity with LLMs, prompt engineering, vector search,
    and retrieval pipelines.
  - Understanding of ITIL, ITSM/ESM workflows, and enterprise
    support operations.
  - Experience with ServiceNow (ITSM, IRM, SecOps, HRSD) is a
    strong plus.
  - Experience building RPA, automation, or chatbot solutions.
  - Certifications in Moveworks, ServiceNow, Okta, Azure AD,
    ITIL, or related technologies.






  Benefits

  What We Offer



  - Competitive compensation + annual performance-based bonus
  - 100% remote-first culture
  - Employer-sponsored health, dental, LTD, and life insurance
    coverage
  - 401(k) with company match
  - Paid training and certification sponsorship
  - Opportunity to work on next-generation agentic AI programs
    across leading industries
  - A collaborative culture where your process designs shape
    real industry solutions



  How to Apply

  Send your résumé and a short description of one AI or
  automation workflow you’ve built to
  careers@templarshield.com, using the subject line:

  Moveworks Agentic AI Developer - [Your Name]
