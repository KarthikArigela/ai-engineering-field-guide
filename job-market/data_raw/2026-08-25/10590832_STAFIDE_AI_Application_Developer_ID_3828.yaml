description: |
  As an AI Application Developer, you will:

  - Design, develop, and implement AI-powered applications and
    intelligent automation solutions for enterprise use cases.
  - Build and maintain scalable backend services and APIs using
    Python and modern software engineering practices.
  - Develop and optimize LLM-based applications leveraging
    prompt engineering, structured outputs, and retrieval-
    augmented generation (RAG) techniques.
  - Design and implement semantic search and vector-search
    solutions to improve information retrieval and user
    experiences.
  - Integrate large language models into business applications
    while ensuring scalability, reliability, and
    maintainability.
  - Develop and consume RESTful APIs to support AI-driven
    workflows and system integrations.
  - Work with structured and semi-structured data using JSON and
    other data exchange formats.
  - Perform data analysis, comparison logic implementation, and
    validation to support AI solution accuracy and
    effectiveness.
  - Collaborate with business stakeholders to translate use
    cases and requirements into practical technical
    implementations.
  - Ensure AI solutions align with business objectives,
    governance requirements, security standards, and data
    management practices.
  - Participate in Agile development activities including
    technical discussions, solution design, testing, and
    deployment.
  - Contribute to continuous improvement initiatives focused on
    AI innovation, automation, and operational efficiency.

  What You Bring to the Table:

  - Overall 6-8 years of professional experience in software
    development, backend engineering, or AI solution
    development.
  - Strong hands-on experience building AI-enabled applications
    and enterprise-grade intelligent solutions.
  - Expert-level Python development skills with experience
    developing scalable applications and services.
  - Strong experience working with SQL for data analysis,
    querying, validation, and business logic implementation.
  - Hands-on experience designing and developing RESTful APIs
    and backend components.
  - Practical experience working with Large Language Models
    (LLMs) and AI application development frameworks.
  - Strong understanding of prompt engineering techniques for
    enterprise AI use cases.
  - Experience implementing Retrieval-Augmented Generation (RAG)
    architectures and vector-search-based solutions.
  - Knowledge of semantic search concepts and information
    retrieval methodologies.
  - Experience handling JSON and structured data processing
    within application environments.
  - Familiarity with Microsoft Azure services and cloud-based
    solution development.
  - Understanding of AI agents, modern AI workflows, and
    intelligent automation concepts.
  - Experience working within Agile development environments and
    cross-functional teams.
  - Strong communication skills with the ability to collaborate
    effectively with both technical and non-technical
    stakeholders.
  - Ability to balance technical implementation requirements
    with business objectives, governance, and data
    considerations.

  You Should Possess the Ability to:

  - Design and develop scalable AI-powered applications that
    address complex business challenges.
  - Translate business requirements and use cases into practical
    and effective technical solutions.
  - Implement and optimize LLM-based workflows using prompt
    engineering, RAG, and semantic search techniques.
  - Build secure, reliable, and maintainable backend services
    and APIs.
  - Analyze large datasets and implement comparison logic to
    support intelligent decision-making processes.
  - Develop solutions that effectively integrate structured and
    unstructured data sources.
  - Troubleshoot and resolve complex technical issues across AI
    and backend application environments.
  - Work independently while collaborating effectively with
    multidisciplinary teams and stakeholders.
  - Communicate complex AI concepts in a clear and
    understandable manner to business users and decision-
    makers.
  - Adapt to evolving AI technologies, enterprise requirements,
    and emerging industry best practices.

  What We Bring to the Table:

  - Opportunity to work on cutting-edge AI and large language
    model initiatives within enterprise environments.
  - Exposure to modern AI technologies including LLMs, RAG
    architectures, semantic search, and intelligent automation
    solutions.
  - Collaborative Agile work environment focused on innovation,
    knowledge sharing, and continuous improvement.
  - Challenging projects involving AI application development,
    business process transformation, and advanced analytics.
  - Hands-on experience with cloud-based technologies, scalable
    architectures, and enterprise-grade AI implementations.
  - Continuous learning opportunities through exposure to
    emerging AI trends, tools, and best practices.
  - A culture that encourages innovation, ownership,
    collaboration, and professional growth.

