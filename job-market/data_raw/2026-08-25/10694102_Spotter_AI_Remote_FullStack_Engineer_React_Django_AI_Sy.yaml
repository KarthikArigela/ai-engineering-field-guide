description: |
  We're a remote, product-focused startup building AI- and
  algorithm-driven systems. We're looking for a FullStack
  Engineer who can move fluidly between React frontends and
  Django backends. You'll own features end-to-end: from
  designing the data model, building the API, to crafting the
  UI that brings it all together. You'll work with a small
  distributed team across several countries, shipping fast and
  iterating based on real feedback. 💰 $100 bonus: After
  successfully completing the assessment. To receive the
  assessment, please submit your resume to this job
  application. If your resume is approved, you'll receive the
  assessment afterwards.

  What You'll Do

  - Build and ship complete features across React frontend and
    Django backend.
  - Develop responsive web apps using React and Material UI
    (MUI).
  - Design backend services and APIs using Python + Django (DRF
    or similar).
  - Create clean, responsive UIs with React that connect to our
    services.
  - Implement algorithmic/AI logic (scoring, ranking, decision
    rules) and surface it in the UI.
  - Write pragmatic, production-ready code that ships fast and
    iterates easily.

  What We're Looking For

  - Strong proficiency in React and Material UI.
  - Attention to detail: You care about alignment, spacing, and
    how the app feels to the user.
  - Comfortable designing and building RESTful APIs (bonus if
    you’ve used DRF or similar frameworks).
  - Experience working on non-trivial business logic or
    algorithms (e.g., decision flows, scoring rules,
    optimization logic).
  - Good instincts around performance: understanding query
    behavior, avoiding obvious pitfalls, and using caching
    when it counts.
  - Ability to work independently in a remote environment and
    communicate clearly.

  Bonus Points For

  - Comfortable coding with AI assistants (Claude Code, Cursor,
    etc.).
  - Experience shipping complete products in startups, side
    projects, or hackathons.
  - Background in algorithms or data-heavy systems.
  - Experience with GCP, Redis, or Docker/Kubernetes.
  - Familiarity shipping mobile apps with React Native.This role
    is a central piece of our product roadmap, and we're
    aiming to fill it quickly once wemeet the right person. If
    it resonates with you, go ahead and apply now. Send us
    your resumeto start the assessment process (and get a
    chance at the $100 bonus).
