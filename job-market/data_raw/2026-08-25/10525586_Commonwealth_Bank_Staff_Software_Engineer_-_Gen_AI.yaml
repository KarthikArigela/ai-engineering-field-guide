description: |
  Organization:

  At CommBank, we never lose sight of the role we play in
  other people’s financial wellbeing. Our focus is to help
  people and businesses move forward to progress. To make the
  right financial decisions and achieve their dreams, targets,
  and aspirations. Regardless of where you work within our
  organisation, your initiative, talent, ideas, and energy all
  contribute to the impact that we can make with our work.
  Together we can achieve great things.

  Job Title: Staff Software Engineer - Gen AI

  Location: Bangalore

  Business & Team:

  Business Banking Technology executes the Technology Strategy
  across Business Banking through the world-leading
  application of technology and operations. We partner closely
  with the business to solve real-world problems using data
  and AI-driven insights, resilient platforms and modern
  engineering practices, delivering customer value at speed
  and scale.

  You'll join a growing engineering organisation responsible
  for critical capabilities including:

  - Customer and colleague digital experiences
  - CRM and banker platform capabilities
  - Data-driven insights and decisioning services
  - AI-enabled customer engagement experiences
  - Shared platform services supporting Business Banking
    journeys

  Impact & Contribution:

  Apply core concepts, technology, and domain expertise to
  effectively develop software solutions to meet business
  needs. You will contribute to the financial well-being of
  our customers by ensuring that our team builds the best
  solutions possible using modern development practices that
  ensure both functional and non-functional needs are met. If
  you have a history of building a culture of empowerment and
  know what it takes to be a force multiplier within a large
  organization then you’re the kind of person, we are looking
  for.

  Roles & Responsibilities:

  - Collaborating with the team to tackle complex technical
    problems, contributing to design and implementation to
    ensure quality engineering outcomes
  - Translating requirements into engineering solutions,
    assisting in breaking down work and creating clarity for
    team members
  - Experimenting with emerging AI assisted engineering tools
    and cloud services, providing feedback and insights from
    real world testing
  - Delivering robust and reusable solutions that integrate
    seamlessly into other teams’ workflows and products
  - Contributing to architectural discussions and propose
    improvements, role modelling standards and best practices
  - Actively participating in code reviews, maintain high
    quality code bases and assist in documentation for
    knowledge sharing
  - Work on cross-functional projects, ensuring alignment and
    addressing inter-dependencies
  - Coaching and mentoring junior members in the team

  Essential Skills:

  - Minimum exp of 11+ yrs extensive experience in designing and
    implementing scalable, maintainable and reliable software
    solutions
  - Working knowledge of AI/ML and Gen AI applications and how
    they can enhance software engineering processes to improve
    productivity
  - Experience building RAGs using LlamaIndex, LangChain, or
    similar frameworks.
  - Experience building Agentic AI systems using AutoGen,
    SemanticKernel, Pydantic, or similar frameworks is
    preferred
  - Proficiency in one or more programming languages (e.g.,
    Python, TypeScript or C#) and experience developing
    microservices architecture on cloud platforms (AWS &
    Azure)
  - A keen interest in researching new AI tooling and you are a
    daily user of AI coding assistants such as Cursor,
    Continue, GitHub CoPilot, Aider, Cline, etc.
  - Knowledge of or experience in Anthropic Claude, Llama,
    LiteLLM, Cursor, windsurf / Codeium, VO Vercel, Continue,
    Aider, Cline, Langchain, Langgraph, Hugging Face will be
    highly desirable
  - Strong technical leadership skills and ability to
    collaborate with stakeholders to solve business-critical
    problems

  Education Qualification: Bachelor’s degree or Master’s
  degree in Engineering in Computer Science/Information
  Technology

