  About Dscout



  Dscout is a team of passionate, empathetic, and curious
  professionals. As a recognized leader in the Forrester Wave,
  we’re at the cutting edge of experience research technology.
  The power of research drives us - how in-context insights
  from real people can build more enjoyable products and
  services.

  We prioritize learning, sharing, and building. We also
  deeply value being a diverse and inclusive team and company
  and look for team members who align with that belief. Join
  our dynamic team and help shape product roadmaps and
  business strategies for the world’s most loved brands.



  It doesn't stop there. When you join the Dscout team, you
  will get:

  - A strong and competitive compensation package with a built-
    in bonus and equity program.
  - An incredible and progressive benefits package (for both you
    and your dependents) to support work/life balance,
    including flexible PTO, 15 company holidays, 12 weeks of
    paid parental leave, 401k match, and much more.
  - An education stipend to support your growth & development,
    and a remote work stipend.
  - A company that is open and transparent with our team. You
    will know what is happening and why it matters.

