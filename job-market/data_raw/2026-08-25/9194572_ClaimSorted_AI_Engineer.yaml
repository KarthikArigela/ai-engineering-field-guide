description: |
  AI Engineer

  About Us

  ClaimSorted helps insurers outsource claims end to end – a
  service called Third-Party Administration (TPA), a ~$200B
  industry. We combine a strong in-house claims team with our
  AI-enabled platform to deliver up to 3× faster claims,
  better service, and better economics for insurers.

  Backed by Y Combinator, Atomico, and Eurazeo, we’ve raised
  $15M+ and already manage claims for over $100M in insurance
  premium across 30+ MGAs, including more than five publicly
  traded companies. Our goal: scale to $1B and become the most
  valuable TPA in the market.

  The Role

  You will build the AI platform powering insurance claims –
  helping people get support during life’s most critical
  moments. You’ll work with insurance specialists to turn
  claims processes into AI-driven workflows and deploy machine
  learning solutions at scale.

  - Build AI systems that improve accuracy, speed up
    assessments, and enhance customer experience
  - Work with insurance specialists to turn claims processes
    into AI-driven workflows
  - Deploy machine learning solutions at scale
  - Help build the engineering team and shape the technical
    culture from the ground up
  - Work closely with founders and learn how to scale a startup
    from 0 to 1

  We love working together in the office, so this is a full-
  time, office-based role in our London office. We’re a high-
  intensity team and often put in significant time and effort,
  with some people working on weekends, because we believe
  great outcomes come from doing the work well.

  Qualifications

  - 2+ years of experience in AI/ML engineering or research
  - Proven track record of delivering AI/ML projects from
    concept to production, improving key company metrics
  - Passion for shipping quickly
  - Great at working with non-technical users
  - Comfortable operating in ambiguous, high-velocity
    environments

  Our Values

  - Move Fast – Act decisively, iterate quickly, optimise for
    momentum.
  - Always Overdeliver – We exceed expectations in everything we
    do.
  - Think Customer-First, Always – The customer experience
    drives every decision.
  - Challenge the Status Quo – We innovate relentlessly and
    never settle for ‘good enough.’
  - Say It How It Is – Transparency and direct communication
    build trust.

  Compensation & Benefits

  - Competitive salary beyond the industry standard
  - Generous, transparent equity participation
  - Skilled Worker visa sponsorship in the UK
  - 28 days annual leave plus bank holidays
  - 30 days of remote work annually
  - Health insurance
  - Pension contributions in line with UK auto-enrolment
    requirements
  - Company offsites

  About the Interview

  - Intro call – 20 min
  - Technical interview – 45 min
  - ML interview – 30 min
  - Culture interview – 30 min
  - Team day (paid) – come build with us for a day, weekend, or
    evening
