description: |
  We have an opportunity to impact your career and provide an
  adventure where you can push the limits of what's possible.

  As a Lead Software Engineer at JPMorganChase within the CCB
  AI/ML engineering , you are an integral part of an agile
  team that works to enhance, build, and deliver trusted
  market-leading technology products in a secure, stable, and
  scalable way. As a core technical contributor, you are
  responsible for conducting critical technology solutions
  across multiple technical areas within various business
  functions in support of the firm’s business objectives.

  Job responsibilities

  - Executes creative software solutions, design, development,
    and technical troubleshooting with ability to think beyond
    routine or conventional approaches to build solutions or
    break down technical problems
  - Develops secure high-quality AI/ML engineering production
    code, and reviews and debugs code written by others
  - Drives adoption and governance of approved AI-assisted
    engineering practices across teams to improve code
    quality, delivery speed, and operational outcomes (e.g.,
    AI-assisted code review/refactoring, test acceleration,
    release readiness, incident/root-cause analysis), while
    establishing measurable validation standards (secure
    coding, peer review, automated testing) and promoting
    reuse of proven patterns and automation within the
    SDLC/TLM toolchain.
  - Applies knowledge of tools within the Software Development
    Life Cycle toolchain, including approved AI-assisted
    development and automation capabilities, to improve the
    value realized by automation at scale.
  - Identifies opportunities to eliminate or automate
    remediation of recurring issues to improve overall
    operational stability of software applications and systems
  - Leads evaluation sessions with external vendors, startups,
    and internal teams to drive outcomes-oriented probing of
    architectural designs, technical credentials, and
    applicability for use within existing systems and
    information architecture
  - Leads communities of practice across Software Engineering to
    drive awareness and use of new and leading-edge
    technologies
  - Adds to team culture of diversity, opportunity, inclusion,
    and respect



  Required qualifications, capabilities, and skills

  - Formal training or certification on software engineering
    concepts and 5+ years applied experience
  - Hands-on practical experience delivering system design,
    application development, testing, and operational
    stability
  - Demonstrated experience leading effective use of enterprise-
    authorized AI-assisted software development tools within
    the work environment (e.g., for coding, code review, test
    acceleration, troubleshooting) with the ability to set
    team expectations for validating AI outputs for
    correctness, performance, and security
  - Strong understanding of responsible AI use in engineering
    workflows, including data sensitivity considerations,
    secure handling of inputs/outputs, and adherence to
    resiliency and security expectations; experience coaching
    senior engineers/leads on compliant usage patterns and
    controls.Experience required, AI/ML engineering on AWS
    platform
  - Hands-on practical experience delivering system design,
    application development, testing, and operational
    stability
  - Advanced in one or more programming language(s) like Python,
    Java
  - Advanced understanding of agile methodologies such as CI/CD,
    Application Resiliency, and Security
  - Demonstrated proficiency in software applications and
    technical processes within a technical discipline (e.g.,
    cloud, artificial intelligence, machine learning, mobile,
    etc.)
  - In-depth knowledge of the financial services industry and
    their IT systems. Practical cloud native experience



