title: AI Operations Engineer
company: Virta Health
location: USA
remote: true
work_type: FULL_TIME
description: |
  Virta Health is on a mission to reverse metabolic disease in
  one billion people. Current treatment approaches aren’t
  working—over half of US adults have either type 2 diabetes
  or prediabetes, and obesity rates are at an all-time high.
  Virta is changing this by helping people reverse their
  metabolic condition through innovations in technology,
  personalized nutrition, and virtual care delivery reinvented
  from the ground up. We have raised over $350 million from
  top-tier investors, and partner with the largest health
  plans, employers, and government organizations to help their
  employees and members restore their health and take back
  their lives. Join us on our mission to reverse metabolic
  disease in one billion people.

  As our AI Operations Specialist you will be a technical
  catalyst driving Virta's evolution into an AI Native
  organization. You will serve as the hands-on subject matter
  expert partnering on the department-by-department rollout of
  our selected agentic AI platform with HR, ensuring our teams
  safely and effectively exploit generative AI to maximize
  their operational velocity. In this highly cross-functional
  role as part of the Engineering organization, you will
  partner closely with HR, business department SMEs, IT,
  Information Security, and Infrastructure Engineering to
  audit AI costs, evaluate AI connectivity requests, and
  operationalize long-term support workflows. If you are
  exceptionally curious, structurally analytical, and thrive
  in rapidly shifting environments, this role is your
  opportunity to define the future of work in digital health.

  Responsibilities

  - Drive Adoption of selected agentic AI platform: Serve as the
    technical SME and primary champion for our rollout,
    partnering with HR department-by-department to support
    technical request and access, identify productivity
    bottlenecks, and implement high-impact AI use cases.
  - Establish AI Financial Observability: Define, monitor, and
    report on enterprise AI costs by department, creating
    structured dashboards to ensure optimized allocations and
    fiscal efficiency across our SaaS toolset.
  - Govern AI Vendor Risk Assessment: Partner with Information
    Security and legal teams to review, and assess new AI
    tools and vendors, validating how to implement
    connectivity
  - Bridge IT, Security & Engineering Infrastructure:
    Collaborate with internal infrastructure and security
    platform engineering teams to translate evolving technical
    AI guardrails into frictionless business enablement
    policies.
  - Build Repeatable IT Operational Workflows: Architect and
    document long-term support processes, training modules,
    and standard operating procedures (SOPs) to transition
    daily AI ticket triaging, troubleshooting, and license
    management smoothly to the broader IT support team.

  90 Day Plan

  Within your first 90 days at Virta, we expect you will do
  the following:

  - First 30 days: Deep dive into Virta's agentic AI platform
    and the deployment strategy. Build strong relationships
    with key partners in IT, GRC, and Foundations Engineering,
    and shadow current software evaluation queues.
  - Day 30-60: Partner on first pilots across the first key
    business departments, identifying specific workflow
    opportunities. Deliver the first automated dashboard
    tracking AI token utilization and cost metrics broken down
    by department.
  - Day 60-90: Formalize the AI vendor risk checklist in
    partnership with the Security team, deploy self-service AI
    guides, and document onboarding SOPs so that Tier 1 and
    Tier 2 IT support staff can autonomously assist users with
    common generative AI queries.

  Must-Haves

  - 2+ years of experience in agentic AI, IT operations, and
    business systems enablement, 4 years technical program
    management.
  - Technical skills: Hands-on technical experience deploying,
    configuring, or supporting generative AI productivity
    suites (such as Google Gemini, OpenAI/ChatGPT Enterprise,
    or Microsoft Copilot) across corporate environments. API &
    Model Orchestration: Hands-on experience integrating with
    frontier LLMs, multi-agent frameworks, and
    vector/retrieval systems. Software Engineering: Strong
    fundamentals in general software development with
    proficiency in languages like Python and C++.
  - Systems Integration: Ability to design with Model Context
    Protocol (MCP) servers and connect AI systems to existing
    internal legacy databases and web APIs.
  - Strong analytical and quantitative skills with experience
    building dashboard telemetry using APIs (e.g., utilizing
    Sheets, SQL, Looker, or similar BI tools) to gather info
    across platforms to track API utilization, software
    licensing, or operational costs.
  - Exceptional agility and communication skills, with a proven
    ability to demystify complex technical tools for non-
    technical users and coordinate across IT, Security, and
    Engineering.
  - Successfully designed and implemented repeatable AI-enabled
    workflows that address team bottlenecks and improve
    efficiency.
  - Can-do attitude with never-ending curiosity to learn

  Core Responsibilities

  - Tooling & Infrastructure: Build internal AI platforms,
    custom copilots, prompt libraries, and AI-agent toolkits
    designed for specific company workflows.
  - Cross-Functional Enablement: Partner with non-technical
    teams to identify repetitive work and prototype rapid, AI-
    powered solutions.
  - Governance & Standards: Establish the necessary security
    guardrails, evaluation frameworks, and system guardrails
    so internal teams can deploy trusted AI safely at scale.
  - Training & Mentorship: improve AI literacy in partnership
    with HR and promote AI adoption across the entire
    enterprise.

  Values-driven culture

  Virta’s company values drive our culture, so you’ll do well
  if:

  - You put people first and take care of yourself, your peers,
    and our patients equally
  - You have a strong sense of ownership and take initiative
    while empowering others to do the same
  - You prioritize positive impact over busy work
  - You have no ego and understand that everyone has something
    to bring to the table regardless of experience
  - You appreciate transparency and promote trust and
    empowerment through open access of information
  - You are evidence-based and prioritize data and science over
    seniority or dogma
  - You take risks and rapidly iterate

