  Virta has a location based compensation structure. Starting
  pay will be based on a number of factors and commensurate
  with qualifications & experience. For this role, the
  compensation range is $136,000 - $176,000. Information about
  Virta’s benefits is on our Careers page at:
  https://www.virtahealth.com/careers.

  As part of your duties at Virta, you may come in contact
  with sensitive patient information that is governed by
  HIPAA. Throughout your career at Virta, you will be expected
  to follow Virta's security and privacy procedures to ensure
  our patients' information remains strictly confidential.
  Security and privacy training will be provided.

  As a remote-first company, our team is spread across various
  locations with office hubs in Denver and San Francisco.

  Clinical roles: We currently do not hire in the following
  states: AK, HI, RI

  Corporate roles: We currently do not hire in the following
  states: AK, AR, DE, HI, ME, MS, NM, OK, SD, VT, WI.

  Virta uses Ashby as its applicant tracking system, which
  incorporates AI-powered tools (provided by OpenAI, AWS, and
  Google Gemini) in certain aspects of the recruiting process,
  including application review, candidate screening, and
  interview note taking; your data is not used to train AI
  models, and all final hiring decisions are made by Virta
  Health personnel. For more information, see Ashby's AI Terms
  at https://www.ashbyhq.com/resources/terms-ai-features

