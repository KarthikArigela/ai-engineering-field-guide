description: |
  AgileEngine is an Inc. 5000 company that creates award-
  winning software for Fortune 500 brands and trailblazing
  startups across 17+ industries. We rank among the leaders in
  areas like application development and AI/ML, and our
  people-first culture has earned us multiple Best Place to
  Work awards.

  WHY JOIN US

  If you're looking for a place to grow, make an impact, and
  work with people who care, we'd love to meet you!

  ABOUT THE ROLE

  We are looking for an Agentic AI Engineer to develop systems
  that accelerate cloud security baseline enforcement and
  remediation for a Cloud Security Tooling team. You will
  implement GenAI workflows using RAG, vector databases, and
  LLM APIs to automate configuration baseline creation, build
  AI-enabled drift detection and gap analysis capabilities,
  and generate and validate compliant Terraform modules and
  Rego policies for CI/CD pipelines. The role requires 4+
  years of cloud software engineering experience with 2+ years
  of agentic AI development using OpenAI, Anthropic, or
  similar APIs.

  WHAT YOU WILL DO

  - Implement generative AI workflows utilizing RAG, vector
    databases, and LLM APIs to automate the creation of cloud
    configuration baselines.

  - Develop AI-enabled drift detection, continuous discovery,
    and gap analysis capabilities to accelerate response and
    remediation activities.

  - Generate and validate compliant Terraform modules, Rego
    policies (for Wiz Custom Configuration Rules), and Regula
    test cases for CI/CD pipelines.

  MUST HAVES

  - 4+ years of software engineering experience developing
    applications and services hosted on public cloud
    infrastructure.

  - 2+ years of experience with cloud infrastructure deployment
    pipelines and infrastructure as code (IaC).

  - 2+ years of experience developing Agentic models (e.g.,
    OpenAI, Anthropic) using grasp Retrieval-Augmented
    Generation (RAG) and Vector databases.

  - Proven capability to partner with globally distributed
    inter-disciplinary engineering teams.

  - Upper-intermediate English level.

  NICE TO HAVES

  - Hands-on experience with modern AI orchestration frameworks
    (LangChain, LangGraph).

  - Hands-on experience writing Rego policies (Open Policy
    Agent) or Regula test cases.

  - Hands-on experience with Terraform.

  - Familiarity with cloud-native security services in Amazon
    Web Services, Azure, and Google Cloud Platform.

  - Familiarity with PagerDuty, Atlassian Suite, and ServiceNow.

  PERKS AND BENEFITS

  - Growth without limits: build your skills through mentorship,
    internal TechTalks, challenging projects, and a dedicated
    annual learning budget

  - Competitive compensation: get recognition that reflects your
    skills and impact, with regular performance and
    compensation reviews

  - Flexibility: work 100% remotely with flexible hours that
    support focus, autonomy, and a healthy work rhythm

  - Meaningful, modern projects: build impactful products using
    modern technologies alongside global teams and leading
    brands

  - Collaborative culture: join a supportive environment with
    zero micromanagement where ideas are welcomed and
    contributions are recognized

  - Well-being & support: access local well-being programs and
    people-focused support tailored to your location
