  Company Description

  Careerflow.ai is an all-in-one career platform acting as
  your "Career Copilot". Our platform simplifies the job
  search process for professionals by either automating or
  augmenting parts of the process, such as AI-driven resume
  and profile improvements, job application tracking and
  management, among other things.

  We are a US-based startup with a team based in Delhi, India.
  We have helped over 900,000+ individuals in optimizing their
  job search process, through a combination of a web
  application and Chrome browser extension.

  Along with our product, we also provide high-quality expert-
  led career services.

  Additionally, we work with universities, higher education,
  non-profits, bootcamps, career coaches, etc., to provide
  them a data-driven platform for the career success of their
  associated members.

  Why Join Us

  - Be part of a cutting-edge AI company with an innovative team
    dedicated to transforming the recruitment and career
    development industry.
  - Work in a fast-paced, mission-driven startup
  - Contribute to a platform that’s revolutionizing job-seeking,
    hiring processes, and professional growth.
  - Collaborate with a global, diverse, creative, and forward-
    thinking team
  - Drive meaningful impact on the future of careers

  Must have Skillset

  LLM Engineering, Agentic AI Frameworks
  (LangChain/AutoGen/CrewAI), Python, OpenAI APIs (or
  similar), Prompt Engineering, Vector Databases, Google Cloud
  Platform, Git, AI Product Experience, Firebase, Node Js,
  Clickhouse

  Role Description

  This is a full-time hybrid role for an AI Engineer (LLM /
  Agents).

  The AI Engineer will be responsible for designing,
  developing, and deploying intelligent AI agents and LLM-
  powered systems that automate and enhance our career
  optimization features including autonomous resume analysis,
  intelligent job matching, AI interview agents, etc.

  We are looking for someone who is adept at building agentic
  AI systems and working with large language models, but also
  a great collaborator that can work with an asynchronous,
  remote team situated across the globe. Traditional Machine
  Learning experience is highly preferred.

  Responsibilities

  - Lead and manage the development of autonomous AI agents that
    power our core features including intelligent resume
    optimization, ATS scanning agents, job matching systems,
    and AI-driven career coaching, AI Interview, etc.
  - Design and implement multi-agent systems using frameworks
    like LangChain, AutoGen, CrewAI, or LangGraph for complex
    workflow orchestration
  - Work closely with a team of 4+ engineers to integrate
    agentic AI capabilities across our web applications and
    Chrome browser extensions
  - Develop and maintain RAG (Retrieval-Augmented Generation)
    systems for contextual career guidance and personalized
    recommendations
  - Implement advanced prompt engineering strategies and fine-
    tuning techniques for domain-specific LLMs
  - Build and optimize vector databases for semantic search and
    knowledge retrieval systems
  - Design agent workflows that can autonomously handle multi-
    step career optimization tasks
  - Collaborate with the Product and Design team to translate AI
    agent capabilities into intuitive user experiences
  - Ensure scalability, reliability, and performance of AI agent
    systems in production environments
  - Implement human-in-the-loop systems and agentic evals for
    agent oversight and quality control
  - Drive integration of state-of-the-art LLMs (GPT-4, Claude,
    Gemini) and emerging AI technologies
  - Work with big data technologies such as ClickHouse,
    BigQuery, etc. for training data management and LangSmith
    (or similar) for logging and tracing.
  - Build traditional Machine Learning workflows, fine-tune
    models, etc. for non-LLM use cases.
  - Bonus: Work closely with the C-suite of the company as a
    tech lead

  A Note on Location

  You will be required to work from an office up to 3 days a
  week in Delhi, India, with general flexibility to work
  remotely from time to time. General expectations are that
  you would need to work 6 days a week on average, with US
  overlap.
