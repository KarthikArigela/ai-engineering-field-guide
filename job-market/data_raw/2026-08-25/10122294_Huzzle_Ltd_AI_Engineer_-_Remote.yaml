description: |
  About Huzzle

  At Huzzle, we connect exceptional talents with top
  opportunities at leading companies across the UK, US,
  Canada, Europe, and Australia. Our clients include startups,
  digital agencies, and tech platforms in industries such as
  SaaS, MarTech, FinTech, and AI.

  Unlike an outsourcing agency, we place you directly with a
  client where you’re hired in-house as a valued member of
  their team.

  Role Type: Full-time

  Engagement: Independent Contractor

  Job Summary

  We are looking for a skilled AI Engineer with at least 2
  years of hands-on experience in developing, deploying, and
  optimizing AI and machine learning solutions. You will work
  closely with product, engineering, and data teams to design
  intelligent systems, integrate AI models into production
  environments, and contribute to cutting-edge AI initiatives.

  This is an exciting opportunity for someone passionate about
  machine learning, generative AI, LLMs, automation, and
  scalable AI infrastructure in a fully remote environment.

  Key Responsibilities

  - Design, build, and deploy AI/ML models for real-world
    applications.
  - Develop and optimize AI-powered features using modern
    frameworks and APIs.
  - Work with Large Language Models (LLMs) such as GPT, Claude,
    or open-source alternatives.
  - Build AI pipelines for data processing, training, inference,
    and monitoring.
  - Collaborate with cross-functional teams to translate
    business needs into AI solutions.
  - Integrate AI services into web applications, SaaS platforms,
    and internal tools.
  - Fine-tune and evaluate machine learning models for
    performance and scalability.
  - Maintain documentation and ensure AI systems follow security
    and compliance best practices.
  - Stay updated with the latest advancements in AI, machine
    learning, and automation technologies.

  Requirements

  - 2+ years of experience as an AI Engineer, Machine Learning
    Engineer, or similar role.
  - Strong experience with Python and AI/ML libraries such as
    TensorFlow, PyTorch, Scikit-learn, or LangChain.
  - Experience working with LLMs, generative AI, prompt
    engineering, or AI agents.
  - Familiarity with vector databases, embeddings, and
    retrieval-augmented generation (RAG).
  - Experience deploying models using cloud platforms like AWS,
    Azure, or Google Cloud.
  - Understanding of APIs, microservices, and backend
    development.
  - Experience with Docker, Git, and CI/CD workflows.
  - Strong analytical and problem-solving skills.
  - Excellent communication skills and ability to work remotely
    with global teams.
  - Bachelor’s degree in Computer Science, AI, Data Science, or
    related field preferred.
  - Experience with AI automation tools and agent frameworks.
  - Knowledge of MLOps and model monitoring tools.
  - Familiarity with NLP, computer vision, or recommendation
    systems.
  - Experience building AI SaaS products or chatbots.
  - Exposure to FastAPI, Node.js, or React-based applications.

  Benefits

  💰 Competitive salary based on experience and location

  🌎 Fully remote role with flexible work environment

  🚀 Work on cutting-edge AI automation projects with real
  business impact

  📈 Strong growth opportunity into senior AI / systems roles

  🧠 Exposure to LLMs, prompt engineering, and scalable AI
  system design

  🤝 Direct collaboration with a fast-moving, high-performance
  team
