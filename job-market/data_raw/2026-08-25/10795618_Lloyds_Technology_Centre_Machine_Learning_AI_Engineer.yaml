  Job Description

  Analyses key themes using data from a wide range of sources
  and identifies possible impacts on the business. Delivers
  prescribed outcomes by working as directed within
  established data management systems and procedures. Meets
  the needs of significant customers related to a range of
  products and services and/or manages a customer advisor team
  over a given area. Writes and edits materials for a variety
  of target populations, tailoring the tone and content to
  match the needs and expectations of each audience. Takes
  responsibility for implementing a team's formal development
  framework with guidance from senior colleagues, while
  informally coaching others throughout the organisation in
  area of expertise and pursuing and investing in
  opportunities for own personal development. Identifies
  shortcomings and suggests improvements to existing
  processes, systems and procedures, then delivers a plan for
  a small element of a change management programme with
  guidance from a project/programme manager. Advises managers
  how to apply a wide variety of existing procedures and
  precedents. Highlights shortcomings and suggests
  improvements in current IT Security processes, systems and
  procedures within assigned unit and/or discipline. Explores
  issues and/or needs to establish potential causes, related
  issues and barriers. Delivers prescribed outcomes for a
  designated area, using risk management systems to ensure the
  organisation is not exposed to undue risks. Develops and/or
  delivers elements of a strategic planning system with
  guidance from senior colleagues. Manages the development
  and/or operation of knowledge management system with
  guidance from senior colleagues. Develops and/or delivers a
  plan for a specific area of responsibility by managing
  others. Sets short term objectives and helps manage the
  performance of direct reports by working within performance
  management systems. Navigates a wide variety of existing
  processes, procedures and precedents to interpret data and
  identify possible answers.
