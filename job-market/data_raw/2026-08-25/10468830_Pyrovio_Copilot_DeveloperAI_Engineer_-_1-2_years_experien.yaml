description: |
  Copilot Developer/AI Engineer - Entry-Level

  Hands-on development and technical architecture for Copilot
  agents, automations, and integrations

  Role Overview

  The entry-level Copilot Developer/AI Engineer turns
  strategic blueprints into working agents, workflows, and
  integrations, while also providing architectural guidance
  for complex implementations. They develop Copilot agents,
  Power Automate flows, reusable prompt “skills,” and locally-
  run AI solutions using tools such as Claude, ensure
  solutions are scalable and secure, and support the team
  through technical standards, mentorship, and escalation
  handling. A strong working knowledge of modern AI tools —
  particularly Microsoft Copilot and Claude (and related
  tools) — is central to the role, as is the curiosity to
  continually seek out and evaluate new AI platforms while
  operating responsibly within a regulated environment with
  strict data controls.

  Description

  We are seeking a Microsoft Power Platform Developer who is
  also familiar with Microsoft Copilot Studio to join our
  growing team. In this role, you will design, develop,
  implement, and optimize AI-powered productivity and
  automation solutions for a diverse portfolio of clients.

  You will partner closely within an internal team to identify
  opportunities where the Power Platform, Power Automate, and
  Microsoft Copilot Studio — as well as other AI tools and
  technologies, including Claude used locally outside of the
  Microsoft 365 environment — can deliver transformative
  business value, ensuring that solutions are strategically
  aligned, technically sound, and effectively adopted.
  Engagements allow you to take ownership from solution
  development through implementation, optimization, and
  adoption. Throughout, you will work within a regulated
  environment governed by strict data controls, balancing
  rapid AI experimentation with rigorous compliance and data
  protection.

  Key Responsibilities

  Solution Architecture & Development

  Develop application in PowerApps using Dataverse, Power
  Automate, Excel, Forms and SharePoint online. Use multiple
  Out-of-The-Box connectors with Power Apps, Power Automate.
  Develop and deploy Microsoft Copilot Studio solutions that
  integrate seamlessly with Teams, Microsoft 365, Power
  Platform (Power BI, Power Automate, Power Apps), and other
  enterprise systems. Build and run AI-assisted solutions
  using Claude locally — outside of the Microsoft 365
  environment — for development, prototyping, and automation,
  while keeping data handling compliant with organizational
  and client controls. Incorporate adaptive cards, variables,
  triggers, connectors, and API integrations into Copilot
  Studio solutions to maximize functionality.

  Collaborate in prompt engineering: crafting effective
  prompts, skills, and grounding/context strategies across
  both Copilot and Claude (and related tools). Participate in
  solution testing, validation, and quality assurance
  Technical feasibility analysis, solution design
  documentation, and user guides Ensure solutions comply with
  Microsoft security, compliance, and governance standards,
  including Entra ID (Azure AD), Microsoft Purview, and DLP
  (Data Loss Prevention) policies. Apply strict data-control
  practices to all AI tooling — including locally-run models
  such as Claude — ensuring sensitive and regulated data is
  handled, stored, and transmitted in accordance with policy.
  Mentor teammates, provide technical guidance, and handle
  escalated issues from deployed solutions

  Optimization & Continuous Improvement

  Develop supporting documentation, user guides, and
  enablement materials to encourage effective adoption and
  continuous improvement. Optimize development efforts based
  on user feedback. Stay current with emerging Microsoft Power
  Platform and Copilot features. Proactively seek out,
  evaluate, and pilot new AI tools and platforms, assessing
  their fit, value, and — critically — their compatibility
  with the organization's regulated environment and data-
  control requirements before adoption.

  Technical Troubleshooting & Support

  Diagnose and resolve technical challenges related to Copilot
  Studio implementations, working closely with internal
  engineering teams when necessary. Ensure data security in
  all Power Platform and Copilot-enabled solutions.

  Required Qualifications

  This is an entry-level position. Bachelor’s degree in a
  technical field and 1-2 years of professional experience, OR
  equivalent combination of education and experience. Proven
  success in Microsoft Power Platform and Copilot Studio
  solution design, development, and deployment. Strong, hands-
  on working knowledge of modern AI tools — specifically
  Microsoft Copilot and Claude (and related tools) — including
  their use for development, automation, and prompt
  engineering. Experience using Claude locally (outside the
  Microsoft 365 environment) for AI-assisted development and
  automation.

  Strong familiarity with Teams, Microsoft 365, Power
  Platform, Azure, and their integration points. Familiarity
  with Microsoft Graph API, REST APIs, and third-party system
  integrations Skilled in identifying AI-driven optimization
  opportunities. Demonstrated ability to work effectively
  within a regulated environment with strict data controls,
  balancing AI experimentation against compliance, governance,
  and data-protection obligations.

   A genuine desire to explore, test, and adopt emerging AI
  tools and platforms. Excellent problem-solving, analytical,
  and troubleshooting skills. Experience with data integration
  from multiple sources while maintaining accuracy, quality,
  and compliance. Understanding of prompt engineering
  principles and LLM behavior; experience with RAG-based
  architectures preferred Exceptional written and verbal
  communication skills, including presentation development and
  delivery. Ability to work independently in a remote-first
  environment while maintaining strong coworker relationships.

  Preferred Qualifications

  Demonstrated ability to translate complex technical concepts
  into clear, actionable recommendations for non-technical
  stakeholders. Prior experience working for Microsoft or a
  Microsoft Gold/Cloud Solutions Partner. Certifications in
  Microsoft Power Platform, AI, or Copilot-related
  specialties. Experience with Agile/Scrum delivery models for
  enterprise technology projects. Knowledge of AI prompt
  engineering and LLM (Large Language Model) optimization
  techniques. Experience deploying and governing AI tools —
  such as Claude and other non-Microsoft models — in regulated
  or data-sensitive environments.

  Work Environment & Travel

  Location: United States, Eastern Time Zone Travel: None
  required. Work Hours: This role is for a United States
  company. Work will be conducted in English, and can be done
  asynchronously with the US time zones, though some overlap
  will be required for meetings and collaboration.

  About the Role

  This is a strategic consulting role where you will be part
  of a high-performing, client-focused team dedicated to
  unlocking the full potential of Microsoft Power Platform,
  Copilot, and a broader set of AI tools including Claude. You
  will work with organizations to reimagine productivity,
  streamline workflows, and empower teams with AI-driven
  insights and automation — always within a regulated
  environment where strong data controls and responsible AI
  adoption are non-negotiable.

  Perks and Benefits:

  - Competitive Compensation
  - Comprehensive Benefits - Medical, Retirement, Holidays, PTO
    etc.
  - Ability to carve your own career path and gain deep
    professional expertise by working with multiple clients
    and engagements and oversee the implementation of your
    recommendations
  - Opportunity to develop and advance within a growing
    organization

  Additional Information:

  - For more information, please visit our website at
    www.pyrovio.com

