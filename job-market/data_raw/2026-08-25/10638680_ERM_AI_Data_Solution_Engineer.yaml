description: |
  **This requisition is not an active hiring opportunity. We
  are gathering resumes to support future project requirements
  and to build our talent pipeline. **

  ERM is seeking an AI Data Engineer Consultant in North
  America to join our global Digital Services business. At
  ERM, we offer a robust combination of deep EHS&S experience
  together with broad environmental management information
  solution expertise. Our services span the entire information
  management life cycle, from assisting clients with
  information solutions portfolio assessment, strategy,
  technology evaluation and planning, to designing, testing
  and implementing enterprise-wide systems and innovative
  technologies.

  ERM has enduring values, which are fundamental to our
  business conduct. We are passionate about our people, their
  safety, well-being and development. ERMers take
  accountability, are client focused, and collaborate with
  colleagues across geographies.  If you share our values,
  believe in sustainability and are motivated by opportunities
  to shape, build, and contribute to a team that makes a real
  impact to our client’s businesses, ERM is the right place
  for you. We offer a flexible working environment and
  competitive salary.

   As a Consultant on our team, you will be a valuable asset
  amongst a diverse team of professionals striving to address
  business growth, daily business operations and environmental
  issues. You will work within an environment that promotes
  proactive cooperation and motivates individuals to maintain
  a positive attitude in order to consistently deliver quality
  services and technical solutions.


   Lead the next wave of AI‑driven digital transformation

  If you thrive at the frontier of artificial intelligence,
  data engineering, and modern software development—and want
  your work to move beyond experimentation into real‑world
  impact—this role offers a unique opportunity to shape how AI
  delivers value at scale. As an AI Data Engineer, you will
  help define how intelligent systems turn complex data into
  actionable insight for clients navigating their most
  critical challenges.


  Why This Role Matters

  Artificial intelligence is rapidly reshaping how
  organizations make decisions, manage risk, and unlock value
  from data. This role plays a pivotal part in transforming AI
  from a promising concept into a dependable, production‑ready
  capability. You will architect intelligent pipelines,
  orchestrate advanced AI workflows, and deliver trusted
  outputs that directly influence business decisions,
  strategy, and outcomes.


  What Your Impact Is

  Enable AI‑driven solutions that transform messy, fragmented
  data into structured, business‑ready outputs.

  Design and scale intelligent workflows that combine LLMs,
  automation, and modern data engineering practices.

  Shape customer‑facing solutions by bridging AI research,
  robust engineering, and user‑centric design.

  Help evolve how organizations operationalize AI responsibly,
  effectively, and at enterprise scale.


  What You’ll Bring

  Required

  University degree holder in an environmental or technical
  field such as Environmental Sciences, Information
  Technology, Computer Science, Engineering, Management
  Information Systems, or Theoretical Business.

  4-6 years of relevant experience in an AI data engineering
  and or EHS-related field.

  Diversified information technology background and knowledge
  of EHS software, methodologies, domains and technology an
  advantage but not required. (Environmental Compliance,
  Industrial Hygiene and Safety, Occupational Health,
  Occupational Hygiene, Audit Management, Incident Management
  & Risk Assessment)

  Hands‑on experience working with large language models
  (OpenAI, Anthropic, Mistral, or open‑source equivalents).

  Deep understanding of embeddings, vector search, semantic
  similarity, and RAG architectures.

  Strong proficiency in Python with experience using async
  patterns, data libraries (pandas, polars), and AI SDKs.

  Experience implementing AI workflows using LangChain,
  LlamaIndex, or similar orchestration frameworks.

  Solid skills in SQL, relational data modeling, and
  performance optimization.

  Proven ability to generate and manipulate Excel, PDF, and
  Word documents programmatically.

  Experience building APIs using FastAPI, .NET, or Node.js and
  integrating them into production systems.


  Preferred

  Front‑end development experience using Vue 3 (Composition
  API) and TypeScript.

  Experience with vector databases and AI‑oriented data
  storage patterns.

  Familiarity with containerization, cloud platforms, or
  serverless architectures.

  Background in NLP, document intelligence, or data enrichment
  pipelines.

  Exposure to monorepo or large‑scale project tooling (e.g.,
  Turborepo, Nx).


  Key Responsibilities

  Design and implement AI‑powered data pipelines to extract,
  clean, enrich, and transform structured and unstructured
  data.

  Orchestrate LLMs to automate data manipulation, validation,
  and cross‑referencing tasks.

  Deliver polished, customer‑ready outputs in Excel, PDF,
  Word, and other business formats.

  Prototype emerging AI tools and approaches, translating
  proofs‑of‑concept into scalable solutions.

  Build and integrate full‑stack applications, connecting
  AI‑driven back‑ends to modern web interfaces.

  Design and optimize relational and vector databases to
  support AI workflows at scale.

  Contribute to best practices for code quality,
  documentation, and maintainable system design.

  Ready to make an impact? Apply today and join a team that
  combines technology, sustainability, and purpose to create a
  better future.


  Who We Are: As the largest global pure play sustainability
  consultancy, we partner with the world’s leading
  organizations, creating innovative solutions to
  sustainability challenges and unlocking commercial
  opportunities that meet the needs of today while preserving
  opportunity for future generations.


  At ERM we know that creating a diverse, equitable and
  inclusive work environment is an essential part of making
  our company a great place to build a career. We also see our
  diversity as a strength that helps us create better
  solutions for our clients. Our diverse team of world-class
  experts supports clients across the breadth of their
  organizations to operationalize sustainability, underpinned
  by our deep technical expertise in addressing their
  environmental, health, safety, risk and social issues. We
  call this capability our “boots to boardroom” approach for
  its comprehensive service model that allows ERM to develop
  strategic and technical solutions that advance objectives on
  the ground or at the executive level.

  Please submit your resume and brief cover letter.


  ERM does not accept recruiting agency resumes. Please do not
  forward resumes to our jobs alias, ERM employees or any
  other company location. ERM is not responsible for any fees
  related to unsolicited resumes.

  Thank you for your interest in ERM!
