description: |
  InMobi Advertising is a global technology leader helping
  marketers win the moments that matter. Our advertising
  platform reaches over 2 billion people across 150+ countries
  and turns real-time context into business outcomes,
  delivering results grounded in privacy-first principles.
  Trusted by 30,000+ brands and leading publishers, InMobi is
  where intelligence, creativity, and accountability converge.
  By combining lock screens, apps, TVs, and the open web with
  AI and machine learning, we deliver receptive attention,
  precise personalization, and measurable impact.

  Through Glance AI, we are shaping AI Commerce, reimagining
  the future of e-commerce with inspiration-led discovery and
  shopping. Designed to seamlessly integrate into everyday
  consumer technology, Glance AI transforms every screen into
  a gateway for instant, personal, and joyful discovery.
  Spanning diverse categories such as fashion, beauty, travel,
