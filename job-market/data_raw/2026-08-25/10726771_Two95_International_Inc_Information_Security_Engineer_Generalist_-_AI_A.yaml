description: |
  Role:

  We are hiring an Information Security Engineer (Generalist)
  to support and enhance our growing Information Security
  program. The candidate should be hands-on, able to manage
  daily security operations while also working across multiple
  security projects throughout the year.

  Key Responsibilities:

  • Support daily security operations (monitoring, alert
  triage, investigations).

  • Work on incident response, vulnerability management, and
  risk remediation.

  • Manage and support security tools like SIEM, EDR, IAM,
  DLP, vulnerability scanners.

  • Assist with security compliance activities and
  documentation.

  • Drive process optimization and automation using
  scripting/workflows.

  Requirements:

  • 7–10 years of cybersecurity engineering/operations
  experience.

  • Strong generalist exposure across security domains.

  • Experience with security tools (SIEM/EDR/Vulnerability
  tools).

  • Exposure to AI-enabled security technologies and
  automation (Python/PowerShell preferred).

  • Strong problem-solving and cross-functional collaboration
  skills.
