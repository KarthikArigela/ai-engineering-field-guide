description: |
  Company Description

  At IFS, we're building the next generation of AI-native
  enterprise software, transforming how some of the world's
  largest organisations manage assets, operations and critical
  services.

  This is an opportunity to work at the forefront of modern AI
  engineering, building intelligent products that combine
  Large Language Models (LLMs), agentic AI and cloud-native
  technologies to solve complex, real-world business
  challenges at enterprise scale.

  We're looking for engineers who are passionate about
  building production AI systems and excited by the
  opportunity to shape the future of enterprise software.

  Please note that this role requires demonstrable, hands-on
  experience designing, building and shipping production AI
  applications.

  This role requires strong, demonstrable experience applying
  Domain-Driven Design (DDD) and specification-driven
  development in complex production software environments.

  Candidates should be able to demonstrate hands-on experience
  defining domain models and bounded contexts and using
  specifications to drive software design and implementation.

  Candidates whose AI experience is limited to using tools
  such as ChatGPT, Claude, Cursor or GitHub Copilot to assist
  software development, without demonstrable experience
  building AI-powered products or systems, will not meet the
  requirements for this role.

  IFS is a billion-dollar revenue company with 7000+ employees
  on all continents. Our leading AI technology is the backbone
  of our award-winning enterprise software solutions, enabling
  our customers to be their best when it really matters–at the
  Moment of Service™. Our commitment to internal AI adoption
  has allowed us to stay at the forefront of technological
  advancements, ensuring our colleagues can unlock their
  creativity and productivity, and our solutions are always
  cutting-edge.

  At IFS, we’re flexible, we’re innovative, and we’re focused
  not only on how we can engage with our customers but on how
  we can make a real change and have a worldwide impact. We
  help solve some of society’s greatest challenges, fostering
  a better future through our agility, collaboration, and
  trust.

  We celebrate diversity and understand our responsibility to
  reflect the diverse world we work in. We are committed to
  promoting an inclusive workforce that fully represents the
  many different cultures, backgrounds, and viewpoints of our
  customers, our partners, and our communities. As a truly
  international company serving people from around the globe,
  we realize that our success is tantamount to the respect we
  have for those different points of view.

  By joining our team, you will have the opportunity to be
  part of a global, diverse environment; you will be joining a
  winning team with a commitment to sustainability; and a
  company where we get things done so that you can make a
  positive impact on the world.

  We’re looking for innovative and original thinkers to work
  in an environment where you can #MakeYourMoment so that we
  can help others make theirs. With the power of our AI-driven
  solutions, we empower our team to change the status quo and
  make a real difference.

  If you want to change the status quo, we’ll help you make
  your moment. Join Team Purple. Join IFS.



  Job Description

  We're looking for experienced software engineers who combine
  strong Domain-Driven Design and event-driven architecture
  with modern AI-native engineering practices.

  You'll analyse complex enterprise problems using DDD, design
  event-driven solutions, use specification-driven AI
  workflows throughout software development, and build
  production applications where native AI capabilities form an
  integral part of the customer experience.

  If you don't have demonstrable DDD, spec driven experience
  on your CV, you will be rejected.

  This is not an AI research or MLOps role. We're looking for
  software engineers who have demonstrable experience shipping
  production-grade AI-native applications and who use AI as
  part of both how software is built and what the resulting
  product can do.

  We are looking for a talented Lead/Senior Software Engineer
  to join our Enterprise Asset Management team and play a
  leading role in designing, building and evolving modern
  enterprise software.

  You'll help deliver scalable, secure and high-quality
  software that solves complex customer challenges while
  applying modern engineering practices and AI capabilities
  where they create genuine business value.

  We're looking for experienced Lead/Senior Software Engineers
  who have built and shipped complex production systems and
  who understand how emerging AI technologies can be
  successfully integrated into enterprise products. This is
  not an AI research or AI platform engineering role. Instead,
  you'll work on real customer problems, building domain-
  driven software where AI enhances product capabilities and
  customer outcomes.

  The ideal candidate will demonstrate strong technical
  leadership, excellent problem-solving and communication
  skills, and a proven track record of delivering high-quality
  enterprise software at scale. You'll work closely with
  Product, Design and Engineering teams to build intelligent
  Enterprise Asset Management solutions, mentor engineers,
  drive engineering excellence and help shape the future of
  enterprise software at IFS.

  Engineering Mindset

  You are first and foremost a software engineer who enjoys
  solving complex business problems through well-designed
  software.

  You understand how to design scalable systems, model complex
  business domains and build software that is reliable,
  maintainable and easy to evolve.

  You recognise AI as an important capability within modern
  software engineering and understand how technologies such as
  Large Language Models (LLMs) can enhance enterprise
  applications when applied to genuine customer problems.

  You balance innovation with simplicity, maintainability,
  security and operational excellence, making pragmatic
  engineering decisions that deliver long-term value.

  Above all, you care about building great software that
  customers rely on every day.

  Business Mindset

  Aligns engineering decisions with business goals, focusing
  on initiatives that deliver measurable customer value.

  Understands the commercial impact of technical decisions and
  identifies opportunities where AI and modern technologies
  can improve business processes, user experiences and
  operational efficiency.

  Balances innovation with practicality, helping teams make
  decisions that support long-term product success.

  Builds for Customers

  Demonstrates a customer-first mindset by making technical
  decisions based on customer needs and business outcomes.

  Works closely with Product Management and stakeholders to
  understand operational challenges and designs software that
  simplifies workflows, improves decision-making and delivers
  measurable value.

  Applies AI capabilities thoughtfully where they genuinely
  improve customer experiences rather than adopting technology
  for its own sake.

  Drives Progress with Accountability

  Takes ownership of delivering high-quality software by
  removing blockers, maintaining engineering standards and
  supporting teammates.

  Delivers on commitments while communicating risks early and
  making pragmatic decisions around technical debt,
  architecture, quality and delivery.

  Champions continuous improvement across engineering
  practices, software quality and team collaboration.

  Technical Skills

  Required

  Software Engineering

  - Strong hands-on experience with Go and modern backend
    development, ideally alongside TypeScript/Node.js.
  - Experience designing and building distributed systems,
    microservices and RESTful APIs.
  - Strong understanding of Domain-Driven Design (DDD), bounded
    contexts, event-driven architecture and service
    decomposition.
  - Experience building scalable cloud-native applications using
    technologies such as Kubernetes, Kafka, Redpanda,
    PostgreSQL and MongoDB.
  - Experience working with AWS and/or Azure.
  - Strong understanding of CI/CD, automated testing,
    observability and production operations.
  - Experience designing secure software, authentication and
    authorisation mechanisms and applying DevSecOps
    principles.
  - Strong analytical and problem-solving skills with the
    ability to mentor engineers and lead technical
    initiatives.

  Applying AI in Enterprise Software

  - Experience integrating AI capabilities into production
    software to solve real customer or business problems.
  - Hands-on experience working with Large Language Models
    (LLMs) within enterprise applications.
  - Understanding of modern AI application patterns such as
    Retrieval-Augmented Generation (RAG), tool calling, prompt
    engineering and agentic workflows where appropriate.
  - Experience evaluating AI-enabled features for quality,
    reliability, performance, security and operational
    readiness.
  - Experience using AI-assisted engineering tools such as
    GitHub Copilot, Cursor or Claude Code to improve software
    development workflows.
  - Appreciation of responsible AI practices including
    governance, monitoring and observability.

  Beneficial

  - Experience with React and modern frontend development.
  - Experience building Enterprise SaaS or ERP products.
  - Experience working with Model Context Protocol (MCP) or
    similar AI integration standards.
  - Experience with vector databases, AI observability or AI
    evaluation frameworks.
  - Experience designing and delivering enterprise-scale AI
    platforms or AI-powered products.

  Qualifications

  - A degree in Computer Science, Software Engineering or
    Information Technology along with minimum 6 years'
    experience in a similar role.
  - Excellent communication and multi-tasking skills along with
    an innovative mindset.

  Additional Information

  We embrace flexibility and hybrid work opportunities to
  support diverse needs and lifestyles, while also valuing
  inclusive workplace experiences. By fostering a sense of
  community, we drive innovation, strengthen connections, and
  nurture belonging. Our commitment ensures you can work in a
  way that suits you best, while also engaging with colleagues
  to share ideas and build meaningful relationships.
