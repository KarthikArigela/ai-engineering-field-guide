description: |
  Meet the Team

  This Cisco team drives all Lifecycle processes and systems
  anchored on delivering the best customer and partner
  experience. Our scope includes Market-to-Lead, Lead-to-
  Opportunity, Opportunity-to-Booking, Order-to-Cash, Onboard-
  to-Optimize, Escalate-to-Resolve, Renew-to-Booking, and
  Support-to-Advocacy. We offer a unique opportunity for
  dedicated, passionate, and highly creative engineers to have
  a wide-ranging impact on our development activities.


  Your Impact

  Drive the full software development lifecycle, including
  design, analysis, evaluation, testing, debugging, and
  implementation. Significantly contribute to the customer and
  partner experience by building scalable, robust, and high-
  performance technical solutions. Champion an AI-first
  development culture, integrating intelligent automation into
  our core workflows.


  Responsibilities

  - Design and implement end-to-end software solutions using
    Python and React within an AI first development
    environment.
  - Leverage AI technologies and methodologies to enhance
    application functionality and development efficiency.
  - Develop and maintain REST APIs to support seamless
    communication between frontend and backend services.
  - Collaborate with product managers, designers, and fellow
    engineers to translate complex requirements into user-
    centric web interfaces.
  - Apply modern user interface design principles and approaches
    to build intuitive, accessible, and responsive user
    experiences.
  - Optimize applications for maximum speed, scalability, and
    security.
  - Participate in code reviews, technical design discussions,
    and agile ceremonies to uphold high-quality coding
    standards.
  - Troubleshoot and debug issues across the technology stack.
  - Stay ahead of with emerging web technologies, AI
    advancements, and industry protocols to drive improvement
    in the development lifecycle.

  Minimum Qualifications

  - 4–8 years of professional experience in full stack software
    development.
  - Strong proficiency in Python (backend) and React (frontend).
  - Deep understanding of web technologies, including HTML5,
    CSS3, and modern JavaScript frameworks.
  - Extensive experience designing, building, and documenting
    RESTful APIs.
  - Proven track record to create intuitive, responsive user
    interfaces and proficiency in English.

  Preferred Qualifications

  - Experience with Salesforce development, including API
    integration and exposure to MuleSoft.
  - Familiarity with AI/ML frameworks or integrating LLMs into
    web applications.
  - Strong problem solving skills and the ability to thrive in a
    fast-paced environment.

  Why Cisco?

  At Cisco, we’re revolutionizing how data and infrastructure
  connect and protect organizations in the AI era – and
  beyond. We’ve been innovating fearlessly for 40 years to
  create solutions that power how humans and technology work
  together across the physical and digital worlds. These
  solutions provide customers with unparalleled security,
  visibility, and insights across the entire digital
  footprint.

  Fueled by the depth and breadth of our technology, we
  experiment and create meaningful solutions. Add to that our
  worldwide network of doers and experts, and you’ll see that
  the opportunities to grow and build are limitless. We work
  as a team, collaborating with empathy to make really big
  things happen on a global scale. Because our solutions are
  everywhere, our impact is everywhere.

  We are Cisco, and our power starts with you.
