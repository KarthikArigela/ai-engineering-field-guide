    arrangements, and other decisions that may arise due to
    the changing business environment). The Company may adopt,
    vary or rescind these policies and directives in its
    absolute discretion and without any limitation (implied or
    otherwise) on its ability to do so

  Required Qualifications:

  - Bachelor's or master's degree in computer science,
    Engineering, Data Science, AI/ML, or a related field
  - 10+ years of experience in Data Engineering, Cloud Platform
    Engineering, and Enterprise Solution Architecture
  - 5+ years of hands-on experience in Azure Databricks, Spark
    performance optimization, distributed computing, and
    designing scalable data platform architectures
  - 3+ years of experience architecting and implementing
    Generative AI solutions leveraging LLMs, RAG frameworks,
    LangGraph, AI Agents, and enterprise AI platforms
  - Proven experience designing end-to-end cloud-native
    architectures on Azure, including data, analytics, AI,
    security, and governance frameworks
  - Experience leading architecture reviews, driving technical
    decision-making, and guiding engineering teams on
    scalability, reliability, security, and operational
    excellence
  - Solid healthcare domain knowledge
  - Proven solid expertise in defining enterprise data
    strategies, solution blueprints, architecture standards,
    and technology roadmaps
  - Demonstrated success in driving enterprise AI adoption,
    establishing best practices, and delivering AI-powered
    business solutions at scale
  - Proven solid stakeholder management and communication
    skills, with the ability to influence leadership, align
    technology strategies with business objectives, and mentor
    senior engineering teams
  - Proven ability to determine the impact of changes in current
    functionality of the system
  - Proven ability to handle Gen AI, RAG, LLM based assignments
    independently, end-to-end SDLC
  - Proven ability to manage a team of AI Engineer, and provide
    techno-functional mentoring
  - Proven flexible to collaborate with onshore business, during
    US business hours
  - Proven flexible to support project releases, during US
    business hours

  At UnitedHealth Group, our mission is to help people live
  healthier lives and make the health system work better for
  everyone. We believe everyone-of every race, gender,
  sexuality, age, location and income-deserves the opportunity
  to live their healthiest life. Today, however, there are
  still far too many barriers to good health which are
  disproportionately experienced by people of color,
  historically marginalized groups and those with lower
