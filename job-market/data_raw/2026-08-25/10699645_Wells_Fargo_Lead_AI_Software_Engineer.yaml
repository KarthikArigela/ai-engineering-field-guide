description: |
  About this role: We are seeking an AI Engineer to help
  design, build, and deliver next-generation AI-enabled
  applications and agentic systems. This role combines hands-
  on engineering across frontend applications, Python backend
  services, MCP infrastructure, agent workflows, and secure
  enterprise integrations. As an AI Engineer, you will build
  user-facing applications and backend services that integrate
  withModel Context Protocol (MCP) servers, LLM-based
  applications, RAG-based retrieval systems, and agent
  orchestration platforms. You will work closely with AI
  developers, platform engineers, product teams, and other
  stakeholders to deliver scalable, secure, observable, and
  production-ready AI solutions. This engineering role is
  suited for candidates who can contribute across the full
  stack while also helping shape reusable patterns for MCP-
  enabled tools, skills, and agent-driven workflows. In this
  role you will

  - Design, build, and maintainAI-enabled applicationsusing
    React, TypeScript, Python, and modern API frameworks.

  - Developfrontend applicationsaligned with enterprise UI
    standards and reusable component patterns.

  - Build and maintainPython backend services, APIs, MCP
    services, and integration layersusing frameworks such as
    MCP, FastAPI & Flask.

  - Design, implement, and integrate withMCP servers and MCP
    clientsthat enable secure context sharing between models,
    tools, applications, and agent runtimes.

  - Develop and support agentic workflows that execute complex,
    multi-step tasks using frameworks such as LangChain Deep
    Agents, Google ADK, or similar agent frameworks.

  - Buildskill-based and modular agentsthat decompose
    capabilities into reusable, composable, and versioned
    skills.

  - Build reusable components, services, tool schemas, and
    integration patterns that can be shared across enterprise
    AI applications.

  - Integrate logging, tracing, and observability frameworks,
    including Arize & Splunk compatible logging and agent
    observability tooling.

  - Ensure applications and services are ready for deployment on
    enterprise container platforms such as OpenShift or
    Kubernetes.

  - Collaborate with AI developers, platform engineers, product
    teams, and architecture partners to deliver robust and
    scalable AI solutions.

  Key responsibilities

  - Deliver end-to-end AI application features using MCP
    services, and agent orchestration layers.

  - Own and contribute toMCP service implementations, including
    tool schema design, tool registration, API integration,
    authorization enforcement, and deployment readiness.

  - Build and maintain MCP-compatible tools, skills, APIs, and
    UI componentsfor use across AI applications and agent
    runtimes.

  - Integrate AI-powered user interfaces withbackend APIs, MCP
    servers, RAG systems, and agent workflows.

  - Implement RBAC policies governing which users, agents,
    clients, and applications can invoke specific tools or
    services.

  - Develop agent workflows that support complex user objectives
    throughmcp & skill orchestration.

  - Align solutions with enterprise platform standards,
    including application scaffolding, security,
    observability, logging, testing, and deployment practices.

  - Ensure frontend applications are performant, accessible,
    maintainable, and aligned with reusable design patterns.

  - Ensure backend and AI services are scalable, observable,
    secure, and ready for deployment on OpenShift or
    Kubernetes-based environments.

  - Write and maintain technical documentation, integration
    guides, API specifications, and operational runbooks.

  - Contribute to engineering best practices, including code
    reviews, automated testing, CI/CD, monitoring, and
    production support readines

  Required qualifications

  - Specialty Software Engineering experience, or equivalent
    demonstrated through one or a combination of the
    following: work experience, training, military experience,
    education
  - Strong proficiency inPythonwith experience building services
    using frameworks such asFast MCP, FastAPI & Flask.

  - Experience developing and integrating withREST APIs,
    asynchronous services, and event-driven architectures.

  - Experience integrating withAI, LLM-based systems, agent
    platforms, or AI APIs.

  - Experience withReact and TypeScriptfor building frontend
    applications.

  - Experience withauthentication, authorization, and access
    controlpatterns, including SSO, OAuth 2.0, API keys,
    token-based access, RBAC, and scopes.

  - Experience building or integrating withMCP servers
    &understanding ofMCP protocol, including tool
    registration, schemas, message flows, clients, servers,
    and lifecycle patterns.

  - Experience developingagent-driven workflowsusing frameworks
    such as LangChain, Google ADK, or similar orchestration
    frameworks.

  - Experience frontend fundamentals, includingHTML, CSS,
    JavaScript, browser rendering, DOM APIs, and performance
    tuning.

  - Experience with automated testing withPlaywright,
    performance testing, code reviews, and CI/CD practices.

  - Experience building secure, scalable, maintainable
    applications aligned with enterprise platform standards.

  Desired qualifications

  - Experience building MCP servers using FastMCP or similar
    Python-based MCP frameworks.

  - Experience designingMCP-compatible tools, reusable skills,
    and modular agent capabilities.

  - Familiarity withtool schema designand structured output
    validation using tools such as Pydantic, JSON Schema, or
    Zod.

  - Experience withlong-running autonomous agentsthat support
    retries, state persistence, error recovery, graceful
    termination, and multi-step workflow execution. Experience
    withRAG-based retrieval systems, vector search,
    embeddings, or enterprise knowledge retrieval patterns.

  - Experience withagent observability and tracingtools such as
    LangSmith, OpenTelemetry, Arize, or similar platforms.

  - Exposure toSplunk or enterprise observability frameworks.

  - Experience withDocker, OpenShift, Kubernetes, or similar
    containerization and deployment platforms.

  - Experience withCopilot Studio, Microsoft Teams UI
    integration, or conversational application platforms.

  - Knowledge of prompt engineering, skill engineering, and
    knowledge graphs such as llm_wiki and OKF.

  - Familiarity with secure enterprise software delivery,
    platform governance, and reusable engineering standards.

