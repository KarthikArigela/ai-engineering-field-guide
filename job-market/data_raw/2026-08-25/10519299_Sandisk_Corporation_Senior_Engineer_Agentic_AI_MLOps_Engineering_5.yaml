  Job Description

  As our AI practice scales, we are seeking an experienced AI
  Engineer to act as the senior technical authority shaping
  how we design and deliver next-generation AI solutions. This
  is a role for someone who has moved beyond building
  individual models to architecting entire systems: agentic
  platforms, LLM-powered applications, and the production
  infrastructure that makes them dependable at enterprise
  scale.

  You will sit at the intersection of strategy and delivery,
  operating across multiple client engagements simultaneously.
  In the early phases you will shape solutions, validate
  technical approaches, and translate ambiguous business
  problems into robust, deployable architectures. As
  engagements mature, you will provide the technical oversight
  that keeps delivery teams aligned to the original design
  intent. Your influence will be felt in pre-sales
  conversations, solution blueprints, and the technical
  standards that define how our practice builds.

  This is a hands on architectural role, not a purely advisory
  one. We expect you to remain close to the code, to prototype
  where it accelerates a decision, and to set a credible
  technical example for the engineers and data scientists you
  guide.

  Required skills & experience:

  - Strong hands-on engineer who can Design, build, and deploy
    agentic AI systems using LLMs, tool orchestration, and
    multi-agent workflows. Experience building multi-agent
    systems or autonomous workflows.
  - Proven expertise to structurally debug the AI production
    issue and apply the right fix.
  - Experience evaluating the Agents so that the production
    system remain robust.
  - Develop and optimize MLOps pipelines, RAG, vector databases
    and retrieval strategies.
  - Build robust prompt frameworks, evaluation pipelines, and
    guardrails for safe and reliable AI behaviour.
  - Integrate LLM-based systems with enterprise APIs, data
    platforms, and operational systems.
  - Implement observability, feedback loops, and performance
    monitoring for agentic systems in production.

  Qualifications

  To qualify for this role, you must have:

  - 6–8 years of professional experience in software engineering
    with Agentic AI, ML platform engineering with 5+ years of
    hands-on experience with Generative AI and LLM-based
    systems in production environments.
  - BE/B.Tech/ME/M.Tech Computer Science/IT/Electronics Engg/
    Data Science/ Machine learning/AI Engineering or related
    field.
  - Solid grounding in core data science and machine learning.
  - Practical experience with LLMs and generative AI, including
    prompting and RAG.
  - Familiarity with how AI agents are built and orchestrated.
  - Strong Python and common data/ML libraries; good engineering
    habits.
  - Clear communicator and collaborative team player.

  Ideally, you’ll also have, but not essential:

  - Exposure to cloud AI platforms, Azure a plus.
  - Experience practicing MLOps and LLMOps.
  - Early experience mentoring junior colleagues.
  - Interest in consulting and client-facing delivery.

