description: |
  Job Summary:   Are you a passionate and experienced full
  stack developer who loves working with Microsoft
  technologies? Do you want to join a growing and dynamic team
  that delivers cutting-edge solutions to clients across
  various industries? If yes, then we have an exciting
  opportunity for you!

  Artic Consulting is looking for a senior full stack
  developer who can design, develop, and deploy scalable and
  robust applications using Microsoft technologies such as
  .NET, C#, .NET Core, Web API, LINQ, Entity Framework, Azure,
  SQL, HTML, CSS, JavaScript, and Angular/React.

  You will work on an enterprise-level engine across various
  teams and make an immediate impact within our organization.
  This is a full-time, direct-hire, permanent position based
  in Ahmedabad, India. You will be part of our India
  operations, which is in its inception stage, and you will
  have a lot of opportunities to grow and learn in a start-up
  environment. You will also work closely with our US clients
  and team members, and you will need to have excellent
  communication and collaboration skills.

  Key Responsibilities :

  - Develop high-quality software solutions using Microsoft
    technologies, following coding standards and best
    practices.
  - Design and implement complex SQL queries and databases,
    ensuring performance and security.
  - Work with front-end technologies like HTML, CSS, JavaScript,
    Angular/React, etc. to create user-friendly and responsive
    web applications.
  - Leverage Microsoft Azure services and features to develop
    cloud-based solutions, including using Azure Functions,
    Blob Storage, Azure Data Factory (ADF), and Logic Apps.
  - Design, implement, and manage secure application access
    using Azure Active Directory (Azure AD).
  - Work with cross-functional teams to deliver software
    solutions that meet client requirements.
  - Interact with clients to gather requirements, provide
    updates, and address concerns.
  - Troubleshoot and resolve technical issues, identify root
    causes, and implement effective solutions.
  - Stay updated with the latest Microsoft technologies, tools,
    and trends in software development.
  - Identify opportunities for process improvements, innovation,
    and adoption of emerging technologies.
  - Create and maintain technical documentation, including
    architecture diagrams, design documents, and code
    documentation.
  - Share knowledge and best practices with team members through
    presentations, workshops, and documentation.
  - Mentor and coach junior developers, providing guidance on
    coding standards, design patterns, and development
    methodologies.
  - Participate in project planning, estimation, and delivery
    activities. Manage project timelines, prioritize tasks,
    and communicate effectively with stakeholders.
  - Set up and manage Azure DevOps for the team, including
    processes, meetings, and queries.

  Requirements :

  - Bachelor's degree in computer science, information
    technology, or a related field. A master’s degree is a
    plus.
  - Minimum of 6+ years of experience in full stack development
    using Microsoft technologies.
  - Proven expertise in ASP.NET Core and Web API development.
  - Strong hands-on experience with Angular and building
    complex, responsive UIs.
  - Extensive experience with SQL database design, performance
    tuning, and complex querying.
  - Strong experience with microservices architecture and
    containerization technologies (e.g., Docker, Kubernetes),
    including deployment and orchestration in Azure.
  - Deep practical knowledge of Azure services, specifically:
    Azure AD, Azure Functions, Blob Storage, Azure Data
    Factory (ADF), and Logic Apps.
  - Certification in Microsoft technologies (e.g., Microsoft
    Certified: Azure Developer Associate) is preferred.
  - Excellent communication and collaboration skills, both
    verbal and written.
  - Strong analytical and problem-solving skills, with a
    critical thinking mindset.
  - Ability to work independently and as part of a team, with a
    roll-up-your-sleeves attitude.
  - Ability to work in a fast-paced and dynamic environment,
    with changing requirements and deadlines.
  - Experience working with US clients is a plus.

  What We Offer:

  - Competitive salary and performance-based bonuses.
  - Flexible working hours and remote work options.
  - Opportunities for professional development and
    certifications.
  - Collaborative and inclusive work environment.
  - Training budget for learning new skills and technologies.
