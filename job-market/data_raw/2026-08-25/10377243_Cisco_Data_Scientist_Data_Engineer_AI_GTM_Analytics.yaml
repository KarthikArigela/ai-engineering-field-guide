title: "Data Scientist | Data Engineer (AI & GTM Analytics)"
company: Cisco
location: Hyderabad, IND
work_type: FULL_TIME
company_size: 77,500 Employees
description: |
  Meet the Team

  Join the GTM Strategy & Planning organization, where data,
  AI, and analytics power business growth across Cisco and
  Splunk. Our team partners with Sales, Marketing, Product,
  Customer Success, and Operations to deliver data-driven
  insights, predictive intelligence, and AI-powered solutions
  that accelerate revenue, improve customer engagement, and
  shape strategic decision-making at a global scale.  We are
  seeking a hybrid data-driven talent who can bridge the gap
  between complex analytical modeling and scalable data
  infrastructure.



  Your Impact

  You will be a hands-on leader driving the development of
  advanced AI and machine learning solutions and the
  underlying data architecture that drives strategic GTM
  business outcomes across Cisco and Splunk.  You'll work with
  executive stakeholders and cross-functional teams to solve
  complex business challenges, build predictive models,
  engineer high-performance data pipelines, and enable data-
  driven GTM strategies that influence customer acquisition,
  product adoption, and revenue growth.



  Responsibilities

  - Design, build, and deploy predictive models and AI/ML
    solutions that support GTM strategy and business growth.

  - Develop propensity models and advanced analytics to enable
    targeted account selling and intelligent sales motions.

  - Architect, build, and optimize scalable backend data
    pipelines and integration workflows to ensure high-
    quality, reliable, and performant data infrastructure.

  - Lead the design and implementation of efficient data
    modeling strategies to support large-scale, high-velocity
    enterprise data.

  - Partner with Sales, Marketing, Product, Customer Success,
    and Operations to identify high-impact opportunities and
    deliver actionable insights.

  - Build and optimize scalable data pipelines, ensuring high-
    quality, reliable data infrastructure.

  - Lead innovation by introducing modern AI techniques, data
    engineering best practices, and analytical methodologies.

  - Mentor and guide junior data scientists and analysts while
    promoting technical excellence.

  - Present complex analytical findings and strategic
    recommendations to senior executives.

  - Ensure analytical rigor, model validation, and responsible
    AI practices across all solutions.



  Minimum Qualifications

  - 8+ years of experience in Data Science, Machine Learning, or
    Advanced Analytics within the technology industry.

  - Strong expertise in Python or R, machine learning,
    predictive modeling, and AI frameworks such as TensorFlow.

  - Advanced proficiency in data engineering, including building
    robust ETL/ELT processes and managing data workflows.

  - Advanced SQL skills with hands-on experience using
    Snowflake, Hadoop, Apache Spark, or similar big data
    platforms.

  - Experience building and managing scalable ETL processes and
    data pipelines using tools such as Alteryx or equivalent.

  - Master's degree or PhD in Data Science, Computer Science,
    Statistics, Analytics, or a related quantitative
    discipline.



  Preferred Qualifications

  - Experience supporting GTM, Sales Analytics, Revenue
    Operations, or Marketing Analytics initiatives.

  - Proven experience leading projects and mentoring data
    science and data engineering teams.

  - Strong executive communication and storytelling skills,
    translating technical insights into business
    recommendations.

  - Knowledge of Responsible AI principles, AI governance, and
    emerging AI technologies, including Generative AI.

  - Ability to thrive in a fast-paced, highly collaborative,
    cross-functional global environment.



  Why Cisco?

  At Cisco, we’re revolutionizing how data and infrastructure
  connect and protect organizations in the AI era – and
  beyond. We’ve been innovating fearlessly for 40 years to
  create solutions that power how humans and technology work
  together across the physical and digital worlds. These
  solutions provide customers with unparalleled security,
  visibility, and insights across the entire digital
  footprint.

  Fueled by the depth and breadth of our technology, we
  experiment and create meaningful solutions. Add to that our
  worldwide network of doers and experts, and you’ll see that
  the opportunities to grow and build are limitless. We work
  as a team, collaborating with empathy to make really big
  things happen on a global scale. Because our solutions are
  everywhere, our impact is everywhere.

  We are Cisco, and our power starts with you.
