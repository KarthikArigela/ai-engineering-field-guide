description: |
  Job Title: Sr. Software Engineer - AI

  Location: India, Hybrid

  This is a hybrid position, which will require the ability to
  be onsite in our Bengaluru, India office as needed.
  Candidates must be based in India.

  ABOUT THE COMPANY:

  Clari + Salesloft are building the next era of enterprise
  revenue — one where teams make confident decisions powered
  by AI and real signals. By combining our scale, insights,
  and AI innovation, we’re building the industry’s first
  Predictive Revenue System, enabling humans and AI to work
  together to make smarter decisions and drive consistent
  growth.

  With thousands of customers using our platforms every day,
  we have an unmatched view into how revenue is actually won —
  the Revenue Context that reveals what happens, when, and
  with what outcome. This gives us a unique opportunity to
  transform an entire category and set a new benchmark for how
  modern revenue teams operate.

  Join us to help transform how companies around the world run
  revenue — and build the platform that will guide leading
  revenue teams into the future.

  THE OPPORTUNITY:

  At Clari + Salesloft, our Sr. Software Engineers will be
  pivotal to our company’s success. You will be a key member
  of our fast-growing and high-performing team in India. We
  are looking for experienced Sr. Software Engineers who can
  help realize Clari + Salesloft vision with their passion and
  proven track record of excellence and innovation. We are
  looking for engineers who are passionate about their work
  and who thrive working on leading-edge cloud-based
  technologies to develop ground-breaking AI-driven
  enterprise-grade applications.

  On a day-to-day basis, you will be responsible to -

  - Architect and lead the design of complex AI systems
    involving multi-agent orchestration, large-scale RAG
    pipelines, and production LLM infrastructure
  - Own end-to-end delivery of critical AI features from
    conception to production, including design docs,
    implementation, and rollout strategy
  - Drive technical direction for AI platform components:
    establish patterns, frameworks, and best practices across
    the engineering org
  - Build high-scale data pipelines that process millions of
    records, manage embeddings at scale, and optimize for cost
    and latency
  - Mentor SDE-II and junior engineers through code reviews,
    design discussions, and pairing sessions
  - Lead evaluation and safety initiatives: design robust eval
    frameworks, implement guardrails, and ensure AI quality at
    scale
  - Collaborate cross-functionally with Product, Data
    Science/Engineering, and Platform teams to shape roadmap
    and technical strategy
  - Optimize production systems for performance, cost, and
    reliability; troubleshoot complex production issues

  In addition to working with amazing colleagues who exemplify
  our ‘team over self’ core value, you will also have the
  opportunity to work on an impactful and revolutionary
  software that is changing the way sellers sell. You will
  have an opportunity to make a difference.

  WHAT WE’RE LOOKING FOR:

  We are seeking Sr. Software Engineers who would be Working
  on cutting-edge technologies alongside a highly motivated
  and skilled team eager to learn and grow together

  If you’re looking for an opportunity to learn more, do more,
  and become more, then becoming a Sr. Software Engineer is
  the career path for you!

  THE TEAM:

  Clari + Salesloft’ s goal is to build the world's first AI
  driven Predictive Revenue System.

  The Engineering Team at Clari + Salesloft is deeply
  committed to building an enterprise-grade platform that
  serves as the backbone for our customer's most critical
  business process - Revenue. With an unrelenting commitment
  to innovation, our mission is to craft the ultimate revenue
  intelligence platform for our customers. Rooted in Agile
  principles, we foster a culture of adaptability and
  efficiency across all our teams. If you're energized by the
  prospect of contributing to a dynamic environment that
  emphasizes collaboration, continuous improvement, and
  leveraging the forefront of technology to address customer
  needs, we would love to meet you.

  THE SKILL SET:

  Required:

  - 5+ years of software engineering experience with 2+ years
    building production LLM/GenAI systems at scale
  - Expert-level Python skills including async programming,
    performance optimization, and production-grade testing
  - Deep hands-on experience with ML/LLM frameworks: PyTorch,
    Hugging Face, LangChain, LlamaIndex, or Ray
  - Proven experience building and scaling vector search systems
    (Elasticsearch, Pinecone, Weaviate, FAISS)
  - Strong system design skills: microservices, distributed
    systems, event-driven architectures (Kafka/SQS/Kinesis)
  - Production experience with Kubernetes, Docker, and cloud
    infrastructure (AWS preferred)
  - Expertise in LLM optimization: prompt engineering, prompt
    fine-tuning, embeddings, RAG, token management, and
    inference optimization
  - Track record of technical leadership: driving architecture
    decisions, mentoring engineers, and shipping complex
    projects
  - Excellent communication: able to influence technical
    decisions and collaborate effectively across teams

  Nice to Have:

  - Experience with high-throughput inference using Ray, Triton,
    vLLM, or TensorRT
  - Background in LLM evaluation (RAGAS, custom harnesses,
    human-in-the-loop workflows)
  - Deep knowledge of multi-agent systems and agentic workflows
  - Experience optimizing AI costs at scale (prompt caching,
    batch processing, model selection)
  - Contributions to open-source AI projects or published
    research
  - Prior experience in high-growth startups or building 0-to-1
    AI products

  At Clari + Salesloft, we are committed to creating an
  inclusive and supportive workplace where everyone belongs
  and can thrive. We focus on culture add, not culture fit,
  and believe our teams are made stronger by the unique
  perspectives, experiences, and identities each person
  brings.

  We are proud to be an Equal Opportunity Employer and provide
  employment opportunities to all employees and applicants
  without regard to race, color, religion, sex, sexual
  orientation, gender identity, national origin, age,
  disability, veteran status, pregnancy, or any other
  characteristic protected by law.

  If you’re excited about this role even though your
  experience may not perfectly match every requirement, we
  encourage you to apply. We are actively hiring across
  multiple geographies and would love to welcome passionate,
  curious, and mission-driven individuals to our growing team.
  Explore our open roles and consider joining us!

  #LI-Hybrid

