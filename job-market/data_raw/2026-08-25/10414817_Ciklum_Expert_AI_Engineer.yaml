description: |
  Ciklum is looking for an Expert AI Engineer to join our team
  full-time in India.

  We are a custom product engineering company that supports
  both multinational organizations and scaling startups to
  solve their most complex business challenges. With a global
  team of over 4,000 highly skilled developers, consultants,
  analysts and product owners, we engineer technology that
  redefines industries and shapes the way people live.

  About the role:

  As an Expert AI Engineer, become a part of a cross-
  functional development team engineering experiences of
  tomorrow to lead the design, development, and scaling of
  production-grade Generative AI applications across the
  enterprise. This role combines deep technical expertise in
  LLMs, RAG architectures, and Agentic AI systems with strong
  platform engineering skills to deliver reliable, governed,
  and business-impacting AI solutions.

  Responsibilities:

  Enterprise GenAI Implementation

  - Design and build production-grade GenAI applications from
    concept to deployment
  - Architect and implement solutions using LLMs, Retrieval-
    Augmented Generation (RAG), and Agentic AI frameworks
  - Build and maintain LangChain-based pipelines for complex,
    multi-step AI workflows
  - Integrate 10+ enterprise data sources into unified GenAI
    applications, ensuring reliable data ingestion and
    retrieval

  Platform Engineering

  - Own AI orchestration layers supporting scalable, multi-model
    GenAI systems
  - Maintain 99.9% uptime for production AI services through
    robust monitoring, failover, and incident response
    practices
  - Implement governance and compliance frameworks covering data
    security, model usage, and responsible AI practices
  - Build resilient, containerized deployments using Kubernetes
    and CI/CD pipelines

  Business Impact

  - Drive accelerated GenAI adoption (40–60% improvement) across
    business units through scalable tooling and enablement
  - Improve answer accuracy by 30% through refined retrieval
    strategies, prompt engineering, and evaluation pipelines
  - Design and deliver reusable AI accelerators (frameworks,
    templates, components) to speed up future GenAI initiative

  Requirements:

  - Programming: Python (advanced, production-level)
  - Cloud Platform: Microsoft Azure (AI/ML services, deployment,
    security)
  - AI/ML Frameworks: LangChain, LLM integration (OpenAI models)
  - Data & Retrieval: Vector Databases (e.g., Pinecone, FAISS,
    Azure AI Search, or similar), RAG architecture design
  - Data Engineering: Snowflake (data integration, pipeline
    design)
  - Infrastructure: Kubernetes (container orchestration), CI/CD
    pipelines (automated build, test, deploy)
  - Agentic AI: Experience designing autonomous or semi-
    autonomous multi-agent systems

  Desirable:

  - Proven experience building and deploying enterprise-scale
    GenAI applications in production environments
  - Strong understanding of LLM architecture, prompt
    engineering, and retrieval optimization
  - Experience integrating diverse enterprise data sources into
    AI pipelines
  - Track record of improving AI governance, compliance, and
    reliability at scale
  - Ability to translate technical AI capabilities into
    measurable business outcomes
  - Strong collaboration skills across engineering, data, and
    business stakeholders

  What’s in it for you?

  - Strong community: Work alongside top professionals in a
    friendly, open-door environment
  - Growth focus: Take on large-scale projects with a global
    impact and expand your expertise
  - Tailored learning: Boost your skills with internal events
    (meetups, conferences, workshops), Udemy access, language
    courses, and company-paid certifications
  - Endless opportunities: Explore diverse domains through
    internal mobility, finding the best fit to gain hands-on
    experience with cutting-edge technologies
  - Care: We’ve got you covered with company-paid medical
    insurance, mental health support, and financial & legal
    consultations

  About us:

  At Ciklum, we are always exploring innovations, empowering
  each other to achieve more, and engineering solutions that
  matter. With us, you’ll work with cutting-edge technologies,
  contribute to impactful projects, and be part of a One Team
  culture that values collaboration and progress.

  India is a strategic innovation hub for Ciklum, with growing
  teams in Chennai and Pune leading advancements in EdgeTech,
  AR/VR, IoT, and beyond. Join us to collaborate on game-
  changing solutions and take your career to the next level.

  Explore, empower, engineer with Ciklum!

  Interested already? We would love to get to know you! Submit
  your application. We can’t wait to see you at Ciklum.

