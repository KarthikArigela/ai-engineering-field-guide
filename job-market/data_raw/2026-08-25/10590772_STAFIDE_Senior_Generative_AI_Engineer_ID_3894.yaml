description: |
  As a Senior Generative AI Engineer, you will:

  - Design, develop, and deploy enterprise-grade Generative AI
    solutions using modern AI frameworks and cloud
    technologies
  - Build intelligent AI applications using Python with a focus
    on scalability, performance, and maintainability
  - Develop and integrate AI solutions using Azure OpenAI
    Services, including GPT models, prompt engineering,
    embedding, and fine-tuning strategies
  - Design and implement multi-agent AI workflows using Semantic
    Kernel and LangGraph
  - Integrate enterprise applications, APIs, and external tools
    using Model Context Protocol (MCP) or similar integration
    frameworks
  - Build context-aware AI agents with memory management and
    autonomous decision-making capabilities
  - Develop Retrieval-Augmented Generation (RAG) solutions using
    vector databases to enhance AI accuracy and knowledge
    retrieval
  - Optimize Large Language Model (LLM) applications for
    performance, latency, scalability, and cost efficiency
  - Collaborate with solution architects, product owners, and
    business stakeholders to translate business requirements
    into innovative AI solutions
  - Ensure security, governance, compliance, and Responsible AI
    principles are embedded throughout the AI solution
    lifecycle
  - Participate in Agile development processes, code reviews,
    testing, and continuous improvement initiatives

  What You Bring to the Table:

  - 6–8 years of professional experience in AI Engineering,
    Machine Learning, or Software Development
  - Strong programming expertise in Python for developing
    enterprise-scale AI applications
  - Hands-on experience with Azure OpenAI Services, including
    GPT models, embeddings, APIs, prompt engineering, and
    fine-tuning
  - Proven experience with Semantic Kernel and LangGraph for AI
    orchestration and multi-agent workflows
  - Strong understanding of Generative AI, Agentic AI, and Large
    Language Model (LLM) architectures
  - Experience implementing Retrieval-Augmented Generation (RAG)
    solutions
  - Experience working with vector databases such as Azure AI
    Search, Pinecone, or similar platforms
  - Familiarity with Model Context Protocol (MCP) or equivalent
    AI integration patterns
  - Experience developing REST APIs, microservices, and cloud-
    native applications within the Microsoft Azure ecosystem
  - Knowledge of CI/CD pipelines, DevOps practices, Docker, and
    Kubernetes
  - Experience evaluating, monitoring, and optimizing LLM-based
    applications
  - Understanding of Responsible AI, AI governance, and security
    best practices
  - Strong analytical, problem-solving, and communication skills
    with the ability to collaborate across cross-functional
    teams

  You Should Possess the Ability To:

  - Design and build scalable, enterprise-ready Generative AI
    applications
  - Develop intelligent multi-agent systems using modern AI
    orchestration frameworks
  - Deliver secure, reliable, and high-performing AI solutions
    using Azure OpenAI technologies
  - Translate business challenges into practical AI-driven
    solutions
  - Optimize AI applications for scalability, cost efficiency,
    and user experience
  - Collaborate effectively with architects, developers, product
    teams, and business stakeholders in Agile environments
  - Drive innovation while maintaining Responsible AI,
    governance, and security standards

  What We Bring to the Table:

  - Opportunity to work on enterprise-scale Generative AI and
    Azure OpenAI initiatives
  - Exposure to cutting-edge AI technologies, Agentic AI, LLMs,
    and cloud-native platforms
  - Collaborative environment with experienced architects, AI
    engineers, and product teams
  - Opportunity to contribute to innovative digital
    transformation projects for a leading retail client

