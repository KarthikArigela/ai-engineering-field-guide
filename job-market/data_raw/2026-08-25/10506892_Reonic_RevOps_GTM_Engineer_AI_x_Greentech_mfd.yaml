description: |
  Do you thrive in fast-paced environments and have a passion
  for renewable energy?

  As our RevOps & GTM Engineer, you will be the co-architect
  of our data ecosystem. You’ll take full ownership of making
  customer and revenue data accessible, building internally
  used applications from the ground up, and deploying AI to
  supercharge our growth.

  Please note that for this role, C2 English proficiency is
  required. This is a full-time, on-site position based in
  Berlin.

  What You’ll Do

  - Process Innovation & AI Implementation: You will dive deep
    into our customer-oriented workflows to reshape them with
    your creative, AI-driven ideas and technical skills. As
    the owner of the implementation, you won't just strategize
    - you will personally drive these improvements from
    concept to reality.
  - Vertical Owner (Data Driven Analytics): You will
    relentlessly improve our data product experience by
    working with internal and external stakeholders to
    identify bottlenecks, refine analytical fit, and
    personally onboard them into a world-class, data-driven
    workflow.
  - Data Accessibility: Design and maintain robust pipelines to
    make data from our customers, HubSpot, and Aircall fully
    usable and accessible across the organization.
  - AI Integration: Implement AI-driven workflows and predictive
    models to automate insights, lead scoring, and trend
    forecasting.
  - Hands-on Engineering: Work directly in Python (or
    TypeScript) to integrate diverse data sources yourself.
  - Strategic Impact: Collaborate with Sales, Marketing, and
    Success teams to transform complex datasets into powerful
    BI dashboards that drive faster, smarter decisions.

  What Makes You a Great Fit

  - You are hungry, driven, and eager to find smart, efficient
    solutions. You don't just accept the status quo - you
    constantly look for ways to innovate and optimize.
  - You are an expert in using n8n, Python (TypeScript is a
    bonus) and have a deep understanding of modern BI tools
    and SQL.
  - You are passionate about how AI can optimize revenue
    processes and have the skills to implement it.
  - Bonus: Ideally, you have experience in BI or Data
    Engineering, with a proven track record of building data
    warehouses and integrating SaaS tools (like HubSpot or
    Aircall)
  - You are proactive and structured, you don’t wait for a
    ticket; you identify bottlenecks in our data flow and fix
    them.
  - You are fluent in English. Proficiency in German, Italian,
    French or Portuguese is a plus.

  Why Join Us?

  - Be part of one of the fastest growing VC-backed startup in
    Germany with 3000+ satisfied B2B customers.
  - A vibrant, collaborative office culture where great ideas
    happen face-to-face - we're a full in-person team (5
    days/week) in a beautiful Berlin office near Hackescher
    Markt.
  - Enjoy opportunities for personal and professional growth.
  - Receive competitive pay.
  - Perks include gym membership, coffee, regular team events,
    MacBook and more.
  - Embrace the freedom to innovate and make quick changes in a
    dynamic team.



  Even if you don’t meet every requirement, we encourage you
  to apply! Imposter syndrome shouldn't hold you back - we
  value talent and passion above all.



  About Reonic

  At Reonic, we’re on a mission to simplify renewable
  technology with our AI operating system for renewable
  installers. Backed by top-tier investors and trusted by
  3000+ business customers, we’re growing fast - and we need
  YOU to help us accommodate our new and existing customers.
