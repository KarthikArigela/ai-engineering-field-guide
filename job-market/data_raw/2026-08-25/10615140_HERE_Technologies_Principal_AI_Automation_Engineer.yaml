description: |
  What's the role?

  We are looking for a strong AI Automation Engineer to be the
  delivery engine of the AI Center of Excellence, responsible
  for transforming approved use cases into production-grade AI
  solutions, agentic workflows, and intelligent automations.
  This role designs, builds, deploys, and continuously
  improves AI-powered business processes that drive measurable
  business outcomes.

  Working closely with business stakeholders, process owners,
  architects, and platform engineers, the AI Automation
  Engineer reimagines how work gets done rather than simply
  automating existing processes. They own the end-to-end
  delivery lifecycle—from solution design and prompt
  engineering through deployment, adoption measurement, and
  continuous optimization—and serve as the primary technical
  partner to the business functions they support.

  AI Solution Development & Delivery

  - Design, build, and deploy AI agents, copilots, intelligent
    workflows, and process automations using enterprise AI
    platforms and low-code/no-code automation technologies.
  - Translate business requirements into scalable AI solutions
    that improve productivity, quality, customer experience,
    and operational efficiency.
  - Develop and maintain prompts, skills, tools, agent
    orchestration logic, and workflow integrations across
    enterprise systems.
  - Build solutions using AI platforms leveraging workflow
    orchestration platforms, and API integrations.
  - Collaborate with AI Architects and Platform Engineers to
    ensure solutions align with enterprise architecture,
    governance, and security standards.

  Process Transformation

  - Partner with business stakeholders to identify opportunities
    to redesign processes for AI-first execution.
  - Facilitate workshops to understand current-state workflows
    and define future-state operating models.
  - Challenge existing assumptions and recommend process
    improvements that maximize automation and business value.
  - Document business requirements, solution designs, workflows,
    and operating procedures.

  Deployment & Optimization

  - Own the delivery lifecycle from concept through production
    deployment and ongoing training and support.
  - Define success criteria, KPIs, and monitoring frameworks for
    deployed solutions.
  - Analyze adoption, usage, performance, and business outcomes
    to identify optimization opportunities.
  - Continuously refine prompts, workflows, and agent behaviors
    based on user feedback and operational data.
  - Troubleshoot issues and implement enhancements to improve
    effectiveness and user experience.

  Stakeholder Engagement

  - Serve as a primary CoE representative for assigned business
    functions and use cases.
  - Communicate technical concepts to non-technical audiences
    and business leaders.
  - Build strong relationships with stakeholders to drive
    adoption and change management.
  - Provide demonstrations, training, and enablement support to
    end users and process owners.

  Governance & Best Practices

  - Ensure solutions adhere to responsible AI, security,
    privacy, and compliance requirements.
  - Contribute to reusable automation frameworks, prompt
    libraries, templates, and development standards.
  - Share best practices and lessons learned across the CoE to
    accelerate future implementations.
  - Support the establishment of enterprise AI development and
    operational standards.

  Who are you?

  - Bachelor's degree in Computer Science, Engineering,
    Information Systems, Data Science, or a related field
  - 8+ years of experience delivering enterprise software,
    automation, workflow, integration, or digital
    transformation solutions.
  - Demonstratable experience designing and implementing
    Generative AI, LLM, AI agent, or intelligent automation
    solutions in production environments.
  - Demonstrated experience leading end-to-end delivery of
    complex AI, automation, or digital transformation
    initiatives with measurable business outcomes.
  - Deep expertise in agentic architectures, prompt engineering,
    orchestration frameworks, workflow automation, and API-
    driven integrations.
  - Experience building solutions using platforms such as
    Microsoft Copilot Studio, Power Platform, Azure AI
    Foundry/OpenAI, AWS Bedrock, Vertex AI, or comparable
    enterprise platforms.
  - Strong understanding of Retrieval-Augmented Generation
    (RAG), vector databases, knowledge grounding, AI
    evaluation frameworks, and model lifecycle management.
  - Experience integrating AI solutions with enterprise
    platforms including ERP, CRM, ITSM, collaboration, and
    data platforms.
  - Strong consulting and stakeholder management skills, with
    the ability to engage business leaders, challenge existing
    processes, and translate strategic objectives into
    scalable AI solutions.
  - Proven ability to lead workshops, facilitate process
    redesign sessions, and influence decision-making across
    technical and non-technical audiences.
  - Strong understanding of enterprise security, governance,
    privacy, compliance, and Responsible AI principles.
  - Experience building multi-agent systems, autonomous
    workflows, and enterprise AI copilots at scale.
  - Proficiency in Python, JavaScript, REST APIs, cloud-native
    development, and integration patterns.
  - Experience with MLOps, LLMOps, AI observability, evaluation,
    and production monitoring frameworks.
  - Knowledge of process mining, Lean, Six Sigma, Design
    Thinking, or business process transformation
    methodologies.
  - Experience operating within an AI Center of Excellence,
    Innovation Office, Automation CoE, or Digital
    Transformation organization.
  - Experience mentoring engineers and establishing reusable
    frameworks, development standards, and best practices.
  - Industry certifications in Azure AI, Azure Solutions
    Architecture, Power Platform, AWS AI/ML, Google Cloud AI,
    UiPath, or similar technologies.

  What we offer:

    - Work on on globally deployed automotive navigation and
      mapping products
    - Collaboration with an experienced, international engineering
      organization
    - Truly international team of fantastic & talented people from
      60+ countries worldwide, working from strong tech hubs
      located in Europe, the US, and Asia, along with multiple
      smaller locations
    - Flexible working hours & a flexible approach to office vs.
      remote work
    - Yearly variable bonus

  Who are we?

  HERE Technologies is a location data and technology platform
  company. We empower our customers to achieve better outcomes
  – from helping a city manage its infrastructure or a
  business optimize its assets to guiding drivers to their
  destination safely.At HERE we take it upon ourselves to be
  the change we wish to see. We create solutions that fuel
  innovation, provide opportunity and foster inclusion to
  improve people’s lives. If you are inspired by an open world
  and driven to create positive change, join us. Learn more
  about us on our YouTube Channel.

  Change is HERE. Apply Now.

