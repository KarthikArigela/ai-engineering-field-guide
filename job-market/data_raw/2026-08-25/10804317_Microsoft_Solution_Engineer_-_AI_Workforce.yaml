description: |
  Overview

  Are you inspired to empower organizations to transform the
  way they work by harnessing the full potential of artificial
  intelligence? We are seeking individuals to guide customers
  through the evolving digital landscape, enabling them to
  unlock new opportunities, enhance productivity, and deliver
  exceptional employee and customer experiences. Join us in
  integrating advanced AI capabilities across devices, cloud
  platforms, and everyday business applications to help
  organizations realize seamless, innovative, and secure
  solutions that drive sustained growth and success in the AI
  era.

  As a Solution Engineer - AI Workforce for Copilot and Cloud
  Endpoint Teams, you will play a critical role in
  accelerating AI transformation by leading technical
  engagements that drive customer adoption of Microsoft 365
  Copilot Studio & Agents and related AI-powered productivity
  solutions.  This Solution Engineer role is divided into two
  sub-categories – Microsoft 365 Copilot and Microsoft Cloud
  Endpoint. Candidates will need expertise in one of those two
  areas. This role is deeply technical, responsible for owning
  the technical win strategy, delivering compelling
  demonstrations, and guiding customers through envisioning
  sessions that align their business goals and technical
  requirements. As a trusted advisor, Solution Engineers
  ensure that governance, security, and compliance are
  embedded in every conversation to build confidence and drive
  decision-making.

  In addition to technical leadership, you will be accountable
  for driving core business momentum through competitive
  differentiation, removing technical blockers, and seamless
  handoffs to deployment teams. You will work with a virtual
  team of technical, partner and consulting resources to
  provide technical customer education, demonstrate and prove
  our solutions, and win the technical decision enabling the
  team to achieve/exceed quarterly targets for your accounts.
  The role emphasizes operational excellence, partner
  collaboration, and continuous learning to ensure scalable
  impact and sustained customer success. This is a high-impact
  role for individuals passionate about shaping the future of
  work through AI and delivering measurable business outcomes.

  We are currently looking for Solution Engineers - AI
  Workforce to join our teams across various business groups,
  for varying customer sizes, in our enterprise, regulated,
  and partner services organizations. By applying to this
  role, you will be considered for multiple opportunities
  within Microsoft across the United States including
  locations beyond where the role is posted. This role is
  flexible in that you can work up to 50% from home. Travel
  percentages will vary according to role.

  Microsoft’s mission is to empower every person and every
  organization on the planet to achieve more. As employees we
  come together with a growth mindset, innovate to empower
  others, and collaborate to realize our shared goals. Each
  day we build on our values of respect, integrity, and
  accountability to create a culture of inclusion where
  everyone can thrive at work and beyond.

  Responsibilities

  - Develop foundational technical expertise in:
    - Microsoft 365 Copilot role: Microsoft 365 Copilot, Copilot
      Chat, Copilot Studio & Agents, and related AI
      productivity tools by leveraging internal readiness
      materials and hands-on learning.
    - Microsoft Cloud Endpoint role: Microsoft Windows 365, Azure
      Virtual Desktop, Intune, Entra ID, and Cloud Native
      Management.
  - Support customer engagements by delivering demos, assisting
    with discovery sessions, and contributing to whiteboarding
    under the guidance of senior engineers.
  - Participate in competitive research and share insights with
    the team to help address common objections and blockers.
  - Assist in solution design by gathering customer requirements
    and supporting Proof of Concept execution with oversight.
  - Escalate technical blockers and customer objections to
    senior team members and product teams, learning how to
    navigate resolution pathways.
  - Collaborate with partners by sharing Microsoft training
    resources and supporting joint technical activities.

  Other:

  - Embody our culture and values

  Qualifications

  Required Qualifications

  - Bachelor's Degree in Computer Science, Information
    Technology, or related field AND 2+ years technical pre-
    sales or technical consulting experience
      - OR a Master's Degree in Computer Science, Information
        Technology, or related field AND 1+ year(s) technical
        pre-sales or technical consulting experience
      - OR 3+ years technical pre-sales or technical consulting
        experience
      - OR equivalent experience.

  Other Requirements:

  - Microsoft is unable to sponsor a work visa for this role due
    to the nature of the role’s job duties.

  Preferred qualifications

  - Bachelor's Degree in Computer Science, Information
    Technology, or related field AND 4+ years of technical
    pre-sales or technical consulting experience
      - OR a Master's Degree in Computer Science, Information
        Technology, or related field AND 3+ years of technical
        pre-sales or technical consulting experience
      - OR 5+ years technical pre-sales or technical consulting
        experience
      - OR equivalent experience.
  - Expertise in one of two Microsoft technologies:
    - Microsoft 365 Copilot: Also includes Agents, Copilot Studio,
      and the Microsoft 365 suite of tools and security.
    - Microsoft Cloud Endpoint: Also includes Azure Virtual
      Desktop, Windows 365, and the Microsoft 365 suite of
      tools and security.
  - 6+ years technical pre-sales, technical consulting, or
    technology delivery, or related experience OR equivalent
    experience.
  - 4+ years of experience with cloud and hybrid, or on premises
    infrastructures, architecture designs, migrations,
    industry standards, and/or technology management.
  - 4+ years of experience with developing and delivering
    customer demos/proof of concepts for productivity and
    collaboration-centric across competitive offerings.
  - Certification in relevant technologies or disciplines (e.g.,
    Office 365, Power BI, Azure Architect and Development
    exams, Cloud Platform Technologies, Information Security,
    Architecture).



