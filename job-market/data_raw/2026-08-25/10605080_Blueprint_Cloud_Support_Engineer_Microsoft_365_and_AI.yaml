description: |
  About Blueprint

  Blueprint is a technology solutions firm headquartered in
  Bellevue, Washington, with teams across the United States.
  We help organizations turn complex challenges into
  meaningful outcomes by connecting strategy and execution
  across AI, cloud, data, product development, and emerging
  technology.

  Our culture is built by people who care deeply about doing
  exceptional work. We set high standards, take ownership, and
  continually challenge ourselves and one another to be
  better. We work hard, support each other, and take genuine
  pride in what we deliver for our clients, partners, and
  teams.

  At Blueprint, you’ll work alongside talented people with
  different experiences, expertise, and perspectives. You’ll
  have opportunities to take on meaningful challenges, expand
  your skills, and see the impact of what you build.

  Bring your perspective. Raise the standard. Build what
  matters.

  About the Role

  As a Cloud Support engineer, you’ll help organizations
  accelerate their AI transformation through the deployment,
  adoption, governance, and optimization of Microsoft 365
  Copilot, AI agents, and related cloud solutions. You’ll
  serve as a trusted technical advisor, helping customers
  identify valuable AI use cases, overcome technical and
  operational barriers, and translate their AI investments
  into measurable business outcomes.

  This role combines deep technical expertise with customer
  consulting, adoption and change management, executive
  engagement, and cross-functional leadership. You’ll work
  closely with customers, implementation partners, account
  teams, and delivery resources to scale secure, governed AI
  solutions aligned with organizational goals.

  What You'll Do

  - Drive customer adoption and sustained usage of Microsoft 365
    Copilot, AI agents, and related solutions, with
    accountability for measurable consumption and business
    outcomes.
  - Advise customers and partners on Microsoft 365 Copilot,
    Copilot Studio, AI agents, and related cloud technologies.
  - Help customers design, deploy, configure, and operationalize
    AI solutions aligned with their business objectives and
    adoption goals.
  - Lead technical engagements to identify and resolve barriers
    related to identity, security, compliance, governance,
    data access, licensing, and platform readiness.
  - Advise customers on AI readiness, including data security,
    oversharing controls, compliance, governance, and
    responsible AI practices.
  - Develop AI adoption and change-management strategies
    addressing executive sponsorship, target-user groups,
    communications, training, and adoption activities.
  - Help customers progress from foundational AI usage to
    advanced, high-impact use cases and power-user behaviors.
  - Coordinate with partner organizations and delivery resources
    to accelerate AI deployment, activation, adoption, and
    ongoing consumption.
  - Engage business and technical decision-makers to connect AI
    usage with measurable business value, return on
    investment, and organizational outcomes.
  - Present usage insights, adoption trends, and business impact
    to customer stakeholders and executive audiences.
  - Manage usage and adoption milestones through completion
    across assigned customer accounts.
  - Serve as a key point of contact among customers, partners,
    account teams, and internal stakeholders throughout the AI
    adoption journey.
  - Lead and motivate technical communities while collaborating
    across diverse customer and stakeholder groups.
  - Identify adoption patterns, technical blockers, customer
    feedback, and success stories to support continuous
    improvement.
  - Analyze usage, adoption, and business-outcome signals to
    identify opportunities for expanded AI adoption and
    additional solutions.
  - Collaborate with account teams, specialists, and partners to
    support customer expansion, renewal strength, and
    consumption-led growth.
  - Continuously develop your expertise as AI technologies,
    customer needs, and business priorities evolve.

  What You'll Bring

  - Bachelor’s degree in Computer Science, Information
    Technology, Engineering, Business, Liberal Arts, or a
    related field, plus 7 to 9 years of relevant experience,
    or equivalent practical experience.
  - Relevant experience in cloud or infrastructure technologies,
    IT consulting or support, systems administration, network
    operations, software development or support, technology
    solutions, practice development, architecture, or
    consulting.
  - At least 2 years of experience in an enterprise customer-
    facing role, including responsibility for internal and
    external stakeholder management and communication.
  - At least 2 years of experience delivering customer-facing
    technical projects.
  - At least 2 years of experience working with Microsoft 365
    and cloud platforms.
  - Hands-on experience deploying and driving adoption of
    Microsoft 365 Copilot, including Copilot Control System,
    adoption and change management, and Copilot Analytics.
  - Deep technical expertise in Microsoft security and
    compliance technologies, including Microsoft Entra,
    Conditional Access, identity governance, Microsoft
    Purview, sensitivity labels, Data Loss Prevention, DSPM
    for AI, and SharePoint Advanced Management.
  - Experience building and governing AI agents with Copilot
    Studio, including applying a register, govern, and protect
    model.
  - Strong written and verbal communication skills, with the
    ability to collaborate across global teams and produce
    high-quality documentation.

  Certifications

  At least two of the following certifications:

  - MS-102: Microsoft 365 Administrator Expert
  - SC-401: Information Security Administrator Associate
    (Microsoft Purview)
  - AB-900: Microsoft 365 Copilot and Agent Administration
    Fundamentals
  - AB-100: Agentic AI Business Solutions Architect Expert
  - AB-730: AI Business Professional Associate

  Compensation

  At Blueprint, we strive to offer competitive pay that
  reflects the value of our team members. Compensation for
  this role is influenced by a variety of factors, including
  skills, education, responsibilities, experience, and
  geographic market.

  For candidates based in Washington State, the anticipated
  compensation range is $40.00 - $45.00/hour USD. Please note
  that we typically do not hire new employees at the top of
  the posted range. Actual starting pay will be determined
  based on experience, skills, and internal equity. The final
  compensation and job title may vary depending on the
  selected candidate’s qualifications.

  Location and Work Arrangement

  This is a remote position open to candidates located within
  the United States.

  Benefits

  Blueprint believes that healthy, supported employees do
  their best work. Eligible employees have access to a
  comprehensive benefits package that may include:

  - Medical, dental, and vision coverage
  - Flexible Spending Account (FSA)
  - 401(k) retirement plan
  - Competitive paid time off
  - Parental leave
  - Professional growth and development opportunities

  Benefits and eligibility may vary based on role, employment
  status, and location.

  Equal Employment Opportunity

  Blueprint Technologies, LLC is an equal opportunity
  employer. We consider qualified applicants without regard to
  race, color, religion, sex, pregnancy, childbirth or related
  medical conditions, sexual orientation, gender identity or
  expression, national origin, ancestry, age, disability,
  genetic information, marital or familial status, military or
  veteran status, citizenship status, or any other
  characteristic protected by applicable law.

  Applicant Accommodations

  If you need a reasonable accommodation to participate in any
  part of the application or interview process, please contact
  recruiting@bpcs.com.
