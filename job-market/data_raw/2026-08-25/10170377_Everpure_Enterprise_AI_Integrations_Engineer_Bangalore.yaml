title: "Enterprise AI & Integrations Engineer (Bangalore)"
company: Everpure
location: Bengaluru, IND
work_type: FULL_TIME
company_size: 4,090 Employees
description: |
  We’re in an unbelievably exciting area of tech and are
  fundamentally reshaping the data storage industry. Here, you
  lead with innovative thinking, grow along with us, and join
  the smartest team in the industry.

  This type of work—work that changes the world—is what the
  tech industry was founded on. So, if you're ready to seize
  the endless opportunities and leave your mark, come join us.

  THE ROLE

  Pure Storage is looking for a Procurement Technology & AI
  Systems Engineer II to join our Global Indirect Sourcing
  (GIS) Procurement Operations team. This role sits at the
  intersection of AI innovation and procurement systems,
  responsible for implementing, integrating, and managing AI
  tools that enhance how our sourcing organization operates.
  You will work closely with internal stakeholders, IT, and
  vendors to ensure our AI tooling ecosystem is well-
  configured, well-connected, and delivering measurable value.

  WHAT YOU'LL DO

  - Own the administration, configuration, and ongoing
    maintenance of AI tools integrated into GIS workflows
  - Manage and troubleshoot API integrations between AI
    platforms and core procurement systems including SAP
    S/4HANA, NetSuite, Graphite Connect, Rivio, and LevelPath
  - Partner with the Systems & Tools Manager to evaluate new AI
    capabilities and assess fit within the existing technology
    stack
  - Support the design and implementation of automation
    workflows across Google Workspace and Slack that reduce
    manual effort in procurement operations
  - Monitor system performance, integration health, and tool
    adoption metrics; escalate issues and recommend
    improvements proactively
  - Maintain thorough technical documentation covering system
    architecture, integration configurations, and standard
    operating procedures
  - Coordinate with IT and security teams to ensure AI tool
    deployments meet access, compliance, and data governance
    requirements
  - Serve as a technical point of contact for GIS team members
    on AI tool questions, configuration requests, and
    troubleshooting
  - We are primarily an in-office environment and therefore, you
    will be expected to work from the {{OFFICE_LOCATION}}
    office in compliance with Everpure's policies, unless you
    are on PTO, or work travel, or other approved leave.

  WHAT YOU BRING

  - 3-5 years of experience in a systems engineering,
    procurement technology, or related role
  - Hands-on experience with MCP, APIs with procurement
    platforms, i.e. NetSuite, SAP S/4HANA experience
  - Familiarity with supplier management or intake tools such as
    Graphite Connect and LevelPath a plus
  - Hands-on experience with AI tools like Gemini, Claude
  - Comfort working with APIs, light scripting (Python or
    similar), and system integrations
  - Experience with Google Workspace administration and Slack in
    a business operations context
  - Strong analytical and troubleshooting instincts with high
    attention to detail
  - Effective communicator who can translate technical concepts
    for non-technical stakeholders
  - Able to work independently in a remote, globally distributed
    team environment

  Nice to Have

  - Prior experience implementing or administering AI/ML tools
    in an enterprise setting
  - Exposure to procurement operations, sourcing workflows, or
    indirect spend management
  - Experience working with or supporting a data science
    function

  Why This Role

  You will have a direct impact on how a fast-moving,
  innovation-focused procurement team adopts and scales AI -
  with visibility into a broad technology stack and room to
  grow as our AI initiatives expand.

  Examples of how a person in this role could help

  - Integrate with various MCP servers to enable AI agents and
    automation pipelines to query live procurement data,
    supporting use cases such as discrepancy detection,
    anomaly alerting, and exception handling - in
    collaboration with the Data Scientist
  - Build and maintain integration pathways between AI
    interfaces and Data Science/Automation applications (e.g.,
    Claude integration with Python to standardize vendor
    invoice and contract information)
  - Provide automation and user interface support for surfacing
    Data Science insights to end users (e.g., automated
    emailers for fraud alerts, lightweight RBAC web
    applications for sourcing stakeholders)
  - Act as the POC on MCP-based data access processes across
    tools and systems
  - Collaborate with vendors and/or internal teams to build data
    entry checkpoints in tools such as Graphite, including
    edge AI handling (e.g., deducing a spend category from a
    free-text project description)
  - Build AI automation to support tasks such as low-value PR
    creation, PR field data validation, anomaly handling, etc.

  #LI-ONSITE

  WHAT YOU CAN EXPECT FROM US:

  - Innovation: We celebrate those who think critically, like a
    challenge, and aspire to be trailblazers.
  - Growth: We give you the space and support to grow along with
    us and to contribute to something meaningful. We have been
    named Fortune's Best Workplaces in Technology™, Fortune's
    Best Workplaces in the Bay Area™, and certified as a Great
    Place to Work®!
  - Team: We build each other up and set aside ego for the
    greater good.

  And because we understand the value of bringing your full
  and best self to work, we offer a variety of perks to manage
  a healthy balance, including flexible time off, wellness
  resources, and company-sponsored team events. Check out
  purebenefits.com for more information.

  ACCOMMODATIONS AND ACCESSIBILITY:

  Candidates with disabilities may request accommodations for
  all aspects of our hiring process. For more on this, contact
  us at TA-Ops@purestorage.com if you’re invited to an
  interview.

  OUR COMMITMENT TO A STRONG AND INCLUSIVE TEAM:

  We’re forging a future where everyone finds their rightful
