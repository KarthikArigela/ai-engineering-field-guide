description: |
  [About the role]

  This role is for someone who thrives at the intersection of
  great engineering and great product thinking. You'll design
  and ship robust frontend solutions, contribute to SDK
  development, and collaborate across teams to bring complex
  features to life seamlessly. Someone who takes full
  ownership, sweats the details, and raises the engineering
  culture around them will do exceptionally well here.

  [Key Responsibilities]

  - Minimum 7 years of professional frontend development
    experience
  - Proven experience designing and shipping SDKs, including
    public API design, versioning strategy, and backward
    compatibility
  - Strong proficiency in JavaScript/TypeScript and deep
    understanding of frontend architecture
  - Solid experience with MVVM or similar architecture patterns
    in production environments
  - Experience working with RESTful APIs, including network
    request lifecycle, error handling, and API versioning
  - Hands-on experience with authentication and session
    management (e.g., OAuth, token-based auth, refresh token
    rotation)
  - Experience with data synchronization strategies and offline-
    first design
  - Proven ability to review and discuss API specifications
    (OpenAPI/Swagger) and provide mobile/client-friendly
    feedback to backend teams
  - Proficiency with debugging tools such as Charles Proxy,
    Postman, or Wireshark for end-to-end issue diagnosis
  - Solid experience with Git and version control best practices
  - Experience with media-related frontend features
  - Track record of leading code reviews, mentoring junior
    developers, and establishing engineering best practices
  - Demonstrated ability to own features end-to-end from concept
    through deployment, collaborating closely with product
    managers, designers, and backend engineers

  [Required Experience]

  - Advanced understanding of browser/platform internals,
    system-level APIs, and performance optimization techniques
  - Expertise in WebSocket technologies and real-time
    communication architecture design
  - Experience with low-latency streaming, adaptive bitrate
    streaming (HLS/DASH), and related protocols
  - Deep knowledge of audio codecs, audio processing, and
    audio/video synchronization techniques
  - Prior experience designing and implementing custom media
    pipelines
  - Experience with WebRTC or similar peer-to-peer communication
    technologies
  - Familiarity with Web Audio API or media player SDK
    development
  - Experience publishing and maintaining npm packages
  - Contributions to open-source frontend projects
  - Technical blog posts, conference talks, or other public
    knowledge-sharing activities
