description: |
  About This Opportunity

  This is a general application for Full-Stack Applied AI
  Engineers across Infinity Constellation’s platform and
  portfolio of companies and the companies we build and
  support. Rather than applying to a specific role, you’ll be
  joining our talent network for current and future
  opportunities across the businesses we build and support.

  Because our hiring needs evolve quickly, applying does not
  necessarily mean there is an immediate opening that matches
  your background today. When a relevant opportunity arises,
  our team may reach out to discuss the specific company,
  project, scope, and timing.

  About Infinity

  Infinity Constellation is a holding company building full-
  stack AI businesses. Our engineering teams work across a
  range of zero-to-one and growth-stage challenges, from
  rapidly prototyping new product ideas and building AI-native
  platforms to embedding directly with companies and clients
  to solve complex, real-world problems.

  We also build and evolve Gravity, our in-house software
  factory and agent hub used to accelerate how software is
  created across the Infinity ecosystem.

  We’re not a dev shop. We’re a focused network of builders
  who move quickly, reduce ambiguity, and create leverage
  across companies with AI at their core.

  About The Role

  We’re looking for sharp, resourceful, execution-focused
  engineers who thrive in high-autonomy environments and enjoy
  building at the intersection of full-stack software
  engineering, applied AI, product, and systems design.

  Depending on the opportunity, you might spend one week
  validating a new product idea through a rapid prototype and
  the next building production-grade AI workflows, internal
  platforms, or client-facing applications. Some engineers
  work directly on shared Infinity infrastructure, while
  others embed with portfolio companies or clients to solve
  high-impact technical problems.

  The common thread: you’ll be expected to turn ambiguity into
  working software, make pragmatic technical decisions, and
  own outcomes—not just code.

  What You’ll Do

  - Build and ship full-stack, AI-native products, internal
    platforms, prototypes, and production applications.
  - Design and implement agentic AI applications, LLM workflows,
    RAG systems, document-processing pipelines, and other
    applied AI solutions.
  - Translate ambiguous business, product, or client needs into
    scalable technical systems.
  - Build modern frontend experiences using frameworks such as
    React and Next.js.
  - Develop backend systems and APIs using Python, Node.js,
    FastAPI, Django, or similar technologies.
  - Design data models and work across relational, graph,
    vector, and hybrid database architectures.
  - Integrate commercial APIs, open-source models, automation
    platforms, and third-party tools to create leverage and
    accelerate execution.
  - Build asynchronous workflows, internal dashboards, admin
    tools, approval systems, and automation infrastructure.
  - Experiment quickly across frameworks and technologies while
    knowing when to optimize for speed versus long-term
    scalability.
  - Contribute to shared internal libraries, Infinity Commons,
    and Gravity, our software factory platform.
  - Collaborate directly with founders, product leaders, senior
    engineers, and, in some cases, clients to define problems
    and ship solutions.
  - Occasionally embed with an Infinity company or client team
    to support launches, unblock execution, or build zero-to-
    one products.

  What We’re Looking For

  We’re building a broad pipeline and recognize that the right
  level of experience may vary by opportunity. In general,
  we’re interested in engineers who bring:

  - Experience and comfort working directly with stakeholders
    and customers to translate business problems into working
    solutions
  - Strong software engineering fundamentals and experience
    shipping real products used by real users.
  - Fluency in Python and experience building AI-powered
    applications, workflows, or systems.
  - Full-stack development experience with modern web
    technologies such as React, Next.js, Node.js, FastAPI,
    Django, or equivalent frameworks.
  - Experience rapidly building and iterating on prototypes,
    proof-of-concepts, MVPs, or zero-to-one products.
  - Practical experience working with LLMs, AI APIs and agent
    frameworks including demonstrating your ability to measure
    the quality and performance of these systems.
  - Comfort integrating APIs, cloud services, databases, open-
    source tools, and automation platforms.
  - Strong systems thinking and an ability to design solutions
    that can evolve without unnecessary complexity.
  - The ability to translate non-technical, product, or client
    needs into pragmatic technical solutions.
  - Comfort working in ambiguity, making tradeoffs, and taking
    ownership without waiting for perfectly defined
    specifications.
  - Strong communication skills and the ability to collaborate
    with both technical and non-technical stakeholders.

  Technical Experience We Value

  Depending on the specific opportunity, relevant experience
  may include:

  - Frontend: React, Next.js, or equivalent modern frameworks.
  - Backend: Python, FastAPI, Django, or similar technologies.
  - AI & LLMs: Agentic workflows, multi-agent systems, prompt
    engineering, structured outputs, RAG, GraphRAG,
    embeddings, vector databases, and LLM orchestration.
  - Data & Databases: PostgreSQL, Neo4j, BigQuery, Supabase,
    Pinecone, Weaviate, relational databases, graph databases,
    and hybrid schemas.
  - Cloud & Infrastructure: AWS, GCP or other major cloud
    platforms, containerized services, task queues, and
    distributed processing.
  - Integrations & Automation: REST APIs, webhooks, n8n,
    Temporal, and other workflow or automation tools.
  - Production Systems: Authentication, permissions, role-based
    access, asynchronous workflows, observability, and
    handling real-world edge cases.

  You do not need experience with every technology listed
  above. We care more about your ability to learn quickly,
  make sound technical decisions, and use the right tools to
  solve the problem at hand.

  Bonus Points

  - Experience building AI agents and a deep understanding of
    what it takes to make them reliable in production.
  - Experience with RAG, GraphRAG, vector databases, knowledge
    retrieval, or document-processing pipelines.
  - Experience building internal platforms that evolved into
    external-facing products.
  - Previous experience as a founder, founding engineer, or
    early employee at a venture-backed startup.
  - Experience working directly with clients in a forward-
    deployed engineering environment.
  - Experience in regulated or technically complex industries.
  - Experience building products for agencies, creative teams,
    knowledge workers, or operational teams.
  - Contributions to open-source AI or ML projects.
  - A background in a STEM discipline, data science, or
    quantitative engineering.

  How We Work

  - High ownership: We expect engineers to own outcomes, not
    just assigned tickets.
  - Bias toward shipping: We scope ruthlessly, ship quickly,
    learn from real users, and iterate.
  - Pragmatic engineering: We care about leverage, simplicity,
    and compounding value over unnecessary complexity.
  - Comfort with ambiguity: Requirements evolve. We expect you
    to help shape the solution, not wait for perfect
    specifications.
  - Asynchronous by default: We value clear communication, tight
    feedback loops, and autonomy.
  - AI-native: We actively experiment with how AI changes what
    and how we build, while knowing when AI is—and isn’t—the
    right solution.
  - Small teams, meaningful impact: You’ll work alongside
    experienced builders across AI, product, infrastructure,
    and company creation.

  This Environment May Be a Fit for You If

  - You enjoy turning ambiguous ideas into working products.
  - You think in systems, not just individual features.
  - You want autonomy and responsibility more than rigid
    structure.
  - You enjoy zero-to-one building and fast iteration.
  - You’re comfortable making pragmatic tradeoffs without
    paralysis.
  - You want your work to have visible, direct impact.

  This environment may be less suited to you if you prefer
  highly defined specifications, long planning cycles, narrow
  ownership, or primarily maintaining mature systems.

  What’s In It For You

  Infinity Constellation is committed to fair and competitive
  pay, ensuring that compensation reflects both market
  conditions and the value each team member brings. Our salary
  structure accounts for regional differences in cost of
  living while maintaining internal equity.

  During the interview process, your Talent Acquisition
  Partner will confirm compensation tier applicable to your
  location. For candidates outside the U.S., compensation is
  aligned with local market conditions and cost of living.

  Total compensation is determined by factors such as
  location, relevant experience, skills, internal pay equity,
  and market conditions. While every offer is unique, our
  compensation philosophy is designed to ensure fairness,
  consistency, and competitiveness across the Organization.
  Additional details on total compensation and benefits will
  be discussed during the hiring process.

  Equal Opportunity Statement:

  We’re an equal opportunity employer. All qualified
  applicants will receive consideration for employment without
  regard to race, color, religion, sex, national origin,
  disability, or veteran status, or any other basis protected
  by law.



  E-Verify Notice:

  Infinity Constellation participates in the federal E-Verify
  program. This program electronically verifies the identity
  and employment eligibility of all individuals hired to work
  in the United States. To learn more about your rights and
  responsibilities, please review the official E-Verify
  Participation Poster and the Right to Work Poster in both
  English and Spanish.
