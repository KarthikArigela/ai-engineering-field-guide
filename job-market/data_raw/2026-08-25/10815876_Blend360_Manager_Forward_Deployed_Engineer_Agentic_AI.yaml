description: |
  Company Description

  Blend is a premier AI services provider, committed to co-
  creating meaningful impact for its clients through the power
  of data science, AI, technology, and people. Blend works
  with enterprises to turn AI ambition into measurable
  business outcomes, with a strong focus on moving solutions
  from experimentation into production.

  Blend's Forward Deployed AI Engineering model places senior,
  hands-on engineers directly within client environments and
  alongside client teams, creating accountability from
  solution design through production deployment. Blend is also
  investing heavily in agentic AI, including reusable
  orchestration, evaluation, observability, MCP, and
  production-ready AI foundations

  The company is dedicated to unlocking value and fostering
  innovation for its clients by harnessing world-class people
  and data-driven strategy. We believe that the power of
  people and AI can have a meaningful impact on your world,
  creating more fulfilling work and projects for our people
  and clients. For more information, visit www.blend360.com.

  Job Description

  We are looking for a Forward Deployment Engineer – Agentic
  AI to design, build, deploy, and continuously improve
  production-grade AI agents within enterprise client
  environments.

  This role combines AI Engineering, software engineering,
  context engineering, agent evaluation, and client-facing
  solution delivery. You will work directly with client teams
  to understand business problems, design agentic solutions,
  integrate agents with enterprise systems and tools, and
  ensure that agents are reliable, measurable, secure, and
  production-ready.

  The ideal candidate is someone who can move beyond building
  AI prototypes and can take an agentic solution from business
  problem → architecture → development → deployment →
  evaluation → continuous improvement.


  Key Responsibilities:

  Agentic AI Engineering

  - Design and develop LLM-powered agents using Claude Code,
    OpenAI Codex, or similar AI coding agents  that are
    capable of reasoning, planning, using tools, and executing
    complex multi-step workflows.
  - Build autonomous and semi-autonomous agents using frameworks
    such as LangGraph, LangChain, Google ADK, Semantic Kernel,
    AutoGen, or equivalent technologies.
  - Implement agent planning, task decomposition, tool
    selection, execution, observation, retry, and validation
    workflows.
  - Build multi-agent systems where specialized agents
    collaborate to complete complex business processes.
  - Integrate agents with enterprise applications, APIs,
    databases, SaaS platforms, and business workflows.

  Context Engineering

  - Design and implement context engineering strategies that
    provide agents with the right information, instructions,
    business rules, application state, and tool context at the
    right time.
  - Build and integrate Context APIs, RAG, memory/state
    management, structured context, and dynamic context
    retrieval where appropriate.
  - Optimize context to improve agent accuracy, reliability,
    latency, and cost.
  - Design mechanisms to prevent irrelevant or excessive context
    from degrading agent performance.
  - Apply context engineering principles across real-world
    enterprise workflows and client environments.

  Agent Harness Engineering

  - Design and implement agent harnesses that control state,
    tool access, permissions, guardrails, retries, recovery,
    validation, and execution.
  - Build human-in-the-loop workflows for actions requiring
    approval or oversight.
  - Implement secure tool execution and appropriate
    authentication and authorization controls.
  - Develop verification mechanisms that allow agents to
    validate whether an action or task was successfully
    completed.
  - Integrate agentic workflows with MCP and other enterprise
    tool protocols.

  MCP & Enterprise Integration

  - Develop and integrate Model Context Protocol (MCP) servers
    and tools.
  - Connect agents with enterprise systems including databases,
    APIs, Git/GitHub, Slack, Jira, Artifactory, CRM platforms,
    and other business applications.
  - Build reusable tools that allow agents to take actions,
    rather than simply generate responses.
  - Design secure and scalable integration patterns for
    enterprise AI agents.

  Agent Evaluation & Quality

  - Design and implement comprehensive agent evaluation
    frameworks to measure task completion, accuracy,
    reliability, tool usage, and business outcomes.
  - Develop evaluation datasets and automated test suites for
    agentic workflows.
  - Implement LLM-as-a-Judge alongside deterministic validation
    and business-rule-based evaluation.
  - Evaluate agent planning, tool selection, tool-call accuracy,
    response quality, hallucination, and task completion.
  - Establish regression testing to identify changes in agent
    performance as models, prompts, tools, or context evolve.
  - Develop monitoring and observability capabilities for
    production agent behavior.

  Production AI Engineering

  - Build production-grade AI services using Python, FastAPI,
    and modern software engineering practices.
  - Deploy AI agents within client cloud and enterprise
    environments.
  - Build scalable architectures for concurrent users, long-
    running workflows, and complex agent execution.
  - Implement caching, asynchronous processing, parallel
    execution, model optimization, and cost controls.
  - Integrate AI applications with Git, CI/CD, Docker, cloud
    platforms, logging, monitoring, tracing, and observability
    systems.

  Forward Deployment & Client Engagement

  - Work directly with client teams to understand business
    problems, technical environments, data, workflows, and
    constraints.
  - Translate business requirements into practical AI and
    agentic solutions.
  - Work alongside client engineering, data, product, and
    business teams to deploy solutions within their existing
    technology ecosystem.
  - Troubleshoot production issues and continuously iterate
    based on client feedback and real-world agent performance.
  - Communicate technical concepts, trade-offs, limitations, and
    AI-generated insights effectively to both technical and
    business stakeholders.
  - Take ownership of outcomes from initial discovery through
    production deployment and adoption.

  Business Impact & Continuous Improvement

  - Identify opportunities where agentic AI can automate complex
    workflows, improve decision-making, reduce manual effort,
    or enhance customer and employee experiences.
  - Measure the business impact of deployed AI solutions.
  - Continuously improve agents based on evaluation results,
    production telemetry, user feedback, and changing business
    requirements.
  - Help convert successful AI concepts into repeatable,
    scalable enterprise solutions.

  Qualifications

  Skills Required

  - 6–15 years of experience in AI Engineering, Machine
    Learning, Software Engineering, Data Science, or a related
    field, with hands-on experience building and deploying
    production AI solutions.
  - Strong Python development skills with experience building
    APIs and AI services using FastAPI or similar frameworks.
  - Hands-on experience building LLM-powered agentic
    applications, including multi-step workflows, tool
    calling, planning, task decomposition, and state
    management.
  - Experience with agent orchestration frameworks such as
    LangGraph, LangChain, Google ADK, Semantic Kernel,
    AutoGen, or equivalent.
  - Hands-on experience with MCP (Model Context Protocol) and
    integrating agents with enterprise tools, APIs, databases,
    and applications.
  - Strong experience with context engineering, including
    context APIs, application state, memory, RAG, dynamic
    context retrieval, agent instructions, and context
    optimization.
  - Experience with agent harness engineering, including
    permissions, guardrails, human-in-the-loop controls,
    retries, recovery, validation, and automated verification.
  - Experience designing and implementing agent evaluation
    frameworks, including task-level evaluation, tool-call
    evaluation, regression testing, LLM-as-a-Judge, and
    production monitoring.
  - Strong software engineering experience with Git, CI/CD,
    Docker, APIs, SQL/databases, cloud platforms,
    observability, and production deployment.
  - Strong understanding of LLM performance, hallucination
    mitigation, context windows, token usage, latency,
    caching, model selection, and cost optimization.
  - Experience with RAG, embeddings, vector databases, semantic
    search, reranking, and grounding is highly desirable.
  - Experience with Claude Code, OpenAI Codex, or similar AI
    coding agents, including repository context engineering,
    agent instructions, automated testing, and verification,
    is highly desirable.
  - Strong client-facing communication skills with the ability
    to work directly with enterprise stakeholders and
    engineering teams.
  - Demonstrated ability to take AI solutions from prototype to
    production and deliver measurable business impact.

  Additional Information

  What Success Looks Like:

  - Successfully deploy production-grade agentic AI solutions
    within client environments.
  - Improve agent reliability through effective context
    engineering, evaluation, and harness design.
  - Establish measurable improvements in task completion,
    accuracy, latency, cost, and business outcomes.
  - Reduce manual effort through intelligent workflow
    automation.
  - Build reusable agentic patterns, tools, MCP integrations,
    and evaluation frameworks that can scale across client
    engagements.
  - Help clients move from AI experimentation to reliable,
    production-ready AI systems.

