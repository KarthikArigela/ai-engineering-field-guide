description: |
  Description

  Chaos Labs is building a new AI platform for the enterprise,
  focused on how organizations operate and create value in an
  AI-native world. We’re bringing years of experience building
  applied AI and mission-critical infrastructure to a new
  category of enterprise software. Previously, Chaos Labs
  built the leading risk management platform for on-chain
  finance, processing more than $5 trillion in financial
  volume and managing tens of billions of dollars in assets.

  We’ve raised $65 million from Haun Ventures, Lightspeed,
  Galaxy, General Catalyst, Bessemer, F-Prime, PayPal, and
  others. We’re currently operating in stealth and building
  with a small team around a technically ambitious problem we
  believe will become increasingly important as AI reshapes
  how companies work.

  How We Work

  Chaos is built around high-agency, high-talent individual
  contributors. We keep teams small, give people meaningful
  ownership, and expect them to operate with autonomy, strong
  judgment, and a high bar for their craft. We hire people who
  can take an ambiguous, important problem and drive it
  forward — not just execute against a predefined roadmap.
  Titles matter less than impact, and the people closest to a
  problem are trusted to make decisions and own outcomes.

  We move fast, stay close to the work, and care deeply about
  building things exceptionally well. Ownership over
  instruction. Impact over hierarchy.

  The Role

  We’re hiring a Senior Full-Stack AI Software Engineer to own
  the design, development, and operation of full-stack
  applications and infrastructure that power our enterprise AI
  platform.

  This is a high-impact role with significant ownership from
  day one. You’ll work closely with Product, Engineering, and
  other cross-functional partners to build reliable, scalable,
  and high-performance products across the frontend and
  backend, taking problems from ambiguity through execution
  and measurable impact.

  You’ll work across the stack — from responsive React
  applications and backend APIs to cloud infrastructure,
  databases, integrations, and deployment pipelines — with
  opportunities to build AI-powered product capabilities using
  modern LLM technologies.

  What You’ll Do

  - Own the design and development of full-stack product
    experiences end to end, building responsive frontend
    applications exclusively with React and TypeScript and
    scalable backend services and APIs using Python and Rust.
  - Drive the development of reliable, scalable, secure, and
    high-performance applications, continuously improving
    application performance, reliability, security, and cost.
  - Partner with Product, Engineering, and cross-functional
    teams to translate ambiguous product and technical
    problems into production-ready solutions.
  - Build and improve the underlying cloud infrastructure,
    databases, integrations, automated tests, and CI/CD
    pipelines, integrating applications with AWS
    infrastructure.
  - Develop AI-powered product capabilities, where relevant,
    using LLMs, RAG, embeddings, vector databases, and AI
    agents.
  - Identify technical and product opportunities, form strong
    points of view, and turn them into action.

  What We’re Looking For

  - 5+ years of professional software engineering experience.
  - Strong proficiency in Python and JavaScript/TypeScript.
  - Expertise with RAG, embeddings, vector databases, AI agents,
    and prompt evaluation techniques.
  - Production experience building applications with React.
  - Experience building backend APIs and distributed systems.
  - Expertise with AWS.
  - Familiarity with Kubernetes.
  - Experience working with SQL and NoSQL databases.
  - Strong communication, product thinking, and problem-solving
    skills.
  - Comfort taking ownership of ambiguous technical problems and
    driving them from design through production.
  - Ability to operate effectively in a fast-paced,
    collaborative environment.

  Requirements

  - 5+ years of professional software engineering experience.
  - Strong Python and JavaScript/TypeScript skills.
  - Production experience with React.
  - Backend API and distributed-systems experience.
  - Familiarity with AWS, Azure or GCP.
  - Familiarity with Kubernetes
  - Familiarity with SQL and NoSQL databases.
  - Experience with Rust, Go, or another statically typed
    language is a plus.
  - Familiarity with RAG, embeddings, vector databases, AI
    agents, and prompt evaluation.
  - Strong communication, product thinking, and problem-solving
    skills.

  Preferred Qualifications

  - Experience with Rust, or another statically typed language.
  - Familiarity with RAG, embeddings, vector databases, AI
    agents, and prompt evaluation.
  - Familiarity with profiling tools and performance
    optimization techniques.
  - Based in NYC with the ability to work from our Brooklyn
    office, or remote with the ability to travel up to 30% of
    the year to collaborate with the team in person.

  Benefits

  - Paid Time Off – 21 vacation days + 7 sick days + 8 observed
    U.S. company holidays
  - Health Coverage – 100% employer-paid options (medical,
    dental & vision) for you and your dependents
  - FSA / HSA Options – depending on selected health insurance
    plan
  - Wellness Programs – OneMedical, Teladoc, Talkspace, and EAP
  - 401(k) - with a 100% company match on the first 6%
    contributed
  - Career Growth – opportunities in a rapidly expanding, global
    technology company with personalized professional
    development
  - Pre-tax Commuter Benefits
  - Compensation & Equity – competitive package aligned with
    growth and merit
  - Salary and Seniority level commensurate with experience
    (range: $196K- 212K)
