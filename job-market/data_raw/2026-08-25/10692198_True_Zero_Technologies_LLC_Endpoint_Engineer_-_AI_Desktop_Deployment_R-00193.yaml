  The Endpoint Engineer – AI Desktop Deployment is responsible
  for designing, deploying, securing, and maintaining
  enterprise Windows endpoints that support AI-enabled desktop
  capabilities in highly regulated, government, and Zero Trust
  environments. This role combines traditional Windows desktop
  engineering with modern endpoint management, security
  compliance, application deployment, performance
  optimization, and device health monitoring.

  The engineer will work closely with cybersecurity, cloud,
  identity, infrastructure, and application teams to ensure
  endpoints are secure, compliant, performant, and ready to
  support AI-enabled applications and workloads. The ideal
  candidate has strong hands-on experience with Microsoft
  Intune, Microsoft Endpoint Manager, Windows 10/11, Group
  Policy, application packaging, and Zero Trust endpoint
  controls.

  Job Responsibilities

  - Perform enterprise desktop engineering for Windows 10 and
    Windows 11, including operating system configuration,
    deployment, lifecycle management, and troubleshooting.
  - Administer and engineer Microsoft Intune / Microsoft
    Endpoint Manager environments for device enrollment,
    configuration, application deployment, compliance, and
    endpoint security.
  - Design, implement, maintain, and troubleshoot Group Policy
    Objects (GPOs) supporting enterprise security,
    configuration, and operational requirements.
  - Establish and maintain standardized Windows endpoint
    configurations, deployment methodologies, and engineering
    documentation.
  - Develop and maintain Windows provisioning and deployment
    solutions, including Autopilot and automated device
    enrollment where applicable.
  - Evaluate Windows updates, feature releases, drivers,
    firmware, and endpoint configuration changes before
    production deployment.
  - Support endpoint modernization efforts and migration from
    legacy endpoint-management technologies to cloud-managed
    or hybrid-management architectures.
  - Automate repetitive endpoint administration and
    configuration tasks using PowerShell and other approved
    scripting technologies.

  Job Qualifications

  - Bachelor’s degree in Cybersecurity, Computer Science,
    Information Technology, Information Systems, or a related
    technical discipline.
  - Experience deploying Microsoft Copilot, AI assistants, or
    other enterprise AI desktop applications.
  - Familiarity with enterprise AI governance, data-loss
    prevention, information protection, and access-control
    considerations for generative AI tools.
  - Experience evaluating endpoint hardware and software
    readiness for AI-enabled workloads.
  - Familiarity with Windows AI capabilities, AI-enabled
    productivity platforms, or locally executed AI workloads.
  - Experience integrating endpoint-management telemetry with
    security, identity, IT operations, or SIEM platforms.
  - Experience with Windows Autopilot, Microsoft Graph,
    PowerShell automation, or proactive remediation
    technologies.

