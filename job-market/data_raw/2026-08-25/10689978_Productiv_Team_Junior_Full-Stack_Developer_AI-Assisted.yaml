description: |
  About the role

  We are looking for a Junior Full-Stack Developer to join a
  small team building a TypeScript product on Next.js 15 and
  React 19, with an AI pipeline powered by Anthropic Claude,
  real-time collaboration (Liveblocks, Yjs, Tiptap), and
  background job processing on Google Cloud Run. You'll work
  alongside a senior engineer across the UI, the AI agents,
  and test coverage, with plenty of room to grow into owning
  full features as the product expands into its next module.

  Key Responsibilities

  - Build feature work across the UI: workspace panels, editors,
    and drawers
  - Contribute to improvements on the AI agents: prompts,
    schemas, and output rendering
  - Write and maintain unit tests as part of the normal
    development flow
  - Read code and documentation to unblock yourself in a fast-
    moving, well-documented but small-team environment
  - Grow into owning slices of the product's next module over
    time

  Required Qualifications

  - Solid TypeScript and React fundamentals, with some exposure
    to Next.js or a comparable full-stack framework
  - Comfort with SQL and an ORM: able to add models, write
    queries, and understand relational integrity
  - API literacy: able to build and debug REST endpoints, read
    third-party API docs, and trace a request across services
  - A testing habit: writes unit tests without being asked
  - High agency and fast learning
  - Strong async communication: clear technical questions,
    documented decisions, and self-surfaced blockers

  Nice to Have

  - Side projects using LLM APIs
  - Contributions to a real production codebase (internship or
    open source)
  - Interest in sales and GTM tooling
