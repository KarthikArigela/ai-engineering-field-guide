  About the Opportunity

  Pragmatike is recruiting on behalf of a fast-growing
  technology company building critical infrastructure that
  powers high-volume, real-time business operations across
  multiple systems and platforms.

  We are seeking a Staff AI Engineer to lead the design and
  deployment of production AI systems at scale.

  What You'll Do

  - Lead architecture for production AI systems.
  - Design model serving, inference, evaluation, and
    optimization pipelines.
  - Improve model latency, throughput, quality, and cost.
  - Lead technical AI initiatives across multiple teams.
  - Establish engineering standards for AI development and
    deployment.
  - Mentor AI engineers.
  - Partner with Product and Engineering leadership on AI
    strategy.
  - Evaluate emerging models and infrastructure technologies.

  What We're Looking For

  - 7+ years of engineering or ML experience.
  - Deep Python and ML engineering expertise.
  - Strong production LLM experience.
  - Strong distributed systems and system design skills.
  - Experience optimizing inference systems.
  - Strong technical leadership and communication.

  Nice to Have

  - vLLM, TGI, Triton, CUDA, PyTorch.
  - Kubernetes and GPU infrastructure.
  - RAG and fine-tuning.
  - AI agents.
  - High-scale AI production environments.

  Why Join?

  Our client is building highly scalable technology that sits
  at the core of critical business operations, offering
  engineers the opportunity to work on complex systems, large-
  scale integrations, and real-world technical challenges.

  You'll join a collaborative, fast-moving environment where
  ownership is encouraged, decisions are made quickly, and
  engineers have meaningful influence on architecture, product
  direction, and engineering culture.

  This role offers the opportunity to tackle challenging
  backend problems, work with modern technologies, and grow
  alongside an ambitious team building for scale.

  Full benefit package and competitive compensation.



