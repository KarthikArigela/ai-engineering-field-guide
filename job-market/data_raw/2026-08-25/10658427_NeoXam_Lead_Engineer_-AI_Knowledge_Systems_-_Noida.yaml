  Role - Lead Engineer - AI & Knowledge Systems

  Location: India - Noida

  Type: Full-time

   R&D Technology

  About NeoXam

  NeoXam is a leading B2B fintech software vendor serving buy-
  side investment managers and asset servicers globally. Our
  platform covers data management, reconciliation, fund
  accounting, reporting, and portfolio management. As we
  scale, we are investing in making our knowledge, both
  technical and functional, structured, queryable, and
  continuously up to date.

  The Role

  We are looking for a Lead GenAI Engineer to own a strategic,
  greenfield initiative at the intersection of AI, software
  engineering, and knowledge management.

  The problem space is clear: make NeoXam's technical and
  functional knowledge accessible, reliable, and actionable
  across engineering, support, and product teams. The exact
  shape of the solution is yours to define. You will explore,
  prototype, and progressively converge toward a production-
  grade system grounded in real use cases.

  This is a hands-on individual contributor role with end-to-
  end ownership, from architecture to deployment, and direct
  reporting at the CPO/CTO level. As the initiative matures,
  you will have the opportunity to grow a team around you.

  What You Will Work On

  - Design and deploy a RAG-based knowledge service, including
    ingestion pipelines consolidating information from
    codebases, documentation, and structured data
  - Build agentic tooling enabling LLM agents to navigate and
    reason over large, heterogeneous technical corpora
  - Develop pipelines that synthesize knowledge artifacts at
    multiple levels of abstraction from low-level technical
    references to functional and business-oriented content
  - Define and maintain a domain ontology capturing NeoXam's
    product concepts and their relationships
  - Continuously improve retrieval quality, agent reasoning, and
    output reliability based on real usage

  Why This Problem Is Hard

  - Highly heterogeneous inputs: code, documentation, financial
    data, configurations
  - Strong correctness expectations with multi-level reasoning
    technical, functional, business
  - Constantly evolving knowledge across projects and clients
  - Outputs must be explainable and trustworthy not black-box
    answers

  What We Are Looking For

  Must-have

  - 5-8 years of software engineering experience
  - Hands-on experience building and shipping AI, ML, or data
    pipelines in production
  - Comfortable working end-to-end autonomously, from
    architecture to deployment
  - Fluency with Claude Code, Cursor, or an equivalent agentic
    development environment

  Nice-to-have

  - Familiarity with RAG architectures and LLM frameworks
    (LangChain, LlamaIndex, or equivalent)
  - Experience with agentic frameworks (LangGraph, AutoGen, tool
    use patterns)
  - Experience with code analysis tools (AST, tree-sitter, LSP)
  - Experience with vector databases (Pinecone, Weaviate,
    pgvector, or equivalent)
  - Background in enterprise or B2B software environments

  Who You Are

  - A builder, energized by greenfield problems
  - Pragmatic, you pick the right tool, not the flashiest one
  - Autonomous, you drive toward outcomes without waiting to be
    told what to do next
  - Curious, you find the intersection of LLMs and software
    systems genuinely interesting

  Why Join

  - Full ownership of a strategic, company-wide initiative, you
    design the architecture, you make the calls
  - Direct visibility at the highest level of product and
    engineering
  - Path to building and leading a team as the scope grow
