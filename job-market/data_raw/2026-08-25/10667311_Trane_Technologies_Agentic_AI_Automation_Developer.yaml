description: |
  Be a part of our mission! As a world leader in creating
  comfortable, sustainable, and efficient climate solutions
  for buildings, homes and transportation, it's our
  responsibility to put the planet first. For us at Trane
  Technologies, and through our businesses including Trane®
  and Thermo King,  sustainability is not just how we do
  business—it is our business.  Do you dare to look at the
  world's challenges and see impactful possibilities?  Do you
  want to contribute to making a better future?  If the answer
  is yes, we invite you to consider joining us in boldly
  challenging what's possible for a sustainable world.

  Learn about our benefits designed for you to Thrive at work
  and at home.

  We boldly go.

  Where is the work:

  Monday to Thursday, work onsite with your colleagues.
  Fridays, choose your work location, balancing what your work
  requires.

  What's in it for you: The Agentic AI/Automation Developer –
  AI Solutions is a hands-on delivery role responsible for
  designing, building, testing, deploying, and supporting AI-
  and automation-enabled solutions for enterprise needs.

  This role requires strong software development, integration,
  and automation skills, along with an interest in applying
  agentic AI capabilities to address practical business needs.
  The individual in this role will work closely with the
  AI/Automation Technical Leader and domain subject matter
  experts to translate business requirements into reliable,
  scalable, and maintainable solutions.

  The ideal candidate is a strong technical practitioner who
  enjoys building effective solutions, learning emerging AI
  patterns, and applying them responsibly in an enterprise
  environment. Success in this role will be measured by the
  delivery of high-quality solutions, contributions to
  reusable technical assets, and the ability to convert
  business requirements into measurable outcomes

  In this role, you will have the opportunity to:

  - Build AI and automation solutions for enterprise needs
  - Work hands-on with agentic AI capabilities, APIs,
    integrations, orchestration patterns, and enterprise
    systems
  - Working closely with the technical leader and domain SMEs to
    shape and deliver practical solutions
  - Apply coding assistants, agentic coding practices, modern AI
    and automation approaches in real business scenarios
  - Help move use cases from concept and prototype to
    production-ready implementation
  - Contribute to reusable components, patterns, and delivery
    practices that improve future solution development

  What you will do:

  As Agentic AI/Automation Developer – AI Solutions, you will:

  - Design, build, test, deploy, and support AI- and automation-
    enabled solutions for enterprise use cases
  - Work closely with the AI/Automation Technical Leader to
    implement solution designs, technical components, and
    delivery priorities
  - Build solutions using agentic AI capabilities such as
    agents, tool-calling, orchestration, prompt workflows,
    context handling, retrieval patterns, and human-in-the-
    loop controls
  - Develop and integrate APIs, backend services, automation
    workflows, enterprise applications, and cloud services
    into end-to-end solutions
  - Support prototyping, experimentation, and iterative
    development to validate and improve solution approaches
  - Contribute to the design of secure, scalable, reliable,
    maintainable, and supportable production-grade solutions

  - Use coding assistants and agentic coding practices as part
    of the development and delivery process

  - Create reusable components, templates, connectors, and
    technical assets that accelerate future AI and automation
    delivery
  - Participate in code reviews, testing, debugging, and
    troubleshooting to maintain engineering quality
  - Follow engineering standards, governance guardrails, and
    best practices for AI and automation development
  - Stay current with emerging AI and automation technologies
    and apply them where they provide practical business value

  What you will bring:

  - Bachelor’s degree in Computer Science, Engineering,
    Information Technology, or equivalent practical work
    experience
  - 7+ years of experience in software development, automation,
    application development, or related technical roles
  - Strong programming experience in one or more modern
    languages such as Python, TypeScript, JavaScript, Java, or
    C#
  - Experience designing, building, testing, and supporting
    software applications or automation solutions
  - Experience building APIs, backend services, integrations,
    workflows, or enterprise applications
  - Experience working with databases, data integrations, and
    system interfaces
  - Experience using cloud platforms such as Azure, AWS, or GCP
  - Experience working collaboratively in cross-functional teams
    to deliver technical solutions
  - Strong problem-solving and analytical skills, with attention
    to quality, reliability, and business value
  - Strong communication skills and the ability to work
    effectively with technical teams and domain stakeholders

  Preferred Qualifications

  - Experience building AI-enabled applications using LLMs,
    agents, orchestration frameworks, retrieval workflows, or
    tool-calling patterns
  - Experience applying AI and automation capabilities to
    enterprise use cases
  - Familiarity with emerging AI concepts such as MCP, A2A,
    context engineering, memory patterns, and evaluation
    techniques
  - Understanding of software engineering best practices related
    to security, testing, observability, and supportability
  - Experience contributing to reusable frameworks,
    accelerators, or shared technical components
  - Experience working in a global enterprise or matrixed
    delivery environment

  We offer competitive compensation and comprehensive benefits
  and programs. We are an equal opportunity employer; all
  qualified applicants will receive consideration for
  employment without regard to race, color, religion, sex,
  sexual orientation, gender identity, national origin,
  pregnancy, age, marital status, disability, status as a
  protected veteran, or any legally protected status.
