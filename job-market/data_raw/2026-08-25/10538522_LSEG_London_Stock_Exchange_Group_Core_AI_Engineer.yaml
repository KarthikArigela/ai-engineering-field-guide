description: |
  ABOUT US:

  LSEG (London Stock Exchange Group) is more than a
  diversified global financial markets infrastructure and data
  business. We are dedicated, open-access partners with a
  dedication to excellence in delivering the services our
  customers expect from us. With extensive experience, deep
  knowledge and worldwide presence across financial markets,
  we enable businesses and economies around the world to fund
  innovation, manage risk and create jobs. It’s how we’ve
  contributed to supporting the financial stability and growth
  of communities and economies globally for more than 300
  years. Through a comprehensive suite of trusted financial
  market infrastructure services – and our open-access model –
  we provide the flexibility, stability and trust that enable
  our customers to pursue their ambitions with confidence and
  clarity.

  LSEG is headquartered in the United Kingdom, with
  significant operations in 70 countries across EMEA, North
  America, Latin America and Asia Pacific. We employ 25,000
  people globally, more than half located in Asia Pacific.
  LSEG’s ticker symbol is LSEG.

  OUR PEOPLE:

  People are at the heart of what we do and drive the success
  of our business. Our culture of connecting, creating
  opportunity and delivering excellence shape how we think,
  how we do things and how we help our people fulfil their
  potential. We embrace diversity and actively seek to attract
  individuals with unique backgrounds and perspectives.  We
  break down barriers and encourage teamwork, enabling
  innovation and rapid development of solutions that make a
  difference. Our workplace generates an enriching and
  rewarding experience for our people and customers alike. Our
  vision is to build an inclusive culture in which everyone
  feels encouraged to fulfil their potential.

  We know that real personal growth cannot be achieved by
  simply climbing a career ladder – which is why we encourage
  and enable a wealth of avenues and interesting opportunities
  for everyone to broaden and deepen their skills and
  expertise. As a global organisation spanning 70 countries
  and one rooted in a culture of growth, opportunity,
  diversity and innovation, LSEG is a place where everyone can
  grow, develop and fulfil your potential with meaningful
  careers.

  ROLE SUMMARY:

  The AI & Automation team is transforming how LSEG operates
  through the use of Artificial Intelligence, Automation and
  Intelligent Engineering. We are building enterprise-scale AI
  capabilities that improve service resilience, automate
  operational workflows, accelerate engineering productivity
  and enhance customer outcomes.

  As a Core AI Engineer, you will play a leading technical
  role in the design, development and deployment of AI
  solutions across the organisation. You will combine software
  engineering, machine learning and AI platform expertise to
  turn innovative concepts into production-ready products that
  deliver measurable business value.

  This is a hands-on engineering role for someone passionate
  about building scalable AI systems, solving complex
  technical challenges and influencing the direction of
  enterprise AI adoption.

  WHAT YOU'LL BE DOING:

  Design & Build AI Solutions

  - Design, develop and deploy enterprise-grade AI products and
    services.
  - Build agentic AI workflows, retrieval-augmented generation
    (RAG) solutions and intelligent automation capabilities.
  - Deliver scalable integrations with LLMs, MCP services,
    vector databases and enterprise platforms.
  - Develop reusable AI frameworks, accelerators and engineering
    standards.

  Engineering Excellence

  - Lead technical implementation across multiple AI
    initiatives.
  - Define solution architecture and engineering patterns for AI
    products.
  - Build robust APIs, orchestration services and automation
    pipelines.
  - Drive non-functional requirements including security,
    scalability, resilience and observability.

  Product & Platform Development

  - Partner with Product Managers, Data Scientists and
    Engineering teams to deliver AI solutions from concept
    through production.
  - Support the development of AI platforms that enable wider
    engineering adoption.
  - Establish monitoring, evaluation and governance processes
    for AI systems.
  - Improve reliability and performance of deployed AI
    capabilities.

  Innovation & Technical Leadership

  - Act as a technical leader across AI initiatives.
  - Mentor engineers and contribute to the development of AI
    engineering capability.
  - Evaluate emerging AI technologies and identify opportunities
    to accelerate delivery.
  - Provide technical direction on architecture, tooling and
    engineering practices. The Lead/IC profile is expected to
    guide technical outcomes and raise capability through
    collaboration while remaining deeply hands-on.

  Business Impact

  - Translate business challenges into scalable AI solutions.
  - Define measurable KPIs and success measures.
  - Ensure solutions drive productivity improvements,
    operational resilience and customer value.
  - Partner with stakeholders across Engineering, Operations and
    Product organisations.

  WHAT YOU'LL BRING:

  Essential Experience

  - Extensive software engineering experience delivering
    production-scale solutions.
  - Experience building AI or machine learning systems in
    enterprise environments.
  - Demonstrated experience moving AI solutions from proof-of-
    concept into production.
  - Strong understanding of software architecture, engineering
    standards and operational practices.
  - Ability to influence technical direction across teams
    without formal management responsibility.

  Technical Skills

  - Python and modern software engineering practices.
  - Experience with Large Language Models (LLMs) and Generative
    AI.
  - Agent frameworks and orchestration technologies.
  - Retrieval Augmented Generation (RAG) architectures.
  - API development and microservice design.
  - Cloud-native development (Azure preferred).
  - CI/CD automation and MLOps practices.
  - Vector databases and knowledge retrieval platforms.
  - Data modelling and distributed systems design.
  - AI observability, evaluation and governance frameworks.

  Desirable Experience

  - Experience within Financial Services or highly regulated
    environments.
  - Knowledge of Service Reliability Engineering (SRE)
    principles.
  - Experience developing AI-powered operational tooling.
  - Experience building internal AI platforms or developer
    enablement capabilities.
  - Familiarity with Microsoft AI ecosystem, Copilot
    technologies and Azure AI services.

  The successful candidate will demonstrate:

  - Deep technical curiosity and engineering excellence.
  - Strong ownership mindset and delivery focus.
  - Ability to solve ambiguous and highly complex problems.
  - Excellent stakeholder engagement and communication skills.
  - Collaborative leadership through influence.
  - Commitment to responsible and ethical AI development.
  - Passion for continuous learning and innovation.

  Career Stage:

  Manager

