title: Applied Artificial Intelligence (AI) Engineer
company: Sensata Xirgo
location: Pune, IND
work_type: FULL_TIME
company_size: 74 Employees
description: |
  We are seeking an Applied Artificial Intelligence (AI)
  Engineer who is a hands-on builder passionate about
  developing practical AI solutions to solve business
  challenges. Working under the direction of the Head of AI,
  you will design, build, and support AI-powered applications,
  workflows, and automation tools across functions including
  engineering, supply chain, operations, quality, legal, and
  commercial teams. You will work with enterprise data, APIs,
  and AI technologies, including large language models (LLMs),
  to create solutions such as document extraction workflows,
  AI assistants, and process automation tools. The ideal
  candidate is adaptable, execution-focused, and comfortable
  working with evolving requirements, imperfect data, and a
  fast-paced environment. This role supports the
  organization's AI strategy by helping deliver scalable
  solutions, validating new capabilities, and driving
  measurable business value through AI.

  General Responsibilities

  - Develop, test, and support models, services, and data
    pipelines.
  - Partner with data science, product, data engineering, and
    platform teams to understand requirements and contribute
    to technical solutions.
  - Assist with model training, evaluation, deployment,
    monitoring, and retraining workflows using established
    tools and processes.
  - Help improve model performance, reliability, latency, and
    cost efficiency by analyzing issues and implementing
    defined enhancements.
  - Create and maintain reusable code, documentation, and basic
    tooling that support team delivery and consistency.
  - Monitor deployed models for performance issues, drift, and
    operational concerns; escalate findings and support
    corrective actions.
  - Communicate progress, risks, and technical considerations
    clearly to team members and stakeholders.
  - Apply established technical standards, best practices, and
    coding guidelines while continuing to build technical
    expertise.
  - Stay current with relevant tools, technologies, and
    practices and apply learnings to assigned work.



  Experience / Qualifications

  - A university degree required (i.e. Bachelors degree) or
    equivalent relevant work experience.
  - Must be a team player able to work in a fast-paced
    environment with demonstrated ability to handle multiple
    competing tasks and demands
  - Strong communication skills; oral, written and presentation
  - Strong organization, planning and time management skills to
    achieve results
  - Strong personal and professional ethical values and
    integrity
  - Holds self-accountable to achieving goals and standards
  - Proficient in Microsoft Office programs (Outlook, Word,
    PowerPoint, and Excel)
  - Strong interpersonal & collaboration skills to work
    effectively with all levels of the organization including
    suppliers and/or external customers

  Additional Responsibilities

  - Build, test, and deploy AI solutions and workflows
  - Develop applications using Python, APIs, and AI/LLM
    technologies
  - Work with structured and unstructured enterprise data
    sources
  - Create user-facing tools, automations, and integrations
  - Support testing, monitoring, and continuous improvement of
    AI solutions
  - Collaborate with business and technical teams to deliver
    impactful solutions
  - Adapt to changing priorities, requirements, and data
    challenges

  Additional Qualifications

  - 3-6 years of experience in software engineering, AI, data
    engineering, or a related field
  - Strong Python programming skills and experience building
    business applications
  - Experience with AI/GenAI solutions and LLM technologies
  - Familiarity with tools such as LangChain, LlamaIndex,
    Semantic Kernel, or OpenAI/Azure OpenAI APIs
  - Experience working with complex or unstructured data
  - Strong problem-solving, communication, and collaboration
    skills

  Nice-to-Have

  - Experience with SQL, data modeling, OCR, or document
    processing solutions
  - Familiarity with Power Platform, Copilot Studio, or similar
    automation tools
  - Exposure to ERP, supply chain, procurement, manufacturing,
    or other enterprise business systems
  - Experience with Azure or other cloud platforms

