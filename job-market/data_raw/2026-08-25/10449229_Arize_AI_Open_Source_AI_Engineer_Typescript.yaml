description: |
  About Arize

  AI is rapidly transforming the world. As generative AI
  reshapes industries, teams need powerful ways to monitor,
  troubleshoot, and optimize their AI systems. That’s where we
  come in. Arize AI is the leading AI & Agent Engineering
  observability and evaluation platform, empowering AI
  engineers to ship high-performing, reliable agents and
  applications. From first prototype to production scale,
  Arize AX unifies build, test, and run in a single
  workspace—so teams can ship faster with confidence.

  We’re a Series C company backed by top-tier investors, with
  over $135M in funding and a rapidly growing customer base of
  150+ leading enterprises and Fortune 500 companies.
  Customers like Booking.com, Uber, Siemens, and PepsiCo
  leverage Arize to deliver AI that works.

  The Opportunity

  AI is rapidly transforming the world. Whether it’s
  developing the next generation of human-level intelligence,
  enhancing voice assistants, or enabling researchers to
  analyze genetic markers at scale, AI is increasingly
  integrated into various aspects of our daily lives.

  Arize AI is the leading AI observability and evaluation
  platform, empowering AI engineers to build and deploy high-
  performing, reliable models. As the AI landscape shifts from
  traditional ML to generative AI and agentic systems, Arize
  ensures teams have the tools to monitor, troubleshoot, and
  improve AI in production.

  We’re looking for an Open Source AI Engineer to join our
  growing OSS team to drive the development of new frameworks,
  metrics, and tooling that help people build, test, and
  improve LLM tasks. You’ll play a lead role in shaping how
  developers measure and understand performance in advanced AI
  systems, all in the open.

  What You’ll Work On

  - Build LLM Observability Frameworks: Design, architect, and
    open-source new libraries, pipelines, and APIs that make
    it simpler to monitor, evaluate, and improve LLM output.
  - Collaborate with the Community: Partner closely with the
    broader AI open source ecosystem, gather feedback, review
    pull requests, and steer the direction of the project to
    address real developer needs.
  - Prototype and Iterate Rapidly: Experiment with state-of-the-
    art LLM techniques, turning research into practical
    developer tooling.
  - Improve Observability and Debugging: Integrate with our
    existing platform to surface deeper insights on LLM
    behavior—help teams quickly diagnose and fix issues such
    as hallucinations or bias.
  - Educate and Evangelize: Write blog posts, white papers,
    tutorials, and documentation to help developers succeed
    with our open source tools and grow the LLM eval
    community.

  What We’re Looking For

  We’re looking for an engineer who’s deeply passionate about
  AI, loves working in the open, and thrives in a fast-paced
  environment where “everyone wears multiple hats”. You likely
  share our core values:

  - Open Source Champion: You believe collaboration and
    community-driven development unlocks the best innovations.
  - Creative Problem Solver: You enjoy tackling ambiguous
    challenges and finding elegant technical solutions.
  - Data & Metrics Driven: You value empirical results, enjoy
    creating or refining evaluation metrics, and iterate based
    on real-world feedback.
  - Technically Curious: You’re always learning—exploring new
    LLM architectures, prompt engineering strategies, or
    emerging library standards.
  - Builder Mindset: You relish the process of taking ideas from
    initial prototypes to production-ready solutions that
    delight users.

  Desired Skills & Experience

  - Hands-on LLM Experience: Familiarity with popular LLM
    frameworks, prompt engineering techniques, and agent
    harnesses.
  - Strong TypeScript Proficiency: You understand TypeScript and
    can write isomorphic code that executes seamlessly across
    clients, servers, and diverse edge runtimes.
  - Open Source Track Record: Contributions to open source
    projects, personal GitHub repos with interesting AI demos,
    or a history of active engagement in developer
    communities.
  - ML Observability & Tools: Familiarity with debugging AI
    applications, exploring embeddings, or building data-heavy
    dashboards is a plus.

  Why Work With Us

  - Shape the Future of AI Evaluation: Be at the forefront of
    designing new ways to measure and improve next-generation
    LLMs.
  - High Impact, Real Ownership: Join a team that values
    autonomy and speed. You’ll drive major initiatives from
    day one and see your work used by developers worldwide.
  - Fully Remote, Flexible Environment: We are a fully remote
    company with offices in the Bay Area and NYC for those who
    prefer in-person collaboration.
  - Cutting-Edge Challenges: Our platform already helps analyze
    millions of AI predictions daily, giving you the chance to
    refine your evaluation tooling on real, large-scale
    production workloads.
  - Work With a Talented, Passionate Team: Collaborate closely
    with top engineers who are dedicated to making AI more
    transparent, reliable, and impactful.

  The estimated annual salary and variable compensation for
  this role is between $185,000 - $200,000, plus a competitive
  equity package. Actual compensation is determined based upon
  a variety of job related factors that may include:
  transferable work experience, skill sets, and
  qualifications. Total compensation also includes a
  comprehensive benefit package, including: medical, dental,
  vision, 401(k) plan, unlimited paid time off, generous
  parental leave plan, and others for mental and wellness
  support.

  While we are a remote-first company, we have opened offices
  in New York City and the San Francisco Bay Area, as an
  option for those in those cities who wish to work in-person.
  For all other employees, there is a WFH monthly stipend to
  pay for co-working spaces.

  More About Arize

  Arize’s mission is to make the world’s AI work—and work for
  people. Our founders came together through a shared
  frustration: while investments in AI are growing rapidly
  across every industry, organizations face a critical
  challenge—understanding whether AI is performing and how to
  improve it at scale.

  Learn more about what we're doing here:

  https://techcrunch.com/2025/02/20/arize-ai-hopes-it-has-
  first-mover-advantage-in-ai-observability/

  https://arize.com/blog/arize-ai-raises-70m-series-c-to-
  build-the-gold-standard-for-ai-evaluation-observability/

  Diversity & Inclusion @ Arize

  Our company's mission is to make AI work and make AI work
  for the people, we hope to make an impact in bias industry-
  wide and that's a big motivator for people who work here. We
  actively hope that individuals contribute to a good culture

  - Regularly have chats with industry experts, researchers, and
    ethicists across the ecosystem to advance the use of
    responsible AI
  - Culturally conscious events such as LGBTQ trivia during
    pride month
  - We have an active Lady Arizers subgroup
