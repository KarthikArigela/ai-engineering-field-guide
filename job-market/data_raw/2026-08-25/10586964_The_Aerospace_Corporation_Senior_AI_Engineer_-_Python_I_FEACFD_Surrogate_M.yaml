  ABOUT HONEYWELL AEROSPACE

  Join a company that's reintroducing itself to the aviation
  community we've helped advance for more than a century. At
  Honeywell Aerospace (NASDAQ: HONA), we're launching as an
  independent, publicly traded aerospace and defense company
  built on a legacy of operational excellence and mission-
  focused execution.

  Our new brand identity pairs that heritage with real
  momentum, as we build technology that helps pilots navigate
  with confidence, aircraft operate more efficiently, and
  operators stay ahead of change. With our systems on board
  90% of the world's aircraft, your work here has reach that's
  rare to find anywhere else.

  Focusing on our customers, investing in innovation, and
  building a culture of accountability and performance is how
  we're shaping what comes next.

  Every horizon. Every mission. Every day.

  ABOUT THE BUSINESS UNIT

  Honeywell Aerospace products and services are found on
  aircraft across commercial aviation, defense and space —
  from engines and cockpit electronics to cabin systems,
  mechanical components and connectivity solutions. Our
  technology helps operators fly more safely, reduce fuel
  consumption, improve on-time performance and deliver a
  better experience for the people on board.

  As aviation continues to evolve, we're also developing
  systems to support autonomous and supersonic platforms,
  bringing the same focus on safety and efficiency to the next
  era of flight. With approximately 36,000 employees worldwide
  and net sales of $17.4B in 2025, Honeywell Aerospace is one
  of the largest dedicated aerospace companies in the world.
  Explore our businesses: https://www.honeywellaerospace.com

  Control Systems develops the thermal and motion control
  systems that help aircraft take off, land safely and protect
  the people on board. With more than 10 million passengers
  per day flying on aircraft equipped with our products and
  more than 75% of commercial flights beginning with our
  engine start systems, Control Systems reaches farther across
  the aviation industry than most people realize.

