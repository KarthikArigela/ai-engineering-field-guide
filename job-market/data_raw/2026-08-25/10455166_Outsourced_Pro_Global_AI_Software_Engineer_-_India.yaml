  About the Role We are seeking an AI Software Engineer who
  combines strong software engineering fundamentals with
  modern artificial intelligence development practices.

  This role is responsible for designing, architecting,
  developing, deploying, and maintaining internal software
  platforms, web applications, and AI-powered products that
  improve business operations and productivity.

  The successful candidate will use AI as a core development
  tool, not simply as an add-on feature. They will leverage
  large language models, AI coding assistants, autonomous
  agents, and modern software frameworks to rapidly design,
  prototype, build, and maintain business applications.

  This role is suited to someone who can independently manage
  the software development lifecycle, make sound technical
  decisions, collaborate with business stakeholders, and turn
  ideas into secure, production-ready applications



  Key Responsibilities

   Software Architecture and Development

  - Design scalable software architecture for internal and
    customer-facing applications.
  - Develop modern web applications using frontend and backend
    technologies.
  - Build secure APIs, services, integrations, and database-
    driven features.
  - Design databases and data models that support reliable,
    scalable applications.
  - Develop reusable software components and internal
    development frameworks.
  - Optimise application performance, scalability, security, and
    maintainability.

  AI-Enabled Development

  - Use AI tools to accelerate software design, development,
    testing, debugging, documentation, and code reviews.
  - Design and build AI-native applications using large language
    models and AI APIs.
  - Develop AI agents and intelligent workflows that automate
    business processes.
  - Build retrieval-augmented generation applications, semantic
    search, and document-processing solutions.
  - Integrate services such as OpenAI, Anthropic, Gemini,
    Autonomous agent (Hermes, OpenClaw), or similar platforms.
  - Evaluate AI outputs for accuracy, relevance, reliability,
    latency, security, and cost.
  - Implement appropriate guardrails, human oversight, privacy
    controls, and evaluation processes.

  Cloud, DevOps and Operations

  - Deploy and operate applications using modern cloud
    platforms.
  - Build and maintain CI/CD pipelines and containerised
    workloads.
  - Monitor application health, logs, performance, usage, and
    cost.
  - Resolve production issues and continuously improve
    reliability.
  - Follow secure software development, data protection, and
    access-control standards.

  Technical Leadership

  - Recommend appropriate technologies, frameworks, and
    architecture for each use case.
  - Define practical coding standards, engineering practices,
    and development workflows.
  - Conduct code reviews and provide technical guidance to other
    developers.
  - Evaluate third-party platforms, AI tools, and emerging
    technologies.
  - Balance speed of delivery with security, quality,
    maintainability, and long-term business value.



  Required Qualifications

  - Bachelor's degree in Computer Science, Software Engineering,
    Information Technology, or equivalent practical
    experience.
  - At least 3 to 5 years of professional software development
    experience.
  - Demonstrated experience designing and building complete web
    applications.
  - Strong knowledge of software architecture, system design,
    and common design patterns.
  - Strong backend development experience and practical frontend
    development capability.
  - Experience building REST APIs, integrations, and database-
    driven systems.
  - Strong understanding of relational databases, source
    control, testing, debugging, and secure development.
  - Ability to communicate technical concepts clearly and work
    directly with business stakeholders.
  - Ability to independently manage priorities, technical
    decisions, and end-to-end delivery.



  Preferred Qualifications

  - Building SaaS products, internal business platforms, or
    workflow automation systems.
  - Developing AI assistants, document-processing systems,
    intelligent search, or automation agents.
  - Rapidly building and validating proof-of-concept and MVP
    solutions.
  - Integrating third-party APIs, CRM platforms, data
    warehouses, and operational systems.
  - Implementing OAuth, JWT, SSO, role-based access control, and
    secure application deployment.
  - A portfolio, GitHub repository, or practical examples of
    software and AI-related projects.



  What Success Looks Like

  - Delivers secure, reliable, and production-ready applications
    within agreed timelines.
  - Owns software and AI development from discovery and
    architecture through deployment and maintenance.
  - Uses AI effectively to increase development speed without
    compromising code quality or security.
  - Builds scalable solutions that reduce manual work and
    provide measurable business value.
  - Makes clear, practical technical decisions and communicates
    them effectively to stakeholders.
  - Produces clean, maintainable, tested, and well-documented
    code.
  - Continuously evaluates emerging technologies and adopts them
    where they provide genuine value.

  This role is ideal for someone who loves structure, thrives
  on execution, and enjoys keeping teams accountable.

  Technical Requirements:

  - Windows 11 operating system or MacOS 13+
  - 256GB Storage space - minimum
  - 8-16GB RAM - minimum
  - Dual Core CPU - minimum
  - Camera: HD Webcam (720p)
  - Headset: Noise canceling (preferably)
  - Internet Speed: 50 Mbps - minimum

