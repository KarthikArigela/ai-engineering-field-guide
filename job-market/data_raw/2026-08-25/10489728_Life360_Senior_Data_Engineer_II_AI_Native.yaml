description: |
  About Life360

  Life360’s mission is to keep people close to the ones they
  love. Our category-leading mobile app, Tile tracking
  devices, and Pet GPS tracker empower members to protect the
  people, pets, and things they care about most with a range
  of services, including location sharing, safe driver
  reports, and crash detection with emergency dispatch.
  Life360 serves approximately 102.4 million monthly active
  users (MAU), as of June 30, 2026, across more than 180
  countries.

  Life360 delivers peace of mind and enhances everyday family
  life with seamless coordination for all the moments that
  matter, big and small. By continuing to innovate and deliver
  for our customers, we have become a household name and the
  must-have mobile-based membership for families (and those
  friends who are basically family).

  Life360 has more than 500 (and growing!) remote-first
  employees. For more information, please visit life360.com.

  Life360 is a Remote First company, which means a remote work
  environment will be the primary experience for all
  employees. All positions, unless otherwise specified, can be
  performed remotely (within the US and Canada) regardless of
  any specified location above.

  We are AI Native

  We are building an AI native company where AI is an integral
  part of how we build and operate. AI tool usage during
  interviews varies by role. You may be asked to demonstrate
  proficiency with AI tools, discuss how you leverage AI, or
  complete interview exercises without AI assistance. Your
  Recruiter will provide clear guidance as you move through
  the interview process.

  Undisclosed use of AI not previously discussed with or
  approved by your Recruiter may impact your candidacy.

  About the Team

  The Data & Analytics team is building Life360's next-
  generation data platform — powering real-time decision-
  making, experimentation, ML, and large-scale analytics. We
  operate at significant scale and complexity in a high-
  ambiguity environment, and we expect engineers to own
  problems, drive clarity, and raise the bar across the org.

  We're looking for a high-intensity engineer who wants to
  envision, design, and build high-impact data products with
  cutting-edge tools — all while keeping our members ahead of
  the metrics. You'll become the go-to person for data
  products across the business, joining a collaborative team
  that communicates openly, celebrates wins together, and is
  committed to helping everyone do their best work.

  About the Job

  At Life360, we collect a lot of data: tens of billions of
  unique location points, tens of billions of user actions,
  billions of miles driven every single month, and so much
  more. As a Senior Data Engineer II, you will enhance and
  maintain our data processing and storage pipelines for a
  robust and secure data lakehouse. We're looking for a strong
  engineering background — and just as important, a genuine
  desire to take ownership and make our data systems world
  class. The US-based salary range for this position is
  $148,000 to $216,500. We take into consideration an
  individual's background and experience in determining final
  salary - therefore, base pay offered may vary considerably
  depending on geographic location, job-related knowledge,
  skills, and experience. The compensation package includes a
  wide range of medical, dental, vision, financial, and other
  benefits, as well as equity.

  What You’ll Do

  Primary responsibilities include, but are not limited to:

  - Design, build, and maintain scalable, distributed data
    pipelines and systems — from ingestion through ELT to
    storage — supporting streaming and batch processing for
    real-time analytics, ML, and experimentation.
  - Automate, test, and harden data workflows to ensure
    reliability at scale.
  - Architect logical and physical data models that meet
    evolving business needs.
  - Build and maintain features for ML models.
  - Collaborate with product, analytics, and data science teams
    to turn data into value.

  What We’re Looking For

  - 5+ years of experience working with high volume data
    infrastructure.
  - Deep expertise with a modern cloud data warehouse or
    lakehouse platform (Databricks preferred; Snowflake,
    BigQuery, or similar also considered) on a major cloud
    provider (AWS, GCP, or Azure).
  - Proficient in Python and SQL, with the ability to write and
    optimize complex queries.
  - Hands-on experience with dbt.
  - Experience with large-scale data processing using Spark
    and/or Presto/Trino.
  - Strong grasp of data modeling, partitioning strategies,
    storage formats, and analytical workload optimization.
  - Hands-on experience leveraging LLMs for code generation,
    analysis, and related work — including reviewing AI-
    generated output with a close eye on quality, standards,
    and testing, and owning it as your own.
  - Experience with modern data engineering tooling —
    orchestration (Airflow, Databricks Workflows), CI/CD
    (GitHub Actions), and infrastructure-as-code (Terraform,
    DABs).
  - BS in Computer Science, Information Systems, Management
    Information Systems, Statistics, Mathematics, Data
    Science, Engineering (Computer, Electrical, or Software),
    or a related quantitative field.

  AI-Native Expectations

  - The team leverages LLMs to support code generation,
    analysis, and other use cases. Your experience with AI /
    LLM usage should include managing code generation with a
    close eye on quality, standards, and testing — owning the
    outputs as your own. Your work with and ability to
    leverage these tools will drive your velocity and ability
    to effectively work within our environment.

  Nice to Have

  - Experience working with an experimentation framework.
  - Experience designing and maintaining real-time streaming
    architectures.

  Our Benefits

  - Medical, dental, vision, life and disability insurance plans
    (100% paid for employees)
  - Paid parental leave
  - 401(k) plan with company matching program
  - Mental Wellness Program & Employee Assistance Program (EAP)
    for mental well-being
  - Generous time off: flexible PTO, companywide holidays
    throughout the year plus summer and winter shutdowns
  - Learning & Development programs
  - Equipment, tools, and reimbursement support for a productive
    remote environment
  - Free Life360 Platinum Membership Tile trackers

  Life360 Values

  Our company’s mission driven culture is guided by our shared
  values to create a trusted work environment where you can
  bring your authentic self to work and make a positive
  difference

  - Be a Good Person - We have a team of high integrity people
    you can trust.
  - Be Direct With Respect - We communicate directly, even when
    it’s hard.
  - Members Before Metrics - We focus on building an exceptional
    experience for families.
  - High Intensity, High Impact - We do whatever it takes to get
    the job done.

  Our Commitment to Diversity

  We believe that different ideas, perspectives and
  backgrounds create a stronger and more creative work
  environment that delivers better results. Together, we
  continue to build an inclusive culture that encourages,
  supports, and celebrates the diverse voices of our
  employees. It fuels our innovation and connects us closer to
  our customers and the communities we serve. We strive to
  create a workplace that reflects the communities we serve
  and where everyone feels empowered to bring their authentic
  best selves to work.

  We are an equal opportunity employer and value diversity at
  Life360. We do not discriminate on the basis of race,
  religion, color, national origin, gender, sexual
  orientation, age, marital status, veteran status, disability
  status or any legally protected status.

  We encourage people of all backgrounds to apply. We believe
  that a diversity of perspectives and experiences create a
  foundation for the best ideas. Come join us in building
  something meaningful. Even if you don’t meet 100% of the
  below qualifications, you should still seriously consider
  applying!

