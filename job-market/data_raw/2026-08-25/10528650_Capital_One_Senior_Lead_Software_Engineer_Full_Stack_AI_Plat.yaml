description: |
  Senior Lead Software Engineer, Full Stack (AI Platform &
  Knowledge Library) (Enterprise Platforms Technology) Do you
  love building AI-powered platforms that operate at
  enterprise scale? Do you thrive at the intersection of
  applied machine learning, knowledge engineering, and
  production software systems? At Capital One, you'll be part
  of a team of makers, breakers, doers and disruptors who
  solve real problems and meet real customer needs. We are
  seeking a Senior Lead Software Engineer to own the AI
  platform and knowledge infrastructure at the heart of our
  next-generation marketing content generation capabilities.
  As a Capital One Senior Lead Software Engineer, you'll have
  the opportunity to drive a major transformation in how we
  create, validate, and deliver marketing content across all
  channels - building the shared knowledge platform that
  enables AI systems to generate compliant, on-brand content
  at scale across the entire organization. Enterprise
  Platforms Technology (EPTech) comprises many of Capital
  One's most important enterprise platforms. We play an
  essential role in establishing practices for building
  technology solutions across the company, while also
  delivering capabilities that exemplify those practices. What
  You'll Do

  - Design and build the Content Moderation Knowledge Library -
    a business-unit-scoped, RAG-backed corpus covering
    regulatory requirements, brand rules, claims and
    disclosures, and marketing context, reusable across
    channels and product lines
  - Own the embedding search pipeline - implement and tune
    retrieval pipelines for grounded AI generation, including
    chunking strategy, embedding model selection, index
    refresh, and hybrid search
  - Lead Prompt MLOps - treat prompts as compiled, versioned
    artifacts; own the evaluation loop that continuously
    improves generation quality against labeled production
    data
  - Own the AI content compliance and generation platform APIs
    as shared capabilities across multiple engineering teams -
    define contracts, manage versioning, and coordinate cross-
    team integrations
  - Design the agentic critic validation stream - deterministic
    parallel validators (sensitive data detection, compliance
    rules, claims mapping) combined with LLM-as-judge semantic
    validators (brand voice, coherence, substantiation)
  - Lead technical design, produce architecture documents,
    conduct design reviews, and mentor engineers on RAG system
    design, eval methodology, and production AI operations

  Basic Qualifications:

  - Bachelor's Degree
  - At least 6 years of experience in software engineering
    (Internship experience does not apply)
  - At least 1 year experience with cloud computing (AWS,
    Microsoft Azure, Google Cloud)

  Preferred Qualifications:

  - Master's Degree
  - 4+ years of experience in Python
  - 4+ years of experience building and operating retrieval-
    augmented generation (RAG) systems
  - 3 + years of experience in applied AI/ML or LLM-based
    systems in production.
  - 3+ years of experience with vector search infrastructure
    (OpenSearch, Pinecone, PGvector, Weaviate, or equivalent)
  - 3+ years of experience designing and owning shared platform
    APIs
  - 2+ years of experience with AWS services (OpenSearch
    Service, S3, Lambda, SQS, or equivalent)
  - Experience leveraging interactive AI tooling to accelerate
    productivity, utilizing capabilities beyond basic code
    completion

   Capital One will consider sponsoring a new qualified
  applicant for employment authorization for this position.
