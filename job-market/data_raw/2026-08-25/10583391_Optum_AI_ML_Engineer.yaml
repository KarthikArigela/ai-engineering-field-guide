description: |
  Requisition Number: 2367015 Optum is a global organization
  that delivers care, aided by technology to help millions of
  people live healthier lives. The work you do with our team
  will directly improve health outcomes by connecting people
  with the care, pharmacy benefits, data and resources they
  need to feel their best. Here, you will find a culture
  guided by inclusion, talented peers, comprehensive benefits
  and career development opportunities. Come make an impact on
  the communities we serve as you help us advance health
  optimization on a global scale. Join us to start Caring.
  Connecting. Growing together. The AIML Engineer is
  responsible for designing and implementing an AI focused
  architecture involving different data sources (pdfs, excels,
  macros, APIs, etc) prepared for different models (ML,GenAI
  and LLMs) that work in a cohesive way for various use cases
  for the consumers. Engineer will also be responsible for
  finding AIML opportunities and implementing AI/ML solutions
  within Sales and Digital space to improve/enhance user
  experience, automate manual process and make predictive
  analysis in consumer journey and support with competitive
  analysis and study. The candidate should be proficient in
  Python and have a solid understanding of AI/ML concepts and
  techniques. AI/ML Engineers code and develop software that
  deploys ML models and algorithms in production. Communicate
  and present complex analytics results and concepts to
  leadership and internal stakeholders. Employee AI and/or ML
  that may include natural language processing (NLP), natural
  language understanding (NLU), semantic understanding, intent
  classification, computer vision, deep learning, and
  automatic speech recognition (ASR). Applies deep learning
  technologies to give computers that capability to visualize,
  learn and respond to complex situations. May adapt machine
  learning to areas such as artificial intelligence, robotics
  and other products that allow users to have an interactive
  experience. Work with large scale computing frameworks, data
  analysis systems. Employees in this role are expected to
  apply knowledge of experimental methodologies, statistics,
  optimization, probability theory and machine learning using
  code for tool building, statistical analysis, using both
  general purpose software and statistical languages. AI/ML
  Applied Scientists specialize in advancing and applying
  artificial intelligence through research-driven,
  experimental research, and translate research findings into
  practical AI solutions for the organization. Primary
  Responsibilities:

  - Design, develop, and implement AI/ML models to solve complex
    business problems
  - Collaborate with cross-functional teams to identify
    opportunities for AI/ML integration
  - Conduct data analysis and interpret results to drive
    decision-making
  - Stay current with the latest trends and advancements in the
    field of AI/ML
  - Analyzes and investigates
  - Provides explanations and interpretations within area of
    expertise
  - Comply with the terms and conditions of the employment
    contract, company policies and procedures, and any and all
    directives (such as, but not limited to, transfer and/or
    re-assignment to different work locations, change in teams
    and/or work shifts, policies in regards to flexibility of
    work benefits and/or work environment, alternative work
    arrangements, and other decisions that may arise due to
    the changing business environment). The Company may adopt,
    vary or rescind these policies and directives in its
    absolute discretion and without any limitation (implied or
    otherwise) on its ability to do so Ai Scientist
    Responsibilities: (manager discretion if AI
    responsibilities are already present in JD): Collaborate
    with research, engineering, and product teams to translate
    cutting-edge AI advancements into production-ready
    capabilities. Uphold ethical AI principles by embedding
    fairness, transparency, and accountability throughout the
    model development lifecycle.

  Required Qualifications:

  - Undergraduate degree or equivalent experience
  - 5+ years of experience in Python using common data science
    libraries such as scikit-learn and Databricks
  - 3+ years of experience applying NLP (transformers, gpt,etc)
    in a production setting using large amounts of data
  - 2+ years of experience applying LLMs (RAG, vector db,
    embeddings) to solve real world problems
  - Experience applying data science techniques in a commercial
    enterprise, including supervised, unsupervised learning,
    NLP, time-series forecasting and other statistical
    analyses
  - Experience building APIs for the models
  - Good experience with one of the cloud platforms (Azure, AWS
    or GCP). Having Azure cloud experience is more preferred.
  - Proven solid written & verbal communication skills;
    including the ability to present detailed analyses to a
    broad audience
  - Proven organized self-starter, with drive and commitment;
    able to work with little supervision
  - Proven solid analytical, quantitative, problem-solving, and
    critical thinking skills

  Preferred Qualification:

  - Experience using vision and speech models in GenAI

  At UnitedHealth Group, our mission is to help people live
  healthier lives and make the health system work better for
  everyone. We believe everyone-of every race, gender,
  sexuality, age, location and income-deserves the opportunity
  to live their healthiest life. Today, however, there are
  still far too many barriers to good health which are
  disproportionately experienced by people of color,
  historically marginalized groups and those with lower
  incomes. We are committed to mitigating our impact on the
  environment and enabling and delivering equitable care that
  addresses health disparities and improves health outcomes -
  an enterprise priority reflected in our mission.
