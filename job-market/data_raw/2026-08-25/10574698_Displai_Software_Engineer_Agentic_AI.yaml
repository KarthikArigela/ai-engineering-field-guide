description: |
  About Displai

  We support businesses and organizations with seamless
  digital experiences that create connection in the public
  square.

  Using a first-of-its-kind technology, Displai reimagines and
  transforms customer experiences through dynamic and
  interactive digital signage. Built with both people and
  businesses in mind, Displai focuses on the experience,
  allowing companies to concentrate on their products.
  Franchise managers, IT executives, marketing executives, and
  communications executives can effectively scale their brick-
  and-mortar operations while eliminating outdated technology.
  Our superior product, service, and integrations seamlessly
  create more engaging and personalized in-store experiences
  that keep customers coming back and buying more.

  Displai is headquartered in the San Francisco Bay Area,
  California, and currently works with 2,500+ brands. To learn
  more, visit www.displai.ai

  About the Role

  We're hiring a Software Engineer to build agentic AI
  features into the Displai CMS. You'll ship LLM-powered
  workflows end to end across our TypeScript/Node backend and
  React frontend, working alongside senior engineers and the
  VP of Engineering. This is a build role for someone already
  fluent with agentic coding tools (Claude Code, Cursor, MCP)
  who wants to apply that fluency to a production product
  running at scale. AI is collapsing the distance between
  engineering and product, and we're looking for someone who
  can think like a product builder, drive projects
  independently, and ship at the pace these tools now make
  possible.

  What You Will Be Doing

  - Build agentic features into the Displai CMS, from prototype
    through production rollout
  - Design and implement LLM-driven workflows: tool use,
    structured outputs, evaluations, prompt iteration
  - Contribute to our MCP server work and help expose more of
    our platform to AI agents
  - Own features end to end: scoping, backend APIs, frontend UI,
    monitoring, and iteration based on customer use
  - Drive projects independently. Make product calls in flight,
    prototype to validate ideas, and bring partners in when it
    matters rather than waiting for specs
  - Collaborate with product, design, and senior engineers on
    scoping and trade-offs
  - Use AI coding tools as a force multiplier and help raise the
    bar for how the team uses them



  What We are Looking For

  - 1 to 4 years of professional software engineering experience
  - Strong fundamentals in TypeScript/Node and React, including
    modern React patterns (hooks, state management, component
    composition)
  - Solid backend skills: designing and building REST APIs,
    writing performant SQL against relational databases
    (PostgreSQL, MySQL, or similar), and reasoning about
    schema design and migrations
  - Comfortable with HTML/CSS, responsive UI work, and
    component-driven frontend development
  - Working knowledge of Git, code review practices, testing
    (unit and integration), and CI/CD workflows
  - Heavy day-to-day user of agentic coding tools (Claude Code,
    Cursor, or equivalent). You can talk specifically about
    what you've built with them and where they fall short
  - Product sense and ownership. Agentic AI compresses build
    cycles, which means engineers need to make more product
    calls in flight: scoping trade-offs, judging when
    something is good enough, and driving projects to outcomes
    without waiting for spec hand-offs. We're looking for
    engineers who think like product builders, not just
    implementers
  - Comfort working across the stack: backend services,
    frontend, and the glue between them
  - Bias toward shipping. You'd rather have a rough version in
    production than a perfect one in a branch
  - Clear written communication and a low-ego collaboration
    style

  Preferred qualifications

  - Shipped agentic or LLM-powered features in a production
    product
  - Built or contributed to MCP servers
  - Experience with evals, prompt engineering at scale, or agent
    orchestration frameworks
  - Background in B2B SaaS, multi-tenant systems, or content
    management platforms
  - Experience with NoSQL or caching layers (Redis, DynamoDB,
    etc.)
  - Familiarity with message queues, background jobs, or event-
    driven architectures
  - Exposure to AWS, Docker, and modern observability stacks
    (logs, metrics, traces)
  - Experience with TypeScript on the backend (NestJS, Express,
    or similar) and ORMs (Prisma, TypeORM, etc.)
  - Experience with Go, particularly for performance-sensitive
    services or backend tooling

  Perks/Benefits at Displai

  - Full medical and dental plans
  - 401(k) plan
  - Flexible PTO and paid holidays
  - Be a part of a high-performance team
  - One of the first 50 people in a SaaS Start-up

  Displai is proud to be an equal employment opportunity
  employer that values diversity in hiring and gives
  consideration to all candidates regardless of their race,
  age, creed, color, religion or religious belief, national
  origin or ancestry, disability, military or veteran status,
  genetic information, sex, gender, sexual orientation, gender
  identity or expression, pregnancy, or any other
  characteristic protected by local, state, or federal law.
