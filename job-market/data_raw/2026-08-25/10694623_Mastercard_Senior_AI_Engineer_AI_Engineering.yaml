  Our Purpose  Mastercard powers economies and empowers people
  in 200+ countries and territories worldwide. Together with
  our customers, we're helping build a sustainable economy
  where everyone can prosper. We support a wide range of
  digital payments choices, making transactions secure,
  simple, smart and accessible. Our technology and innovation,
  partnerships and networks combine to deliver a unique set of
  products and services that help people, businesses and
  governments realize their greatest potential. Title and
  Summary Senior AI Engineer, AI Engineering Mastercard's
  Business & Market Insights (B&MI) group empowers
  organizations to achieve growth & innovation goals by
  providing unparalleled data-driven insights and advanced
  analytics. By leveraging proprietary data and global
  expertise, B&MI helps businesses make smarter, more informed
  decisions that drive profitability and success. We turn
  complex data into actionable strategies that lead to better
  outcomes and sustained competitive advantage. We are
  currently looking for a 'Lead Engineer, Machine Learning
  Engineering' for Operational Intelligence Program, within
  B&MI group. This role will lead ML engineering team to
  execute on AI/ML strategy for the program that enables
  business growth, enhances customer experience, and ensures
  delivery of secure, scalable, and high-performing software
  solutions. As a technology leader, this role will also focus
  on engineering best practices, next gen innovation and
  stakeholder management, while fostering a culture of
  continuous learning and technical excellence within the
  team. Roles and Responsibilities:• Implement multi-agent
  intelligence frameworks (LangGraph, CrewAI, AutoGen) to
  enable reasoning, coordination, and adaptive decision-making
  across specialized AI agents.• Design and operationalize
  multi-modal AI pipelines combining text, image, tabular, and
  graph data using transformer-based architectures (BERT,
  CLIP, LLaVA, T5, Whisper, etc.) for unified intelligence.•
  Build scalable RAG and Graph-RAG systems integrating vector
  stores and knowledge graphs (Neo4j, AWS Neptune) to enable
  contextual retrieval, semantic linking, and entity-aware
  reasoning.• Develop and productionize transformer-based
  models for NLP, vision-language understanding, and
  sequential prediction tasks leveraging Hugging Face,
  PyTorch, and TensorFlow ecosystems.• Implement advanced
  Python-based backend services for inference orchestration,
  async job handling, and distributed data workflows
  supporting high-throughput AI operations.• Establish end-to-
  end LLMOps and MLOps pipelines on Databricks (AWS)
  integrating MLflow, feature stores, model lineage, prompt
  evaluation, and continuous retraining frameworks.• Apply
  traditional AI/ML and statistical modeling techniques
  (regression, clustering, forecasting, ensemble methods)
  alongside deep learning models for hybrid interpretability
  and explainability.• Engineer state and memory management
  subsystems that preserve context, track embeddings, and
  enable agents to reason temporally across multiple
  modalities and interactions.• Implement Responsible AI
  practices-bias detection, explainability dashboards, data
  ethics checks, and performance governance ensuring fairness
  and transparency of deployed models.• Continuously research,
  benchmark, and productionize innovations in multimodal
  transformers, generative modeling, and agentic orchestration
  to drive enterprise-scale intelligence and automation. All
  About You: • Master's/bachelor's degree in computer science
