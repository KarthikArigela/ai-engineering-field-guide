description: |
  Overview

  Are you passionate about application development and excited
  by the opportunity to shape the future of software
  engineering with AI? Join Microsoft as a Solution Engineer –
  Cloud & AI Software, Dev Tools, and AI where you’ll help
  enterprise developers solve complex challenges and build the
  next generation of intelligent applications.

  Microsoft is transforming the developer experience by
  embedding AI across the software development lifecycle. With
  GitHub and Visual Studio—trusted by over 100 million
  developers globally—at the core along with seamless
  integration of Azure AI, we’re leading the way in “Agentic
  DevOps,” where AI agents streamline development and
  operations. You will help customers adopt these innovations
  to boost productivity, drive innovation, and become AI-
  native. As a trusted technical advisor, you’ll guide
  customers through secure, scalable solution design,
  influence technical decisions, and accelerate AI integration
  into their development workflows. Whether enabling DevSecOps
  at a global bank or scaling GitHub Copilot across thousands
  of engineers, you’ll help customers modernize their SDLC and
  realize the full value of Microsoft’s developer platform.

  The Solution Engineer – Cloud & AI Software, Dev Tools, and
  AI role is focused on helping enterprise developers
  understand the value of Microsoft’s AI-powered developer
  stack across every stage of the software development
  lifecycle. You’ll work directly with engineering leaders and
  platform teams to accelerate GitHub, Visual Studio, and
  Azure AI Foundry through hands-on engagements like Proof of
  Concepts, hackathons, code-with sessions and architecture
  workshops.

  Microsoft’s mission is to empower every person and every
  organization on the planet to achieve more. As employees we
  come together with a growth mindset, innovate to empower
  others, and collaborate to realize our shared goals. Each
  day we build on our values of respect, integrity, and
  accountability to create a culture of inclusion where
  everyone can thrive at work and beyond.

  By applying to this role, you will be considered for
  multiple opportunities within Microsoft across the United
  States including locations beyond where the role is posted.
  This role is flexible in that you can work up to 50% from
  home. Travel percentages will vary according to role.

  Responsibilities

  - Drive technical sales with decision makers using demos and
    PoCs to influence solution design and enable production
    deployments.

  - Lead hands-on engagements—hackathons, code-with sessions,
    and architecture workshops—to accelerate adoption of
    Microsoft’s developer tools and cloud platforms.

  - Build trusted relationships with developers and platform
    leads as well as AI decision makers to co-designing
    secure, scalable architectures and solutions

  - Resolve technical blockers and objections, collaborating
    with engineering to share insights and improve products.

  - Maintain deep expertise in GitHub, Visual Studio, AI-
    assisted dev tools, Foundry SDK, CI/CD, DevOps, and cloud-
    native development (APIs, containers, microservices).
  - Represent Microsoft through thought leadership in developer
    communities and customer forums

  Other:

  - Embody our culture and values

  Qualifications

  Required/minimum qualifications

  - Bachelor's Degree in Computer Science, Information
    Technology, or related field AND 2+ years technical pre-
    sales or technical consulting experience
    - OR Master's Degree in Computer Science, Information
      Technology, or related field AND 1+ year(s) technical
      pre-sales or technical consulting experience
    - OR 3+ years technical pre-sales or technical consulting
      experience
    - OR equivalent experience.

  Other Requirements:

  - This position is not eligible for visa sponsorship.
    Candidates must have authorization to work in the United
    States that does not now or in the future require employer
    sponsorship.



  Additional or preferred qualifications

  - 6+ years technical pre-sales, technical consulting, or
    technology delivery, or related experience OR equivalent
    experience.
  - 4+ years experience with cloud and hybrid, or on premises
    infrastructures, architecture designs, migrations,
    industry standards, and/or technology management.
  - Experience with cloud-native development: APIs, containers,
    microservices, event-driven design.
  - Experience engaging enterprise development teams, including
    developers, architects, and technical decision makers.
  - Proficiency in modern languages like JavaScript/TypeScript,
    Python, C#, or Java, and frameworks such as .NET, Node.js,
    or React.
  - Hands-on expertise with GitHub, Visual Studio Code, CI/CD,
    DevOps, and platform engineering (e.g., observability,
    security, performance).
  - Proven ability to lead technical engagements (e.g.,
    hackathons, PoCs, MVPs) that drive production-scale
    outcomes.



