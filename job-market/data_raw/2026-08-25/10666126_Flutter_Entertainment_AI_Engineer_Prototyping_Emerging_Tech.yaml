  AI Engineer — Prototyping & Emerging Tech

  The Frontier R&D team sits within Flutter UKI's Disruptive
  R&D function, dedicated to exploring emerging technologies
  over a 12-36 month horizon. We prototype rapidly with
  cutting-edge tools, build relationships with technology
  providers, and create demonstrations that inform strategic
  decisions across the business. Our work transforms ambitious
  concepts into tangible outputs that can be developed into
  full-scale projects. As Prototyping Engineer, you will be
  the technical engine of the team, turning ideas into working
  software at pace.

  What you’ll do

  - Rapidly building functional prototypes across a wide range
    of technology domains, from machine learning systems to
    API integrations
  - Leveraging generative AI coding assistants and productivity
    tools to maximise development velocity
  - Developing proof-of-concept applications that demonstrate
    the potential of emerging technologies for betting and
    gaming
  - Building automated pipelines and workflows for content
    generation, data processing, and system integration
  - Integrating with third-party APIs and services to create
    novel product experiences
  - Implementing machine learning models and neural network
    architectures for experimental applications
  - Deploying prototypes to internal demonstration environments
    and hubs for stakeholder evaluation
  - Collaborating with the Research Graduate on technical
    feasibility assessments
  - Contributing to technical presentations and documentation of
    prototype capabilities

  What you’ll need:

  - Strong software development skills with proficiency in
    multiple programming languages (Python,
    JavaScript/TypeScript, etc.)
  - Hands-on experience with machine learning frameworks
    (PyTorch, TensorFlow, or similar)
  - Extensive daily use of generative AI tools for coding
    (Claude, Cursor, GitHub Copilot, or equivalent)
  - Proven ability to deliver working prototypes quickly with
    minimal specification
  - Experience with API development and integration, including
    RESTful services and webhooks
  - Familiarity with cloud platforms and deployment pipelines
    (AWS, GCP, Azure, or similar)
  - Comfort working with ambiguity and rapidly evolving
    requirements
  - Genuine enthusiasm for learning new technologies and
    experimenting with emerging tools

  Desirable:

  - Experience building mobile applications or progressive web
    apps
  - Knowledge of betting or gaming industry systems and APIs
  - Experience with neural network architectures for generative
    or predictive applications
  - Familiarity with game development engines or creative
    automation tools
  - Background in mathematics, statistics, or computational
    science

  What’s on offer

  - £/€1,000 learning fund
  - Twice-yearly bonus (with part of it guaranteed!)
  - Unlimited Holiday
  - Pension contribution scheme
  - Private healthcare
  - Hybrid Working
  - Access to thousands of Udemy courses
  - Invest via the Company Sharesave Scheme

  About Flutter

  Flutter is the world’s leading online sports betting and
  iGaming operator, with a market leading position in the US
  and across the world. Our ambition is to change our industry
  for the better, making use of our significant scale and
  challenger mentality.

  By Changing the Game, we believe we can deliver long-term
  growth while promoting a positive, sustainable future for
  the industry. We are well-placed to do so through the
  distinctive, global advantages of the Flutter Edge, which
  gives our brands access to group-wide benefits to stay ahead
  of the competition, as well as our clear vision for
  sustainability through our Positive Impact Plan.

  Flutter operates a diverse portfolio of leading online
  sports betting and iGaming brands including FanDuel, Sky
  Betting & Gaming, Sportsbet, PokerStars, Paddy Power, Sisal,
  tombola, Betfair, MaxBet, Junglee Games and Adjarabet.

  About Flutter UK & Ireland

  The UK & Ireland region of Flutter unites some of the
  biggest brands in the betting and gaming industry; Betfair,
  Paddy Power, PokerStars, Sky Betting & Gaming and tombola.

  At Flutter UK & Ireland, we strive for the next level and
  drive innovation to set the pace as leaders, putting our
  customers first, always. We win together through team spirit
  and unparalleled dedication. When we’re free to be
  ourselves, we thrive and unleash our unique talents
  —creating a culture that empowers our people to change the
  game. We see opportunity everywhere and there is always more
  to discover...

  We’re working to be an inclusive employer. We encourage
  people from all backgrounds, ways of thinking and working to
  apply. Everyone brings different perspectives and
  experiences; you don't have to meet all the requirements
  listed to apply for this role.

  If you need any adjustments to make this role work for you
  let us know, and we’ll see how we can accommodate them.
