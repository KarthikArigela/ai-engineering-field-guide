  Department OverviewNoggin, a Motorola Solutions company, is
  a leader in integrated resilience management technology,
  offering a next-generation, cloud-based platform that
  combines 10 essential solutions into one unified system. Our
  award-winning platform seamlessly integrates operational and
  third-party risk management, operational resilience,
  business continuity, incident and crisis management,
  emergency management, and security and safety operations.
  The Product Engineering area is responsible for designing,
  writing, testing and deploying the code for our software
  products at Noggin. Job Description

  Join Motorola Solutions as a Senior AI Engineer and help
  shape the future of AI-powered products and services. Based
  in Sydney with hybrid flexibility, you'll work at the
  forefront of generative AI, building production-scale
  solutions using AWS Bedrock and cutting-edge AI
  technologies.

  As a senior member of our AI engineering team, you'll
  provide technical leadership, mentor engineers, and drive
  best practices in GenAI implementation. You'll work directly
  with Product Management and Software Engineering teams to
  transform AI use cases from concept to production, ensuring
  quality, safety, and scalability at every step.

  Tech Stack

  Core AI Technologies:

  - AWS Bedrock (Models, Agents, Knowledge Bases, Guardrails)
  - OpenSearch & Vector Databases
  - RAG (Retrieval-Augmented Generation) architectures
  - Agentic frameworks (LangChain, LlamaIndex, or AWS Bedrock
    Agents)

  Development Stack:

  - Python (AI/ML development & data processing)
  - NodeJS with TypeScript (backend services)
  - AWS ecosystem (S3, IAM, CloudWatch, etc.)

  AI Engineering Practices:

  - Prompt engineering & optimization
  - Model evaluation & testing frameworks
  - AI observability & monitoring
  - Responsible AI & safety practices

  Skills & Experience

  Required:

  - Bachelor's degree in Computer Science, Software Engineering,
    or related field
  - 5+ years in software development with 2+ years focused on
    production AI/GenAI systems
  - Deep, hands-on experience with AWS Bedrock, Knowledge Bases,
    and OpenSearch
  - Proven track record designing and implementing RAG
    architectures at scale
  - Proficiency in Python for AI/ML work and NodeJS/TypeScript
    for backend development
  - Experience with agentic frameworks and AWS Bedrock
    Guardrails
  - Strong understanding of AI/ML concepts: models, agents,
    embeddings, vector databases
  - Hands-on experience with prompt engineering and model
    evaluation methodologies
  - Knowledge of AI observability, monitoring, and responsible
    AI practices

  Valued:

  - Experience with multi-modal AI capabilities
  - Familiarity with model distillation and cost optimization
    techniques
  - Background in AI safety, bias detection, or model
    explainability
  - Contributions to open-source AI projects or research
    publications

  Key Responsibilities

  - Technical Leadership: Apply your expertise in GenAI, AWS
    Bedrock, and related technologies to drive architectural
    decisions and coach team members
  - End-to-End AI Development: Design, build, and refine AI use
    cases including guardrails, evaluation frameworks, and
    quality assurance
  - Collaboration: Partner with Product Management and Software
    Engineering teams to realize AI features from concept to
    production
  - Advisory Role: Provide technical guidance to management,
    team leads, and customers on AI implementation strategies
  - Community Engagement: Actively contribute to technology
    chapter meetings and knowledge sharing

  What You'll Work On

  - Building production-scale GenAI applications using AWS
    Bedrock and foundation models
  - Implementing RAG systems with Knowledge Bases and vector
    search
  - Designing AI agents that can reason, plan, and execute
    complex workflows
  - Establishing prompt engineering best practices and
    evaluation pipelines
  - Ensuring AI safety through guardrails and responsible AI
    practices
  - Optimizing AI system performance, cost, and observability

  Target Base Salary Range: $180,000 USD - $210,000 USD

