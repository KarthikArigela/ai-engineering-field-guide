description: |
  The Opportunity As an Acceleration Center- Agentic AI and
  Machine Learning Developer- Experienced Associate, you will
  be at the forefront of transforming raw data into actionable
  insights, enabling informed decision-making and driving
  business growth. Within our Risk & Regulatory practice, you
  will leverage advanced technologies and techniques to design
  and develop robust data solutions for clients, applying
  data, algorithms, and software engineering to build and
  deploy AI and Machine Learning solutions at scale. As an
  Associate, you will focus on learning and contributing to
  client engagements and projects, developing your skills and
  knowledge to deliver quality work. You will be exposed to
  clients to learn how to build meaningful connections, manage
  and inspire others, and grow your personal brand by
  deepening your technical knowledge of firm services and
  technology resources. In this role at PwC, you will design
  AI systems, engage in data wrangling, and implement software
  to enable scalable AI models, all while adapting to a fast-
  paced environment and diverse client needs. Embrace the
  opportunity to learn and grow, taking ownership of your
  development and consistently delivering work that drives
  value for our clients and success as a team.
  Responsibilities
  - Designing and implementing AI and machine learning solutions
    to transform raw data into actionable insights
  - Developing scalable data models and pipelines to support AI
    systems and enhance data integration
  - Utilizing programming languages such as Python and machine
    learning libraries like TensorFlow and Scikit-Learn to
    build and deploy AI models
  - Engaging in complex data analysis to identify patterns and
    inform decision-making processes
  - Collaborating with team members to address client challenges
    and deliver quality solutions
  - Applying natural language processing techniques to improve
    text analytics and sentiment analysis
  - Building and maintaining data infrastructure to support AI
    and machine learning initiatives
  - Participating in the development of open-source software
    solutions to advance AI capabilities
  - Conducting data wrangling and preprocessing to prepare
    datasets for machine learning applications
  - Contributing to the continuous improvement of AI systems
    through feedback and iterative development
  What You Must Have
  - At least a Bachelor's degree
  - At least 1 years of experience
  What Sets You Apart
  - Preference for at least one of the following fields of
    study: Analytics/Data Science, Artificial
    Intelligence/Robotics, Computer Science/Information
    Systems, Engineering
  - At least one of the following: Certifications aligned to
    data engineering, machine learning, and cloud platforms,
    including AWS, Google Cloud, Microsoft Azure, Databricks,
    Snowflake, or related data and AI credentials
  - Demonstrating proficiency in Python and Scikit-Learn for
    machine learning tasks
  - Utilizing TensorFlow and Neural Networks for advanced AI
    implementations
  - Applying Natural Language Processing (NLP) techniques for
    text analytics
  - Developing data pipelines and integration strategies for
    complex data environments
  - Excelling in active listening and communication to enhance
    team collaboration
  The salary range for this position is: $61,000 - $100,000.
  Actual compensation within the range will be dependent upon
  the individual's skills, experience, qualifications and
  location, and applicable employment laws. All hired
