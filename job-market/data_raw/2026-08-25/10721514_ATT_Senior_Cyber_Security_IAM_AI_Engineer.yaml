description: |
  About the Company:Join AT&T and reimagine the communications
  and technologies that connect the world. Our Chief Security
  Office ensures that our assets are safeguarded through
  truthful transparency, enforce accountability and master
  cybersecurity to stay ahead of threats. Bring your bold
  ideas and fearless risk-taking to redefine connectivity and
  transform how the world shares stories and experiences that
  matter. When you step into a career with AT&T, you won’t
  just imagine the future-you’ll create it.About the Job:As
  part of the AT&T Identity and Access Management team, we are
  seeking an Senior Cyber Security AI Engineer with strong
  expertise in applying artificial intelligence, machine
  learning, automation, and data-driven decisioning within the
  Identity and Access Management IAM domain. The ideal
  candidate will design, develop, and implement AI-enabled
  solutions that improve identity governance, access
  certification, authentication, authorization, anomaly
  detection, privileged access monitoring, and risk-based
  access controls.This role will work closely with IAM
  architects, cybersecurity teams, platform engineers,
  application owners, data scientists, and business
  stakeholders to deliver scalable, secure, and intelligent
  IAM capabilities across enterprise environments.Experience
  Level: 12+ years.Location: Hyderabad /
  BengaluruResponsibilities Include:The expert in this role
  will lead, support and guide team members in technical and
  functional matters in providing high-quality and actionable
  products / deliverables. Leads the team to success.
  Collaborates with leadership teams, provides subject matter
  expertise and insights. The Lead Cybersecurity in this role
  will -

  - Design and develop AI/ML models to support Identity and
    Access Management (IAM) domain use cases such as access
    risk scoring, identity analytics, anomalous behavior
    detection, and access recommendation engines.
  - Apply AI techniques to improve identity lifecycle
    management, access provisioning, deprovisioning, access
    reviews, and certification processes.
  - Integrate AI solutions with IAM platforms such as IGA, PAM
    and authentication solutions
  - Collaborate with IAM engineering teams to automate manual
    processes using AI, machine learning, natural language
    processing, and workflow automation.
  - Design and implement data models, feature engineering
    approaches, and model evaluation methods for IAM-related
    use cases.
  - Partner with security architecture teams to ensure AI-
    enabled IAM solutions align with enterprise security
    standards.
  - Monitor model performance, accuracy, drift, and operational
    effectiveness.
  - Support explainability, auditability, and governance of AI-
    driven access decisions.
  - Create technical documentation, design diagrams,
    implementation plans, and operational runbooks.
  - Stay current with emerging AI, cybersecurity, and IAM
    technologies and recommend improvements.

  The expert in this role will perform analysis of complex
  security issues and corresponding activities to help
  mitigate risk. Includes forward looking research, planning
  and strategy to strengthen our stance against future cyber
  security threats and attacks, and enhancing our mitigation
  techniques, processes, and technology solutions.Required
  skills:

  - Overall - At least 12+ years of experience in performing
    security engineering and assessments of complex systems
    with AI / ML / Data Science capabilities and services
  - Hands-on experience with machine learning, deep learning, or
    statistical modeling.
  - Experience working with large-scale datasets, including
    authentication logs, access logs, entitlement data, user
    attributes, and audit data.
  - Experience with AI/ML frameworks such as TensorFlow,
    PyTorch, Scikit-learn, XGBoost, LangChain, or similar
    tools.
  - Experience with data platforms and tools such as SQL, Spark,
    Databricks, Snowflake, BigQuery, or similar technologies.
  - Familiarity with cloud platforms such as Azure, AWS, or
    Google Cloud.
  - Understanding of cybersecurity principles, access control
    models, and enterprise risk management.
  - Ability to translate business and security requirements into
    technical AI solutions.
  - Strong analytical, problem-solving, and communication skills
  - Flexible to provide coverage in US morning hours on a need-
    basis, and as required.

  Desirable skills:

  - Bachelor's or master's degree in computer science,
    mathematics, information systems, engineering, or
    cybersecurity.
  - Strong understanding of Identity and Access Management IAM
    domain
  - Experience designing, developing, and deploying secure AI
    systems.
  - Training in secure coding standards and best practices for
    AI-related projects.
  - Knowledge of ethical hacking techniques.
  - Ability to develop security protocols and policies.
  - Excellent communication, problem-solving, and analytical
    skills.
  - Ability to work independently and as part of a team.

  Additional information (if any): Flexible to provide
  coverage in US morning hours on a need-basis, and as
  required.Good to have AI knowledge / experience:1.
  Experience with Generative AI or Large Language Models for
  IAM use cases such as policy analysis, access request
  recommendations, entitlement summarization, or automated
  access review support.2. Experience leveraging AI-enabled
  tools (such as Copilot for Security, Darktrace, CrowdStrike
  Charlotte AI, or custom LLM integrations) to enhance
  detection, response, and automation workflows.3.
  Understanding of LLM safety, prompt engineering, or AI
  governance frameworks (e.g., NIST AI RMF, EU AI Act
  readiness) is a plus.4. Exposure to data science
  fundamentals relevant to security (pattern recognition,
  supervised vs. unsupervised learning, model
  validation).#Cybersecurity

