description: |
  As a Senior AI Engineer, you will be a key player in the
  design, development, and implementation of cutting-edge
  generative AI models and systems. Drawing on your expertise
  in machine learning, deep learning, and generative
  algorithms, you will help advance our organization's AI
  capabilities. This role requires a strong understanding of
  both theoretical concepts and practical applications, as
  well as the ability to provide technical leadership in
  developing such solutions.

  Responsibilities:

  Algorithm Development: Design and implement state-of-the-art
  generative AI algorithms, such as GANs, VAEs, Transformers,
  and other deep generative models, to enhance media buying
  decisions. Algorithm Development: Develop large-scale
  recommender systems based on GNN embeddings and similar
  methodologies to optimize media buying decisions. Optimize
  and refine existing algorithms to improve performance,
  scalability, and efficiency. Lead the training and
  evaluation of generative models on extensive datasets.
  Develop methods for assessing model performance and making
  improvements based on feedback. Collaborate with cross-
  functional teams, including data scientists, software
  engineers, and product managers, to integrate generative AI
  into various applications. Mentor and guide junior team
  members.

  Requirements

  Qualifications:

  A minimum of 5 years of experience in machine learning or
  related fields. At least 2 years of experience in generative
  AI or related areas. Proficiency in deep learning frameworks
  such as TensorFlow, PyTorch, or similar. Expertise in
  generative models, neural networks, and reinforcement
  learning. Advanced degree (Ph.D. or equivalent) in Computer
  Science, Machine Learning, or a related field, or a proven
  track record in the field. Demonstrated ability to lead and
  mentor a team of AI engineers. Strong communication skills
  to convey complex concepts to both technical and non-
  technical stakeholders. An analytical mindset to solve
  complex problems and provide innovative solutions.
  Adaptability to evolving technologies and methodologies in
  the fast-paced field of AI.
