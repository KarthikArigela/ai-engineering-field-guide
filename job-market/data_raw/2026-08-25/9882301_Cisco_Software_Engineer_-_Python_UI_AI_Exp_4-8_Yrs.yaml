description: |
  Meet the Team

  Join Cisco’s Data & Analytics team, a high-performing group
  of intelligent, dedicated, and results driven professionals
  building an outstanding enterprise analytics platform. Our
  mission is to connect data across the value chain to deliver
  persona-based, actionable insights that empower self-service
  analytics, enable digital processes, and accelerate Cisco’s
  transformation to new business models. By combining
  innovation, technical expertise, and business impact, the
  team helps drive operational efficiency and data-driven
  decision-making at scale.


  Your Impact

  In this role, you will build, develop, and maintain high-
  performance full-stack applications. You will work within a
  collaborative environment to build scalable microservices,
  ensuring our systems are secure, observable, and reliable.
  This is a great opportunity to influence our platform
  architecture and contribute to the continuous delivery of
  high-quality software solutions.


  Responsibilities

  - Design, develop, and maintain robust RESTful APIs and
    backend services using Python (FastAPI/Flask) and Java
    (Spring Boot).
  - Define and implement API contracts, validation logic, and
    error-handling standards to ensure seamless system
    integration.
  - Develop secure backend solutions using modern authentication
    protocols (OAuth 2.0, JWT) and ensure code quality through
    rigorous testing and observability.
  - Collaborate cross functionally with architects, frontend
    developers, QA, and DevOps teams to deliver integrated,
    high-quality backend features.
  - Troubleshoot production incidents and contribute to CI/CD
    pipelines, automated testing, and release management to
    support continuous delivery.

  Minimum Qualifications

  - Bachelor’s degree in Computer Science, Engineering, or a
    related technical field, or equivalent experience.
  - 4-8 years of professional experience in backend software
    development with hands on expertise in building RESTful
    services.
  - Strong programming proficiency in both Python
    (FastAPI/Flask/Django) and Java (Spring Boot/MVC)
  - Proven experience building modern, scalable UI applications
    with React (including state management libraries like
    Redux or React Query).
  - Proven experience with SQL and relational databases (e.g.,
    PostgreSQL, MySQL, Oracle) or Data Warehouses (e.g., SAP
    HANA, Snowflake).
  - Proven experience with source control (Git), automated
    testing frameworks, and secure coding practices.

  Preferred Qualifications

  - Experience with microservices architecture, distributed
    systems, and containerization (Docker, Kubernetes).
  - Familiarity with cloud platforms (AWS, Azure, or GCP) and
    message brokers (Kafka, RabbitMQ).
  - Experience implementing CI/CD pipelines (Jenkins, GitHub
    Actions) and using observability tools (Splunk, ELK,
    Prometheus, Grafana).
  - Experience with NoSQL databases (MongoDB, Cassandra, or
    DynamoDB) and API gateway patterns.
  - Experience working in Agile/Scrum development environments
    with a focus on high availability system design.
  - Experience in building efficient RAG (Retrieval-Augmented
    Generation) systems and state-management architectures for
    long-running agent tasks.
  - Experience in building agentic applications or integrating
    LLM-based services.

  Why Cisco?

  At Cisco, we’re revolutionizing how data and infrastructure
  connect and protect organizations in the AI era – and
  beyond. We’ve been innovating fearlessly for 40 years to
  create solutions that power how humans and technology work
  together across the physical and digital worlds. These
  solutions provide customers with unparalleled security,
  visibility, and insights across the entire digital
  footprint.

  Fueled by the depth and breadth of our technology, we
  experiment and create meaningful solutions. Add to that our
  worldwide network of doers and experts, and you’ll see that
  the opportunities to grow and build are limitless. We work
  as a team, collaborating with empathy to make really big
  things happen on a global scale. Because our solutions are
  everywhere, our impact is everywhere.

  We are Cisco, and our power starts with you.
