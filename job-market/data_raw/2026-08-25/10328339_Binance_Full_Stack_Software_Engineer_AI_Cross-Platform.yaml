description: |
  Binance is a leading global blockchain ecosystem behind the
  world’s largest cryptocurrency exchange by trading volume
  and registered users. We are trusted by 300+ million people
  in 100+ countries for our industry-leading security, user
  fund transparency, trading engine speed, deep liquidity, and
  an unmatched portfolio of digital-asset products. Binance
  offerings range from trading and finance to education,
  research, payments, institutional services, Web3 features,
  and more. We leverage the power of digital assets and
  blockchain to build an inclusive financial ecosystem to
  advance the freedom of money and improve financial access
  for people around the world.

  We are looking for a Full Stack Software Engineer with
  strong cross-platform engineering capabilities to join our
  team and build next-generation AI-powered products.

  The ideal candidate should have strong expertise in at least
  one core technology stack, while also having hands-on
  experience across multiple layers of the product stack,
  including Backend, Web, Android, and/or iOS.

  Beyond traditional full-stack development, we are
  particularly interested in engineers who have experience
  with AI Agents, LLM applications, or AI-assisted product
  development, and who can independently take a product from
  technical design through implementation and production.

  This is a highly cross-functional engineering role, where
  you will work across different technology stacks and
  business scenarios depending on product needs. The strongest
  candidates will demonstrate:

  Deep expertise in one stack + hands-on experience across
  other stacks + strong AI/Agent capability + the ability to
  learn and ship independently.

  For example:

  - Strong Java Backend + Web + AI Agent experience → Strong fit
  - Strong Web + Android/iOS + AI Agent experience → Strong fit
  - Strong Android/iOS + Backend/Web + AI Agent experience →
    Strong fit
  - Strong in only one stack with no meaningful cross-platform
    exposure → Lower priority
  - Broad technology exposure but limited production ownership →
    Lower priority

  Responsibilities

  Requirements

  Why Binance

  • Shape the future with the world’s leading blockchain
  ecosystem

  • Collaborate with world-class talent in a user-centric
  global organization with a flat structure

  • Tackle unique, fast-paced projects with autonomy in an
  innovative environment

  • Thrive in a results-driven workplace with opportunities
  for career growth and continuous learning

  • Competitive salary and company benefits

  • Work-from-home arrangement (the arrangement may vary
  depending on the work nature of the business team)

  Binance is committed to being an equal opportunity employer.
  We believe that having a diverse workforce is fundamental to
  our success.

  By submitting a job application, you confirm that you have
  read and agree to our Candidate Privacy Notice.
