description: |
  About Us

  At Turgon, we believe there is a massive opportunity to
  reimagine how IT services are delivered by leveraging a
  combination of AI agents and humans to build, integrate and
  run the enterprise stack. AI agents that understand your
  existing infrastructure, processes and data and can rapidly
  help you modernize your infrastructure and generate insights
  about your business. That’s a $1.5T opportunity!

  We are a startup based in San Francisco and New Delhi,
  founded by serial entrepreneurs. We are building out our
  core team to re-imagine and build an AI Agent version of
  Accenture. If you are compelled by this vision, let’s chat!

  About the Role

  As a Senior AI/ML Engineer you will help us architect and
  implement our set of semi-autonomous agents that can
  collaborate with each other and their human counterparts to
  create a semantic understanding of enterprise systems and
  their associated data, write code to integrate and run
  complex systems, QA data pipelines and observe systems in
  run-time / production.

  Responsibilities

  - Work with the team to discover new ways to build agentic
    products so we can create truly autonomous AI employees.
  - Architect orchestration layers for AI agents and their human
    counterparts to collaborate.
  - Build out feedback / learning mechanisms for agents across
    enterprise environments.
  - Build systems for integrating AI models with third-party
    tools, enabling diverse real-world applications.
  - Stay updated with advancements in LLMs and machine learning
    to keep Turgon at the forefront of AI & agentic
    innovation.

  Requirements

  - 2+ years of professional experience in ML/AI engineering,
    with expertise in LLM fine-tuning and deployment.
  - Experience with tools like Langsmith and Langchain for
    managing and optimizing LLM pipelines.
  - Strong programming skills, particularly in Python, and
    experience with MLOps tools like MLflow.
  - Solid understanding of backend systems and software
    engineering best practices.
  - Excellent communication skills and the ability to convey
    complex technical concepts to diverse audiences.

  Nice-to-Have Skills

  - Prior startup or founding-team experience
  - TensorFlow, PyTorch or other ML framework expertise
  - Familiarity with vector databases (Pinecone, Weaviate) and
    MLOps tools (MLflow, TFX)
  - Experience/Familiarity with some Enterprise Software
    (Snowflake, Data Bricks, any ERP, CRM, Reporting and
    Analytics etc) or Data Engineering (Enterprise Data
    Pipelines, Integrations etc)

  Education & Certification

  - We don’t actually care about qualifications as long as you
    are a rockstar engineer who wants to keep learning and
    make a massive impact.

  What We Offer

  - A values aligned culture: always learning mindset,
    collaborative environment and an entrepreneurial approach
    to getting things done.
  - Competitive, flexible salary based on experience
  - Equity via ESOPs
  - Leadership role shaping AI/LLM services at enterprise scale
  - Collaborative, high-energy startup culture in San Francisco
    and South Delhi
  - Access to top AI researchers worldwide to drive innovation
    and continuous learning.
