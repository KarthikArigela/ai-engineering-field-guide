description: |
  About Lendable

  Lendable is on a mission to build the world's best
  technology to help people get credit and save money. We're
  building one of the world’s leading fintech companies and
  are off to a strong start:

  - One of the UK’s newest unicorns with a team of just over 700
    people
  - Among the fastest-growing tech companies in the UK
  - Profitable since 2017
  - Backed by top investors including Balderton Capital and
    Goldman Sachs
  - Loved by customers with the best reviews in the market (4.9
    across 10,000s of reviews on Trustpilot)

  So far, we’ve rebuilt the Big Three consumer finance
  products from scratch: loans, credit cards and car finance.
  We get money into our customers’ hands in minutes instead of
  days.

  We’re growing fast, and there’s a lot more to do: we’re
  going after the two biggest Western markets (UK and US)
  where trillions worth of financial products are held by big
  banks with dated systems and painful processes.

  Join us if you want to

  - Take ownership across a broad remit. You are trusted to make
    decisions that drive a material impact on the direction
    and success of Lendable from day 1
  - Work in small teams of exceptional people, who are
    relentlessly resourceful to solve problems and find
    smarter solutions than the status quo
  - Build the best technology in-house, using new data sources,
    machine learning and AI to make machines do the heavy
    lifting

  We're looking for an influential Staff AI Engineer to join
  our small AI Engineering team at Lendable to help us enable
  developers to move faster whilst keeping quality high.

  Our mission is to bring all the lessons we have learned
  about AI development so far into one system so everyone can
  benefit. The system combines our Lendable Coding Agent, for
  measuring effectiveness of AI and the stability of our
  systems.

  This is a role where you'll be working with our engineers
  and product managers who build our products. You will
  improve the developer experience and improve our throughput.
  You’ll see instant impact with your work and participate in
  a highly collaborative environment.

  We need someone who takes full ownership - not just writing
  code, but thinking through the problem, designing the
  solution, shipping it, and making sure it keeps working.
  You'll own your work from "what should we build?" through to
  "is it still delivering value?"

  You'll also be working at the frontier of AI tooling -
  building with LLMs, experimenting with new approaches, and
  figuring out what's possible.

  What you'll be doing

  Build on top of our AI cloud coding agent

  - Build the core of our AI harness
  - Enable capabilities in these agents for specification,
    testing, and service reliability
  - Work with security and data governance requirements to
    ensure the agents are secure and have access to the
    appropriate data

  Enable others to build with AI

  - Encourage teams to level up their AI Software development
    processes
  - Enable teams to build AI actors that plug into the SDLC
  - Help teams measure the impact AI is having on the
    development process
  - Transplant good ideas and processes from one team to other
    teams in the organization

  What we're looking for

  Essential

  - 6+ years of software engineering experience in a mid-to-
    large-size organisation
  - Experience of building AI tooling to improve developer
    experience (devex)
  - The ability to influence how people work across multiple
    teams
  - Proven experience building AI tooling used by others in a
    commercial environment
  - Strong full-stack skills in TypeScript
  - Frontend skills with Next.js or React to build an interface
    for engineers
  - Strong AI knowledge — LLMs, embeddings, MCPs, RAG, evals,
    agentic platforms
  - Experience of building infrastructure to support your
    systems in production using IaC, k8s or lambda functions
  - Self-starter who takes ownership end-to-end — from
    understanding the problem, through design and
    implementation, to monitoring and iteration
  - Motivated by impact — you want to see your work used and
    know it's making a difference

  Nice to have

  - Experience with Cloudflare infrastructure
  - Experience with monitoring tools such as Datadog, Sentry,
    Grafana
  - Experience with creating guardrails for products: SLOs, DORA
    metrics

  How you'll work

  You’ll be part of a small core team that works with
  engineering representatives from across the company. We have
  a vision of how we can accelerate the engineering process
  with AI, and you’ll be working with this group to complete
  the plan. We will also experiment and adapt the plan as new
  AI tooling and approaches emerge.

  We value shipping and learning over perfection. The goal is
  always to deliver something useful, learn from how it's
  used, and improve. You won't be directly client-facing, but
  your work will directly impact colleagues across the
  business — and you'll hear about it when something you built
  makes their day easier.

  Why join?

  See your work make a difference This isn't a team where your
  code disappears into a monolith. You'll build something,
  ship it and get instant feedback from developers. Every
  integration and tool you ship has a direct line to
  engineering efficiency.

  High leverage A small core team means your contributions
  have outsized impact. No layers, fast decisions, real
  ownership.

  Build new things We're building a platform from the ground
  up, not maintaining legacy systems. You'll shape how AI gets
  used across Lendable.

  Work at the frontier AI tooling is moving fast. You'll work
  with the latest in agentic AI, workflow orchestration and
  LLM tooling — applied to real problems, not just proof-of-
  concepts.

  Interview process

  - Screening call with Hiring Manager
  - Take-home task
  - Technical interview based on the task
  - Interview with Engineering Manager
  - Final interview with Hiring Manager

  Life at Lendable

  - Winning team: the opportunity to scale up one of the world’s
    most successful fintech companies
  - Flexible working: flexible approach tailored to each role.
    Hybrid roles require three days in-office weekly; fully
    remote roles include regular opportunities for in-person
    connection through socials and off-sites
  - Socials & connection: opportunities and events to come
    together, socialise, and get to know each other beyond the
    office walls
  - Health coverage: support for your physical and mental
    wellbeing, including private health cover
  - Retirement & savings: long-term financial wellbeing through
    retirement savings plans
  - Employee referral programme: earn a competitive bonus when
    you refer successful new team members
  - Office meals & snacks: enjoy a fully stocked kitchen, plus
    complimentary lunches prepared by in-house chefs on in-
    office days at select locations
  - Sustainable commuting: cycle-to-work and electric vehicle
    salary sacrifice schemes available in select locations

  Please note: The availability and details of specific
  benefits vary by location and role. For more information,
  please speak to your Talent Partner.

  Check out our blog!
