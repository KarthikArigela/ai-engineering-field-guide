description: |
  The Opportunity

  We’re looking for a skilled Java Full Stack Developer to
  join our team and take ownership of building scalable, high-
  performance applications. You’ll work across the stack—from
  designing robust REST APIs to crafting responsive front-end
  interfaces. This is a critical role with immediate impact,
  offering the chance to collaborate with cross-functional
  teams and contribute to cloud-native, event-driven
  architectures.

  Additionally, the role will involve working with AI-driven
  solutions, including integrating AI services, contributing
  to AI-enabled features, or supporting AI-based platforms.
  The candidate should be comfortable working in AI-driven
  environments and using AI to improve efficiency and user
  experience.

  Job Details

  - Job Title: Java Full Stack Developer
  - Department: Technology
  - Education: Graduation in Engineering (preferably BE/B.Tech)
    or equivalent professional qualification
  - Employment Type: Full-time, Permanent
  - Location: Hyderabad
  - Work Mode: 5 Days Work From Office (WFO)
  - Candidates should have exposure to AI-based tools,
    platforms, or solutions and demonstrate adaptability to
    evolving AI technologies.

  Key Responsibilities

  - Develop microservices and integrate with external systems
    and event-driven architectures (e.g., Kafka).
  - Build responsive, cross-browser compatible UIs using
    React.js, Redux, and TypeScript/JavaScript.
  - Ensure application performance, scalability, and security
    best practices.
  - Integrate front-end components with backend APIs seamlessly.
  - Write unit and integration tests using JUnit, Mockito, Jest,
    or React Testing Library.
  - Participate in Agile ceremonies including sprint planning,
    stand-ups, and retrospectives.
  - Collaborate with Product Owners, QA, and developers to
    deliver high-quality features.
  - Conduct code reviews and ensure adherence to coding
    standards.
  - Work on integrating AI/ML-based features, APIs, or services
    into applications wherever applicable.
  - Support development of AI-driven systems or platforms to
    enhance automation and decision-making.

  Requirements

  Required Technical Skills

  - Strong proficiency in Java 8+, Spring Boot, REST APIs, and
    Hibernate/JPA.
  - Hands-on experience with React.js, Redux,
    JavaScript/TypeScript, HTML5, CSS3, and UI libraries like
    Bootstrap or Material UI.
  - Experience with SQL and NoSQL databases (e.g., PostgreSQL,
    MongoDB).
  - Familiarity with Kafka or other event-driven systems.
  - Knowledge of OAuth2, JWT, and secure authentication
    mechanisms.
  - Experience with Git, Maven/Gradle, and JIRA.
  - Strong problem-solving, analytical, and communication
    skills.
  - Ability to work independently and collaboratively in Agile
    teams.
  - Basic to intermediate understanding of AI/ML concepts and
    practical exposure to AI tools, frameworks, or APIs.
  - Experience in integrating AI services (such as NLP,
    recommendation systems, or automation tools) into
    applications is preferred.

  Good to Have Skills and Experience Required

  - Experience deploying applications on cloud platforms (AWS,
    Azure, GCP).
  - Familiarity with CI/CD tools like Jenkins, GitLab CI, or
    GitHub Actions.
  - Exposure to containerization tools like Docker and
    orchestration with Kubernetes.
  - Hands-on experience working on AI platforms or AI-enabled
    products.
  - Exposure to modern AI frameworks, LLM integrations, or
    intelligent automation tools.
  - Ability to quickly adapt to AI-driven tools, workflows, and
    development practices.
