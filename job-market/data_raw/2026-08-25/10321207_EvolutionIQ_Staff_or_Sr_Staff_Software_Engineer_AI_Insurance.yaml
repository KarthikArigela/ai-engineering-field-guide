title: Staff or Sr. Staff Software Engineer (AI Insurance Tech)
company: EvolutionIQ
location: New York, USA
work_type: FULL_TIME
company_size: 220 Employees
description: |
  About Us: EvolutionIQ builds AI that helps insurance claims
  teams handle claims more accurately, fairly, and
  efficiently, so more people impacted by injury or illness
  can get back to their lives with dignity and stability. As
  part of CCC Intelligent Solutions (NASDAQ: CCC), we pair AI-
  native product development with something almost no one else
  in this market has: 40 years of proprietary data and deep
  relationships with the largest, most complex carriers in the
  world. It's a rare combination, and it's what lets us build
  casualty products others can't. Our people come first, and
  we think it shows. We've been named one of Inc.'s Best
  Workplaces three years running, plus Built In's Best Places
  to Work in 2025 and 2026.

  The Mission: EvolutionIQ is seeking to scale our
  infrastructure, systems, and people to support an agentic
  future for the insurance industry. We are looking for a
  Senior Staff or Principal Software Engineer who is a
  pragmatic visionary who will serve as a high-leverage force
  multiplier across the entire organization.

  In this role, you will drive the technical vision for our
  new agentic products and the growth of our platform. You
  will solve our most complex technical bottlenecks and serve
  as the critical bridge between executive strategy and
  engineering execution. Your mission is to ensure our
  technical roadmap directly supports our product goals while
  leveling up the software engineering rigor across our 100+
  person organization.

  What You’ll Achieve:

  - Architect the Agentic Future: Lead the transition from
    traditional data pipelines to event-driven, agentic
    systems that handle tens of millions of unstructured
    documents with world-class stability.
  - Bridge the Platform-Product Divide: Act as a critical
    interface to ensure the Platform team builds generalized,
    high-utility tools that solve real problems for Product
    Engineers.
  - Accelerate the SDLC: Use first principles thinking to
    leverage AI and agentic tools to accelerate the entire
    software development lifecycle—from testing to
    deployment—ensuring we maintain high throughput as we
    scale.
  - Drive Organizational Influence: Partner with the CTO and EVP
    of Product and Technology to align technical strategy with
    business outcomes. You will influence the adoption of
    modern technologies by building the right environment for
    teams to succeed.
  - Pragmatic Implementation: Rapidly turn ideas into thoughtful
    designs with multiple options and trade-offs. You will
    lead the "1 to 10" journey towards iterative, startup-
    ready progress.

  About You:

  - The Pragmatic Architect: You have a startup-first mindset.
    You know when to build for 10x scale and when over-
    engineering will hinder the company. You value getting
    stuff done and iterative bridging over theoretical
    rewrites.
  - Product-Minded Engineer: You can translate high-level
    business needs into technical requirements. You think like
    a PM, are comfortable writing a PRD, and can effectively
    push back against stakeholders to ensure technical work
    delivers actual business value.
  - Battle-Tested Leader: You have seen the "1 to 10" scale-up
    journey. You possess the startup rigor to move fast,
    combined with the enterprise wisdom to build systems that
    don't break under massive volume.
  - Technically Polyglot: You have a deep software engineering
    foundation but understand the emerging agentic landscape
    (embeddings, RAG, retrieval) at a level that commands
    respect from Staff-level SMEs.
  - Expert Communicator: You are an over-communicator by nature.
    You break down silos and can explain complex technical
    trade-offs to both junior engineers and executive
    leadership.

  Work-life, Culture & Perks

  - Compensation: The base salary range is $275-300K (based on
    level hired), with flexibility depending on a candidate’s
    background and experience. An annual bonus plan and
    company equity plan (RSUs) are also included in our
    generous compensation package
  - Well-Being: Medical, dental, vision, short & long-term
    disability, life insurance and AD&D, and 401k matching.
    Additional family, wellness, and pet benefits.
  - Home & Family: Paid time off and sick leave, 100% paid
    parental leave (16 weeks for primary caregivers and 12
    weeks for secondary caregivers). We offer a flexible
    schedule for new parents returning to work.
  - Office Life: Catered lunches, happy hours, pet-friendly
    spaces, and monthly technology stipend.
  - Growth & Training: $1,000/year for each employee for
    professional development, as well as opportunities for
    tuition reimbursement.
  - Sponsorship: We are open to sponsoring candidates currently
    in the U.S. who need to transfer their active visa.

  EvolutionIQ appreciates your interest in our company as a
  place of employment. EvolutionIQ is an equal opportunity
  employer. We celebrate diversity and are committed to
  creating an inclusive environment for all employees.
