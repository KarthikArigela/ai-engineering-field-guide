description: |
  At NiCE, we don’t limit our challenges. We challenge our
  limits. Always. We’re ambitious. We’re game changers. And we
  play to win. We set the highest standards and execute beyond
  them. And if you’re like us, we can offer you the ultimate
  career opportunity that will light a fire within you.

  So, what’s the role all about?

  Our company is seeking a highly skilled Senior Software
  Engineer with expertise in writing software with real time
  constraints to join our software development team. As a
  Senior Software Engineer, you will be responsible for
  designing, developing and maintaining software applications
  that meet business needs and specifications.

  How will you make an impact?

  - Develop and maintain software applications using .NET
    technologies
  - Collaborating with other members of the development team to
    ensure that software designs are aligned with overall
    project objectives.
  - Write high-quality code that meets software development best
    practices
  - Participate in code reviews to ensure code quality and
    maintainability
  - Contributing to the development of technical documentation,
    user manuals, and other materials related to software
    development.
  - Stay up to date with emerging trends and technologies in
    software development

  Have you got what it takes?

  - Bachelor's degree in Computer Science, Software Engineering,
    or a related field
  - 5 to 8 years of experience in software development using
    .NET technologies
  - Strong knowledge of C#, .NET, .NET Core, and other .NET
    frameworks.
  - Strong understanding of Object-Oriented Programming (OOP)
    concepts and design patterns
  - Solid understanding of software development best practices,
    including software design patterns, testing strategies,
    and source control.
  - Knowledge of database design and development using SQL
    Server or another relational database management system
  - Proficiency in software development tools such as Visual
    Studio, Git, and JIRA
  - Ability to work effectively in a team environment and
    communicate technical concepts to non-technical
    stakeholders
  - Strong problem-solving and analytical skills
  - Excellent written and verbal communication skills
  - Ability to work independently and as part of a team.
  - Knowledge of software development methodologies such as
    Agile or Scrum
  - Experience in the public cloud; AWS preferred
  - Experience developing and deploying applications in Docker
    container.
  - Experince using Agentic AI Developement (Any Tool).
  - Practiced understanding of microservices architecture - nice
    to have
  - Telephony experience, including VOIP, media streaming, SIP
    signaling, and RTP - nice to have
  - Knowledge of C++ - nice to have

  What’s in it for you?

  Join an ever-growing, market disrupting, global company
  where the teams – comprised of the best of the best – work
  in a fast-paced, collaborative, and creative environment! As
  the market leader, every day at NICE is a chance to learn
  and grow, and there are endless internal career
  opportunities across multiple roles, disciplines, domains,
  and locations. If you are passionate, innovative, and
  excited to constantly raise the bar, you may just be our
  next NICEr.



  Enjoy NICE-FLEX!

  At NICE, we work according to the NICE-FLEX hybrid model,
  which enables maximum flexibility: 2 days working from the
  office and 3 days of remote work, each week. Naturally,
  office days focus on face-to-face meetings, where teamwork
  and collaborative thinking generate innovation, new ideas,
  and a vibrant, interactive atmosphere.

