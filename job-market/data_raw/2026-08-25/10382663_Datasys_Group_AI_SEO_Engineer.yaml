description: |
  This is a remote position.



      Datasys builds high-scale, AI-powered data platforms
  that help enterprises leverage deep consumer and business
  intelligence. We are looking for an AI SEO Engineer who can
  drive organic growth for our clients while also focusing on
  getting content placed within LLMs like ChatGPT, Gemini, and
  Claude. If you’re at the intersection of SEO, AI, and
  content strategy, we encourage you to apply.









   Who we are looking for:





      • You have a strong record of SEO success, driving
  traffic and rankings for businesses.




      • You understand the new landscape of search, including
  how LLMs source and retrieve information from the web.




      • You can develop strategies for optimizing content to
  be surfaced by AI models, including fine-tuning for featured
  snippets, structured data, and authoritative citations.




      • You have experience with Google Search Console, Google
  Analytics, Ahrefs, SEMrush, and other SEO tools to measure
  performance and uncover opportunities.




      • You are highly skilled in entity-based SEO, schema
  markup, and structured data strategies that improve
  visibility across search engines and AI-powered platforms.




      • You are comfortable analyzing Google’s AI-powered
  search experiences (SGE) and how AI assistants interact with
  web content.









      Our environment best suits those who:




      • Excel in a high-velocity, results-driven atmosphere.




      • Value continuous learning and stay ahead of AI-driven
  changes to search and content discovery.




      • Take responsibility for making impactful decisions
  that drive Datasys’ and our clients’ online visibility.









      Datasys operates in a hybrid work environment, but this
  position is fully remote, and the ideal candidate thrives
  with the freedom and flexibility this structure provides.









      Our interview process:









      Fast! From application to offer in a week.









      If you’ve done anything notable, such as ranked a site
  from zero to 100K+ monthly visitors, made $50k+ from a
  single product/project/trade, or similarly impactful, let us
  know, and we’ll prioritize your application.









      Zero Expectations









      We look for people with a track record of building.




      1. Initial Meet – Someone on our team will chat with
  you.




      2. Personality Assessment – We’ll send you a personality
  assessment to understand you better.




      3. Take-Home Challenge – We’ll send you a small LLM SEO
  challenge.




      4. Follow-Up Interview – We’ll review the take-home
  challenge together.




      5. Offer – We’ll give you an offer you’ll be happy with.









      Ready to shape the future of SEO in the AI era? Apply
  now!
