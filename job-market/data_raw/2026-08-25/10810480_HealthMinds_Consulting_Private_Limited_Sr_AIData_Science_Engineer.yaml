  others to develop and evaluate algorithms to improve
  product/system performance, quality, data management and
  accuracy. In both theoretical development environments and
  specific product design, implementation and improvement
  environments, uses current programming language and
  technologies to translate algorithms and technical
  specifications into code. Completes programming and
  implements efficiencies, performs testing and debugging.
  Completes documentation and procedures for installation and
  maintenance. Applies deep learning technologies to give
