  complex situations. Adapts machine learning to areas such as
  virtual reality, augmented reality, artificial intelligence,
  robotics and other products that allow users to have an
  interactive experience. Can work with large scale computing
  frameworks, data analysis systems and modeling environments.
  TECHNICAL SPECIALIST CAREER STREAM: An individual
  contributor with responsibility in our technical functions
  to advance existing technology or introduce

  new technology and therapies. Formulates, delivers and/or
  manages projects assigned and works with other stakeholders
