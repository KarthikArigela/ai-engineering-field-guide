  Responsibilities may include the following and other duties
  may be assigned. In new product design roles: develops and
  programs integrated software algorithms to structure,
  analyze and leverage data in product and systems
  applications in both structured and unstructured
  environments. Develops and communicates descriptive,
  diagnostic, predictive and prescriptive insights/algorithms.
