  colleagues or may direct the work of other lower level
  professionals. The majority of time is spent delivering R&D,
  systems or initiatives related to new technologies or
  therapies – from design to implementation - while adhering
  to policies, using specialized knowledge and skills.
  DIFFERENTIATING FACTORS Autonomy: Seasoned individual
  contributor. Works independently under limited supervision
  to determine and develop approach to solutions. Coaches and
  reviews the work of lower level specialists; may manage
  projects / processes. Organizational Impact: May be
  responsible for entire projects or processes within job
  area. Contributes to the completion of work group
  objectives, through building relationships and consensus to
  reach agreements on assignments. Innovation and Complexity:
  Problems and issues faced are difficult, and may require
  understanding of multiple issues, job areas or specialties.
  Makes improvements of processes, systems or products to
  enhance performance of the job area. Analysis provided is
  in-depth in nature and often provides recommendations on
  process improvements. Communication and Influence:
  Communicates with senior internal and external customers and
  vendors. Exchange information of facts, statuses, ideas and
  issues to achieve objective, and influence decision-making.
  Leadership and Talent Management: May provide guidance,
  coaching and training to other employees within job area.
  May manage projects, requiring delegation of work and review
  of others' work product. Required Knowledge and Experience:
  Requires advanced knowledge of job area combining breadth
  and depth, typically obtained through advanced education
  combined with experience. May have practical knowledge of
  project management. Requires a Baccalaureate degree (or for
  degrees earned outside of the United States, a degree which
  satisfies the requirements of 8 C.F.R. § 214.2(h)(
  4)(iii)(A) and minimum of 4 years of relevant experience, or
  advanced degree with a minimum of 2 years relevant
  experience.
