description: |
  The Opportunity  As a Tax Innovation - AI Engineer, you will
  lead the integration and deployment of artificial
  intelligence technologies within our Tax practice, enhancing
  performance and capabilities. As a Senior Manager, you will
  leverage your skills and professional networks to deliver
  quality results, acting as a strategic advisor and driving
  project success. You will be responsible for building trust
  with multi-level teams and stakeholders, motivating and
  coaching teams to solve complex problems, and applying sound
  judgment to develop high-performing, diverse, and inclusive
  teams. In this role, you will oversee the design,
  development, and maintenance of data infrastructure,
  confirming data quality and integration across various
  systems. You will also engage in coaching and feedback
  processes to foster growth and innovation within your team.
  Your ability to manage data pipelines and model data
  effectively will be crucial in supporting efficient data
  management and decision-making. This position offers the
  opportunity to deepen your skills in AI implementation and
  machine learning, contributing to the overall success of our
  firm. Responsibilities
  - Leading the integration and deployment of artificial
    intelligence technologies to enhance performance and
    capabilities
  - Overseeing the design and maintenance of data infrastructure
    to support efficient data management and sharing
  - Managing data pipelines to validate accurate and timely data
    movement across systems
  - Developing data models to organize and represent data in a
    structured manner, supporting decision-making processes
  - Implementing machine learning and natural language
    processing techniques to drive innovation in data
    analytics
  - Utilizing Python programming to build and refine data
    analytics solutions
  - Conducting rapid experimentation to test new ideas and
    improve data-driven strategies
  - Providing coaching and feedback to develop team skills and
    performance in data and analytics engineering
  - Collaborating with stakeholders to integrate data from
    different and multiple sources into a unified view
  - Validating data quality to maintain accuracy, consistency,
    and reliability for informed decision-making
  What You Must Have
  - At least a Bachelor's degree
  - At least 6 years of experience
  What Sets You Apart
  - Preference for at least one of the following fields of
    study: Analytics/Data Science, Artificial
    Intelligence/Robotics, Computer Science/Information
    Systems, Engineering
  - At least one of the following: Certifications aligned to
    data engineering, machine learning, and cloud platforms,
    including AWS, Google Cloud, Microsoft Azure, Databricks,
    Snowflake, or related data and AI credentials
  - Leading AI implementation projects to enhance performance
    and capabilities
  - Managing data infrastructure to promote data sharing and
    consumption
  - Integrating data from diverse sources into unified views
  - Modeling data to support efficient management and integrity
  - Utilizing Python for programming and machine learning
    applications
