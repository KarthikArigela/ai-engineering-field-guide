description: |
  AI GTM Engineer

  About the role

  We’re looking for an AI GTM Engineer to own the systems,
  data, and processes behind our marketing engine.

  This is a hands-on role. You’ll work across Marketing,
  Sales, Product and Growth to make sure our campaigns run
  smoothly, our data is reliable, and we’re continuously
  improving conversion across the funnel.

  You should be equally comfortable building a dashboard,
  fixing an email workflow, creating an account list, and
  figuring out why a conversion rate dropped.

  What you’ll work on

  - Built AI-native GTM workflows, run experiments to improve
    business metrics
  - Own marketing dashboards and reporting across acquisition,
    conversion, pipeline, and campaign performance
  - Build, test, and optimize email journeys across prospects,
    product users, and customers
  - Manage marketing and GTM tooling across HubSpot,
    Customer.io, Lemlist, Clay, and related tools
  - Build and enrich prospect/account lists for campaigns and
    outbound programs
  - Manage segmentation, lead routing, lifecycle stages,
    campaign tracking, and data hygiene
  - Own the operational execution of monthly prospect and
    customer email communications
  - Support ABM campaigns with targeting, account data,
    enrichment, and measurement
  - Build automations and workflows that reduce manual work
    across Marketing and Sales
  - Partner with Sales and Marketing on ad hoc data analysis and
    reporting requirements

  Who would be a good fit

  - 4–6 years of experience in Marketing Operations, Growth
    Operations, Revenue Operations, or a similar role at a B2B
    SaaS company
  - Strong hands-on experience with HubSpot and marketing
    automation tools
  - Comfortable working with tools like Customer.io, Clay,
    Mixpanel, Lemlist, Zapier/n8n, or similar
  - Strong analytical skills and comfortable building dashboards
    and working with funnel data
  - Understands email marketing, segmentation, experimentation,
    and conversion optimization
  - Enjoys getting into the details and fixing things rather
    than just defining processes
  - Comfortable working across Marketing and Sales in a fast-
    moving environment

  Bonus points

  - Experience at a PLG, developer tools, infrastructure, or
    open-source company
  - Experience building AI-assisted GTM workflows
  - Ability to tie marketing to product adoption
  - Basic SQL or experience working directly with
    product/warehouse data
  - Experience with account-based marketing and enrichment
    workflows
