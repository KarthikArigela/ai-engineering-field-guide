title: Agentic AI Engineer, AI Automation
company: Mintel
location: London, GBR
work_type: FULL_TIME
company_size: 1,419 Employees
description: |
  We’re looking for an Agentic AI engineer to join our AI
  Automation team, building internal AI-Automation
  applications. We create agentic solutions that help our
  internal users automate routine execution with AI, allowing
  them to focus more on tackling complex and high-level
  challenges, thus delivering more value to more clients. Your
  focus will mainly be on designing and deploying the agentic
  LLM orchestration of our solutions. Hands-on experience with
  full-stack web development and DevOps is a plus. The
  successful candidate will play a key role in building
  smarter, more efficient, and more reliable systems.

  Why join Mintel? We are the world's leading market
  intelligence agency and technology underpins our success. We
  help our clients understand consumers and consumer markets,
  and we aspire to provide the market intelligence behind
  every great business decision. Our technology allows us to
  deliver data, insights, and opinions in a compelling way to
  our clients across the globe.

  Mintel is committed to building and supporting a diverse
  workforce, providing opportunities for all. 22% of our
  Engineering team and 23% of our Engineering leaders are
  women.  We offer flexible working options and provide
  support, development and growth opportunities.

  We support a Hybrid working approach.  Most of our
  colleagues work 1-2 days a week in our London office and the
  rest of the week remotely.

  What You Will Do:

  - Design and implement stateful agentic workflows (using
    agentic frameworks like LangGraph, AutoGen, CrewAI, OpenAI
    Agents SDK, MCP or custom Python/TypeScript solutions)
    that can plan, execute and self-correct.
  - Develop robust integration layers that allow the LLM to
    interact with our internal APIs, databases, and third-
    party tools reliably
  - Develop and architect advanced RAG (Retrieval-Augmented
    Generation) systems with our knowledge base.
  - Collaborate in a dynamic Agile team, working closely with
    business stakeholders to understand needs and deliver
    solutions.
  - Contribute to the team’s sprint goals, solving technical
    challenges both independently and through pair programming
    with your colleagues, while also collaborating with
    Engineers and Architects from other teams from time to
    time.
  - Help your team to deliver high quality, reliable software
    via our code review and QA practices and contribute to the
    evolution of these over time.
  - Make your voice heard when we’re discussing implementation
    trade-offs within the team or technical solution
    possibilities with our stakeholders.

   What We Are Looking For:

  - Developers who have hands-on experience with agentic AI
    development (LangGraph, AutoGen, CrewAI, OpenAI Agents
    SDK, MCP)
  - Hands-on experience with Vector Databases & RAG (Snowflake,
    Azure AI search)
  - Your solution will be integrated with the work of your full
    stack developer teammates. Hence, understanding (hands-on
    experience is a plus) of full stack development, front-end
    (React and TypeScript) back-end (Python with FastAPI or
    Django and SQL), security, and APIs is necessary.
  - Applicants who are keen to contribute to both new feature
    development and system reliability and performance
    improvements.
  - Basic understanding of DevOps with AWS and Azure is
    mandatory, hands-on experience is a plus.
  - Hands-on experience with Agentic AI.
  - Familiarity with building applications that utilise
    generative AI is nice to have
  - Quick learners who can adapt to new domains and
    technologies, continuously enhancing their skillset.
  - Able to communicate technical concepts to diverse business
    stakeholders without loosing essential context or relying
    on jargon.
  - Ability to receive and implement feedback constructively.



  We hope you’ll like our…

  - Culture that supports true collaboration whilst embracing
    remote working. We measure success by the quality of your
    deliverables and the problems you solve, not the hours you
    spend at your desk.
  - Generous holiday allowance with the opportunity to buy
    additional holiday.
  - Approach to personal development where we encourage
    individuals to grow and share what they’ve learned.
  - Flexible start times and end times.
  - Membership in Employee Resource Groups (Mintel Diversity,
    Mintel Wellness, and Mintel Gives).
  - Additional one day off to celebrate your birthday.
  - Giving back is part of our culture with this in mind, Mintel
    gives employees 2 days' leave per year to join local
    volunteering activities organised by our Mintel Gives
    (where applicable).
  - Frequent social events, both within the department and
    across the company.
  - Blend of home and office working (1-2 days in the office).
  - Mental health and wellbeing support via Modern Health App.

