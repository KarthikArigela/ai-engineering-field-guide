description: |
  The TP ICAP Group is a world leading provider of market
  infrastructure.

  Our purpose is to provide clients with access to global
  financial and commodities markets, improving price
  discovery, liquidity, and distribution of data, through
  responsible and innovative solutions.

  Through our people and technology, we connect clients to
  superior liquidity and data solutions.

  The Group is home to a stable of premium brands.
  Collectively, TP ICAP is the largest interdealer broker in
  the world by revenue, the number one Energy & Commodities
  broker in the world, the world’s leading provider of OTC
  data, and an award winning all-to-all trading platform.

  The Group operates from more than 60 offices in 27
  countries.  We are 5,300 people strong.  We work as one to
  achieve our vision of being the world’s most trusted,
  innovative, liquidity and data solutions specialist.



  Role Overview:

  We've built a dedicated AI & Innovation Lab to drive real
  change across the organisation, developing and delivering AI
  solutions that transform how we work.

  The Senior Forward Deployed (AI) Engineer is a high-
  autonomy, high-impact role at the intersection of delivery
  and core platform development. You will embed directly with
  TP ICAP’s business divisions to lead end-to-end deployments
  of AI solutions. Owning discovery, technical scoping, system
  design, build, and production rollout.

  You will partner directly with domain teams to identify
  high-value AI opportunities, architect solutions tailored to
  real business problems and drive adoption from first
  prototype to stable production. Equally, you will serve as a
  critical feedback channel to TP ICAP’s central AI platform
  team, sharing field insights that shape product direction
  and model improvement. The role offers a unique opportunity
  to lead critical projects, shape engineering culture, and
  accelerate your career growth in the rapidly evolving field
  of generative AI.



  Role Responsibilities

  - Own the full lifecycle of AI deployments within your
    assigned business division. Initial discovery and
    technical scoping through system design, build, and
    production rollout. Ensure solutions are technically
    sound, aligned to business outcomes, and delivered with
    the urgency and quality expected of a forward-deployed
    team.
  - Embed directly with business stakeholders to understand
    their most pressing challenges. Translate complex domain
    requirements into well-defined technical solutions,
    operating as a trusted engineering partner rather than a
    distant service provider. Communicate progress, trade-
    offs, and outcomes clearly to leadership.
  - Architect, build, and deploy cutting-edge AI applications
    powered by large language models and generative AI. Write
    and review production-grade code across frontend and
    backend systems, ensuring scalability, reliability, and
    strict data stewardship.
  - Co-develop and enhance TP ICAP’s shared AI service platform
    in collaboration with the central AI & Innovation Lab.
    Feed field insights back to inform product roadmaps,
    identify where models succeed, and surface areas for
    improvement.
  - Drive adoption of deployed solutions by measuring success
    through production usage, measurable workflow impact and
    evaluation-driven feedback. Present outcomes and strategic
    recommendations to leadership, demonstrating tangible
    business value.

  Experience / Competences

  Essential

  - Expertise in Generative AI, Machine Learning and large
    language models. Hands on experience across prompt
    engineering, agent development and evaluation frameworks.
  - Demonstrated proficiency in Python AI/ML frameworks with the
    ability to write and review production-grade code across
    the full stack.
  - A proven track record architecting and designing scalable
    solutions that move from prototype to production.
  - Experience managing technical priorities within an Agile
    environment, resolving dependencies and ensuring alignment
    across stakeholders and platform teams.
  - Strong communication skills with the ability to present
    complex technical concepts to non-technical stakeholders
    and senior leadership, translating AI capabilities into
    business language.



  Desired

  - AWS experience including AI services such as Bedrock and the
    Serverless ecosystem.
  - Proficiency in front-end technologies, particularly with
    React. Evidence of building intuitive, responsive user
    interfaces that integrate seamlessly with AI-driven back-
    end services.
  - Expertise in back-end development, with experience in
    building and deploying scalable APIs and microservices to
    support AI solutions.
  - Knowledge of OAuth (Okta) for implementing secure, scalable
    authentication and authorisation mechanisms in full-stack
    applications, ensuring data protection and privacy across
    AI solutions.



  We are looking for a proactive, adaptable, and detail-
  oriented individual who thrives in fast-paced environments
  and embraces challenges. The ideal candidate will be open to
  innovative ideas, with a strong analytical mindset and
  problem-solving skills. They will demonstrate excellent
  communication, tailoring their style to suit different
  audiences, including both technical and internal audit
  professionals, and engage confidently while respecting
  professional and company values. With a keen eye for detail,
  they will stay organised, remain calm under pressure, and
  consistently seek opportunities for improvement while
  maintaining strong collaboration with the central AI &
  Innovation Lab.



  Band & Level – Manager, 6

  #LI-MID #LI-Hybrid

  Not The Perfect Fit?

  Concerned that you may not meet the criteria precisely? At
  TP ICAP, we wholeheartedly believe in fostering inclusivity
  and cultivating a work environment where everyone can
  flourish, regardless of your personal or professional
  background. If you are enthusiastic about this role but find
  that your experience doesn't align perfectly with every
  aspect of the job description, we strongly encourage you to
  apply. You may be the ideal candidate for this position or
  another opportunity within our organisation. Our dedicated
  Talent Acquisition team is here to assist you in recognising
  how your unique skills and abilities can be a valuable
  contribution. Don't hesitate to take the leap and explore
  the possibilities. Your potential is what truly matters to
  us.

  Company Statement

  We know that the best innovation happens when diverse people
  with different perspectives and skills work together in an
  inclusive atmosphere. That's why we're building a culture
  where everyone plays a part in making people feel welcome,
  ready and willing to contribute. TP ICAP Accord - our
  Employee Network - is a central to this. As well as
  representing specific groups, TP ICAP Accord helps increase
  awareness, collaboration, shares best practice, and holds
  our firm to account for driving continuous cultural
  improvement.

  Location

  UK - 135 Bishopsgate - London
