description: |
  Make Your Mark:

  We are hiring an AI Engineer to help build the next
  generation of customer-facing AI and agentic solutions
  within our FinTech SaaS platform. This role is designed for
  early-career engineers who combine strong theoretical
  foundations in AI/ML with a passion for hands-on building.
  You will work at the frontier of Generative AI, Large
  Language Models (LLMs), and Agentic systems, contributing to
  solutions that directly impact customers and business
  outcomes. You will collaborate with senior engineers and
  architects to rapidly prototype, validate, and scale AI-
  driven capabilities, while helping establish the engineering
  standards that will define our AI platform.

  You'll Get To:

  Rapid Prototyping & Solution Development

  - Partner with engineering leaders to design and build
    prototypes based on emerging ideas and business needs
  - Convert validated prototypes into scalable MVP solutions
    ready for production
  - Contribute directly to the development of customer-facing AI
    and agentic applications Agentic AI Engineering
  - Design and implement components of agentic systems,
    including:
  - LLM-based reasoning and workflows
  - Retrieval-Augmented Generation (RAG) pipelines
  - Multi-agent orchestration patterns
  - Work across the lifecycle of AI systems, from model
    integration to deployment and monitoring Feasibility
    Analysis & Experimentation
  - Evaluate the technical feasibility of new business ideas
    using empirical methods
  - Build experiments and benchmarks to validate assumptions and
    guide decision-making
  - Contribute to defining data-driven engineering guidelines
    for AI solutions AI/ML Engineering Standards & MLOps
  - Collaborate with cross-functional engineering teams to
    establish AI/ML Ops (AIMLOps) standards
  - Contribute to best practices in:
  - Model lifecycle management
  - Evaluation and monitoring
  - Security and scalability of AI systems Governance & Platform
    Foundations
  - Participate in defining organizational standards for
    governance and control planes of agentic AI systems
  - Ensure solutions align with security, compliance, and
    responsible AI principles

  What You'll Bring:

  - Master's or Ph.D. in Computer Science, Mathematics, or a
    closely related field
  - 2+ years of experience building customer-facing ML or
    agentic AI solutions (including internships)
  - Demonstrated ability to deliver working AI systems, from
    prototype to production
  - Strong theoretical grounding in:
  - Machine Learning fundamentals
  - Generative AI and Large Language Models (LLMs)
  - Hands-on experience with:
  - LLM training, fine-tuning, or prompt engineering
  - Retrieval-Augmented Generation (RAG)
  - Multi-agent orchestration frameworks
  - Experience with at least one cloud-native AI/ML stack,
    preferably:
  - Google Cloud (Vertex AI, etc.)
  - Alternatively: AWS or equivalent platforms
  - Familiarity with modern AI engineering tools and frameworks
  - Innovative, curious, and self-driven, with a strong bias
    toward action
  - Passionate about building scalable, secure AI solutions
  - Strong problem-solving and analytical thinking skills
  - Customer-focused mindset, with an understanding of real-
    world impact
  - Effective collaborator in cross-functional engineering
    environments

  Thrive at BlackLine Because You Are Joining:

  - A technology-based company with a sense of adventure and a
    vision for the future. Every door at BlackLine is open.
    Just bring your brains, your problem-solving skills, and
    be part of a winning team at the world's most trusted name
    in Finance Automation!
  - A culture that is kind, open, and accepting. It's a place
    where people can embrace what makes them unique, and the
    mix of cultural backgrounds and varying interests
    cultivates diverse thought and perspectives.
  - A culture where BlackLiner's continued growth and learning
    is empowered. BlackLine offers a wide variety of
    professional development seminars and inclusive affinity
    groups to celebrate and support our diversity.

