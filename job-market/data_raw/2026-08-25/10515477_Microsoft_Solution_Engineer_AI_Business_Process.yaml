title: Solution Engineer, AI Business Process
company: Microsoft
location: Los Angeles, USA
work_type: FULL_TIME
description: |
  Overview

  Our purpose is to empower organizations to transform the way
  they work by harnessing the full potential of artificial
  intelligence. We guide customers through the evolving
  digital landscape, enabling them to unlock new
  opportunities, enhance productivity, and deliver exceptional
  employee and customer experiences. By integrating advanced
  AI capabilities across devices, cloud platforms, and
  everyday business applications, we help organizations
  realize seamless, innovative, and secure solutions that
  drive sustained growth and success in the AI era.

  In this role you will be the AI Business Process Finance &
  Supply Chain Solution Engineer (SE) for the enterprise
  segment for your assigned workload and a member of the sales
  team that consists of AI Business Process Specialist (SSP),
  Customer Success Unit (CSU), partners and engineering.

  As an AI Business Process Finance & Supply Chain Solution
  Engineer (SE), you will lead AI transformation engagements
  with ERP domain expertise. Your role involves owning the
  technical win strategy and supporting AI Business Process
  Sales Specialists (SSP) by forming strong relationships with
  C-Suite executives, Business Decision Makers (BDMs), and
  Technical Decision Makers (TDMs) like CIO, CTO, and IT
  Leaders. You will help them achieve their goals for product
  proficiency, roadmap, and compete discussions to secure
  technical decisions.

  Your responsibilities include orchestrating and executing
  POCs, envision workshops, whiteboarding sessions, and
  conducting technical demonstrations to showcase the business
  value of D365 F&SC, Copilot Studio, and LOB AI Agents
  offerings. You will proactively collaborate with partners
  early in the sales cycle.

  You will be part of a dedicated sales community supported by
  Account teams, Marketing, Engineering, and Customer Success
  teams that enable you to drive enterprise-wide adoption of
  D365 solutions. You will secure competitive wins against key
  competitors by showcasing Microsoft’s unique
  differentiation, One Microsoft narrative, supporting
  migration and replacement technical plans, and addressing
  technical blockers related to Copilot and AI Agents
  compliance, privacy, and security concerns.

  As a Solution Engineer, you will collaborate with SI
  partners early in the sales cycle to scale technical
  engagements—such as demos, whiteboarding sessions, and
  POCs—supporting customers effectively. You will be
  responsible for increasing D365 F&SC revenue by generating
  new pipeline creation, increased deal velocity and
  competitive share capture by supporting SSP in addressing
  technical proof needs.

  Microsoft’s mission is to empower every person and every
  organization on the planet to achieve more. As employees we
  come together with a growth mindset, innovate to empower
  others, and collaborate to realize our shared goals. Each
  day we build on our values of respect, integrity, and
  accountability to create a culture of inclusion where
  everyone can thrive at work and beyond. 

  Responsibilities

  Build Strategy • Acts as the voice of the customer (VOC) by
  driving new feedback, blockers, insights, and resources
  (e.g., unified action tracker [UAT], technical feedback
  platform) across territories so they can be added and
  prioritized. Represents the customer to product teams (e.g.,
  Engineering) to shape products and services by providing
  insights across the territory. • Captures core customer
  compete knowledge across solution areas and delivers back to
  product and engineering teams to enhance team capabilities
  and develop compete strategies. • Provides strategic,
  technical, and partner input based on Microsoft capability
  to contribute to strategy development, leveraging partner
  and competitor knowledge. • Works with account teams to
  shape strategic customer win strategy and tailor unique
  Microsoft value messaging to audience. • Monitors and
  analyzes action plans to promote customer usage of
  key/prioritized Microsoft solutions/products that support
  customer’s business outcomes. Identifies opportunities to
  promote usage. responsibility description

  Scale Customer Engagements • Uses knowledge of customer
  context, cross-solution, or portfolio expertise, and
  technical and market/industry knowledge to build credibility
  with customers individually or at scale. • Leverages
  knowledge of programs and investments (e.g., Microsoft
  Technology Center [MTC], exec briefing center, partner
  workshops) and proactively engages with engineering,
  product, and support teams to remediate blockers. • Helps
  ensure consistency and quality of engagements through
  adherence of standards and best practices (e.g., managed
  service provider [MSP], managed certified professional
  [MCP]). Utilizes common sales and delivery methodology for
  the Microsoft sales organization to identify and engage
  customers in new opportunities. Actively seeks and
  incorporates feedback on customer impact to increase
  capabilities. • Proactively helps to maximize impact of
  customer engagements by executing on solutions to blockers.
  • Engages with customer technical and business decision
  makers, and identifying customer needs and issues
  proactively through technical discovery. • Uses knowledge of
  customer context, cross-solution or portfolio expertise, and
  deep technical and market/industry knowledge to build
  credibility with customers individually or at scale. • Leads
  and ensures customer needs are met by showcasing suitable
  Microsoft solutions anchored in insights and business value,
  and influences customer technical buy-in. Utilizes rules of
  engagement (e.g., role boundaries, handoff strategies), and
  leverages knowledge of processes (e.g., Managed Service
  Provider [MSP], co-sell partners), tools, and programs
  (e.g., FastTrack). Searches for customer references to use
  in engagements.

  Scale Through Partners • Engages in partner sell-with
  scenarios by acting as liaison between the partner and team
  and shares visibility on partner resources and processes.
  Supports the development and maintenance of relationships
  with pre-sale team and partners. Self-identifies and selects
  top 5 to 10 go-to partners on proactive and early engagement
  in opportunities.

  Solution Design and Proof • Presents, applies, and
  customizes architecture patterns to partners or customers or
  businesses and drives cross-workload support for Microsoft
  Solutions. • Applies and customizes existing demonstration
  assets. Demonstrates and oversees demonstrations (e.g., pre-
  built demos, architectural design sessions [ADS], proof of
  concept [POC] sessions with partners) of solutions based on
  multiple Microsoft products through early stage engagements.
  Leverages partner/customer teams as needed to prove
  capabilities and integration into customer environment.
  Reviews partner demonstrations and provides feedback to
  ensure alignment with Microsoft standards.. responsibility
  description

  Technical Leadership • Monitors and responds to internal and
  external tech community posts, attends community calls,
  sessions, hackathon, etc., and acts as a mentor for their
  technology area. Contributes and participates in Customer
  Executive Briefing Center sessions. Shares best practices
  internally on community calls and drives recognition of
  Microsoft cloud solutions through presentations and
  engagements with external audiences. • Conducts group
  training or one-to-many events (e.g., workshops, Webinars)
  or leverages existing scale enablement programs to present
  and educate customers and colleagues on the capabilities and
  benefits across Microsoft solutions/products. • Grows domain
  knowledge and practices expertise by communicating with
  customers, partners, and senior colleagues to expand
  knowledge of architecture. Builds their own readiness plan
  and proactively identifies learning gaps.

  Qualifications

  Required/minimum qualifications

  Bachelor's Degree in Computer Science, Information
  Technology, Engineering or related field AND 4+ years
  technical pre-sales or technical consulting experience OR
  equivalent experience.



  Additional or preferred qualifications



  Bachelor's Degree in Computer Science, Information
  Technology, Engineering or related field AND 8+ years
  technical pre-sales or technical consulting experience OR
  equivalent experience.

  4+ years experience with cloud and hybrid, or on premises
  infrastructures, architecture designs, migrations, industry
  standards, and/or technology management.



  Certification in relevant (Microsoft or industry)
  technologies or disciplines (e.g., Microsoft Office 365;
  Power BI; Azure Administrator, Architecture, and Development
  exams; Cloud Platform Technologies; Information Security;
  Architecture).



  Digital Solution Engineering IC4 - The typical base pay
  range for this role across the U.S. is USD $106,400 -
  $203,600 per year. There is a different range applicable to
  specific work locations, within the San Francisco Bay area
  and New York City metropolitan area, and the base pay range
  for this role in those locations is USD $137,600 - $222,600
  per year.



  Certain roles may be eligible for benefits and other
  compensation. Find additional benefits and pay information
