description: |
  As a global leader in cybersecurity, CrowdStrike protects
  the people, processes and technologies that drive modern
  organizations. Since 2011, our mission hasn’t changed —
  we’re here to stop breaches, and we’ve redefined modern
  security with the world’s most advanced AI-native platform.
  We work on large scale distributed systems, processing
  almost 3 trillion events per day and this traffic is growing
  daily. Our customers span all industries, and they count on
  CrowdStrike to keep their businesses running, their
  communities safe and their lives moving forward. We're proud
  to work for a mission-driven company leveraging AI to
  transform the way we work. CrowdStrikers drive their careers
  through flexibility and autonomy while also being expected
  to contribute to a culture of responsible AI adoption,
  experimentation, and innovation. We use an AI-first mindset
  as a force multiplier to proactively and continuously
  accelerate execution, build expertise, uncover insights, and
  solve complex problems. We’re always looking to add talented
  CrowdStrikers to the team who have limitless passion, a
  relentless focus on innovation and a fanatical commitment to
  our customers, our community and each other. Ready to join a
  mission that matters? The future of cybersecurity starts
  with you.

  About the Role: CrowdStrike's marketing team is building an
  agentic AI platform that automates end-to-end workflows. Our
  mission is to reinvent how marketing works at CrowdStrike,
  giving teams the power to move faster, create smarter, and
  drive greater impact.

  You will architect and build the infrastructure behind
  modern marketing execution, from AI agents and orchestration
  pipelines to unified data foundations, internal tooling, and
  production-grade integrations. You will turn high-friction
  workflows into durable operating systems that teams can
  trust and adopt at scale.

  As a Sr. AI Growth Engineer on this team, you'll own the
  technical foundation of this platform. You'll build the
  integrations, infrastructure, UIs and tooling that delivers
  an enterprise-grade system used by marketing teams across
  CrowdStrike. You'll work directly with marketing leadership
  to ship production capabilities fast. This role is ideally
  suited for a builder who can pair product thinking with
  hands-on execution.

  You will embed directly with marketing teams, building
  alongside the people doing the work to solve real
  operational pain points. Success in this role is measured
  not only by what you ship, but by workflows permanently
  transformed, adoption that sticks, and teams that become
  increasingly self-sufficient.

  This role leads the Marketing Engineering pillar and reports
  directly to the VP of Marketing Excellence & Transformation.
  It offers rare greenfield ownership at the intersection of
  AI, marketing operations, and developer tooling, with direct
  visibility to senior marketing leadership. Locations:
  Preference for candidates in Seattle, WA or located remotely
  on the West Coast.

  What You’ll Do:

  - Build integrations: connecting the AI campaign engine to
    CrowdStrike's marketing stack — work management platforms
    (e.g., Workfront), marketing automation systems (e.g.,
    Marketo), collaboration tools (Google Docs, Slack), CMS,
    and digital asset management systems
  - Develop the orchestration layer: that manages multi-agent
    pipelines, state persistence, error recovery, and parallel
    execution
  - Design and build intuitive web UIs: that make AI-powered
    workflows accessible to non-technical marketing users —
    campaign dashboards, workflow builders, approval
    interfaces, and real-time pipeline status views
  - Create production tooling: including HTML/email template
    generation from agent outputs, design asset pipelines
    (PPTX, PDF, SVG), and content publishing workflows
  - Build analytics infrastructure: performance dashboards,
    agent quality scoring, A/B test tracking, and feedback
    loops from distribution metrics back into the agent system
  - Design, build, and deploy custom AI agents: and agentic
    workflows that integrate AI APIs, MCP servers, automation
    platforms, and enterprise systems into our GTM motion
  - Implement auth, permissions, and multi-tenancy: so multiple
    marketing teams and campaign owners can run pipelines
    concurrently with appropriate access controls
  - Own CI/CD and reliability: automated testing for agent
    outputs, regression detection, deployment pipelines,
    monitoring and alerting
  - Optimize performance: caching, parallelization, and cost
    management for LLM API calls across high-volume campaign
    runs
  - Partner closely with Performance Marketing, Digital
    Intelligence, Engineering, and marketing leadership: to
    ensure the roadmap is technically sound, operationally
    meaningful, and connected to business outcomes

  What You’ll Need:

  - 8+ years of full-stack engineering experience with Python
    and modern JavaScript or TypeScript
  - Bachelor's degree in Computer Science, Software Engineering,
    or a related technical field — or equivalent practical
    experience
  - Frontend engineering experience: you've built production web
    applications with React (or equivalent) and understand how
    to design interfaces that drive adoption with non-
    technical users
  - Production experience with LLM/AI APIs: you've built and
    shipped systems that call Claude, GPT, or similar models
    at scale, and you understand token management, rate
    limiting, error handling, reliability, and cost
    optimization
  - Demonstrated experience with AI agents: you've designed,
    built, and deployed agentic workflows that transformed
    real work, not just isolated experiments
  - Experience building evaluation frameworks: for AI systems,
    including prompt evals, output quality scoring,
    benchmarking, and testing against clear baselines
  - Strong systems design skills: you can architect a multi-
    service platform, design APIs, and make infrastructure
    decisions that hold up as the system scales
  - Integration experience: you've connected systems via REST
    APIs, webhooks, OAuth, and worked with enterprise tools
    (project management, CMS, marketing automation platforms)
  - A strong builder mindset: you would rather ship a working
    v1, learn quickly, and iterate than spend a quarter
    talking about what might be possible. You thrive in
    ambiguity, make smart architectural calls, and create
    clarity where none exists yet
  - Strong communication skills and a genuine ability to
    translate technical concepts for non-technical audiences
  - Working knowledge of CI/CD, containerization, cloud
    infrastructure, and observability (AWS preferred)
  - Proven experience utilizing AI technologies to enhance
    decision-making, streamline workflows and processes,
    improve efficiency and drive business outcomes.

  Bonus Points:

  - Experience with multi-agent AI systems, LLM orchestration
    frameworks (LangChain, CrewAI, Claude Code agents), or
    building AI-powered automation at scale
  - Experience working closely with marketing teams or building
    systems for marketers as end users — familiarity with work
    management platforms (e.g., Workfront, Asana), marketing
    automation systems (e.g., Marketo, HubSpot), CMS
    platforms, or the campaign lifecycle
  - Experience building internal platforms, developer tools, or
    self-service systems where other teams are your customers
  - Experience building workflow builders, drag-and-drop
    interfaces, or low-code/no-code platforms — an eye for UX
    and tools that non-engineers actually enjoy using
  - Familiarity with document and content pipelines — HTML email
    rendering, PDF or PPTX generation, structured publishing
    workflows, or turning structured data into polished visual
    outputs
  - Familiarity with vector databases, embeddings, retrieval
    systems, and RAG architectures
  - Background in marketing operations, RevOps, digital product
    management, personalization, or journey orchestration
  - Experience leading technical teams or influencing technical
    direction across functions
  - Contributions to open-source AI or automation projects, or a
    track record of strong technical writing
  - Prior work in high-growth B2B SaaS or cybersecurity
    environments

  #LI-SC1

  #LI-Remote

