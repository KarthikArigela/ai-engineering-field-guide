title: Senior Full-Stack Product Engineer, AI Products
company: Solv.
location: USA
remote: true
work_type: FULL_TIME
description: |
  Being sick or injured is painful. Getting better shouldn’t
  be.

  Most industries have been transformed by new technology.
  Healthcare is still waiting — and you can help change that.

  Our mission is simple but ambitious: make healthcare
  accessible, transparent, and effortless for all. We put the
  consumer at the center, move fast and partner with forward-
  thinking providers to deliver software that makes care
  better, faster, and more human. This is work with real-world
  stakes — and you can help lead the way.

  Solv is building AI-powered healthcare infrastructure that
  makes everyday care easier for patients and the teams who
  care for them—from finding and receiving care to helping
  clinics reduce manual work, improve access, and run better
  operations.

  Near-term work will likely include voice and other AI agents
  supporting scheduling, billing, and additional healthcare
  workflows. However, this is a broader product-engineering
  role, and the problems and technologies will evolve.

  We’re looking for a senior generalist with strong web
  fundamentals, product judgment, curiosity, and ownership.
  You will work closely with a product manager to shape
  solutions while owning technical decisions, execution,
  production quality, and results.

  You do not need to have worked professionally on an AI-
  native team, but meaningful hands-on AI work is required.
  That experience may come from production work, internal
  tools, prototypes, open source, personal projects, or self-
  directed experimentation.

  You can expect to:

  - Partner with product, design, customers, and engineers to
    turn business and user problems into shipped improvements.
  - Build across the full stack, including frontend experiences,
    backend services, APIs, relational data models,
    integrations, and AI-powered workflows.
  - Take ideas from early exploration through implementation,
    production rollout, and iteration.
  - Build scrappy prototypes to learn quickly, then develop
    reliable production systems when an opportunity is proven.
  - Improve AI systems using evaluations, production traces,
    customer feedback, product data, and operational signals.
  - Design for uncertainty through testing, observability,
    guardrails, fallbacks, auditability, and human escalation.
  - Build enterprise healthcare products that account for
    privacy, permissions, edge cases, data quality,
    reliability, and supportability.
  - Explore new AI capabilities while balancing speed, quality,
    safety, cost, customer value, and maintainability.
  - Use AI development tools extensively while retaining
    ownership of technical decisions and production quality.

  You’d be great for this role if you:

  - Have 5+ years of experience building and maintaining
    production web applications.
  - Have strong senior-level fundamentals across frontend
    development, backend architecture, APIs, relational
    database design, testing, performance, and production
    debugging.
  - Take ownership of ambiguous problems: you investigate
    deeply, create clarity, make sound decisions, and drive
    work forward without waiting for a fully specified
    solution.
  - Have built or deeply explored an AI system beyond basic
    prompting or a thin API wrapper. Examples include a RAG
    pipeline, automated or tool-using agent, evaluation
    system, AI workflow, or model adaptation or post-training
    experiment.
  - Can explain what you built, why you chose the approach,
    where it failed, how you evaluated it, and what you
    learned.
  - Actively investigate emerging AI capabilities through hands-
    on experimentation and can identify where they may create
    meaningful product or business value.
  - Know how to move quickly without confusing a promising
    prototype with a production-ready system.
  - Work effectively with product managers while independently
    owning technical decisions and execution.
  - Are willing to talk directly with customers, understand
    their workflows, and turn their problems into shipped
    improvements.
  - Are motivated by measurable patient, customer, and business
    outcomes.
  - Bring high standards, low ego, and a willingness to dig into
    whatever problem will help the team succeed.

  Nice to have:

  - Experience with LLM applications, agents, retrieval, tool
    calling, evaluations, or AI observability.
  - Experience with voice systems, telephony, or conversational
    interfaces.
  - Experience with healthcare workflows, HIPAA, or protected
    health information.
  - Experience building enterprise products with complex
    integrations and operational workflows.
  - Experience with React, Remix, TypeScript, Python, FastAPI,
    Postgres, or similar technologies.

  This is fundamentally a senior product-engineering role, not
  an ML research position. Our technical interview is grounded
  in frontend, backend, APIs, system design, and relational
  database design. We will also want to understand what you
  have built with AI, how deeply you explored it, and what you
  learned.

  Salary ranges vary by location and experience level:

  - San Francisco & New York: $160,000 - $210,000
  - Colorado: $150,000 - $200,000
  - All other locations: $150,000 - $210,000

  Solv offers robust benefits including:

  - Solv equity for full time US based employees
  - Medical, Dental, Vision Insurance - 100% for employees
  - 401k plan available
  - Up to 12 weeks of paid Parental Leave
  - Monthly Wellness Reimbursement
  - Flexible Time Off
  - Company Paid Life Insurance, LTD, and STD
  - Company contribution towards HSA
  - Medical and Dependent care FSAs available

  This position is being hired on an urgent basis. The
  application window may close before August 31 if a
  sufficient number of applications to select a candidate are
  received prior to that date.

  Unfortunately, we are unable to sponsor visas at this time.
