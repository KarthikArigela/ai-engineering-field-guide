description: |
  Since 1998, Businessolver has delivered market-changing
  benefits technology and services supported by an intrinsic
  responsiveness to client needs. The company creates client
  programs that maximize benefits program investment, minimize
  risk exposure, and engage employees with easy-to-use
  solutions and communication tools to assist them in making
  wise and cost-efficient benefits selections. Founded by HR
  professionals, Businessolver's unwavering service-oriented
  culture and secure SaaS platform provide measurable success
  in its mission to provide complete client delight.

  **Please be aware of recruitment scams. Businessolver does
  not make job offers outside of our official hiring process
  or request payment or sensitive personal information.  You
  will never receive an offer of employment without meeting a
  hiring authority and having a "live" and face-to-face
  conversation.**

  Job Summary:

  The Principal Test Engineer comes with proven success
  applying AI to test automation and quality assurance. This
  individual is responsible for improving product quality,
  reducing dependency on manual processes and increasing
  overall testing efficiency. They help to define and advance
  our enterprise testing strategy, maintain and evolve the UI
  automation framework, support load and performance testing
  and ensure test coverage aligns to system architecture,
  product risk, and delivery priorities. The Principal Test
  Engineer develops agent-driven manual and automated tests
  and guides the adoption of agentic testing practices
  utilizing best in class AI and testing technologies across
  engineering, product, and architecture teams to increase
  throughout while elevating quality.

  The Gig:

  - Develop AI Agents that perform manual and automated testing
    to support rapid delivery of code changes.
  - Drive the development and adoption of agent-driven manual
    and automated testing practices to improve test creation,
    execution efficiency, coverage, and defect detection.
  - Define and maintain the overall testing strategy across
    unit, integration, API, UI, regression, exploratory,
    performance, and risk-based testing.
  - Own the direction, maintenance, and continuous improvement
    of the UI automation framework, with emphasis on
    reliability, scalability, reuse, speed, and long-term
    maintainability.
  - Lead the technical approach for performance and load
    testing, including test design, tooling direction,
    coverage priorities, result analysis, and recommendations
    for system improvement.
  - Build a strong understanding of system architecture,
    application workflows, integrations, and technical
    dependencies, and align testing strategy to the areas of
    highest business and technical risk.
  - Establish, document, and refine testing standards,
    engineering best practices, and quality guardrails that
    improve consistency and reduce defect escape.
  - Provide hands-on technical leadership in test design,
    framework enhancement, troubleshooting, and resolution of
    complex quality and automation challenges.
  - Mentor members of the quality team in sound testing
    practices, including stronger use of unit and integration
    testing.
  - Partner with software engineers, architects, product teams,
    and other stakeholders to influence quality strategy early
    in solution design and throughout delivery.
  - Evaluate and recommend testing tools, frameworks, and
    methodologies that improve productivity, test signal
    quality, and long-term supportability.
  - Review test coverage, quality risks, and validation
    approaches for new features and platform changes, and
    communicate clear recommendations to technical and non-
    technical stakeholders.
  - Promote continuous improvement.
  - Comply with all standards and policies.
  - All other duties as required.

  What you need to make the cut:

  - Bachelor degree in computer science, engineering or a
    related field or equivalent practical experience.
  - 8+ years of experience in quality assurance, software
    engineering, or a related field, with a strong focus on
    automated and manual testing strategies in high-volume
    environments.
  - Proven success using AI-assisted and agent-driven testing to
    improve coverage, efficiency, and quality outcomes.
  - Experience developing and executing enterprise test
    strategies across unit, integration, API, UI, regression,
    exploratory, performance, and risk-based testing.
  - Strong expertise with automation frameworks and tools
    including TestNG, JUnit, Selenium, API testing tools, and
    related quality technologies.
  - Experience with performance and load testing, including test
    design, analysis, and actionable recommendations.
  - Strong understanding of system architecture, integrations,
    and technical dependencies, with the ability to align
    testing to business and technical risk.
  - Ability to establish testing standards, best practices, and
    quality guardrails that improve consistency and reduce
    defects.
  - Experience mentoring engineers in effective unit and
    integration testing practices.
  - Hands-on technical leadership in test design, framework
    strategy, troubleshooting, and automation improvements.
  - Ability to collaborate with engineering, architecture,
    product, and business teams to influence quality
    throughout delivery.
  - Excellent written and verbal communication skills with
    technical and non-technical audiences.
  - Experience with Git and collaborative development practices.

  Preferred

  - Experience supporting quality engineering in SaaS, cloud, or
    distributed application environments.
  - Proficiency in Java, Python, XML, or similar technologies
    used in test automation.
  - Knowledge of object-oriented programming and automation
    framework design.
  - Experience evaluating and implementing new testing tools,
    frameworks, and practices.
  - Familiarity with API testing, performance testing, and
    broader quality governance.

  The pay range for this position is 93K to 140K per year (pay
  to be determined by the applicant’s education, experience,
  knowledge, skills, and abilities, as well as internal equity
  and alignment with market data).

  This role is eligible to participate in the quarterly bonus
  incentive plan.

  Other Compensation:  If this position is full-time or part-
