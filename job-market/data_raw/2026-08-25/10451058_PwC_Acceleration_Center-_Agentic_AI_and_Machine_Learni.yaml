description: |
  The Opportunity As an Acceleration Center- Agentic AI and
  Machine Learning Developer- Senior Associate, you will play
  a pivotal role in transforming raw data into actionable
  insights, enabling informed decision-making and driving
  business growth. Within our Risk & Regulatory practice, you
  will apply data, algorithms, and software engineering to
  build and deploy AI and Machine Learning solutions at scale.
  As a Senior Associate, you will focus on building meaningful
  client connections and learning how to manage and inspire
  others. You will navigate increasingly complex situations,
  growing your personal brand and deepening your technical
  skills. You are expected to anticipate the needs of your
  teams and clients, and to deliver quality work. In this role
  at PwC, you will design AI systems, engage in data
  wrangling, and implement software to enable scalable AI
  models. You will use a broad range of tools and
  methodologies to generate new ideas and solve problems,
  while developing a deeper understanding of the business
  context and how it is evolving. Your work will contribute to
  the broader objectives of your projects, fitting into the
  overall strategy and reinforcing professional and technical
  standards. Responsibilities
  - Designing and implementing AI and machine learning solutions
    to transform raw data into actionable insights
  - Developing scalable software and platform systems using
    advanced algorithms and data engineering techniques
  - Collaborating with clients to understand their needs and
    deliver tailored data solutions
  - Utilizing programming languages such as Python and Java to
    build and deploy AI models
  - Integrating data from various sources to enhance data
    quality and infrastructure
  - Applying machine learning libraries like TensorFlow and
    Scikit-Learn to optimize model performance
  - Conducting complex data analysis to support informed
    decision-making and business growth
  - Building and maintaining data pipelines to streamline data
    processing and analysis
  - Leveraging natural language processing tools to develop
    innovative text analytics solutions
  - Mentoring junior team members and guiding them in technical
    and professional development
  What You Must Have
  - At least a Bachelor's degree
  - At least 2 years of experience
  What Sets You Apart
  - Preference for at least one of the following fields of
    study: Analytics/Data Science, Artificial
    Intelligence/Robotics, Computer Science/Information
    Systems, Engineering
  - At least one of the following: Certifications aligned to
    data engineering, machine learning, and cloud platforms,
    including AWS, Google Cloud, Microsoft Azure, Databricks,
    Snowflake, or related data and AI credentials
  - Demonstrating proficiency in AI implementation and machine
    learning libraries
  - Utilizing Python and Java for complex data analysis and
    modeling
  - Excelling in data integration and data pipeline development
  - Applying natural language processing techniques for text
    analytics
  - Leveraging TensorFlow and Scikit-Learn for deep learning
    projects
  The salary range for this position is: $77,000 - $202,000.
  Actual compensation within the range will be dependent upon
  the individual's skills, experience, qualifications and
  location, and applicable employment laws. All hired
  individuals are eligible for an annual discretionary bonus.
