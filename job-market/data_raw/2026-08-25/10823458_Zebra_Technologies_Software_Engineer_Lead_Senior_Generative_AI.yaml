description: |
  Overview:

  At Zebra, we are a community of innovators who come together
  to create new ways of working. United by curiosity and a
  culture of caring, we develop smart solutions that
  anticipate our customer’s and partner’s needs and solve
  their challenges.

  Being part of Zebra Nation means you are seen, heard,
  valued, and respected. Drawing from our unique perspectives,
  we collaborate to deliver on our purpose. Here you are part
  of a team pushing boundaries today to redefine the work of
  tomorrow for organizations, their employees, and those they
  serve.

  You’ll have opportunities to learn and lead in a forward-
  thinking environment, defining your path to a fulfilling
  career while channeling your skills toward causes you care
  about—locally and globally.

  Come make an impact every day at Zebra.

  What We're Looking For:

  We are seeking an experienced and strategic-minded Senior AI
  Software Engineer to lead our initiatives in artificial
  intelligence and workflow automation. In this role, you will
  be instrumental in exploring, designing, and deploying AI
  agents and applications that drive enterprise intelligence
  and operational efficiency. You will bridge the gap between
  traditional software engineering and cutting-edge AI
  technologies, setting the standard for AI integration within
  our organization.

  Responsibilities

  - AI Agent Development: Lead the design, architecture, and
    deployment of intelligent AI agents utilizing modern
    frameworks (e.g., LangGraph) and LLM APIs (e.g., OpenAI
    API) to solve complex enterprise challenges.
  - Automation & Workflow Management: Architect, establish, and
    refine guardrails and best practices for automation script
    development. Ensure robust execution and seamless
    integration with existing enterprise asset systems.
  - Technical Problem Solving: Troubleshoot complex system
    integrations, manage API security (including key
    management and SSL configuration), and optimize Python-
    based AI workflows for scalability and performance.
  - Strategic Alignment: Collaborate with technical leadership
    to shape the internal AI strategy, identifying high-impact
    use cases for AI tools that benefit broader organizational
    goals.
  - Technical Documentation & Mentorship: Draft, review, and
    maintain high-quality internal documentation for
    operational procedures. Present technical concepts and
    process alignments clearly to leadership and cross-
    functional teams.

  Required Skills & Qualifications:

  - Technical Proficiency: Expert-level programming skills in
    Python, with a deep understanding of core modules relevant
    to AI, data processing, and automation.
  - AI/LLM Expertise: Proven, hands-on experience working with
    Large Language Models (LLMs), prompt engineering, and
    agentic workflows (e.g., LangChain, LangGraph, OpenAI
    ecosystem).
  - System Architecture: Strong background in enterprise
    software development, API integrations, and secure
    deployment practices.
  - Soft Skills: Exceptional professional communication skills,
    with the ability to translate complex technical concepts
    into clear, actionable documentation for leadership review
    and team alignment.

  Experience Level:

  - Senior-Level: 6 to 8 years of overall software engineering,
    system architecture, or backend development experience.
  - AI Specialization: 1 to 2 years of dedicated, hands-on
    experience specifically in AI development, LLM
    integration, and building generative AI application

  Benefits:

  We understand the importance of work-life balance and
  wellbeing, which is why we offer flexibility for our teams
  including: hybrid work, adaptable hours, Summer Flex
  Fridays, Focus Fridays, and an annual companywide well-being
  day to promote revitalization and success.



  Job Posting Statement:

  To protect candidates from falling victim to online
  fraudulent activity involving fake job postings and
  employment offers, please be aware our recruiters will
  always connect with you via @zebra.com email accounts.
  Applications are only accepted through our applicant
  tracking system and only accept personal identifying
  information through that system. Our Talent Acquisition team
  will not ask for you to provide personal identifying
  information via e-mail or outside of the system. If you are
  a victim of identity theft contact your local police
  department.

  AI Technology Statement:

  Zebra Technologies leverages AI technology to evaluate job
  applications using objective, job-relevant criteria. This
  approach enhances efficiency and promotes fairness in the
  hiring process. However, every decision regarding interviews
  and hiring is made by our dedicated team, because we believe
  people make the best decisions about people. For more on how
  we use technology in hiring and how we process applicant
  data, see our Zebra Privacy Policy.
