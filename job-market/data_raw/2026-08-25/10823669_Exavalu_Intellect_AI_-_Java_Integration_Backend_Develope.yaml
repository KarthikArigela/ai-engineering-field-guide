description: |
  This is a remote position.

  Overview :

  We are looking for an experienced Senior Java Developer /
  Technical Lead with strong expertise in Spring Boot, AWS
  Cloud, Microservices, Workflow Management (jBPM), Business
  Rules (Drools), and Enterprise System Integration.

  The ideal candidate will be responsible for designing,
  developing, and maintaining scalable enterprise applications
  while integrating with multiple enterprise systems such as
  Policy Administration Systems (PAS), CRM, SSO, Document
  Management Systems (DMS), Email services, and other third-
  party platforms.

  The role requires hands-on experience in developing cloud-
  native applications, workflow orchestration, business rule
  implementation, API integration, and enterprise-grade
  backend services.

   Key Responsibilities Application Development


  - Design, develop, and maintain scalable enterprise
    applications using Java and Spring Boot.
  - Develop RESTful APIs and microservices following enterprise
    design standards.
  - Build secure, high-performance, and highly available backend
    services.

  Cloud & Microservices


  - Develop and deploy cloud-native applications on AWS.
  - Design and implement microservices architecture with
    scalable deployment strategies.
  - Work with cloud services to ensure reliability, monitoring,
    and scalability.

  Workflow & Business Rules


  - Design and configure business workflows using jBPM.
  - Develop and manage business rules using Drools.
  - Configure workflow lifecycle, human tasks, approvals, and
    business rule execution.
  - Optimize workflow and rule engine performance.

  Enterprise System Integration

  Develop integrations with enterprise platforms including:



  - Policy Administration Systems (PAS)
  - Customer Relationship Management (CRM)
  - Single Sign-On (SSO)
  - Email Services
  - Document Management Systems (DMS)
  - Third-party APIs
  - Internal enterprise applications

  Design:



  - REST APIs
  - Service integrations
  - Data mappings
  - Error handling
  - Retry mechanisms
  - Secure API communication

  Database Development


  - Design and optimize database schemas.
  - Develop queries and stored procedures where required.
  - Work with:
    - MongoDB
    - PostgreSQL

  Technical Leadership


  - Collaborate with Solution Architects, Product Owners,
    Business Analysts, and QA teams.
  - Participate in technical design discussions.
  - Conduct code reviews and ensure adherence to coding
    standards.
  - Troubleshoot production issues and provide technical
    guidance to development teams.

