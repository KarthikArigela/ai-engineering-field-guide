description: |
  As a highly skilled and hands-on AI Engineer (m/f/d) you
  will play a key role in our technology team.

  Your Responsibilities

  - Design, develop, and implement AI agents that execute
    complex, multi-step business tasks end-to-end within
    defined guardrails
  - Use Anthropic Claude, Microsoft Azure, Databricks, and
    related AI and cloud technologies to build scalable,
    reliable, and secure agentic applications
  - Work closely with business departments to identify high-
    value use cases, understand business processes, co-design
    AI agent concepts, and translate requirements into
    technical solutions
  - Develop proof of concepts and prototypes rapidly, validate
    feasibility and business value, and evolve successful
    solutions into production-ready applications
  - Implement integrations with enterprise data sources, APIs,
    workflow systems (Bizagi), RPA solutions (UIPath),
    document repositories, and Databricks-based data products
  - Develop prompt logic, orchestration flows, retrieval-
    augmented generation patterns, evaluation frameworks, and
    automated tests for AI agent performance and reliability
  - Apply software engineering best practices including clean
    coding, version control, CI/CD, testing, monitoring,
    logging, documentation, and maintainable architecture
  - Ensure that AI agents are designed with appropriate
    security, privacy, access control, auditability,
    explainability, and human oversight mechanisms
  - Collaborate with data engineering, information security,
    compliance, and business teams to ensure solutions are
    aligned with enterprise architecture and AI governance
    requirements
  - Support controlled rollout, user testing, feedback
    collection, adoption, and continuous improvement of AI
    agents in business operations
  - Contribute to the development of reusable AI engineering
    patterns, standards, templates, and best practices to
    scale agent development across the organization

  What we look for

  - Strong practical experience in developing AI agents, AI-
    powered applications, or complex automation solutions
    using large language models
  - Hands-on experience with modern foundation models and AI
    development environments, ideally including Anthropic
    Claude and Microsoft Azure AI services
  - Solid software development experience, preferably with
    Python, and a good understanding of APIs, backend
    development, data pipelines, and cloud-native application
    design
  - Experience with cloud platforms, ideally Microsoft Azure,
    including deployment, security concepts, identity and
    access management, monitoring, and scalable infrastructure
    patterns
  - Experience with Databricks, data lakehouse architectures,
    data engineering, SQL, or analytics environments is highly
    desirable
  - Understanding of retrieval-augmented generation, agent
    orchestration, tool use, prompt engineering, model
    evaluation, and responsible AI principles
  - Ability to translate business processes and user needs into
    pragmatic technical solutions that deliver measurable
    business value
  - Structured problem-solving mindset, strong analytical
    skills, and the ability to work independently in an
    emerging and fast-moving technology field
  - Strong communication skills and the ability to collaborate
    effectively with both technical teams and non-technical
    business stakeholders
  - Awareness of information security, data protection,
    regulatory, and governance requirements related to
    enterprise AI solutions
  - Fluent in English; German is a plus

  What we offer

  - Flexible working: A hybrid working model with an average of
    two remote working days per week
  - Personal Development: Extensive internal training and
    development opportunities via our PATRIZIA Academy
  - International & inclusive environment: An inclusive, equal-
    opportunity workplace within an international company,
    actively promoted by our ED&I Council
  - Time for social engagement: Two additional days’ leave, e.g.
    for projects run by our PATRIZIA Foundation
  - Strong community spirit: Active employee initiatives and
    networks

  Sounds like you?

  If you want to create a better tomorrow with us, we want to
  hear from you via our job portal
  (www.patrizia.ag/en/career). Together, let's make a positive
  impact.

  We’re proud to be an equal opportunity workplace.

  At PATRIZIA, we are committed to leading the industry in how
  we advance the equity, diversity and inclusion of our global
  teams. The opinion and experience of each individual counts.
  With inherent trust in each other, we do our greatest work
  steeped in courage, integrity, optimism and tenacity.

