  Life at Unity

  Unity [NYSE: U] is the world’s leading game engine, powering
  play for more than 3 billion consumers each month. The top
  mobile games in the world, the most played PC indie titles,
  the most innovative console games, and virtually all of the
  top XR and Web Games are developed, deployed, and grown in
  Unity. Unity also enables teams across industries like
  automotive, manufacturing, and healthcare to design,
  simulate, and collaborate in 3D — closing the gap between
  ideas and reality. For more information, please visit
  www.unity.com.

