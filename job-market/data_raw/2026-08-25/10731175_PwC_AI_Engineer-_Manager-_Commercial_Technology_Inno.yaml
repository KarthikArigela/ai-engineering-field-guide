description: |
  The Opportunity As an AI Engineer- Manager- Commercial
  Technology & Innovation, you will play a pivotal role in
  transforming raw data into actionable insights, enabling
  informed decision-making and driving business growth. Within
  our Advisory practice, you will leverage advanced
  technologies and techniques to design and develop robust
  data solutions for clients. As a Manager, you will motivate,
  develop, and inspire others to deliver quality, while
  coaching and managing performance to meet client
  expectations. You will articulate our purpose and values
  meaningfully, embracing technology and innovation to enhance
  delivery. In this role at PwC, you will apply data,
  algorithms, and software engineering to build and deploy AI
  and Machine Learning solutions at scale. Your work will
  involve designing AI systems, data wrangling, and software
  implementation to enable scalable AI models. You will take
  ownership of projects, confirming their successful planning,
  budgeting, execution, and completion. By partnering with
  team leadership, you will confirm collective ownership of
  quality, timelines, and deliverables, while encouraging
  skill development beyond comfort zones. Your leadership will
  be instrumental in addressing conflicts and upholding
  professional standards, contributing to the firm's success.
  Responsibilities
  - Designing and implementing AI systems to transform raw data
    into actionable insights
  - Leading teams in the development of scalable machine
    learning solutions
  - Applying advanced data wrangling techniques to support AI
    model deployment
  - Utilizing programming languages such as Python and C++ for
    AI software development
  - Managing data infrastructure and integration to enhance data
    quality and accessibility
  - Overseeing the creation and maintenance of data pipelines
    and modeling processes
  - Leveraging machine learning libraries like TensorFlow and
    Scikit-Learn for model training
  - Conducting complex data analysis to drive informed decision-
    making and business growth
  - Collaborating with stakeholders to identify opportunities
    for AI-driven innovation
  - Mentoring team members to develop their skills and encourage
    professional growth
  What You Must Have
  - At least a Bachelor's degree
  - At least 5 years of experience
  What Sets You Apart
  - Preference for at least one of the following fields of
    study: Analytics/Data Science, Artificial
    Intelligence/Robotics, Computer Science/Information
    Systems, Engineering
  - At least one of the following: Certifications aligned to
    data engineering, machine learning, and cloud platforms,
    including AWS, Google Cloud, Microsoft Azure, Databricks,
    Snowflake, or related data and AI credentials
  - Demonstrating proficiency in AI implementation and machine
    learning libraries
  - Utilizing Python and C++ for complex data analysis and
    modeling
  - Excelling in data integration and infrastructure management
  - Implementing neural networks and reinforcement learning
    agents
  - Leading projects with strategic planning and execution
  The salary range for this position is: $99,000 - $232,000.
