description: |
  Job Description SummaryGE Vernova’s Advanced Research
  business is the central innovation engine for GE’s portfolio
  of energy businesses, which is unified under one banner
  called GE Vernova. The research organization is made up of
  300+ researchers representing virtually every major
  scientific and engineering discipline. Collectively, they
  are driving major research programs and initiatives to
  decarbonize power, accelerate renewables, and promote
  electrification and the creation of a 21st century grid fit
  to power a zero-carbon energy future. We are seeking a
  highly motivated and experienced Lead Researcher to join our
  team in the field of Artificial Intelligence, Machine
  Learning (AIML). As a Lead Research Engineer, you will lead
  and drive cutting-edge projects that leverage AIML and
  computer vision techniques for the development of state-of-
  the-art visual inspection, anomaly detection, prognostics,
  diagnostics, and modelling solutions.

  Job Description

  Roles and responsibilities

  - Develop and implement algorithms and methodologies in
    artificial intelligence, machine learning (AIML), and
    computer vision to support process and product innovation.
  - Analyze extensive datasets to identify complex patterns,
    trends, and insights, with an emphasis on computer vision-
    based diagnostics, visual inspection, and prognostics for
    energy equipment.
  - Design and optimize AIML and computer vision algorithms and
    models, including convolutional neural networks and
    generative models, to ensure strong performance and
    scalability.
  - Design and conduct experiments to assess the efficacy and
    reliability of AIML-based solutions.
  - Document research findings, methodologies, and
    implementation strategies for effective knowledge sharing
    and future reference.
  - Collaborate with cross-functional teams, including
    engineers, researchers, and product managers, to integrate
    AIML solutions into existing system platforms.
  - Stay current with advancements in AIML, computer vision,
    control systems, and signal processing engineering.
  - Contribute to research initiatives to conceptualize and
    develop AI and computer vision solutions for industrial
    challenges, including image-based defect detection, object
    recognition, and visual analytics.
  - Support junior team members and contribute to project
    execution, ensuring alignment with strategic objectives.
  - Demonstrate the impact of AI through prototypes and
    solutions that address real-world problems.
  - Utilize best practices in software libraries, tools, and
    methodologies to implement efficient, scalable, and
    reusable solutions.
  - Contribute to intellectual property development by authoring
    invention disclosures and supporting patent filings.
  - Publish research in scientific journals and present findings
    at conferences.

  Required Qualifications:

  - PhD with 5+ years relevant experience or Masters with 7+
    years relevant experience from a reputed institution.
  - Strong understanding and experience in machine learning,
    artificial intelligence, computer vision, and related
    fields, with expertise in image processing, object
    detection, segmentation, and deep learning architectures
    (e.g., CNNs, Vision Transformers).
  - Demonstrated ability to apply advanced AIML and computer
    vision concepts to practical applications, including
    industrial visual inspection, image classification, and
    object detection.
  - Proficiency in programming languages and frameworks commonly
    used in AIML and computer vision applications, such as
    Python, TensorFlow, PyTorch, OpenCV, and related
    libraries.
  - Experience in data analysis and manipulation using tools
    like pandas, NumPy, and familiarity with software
    development best practices, including version control
    (e.g., Git) and agile methodologies.
  - Strong problem-solving skills and ability to think
    critically and creatively.
  - Excellent communication skills and ability to work
    effectively in a collaborative team environment.
  - Ability to build prototypes and develop proof-of-concepts to
    illustrate solution feasibility.

  Additional Information

  Relocation Assistance Provided: Yes
