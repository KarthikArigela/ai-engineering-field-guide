description: |
  We are looking for a passionate and driven Full Stack
  Development Intern who has a strong interest in AI tools and
  modern development practices. This internship is ideal for
  candidates who love building projects, experimenting with
  AI-powered tools, and continuously upgrading their technical
  skills.

  Key Responsibilities:

  - Assist in designing, developing, and maintaining web
    applications (frontend + backend).

  - Build responsive user interfaces using modern frameworks.

  - Develop REST APIs and integrate third-party services.

  - Use AI tools (e.g., ChatGPT, Copilot, APIs) to improve
    development efficiency and problem-solving.

  - Contribute to AI-powered features such as chatbots,
    automation tools, smart dashboards, or AI-based search.

  - Debug, test, and optimize applications for performance and
    scalability.

  - Document development processes and project workflows.

  Requirements

  - Currently pursuing or recently completed a
    Bachelor’s/Master’s degree in Computer Science, IT, or a
    related field.

  - Basic knowledge of HTML, CSS, JavaScript.

  - Understanding of backend (Node.js / Python / PHP / Java –
    any one).

  - Basic understanding of frontend frameworks.

  - Understanding of databases (MySQL / MongoDB / PostgreSQL).

  - Familiarity with Git and version control.

  - Regular use of AI coding tools such as Cursor, Claude Code,
    GitHub Copilot, or ChatGPT for development workflows.

  - Ability to write effective prompts for generating,
    debugging, and refactoring code.

  - Familiarity with integrating AI APIs (OpenAI, Anthropic,
    etc.) into web or backend projects.

  - Understanding of how to collaborate with AI tools as a “co-
    developer” in daily coding.
