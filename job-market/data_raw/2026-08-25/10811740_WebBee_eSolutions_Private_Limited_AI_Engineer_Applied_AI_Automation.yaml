title: "AI Engineer (Applied AI & Automation)"
company: WebBee eSolutions Private Limited
location: Noida, IND
work_type: FULL_TIME
company_size: 84 Employees
description: |
  We are looking for an Applied AI Engineer to work closely
  with the founder on a range of high-impact AI initiatives
  across the company.

  This is a hands-on builder role for someone who enjoys
  turning ideas into working systems. You will help us use AI
  to improve internal processes, productivity, and decision-
  making, while also building AI-powered capabilities for our
  products and for customer use cases.

  This is not a research-only role. We are looking for someone
  practical, curious, fast-moving, and product-minded—someone
  who can experiment quickly, validate what works, and help us
  ship real outcomes.



  What you will work on

  - Build internal AI tools and workflows to improve team
    productivity and business operations
  - Design and implement AI-powered features for our SaaS
    products
  - Prototype and productionize customer-facing AI use cases
  - Work on LLM-based applications, agents, assistants,
    copilots, and workflow automation
  - Evaluate models, prompts, tools, and architectures for
    reliability, cost, and performance
  - Integrate AI systems with APIs, databases, CRMs, ERPs,
    support tools, and internal platforms
  - Collaborate directly with the founder, product, engineering,
    and business teams to identify valuable use cases
  - Move quickly from idea to proof of concept to production
  - Help define good engineering practices for AI development,
    testing, monitoring, and iteration



  Requirements

  - Strong software engineering fundamentals
  - Good hands-on experience with Python and backend/API
    development
  - Experience building with LLMs and GenAI tools in real
    applications
  - Familiarity with prompt engineering, RAG, embeddings, vector
    databases, agents, and evaluation workflows
  - Experience integrating third-party APIs and SaaS systems
  - Comfort working across ambiguity and solving business
    problems, not just technical tasks
  - Ability to think like both an engineer and a product builder
  - Strong communication skills and ownership mindset

  - Experience with cloud platforms and deployment workflows
  - Exposure to orchestration/frameworks such as LangChain,
    LlamaIndex, or similar tools
  - Experience with data pipelines, search, retrieval, and
    knowledge systems
  - Experience building internal automation tools or customer-
    facing AI products
  - Familiarity with basic MLOps / observability / evaluation
    practices
  - Experience in SaaS, eCommerce, ERP, integration, or
    workflow-heavy products



  What success looks like in this role

  - You identify meaningful AI opportunities, not just flashy
    demos
  - You ship working solutions that save time, improve quality,
    or create product value
  - You can balance experimentation with execution
  - You are comfortable building from scratch and improving
    systems over time
  - You help us make AI useful in day-to-day operations and
    customer outcomes



  BenefitsWhy join us

  - Work directly with the founder on strategic AI initiatives
  - Opportunity to influence both internal transformation and
    customer/product innovation
  - High ownership and fast decision-making
  - Real scope to build, test, and deploy meaningful AI
    solutions
  - In-office collaboration with a team that wants to move
    quickly and build practical outcomes

  Who this role is ideal for

  This role is ideal for someone who wants to be an early
  applied AI builder inside a growing product company—someone
  excited by ownership, variety, and the chance to shape how
  AI gets used across the business.

  Location

  This is an in-office role based in Sector 62, Noida.
