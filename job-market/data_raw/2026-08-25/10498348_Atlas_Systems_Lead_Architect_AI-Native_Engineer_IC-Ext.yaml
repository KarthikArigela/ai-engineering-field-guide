description: |
  About Us

  Atlas Systems Inc. is a Software Solutions company
  headquartered in East Brunswick, NJ. Incorporated in 2003,
  Atlas provides a comprehensive range of solutions in the
  areas of GRC, Technology, Procurement, Healthcare Provider
  and Oracle to customers across the globe. Combining our
  unparalleled experience of over two decades in the software
  industry and global reach, we have grown with extensive
  capabilities across multiple industry verticals.

  For more information, please visit our website:
  https://www.atlassystems.com/

  Please click on the link below to apply for this position:

  https://atlas.bamboohr.com/careers/604

  Opportunity: Lead Architect & AI-Native Engineer (IC)  We
  are looking for an elite Principal Architect who is part
  visionary, part relentless full stack executor to join our
  core team as a high-impact Individual Contributor (IC). This
  is not a role for someone who just wants to draw diagrams or
  pass off tickets. We are looking for a dynamic, high-
  spirited builder who lives at the bleeding edge of the "vibe
  coding" era—someone who uses AI agents to multiply their
  output by 10x and takes total ownership of the enterprise
  products they build from the ground up.

  The Role: Architecture Meets Execution  You will be the tip
  of the spear for our product feature and module development.
  You will design scalable, distributed solutions and
  immediately jump into the trenches to code them alongside
  your AI tools.

  Core Mandates:  • Total Ownership: You own the entire
  lifecycle of core features—from the initial whiteboarding
  session and architectural design to complex integrations and
  post-launch stability. • Enterprise Solutions & Cloud:
  Architecting and deploying scalable, distributed solutions
  that seamlessly operate across multi-cloud and native
  environments (Azure, AWS, GCP). • Agent-Driven Workflows:
  Architecting complex integrations where autonomous AI agents
  interact with our core APIs, third-party services, and data
  pipelines to drive business logic.

  The Technology Ecosystem:  You will traverse the entire
  modern stack, leveraging the right tool for the job. • The
  Full-Stack Core: Deep expertise in TypeScript, Node.js,
  Next.js, React 19, and Tailwind CSS, paired with robust
  backend prior stack in .NET / C#. • Data & Infrastructure:
  Fluidity across the data spectrum—from PostgreSQL and MySQL
  to in-process and in-memory databases, alongside general ELT
  and Data Engineering proficiency. Deep comfort with Linux
  and CI/CD pipelines. • Security & Ops: Designing secure
  enterprise integrations utilizing IDP/IAM, RBAC, REST/JSON
  APIs, and robust Observability/Tracing tools. • Rapid
  Delivery: Strategic utilization of low-code/no-code
  environments to accelerate time-to-market without
  sacrificing enterprise extensibility.

  The "AI-Native" Edge  • Hyper-Productivity: You are a power
  user of the new era. Whether it’s Cursor, Claude Code, or
  custom AI assistants, you know how to prompt, guide, and
  debug alongside AI to write highly optimized code at
  blistering speeds. • Agility & Evolution: The tech landscape
  is shifting daily. You are fiercely curious and naturally
  pivot to adopt the latest paradigms the moment they provide
  a competitive advantage.

  What We’re Looking For:  • Experience & Impact: 6 to 10+
  years of professional experience, though we strictly value
  talent, agility, and output over "years in a seat." •
  Comprehension & Communication: Elite ability to digest
  complex business requirements and articulate architectural
  trade-offs to both technical peers and executive
  stakeholders. • The IC Mentality: You are a self-starter who
  doesn't need a team to execute a vision. You are both the
  architect and the engine. • Passion: You are high-energy,
  naturally curious, and genuinely excited about the current
  paradigm shift in software development.

  Why Join?  You will have the autonomy to dictate
  architecture, bypass corporate red tape, and build at a
  velocity most teams only dream of. This is a chance to work
  in a lean, high-trust environment where you get a bird’s-eye
  view of modern enterprise architecture while keeping your
  hands deep in the most exciting tech available today.

  Does this sound like how you already work? Reach out
  directly with a brief overview of  the most complex module
  or architecture you’ve shipped recently and tell me how you
  used AI agents to get it over the finish line. Let's build
  something incredible.
