title: AI Software Engineer
company: Gaya Technologies Inc
location: USA
remote: true
work_type: FULL_TIME
description: |
  About the Role

  We're building AI systems that extract structured
  information from complex insurance documents and power
  automation across hundreds of insurance carriers.

  We're looking for a software engineer to help build,
  maintain, and evolve the production services behind those
  systems. The work is varied by design: AI extraction
  pipelines, background job processing, database work,
  internal tools, and whatever else the product needs next.
  You'll work on systems that customers rely on every day.

  You'll begin by owning well-defined engineering tasks while
  learning the platform. As you prove yourself, you'll take
  ownership of larger parts of the system, lead technical
  initiatives, and help shape future products.

  What You'll Do

  - Own and evolve our AI service: LLM pipelines, document
    processing, and Celery-based background jobs.
  - Design, implement, and ship new features, business logic,
    and platform improvements.
  - Work directly with the database - write queries, build RPCs,
    and keep data flows reliable.
  - Build internal tools end to end using AI tooling - including
    light frontend work - and review the code those tools
    produce.
  - Investigate, debug, and resolve production issues, edge
    cases, and unexpected behavior.
  - Contribute to evaluation frameworks that measure and improve
    the quality and reliability of our AI systems.
  - Write tests, review code, and continuously improve the long-
    term reliability of the platform.

  What We're Looking For

  We care less about your exact stack and more about how you
  write code and how you work with a team.

  Required

  - 2+ years of professional software engineering experience. We
    work mostly in Python, but what matters is that you write
    clean, correct, reviewable code and high-quality PRs, not
    your years with any particular stack.
  - Experience building and operating LLM-powered applications
    in production.
  - You read code as well as you write it: you can navigate an
    unfamiliar codebase and review changes deeply enough to
    catch real problems.
  - You use AI coding tools (Claude Code, Codex, or similar) as
    a core part of your workflow, while holding a high bar for
    correctness and quality.
  - You're strong in Python and equally ready to work beyond it,
    including developing front-end interfaces and picking up
    other technologies quickly as the product evolves.
  - When you're blocked, you ask for help fast. Getting
    unblocked in ten minutes beats grinding for two days to
    look self-sufficient.
  - When you finish a task, you look for the next thing that
    moves the product, rather than waiting to be handed a
    reason to care.
  - We move fast as a team and keep good spirit

  Nice to Have

  - Experience with retrieval, ranking, or fuzzy matching
    techniques (TF-IDF, BM25, embeddings, reranking, etc.).
  - Experience evaluating LLM systems or measuring model
    quality.
  - Experience working with PDFs or document-processing
    libraries.
  - Experience working in a startup or small engineering team.

  Tech Stack

  Python 3 · FastAPI · Pydantic · PostgreSQL · Redis · Celery
  · OpenAI APIs · pytest · Docker

  Growth

  We're a small engineering team where ownership grows with
  demonstrated impact. You'll work closely with the engineers
  who built the platform while gradually taking ownership of
  larger systems, leading technical initiatives, and helping
  shape future products.

  Why Join Gaya?

  - Build production AI systems used by real customers every
    day.
  - Solve challenging engineering problems involving AI,
    document understanding, and backend infrastructure.
  - Work in a small, collaborative team that ships quickly and
    values thoughtful engineering.
  - Take on increasing technical ownership and have a meaningful
    impact on the direction of the product.

  If you enjoy building production AI systems, wearing more
  than one hat, and growing your ownership over time, we'd
  love to hear from you.
