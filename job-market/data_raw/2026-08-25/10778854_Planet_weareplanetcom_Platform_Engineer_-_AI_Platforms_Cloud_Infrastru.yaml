description: |
  About Us

  Planet is a leading technology company transforming payments
  by putting customer experience first. We offer integrated
  solutions that include payment processing, VAT refunds,
  dynamic currency conversion, and management services for
  merchants in the Retail and Hospitality sectors worldwide.

  In recent years, we have experienced significant growth,
  expanding our services and global presence.

  With strong private equity investors, Advent International
  and Eurazeo, we have the financial capital and expertise to
  grow our capabilities and reach through acquisitions.

  Our mission is to create a world of connected commerce where
  payments are simple, secure, and seamless, enabling our
  partners to deliver exceptional experiences to their
  customers.


  Role Overview

  We are seeking a Platform Engineer to join our Cloud &
  Infrastructure Services team and support the growth of
  Planet's AI and Generative AI initiatives.

  The successful candidate will work closely with our internal
  AI teams to design, build, automate, and operate the cloud
  infrastructure required to support AI platforms,
  applications, and services. While the role spans both
  Microsoft Azure and AWS, our current AI workloads are
  primarily hosted on AWS.

  This role is focused on platform engineering, cloud
  infrastructure, automation, reliability, and operational
  excellence rather than AI model development. The ideal
  candidate will be passionate about building secure,
  scalable, and self-service cloud platforms that enable AI
  teams to innovate quickly and safely.

  Experience supporting AI services and platforms such as
  Amazon Bedrock, Azure AI Foundry, Microsoft Copilot, GitHub
  Copilot, or Copilot Studio is highly desirable.

  Previous experience working within regulated industries
  (e.g., payments, financial services, PCI-DSS, healthcare, or
  other compliance-driven environments) is highly desirable.


  What you will do:

  - Design, build, and maintain cloud infrastructure supporting
    AI and Generative AI platforms.
  - Partner with AI, Data, Security, and Application teams to
    provision and operate reliable cloud environments.
  - Develop and maintain Infrastructure as Code (IaC) solutions
    using Terraform.
  - Support AI platform services across AWS and Azure.
  - Implement automation to improve platform reliability,
    scalability, security, and operational efficiency.
  - Design and manage cloud networking, security controls, and
    access management for AI workloads.
  - Support containerized workloads and Kubernetes-based
    platforms where required.
  - Monitor platform health, performance, capacity, and cost.
  - Implement and maintain cloud governance, operational
    standards, and reusable platform components.
  - Support incident response, troubleshooting, root cause
    analysis, and platform improvements.
  - Maintain technical documentation, operational procedures,
    and runbooks.
  - Collaborate with Security and Compliance teams to ensure
    platforms meet corporate and regulatory requirements.

  Who you are:

  - Strong hands-on experience with cloud infrastructure,
    particularly AWS.
  - Experience working with Microsoft Azure cloud services and
    platforms.
  - Strong experience with Terraform for Infrastructure as Code
    (IaC).
  - Experience designing, deploying, and supporting cloud-native
    infrastructure.
  - Experience implementing automation using scripting languages
    such as Python, PowerShell, Bash, or similar.
  - Good understanding of cloud networking, identity management,
    security, and governance.
  - Experience supporting production environments and
    participating in incident response activities.
  - Knowledge of monitoring and observability platforms and
    operational best practices.
  - Experience with Linux and/or Windows administration.
  - Strong troubleshooting and problem-solving skills.

  Nice to Have

  - Experience supporting Amazon Bedrock, including foundation
    model integrations and AI platform infrastructure.
  - Experience with Azure AI Foundry (formerly Azure AI Studio)
    and related AI services.
  - Experience with container platforms and Kubernetes (EKS,
    AKS, or similar).
  - Experience with CI/CD platforms and DevOps practices.
  - Experience with configuration management tools such as
    Ansible.
  - Knowledge of OpenTelemetry, observability, and platform
    monitoring standards.
  - Experience with multi-account AWS environments and cloud
    governance frameworks.

  Preferred Experience

  - Experience supporting AI, Data Science, Machine Learning, or
    Generative AI teams.
  - Experience working in regulated environments such as
    Financial Services, Payments, Banking, Healthcare, or
    other compliance-driven industries.
  - Relevant AWS, Azure, Terraform, Kubernetes, or cloud
    platform certifications

  What Success Looks Like

  - Secure, scalable, and reliable platforms supporting Planet's
    AI initiatives.
  - Increased automation and reduced operational overhead
    through Infrastructure as Code and platform engineering
    practices.
  - Faster delivery of cloud infrastructure and services to AI
    teams.
  - Stable and well-governed AWS and Azure environments.
  - Improved platform reliability, security, and operational
    efficiency.
  - Successful adoption of reusable, self-service platform
    capabilities.
  - Strong collaboration between Cloud, Platform Engineering,
    Security, and AI teams.

  Why Planet

  Planet is an equal opportunity employer where diversity is
  valued, and all employment is decided based on
  qualifications, merit, and business need.

  Come and grow your career in the most exciting, fast-paced
  technology market, with a business that delivers feel-good
  connected commerce.

  We would love to hear from you. Apply now.

  At Planet, we embrace a hybrid work model, with three days a
  week in the office.


  Reasonable accommodations may be made in order to allow for
  an individual to perform the essential functions of this
  role successfully.
