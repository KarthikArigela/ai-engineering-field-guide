description: |
  HARMAN’s engineers and designers are creative, purposeful
  and agile. As part of this team, you’ll combine your
  technical expertise with innovative ideas to help drive
  cutting-edge solutions in the car, enterprise and connected
  ecosystem. Every day, you will push the boundaries of
  creative design, and HARMAN is committed to providing you
  with the opportunities, innovative technologies and
  resources to build a successful career.

  A Career at HARMAN

  As a technology leader that is rapidly on the move, HARMAN
  is filled with people who are focused on making life better.
  Innovation, inclusivity and teamwork are a part of our DNA.
  When you add that to the challenges we take on and solve
  together, you’ll discover that at HARMAN you can grow, make
  a difference and be proud of the work you do everyday.

  Role Overview

  We are seeking a highly skilled Agentic AI Engineer with 3
  to 6 years of experience in AI/ML, Generative AI, and
  autonomous AI systems. The ideal candidate will design,
  develop, and deploy intelligent AI agents capable of
  reasoning, planning, decision-making, and executing complex
  workflows using modern AI frameworks and enterprise
  platforms.

  Key Responsibilities

  - Design and develop Agentic AI solutions leveraging Large
    Language Models (LLMs) and multi-agent architectures.
  - Build autonomous AI agents capable of task planning, tool
    calling, memory management, and workflow orchestration.
  - Develop AI-powered applications using frameworks such as
    LangChain, LangGraph, CrewAI, AutoGen, Semantic Kernel,
    LlamaIndex, or similar technologies.
  - Integrate AI agents with enterprise applications, APIs,
    databases, and cloud services.
  - Implement Retrieval-Augmented Generation (RAG) architectures
    using vector databases.
  - Design prompt engineering strategies, agent reasoning
    workflows, and evaluation frameworks.
  - Optimize agent performance, scalability, response quality,
    and operational costs.
  - Build monitoring, observability, and governance mechanisms
    for AI solutions.
  - Collaborate with business stakeholders, architects, and
    engineering teams to deliver AI-driven capabilities.
  - Stay updated on advancements in Agentic AI, LLMs, multimodal
    AI, and emerging AI technologies.

  Required Skills

  Technical Skills

  - 3 to 6 years of software development experience with at
    least 2 years in AI/ML or Generative AI.
  - Strong proficiency in Python.
  - Hands-on experience with commercial and open-source LLMs.
  - Experience with Agentic AI frameworks such as:
    - LangChain
    - LangGraph
    - CrewAI
    - AutoGen
    - Semantic Kernel
    - LlamaIndex
  - Expertise in RAG implementations, embeddings, and vector
    databases.
  - Experience with vector stores such as Pinecone, ChromaDB,
    Weaviate, FAISS, or Azure AI Search.
  - Strong understanding of AI orchestration, workflow
    automation, and agent lifecycle management.
  - Experience with REST APIs, microservices, and cloud
    platforms such as Azure, AWS, or GCP.
  - Knowledge of Docker, Kubernetes, CI/CD, and MLOps practices.
  - Familiarity with prompt engineering, model evaluation, fine-
    tuning concepts, and Responsible AI practices.

  Preferred Skills

  - Experience building multi-agent systems.
  - Knowledge of AI governance, security, and compliance
    frameworks.
  - Understanding of knowledge graphs and reasoning engines.
  - Experience with multimodal AI solutions involving text,
    image, audio, and video.
  - Exposure to Model Context Protocol (MCP) and agent-to-agent
    communication patterns.

  Qualifications

  - Bachelor's or Master's degree in Computer Science,
    Artificial Intelligence, Data Science, Engineering, or a
    related field.
  - Relevant certifications in AI, Machine Learning, Cloud AI
    Services, or Generative AI are preferred.

  What We Offer

   - Competitive salary and benefits package

   - Opportunities for professional growth and development

   - Collaborative and dynamic work environment

  - Access to cutting-edge technologies and tools

