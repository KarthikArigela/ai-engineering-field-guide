description: |
  Included Health is seeking a hands‑on Staff AI Solutions
  Engineer to be part of our IT Solutions team. The right
  candidate will be passionate about the advancements in AI
  and will have experience in owning deployment/hosting
  decisions and implementation.

  The engineer in this role will design, build, and operate
  internal automations, AI agents, and secure integrations
  that increase corporate teams productivity while meeting
  healthcare security and compliance requirements. This role
  blends software engineering, systems integration,
  architecture, and practical LLM expertise to take POCs to
  production.

  The engineer in this role will partner closely with and
  build internal solutions for Cybersecurity, Compliance,
  Finance, HR, Product, Engineering, Operations, Clinical
  teams, and business stakeholders to deliver AI tooling with
  metrics-backed value across the enterprise.

  This role will report to the Director, Digital Workplace

