  The base salary range for this full-time position is
  $159,780.00 – $238,080.00 per year in the United States.
  This posted range reflects the portion of our internal
  salary band that is currently funded for new hires in this
  role across our standard labor markets (Zones A–D).

  For context, these markets include Zone A (e.g., Phoenix AZ,
  San Antonio TX, Columbus OH, Charlotte NC), Zone B (e.g.,
  Chicago IL, Denver CO, San Diego CA, Houston TX), Zone C
  (e.g., Los Angeles CA, Seattle WA, Washington, D.C., Boston
  MA), and Zone D markets (e.g., San Francisco Bay Area CA,
  New York City NY, San Jose CA) for this role. Within this
  range, individual pay is determined by work location,
  skills, experience, and internal equity. We use structured
  salary bands and geographic zones based on cost of labor to
  keep pay fair and consistent.



  Benefits & Perks: In addition to receiving a great
  compensation package, the compensation package may include,
  depending on the role, the following and more:

  - Remote-first culture
  - 401(k) savings plan through Fidelity
  - Comprehensive medical, vision, and dental coverage through
    multiple medical plan options (including disability
    insurance)
  - Paid Time Off ("PTO") and Discretionary Time Off (“DTO")
  - 12 weeks of 100% Paid Parental leave
  - Family Building & Compassionate Leave: Fertility coverage,
    $25,000 for surrogacy/adoption, and paid leave for failed
    treatments, adoption or pregnancies.
  - Work-From-Home reimbursement to support team collaboration
    home office work

  Your recruiter will share more about the salary range and
  benefits package for your role during the hiring process.

  About Included Health

  Included Health is a new kind of healthcare company,
  delivering integrated virtual care and navigation. We’re on
  a mission to raise the standard of healthcare for everyone.
  We break down barriers to provide high-quality care for
  every person in every community — no matter where they are
  in their health journey or what type of care they need, from
  acute to chronic, behavioral to physical. We offer our
  members care guidance, advocacy, and access to personalized
  virtual and in-person care for everyday and urgent care,
  primary care, behavioral health, and specialty care. It’s
  all included. Learn more at includedhealth.com.

