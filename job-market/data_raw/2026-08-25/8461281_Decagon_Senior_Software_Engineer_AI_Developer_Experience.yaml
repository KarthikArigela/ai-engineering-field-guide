description: |
  About Decagon

  Decagon is the leading conversational AI platform empowering
  every brand to deliver concierge customer experiences.

  Our technology enables industry-defining enterprises like
  Avis Budget Group, Block’s Cash App and Square, Chime, Oura
  Health, and Hunter Douglas to deploy AI agents that power
  personalized, deeply satisfying interactions across voice,
  chat, email, SMS, and every other channel.

  We’re building a future where customer experiences are being
  redefined from support tickets and hold music to faster
  resolutions, richer conversations, and deeper relationships.
  We’re proud to be backed by world-class investors who share
  that vision, including a16z, Accel, Bain Capital Ventures,
  Coatue, and Index Ventures, along with many others.

  We’re an in-office company, driven by a shared commitment to
  excellence and velocity. Our values — Just Get It Done,
  Invent What Customers Want, Winner’s Mindset, and The
  Polymath Principle — shape how we work and grow as a team.

  About the Team

  The Infrastructure team builds and operates the foundations
  that power Decagon: networking, data, ML serving, developer
  platform, and real‑time voice. We partner closely with
  product, data, and ML to deliver high‑scale, low‑latency
  systems with clear SLOs and great developer ergonomics.

  About the Role

  We’re looking for a Senior Software Engineer to help build
  and evolve our internal developer platform—everything from
  CI/CD and release automation to observability standards,
  platform tooling, and developer workflows that remove
  friction.

  This role is for someone who loves making other engineers
  faster: reducing build times, eliminating flaky tests,
  creating paved roads for service creation/deployment, and
  raising the bar on operability by default. Roles like this
  often combine “builder” energy with strong empathy for how
  engineers actually work.

  What you'll do

  - Build the agentic developer platform
    - Build coding agents, harnesses, and cloud execution
      infrastructure.
    - Give agents safe access to code, tools, tests, and internal
      systems.
    - Create reusable primitives for autonomous software
      development.
  - Embed AI across the development lifecycle
    - Apply AI to planning, design, implementation, testing, and
      review.
    - Turn successful experiments into repeatable engineering
      workflows.
    - Build paved roads for agent-driven development across teams.
  - Accelerate code review with agents
    - Improve validation of human- and agent-generated changes.
    - Build agent-based testing, evaluation, and review systems.
    - Push correctness checks earlier in the development loop.
  - Make developer tooling agent-native
    - Design CI/CD, local development, and platform tooling for
      humans and agents.
    - Build APIs, CLIs, templates, and automation that agents can
      operate directly.
    - Remove friction from build, test, and release workflows.
  - Enable rapid internal tool building
    - Build frameworks and platforms for quickly creating internal
      tools, dashboards, and agents.
    - Give teams reusable primitives to build solutions for their
      own workflows.
    - Turn one-off internal tooling into scalable, shared
      capabilities.
  - Drive AI-powered developer productivity
    - Identify high-leverage engineering workflows to automate or
      augment with AI.
    - Own architecture, rollout, and adoption across engineering.
    - Measure success through faster iteration and greater
      engineer leverage.

  Your background looks something like this

  - 4+ years building production software, with meaningful
    experience in platform / devtools / infrastructure (or
    adjacent SRE/release engineering).
  - Strong coding ability in at least one systems/productivity
    language (e.g., Python, TypeScript/JS), and comfort
    building developer-facing tooling (CLIs, libraries,
    automation).
  - Hands-on experience with CI/CD systems and designing
    pipelines that are scalable and reusable across many
    repos/services.
  - Practical experience with observability in production
    systems (instrumentation, alerting, dashboards, incident
    response).
  - Comfort with containers and modern cloud infrastructure
    (e.g., Docker/Kubernetes and related tooling).
  - A track record of improving developer experience through
    measurable outcomes (faster builds, fewer flakes, safer
    deploys, fewer incidents).
  - Strong cross-team collaboration and communication—especially
    writing clear docs and driving adoption.

  Even better if you have

  - Experience with monorepos and build systems and/or large-
    scale CI performance work.
  - Experience building internal platforms: service templates,
    paved-road deployment, self-serve environments, developer
    portals.
  - Infrastructure-as-code experience (e.g., Terraform) and a
    security-minded approach to supply chain (provenance,
    secrets, least privilege).
  - Experience applying AI-assisted tooling to make engineers
    dramatically more effective.

  Compensation

  $200K – $400K + Offers Equity This range reflects the
  expected compensation for this role. Compensation within the
  range is determined based on experience, skills, and the
  scope of responsibilities, with flexibility for candidates
  who demonstrate exceptional impact. In addition to base
  salary, we offer competitive equity. Final compensation may
  vary based on location within the United States.

  Benefits

  We proudly offer the following benefits for our full-time
  employees:

  - Medical, Dental, and Vision benefits for you and your family
  - Life Insurance and Disability Benefits
  - Retirement Plan (e.g., 401K, pension)
  - Parental Leave
  - Fertility and family building benefits through Carrot
  - Monthly stipend to support your wellness, lifestyle, and
    work-life balance
  - Daily lunches and snacks in the office to keep you at your
    best
  - Take what you need vacation policy (subject to local
    requirements; UK employees receive 25 days of statutory
    leave)

  These benefits are described in more detail in Decagon’s
  policies, may vary by location, and can change at any time
  according to applicable compensation and benefits plans.
