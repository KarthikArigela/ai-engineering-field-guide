description: |
  The Platform team creates the technology that enables
  Spotify to learn quickly and scale easily, enabling rapid
  growth in our users and our business around the globe.
  Spanning many disciplines, we work to make the business
  work; creating the infrastructure, tooling, frameworks, and
  capabilities needed to welcome a billion customers.

  Enterprise AI builds and operates the internal AI platform
  layer that supports Spotifiers across the company. We’re
  helping evolve AI tooling into reliable infrastructure that
  teams can use in their day-to-day work. Our team builds the
  connective tissue between AI models and Spotify’s internal
  systems, with a focus on secure access, governance,
  identity, integrations, and dependable AI infrastructure.

