description: |
  We currently have a career opportunity for an AI Data
  Engineer to join our team.



  Job Overview:

  We are seeking a highly skilled AI Engineer to design,
  develop, and deploy Artificial Intelligence and Machine
  Learning solutions that drive business innovation and
  efficiency. The ideal candidate will have expertise in
  machine learning, deep learning, Large Language Models
  (LLMs), generative AI, data engineering, and cloud
  technologies. This role involves collaborating with cross-
  functional teams to build scalable AI applications and
  integrate AI capabilities into business processes.

  Perficient is always looking for the best and brightest
  talent, and we need you! We’re a quickly growing, global
  digital consulting leader, and we’re transforming the
  world’s largest enterprises and biggest brands. You’ll work
  with the latest technologies, expand your skills, and become
  a part of our global community of talented, diverse, and
  knowledgeable colleagues.



  Responsibilities

  - Design, develop, test, and deploy AI/ML models and
    applications.Build and optimize machine learning pipelines
    for model training, evaluation, and inference.Develop
    Generative AI solutions using Large Language Models (LLMs)
    such as GPT, Claude, Gemini, or open-source
    models.Implement Retrieval-Augmented Generation (RAG)
    architectures and vector database solutions.Fine-tune and
    customize foundation models to meet business
    requirements.Work with structured and unstructured
    datasets to extract actionable insights.Develop APIs and
    microservices to integrate AI solutions into enterprise
    applications.Monitor model performance and ensure
    scalability, reliability, and security of AI
    systems.Collaborate with data scientists, software
    engineers, product managers, and business
    stakeholders.Stay current with emerging AI technologies,
    frameworks, and industry best practices.
    - Design, develop, test, and deploy AI/ML models and
      applications.
    - Build and optimize machine learning pipelines for model
      training, evaluation, and inference.
    - Develop Generative AI solutions using Large Language Models
      (LLMs) such as GPT, Claude, Gemini, or open-source
      models.
    - Implement Retrieval-Augmented Generation (RAG) architectures
      and vector database solutions.
    - Fine-tune and customize foundation models to meet business
      requirements.
    - Work with structured and unstructured datasets to extract
      actionable insights.
    - Develop APIs and microservices to integrate AI solutions
      into enterprise applications.
    - Monitor model performance and ensure scalability,
      reliability, and security of AI systems.
    - Collaborate with data scientists, software engineers,
      product managers, and business stakeholders.
    - Stay current with emerging AI technologies, frameworks, and
      industry best practices.



  Qualifications

  - Bachelor's or Master's degree in Computer Science,
    Artificial Intelligence, Machine Learning, Data Science,
    or a related field.3+ years of experience in AI/ML
    development.Strong programming skills in Python.Experience
    with machine learning frameworks such as TensorFlow,
    PyTorch, or Scikit-learn.Hands-on experience with
    Generative AI and LLM technologies.Understanding of NLP,
    deep learning, and neural network architectures.Experience
    with vector databases (Pinecone, Weaviate, ChromaDB,
    FAISS, etc.).Knowledge of cloud platforms such as Azure,
    AWS, or Google Cloud.Experience with REST APIs, Docker,
    Kubernetes, and CI/CD pipelines.Strong problem-solving and
    analytical skills.Experience with Azure OpenAI Service,
    AWS Bedrock, or Google Vertex AI.Knowledge of MLOps tools
    such as MLflow, Kubeflow, or SageMaker.Experience building
    RAG-based applications and AI agents.Familiarity with
    LangChain, LlamaIndex, Semantic Kernel, or similar
    frameworks.AI-related certifications from Microsoft, AWS,
    or Google.Experience working in Agile development
    environments.
    - 3+ years of experience in AI/ML development.
    - Strong programming skills in Python.
    - Experience with machine learning frameworks such as
      TensorFlow, PyTorch, or Scikit-learn.
    - Hands-on experience with Generative AI and LLM technologies.
    - Understanding of NLP, deep learning, and neural network
      architectures.
    - Experience with vector databases (Pinecone, Weaviate,
      ChromaDB, FAISS, etc.).
    - Knowledge of cloud platforms such as Azure, AWS, or Google
      Cloud.
    - Experience with REST APIs, Docker, Kubernetes, and CI/CD
      pipelines.
    - Strong problem-solving and analytical skills.
    - Experience with Azure OpenAI Service, AWS Bedrock, or Google
      Vertex AI.
    - Knowledge of MLOps tools such as MLflow, Kubeflow, or
      SageMaker.
    - Experience building RAG-based applications and AI agents.
    - Familiarity with LangChain, LlamaIndex, Semantic Kernel, or
      similar frameworks.
    - AI-related certifications from Microsoft, AWS, or Google.
    - Experience working in Agile development environments.



