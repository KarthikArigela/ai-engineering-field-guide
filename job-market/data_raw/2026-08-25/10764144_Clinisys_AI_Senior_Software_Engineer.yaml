description: |
  Clinisys' AI Philosophy: Building an AI first organisation
  is central to Clinisys’ purpose and the impact we deliver.
  As a global provider of intelligent diagnostic informatics
  solutions, we build AI enabled, cloud based platforms to
  enhance diagnostic workflows across healthcare, life
  sciences, and public health. By applying intelligent
  technology thoughtfully and responsibly, we help
  laboratories and testing environments operate more
  effectively, generate meaningful insights at scale, and
  ultimately support healthier and safer communities.
  Operating across more than 30 countries, Clinisys expects
  all colleagues—regardless of role or function—to work
  confidently with AI enabled tools, apply digital and
  analytical thinking, and continuously adapt as technologies
  evolve, must drive an AI first sense of purpose and urgency.
  Required Skills & Experience AI Tools & Platforms (Primary)
  • Hands-on experience with Microsoft Foundry for building
  and deploying AI solutions • Experience with agent
  orchestration frameworks (Semantic Kernel, LangChain,
  LangGraph, LlamaIndex) for building multi-step, tool-calling
  AI workflows • Proficiency with GitHub Copilot in VS Code or
  Cursor and/or Visual Studio for AI-assisted development •
  Experience with LLM APIs (Azure OpenAI, OpenAI, Anthropic,
  AWS Bedrock) • Understanding of RAG architecture and
  implementation, limitations and strategies to improve
  response quality • Experience working with embeddings and
  vector stores (Azure AI Search, Cosmos DB, PostgreSQL) •
  Familiarity with document ingestion pipelines and chunking
  strategies for optimal retrieval • Strong prompt engineering
  skills • Familiarity with AI gateway patterns and multi-
  provider model routing for managing LLM traffic across Azure
  OpenAI, Anthropic, and AWS Bedrock endpoints Development
  Skills (Nice to have) • Strong proficiency in Python for
  AI/ML development, API services, and data pipelines •
  Proficiency in TypeScript/Javascript and front-end
  frameworks (React preferred, Angular acceptable) •
  Proficiency in C# and .NET development • Experience with
  relational databases (Oracle, MSSQL, PostgreSQL) and NoSQL
  databases (MongoDB, Cosmos, Dynamo, Redis) • Familiarity
  with REST API design and implementation • Git Version
  control with Azure Devops, GitHub or similar products

  We may use artificial intelligence (AI) tools to support
  parts of the hiring process, such as reviewing applications
  analyzing resumes, or assessing responses. These tools
  assist our recruitment team but do not replace human
  judgment. Final hiring decisions are ultimately made by
  humans. If you would like more information about how your
  data is processed, please contact us.
