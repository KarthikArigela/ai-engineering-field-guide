description: |
  Binance is a leading global blockchain ecosystem behind the
  world’s largest cryptocurrency exchange by trading volume
  and registered users. We are trusted by 300+ million people
  in 100+ countries for our industry-leading security, user
  fund transparency, trading engine speed, deep liquidity, and
  an unmatched portfolio of digital-asset products. Binance
  offerings range from trading and finance to education,
  research, payments, institutional services, Web3 features,
  and more. We leverage the power of digital assets and
  blockchain to build an inclusive financial ecosystem to
  advance the freedom of money and improve financial access
  for people around the world.

  About the team



  Binance Square is a social content and discovery platform
  within the Binance ecosystem, serving millions of users with
  real-time market insights, creator-driven content, and AI-
  powered recommendations. The AI & Data Services team builds
  the backend infrastructure that powers content discovery,
  personalized feeds, and intelligent data services across the
  platform.

  Responsibilities:

  - Design, develop, and maintain high-performance backend
    services for the Binance Square product, focusing on
    content discovery, recommendation pipelines, and AI-
    powered features
  - Build and operate scalable microservices handling millions
    of daily requests, ensuring reliability, low latency, and
    graceful degradation under peak load
  - Integrate Large Language Models (LLMs) and AI/ML pipelines
    into production backend systems, including RAG
    architectures, prompt orchestration, and agentic workflows
  - Collaborate closely with Product Managers, Data Scientists,
    DevOps, and frontend engineers to deliver end-to-end
    solutions from data ingestion to user-facing features
  - Design and optimize data pipelines for content indexing,
    real-time analytics, and ML feature serving
  - Advocate for engineering best practices — conduct code
    reviews, write comprehensive tests, and drive
    architectural improvements
  - Troubleshoot and resolve production issues, performing root-
    cause analysis and implementing preventive measures
  - Contribute to technical design documents and participate in
    architecture decision-making

  Requirements:

  - 3–6 years of back-end software development experience with
    strong proficiency in Java (primary) or Golang/Python
  - Bachelor's or Master's degree in Computer Science,
    Engineering, or a related field
  - Deep understanding of software frameworks, design patterns,
    and microservices architecture
  - Strong experience with relational databases
    (MySQL/PostgreSQL), message brokers (Kafka/RabbitMQ), and
    caching systems (Redis)
  - Experience with cloud infrastructure (AWS/GCP/Azure) and
    containerization (Docker/Kubernetes)
  - Hands-on experience integrating AI/LLM technologies into
    production systems — RAG, prompt engineering, LLM
    orchestration, or agentic pipelines is a strong plus
  - Experience with high-throughput, low-latency backend systems
    serving millions of users
  - Solid understanding of data structures, algorithms, and
    system design
  - Ability to work independently and communicate effectively in
    a distributed, cross-timezone team environment

  Why Binance

  • Shape the future with the world’s leading blockchain
  ecosystem

  • Collaborate with world-class talent in a user-centric
  global organization with a flat structure

  • Tackle unique, fast-paced projects with autonomy in an
  innovative environment

  • Thrive in a results-driven workplace with opportunities
  for career growth and continuous learning

  • Competitive salary and company benefits

  • Work-from-home arrangement (the arrangement may vary
  depending on the work nature of the business team)

  Binance is committed to being an equal opportunity employer.
  We believe that having a diverse workforce is fundamental to
  our success.

  By submitting a job application, you confirm that you have
  read and agree to our Candidate Privacy Notice.
