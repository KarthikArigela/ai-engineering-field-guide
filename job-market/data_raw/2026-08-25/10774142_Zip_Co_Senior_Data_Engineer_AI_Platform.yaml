description: |
  - Shape the data platform powering analytics, machine
    learning, Generative AI, and Agentic AI for millions of
    customers and internal teams.
  - Build scalable, cloud-native data infrastructure across
    batch, streaming, structured, and unstructured workloads
    using modern engineering best practices.
  - Partner with Data Science, Machine Learning, Product, and
    Engineering leaders to deliver AI-ready data products that
    accelerate innovation across the business.
  - Influence the future of Zip's Data & AI Platform by driving
    architecture, mentoring engineers, and establishing the
    foundations for enterprise-scale AI.
  - Remote-first opportunity for US-based employees with the
    option to work in-person out of our Manhattan office.

  About us

  We are Zip, a global Buy Now, Pay Later company providing
  fair and seamless solutions that simplify how millions of
  people pay. Our journey began in Australia, and we’ve grown
  significantly since coming to America.

  We exist to create a world where people can live fearlessly
  today, knowing they’re in control of tomorrow. Focused on
  product innovation that puts people at the center, we put
  the financial well-being of our customers and merchant
  partners at the heart of everything that we do.

  We’re proud to be a values-led business. They guide us in
  everything we do - how we work together and create game-
  changing experiences for our customers and fellow Zipsters.

  About the Role

  Zip is building the next generation of AI-powered
  experiences for customers, employees, and partners. As a
  Senior Data Engineer on the Data & AI Platform team, you
  will design, build, and scale the data foundation that
  powers analytics, machine learning, Generative AI, and
  Agentic AI across the organization.

  You will develop secure, scalable, and reliable data
  platforms that support structured and unstructured data
  processing, real-time and batch workloads, AI-ready data
  products, and intelligent retrieval capabilities. Working
  closely with Data Scientists, ML Engineers, Software
  Engineers, Product teams, and business stakeholders, you
  will help create a modern data ecosystem that accelerates
  innovation while maintaining the highest standards of
  quality, governance, and operational excellence.

  This is a high-impact role with the opportunity to shape the
  future of Zip’s AI and data platform strategy.

  What You'll Do

  - Design, build, and scale Zip’s enterprise Data & AI Platform
    supporting analytics, machine learning, Generative AI, and
    Agentic AI initiatives.
  - Develop scalable data pipelines and architectures for
    structured, unstructured, batch, and real-time data
    workloads.
  - Build AI-ready data products, semantic models, and retrieval
    capabilities that enable intelligent agents and AI-powered
    applications.
  - Design and optimize vector search, hybrid search, and
    Retrieval-Augmented Generation (RAG) capabilities to
    improve AI effectiveness and user experiences.
  - Implement streaming and event-driven solutions that support
    near real-time business insights, operational
    intelligence, fraud detection, and risk monitoring.
  - Establish engineering best practices for data modeling,
    testing, observability, governance, security, and platform
    reliability.
  - Drive self-service and automation capabilities that improve
    developer productivity and accelerate time-to-insight.
  - Partner with cross-functional teams to deliver trusted,
    high-quality data solutions that support critical business
    and AI initiatives.
  - Mentor engineers, influence architecture decisions, and help
    define the future direction of Zip’s data platform.

  What You'll Bring

  - 8+ years of experience designing, building, and operating
    enterprise-scale data platforms.
  - Deep expertise with modern cloud data platforms such as
    Snowflake, Databricks, Microsoft Fabric, BigQuery,
    Redshift, or similar technologies.
  - Advanced SQL and Python skills with strong experience in
    data modeling, ELT/ETL development, dbt, and orchestration
    frameworks such as Airflow, Dagster, or equivalent.
  - Experience building scalable streaming and event-driven
    architectures using technologies such as Kafka, Azure
    Event Hubs, Spark, or similar platforms.
  - Strong understanding of modern data architecture patterns,
    including dimensional modeling, semantic layers, data
    governance, metadata management, and platform
    observability.
  - Experience supporting AI and machine learning workloads
    through AI-ready data models, vector search, metadata
    enrichment, Retrieval-Augmented Generation (RAG), and
    knowledge retrieval systems.
  - Experience with modern lakehouse technologies and open table
    formats such as Apache Iceberg, Delta Lake, or similar
    technologies.
  - Hands-on experience with cloud platforms (Azure preferred;
    AWS or GCP also acceptable).
  - Strong engineering mindset with experience in testing,
    CI/CD, infrastructure automation, and operational
    excellence.
  - Proven ability to lead technical initiatives, mentor
    engineers, and collaborate effectively across technical
    and business teams.
  - Strong sense of ownership and accountability for data
    accuracy, consistency, reliability, and quality.

  Nice to Have

  - Experience building enterprise AI platforms, Agentic AI
    solutions, or LLM-powered applications.
  - Experience integrating enterprise LLM platforms such as
    Azure OpenAI, OpenAI, Anthropic, or Google Gemini.
  - Familiarity with vector databases like pinecone, weaviate
    etc. and AI search technologies, MLOps/LLMOps, and modern
    AI infrastructure.
  - Experience implementing data governance, metadata, lineage,
    and data catalog solutions.
  - Experience in fintech, payments, procurement, risk,
    compliance, or enterprise SaaS environments.

  What you’ll get in return

  Zip is a place where you’ll get out what you put in. The
  newness of our sector means we need to move at pace and
  embrace change, and our promise to you when you join the
  team is that you’ll feel empowered and trusted to make big
  things happen quickly.

  We want you to feel welcome and as though you have the
  support to be yourself, and care for yourself at work.
  Because it’s important to us that you make the most of the
  opportunities you’ll get to grow your skills and your
  career, and be surrounded by smart, friendly people and
  leaders that have your back.

  We think these are just some of the best things about being
  a Zipster. We will also offer you:

  - Flexible working culture
  - Incentive programs
  - Unlimited PTO
  - Generous paid parental leave
  - Leading family support policies
  - Company-sponsored 401k match
  - Learning and wellness subscription stipend
  - Beautiful Union Square office with a casual dress code
  - Industry-leading, employer-sponsored insurance for you and
    your dependents, with several 100% Zip-covered choices
    available

  Zip is committed to a straightforward and transparent pay
  structure. The actual base salary will be determined by
  various individualized factors, including job-related
  knowledge, skills, experience, location, internal equity, as
  well as other objective business considerations.

  The annual base Pay Range for this position is $134,000 -
  $168,000. This range reflects our US national compensation
  band (USN). Additional premium percentages may apply based
  on our tiered premium strategy.

  Subject to those same considerations, the total compensation
  package for this position may also include other elements,
  including a bonus and/or commission awards, in addition to a
  full range of medical, financial, and/or other benefits.

  *Please note that visa sponsorship is not available for this
  position.

  If hired, employees will be in an ‘at-will position’ and the
  Company reserves the right to modify base salary (as well as
  any other discretionary payment or compensation or benefit
  program) at any time, including for reasons related to
  individual performance, Company or individual
  department/team performance, and market factors.

  Be a part of a team that reflects the diversity of our
  customers

  We pride ourselves on being a workplace that provides equal
  opportunities to people of all ages, cultural backgrounds,
  sexual orientations, gender identities, abilities, veteran
  status, and everything else that makes you unique.

  Equally, we’re committed to ensuring our recruitment
