description: |
  This is a remote position.

  Who We Are:

  At Advancio, we are passionate about technology and its
  ability to transform the world. We are rapidly expanding and
  building a company where we serve exceptional businesses,
  hire top talent, and have a lot of fun doing what we love!



   Job Summary:











   We are seeking a talented AI Developer to design, develop,
  and deploy intelligent solutions that solve complex
  problems. The ideal candidate has hands-on experience with
  machine learning frameworks, AI algorithms, and integrating
  AI models into scalable applications.









  What will you do:

  - Develop and implement AI and machine learning models to
    solve specific business challenges.
  - Collaborate with cross-functional teams to identify
    opportunities for AI-driven solutions.
  - Train, fine-tune, and deploy models using frameworks like
    TensorFlow, PyTorch, or Scikit-learn.
  - Design and optimize AI pipelines for data preprocessing,
    model training, and deployment.
  - Build and maintain APIs or microservices to integrate AI
    solutions into existing applications.
  - Monitor and evaluate the performance of deployed models,
    ensuring scalability and reliability.
  - Stay updated with the latest advancements in AI/ML
    technologies and best practices.






  Requirements

  - 4+ years of professional experience in AI/ML development.
  - Advanced English communication skills, both written and
    verbal.
  - Strong programming skills in Python, with experience in
    libraries like NumPy, Pandas, and Scikit-learn.
  - Proficiency in AI/ML frameworks such as TensorFlow, PyTorch,
    or Keras.
  - Experience in data preprocessing, feature engineering, and
    working with large datasets.
  - Knowledge of cloud platforms (Azure, AWS, or GCP) and
    deploying AI models in production.
  - Familiarity with version control systems (e.g., Git) and
    CI/CD pipelines.
  - Strong understanding of algorithms, data structures, and
    mathematics behind AI models.
