  AI/ML Software Engineer -  Healthcare – Full-Time - Remote
  (from EUROPE) – Job ID 26AIML302Description

  Serious Development is a boutique healthcare strategy,
  product, and software engineering firm. We partner with
  healthcare organizations to solve complex operational
  challenges through thoughtfully designed custom software.

  We are actively seeking a full-stack AI/ML Software Engineer
  to help us build HealthTech apps and systems for our clients
  by contributing as a member of one of our agile engineering
  teams.  You'll implement scalable microservices that will
  work in concert together as applications.  Additionally,
  you’ll shape pieces of technical architecture, integrate our
  applications with ML & third-party technologies, enhance
  existing features, participate in code reviews, help ensure
  that the team is delivering high quality code, and optimize
  existing systems. Eventually, you will become an SME and
  owner of some of the services and systems that you helped
  implement.  Overall, you’ll contribute your experience to
  make your team and the department stronger.

  Requirements

  - Bachelor of Science degree in Computer Science, Computer
    Engineering, Software Engineering, or similar engineering
    major
  - 4+ years of experience as an AI/ML Software Engineer with
    same/similar responsibilities as outlined above (excludes
    any internship experience)
  - Experience engineering with Python
  - Experience engineering in Linux and/or MacOS environments
  - Experience engineering a SaaS product/platform
  - Experience accurately logging all design, development, and
    consulting hours daily to prevent revenue leakage and
    ensure precise client invoicing
  - Excellent written and verbal communication skills (English
    Level at least C1- Advanced)
  - Role based in Europe
  - Must have valid work authorization and residency in Europe.

  Responsibilities

  - Operate as a self-sufficient, T-shaped, full-stack AI/ML
    engineer
  - Recommend AI/ML-driven solutions and implement them
  - Review technical architecture documentation for the project
    and ensure that the engineering team’s deliverables are
    implemented accordingly
  - Develop code that fulfills requirements specified by the
    business, technical architects, and clients
  - Ensure that the code you deliver has an extremely high level
    of quality and extremely low potential for defects that
    will surface in the production environments
  - Author documentation of your code that is useful for your
    team members and other members of Engineering
  - Participate as a team-player that works together with your
    fellow team members to deliver commitments on time
  - Dive into code as technical challenges arise to perform
    root-cause analyses and implement resolutions
  - Develop proofs of concepts as needed
  - Review code written by your team members to help catch
    issues before they surface after deployment
  - Keep current with engineering best practices, design
    principles, technology, security, and compliance to apply
    that knowledge to all the responsibilities above

  Snapshot of Activities

  As a member within our highly collaborative engineering
  team, the AI ML Software Engineer may work with multiple
  frameworks, databases, services, and tools on HealthTech
  projects. Working proficiency of Portuguese, Spanish, or
  Ukrainian language skills could be helpful.
