  AI Engineer – Generative & Agentic AI   Role Details

  - Experience: 5–7 Years
  - Location: Mumbai – Bandra Kurla Complex (BKC)
  - Work Mode: Hybrid (3 days/week from office)
  - Contract Duration: 12 Months (C2H)
  - Budget: Up to 24 LPA
  - Joining: Immediate Joiners Only
  - Interview Process: In-person interview (mandatory- Final
    Round Only)

  Role Overview

  We are looking for a highly skilled AI Engineer with strong
  hands-on expertise in Generative AI and Agentic AI systems.

  This role involves designing, building, and deploying
  production-grade AI solutions, taking ideas from prototype
  to scalable enterprise systems. The candidate will work on
  intelligent systems capable of reasoning, planning, tool
  usage, and multi-agent orchestration, beyond basic chatbot
  implementations.

  Key Responsibilities Generative & Agentic AI Development

  - Design and build LLM-based systems using:
    - Retrieval Augmented Generation (RAG)
    - Embeddings and vector search
    - Prompt engineering and optimization
    - Function calling and tool integrations
    - Agentic and multi-agent workflows
  - Develop AI systems integrating LLMs with:
    - REST APIs
    - Enterprise applications
    - Data platforms and workflows
  - Apply LLM evaluation techniques to ensure quality, safety,
    and performance

  End-to-End AI Engineering

  - Own the full lifecycle of AI solutions from prototype to
    production
  - Build, deploy, and manage AI workloads on AWS
  - Ensure scalability, reliability, performance, and cost
    optimization
  - Implement CI/CD pipelines, automated testing, and versioning
    for AI systems

  Engineering Excellence & Operations

  - Apply strong software engineering and distributed systems
    principles
  - Implement observability practices (logs, metrics, traces,
    alerts)
  - Monitor system performance, latency, and model behavior in
    production
  - Contribute to responsible AI practices and governance
    standards

  Collaboration & Enablement

  - Work with AI engineers, data scientists, platform teams, and
    business stakeholders
  - Contribute to reusable AI components and scalable
    architecture
  - Support low-code / Copilot-style AI solutions where required
  - Mentor junior engineers and share best practices

  Mandatory Skills Programming & Engineering

  ✔ Strong expertise in Python

  ✔ Experience with REST APIs

  ✔ Hands-on experience with CI/CD pipelines and automated
  testing

  ✔ Strong understanding of distributed systems fundamentals

  Generative & Agentic AI

  ✔ Hands-on experience with:

  - Generative AI / LLM-based systems
  - Agentic and multi-agent workflows
  - RAG (Retrieval Augmented Generation)
  - Embeddings & vector databases
  - Prompt engineering and optimization
  - LLM evaluation techniques

  Cloud & AI Platforms

  ✔ Experience with:

  - AWS Bedrock
  - Amazon SageMaker

  Production & Operations

  ✔ Experience in:

  - Observability (logs, metrics, tracing, alerts)
  - Monitoring and performance tuning
  - Production deployment of AI systems

  Preferred Skills

  - Experience supporting enterprise AI platforms
  - Exposure to Copilot-style / workflow automation solutions
  - Knowledge of Responsible AI and governance frameworks
  - Experience working in cross-functional or client-facing
    environments

  Soft Skills

  - Strong problem-solving and analytical mindset
  - Ability to work independently and take ownership
  - Good communication and stakeholder interaction skills
  - Collaborative approach with a learning mindset
