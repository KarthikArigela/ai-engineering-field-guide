  Job Description: AI Engineer – AI Agents & Chatbots

  Company: NetzHero (formerly RIU.ai)Location: Bangalore,
  IndiaEmployment Type: Full-TimeExperience: 2–6 Years

  About NetzHero

  NetzHero is a Bangalore-based climate-tech company working
  on carbon sequestration and ESG reporting technology. Our
  proprietary software is deployed in leading companies for
  automated carbon emission accounting and ESG reporting.

  Role Overview

  We are looking for an AI Engineer to build AI agents and
  chatbots that power NetzHero's platform. You will design and
  deploy intelligent agents that automate carbon accounting
  workflows, collect ESG data through conversational
  interfaces, generate reports, and perform complex multi-step
  tasks autonomously.

  Key Responsibilities

  - Build autonomous AI agents that perform multi-step tasks
    like emission calculations, data collection, report
    generation, and ESG analysis.
  - Develop agentic workflows using frameworks like LangChain,
    LangGraph, CrewAI, or similar.
  - Build tool-using agents that interact with APIs, databases,
    documents, and external services.
  - Develop chatbots for carbon data collection, ESG
    questionnaire completion, and user queries.
  - Build RAG pipelines for agents to reason over emission
    factors, regulatory standards, and ESG frameworks.
  - Fine-tune and optimise LLMs for domain-specific carbon and
    ESG tasks.
  - Integrate AI agents and chatbots into the product backend
    through APIs.
  - Implement guardrails and validation layers to ensure
    accuracy of AI outputs.

  Qualifications

  - 2–6 years of experience in AI/ML engineering focused on LLM
    applications, chatbots, or AI agents.
  - B.Tech/M.Tech/MS in Computer Science, AI, Data Science, or
    related field.
  - Strong proficiency in Python.
  - Hands-on experience with agentic frameworks (LangChain,
    LangGraph, CrewAI, or similar).
  - Strong working knowledge of LLMs — prompt engineering, fine-
    tuning, RAG, function calling, and tool use.
  - Experience with vector databases (Pinecone, Weaviate,
    ChromaDB, FAISS).
  - Experience deploying LLM-powered applications in production.
  - Familiarity with cloud platforms (AWS/GCP/Azure) and Docker.

  Good to Have

  - Experience with multi-agent systems.
  - NLP experience — document parsing, text extraction,
    summarisation.
  - Exposure to carbon accounting or ESG domain.
  - Experience with open-source LLMs and self-hosted deployment.
  - MLOps knowledge.

  What We Offer

  - Build AI that directly powers climate action at scale.
  - Work on cutting-edge agentic AI in a meaningful domain.
  - Fast-growing startup with proprietary software in leading
    companies.
  - Competitive compensation and growth opportunities.
