description: |
  Visionary Integration Professionals (VIP) provides industry-
  leading management consulting, system integration, and
  technology deployment solutions. VIP helps its clients
  strengthen mission outcomes by combining deep industry
  specialization, agility to adapt as needed, and an
  unwavering commitment to client satisfaction. VIP brings
  expertise in how to deploy systems that align people,
  processes, and technology to accelerate strategic change and
  to deliver business results in partnership with its clients.
  Since 1996, VIP has worked with over 1,200 public sector and
  commercial clients. For more information, visit
  https://trustvip.com.

  Join VIP: A strategic approach to accelerate your career!
  This is a remote position with travel as needed.

  Visionary Integration Professionals is seeking a Forward
  Deployment Engineer - AI & Agentic Solutions to help
  customers adopt practical, secure, and measurable AI-enabled
  solutions. This role will support both VIP’s State & Local
  Government and Commercial business units by working directly
  with customers to identify high-value use cases, design
  solution approaches, build prototypes, support pilots, and
  help transition successful concepts into production-ready
  implementations. The ideal candidate is a hands-on technical
  consultant who can operate comfortably with business
  stakeholders, technical teams, and customer leadership. This
  person should be able to understand business processes,
  translate them into AI-enabled solution designs, build or
  guide working prototypes, and help customers adopt solutions
  that are useful, secure, supportable, and aligned to
  measurable outcomes.

  Customer Delivery Responsibilities:

  - Work directly with VIP customers to understand business
    processes, pain points, operational challenges, and
    opportunities where AI or agentic solutions can create
    measurable value.
  - Design, prototype, and support implementation of AI-enabled
    solutions using large language models, agentic workflows,
    retrieval-augmented generation, API integrations,
    automation tools, and human-in-the-loop review patterns.
  - Translate customer requirements into solution designs,
    technical architectures, implementation plans, prototypes,
    and production-readiness recommendations.
  - Support AI adoption across use cases such as software
    quality, test automation, knowledge management, document
    analysis, workflow automation, case management, citizen
    services, operational reporting, and decision support.
  - Build working demos, proof-of-concepts, pilots, and reusable
    accelerators that can be adapted across VIP customer
    engagements.
  - Support the transition from prototype to production by
    helping define technical requirements, integration needs,
    security considerations, testing approaches, support
    models, and adoption plans.
  - Help customers evaluate AI use cases through the lens of
    data privacy, security, compliance, auditability,
    accuracy, explainability, and operational risk.
  - Lead or support customer workshops focused on AI opportunity
    discovery, solution design, pilot planning, implementation
    readiness, and adoption planning.
  - Communicate technical concepts clearly to both executive and
    technical audiences.
  - Create customer-facing documentation, including solution
    briefs, architecture summaries, implementation roadmaps,
    pilot plans, operating procedures, and adoption guides.
  - Train customer teams on how to use, manage, evaluate, and
    improve AI-enabled solutions.
  - Help customers move beyond experimentation by identifying
    practical steps required for adoption, governance,
    support, and long-term value realization.

  VIP Internal Responsibilities:

  - Partner with VIP delivery teams to integrate AI capabilities
    into broader consulting, implementation, quality
    assurance, DevOps, data, and application modernization
    efforts.
  - Share lessons learned across VIP’s SLG and Commercial
    delivery teams.
  - Provide technical guidance to VIP consultants who are
    incorporating AI into existing service offerings.
  - Contribute to VIP’s evolving delivery methodology for
    responsible and practical AI adoption.

  Required Qualifications:

  - 5+ years of experience in a customer-facing technical role
    such as solution architect, forward deployed engineer,
    technical consultant, implementation consultant, software
    engineer, automation architect, AI engineer, or systems
    integration consultant.
  - Strong practical knowledge of various AI/LLM platforms
    including OpenAI, Anthropic, Microsoft Copilot/Azure AI,
    Google Gemini, AWS AI services.
  - Hands-on experience designing, building, or implementing AI-
    enabled solutions, automation solutions, enterprise
    integrations, workflow-based systems.
  - Experience with agentic AI solution patterns, including tool
    use, multi-step agents, AI workflow orchestration, MCP,
    retrieval-augmented generation, and evaluation frameworks.
  - Strong technical foundation in several of the following
    areas: Python, JavaScript/TypeScript, REST APIs, prompt
    engineering, data integration, workflow automation, test
    automation, DevOps, enterprise application integration.
  - Ability to work directly with customers and software vendors
    to gather requirements, assess feasibility, design
    solutions, explain tradeoffs, and support implementation.
  - Strong written and verbal communication skills, including
    the ability to explain technical topics to non-technical
    stakeholders.
  - Experience creating technical documentation, solution
    designs, architecture summaries, implementation plans, or
    customer enablement materials.
  - Ability to work independently in ambiguous customer
    environments while still following structured delivery
    practices.
  - Ability to travel periodically for customer workshops,
    project meetings, and onsite delivery activities.
  - Experience in ERP/CRM implementations, enterprise workflow
    automation, case management, software quality, test
    automation, DevOps, application modernization, digital
    transformation.
  - Understanding of concepts and importance of AI governance,
    responsible AI, model evaluation, data privacy,
    compliance, and security review.



  The compensation for this position is $130,000 to $165,000
  per year + commission depending on experience and
  qualifications. This position is eligible for a benefits
  package including Medical, Dental, Vision, a 401(k) Plan and
  Company Match, Short-Term and Long-Term Disability coverage,
  Basic Life Insurance, 7 Paid Holidays and Flexible Paid Time
  Off.
