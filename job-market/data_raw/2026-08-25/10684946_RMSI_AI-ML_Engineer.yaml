description: |
  We are seeking a Machine Learning Engineer with 1–3 years of
  hands-on experience in designing, developing, and deploying
  enterprise-scale AI/ML solutions. The ideal candidate should
  have practical expertise in Natural Language Processing
  (NLP), Large Language Models (LLMs), Computer Vision,
  Generative AI, and GIS-driven AI applications, along with
  strong programming, analytical, and problem-solving skills.

  In this role, you will contribute to the development of LLM-
  based solutions on AI-powered GIS platforms, Multimodal and
  Geo-spatially aware models, and real-time feature detection
  systems. You will play a key role throughout the entire
  AI/ML lifecycle, from data preparation and model development
  to deployment, optimization, and production support, helping
  deliver scalable and impactful enterprise-grade solutions.

  Requirements

  We require 3 AI/ML Engineers for the SCE project to work on
  scanned documents and develop an intelligent solution for
  extracting legal information and polygon geometry details.
  The objective is to leverage AI/ML, NLP, LLMs, and
  Generative AI techniques to identify relevant legal
  entities, extract geospatial information, and automatically
  generate geo-tagged polygons from the source documents. The
  selected engineers will be responsible for building,
  training, and deploying models that support document
  understanding, information extraction, spatial data
  processing, and GIS integration with AIML, NLP and LLM.
