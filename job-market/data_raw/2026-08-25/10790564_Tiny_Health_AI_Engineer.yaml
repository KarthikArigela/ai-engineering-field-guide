description: |
  About Tiny Health

  Tiny Health is advancing lifelong health, from the first
  1,000 days to the last, and addressing chronic disease
  through precision microbiome science. Founded in 2020 and
  built by microbiome scientists and physicians, our testing
  platform reveals whether your microbiome is trending toward
  resilience or imbalances using shotgun metagenomics,
  proprietary AI, and one of the world's largest longitudinal
  datasets. Trusted by families and health practitioners
  alike, our research-backed gut and vaginal tests are
  redefining the microbiome as a cornerstone of personalized
  health through every life stage. Learn more at
  tinyhealth.com and poweredbytiny.com.

  The Opportunity

  We are looking for an AI Engineer to join our Product &
  Engineering team. This role will focus on building and
  scaling production-grade AI systems that power Tiny Health’s
  consumer and clinician-facing products. You’ll work closely
  with our co-founder, product/design lead, and a small, high-
  performing engineering team to design and implement AI-
  driven features, pipelines, and infrastructure that drive
  meaningful health insights.

  We are seeking someone who has hands-on experience deploying
  AI applications in production, beyond prototypes or personal
  projects. You should be comfortable owning end-to-end
  delivery — from model integration to infrastructure — and
  capable of operating independently in a fast-moving
  environment.

  If you’re at the lead level, you’ll also help shape Tiny
  Health’s AI roadmap, set technical direction, and mentor
  engineers as we expand our AI capabilities.

  What You’ll Do

  - Design, build, and maintain production-grade AI systems and
    APIs that power our products.
  - Integrate and fine-tune models (LLMs, embeddings, or other
    ML architectures) for customer-facing and internal use
    cases.
  - Own the full lifecycle of AI features — from research and
    prototyping to productionization, deployment, and
    monitoring.
  - Collaborate closely with engineering, product, and science
    teams to scope and ship impactful AI-driven features.
  - Design data pipelines, retrieval systems, and scalable
    infrastructure for inference and model serving.
  - Ensure performance, observability, and reliability of AI
    components in production.
  - (Depending on experience) Lead AI initiatives, guide
    architecture and system design decisions, and mentor other
    engineers.

  QualificationsRequired

  - Proven experience building and deploying AI or ML systems in
    production at scale (not just prototypes or demos).
  - Deep understanding of model integration workflows — from
    inference pipelines to prompt engineering, fine-tuning, or
    RAG setups.
  - Strong backend engineering background (Python or Node.js
    preferred).
  - Experience designing AI architectures (e.g., hybrid
    retrieval systems, multi-model orchestration, or
    embeddings).
  - Experience with AWS cloud infrastructure and data pipelines.
  - Solid grasp of API development and system architecture for
    scalable applications.
  - Comfortable working independently and driving execution in a
    startup environment.

  Preferred

  - Experience integrating LLMs into production products
    (OpenAI, Anthropic, Vertex AI, etc.).
  - Familiarity with vector databases (e.g., Pinecone, Weaviate,
    FAISS, Chroma).
  - Experience with observability, monitoring, and evaluation
    for AI systems.
  - Experience leading projects or mentoring engineers.
  - Prior experience in healthtech, biotech, or working with
    sensitive health data.

  How we work

  - A mission that actually pulls people inWe make the
    microbiome measurable and actionable at every life stage,
    and real people write in to say it's life-changing.
  - Remote-first, real overlapOur FTEs are based in North
    America and work core hours from 9am–6pm CST, shiftable by
    up to two hours either way — start at 7am or 11am, wrap at
    4pm or 8pm.
  - Written first, huddle second, meet lastDefault to a clear
    Slack post, huddle when a thread stalls, and meet only to
    make a real decision.
  - Fast, but never sloppyDo the two-month thing in two weeks,
    then check the work—shipping errors is rework, not speed.
  - Shape what we build, not just how we build itThere's no
    playbook waiting for you, so write it—and bring the
    alternative, not just the objection.
  - Day One mentalityFewer titles and layers; process is a
    guardrail where it counts, never the reason something
    didn't ship.
  - No hidden agendasNumbers, misses, and feedback are shared
    openly and in real time, so you always know where you
    stand.
  - High standards, genuinely fun peopleTake the work seriously
    and ourselves much less—high-performing and fun to be
    around is the hiring bar.
  - Is this pace for you?Venture-scaled and on a steep
    trajectory, with intensity in spikes, fiercely protected
    flexibility, and faster growth than anywhere else.

  Our Values

  - Learn Fast, Get Better - Find the root cause, not just the
    fix, and get better every time
  - Be Relentlessly Resourceful - Dig for the answer, move fast,
    and know when to ask for help
  - Act Like an Owner, Be Hungry to Win - Act like it’s your
    company, and do whatever it takes to win
  - Act with Honesty and Empathy - Say what’s true, and say it
    with care
  - Delight People by Anticipating Their Needs - Solve the
    problem, then get two steps ahead of it
