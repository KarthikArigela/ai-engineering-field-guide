  About Us:

  ShipBob is a leading global supply chain and fulfillment
  technology platform designed for SMB and Mid-Market
  ecommerce merchants to provide them access to best-in-class
  capabilities and to deliver a delightful shopper experience.
  Merchants can outsource their entire fulfillment operations,
  utilize ShipBob’s proprietary warehouse management system
  for in-house fulfillment, or take advantage of a hybrid
  solution across ShipBob’s dozens of fulfillment center
  network in the United States, Canada, United Kingdom,
  Europe, and Australia. ShipBob is backed by leading
  investors like Menlo Ventures, Bain Capital Ventures, Hyde
  Park Venture Partners, and SoftBank Vision Fund 2, and is
  one of the fastest-growing tech companies headquartered in
  Chicago.

  At ShipBob, every full-time employee gets access to our
  best-in-class AI and productivity tools from Day 1 at no
  cost. This isn't a pilot or a perk for select teams. It's
  standard for everyone. We believe innovation isn't owned by
  one department. Whether you're in Talent, Operations,
  Finance, Engineering, or Customer Success, we expect you to
  ask: how can this be done better, faster, or smarter? These
  tools are our investment in your ability to find those
  answers.

  We may use AI-powered tools during our interview process to
  support things like notetaking and organizing feedback so
  our teams can stay focused on getting to know you. These
  tools help create a more consistent and thoughtful
  experience. That said, every hiring decision is made by a
  human.

