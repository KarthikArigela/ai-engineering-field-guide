description: |
  Job Description Amazing Career Moments Happen Here
  Transforming the insurance industry is ambitious, we know.
  That's why at Applied, we're building a team that shows up
  every day ready to learn, willing to try new things, and
  driven to deliver innovative software and services that make
  us indispensable to our customers - all within a culture
  built on values that make us indispensable to each other
  too. With 40+ years of experience in the Insurtech game,
  we're not just redefining what's achievable; we're creating
  a place where amazing career moments are made possible.
  Position Overview We're searching for a Sr. AI Automation
  Engineer to join our IT AI Automation team in Remote role.
  This full-time role will help harden, deploy, run, and
  partner on AI at scale across the business. The IT AI
  Automation team partners with business units that build
  proofs of concept, then hardens and ships those solutions to
  production on a shared, governed GCP platform with
  authentication, CI/CD, secrets management, and monitoring.
  To keep us headed in the right direction, we're looking for
  people who understand winning is a team sport, who value and
  seek to learn from our team's diverse experiences and
  backgrounds, who welcome a challenge and take risks in the
  pursuit of creating better outcomes for our customers, and
  who can, at any given time, step back to laugh and have some
  fun. What You'll Do

  - Build and deploy micro-apps with the business. Partner
    directly with business owners to take proofs of concept
    from "works on my machine" to production, including
    dashboards, reconciliation and reporting tools, internal
    apps, chatbots, and support agents.
  - Build AI integrations and agents. Design, build, and publish
    reusable Claude skills and agents across the company,
    including retrieval and tool-calling pipelines grounded in
    company data.
  - Integrate AI into existing business systems. Build
    integrations across systems such as Salesforce/Agentforce,
    Slack, NetSuite, and SQL data sources.
  - Harden applications for production. Apply authentication,
    access controls, secrets management, CI/CD, logging,
    monitoring, token and cost controls, and version control
    for prompts and agent configurations.
  - Operate apps on a governed GCP platform. Run and maintain
    applications on shared infrastructure, respond to issues,
    and support the apps the business depends on.
  - Automate secure software maintenance. Build and maintain
    tooling that auto-updates software libraries and
    dependencies so deployed apps stay patched and secure.
  - Evaluate and monitor AI quality. Build evaluations,
    regression tests, and quality monitoring for shipped apps
    and agents, including task completion, retrieval quality,
    drift, and system uptime.

  We're Excited to Learn More About You Your experience may
  include:

  - 5+ years building and shipping production software or
    data/automation applications.
  - Strong Python skills, solid SQL experience, and comfort
    working with real, governed data schemas.
  - Hands-on cloud experience, preferably with GCP, including
    deploying and operating services.
  - Working knowledge of production fundamentals, including
    authentication/identity, secrets management, CI/CD,
    logging, and monitoring.
  - Experience integrating with third-party APIs and SaaS
    platforms.
  - Ability to work directly with business stakeholders and
    translate evolving requirements into shipped, supportable
    software.

  You may have other skills or credentials, including:

  - Experience building LLM-powered applications and agents,
    including tool/function calling, retrieval, and agentic
    workflows.
  - Experience with LLM evaluation and observability tooling
    such as LangSmith, Langfuse, Braintrust, or equivalents.
  - Familiarity with retrieval pipelines and vector databases
    such as Vertex AI Vector Search, Pinecone, or pgvector.

  We know that talent comes from all backgrounds and
  experience levels. We encourage military members and their
  spouses as well as candidates without a degree or a
  background in tech to apply! When You Join Team Applied, You
  Can Expect: A culture that values who you are and recognizes
  that you aren't just an employee; you are a teammate, and
  you matter. We thrive on the benefits of our different
  experiences and celebrate the uniqueness our teammates bring
  to work with them every day. We flex our time together,
  collaborating remotely and in-person to empower our teams to
  work in the ways that work best for them. A comprehensive
  benefits and compensation package that centers our teammates
  and helps them to bring their best to work every day:

  - Medical, Dental, and Vision Coverage
  - Holiday and Vacation Time
  - Health & Wellness Days
  - A Bonus Day for Your Birthday

  Learn more about the people behind our products at Our
  targeted starting base salary in the United States for this
  position ranges from[$80,000 - $160,000 USD]. To determine a
  new team member's starting pay, we consider a variety of
  factors, including someone's depth, breadth, and variety of
  experience, skills, and responsibilities. Depending on the
  role, team members may also be eligible to participate in
  additional compensation plans such as bonus and commission.
  Your Security Matters: Our candidates' personal information
  and online safety are top of mind for us. At Applied, we
