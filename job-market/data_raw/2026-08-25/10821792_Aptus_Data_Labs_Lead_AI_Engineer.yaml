  Lead AI Engineer

  We are seeking a passionate and driven AI engineer with a
  proven track record of building and deploying cutting- edge
  AI solutions. As a leader you will be a driving force behind
  our AI strategy, providing technical guidance, fostering
  innovation and ensuring the successful delivery of AI
  projects.

   Responsibilities

  ·         Designing and implementing AI and machine learning
  models to solve business problems

  ·         Collaborating with cross-functional teams to
  understand requirements and deliver tailored AI solutions

  ·         Conducting research and prototyping new AI
  algorithms and techniques

  ·         Developing and maintaining AI models to improve
  performance and accuracy

  ·         Analyzing and interpreting complex data sets to
  extract meaningful insights

  ·         Documenting and presenting technical solutions to
  both technical and non-technical stakeholders

  ·         Keeping up-to-date with the latest advancements in
  AI and machine learning technologies

  Requirements

  Requirements

  ·         Bachelor’s or Master's Degree in Computer Science
  or other related fields.

  ·         Strong technical & analytical skill (Python OR R,
  SQL, predictive modelling, NLP/AI, Cloud, Generative AI,
  MLops, AIops etc)

  ·         Experience with Large Language Models like OpenAI
  API, ChatGPT, GPT-4, Bard and Langchain, HuggingFace
  Transformers etc

  ·         Proven experience in developing and implementing
  Gen AI algorithms and models

  ·         Solid background in machine learning, deep
  learning, and natural language processing

  ·         Experience with AI frameworks such as TensorFlow,
  PyTorch, or Keras

  ·         Proficient in handling and analyzing large
  datasets using SQL or NoSQL databases

  ·         Strong programming skills in Python.

  ·         Experience in model deployment & operation using
  CI/CD and cloud platforms (AWS, Azure,)

  ·         Strong problem-solving and analytical skills

  ·         Excellent communication and teamwork abilities

  ·         Client Interaction

  ·         Project Handling experience
