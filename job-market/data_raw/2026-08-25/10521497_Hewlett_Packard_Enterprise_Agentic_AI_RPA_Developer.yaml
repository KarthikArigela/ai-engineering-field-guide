description: |
  Agentic AI & RPA Developer



  This role has been designed as 'Hybrid' with a requirement
  that you will work on average 2 days per week from an HPE
  office.

  Who We Are:

  Hewlett Packard Enterprise is the global edge-to-cloud
  company advancing the way people live and work. We help
  companies connect, protect, analyze, and act on their data
  and applications wherever they live, from edge to cloud, so
  they can turn insights into outcomes at the speed required
  to thrive in today’s complex world. Our culture thrives on
  finding new and better ways to accelerate what’s next. We
  know varied backgrounds are valued and succeed here. We have
  the flexibility to manage our work and personal needs. We
  make bold moves, together, and are a force for good. If you
  are looking to stretch and grow your career our culture will
  embrace you. Open up opportunities with HPE.

  Job Description:



  HPE Operations is our innovative IT services organization.
  It provides the expertise to advise, integrate, and
  accelerate our customers’ outcomes from their digital
  transformation. Our teams collaborate to transform insight
  into innovation. In today’s fast paced, hybrid IT world,
  being at business speed means overcoming IT complexity to
  match the speed of actions to the speed of opportunities.
  Deploy the right technology to respond quickly to market
  possibilities. Join us and redefine what’s next for you.

  Job Family Definition:

  Analyzes, designs, programs, debugs, and modifies software
  enhancements and/or new products used in local, networked,
  or Internet- related computer programs, primarily for end
  users. Using current programming language and technologies,
  writes code, completes programming, and performs testing and
  debugging of applications. Completes documentation and
  procedures for installation and maintenance. May interact
  with users to define system requirements and/or necessary
  modifications.

  What you'll do:

  - Looking for experienced RPA & Agentic AI developer having
    strong expertise in building RPA Projects (preferably in
    WorkFusion) & have hands on experience in designing &
    developing AI Agents using latest Agentic AI Framework &
    LLMs.
  - Would require expertise in building industry standards
    automation solutions, integrating AI services, developing
    agentic workflows with and human-in-the-loop governance
    business critical projects
  - Design & develop automation solutions using WorkFusion and
    other technologies
  - Design & build AI Agents capable of reasoning, planning and
    orchestrating business workflows
  - Should be able to build Retrieval-Augmented Generation (RAG)
    solutions using enterprise knowledge sources
  - Should have expertise in building document intelligence
    solutions for extraction, classification & summarization.
  - Implement vector databases and semantic search
  - Hands on experience in the following:
    - WorkFusion & Other RPA Tools
    - API Integration
    - LangChain
    - LangGraph
    - MicroSoft CoPilot
    - MCP (Model Context Protocol)
    - Agent Orchestration Frameworks
  - Excellent communication skills
  - Should have strong problem solving and analytical skills
  - Should be a team player

  Education and Experience Required:

  - Bachelor's or Master's degree in Computer Science,
    Information Systems, or equivalent.
  - Typically 2-4 years experience.

  What you need to bring:

  - Using software applications design tools and languages.
  - Ability to apply analytical and problem solving skills.
  - Designing software applications running on multiple platform
    types.
  - Software applications testing methodology, including
    execution of test plans, debugging, and testing scripts
    and tools.
  - Strong written and verbal communication skills; mastery in
    English and local language.
  - Ability to effectively communicate design proposals and
    negotiate options.

