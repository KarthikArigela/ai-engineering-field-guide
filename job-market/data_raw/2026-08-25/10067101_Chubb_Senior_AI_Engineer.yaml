description: |
  About the Role:

  Chubb is looking for a Senior AI Engineer to lead the
  design, development, and deployment of advanced generative
  AI solutions that improve how we operate across the
  insurance lifecycle — from underwriting and claims to
  customer service and risk assessment. This role sits at the
  intersection of software engineering, applied AI, and
  technical leadership, turning the latest LLM capabilities
  into reliable, production-grade systems built on our Azure
  and Databricks platform. As a senior member of the team, you
  will not only build high-quality AI solutions, but also help
  shape technical direction, guide architecture decisions,
  mentor other engineers, and influence how AI capabilities
  are delivered across the organization.



  Key Responsibilities:

  - Lead the design and build of end-to-end generative AI
    applications using LangGraph, including agentic workflows,
    RAG pipelines, and LLM-integrated services.
  - Define and drive architecture for scalable, secure,
    reliable, and maintainable AI solutions deployed in
    production.
  - Develop robust, well-tested backend APIs with FastAPI,
    containerized via Docker and deployed on Kubernetes.
  - Architect and own search and retrieval solutions using Azure
    AI Search and MongoDB, including design of indexing
    strategies, hybrid search configurations, and retrieval
    evaluation.
  - Work within our Azure cloud environment, integrating with
    Azure OpenAI, Azure services, and our broader data
    platform.
  - Collaborate with product managers, data scientists,
    engineers, and other stakeholders to scope and deliver AI
    features that address real insurance business problems.
  - Own the full software lifecycle, including design, code
    review, testing, deployment, monitoring, and production
    support.
  - Translate complex business requirements into well-scoped
    technical solutions with a strong focus on reliability,
    maintainability, failure modes, and operational
    excellence.
  - Mentor and support junior engineers through design reviews,
    code reviews, and technical guidance.
  - Contribute to technical standards, best practices, and
    reusable patterns for AI engineering across the team.
  - Evaluate and improve model quality, retrieval strategies,
    prompt and agent design, and production performance over
    time.
  - Partner with business and technical leaders to shape AI
    roadmaps and identify high-impact opportunities for
    automation and decision support

  Qualifications

  Desired Qualifications:

  - 6+ years of software engineering experience, with strong
    fundamentals in system design, data structures, and clean
    code practices.
  - Proven experience designing and shipping production-grade AI
    or ML-enabled software systems.
  - Strong proficiency in Python, including building and
    shipping production backend services.
  - Hands-on experience building applications with LLMs such as
    Azure OpenAI, OpenAI, Anthropic, or similar.
  - Experience with FastAPI or comparable Python web frameworks.
  - Production experience with Docker and Kubernetes, including
    deployment and management on AKS.
  - Strong hands-on experience with Azure, including Azure
    OpenAI, Azure AI Search, AKS, and Databricks.
  - Proven production experience with LangGraph and LangChain,
    including multi-step agentic workflows and tool-calling
    agents.
  - Hands-on experience with Azure AI Search or other
    vector/hybrid search solutions, including vector search,
    hybrid search, and retrieval evaluation.
  - Experience with Databricks and PySpark for large-scale data
    processing.
  - Experience designing evaluation frameworks for LLM systems,
    including offline metrics, hallucination detection, and
    production monitoring.
  - Experience implementing responsible AI practices in a
    regulated environment, including audit trails, confidence
    scoring, and human-in-the-loop controls.
  - Background in traditional ML or data engineering, including
    feature pipelines, model training, and ETL, is preferred.
  - MongoDB or other NoSQL database experience is preferred.
  - Prior exposure to insurance domain concepts such as
    underwriting, claims, and policy administration is
    preferred.
  - Experience mentoring engineers, leading technical
    discussions, and influencing architecture decisions.



  Preferred Attributes:

  - Strong problem-solving skills and the ability to work
    through ambiguity.
  - Ability to balance speed of delivery with engineering
    quality and long-term maintainability.
  - Strong communication skills and the ability to explain
    technical concepts to both technical and non-technical
    stakeholders.
  - A proactive mindset with ownership of outcomes and
    continuous improvement.
  - Interest in emerging AI technologies and practical
    application of LLMs in enterprise environments.



  What Success Looks Like:

  - You lead the delivery of high-impact AI solutions that are
    reliable, scalable, and production-ready.
  - You help the team make better technical decisions through
    strong architecture and engineering judgment.
  - You raise the quality bar through mentoring, code reviews,
    and engineering best practices.
  - You contribute to a stronger AI engineering capability
    across the organization.
  - Join Chubb as a Senior AI Engineer and play a key role in
    shaping the future of intelligent, scalable, and
    enterprise-ready AI solutions that create real impact
    across the insurance lifecycle.

  We offer in return!

  Competitive salary & pension scheme, discretionary bonus
  scheme, 25 days annual leave plus ability to purchase 5
  additional days, hybrid working options, Private Medical
  cover, Employee Share Purchase Plan, Life Assurance,
  Subsidised gym membership, Comprehensive Learning &
  development offerings, Employee Assistance program.

  Integrity. client focus. respect. excellence. teamwork

  Our core values dictate how we live and work. We’re an
  ethical and honest company that’s wholly committed to its
  clients. A business that’s engaged in mutual trust and
  respect for its employees and partners. A place where
  colleagues perform at the highest levels. And a working
  environment that’s collaborative and supportive.

  Diversity & Inclusion. At Chubb, we consider our people our
  chief competitive advantage and as such we treat colleagues,
  candidates, clients, and business partners with equality,
  fairness and respect, regardless of their age, disability,
  race, religion or belief, gender, sexual orientation,
  marital status or family circumstances.

  We are committed to ensuring our recruitment process is
  inclusive and accessible to all. If you have a disability or
  long-term condition (for example dyslexia, anxiety, autism,
  a mobility condition or hearing loss) and need us to make
  any reasonable adjustments, changes or do anything
  differently during the recruitment process, please let us
  know.
