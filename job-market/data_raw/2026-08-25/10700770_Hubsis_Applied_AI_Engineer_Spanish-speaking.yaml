description: |
  This is a remote position.

  About Hubs

  At Hubs, we're building the intelligence layer for
  organizations — where anyone can build AI solutions that
  spread and compound across the org. Our team is growing,
  fast-moving, and ambitious — led by multi-exit Silicon
  Valley entrepreneurs with a strong track record of creating
  products that shape how people work.

  Joining Hubs means working on problems that matter. You'll
  be building for yourself, your peers, and millions of
  professionals navigating the shift from pre-AI to AI-first
  work. The products you create will be visible, widely used,
  and part of a broad societal transformation in how knowledge
  work gets done.

  The Role

  We're looking for an experienced Applied AI Strategist to
  work with our design-partner organizations and turn their
  business goals into working solutions.

  You'll work directly with senior leadership at each client.
  You're the bridge between what the business needs and what
  gets built — you understand the business, design the future
  state, and hand a clear blueprint to our engineering team,
  who build the solution using AI coding agents. Much of the
  job is knowing how to get the right information, read an
  organization, and build the alignment that makes change
  actually happen.

  Cycles are short. You'll go from spotting an opportunity to
  seeing it shipped in a fraction of the usual time, so the
  pace is fast and the feedback loop is tight.

  You'll be an early member of our applied AI team helping
  define how we work with customers.






  RequirementsWhat you'll do


  - Work with senior client leaders to understand their
    strategic goals and where AI, automation, analytics, and
    better data can move the business.
  - Work across the client's teams and ours to turn those goals
    into solutions — getting the right information, aligning
    the right people, and driving decisions.
  - Map how processes work today and design the future state.
  - Write clear, implementation-ready specifications our
    engineering team can build against.
  - Prioritize a portfolio of opportunities with client
    leadership, balancing value, feasibility, and strategic
    importance.
  - Stay close to the build so what ships matches the
    opportunity you identified.

  What we're looking for


  - A strong track record in business operations, strategy, or
    consulting — someone who quickly understands how a
    business works and where it can improve.
  - Strong business analysis and systems thinking: you can take
    a complex operation and see the structure underneath it.
  - The ability to work across an organization and move it
    forward — getting information, aligning stakeholders, and
    driving decisions to a conclusion.
  - Excellent facilitation and communication skills; comfortable
    working directly with executives.
  - The ability to translate business problems into clear
    requirements, and technical constraints back into plain
    language.
  - Fluency in Spanish and English.
  - Curiosity about AI and genuine interest in being early to
    how it reshapes real businesses. You don't need to have
    built AI systems — you need to see where they create value
    and specify them well.
  - A bias for speed — you're comfortable moving fast, working
    through ambiguity, and running many short cycles rather
    than one long one.
  - Native Spanish and Fluent English






  Travel and logistics This is a hybrid role with flexible
  hours. You'll commute occasionally to our Bay Area office,
  and — with advance notice — travel internationally to work
  with clients.





  What success looks like

  Customers uncover high-value opportunities they couldn't see
  before, align around a future-state vision, and our
  engineering team turns your blueprints into working systems
  on the Hubs platform — fast.






  BenefitsAt Hubs, we’re committed to building not just
  transformative products, but also a place where ambitious
  builders can thrive. You’ll join a fast-moving, design-
  obsessed team where your ideas have real impact from day
  one. We offer a competitive salary, a chance for
  participation in upside via stock plans, and the flexibility
  of a remote-first environment. As an early member of the
  engineering team, you’ll help shape both our product and our
  culture, working alongside passionate people who care deeply
  about craft, autonomy, and creating experiences users love.
