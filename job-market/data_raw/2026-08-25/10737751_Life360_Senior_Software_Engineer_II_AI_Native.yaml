title: Senior Software Engineer II, (AI Native)
company: Life360
location: USA
remote: true
work_type: FULL_TIME
description: |
  About Life360

  Life360’s mission is to keep people close to the ones they
  love. Our category-leading mobile app, Tile tracking
  devices, and Pet GPS tracker empower members to protect the
  people, pets, and things they care about most with a range
  of services, including location sharing, safe driver
  reports, and crash detection with emergency dispatch.
  Life360 serves approximately 102.4 million monthly active
  users (MAU), as of June 30, 2026, across more than 180
  countries.

  Life360 delivers peace of mind and enhances everyday family
  life with seamless coordination for all the moments that
  matter, big and small. By continuing to innovate and deliver
  for our customers, we have become a household name and the
  must-have mobile-based membership for families (and those
  friends who are basically family).

  Life360 has more than 500 (and growing!) remote-first
  employees. For more information, please visit life360.com.

  Life360 is a Remote First company, which means a remote work
  environment will be the primary experience for all
  employees. All positions, unless otherwise specified, can be
  performed remotely (within the US and Canada) regardless of
  any specified location above.

  We are AI Native

  We are building an AI native company where AI is an integral
  part of how we build and operate. AI tool usage during
  interviews varies by role. You may be asked to demonstrate
  proficiency with AI tools, discuss how you leverage AI, or
  complete interview exercises without AI assistance. Your
  Recruiter will provide clear guidance as you move through
  the interview process.

  Undisclosed use of AI not previously discussed with or
  approved by your Recruiter may impact your candidacy.

  About The Team

  Join us as we build the next evolution of our backend
  services to support Life360’s continued global growth. As
  part of the Ads team, you will help scale and modernize our
  AdServer and Exchange platform — a high-availability, low-
  latency distributed system processing billions of requests
  and events per day.

  We are evolving our backend architecture to power
  monetization across our ecosystem at massive scale. You will
  partner closely with Architecture and Product teams to
  expand our advertising capabilities, integrate new demand
  and supply partners, and support 20+ billion daily events.

  Our team leverages AI technologies to enhance functionality
  and efficiency, enabling us to develop smarter solutions
  that significantly improve user experiences. Your
  contributions will be instrumental in supporting Life360’s
  growth and innovation in the ever-evolving landscape of
  digital services. Together, we are building systems that are
  resilient under heavy load, horizontally scalable, and
  flexible enough to meet rapidly evolving product demands.

  At Life360, our teams are motivated by impact, thrive when
  empowered with high agency, are always curious, and build
  with engineering excellence as a first principle.

  About the Job

  As a Senior Software Engineer II on our Ads team, you will
  own the end-to-end development of key projects within our ad
  server and real-time bidding (RTB) solutions. This includes
  defining project scope, designing architecture, implementing
  features, and ensuring high-quality deliverables. You will
  play a pivotal role in shaping our technological direction
  and driving innovations that enhance our offerings in the
  digital advertising landscape, particularly through AI-
  native development.

  In this role, you will leverage AI technologies to improve
  targeting, optimize bidding strategies, and enhance user
  experiences. Your expertise in AI will be essential in
  navigating the evolving landscape of digital advertising,
  empowering us to effectively meet the growing demands of the
  market.

  The evolution of digital advertising necessitates the
  enhancement of our solutions, and your contributions will be
  vital in integrating AI-driven functionalities into our
  products. By taking on this position, you will have the
  opportunity to shape the future of our offerings while
  collaborating with senior engineers and mentoring junior
  team members. Your work will directly influence our ability
  to remain competitive and responsive to market trends,
  making this an exciting time to join our team.

  For candidates based in the US, the salary range for this
  position is $118,500 to $216,500 USD. For candidates based
  out of Canada, the salary range for this position is
  $171,500 CAD to $201,000 CAD. Note: Please be aware that the
  job title for positions in Canada will be "Developer" in
  lieu of "Engineer." We take into consideration an
  individual's background and experience in determining final
  salary - therefore, base pay offered may vary considerably
  depending on geographic location, job-related knowledge,
  skills, and experience. The compensation package includes a
  wide range of medical, dental, vision, financial, and other
  benefits, as well as equity.

  What You’ll Do

  - Build and maintain high-throughput backend services on the
    AdServer and Exchange platform, contributing to
    reliability, scalability, and performance targets.
  - Implement and improve Real-Time Bidding and auction logic,
    and support integrations with demand and supply partners.
  - Collaborate with Staff Engineers and architects to execute
    on platform design decisions and raise concerns where you
    see gaps.
  - Own features end-to-end — from design through deployment —
    with a focus on correctness, observability, and
    operational health.
  - Partner with Product on new ad formats and monetization
    capabilities, translating requirements into solid
    technical designs.
  - Contribute to monitoring, incident response, and root cause
    analysis to improve overall platform reliability.
  - Use AI tooling (including Claude Code) as a day-to-day
    collaborator — generating scaffolding, drafting schemas,
    and accelerating code review.
  - Mentor junior engineers and contribute to team standards
    around code quality, testing, and engineering practices.

  What We’re Looking For

  - Bachelor's degree in Computer Science, Engineering, or a
    related field.
  - 5–8 years of backend engineering experience, with strong
    proficiency in Java and multi-threaded system design.
  - Experience building or operating high-throughput, low-
    latency distributed systems in production.
  - Solid understanding of data consistency, performance trade-
    offs, and database fundamentals.
  - Comfort working in cloud-native environments, ideally AWS.
  - Familiarity with AdTech concepts (RTB, auctions,
    supply/demand integrations) is a plus.
  - Experience integrating third-party APIs or partner systems
    is a plus.
  - Clear, direct communication — you can explain a technical
    decision to an engineer or a product manager without
    losing either of them.
  - Openness to using agentic workflows and AI-assisted
    development to reduce cycle time and operational overhead.

  AI-Native Expectations

  We use AI coding tools as a professional standard on this
  team. Here's what that means in practice:

  - Daily use: You use AI coding assistants (we support Claude
    Code, Cursor, and GitHub Copilot) for real, substantive
    tasks: analysis, coding, refactoring, testing, navigating
    codebases, and documentation. Not just research or
    autocomplete.
  - Judgment and ownership: AI-generated code gets the same
    review you'd give any PR. You are accountable for
    everything you ship.
  - Velocity: We expect senior engineers who use AI well to
    operate with meaningful leverage — doing more with the
    same time, taking on problems that would otherwise require
    a larger team.
  - Team leadership: You share what works. You automate
    prompting strategies that others can build on and help
    teammates earlier in their AI workflow adoption get up to
    speed.
  - Continuous learning: The tooling is changing fast. You stay
    current and bring recommendations to the team when
    something would meaningfully improve how we work.

  Our Benefits

  - Medical, dental, vision, life and disability insurance plans
    (100% paid for US employees). We offer life and disability
    as well as supplemental plans for medical and dental for
    Canadian employees.
  - 401(k) plan with company matching program in the US and RRSP
    with DPSP plan for Canadian employees.
  - Paid parental leave
  - Mental Wellness Program & Employee Assistance Program (EAP)
    for mental well-being
  - Generous time off: flexible PTO, companywide holidays
    throughout the year plus summer and winter shutdowns
  - Learning & Development programs
  - Equipment, tools, and reimbursement support for a productive
    remote environment.
  - Free Life360 Platinum Membership Tile trackers

  Life360 Values

  Our company’s mission driven culture is guided by our shared
  values to create a trusted work environment where you can
  bring your authentic self to work and make a positive
  difference

  - Be a Good Person - We have a team of high integrity people
    you can trust.
  - Be Direct With Respect - We communicate directly, even when
    it’s hard.
  - Members Before Metrics - We focus on building an exceptional
    experience for families.
  - High Intensity, High Impact - We do whatever it takes to get
    the job done.

  Our Commitment to Diversity

  We believe that different ideas, perspectives and
  backgrounds create a stronger and more creative work
  environment that delivers better results. Together, we
  continue to build an inclusive culture that encourages,
  supports, and celebrates the diverse voices of our
  employees. It fuels our innovation and connects us closer to
  our customers and the communities we serve. We strive to
  create a workplace that reflects the communities we serve
  and where everyone feels empowered to bring their authentic
  best selves to work.

  We are an equal opportunity employer and value diversity at
  Life360. We do not discriminate on the basis of race,
  religion, color, national origin, gender, sexual
  orientation, age, marital status, veteran status, disability
  status or any legally protected status.

  We encourage people of all backgrounds to apply. We believe
  that a diversity of perspectives and experiences create a
  foundation for the best ideas. Come join us in building
  something meaningful. Even if you don’t meet 100% of the
  below qualifications, you should still seriously consider
  applying!

  #LI-Remote

