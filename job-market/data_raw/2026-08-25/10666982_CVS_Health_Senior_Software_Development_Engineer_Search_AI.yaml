description: |
  We’re building a world of health around every individual —
  shaping a more connected, convenient and compassionate
  health experience. At CVS Health®, you’ll be surrounded by
  passionate colleagues who care deeply, innovate with
  purpose, hold ourselves accountable and prioritize safety
  and quality in everything we do. Join us and be part of
  something bigger – helping to simplify health care one
  person, one family and one community at a time.

  A Brief Overview Evolve the Find Care experience at Aetna
  (CVS Health). The Senior Software Development Engineer
  Search Machine Learning is ideal for a seasoned search
  engineer with a strong grasp of large-scale information
  retrieval, relevance, ranking, and platform reliability. You
  will guide teams building high-impact search capabilities
  that help millions of members efficiently discover providers
  and care options. What you will do

  - Develop and implement advanced search solutions: Lead the
    development and optimization of search algorithms and
    systems utilizing technologies such as Elastic/OpenSearch
  - Fine-tune search relevance: Apply machine learning
    techniques, including classification and ranking models,
    to significantly improve the relevance of search results.
  - Explore and implement cutting-edge technologies: Contribute
    to the exploration and integration of Agentic Solutions,
    Retrieval-Augmented Generation (RAG), and Large Language
    Models (LLMs) to enhance search capabilities.
  - Analyze search data: Perform in-depth analysis of search
    queries, user behavior, and search performance metrics to
    identify areas for improvement and inform optimization
    strategies.
  - Collaborate with cross-functional teams: Partner with
    product managers, engineers, and business stakeholders to
    understand search requirements, develop solutions, and
    deliver impactful results.
  - Develop and evaluate analytical models: Utilize strong
    knowledge of algorithms and predictive models to
    investigate search-related problems, detect patterns, and
    recommend data-driven solutions.
  - Utilize programming skills: Leverage strong programming
    skills in Python to explore, examine, and interpret large
    volumes of search data.
  - Communicate technical concepts: Effectively communicate
    complex technical concepts and implications to both
    technical and non-technical audiences.

  Minimum Requirements

  - 5+ years of professional software engineering experience,
    with significant depth in search or data-intensive systems
  - 3+ years of experience in: Information Retrieval concepts
    (inverted indexes, scoring models, relevance tuning) Query
    understanding, Relevancy and Ranking
  - Demonstrated execution excellence, from design through
    production support
  - Growth mindset with a track record of mentoring engineers
    and raising technical standards
  - Experience in AI driven coding include Claude Code, Copilot

  Preferred Qualifications

  - 3+ years of experience in: Information Retrieval concepts
    (inverted indexes, scoring models, relevance tuning) Query
    understanding, Relevancy and Ranking
  - Experience with Search platforms: OpenSearch, Elasticsearch,
    and/or Solr

  Education

  - Bachelor’s degree or equivalent experience (Highschool
    diploma plus 4 years relevant work experience)

