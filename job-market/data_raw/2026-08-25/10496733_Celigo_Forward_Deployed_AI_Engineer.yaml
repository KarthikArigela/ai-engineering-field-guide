description: |
  Integration meets Innovation

  At Celigo, we believe integration should empower — not
  exhaust — innovation. As a modern Integration and Automation
  Platform (iPaaS), we’re on a mission to simplify how
  companies integrate, automate, and optimize processes.
  Powered by game-changing technology like runtime AI and
  prebuilt, mission-critical integrations, Celigo is
  redefining how businesses connect their world.

  The Forward Deployed AI Engineer (FDAE) is a pioneering role
  at the heart of our customers' agentic transformations.
  Using Celigo's strategic frameworks, you'll conduct
  workshops and interviews with executive team members to
  identify critical business processes, core challenges, and
  AI opportunities that Celigo is uniquely positioned to solve
  - then you'll collaborate with Customer build teams to bring
  those solutions to life.

  Embedded directly within Enterprise customer environments,
  this engineer drives rapid, measurable adoption of Celigo’s
  AI capabilities — including AI Studio, agentic workflows,
  and MCP server orchestration — by identifying high-value
  business processes ripe for automation and personally
  building production-grade solutions.

  What would you do if hired?

  - Conduct workshops and strategy sessions with executive
    teams, present findings, and translate into design
    documentation and project plans
  - Utilize Celigo’s AI capabilities — including AI Studio,
    agentic workflows, and MCP server orchestration
  - Coordinate with customer data teams to understand data
    quality and agentic transformation requirements
  - Design intelligent prompts and develop AI agents and
    solutions that drive real value for customers
  - Set up and maintain MCP servers for scalable integration
    runtime environments
  - Design and manage APIs, including defining endpoints,
    authentication, versioning, and governance best practices
  - Co-build alongside customers and partners, sharing best
    practices and enablement as you go
  - Contribute to proofs-of-concept and MVPs that move from
    sketch to deployable in days, not weeks
  - Perform end-to-end testing and validation of agentic
    solutions
  - Ensure best practices in performance, security, and
    governance
  - Provide go-live support, ongoing support, advisory services,
    and knowledge transfer to customers
  - Educate  customers on the use of Celigo platform’s agentic
    capabilities
  - Mentor junior developers and contribute to solution design
    reviews

  Who are we looking for?

  Skills & Abilities

  - Strong problem-solving skills with the ability to
    troubleshoot complex agentic issues
  - Excellent verbal and written communication skills across
    business, technical, and executive audiences
  - Client-facing professionalism with the ability to lead
    discussions, training, and advisory sessions
  - Self-starter with strong ownership, attention to detail, and
    ability to work independently
  - Ability to manage multiple priorities in a fast-paced,
    client-driven environment
  - Demonstrated business acumen and sound decision-making
    skills
  - Drive to self-learn and showcase emerging technologies,
    including AI and automation, to elevate the practice

  Technical Skills

  - Strong experience with prompt engineering, using frontier
    LLM models, API integration  and management to solve
    business problems
  - Strong understanding of API lifecycle management,
    versioning, security, and governance
  - Experience integrating ERP systems (NetSuite, Acumatica,
    Microsoft Dynamics, SAP, etc.)
  - Hands-on experience with cloud/SaaS platforms (Salesforce,
    Shopify, Amazon, etc.)
  - Data transformation expertise (JSON, XML, CSV, EDI, mapping,
    normalization)
  - Understanding of middleware and iPaaS architecture patterns
  - Experience integrating and operationalizing AI/LLM services
  - Familiarity with agentic architectures and orchestration
    concepts (e.g., Celigo agentic services, MCP servers)

  Education & Experience

  - Bachelor’s degree in Computer Science, Software Engineering,
    Information Systems, or a related field is preferred
  - 7+ years of total experience, ideally with 4+ years of
    experience in management / technical consulting with
    direct client engagement
  - 3+ years of experience with AI development (frontier models,
    agentic services, MCP servers) with at least one
    production agent you can walk through
  - Proven ability to design and deliver scalable, production-
    grade integration solutions
  - Experience across the full delivery lifecycle (requirements
    through post-go-live support)
  - Understanding of technologies such as Node.js, web services
    (SOAP/REST), and data transport formats (JSON, XML, EDI,
    flat files)
  - Familiarity with enterprise applications (NetSuite,
    Salesforce, Amazon, Google, Shopify, HubSpot, etc.)
  - Strong database fundamentals (SQL, data modeling, querying)
  - Knowledge of legacy integration methods (FTP, ACH, fixed-
    width files, EDI) is a plus

  Celigo reasonably expects to pay a base salary between
  $160,000 and $180,000 per year for this position. Actual
  starting base pay will be determined by skills, experience,
  geographic location, and other non-discriminatory factors
  permitted by law. Total compensation may also include
  variable incentives, benefits, or other perks as outlined in
  any formal employment offer made.

  Celigo is proud to be

  - A 2025 Gartner Customers’ Choice for iPaaS. The only vendor
    to receive this award.
  - Celigo is a Visionary in the Gartner Magic Quadrant for
    iPaaS for the second consecutive year
  - Celigo is ranked #1 iPaaS on G2 for multiple quarters and
    named a Leader in both B2B/EDI and API Management.
  - Celigo is a leading intelligent automation platform that
    puts the power of automation in the hands of every team,
    unifying workflows from the predictable to the fully
    agentic in a single platform.

  Here you'll experience

  - Remote-first culture, built on trust, collaboration, and
    transparency
  - A high-growth, inclusive work environment where innovation
    thrives and ideas are implemented
  - Lightspeed learning opportunities to keep you at the leading
    edge of your field
  - Exceptional coworkers who challenge and inspire you daily
  - Competitive compensation and benefits, including:

