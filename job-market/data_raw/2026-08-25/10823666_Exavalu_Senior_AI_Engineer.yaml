  applications for employment from all qualified candidates,
  regardless of race, color, gender, national or ethnic
  origin, age, disability, religion, sexual orientation,
  gender identity or any other status protected by applicable
  law. We nurture a culture that embraces all individuals and
  promotes diverse perspectives, where you can make an impact
  and grow your career. Exavalu also promotes flexibility
  depending on the needs of employees, customers and the
  business. It might be part-time work, working outside normal
  9-5 business hours or working remotely. We also have a
  welcome back program to help people get back to the
  mainstream after a long break due to health or family
  reasons.
