description: |
  About the Role We’re looking for a hands-on Full-Stack
  Software Engineer who can build, ship, and operate
  production systems end-to-end. You’ll work across the
  stack—React on the front end, Python services on the back
  end, and PostgreSQL in the data layer—while contributing to
  reliability, automation, and continuous delivery. The ideal
  candidate pairs strong technical depth with ownership,
  teamwork, and a growth mindset. What You’ll Do

   • Design, build, and maintain ReactJS single-page
  applications (state management, routing, performance).

  • Develop Python services and APIs (REST/GraphQL), including
  data models, validation, and testing.

   • Write performant SQL (PostgreSQL), including stored
  procedures/functions, query tuning, and schema evolution.

  • Automate workflows with UNIX shell scripting (build,
  deploy, data/backups, environment automation).

  • Partner with SRE/DevOps on observability (metrics, logs,
  traces), SLIs/SLOs, capacity, and incident response.

   • Collaborate closely with designers, product managers, and
  peers to deliver incremental value with high quality.

   • Contribute to code reviews, technical design docs, and
  engineering standards.

   • Own outcomes—help troubleshoot production issues, and
  support occasional extended hours during critical
  releases/incidents. Core Skills & Experience (Must-Have)

  • ReactJS: modern hooks, component patterns, state
  management (Context/Redux/Zustand), performance basics.

   • Python: strong hands-on experience with one or more
  frameworks (e.g., FastAPI, Flask, Django REST).

  • SQL/PostgreSQL: advanced querying, indexes, transactions,
  stored procedures/functions, migrations.

  • Shell scripting (UNIX): practical automation, tooling, and
  safe scripting practices.

  • Azure DevOps (ADO): pipelines, boards, artifacts; Git
  workflows; branch strategies; release management.

  • Set up and improve CI/CD pipelines (Azure DevOps/ADO
  preferred) with quality gates and automated tests.

  • SRE fundamentals: instrumentation, alerting, on-call
  etiquette, incident handling, post[1]mortems, basic capacity
  planning.

  • Software engineering practices: TDD/automated testing
  (PyTest/Jest), code reviews, documentation, secure coding.
  Nice to Have (Added Advantage)

   • TypeScript on the front end; component libraries
  (MUI/Ant/Tailwind).

  • API design (OpenAPI/Swagger), AuthN/Z (OAuth2/OIDC/JWT),
  rate limiting, and API gateways.

   • Containers & Cloud: Docker; Azure (preferred)

   • Databases: NoSQL (MongoDB, Cassandra, DynamoDB, etc.).

  • Caching & Messaging: Redis; basic knowledge of
  queues/streams (RabbitMQ/Kafka) and webhooks.

   • Observability stack: Prometheus/Grafana, OpenTelemetry,
  ELK/EFK, Sentry.

  • Security & Compliance: secrets management, dependency
  scanning, least-privilege, threat-model basics.

   • Data & Integration: ETL basics, file parsers, batch jobs,
  cron/schedulers.

   • AI/ML familiarity (not mandatory): calling model
  endpoints, embeddings, vector stores, OCR pipelines.

   • Kubernetes (nice to have): workloads, services, config,
  and deployments.

  • How You Work (Values & Behaviors)

   • Team-first collaborator: communicates clearly,
  gives/receives feedback, unblocks others.

  • Ownership & initiative: picks up ambiguous problems,
  proposes options, drives to closure.

   • Responsive & reliable: proactive updates; manages
  expectations; holds a high bar for quality.

   • Growth mindset: learns quickly, shares knowledge,
  improves systems and processes.

  • Whole-picture thinking: considers product, users,
  reliability, cost, and operational impact.

   • Resilience: willing to support critical paths and
  occasional extended hours to see problems through to
  resolution.

   Qualifications

  • 3–8+ years of full-stack engineering experience (or
  equivalent impact).

  • Proven delivery of production React + Python + PostgreSQL
  applications.

   • Preferable experience with CI/CD and at least basic
  SRE/operability practices
