description: |
  About the Role

  The speed at which Rubiscape ships is a product decision,
  not just an engineering one — and the AI Development
  Toolchain Engineer is the person who builds the
  infrastructure that makes every engineer on the platform
  faster. In this role, you will design, build, and operate
  the internal AI-assisted developer platform: the custom
  agents, IDE integrations, CLI tools, spec-to-code pipelines,
  and CI/CD hooks that encode Rubiscape’s AI-first engineering
  methodology into repeatable, automated workflows. You are
  the force multiplier behind the force multipliers — building
  the systems that help Rubiscape’s engineers leverage LLMs
  safely, consistently, and at the quality bar that Fortune
  500 enterprise customers demand.



  Key Responsibilities

  ·         Architect and build Rubiscape’s internal AI
  developer platform: custom LLM agents, IDE plugins (VS Code,
  Cursor), CLI tools, and spec-to-code automation pipelines
  integrated into the engineering workflow.

  ·         Design and maintain the CI/CD hooks that run AI-
  assisted code review, spec compliance checks, and automated
  test generation as part of every pull request pipeline.

  ·         Build the infrastructure for prompt versioning,
  agent configuration management, and LLM call logging to
  ensure reproducibility and auditability of AI-generated
  code.

  ·         Collaborate with Spec Engineering and Prompt
  Engineering teams to operationalise prompt libraries and
  spec templates as callable, versioned services within the
  developer toolchain.

  ·         Evaluate and integrate best-in-class external AI
  developer tools (GitHub Copilot Enterprise, Cursor, Codeium,
  custom OpenAI/Anthropic integrations) and adapt them to
  Rubiscape’s platform architecture and security requirements.

  ·         Define and monitor toolchain performance metrics:
  AI code acceptance rate, spec-to-PR cycle time, automated
  test coverage delta, and developer satisfaction scores.

  ·         Document toolchain architecture, onboarding
  guides, and runbooks so the full engineering org can adopt
  AI-assisted workflows with minimal friction.

  Nice to Have

  ·         Experience building VS Code extensions, Language
  Server Protocol (LSP) integrations, or other IDE tooling
  that surfaces AI assistance directly in the developer’s
  workflow.

  ·         Familiarity with LangChain, LlamaIndex, or multi-
  agent orchestration frameworks used to build complex,
  stateful AI coding agents.

  ·         Prior work at a platform engineering, developer
  experience (DevEx), or internal tools team at a high-growth
  SaaS company.

  ·         Knowledge of enterprise security and compliance
  requirements (SOC 2, ISO 27001) as they apply to LLM API
  usage, data residency, and code confidentiality.







  About Rubiscape

  Rubiscape is India’s leading Decision Intelligence Platform,
  unifying data engineering, BI, machine learning, and agentic
  AI in a single governed platform. Built in Pune and trusted
  by Fortune 500 enterprises across BFSI, manufacturing,
  healthcare, and government. 8 international innovation
  patents. 10 Industry-Academia Labs & COEs. From BI to AI —
  One Platform. Every Decision.

  RequirementsRequirements

  ·         4+ years of software engineering or
  platform/DevOps engineering experience, with at least 1–2
  years building or operating internal developer platforms,
  CLI toolchains, or developer productivity systems.

  ·         Strong Python and/or TypeScript skills;
  demonstrated experience building production-grade automation
  scripts, developer tools, or engineering platform
  components.

  ·         Hands-on experience integrating LLM APIs (OpenAI,
  Anthropic, or equivalent) into automated workflows,
  including prompt management, response parsing, and error
  handling.

  ·         Solid understanding of CI/CD systems (GitHub
  Actions, GitLab CI, or Jenkins) and the ability to design
  and implement custom pipeline steps and quality gates.

  ·         Experience with containerisation (Docker,
  Kubernetes) and cloud infrastructure (AWS, Azure, or GCP)
  relevant to deploying and scaling internal toolchain
  services.

  ·         B.E. / B.Tech in Computer Science, Software
  Engineering, or a related discipline.
