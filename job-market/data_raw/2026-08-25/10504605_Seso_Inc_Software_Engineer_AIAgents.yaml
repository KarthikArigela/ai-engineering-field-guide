description: |
  American farmers have made tremendous technology
  advancements through hardware improvements and investments
  in precision agriculture. However, when it comes to the
  back-office, most farms are decades behind, relying on
  spreadsheets, filing cabinets, and decades-old on-prem
  software to recruit, manage, and pay their workforce. Seso
  is addressing this problem by modernizing the back-office
  for the farm.

  Our mission is to build the premier platform for
  agribusiness to hire and manage their workforce and improve
  the lives of agricultural workers. We are addressing
  American farmers’ biggest pain point - access to qualified
  labor - through a software-enabled labor solution that
  automates the H-2A visa. Our  comprehensive HR platform
  streamlines and automates the hiring process for farms and
  seamlessly integrates their efforts across recruitment,
  onboarding, payroll, and insurance while providing workers
  access to financial services for the first time.

  Seso has raised over $60M from Tier I investors including
  Index, Founders Fund, and Mary Meeker at Bond, and has been
  recognized with awards including Forbes Rising Stars and
  Andreessen Horowitz's American Dynamism 50.

  About the role: Seso is building the first modern payroll
  and workforce platform for agriculture, an industry that's
  been ignored by every other HR/payroll company because it's
  "too hard." We're growing fast, and we're looking for an
  engineer who's genuinely AI-native: not someone bolting a
  chatbot onto a product, but someone who thinks in agents,
  evals, and production ML systems as a default way of
  building software. We’ve shipped our first agents, and need
  a true thought partner to help level up our game.

  What you'll do

  - Design and ship production AI agents that are core to the
    product experience (not prototypes, not demos)
  - Work across our stack (TypeScript, Node.js/React) to build
    features end-to-end
  - Bring ML/AI judgment to product decisions as in, where
    agents make sense, where they don't, and how to make them
    reliable in production
  - Move fast in a startup environment where you'll own real
    ambiguity and be empowered to push the boundaries

  Must-haves

  - Hands-on ML background and/or real experience building and
    shipping production AI agents (not just API calls to a
    model: non-trivial agent design, evals, and reliability
    work at scale)
  - Strong TypeScript experience
  - 2+ years of professional software development experience

  Nice-to-haves

  - Experience with LangGraph/LangChain or similar agent
    frameworks
  - Node.js/React stack experience
  - Forward-deployed engineering (FDE) experience and comfort
    being customer-facing -  translating real-world problems
    into shipped solutions
  - 3–5+ years of professional development experience
  - Based in San Francisco (preferred)

  Comp range: $160,000 - $220,000 annually

  We carefully consider a wide range of compensation factors
  to determine your personal top of market. We rely on market
  indicators to determine compensation and consider your
  specific job related skills and experience for accuracy.
  These considerations can cause your compensation to vary and
  will also be dependent on your location.

  Diversity is more than a commitment at Seso, it is the
  foundation of what we do. We pride ourselves on building the
  premier platform that serves agribusiness and improves the
  lives of agricultural workers. We believe in diversity of
  race, gender, sexual orientation, age, religion, ethnicity,
  national origin and all the other fascinating
  characteristics that make us all feel welcome.

  Seso participates in E-Verify
