description: |
  Company Description

  👋🏼We're Nagarro.

  We are a Digital Product Engineering company that is scaling
  in a big way! We build products, services, and experiences
  that inspire, excite, and delight. We work at scale across
  all devices and digital mediums, and our people exist
  everywhere in the world (18000+ experts across 40 countries,
  to be exact). Our work culture is dynamic and non-
  hierarchical. We're looking for great new colleagues. That's
  where you come in!

  Job Description

  REQUIREMENTS:

  - Total experience: 13+ years.
  - Strong expertise in Solution Architecture, Java, Spring
    Boot, and Microservices.
  - Extensive hands-on experience designing and implementing AWS
    cloud-native solutions using services such as EKS, Lambda,
    API Gateway, Cognito, DynamoDB, S3, CloudFront,
    OpenSearch, SQS/SNS, CloudWatch, and related AWS services.
  - Strong understanding of AI Application Solution Design with
    experience integrating AI services such as Amazon
    SageMaker, Rekognition, Polly, AI Search, or similar AI/ML
    platforms.
  - Good architectural knowledge of Angular and React Native
    applications, with the ability to guide frontend
    engineering teams.
  - Experience driving cloud architecture, scalability,
    security, performance optimisation, and cost optimisation
    initiatives.
  - Strong experience working with CI/CD, DevOps,
    containerisation, and modern software engineering best
    practices.
  - Excellent client-facing, stakeholder management, technical
    leadership, and communication skills.

  RESPONSIBILITIES:

  - Own and evolve the overall solution architecture across
    cloud infrastructure, backend, and frontend platforms.
  - Design and govern scalable, secure, and cost-effective AWS
    cloud architecture for enterprise applications.
  - Provide architectural guidance for Java/Spring Boot
    microservices and mentor engineering teams on
    implementation best practices.
  - Define high-level architecture for Angular and React Native
    applications, ensuring seamless integration with backend
    and cloud services.
  - Identify and implement AI-driven automation opportunities
    and recommend AI service integrations to enhance product
    capabilities.
  - Drive technical roadmap initiatives including Java and
    Spring Boot upgrades, cloud optimisation, performance
    improvements, and technical debt reduction.
  - Lead technical discussions with clients, provide solution
    recommendations, and act as the primary technical point of
    contact.
  - Ensure architectural governance, engineering standards, and
    best practices are followed throughout the SDLC while
    guiding cross-functional teams to deliver high-quality
    solutions.

  Qualifications

  Bachelor’s or master’s degree in computer science,
  Information Technology, or a related field.
