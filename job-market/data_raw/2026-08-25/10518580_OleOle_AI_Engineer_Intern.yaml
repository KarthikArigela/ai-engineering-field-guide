  - Exceptional entrepreneurial judgment that fosters
    independence over micro-management
  - Strong work ethic and ability to deliver high-quality
    results in a fast-paced work environment (This is not a
    9-5 Monday to Friday role!) We are looking for leaders.
  - Detail-oriented and organized with superior analytical
    abilities
  - Excellent communication, presentation, and interpersonal
    skills
  - Compensation will be a monthly Salary, depending upon
    experience and quantifiable contributions to user growth.



