description: |
  AI Software Engineer



  Location: Bangalore

  Job Type: Full Time

  Experience Level: Senior



  About the Role:



  We are seeking a talented AI Software Engineer to join our
  team and help develop innovative AI-driven solutions. You
  will be responsible for designing, implementing, and
  optimizing AI models, integrating them into software
  applications, and working closely with data scientists and
  engineers to build scalable AI-powered products.



  Key Responsibilities:

  ·         Design, develop, and deploy AI and machine
  learning models for real-world applications.

  ·         Work with large datasets to train and fine-tune
  models, ensuring high accuracy and efficiency.

  ·         Build and optimize deep learning architectures
  using frameworks like TensorFlow, PyTorch, or Scikit-learn.

  ·         Develop and maintain AI-driven software
  applications, integrating models into production
  environments.

  ·         Collaborate with cross-functional teams, including
  data scientists, software engineers, and product managers.

  ·         Optimize AI models for performance, scalability,
  and deployment on cloud platforms (AWS, Azure, GCP).

  ·         Implement MLOps best practices for model
  versioning, deployment, and monitoring.

  ·         Stay up-to-date with the latest AI research,
  tools, and techniques to continuously improve AI
  capabilities.

  Requirements

  Required Qualifications:

  ·         Bachelor’s or Master’s degree in Computer Science,
  AI, Machine Learning, or a related field.

  ·         Strong programming skills in Python, Java

  ·         Experience with AI/ML frameworks such as
  TensorFlow, PyTorch, Scikit-learn, or Keras.

  ·         Knowledge of NLP, Computer Vision, or
  Reinforcement Learning is a plus.

  ·         Hands-on experience with cloud computing (AWS,
  GCP, Azure) for AI model deployment.

  ·         Familiarity with data structures, algorithms, and
  software development best practices.

  ·         Experience with containerization (Docker,
  Kubernetes) and APIs for model integration.

  ·         Strong problem-solving skills and the ability to
  work in a fast-paced environment.

  ·         Experience with LLMs (Large Language Models),
  Generative AI, or AI-powered automation.

  ·         Understanding of AI ethics, bias mitigation, and
  responsible AI practices.

  ·         Knowledge of big data technologies like Hadoop,
  Spark, or Kafka.

  Benefits

  •              Work with cutting-edge technologies and a
  talented team.

                  •              Competitive salary and
  benefits package.

                  •              Flexible work environment
  with growth opportunities.

                  •              Access to professional
  development and learning resources.
