description: |
  About interface.ai

  interface.ai is the agentic AI platform for financial
  services — bringing conversational and agentic AI to the
  credit unions and community banks that serve everyday
  Americans. We're not a lab, we're not a demo company, and
  we're not burning runway on hypotheticals. We are in
  production, generating real revenue, and on a mission that
  matters: making intelligent financial services available to
  the millions of people who've never had a private banker.
  More than 100 banks and credit unions run on interface.ai,
  reaching over 10 million people. Many products are live
  today; the biggest bets — an AI-first contact center and an
  AI-native consumer banking experience — are what comes next.
  Backed by $30M in Series A funding and already cash-flow
  positive, we're at the inflection point: a proven product,
  paying customers, and a profitable business rebuilding
  itself as an AI-native company to lead a world where agents,
  not software, do the work.



  The Role

  We're rebuilding interface.ai as an AI-native company — and
  that starts with how we hire. We've already built an
  internal AI-powered talent acquisition tool. Your job is to
  take it over, expedite it, and turn it into a fully
  automated recruiting pipeline: AI-driven sourcing, automated
  screening, AI interviews, and candidate evaluation at scale.

  This is a rare kind of role: applied AI engineering with a
  single, high-leverage internal customer — the company
  itself. You'll own the system end-to-end, work directly with
  our CEO Srinivas Njay and the talent team, and see the
  impact of what you ship in days, not quarters. Recruiting is
  one of the highest-volume, most repetitive workflows in any
  fast-growing company — and one of the best proving grounds
  for agentic AI.



  Areas You Could Work On

  - Own and accelerate our internal AI talent acquisition
    platform — an existing, working tool that needs a
    dedicated engineer to take it from v1 to fully automated
  - Build automated pipelines for sourcing, resume screening,
    and candidate evaluation using LLMs and agentic workflows
  - Design and ship AI-conducted interviews and structured
    screening — conversational flows, scoring rubrics, and
    evaluation logic that recruiters and hiring managers trust
  - Integrate deeply with our recruiting stack (ATS, scheduling,
    communication tools) so the pipeline runs with minimal
    human touch
  - Own technical decisions end-to-end: architecture, data
    models, prompt and eval design, performance, and
    reliability
  - Work side-by-side with the CEO's office and talent team — in
    the office, in real time, every day



  What We're Looking For

  - 3+ years of software engineering experience (SWE II / Senior
    level) with production systems you built and owned, not
    just contributed to
  - Strong applied AI/LLM engineering: you've built on top of
    LLMs, understand prompt engineering, evals, and agentic
    architectures — and know where AI adds value and where it
    doesn't
  - Proficiency in TypeScript and/or Python
  - Experience automating real workflows end-to-end — you think
    in pipelines, integrations, and edge cases, not demos
  - Degree in Computer Science or related field from a top-tier
    program (we take fundamentals seriously)
  - Self-directed and decisive: you identify problems before
    they're assigned, propose solutions before they're
    requested, and close loops without reminders
  - In SF, committed to 5 days/week — the collaboration is real
    and intentional



  Bonus Points

  - Experience building recruiting, HR tech, or other internal
    tooling that people actually adopted
  - Production experience with conversational AI, voice agents,
    or automated interviewing
  - Experience being an early engineer at a startup that shipped
    successfully



  Benefits

  🩺 100% paid health, dental & vision care

  💰 401(k) & financial wellness perks

  🍜 Daily meals on us

  🚇 Commuter benefit

  💪 Monthly wellness stipend

  🤖 Claude Enterprise + frontier AI tools for every employee —
  build with the best

  🏙️ Brand-new 21st-floor SF office at 44 Montgomery — floor-
  to-ceiling views, worth showing up to

  🌴 Discretionary PTO + paid parental leave

  🧘 Mental health, wellness & family benefits

  🚀 A mission-driven team shaping the future of banking



  Why interface.ai

  Series A · $30M raised · Cash-flow positive — we're not
  burning cash hoping the product works. It works. Customers
  are live, revenue is real, and the mission is one you can
  explain to your family without a slide deck.

  You'll work directly with Bruce Kim (CTO / Co-Founder), who
  sets the technical bar and goes deep on the hardest
  problems, and Srinivas Njay (CEO), who is hands-on daily
  across product and engineering. Founding-team-tier equity,
  top-of-market base, comprehensive benefits, and a modern San
  Francisco office worth showing up to. The team is small
  enough that your judgment shapes everything, and the market
  is large enough that what you build will matter for a long
  time.



  interface.ai is an equal opportunity employer. We celebrate
  diversity and are committed to creating an inclusive
  environment for all employees
