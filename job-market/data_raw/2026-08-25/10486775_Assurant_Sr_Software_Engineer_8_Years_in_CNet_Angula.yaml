description: |
  Senior Software Engineer, Assurant-GCC, India

  At Assurant, a Senior Software Engineer analyzes
  requirements and designs, codes, tests, installs and
  maintains application systems, programs, functions,
  services, and other related software components in response
  to enterprise needs of high complexity. We are looking for a
  thoughtful, adaptive individual with a growth mindset to
  join our growing team.

  In this role, you will work closely with our product teams
  to create APIs and web applications to serve customers with
  engaging, dynamic user experience. We are looking for people
  with expertise in .net 6+ and Angular 16+. Responsibilities
  include solving problems, experimenting, and building
  features that we measure for value to our users. Candidates
  must have strong communication skills, the ability to manage
  multiple tasks efficiently, sound judgment, and the ability
  to be productive in a fast-paced, team-oriented environment.

  We are seeking engineers who are AI-literate and can
  effectively leverage modern AI-assisted development tools
  throughout the Software Development Lifecycle (SDLC). The
  ideal candidate understands how to use AI to accelerate
  design, development, testing, code quality, documentation,
  troubleshooting, and operational excellence while
  maintaining strong engineering judgment and delivery
  accountability.

  This position will be based in Hyderabad/Bangalore at our
  India location.

  What will be my duties and responsibilities in this job?

  - Build scalable, highly reliable product features
  - Design, implement, and maintain web applications used by
    both mobile and desktop users
  - Work closely with client developers to architect high-
    throughput systems
  - Create and maintain documentation pertaining to code and
    engineering processes
  - Work in a collaborative environment by occasional pair
    and/or mob programming
  - Evaluate technical capabilities, options, and strategies
  - Communicating with Engineering Managers and Product Owners
    to plan and prioritize work and design technical solutions
  - Work in a cadence of two-week sprints with daily stand-ups
    and bi-weekly retrospectives
  - Conduct design and code reviews
  - Grow subject matter expertise in programming, product, and
    platform
  - Other projects and assignments may result and be assigned to
    accommodate the changing needs of the department and the
    company.

  What are the requirements needed for this position?

  - C# expertise
  - 8+ years of .NET 6+
  - 2+ years of Angular 16+ experience
  - Hands-on knowledge of version control systems such as Git
  - Experience with SQL Server, other relational database
    engines and relational database design
  - Knowledge of RESTful API design
  - Knowledge of Microservice based architecture patterns
  - Ability to demonstrate technical know-how through individual
    contributions, pair programming exercises, and
    architectural designs
  - Strong oral and written communication skills to create a
    productive communication environment with team members and
    stakeholders
  - Knowledge of Agile/Scrum best practice processes and
    techniques

  What other the Preferred skills required?

  - Bachelor’s Degree in Computer Science or related field
  - Knowledge of Microsoft Service Fabric
  - Documentation skills to translate requirements into
    specifications for program objects, functions, and
    systems.
  - Estimation skills for cost, effort, and duration of product
    deliverables of high complexity
  - Analysis skills for technical problems and solutions
  - Advanced programming skills in targeted languages and
    utilities for the distributed environments
  - Experience working in Agile/Scrum team
  - Understanding of quality assurance and testing procedures,
    processes and techniques employed within areas of
    technical specialty
  - Experience with TDD/BDD frameworks
  - Knowledge of concepts, tools and processes used for
    estimating, tracking, managing, and reporting work
  - Experience in client/server and n-tier development
    principles including understanding of Object-Oriented
    modeling, analysis, design, and programming
  - Willingness to participate in mentoring and skills transfer
    among team members
  - A continuous learning mindset that keeps you current on
    development best practices and trends
  - Desire for a deep technical understanding for the problems
    at hand
  - Ability to balance trade-offs between speed and quality
    based on business priorities

