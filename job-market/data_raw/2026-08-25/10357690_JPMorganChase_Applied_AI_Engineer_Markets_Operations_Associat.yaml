description: |
  Help shape the next wave of Applied AI innovation in Markets
  Operations by turning ideas into production-ready solutions.
  You will build practical AI capabilities that improve
  workflows, strengthen controls, and unlock productivity for
  teams across the organization. Working alongside engineers,
  AI specialists, and operations partners, you will bridge
  cutting-edge techniques with enterprise-grade systems. At
  JPMorganChase, you can grow your career through meaningful
  work, strong mentorship, and hands-on ownership. Join a team
  that values creativity, collaboration, and continuous
  learning. As an Applied AI Engineer in the applied AI team
  within Markets Operations, you will design, build, test, and
  deploy scalable AI services integrated with strategic
  systems and operational processes. You will collaborate with
  software engineers, AI and data science specialists,
  operations stakeholders, and business partners to improve
  operational workflows, controls, and the software
  development lifecycle. You will focus on hands-on
  engineering across Python services, APIs, data pipelines,
  infrastructure, monitoring, and production readiness. You
  will build domain knowledge across Markets Operations and
  translate real workflow pain points into durable solutions.
  You will contribute to a culture of innovation,
  collaboration, and engineering excellence.


  Job Responsibilities

  - Contribute to technology and architecture patterns that
    enable AI solutions across Markets Operations and software
    engineering use cases
  - Build and enhance robust, scalable, reusable AI services and
    supporting infrastructure using modern technologies
  - Collaborate with AI and data science specialists to design,
    develop, test, and deploy services integrated with
    strategic systems and operational processes
  - Learn Markets Operations processes and apply that knowledge
    to develop practical solutions and integrations with
    banking operations systems
  - Evaluate new AI infrastructure technologies and share
    findings to inform team technical decisions
  - Document designs, implementation details, and tradeoffs to
    support maintainability and knowledge sharing
  - Support scalability, reliability, and security of AI and
    machine learning solutions in production, with a focus on
    operational readiness and sustainability
  - Partner with operations stakeholders to understand workflow
    pain points and translate them into practical technology
    solutions

  Required Qualifications, Capabilities, and Skills

  - Hold a Bachelor’s or Master’s degree in Computer Science,
    Software Engineering, a related field, or equivalent
    practical experience
  - Demonstrate strong Python programming skills
  - Design, develop, and integrate RESTful APIs, such as with
    FastAPI
  - Build and support ETL and data pipeline engineering
    workflows
  - Apply Infrastructure as Code practices, such as Terraform,
    and work within CI/CD pipelines
  - Design and integrate databases and data models
  - Apply monitoring practices and understand controls and
    compliance concepts in production environments
  - Communicate effectively in writing and verbally, explaining
    technical concepts to technical and non-technical
    audiences
  - Collaborate effectively on multi-disciplinary teams and
    incorporate feedback into your work

  Preferred Qualifications, Capabilities, and Skills

  - Apply AI and machine learning concepts with a strong
    interest in applied AI productization
  - Bring experience from academic work, projects, internships,
    or roles applying AI in finance, operations, markets, or
    enterprise technology
  - Demonstrate familiarity with Markets Operations processes
    such as trade lifecycle, post-trade operations,
    reconciliations, controls, or exception management
  - Use AWS and tools such as MLflow
  - Develop front-end capabilities with React or modern front-
    end development
  - Apply graph database modeling concepts

  Why Join Us? Your contributions will help redefine what’s
  possible in financial services. You’ll be part of a team
  that values creativity, collaboration, and continuous
  learning, empowering you to make a real impact and grow your
  career.

  #CIBAppliedAI


