job_id: 10546136
title: IT Platform Engineer (Data Lake and AI Gateway)
company: Sembi
location: USA
remote: true
work_type: FULL_TIME
description: |
  Role

  Build and operate Sembi's AWS-native data lake and AI
  gateway. This is a hands-on IC role focused on
  infrastructure-as-code, cloud data services and the platform
  layer that supports internal AI enablement. You will own the
  plumbing that makes data and model access reliable, secure,
  and self-service for the rest of the org.

  What you'll do

  - Build and maintain the AWS-native lakehouse foundation using
    Python, Glue, Athena and S3, including medallion-style
    layering from raw through curated tables (Iceberg).
  - Manage all infrastructure through code (Terraform or
    equivalent), with version control, review, and repeatable
    deployments as the default.
  - Build and maintain data pipelines that move and transform
    data into the lake reliably, with monitoring and clear
    failure handling.
  - Operate/support the internal AI platform including LLM
    gateway, Bedrock, custom utilities and zero-trust access
    controls.
  - Enforce security and access baselines across data and model
    layers, including IAM scoping, network controls, and
    secrets handling.
  - Partner with IT, Security, and Engineering to keep the
    platforms aligned with broader operations standards.

  Required

  - Strong infrastructure-as-code experience (Terraform or
    equivalent) as a primary way of working, not an
    afterthought.
  - Solid AWS fundamentals across IAM, networking (VPC,
    PrivateLink), and S3.
  - Proficiency in Python for data pipelines, automation and
    tooling.
  - Comfort operating production infrastructure independently as
    an IC and managing work through an Agile process.

  Preferred (either is a strong plus)

  - Platform experience with LLM gateways, API proxies, or
    Bedrock/model-serving infrastructure.
  - Data engineering depth: pipeline design, Glue/Athena, and
    lakehouse patterns.

  You'll do well here if

  - You default to automation and reproducibility over manual
    fixes.
  - You are direct about tradeoffs and gaps rather than papering
    over them.
  - You can work independently across time zones while keeping
    CST hours for collaboration.
