description: |
  About the Role:

  Grade Level (for internal use):

  11

  The Team: As part of the Collection Platforms & AI team you
  will work on building AI powered products and capabilities
  to power natural language understanding, data extraction,
  information retrieval and data sourcing solutions for S&P
  Global and our clients. You will spearhead development of
  production-ready AI products and pipelines while leading-by-
  example in a highly engaging work environment. You will work
  in a global team and encouraged for thoughtful risk-taking
  and self-initiative. The Impact: •    The Collection
  Platforms & AI team has already delivered breakthrough
  products and significant business value over the last 5
  years. •    In this role you will be developing our next
  generation of new products while enhancing existing ones
  aiming at solving high-impact business problems. What’s in
  it for you: •    Be a part of a global company and build
  solutions at enterprise scale and deliver large-scale
  initiatives. •    Contribute to solving high complexity,
  high impact problems delivering measurable business value. •
  Collaborate with a highly skilled and technically strong
  team Key Responsibilities •    Modernize and enhance core
  enterprise systems, migrate platforms and workloads,
  and consolidate tools/technology stacks to improve
  reliability, security, scalability, and cost-efficiency •
  Build production ready data acquisition and transformation
  pipelines from ideation to deployment •    Being a hands-on
  problem solver and developer helping to extend and manage
  data platforms •    Contribute in the architecture design
  and development of end-to-end data ingestion and processing
  pipelines to support downstream workflows •    Define best
  practices for data modeling, performance optimization, and
  governance What We’re Looking For: •    Hands on experience
  in development of complex software systems applications - 5+
  years •    Proficiency in Python and SQL •    Expertise in
  Snowflake architecture and large-scale migration projects •
  Strong understanding of performance tuning, security, and
  cost optimization •    Experience integrating Snowflake with
  BI tools

  Bachelors/Masters (preferred) degree or equivalent
  experience in Computer Science, Data Science, Statistics, or
  other quantitative disciplines

  Nice to have:

  - LLMs and prompt engineering
  - Experience building agentic solutions

  What’s In It For You?

  Our Mission:

  Advancing Essential Intelligence.

  Our People:

  We're more than 35,000 strong worldwide—so we're able to
  understand nuances while having a broad perspective. Our
  team is driven by curiosity and a shared belief that
  Essential Intelligence can help build a more prosperous
  future for us all.From finding new ways to measure
  sustainability to analyzing energy transition across the
  supply chain to building workflow solutions that make it
  easy to tap into insight and apply it. We are changing the
  way people see things and empowering them to make an impact
  on the world we live in. We’re committed to a more equitable
  future and to helping our customers find new, sustainable
  ways of doing business. Join us and help create the critical
  insights that truly make a difference.

  Our Values: Integrity, Discovery, Partnership

  Throughout our history, the world's leading organizations
  have relied on us for the Essential Intelligence they need
  to make confident decisions about the road ahead. We start
  with a foundation of integrity in all we do, bring a spirit
  of discovery to our work, and collaborate in close
  partnership with each other and our customers to achieve
  shared goals. Benefits:

  We take care of you, so you can take care of business. We
  care about our people. That’s why we provide everything
  you—and your career—need to thrive at S&P Global. Our
  benefits include:

  - Health & Wellness: Health care coverage designed for the
    mind and body.
  - Flexible Downtime: Generous time off helps keep you
    energized for your time on.
  - Continuous Learning: Access a wealth of resources to grow
    your career and learn valuable new skills.
  - Invest in Your Future: Secure your financial future through
    competitive pay, retirement planning, a continuing
    education program with a company-matched student loan
    contribution, and financial wellness programs.
  - Family Friendly Perks: It’s not just about you. S&P Global
    has perks for your partners and little ones, too, with
    some best-in class benefits for families.
  - Beyond the Basics: From retail discounts to referral
    incentive awards—small perks can make a big difference.

