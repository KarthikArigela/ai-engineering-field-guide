description: |
  This is your chance to change the path of your career and
  guide multiple teams to success at one of the world's
  leading financial institutions.

  As a AI/ML Engineering Associate at JPMorgan Chase within
  the Business Banking you will be a key member responsible
  for designing and delivering trusted, market-leading AI
  technology products. Your role will involve implementing
  critical technology solutions across various technical
  domains to support the firm’s strategic objectives, ensuring
  security, stability, and scalability.

   Job Responsibilities:

  - Define the AI‑driven validation roadmap across Business
    Banking.
  - Architect and embed end‑to‑end AI checks into campaign
    authoring and execution workflows for all channels.
  - Build AI/ML models to enhance final reads (pre‑launch
    approvals), incorporating external signals and trend
    analysis to generate actionable recommendations.
  - Partner with Marketing, , Legal, Compliance, and Controls to
    operationalize AI capabilities and standardize measurement
    across  CCB sub‑LOBs.
  - Automate quality metrics and evolve the learning agenda
    using internal benchmarks and external best practices.
  - Provide executive‑ready insights, recommendations, and
    status updates on the portfolio roadmap and key learnings.
  - Integrate with upstream and downstream systems to ensure
    seamless tooling and support Transformation objectives.
  - Champion quality‑as‑a‑service: prevent errors and drive
    continuous improvement in validation processes.
  - Demonstrate customer obsession by understanding and
    improving the end‑to‑end customer experience.

  Required qualifications, capabilities and skills:

  - Formal training or certification in Software Engineering
    concepts and 1+ years applied experience
  - Experience of Gen AI builds, Agents, and MCP.
  - Experience in one of the programming languages like Python,
    typescript, streamlit, UI design. Intermediate Python is a
    must.
  - Strong background in Natural Language Processing (NLP) and
    Large Language Models (LLMs)
  - Hands-on experience with machine learning and deep learning
    methods.
  - Proficiency in AI and machine learning frameworks (e.g.,
    TensorFlow, PyTorch).
  - Strong programming skills in languages such as Python, R, or
    Java.
  - Ability to design and implement complex algorithms for
    recommendation systems and trend analysis.
  - Experience in data integration and real-time data
    processing.
  - Understanding of marketing and campaign testing processes.

  Preferred Qualifications:

  - Deep understanding of Large Language Model (LLM) techniques,
    including Agents, Planning, Reasoning, and other related
    methods.
  - Experience of all LLM models and their capabilities
  - Experience with building and deploying ML models on cloud
    platforms such as AWS and AWS tools like Sagemaker, EKS,
    etc.
  - Prior experience in credit card marketing and in-market
    testing.
  - Excellent communication and presentation skills along with
    strong interpersonal skills and ability to translate
    technical concepts into actionable business strategies.
  - Demonstrated initiative and creativity with a proven track
    record in leading AI tool development and implementation.

