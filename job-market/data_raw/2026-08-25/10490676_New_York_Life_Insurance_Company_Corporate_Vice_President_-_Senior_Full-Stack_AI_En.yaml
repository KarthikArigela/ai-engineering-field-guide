description: |
  Location Designation: Hybrid - 3 days per week  Role
  Overview We are building a small, senior AI engineering team
  responsible for creating New York Life's enterprise AI
  platform-and the first generation of agentic AI solutions
  that run on it. Unlike traditional engineering roles, this
  position spans both platform and product development. One
  sprint you may be enhancing AI lifecycle services, memory
  architectures, or control-plane capabilities; the next,
  you'll be delivering an end-to-end agentic solution that
  transforms an insurance business workflow. You'll work
  across the full AI engineering stack-from cloud
  infrastructure, AI platform services, and developer tooling
  to multi-agent orchestration, enterprise knowledge systems,
  retrieval, governance, and production operations. This is an
  opportunity to help define how enterprise AI is built,
  deployed, governed, and operated within a highly regulated
  organization. Our platform is built on Google Cloud and
  designed to leverage cloud-native services while remaining
  portable through open standards and reusable engineering
  patterns. Success in this role requires strong software
  engineering fundamentals, practical AI expertise, and a
  passion for building production-quality systems that create
  measurable business value. Our Engineering Principles Our
  team is intentionally small, senior, and highly technical.
  Regardless of title, every engineer is expected to build AI
  systems-and build with AI.• Build agents that power the
  platform. Develop platform capabilities as intelligent
  agents-not just traditional services. Examples include
  lifecycle management agents that register, version, monitor,
  govern, and retire AI assets across the enterprise.• Build
  cloud agents that plan and implement. Create agents that
  translate business needs into implementation plans,
  orchestrate the required skills and tooling, and execute
  work with human oversight at appropriate checkpoints.• Build
  end-to-end multi-agent solutions. Design systems where
  specialized agents collaborate to architect solutions,
  provision infrastructure, generate code, validate through
  testing agents, deploy applications, perform post-deployment
  verification, and maintain operational traceability.• Build
  with AI-assisted engineering tools. Be fluent with modern AI
  development tools such as Cursor, Claude Code, GitHub
  Copilot, Windsurf, or equivalent technologies. AI-assisted
  software development is a core engineering competency and
  will be evaluated throughout the interview process. What
  You'll Do:• Design, build, and enhance the enterprise AI
  platform, including model and agent lifecycle management, AI
  control-plane services, developer tooling, runtime
  orchestration, memory services, workflow management, and
  governance capabilities.• Build production-ready agentic AI
  solutions that solve complex business problems using multi-
  agent architectures, structured planning, tool integration,
  retrieval, memory, and human-in-the-loop workflows.• Design
  and implement enterprise knowledge systems using retrieval-
  augmented generation (RAG), knowledge graphs, semantic
  search, embeddings, and modern information retrieval
  techniques to improve agent performance and reasoning.•
  Develop secure, cloud-native AI infrastructure using Google
  Cloud Platform, Kubernetes, Infrastructure as Code, CI/CD,
  observability, and enterprise identity and access management
  while maintaining portability through open standards.•
  Implement MLOps and LLMOps capabilities, including model
  deployment, evaluation, observability, monitoring, cost
  optimization, runtime governance, testing, and safe release
  practices for production AI systems.• Partner with security,
  architecture, legal, and risk teams to embed responsible AI,
  governance, security, and compliance into platform
  capabilities and enterprise AI solutions.• Build platform
  capabilities as intelligent agents wherever appropriate,
  enabling the platform to automate lifecycle management,
  planning, governance, and operational workflows.• Leverage
  AI-assisted engineering throughout the software development
  lifecycle to accelerate delivery while maintaining high
  standards for quality, security, and reliability. What
  You'll Bring: Required Skills• Strong software engineering
  experience with Python and experience in one or more
  additional languages such as TypeScript or Java.• Experience
  designing and building production AI platforms, enterprise
  software platforms, or cloud-native distributed systems.•
  Hands-on experience with modern generative AI technologies,
  including LLMs, multi-agent orchestration, retrieval-
  augmented generation (RAG), memory architectures, tool
  integration, and evaluation frameworks.• Experience with AI
  platform engineering, including model lifecycle management,
  agent runtimes, observability, developer tooling, and
  enterprise integration patterns.• Strong cloud engineering
  experience, preferably with Google Cloud Platform, including
  managed AI services, Kubernetes, networking, identity,
  containers, CI/CD, and Infrastructure as Code.• Experience
  implementing MLOps and LLMOps practices, including model
  deployment, evaluation, monitoring, tracing, performance
  optimization, and production operations.• Experience using
  AI-assisted software development tools such as Cursor,
  Claude Code, GitHub Copilot, Windsurf, or similar
  technologies.• Strong communication and collaboration skills
  with the ability to work effectively across engineering,
  architecture, security, and business teams.• Ability to
  operate successfully within a regulated enterprise
  environment while balancing innovation with governance.
  Preferred Skills• Experience within financial services,
  insurance, healthcare, or another highly regulated
  industry.• Experience with Vertex AI, LangChain, Google ADK,
  CrewAI, AutoGen, MLflow, OpenTelemetry, GraphRAG, Ray, vLLM,
  or related AI platform technologies.• Knowledge of
  enterprise AI governance frameworks including NIST AI RMF,
  ISO 42001, SOC 2, HIPAA, GDPR, or emerging AI regulations.•
  Experience building reusable developer platforms or internal
  engineering frameworks adopted across multiple teams. Why
  This Role• Build across the full AI stack. Work on both the
  enterprise platform and the intelligent solutions built on
  top of it.• Solve meaningful business problems. Develop
  production agentic AI systems that transform how work is
  performed across New York Life.• Join a senior engineering
  team. Work alongside experienced engineers in a high-
  autonomy, high-ownership environment with minimal
  bureaucracy.• Shape enterprise AI. Help define the
  engineering standards, governance patterns, and technical
  foundation that will enable AI across the organization.•
  Build for the long term. This is a strategic platform
  investment focused on scalable, production-ready
  capabilities-not short-lived experiments. Location We are
  committed to attracting exceptional talent and will consider
  flexible work arrangements for the right candidate. Pay
  Transparency Salary Range: $147,500-$211,000 Overtime
  eligible: Exempt Discretionary bonus eligible: Yes Sales
  bonus eligible: No Actual base salary will be determined
  based on several factors but not limited to individual's
  experience, skills, qualifications, and job location.
  Additionally, employees are eligible for an annual
  discretionary bonus. In addition to base salary, employees
  may also be eligible to participate in an incentive program.
