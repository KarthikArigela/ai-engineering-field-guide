description: |
  Join our innovative team to shape the future of cloud
  infrastructure. Leverage your skills in public cloud,
  automation, and coding to make a direct impact.

  As a Software Engineer III at JPMorgan Chase within the
  Cloud Engineering team, you will ensure our AWS-hosted
  applications are reliable, scalable, and secure. You will
  collaborate with development, operations, and security teams
  to design and automate robust cloud solutions. Your
  expertise in public cloud, Terraform, and coding will help
  us deliver high-performing systems. We value your proactive
  approach to problem-solving and continuous improvement.

  Job responsibilities

  - Design and implement highly available, scalable, and secure
    infrastructure for AWS-hosted applications
  - Develop and maintain Infrastructure as Code (IaC) solutions
    using Terraform
  - Write automation scripts for deployment, configuration, and
    operational tasks using Python, Shell, or Ruby
  - Set up and manage monitoring, logging, and alerting to
    proactively detect and resolve issues
  - Participate in on-call rotations and incident response,
    driving post-incident improvements
  - Optimize application and system performance in collaboration
    with development teams
  - Leverages enterprise-authorized AI coding assist tools
    within the work environment to improve code quality,
    delivery speed, and productivity across complex
    deliverables (e.g., code generation/refactoring, unit test
    creation, documentation), while validating outputs through
    peer review, automated testing, and secure coding
    standards; contributes learnings and reusable patterns to
    improve broader team effectiveness.
  - Applies knowledge of tools within the Software Development
    Life Cycle toolchain, including enterprise-authorized AI-
    assisted development and automation capabilities, to
    improve the value realized by automation.
  - Implement and enforce security best practices for cloud
    environments
  - Contribute to CI/CD pipeline implementation for automated
    deployments
  - Maintain thorough documentation of architecture,
    configurations, and procedures



   Required qualifications, capabilities and skills

  - Formal training or certification on software engineering
    concepts and 3+ years applied experience
  - Bachelor’s degree in Computer Science, Information
    Technology, or related field
  - Proven experience as a Site Reliability Engineer or similar
    role
  - Strong proficiency in AWS services and architecture
  - Hands-on experience using enterprise-authorized AI-assisted
    software development tools within the work environment
    (e.g., for coding, test creation, troubleshooting, or
    documentation) with demonstrated ability to critically
    evaluate, validate, and refine AI-generated outputs for
    correctness, performance, and security.
  - Understanding of responsible AI use in engineering
    workflows, including data sensitivity considerations,
    secure handling of inputs/outputs, and adherence to
    resiliency and security expectations; ability to guide
    peers on safe and effective usage within team practices.
  - Hands-on experience with Terraform for Infrastructure as
    Code
  - Proficiency in scripting languages such as Python, Shell, or
    Ruby
  - Experience with containerization and orchestration tools
    (Docker, Kubernetes)
  - Knowledge of monitoring, logging, and alerting tools



  Preferred qualifications, capabilities and skills

  - Experience with serverless computing (AWS Lambda)
  - Knowledge of application-level security best practices
  - Experience with AWS managed services for databases, caching,
    and messaging
  - Familiarity with security practices and compliance
    requirements
