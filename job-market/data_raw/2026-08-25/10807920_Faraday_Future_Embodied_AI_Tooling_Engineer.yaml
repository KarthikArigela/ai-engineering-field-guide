description: |
  The Company:

  Faraday Future is a California-based technology company
  focused on the design, engineering, and development of
  intelligent, connected electric vehicles and related
  artificial intelligence enabled technologies.

  Founded in 2014, the Company’s mission is to disrupt the
  automotive and technology industries by creating user-
  centric, technology-first experiences. The Company, together
  with its control subsidiaries, operates across multiple
  technology-driven areas, including AI electric vehicles,
  robotics, and its crypto business (AIXC), all under its
  upgraded Global EAI Industry Bridge Strategy, marking the
  beginning of a new chapter in AI mobility and Web3
  integration. The Company aims to leverage the latest
  technologies and world’s best talent to realize exciting new
  possibilities across all of these lines. Faraday Future’s
  automotive business exemplifies its vision for luxury,
  innovation, and performance, while its FX strategy aims to
  introduce mass production models equipped with state-of-the-
  art luxury technology derived from the FF brand, targeted
  towards a broader market with middle-to-low price range
  offerings. FF is committed to redefining mobility through AI
  innovation. Join us in shaping the future of intelligent
  transportation and technology by creating something new,
  something connected, and something with a true global
  impact.

  Your Role:

  As the Embodied AI Tooling Engineer, you will spearhead the
  development and vision of our end-to-end AI tooling
  ecosystem. You will own the infrastructure that powers our
  Embodied AI architecture, ensuring a seamless flow from raw
  interaction to model training. Your focus areas include:

  - Data Acquisition: Building scalable tools for high-fidelity
    data collection from both
  - physical robotic platforms and simulation environments.
  - Data Lifecycle Management: Developing advanced pipelines for
    data
  - cleaning, timestamp synchronization, and multimodal data
    alignment.
  - Teleoperation & Remote Orchestration: Engineering low-
    latency tools for remote robot
  - control and real-time tele-monitoring.

  You are both a visionary architect and a hands-on technical
  engineer. You will guide a high[1]impact team to transform
  cutting-edge robotics research into robust, production-ready
  capabilities.

  Key Responsibilities

  - Architecture & Strategy

  - System Design: Architect a modular and scalable robotics
    tooling portfolio that
  - simulation, hardware-in-the-loop, and cloud infrastructure.
  - Technical Roadmap: Define and execute a strategic roadmap,
    balancing rapidly.
  - innovation with the delivery of stable, high-performance
    tools.
  - Standardization: Establish industry-leading standards for
    data formats (e.g., MCAP,
  - HDF5, LeRobot) and communication protocols across the AI
    lifecycle.

  - Data Engineering & Pipeline Optimization

  - Multimodal Alignment: Lead the development of automated
    tools for multi-sensor data
  - fusion and precision timestamp alignment (LiDAR, Camera,
    IMU, etc.).
  - Efficiency Tools: Design sophisticated data "scrubbing" and
    labeling interfaces to
  - accelerate the creation of high-quality humanoid robot
    datasets.

  - Teleoperation & Human-Robot Interaction (HRI)

  - Real-time Control: Optimize teleoperation systems for ultra-
    low latency to improve the quality of human-demonstrated
    data.
  - Visualization: Build intuitive dashboards for real-time
    monitoring of robot states,

  diagnostic telemetry, and environmental perception.

  - Collaboration

  - Cross-functional Synergy: Partner closely with AI
    Researchers, Hardware Engineers, and partners to identify
    and bridge tooling gaps.

  Basic Qualifications

  - Master’s or PhD in Computer Science, Robotics, Electrical
    Engineering, or a related field
  - Experience: 5+ years of experience in software engineering
    within Robotics, AI, or Autonomous Driving.

  - Technical Mastery: Pro-level proficiency in Python and C++.
    Deep experience with ROS/ROS2 and modern ML frameworks
    (e.g., PyTorch, TensorFlow).

  - Domain Knowledge: Solid understanding of data pipelines
    (ETL), sensor fusion, and
  - distributed systems. Familiarity with simulation engines
    like NVIDIA Isaac Sim, Gazebo, or Mujoco.
  - System Mindset: Proven track record of shipping complex
    software products from
  - prototype to production.

  Preferred Qualifications

  - Experience with teleoperation hardware (HaptX, VR
    controllers) or human[1]demonstration data collection.
  - Contributions to open-source robotics or AI projects (e.g.,
    LeRobot, Hugging Face
  - Robotics).
  - Experience in Humanoid Robotics or complex multi-degree-of-
    freedom (DoF) systems.

  Salary Range

  ($100,000-$120,000 DOE), plus benefits and incentive plans

  Perks + Benefits

  - Healthcare + dental + vision benefits (Free for you /
    discounted for family)
  - 401(k) options
  - Casual dress code + relaxed work environment

  Faraday Future is an equal opportunity employer and does not
  discriminate on the basis of race, national origin, gender,
  gender identity, sexual orientation, protected veteran
  status, disability, age, or other legally protected status.
