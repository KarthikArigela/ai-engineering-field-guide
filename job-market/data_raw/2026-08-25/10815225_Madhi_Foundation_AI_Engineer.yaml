description: |
  About the Role

  We are looking for a passionate and mission-driven AI
  Engineer to join us in building impactful AI solutions that
  bridge gaps in the education system. This role focuses on
  designing and deploying intelligent, cost-effective systems
  that can operate reliably in low-resource school
  environments.

  You will work at the intersection of AI innovation and real-
  world constraints, ensuring that advanced technologies are
  accessible, scalable, and meaningful for students and
  educators.

  The Challenges You Will Help Solve in This Role

  - Building highly accurate AI systems that function
    effectively even with limited infrastructure (low
    bandwidth, low compute environments).

  - Designing solutions that balance performance, cost, and
    scalability for schools with constrained resources.

  - Creating robust AI pipelines that can handle multilingual,
    multimodal, and unstructured educational data.

  - Improving reliability and usability of AI systems for non-
    technical users (teachers, students).

  - Creating robust observability and evaluation pipelines to
    ensure all releases and system changes are reliable,
    measurable, and continuously improving over time.

  - Continuously optimizing models and architectures to increase
    efficiency while reducing operational costs.

  - Designing, fine-tuning, and training AI models to improve
    accuracy, adaptability, and performance for real-world
    educational use cases.

  3) The Job Description

  As an AI Engineer, you will design, develop, and deploy AI-
  driven systems tailored for educational use cases. You will
  work on building agentic and multi-agent architectures,
  integrating retrieval systems, and ensuring production-grade
  deployment.

  This role requires strong technical depth, problem-solving
  ability, and a deep understanding of how to adapt cutting-
  edge AI technologies to real-world challenges.

   In This Role, Some of Your Responsibilities Will Include

  - Designing and implementing agentic and multi-agent AI
    architectures for complex problem-solving.

  - Developing and optimizing RAG-based and multimodal AI
    systems.

  - Building scalable AI pipelines using tools like LangChain,
    Langfuse, and Python-based frameworks.

  - Deploying and managing AI systems in production environments
    with monitoring and evaluation pipelines.

  - Improving performance, latency, and cost-efficiency of
    existing AI systems.

  - Working with image, text, and multimodal data to build
    impactful educational tools.

  - Collaborating with cross-functional teams to translate real-
    world education challenges into AI solutions.

  You Will Thrive in This Role If You:

  - Are deeply motivated by solving real-world problems in
    education.

  - Enjoy working in constraint-heavy environments and turning
    limitations into innovation.

  - Have a strong bias for building practical, scalable
    solutions rather than just prototypes.

  - Think in terms of systems and architecture, not just models.

  - Are comfortable experimenting, iterating, and improving
    continuously.

  - Can balance technical excellence with usability and impact.

  Mandatory Prerequisites Include:

  - Strong proficiency in Python and AI/ML development.

  - Hands-on experience with agentic architectures and multi-
    agent systems.

  - Experience using frameworks/tools such as LangChain and
    Langfuse
