  Applied AI Forward Deployed Engineer – Associate Manager

  London

  Career Level 8

  Accenture is a leading global professional services company,
  providing a broad range of services in strategy and
  consulting, interactive, technology and operations, with
  digital capabilities across all of these services. With our
  thought leadership and culture of innovation, we apply
  industry expertise, diverse skill sets and next-generation
  technology to each business challenge.

  We believe in inclusion and diversity and supporting the
  whole person. Our core values comprise of Stewardship, Best
  People, Client Value Creation, One Global Network, Respect
  for the Individual and Integrity. Year after year, Accenture
  is recognized worldwide not just for business performance
  but for inclusion and diversity too.

  “Across the globe, one thing is universally true of the
  people of Accenture: We care deeply about what we do and the
  impact we have with our clients and with the communities in
  which we work and live. It is personal to all of us.” –
  Julie Sweet, Accenture CEO

  - Deliver production-quality work — Build and ship AI
    applications inside client systems, ensuring solutions
    meet enterprise requirements for performance, security,
    and reliability.
  - Develop technical assets — Create reusable, production-ready
    artefacts including MCP servers, sub-agents, agent
    orchestration frameworks, and evaluation tooling that can
    be deployed across client workflows.
  - Support enterprise deployments — Play a key technical role
    in rollouts of frontier AI capabilities, ensuring smooth
    integration with existing IT infrastructure and processes.
  - Accelerate adoption — Work shoulder-to-shoulder with client
    engineering and product teams to drive meaningful AI
    adoption, removing blockers and closing skill gaps in real
    time.
  - Identify patterns and scale — Recognise repeatable
    deployment patterns across engagements and contribute
    those insights back to Accenture's I&E FDE practice and
    our model provider partners to continuously improve our
    delivery playbook.
  - Maintain cutting-edge expertise — Stay ahead of the curve on
    LLM capabilities, agentic frameworks, evaluation
    methodologies, and the AI product development ecosystem.
    Potentially helping to define the learning path for others
    as the area grows
  - Build strong relationships — Develop trusted working
    relationships with client teams and AI ecosystem partners,
    proactively contributing to new opportunities for AI value
    creation throughout the engagement lifecycle.
  - Represent Accenture in the field — Champion responsible,
    safe AI deployment and uphold Accenture's standards in
    every client interaction.

  Experience

  - 4–6 years of experience in a technical role with client-
    facing or consulting exposure — Software Engineer,
    Solutions Engineer, technical consultant, or equivalent.
  - Experience contributing to the delivery of production
    applications with real business impact, ideally in
    enterprise environments.
  - Practical experience working with large language models
    (ideally in a enterprise or start-up setting): prompt
    engineering, agent development, RAG pipelines, evaluation
    frameworks, workflows, and deployment.

  Technical Skills

  - Solid programming proficiency (we are open to any experience
    but primary languages include: TypeScript and the
    JavaScript ecosystem, Python and Java).
  - Hands-on experience building and deploying AI agents or
    multi-agent systems.
  - Working familiarity with enterprise IT architecture, cloud
    platforms (AWS, Azure, GCP), and system integration
    patterns.

  Consulting & Client Skills

  - High agency; comfortable navigating ambiguity, working
    across complex organisations, and contributing without a
    well-defined playbook.
  - Strong communication skills; able to participate in
    technical discovery, support stakeholder alignment, and
    translate AI concepts for non-technical audiences.
  - Collaborative mindset with the ability to balance competing
    priorities while maintaining integrity and a team-first
    approach.

  Preferred

  - Domain exposure in media, or another enterprise vertical.
  - Familiarity with AI safety, responsible AI frameworks, or
    enterprise AI governance.
  - Familiarity with AI deployment infrastructure and MLOps
    tooling.

