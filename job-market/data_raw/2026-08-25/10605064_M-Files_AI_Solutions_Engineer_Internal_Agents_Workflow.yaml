description: |
  APPLICATION WINDOW: We encourage you to apply if interested.
  We will review applications on a rolling basis and keep
  candidates informed on next steps.

  We recognize that job searching can sometimes feel
  uncertain. As we engage with candidates and continue to
  evaluate our needs, this role may evolve to ensure strong
  alignment between the opportunity, the market, and long-term
  success.

  We are committed to a thoughtful and transparent process and
  will keep candidates informed along the way. Thank you for
  considering M-Files as your next career move.

  Who We Are

  M-Files is redefining how work gets done. Our context-first
  document management system offers purpose-built business use
  cases—spanning universal and industry-specific workflows—to
  enable secure collaboration, automate processes, and ensure
  governance.

  Unlike traditional systems, M-Files organizes content around
  the context of your business, connecting documents to
  related people, projects, and transactions. With our unique
  metadata-driven architecture, organizations can model
  content in line with their business processes, unify
  information across silos, and apply AI at scale. The result
  is greater productivity, reduced risk, and smarter, faster
  decisions for over 6,000 customers in 100+ countries.

  At M-Files, our Guiding Principles unite us across diverse
  cultures and personalities:

  - Make It Happen – We set bold goals, take ownership, learn
    from mistakes, and relentlessly pursue results.
  - Help Others – We lead with kindness, assume good intentions,
    hold one another accountable, and celebrate wins together.
  - Love Customers – We put customers and partners at the heart
    of everything, delivering value with respect, fairness,
    and speed.

  To learn more about us we encourage you to visit our company
  page.

  To learn more about how we became a Certified Great Place to
  Work visit, Working at M-Files | Great Place to Work.

  Summary of the Role

  M-Files is building a company-wide capability to
  operationalize AI, turning promising LLM prototypes into
  secure, reliable, maintainable internal tools that
  materially improve how teams work. This role sits within the
  Internal AI Solution Development team and functions as a
  hands-on builder, partnering with business leaders across
  Sales, Marketing, Revenue Operations, Customer Success, and
  other business functions to identify high-value workflows
  that can be accelerated with AI, reshape the underlying
  processes where needed, and build, deploy, and operate AI-
  enabled solutions end-to-end.

  This is not a traditional product software engineering role,
  nor is it a RevOps analytics role. Instead, it is an
  execution-oriented AI engineering role embedded in the
  business. You’ll move quickly from problem definition to
  production, building intelligent agents and workflow
  automations while applying the appropriate security,
  governance, risk controls, and compliance expectations
  required for internal systems at scale.

  You will leverage AI-assisted development tools as part of
  your daily workflow to accelerate delivery while maintaining
  quality, reliability, and long-term maintainability.

  Success in this role comes from understanding how people
  work, redesigning processes where appropriate, and building
  AI-powered solutions that teams genuinely adopt, not simply
  delivering technical prototypes.

  What You Will Be Doing / Responsibilities and Duties

  Discover & Shape High-Value AI Opportunities

  - Partner with functional leaders across Sales, Marketing,
    Revenue Operations, Customer Success, and other business
    functions to identify workflows where AI can remove
    friction, reduce cycle time, improve accuracy, or
    strengthen compliance.
  - Map the current-state process, identify bottlenecks and
    failure modes, and redesign the process to be automation-
    ready by clarifying inputs, outputs, decision points, data
    sources, controls, and ownership.
  - Define success metrics such as time saved, error reduction,
    throughput, adoption, and auditability, and translate
    business goals into a clear build plan.

  Build Internal AI Agents & Automation Tools (End-to-End
  Ownership)

  - Design and implement internal agents and agentic workflows
    using modern LLM patterns, including tool use/function
    calling, retrieval-augmented generation where needed,
    structured outputs, orchestration, and human-in-the-loop
    checkpoints.
  - Build whole-product solutions including lightweight UX,
    service/API layers, integrations, data access, automation
    triggers, and connections into business systems such as
    CRM, marketing automation, customer success platforms, and
    other internal applications as appropriate to the use
    case.
  - Integrate systems through APIs, authentication, structured
    data formats, and webhooks to enable agents to reliably
    read data and trigger actions.
  - Use AI-assisted development techniques to speed delivery
    while sustaining maintainability, readability, and
    quality.

  Operate, Maintain & Scale (Production Mindset)

  - Own reliability, including monitoring, alerting, logging,
    incident response, and continuous improvement.
  - Establish repeatable patterns for onboarding new workflows
    and scaling existing ones through templates, shared
    components, evaluation harnesses, and documentation.
  - Create and maintain runbooks and lightweight training so
    internal teams can confidently adopt and use solutions.

  Risk, Control, Oversight, Security & Compliance by Design

  - Implement appropriate guardrails including data
    minimization, access controls, secrets management, safe
    prompt and tooling patterns, output validation, and
    traceability.
  - Ensure solutions meet internal security and compliance
    expectations, including audit readiness, change management
    discipline, clear ownership, and relevant data privacy and
    consent requirements.
  - Maintain clear documentation of how systems work, what data
    they access, and how associated risks are mitigated.

  Cross-Functional Coordination

  - Coordinate across Business Technology, IT/Security,
    Legal/Privacy, and functional subject matter experts to
    design, approve, deploy, and drive adoption of AI-enabled
    solutions across the business.
  - Communicate progress through clear, concise updates and
    manage tradeoffs between speed and rigor.

  Outcomes to Be Achieved

  - A portfolio of high-impact internal AI agents deployed into
    real business workflows, including Sales, Marketing,
    Revenue Operations, and Customer Success, with measurable
    business outcomes.
  - A scalable operating model for internal AI, including
    reusable components, clear governance, and a predictable
    path from idea to production.
  - Reduced process friction through AI and thoughtful process
    redesign, not AI bolted onto broken workflows.
  - High trust in outputs through appropriate controls,
    auditability, and operational reliability.

  Requirements

  Required Qualifications

  - Demonstrated ability to build and maintain end-to-end
    software from design through build, deployment, and
    ongoing operation, with strong engineering fundamentals.
  - Proficiency in at least one modern programming language such
    as Python, TypeScript, C#, or Node.js, with comfort
    learning additional technologies as needed.
  - Practical experience integrating systems via APIs,
    authentication, and structured data formats.
  - Strong ability to work with non-technical stakeholders,
    translate ambiguous problems into clear specifications,
    iterate quickly, and drive adoption.
  - Familiarity with one or more business functions such as
    Sales, Marketing, Revenue Operations, or Customer Success,
    and an interest in designing AI solutions that improve how
    those teams work.

  GTM Domain Context We Value

  - Experience integrating business or GTM systems through APIs
    and webhooks, including CRM, marketing automation, sales
    engagement, customer success/support platforms, ERP, or
    similar enterprise applications.
  - Familiarity with how GTM workflows and data operate across
    areas such as leads, accounts, opportunities, activities,
    customer engagement, and support processes.
  - Comfort working with marketing, sales, and customer data,
    including considerations around data quality, enrichment,
    privacy, and consent.

  Technical Foundations We Value

  - Experience building cloud-based services and applying strong
    engineering practices such as CI/CD, source control, test
    automation, and operational monitoring.
  - Comfort with secure and scalable platform concepts including
    networking, identity, secrets management, and
    infrastructure automation.
  - Experience or strong interest in AI-assisted development as
    part of daily engineering practice.

  LLM / Agent Capabilities (Core to This Role)

  - Hands-on experience building LLM-powered tools and agents,
    including prompting, tool use/function calling, retrieval
    where appropriate, agent orchestration frameworks, and
    evaluation/quality approaches.
  - Ability to design safe and predictable AI systems through
    validation, fallbacks, human-in-the-loop approaches, and
    clear failure handling.

  Preferred

  - Familiarity with enterprise security and compliance
    expectations, including access controls, audit trails,
    change management, and data governance.
  - Experience modernizing processes with a Lean or operational-
    improvement mindset and designing systems that align with
    how teams actually work.
  - Experience building internal tools that drive adoption
    across multiple business or GTM functions.

  Working Style / What Success Looks Like Here

  - You are low ego, high output: you can operate independently
    while collaborating naturally and bringing others along.
  - You can move fast without being reckless: you understand
    where to be scrappy and where additional rigor is
    required.
  - You care about outcomes: automation only matters if it
    meaningfully changes how people work and improves the
    metrics that matter.

  Participation in our Recruitment Process:

  - To Be Determined
  - Typical interview processes including initial screening w/ a
    Recruiter, meeting with Hiring Manager (VP, Commercial
    Operations & Technology), and other internal team members
    the role may closely interact with

  Benefits

  By joining M-Files, you will have the opportunity to
  contribute to our success and growth while developing your
  own expertise and helping build the AI capability that
  changes how our teams work every day.

  M-Files is a global company with Finnish roots, built around
  a product we are proud of.

  Our guiding principles, Make It Happen, Help Others, Love
  Customers, are reflected in how we work every day, with
  transparency and strong team spirit at the core of our
  culture.

  What We Offer:

  - As remote enabled company our employees enjoy the
    flexibility to establish their own life/work balance
  - Matching 401K Plan (25% of employee's contribution up to the
    IRS max)
  - Health insurance (PPO and HDHP/HSA plans offered)
  - Dental insurance
  - Vision insurance
  - Life insurance (1x employee salary)
  - Short-term disability (employer paid)
  - Long-term disability (employer paid)
  - Flexible Spending Plan (medical and dependent)
