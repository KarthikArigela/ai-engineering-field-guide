description: |
  Company description:

  Vialto Partners is a market leader in global mobility
  services. Our purpose is to ‘Connect the world’. We are
  unique and the only stand-alone global mobility business.
  This presents a rare opportunity for our clients,
  stakeholders and colleagues.

  Our teams help companies streamline and effectively manage
  their global mobility programs in a cost-efficient and
  compliant manner. Our services focus on providing cross-
  border compliance and risk assessment for tax, immigration,
  business travel, rewards and compensation, and remote work.

  Working at Vialto Partners is about getting the chance to be
  part of a global and dynamic team.  Globally, Vialto
  Partners has over 6,500 staff in over 50 countries around
  the world and continues to grow.  You will work with clients
  from a range of industries and different geographical
  locations. We believe in connecting the world and supporting
  our colleagues to do the same in their careers by
  undertaking assignments and opportunities globally that
  broaden their skills and ultimately benefit our clients.

  Vialto is unstoppable when we work together in a culture of
  belonging, where everyone can thrive. We encourage employees
  to bring their true selves and share their unique talents
  and expertise to positively impact the communities we serve.

  To learn more about what we do, tune in to our podcast On
  the Move to hear expert insights on issues affecting global
  mobility, and read about the latest news in the industry.
  You can also follow us on LinkedIn and Instagram.

  About Vialto Labs (VLabs)

  Vialto Labs (VLabs) is responsible for redesigning how work
  is delivered in the tax and immigration service lines, as
  well as driving operational efficiency across Vialto’s
  functional areas using AI. The team builds and deploys novel
  AI-enabled solutions that directly improve productivity and
  increase delivery quality for our clients. VLabs is
  accountable for rapidly turning innovative experiments into
  production-ready deliverables at scale and embedding them
  into day-to-day operations. This team focuses on the
  highest-impact workflows, creating standardized, repeatable
  capabilities that can be deployed globally. Operating with a
  mandate for speed and measurable outcomes, VLabs works
  alongside service line, product, and platform leaders.

  About the Role

  We are seeking a strong Software Engineer with Python
  expertise to support and build Generative AI and agentic AI
  solutions on Microsoft Azure. This role is ideal for someone
  who has hands-on experience building production-grade AI
  applications using the Microsoft Agent Framework, modern
  backend engineering practices, and secure cloud-native
  architectures.

  This role covers both the AI-enabled automation of service
  delivery processes, i.e. tax and immigration services, as
  well as the use of AI capabilities to streamline functional
  / back-office processes (e.g. Finance, HR etc.).

  The ideal candidate has experience designing and deploying
  agentic systems, building evaluation harnesses, integrating
  tools and workflows, and implementing Responsible AI and
  security controls for enterprise use cases.

  Key Responsibilities

  - Design, build, and maintain backend services for GenAI and
    agent-based applications using Python

  - Develop APIs and services using FastAPI

  - Build and support AI solutions using the agentic framework

  - Design and integrate agent workflows, tool usage,
    orchestration, and workflow management patterns

  - Build and maintain services using PostgreSQL, Cosmos DB,
    and/or SQL Server

  - Containerize and deploy applications using Docker and
    Kubernetes

  - Develop secure, scalable, and production-ready AI systems on
    Azure

  - Build agentic harnesses, test frameworks, and evaluation
    pipelines

  - Implement observability, monitoring, logging, and quality
    checks for AI systems

  - Collaborate with cross-functional teams to deliver
    enterprise AI solutions

  - Use modern engineering tools and workflows including Azure
    DevOps (ADO), GitHub, Claude Code, Cowork, and automation-
    friendly development practices

  - Ensure adherence to Responsible AI, security, privacy, and
    governance requirements

  - Support document intelligence, OCR, and data processing
    workflows where needed

  Qualifications & Experience

  - 6+ years of software engineering experience, especially
    Python

  - 2+ years in GenAI, LLM, or agentic application development

  - Experience in enterprise or production AI environments
    preferred

  - Experience building backend services and APIs with FastAPI

  - Hands-on experience supporting or building GenAI / LLM-based
    applications

  - Experience with agent orchestration frameworks

  - Experience with Azure cloud resources and cloud-native
    application development

  - Experience with one or more databases: Postgres, Cosmos DB,
    SQL Server

  - Experience with Docker and Kubernetes

  - Experience with ADO, GitHub, and modern CI/CD workflows

  - Strong understanding of backend architecture, testing,
    debugging, and performance optimization

  - Experience with agentic engineering and agent-based
    solutions

  - Understands evals / evaluation frameworks

  - Strong understanding of secure design for AI systems,
    including access control, data handling, prompt safety,
    and system reliability

  - Experience integrating tools, APIs, and structured workflows
    into AI applications

  - Experience with workflow management and orchestration in
    enterprise environments

  - Strong understanding of MCP, SKILLS, plugins, tool calling,
    or reusable agent capabilities

  - Experience with OCR, document extraction, or document
    intelligence solutions

  - Experience with data wrangling, preprocessing, and
    unstructured data pipelines

  - Experience with RAG, search, retrieval pipelines, or
    knowledge integration

  - Knowledgeable about working with multi-agent systems

  - Familiarity with AI-assisted developer workflows and coding
    tools

  Additional Information

  - Location: India - Bangalore
  - We are an equal opportunity employer that does not
    discriminate on the basis of any legally protected
    status.Please note, AI is used as part of the application
    process.
