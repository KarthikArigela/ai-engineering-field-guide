description: |
  The Opportunity As a CTIO - AI Engineer- Senior Manager, you
  will play a pivotal role in transforming raw data into
  actionable insights, enabling informed decision-making and
  driving business growth. Within our Internal Firm Services
  practice, you will focus on leveraging advanced analytics
  and statistical techniques to extract insights from large
  datasets and drive data-driven decision-making. As a Senior
  Manager, you will utilize your skills and professional
  network to deliver quality results, motivating and coaching
  teams to solve complex problems. You will apply sound
  judgment, recognizing when to take action and when to
  escalate, while developing and sustaining diverse and
  inclusive teams. In this role, you will engage in
  exploratory and descriptive analysis, statistical modeling,
  and creating data visualizations to help solve complex
  business problems and inform strategic decisions. You will
  craft and convey clear, impactful messages that tell a
  holistic story, applying systems thinking to identify
  underlying problems and opportunities. Your ability to
  validate outcomes with clients, share alternative
  perspectives, and act on client feedback will be crucial.
  You will direct teams through complexity, demonstrating
  composure in challenging situations, and deepen your skills
  with a focus on staying relevant. Responsibilities
  - Leading the design and development of advanced data
    solutions to transform raw data into actionable insights
  - Driving data-driven decision-making through exploratory and
    descriptive analysis and statistical modeling
  - Managing complex data analysis and creating data
    visualizations to solve business problems and inform
    strategic decisions
  - Overseeing the implementation of machine learning algorithms
    and predictive modeling techniques
  - Collaborating with clients to validate outcomes and
    incorporate feedback into data solutions
  - Directing teams through complex projects, maintaining
    composure in challenging situations
  - Applying systems thinking to identify underlying problems
    and opportunities within data sets
  - Coaching and motivating diverse teams to achieve operational
    excellence in data science initiatives
  - Innovating processes to enhance data quality and integrity
    across analytics frameworks
  - Utilizing programming languages and machine learning
    libraries to optimize data workflows and pipelines
  What You Must Have
  - At least a Bachelor's degree
  - At least 7 years of experience
  What Sets You Apart
  - Preference for at least one of the following fields of
    study: Accounting, Analytics/Data Science, Artificial
    Intelligence/Robotics, Business Administration/Management,
    Computer Science/Information Systems, Cybersecurity,
    Engineering, Mathematics/Statistics, Operations/Supply
    Chain, Project/Technology Management, Risk
    Management/Insurance
  - Demonstrating advanced skills in data science algorithms and
    workflows
  - Utilizing machine learning and deep learning techniques
    effectively
  - Excelling in complex data analysis and predictive modeling
  - Leading teams through ambiguity with strategic questioning
  - Innovating processes with data-driven decision making
  - Applying systems thinking to identify opportunities and
    challenges
