description: |
  Secure Every Identity, from AI to Human Identity is the key
  to unlocking the potential of AI. Okta secures AI by
  building the trusted, neutral infrastructure that enables
  organizations to safely embrace this new era. This work
  requires a relentless drive to solve complex challenges with
  real-world stakes. We are looking for builders and owners
  who operate with speed and urgency and execute with
  excellence. This is an opportunity to do career-defining
  work. We're all in on this mission. If you are too, let's
  talk.

  The Auth0 Team

  Auth0 is an easy-to-implement authentication and
  authorization platform designed by developers for
  developers.  We make access to applications safe, secure,
  and seamless for the more than 100 million daily logins
  around the world. Our modern approach to identity enables
  this Tier-Ø global service to deliver convenience, privacy,
  and security so customers can focus on innovation.

  This team focuses on providing tenant-level protections to
  our customers, at scale. From bot detection to brute-force
  to suspicious IP throttling and beyond, this team often
  provides the first line of defense for Auth0 customers.

  At Okta, we’re building the next generation of
  authentication for the GenAI era. We’re looking for a Senior
  Software Engineer to join the AI Agentic Experience team at
  Auth0. This role is pivotal in extending and complementing
  our Auth for GenAI offering by building the infrastructure,
  tooling, and developer experiences that empower both human
  developers and AI agents to build secure, intelligent
  applications.

  Auth0 Emerging Tech is the Engineering organization where we
  take care of the hottest technology out there: we ship fast,
  we don't break things. We are a dynamic and collaborative
  distributed and diverse team. We value ownership, learning
  and innovation.

  This is an ideal role for an engineer who enjoys building
  for other engineers, working across stacks, and shaping the
  future of AI enablement in production systems. You'll
  collaborate across engineering, product, and security teams
  to drive meaningful improvements in developer tooling, agent
  authentication, orchestration frameworks, and real-world
  demos.

  What you will be doing:

  - Design and Build Developer Tooling that helps developers
    secure and manage infrastructure like MCP servers
  - Build Demo Applications that showcase secure, identity-
    powered AI use cases in real-world environments
  - Contribute to Open Source Projects, both within Auth0 and
    across the broader AI + identity ecosystem
  - Write and Maintain High-Quality Documentation including API
    references, quickstarts, and best practices for both
    developers and AI-native tooling (e.g., llm.txt)
  - Drive Integration with Emerging AI Frameworks by creating
    adapters, utilities, and interfaces for agent runtimes and
    orchestration layers
  - Collaborate with Design, Product, and Security teams to
    align on developer needs, roadmap direction, and
    compliance requirements
  - Mentor and Support Other Engineers, setting strong examples
    in code quality, testing practices, and architectural
    thinking
  - Influence Engineering Standards by leading design
    discussions and contributing to team-wide architectural
    decisions
  - Ensure Resilience and Security of systems involved in agent-
    to-agent or model-to-service communication

  You Might Be a Good Fit If You

  - 5+ years of experience in software engineering with a proven
    track record in building tools, frameworks, or platforms
    for other developers
  - Proficiency in JavaScript/TypeScript, Golang and/or Python,
    and the ability to move fluidly between front-end and
    back-end contexts
  - Experience working with LLM APIs, agent runtimes,
    orchestration layers, or prompt pipelines
  - Familiarity with authentication and authorization systems,
    especially standards like OAuth2, OIDC, and JWT
  - Demonstrated experience leading architecture and design
    efforts for scalable, production-grade systems
  - Comfort contributing to and maintaining open source projects
    and engaging with developer communities
  - A passion for documentation as part of the developer
    experience—not just writing code, but making it
    understandable and usable
  - Ability to thrive in highly collaborative environments with
    cross-functional stakeholders

  Technologies You May Work With

  - Languages: JavaScript, TypeScript, Python
  - Frameworks: React, Next.js, FastAPI
  - AI Ecosystem: Model APIs, orchestration runtimes, prompt
    management systems, agent toolkits
  - Auth0 Stack: Token Vault, Async Authorization, Fine-Grained
    Authorization (FGA)

  Why You'll Love It Here

  This is a team working at the edge of what identity means in
  a world of AI agents. You'll have real ownership of hard,
  unsolved problems, backed by Okta's platform, Auth0's
  developer relationships, and a team that values technical
  depth and customer impact in equal measure.

  You'll help shape the product, not just implement a backlog.
  You'll work with people who care about getting the details
  right. And you'll be building something that matters to the
  developers and organizations trying to do AI responsibly.

