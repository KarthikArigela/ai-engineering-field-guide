description: |
  This is a remote position.



   Location: Remote across India; may transition to onsite in
  the future









      Spektra Systems is looking for a passionate and highly
  motivated Software Development Engineer – I (SDE-1) to join
  our engineering team. The ideal candidate should have strong
  hands-on experience in Microsoft technologies and modern web
  application development, along with a learning mindset and
  the ability to work in a fast-paced product engineering
  environment.




      The candidate will work closely with cross-functional
  teams to build scalable, high-quality software solutions and
  contribute across the complete software development
  lifecycle.









   Experience




  - 2 to 4 years of software development experience
  - Previous experience working with AI-assisted development
    tools (such as GitHub Copilot, ChatGPT, Cursor, Claude, or
    similar AI productivity tools) is preferred








   Responsibilities:






  - Analyze, design, develop, test, release, and maintain
    products in a .NET-centric environment
  - Rapidly implement features aligned with the product roadmap
  - Quickly evaluate and learn modern technologies, libraries,
    and development concepts
  - Plan and manage integrations with third-party software and
    services
  - Work in a fast-paced engineering environment with continuous
    iteration based on user feedback
  - Collaborate effectively with a highly qualified development
    team as a strong team player
  - Support fellow developers in troubleshooting and solving
    technical problems
  - Participate in code reviews, debugging, performance
    optimization, and deployment activities
  - Ensure adherence to coding standards, best practices, and
    software quality processes








  Requirements

   Required Skills




  - Strong expertise in C# and .NET Stack development
  - Experience in developing and consuming REST APIs
  - Good knowledge of Microsoft SQL Server
  - Experience in web application development
  - Hands-on experience with Source Code Management (SCM) tools
  - Experience with Azure development and cloud-based services
  - Working knowledge of Visual Studio Online / Azure DevOps /
    Visual Studio Team Services / Github
  - Understanding of JSON, CI/CD pipelines, Build and Release
    processes
  - Good hands-on experience with jQuery
  - Experience working with Angular 17+ frameworks








   Preferred Skills




  - Familiarity with Agile/Scrum development methodologies
  - Understanding of AI-assisted software development workflows
    and productivity tools
  - Strong analytical and problem-solving skills
  - Good communication and collaboration abilities



   What We Expect




  - Self-driven and eager to learn new technologies
  - Ability to adapt quickly in a product engineering
    environment
  - Ownership mindset with attention to quality and delivery
  - Strong collaboration and communication skills
