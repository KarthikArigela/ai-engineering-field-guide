  The top of the range is reserved for candidates who notably
  exceed the requirements; the lower end applies to those with
  less experience or fewer preferred qualifications. For
  positions based in higher-cost zones (e.g., California, New
  York, New Jersey), actual compensation may exceed the posted
  range; your recruiter will share specifics during the
  process.
