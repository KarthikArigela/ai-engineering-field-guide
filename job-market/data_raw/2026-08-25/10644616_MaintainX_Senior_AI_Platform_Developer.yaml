description: |
  MaintainX is the world's leading AI-powered maintenance and
  asset management platform, serving 14,000+ customers
  including Duracell, Shell, Cintas, and Brenntag. We raised
  $150M in Series D funding led by Bessemer Venture Partners
  and Bain Capital Ventures, bringing our total funding to
  $254M. We were named to the Forbes 2025 Cloud 100, the
  definitive ranking of the top 100 private cloud companies in
  the world. We're growing fast and hiring the talent to
  match.

  We’re looking for a Senior AI Platform Developer to build
  the shared systems that enable teams across MaintainX to
  ship AI-powered products reliably at scale. You will design
  and operate internal services that standardize how AI
  workloads run in production, with clear abstractions, safe
  defaults, and strong observability. This role is focused on
  platform leverage- reducing operational and cognitive load
  for other developers while raising the bar for reliability,
  performance, and delivery speed across the AI stack.

  What you’ll do:

  - Build and operate scalable backend services and internal
    APIs for the AI platform.
  - Integrate LLMs and AI tool execution into reliable,
    production-ready workflows.
  - Own production reliability for AI platform infrastructure
    through observability, alerting, and incident response.
  - Improve performance and cost efficiency of AI runtimes
    through profiling, tuning, and capacity planning.
  - Contribute to shared infra: CI/CD, observability,
    deployments

  About you:

  - 5+ years of experience in Python backend development +
    systems design experience.
  - Experience shipping AI-powered or LLM-integrated backend
    systems.
  - Comfort working across multiple layers (services, data,
    infrastructure, AI tooling).
  - Experience with cloud infrastructure (AWS/GCP/Azure) and IaC
    (Terraform/Pulumi).
  - Experience with distributed systems and asynchronous
    processing.
  - Have familiarity with AI or data-heavy services where
    reliability and cost matter at scale.

  What’s in it for you:

  - Competitive salary and meaningful equity opportunities.
  - Healthcare, dental, and vision coverage.
  - 401(k) / RRSP enrollment program.
  - Take what you need PTO.
  - A Work Culture where:
    - You’ll work alongside folks across the globe that reflect
      the MaintainX values: Smart Humble Optimists.
    - We believe in meritocracy, where ideas and effort are
      publicly celebrated.

  #LI-Remote

  Our mission is to deliver one platform for maintenance,
  repair & operations teams to keep the physical world
  running. We believe the greatest asset in any organization
  is the people. That’s why we built an intuitive, mobile-
  first solution to help boost productivity and collaboration
  across teams and locations.

  MaintainX is committed to creating a diverse environment.
  All qualified applicants will receive consideration for
  employment without regard to race, colour, religion, gender,
  gender identity or expression, sexual orientation, national
  origin, genetics, disability, age, or veteran status.
