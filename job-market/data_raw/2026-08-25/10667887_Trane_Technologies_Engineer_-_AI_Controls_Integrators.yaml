  business—it is our business.  Do you dare to look at the
  world's challenges and see impactful possibilities?  Do you
  want to contribute to making a better future?  If the answer
  is yes, we invite you to consider joining us in boldly
  challenging what's possible for a sustainable world.

  Learn about our benefits designed for you to Thrive at work
  and at home.

  We boldly go.

  Where is the work:

  On-Site (5 days)

  What's in it for you:

  BrainBox AI is part of Trane Technologies and helps support
  its goal of creating smart, energy‑efficient buildings.
  Brainbox AI utilizes self‑adapted artificial intelligence
  technology to proactively optimize the energy consumption of
  one of the largest contributors to climate change.

  Our AI engine supports a self‑operating building that
  requires no human intervention. Using deep learning,
  cloud‑based computing, and our proprietary process, our
  solution autonomously optimizes existing Heating,
  Ventilation, and Air Conditioning (HVAC) control systems for
  maximum impact on energy consumption.

  An exciting opportunity awaits the right candidate to be
  part of a team within a fast‑growing Artificial Intelligence
  company as an AI Controls Integrator on the Building
  Digitalization Team. As an AI Controls Engineer &
  Integrator, you will play a pivotal role in the delivery of
  the BBAI solution to our clients.

  The role will be mainly focused on mapping clients’ data to
  fit BBAI internal standards. In addition, you will also be
  involved in deploying energy‑efficiency solutions in
  buildings. This position is for Chennai Location.

  What you will do:

  - Use Python scripts, and front-end user interface to support
    the digitalization and development of different projects.
  - Test and deploy different algorithms for project deployment
    and share the report to different stakeholders.
  - Take ownership of supporting different teams in project
    handoff, algorithm deployment, and ensuring the timely
    completion of projects deployment.
  - Understand building hierarchy and point names and tags.
  - Engage cross-functionally with teams to facilitate building
    deployments and onboarding processes.
  - Understand Building HVAC designs and document information.
  - Work with standardized procedures for building digitalized
    deployment.
  - Support requests to update config and control changes needed
    for buildings.
  - Maintain thorough documentation of work processes and
    procedures.
  - Provide support for post-deployment handoff and contribute
    to the deployment of client value-add services.
  - Good communication skills

  What you will bring:

  - Bachelor’s degree in building or mechanical engineering, or
    technical degree in related field with 2 to 3 years of
    experience with building automation and HVAC control
    system
  - In-depth knowledge of various building HVAC equipment,
    demonstrating familiarity with the diverse range found in
    buildings.
  - Practical experience with DDC (Direct Digital Control), PLC
    (Programmable Logic Controller), or similar programming in
    BAS (Building Automation System) and HVAC control.

  Nice to Have

  - Familiarity with building management system protocols,
    including but not limited to BACnet, Modbus, and Lon works
    is considered an asset.
  - Proficiency in Python and other programming languages is
    considered an asset.
  - Understanding of Basic Control Practices

