title: AI Customer Insights Engineer
company: Seeq
location: USA
remote: true
work_type: FULL_TIME
description: |
  The AI Customer Insights Engineer builds scalable
  intelligence workflows that help Seeq’s Customer Success
  organization act earlier, smarter, and more strategically.

  This role sits within Customer Success and operates at the
  intersection of product usage analytics, customer health
  modeling, workflow automation, and applied AI. The mission
  is to transform raw customer data—usage, engagement, and
  contract signals—into actionable insights delivered to the
  right people at the right time.

  This is an early-career, high-potential role ideal for an
  engineering graduate or former process engineer pivoting
  into analytics and software.

  Key Duties & Responsibilities:

  Build Customer Intelligence Workflows

  - Design and deploy account-level Slack summaries for CSMs and
    leadership.
  - Translate product usage and contract data into operational
    signals.
  - Build or extend data pipelines in partnership with Analytics
    Engineering.
  - Develop Python-based automation to operationalize insights
    at scale.

  Improve Health & Renewal Predictability

  - Contribute to Seeq’s customer health scoring framework.
  - Develop usage-to-renewal correlation models.
  - Identify leading indicators of risk, expansion, and
    adoption.
  - Iterate based on measurable predictive lift and CS feedback.

  Apply AI and Modern Tooling

  - Leverage AI-first coding workflows to accelerate
    development.
  - Build lightweight LLM-driven synthesis workflows where
    valuable.
  - Help elevate development practices across Customer Success.

  Partner Cross-Functionally

  - Work directly with CSMs to understand real decision
    workflows.
  - Collaborate with Analytics Engineers on modeling and data
    structure.
  - Feed product insights back into engineering through internal
    dogfooding.

  Requirements

  Requirements

  - Bachelor’s degree in Chemical, Mechanical, Electrical,
    Industrial, Systems Engineering, Computer Science, Applied
    Math, Data Analytics, or related field.
  - 0–3 years of experience (internships included) in analytics,
    engineering, or technical roles.
  - Working knowledge of SQL.
  - Strong Python skills.
  - Exposure to data modeling concepts.
  - Familiarity with LLMs or AI-assisted development tools.
  - Comfort operating in ambiguity.
  - Strong written communication skills.



  Preferred Qualifications

  - Background in process manufacturing or industrial
    engineering.
  - Exposure to BI tools (e.g., PowerBI).
  - Familiarity with product analytics platforms (e.g.,
    Mixpanel).
  - Experience building Slack automations or APIs.
  - Exposure to modern data pipelines (e.g., Azure Data
    Factory).
  - Demonstrated curiosity about customer behavior and causal
    mechanisms.

  Benefits

  Seeq is a remote-first (only) company founded by serial
  entrepreneurs. Our executive team and board of directors
  have extensive experience with successful startup ventures
  in high-growth environments.

  We are founded on the idea that companies need better
  solutions for quickly and easily getting business insight
  from their industrial process data. Our mission is to
  provide software and services that convert that data into
  meaningful information that the business can use to improve
  profitability.

  We have a wonderful, kind-hearted, talented team that loves
  to collaborate, lead by example, and exceed our customers’
  expectations. We are certified as a great place to work, an
  emerging startup, the Technology Fast 500, and Inc.
  Magazine's Best Places to Work.

  The Perks of Working at Seeq

  - Competitive salary plus bonus incentives
  - Benefits:

  Seeq provides equal employment opportunities (EEO) to all
  employees and applicants for employment without regard to
  race, color, religion, sex, national origin, age,
  disability, or genetics.

  You must be authorized to work in the country in which you
  reside. Seeq does not sponsor US F1 or H-1B work visas
