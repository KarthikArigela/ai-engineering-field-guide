  Job Description

  As an ESS ID&F Senior Solutions Engineer you will be a
  critical stakeholder in the development and release of our
  ID&F products.

  You will be a trusted advisor to regional delivery and
  support teams representing them during the software
  development lifecycle, providing operational guidance,
  product consultancy and supporting client incidents.

  This role contributes towards the success of the ID&F
  business through AI native automation and innovation
  improvements. Additionally, it facilitates internal
  knowledge-sharing activities, such as product improvements,
  documentation optimization, enhancing product deliverability
  through technical input and customer advocacy. Furthermore,
  the role involves being continually curious and striving to
  understand the customers' product needs, challenges, and
  issues.

  - Hands-on experience working with and utilizing AI tools
    (e.g., AI-assisted coding, code generation, content
    generation, automated testing, AI-powered DevOps) to drive
    engineering productivity and innovation.
  - Able to deliver and troubleshoot SaaS and on-prem/hosted
    solutions
  - Solid analytical and problem-solving skills
  - Ability to shape and drive acceleration of outcomes through
    critical thinking
  - Ability to comprehend detailed project specifications with
    the need to work on multiple initiatives simultaneously.
  - Ability to drive SaaS and on-prem deliveries and client
    implementations, specifically technical engineering
    aspects with experience desired in the following areas:
  - Experience with cloud services, deployment, and management
    (AWS - inclusive of scaling, tuning, CI/CD deployment
    practices)
  - Experience with DevOps and CI/CD
    (Git/Jenkins/Ansible/Terraform/etc)
  - Experience using alerting & monitoring solutions (Splunk,
    DynaTrace)
  - Understanding of XML, JSON, Swagger
  - Platform Familiarity with Docker/Kubernetes/EKS/Kafka
  - Experience with API test tools such as Bruno / Postman /
    SOAP UI
  - Proven oral and written communication skills
  - You should have critical thinking ability when
    troubleshooting complex problems and clear communication
    skills when recommending improvements in the form of
    quantifiable solutions.
  - You will interact with multiple levels of the organization
    across multiple time zones, so it requires an ability to
    build long-term relationships and navigate across a
    complex matrix org.
  - You will report to a Senior Manager

  Qualifications

  Bachelor's degree desirable in Computer Science, Information
  Systems, Engineering, or related discipline and knowledge of
  relevant modern technology with proven track record.

  - Preferred Additional Skills:
    - Industry experience in the Identity and Fraud space
    - Examples of customer-value driven agile working and rapid
      prototyping
    - A critical thinker with a desire to continuously learn new
      things
    - Able to work both as an individual contributor as well as
      contribute to the wider team with strong execution
      skills.
    - Experience with Atlassian JIRA and Confluence
    - Experience working with geographically dispersed teams
    - Experience using and querying databases such as Oracle and
      PostgreSQL

