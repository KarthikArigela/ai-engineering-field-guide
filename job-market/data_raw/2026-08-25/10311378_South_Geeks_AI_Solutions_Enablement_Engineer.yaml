  About South Geeks

  South Geeks connects elite, AI-fluent engineers from Latin
  America with future-shaping companies in Health and Wealth.
  We're hiring an AI Solutions & Enablement Engineer to join
  one of our clients, a biotechnology company advancing
  immune-driven medicine through precision diagnostics and
  research.

  About the Role

  Our client is looking to accelerate the adoption of
  Generative AI, Large Language Models (LLMs), and agentic
  technologies across the enterprise. This role bridges
  business stakeholders and technology teams: identifying
  high-impact productivity opportunities, helping prioritize
  and implement AI solutions, and driving adoption through
  training, coaching, and enablement. You'll work closely with
  departments across the company to discover use cases,
  evaluate business value, and help deploy and support AI-
  powered workflows and tools.

  What You'll Do

  AI Use Case Discovery & Prioritization

  - Partner with business leaders and teams to identify
    productivity, automation, and knowledge-management
    opportunities
  - Conduct interviews, workshops, and assessments to gather and
    document AI use cases
  - Evaluate opportunities based on business impact,
    feasibility, risk, and organizational readiness
  - Develop business cases and recommendations for
    prioritization and investment
  - Collaborate with technology leadership to maintain an
    enterprise AI opportunity roadmap

  AI Adoption & Enablement

  - Serve as a subject matter expert and internal advocate for
    Generative AI and agentic technologies
  - Drive adoption of enterprise AI platforms and tools,
    including solutions such as Codex, Claude for Enterprise,
    Microsoft Copilot, and other approved AI technologies
  - Design and deliver training programs, workshops, office
    hours, and educational materials
  - Coach employees and teams on effective prompting, workflow
    design, and responsible AI usage
  - Establish best practices and reusable patterns that enable
    teams to gain value from AI tools quickly and safely

  Solution Development & Technical Enablement

  - Configure, integrate, and support AI-powered workflows and
    solutions under the guidance of technology leadership
  - Assist with implementation of AI agents, automations, and
    integrations using approved enterprise platforms
  - Collaborate with engineering, infrastructure, security, and
    data teams to ensure solutions meet technical and
    compliance requirements
  - Perform lightweight administration, configuration, testing,
    and operational support for AI platforms and related
    services
  - Document solution architectures, implementation approaches,
    and operational procedures

  Governance & Responsible AI

  - Promote responsible, secure, and compliant use of AI
    technologies across the organization
  - Partner with security, legal, compliance, and technology
    teams to ensure appropriate governance practices are
    followed
  - Monitor emerging AI technologies, industry trends, and best
    practices to inform enterprise strategy
  - Help establish standards, metrics, and success measures for
    AI adoption and business value realization

  What You Bring

  - Bachelor's degree in Computer Science, Information Systems,
    Business, Engineering, or related field, or equivalent
    experience
  - 3+ years of experience in technology consulting, business
    analysis, digital transformation, automation, or AI
    enablement
  - Demonstrated knowledge of Generative AI, Large Language
    Models (LLMs), prompt engineering, and agentic systems
  - Experience with one or more enterprise AI platforms such as
    OpenAI, Claude, Microsoft Copilot, GitHub Copilot/Codex,
    or similar
  - Strong communication and facilitation skills with the
    ability to engage both technical and non-technical
    audiences
  - Experience gathering requirements, documenting business
    processes, and translating business needs into technology
    solutions
  - Strong organizational skills and ability to manage multiple
    initiatives simultaneously

  Nice to Have

  - Experience implementing AI workflows, automations, or agents
    using modern AI platforms and orchestration tools
  - Familiarity with APIs, integrations, workflow automation
    platforms, and low-code/no-code technologies
  - Experience with change management, training, and
    organizational adoption programs
  - Understanding of AI governance, security, privacy, and
    compliance considerations in enterprise environments
  - Experience working in biotechnology, healthcare, life
    sciences, or regulated industries

  Why South Geeks

  - Competitive rates, paid in USD
  - Full-time, long-term engagement
  - Continuous training and development
  - Performance coaching to support your career growth
  - Paid time off, fully supported
  - Ongoing English classes
  - International, state-of-the-art projects
  - 100% remote
