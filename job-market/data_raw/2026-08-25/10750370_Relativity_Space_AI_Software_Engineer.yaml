description: |
  At Relativity Space, we’re building rockets to serve today’s
  needs and tomorrow’s breakthroughs. Our Terran R vehicle
  will deliver customer payloads to orbit, meeting the growing
  demand for launch capacity. But that’s just the start.
  Achieving commercial success with Terran R will unlock new
  opportunities to advance science, exploration, and
  innovation, pioneering progress that reaches beyond the
  known.

  Joining Relativity means becoming part of something where
  autonomy, ownership, and impact exist at every level. Here,
  you're not just executing tasks; you're solving problems
  that haven’t been solved before, helping develop a rocket, a
  factory, and a business from the ground up. Whether you’re
  in propulsion, manufacturing, software, avionics, or a
  corporate function, you’ll collaborate across teams, shape
  decisions, and see your work come to life in record time.
  Relativity is a place where creativity and technical rigor
  go hand in hand, and your voice will help define the stories
  we’re writing together. Now is a unique moment in time where
  it’s early enough to leave your mark on the product, the
  process, and the culture, but far enough along that Terran R
  is tangible and picking up momentum. The most meaningful
  work of your career is waiting. Join us.

  About the Team:

  The Terrestrial Software team is building the foundation for
  an automated rocket factory and integrated launch platform.
  Their mission is to automate and streamline workflows across
  the entire lifecycle of Terran R, from raw material intake
  to launch operations and eventually manufacturing on Mars.
  Today, that means partnering directly with teams across
  design, materials, manufacturing, and test and launch to
  design, implement, and deploy end-user enterprise-wide
  applications, industrial automation, data analytics
  infrastructure, and next-generation AI to solve real
  problems and accelerate progress. Long term, the team is
  laying the groundwork for a modular, scalable software
  platform that can power highly autonomous operations on
  Earth and beyond. This is a team for builders and thinkers
  who thrive on cross-functional impact and want to shape the
  digital backbone of our future in space.

  The AI, Data and Platform Engineering team leads
  Relativity's initiative to make AI a core part of how we
  design, build, and test rocket hardware. We build the
  applications, agents, data foundations, and platform that
  put AI in the hands of engineers and operators across the
  company. We are a small, high-ownership team that ships
  quickly, works directly with users, and treats reliability
  and evaluation as first-class parts of every AI product.

  About the Role:

  You will help build AI systems used by engineers and
  operators across the company, working across the full
  software development life cycle: concept, design,
  implementation, and ongoing iteration. Build AI-powered
  applications and agents on top of foundation models, and
  make them reliable in production. Follow agile development
  practices and ship quality software that is continuously
  integrated and deployed. Solve complex problems with simple
  solutions. Work directly with users and stakeholder teams to
  define requirements, implement solutions, and iterate.
  Technologies we use: Python, React, TypeScript, Go.
  Foundation models (Claude and others), agent and
  orchestration frameworks, retrieval and vector search, LLM
  evaluation tooling. Spark, Iceberg, DuckDB, Redshift, DBT,
  Postgres, Mongo. AWS, Kubernetes (cloud and on-prem),
  Terraform, Helm.

  About You:

  - Bachelor's degree or higher in Computer Science or a related
    engineering field (Computer, Software, Electrical,
    Aerospace).
  - Strong computer science foundations: data structures,
    algorithms, systems, and clean, testable code
  - Hands-on experience building with large language models,
    whether through coursework, projects, or self-directed
    work
  - Proficient in at least one language you love, and eager to
    learn new ones
  - Curious, fast-learning, and motivated to work directly with
    engineers and operators on the factory floor

  Nice to haves but not required:

  - 1+ years of professional experience, including internships,
    research, or substantial personal and academic projects
    you have shipped
  - Experience building agents, retrieval-augmented generation,
    or LLM evaluation pipelines
  - Familiarity with data engineering tools and modern data
    stacks
  - Exposure to manufacturing, hardware, robotics, or other
    physical-world domains
  - Contributions to open-source projects or published research

  At Relativity Space, we are committed to transparency and
  fairness in our compensation practices. Actual compensation
  will be determined based on experience, qualifications, and
  other job-related factors. Compensation is only one part of
  our total rewards package. Relativity Space offers
  competitive salary and equity, a generous PTO and sick leave
  policy, parental leave, an annual learning and development
  stipend, and more! To see some of the benefits & perks we
  offer, please visit here.

  Hiring Range:

  $115,000—$173,000 USD

  We are an equal opportunity employer and value diversity at
  our company. We do not discriminate on the basis of race,
  religion, color, national origin, gender, sexual
  orientation, age, marital status, veteran status, or
  disability status.

  If you need a reasonable accommodation, please contact us at
  accommodations@relativityspace.com.

  Please note: Relativity Space does not accept unsolicited
  resumes, candidate profiles, or referrals from recruitment
  agencies or search firms. Any unsolicited submission - via
  email, our website, social media, or directly to an employee
  - will be deemed the property of Relativity Space, and no
  fee will be owed absent a current, fully executed agreement
  with Talent Acquisition that specifically authorizes
  submissions for the applicable role.
