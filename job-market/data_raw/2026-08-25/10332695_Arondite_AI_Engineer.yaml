description: |
  About Arondite

  Arondite enables organisations to wield autonomy, data and
  AI at scale. We equip operators with the foundational
  software to orchestrate their mix of platforms and
  capabilities, and then take mission-critical decisions
  faster than their adversaries.

  We exist to ensure the UK and its allies out-think, out-pace
  and out-adapt those who seek to threaten our values and way
  of life. Our technology is designed for deployment in the
  world’s most austere environments, and is relied upon by the
  world’s most demanding operators. We deploy alongside them,
  bringing our technical expertise wherever it is needed.

  You will join Arondite at a pivotal moment in the company’s
  journey. We are ambitious, building for the long-term and
  backed by globally renowned investors including Index
  Ventures (Anthropic, Wiz, Figma, Revolut). Our company is
  being built by exceptional people; people who find high-
  tempo and challenging work engaging and exciting, and who
  consistently deliver outsized impact. You will collaborate
  with other brilliant minds to solve some of the world’s
  hardest and most important problems.

  You will have ownership and autonomy from Day One. There is
  no corporate ladder at Arondite. We hire the best people and
  give them extremely high levels of autonomy; the sky is the
  limit for an individual with the right ambition.

  If you are motivated by our mission and if you want to be
  part of an outstanding team, then we want to hear from you.

  About the role

  Arondite is looking for AI Engineers to understand our
  customers' problems and implement solutions using AI. We
  want people who are excited about the opportunity to take
  ownership for building AI within a high-performance,
  mission-focused team.

  You will be involved in the creation of advanced agentic
  designs, engineering the harness required to deploy Large
  Language Models (LLMs) that are able to take actions within
  highly controlled and compliant environments. This is a
  unique application of agentics, pioneering how agentic AI
  can be safely and effectively leveraged in high-stakes
  scenarios.

  Depending on your expertise, you may also work in perception
  by applying state-of-the-art object detection and multi-
  modal algorithms (such as CLIP and CLAP) across diverse,
  real-time sensor streams.

  To succeed, you must possess strong architectural intuition,
  deeply understanding the technical compromises inherent in
  model selection and able to identify the optimal agentic
  design pattern for specific tasks

  Your responsibilities will include:

  - Building core agentic product features; researching,
    planning, refining, executing and maintaining
  - Collaborating with other engineers to integrate AI into our
    enterprise software product
  - Designing end-to-end AI solutions from the backend to user
    interface, and deploying them both in cloud environments
    and on-premise.
  - Inventing novel capabilities and optimising existing
    approaches whilst remaining aware of ethical implications
    of your engineering decisions
  - Documenting and explaining your solutions to provide
    evidence of compliance with policies regarding the safe
    use of AI
  - Building secure, robust solutions by adhering to coding
    standards throughout the development lifecycle

  Requirements

  Arondite aims to bring together individuals from diverse
  backgrounds and with different perspectives. We therefore
  don’t expect people to have experience across every area of
  the requirements. Please apply even if you only partially
  fulfil the following lists.

  You should have:

  - Masters degree (MSc, MEng, etc) in computer science,
    mathematics, artificial intelligence, machine learning, or
    a related engineering field
  - 1 year of experience developing agentic AI in production
    ready environments
  - 3 years of relevant hands-on experience with machine
    learning algorithms
  - The ability to write clean and maintainable code in Python,
    Rust, C++ or Java
  - A strong background in the mathematical foundations of core
    ML algorithms, paired with hands-on experience using deep
    learning frameworks (PyTorch, JAX, TensorFlow), agentic
    orchestrationecosystems (LangGraph, Google ADK), and Model
    Context Protocol tooling (RustMCP)
  - Strong written and verbal communication skills to document
    your work effectively and present it to relevant
    stakeholders and users
  - A passion for identifying and implementing pragmatic
    solutions to hard problems using AI and conventional
    algorithms

  Ideally, you would also have:

  - PhD in machine learning, or a related field
  - Authored publications in top-tier journals and conferences
    (e.g. NeurIPS, ICLR, ICML, EMNLP)
  - Experience working with MLOps infrastructure or deploying AI
    models to production, including the associated monitoring,
    testing and quality assurance
  - Experience working with AI in regulated environments
  - Created and optimised state-of-the-art AI models for
    resource-constrained hardware

  Right to Work

  We require that all candidates have an existing Right to
  Work in the UK at the time of application.

  Security clearance

  We believe in working closely with defence customers. As a
  result, this role will require the individual to hold a
  clearance or be willing to undergo UK security vetting to
  Security Check (SC) or above. This normally requires having
  continuous residency in the UK for at least 5 years.

  Office vs Hybrid working

  We are focused on building a positive, collaborative
  engineering-driven culture. We therefore believe in making
  the office a friendly, comfortable and fun place to be, and
  we try to work from the office where possible. Of course,
  there are times when it makes sense for you to work from
  home and that's OK. You may also need to travel to visit
  customers, depending on your role. But in general you should
  only apply to join Arondite if you're excited to come into
  the office and work in person by default.

  Application process

  Our interview process for this role is normally:

  - CV submission with initial questions
  - Introductory Teams call (30-45 mins)
  - In-person technical interview (1-2 hours)
  - Final interview with one of Arondite’s Founders (30 mins)

  Benefits

  - Highly competitive base salary
  - Generous equity in EMI share options in a well-funded and
    growing startup
  - 7% employer pension contribution
  - Free meals in the office every day
  - Private health and dental insurance, with opt-in cover for
    dependents
  - Cycle to work scheme
  - Relocation support
  - Access to any resources, equipment and training that you
    need to do your job in a world-class way
