  SUMMARY:The AI Prompt Engineer, Commercial helps the
  Commercial organization get reliable, high-quality results
  from Claude, GenieOne, and Microsoft Copilot across deal
  support, pricing, proposals, and client-facing materials.
  You design and refine the multi-step prompts behind real
  commercial workflows, build a reusable library of Claude,
  GenieOne, and Copilot SKILLS that other teams can adopt, and
  create the custom instructions and templates that help non-
  technical commercial staff use these tools well. This is a
  business-process and workflow role with strong AI tool
  fluency, not an engineering role. It does not require
  software engineering, coding, or AI model development. It
  does require fluency in prompt construction, a working
  understanding of what Claude, GenieOne, and Microsoft
  Copilot can and cannot do, and the ability to design SKILLS
  and custom instructions that standardize and elevate how the
  function works.

  RESPONSIBILITIES: Tasks may include but are not limited to:

  - Develop and refine complex, multi-step prompts for Claude,
    GenieOne, and Microsoft Copilot for core commercial
    workflows, including proposal and request-for-proposal
    response development, pricing and bid support, and client-
    facing materials.
  - Build and maintain a reusable SKILLS library for Claude,
    GenieOne, and Copilot covering recurring commercial tasks
    such as proposal first drafts, request-for-proposal
    response assembly, and account briefs, packaged so other
    functions across the organization can adopt them.
  - Design custom instructions and user-level templates for
    Claude, GenieOne, and Copilot end users across Commercial,
    so non-technical staff produce consistent, on-brand,
    client-ready output without expert prompting.
  - Create prompt patterns for client-facing deliverables such
    as capability summaries, bid defense materials, and
    account or sponsor briefings.
  - Translate CRM and pipeline context (for example data from
    Salesforce and related sales tools) into prompt and
    template inputs, working from governed extracts and
    approved content rather than connecting systems yourself.
  - Support demand and pipeline workflows with prompt patterns
    for intake summaries, account research synthesis, and
    pipeline or win-rate readouts.
  - Run enablement for Commercial, including office hours, a
    prompt and recipe library, short guides, and onboarding,
    so business development, proposals, and pricing adopt the
    tools in daily work.
  - Establish quality checks and review steps for AI-assisted
    commercial outputs, and document what each SKILL or
    template must not do.
  - Gather feedback, measure adoption and turnaround time,
    retire low-value prompts, and keep the library current as
    workflows and tools change.
  - Hold the confidential-data and commitment line, keeping
    client-confidential and pricing data out of unapproved
    tools and making sure nothing priced or client-facing goes
    out without human review and approval.

  Perform other duties as assigned.  The duties and
  responsibilities listed above are representative of the
  nature and level of work assigned and are not necessarily
  all-inclusive.

  OTHER SKILLS AND ABILITIES:

  - Experience in a commercial, business development, proposals,
    pricing, sales-operations, or marketing role, ideally in a
    CRO, pharma, life sciences, or another regulated industry.
  - Familiarity with Microsoft 365 and Copilot in Word,
    PowerPoint, Excel, and Teams, and with Salesforce or a
    similar CRM.
  - Experience with proposal development, request-for-proposal
    processes, or pricing support.
  - Experience running enablement, training, or change
    management for a business function.

  REQUIREMENTS:

  - 2+ years of strong fluency in prompt construction for large
    language model assistants, including multi-step and
    structured prompts, with hands-on experience using Claude,
    GenieOne, and Microsoft Copilot for real work.
  - Experience building or curating a prompt or SKILLS library
    for a team or function.
  - A solid working knowledge of commercial processes, including
    proposals and request-for-proposal responses, pricing and
    bid support, business development, and the sales funnel
    and pipeline. You do not need to be a pricing or bid
    expert, but you should be conversant in how deals and
    proposals come together.
  - Demonstrated ability to design reusable assets, including
    SKILLS, templates, and custom instructions that other
    people can use without your help.
  - Comfort working with CRM and sales context (for example
    Salesforce) and content libraries (for example SharePoint)
    as inputs, with strong document and presentation skills in
    Word and PowerPoint.
  - Excellent writing and the ability to produce client-ready,
    on-brand business content and concise guidance for non-
    technical users.
  - A careful, governance-minded approach suited to a regulated,
    client-facing environment, with sound judgment about what
    AI should and should not do in commercial workflows.
  - This role does not require software engineering, coding,
    model training, or infrastructure skills.

  Promotion to the next level is not automatic based on years
  of experience. Personnel

