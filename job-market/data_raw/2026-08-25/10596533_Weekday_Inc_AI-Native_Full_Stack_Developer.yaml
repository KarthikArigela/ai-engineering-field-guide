description: |
  This role is for one of Weekday’s clients Salary range: Rs
  500000 - Rs 2000000 (ie INR 5 - 20 LPA)

  Min Experience: 3+ years Location: Hyderabad JobType: full-
  time

  We are looking for a talented and passionate Full Stack
  Developer with strong expertise in React.js, React Native,
  Node.js, and PostgreSQL, you will be responsible for
  designing, developing, and maintaining modern web and mobile
  applications while contributing to the complete software
  development lifecycle.

  The ideal candidate should have experience building scalable
  frontend and backend applications, designing secure APIs,
  and working with cloud technologies and modern development
  practices. Exposure to AI-powered development tools and LLM
  integrations will be considered an added advantage.

  Requirements

  Key Responsibilities

  - Design, develop, and maintain scalable, high-performance web
    and mobile applications using React.js and React Native.
  - Build intuitive, responsive, and reusable user interfaces
    using React.js, TypeScript, JavaScript (ES6+), HTML5, and
    CSS3.
  - Develop robust backend services and RESTful APIs using
    Node.js and Express.js.
  - Design, manage, and optimize PostgreSQL databases, ensuring
    high performance, scalability, and data integrity.
  - Integrate frontend applications with backend services and
    third-party APIs.
  - Implement secure authentication and authorization mechanisms
    using JWT, OAuth2, and other industry best practices.
  - Develop Dockerized applications and contribute to CI/CD
    pipelines for automated deployments.
  - Deploy, monitor, and maintain applications on cloud
    platforms such as Microsoft Azure, AWS, or Google Cloud
    Platform (GCP).
  - Write clean, maintainable, and well-documented code
    following coding standards and best practices.
  - Perform unit testing, debugging, troubleshooting, and
    performance optimization.
  - Participate in code reviews and collaborate with cross-
    functional teams including Product, UI/UX, QA, and
    Engineering.
  - Stay updated with emerging technologies and recommend
    improvements to existing systems and development
    processes.

  Required Technical Skills

  - Frontend: React.js, React Native, TypeScript, JavaScript
    (ES6+), HTML5, CSS3, Responsive Web Design.
  - Backend: Node.js, Express.js, RESTful API Development
  - Databases: PostgreSQL, MySQL, MongoDB.
  - Cloud Platforms: Microsoft Azure, Amazon Web Services (AWS),
    Google Cloud Platform (GCP).
  - DevOps & Tools: Docker, Git, CI/CD Pipelines.
  - AI & Modern Development: LLM API Integration, AI-Assisted
    Development (GitHub Copilot, Claude, Cursor, etc.), Prompt
    Engineering, Retrieval-Augmented Generation (RAG).Why Join
    Us • Build AI-first products used by global customers. •
    Work with modern AI tools and cutting-edge technologies. •
    Gain exposure to scalable architecture, cloud platforms,
    and best engineering practices. • Enjoy continuous
    learning, mentorship, and career growth opportunities.

  Must-have skills

  React Native, ReactJS

  Good-to-have skills

  PostgreSQL, NodeJS
