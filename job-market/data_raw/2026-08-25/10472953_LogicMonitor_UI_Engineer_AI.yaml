description: |
  About Us:

  We love going to work and think you should too. Our team is
  dedicated to trust, customer obsession, agility, and
  striving to be better everyday. These values serve as the
  foundation of our culture, guiding our actions and driving
  us towards excellence. We foster a culture of performance
  and recognition, allowing us to transform growth as we
  enable our employees to do the best work of their careers.

  This position is located in Bangalore. You'll be working in
  a major tech center of Bangalore, India. Across the globe,
  our Centers of Energy serve as hubs where we accelerate
  productivity and collaboration, inspire creativity, and
  cultivate a culture of connection and celebration. Our teams
  coordinate their time in Centers of Energy to reflect how
  they work best.

  To learn more about life at LogicMonitor, check out our
  Careers Page.

  What You'll Do:

  LogicMonitor® is the AI-first hybrid observability platform
  powering the next generation of digital infrastructure.
  LogicMonitor delivers complete visibility and actionable
  intelligence across on-premises, cloud, and edge
  environments. By anticipating issues before they strike,
  optimizing resources in real time, and enabling faster,
  smarter decisions, LogicMonitor helps IT and business
  leaders protect margins, accelerate innovation, and deliver
  exceptional digital experiences without compromise.

  Our customers love LogicMonitor's ability to bring cloud and
  traditional IT together into one view, as seen in minimal
  churn rates, expansion business, and exciting new customer
  references. In fact, LogicMonitor has received the highest
  Net Promoter Score of any IT Infrastructure Management
  provider. LogicMonitor also boasts high employee
  satisfaction. We have been certified as a Great Place To
  Work®, and named one of BuiltIn's Best Places to Work for
  the seventh year in a row!

  We’re looking for a UI Engineer to build intuitive,
  responsive, and performant frontend experiences for Edwin
  AI. You will work with Product, Design, AI Platform,
  Backend, AIOps, and SRE teams to make complex observability
  data and AI-generated insights easy to understand and act
  on.

  This is a hands-on role for an engineer who can
  independently deliver frontend features and contribute to
  technical design, testing, and production quality.

  Here's a closer look at this key role:

  - Build frontend experiences for AI-assisted incident
    investigation, root-cause analysis, alert correlation,
    recommendations, and remediation.
  - Develop production web applications using React, TypeScript,
    JavaScript, HTML, and CSS.
  - Implement interactive views for metrics, logs, traces,
    alerts, events, topology, incidents, and AI-generated
    insights.
  - Build streaming and real-time experiences using SSE,
    WebSockets, GraphQL subscriptions, or similar
    technologies.
  - Create reusable components and contribute to design systems
    using Storybook, Tailwind CSS, CSS Modules, Radix UI, or
    similar tools.
  - Implement data fetching, caching, and state management using
    TanStack Query, Zustand, Redux Toolkit, Jotai, GraphQL, or
    REST.
  - Build dashboards, charts, timelines, tables, topology views,
    and investigation workflows.
  - Implement AI UX patterns such as streamed responses,
    citations, source attribution, confidence indicators,
    feedback capture, and human-in-the-loop approvals.
  - Improve frontend performance, accessibility, responsiveness,
    and cross-browser compatibility.
  - Write unit, integration, component, and end-to-end tests.
  - Instrument applications using browser monitoring,
    OpenTelemetry, structured logging, and product analytics.
  - Participate in technical design, code reviews, production
    debugging, and feature delivery.

  What You'll Need:

  - Bachelor’s degree in Computer Science, Software Engineering,
    Human-Computer Interaction, or equivalent practical
    experience.
  - 3–5 years of experience building modern web applications,
    SaaS products, analytics platforms, developer tools, or
    workflow-driven applications.
  - Strong experience with React, TypeScript, JavaScript, HTML,
    and CSS.
  - Experience with modern frontend frameworks and tooling such
    as Next.js, Vite, Webpack, or similar technologies.
  - Strong understanding of component design, state management,
    API integration, caching, error handling, and asynchronous
    workflows.
  - Experience consuming REST, GraphQL, WebSocket, SSE, or other
    real-time APIs.
  - Experience building responsive, accessible, and performant
    interfaces.
  - Experience with design systems, component libraries,
    Storybook, and Product Design collaboration.
  - Experience building dashboards, charts, tables, or data-rich
    interfaces.
  - Experience with automated testing, CI/CD, feature flags, and
    production debugging.
  - Ability to independently deliver well-defined frontend
    features and communicate technical tradeoffs clearly.

