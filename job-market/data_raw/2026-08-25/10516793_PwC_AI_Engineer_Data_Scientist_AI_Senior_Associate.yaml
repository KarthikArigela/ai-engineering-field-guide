title: AI Engineer / Data Scientist, AI Senior Associate
company: PwC
location: Los Angeles, USA
work_type: FULL_TIME
description: |
  The Opportunity As part of the AI Engineering team within
  the Digital Assurance & Technology team, you will play a
  pivotal role in transforming raw data into actionable
  insights, enabling informed decision-making and driving
  business growth. Within our Assurance practice, you will
  leverage advanced technologies and techniques to design and
  develop robust data solutions for clients. As a Senior
  Associate, you will focus on building meaningful client
  connections and learning how to manage and inspire others.
  You will navigate increasingly complex situations, growing
  your personal brand and deepening your technical skills. You
  are expected to anticipate the needs of your teams and
  clients, delivering quality work while embracing ambiguity
  and using these moments as opportunities to grow. In this
  role, you will apply data, algorithms, and software
  engineering to build and deploy AI and Machine Learning
  solutions at scale. Your work will involve designing AI
  systems, data wrangling, and software implementation to
  enable scalable AI models. You will use a broad range of
  tools and methodologies to generate new ideas and solve
  problems, interpreting data to inform insights and
  recommendations. Upholding professional and technical
  standards, you will contribute to the firm's overall
  business strategies and client solutions. Responsibilities
  - Designing and implementing AI systems to transform raw data
    into actionable insights
  - Developing scalable machine learning models to support
    client decision-making and business growth
  - Collaborating with teams to build and deploy software and
    platform systems for AI solutions
  - Applying data wrangling techniques to prepare datasets for
    AI model training and validation
  - Utilizing critical thinking to break down complex concepts
    and generate innovative solutions
  - Interpreting data to inform insights and recommendations for
    client engagements
  - Upholding professional and technical standards in alignment
    with the firm's code of conduct
  - Navigating complex situations to anticipate the needs of
    teams and clients
  - Building meaningful client connections to foster long-term
    relationships and trust
  What You Must Have
  - At least a Bachelor's degree
  - At least 2 years of experience
  What Sets You Apart
  - Preference for at least one of the following fields of
    study: Analytics/Data Science, Artificial
    Intelligence/Robotics, Computer Science/Information
    Systems, Engineering
  - At least one of the following: Certifications aligned to
    data engineering, machine learning, and cloud platforms,
    including AWS, Google Cloud, Microsoft Azure, Databricks,
    Snowflake, or related data and AI credentials
  - Demonstrating proficiency in AI implementation and machine
    learning
  - Utilizing critical thinking to break down complex concepts
  - Navigating ambiguity while maintaining focus on client needs
  - Building meaningful client connections and managing
    relationships
  - Interpreting data to inform insights and recommendations
  The salary range for this position is: $72,000 - $184,440.
