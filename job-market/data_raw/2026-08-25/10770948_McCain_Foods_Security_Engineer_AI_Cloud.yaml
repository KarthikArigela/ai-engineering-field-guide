description: |
  Position Title:Security Engineer AI Cloud Position Type:
  Regular - Full-Time Requisition ID: 43407 Overview As part
  of our ongoing digital and AI transformation, we are
  expanding our security capabilities to securely enable AI-
  driven platforms, data products, and cloud-native services.
  The Security Engineer AI Cloud will play a critical role in
  protecting AI systems, cloud infrastructure, and data
  pipelines while enabling responsible and scalable adoption
  of artificial intelligence across the enterprise. This role
  combines hands-on security engineering with architectural
  thinking, focusing on secure AI platforms, workloads, and
  integrations in cloud environments. The position works
  closely with Cloud, DevOps, Architecture, AI Data and
  analytics , and Engineering teams to ensure security is
  embedded across the AI/ML lifecycle. Job Purpose Reporting
  to the Director of Security Engineering, the AI Security
  Engineer is responsible for designing, implementing, and
  monitoring security controls for AI-enabled systems and
  cloud infrastructure. This role ensures AI solutions are
  secure by design, compliant with governance standards, and
  resilient against emerging threats such as data leakage,
  prompt manipulation, model abuse, and cloud
  misconfiguration. Key Responsibilities AI & Application
  Security

  - Implement security controls for AI/ML platforms, including
    model training, fine-tuning, deployment, and inference
    environments
  - Support secure design of AI-enabled applications, including
    copilots, chatbots, APIs, and agent-based workflows
  - Conduct risk assessments and threat modeling for AI
    solutions (e.g., data leakage, misuse, prompt injection,
    model exposure)
  - Lead the implementation of AI guardrails, monitoring, and
    secure access controls

  Cloud & Platform Security

  - Design, implement, and maintain security controls for cloud-
    based AI workloads across Azure, AWS, and/or GCP
  - Maintain and operate Cloud Native Application Protection
    Platform (CNAPP) capabilities (CSPM, CWPP, workload
    security)
  - Participate in the design and review of new cloud and AI
    projects to ensure security requirements are built in from
    inception
  - Secure containerized, serverless, and data platforms
    supporting AI solutions

  DevSecOps & Engineering Enablement

  - Implement and review security controls in CI/CD pipelines,
    including those supporting AI and data workloads
  - Partner with DevOps and Engineering teams to embed security-
    as-code and infrastructure-as-code controls
  - Support automation of security testing, monitoring, and
    policy enforcement across cloud and AI environments

  Threat, Risk & Operations

  - Conduct cloud and AI security assessments and audits aligned
    with NIST, CIS, and industry best practices
  - Monitor cloud and AI platforms for security events,
    vulnerabilities, and anomalous behavior
  - Participate in incident response for cloud and AI-related
    security issues
  - Stay current on emerging AI security threats, cloud attack
    techniques, and defensive technologies

  Standards, Governance & Advisory

  - Contribute to the development of cloud and AI security
    standards, patterns, and guidelines
  - Provide expert guidance to technology teams on secure AI and
    cloud design decisions
  - Support Responsible AI, data protection, and compliance
    initiatives in collaboration with privacy and legal teams

  Measures of Success

  - Secure deployment of AI and cloud solutions with reduced
    risk exposure
  - Effective remediation of cloud and AI security
    vulnerabilities
  - Adoption of standardized security patterns across AI-enabled
    platforms
  - Improved collaboration between Security, Cloud, DevOps, and
    Data teams

  Key Qualifications & Experience

  - Bachelor's degree in Computer Science, Information Security,
    or related field
  - Demonstrated experience in cloud security engineering
    (Azure, AWS, GCP)
  - Hands-on experience securing cloud-native applications and
    platforms
  - Hands - on experience with AI/ML products and deployments,
    data pipelines, and AI-enabled applications
  - Experience with CNAPP tools (e.g., Defender for Cloud)
  - Knowledge of security frameworks such as NIST, CIS, and Zero
    Trust principles
  - Experience with Infrastructure-as-Code tools (e.g.,
    Terraform)
  - Strong analytical, collaboration, and communication skills

  Preferred Qualifications

  - Experience securing AI, data, or analytics platforms
  - Experience with AI-related security risks and governance
    frameworks (e.g., NIST AI RMF)
  - Cloud or security certifications (e.g., Azure Security
    Engineer, CCSP)
  - Experience integrating security into modern DevOps and data
    engineering environments

  Leadership & Ways of Working

  - Customer-focused and business-oriented mindset
  - Ability to work independently while collaborating across
    teams
  - Comfortable balancing hands-on execution with strategic
    security thinking
  - Proactive learner, staying ahead of cloud and AI security
    trends

