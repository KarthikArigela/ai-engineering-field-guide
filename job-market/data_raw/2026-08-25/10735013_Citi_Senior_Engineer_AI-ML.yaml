description: |
  The Applications Development Technology Lead Analyst is a
  senior level position responsible for establishing and
  implementing new or revised application systems and programs
  in coordination with the Technology team. The overall
  objective of this role is to lead applications systems
  analysis and programming activities.

  Key Responsibilities:

  - Design, develop, and deploy Machine Learning and Generative
    AI models to solve complex business problems.
  - Build and optimize Agentic AI systems with a focus on
    autonomy and decision-making capabilities.
  - Develop scalable and efficient Python-based solutions for
    data preprocessing, model training, and deployment.
  - Collaborate with cross-functional teams to integrate AI/ML
    solutions into existing systems and workflows.
  - Research and implement state-of-the-art algorithms and
    techniques in Machine Learning and Generative AI.
  - Ensure data security and compliance with organizational
    policies while handling sensitive data.
  - Monitor and evaluate model performance, ensuring continuous
    improvement and optimization.
  - Document processes, models, and code to maintain
    transparency and reproducibility.

  Required Skills and Qualifications:

  - 6+ years of relevant experience in AL, ML with strong
    proficiency in Python programming and experience with
    libraries such as NumPy, Pandas, Scikit-learn, TensorFlow,
    PyTorch, etc.
  - Hands-on experience with Machine Learning, Generative AI,
    and Agentic AI systems.
  - Solid understanding of algorithms, data structures, and
    AI/ML model development.
  - Experience with Natural Language Processing (NLP), computer
    vision, or other AI domains.
  - Familiarity with cloud platforms (AWS, Azure, GCP) and
    containerization tools (Docker, Kubernetes).
  - Knowledge of data engineering workflows, including data
    cleaning, feature engineering, and pipeline development.
  - Strong problem-solving skills and the ability to work in a
    fast-paced, collaborative environment.
  - Excellent communication skills to convey technical concepts
    to non-technical stakeholders.

  Education:

  - Bachelor’s degree/University degree or equivalent experience
  - Master’s degree preferred

  This job description provides a high-level review of the
  types of work performed. Other job-related duties may be
  assigned as required.

