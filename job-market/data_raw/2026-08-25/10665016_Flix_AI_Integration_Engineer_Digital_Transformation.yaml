title: AI Integration Engineer – Digital Transformation (m/f/d)
company: Flix
location: Gurugram, IND
work_type: FULL_TIME
company_size: 2,117 Employees
description: |
  At Flix, we offer a dynamic work environment with
  competitive pay, strong growth opportunities, and a tech-
  driven approach to making travel more accessible,
  sustainable, and affordable.

  Joining the People & Organization Digital Transformation
  team, you will work directly with the Head of Digital
  Transformation and a close-knit team of four engineers based
  in Berlin. Your work will span automation engineering, AI
  application deployment on top of HR systems — with direct
  impact on how Flix manages its people technology globally.
  Are you an engineer who knows how to turn AI ideas into
  real-world applications—deploying Claude-based solutions,
  building integrations, and putting the right security and
  governance in place? If you’ve built innovative AI products,
  like those emerging from HR AI Day and beyond, and have the
  engineering mindset to take them from idea to scalable
  solution, we’d love to hear from you.

  This is a pure technical role. There is no administrative
  overhead, no time-critical firefighting and no expectation
  of HR domain expertise on day one — we can teach you the
  domain. This is an exciting, problem-solving-focused role at
  the intersection of AI, automation, and HR solution
  architecture. While the technical skills can be developed,
  what we cannot teach is the engineering mindset, depth of
  integration expertise, and natural instinct for automation
  that this role demands.

  This is a hybrid role based in Gurugram with a minimum
  office presence of 3 days per week. The role has a Europe
  and APAC-facing scope, with regular collaboration across
  Central European time zones.

  About the Role

  - Lead the technical workstream supporting internal automation
    projects —evaluating global HR system options, assessing
    integration complexity, mapping data dependencies and
    supporting potential migration execution from Workday or
    equivalent enterprise HR platforms.
  - Design and build automation and integration workflows using
    n8n,UiPath and Python — including multi-step
    orchestration, exception handling, retries, monitoring,
    alerting and structured documentation.
  - Build and maintain enterprise system integrations using REST
    APIs,OAuth 2.0, webhooks, SFTP and event-driven patterns
    across the HR technology landscape.
  - Develop secure AI integrations connecting platforms such as
    Claude with HRIS and enterprise systems using MCP servers,
    connectors, plugins and agent frameworks — with
    appropriate access controls and user-level permissions.
  - Deploy and operate internal applications and AI-powered
    tools on Flix's hosting infrastructure (AWS), including
    RBAC/ABAC access models, secrets management, credential
    rotation and audit logging.
  - Analyse business processes end-to-end, identify automation
    opportunities and design scalable target-state
    architectures that can support both the evaluation phase
    and eventual migration or implementation execution.
  - Engage with cross-functional stakeholders across Europe and
    APAC —translating complex technical requirements into
    clear solution designs and project deliverables across 3–6
    month project scopes.

  About You

  - 6–7+ years of hands-on professional experience in automation
    engineering, systems integration, solution architecture or
    AI application development. Exceptional mid-level
    candidates with strong technical depth will also be
    considered.
  - Demonstrable experience building and delivering automation
    workflows and enterprise integrations — this is an
    engineering role, not a data analytics or reporting role.
    Experience in Python, n8n and UiPath is essential.
  - Strong working knowledge of API design and integration
    patterns —REST APIs, OAuth 2.0, webhooks, SFTP and event-
    driven architectures.
  - Hands-on experience deploying and operating applications on
    AWS,including Lambda, API Gateway, Bedrock, Glue, Secrets
    Manager and CI/CD pipeline management.
  - Solid software engineering fundamentals — Git/GitHub,
    Docker,structured release management and familiarity with
    security practices including least privilege, RBAC/ABAC
    and credential handling.
  - Experience with Workday or enterprise HRIS platforms
    (configuration, integration or migration) is a strong
    advantage and a meaningful differentiator — though not an
    absolute  requirement if your automation and integration
    fundamentals are strong.
  - Comfort working across European and APAC time zones,
    collaborating with a Berlin-based team and contributing to
    strategic cross-functional initiatives.
  - n8n Level 1 or Level 2 certification is strongly preferred.

  We recognize that everyone carries a unique set of valuable
  skills and experiences. If you think you could have an
  impact even though you don't meet 100% of the requirements,
  we still encourage you to apply. We want to hear from you! 

  What We Offer

  - Travel perks: 12 free Flix vouchers + 12 discount vouchers
    for friends & family.
  - Work from (M)Anywhere: Depending on your role, work from
    another location for up to 60 days per year.
  - Hybrid work model: We are an office-first company, but we
    offer flexibility to balance work and life.
  - Wellbeing support: Access confidential 1:1 counselling,
    courses, and stress management for yourself and up to four
    family members.
  - Learning & Development: Take advantage of language classes,
    training courses, and expert-led sessions to grow your
    skills.
  - Mentoring Program: Connect with experienced colleagues to
    gain insights and accelerate your career.

  To view more local benefits specific to each office
  location, please check out this link: Locations - Flix
  Career

  Why Join Flix?

  At Flix, you’ll find teams that rally together to overcome
  challenges and spark creativity. We believe in ownership
  culture - giving you the freedom to take initiative, make an
  impact, and shape your own career path. As we continue to
  expand across the globe, you can make a real difference in
  how we work.

  If you’re ready to grow and lead your journey, Flix is the
  place for you!
