description: |
  At Braze, we have found our people. We’re a genuinely
  approachable, exceptionally kind, and intensely passionate
  crew.

  We seek to ignite that passion by setting high standards,
  championing teamwork, and creating work-life harmony as we
  collectively navigate rapid growth on a global scale while
  striving for greater equity and opportunity – inside and
  outside our organization.

  To flourish here, you must be prepared to set a high bar for
  yourself and those around you. There is always a way to
  contribute: Acting with autonomy, having accountability and
  being open to new perspectives are essential to our
  continued success.

  Our deep curiosity to learn and our eagerness to share
  diverse passions with others gives us balance and injects a
  one-of-a-kind vibrancy into our culture.

  If you are driven to solve exhilarating challenges and have
  a bias toward action in the face of change, you will be
  empowered to make a real impact here, with a sharp and
  passionate team at your back. If Braze sounds like a place
  where you can thrive, we can’t wait to meet you.

  WHAT YOU'LL DO

  We're looking for a Senior Lead Systems Engineer who's
  passionate about building the next generation of enterprise
  technology through automation, software engineering, AI, and
  intelligent integrations. In this role, you'll architect
  scalable solutions that connect the systems powering Braze
  while helping redefine how employees interact with IT
  through conversational experiences, automation, and self-
  service.

  You'll lead complex technical initiatives from concept
  through delivery, building integrations that span platforms
  such as Slack, Okta, Workday, Atlassian, GitHub, Google
  Workspace, and other critical business systems. You'll
  partner closely with Security, Infrastructure, Product, and
  IT teams to build reliable, scalable solutions that reduce
  operational overhead and improve the employee experience.

  This role goes beyond traditional system engineering. We're
  looking for someone who enjoys solving business problems
  through software, APIs, automation, and AI. You'll help
  shape our long-term strategy around enterprise integrations,
  intelligent workflows, and agentic experiences that enable
  employees to get work done faster and more intuitively.

  You'll be part of a team that values reliability,
  resiliency, scalability, extensibility, and thoughtful
  engineering. We operate with a shared sense of ownership,
  continuously look for opportunities to automate manual work,
  and embrace emerging technologies that allow us to scale
  efficiently while delivering exceptional internal
  experiences.

  If you enjoy designing enterprise architecture, building
  integrations, and leveraging AI to modernize how
  organizations operate, we'd love to meet you.

  You'll lead initiatives that shape the future of enterprise
  technology at Braze, including:

  - Enterprise Automation & AI:
    - Design and build intelligent automation that streamlines
      business processes across enterprise platforms. Leverage
      AI, agentic workflows, and modern integration patterns
      to reduce manual effort, improve operational efficiency,
      and enhance employee productivity
  - Enterprise Integrations:
    - Design and develop scalable integrations across platforms
      including Slack, Okta, Workday, Atlassian, GitHub,
      Google Workspace, and other SaaS applications. Build
      APIs, middleware, and event-driven workflows that create
      seamless employee experiences
  - Conversational IT & Self-Service:
    - Help evolve how employees interact with IT by building
      conversational interfaces and self-service experiences
      that reduce reliance on traditional ticket-based
      workflows while improving service delivery and employee
      satisfaction
  - Enterprise Platform Architecture:
    - Design scalable, resilient solutions that improve how
      enterprise platforms communicate and operate together.
      Evaluate architecture decisions with long-term
      maintainability, extensibility, and operational
      excellence in mind
  - AI Platform Enablement:
    - Evaluate, pilot, and implement emerging AI technologies,
      large language models, MCP integrations, and agent
      frameworks that enable intelligent automation across
      enterprise systems while establishing best practices for
      responsible adoption
  - Automation & Developer Experience:
    - Build reusable automation frameworks, integration services,
      and internal tooling that accelerate delivery, reduce
      operational toil, and improve the maintainability of
      enterprise platforms
  - Governance & Operational Excellence:
    - Partner with Security, Compliance, and Infrastructure teams
      to ensure enterprise solutions meet governance
      requirements while maintaining simplicity, scalability,
      and operational maturity. Document architecture,
      implementation decisions, and operational processes
      following governance and compliance standards
  - Innovation & Emerging Technology:
    - Continuously research emerging technologies, integration
      capabilities, and AI advancements that can improve
      scalability, reduce operational complexity, and create
      new opportunities for automation
  - Strategy & Technical Leadership:
    - Contribute to enterprise platform strategy and long-term
      technical roadmaps. Provide technical leadership on
      complex initiatives while mentoring engineers on
      automation, integration, and software engineering best
      practices

  WHO YOU ARE

  - 8+ years of experience designing enterprise-scale
    integrations and automation across modern SaaS
    environments
  - Strong software engineering background with experience
    building APIs, integrations, automation, or platform
    services
  - Proficient in one or more programming languages such as
    Python, Go, TypeScript, or JavaScript
  - Experienced working with REST APIs, webhooks, OAuth, SCIM,
    GraphQL, and modern authentication standards
  - Familiar with enterprise platforms such as Okta, Workday,
    Slack, Atlassian, GitHub, Google Workspace, or similar
    SaaS ecosystems
  - Skilled in designing scalable architectures that balance
    business requirements, security, and operational
    simplicity
  - Experienced collaborating across engineering, security,
    infrastructure, and business teams to deliver impactful
    technical solutions
  - Passionate about leveraging AI, automation, and software
    engineering to solve operational challenges
  - Curious, collaborative, and motivated by continuous
    improvement and thoughtful systems design

  Bonus:

  - Experience implementing AI agents, MCP integrations, LLM-
    powered workflows, or enterprise AI platforms
  - Experience with Terraform, Infrastructure as Code, or cloud
    automation tooling
  - Experience with event-driven architectures, message queues,
    or serverless technologies
  - Experience integrating Workday, Okta, Atlassian Cloud, Slack
    Platform, GitHub Enterprise, or Google Workspace APIs
  - Familiarity with cloud platforms such as AWS, GCP, or Azure
  - Experience building internal developer platforms or
    enterprise integration frameworks
  - Experience supporting high-growth SaaS organizations with
    complex enterprise technology environments

  For candidates based in the United States, the pay range for
  this position at the start of employment is expected to be
  between $116,000 and $182,000/year with an expected On
  Target Earnings (OTE) between $129,000 and $202,000/year
  (including bonus or commission). Your exact offer may vary
  depending on multiple individualized factors, including
  market location, job-related knowledge, skills, and
  experience. In addition to cash compensation, this role
  qualifies for a comprehensive Total Rewards package that
  includes equity grants of restricted stock (RSUs) so that
  you will own a piece of our company.

  WHAT WE OFFER

  Braze benefits vary by location, and we encourage you to
  review our specific benefits offerings for each country
  here. More details on benefits plans will be provided if you
  receive an offer of employment.

  From offering comprehensive benefits to fostering hybrid
  ways of working, we’ve got you covered so you can prioritize
  work-life harmony. Braze offers benefits such as:

  - Competitive compensation that may include equity
  - Retirement and Employee Stock Purchase Plans
  - Flexible paid time off
  - Comprehensive benefit plans covering medical, dental,
    vision, life, and disability
  - Family services that include fertility benefits and equal
    paid parental leave
  - Professional development supported by formal career pathing,
    learning platforms, and a yearly learning stipend
  - A curated in-office employee experience, designed to foster
    community, team connections, and innovation
  - Opportunities to give back to your community, including an
    annual company-wide Volunteer Week and donation matching
  - Employee Resource Groups that provide supportive communities
    within Braze
  - Collaborative, transparent, and fun culture recognized as a
    Great Place to Work®

  ABOUT BRAZE Braze is the leading customer engagement
  platform that empowers brands to Be Absolutely Engaging™.
  Braze helps brands deliver great customer experiences that
  drive value both for consumers and for their businesses.
  Built on a foundation of composable intelligence, BrazeAI™
  allows marketers to combine and activate AI agents, models,
  and features at every touchpoint throughout the Braze
  Customer Engagement Platform for smarter, faster, and more
  meaningful customer engagement. From cross-channel messaging
  and journey orchestration to Al-powered decisioning and
  optimization, Braze enables companies to turn action into
  interaction through autonomous, 1:1 personalized
  experiences.

  The company has been consistently recognized as a Leader in
  marketing technology by industry analysts, and was named a
  G2 “Best of Marketing and Digital Advertising Software
  Product” in 2026. Braze was also named a 2026 Best Places to
  Work by Built In, a 2025 America’s Greenest Companies by
  Newsweek, and a 2025 Fortune Best Workplace in Technology™
  by Great Place To Work®. Braze is also proudly certified as
  a Great Place to Work® in the U.S., the UK, Australia, and
  Singapore.

  The company is headquartered in New York with offices in
  Austin, Berlin, Bucharest, Chicago, Dubai, Jakarta, London,
  Paris, San Francisco, São Paulo, Singapore, Seoul, Sydney
  and Tokyo.

  BRAZE IS AN EQUAL OPPORTUNITY EMPLOYER

  At Braze, we strive to create equitable growth and
  opportunities inside and outside the organization.

  Building meaningful connections is at the heart of
  everything we do, and that includes our recruiting
  practices. We're committed to offering all candidates a
  fair, accessible, and inclusive experience – regardless of
  age, color, disability, gender identity, marital status,
  maternity, national origin, pregnancy, race, religion, sex,
  sexual orientation, or status as a protected veteran. When
  applying and interviewing with Braze, we want you to feel
  comfortable showcasing what makes you you.

  We know that sometimes different circumstances can lead
  talented people to hesitate to apply for a role unless they
  meet 100% of the criteria. If this sounds familiar, we
  encourage you to apply, as we’d love to meet you. OUR AI-
  POWERED BRAZE RECRUITMENT PROCESS

  At Braze, we’re committed to a fair and transparent
  candidate experience. To help our recruitment teams focus on
  what matters most — the person behind each application — we
  use AI-assisted tools at certain stages of our recruitment
  process.

  This includes using AI to analyze the experience, skills and
  qualifications in your application materials to help with
  screening and prioritizing candidates. Such screening may
  amount to a form of solely automated decision-making. We
  also use AI for administrative support, like scheduling and
  recording interviews and summarizing interview notes. Our
  recruiting teams remain responsible for all hiring decisions
  and are involved throughout the process.

  Depending on where you are located, you may have the right
  to request further information about how AI is used in our
  recruitment process, to opt out of AI-assisted review, to
  request a manual review of any decision made or to contest a
  decision.

  Please contact us at talentdata.privacy@braze.com for any
  requests or questions. To find out more about our hiring
  process, check out this page.

  Notice Regarding Automated Employment Decision Tool (NYC
  Local Law 144)

  Our use of AI during the application review process may
  include the use of automated employment decision tools.
  Pursuant to New York City Local Law 144, for roles based in
  New York City, or if you reside in New York City, you have
  the right to request an alternative selection process or a
  reasonable accommodation instead of AI-assisted review.
  Please submit any such request to our Talent Acquisition
  team at talentdata.privacy@braze.com promptly after
  applying. A summary of the most recent bias audit results
  for such tool is available here. Please see our Candidate
  Privacy Policy for more information on how Braze processes
  your personal information during the recruitment process
  and, if applicable based on your location, how you can
  exercise any privacy rights.
