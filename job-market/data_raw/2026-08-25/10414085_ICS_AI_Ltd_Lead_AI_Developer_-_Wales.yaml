description: |
  Job Title: Lead AI Developer

  Location: West Wales (preferred)

  Salary: £70,000 - £80,000 per annum Contract Type: Full-
  time, Permanent

  About Us ICS.AI is the fastest growing private Artificial
  Intelligence (AI) company in the UK, transforming how public
  sector (specifically local government and education sectors)
  organisations operate and deliver value to students and
  staff As a Microsoft co-sell partner, we specialise in
  Conversational and Generative AI transformation solutions
  that enable institutions to safely and securely harness
  cutting-edge AI technologies. With a proven track record
  across multiple trusted public sectors, we develop
  innovative and leading edge solutions that address the most
  important challenges that face the higher and further
  education sectors. Our solution drive efficiency, enhance
  service delivery, and create exceptional value for our
  customers.

  About the Role We’re seeking an experienced Lead AI
  Developer to provide technical leadership and client-facing
  requirements capture across both product and implementation
  projects.

  This role combines hands-on development with business
  process analysis, solution viability assessment, and
  mentoring responsibilities. You’ll act as the bridge between
  client requirements and technical delivery, engaging
  directly with stakeholders to capture and document business
  processes, translating them into viable technical designs,
  and ensuring successful implementation.

  You will play a critical role in ensuring our solutions are
  secure, scalable, and impactful, working closely with
  architects, project managers, and the wider engineering team
  to deliver high-quality AI-first products and services.

  Key Responsibilities

  - Engage directly with client stakeholders to capture and
    document business process requirements
  - Translate workflows into technical designs, backlog items,
    and deliverables
  - Assess the feasibility and viability of solutions against
    business needs, budgets, and technical constraints
  - Provide technical leadership across programmes and projects,
    coordinating outputs across delivery teams
  - Actively contribute to hands-on software development in
    .NET, C#, Azure, REACT, and related technologies
  - Implement AI features using LLMs, RAG, Agentic AI, and
    related frameworks
  - Mentor and support developers, ensuring coding standards and
    best practices are applied consistently
  - Lead backlog refinement, sprint planning, and technical
    prioritisation activities
  - Oversee code reviews, unit testing, and QA to maintain
    delivery quality
  - Support cloud-first delivery across Azure, Power Platform,
    and M365

  Required Skills and Experience

  - 6+ years of professional software development experience
    with C# and .NET
  - Demonstrated experience in both product development and
    client-facing delivery
  - Proven track record of capturing business requirements and
    translating into viable solutions
  - Strong background delivering Azure-based and Generative AI-
    enabled solutions
  - Experience mentoring or supporting developers within
    delivery teams
  - Excellent communication skills, able to translate technical
    concepts for non-technical audiences
  - Degree in Computer Science, Software Engineering, or a
    related technical field
  - Professional certifications in Azure, .NET, or Project
    Management

  What We Offer

  - Flexible and remote working options.
  - Enhanced pension scheme (5% employer contribution).
  - 25 days of holiday plus bank holidays.
  - £1,200 annual work-from-home allowance.
  - Private healthcare package (Vitality).

  Eligibility Requirements Applicants must have the legal
  right to work in the UK. Unfortunately, we cannot offer visa
  sponsorship for this role.

  A full Role Profile is available upon request
