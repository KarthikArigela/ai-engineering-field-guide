description: |
  Purpose of the role: The Senior AI Engineer leads the
  design, build, and operationalisation of AI and intelligent
  automation solutions on Microsoft’s end-to-end stack. The
  role spans the full delivery spectrum — from rapid low-code
  solutions in Copilot Studio and Power Platform through to
  pro-code agents and models built on Azure AI Foundry —
  choosing the right approach for each problem and bringing
  solutions safely into production. As a senior member of the
  AI Digital Lab, the role also sets technical direction,
  raises engineering standards, and mentors others.
  *CANDIDATES MUST BE ELIGIBLE FOR SC CLEARANCE*

  Job title:

  Senior AI Engineer

  Job Description:

  What you'll be doing:

  - Solution architecture & build — Lead the design and delivery
    of AI and intelligent automation solutions, deliberately
    balancing low-code (fast, citizen-extensible) and pro-code
    (flexible, scalable, deeply integrated) approaches based
    on requirements, risk, and total cost of ownership.
  - Copilot & agents — Build and extend conversational and
    agentic experiences using Microsoft 365 Copilot, Copilot
    Studio, custom engine agents, declarative agents, plugins,
    and connectors.
  - Power Platform — Deliver intelligent automation and apps
    using Power Automate, Power Apps, Power Pages, and AI
    Builder; apply Application Lifecycle Management
    (solutions, environments, pipelines) and governance.
  - Pro-code AI on Azure — Develop, fine-tune, ground, and
    deploy models and agents on Azure AI Foundry (model
    catalogue, prompt flow, evaluations, agent service),
    integrating Azure OpenAI, Azure AI Search (RAG), and
    related Azure services via SDKs and APIs.
  - Enterprise agentic delivery — Own the end-to-end lifecycle
    of enterprise-grade agentic solutions, from design and
    build through deployment, change management, and driving
    user adoption at scale.
  - Integration & data — Design robust integrations across
    Dataverse, Microsoft Graph, APIs, and enterprise data
    sources; build the grounding and retrieval pipelines that
    make AI solutions accurate and trustworthy.
  - MLOps / LLMOps — Establish CI/CD, evaluation, monitoring,
    and lifecycle management for AI workloads so solutions are
    reliable, observable, and continuously improved in
    production.
  - Responsible AI & governance — Embed security, data-privacy,
    fairness, and compliance standards across all solutions,
    in line with Capita and regulatory expectations; apply
    Power Platform and Azure governance/guardrails.
  - Technical leadership — Set patterns and reusable assets for
    the Lab, conduct design and code reviews, mentor
    engineers, and advise stakeholders on technical
    feasibility and the low-code vs pro-code trade-off.
  - Skills and capability development — Build capability across
    the AI Digital Lab by sharing engineering practices,
    reusable patterns, and practical guidance that help
    colleagues strengthen their AI, automation, cloud, and
    software delivery skills.
  - Well-Architected delivery — Apply Microsoft Well-Architected
    Framework principles across AI and automation solutions,
    ensuring designs consider reliability, security,
    operational excellence, performance efficiency, and cost
    optimisation from discovery through production.I
  - Innovation — Track the fast-moving Microsoft AI roadmap
    (Copilot, Power Platform, Azure AI Foundry) and translate
    new capabilities into practical, valuable solutions.

  What we're looking for:

  Essential skills & experience

  - Significant hands-on experience delivering AI / intelligent
    automation solutions to production across both low-code
    and pro-code Microsoft technologies.
  - Copilot ecosystem — Copilot Studio, Github Copilot  and
    Microsoft 365 Copilot extensibility (agents, plugins,
    connectors).
  - Power Platform — Power Automate, Power Apps, AI Builder,
    Dataverse, and Power Platform ALM/governance.
  - Azure AI Foundry and the wider Azure AI stack — Azure
    OpenAI, Azure AI Search / retrieval-augmented generation,
    prompt engineering, and model evaluation.
  - Proficient in applying vibe coding tools — using AI-assisted
    / natural-language development tools to accelerate
    prototyping and delivery.
  - End-to-end deployment and adoption of enterprise-level
    agentic solutions — proven experience taking agentic AI
    from concept through production deployment to sustained
    business adoption.
  - Strong pro-code engineering skills, typically in Python
    and/or C#/.NET, with sound software engineering practices
    (version control, testing, CI/CD).
  - MLOps / LLMOps — deployment, monitoring, evaluation, and
    lifecycle management of AI solutions.
  - Experience designing integrations using APIs, Microsoft
    Graph, and enterprise data sources.
  - Working knowledge of Responsible AI, security, and data-
    governance principles.
  - Strong communication and stakeholder-management skills; able
    to translate between technical and business audiences.

  Desirable

  - Relevant Microsoft certifications (e.g., AI-102 Azure AI
    Engineer Associate, PL-400 Power Platform Developer,
    PL-600 Power Platform Solution Architect, or Azure AI
    Foundry / Copilot credentials).
  - Experience with the AWS AI stack (e.g., Amazon Bedrock,
    SageMaker, Kiro, and related AI services
  - Experience with agent orchestration frameworks (e.g.,
    Semantic Kernel, AutoGen) and multi-agent patterns.
  - Experience operating within regulated or enterprise-scale
    environments.
  - Track record of mentoring engineers or leading small
    delivery teams.
  - Degree or equivalent practical experience in computer
    science, software engineering, data science, or a related
    field.

  What success looks like

  - AI and automation solutions are delivered to production
    reliably, securely, and at the right level of code
    abstraction for each use case.
  - Enterprise agentic solutions reach not just deployment but
    genuine, sustained adoption across the business.
  - The team has clear, reusable patterns for when to use low-
    code vs pro-code, reducing rework and accelerating
    delivery.
  - Solutions are well-evaluated, monitored, and trusted by the
    business.
  - Engineering standards and team capability visibly improve
    through the Senior AI Engineer’s leadership and mentoring.

  How this aligns to Capita's values:

  Customer First, Always — You design and deliver reliable,
  secure, and adoption‑ready AI solutions that create
  meaningful, measurable impact for Capita’s customers.

  Fearless In Achieve Together — You collaborate across teams,
  mentor engineers, and establish shared patterns that help
  the whole organisation deliver AI solutions more
  effectively.

  Achieve Together — You collaborate across teams, mentor
  engineers, and establish shared patterns that help the whole
  organisation deliver AI solutions more effectively.

  Everyone is Valued — You empower both pro‑code engineers and
  citizen developers through inclusive tooling, responsible AI
  practices, and accessible guidance that enables everyone to
  contribute.

