    moment they are made available by Apple.
  - Several Jamf engineers are named in patents and with team
    names like CatDog, ThunderSnow and Dalek you can expect to
    have some fun while building cutting-edge software.
  - You will have the opportunity to work with a small and
    empowered team where the culture is based on trust,
    ownership, and respect.
  - We offer a clear career path that enables you to grow under
