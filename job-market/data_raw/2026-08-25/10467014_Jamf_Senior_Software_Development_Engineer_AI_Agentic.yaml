description: |
  At Jamf, we believe in an open, flexible culture based on
  respect and trust. Our track record and thriving work
  environment all stem from the freedom we grant ourselves to
  get the job done right. We take pride in helping tens of
  thousands of customers around the globe succeed with Apple.

  The secret to our success lies in our connectivity, while
  operating with a high degree of flexibility. Work-life
  balance remains our priority while feeling connected is
  important to maintain our strong culture, achieve our goals,
  and thrive as #OneJamf.

  What you'll do at Jamf:

  The Senior Software Engineer is responsible for building the
  tools required to help organizations succeed with Apple.
  Lead others on the agile team to break down problems and
  apply the appropriate designs and practices to build Jamf
  products.

  Subject matter expert in various Jamf components and product
  offerings. Mentor and coach others while delivering new
  components and features with high quality and reliability.

  You may be required to work periodically at a Jamf office or
  collaborative work location with other Jamf employees in
  your area for certain events or moments that matter.

  What you can expect to do in this role:

  - Break down customer problems into work you and the team can
    execute on.
  - Independently complete tasks from start to finish with high
    quality.
  - Ability to communicate technical concepts to stakeholders.
  - Use your knowledge of Engineering best practices to ask the
    right questions, solve problems and build great software
    with a high level of quality.
  - Produce designs for new and existing features.
  - Clearly communicate technical concepts with others in the
    organization (Technical Communication, Support, Product
    and Cloud).
  - Performs all job responsibilities in alignment with the core
    values, mission and purpose of the organization.
  - Adheres to the highest moral, ethical and legal standards to
    deliver and environment that promotes respect, innovation
    and creativity.
  - Supports and promotes a positive, inclusive workplace one in
    which the talents and strengths of our increasingly
    diverse workforce are welcomed, further developed and
    manifested in our work.
  - Build and operate agentic workflows that act on production
    systems - a model planning and executing multi-step work
    against real infrastructure, not assisting in an editor
  - Design their guardrails: blast-radius limits, rollback, CI
    as a mandatory gate, and confidence thresholds deciding
    what runs automatically versus what queues for approval
  - #LIRemote

  What we are looking for:

  - Minimum of 5 years of experience developing enterprise grade
    software with understanding of testing and quality
    assurance processes (Required).
  - Minimum of 5 years of demonstrated experience in current
    programming language and tools based on position
    requirements (Required).
  - Hands-on experience building with LLM APIs and agentic
    frameworks: tool calling, multi-step execution, structured
    output (Beyond AI coding assistants) (Required)
  - Thinks in terms of trust boundaries, blast radius, and least
    privilege — including about the automation itself, which
    holds elevated access to production (Required)
  - Understands vulnerability management as a discipline:
    severity and exploitability, SLAs, exception handling, and
    why an unpatched system with a documented exception
    differs from one nobody noticed (Required)
  - AI coding agents at repository scale (Claude Code or
    equivalent) - running them across many repos and building
    the harness that makes their output trustworthy
    (Preferred)
  - Evaluation and observability for non-deterministic systems:
    measuring accuracy, catching silent degradation
    (Preferred)
  - AI governance in a security context - model-use policy, data
    handling, and the audit questions that follow an agent-
    initiated production change (Preferred)
  - General Experience performance and load testing applications
    (Preferred)
  - Experience building enterprise level software
  - Experience working within an agile organization
  - Understanding of build systems such as Jenkins or Bamboo
  - Strong communication skills
  - Proven analytical and problem-solving skills
  - Ability to interact effectively with co-workers in a results
    driven culture
  - Ability to engage with and establish trust and rapport with
    all levels of customers and employees
  - Solution focused ability working collaboratively in a fast-
    paced environment
  - Apple platform experience
  - 2 year / Associates (Required)
  - 4 year Bachelors Degree (Preferred)
  - A combination of relevant experience and education may be
    considered

  SECURITY AND PRIVACY REQUIREMENTS

  - Participation in ongoing security training is mandatory
  - Established security protocols will be adhered to, sensitive
    data will be handled responsibly, and data protection
    practices are followed, including understanding relevant
    privacy regulations and reporting breaches
  - Acknowledging the Jamf Code of Conduct, where applicable
    security and privacy policies can be found, is a
    requirement of all roles at Jamf

  How we help you reach your best potential:

  - Named a 2025 Best Companies to Work For by U.S. News
  - Named a 2024 Best Technology Company to Work For by U.S.
