description: |
  About Us:

  We love going to work and think you should too. Our team is
  dedicated to trust, customer obsession, agility, and
  striving to be better everyday. These values serve as the
  foundation of our culture, guiding our actions and driving
  us towards excellence. We foster a culture of performance
  and recognition, allowing us to transform growth as we
  enable our employees to do the best work of their careers.

  This position is located in Pune. You'll be working in a
  major tech center of Pune, India. Across the globe, our
  Centers of Energy serve as hubs where we accelerate
  productivity and collaboration, inspire creativity, and
  cultivate a culture of connection and celebration. Our teams
  coordinate their time in Centers of Energy to reflect how
  they work best.

  To learn more about life at LogicMonitor, check out our
  Careers Page.

  What You'll Do:

  LogicMonitor® is the AI-first hybrid observability platform
  powering the next generation of digital infrastructure.
  LogicMonitor delivers complete visibility and actionable
  intelligence across on-premises, cloud, and edge
  environments. By anticipating issues before they strike,
  optimizing resources in real time, and enabling faster,
  smarter decisions, LogicMonitor helps IT and business
  leaders protect margins, accelerate innovation, and deliver
  exceptional digital experiences without compromise.

  Our customers love LogicMonitor's ability to bring cloud and
  traditional IT together into one view, as seen in minimal
  churn rates, expansion business, and exciting new customer
  references. In fact, LogicMonitor has received the highest
  Net Promoter Score of any IT Infrastructure Management
  provider. LogicMonitor also boasts high employee
  satisfaction. We have been certified as a Great Place To
  Work®, and named one of BuiltIn's Best Places to Work for
  the seventh year in a row!

  We are seeking an innovative Sr. GTM AI Engineer to design
  and scale AI-powered revenue workflows that improve seller
  productivity, increase Gross Bookings, enhance customer
  engagement, and reduce churn.

  You will partner with Revenue Operations, Sales, Marketing,
  Customer Success, Data, and IT to embed AI into every stage
  of the Lead-to-Revenue lifecycle—transforming manual
  processes into intelligent, automated workflows that drive
  growth and operational excellence.

  Here's a closer look at this key role:

  AI-First Revenue Operations

  - Design AI-powered Lead-to-Renewal workflows.
  - Automate manual GTM processes.
  - Build intelligent AI copilots and agents.
  - Scale repeatable revenue operations.

  Accelerate Revenue Growth

  - Improve lead scoring and routing.
  - Prioritize accounts and opportunities.
  - Automate sales plays and account planning.
  - Increase pipeline conversion and velocity.

  Enhance Customer Success

  - Predict churn and contraction risk.
  - Identify expansion opportunities.
  - Automate customer health insights.
  - Trigger proactive renewal workflows.

  Engineer GTM Workflows

  - Build AI automation across Marketing, Sales, Customer
    Success, and RevOps.
  - Orchestrate lead, opportunity, and renewal processes.
  - Automate forecasting and pipeline management.
  - Deliver next-best-action recommendations.

  AI & Technology Integration

  - Integrate Salesforce and the GTM technology stack.
  - Develop API and workflow automations.
  - Operationalize AI models and LLM capabilities.
  - Enable secure, scalable AI solutions.

  Data & Analytics

  - Improve CRM quality and data governance.
  - Automate enrichment and deduplication.
  - Build AI-ready datasets.
  - Measure workflow performance and business impact.

  What You'll Need:Experience

  - 5+ years in GTM Engineering, Revenue Operations, Sales
    Operations, or Marketing Operations.
  - Experience supporting enterprise B2B SaaS organizations.
  - Proven success designing scalable revenue workflows.
  - Experience implementing AI-enabled automation.

  Technical Skills

  - Salesforce administration and automation.
  - APIs, SQL, Python or JavaScript.
  - Workflow orchestration and no-code platforms.
  - Experience with Marketo, ZoomInfo, 6sense, Cognism,
    Qualified, Aviso, Gong, or Salesloft.

  AI Expertise

  - Large Language Models (LLMs).
  - Prompt Engineering and AI Agents.
  - AI workflow orchestration.
  - Predictive analytics and automation.

  Business Acumen

  - Lead-to-Revenue processes.
  - Forecasting and pipeline management.
  - Customer lifecycle and renewals.
  - SaaS metrics including ARR, ACV, NRR, Churn, and Gross
    Bookings.

  Success Measures

  - Increase Gross Bookings and pipeline conversion.
  - Improve seller productivity through automation.
  - Increase forecast accuracy and pipeline visibility.
  - Reduce manual GTM effort.
  - Improve customer retention and expansion.
  - Accelerate AI adoption across the GTM organization.

