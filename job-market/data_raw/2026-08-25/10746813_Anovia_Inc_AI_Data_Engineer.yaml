description: |
  Anovia is an industry-leading technology outsourcing support
  provider with expertise in the telecommunications industry.
  Operating for over 20 years, we specialize in workflow and
  knowledge processes, as well as technical support, helpdesk
  and multilingual support services. With over 200
  professional experts across the globe, we service some of
  the worlds’ most successful Fortune 500 and Fortune 1000
  companies.

  About the role:

  We are looking for a hybrid AI and Data Engineer to build
  the next generation of 'Agentic' systems. You will bridge
  the gap between raw structured/unstructured data and
  actionable AI, moving beyond simple chatbots to create
  autonomous agents that can reason, search, and execute
  complex workflows.

  Technical Qualifications:

  1. GenAI & Agentic Development

  - LLM Orchestration: 2+ years building and deploying AI-driven
    applications. You should be an expert in RAG pipelines and
    AI Agents using frameworks like LangChain, LlamaIndex,
    etc.
  - Model Proficiency: Solid understanding of Transformer
    architectures (Gemini, GPT, Claude).
  - Experience with fine-tuning, advanced prompt engineering,
    and optimizing context windows.
  - Vector Expertise: Proven ability to build semantic search
    layers using PG Vector, embedding models, and Google
    Indexing.

  2. Data Engineering & Scale

  - Big Data Stack: Experience processing large-scale datasets
    using Python (Pandas/PySpark) or Scala.
  - Warehousing & SQL: Professional experience with Snowflake or
    Redshift, including the ability to write high-performance
    Advanced SQL.
  - Data Modeling: Ability to design dimensional data models
    optimized for low-latency AI consumption and high data
    quality.

  3. Software Craftsmanship

  - Production Standards: Focus on writing clean, maintainable
    code with robust CI/CD practices and ML Observability.

  Preferred Qualifications:

  - 5+ years of experience in relevant technology
  - Education: B.Tech/M.Tech in Computer Science or a related
    field.
  - Advanced Agents: Experience experimenting with multi-agent
    systems for complex reasoning tasks.
  - Cloud Infrastructure: Hands-on experience with AWS (Bedrock,
    Lambda) for deploying and scaling AI workloads.
  - Gemini Ecosystem: Direct experience leveraging Google Gemini
    for multimodal or long-context applications

  Benefits at Anovia

  - Comprehensive Health Insurance policy
  - Employee Wellness Program with focus on mental health
  - Robust reward and recognition programs
  - Company incentive programs offered
  - Attractive leave policy: Holiday Leave, Maternity Leave,
    Paternity Leave, Birthday leave, Bereavement Leave and
    Paid Leave for personal time off
  - Ample growth and learning opportunities
  - Remote work opportunities
  - Focus on work/life balance
  - Immigration Program supporting immigration to Canada for
    eligible employees

  We thank all candidates for their interest, however, only
  those selected for an interview will be contacted.

  Anovia is an equal opportunity employer and may use
  Artificial Intelligence tools to assist in reviewing and
  processing candidate applications.
