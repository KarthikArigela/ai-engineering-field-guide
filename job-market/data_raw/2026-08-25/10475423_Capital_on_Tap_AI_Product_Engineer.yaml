description: |
  We’re Capital on Tap 👋 💳 Capital on Tap started because
  small businesses were underserved. Big banks were slow,
  their products weren't fit for purpose, and small business
  owners often couldn't access what they needed. We set out to
  fix that.

  Today we're a financial platform - not just a credit card
  company. We offer a best-in-class business credit card, SME-
  focused spend management platform, a savings product that
  hit £1 billion in funds within its first year, and a growing
  suite of tools and financial products that make running a
  small business easier.

  1,000+ employees, £20bn in annual card spend, 200,000+
  customers, 17,000+ Trustpilot reviews averaging 4.7 stars,
  and we're profitable. We’ve done a pretty good job so far,
  but we’re just getting started!

  🏡🏢This is a Hybrid role, the AI team work from our Moorgate
  (London) Offices 2 days per week.

  AI Product Engineering at Capital on Tap

  We are a small but highly empowered team with the overall
  goal of enabling the Engineering and Product teams to
  effectively use AI to deliver high-quality products and
  services faster to better serve our customers. Our
  responsibilities include improving speed of engineering
  delivery, making AI tooling and skills easily and widely
  available to the entire business, creating agents to perform
  tasks across a wide range of functions, and general
  oversight of engineering AI initiatives.

  What you will be doing

  This is a software engineering role first and foremost, with
  a focus on agentic systems, agentic orchestration and
  supporting technical teams in using AI

  This is the type of work you will be doing:

  - Developing agentic systems and orchestration layers to help
    us ship faster.
  - Building “AI on Tap”, Capital on Tap’s internal AI
    enablement hub. It is the single place to see every AI
    agent the company runs, the cost of each one, how ready
    each codebase is for AI-assisted development, and how to
    get more value from Claude and other providers.
  - Working with QA and Platform to integrate agentic testing
    and verification tools across our pipeline to deploy
    faster
  - Owning build-vs-buy recommendations, from evaluation through
    to team buy-in
  - Whatever it takes to reach an agentic future — tech debt,
    CI/CD, the unglamorous work that unblocks everything else

  We’re Looking For 🔎 Required skills:

  - Hands-on experience in C#, .NET
  - Good testing practices, in both Unit and Integration testing
  - Experience building agentic systems
  - Experience in driving initiatives across engineering teams
  - A focus on delivering concrete, measurable results
  - A proactive, supportive, and collaborative team player

  Diversity & Inclusion 🌈 We welcome, consider and encourage
  applications from anyone who shares our commitment to
  inclusivity. Join us in creating a space where authenticity
  thrives, and everyone can do their best work.

