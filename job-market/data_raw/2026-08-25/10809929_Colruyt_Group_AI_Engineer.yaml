  - Continuous learning opportunities – Besides a wide range of
    internal training programs, you also have the opportunity
    to follow additional development paths focused on AI,
    cloud and innovation. This allows you to build your
    technical skills continuously, business knowledge and
    social competencies.

  At Colruyt Group, you can work differently. You, as a
  person, are at the center—and you’ll notice that right away.
  You can sharpen your skills thanks to our
  development‑oriented approach and grow internally if you
  wish. Whether you’re an analyst, store employee, marketeer
  or technician, you’ll surely find a job that suits you.

  Colruyt Group believes in the power of diversity, equality
  and inclusion. Everyone is welcome to apply, and we offer
  equal opportunities to all.
