description: |
  - Work in a multidisciplinary
  Data & Analytics team to deliver AI‑driven solutions for
  multiple business brands and domains.
  - Design, build, and deploy end‑to‑end
  AI solutions, with a strong focus on Generative AI, Agentic
  AI, and scalable AI pipelines.
  - Develop AI applications using modern
  frameworks and technologies such as Azure AI Foundry, Azure
  OpenAI, LangChain, vector databases, and fine‑tuned LLMs.
  - Translating business needs into
  concrete AI solutions in close collaboration with internal
  business partners and IT teams.
  - Act as a bridge between
  technical AI capabilities and practical business
  requirements, ensuring measurable business value.
  - Identify and propose new AI
  opportunities, including intelligent assistants, automated
  workflows, RAG solutions, and AI agents.
  - Contribute to a wide range of AI
  use cases, including search, recommendation systems,
  document and language processing, and autonomous agents at
  scale.
  - Stay up to date with emerging
  AI trends and technologies and actively share knowledge to
  strengthen the organization’s AI maturity

  Requirements

  - AI Engineer with a master’s degree in computer science,
  Artificial Intelligence, Data Science, or a related field,
  and 3–5 years of hands‑on experience in AI development.
  - Should have 10 to 15 years of working experience in
  Data-related projects.
  - Strong expertise in machine learning, large language
  models (LLMs), and Generative AI, with practical experience
  building AI‑driven applications.
  - Proficient in Python for designing, implementing, and
  integrating AI solutions.
  - Hands‑on experience with GenAI frameworks and tools such as
    LangChain, LlamaIndex, and similar ecosystems; solid
  understanding of Agentic AI patterns.
  - Experienced in cloud‑based AI development and deployment,
  particularly on Microsoft Azure, including Azure OpenAI,
  Azure AI Foundry, and Azure ML.
  - Capable of deploying, managing, and scaling production‑grade
  AI solutions in cloud environments.
  - Strong analytical and problem‑solving skills, with
  the ability to translate complex AI concepts into clear
  business value.
  - Effective communicator who can collaborate with both
    technical
  teams and non‑technical stakeholders.
  - Bachelor’s or master’s degree in a relevant field such as
  Statistics, AI / ML / NLP is an added value.

  Benefits

  What We Offer

  - Stimulating work environment – You enter an incredibly
    fascinating and rich data and AI environment, where you
