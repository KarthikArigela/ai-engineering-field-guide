description: |
  Senior AI Automation EngineerBuild AI Agents. Automate Work.
  Change How Manufacturing Operates.About Geomiq

  At Geomiq, we're transforming how the world's products are
  manufactured.

  Our digital manufacturing platform connects engineers with a
  global network of manufacturing partners, making it faster
  and easier to source custom parts. Every day we process
  thousands of engineering enquiries, coordinate complex
  supply chains and help companies like BMW, Rolls-Royce,
  Google and Brompton Bicycle bring products to life.

  We're now entering the next phase of our journey: using AI
  and automation to fundamentally change how our business
  operates.

  The Role

  We're looking for a Senior AI Automation Engineer to become
  our first dedicated builder of internal AI systems.

  You'll work directly with teams across Sales, Operations,
  Supply Chain, Finance and Product to understand how work
  gets done, identify bottlenecks and build intelligent
  systems that eliminate repetitive work.

  One week you might build an AI agent that qualifies customer
  enquiries.

  The next you might automate supplier onboarding, create an
  internal knowledge assistant, or connect multiple business
  systems into a fully autonomous workflow.

  This is a hands-on role for someone who enjoys building,
  experimenting and shipping quickly.

  What You'll Do

  - Build production-ready automations using n8n
  - Develop AI agents using GPT, Claude, Gemini and other LLMs
  - Connect internal systems using APIs, webhooks and databases
  - Design autonomous workflows that reduce manual work
  - Build internal tools that improve productivity across every
    department
  - Work directly with business teams to understand problems and
    rapidly deliver solutions
  - Use SQL and data analysis to identify automation
    opportunities
  - Prototype quickly, measure impact and continuously improve

  We're Looking For Someone Who

  - Has built real AI agents and business automations—not just
    experiments
  - Is highly proficient with n8n
  - Understands APIs, authentication, webhooks and system
    integrations
  - Can work confidently with SQL
  - Can write Python or JavaScript when needed
  - Has experience working with OpenAI, Anthropic, Gemini or
    similar AI APIs
  - Enjoys solving operational and business problems, not just
    technical ones
  - Can work independently with minimal direction
  - Is curious, pragmatic and obsessed with improving how work
    gets done

  Bonus Points

  Experience with any of the following:

  - Vector databases and RAG
  - MCP servers
  - OCR and document processing
  - PostgreSQL
  - Docker
  - GitHub Actions
  - Manufacturing, marketplaces or B2B SaaS
  - AI evaluation and observability platforms
  - CRM, ERP or finance system integrations

  Success in this Role

  Within your first 12 months you'll have:

  - Eliminated hundreds of hours of manual work every month
  - Built AI agents used daily across the business
  - Connected our core systems into intelligent automated
    workflows
  - Helped every department make faster, better decisions using
    AI
  - Created automation capabilities that become a competitive
    advantage for Geomiq

  Why Join Geomiq?

  This isn't a role maintaining legacy systems.

  You'll have the freedom to identify opportunities,
  experiment rapidly and deploy solutions that immediately
  impact a growing international business.

  If you've wanted the opportunity to build AI systems that
  are actually used every day—and see the direct impact of
  your work—this is that opportunity.

  Benefits

  - Competitive salary
  - Share options
  - 23 days annual leave plus bank holidays
  - Birthday off
  - Hybrid working
  - Cycle to Work scheme
  - Pet-friendly London office
  - Regular team events
  - Work with the latest AI technologies in a company that
    actively encourages experimentation
