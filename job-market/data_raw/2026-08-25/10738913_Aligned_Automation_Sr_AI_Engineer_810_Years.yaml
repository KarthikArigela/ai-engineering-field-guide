  About the Job

  About Aligned Automation

  At Aligned Automation, we live by our "Better Together"
  philosophy to build a better world. As a strategic service
  provider to Fortune 500 companies, we help digitize
  enterprise operations and drive impactful business
  strategies. Our purpose goes beyond projects—we strive to
  deliver meaningful, sustainable change that shapes a more
  optimistic and equitable future.

  Our culture is deeply rooted in our 4Cs—Care, Courage,
  Curiosity, and Collaboration—ensuring that each employee is
  empowered to grow, innovate, and thrive in an inclusive
  workplace.

  Role: Sr. AI Engineer

  Years of Experience: 8 to 10 Years

  About the Role

  Design, develop, and deploy GenAI and Agentic AI solutions
  for enterprise-scale applications. Build multi-agent
  workflows using frameworks such as LangGraph, LangChain,
  CrewAI, or similar. Develop and optimize RAG-based systems
  leveraging Vector Databases and enterprise knowledge
  sources. Create scalable APIs and microservices using Python
  and FastAPI. Implement LLM orchestration, prompt
  engineering, evaluation frameworks, and observability
  solutions. Integrate AI solutions with enterprise
  applications, workflows, and data platforms. Work closely
  with business stakeholders to translate use cases into
  production-ready AI systems. Ensure adherence to enterprise
  SDLC, security, governance, and deployment standards.

  Required Skills:

  Strong programming skills in Python. Hands-on experience
  with GenAI, LLMs, and Agentic AI frameworks. Experience with
  RAG, Vector Databases, embedding, and semantic search.
  Knowledge of LangChain, LangGraph, CrewAI, AutoGen, MCP, or
  similar frameworks. Experience building REST APIs using
  FastAPI or Flask. Strong understanding of system design,
  software engineering, and cloud-native architectures.
  Familiarity with evaluation, monitoring, and observability
  of AI systems. Excellent problem-solving and communication
  skills.
