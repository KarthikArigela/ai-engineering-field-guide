description: |
  Senior Sales Engineer – Healthcare Interoperability & AI
  Solutions

  Gestalte die Zukunft digitaler Gesundheitsplattformen

  Healthcare steht an einem Wendepunkt: Interoperabilität,
  intelligente Datenplattformen und Generative AI verändern
  grundlegend, wie Gesundheitsorganisationen arbeiten,
  Entscheidungen treffen und Patienten versorgen. Bei
  InterSystems arbeitest Du mit führenden Healthcare-
  Organisationen daran, genau diese Transformation möglich zu
  machen. Als Senior Sales Engineer bist Du technischer
  Trusted Advisor für strategische Kundenprojekte rund um:

  •    Healthcare Interoperability •    Moderne
  Datenplattformen •    Cloud- und API-Architekturen •
  Analytics & AI •    Generative und Agentic AI im Healthcare-
  Umfeld

  Du verbindest technologische Exzellenz mit strategischer
  Beratung und hilfst Kunden dabei, komplexe Healthcare-
  Datenlandschaften in zukunftsfähige Plattformen zu
  transformieren. Dabei arbeitest Du eng mit erfahrenen
  internationalen Experten aus Sales Engineering, Product
  Management, Architecture und Professional Services zusammen.

  Deine Rolle

  Du begleitest anspruchsvolle Kundenprojekte über den
  gesamten technischen Sales Cycle — von der ersten
  strategischen Diskussion bis hin zu Architektur-Workshops,
  Proof-of-Concepts und Executive-Präsentationen. Dabei bist
  Du nicht nur technischer Ansprechpartner, sondern aktiver
  Mitgestalter moderner Healthcare- und AI-Strategien. Zu
  Deinen Aufgaben gehören:

  •    Beratung von Kunden zu modernen Healthcare-
  Architekturen und Datenplattformen •    Positionierung von
  Interoperabilitäts-, Analytics- und AI-Lösungen •
  Durchführung von Executive Briefings, Architektur-Workshops
  und Produktdemonstrationen •    Entwicklung von
  Lösungskonzepten und technischen Strategien •
  Unterstützung bei Proof-of-Concepts und Innovationsprojekten
  •    Beratung zu HL7, FHIR, IHE, APIs und Cloud-
  Architekturen •    Diskussion moderner AI- und GenAI-Ansätze
  im Healthcare-Umfeld •    Zusammenarbeit mit internationalen
  Experten aus Sales, Product Management und Engineering •
  Unterstützung strategischer Kunden bei der digitalen
  Transformation

  Was Du mitbringst

  Du verfügst über ein starkes technisches Fundament und
  bewegst Dich sicher zwischen Architektur, Kundenberatung und
  strategischer Kommunikation. Idealerweise bringst Du
  Erfahrung aus einer vergleichbaren Rolle bei einem:

  •    Healthcare-Softwareanbieter •    Integrationsplattform-
  Anbieter •    Cloud-/Data-Plattform-Unternehmen •
  Beratungsunternehmen •    oder aus einer technischen
  Architektur-/Engineering-Rolle im Healthcare-Umfeld mit.

  Außerdem bringst Du mit:

  •    Mehrjährige Erfahrung in Presales, Solution
  Engineering, Architektur oder Software Engineering •    Sehr
  gutes Verständnis moderner Healthcare-Interoperabilität •
  Erfahrung mit HL7, FHIR, APIs und Integrationsarchitekturen
  •    Verständnis moderner Datenplattformen, Analytics- und
  Data-Fabric-Ansätze •    Interesse oder Erfahrung im Bereich
  Generative AI, LLMs, RAG oder Agentic AI •    Fähigkeit,
  komplexe technische Themen verständlich und überzeugend zu
  vermitteln •    Souveränes Auftreten gegenüber technischen
  Teams ebenso wie gegenüber Management- und Executive-Level •
  Sehr gute Deutsch- und Englischkenntnisse

  Technologien & Themen

  InterSystems IRIS • HealthShare • FHIR • HL7 • REST APIs •
  Cloud Platforms • SQL • Python • Docker • Kubernetes •
  Analytics • Data Fabric • Generative AI • RAG • Agentic AI

  Warum InterSystems?

  InterSystems gehört weltweit zu den führenden
  Technologieunternehmen für Healthcare-Datenplattformen und
  Interoperabilität. Unsere Technologien unterstützen einige
  der anspruchsvollsten und geschäftskritischsten Healthcare-
  Systeme weltweit — von nationalen Gesundheitsplattformen bis
  hin zu innovativen AI-gestützten Healthcare-Lösungen. Was
  Dich bei uns erwartet:

  •    Strategisch relevante Projekte mit führenden
  Healthcare-Organisationen •    Arbeiten an echten AI- und
  Datenplattform-Themen — nicht nur an PowerPoint-Folien •
  Hohe technische Eigenverantwortung und Gestaltungsspielraum
  •    Zusammenarbeit mit sehr erfahrenen internationalen
  Experten •    Moderne Technologien und komplexe
  Architekturthemen •    Ein Umfeld, in dem technische
  Exzellenz geschätzt wird •    Die Möglichkeit, die digitale
  Transformation im Gesundheitswesen aktiv mitzugestalten

  About InterSystems

  InterSystems, a creative data technology provider, delivers
  a unified foundation for next-generation applications for
  healthcare, finance, manufacturing, and supply chain
  customers in more than 80 countries. Our data platforms
  solve interoperability, speed, and scalability problems for
  large organizations around the globe to unlock the power of
  data and allow people to perceive data in imaginative ways.
  Established in 1978, InterSystems is committed to excellence
  through its 24×7 support for customers and partners around
  the world. Privately held and headquartered in Boston,
  Massachusetts, InterSystems has 38 offices in 28 countries
  worldwide. For more information, please visit
  InterSystems.com.



  AI Disclaimer

  InterSystems may use AI tools for its internal operations
  including administrative tasks during recruitment (e.g.,
  organizing candidate information).  InterSystems’ approach
  to AI is guided by the InterSystems Responsible AI
  Guidelines. AI is not used to make or influence hiring
  decisions. All decisions are made by InterSystems employees.

  Candidates may use AI for CV or interview preparation,
  provided materials are truthful and reflect their own
  experience.  AI tools and third-party transcription services
  must not be used during interviews or assessments.

  Please note that the use of wearable technology, including
  any AI-related tools or other technology-connected devices
  (such as META or Google smart glasses and/or wearables,
  and/or any similar devices), is strictly prohibited during
  the interview and screening process with InterSystems.  Any
  applicant who requires a wearable device or any type of
  technology support during the interview process as a
  reasonable accommodation under the ADA or applicable state
  or country laws and regulations must contact the
  InterSystems Human Resources Department prior to attending
  or participating in any interview or screening process.
