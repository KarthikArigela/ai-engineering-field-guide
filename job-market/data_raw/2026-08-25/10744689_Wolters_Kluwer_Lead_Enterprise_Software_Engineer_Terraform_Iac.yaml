description: |
  About the role

  The Lead DevOps Engineer is a senior technical leader
  responsible for designing, building, and optimizing
  enterprise-scale software systems and cloud platforms. This
  role combines deep technical expertise with leadership in
  DevSecOps, platform engineering, and cloud architecture. The
  Lead DevOps Engineer drives innovation, ensures engineering
  excellence, and leads cross-functional initiatives to
  deliver secure, scalable, and high-performing solutions.
  This position also plays a key role in mentoring teams,
  influencing technical strategy, and integrating emerging
  technologies such as generative AI into engineering
  practices.

  As part of our dynamic DevOps community, you’ll join a
  global network of passionate tech professionals who
  collaborate, support, and inspire each other across borders.
  You’ll have the opportunity to:

  - Attend flagship events like Wolters Kluwer Technology Summit

  - Participate in industry-leading conferences such as Ignite

  - Compete in exciting challenges like the Code Games

  We believe in continuous learning, innovation, and
  celebrating success together.

  You will



  - Lead the design and engineering of scalable, secure, and
    resilient enterprise software and cloud platforms.

  - Define and implement best practices in software development,
    DevSecOps, and infrastructure automation.

  - Oversee the deployment, monitoring, and maintenance of
    platforms using SRE principles.

  - Architect and manage cloud infrastructure (AWS, Azure, GCP),
    ensuring performance, cost-efficiency, and compliance.

  - Lead the development and optimization of CI/CD pipelines and
    Infrastructure as Code (IaC) practices.

  - Guide the adoption of containerized and serverless
    architectures (e.g., Docker, AKS, Azure Functions).

  - Ensure adherence to security standards, conduct risk
    assessments, and lead compliance initiatives.

  - Translate complex business requirements into scalable
    technical solutions and roadmaps.

  - Mentor and coach engineering teams, fostering a culture of
    continuous improvement and innovation.

  - Explore and integrate generative AI technologies to enhance
    software capabilities and automation.



  You have



  Education

  - Bachelor’s degree in Computer Science, Information Systems,
    or a related technical field.



  Experience

  - Minimum of 7 years of experience in software engineering,
    DevSecOps, or platform engineering.

  - At least 3 years in a technical leadership role.

  - Minimum 2 years of experience with AI and generative AI
    technologies or equivalent exposure.

  - Proven experience in enterprise-scale application and
    infrastructure operations.



  Skills

  - Advanced proficiency in scripting languages (e.g., Bash,
    Python) for automation and infrastructure tasks.

  - Deep expertise in programming frameworks (.NET, Java) and
    modern application development.

  - Extensive experience with Terraform and other IaC tools,
    including module development and maintenance.

  - Proficiency with CI/CD tools (e.g., Azure DevOps, Jenkins,
    GitLab CI, GitHub Actions).

  - Strong architectural knowledge of cloud platforms (AWS,
    Azure, GCP), including service design and deployment.

  - Familiarity with SRE practices and tools for monitoring,
    incident management, and performance tuning.

  - Strong analytical, problem-solving, and decision-making
    skills in complex technical environments.

  - Excellent communication and collaboration skills, with the
    ability to influence stakeholders and lead teams.

  - Relevant certifications (e.g., PSD, Azure/AWS DevOps) are
