description: |
  Job Description:

  Generative AI Engineer

  Job Location: Hyderabad / Bangalore / Chennai / Kolkata /
  Noida/ Gurgaon / Pune / Indore / Mumbai

  5+ years of experience in AI/ML, Generative AI, software
  development, or data engineering. Hands-on experience
  developing and deploying AI solutions in cloud environments.

  Key Technical Skills:

  - Generative AI, Large Language Models (LLMs), RAG, AI Agents
  - Machine Learning, Deep Learning, NLP
  - Python, SQL
  - LangChain, LlamaIndex, Hugging Face
  - Azure OpenAI, Azure AI Foundry, Azure Machine Learning
  - Vector Databases (FAISS, Pinecone, ChromaDB)
  - REST APIs, Microservices
  - Docker, Kubernetes, Git, CI/CD, MLOps

  Roles & Responsibilities:

  - Design, develop, and deploy AI, ML, and GenAI solutions.
  - Build chatbots, copilots, AI agents, and RAG-based
    applications.
  - Develop and optimize prompts, models, and AI workflows.
  - Integrate AI services with enterprise applications and data
    sources.
  - Collaborate with architects, developers, and business
    stakeholders to deliver AI solutions.
  - Monitor model performance, troubleshoot issues, and
    implement improvements.
  - Ensure adherence to security, compliance, and Responsible AI
    standards.
  - Research and adopt emerging AI technologies and best
    practices.

  At DXC Technology, we believe strong connections and
  community are key to our success. Our work model prioritizes
  in-person collaboration while offering flexibility to
  support wellbeing, productivity, individual work styles, and
  life circumstances. We’re committed to fostering an
  inclusive environment where everyone can thrive.

