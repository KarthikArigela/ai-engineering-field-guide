description: |
  Product Engineer (AI)

  The TL;DR

  We're looking for a Product Engineer who'll own the rollout
  and evolution of our user-facing app experience. You'll
  build AI-powered features that users interact with directly
  — health assessments, personalized recommendations,
  intelligent nudges, and conversational flows. This is a
  high-surface-area role: you'll touch frontend, backend,
  integrations, and AI systems, all in service of making the
  product feel smarter and more useful to real users.

  Must have a bias for shipping. Engineers with strong product
  instincts; or Product folks with understanding of code —
  you'll fit right in.

  What You'll Do

  Own the end-to-end build and rollout of user-facing app
  features — from scoping and prototyping through launch,
  monitoring, and iteration. Design and implement AI-powered
  user experiences: personalized flows, intelligent
  recommendations, contextual nudges, and conversational
  interfaces. Build and optimize the AI layer behind user-
  facing features — prompt chains, micro-agents, retrieval
  systems — ensuring they're fast, reliable, and feel seamless
  to the end user. Work across the stack as needed — frontend
  tweaks, API integrations, backend logic, third-party
  services — to unblock feature delivery. Instrument features
  for analytics, track user behavior, and use data to drive
  product iteration and improvement. Collaborate with product,
  design, and operations to translate user needs and business
  goals into shippable feature specs. Manage rollout
  logistics: phased launches, A/B tests, feature flags, user
  feedback loops, and edge case handling. Create reusable
  components and patterns that accelerate future feature
  development across the app. Document implementations,
  architectural decisions, and learnings to build
  institutional knowledge.

  Requirements

  1+ years of hands-on experience building user-facing
  products — you've shipped features that real people use, not
  just internal tools or prototypes. Programming proficiency
  in Python and/or JavaScript/Node.js, with comfort working
  across frontend and backend as needed. Hands-on experience
  with AI tools and platforms (Claude, OpenAI, LangChain,
  etc.) and integrating them into production user flows.
  Ability to build and optimize AI-powered microtools and
  workflows that surface directly to users — you care about
  latency, reliability, and UX, not just model quality. SQL
  proficiency for querying data and informing product
  decisions. Strong product sense — you think in terms of user
  journeys, conversion funnels, and outcomes, not just
  technical specs. Comfort with ambiguity, fast context-
  switching, and the pace of an early-stage startup where
  you'll wear multiple hats.

  Nice to Have

  - Experience with mobile-first or WhatsApp-based product
    experiences.
  - Familiarity with Shopify, Zoho, or similar e-commerce/CRM
    ecosystems.
  - Experience with evaluation frameworks for LLM outputs in
    user-facing contexts.
  - Prior experience with phased rollouts, feature flagging, or
    growth experimentation.

  Benefits

  Why This Role?

  Competitive salary Expense books you read Lunch at office
  Direct access to the leadership team and meaningful
  ownership from day one Fast-track professional growth in a
  high-intensity, in-person startup environment

  Want to skip the queue?  - Take a few minutes and write a
  standout email to the co-founders at akash@raaz.app and
  harshit@raaz.app. Copy sayantan@raaz.app. Show us something
  you've built that users actually use — a product, a feature,
  a demo — anything that proves you ship for real people.
