  throughput, and cost; monitor with observability tooling.
  Security, Privacy, and Compliance Handle PII securely; align
  with data governance, regulatory, and licensing constraints.
  Collaboration Partner with product, domain SMEs, data
  engineering, and SRE to deliver measurable outcomes.
  Document designs, decisions, and runbooks; share best
  practices.
