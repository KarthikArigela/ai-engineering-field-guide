description: |
  Who We Are

  Our department is a dynamic, global team of diverse
  professionals dedicated to developing award-winning AI
  solutions, including both traditional and generative models.
  We leverage cutting-edge machine learning technologies to
  drive innovation and enhance Robert Half’s recruiting,
  placement, and sales processes, as well as support
  modernization efforts across the organization.

  We are seeking a passionate Software Engineer who is ready
  to grow their career while bringing practical experience to
  the future direction of our AI technology. Having invested
  heavily in data science, our AI leverages millions of
  proprietary data points and drives innovation across the
  core products at Robert Half. We are looking for candidates
  who have familiarity with production-ready software systems,
  can translate complex AI concepts into reliable
  applications, collaborate effectively across technical and
  non-technical teams, and contribute across implementation,
  testing, AWS-based deployment, monitoring, and support. If
  you’re excited to build production-level AI applications
  while continuing to deepen your expertise with an
  experienced team shaping the future of AI in the talent
  solutions industry, we’d love to have you join us!

  What You'll Do

  - Contribute to the design, build, testing, deployment, and
    monitoring of production-grade generative AI applications,
    APIs, and integrations that support recruiting, placement,
    sales, and internal productivity workflows.
  - Partner with data scientists, data engineers, DevOps, and
    business stakeholders to translate business needs into
    scalable technical solutions.
  - Apply familiar GenAI patterns such as RAG, prompt
    orchestration, agent workflows, and evaluation pipelines
    while continuing to build expertise across leading LLM
    families and platform integrations.

  - Write clean, maintainable, well-tested code and contribute
    to technical documentation, code reviews, monitoring, and
    operational best practices.

  What You'll Need

  - Strong software engineering fundamentals with proficiency in
    Python and experience building APIs, services, data
    pipelines, or cloud-based applications.
  - Hands-on familiarity with generative AI tools and concepts,
    such as LLM APIs, prompt engineering, RAG, vector
    databases, embeddings, evaluation methods, and leading LLM
    families; experience applying these concepts in production
    applications is strongly preferred.
  - Experience with AWS and cloud-based production environments,
    along with modern engineering practices such as Git,
    CI/CD, testing, observability, and agile delivery.

  - Ability to communicate technical ideas clearly, collaborate
    across technical and non-technical teams, and work through
    ambiguous problems with guidance and clear communication.

  What We Offer

  - A supportive environment where talent is encouraged to grow
    and take on new challenges.
  - Opportunities to work on cutting-edge projects in AI and
    data science.
  - A culture that values diversity, inclusion, and the
    professional development of all team members.

  The typical annual salary range for this position is shown
  below and is negotiable depending upon experience and
  location.

  $68,000.00 - $102,000.00

  We offer exceptional earning potential and a competitive
  benefits package, including group health insurance benefits
  (medical, vision, dental), FSA and HSA healthcare accounts,
  life and accident insurance, adoption and fertility
  assistance, paid parental leave of up to 6 weeks, and
  short/long term disability. Robert Half provides paid time
  off for vacation, personal needs, and sick time. The amount
  of Choice Time Off (CTO) our people receive varies based on
  their years of service and is pro-rated based on the hours
  worked per week. A new hire earns up to 17 days of CTO per
  calendar year. Our people also receive up to 11 paid
  holidays per calendar year. We also offer the opportunity to
  contribute to our company 401(k) savings and investment plan
  or deferred compensation plan (if eligible), with an
  employer match of 100% on the first 3% of your contributions
  for eligible employees. Learn more at
  https://roberthalfbenefits.com.

  Robert Half Inc. is an Equal Opportunity Employer.
  M/F/Disability/Veteran

  As part of Robert Half’s Corporate Services facility
  employment process, any offer of employment is contingent
  upon successful completion of a background check.

  Our recruiters use their expertise and may utilize AI to
  help with their evaluation of candidates.

  Robert Half is committed to being an equal employment
  employer offering opportunities to all job seekers,
  including individuals with disabilities. If you believe you
  need a reasonable accommodation in order to search for a job
  opening or to apply for a position, please contact us by
  sending an email to HRSolutions@roberthalf.com or call
  1.855.744.6947 for assistance.

  In your email please include the following:

  - The specific accommodation requested to complete the
    employment application.
  - The location(s) (city, state) to which you would like to
    apply.

  For positions located in San Francisco, CA: Robert Half will
  consider qualified applicants with criminal histories in a
  manner consistent with the requirements of the San Francisco
  Fair Chance Ordinance.

  For positions located in Los Angeles County, CA: Robert Half
  will consider for employment qualified applicants with
  arrest or conviction records in accordance with the Los
  Angeles County Fair Chance Ordinance for Employers and the
  California Fair Chance Act.
