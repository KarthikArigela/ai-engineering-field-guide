description: |
  Who We Are

  At JD.com, also known as JINGDONG, we are building one of
  the world’s most trusted technology and supply chain
  ecosystems. What started as a bold idea in China has evolved
  into a NASDAQ-listed, Fortune 44 global enterprise serving
  over 700 million active customers. Powered by advanced
  logistics, innovative technology, and a commitment to
  integrity, JD.com operates across retail, logistics,
  technology, property and more, creating solutions that make
  everyday life smarter, faster, and more connected.

  Our Global Reach

  JD.com is expanding its international footprint through a
  digitally intelligent, cross-border supply chain and world-
  class logistics network, supported by platforms such as
  Joybuy, which brings trusted products to customers
  worldwide. Today, our teams operate across China, the U.S.,
  U.K., Netherlands, France, Germany, Spain, Brazil, Hungary,
  Japan, South Korea, Australia, Thailand, Vietnam, Malaysia,
  Indonesia, Saudi Arabia, the UAE and beyond, reaching
  customers in every corner of the world.

  Learn more about who we are and what we do:
  https://corporate.jd.com/

  What We Offer

  Joining JD.com means becoming part of a company where
  people, innovation, and impact go hand in hand. We offer a
  competitive salary, a great location, and a supportive,
  people-first culture where your growth truly matters. With
  access to global projects, learning opportunities, and an
  inclusive environment that values every voice, you’ll have
  the space to shape the future with us.

  About The Team

  You’ll be joining the JD.com team, which values
  collaboration, ownership, and a commitment to delivering
  high-quality results in a fast-paced, dynamic environment.

  About the Role

  JD Financial Technology is looking for a highly versatile,
  hands-on AI Native Technical Lead / Staff Engineer to join
  our Silicon Valley team.

  This role will support a strategic innovation initiative
  around ATO, an AI-native project that connects intelligent
  agents, supply chain workflows, data systems, payment and
  settlement capabilities, and real-world operational
  execution.

  The ideal candidate is a rare hybrid talent: strong in
  production engineering, data infrastructure, system
  operations, backend development, and AI application
  development. This person should be able to own real systems
  end-to-end, build prototypes quickly, operate production
  workflows reliably, and help senior leadership evaluate
  broader AI opportunities across JD Financial Technology.

  This is not a narrow specialist role. We are looking for a
  high-agency builder who can work across engineering, data,
  AI, operations, product, and business strategy.

  What We’re Looking For

  - 8+ years of hands-on engineering experience in backend
    systems, data platforms, infrastructure, DevOps, or AI
    applications.
  - Strong ability to build and operate real production systems,
    not just prototypes.
  - Proficiency in at least one major backend language such as
    Python, Java, Go, or TypeScript/Node.js.
  - Strong ability with data systems such as SQL, data
    warehouses, data lakes, ETL/ELT pipelines, streaming
    systems, workflow orchestration, or analytics platforms.
    Have built from 0 to 1 in previous experience
  - Practical experience with cloud infrastructure, APIs,
    monitoring, deployment, CI/CD, and production incident
    handling.
  - Hands-on experience building AI applications using LLM APIs,
    RAG, agents, prompt engineering, AI workflow tools, or
    model evaluation frameworks.
  - Strong product and business judgment; able to understand
    ambiguous business goals and translate them into technical
    execution plans.
  - Comfortable working in a fast-moving, ambiguous, cross-
    border environment with both China and US teams.
  - Excellent communication skills in English; Mandarin Chinese
    is strongly preferred.

  At JD.com, we’re committed to building a diverse and
  inclusive workplace where everyone can thrive. We’re proud
  to be an equal opportunity employer and make all employment
  decisions without regard to race, color, religion, gender,
  gender identity or expression, sexual orientation, national
  origin, disability, age, veteran status, or any other
  protected characteristic.

  Ready to apply?

  Take the next step in your career, apply now and explore the
  opportunities we have to offer.
