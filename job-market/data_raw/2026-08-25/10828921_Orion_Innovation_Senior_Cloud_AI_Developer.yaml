description: |
  Orion Innovation is a premier, award-winning, global
  business and technology services firm.  Orion delivers game-
  changing business transformation and product development
  rooted in digital strategy, experience design, and
  engineering, with a unique combination of agility, scale,
  and maturity.  We work with a wide range of clients across
  many industries including financial services, professional
  services, telecommunications and media, consumer products,
  automotive, industrial automation, professional sports and
  entertainment, life sciences, ecommerce, and education.

  Summary:

  The Senior Cloud / AI Developer designs, develops, and
  maintains Java-based, cloud-native applications on GCP that
  support business workflows. This role builds secure,
  scalable services. The position collaborates closely with
  DevOps, QA, Product Management, and security stakeholders to
  deliver reliable solutions that meet performance, security,
  and compliance expectations.

  KEY RESPONSIBILITES

  - Design, develop, and maintain Java-based applications for
    cloud environments, using modern engineering practices.
    and cloud-native patterns.
  - Implement cloud-native solutions on GCP to support
    ingestion, processing, storage, retrieval, and
    distribution workflows.
  - Create and maintain RESTful APIs for seamless integration
    with internal services and external partners, including
    versioning, documentation, and backward compatibility
  - Implement AI-enabled capabilities for use cases.
  - Identify, troubleshoot, and resolve technical issues and
    defects in cloud applications, including root-cause
    analysis and preventative fixes.
  - Ensure applications meet security standards and applicable
    compliance requirements through secure coding practices,
    authorization controls, encryption, auditing, and policy-
    aligned data handling.
  - Develop and maintain CI/CD pipelines and infrastructure-as-
    code for repeatable deployments and environment
    consistency in partnership with DevOps.
  - Implement observability practices including logging,
    metrics, tracing, alerting, and operational
    documentation/runbooks.
  - Work closely with cross-functional teams including DevOps,
    QA, and Product Management to plan, deliver, test, and
    support high-quality software solutions.
  - Participate in architecture/design reviews, code reviews,
    and technical documentation; contribute to shared
    standards and best practices.

  REQUIRED SKILLS

  - Strong professional experience developing backend services
    and APIs in Java.
  - Hands-on experience designing, deploying, and operating
    applications on GCP, using serverless and/or container-
    based approaches.
  - Experience designing and implementing RESTful APIs,
    including authentication/authorization patterns and
    integration with other services.
  - Experience integrating AI capabilities into applications and
    familiarity with basic evaluation/monitoring concepts.
  - Knowledge of secure engineering practices, including least
    privilege, service accounts, secrets management,
    encryption in transit/at rest, and audit logging.
  - Familiarity with CI/CD and infrastructure-as-code and Git-
    based development workflows.
  - Strong troubleshooting skills for cloud applications,
    including defect triage, performance tuning, and
    production support with observability tools.
  - Strong collaboration and communication skills across
    engineering, QA, DevOps, product, and security
    stakeholders.

   Preferred Qualifications

  - Exposure to Agile methodologies and Software Development
    Life Cycle (SDLC) practices.
  - Familiarity with change/configuration management tools (for
    example: VersionOne, ServiceNow) and/or Application
    Lifecycle Management (ALM) practices.
  - Hands-on exposure to container or serverless concepts (for
    example: Docker, Kubernetes fundamentals, or
    managed/serverless deployments).

   Additional Required Skills/Experience:

  - Over Thirteen (13) years’ of relevant experience.
  - A degree from an accredited College/University in the
    applicable field of services is required. If the
    individual's degree is not in the applicable field then
    four additional years of related experience is required.
  - Typically performs all functional duties independently.

  Note: Special credentials (licenses and/or certifications)
  may be required at the Task Order level on a case-specific
  basis.

