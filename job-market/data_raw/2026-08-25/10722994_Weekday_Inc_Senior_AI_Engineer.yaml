description: |
  𝗧𝗵𝗶𝘀 𝗿𝗼𝗹𝗲 𝗶𝘀 𝗳𝗼𝗿 𝗼𝗻𝗲 𝗼𝗳 𝘁𝗵𝗲 𝗪𝗲𝗲𝗸𝗱𝗮𝘆'𝘀 𝗰𝗹𝗶𝗲𝗻𝘁𝘀

  𝗦𝗮𝗹𝗮𝗿𝘆 𝗿𝗮𝗻𝗴𝗲: 𝗥𝘀 𝟮𝟱𝟬𝟬𝟬𝟬𝟬 - 𝗥𝘀 𝟰𝟬𝟬𝟬𝟬𝟬𝟬 (𝗶𝗲 𝗜𝗡𝗥 𝟮𝟱-𝟰𝟬 𝗟𝗣𝗔)

  Experience: 6+ yrs

  Location: Bengaluru, Karnataka, India

  Job Type: Full-time

  We are looking for an experienced Senior AI Engineer to
  design, develop, and deploy production-ready Generative AI,
  RAG, and Agentic AI solutions across modern cloud
  environments. This role combines hands-on AI engineering,
  solution architecture, cloud deployment, model optimization,
  and technical mentoring.

  The ideal candidate will have strong expertise in Python,
  LangChain, LangGraph, MCP, RAG, Agentic AI, Gemini, Vertex
  AI, FastAPI, Docker, and Kubernetes, along with practical
  experience building enterprise-grade AI applications on GCP
  and Azure.

  You will work closely with engineering, product, and
  business teams to transform complex business requirements
  into scalable AI solutions while ensuring reliability,
  security, performance, and cost efficiency.

  RequirementsKey Responsibilities

  - Design and develop RAG, autonomous-agent, and multi-agent AI
    solutions using LangGraph, LangChain, MCP, and advanced
    prompt-engineering techniques.
  - Build enterprise AI workflows integrating n8n, Python, APIs,
    databases, and external systems.
  - Develop AI applications using Gemini, Vertex AI, Agent
    Builder, Model Garden, and Vertex AI Search &
    Conversation.
  - Implement data cleansing, chunking, embeddings, vector
    search, and retrieval pipelines.
  - Build CDC-based solutions for real-time data synchronization
    and AI workloads.
  - Develop and deploy production AI services using Python,
    FastAPI, Docker, and Kubernetes/GKE.
  - Fine-tune LLMs and SLMs, including models such as Gemma,
    using PEFT, LoRA, and QLoRA.
  - Evaluate AI models for quality, accuracy, performance,
    latency, scalability, and cost.
  - Develop interactive AI interfaces and prototypes using
    Gradio and Streamlit.
  - Implement CI/CD, MLOps, LLMOps, monitoring, observability,
    and production deployment practices.
  - Work across GCP and Azure to build scalable and secure
    enterprise AI solutions.
  - Collaborate with engineering, product, and business
    stakeholders to understand requirements and deliver
    effective AI solutions.
  - Mentor junior AI/ML engineers and contribute to technical
    standards, architecture decisions, and engineering best
    practices.

  What Makes You a Great Fit

  - 6+ years of experience in AI/ML Engineering, Software
    Engineering, or a related field.
  - Strong hands-on programming experience with Python and
    familiarity with PyTorch, TensorFlow, or Scikit-learn.
  - Proven experience building and deploying Generative AI, RAG,
    and Agentic AI solutions.
  - Strong knowledge of LangGraph, LangChain, MCP, prompt
    engineering, and multi-agent architectures.
  - Hands-on experience with GCP and Azure for enterprise AI
    workloads.
  - Experience with Vertex AI, Gemini API, Vertex AI Pipelines,
    and Gemini Code Assist.
  - Strong understanding of n8n, FastAPI, Docker,
    Kubernetes/GKE, APIs, databases, and vector stores.
  - Experience with Azure DevOps, Argo Workflows, CI/CD, MLOps,
    and LLMOps.
  - Practical knowledge of PEFT, LoRA/QLoRA, model evaluation,
    and optimization.
  - Experience working with real-time data, CDC, embeddings, and
    vector-search technologies.
  - Strong understanding of production AI deployment,
    monitoring, scalability, and cost optimization.
  - Excellent problem-solving, communication, stakeholder-
    management, and technical mentoring skills.
  - Relevant AI/ML certifications and experience delivering
    large-scale production AI solutions would be an advantage.
