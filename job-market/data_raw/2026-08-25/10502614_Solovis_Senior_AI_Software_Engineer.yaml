description: |
  Senior Software Engineer, Agentic Development

  Solovis builds portfolio management and analytics software
  for institutional investors: the endowments, foundations,
  family offices, and asset managers responsible for some of
  the most complex capital in the world. We are backed by
  Insight Partners and growing fast, investing in product,
  people, and the technology that drives client outcomes.
  We've made a company-wide commitment to be AI-native by end
  of 2026. Not a pilot program, not a future roadmap item — an
  active transformation already underway across every team.
  Engineering is at the center of it.

  We're building out our agentic development team and hiring
  engineers who are already working this way in production. If
  you've been ahead of your peers on this and want to be
  somewhere that matches your pace, this is worth a look.

  Please note: Applicants must be authorized to work for any
  employer in the United States, including for any future work
  authorization needs (such as OPT/CPT). We are unable to
  sponsor or take over sponsorship of an employment visa at
  this time.

  The Role

  This is a hands-on engineering role. You own features end-
  to-end, ship production systems using agentic workflows as
  your default mode of work, and take genuine accountability
  for what you build — including when things break. You create
  your own momentum through strong requirements discipline,
  continuous validation of agent output, and a concrete
  understanding of when to push forward and when to stop and
  reset.

  Your stakeholders are sophisticated. They expect quality,
  reliability, and engineers who think beyond the ticket. The
  best engineers here earn that trust quickly and build
  systems that last.

  What You'll Do

  - Deliver features and modernizations across our stack using
    agentic development end-to-end
  - Build and operate multi-agent workflows where distinct roles
    run in parallel and in coordination
  - Work in brownfield environments with the same discipline as
    greenfield builds
  - Validate agent output and know when to intervene — grounded
    in how well requirements were set upfront
  - Pair with existing engineers to transfer agentic working
    habits through real production work
  - Contribute consistently to sprint delivery and take
    ownership of quality over time

  What We're Looking For

  Engineering Background

  - 5–9 years of professional software engineering experience
  - Strong fluency in Java or Python on AWS, or C# on Azure
  - Production ownership history: you've shipped non-trivial
    systems and been accountable when things went wrong
  - At least one significant out-of-depth experience — a stack
    switch, a domain change, or a greenfield build in
    unfamiliar territory

  Agentic Development Experience

  - 6+ months of serious, production-grade agentic tool use
    (Claude Code, Cursor, or equivalent) — production work
    only, not pilots or experiments
  - Demonstrated ability to build product with AI, not just use
    AI within existing workflows
  - Concrete understanding of when to let an agent run versus
    when to intervene, grounded in how well requirements were
    established before the work started
  - Experience reviewing and validating work you did not write,
    including agent-generated output
  - Familiarity with building multi-agent frameworks where
    distinct roles operate concurrently

  Who Won't Thrive Here

  If you're looking for a role where the requirements are
  always airtight before work starts, agents are a nice-to-
  have, or someone else validates the output — this isn't it.
  This role requires comfort with ambiguity, genuine ownership
  over what you ship, and the discipline to know when to push
  forward and when to stop and reset.

  We're not a team that protects engineers from
  accountability. If a system breaks, you're in it. If an
  agent produced something wrong and it shipped, that's on you
  too. We operate more like a gym than a spa — growth here is
  intentional and sometimes uncomfortable, and that's exactly
  how we like it.

  If that's the environment where you do your best work, we
  want to talk.

  Interview Process

  We want this to be a great fit for both sides. After
  applying, you'll complete a short set of aptitude and
  personality assessments before connecting with a recruiter.
  Everyone goes through them, from interns to our CEO. The
  invitation will come from a member of our recruiting team —
  keep an eye on your inbox, and check your spam folder just
  in case.
