description: |
  Who We Are

  WPP Enterprise Solutions designs, builds, and operates the
  growth systems that competitive businesses rely on. In a
  world where Al is reshaping how companies drive growth, we
  lead clients in business transformation and marketing
  modernization, connecting strategy directly to execution.
  Our 12,000 experts in engineering and platforms, commerce,
  consulting, content transformation, CRM, and CX work within
  a unified global operating unit across 40+ markets. WPP
  Enterprise Solutions works alongside best-in-class partners
  including Adobe, AWS, Braze, Google, Microsoft, Salesforce,
  and Shopify, as well as innovators in AI, to deliver growth
  solutions tailored to the needs of our clients’ businesses.
  VML, part of WPP, supports WPP Enterprise Solutions by
  helping brands activate transformation through creativity
  and experience.

  Job Title :   AI/ML Engineer

  Location: Bangluru / Hybrid

  Type of position:  Fulltime

  Experience: 4+ Years

  What you’ll be doing

  - Collaborate & Innovate: Partner with Technical Architects,
    Engagement Managers and Product teams to define customer
    requirements/use cases, facilitate technical workshops,
    and co-create specific GenAI solutions.
  - Prototype Rapidly: Apply an AI-first experimentation
    mindset—build proof points in days, iterate on feedback,
    and drive quick wins. UX/UI and rapid prototyping skills
    are a plus.
  - Engineer End-to-End: Design, build, and deploy full-stack
    applications and microservices—integrating Firefly APIs,
    Common Extensibility Platform, GenStudio for Performance
    Marketing, headless CMS architectures and UX/UI Designs.
  - Bridge to Product: Capture field-proven use cases and funnel
    them back to Product & Engineering—fueling the Firefly
    roadmap.
  - Automate & Scale: Develop reusable components, CI/CD
    pipelines, and governance checks to ensure consistent,
    repeatable delivery.
  - Operate at Speed: Thrive in a constantly evolving, start-up-
    like environment—own delivery sprints, tackle challenges
    on-site/remotely, and adapt to evolving AI trends.
  - Share & Elevate: Document your playbooks, prompts, and
    patterns in our internal knowledge base—helping the whole
    organization move faster.



  What You Bring

  - Full-Stack Expertise: 3+ years as a full-stack developer or
    technical consultant building and launching production
    software (React.js/Next.js/Angular; Node.js/Java Spring
    Boot; REST/GraphQL, HTML, JavaScript, Java, XML).
  - AI Tinkerer: AI-native tinkerer who embeds AI in your day-
    to-day workflows and spends your free time inventing and
    tinkering with the possibilities of AI. You keep ahead of
    market trends across third-party models, GPUs, and new AI
    applications.
  - Adobe Fluency: Deep understanding of Adobe Creative Cloud
    APIs/SDK/CEP, Firefly Services APIs, and Adobe Experience
    Cloud integrations (AEM, Workfront Fusion, AJO or
    equivalent experience).
  - Cloud & DevOps Savvy: AWS/Azure/GCP, containerization
    (Docker/Kubernetes), and CI/CD tooling (GitLab, Jenkins,
    etc.).
  - Strong communicator: You translate complex AI concepts for
    both engineers and executives and guide customers through
    technical decisions aligned to business objectives.
  - Customer-Centricity: Always prioritizing the customer and
    their needs and expectations first in everything you do.
    You are outstanding at contributing to a culture of
    customer-centricity among your team and your extended
    ecosystem.
  - Startup DNA: Thrives in fast‑paced, ambiguous
    environments—relentlessly seeking better, faster, more
    innovative ways to solve customer objectives and
    challenges

