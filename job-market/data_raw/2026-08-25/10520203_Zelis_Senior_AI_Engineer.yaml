description: |
  About Us

  Zelis is modernizing the healthcare financial experience in
  the United States (U.S.) across payers, providers, and
  healthcare consumers. We serve more than 750 payers,
  including the top five national health plans, regional
  health plans, TPAs and millions of healthcare providers and
  consumers across our platform of solutions. Zelis sees
  across the system to identify, optimize, and solve problems
  holistically with technology built by healthcare experts –
  driving real, measurable results for clients.

  At Zelis, AI is woven into the fabric of how we work. Every
  associate is expected - and empowered - to partner with AI
  to challenge the status quo, accelerate innovation, and
  amplify their impact. This is a place for builders with a
  growth mindset who act with agility, embrace change, and use
  modern technology to shape smarter solutions, exceptional
  experiences, and the future of our industry for our clients,
  customers, and our culture.

  Why We Do What We Do

  In the U.S., consumers, payers, and providers face
  significant challenges throughout the healthcare financial
  journey. Zelis helps streamline the process by offering
  solutions that improve transparency, efficiency, and
  communication among all parties involved. By addressing the
  obstacles that patients face in accessing care, navigating
  the intricacies of insurance claims, and the logistical
  challenges healthcare providers encounter with processing
  payments, Zelis aims to create a more seamless and effective
  healthcare financial system.

  Zelis India plays a crucial role in this mission by
  supporting various initiatives that enhance the healthcare
  financial experience. The local team contributes to the
  development and implementation of innovative solutions,
  ensuring that technology and processes are optimized for
  efficiency and effectiveness. Beyond operational expertise,
  Zelis India cultivates a collaborative work culture,
  leadership development, and global exposure, creating a
  dynamic environment for professional growth. With hybrid
  work flexibility, comprehensive healthcare benefits,
  financial wellness programs, and cultural celebrations, we
  foster a holistic workplace experience. Additionally, the
  team plays a vital role in maintaining high standards of
  service delivery and contributes to Zelis’ award-winning
  culture. 

  Position Overview

  We are seeking a highly technical and innovative AI Engineer
  with deep expertise in developer workflows, software
  engineering practices, and Application Security (AppSec).
  This role will focus on building and assessing AI-driven
  solutions that enhance the software development lifecycle
  (SDLC), improve developer productivity, and integrate
  security seamlessly into engineering workflows. The ideal
  candidate combines hands-on experience with modern AI
  technologies (LLMs, AI agents, RAG, and automation) and deep
  knowledge of secure software development practices. They
  will partner within Product Security, and other teams
  including Engineering, DevOps, and Platform teams to develop
  intelligent capabilities that help developers build secure
  software faster.

  Key Responsibilities

  AI-Powered Developer Workflow

  - Analyze and map end-to-end developer workflows across
    planning, coding, testing, CI/CD, deployment, and
    operations.
  - Design, build and assess AI-powered solutions that improve
    developer productivity and engineering efficiency.
  - Develop AI agents and copilots for product security team to
    automate repetitive engineering and security tasks.
  - Implement Retrieval-Augmented Generation (RAG) and knowledge
    systems that leverage internal documentation, security
    standards, and best practices.
  - Build integrations across developer tools including GitHub,
    GitLab, Jira, Azure DevOps, Jenkins, and IDE platforms.
  - Identify bottlenecks in development workflows and recommend
    AI-based process improvements complying with security
    standards.

  Application Security

  - Serve as the Application Security Subject Matter Expert
    (SME) for AI-enabled development initiatives.
  - Embed security controls and guidance directly into developer
    workflows.
  - Define approaches for secure code generation and AI-assisted
    software development.
  - Partner within Product Security teams to integrate SAST,
    DAST, SCA, secrets detection, IaC scanning, and container
    security into AI solutions.
  - Develop security guardrails for AI-generated code and AI
    agents.
  - Evaluate and mitigate risks associated with LLMs, AI agents,
    and autonomous software development.
  - Drive Secure SDLC and DevSecOps best practices across
    engineering organizations.

  AI Solution Development

  - Design, develop, and deploy production-grade application
    using C#, Asp.net, SQL server, AI applications using
    modern AI frameworks.
  - Partner with business units to build and assess agentic
    workflows leveraging LLMs and orchestration frameworks.
  - Create evaluation frameworks to measure AI model
    effectiveness, security, and developer adoption.
  - Work with large-scale datasets and telemetry to generate
    actionable engineering insights.
  - Develop APIs, services, and integrations supporting
    enterprise AI capabilities.

  Cross-Functional Collaboration

  - Collaborate with Engineering, Product Security, Platform
    Engineering, DevOps, and Developer Experience teams.
  - Present findings and recommendations to technical leaders
    and executives.
  - Influence enterprise AI strategy for secure software
    development.

  Required Qualifications

  Experience

  - 7+ years of software engineering, security engineering, or
    related experience.
  - 3+ years developing AI, ML, or GenAI solutions in enterprise
    environments.
  - Hands-on experience with developer platforms and modern
    software delivery practices.
  - Prior experience in Application Security, Product Security,
    DevSecOps, or Secure SDLC programs.

  Technical Skills

  - Strong programming skills in Python, Java,
    JavaScript/TypeScript, or Go.
  - Experience with LLM platforms such as Azure OpenAI, OpenAI,
    Anthropic, or similar.
  - Expertise in AI agent frameworks and orchestration
    platforms.
  - Experience with vector databases, embeddings, RAG
    architectures, and knowledge retrieval systems.
  - Strong understanding of APIs, microservices, and cloud-
    native architectures.
  - Experience with Azure, AWS, or Google Cloud.

  Application Security Expertise

  - Deep understanding of Secure SDLC, Threat Modeling, OWASP
    Top 10, SAST, DAST, IAST, Software Composition Analysis
    (SCA), Secrets Management, Secure Coding Practices
  - Ability to review code and identify security
    vulnerabilities.
  - Familiarity with security tools such as Checkmarx, Veracode,
    Fortify, Snyk, GitHub Advanced Security, Semgrep,
    SonarQube, or similar.

