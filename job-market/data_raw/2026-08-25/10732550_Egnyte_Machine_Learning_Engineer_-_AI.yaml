description: |
  EGNYTE YOUR CAREER. SPARK YOUR PASSION.

  Egnyte is a place where we spark opportunities for amazing
  people. We believe that every role has meaning, and every
  Egnyter should be respected. With 23,000 customers worldwide
  and growing, you can make an impact by protecting their
  valuable data. When joining Egnyte, you’re not just landing
  a new career, you become part of a team of Egnyters who
  doers, thinkers, and collaborators are who embrace and live
  by our values:

  Invested Relationships

  Fiscal Prudence

  Candid Conversations



  ABOUT EGNYTE

  Egnyte is the secure multi-cloud platform for content
  security and governance that enables organizations to better
  protect and collaborate on their most valuable content.
  Established in 2008, Egnyte has democratized cloud content
  security for more than 23,000 organizations, helping
  customers improve data security, maintain compliance,
  prevent and detect ransomware threats, and boost employee
  productivity on any app, any cloud, anywhere. For more
  information, visit www.egnyte.com.



  WHAT YOU’LL DO:

  - Fine-tune and train SLMs using Hugging Face, TRL, and
    adapter methods (LoRA, QLoRA, PEFT)
  - Optimize models for inference via quantization, pruning, and
    knowledge distillation
  - Deploy models to edge devices, mobile, and local servers
    with strict latency targets
  - Build end-to-end MLOps pipelines from data ingestion to
    deployment
  - Monitor model accuracy, latency, and hardware utilization in
    production
  - Evaluate model quality using benchmarking frameworks and
    custom evaluation suites

  YOUR QUALIFICATIONS:

  - SLM Development & Fine-tuning: Train and fine-tune SLMs
    using Hugging Face and Knowledge on Adaptors.
  - Model Optimization: Apply quantization, pruning, knowledge
    distillation, and optimization for lightweight, efficient
    models.
  - Edge Deployment: Deploy models to edge devices, mobile, and
    local servers, etc.
  - Pipeline Engineering: Build end-to-end MLOps pipelines —
    from data ingestion to deployment.
  - Performance Monitoring: Track model accuracy, latency, and
    CPU/GPU usage in production.

  Good to have

  - Deployment experience on edge or mobile environments
  - Knowledge of ONNX export and cross-platform inference
  - MLOps tooling — experiment tracking, model registries, CI/CD
    for ML

