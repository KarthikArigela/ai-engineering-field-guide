  Job Description

  As a Principal Platform Engineer (IDP Focus), you will be
  the primary hands-on technical resource responsible for the
  implementation, configuration, and ongoing support of the
  IFS Internal Developer Platform. You will work within the
  Platform Engineering team to build the tooling and
  automation that enables product teams to self-serve
  infrastructure, services, and deployment pipelines on top of
  Kairos and Nexus.

  This is a deeply technical, delivery-focused role. You will
  be building and operating production IDP capabilities, not
  advising on them.

  - Implement, configure, and maintain the IFS Internal
    Developer Platform (IDP) end-to-end
  - Build self-service workflows, service catalogue entries,
    scaffolders, and golden path templates
  - Integrate IDP tooling with Kairos (application framework)
    and Nexus (infrastructure and deployment)
  - Build and maintain CI/CD integration patterns for product
    team consumption
  - Create and maintain developer-facing documentation, guides,
    and enablement materials
  - Provide platform support and technical enablement to product
    development teams
  - Contribute to platform standards, architectural decisions,
    and the IDP roadmap
  - Identify and resolve platform reliability and performance
    issues
  - Collaborate closely with the Platform Lead and adjacent
    platform teams (Base Tech, Auth, Nexus)

  Qualifications

  Internal Developer Platforms

  - Hands-on experience building or operating IDPs in production
    environments
  - Practical experience with IDP tooling: Backstage, Port,
    Cortex, or comparable platforms
  - Experience implementing service catalogues, scaffolders,
    golden paths, and self-service infrastructure workflows
  - Familiarity with integrating IDPs into CI/CD pipelines and
    cloud-native infrastructure

  Engineering

  - Strong hands-on engineering capability across the NGA stack,
    or the ability to get there fast:
    - Backend: Go
    - Frontend: React (with Next.js)
    - Messaging / Streaming: Apache Kafka / RedPanda
    - Data: PostgreSQL
  - Experience with Infrastructure as Code (IaC) and DevOps
    toolchains
  - Event-driven and event-based architecture patterns
  - Comfortable operating in a cloud-native environment:
    Kubernetes (AKS), containers, GitOps

  Platform Engineering

  - Strong understanding of developer experience principles and
    platform thinking
  - Ability to operate across platform and product team
    boundaries

  Experience supporting and enabling development teams in a
  platform capacity

