  Job Description

  Job Description

  When you join us at Thermo Fisher Scientific, you’ll become
  a member of a hard-working, motivated team that aligns with
  your enthusiasm for exploration and discovery. With revenues
  exceeding $40 billion and the largest investment in R&D in
  the industry, we provide our people with resources and
  opportunities to make significant contributions to the
  world.

  How will you make an impact

  Work on backend platform software that powers advanced
  scientific instruments used in semiconductors, life
  sciences, and materials research. We are seeking an
  experienced (6–10 years) to drive the development,
  enhancement, and adoption of an advanced automation platform
  with AI/ML-enabled capabilities. This role will technically
  Python automation engineers, architect robust automation
  solutions using Behavior-Driven Development (BDD) frameworks
  and integrate LLM services (Azure OpenAI preferred) to
  accelerate test authoring, classification, and execution.

  What will you do

  · Design, Develop, and maintain a scalable QA tool/framework
  for desktop and web applications using Python, PyTest,
  PowerShell, Node.js, and related technologies.

  · Architect and maintain BDD-based automation frameworks,
  including reusable step libraries and mapping of BDD steps
  to UI objects/actions.

  · Development of Python modules for BDD step classification,
  data extraction, and AI-driven prompt pipelines.

  · Architect and manage data pipelines for processing,
  classifying, and mapping BDD steps to automation objects,
  including structured data handling (CSV/JSON).

  · Oversee integration with Azure OpenAI and other LLM
  services, leveraging orchestration libraries such as
  LangChain (or similar).

  · Drive configuration management, file handling, and
  execution consistency across developer machines and CI
  agents.

  · Collaborate with QA, DevOps, and Product/Engineering teams
  to integrate automation into CI/CD pipelines (e.g., Jenkins)
  and release workflows.

  · Mentor and manage a team of automation engineers—setting
  best practices, enforcing code quality, and ensuring
  consistent delivery.

  · Own and improve the platform’s deployment and onboarding
  (“start-to-use”) experience, including validation checks,
  troubleshooting guidance, and user enablement documentation.

  · Drive continuous improvement in automation strategy,
  framework reliability, reporting, and scalability.

  Desirable Skills

  · Hands-on experience with LangChain, OpenAI SDKs, and/or
  Azure AI services in production use cases.

  · Exposure to Agentic AI concepts and practical usage of
  GitHub Copilot (GHCP) or similar AI-assisted development
  tools to enhance automation productivity and code quality.

  · Familiarity with modular software architecture, design
  patterns, and scalable framework design.

  · Experience building enterprise-grade automation platforms
  with strong focus on observability, reporting, and long-run
  stability.

  · Background in scientific, engineering, or regulated
  environments.

  Preferred Qualifications

  · BTech degree in Computer Science, Electronics, or a
  related technical field (or equivalent practical
  experience).

  · Experience operating in regulated or security-focused
  environments require auditability and traceability.
