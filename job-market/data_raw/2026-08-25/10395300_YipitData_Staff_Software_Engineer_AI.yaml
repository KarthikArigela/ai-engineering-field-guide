description: |
  About Us:

  YipitData is the leading market research and analytics firm
  for the disruptive economy and most recently raised $475M
  from The Carlyle Group at a valuation of over $1B. Every
  day, our proprietary technology analyzes billions of
  alternative data points to uncover actionable insights
  across sectors like software, AI, cloud, e-commerce,
  ridesharing, and payments.

  Our data and research teams transform raw data into
  strategic intelligence, delivering accurate, timely, and
  deeply contextualized analysis that our customers—ranging
  from the world’s top investment funds to Fortune 500
  companies—depend on to drive high-stakes decisions. From
  sourcing and licensing novel datasets to rigorous analysis
  and expert narrative framing, our teams ensure clients get
  not just data, but clarity and confidence.

  We operate globally with offices in the US, APAC, and India.
  Our award-winning, people-centric culture—recognized by Inc.
  as a Best Workplace for three consecutive years—emphasizes
  transparency, ownership, and continuous mastery.

  What It’s Like to Work at YipitData:

  YipitData isn’t a place for coasting—it’s a launchpad for
  ambitious, impact-driven professionals.

  From day one, you’ll take the lead on meaningful work,
  accelerate your growth, and gain exposure that shapes
  careers.

  Why Top Talent Chooses YipitData:

  - Ownership That Matters: You’ll lead high-impact projects
    with real business outcomes
  - Rapid Growth: We compress years of learning into months
  - Merit Over Titles: Trust and responsibility are earned
    through execution, not tenure
  - Velocity with Purpose: We move fast, support each other, and
    aim high—always with purpose and intention

  If your ambition is matched by your work ethic—and you're
  hungry for a place where growth, impact, and ownership are
  the norm—YipitData might be the opportunity you’ve been
  waiting for.

  About The Role:

  We’re looking for a seasoned Staff Software Engineer, to
  help develop our rapidly growing platform for our Corporate
  organization. This team builds AI-enabled products and
  analytics experiences used by major US retailers and brands
  to better understand their shoppers, market share, and
  competitive positioning through our analytics portal and
  Insight Agent offerings. The ideal candidate possesses 7+
  years of architecting and developing full-stack
  applications, strong experience building high-quality user
  experiences and scalable distributed systems, and 5+ years
  working with technologies such as Python, React, AWS, and
  modern data platforms. They should have a strong
  understanding of application architecture, APIs,
  observability, messaging and workflow patterns, and how
  infrastructure decisions impact the systems they build. They
  should also have hands-on experience building LLM-powered
  products and Agent Experiences, including designing Agent
  Loops, integrating MCP, and developing custom tools.

  You'll be responsible for production AI Agent systems that
  our customers and internal teams depend on daily. That means
  being responsive, reliable, and an excellent communicator —
  both when things are going well and especially when they're
  not.

  The ideal candidate treats AI coding tools as core
  infrastructure for how they work — not a novelty. You've
  shipped full-stack applications, you're comfortable
  navigating ambiguity, and you are customer-obsessed in your
  approach to improving software.

  This is a remote-friendly opportunity that can sit in NYC
  (where our headquarters is located), one of our office hubs,
  or anywhere else in the US. However, depending upon where
  the remote work is performed, income could be subject to New
  York State tax withholding.

  As Our Staff Software Engineer You Will:

  - Own features and systems end-to-end for our Corporate
    Insight Agent — from requirements gathering and solution
    design through implementation, deployment, and iteration
  - Serve as a subject matter expert across the stack, reporting
    to the Head of Corporate Applications, who will provide
    hands-on mentorship in AI-native development, systems
    design, front-end development, and cloud infrastructure
  - Collaborate closely with Corporate Product Management and
    business stakeholders to identify opportunities, shape
    requirements, and revamp critical business processes
  - Drive initiatives proactively — you won’t be waiting for
    fully written specs; you’ll help define what gets built,
    why it matters, and how to execute effectively
  - Balance rapid prototyping and long-term engineering rigor,
    knowing when to build lightweight POCs to validate market
    fit versus scalable, maintainable production systems
  - Iterate closely with users and stakeholders, incorporating
    feedback quickly while maintaining a strong engineering
    bar for quality, reliability, and observability
  - Leverage AI tools like Claude Code, Cursor, and Codex to
    improve productivity and ship trustworthy solutions faster
    through strong engineering practices, code quality, and
    documentation

  You Are Likely To Succeed If:

  - You have 6+ years of hands-on software development
    experience with a proven track record of shipping
    customer-facing applications — and the impact to show for
    it
  - You have hands-on experience building production AI systems
    and a strong understanding of how to optimize AI agents
    for quality, reliability, latency, and cost
  - You are stack-flexible: comfortable working across
    TypeScript, Python, React, APIs, distributed systems, and
    cloud infrastructure. You learn new tools quickly and
    don’t let unfamiliar technology slow you down
  - You have strong full stack engineering fundamentals,
    including experience building high-quality user
    experiences, scalable backend systems, observable
    services, and reliable workflows
  - You have an AI-accelerated workflow — you actively use AI
    coding tools to improve output and ship faster, not as an
    experiment, but as part of your day-to-day engineering
    practice
  - You are passionate about technology and continuously stay
    current with emerging trends, tools, and engineering
    practices that improve product quality, team velocity, and
    developer effectiveness
  - You care deeply about craftsmanship and user experience,
    with a passion for delivering polished, high-quality
    solutions that delight users
  - You are a strong communicator who can work directly with
    non-technical stakeholders, translate business needs into
    technical solutions, and clearly explain engineering
    tradeoffs
  - You are responsive and reliable — you take ownership of
    production systems and communicate proactively, especially
    under pressure
  - You hold a Bachelor’s or Master’s degree in Computer
    Science, STEM, or a related technical discipline

  What We Offer:

  Our compensation package includes comprehensive benefits,
  perks, and a competitive salary:

  - We care about your personal life, and we mean it. We offer
    flexible work hours, flexible vacation, a generous 401K
    match, parental leave, team events, wellness budget,
    learning reimbursement, and more!
  - Your growth at YipitData is determined by the impact that
    you are making, not by tenure, unnecessary facetime, or
    office politics. Everyone at YipitData is empowered to
    learn, self-improve, and master their skills in an
    environment focused on ownership, respect, and trust. See
    more on our high-impact, high-opportunity work environment
    above!
  - The annual on-target earnings for this position is
    anticipated to be up to $180K ~ $200K. The final offer may
    be determined by a number of factors, including, but not
    limited to, the applicant's experience, knowledge, skills,
    abilities, as well as internal team benchmarks.

  This role may be performed fully remotely within the United
  States. Please note that our US headquarters are located in
  NYC. We also have office hubs in Austin, Miami, and Mountain
  View. If the remote work is performed outside of these
  offices, income may be subject to New York State tax
  withholding.

  Please note that for this position, we are not able to
  consider candidates who currently or in the future will
  require visa sponsorship.
