description: |
  Job Title: Senior UI Engineer (React/React Native & AI
  Development) Experience:



  6+ Years



  Location:



  Open / Hybrid



  Job Summary:



  We are seeking a highly skilled and hands-on UI Engineer
  with strong expertise in React.js and/or React Native,
  combined with practical experience in AI application
  development. The ideal candidate should be capable of
  building modern, scalable user interfaces while leveraging
  AI technologies such as Python, Prompt Engineering, LLM
  integrations, and AI Agent development to create intelligent
  user experiences.



  Key Responsibilities:



  - Design, develop, and maintain responsive web and mobile
    applications using React.js and/or React Native.
  - Build reusable UI components and ensure a seamless user
    experience across platforms.
  - Integrate AI/LLM-powered capabilities into applications
    using APIs and frameworks.
  - Develop and enhance AI-driven workflows, copilots, chatbots,
    and intelligent assistants.
  - Design and optimize prompts for Large Language Models (LLMs)
    to improve accuracy and user experience.
  - Develop and orchestrate AI agents using frameworks such as
    LangChain, LangGraph, CrewAI, AutoGen, Semantic Kernel, or
    similar platforms.
  - Collaborate with Product, UX, and backend teams to deliver
    end-to-end solutions.
  - Participate in architecture discussions, code reviews, and
    performance optimization initiatives.
  - Stay updated on emerging UI and AI technologies and
    recommend innovative solutions.



  Required Skills: UI Development



  - Strong hands-on experience with React.js and/or React
    Native.
  - Proficiency in JavaScript (ES6+), TypeScript, HTML5, CSS3.
  - Experience with state management libraries such as Redux,
    Zustand, or Context API.
  - Familiarity with REST APIs and modern frontend development
    practices.



  AI & Automation



  - Strong programming skills in Python.
  - Experience with Prompt Engineering and LLM-based application
    development.
  - Hands-on experience integrating OpenAI, Azure OpenAI,
    Anthropic, Gemini, or similar AI services.
  - Experience building and deploying AI Agents and agentic
    workflows.
  - Familiarity with RAG (Retrieval-Augmented Generation)
    architectures, vector databases, and embeddings.
  - Understanding of AI application monitoring, evaluation, and
    optimization techniques.



  Preferred Qualifications:



  - Experience with cloud platforms such as Azure, AWS, or GCP.
  - Knowledge of CI/CD pipelines and DevOps practices.
  - Experience developing AI-powered products, copilots, or
    conversational applications.
  - Familiarity with containerization technologies such as
    Docker and Kubernetes.



  Nice to Have:



  - Exposure to MCP (Model Context Protocol).
  - Experience with AI observability tools.
  - Knowledge of GraphQL and microservices architectures.
  - Mobile application deployment experience on iOS and Android
    platforms.



  Key Traits:



  - Hands-on problem solver with strong ownership.
  - Ability to bridge UI engineering and AI innovation.
  - Excellent communication and stakeholder management skills.
  - Passion for emerging AI technologies and modern frontend
    ecosystems.



  Compensation, Benefits and Duration



  Minimum Compensation: USD 44,000 Maximum Compensation: USD
  156,000 Compensation is based on actual experience and
  qualifications of the candidate. The above is a reasonable
  and a good faith estimate for the role. Medical, vision, and
  dental benefits, 401k retirement plan, variable
  pay/incentives, paid time off, and paid holidays are
  available for full-time employees. This position is
  available for independent contractors No applications will
  be considered if received more than 120 days after the date
  of this post.
