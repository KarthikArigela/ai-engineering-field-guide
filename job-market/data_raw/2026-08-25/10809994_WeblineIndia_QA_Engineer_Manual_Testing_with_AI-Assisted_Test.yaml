title: QA Engineer (Manual Testing with AI-Assisted Test Automation)
company: WeblineIndia
location: Ahmedabad, IND
work_type: FULL_TIME
company_size: 165 Employees
description: |
  We are looking for a detail-oriented QA Engineer with 1–3
  years of experience in Manual Testing. The ideal candidate
  should have strong analytical skills, be proficient in
  creating high-quality test documentation, and be comfortable
  leveraging AI tools such as ChatGPT, Cursor, Claude, or
  GitHub Copilot to improve testing productivity.

  This role is primarily focused on Manual Testing, while also
  encouraging the use of AI to generate and accelerate the
  creation of test cases, test scenarios, exploratory testing
  ideas, and Playwright automation scripts for engineering
  review.

  RequirementsRoles & Responsibilities

  - Analyze business and functional requirements to understand
    application behavior.
  - Design and execute comprehensive Manual Test Cases and Test
    Scenarios.
  - Perform Functional, Regression, Integration, Smoke, Sanity,
    and Exploratory Testing.
  - Validate web and mobile applications across different
    browsers and devices.
  - Identify, document, prioritize, and track defects using bug-
    tracking tools.
  - Collaborate closely with Developers, Product Managers, and
    Business Analysts to clarify requirements and resolve
    issues.
  - Maintain test plans, test cases, execution reports, and
    defect documentation.
  - Use AI tools (ChatGPT, Cursor, Claude, GitHub Copilot, etc.)
    to:
    - Generate and refine test scenarios and test cases.
    - Identify edge cases and negative test scenarios.
    - Create exploratory testing checklists.
    - Generate possible Playwright automation test scripts for
      developer or QA review.
    - Improve bug reports and testing documentation.
  - Review AI-generated outputs for correctness, completeness,
    and business relevance before execution.
  - Participate in Agile/Scrum ceremonies and contribute to
    continuous quality improvement.

  Required Skills

  - 1–2 years of experience in Manual Software Testing.
  - Strong understanding of SDLC and STLC.
  - Excellent experience writing:
    - Test Plans
    - Test Scenarios
    - Test Cases
    - Bug Reports
  - Good understanding of Functional, Regression, Smoke, Sanity,
    Integration, and Exploratory Testing.
  - Experience using bug-tracking tools such as Jira or similar.
  - Familiarity with API testing using Postman or Swagger.
  - Basic SQL knowledge for database validation.
  - Understanding of Git or other version control systems.
  - Ability to effectively use AI tools such as ChatGPT, Cursor,
    Claude, or GitHub Copilot to improve testing productivity.
  - Basic understanding of Playwright concepts or the ability to
    generate Playwright test scripts using AI tools.
  - Strong analytical, logical reasoning, and problem-solving
    skills.
  - Good written and verbal communication skills.

  Preferred Skills

  - Experience working in Agile/Scrum teams.
  - Knowledge of Mobile Application Testing.
  - Exposure to Playwright automation is an advantage but not
    mandatory.
  - Familiarity with CI/CD concepts is a plus.
  - Awareness of performance testing tools such as JMeter is an
    added advantage.
  - Experience using modern AI-assisted development and testing
    workflows.

  What We're Looking For

  We value QA Engineers who think critically, understand
  business workflows, and use AI responsibly to enhance
  productivity—not replace testing expertise. The ideal
  candidate should be able to evaluate AI-generated outputs,
  identify missing scenarios, and ensure high-quality software
  through effective manual testing.

  BenefitsWhat is in for you?

  At WeblineIndia, in addition to competitive salary, we also
  provide an extensive benefits package which includes.

  - 5-days working.
  - On-site international work opportunities.
  - Creative freedom to work.
  - Work-life balance.
  - Festive Holidays.
  - Paid Leaves.
  - Monetary incentives.
  - Referral benefits.
  - Various Awards & Recognition programs.
  - Sponsored learning & certification programs.
  - Fun events.

  - And so much more.

  Join our team and contribute to our mission of delivering
  exceptional content that promotes our software solutions and
  services and engages our target audience.
