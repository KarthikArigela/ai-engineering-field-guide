description: |
  Dear Candidate,

  We are excited to share an excellent career opportunity with
  TIS Labs Pvt. Ltd. for the position of AI-ML Engineer.

   Position Details:

  - Role: AI-ML Engineer
  - Position: Permanent
  - Location: Mumbai
  - Experience: 4+ years
  - Working Days: 5 Days
  - Notice Period: Immediate or 30 days max.
  - Mandatory Skillset: AI/ML, Python, Django, NLP

  Requirements

  ➢ Responsibilities:

  • Model Development & Implementation: Lead the design,
  development, and deployment of

  machine learning models and algorithms in close
  collaboration with the AI/ML team.

  • Data Pre-processing & Feature Engineering: Oversee the
  data preparation pipeline,

  including pre-processing and feature engineering, ensuring
  the quality and efficiency of

  model inputs.

  • Model Evaluation & Optimization: Conduct rigorous
  experiments, analyze results, and

  provide actionable insights to enhance model performance and
  efficiency.

  • Scalability & Advanced Techniques: Apply advanced
  methodologies to optimize model

  performance when working with large-scale datasets.

  • AI/ML Model Integration: Spearhead the integration of
  AI/ML models into the product

  ecosystem, seamlessly embedding them within product
  features.

  • AI/ML Deployment with Django: Utilize Django for deploying
  machine learning models as

  web applications, ensuring seamless interaction between
  models and users.

  • Innovation & Knowledge Sharing: Stay current with the
  latest advancements in AI/ML

  technologies, and actively contribute to the team’s
  knowledge base while fostering a culture

  of innovation.

  ➢ Technical Skills:

  • Proficiency in Python and experience with popular machine
  learning libraries (e.g.,

  TensorFlow, PyTorch, scikit-learn).

  • Demonstrated expertise in data pre-processing, feature
  engineering, and model evaluation

  techniques.

  • Strong familiarity with deep learning frameworks and
  neural network architectures.

  • Experience with Django for deploying machine learning
  models as web applications.

  ➢ Requirements:

  • Educational Qualifications: BSc-IT, BCA, MCA, Bachelor’s
  or Master’s degree in

  Computer Science or IT, Data Science, or a related field.

  • Professional Experience: 3-5 years of hands-on experience
  in developing and deploying

  machine learning solutions.

  • Problem-Solving: Exceptional programming and analytical
  skills, with a proven ability to

  solve complex problems.

  • Collaboration & Communication: Excellent communication
  skills, with the ability to work

  effectively in a collaborative team environment.

  • Attention to Detail & Autonomy: Strong attention to detail
  and the ability to work

  autonomously in a fast-paced environment.

  Benefits

  About Company : www.tislabs.in

  TIS Labs Pvt. Ltd. has been the No. 1 service provider in
  India for IT Infrastructure including Consulting,
  Implementation and Support. Incorporated in 2010 started as
  a small Specialist in Linux & Open Source based Systems
  Integration & Services. Since 2010 TIS labs has evolved in
  Virtualization solutions, Mail solutions, Data management ,
  High Performance Computing, IT infrastructure security and
  IT Consulting. Working with highly qualified engineers
  supporting globally 24*7. TIS Lab offers capabilities to
  design, build, migrate, integrate and manage state-of-the-
  art Linux & Open-Source solutions at the server side
  infrastructure that is tailor-made to suit the business
  needs. TIS Lab solutions ensure security, flexibility and
  scalability in the environment apart from significantly
  reducing CAPEX and OPEX.

  Why Join Us?

  - Innovative Environment: Work with cutting-edge technology
    and a forward-thinking team.
  - Career Growth: Opportunities for professional development
    and career advancement.
  - Competitive Benefits: Comprehensive benefits package,
    including health insurance, retirement plans, and paid
    time off.
  - Dynamic Culture: A collaborative and inclusive work culture
    that values diversity and innovation.
