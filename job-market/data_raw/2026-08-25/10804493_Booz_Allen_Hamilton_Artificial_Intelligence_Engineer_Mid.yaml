description: |
  Artificial Intelligence Engineer, Mid

  The Opportunity:

  Great AI solutions start with understanding the problem—then
  designing something that actually works in the real world.
  As an Artificial Intelligence Engineer on our team, you'll
  work directly with clients and engineers on national
  security space missions to turn ambiguous needs into AI
  architecture solutions you can stand behind. You'll design
  and help build secure, scalable AI capabilities, including
  long-context and cache-augmented applications, automation,
  and model integrations, and make the hard calls on trade-
  offs, deployment, and responsible use. You'll be the
  technical voice clients trust: the person who can whiteboard
  the design in the morning and prototype it in the afternoon.
  You'll help a small, high-initiative team move fast without
  losing sight of security or mission value. Ready to engineer
  AI that makes it into the field? This position is located in
  El Segundo, CA.

  Join us. The world can’t wait.

  You Have:

  - 3+ years of experience designing, building, deploying, or
    integrating software, data, or traditional AI/ML solutions
  - Experience translating client or mission needs into
    technical architectures, solution designs, or
    implementation plans
  - Experience building or integrating AI and machine learning
    capabilities such as Agentic Retrieval systems, cache-
    augmented generation (CAG), model APIs, or long-horizon
    automation into applications or workflows
  - Experience with cloud services and modern Software Developer
    practices, such as AWS or Azure, containers, APIs, or
    CI/CD
  - Ability to independently lead ambiguous AI solutions work,
    self-manage priorities, solve complex problems, and meet
    tight deadlines
  - Ability to apply pragmatic judgment across technical
    standards, project flexibility, and emerging technologies
  - Ability to communicate technical designs and trade-offs to
    technical and non-technical stakeholders
  - Ability to obtain a Secret clearance
  - Bachelor's degree in a STEM field

  Nice If You Have:

  - Experience as a solution architect, sales engineer, AI/ML
    engineer, or technical lead on government, defense, or
    space programs
  - Experience deploying AI or software into secure or
    government cloud environments such as GovCloud, IL5, or
    IL6
  - Experience with AI prototype development, Knowledge Graphs
    (KAG), ontological systems, MLOps, or model evaluation
  - Experience leading or mentoring small technical teams
  - Possession of excellent communication, facilitation, and
    client-engagement skills
  - Secret clearance
  - Master's degree in a STEM field

  Clearance:

  Applicants selected will be subject to a security
  investigation and may need to meet eligibility requirements
  for access to classified information.

  Compensation

  At Booz Allen, we celebrate your contributions, provide you
  with opportunities and choices, and support your total well-
  being. Our offerings include health, life, disability,
  financial, and retirement benefits, as well as paid leave,
  professional development, tuition assistance, work-life
  programs, and dependent care. Our recognition awards program
  acknowledges employees for exceptional performance and
  superior demonstration of our values. Full-time and part-
  time employees working at least 20 hours a week on a regular
  basis are eligible to participate in Booz Allen’s benefit
  programs. Individuals that do not meet the threshold are
  only eligible for select offerings, not inclusive of health
  benefits. We encourage you to learn more about our total
  benefits by visiting the Resource page on our Careers site
  and reviewing Our Employee Benefits page.

  Salary at Booz Allen is determined by various factors,
  including but not limited to location, the individual’s
  particular combination of education, knowledge, skills,
  competencies, and experience, as well as contract-specific
  affordability and organizational requirements. The projected
  compensation range for this position is $99,000.00 to
  $225,000.00 (annualized USD). The estimate displayed
  represents the typical salary range for this position and is
  just one component of Booz Allen’s total compensation
  package for employees. This posting will close within 90
  days from the Posting Date.

  Identity Statement

  As part of the hiring process, we will ask you to complete
  an identity verification process that leverages advanced
  biometrics and artificial intelligence to ensure
  authenticity and protect against identity fraud. You are
  expected to be on camera during interviews and assessments.
  We reserve the right to take your picture to verify your
  identity and prevent fraud.

  Candidate AI Usage Policy

  AI is a part of our daily work at Booz Allen, and we are
  committed to the responsible and ethical use of AI tools.
  However, we want to ensure a fair candidate process based on
  your own skills and knowledge. As part of this commitment,
  the use of artificial intelligence (AI) or other tools to
  assist with responses during interviews (whether in-person
  or virtual) is prohibited unless permission is explicitly
  provided.

  Work Model Our people-first culture prioritizes the benefits
  of collaboration, whether it occurs in person or virtually.
  To support engagement and effective communication, employees
  working virtually are generally expected to have their
  cameras on during meetings.

  - Remote: If this position is listed as remote, there may
    still be occasions when you are required to work in person
    at a Booz Allen or customer facility.
  - Hybrid: If this position is listed as hybrid, you will be
    expected to work from a Booz Allen facility frequently, in
    alignment with leadership expectations and the needs of
    the role. You may also be required to work from or visit a
    customer facility.
  - Onsite: If this position is listed as onsite, work will
    primarily be performed at a Booz Allen office or customer
    facility, where employees will collaborate directly with
    colleagues and customers as required by the role.

  Commitment to Non-Discrimination

  All qualified applicants will receive consideration for
  employment without regard to disability, status as a
  protected veteran or any other status protected by
  applicable federal, state, local, or international law.
