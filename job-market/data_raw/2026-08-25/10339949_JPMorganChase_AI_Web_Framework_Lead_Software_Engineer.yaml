description: |
  Octagon Framework Engineer







  Job Description







  The Chase Digital team is responsible for enhancing the
  desktop and mobile experiences for our current and
  prospective Chase customers. As part of the Digital team,
  Web Channel Frameworks is building a best-in-class platform
  for Chase consumer and business applications. We are looking
  for team members with strong technical skills and a proven
  track record of delivering results in an agile environment.
  As a Developer Lead you are expected to be technology SME
  and responsible for bringing developers together to deliver.
  You should have strong experience in client-side
  technologies, and a passion for creating the best user
  experience possible.















  Responsibilities







  - Code, design, and testing in a heterogeneous technology
    environment.







  - Strong understanding of the overall software delivery
    lifecycle (SDLC) and activities.







  - Enacting agile development values and practices.







  - Enable close cooperation across all roles and functions.







  - Promote and participate in the continuous improvement of
    structure, processes, and tooling to enable the teams to
    deliver more value.







  - Identify opportunities for process and tool improvements and
    drive those from concept to implementation.







  - Engineer a world-class platform with an eye towards rapid
    iteration and creative problem solving.







  - Ensure quality and completeness of the product through unit,
    component, integration, and end-to-end testing.







  - Adhere to architecture standards, risk management, and
    security policies.







  - Contribute and collaborate in creation and consumption of
    open, standards-based solutions, while working with
    existing enterprise technologies and infrastructure.















  Requirements







  - Strong customer focus.







  - Excellent problem solving and analytical skills.







  - Strong verbal and written communication skills.







  - Ability to work in a rapidly changing environment.







  - Understanding of software design patterns and paradigms,
    such as object-oriented programming (OOP) and functional
    programming (FP).







  - Expertise on React, JavaScript, TypeScript and other web
    technologies for implementing web applications.







  - Experience in unit, component, integration, and end-to-end
    testing including the use of libraries like Jest, React
    Testing Library, Cypress, Selenium, etc.







  - Strong hands-on coding experience.







  - Strong knowledge and experience with build pipelines, such
    as Jenkins, etc.







  - Good experience with Single Page Application (SPA)
    development. Experience in page optimization
    (performance), understanding of performance consideration
    for React or other SPA-based web applications







  - Good experience architecting and implementing RESTful web
    services.















  Desirable







  - Knowledge and experience with Cloud related technologies
    such as Kubernetes, Docker, Heroku, GKP/EKS, AWS EC2, etc.







  - Hands-on experience with relational databases, GraphQL and
    integrating these with web services.







  - Good experience in customizing CSS frameworks like Bootstrap
    and Foundation as well as CSS pre-processors like Less or
    Sass.







  - Good understanding of Material UI, Chakra UI, or similar
    component libraries.







  - Experience with SSR (Server-Side Rendering) and SSG (Server-
    Side Generation) preferably using Next.js.







  - Participation in Test Driven Development or Business Driven
    Development (BDD)







  - Practice of Continuous Integration or Continuous Delivery







  - Strong grasp of functional JavaScript programming,
    preferably with Node.js.







  - Experience with behavioral data collection such as Adobe
    Analytics, Amplitude, etc.







  - Experience with experimentation platforms such as Split.io.







  - Experience with AWS Athena and AWS S3.















  Qualifications







  - Overall 10+ years of experience in delivering technology
    solutions







  - 8+ years of web development experience.







  - 8+ years’ experience with HTML5, CSS and JavaScript.







  - 5+ years’ experience with Jenkins or similar CI/CD tools







  - BS or MS in Computer Science or related field



