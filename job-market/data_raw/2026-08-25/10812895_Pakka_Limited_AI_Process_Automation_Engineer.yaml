description: |
  We are looking for an AI Process Automation Engineer to
  strengthen our digital transformation journey by connecting
  plant-floor systems with enterprise platforms, driving data
  quality, automation, and operational efficiency. If you are
  passionate about IT–OT integration, industrial data systems,
  and automation-driven problem solving, this role is for you!

  Key Responsibilities:

  1. IT–OT Integration

  - Lead plant-floor data migration from automation systems
    (PLC/DCS/SCADA) to IT infrastructure in SAP and other
    enterprise systems.

  2. Troubleshooting Knowledgebase Development

  - Create diagnostic manuals, SOPs, and troubleshooting guides
    for all implemented automation and integration solutions.

  3. Data Cleansing & Automated Data Flow

  - Implement data cleansing strategies and automate data
    pipelines for ERP, dashboards, advanced analytics, and
    reporting systems.

  4. Cross-Functional Coordination

  - Collaborate with IT and process teams to resolve data
    logging issues and ensure seamless data flow.

  5. Daily System Health Monitoring

  - Perform routine health checks of systems, servers, and
    connected OT networks.

  6. Server & Network Maintenance

  - Ensure smooth functioning, upkeep, and security of servers
    and networking components used for automation integration.

  7. Issue Resolution & Support

  - Resolve day-to-day problems, complaints, and discrepancies
    related to data logging and system performance.

  8. System Modifications

  - Carry out addition, deletion, or modification of data
    tags/signals based on business or process requirements.

  9. Spare Management

  - Manage and maintain inventory of critical spare parts for
    automation and IT–OT systems.

  10. Backup & Restore

  - Perform periodic system backups and restore activities to
    secure and maintain system reliability.

  11. System Upgrades

  - Execute software and hardware upgrades, including OS/Windows
    updates, ensuring system stability and compatibility.

  What We’re Looking For

  - Strong understanding of industrial automation systems
    (PLC/DCS/SCADA).
  - Experience in IT–OT integration, data engineering, or
    automation systems.
  - Hands-on experience with SAP data interfaces, dashboards, or
    analytics tools.
  - Problem-solving mindset with strong diagnostic skills.
  - Ability to work across IT, process, and operations teams.
