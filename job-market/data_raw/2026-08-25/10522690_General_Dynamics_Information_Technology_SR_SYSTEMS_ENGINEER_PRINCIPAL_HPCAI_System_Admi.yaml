  Job Description:

  SYSTEMS ENGINEER PRINCIPAL Advance how our customers operate
  while you advance your career. Join GDIT as a Systems
  Engineer Principal and build an impactful career in
  enterprise IT, collaborating with people who are driven and
  resourceful like you. MEANINGFUL WORK AND PERSONAL IMPACT

  As a Systems Engineer Principal, the work you’ll do at GDIT
  will be impactful to the mission of NOAA’s National Weather
  Service (NWS). You will play a crucial role in sustaining
  and improving the High Performance Computing (HPC) systems
  that generate the nation’s operational weather and climate
  forecasts, enabling NWS to deliver timely, accurate
  information that protects life and property.

  ● Lead/Manage/Support daily HPC system operations and the
  reliability of the scheduling and system software stack that
  powers NOAA’s 24/7 numerical weather prediction mission ●
  Collaborate with experienced GDIT HPC engineers, system
  administrators, developers, and NWS operational staff to
  troubleshoot issues, enhance system performance, and ensure
  consistent delivery of high‑impact forecasting products ●
  Drive improvements in system efficiency, scheduler
  reliability, job throughput, and operational resiliency by
  analyzing complex problems, proposing innovations, and
  supporting implementation of technical enhancements ●
  Utilize Linux system administration, HPC scheduler expertise
  (PBS Pro/Slurm), scripting languages, performance monitoring
  tools, and parallel computing technologies to keep two
  large‑scale supercomputing systems running at peak
  performance

  WHAT YOU’LL NEED TO SUCCEED

  Bring your technology expertise and drive for innovation to
  GDIT. The Systems Engineer Principal must have: ● Education:
  Bachelor of Arts/Bachelor of Science ● Experience: 8+ years
  of related experience ● Technical skills: – Linux system
  administration (Rocky/SLES preferred) – Experience with HPC
  batch schedulers (PBS Pro, Slurm, or similar) – Scripting
  abilities (Bash, Python, Perl) – Understanding of HPC
  architectures, distributed computing, and MPI-based
  workloads – Troubleshooting skills across multi-node HPC
  environments ● US citizenship required ● Role requirements:
  – Ability to participate in an on-call rotation supporting
  24/7 operational systems – Occasional travel for team
  collaboration, training, or customer interaction – Ability
  to work independently as well as collaboratively within a
  distributed technical team

  GDIT IS YOUR PLACE At GDIT, the mission is our purpose, and
  our people are at the center of everything we do. ● Growth:
  AI-powered career tool that identifies career steps and
  learning opportunities ● Support: An internal mobility team
  focused on helping you achieve your career goals ● Rewards:
  Comprehensive benefits and wellness packages, 401K with
  company match, and competitive pay and paid time off ●
  Flexibility: Full-flex work week to own your priorities at
  work and at home ● Community: Award-winning culture of
  innovation and a military-friendly workplace OWN YOUR
  OPPORTUNITY Explore an enterprise IT career at GDIT and
  you’ll find endless opportunities to grow alongside
  colleagues who share your desire to drive operations
  forward.

