description: |
  Why work at Created AI?

  Created AI is the platform where AI video ads get made,
  launched, and measured in one place. We are built by the
  team behind Shameless Snacks and BugMD, brands that grew on
  performance advertising. The ads you make here ship to live
  campaigns on real budgets. We track their performance, and
  what performs gets scaled.

  What you will work on

  - Tinker with models constantly to squeeze quality out of
    them: prompt iteration, reference images, character
    consistency, lip sync
  - Build and refine the generation workflows and prompt
    libraries the whole team runs on
  - Test new models on release day, benchmark them, and tell us
    which one wins for which job
  - Generate performance video ads with the newest models: Veo,
    Seedance, Kling, Sora, and whatever drops next
  - Bring editing judgment to everything you generate: you know
    what a finished ad needs, so your outputs arrive usable
    instead of almost usable
  - Work directly with the Created AI product team; what you
    learn shapes what we build

  Requirements

  Your must haves

  (You do not need to meet every requirement. If you are
  excellent at a few of these and learn fast, we want to hear
  from you.)

  - Advanced hands-on experience with current generative models
    (text to image, image to video, text to video) and a
    working map of the model landscape
  - Strong prompting skill: you can turn a bad output into a
    usable one, fast
  - A video editing background in social media ads. Not because
    you will spend your days editing, but because it is what
    makes your prompting good: you know what the output needs
    before you generate it
  - A portfolio of AI-generated video work
  - Understanding of performance advertising: you know what
    makes people stop scrolling and buy
  - High output and fast adaptation: new model drops are your
    favorite day of the week
  - Strong internet connection
  - Willingness to complete a short test assignment

  Benefits

  The deal

  - Fully remote
  - Serious generation credits and day-one access to the newest
    models
  - Your work runs on real ad budgets for real brands
  - Observed local holidays
