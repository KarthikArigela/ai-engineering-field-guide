description: |
  We believe talent deserves a human touch. Your application
  will be read by an actual person who’s excited to discover
  the real you.

  Summary

  Cyber74, a New Charter Technologies operating company, is
  building a new practice focused on AI security — and we are
  looking for a Security / AI Cloud Engineer to help launch
  it. In this role, you will work at the intersection of cloud
  security and artificial intelligence, helping our clients
  adopt AI tools and platforms safely. You will configure and
  manage security controls across AI-enabled environments,
  including data loss prevention policies, abuse alerting, and
  misconfiguration remediation. This is a greenfield
  opportunity to define a new service area within Cyber74,
  influence our methodology, and become one of the company's
  go-to experts in AI security as clients increasingly
  integrate AI into their operations.

  Primary Responsibilities

  - Design, implement, and manage security controls for AI
    platforms and cloud environments used by Cyber74 clients
    (Microsoft 365 Copilot, Azure OpenAI, Google Workspace AI,
    and similar)
  - Configure and tune Data Loss Prevention (DLP) policies to
    prevent sensitive data exposure through AI tools and
    integrations
  - Develop and maintain alerting rules to detect abuse,
    anomalous behavior, and policy violations within AI-
    enabled platforms
  - Identify, remediate, and track security misconfigurations
    across AI and cloud environments using industry frameworks
    and tooling
  - Conduct security assessments of client AI deployments to
    identify gaps, risks, and areas for hardening
  - Collaborate with the vCISO and compliance teams to
    incorporate AI security considerations into broader client
    security programs
  - Document findings, configurations, and procedures; produce
    clear reports for both technical and executive audiences
  - Monitor the evolving AI security landscape and recommend new
    controls, tools, or policies as AI capabilities and
    threats develop
  - Support pre-sales and scoping conversations by contributing
    technical expertise to proposals and client discussions

  Preferred Skills & Experience

  - 3+ years of experience in cloud security, security
    engineering, or a related role
  - Hands-on experience with Microsoft 365 security tools
    (Defender, Purview/DLP, Conditional Access, Sentinel) or
    equivalent Google/AWS platforms
  - Familiarity with AI platforms and their security surfaces:
    Microsoft Copilot, Azure OpenAI, ChatGPT Enterprise,
    Google Gemini, or similar
  - Experience configuring DLP policies, CASB solutions, or
    similar data security controls in cloud environments
  - Working knowledge of CSPM tools (Microsoft Defender for
    Cloud, Prisma Cloud, Wiz, or similar) for identifying
    misconfigurations
  - Understanding of zero-trust architecture principles and
    their application to AI workloads
  - Relevant certifications preferred: AZ-500, SC-200, SC-400,
    CCSP, or equivalent cloud/security certifications
  - Strong documentation and communication skills; ability to
    explain complex security concepts to non-technical
    stakeholders
  - Salary range of $110k to $130k Dependent on Experience

  Preferred Attributes

  - Intellectually curious and energized by emerging technology;
    excited to build something new rather than maintain the
    status quo
  - Comfortable operating with ambiguity in a greenfield role
    where processes are still being defined
  - Collaborative and team-oriented, able to work cross-
    functionally with compliance, engineering, and client-
    facing teams
  - Strong problem-solving skills with a proactive approach to
    identifying risks before they become incidents
  - Passion for AI and security; keeps up with industry news,
    emerging threats, and evolving best practices
  - Client-focused mindset with the ability to build trusted
    relationships and communicate findings with clarity and
    credibility

  Who We are:

  At New Charter, we’re building a caliber of business the IT
  industry hasn’t yet seen. We are serving small-to-medium
  sized businesses in 10+ industries across North America, and
  we deliver best-in-class technology solutions to propel our
  clients into the digital world.

  At New Charter Technologies, we’re investing in our people –
  through growth and learning initiatives, employee benefits,
