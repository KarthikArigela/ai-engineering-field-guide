description: |
  Build products. Lead by example. Ship fast.

  We're looking for an exceptional engineer who loves building
  software.

  Not someone who mainly manages people.

  Not someone who spends their day in meetings.

  Someone who enjoys solving difficult technical problems,
  shipping production-ready software, making architectural
  decisions and helping other experienced developers become
  even better.

  You'll work directly with the founder and have a significant
  impact on our products, engineering culture and technical
  direction.

  This is a hands-on leadership role.

  What you'll own

  - Design scalable software architecture
  - Build production-ready full-stack applications
  - Lead technical execution across projects
  - Mentor experienced engineers through code reviews and
    technical discussions
  - Drive engineering quality and best practices
  - Integrate AI tools into everyday development workflows
  - Improve deployment pipelines and developer productivity
  - Collaborate directly with founders on product direction

  Our stack

  - Next.js
  - React
  - TypeScript
  - Prisma
  - PostgreSQL
  - Supabase
  - Vercel
  - Stripe
  - Cursor
  - Claude
  - OpenAI APIs

  RequirementsWe're probably a great fit if you...

  - have built real SaaS products used by customers
  - still enjoy writing code every day
  - have led technical projects from idea to production
  - naturally take ownership
  - make architectural decisions confidently
  - use AI coding tools as part of your daily workflow
  - enjoy mentoring senior engineers
  - care about clean software more than trendy technologies

  This role isn't for you if...

  - you're looking for an Engineering Manager position
  - you haven't shipped production software yourself
  - you prefer managing rather than building
  - you avoid AI development tools
  - you're uncomfortable working in a fast-moving environment

  BenefitsWhat we offer

  - 100% Remote
  - Flexible working hours (some overlap with 9-5 CST required)
  - Independent Contractor Agreement
  - Performance Bonus
  - Home Office Budget
  - Health Insurance Reimbursement
  - Paid Time Off
  - High ownership
  - Opportunity to shape the engineering culture
