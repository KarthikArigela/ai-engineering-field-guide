description: |
  Job Summary

  We are seeking a highly experienced and motivated Senior
  SDET to lead the testing from the front. The ideal candidate
  will have a strong background in enterprise-level test
  automation framework development and a passion for
  leveraging artificial intelligence to enhance software
  quality and testing efficiency. You will be responsible for
  managing and implementing successful testing & automation
  projects, solving complex problems, and driving innovation
  within our quality engineering practice.

  Key Responsibilities

  - Architect, design, and implement robust, scalable, and
    maintainable test automation frameworks for enterprise-
    level applications.
  - Lead the integration of AI and machine learning techniques
    into the testing lifecycle to improve test accuracy,
    coverage, and efficiency.
  - Develop and maintain automated test scripts using Java,
    Selenium, and Cucumber BDD.
  - Manage the full lifecycle of testing and automation
    projects, from planning and design to execution, delivery,
    and reporting.
  - Participate in discussions with business stakeholders to
    understand core requirements to ensure thorough test
    coverage.
  - Collaborate with developers, project managers, and other
    stakeholders to understand requirements and ensure
    comprehensive test coverage.
  - Work within a CI/CD pipeline, utilizing tools like Jenkins,
    Urban Deploy, and Lightspeed to ensure continuous quality.
  - Perform database validation and test data management using
    Oracle PL/SQL and Mongo DB.
  - Develop and maintain utility scripts using UNIX Shell
    Scripting and Perl in both LINUX and Windows environments.
  - Analyze test results, identify defects, and work with
    development teams to resolve issues.
  - Mentor junior team members and promote best practices in
    test automation and quality engineering.

  Required Qualifications

  - A minimum of 12+ years of experience in software
    development, with a primary focus on architecting and
    building test automation frameworks for complex,
    enterprise-level finance, or banking applications.
  - Proven experience in AI-related Python and Java development
    and applying AI concepts to solve testing challenges.
  - Deep expertise in creating and maintaining automation
    frameworks using Selenium and Cucumber (BDD).
  - Demonstrated experience in managing and successfully
    implementing large-scale automation projects.
  - Exceptional analytical and problem-solving skills, with a
    proven ability to perform under pressure and adapt to
    changing requirements.
  - Strong proficiency in UNIX/LINUX and Windows environments,
    including hands-on experience with UNIX Shell Scripting
    and Perl scripting.
  - Solid experience working with relational and NoSQL
    databases, specifically Oracle (including PL/SQL) and
    Mongo DB.
  - Hands-on experience with a modern CI/CD toolchain, including
    Jenkins, Urban Deploy, Lightspeed, SONAR, and Maven.
  - Good understanding of finance and accounting terminologies.

