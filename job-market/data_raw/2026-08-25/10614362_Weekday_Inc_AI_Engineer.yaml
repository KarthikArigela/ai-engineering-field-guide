description: |
  This role is for one of Weekday’s clients Salary range: Rs
  1200000 - Rs 3000000 (ie INR 12 - 30 LPA)

  Min Experience: 5+ years Location: Bengaluru JobType: full-
  time

  We are looking for a skilled AI Engineer with 4+ years of
  experience in Artificial Intelligence, Machine Learning,
  NLP, and Generative AI. The ideal candidate will have strong
  hands-on experience building AI/ML solutions, developing
  LLM-powered applications, and rapidly prototyping AI use
  cases across diverse business requirements.

  You will work closely with business stakeholders, product
  teams, and engineering teams to translate business problems
  into scalable AI-driven solutions. The role requires strong
  technical expertise, an experimentation mindset, and the
  ability to take AI concepts from initial proof of concept
  through working prototypes and production-ready solutions.

  RequirementsKey Responsibilities

  - Design and develop innovative AI/ML and Generative AI Proofs
    of Concept (POCs) for diverse business use cases.
  - Translate business requirements and problem statements into
    practical AI-driven technical solutions.
  - Build and deploy LLM-powered applications using models such
    as GPT, Llama, Mistral, Claude, and other foundation
    models.
  - Develop NLP and machine learning solutions for text
    understanding, classification, generation, and other
    business applications.
  - Build AI applications using frameworks such as LangChain,
    LlamaIndex, or Semantic Kernel.
  - Design and implement RAG pipelines, embedding workflows,
    vector search, and knowledge retrieval systems.
  - Rapidly experiment with different models, prompts,
    architectures, and AI techniques to evaluate technical
    feasibility.
  - Develop APIs, microservices, and data pipelines to integrate
    AI capabilities into existing applications.
  - Conduct experiments around model fine-tuning, prompt
    optimization, embeddings, and vector database performance.
  - Evaluate and optimize AI models based on accuracy, latency,
    scalability, cost, and business requirements.
  - Explore emerging AI capabilities including transformers,
    agentic workflows, multimodal models, and advanced RAG
    architectures.
  - Implement lightweight MLOps practices including
    model/version management, evaluation, monitoring, and
    experimentation tracking.
  - Collaborate with business stakeholders and cross-functional
    engineering teams throughout the solution lifecycle.
  - Present POC outcomes, technical findings, feasibility
    assessments, and recommendations to senior stakeholders.
  - Stay current with advancements in Generative AI, LLMs, NLP,
    and Machine Learning and identify opportunities to apply
    them to business problems.

  Required Technical SkillsMust-Have Skills

  - 4+ years of professional experience in AI/ML engineering or
    related roles.
  - Strong hands-on experience in AI/ML (AIML).
  - Strong understanding and practical experience with Natural
    Language Processing (NLP).
  - Hands-on experience with Generative AI and Large Language
    Models (LLMs).
  - Strong proficiency in Python and experience developing
    production-quality APIs and services.
  - Hands-on experience with LangChain or similar LLM
    application frameworks.
  - Understanding of machine learning concepts, model
    evaluation, experimentation, and optimization.
  - Experience developing AI/ML prototypes and rapidly
    validating technical feasibility.
  - Strong understanding of embeddings, vector databases,
    semantic search, and retrieval architectures.
  - Experience working with cloud platforms such as Azure, AWS,
    or GCP.

  Good-to-Have Skills

  - Hands-on experience building RAG (Retrieval-Augmented
    Generation) applications.
  - Experience working with Llama and other open-source LLMs.
  - Experience with Azure OpenAI and related cloud-based GenAI
    services.
  - Experience with LlamaIndex or Semantic Kernel.
  - Exposure to agentic AI, tool calling, and multi-agent
    workflows.
  - Experience with model fine-tuning and prompt engineering.
  - Familiarity with multimodal AI applications.
  - Knowledge of MLOps, model monitoring, evaluation frameworks,
    and AI observability.

  Educational Qualifications

  - Bachelor's or Master's degree in Computer Science,
    Artificial Intelligence, Machine Learning, Data Science,
    Engineering, or a related technical discipline.

  Desired CompetenciesTechnical Competencies

  - Strong understanding of AI/ML, NLP, and Generative AI
    technologies.
  - Ability to design and implement LLM-based applications and
    AI pipelines.
  - Strong programming and API development skills.
  - Ability to rapidly prototype and evaluate emerging AI
    technologies.
  - Understanding of cloud-native AI/ML architectures.

  Behavioral Competencies

  - Strong analytical and problem-solving abilities.
  - Excellent communication and stakeholder management skills.
  - Ability to explain complex AI concepts to both technical and
    non-technical audiences.
  - Strong ownership and an experimentation-oriented mindset.
  - Ability to work effectively in Agile and cross-functional
    environments.
  - Curiosity and willingness to continuously learn and adopt
    emerging AI technologies.

  Ideal Candidate Profile

  The ideal candidate is a hands-on AI Engineer who enjoys
  turning ambiguous business problems into working AI
  solutions. You should be comfortable experimenting with
  different models and architectures, building rapid POCs, and
  collaborating with stakeholders to determine whether an AI
  solution is technically and commercially viable.

  You should have strong practical experience with AIML, NLP,
  LangChain, LLMs, and Generative AI, along with the ability
  to build scalable AI applications using modern cloud
  platforms and engineering practices.

  Success Metrics

  Success in this role will be measured by the quality and
  speed of AI/ML POC development, successful validation of
  business use cases, model and application performance,
  scalability of AI solutions, stakeholder adoption, and the
  ability to translate emerging AI technologies into practical
  business outcomes.
