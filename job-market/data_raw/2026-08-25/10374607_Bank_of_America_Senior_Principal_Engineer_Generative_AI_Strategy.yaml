  Position Summary:

  This job is responsible for defining and leading the
  engineering approach and strategy for AI solutions across GM
  Reg Reporting, to deliver significant business outcomes. Key
  responsibilities include continuously improving the design,
  quality, and reuse of the solution and delivering technology
  enablers that improve development efficiencies for the
  solution. Job expectations include familiarity with at least
  one area of engineering, acting as a “go to” reference
  across the organization, and applying knowledge to improve
  technical competencies through development activities.

  Global Markets Regulatory Reporting Operations Technology is
  a global team with locations in New York City, Charlotte,
  London, Ireland, and India. Generative AI presents an
  exciting opportunity to derive valuable insights from data
  and drive revenue growth, efficiencies, and improved
  business processes. The platform will cater to a rapidly
  growing number of use cases that harness the power of
  Generative AI. Both proprietary and open-source Large
  Language Models, and large structured and un-structured data
  sets will be leveraged to produce insights for Global
  Markets and its clients.

  We are looking for a Senior Principal Engineer to lead and
  execute our Generative AI strategy. The Principal Engineer
  will be a detail-oriented, highly technical, hands-on senior
  software developer, and a key member of the team partnering
  with the GenAI team to help drive AI strategy across GM
  Regulatory Reporting. These solutions will be engineered for
  scalability, performance, reliability, and supportability.

