  Required Qualifications

  - 10+ years of relevant experience
  - Strong experience in Machine Learning, Data Analytics, AI.
  - Experience implementing Generative AI solutions highly
    desirable.
  - Knowledge of Generative AI and machine learning frameworks,
    products, and tools for agentic solutions.
  - Extensive experience in designing & implementing multi-tier
    (including microservices) application platforms.
  - Advanced proficiency in Python, including object-oriented
    techniques, and REST API development.
  - In-depth knowledge of databases, large structured &
    unstructured dataset processing, and messaging is
    important.
  - Proven ability to partner effectively with business
    stakeholders to drive technology strategy and align with
    organizational goals.
  - A self-starter attitude quickly adapts to new technologies
    and industry trends.
  - Strong interpersonal and communication skills to work
    independently and in a collaborative environment.

