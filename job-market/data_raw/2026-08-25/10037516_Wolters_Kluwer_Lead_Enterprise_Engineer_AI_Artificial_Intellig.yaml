description: |
  About the Role: As a Lead Enterprise Software Engineer, you
  will independently execute sophisticated software
  development tasks. Your expertise will drive the creation of
  robust end-user applications and tools, ensuring seamless
  integration and optimal performance in critical business
  domains. Responsibilities:

  - Lead the design and development of intricate software
    applications.
  - Ensure code quality through rigorous code reviews.
  - Develop troubleshooting strategies for complex issues.
  - Conduct comprehensive performance testing and tuning.
  - Create and update extensive technical documentation.
  - Oversee the implementation of new technologies and
    methodologies.
  - Provide technical mentorship to junior engineers.
  - Ensure successful deployment and configuration of software
    systems.
  - Collaborate on architectural and design decisions.
  - Lead initiatives for continuous improvement in software
    processes.

  Required Skills:

  - Strong Python programming and DevOps
  - Strong AI aptitude and heavy exposure to generative and
    agentic AI projects.
  - Agentic AI is our main focus at the moment, but with AI
    things change on a fast cadence
  - Experience including AI tooling for specification driven
    development and QA
  - API programming
  - Automation programming
  - Solid exposure and understanding of AWS and/or Azure
    (preferably both)
  - Solid exposure to IaC, preferably via Terraform
  - Thought leader
  - Strong communication (team, management, and stakeholders)
  - Recent relevant industry certifications strongly desired
    (AI, Python, Cloud, etc.).  Note that yearly
    certifications for FTE Engineers is a requirement.
  - This role doesn't have direct reports, but is expected to be
    able to understand our vision and direction and help lead
    and mentor the team from an Engineering perspective

  Our Interview Practices

  To maintain a fair and genuine hiring process, we kindly ask
  that all candidates participate in interviews without the
  assistance of AI tools or external prompts. Our interview
  process is designed to assess your individual skills,
  experiences, and communication style. We value authenticity
  and want to ensure we’re getting to know you—not a digital
  assistant. To help maintain this integrity, we ask to remove
  virtual backgrounds and include in-person interviews in our
  hiring process. Please note that use of AI-generated
  responses or third-party support during interviews will be
  grounds for disqualification from the recruitment process.

  Applicants may be required to appear onsite at a Wolters
  Kluwer office as part of the recruitment process.
