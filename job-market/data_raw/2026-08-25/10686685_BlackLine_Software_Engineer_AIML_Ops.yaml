description: |
  Make Your Mark:

  We’re looking for a Software Engineer, AI/ML Ops to design,
  build, and optimize data pipelines that power our next-
  generation AI-driven accounting agents. You’ll lead the
  development of scalable, high-performance data
  infrastructure while collaborating closely across teams.
  Responsibilities: - Data pipeline development: Build and
  maintain PySpark ETL pipelines with high data quality and
  performance - Manage integrations: Establish robust
  connections to client data sources via APIs and tools like
  FiveTran, Plaid, and BlackLine’s own internal connector
  ecosystem - Ensure reliability: Monitor pipeline
  performance, automate testing, and validate data accuracy -
  Optimize for scale: Implement performance improvements
  (e.g., CDC mechanisms, indexing strategies) for large-scale
  datasets - Collaborate & innovate: Work with business
  stakeholders to refine data requirements and integrate
  cutting-edge AI and big data technologies

  You'll Get To:

  We're looking for a Software Engineer, AI/ML Ops to design,
  build, and optimize data pipelines that power our next-
  generation AI-driven accounting agents. You'll lead the
  development of scalable, high-performance data
  infrastructure while collaborating closely across teams.
  Responsibilities:

  - Data pipeline development: Build and maintain PySpark ETL
    pipelines with high data quality and performance
  - Manage integrations: Establish robust connections to client
    data sources via APIs and tools like FiveTran, Plaid, and
    BlackLine's own internal connector ecosystem
  - Ensure reliability: Monitor pipeline performance, automate
    testing, and validate data accuracy
  - Optimize for scale: Implement performance improvements
    (e.g., CDC mechanisms, indexing strategies) for large-
    scale datasets
  - Collaborate & innovate: Work with business stakeholders to
    refine data requirements and integrate cutting-edge AI and
    big data technologies

  What You'll Bring:

  - 2+ years of experience with programming skills in languages
    such as Python, Java, or Scala.
  - Expertise in ML frameworks (TensorFlow, PyTorch, scikit-
    learn) and orchestration tools (Airflow, Kubeflow, Vertex
    AI, MLflow).
  - Proven experience operating production pipelines for ML and
    LLM-based systems across cloud ecosystems (GCP, AWS,
    Azure).
  - Deep familiarity with LangChain, LangGraph, ADK or similar
    agentic system runtime management.
  - Strong competencies in CI/CD, IaC, and DevSecOps pipelines
    integrating testing, compliance, and deployment
    automation.
  - Hands-on with observability stacks (Prometheus, Grafana,
    Newrelic) for model and agent performance tracking.
  - Understanding of governance frameworks for Responsible AI,
    auditability, and cost metering across training and
    inference workloads.
  - Proficiency in containerization technologies (e.g., Docker,
    Kubernetes).

  We’re Even More Excited If You Have:

  Operations and Infrastructure:

  - Proficient in scripting languages (e.g., Bash, python) for
    automation.
  - Experience with workflow orchestration tools (e.g., Apache
    Airflow).
  - Expertise in managing and optimizing cloud-based
    infrastructure.
  - Familiarity with DevOps practices and tools for automated
    deployment.
  - Understanding of network configurations and security
    protocols. Problem-solving and Critical Thinking:
  - Ability to define problems, collect and analyze data, and
    propose innovative solutions. Strong critical thinking
    skills to evaluate models, identify limitations, and
    Adaptability and Learning Agility:
  - Comfortable working in a fast-paced, rapidly evolving
    environment. Proactive in staying up to date with the
    latest trends, techniques, and technologies in AI/data
    science

  Thrive at BlackLine Because You Are Joining:

  - A technology-based company with a sense of adventure and a
    vision for the future. Every door at BlackLine is open.
    Just bring your brains, your problem-solving skills, and
    be part of a winning team at the world's most trusted name
    in Finance Automation!
  - A culture that is kind, open, and accepting. It's a place
    where people can embrace what makes them unique, and the
    mix of cultural backgrounds and varying interests
    cultivates diverse thought and perspectives.
  - A culture where BlackLiner's continued growth and learning
    is empowered. BlackLine offers a wide variety of
    professional development seminars and inclusive affinity
    groups to celebrate and support our diversity.

