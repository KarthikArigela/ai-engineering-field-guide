description: |
  Job Summary:

  The Senior AI Agentic Engineer, based in Athens, Greece,
  bridges both worlds — owning the product vision and roadmap
  for Profile One, while leading the technical architecture of
  our AI projects. This is a hybrid role for someone who
  thinks in products and builds in systems, equally
  comfortable defining what gets built and getting into the
  detail of how it works.

  What will you need to do:

  Agentic architecture and engineering

  •      Own the architecture of the Group's agentic platform:
  orchestration patterns (supervisor / sub-agent), agent
  decomposition, tool-calling design, memory and state
  management, error handling and human-in-the-loop
  integration.

  •      Lead implementation across the agent framework stack
  — LangGraph, LangChain or equivalent — with a strong opinion
  on framework choice and lifecycle.

  •      Design integration patterns with our systems of
  record, with primary focus on read-side integration via the
  SQL / T-SQL output layer.

  •      Define and operate the evaluation layer — golden
  datasets, regression suites, agent-level metrics and human
  review workflows for non-deterministic outputs.

  •      Own the observability and tracing stack (Langfuse,
  CloudWatch) and the runtime quality, latency and cost
  envelope of the platform.

  Team leadership and capability build

  •      Lead the in-house agentic engineering team (Agent
  Developer, Data Engineer) with technical mentorship, code
  review.

  •      Manage the relationship with our external delivery
  partner during the PoC phase; define the transition plan
  from external-led delivery to internal ownership of core
  capability.

  Use case delivery and commercialisation

  •      Partner with our operations team and with Group
  commercial leads to convert client demand (process
  automation, reconciliation, exception handling,
  communications) into deployed agents.

  •      Translate operational process descriptions into agent
  designs — including with input from Business Analysts and
  operations subject-matter experts.

  •      Own production readiness: SLOs, security review,
  regulatory alignment (DORA, MiFID II, GDPR, NIS2), and
  acceptance criteria for client-facing pilots.

  Cross-functional engagement

  •      Work alongside the ProfileOne Product Manager on the
  architectural separation between unifying layer and agentic
  platform.

  •      Partner with the AWS infrastructure / DevOps function
  on production deployment, scaling and security hardening.

  •      Represent the agentic platform in client technical
  discussions, internal SteerCo updates and Group-level
  architectural reviews.

  Requirements

  What You Will Bring:

    •      8+ years in software engineering, including 3+
  years actively building production systems on top of LLMs or
  agentic frameworks (not only experimentation or
  prototyping).

  •      Strong experience in the banking and wealth
  management domain, with understanding of financial products,
  investment workflows, portfolio management, client
  servicing, and the operational and regulatory constraints of
  financial institutions.

  •      Hands-on, recent experience with at least one agentic
  framework — LangGraph, LangChain, AutoGen, CrewAI, or
  comparable — including supervisor / multi-agent patterns.

  •      Strong AWS engineering background (Bedrock, Lambda,
  S3, IAM, CloudWatch); production operating experience on
  AWS-native AI/ML stacks.

  •      Demonstrated experience designing evaluation
  frameworks for non-deterministic AI outputs: golden
  datasets, regression testing, human review workflows, agent-
  level metrics.

  Benefits

    What We Offer:

  ·        Competitive and performance-based remuneration.

  ·        Meal Vouchers.

  ·        Medical & Life Insurance Plan.

  ·        New experiences within a multinational environment
  and global teams.

  ·        Team spirit environment with passion for
  technology.

  ·        Development opportunities within a market-leading,
  fast-growing organization!

  If you want to be part of one of the top leading software
  firms in the FinTech industry internationally, we want to
  hear from you!

  We are an equal opportunities employer. All applications
  will be treated with strict confidentiality. By submitting
  your CV, you accept the content of our Privacy Policy, and
  consent to the processing of your data as part of this
  application.

  About Profile:

  Founded in 1990, Profile Software is a leading international
  software solutions provider for the Banking and Investment
  Management industries, with global offices in key financial
  centers and presence in 50 countries across 4 continents, as
  well as a listed company in Athens Stock Exchange.

  Thanks to our passionate, highly aspirated and tech savvy
  people, we deliver innovative, agile, and award-winning
  solutions to the biggest FinTech institutions, always aiming
  to develop on cutting-edge technologies (mobile, cloud, AI),
  offering various deployment methods (BPO, SaaS) and
  competitive functionality.
