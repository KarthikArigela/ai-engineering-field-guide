description: |
  Overview

  The Microsoft AI Frameworks team develops the software,
  performance systems, and engineering tools that enable
  state-of-the-art AI models to run reliably and efficiently
  at cloud scale. We work across model architectures,
  frameworks, compilers, runtimes, libraries, observability,
  benchmarking, and hardware platforms—including NVIDIA and
  AMD GPUs and Microsoft silicon. Our engineers, partner with
  model developers, researchers, hardware teams, and
  production services to accelerate model onboarding, improve
  performance and reliability, reduce deployment time and
  hardware footprint, and turn performance insights into
  durable platform capabilities.

  This is a hands-on technical leadership role for an engineer
  who can establish direction and lead teams through
  ambiguous, end-to-end systems challenges. Successful
  candidates combine strong software engineering fundamentals
  with deep curiosity about AI workloads, use disciplined
  measurement to guide decisions, and create alignment across
  organizational boundaries to deliver measurable production
  impact.

  As a Principal Software Engineer - AI Frameworks, you will
  serve as a technical lead for high-impact initiatives
  spanning AI frameworks, performance engineering,
  benchmarking, and tooling. You will establish technical
  direction, make consequential architectural decisions, and
  lead engineers across teams through the design and delivery
  of solutions that improve model velocity, platform
  efficiency, and production reliability. You will also
  identify systemic opportunities, align stakeholders around
  durable architectures and success measures, and remain
  hands-on in critical areas of implementation.

  At Microsoft, our mission to empower every person and every
  organization on the planet to achieve more guides how we
  partner with customers to deliver trusted, impactful
  solutions. With a growth mindset culture, we innovate
  responsibly and measure success by shared progress people,
  teams, and customers. Join us to do meaningful work that
  changes the world and helps shape what’s next for everyone. 

  Responsibilities

  - Own the technical vision, architecture, roadmap, and multi-
    release execution strategy for critical AI framework,
    performance, benchmarking, or developer-productivity
    capabilities.

  - Lead technical alignment across teams by shaping
    architecture and priorities, resolving competing
    requirements, and holding researchers, product groups,
    infrastructure owners, and hardware partners accountable
    to clear decisions, execution plans, and measurable
    outcomes.

  - Build technical leadership capacity across the organization
    by mentoring engineers, developing emerging technical
    leads, establishing high standards for quality and
    maintainability, and creating an inclusive engineering
    culture in which teams can execute effectively at scale.

  - Steer ambiguous, cross-stack investigations and investments
    spanning models, frameworks, compilers, runtimes, systems,
    services, and silicon; set technical priorities, resolve
    trade-offs, and drive teams to decisions.

  - Provide hands-on technical leadership by setting the
    engineering approach, delegating and unblocking critical
    work, and directly contributing through prototypes,
    critical-path implementation, design and code reviews,
    complex debugging, and operational readiness.

  - Spearhead common measurement, automation, observability, and
    engineering mechanisms that turn one-off analyses into
    scalable platform capabilities.

  - Drive measurable improvements in model onboarding velocity,
    runtime performance, reliability, hardware utilization,
    and Azure capacity efficiency.

  - Embody Microsoft’s culture and values.





  Qualifications

  Required Qualifications:

  - Bachelor’s Degree in Computer Science or a related technical
    field and 8+ years of technical engineering experience
    coding in languages such as C++ or Python,
    - OR equivalent experience.

  Other Requirements:

  - Ability to meet Microsoft, customer and/or government
    security screening requirements are required for this
    role. These requirements include but are not limited to
    the following specialized security screenings: Microsoft
    Cloud Background Check: This position will be required to
    pass the Microsoft Cloud background check upon
    hire/transfer and every two years thereafter.

  Preferred Qualifications:

  - Master's Degree in Computer Science or related technical
    field AND 12+ years technical engineering experience with
    coding in languages including, but not limited to, C++ or
    Python

    - OR Bachelor's Degree in Computer Science or related
      technical field AND 15+ years technical engineering
      experience with coding in languages including, but not
      limited to, C++ or Python

    - OR equivalent experience.

  - Demonstrated experience serving as a technical lead for
    complex cross-team initiatives, including setting
    strategy, making architectural decisions, aligning
    stakeholders, and driving execution from concept through
    production.

  - Robust/extensive experience designing and shipping complex,
    high-performance or distributed software systems

  - Deep foundation in software architecture, computer
    architecture, and accelerator-aware optimization

  - Advanced experience with AI/ML workloads and frameworks

  - Proven track record of creating reusable platforms,
    influencing senior technical and business stakeholders,
    developing other technical leaders, and scaling
    engineering practices across teams.

