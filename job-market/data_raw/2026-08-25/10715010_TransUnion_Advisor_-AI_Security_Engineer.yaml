  TransUnion's Job Applicant Privacy Notice

  Team Overview

  At TransUnion, we have a welcoming and energetic environment
  that encourages collaboration and innovation – we’re
  consistently exploring new technologies and tools to be
  agile. This environment gives our people the opportunity to
  hone current skills and build new capabilities, while
  discovering their genius.  Come be a part of our team –
  you’ll work with great people, pioneering products and
  cutting-edge technology.

  This is a hybrid position and involves regular performance
  of job responsibilities virtually as well as in-person at an
  assigned TU office location for a minimum of two days a
  week.

  Role Overview And Core Responsibilities

  Key Responsibilities

  1. AI & LLM Guardrails and Agent Security

  - Enterprise Guardrails: Design, implement, and enforce LLM
    guardrails across user/desktop applications and cloud-
    hosted environments to prevent prompt injection, data
    exfiltration, and toxic outputs.

  - AI Agent Security: Architect and implement secure execution
    boundaries, sandboxing, and identity/access management
    (IAM) frameworks specifically tailored for autonomous
    cloud-hosted AI agents.

  - Threat Modeling: Conduct advanced threat modeling on LLM
    architectures, RAG (Retrieval-Augmented Generation)
    pipelines, and agentic workflows.

  2. Cloud Security & Data Loss Prevention (DLP)

  - Multi-Cloud Engineering: Configure and maintain strict
    security postures across AWS and GCP environments hosting
    AI workloads.

  - Advanced DLP: Define, implement, and monitor robust Data
    Loss Prevention (DLP) policies across cloud
    infrastructures to ensure sensitive enterprise data is not
    inadvertently ingested or exposed by AI models.

  3. DevSecOps & Pipeline Integration

  - CI/CD Automation: Integrate automated security scanning
    directly into enterprise deployment pipelines using
    orchestration tools like Harness.

  - Artifact Security: Manage and secure software packages,
    model weights, and dependencies within JFrog Artifactory,
    ensuring comprehensive vulnerability scanning before
    deployment.

  - AI for Security: Design, develop, and implement custom
    security scanning capabilities powered by machine learning
    and AI to detect anomalies, code vulnerabilities, and
    misconfigurations.

  Required Knowledge And Experiences

  Required Criteria:

  - Cybersecurity Foundation: Minimum of 10 years of dedicated
    experience within the cybersecurity domain (e.g., AppSec,
    Cloud Security, or DevSecOps).

  - AI Security Specialization: Minimum of 3 years of hands-on
    experience specifically focused on AI/ML security, LLM
    vulnerabilities (OWASP Top 10 for LLMs), and guardrail
    frameworks (e.g., Agent Gateway, Model Armor Guardrails,
    Llama Guard, or other cloud-native equivalents).

  - Cloud Proficiency: Proven experience configuring security
    policies, IAM, and DLP tools natively within AWS and GCP.

  - Pipeline Expertise: Deep understanding of modern CI/CD tools
    (specifically Harness) and artifact management platforms
    (Artifactory).

  Preferred / "Added Advantage" Criteria:

  - Containerization & Orchestration: Strong working experience
    securing containerized workloads using Docker and managing
    security policies within Kubernetes (K8s)environments
    (e.g., network policies, pod security standards).

  - Coding/Scripting: Proficiency in Python, Go, or similar
    languages to develop custom AI-driven security scanning
    utilities.

  - Certifications: Relevant certifications such as AWS
    Certified Security, Google Professional Cloud Security
    Engineer, CISSP, or specialized AI/ML security
    credentials.

  TransUnion Overview:

  At TransUnion, we encourage and are committed to creating a
