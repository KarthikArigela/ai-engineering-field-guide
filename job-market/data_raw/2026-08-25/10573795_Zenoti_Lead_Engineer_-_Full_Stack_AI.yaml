description: |
  Zenoti provides an all-in-one, cloud-based software solution
  for the beauty and wellness industry. Our solution allows
  users to seamlessly manage every aspect of the business in a
  comprehensive mobile solution: online appointment bookings,
  POS, CRM, employee management, inventory management, built-
  in marketing programs and more. Zenoti helps clients
  streamline their systems and reduce costs, while
  simultaneously improving customer retention and spending.
  Our platform is engineered for reliability and scale and
  harnesses the power of enterprise-level technology for
  businesses of all sizes

  Zenoti powers more than 30,000 salons, spas, medspas and
  fitness studios in over 50 countries. This includes a vast
  portfolio of global brands, such as European Wax Center,
  Hand & Stone, Massage Heights, Rush Hair & Beauty, Sono
  Bello, Profile by Sanford, Hair Cuttery, CorePower Yoga and
  TONI&GUY.

  Our recent accomplishments include surpassing a $1 billion
  unicorn valuation, being named Next Tech Titan by GeekWire,
  raising an $80 million investment from TPG, ranking as the
  316th fastest-growing company in North America on Deloitte’s
  2020 Technology Fast 500™. We are also proud to be
  recognized as a Great Place to Work CertifiedTM for
  2021-2022 as this reaffirms our commitment to empowering
  people to feel good and find their greatness. To learn more
  about Zenoti visit: https://www.zenoti.com

  What will I be doing ?

  - Own the end-to-end development and technical success of one
    or more product modules, delivering exceptional customer
    experiences.
  - Design, build, and evolve highly scalable SaaS applications
    using .NET/C#, REST APIs, SQL/NoSQL, and Flutter/React
    capable of supporting 2–4× annual business growth.
  - Collaborate closely with Product Managers, Designers, and
    fellow Engineers to deliver customer-centric features in
    an agile environment.
  - Own the complete software lifecycle—from design and
    implementation through code reviews, testing, deployment,
    monitoring, and continuous improvement.
  - Leverage modern AI-assisted development tools (e.g., Claude
    Code, Cursor) throughout the engineering lifecycle for
    design exploration, implementation, debugging, testing,
    documentation, and code reviews.
  - Apply sound engineering judgment to determine where AI-
    generated output can be trusted and where human expertise
    is essential, particularly in areas involving security,
    data integrity, architecture, compliance, and customer-
    critical workflows.
  - Build reusable engineering assets—including prompts,
    workflows, templates, and automation—that improve the
    productivity and effectiveness of the broader engineering
    team.
  - Continuously improve engineering velocity, code quality,
    reliability, and developer productivity through automation
    and AI-native engineering practices.

  What skills do I need?

  - 8+ years of experience designing and building enterprise-
    scale SaaS applications using Microsoft technologies
    (.NET/C#, REST APIs, SQL Server/NoSQL) and modern UI
    frameworks such as Flutter or React.
  - 5+ years of experience building highly available, massively
    scalable, distributed cloud services (AWS or Azure)
  - Strong system design, analytical thinking, and problem-
    solving skills with the ability to own complex technical
    problems.
  - Hands-on experience using modern AI-assisted development
    tools (e.g., Copilot, Claude Code, Cursor) in a production
    environment.
  - Strong engineering judgment to critically review AI-
    generated code, especially in areas involving security,
    performance, scalability, reliability, and data integrity.
  - Excellent communication and collaboration skills.
  - Comfortable working in a fast-paced, continuously evolving
    product organization.
  - Experience building developer productivity tooling, prompt
    libraries, reusable workflows, MCP servers, or AI-enabled
    engineering automation is a plus.
  - Exposure to Flutter for mobile application development is a
    plus.
  - Passion for continuously learning emerging AI-assisted
    engineering practices and applying those that create
    measurable customer and engineering value.

