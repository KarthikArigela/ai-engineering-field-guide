description: |
  Collinson is a global loyalty and benefits company.



  We use our expertise and products to craft customer
  experiences which enable some of the world’s best known
  brands to acquire, engage and retain the most demanding and
  choice-rich customers. In particular, our unique expertise
  and insight into high earning, frequent travellers allows us
  to create products and solutions for our clients that
  inspire greater customer engagement to drive more profitable
  relationships, enrich their travel experiences, protect what
  matters and assist in in times of need.



  While specialising in Financial Services, Travel and Retail,
  we also support clients in multiple sectors. We have worked
  with over 90 airlines, 20 hotel groups and more than 600
  financial institutions and banks, with clients including
  Accor Hotels, Air France KLM, American Express, British
  Airways, Cathay Pacific, Diners Club, Mandarin Oriental,
  Mastercard, Radisson Hotel Group, Sephora, Visa and Vhi.



  We take our 30 years’ experience working with these kinds of
  household names in over 170 countries, and help our clients
  to deliver the smarter experiences it takes to differentiate
  their propositions, and help them win deeper devotion with
  their customers.



  Collinson is a privately-owned entrepreneurial business with
  2,000 passionate people working in 20 locations worldwide.
  Our solutions include Priority Pass, the world’s best known
  airport experiences programme, while we are also the trusted
  partner behind many of the leading financial services,
  airline and hotel brand’s reward programmes and loyalty
  initiatives.



  Purpose of the job

  As an AI Engineer, you’ll play a key role in designing,
  building and operating AI powered features that are used by
  real customers and colleagues at scale. You’ll work hands-on
  with large language models and modern engineering frameworks
  to turn ideas into reliable, production ready systems that
  deliver measurable value. This role sits at the intersection
  of engineering, product and data, requiring both strong
  technical execution and thoughtful collaboration.

  This is a practical, delivery focused role where shipping
  matters. You’ll be involved throughout the lifecycle, from
  identifying high value opportunities for AI, through
  prototyping and integration, to monitoring and improving
  systems once they are live. You’ll balance experimentation
  with robustness, ensuring solutions are scalable, secure and
  cost effective while meeting real user needs.

  We welcome applicants from diverse backgrounds who enjoy
  building, learning and iterating in collaborative teams. You
  are someone who is comfortable navigating uncertainty,
  making evidence based decisions and refining approaches as
  models, tools and requirements evolve. You combine curiosity
  with pragmatism, helping the team make sensible choices
  around performance, reliability, privacy and risk, and
  ensuring AI is applied thoughtfully to solve meaningful
  problems.

  Key Responsibilities



  ·       AI Feature Design & Delivery – Design, build and run
  AI powered features using large language models, translating
  product ideas into reliable, scalable production systems
  that deliver measurable impact.

  ·       LLM Integration & System Architecture – Integrate
  LLMs into existing applications and services, shaping
  backend architectures and APIs that balance performance,
  cost, security and maintainability.

  ·       Prompt Engineering & Model Optimisation – Develop,
  test and refine prompt strategies to improve model accuracy,
  safety, latency and cost efficiency across different use
  cases.

  ·       Hands-On Engineering – Build and maintain backend
  services and APIs using TypeScript and modern frameworks,
  contributing clean, well documented and maintainable code
  aligned with engineering best practice.

  ·       Cross-Functional Collaboration – Work closely with
  product, data and design partners to identify high value AI
  opportunities and shape solutions that are feasible,
  testable and aligned to user needs.

  ·       Evaluation & Monitoring – Define and implement
  evaluation approaches for LLM based systems, including
  logging, metrics and experimentation, to continuously
  improve quality and reliability in production.

  ·       Scalable AI Patterns – Contribute to shared
  approaches, architectural patterns and standards for
  building AI driven features across the platform.

  ·       Risk, Privacy & Cost Awareness – Make informed
  engineering decisions that consider data privacy, model
  risk, operational resilience and commercial constraints.

  ·       Continuous Learning & Innovation – Stay current with
  emerging AI technologies, tools and techniques, proactively
  recommending improvements that enhance outcomes for users
  and teams.



  Knowledge, skills and experience required

  Our tech stack includes Typescript (Node.js and React), AWS,
  Kubernetes, DataDog, GraphQL, PostgreSQL, Mongo, and Kafka.



  We’re looking for someone who brings:

  ·       A strong foundation in software engineering, with
  hands-on experience building, shipping and operating
  scalable, production-grade systems.

  ·       Proven experience working with modern JavaScript and
  TypeScript stacks, including Node.js and associated backend
  frameworks, and confidence contributing to clean,
  maintainable codebases.

  ·       Practical experience integrating large language
  models into real applications, using APIs such as OpenAI,
  Anthropic or similar, with an understanding of prompt
  design, evaluation and operational trade-offs.

  ·       Confidence designing and working with APIs and
  backend services, including RESTful architectures and
  integration patterns that support reliability and scale.

  ·       Familiarity with cloud-native environments and
  production tooling, including containerisation, monitoring
  and deployment practices, ideally within AWS-based
  ecosystems.

  ·       Experience working with data stores such as
  PostgreSQL, MongoDB and or vector databases, with an
  understanding of how data design supports AI driven use
  cases.

  ·       The ability to reason about cost, latency, privacy
  and risk when designing AI powered systems, and to make
  pragmatic engineering decisions within real-world
  constraints.

  ·       Strong problem solving skills and attention to
  detail, with a mindset oriented toward iteration, evidence
  and continuous improvement.

  ·       The ability to communicate complex technical
  concepts clearly and simply to a range of audiences, from
  engineers to product partners and non-technical
  stakeholders.

  ·       Curiosity and adaptability, with a genuine interest
  in staying current with emerging AI tools, techniques and
  best practices, and applying them thoughtfully rather than
  reactively.

  ·       A collaborative approach and empathy for users and
  teammates, contributing positively to a team environment and
  shared ownership of outcomes.

  We encourage applications from people who want to grow into
  this role and welcome those who bring diverse perspectives,
  career paths, and experiences.
