description: |
  About Tapcart

  At Tapcart, we believe every brand needs a direct
  relationship with their customers - one they actually own.

  We're the mobile commerce engine that powers shopping for
  Shopify's fastest-growing brands. $15B+ in revenue
  processed. 200M+ shoppers worldwide. Brands like Princess
  Polly, Béis, Forever 21, and Young LA rely on us to power a
  large portion of their revenue.

  We're a lean team with minimal management and big autonomy.
  Everyone here builds - engineers, product, leadership, and
  GTM. We use our own platform, we talk to merchants daily,
  and we ship constantly. Backed by Shopify, Silver Lake, and
  other top VCs. Profitable and growing!

  About the role

  Tapcart has been building a fleet of AI agents that run real
  work across the company. On the go-to-market side, that
  means OpenClaw agents and agentic workflows that plug
  directly into how our Sales, Marketing, Account Management,
  and Partnerships teams operate.

  We're looking for an AI Ops Engineer to partner with the
  Founder/CEO and VP Operations to build out the skills,
  workflows, and automations that make those agents genuinely
  useful. You'll be turning "wouldn't it be great if the agent
  could just do X" into shipped capability. This is a hands-on
  builder role: you're writing the agent skills, wiring up the
  integrations, and closing the loop between what GTM teams
  need and what the agents can actually do.

  It's a rare seat - you'll be at the center of how a company
  actually operationalizes AI agents, not on the sidelines
  theorizing about it.

  Why you should join Tapcart

  - You want to work with colleagues who have high standards and
    who love building beautiful, performant software
  - You want outsized ownership and visibility early in your
    career - reporting directly to the Founder/CEO (who also
    leads our Product & Eng teams) and VP Operations, not
    buried a few layers down
  - You want to spend your early career building AI agents that
    people actually depend on every day, not prototypes that
    never ship

  We deeply care about using AI in our work. Don't proceed
  with applying if:

  - You don't love agents / don't use them daily
  - You don't value craft and cannot speak to software that
    inspires you

  What you'll do

  - Build and maintain OpenClaw (& other agentic) skills and
    workflows across the GTM org
  - Partner with Sales, Marketing, CS/AM, and Partnerships to
    find high-leverage tasks worth automating, then ship them
  - Wire agents into the tools GTM already lives in - connecting
    APIs, data sources, and third-party services
  - Prototype fast, get it in front of real users, iterate on
    feedback
  - Own reliability: when an agent workflow breaks, you diagnose
    and fix it

  Qualifications

  - 0-2 years of experience - new grads and early-career
    builders welcome!
  - Hands-on OpenClaw or agentic experience (e.g., Hermes Agent,
    LangChain, AutoGPT, and custom LLM/API projects) is a
    must. You've built agent skills/workflows and know how the
    framework actually behaves, not just in theory. Bonus if
    you have experience with AI asset generation, security and
    compliance.
  - A genuine go-getter - you don't wait to be told what to
    build. You spot the problem, propose the fix, and ship it.
  - Comfortable picking up new tools fast (our stack is easy;
    adaptability matters more than any specific line item on
    your resume)
  - Clear communicator who can talk to executives and GTM teams
    and collaboratively translate their needs into working
    automation
  - A Github that is more green than black

  Nice to have

  - A track record of side projects, hackathons, or things you
    built just because you wanted them to exist
  - Experience with Zapier, n8n, or similar automation platforms
  - Bonus if you've touched a modern cloud/data stack (we run on
    GCP, MongoDB, and ClickHouse) - but we'll teach you what
    you need

  Salary Range

  $90,000 - $140,000 (depending on experience level)

  Benefits

  Competitive salary and equity. Medical, dental, vision.
  401(k). Flexible PTO. Remote-friendly. Home office stipend.
  Quarterly merchant stipend. Lots of swag drops.

  How to Apply

  Skip the cover letter. Send us a link to something you've
  built - a GitHub repo, an agent project, anything you're
  proud of - along with your resume.
