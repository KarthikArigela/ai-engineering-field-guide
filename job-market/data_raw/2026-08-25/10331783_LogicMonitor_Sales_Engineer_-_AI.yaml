description: |
  About Us:

  We love going to work and think you should too. Our team is
  dedicated to trust, customer obsession, agility, and
  striving to be better everyday. These values serve as the
  foundation of our culture, guiding our actions and driving
  us towards excellence. We foster a culture of performance
  and recognition, allowing us to transform growth as we
  enable our employees to do the best work of their careers.

  This position is located in London, England. Our office is
  situated in a core location near Waterloo and Blackfriars on
  the Southbank. Across the globe, our Centers of Energy serve
  as hubs where we accelerate productivity and collaboration,
  inspire creativity, and cultivate a culture of connection
  and celebration. Our teams coordinate their time in Centers
  of Energy to reflect how they work best.

  To learn more about life at LogicMonitor, check out our
  Careers Page.

  What You'll Do:

  LogicMonitor® is the AI-first hybrid observability platform
  powering the next generation of digital infrastructure.
  LogicMonitor delivers complete visibility and actionable
  intelligence across on-premises, cloud, and edge
  environments. By anticipating issues before they strike,
  optimizing resources in real time, and enabling faster,
  smarter decisions, LogicMonitor helps IT and business
  leaders protect margins, accelerate innovation, and deliver
  exceptional digital experiences without compromise.

  Our customers love LogicMonitor's ability to bring cloud and
  traditional IT together into one view, as seen in minimal
  churn rates, expansion business, and exciting new customer
  references. In fact, LogicMonitor has received the highest
  Net Promoter Score of any IT Infrastructure Management
  provider. LogicMonitor also boasts high employee
  satisfaction. We have been certified as a Great Place To
  Work®, and named one of BuiltIn's Best Places to Work for
  the seventh year in a row!

  The mission of the Specialist Sales Engineer (SSE) at
  LogicMonitor is to support the technical evaluation of
  LogicMonitor by proving out value in the extended LM
  platform to our prospects in the pre-sales process. The SSE
  also is also looked at as a technical product expert within
  the AI and APM portions of the platform. Specialist Sales
  Engineers have the critical function to learn new
  technologies on the fly, as well as demonstrating those
  technologies to customers.

  Here's a closer look at this key role:

  - Work as a team with the CSM, AE and SE during the sales
    process.
  - Lead Edwin AI discovery, demos, and proof-of-value
    engagements, aligning Edwin capabilities to customer
    business and operational challenges.
  - Optimize Edwin evaluations by proactively configuring use
    cases, workflows, prompts, dashboards, and demonstrations
    that showcase customer value.
  - Deliver ongoing Edwin AI training and enablement for Sales,
    SEs, and customer-facing teams.
  - Serve as the primary technical advisor for Edwin prospects,
    providing product guidance, best practices, and technical
    support throughout the evaluation process.
  - Document customer meetings, technical requirements, use
    cases, and evaluation outcomes in Salesforce.
  - Translate customer operational challenges into Edwin AI
    solutions, clearly articulating business value, technical
    capabilities, and expected outcomes.
  - Drive customer success during evaluations by identifying and
    resolving technical obstacles, ensuring a positive
    experience through all stages of the sales cycle.

  What You'll Need:

  - Bachelor's Degree in Computer Science or technical degree
    preferred
  - 5+ years experience in SysAdmin, Site Reliability or Sales
    Engineering role
  - Able to articulate technology and product positioning to
    both business and technical users
  - Able to establish and maintain strong relationships
    throughout the sales cycle
  - Experience in Linux and or Windows/Network administration
    and operations including the following technologies
    desired:
    - Virtualization (VMWare, Hyper-V, Xen Server, etc…)
    - Storage (Netapp, EMC, HPLeftHand, Dell Equallogic, etc…)
    - LoadBalancers (f5 bigIP, Netscaller, Barracuda, etc…)
    - WMI, PerfMon, JDBC, SNMP, SMTP, JMX
    - Webservers (IIS, Apache, Tomcat, etc…)
    - Active Directory
    - Database (SQL, MySQL, Postgress, etc…)
    - Scripting (groovy, powershell, ruby, etc...)
  - Experience with support team methodologies/practices
    desired.
  - Experience with correlation engines desired.
  - Experience using AI tools to enhance productivity,
    innovation, or problem-solving.

