description: |
  Integration meets Innovation

  At Celigo, we believe integration should empower — not
  exhaust — innovation. As a modern Integration and Automation
  Platform (iPaaS), we’re on a mission to simplify how
  companies integrate, automate, and optimize processes.
  Powered by game-changing technology like runtime AI and
  prebuilt, mission-critical integrations, Celigo is
  redefining how businesses connect their world.

  We are seeking a Senior Integrations Engineer with expertise
  in Enterprise System Integrations and Business Process
  Automation. In this role, you will design, build, and deploy
  scalable integration solutions and automations, as well as
  develop AI chatbots using various technologies across
  multiple domains.

  The Global Technology Operations team is dedicated to
  digitally transforming and scaling Celigo's business,
  enhancing productivity, and improving operational
  efficiency. We work closely with top talent across the
  company to drive both our business operations and product
  development. As an Integrations Engineer, you will support
  the business and finance teams by seamlessly connecting
  systems and data. Additionally, you will build automations
  using integrator.io and AI concepts to eliminate redundant
  tasks, enabling teams to focus on higher-value activities.

  What would you do if hired?

  - Champion the Celigo product through transformational
    integrations that enable scalable business growth.
  - Design, build, and deliver scalable data pipelines
    leveraging modern cloud architectures.
  - Collaborate with business process experts to develop
    solutions for complex systems and data platforms that
    drive revenue growth.
  - Ensure your integrations adhere to engineering best
    practices, emphasizing data quality, accuracy,
    operability, and security.
  - Contribute to the development of AI chatbots for internal
    stakeholders.
  - Build and maintain trusted relationships with technical and
    business teams.
  - Manage multiple projects concurrently, including operational
    tasks.
  - Serve as the owner and final escalation point for your
    integrations.
  - Produce clear, accurate technical documentation, develop
    support processes and procedures, and facilitate smooth
    hand-offs to peers and other organizational units.

  Who are we looking for?

  Experience & Technical Expertise:

    - Proven experience in developing AI agents or bots that
      autonomously interact with various tools and systems to
      derive and act upon business insights.
    - Expertise in integrating Large Language Models (LLMs) such
      as OpenAI's GPT series, Google's Gemini, or Anthropic's
      Claude with external APIs, vector databases, and
      enterprise platforms to automate workflows and enhance
      decision-making processes.
    - Strong understanding of prompt engineering, context
      management, and the orchestration of multi-step tasks
      using AI-driven solutions.
    - At least 5 years designing and building integration
      solutions, ideally within Sales or Customer Success
      domains.
    - Proficient with Enterprise iPaaS platforms (Celigo,
      Snaplogic, Boomi, Mulesoft, etc.).
    - Strong expertise in developing integrations using REST and
      SOAP APIs, with at least 2 years of experience in JSON
      and XML schema design.
    - Proficient in JavaScript for data processing within
      integration projects.
    - Familiar with various authentication mechanisms such as
      OAuth 2.0, SAML2, and JWT Bearer Tokens.
    - Hands-on experience with cloud applications like Salesforce,
      HubSpot, NetSuite, Zendesk, Gong, Gainsight, and similar
      platforms.
    - Working knowledge of SQL, Snowflake stored procedures, AWS
      S3, and Redshift, along with a clear understanding of
      integration design patterns.
    - Working knowledge on Agent SDKs, Model context protocol,
      Python is a plus.
  - Business Acumen & Communication:
    - Able to quickly learn business processes, understand
      requirements, and communicate designs that address both
      technical and business challenges.
    - Experience supporting business teams and a strong grasp of
      processes like Quote-to-Cash, Procure-to-Pay, Lead-to-
      Opportunity, and Hire-to-Retire.
    - Excellent written communication skills; experience with data
      visualization (graphs and plots) is a significant
      advantage.
  - Collaboration & Project Management:
    - Proven ability to interface with diverse stakeholders across
      various business units and levels, gathering
      requirements and managing follow-ups.
    - Demonstrated track record of delivering projects end-to-end
      with strong accountability.
    - Thinks like an owner—takes full charge of projects from
      inception to delivery while keeping Celigo’s best
      interests in mind.
    - Willingness to work flexible hours to effectively
      collaborate with US stakeholders.
  - Additional Qualifications:
    - A BS/BA in Information Systems, Computer Science, or
      equivalent practical experience is preferred.
    - Knowledge of system and software engineering architecture
      principles and best practices is a plus.

  Celigo is proud to be

  - A 2025 Gartner Customers’ Choice for iPaaS. The ONLY vendor
    to receive this award.
  - Celigo is a Visionary in the Gartner Magic Quadrant for
    iPaaS for the second consecutive year
  - Celigo is ranked #1 iPaaS on G2 for multiple quarters and
    named a Leader in both B2B/EDI and API Management.
  - Celigo is a leading intelligent automation platform that
    puts the power of automation in the hands of every team,
    unifying workflows from the predictable to the fully
    agentic in a single platform.

  Here you’ll experience

  - A flexible, hybrid work culture that values autonomy,
    collaboration, and trust
  - A fast-paced, high-growth environment where innovation and
    ownership are encouraged at every level
  - Continuous learning and upskilling opportunities through
    internal training, mentorship, and global collaboration
  - Exceptional teammates who bring passion, purpose, and
    creativity to everything they do
  - A supportive, inclusive workplace that celebrates diverse
    ideas and perspectives
  - Comprehensive health insurance coverage for employees and
    dependents
  - Generous leave benefits, including paid time off, wellness
    days, and parental leave
  - Recognition programs and career growth opportunities
    designed to help you thrive
  - Modern office spaces that promote connection, collaboration,
    and fun.

  Diversity, Equity, Inclusion, and Accessibility

  As a company, one of the values we hold most dear is
  fostering a safe, collaborative environment to bring out the
  best in us, so we created our Taking a Stand Initiative. Our
  TAS initiative is a volunteer committee open to all
  Celigans, with representation from underrepresented voices
  within our company. We believe, unequivocally, that everyone
  deserves to be in a place where they feel welcome as they
  are. Learn more about Taking a Stand.

  Celigo is proud to be an equal-opportunity workplace. We are
  committed to equal employment opportunities regardless of
  race, color, ancestry, national origin, religion, creed,
  age, disability, sex, gender, sexual orientation, gender
  identity, gender expression, medical condition, genetic
  information, marital status, military and veteran status, or
  any other characteristic protected by applicable law. We
  also consider qualified applicants regardless of criminal
  histories, consistent with legal requirements.
