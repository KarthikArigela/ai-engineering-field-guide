description: |
  AI Sales Engineer

  Monk is an AI-native accounts receivable (AR) platform for
  B2B companies, helping businesses get paid faster.

  The AR stack is broken. Finance teams still chase payments
  with spreadsheets, reconcile AR in spreadsheets and use
  software that was built a decade ago. We think this is one
  of the largest, most ignored problems in B2B software.
  Trillions of dollars sit in outstanding invoices and the
  tools to unlock cashflow are stuck in the past. We are
  rebuilding Monk with AI, speed, and real craftsmanship.

  We are already doing this for over $1B of accounts
  receivables. We are backed by leading investors and our
  founders bring significant experience to our company (more
  here).

  We are early, the upside is enormous, and the hardest, but
  also the most rewarding work is ahead of us.

  The role:

  You will be the first Sales Engineer at Monk. You work to
  establish partnerships with large and complex customers in
  their finance workflows. You will act as the technical
  subject matter expert and design solutions that address the
  customer’s needs and partner integrations. This person will
  be critical to Monk’s growth, and will identify new products
  to help acquire business and build solutions for existing
  customers so we can scale with their needs.

  You will design and ship agentic solutions at the applied AI
  layer that deliver on customer pain points. You will go deep
  on a customer’s workflows and ERP in one moment, and build
  novel agentic experiences the next.

  In this role you will:

  - Be the customer's voice. You’ll assess requirements and
    determine Monk's fit across use-cases, ROI, and technical
    capability. You work hands-on with implementation and
    agent strategists to get enterprise customers live
  - Be relentless in creativity. Move sales cycle and build
    experiences that showcase Monk’s agentic craft &
    sophistication, through a lens of curiosity and creative
    problem solving
  - Shape the future of revenue. Prototype and ship agentic and
    financial products with enterprise clients that earn
    billions of dollars annually
  - Construct perfectly tailored experiences. Tailor proof-of-
    concepts to prospects' real workflows in accounts
    receivable: collections, cash app, deductions, disputes,
    integration systems. Showcase exactly how Monk fits in
    their days
  - 10x the craft. Perfection over your work. You ask the right
    questions to make complex implementations trivial. You
    build both elegant technical solutions and scalable
    processes

  Who you are:

  - 5+ years shipping production full-stack products. This is a
    technical role
  - Deep full-stack TypeScript fluency
  - Product obsessed. You crave gorgeous, intuitive, performant
    user experiences
  - Customer-centric. You anticipate customers’ needs and
    position our product capabilities accordingly
  - Experience with modern web infra: Next.js, Vercel, Supabase,
    or comparable
  - Owner. You figure out what needs to exist and build it
    autonomously
  - AI-native. You leverage it to do all aspects of your work
  - Comfortable with ambiguity and non-deterministic systems.
    Unafraid to build and iterate on high-stakes agentic
    products
  - Excited to build in person in Flatiron, NYC

  Our values (we hope that you will add your DNA/values and
  impact our culture as you build with us):

  - Ownership and craft: We own our work end to end and obsess
    over getting the details right. We believe that our
    Customers deserve the best possible outcomes and we strive
    to produce work that would get a 12/10 reaction from
    either our Customers or members of our team. Ownership is
    also knowing when to go deep on a problem and when to move
    fast. And when the v1 is live - we own all follow-through
    until it is perfect
  - Speed and urgency: We ship daily. We act now. Not tomorrow
    and not the end of the week, but today - this hour. We
    love shipping fast to delight our Customers
  - Radical clarity: We believe in getting to the truth. It is
    important that all of us reason from the same version of
    reality (the truth) so that we can get the best result. We
    strive to get the truth by any means necessary. This means
    being open to feedback, obsessing over improving from our
    mistakes and clear communication

  Why solve this problem now:

  - A broken market and a real shot at owning it. AR is huge,
    ignored, and ready to be rebuilt. We're early and the
    surface area is enormous
  - $T+ market and max EV from a single AR wedge
  - No clear winner has emerged in this massive category. It can
    be us
  - Insulated from labs. This workflow is complex, too many
    integrations are required and the last mile in AR is too
    bespoke for general purpose models
  - Hard problem worth solving. Revenue intelligence is
    challenging and inherently unsexy. Frankly, there are
    fewer strong companies in our space and we are building
    the most talent-dense team
  - Undeniable $ROI that allows us to clearly illustrate value
    to Customers, and embeds us into integral workflows
  - Our unfair advantage: We have ex-finance founders that have
    previously exited, scars and learnings from those
    experiences, an eng-first culture and late-mover advantage

  Why build with us // what we offer:

  - You want to be a founder someday. We are sharing everything
    we’ve learned building our past companies (25% of the team
    are 2nd time founders). One of our primary goals is to
    help you become a founder and create a place where you do
    your life’s best work (see more here)
  - Real ownership and an opportunity to 10x your learning
    curve. You will see your work go to production and deliver
    results for Customers, fast. Your own experience is the
    greatest teacher and at Monk we are maximizing the # of
    times you get to have valuable experiences
  - Build at the frontier of applied AI and solve hard problems.
    You are curious about AI and do not want to miss this
    moment building at the frontier
  - Experienced founders that have exited before and a motivated
    team that is all-in
  - Competitive salary and meaningful equity
  - Medical/dental/vision, flexible paid time off and dinner
    stipend
  - Beautiful office in Flatiron, New York

  We hire for intensity, craft, and attitude. We believe that
  most things can be learned.

  Category defining companies are built with exceptional
  people. Our team is one of the products we're shipping =
  come help build it.
