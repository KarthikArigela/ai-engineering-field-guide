description: |
  We are looking for a highly skilled Lead Engineer – AI/ML
  with strong expertise in Large Language Models (LLMs) and to
  design, build, and deploy enterprise-scale AI applications.

  The ideal candidate should have hands-on experience building
  LLM-powered applications, designing AI agents, orchestrating
  multi-agent workflows, and developing intelligent automation
  solutions using modern Generative AI technologies.

  WHAT YOU'LL DO

  - Design, develop, and deploy AI applications powered by Large
    Language Models (LLMs)
  - Build and optimize Multi-Agent Systems for complex
    reasoning, planning, and task execution
  - Develop production-ready applications using Generative AI,
    Prompt Engineering, and Retrieval-Augmented Generation
    (RAG)
  - Fine-tune, evaluate, and optimize LLMs for enterprise use
    cases
  - Develop reusable Python libraries and AI frameworks
  - Build scalable APIs and microservices for AI applications
  - Integrate AI models with enterprise systems, databases, and
    external APIs
  - Collaborate with Product, Engineering, and Data Science
    teams to deliver innovative AI solutions
  - Mentor engineers and provide technical leadership on AI
    initiatives

  WHAT YOU'LL NEED

  - Bachelor's degree in Computer Science, Artificial
    Intelligence, Machine Learning, or a related field
  - 8+ years of software engineering experience
  - Proven experience building and deploying LLM-based
    applications in production
  - Strong experience with Multi-Agent Systems
  - Professional experience developing Python libraries for
    machine learning applications
  - Strong analytical, problem-solving, and communication skills
  - Large Language Models (LLMs)
  - Experience with: Multi-Agent Systems, Prompt Engineering,
    Retrieval-Augmented Generation (RAG), Vector Databases ,
    REST APIs, Docker, Git, and AWS / Azure / GCP

  NICE TO HAVE

  - Master's degree preferred
  - Strong understanding of LLM architectures and Generative AI
  - Hands-on experience building intelligent AI agents and
    multi-agent workflows
  - Experience designing scalable AI systems for production
    environments
  - Ability to lead technical discussions, mentor engineers, and
    drive AI innovation
  - Excellent communication and stakeholder management skills
  - Experience with Typescript, Model Context Protocol (MCP),
    Fine-tuning LLMs, Semantic Search, MLflow, FastAPI
  - Familiarity with CRMs

  ABOUT US

  Born in 2001, Code and Theory is a digital-first creative
  agency that sits at the center of creativity and technology.
  We pride ourselves on not only solving consumer and business
  problems, but also helping to establish new capabilities for
  our clients. With a global client roster of Fortune 100s and
  start-ups alike, we crave the hardest problems to solve. We
  have teams distributed across North America, South America,
  Europe, and Asia. The Code and Theory global network of
  agencies is growing and includes Kettle, Instrument, Left
  Field Labs, Create Group, Current, and TrueLogic.

  Striving never to be pigeonholed, we work across every major
  category: from tech to CPG, financial services to travel &
  hospitality, government and education to media and
  publishing. We value the collaboration with our client
  partners, including but not limited to Adidas, Amazon, Con
  Edison, Diageo, EY, J.P. Morgan Chase, Lenovo, Marriott,
  Mars, Microsoft, Thomson Reuters, and TikTok.

  The Code and Theory network is comprised of nearly 2,000
  people with 50% engineers and 50% creative talent. We’re
  always on the lookout for smart, driven, and forward-
  thinking people to join our team.
