description: |
  It's fun to work in a company where people truly BELIEVE in
  what they're doing!

  We're committed to bringing passion and customer focus to
  the business.


  Job Summary



  We are looking for a versatile Automation cum Software
  Developer to join our managed services team. This role would
  be to automate the operational processes, workarounds,
  Managed services tooling needs.

  In this role, you won't just "do" operations; you will code
  them. Your mission is to eliminate manual toil by building
  automated systems that manage our production environments.

  You will use Python and Go to develop custom internal tools,
  operators, and automation scripts that interact with Linux
  servers, Telco Applications, Kubernetes, cloud APIs, and
  databases. As a CS graduate, you will apply rigorous
  software engineering principles (version control, testing,
  CI/CD) to the world of infrastructure and operations.

  Key Responsibilities

  - Automation Development: Build and maintain custom automation
    tools and "glue code" using Go and Python to streamline
    operational workflows.

  - Kubernetes Orchestration: Manage the lifecycle of
    containerized applications using Helm and jenkins where
    needed.

  - DB Operations Automation: Automate database tasks such as
    backups, scaling, schema migrations, and performance
    monitoring across SQL and NoSQL environments.

  - Systems Scripting: Create advanced Bash and Python scripts
    for system hardening, automated patching, and rapid
    incident response.

  - Observability as Code: Automate the deployment of monitoring
    and alerting stacks to ensure "day-zero" visibility for
    all new services.

  - Infrastructure Reliability: Ensure the stability of the
    platform by implementing automated self-healing mechanisms
    and scaling policies.

  - CI/CD for Ops: Maintain the pipelines that deploy our
    infrastructure and automation tools, ensuring a "GitOps"
    approach to all changes.



  Technical Requirements

  - Education: BE / B-Tech CS or BCA or BCS (With coding
    experience)

  - Programming: Proficiency in Python or JAVA for automation
    and data handling and Go would be added advantage

  - Orchestration: Hands-on experience with Kubernetes (K8s),
    Helm & Jenkins.

  - Database Knowledge: Strong understanding of DB operations
    and the ability to interact with databases
    programmatically (SQL/NoSQL).

  - Linux/Scripting: Expert-level Shell scripting and a deep
    understanding of Linux internals.

  - Automation Mindset:

  - Automation experience on scripting in bash , perl, awk.

  - Experience with Infrastructure as Code (Terraform, Pulumi)
    and Configuration Management (Ansible).  added as
    advantage



  - CI/CD: Understanding of  building pipelines in GitLab CI,
    Jenkins, or GitHub Actions.



  The Ideal Candidate

  - You believe that if a task has to be done twice, it should
    be automated.

  - You treat infrastructure code with the same level of care as
    application code (testing, PRs, documentation).

  - You enjoy "looking under the hood" of complex systems to
    understand how they fail and how to fix them with code.





  Technical Qualifications

  - Education: Bachelor’s Degree in Computer Science,
    Information Technology, or

  - BCA or BCS Or MCA Or MCS.

  - Programming: Strong proficiency in Python or JAVA (for
    automation/scripting). Good to have proficiency on Go (for
    backend services).

  - Containerization: Deep hands-on experience with Kubernetes
    (K8s) and Docker.

  - Package Management: Proven ability to manage application
    deployments using Helm.

  - 3-4 years of hands on experince in Scripting and Python.

  - Understand and implement web services

  - Databases: Solid understanding of Database operations
    (PostgreSQL, MySQL, or MongoDB) and ORMs.

  - Linux/Scripting: Advanced knowledge of Shell scripting
    (Bash) and Linux system administration.

  - Cloud/DevOps: Familiarity with CI/CD tools (Jenkins, GitLab
    CI, or GitHub Actions) and Infrastructure as Code
    (Terraform is a plus).



  Soft Skills

  - Excellent problem-solving skills and a "can-do" attitude
    toward automation.

  - Strong communication skills to collaborate with both Dev and
    Ops teams.

  - Ability to work in a fast-paced, Agile environment.
