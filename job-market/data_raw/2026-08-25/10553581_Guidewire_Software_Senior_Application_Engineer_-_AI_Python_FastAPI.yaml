title: "Senior Application Engineer - AI (Python, FastAPI & LLM)"
company: Guidewire Software
location: Bengaluru, IND
work_type: FULL_TIME
company_size: 3,400 Employees
description: |
  Summary

  Guidewire is seeking a Senior Applicaton Engineer to join
  our Professional Services AI Engineering team in Bangalore.
  In our Core & Satellite model, you will work on the
  development side of our Strike Teams — reporting to the
  Engineering Manager and pairing with a Senior AI Engineer to
  deliver production-grade, customer-facing AI features end-
  to-end. This is a hands-on senior engineering role. You own
  the dev work for your features end-to-end, build using AI
  coding tools like Claude Code, and operate inside platform
  blueprints set by the Platform Architect, AI Architect, and
  QA Architect — so you can focus on shipping the product
  rather than re-inventing infrastructure.

  Job Description

  - End-to-End Feature Delivery:Own the dev work on a Strike
    Team — REST APIs, frontend wiring, feature logic, and
    integration with AI components — for one high-complexity
    or strategic AI productization project at a time.
  - Technical Execution:Make day-to-day implementation calls,
    contribute to design reviews, and make sound trade-off
    decisions on your features; escalate cross-cutting
    concerns to the Engineering Manager.
  - AI Integration:Partner with your AI Engineer to bring LLM-
    based components into production paths — prompt
    invocation, response handling, fallbacks, observability —
    running on AWS Bedrock. You'll shape how these components
    are integrated, collaborate on the design decisions that
    affect the product, and bring the AI Architect in on the
    deeper algorithmic calls.
  - Platform & Standards Consumption:Build on top of the team's
    shared CI/CD, vector DB, auth, QA, and UI/UX foundations.
    Push back to the horizontal layer when something is
    missing or wrong.
  - Code Quality & Mentorship:Set a high bar for code review,
    testing, and engineering hygiene through your own work.
    Mentor the Consultant Product Engineer and the AI pairing
    partners.
  - AI-Native Development:Leverage AI coding tools (Claude Code,
    Copilot) to accelerate delivery while maintaining a high
    quality bar.

  KPIs & Success Metrics

  - End-to-end delivery of high-complexity or strategic projects
    on schedule.
  - Quality bar upheld: review standards, test coverage, and
    observability for owned features.
  - Reliable AI integration — LLM-backed paths with sound
    fallbacks and acceptable latency.
  - Mentorship impact: growth of the Consultant Product Engineer
    and AI pairing partners.
  - Platform feedback loop: gaps surfaced and resolved with the
    horizontal teams.

  Experience: 5-8+ years of software engineering experience,
  with a strong focus on backend or full-stack production
  development.

  Technical Proficiency:

  - Expert-level skills in Python and the surrounding production
    ecosystem (async, FastAPI, Pydantic, pytest). Experience
    with Java or TypeScript is useful, though Python is
    strongly preferred.
  - Strong REST API design experience, database modeling (SQL
    and at least one NoSQL store), and event-driven patterns.
  - Working knowledge of frontend frameworks (React or
    equivalent) sufficient to wire UI components into your
    APIs.
  - Working understanding of LLM APIs and how AI features are
    integrated — prompt invocation, streaming, retries,
    fallbacks. You'll partner with AI specialists on the
    modeling and data-science work, contributing to the
    integration design and knowing when to bring in the AI
    Architect.
  - Experience with coding assistants (Claude Code, Copilot).

  AI in Production: Has taken LLM or RAG features to
  production and kept them running — streaming, fallbacks,
  cost controls, and observability. AWS: Hands-on with Lambda,
  ECS, API Gateway, RDS, and Bedrock — and aware of the
  timeout, concurrency, and cost limits that catch LLM
  workloads out. Engineering Excellence: Track record of
  shipping production features end-to-end. Strong CI/CD, Git
  workflow, automated testing, and observability habits.
  Domain Context: (Preferred) Experience with enterprise
  software, regulated industries, or multi-tenant SaaS.

  Preferred Skills & Experience

  - Guidewire Knowledge:Prior experience with Guidewire
    InsuranceSuite or Guidewire Cloud is a significant plus.
  - Team Leadership:Prior experience leading small teams or
    owning a feature area end-to-end.

  About Guidewire

  Guidewire is the platform P&C insurers trust to engage,
  innovate, and grow efficiently. We combine digital, core,
  analytics, and AI to deliver our platform as a cloud
  service. More than 540+ insurers in 40 countries, from new
  ventures to the largest and most complex in the world, run
  on Guidewire.

  As a partner to our customers, we continually evolve to
  enable their success. We are proud of our unparalleled
  implementation track record with 1600+ successful projects,
  supported by the largest R&D team and partner ecosystem in
  the industry. Our Marketplace provides hundreds of
  applications that accelerate integration, localization, and
  innovation.

  For more information, please visit www.guidewire.com and
  follow us on Twitter: @Guidewire_PandC.

  Guidewire Software, Inc. is proud to be an equal opportunity
  and affirmative action employer. We are committed to an
  inclusive workplace, and believe that a diversity of
  perspectives, abilities, and cultures is a key to our
  success. Qualified applicants will receive consideration
  without regard to race, color, ancestry, religion, sex,
  national origin, citizenship, marital status, age, sexual
  orientation, gender identity, gender expression, veteran
  status, or disability. All offers are contingent upon
  passing a criminal history and other background checks where
  it's applicable to the position.
