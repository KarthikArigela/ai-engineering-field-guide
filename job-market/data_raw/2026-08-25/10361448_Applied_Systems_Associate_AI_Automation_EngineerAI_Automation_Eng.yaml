description: |
  Job Description Amazing Career Moments Happen Here
  Transforming the insurance industry is ambitious, we know.
  That's why at Applied, we're building a team that shows up
  every day ready to learn, willing to try new things, and
  driven to deliver innovative software and services that make
  us indispensable to our customers - all within a culture
  built on values that make us indispensable to each other
  too. With 40+ years of experience in the Insurtech game,
  we're not just redefining what's achievable; we're creating
  a place where amazing career moments are made possible.
  Position Overview We're searching for an Associate AI
  Automation Engineer to join our IT AI Automation team in
  Remote role. In this role, you'll contribute to the build
  and hardening of micro-apps and AI integrations with
  guidance from senior engineers, helping deliver quality
  solutions on a shared, governed GCP platform. The IT AI
  Automation team hardens, deploys, runs, and partners on AI
  at scale. The team supports business-built proof of concepts
  by hardening them and shipping them to production with
  authentication, CI/CD, secrets management, and monitoring.
  To keep us headed in the right direction, we're looking for
  people who understand winning is a team sport, who value and
  seek to learn from our team's diverse experiences and
  backgrounds, who welcome a challenge and take risks in the
  pursuit of creating better outcomes for our customers, and
  who can, at any given time, step back to laugh and have some
  fun. What You'll Do

  - Contribute to the build of micro-apps and AI integrations,
    including dashboards, reconciliation tools, internal apps,
    and chatbots, with guidance from senior engineers.
  - Support technical delivery by completing assigned bug fixes,
    small features, and test coverage with help from team
    members when needed.
  - Participate in code reviews and design reviews to build
    knowledge of the team's technical vision and hardening
    standards.
  - Apply foundational software development and security
    practices, including auth, access controls, secrets
    management, logging, documentation, and testing.
  - Monitor assigned applications for routine issues, follow
    documented runbooks, and escalate anomalies to senior
    engineers.
  - Build practical experience with the team's tech stack,
    including Python, SQL, and GCP, while learning to use AI
    tools responsibly.
  - Use AI to support analysis, development, automated testing,
    and documentation of assigned components.

  We're Excited to Learn More About You Your experience may
  include:

  - A degree in Computer Science Engineering, a related field,
    or an equivalent combination of education and experience.
  - Foundational knowledge of software engineering principles
    and practices, including documentation, testing,
    debugging, and data structures.
  - Basic proficiency in Python and SQL.
  - Familiarity with modern, cloud-based technologies, with GCP
    preferred, and software security practices.
  - Basic knowledge of CI/CD, automated testing use cases, Agile
    frameworks, Jira, and Confluence.
  - Effective written and verbal communication skills.

  You may have other skills or credentials, including:

  - Internship, co-op, or academic project experience building
    or deploying software.
  - Exposure to AI/LLM concepts through coursework, personal
    projects, or self-study.
  - Exposure to APIs, SaaS platform integrations, Docker, or
    Terraform.

  We know that talent comes from all backgrounds and
  experience levels. We encourage military members and their
  spouses as well as candidates without a degree or a
  background in tech to apply!  When You Join Team Applied,
  You Can Expect: A culture that values who you are and
  recognizes that you aren't just an employee; you are a
  teammate, and you matter. We thrive on the benefits of our
  different experiences and celebrate the uniqueness our
  teammates bring to work with them every day. We flex our
  time together, collaborating remotely and in-person to
  empower our teams to work in the ways that work best for
  them. A comprehensive benefits and compensation package that
  centers our teammates and helps them to bring their best to
  work every day:

  - Medical, Dental, and Vision Coverage
  - Holiday and Vacation Time
  - Health & Wellness Days
  - A Bonus Day for Your Birthday

  Learn more about the people behind our products at Applied
  Systems Careers .  Our targeted starting base salary in the
  United States for this position ranges from [$70,000 -
  $125,000 USD]. To determine a new team member's starting
  pay, we consider a variety of factors, including someone's
  depth, breadth, and variety of experience, skills, and
  responsibilities. Depending on the role, team members may
  also be eligible to participate in additional compensation
  plans such as bonus and commission. Your Security Matters:
  Our candidates' personal information and online safety are
  top of mind for us. At Applied, we proactively protect your
  personal information and only communicate with candidates
  via a secure @appliedsystems.com email or through our
  official careers portal. Recruiters will never request
  payments, ask for financial account information or sensitive
  information like social security numbers. AI Utilization We
  leverage AI tools to streamline parts of our recruitment
  workflow, such as resume parsing and interview scheduling.
  However, candidate screening, interviews, and final
  decisions are conducted by real humans. EEO Statement
  Applied Systems is proud to be an Equal Employment
  Opportunity Employer. Diversity and Inclusion is a business
