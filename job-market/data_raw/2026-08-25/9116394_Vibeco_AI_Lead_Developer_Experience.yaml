description: |
  About Vibe

  At Vibe.co, we're reimagining how brands reach audiences in
  the age of streaming. We believe streaming TV is no longer
  just a brand awareness play, it's the next great performance
  marketing channel. We're building the infrastructure to
  unlock this $100B opportunity.

  Vibe.co provides an Audience First Streaming TV Advertising
  solution for marketers to unlock TV as a growth channel. Our
  all-in-one solution combines hyper-targeted audience
  segmentation, AI-powered insights and recommendations, real-
  time campaign optimization, and incrementality measurement,
  giving brands of all sizes the precision and transparency
  they've come to expect from social and search, but on TV.

  Trusted by over 10,000 brands, Vibe.co reaches more than 120
  million households across 500+ apps and channels, delivering
  an average 250% return on ad spend and 20% sales lift. The
  company hit a $100 million revenue run rate in under two
  years, ranking among the ten fastest software companies to
  reach that milestone.

  Vibe.co's investors include Hedosophia (an early backer of
  Spotify, Uber, and Airbnb), Elaia, Singular, QuantumLight
  (Revolut CEO Nik Storonsky's fund), and Illusian (Supercell
  CEO Ilkka Paananen's fund), as well as angel investors
  including Carolyn Everson, board member of The Walt Disney
  Company and Coca-Cola. Nirav Tolia, CEO of Nextdoor, sits on
  the company's board of directors.

  Founded in 2022, Vibe.co is widely recognized as the
  category-defining platform in streaming TV advertising,
  bringing the power of Meta and Google-style performance
  marketing to the fastest-growing segment in media.

  About the Role

  You'll join our Engineering team, which owns the full
  technical stack powering Vibe's streaming TV advertising
  platform, from bidding infrastructure to data pipelines and
  the product engineers ship every day.

  This role exists because we're making an AI-first bet on how
  engineers work. We believe the best engineering teams in the
  next year won't just use AI tools, they'll be built around
  them. We need someone to lead that shift at Vibe, and get
  there before anyone else does.

  Three reasons a great candidate should care:

  - Greenfield ownership. This is a new role. You'll define what
    developer experience means at Vibe, the tooling, the
    workflow, the culture around it.
  - Real impact, fast. Every engineer at Vibe uses what you
    build. You'll feel the effect of your work within weeks,
    not quarters.
  - A front-row seat to the product. You'll work closely with
    the product team, with direct visibility into how
    engineering decisions shape what Vibe ships.

  What You'll Do

  Set the AI-first engineering standard

  - Define and roll out Vibe's AI-assisted development strategy
    across the engineering org
  - Own adoption of coding agents and AI tooling, Claude Code,
    Cursor, MCP, and drive measurable gains in engineering
    velocity
  - Identify where AI can remove friction and run experiments to
    prove it
  - Live at the bleeding edge of the AI tooling landscape,
    explore emerging best practices in this fast evolving
    space, and evangelize them internally

  Own the developer tooling stack

  - Maintain and evolve Vibe's core developer tooling across
    GitHub, CI/CD, and local dev environments
  - Reduce time-to-first-commit for new engineers and time-to-
    ship for the whole team
  - Keep the stack lean, cut tools that don't pull their weight
  - Own the AI-centric golden path for Vibe’s software
    development lifecycle

  Raise the security bar

  - Own security tooling and best practices across the
    engineering org
  - Embed security into the development workflow without slowing
    engineers down
  - Spot risks early and drive remediation before they become
    incidents

  Measure and improve engineering efficiency

  - Define the metrics that matter for developer experience, and
    track them
  - Report on velocity, tooling adoption, and friction points to
    engineering leadership
  - Treat the engineering team as your customer; gather feedback
    and act on it

  What You Need

  - Hands-on experience as a platform or developer experience
    engineer in a fast-moving product company
  - Deep familiarity with AI coding tools — you're using them
    seriously, not just dabbled
  - Proficiency in at least one of Go, Rust, or TypeScript —
    enough to understand the codebases you're improving
  - Experience owning developer tooling end-to-end: CI/CD,
    GitHub workflows, local dev environments
  - A track record of shipping improvements that engineers
    actually adopt

  Nice to Haves

  - Experience in a high-growth startup where you had to build
    before you could scale
  - Exposure to security tooling and secure development
    practices
  - Familiarity with streaming TV, CTV, or ad infrastructure

  Our Values

  At Vibe, we run on three values: Impact, Ambition, and
  Urgency. We tie every goal to a real business outcome, think
  10x rather than settling for good enough, and move daily
  rather than waiting for perfect conditions.

  You'll thrive here if you own outcomes without needing
  direction, default to action, and hold yourself to results —
  not effort.

  This is a high-performance environment with high-performance
  rewards: you'll work alongside people who push you, with
  real ownership over hard problems in a market that's moving
  fast.

  If that sounds like the best version of your career, we want
  to meet you.

  What We Offer

  Location: France (Paris OR remote); USA (New York City OR
  remote)

  - Variable pay — based on objectives you hit. No arbitrary
    targets.
  - Hybrid flexibility — We're in the heart of Paris and New
    York City, our team is in 3x a week.
  - Health insurance — Full coverage.
  - Annual offsite — The whole team, once a year, somewhere
    worth the trip.
  - Tech Syncs — Engineering and Product meet in person at least
    quarterly, worldwide.

  Our Interview Process

  We respect your time. Here's exactly what to expect — no
  surprises, no ghosting.

  - Recruiter screen — 30 min. We'll share context; you'll share
    yours.
  - Manager interview — Meet the person you'd work with
    directly.
  - Take-home assignment + live debrief — A real problem, not a
    trick. We'll work through it together.
  - Calibration interview — A senior leader joins to ensure
    we're holding a consistent, high bar.
  - Offer — Fast. We don't let good decisions sit.

  Equal Opportunity

  Vibe is an equal opportunity employer. We evaluate all
  applicants without regard to race, color, religion, national
  origin, gender, gender identity or expression, sexual
  orientation, age, disability, veteran status, or any other
  characteristic protected by law.

  We believe the best ideas come from teams with different
  backgrounds, perspectives, and experiences. If you need a
  reasonable accommodation during the application or interview
  process, please let us know.

  Referral Instructions

  Being referred? Ask your contact to submit your application
  directly on your behalf.
