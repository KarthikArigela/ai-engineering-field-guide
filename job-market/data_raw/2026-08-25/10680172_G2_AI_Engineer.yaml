description: |
  About G2 - The Company

  G2 is the world's largest and most trusted software
  marketplace. When you join G2, you’re joining the industry’s
  leading team that helps businesses reach their peak
  potential by powering decisions and strategies with trusted
  insights from real software users.

  Now, we have joined forces with Capterra, SoftwareAdvice,
  and GetApp to create the largest source of online data and
  software insights to fuel intelligent buying in the age of
  AI. With 200M+ combined annual visitors and 6M verified
  reviews, we are now the centralized place to enable software
  buyers to make better and faster decisions with confidence.

  And we are just getting started! We are setting out to
  transform the global B2B software industry and become the
  most trusted data foundation for buyers and sellers of
  software for the age of AI.

  Does that sound exciting to you? Come join us as we try to
  reach our next PEAK!

  About G2 - Our People

  At G2, everything we are and what we do is grounded in our
  PEAK values— (Performance + Entrepreneurship + Authenticity
  + Kindness. Working at G2 means you are part of a value-
  driven, growing global community that climbs PEAKs together.
  We cheer for each other’s successes, learn from our
  mistakes, and support and lean on one another during
  challenging times. With ambition and entrepreneurial spirit
  we push each other to take on challenging work, which will
  help us all to grow and learn.

  You will be part of a global, diverse team of smart,
  dedicated, and kind individuals - each with unique talents,
  aspirations, and life experiences. At the heart of our
  community and culture are our people-led ERGs, which
  celebrate and highlight the diverse identities of our global
  team. As an organization, we are intentional about our DEI
  and philanthropic work (like our G2 Gives program) because
  it encourages us all to be better people.

  About The Role

  As an AI Engineer, you will apply your AI experience to
  build and deliver new AI driven features to production, with
  confidence in their performance. You will have an
  opportunity to work with other engineers and product
  stakeholders to refine feature concepts to best take
  advantage of opportunities afforded by AI techniques &
  models. Work with industry-leading engineering techniques
  and “agent-first” ways of working to deliver your features
  and products, reflecting the realities of today’s software
  development lifecycle.

  In This Role, You Will:

   Build new products and features:

  - Contribute across the full software stack to deliver AI
    driven user journeys to production, contributing to
    implementation quality from architecture to release
  - Apply sound software engineering and system design
    principles to produce solutions that are observable,
    maintainable, scalable, and production ready
  - Build product features and agents that use frontier models
    with prompting, context, tools, and model reasoning to
    fulfill user journeys, generate content, and automate
    processes
  - Validate solutions against functional requirements using
    both traditional QA methods, evals, and tracing to ensure
    quality is measurable and reproducible
  - Use agentic software engineering techniques in the
    development workflow across the SDLC, from planning,
    design, implementation, testing, and maintenance

  Actively participate in product definition as a
  technologist:

  - Participate in product refinement with designers and PMs:
    ideate, explore, and prototype along with stakeholders and
    other engineers to help arrive at deliverable, well-
    rounded solutions
  - Partner with other engineering team members in project
    scoping and prioritization

  Minimum Qualifications:

  We realize applying for jobs can feel daunting at times.
  Even if you don’t check all the boxes in the job
  description, we encourage you to apply anyway.

  - 3+ years of professional programming experience in web
    application and backend environments
  - Strong proficiency in Typescript/Javascript or Python;
    strong knowledge of a modern web application frameworks
    like React, Next.js, or Rails and a backend service
    development framework, like FastAPI or Node.js
  - Hands-on experience building AI and agent-powered features
    using frontier models from OpenAI, Anthropic, or Google
  - Regular use of coding agent harnesses like Claude Code,
    Codex, Opencode, or Pi as part of the daily software
    development workflow
  - Experience helping to refine feature requirements in
    collaboration with a product stakeholder

  What Can Help Your Application Stand Out:

  - Demonstrated experience using AI models to generate content
    for consumption by end users
  - Demonstrated experience with multimodal AI, audio models
    (speech to text or text to speech)
  - Experience with realtime full duplex communication apps
  - Familiarity with speech to speech (S2S) models
  - Experience developing evals against agents you or others
    have written

  Our Commitment to Inclusivity and Diversity

  At G2, we are committed to creating an inclusive and diverse
  environment where people of every background can thrive and
  feel welcome. We consider applicants without regard to race,
  color, creed, religion, national origin, genetic
  information, gender identity or expression, sexual
  orientation, pregnancy, age, or marital, veteran, or
  physical or mental disability status. Learn more about our
  commitments here.

