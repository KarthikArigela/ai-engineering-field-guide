description: |
  The Junior Software engineer is primarily responsible for
  building and maintaining software in the Clinical AI domain.
  From wrapping deep learning models into containerized
  medical devices, to integration with other systems that will
  be used as part of our Clinical Solutions. The focus of the
  current role is on integration of the results generated by
  our Clinical AI algorithms with DeepHealth's Reporting and
  Viewer applications, primarily the Prostate and Lung AI
  products. This includes front-end modules for our users to
  interact with the AI results, PDF report generation, but
  also the backend to ensure smooth integration.

  Essential Duties and Responsibilities



  - Participate in the software development process: Design,
    refine and develop new features along with maintaining
    existing ones. You write code and perform code review of
    you team members, and you contribute to our testing
    framework by writing and performing automatic and manual
    tests. To refine requirements, you work with the team lead
    and the product manager.

  - Be responsible for the features and projects you work on
    throughout the entire development cycle. From refinement
    to seeing it running in production. We stimulate you to
    understand the workflow from a radiologist’s point of
    view, which enables you to flag risks and bugs that you
    identify while developing the software. You will support
    the service and delivery team if they or our users
    encounter issues in production.

  - Maintain and observe all Quality and Regulatory requirements
    throughout development and release cycle to ensure
    continued compliance. We work in a regulated quality
    management system. You will contribute to technical
    documentation e.g. by writing implementation
    specifications of the code you write, follow cybersecurity
    processes, and contribute to risk analysis.

  - Collaborate with the rest of the team to make strategic
    recommendations and improvements to the technology and
    business.



  PLEASE NOTE: This is not an exhaustive list of all duties,
  responsibilities and requirements of the position described
  above.  Other functions may be assigned and management
  retains the right to add or change duties at any time.



  Minimum Qualifications, Education and Experience

  - Bachelor's or Master’s Degree in a related field such as
    computer science, biomedical engineering or similar
    (required)

  - Experience (required)

  - 0-2 years of experience in a similar or related relevant
    role

  - Experience working with one or more programming languages,
    ideally Python, Java JavaScript, TypeScript or
    similar (required)

  - Fluent in English (required)

  - Experience working with Agentic Coding tools like Claude and
    Cursor (required)

  - Accustomed to test-driven development and CI/CD
    practice (preferred)

  - Experience working with microservices and distributed
    systems (preferred)

  - Experience in the MedTech field, e.g. working with DICOM
    data, AI algorithms, clinical workflows (preferred)

  - Experience working with docker, Django, React, and/or cloud
    platforms such as GCP or AWS (preferred)



  What we value

  - Strong analytical mindset

  - Not afraid of working inside a strong regulatory framework
    and disciplined about testing needs

  - Ability to make well-reasoned trade-offs between velocity
    and quality, understanding when to work for higher quality
    and when to optimize for time-to-market – in collaboration
    with your team.

  - You collaborate openly, support your colleagues, and
    contribute to shared success.



   Quality Standards

  - Communicates, cooperates, and consistently functions
    professionally and harmoniously with all levels of
    supervision, co-workers, visitors, and vendors.

  - Demonstrates initiative, personal awareness, professionalism
    and integrity, and exercises confidentiality in all areas
    of performance.

  - Follows all local, regional and country laws concerning
    employment.

  - Follows all DeepHealth policies and procedures.

  - Follows data privacy, compliance, safety and confidentiality
    standards at all times.

  - Practices universal safety precautions.

  - Promotes good public relations on the phone and in person.

  - Adapts and is willing to learn new tasks, methods, and
    systems.

  - Reports to work regularly as scheduled; consistently
    punctual with respect to working hours, meal and rest
    breaks, and maintains satisfactory personal attendance in
    accordance with DeepHealth guidelines.

  - Completes job responsibilities in a quality and timely
    manner.



  Travel

  This position requires domestic / international travel up to
  10%.



  Working Environment

  Hybrid, based in the Netherlands (Rotterdam/Amsterdam)



  Physical Demands

  This position often requires sitting, standing, walking,
  bending, twisting, reaching with hands and arms, using hands
  and fingers, handling, or feeling, speaking, listening, and
  high-level cognitive thinking. Also, must be able to lift up
  to 10 pounds occasionally.

  Salary:

  €40,000 - €50,000 per year-inclusive of Holiday Pay
