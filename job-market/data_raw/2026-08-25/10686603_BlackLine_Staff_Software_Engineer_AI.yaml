description: |
  Make Your Mark:

  As an AI Staff Engineer you'll play a crucial role in
  developing and refining our product’s AI. You'll report
  directly to our VP of Engineering and work closely with our
  engineering and product teams to enhance our AI capabilities
  and drive innovation in our fin-tech AI platform.

  You'll Get To:

  - Responsibilities:
  - Utilize the best-in-class models available on the market to
    deliver meaningful solutions for our clients, bringing
    them from the idea stage all the way to production
  - Collaborate with the team to integrate AI solutions into our
    existing production processes
  - Design and implement scalable AI system architecture
    handling including model orchestration, caching
    strategies, and fallback mechanisms
  - Evaluate and implement new AI technologies and methodologies
    to keep WiseLayer and BlackLine at the cutting edge

  What You'll Bring:

  - Years of Experience in Related Field:
  - 4+ years of experience as a Full Stack Software Engineer or
    a similar role developing, shipping, and testing of
    software within a well-established enterprise, bonus
    points if at a fast growth enterprise
  - Education: Bachelor's degree in Computer Science,
    Engineering or a related field
  - Technical/Specialized Knowledge, Skills, and Abilities:
  - Demonstrated experience working with production LLM APIs
    (OpenAI, Anthropic, Google, etc.) including handling rate
    limits, cost optimization, and performance monitoring in
    live systems (not just vibe coding)
  - Clear experience utilizing frameworks like RAG in production
    applications to further enhance the foundational models
    for proprietary applications and datasets
  - Experience with AI system testing methodologies including
    model evaluation, A/B testing of AI features, and
    monitoring model performance in production
  - Experience with data pipelines and ETL/ELT processes (given
    our data-intensive AI workflows)

  We’re Even More Excited If You Have:

  - Prior working experience with appliances such as firewalls,
    routers and load balancers.

  Thrive at BlackLine Because You Are Joining:

  - A technology-based company with a sense of adventure and a
    vision for the future. Every door at BlackLine is open.
    Just bring your brains, your problem-solving skills, and
    be part of a winning team at the world's most trusted name
    in Finance Automation!
  - A culture that is kind, open, and accepting. It's a place
    where people can embrace what makes them unique, and the
    mix of cultural backgrounds and varying interests
    cultivates diverse thought and perspectives.
  - A culture where BlackLiner's continued growth and learning
    is empowered. BlackLine offers a wide variety of
    professional development seminars and inclusive affinity
    groups to celebrate and support our diversity.

