  BlackLine recognizes that the ways we work and the workplace
  itself has shifted. We innovate in a workplace that
  optimizes a combination of virtual and in-person
  interactions to maximize collaboration and nurture our
  culture. Candidates who live within a reasonable commute to
  one of our offices will work in the office at least 3 days a
  week.

  Salary Range:

  $210,000.00-$263,000.00

  Pay Transparency Statement:

  Placement within this range depends upon several factors,
  including the applicant's prior relevant job experience,
  skill set, and geographic location.

  In addition to base pay, BlackLine also offers short-term
  and long-term incentive programs, based on eligibility,
  along with a robust offering of benefit and wellness plans.

  We are committed to pay transparency and ensuring candidates
  have clear information about compensation expectations. For
  roles that include variable incentive components such as an
  Incentive Compensation Plan (ICP) or On-Target Earnings
  (OTE), the compensation structure may follow a split model –
  for example, a 50/50, 70/30, or 60/40 ratio between base
  salary and variable incentive.

