title: Legal Engineer - AI (DACH)
company: BRYTER GmbH
location: USA
remote: true
work_type: FULL_TIME
description: |
  As our Legal Engineer - AI (DACH) you will operate at the
  intersection of law, technology, and customer enablement,
  with a strong focus on making complex AI-driven
  functionality understandable, usable, and valuable for self-
  serve customers. You will be responsible for driving
  sustainable adoption by combining hands-on customer support
  with scalable enablement and data-driven insights. Your work
  will directly support legal professionals in achieving
  measurable efficiency gains through AI.

  This is a hands-on legal engineering role with a strong
  technical component. You will work in an evolving AI product
  environment and are expected to navigate uncertainty with a
  structured, solution-oriented approach. Alongside
  contributing to adoption strategies and success frameworks,
  you will actively support customers in applying AI to real
  legal workflows. The role is well suited for someone who
  combines legal expertise with technical curiosity and values
  precision, reliability, and practical impact. Travel may be
  required.

  THE ROLE

  - Become an expert of our AI Workflow platform and be
    comfortable with explaining technical concepts to a non-
    technical audience as well as working with our world-class
    developers.
  - Providing first-line technical support to self-serve
    customers, addressing customer inquiries and resolving
    technical issues with empathy and efficiency and seeing
    any potential issues through to a resolution.
  - Developing and maintaining Help Center content,
    documentation, and other scalable support formats to
    enable independent and compliant use of BEAMON AI
  - Tracking product usage and defining adoption and ROI metrics
    to assess customer success and inform continuous
    improvement
  - Diagnose, identify, and troubleshoot issues, escalating
    situations requiring urgent attention to our Engineering
    teams, if necessary.

  WHAT WE’RE LOOKING FOR

  MUST HAVE

  - Highly fluent (or native) German speaker
  - Highly fluent English speaker
  - 3+ years of experience in a technical support or customer
    success role.
  - Ability to stay calm, patient, and empathetic when assisting
    customers.
  - Previous work in SaaS or AI.
  - You have strong communication skills to explain technical
    issues and resolutions to both engineering and
    non‑technical stakeholders.
  - You are effective at working cross‑functionally in a
    high‑trust environment.
  - You can coordinate efforts across teams and are comfortable
    providing updates in the midst of an ongoing incident.
  - Previous experience creating customer-facing documentation
    or video tutorials.
  - Proficiency with support tools such as Intercom or Zendesk.
  - Comfortable working in a fast-paced, dynamic startup
    environment.
  - Excellent written and verbal communication skills.

  NICE-TO-HAVE

  - Experienced in customer support, success, or enablement for
    in legal tech or with AI adoption.
  - Proficiency with adoption and product analytics tools such
    as Userpilot or Pendo.
  - Experience in the legal or legal tech industry.
  - Background in conducting webinars or training sessions
  - Start-up and remote work experience

  WHAT WE OFFER

  - Competitive Benefits: Along with 30 vacation days, we also
    offer a pension, a generous Work From Home Allowance to
    make sure your home office has everything you need, paid
    parental leave & more!
  - Cutting-Edge Technology: You’ll be at the forefront of tech,
    working with advanced AI models, including large language
    models (LLMs) and Retrieval-Augmented Generation (RAG)
    techniques, gaining hands-on experience with the latest
    innovations.
  - High-impact role: Your contributions will directly shape
    BRYTER’s growth and success.
  - Collaborative and innovative team: Join a company with a
    strong culture of ownership, ambition, and teamwork.
  - Team Onsites: We regularly organize team off-sites at
    exciting destinations across Europe, where we come
    together to collaborate, bond, and have fun. So far we
    went to Portugal, Italy and Greece – stay tuned for this
    year’s destination!
  - Competitive compensation package: We offer competitive
    salary packages that reflect your skills, experience, and
    the impact you’ll have on our team.
  - Learning & Growth: You will have the opportunity to learn
    and grow every day, especially in AI-driven technologies,
    as we push the boundaries of what’s possible in
    automation.

  ABOUT BRYTER

  BRYTER is the AI and No-code Platform that enables law firms
  and in-house legal teams to work more efficiently.

  By combining the power of AI with the precision of
  workflows, BRYTER's two products – the BRYTER No-code
  Platform and AI Agents – improve productivity and make
  services accessible to clients and business partners.

  Using our No-code Platform, law firms automate workflows –
  from document automation to fund management.Using our AI
  Agents, teams can be more productive by automating
  everything from replying to commercial requests to
  completing infosec questionnaires.

  Law firms like Paul Hastings, Ashurst and Linklaters and
  legal departments from global brands like ING Bank and
  McDonald's use BRYTER every day to improve efficiencies and
  scale their services.

  BRYTER is a remote-first company with offices in New York,
  London, and Frankfurt.

  CURIOUS? PLEASE APPLY

  Multiple studies have found that women/non-binary people on
  average seek to match a high percentage of a role's
  requirements before applying. We encourage everyone to
  apply, even if they feel they might not fulfill all listed
  requirements fully. We'd like you to give us a chance to
  evaluate your skills and experience. We're curious to hear
  from you and learn what you believe you'd bring to the role
  and the team. For people living with disabilities, chronic
  illnesses, or neurodiversity, adjustments, and support can
  make a decisive difference in the interviewing process.
  Please let us know if you need any accommodations (specific
  tools, more time, additional breaks, etc.) and feel
  comfortable disclosing this, and we'll do our best to meet
  them.
