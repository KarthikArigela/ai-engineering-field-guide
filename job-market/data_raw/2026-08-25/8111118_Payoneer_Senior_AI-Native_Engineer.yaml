description: |
  About Payoneer

  Founded in 2005, Payoneer is the global financial platform
  that removes friction from doing business across borders,
  with a mission to connect the world’s underserved businesses
  to a rising global economy. We’re a community with over
  2,500 colleagues all over the world, working to serve
  customers, and partners in over 190 countries and
  territories.

  By taking the complexity out of the financial
  workflows–including everything from global payments and
  compliance to multi-currency and workforce management, to
  providing working capital and business intelligence–we give
  businesses the tools they need to work efficiently worldwide
  and grow with confidence.

  Role summary

  You will join a high-impact AI engineering team within R&D,
  owning problems end-to-end from understanding the business
  need, through architecture and implementation, to production
  monitoring. This is a new way of working at Payoneer: you'll
  work directly with business stakeholders, ship AI-driven
  capabilities at speed, and help define the methodology as we
  build it.

  As a member of the AI Foundations organization, you will
  lead best practices, champion early adoption of new
  technologies, and influence the direction of our R&D guild -
  building and shipping cutting-edge agentic applications that
  deliver seamless experiences to our users.

  Location

  Hybrid - Gurgaon

  Full-time

  What you'll do

  - Own the full development loop understand the business
    problem, define the solution, architect it, build it, ship
    it, and monitor it in production
  - Use AI as your primary development tool, achieving in a day
    what used to take a team a week
  - Collaborate with your team and business stakeholders to
    define decision logic, risk thresholds, and success
    metrics
  - Design and build evaluation frameworks as part of every
    solution you don't ship what you can't measure
  - Own production readiness monitoring, alerting, and
    observability go in on day one
  - Contribute to shaping team practices, tooling, and
    engineering standards across the pod
  - Decompose business problems into agentic workflows,
    orchestrated flows, and reusable capabilities.

  Who you are

  - 5+ years of software engineering experience, building and
    operating production systems
  - Hands-on experience with AI/ML systems in production not
    just prototyping, but shipping, monitoring, and iterating
  - Genuine fluency with AI-powered development tools you use
    them daily to move faster
  - Experience designing agentic architectures: orchestration,
    multi-step workflows, RAG pipelines, fallback and error
    handling
  - Strong evaluation instincts you define metrics, build test
    sets, and validate before shipping
  - Comfortable across the full stack you move between prompt
    engineering, backend services, data pipelines, and
    infrastructure as needed
  - High degree of independence you lead work from problem
    definition to production without waiting for detailed
    specs
  - Excellent communication you flag risks early, give direct
    feedback, and collaborate openly Fintech or regulated-
    environment experience is an advantage

  The Payoneer Ways of Working

  Act as our customer’s partner on the inside  Learning what
  they need and creating what will help them go further.

  Do it. Own it.  Being fearlessly accountable in everything
  we do.

  Continuously improve  Always striving for a higher standard
  than our last.

  Build each other up  Helping each other grow, as
  professionals and people.

  If this sounds like a business, a community, and a mission
  you want to be part of, apply today.

  We are committed to providing a diverse and inclusive
  workplace. Payoneer is an equal opportunity employer, and
  all qualified applicants will receive consideration for
  employment no matter your race, color, ancestry, religion,
  sex, sexual orientation, gender identity, national origin,
  age, disability status, protected veteran status, or any
  other characteristic protected by law. If you require
  reasonable accommodation at any stage of the hiring process,
  please speak to the recruiter managing the role for any
  adjustments. Decisions about requests for reasonable
  accommodation are made on a case-by-case basis.
