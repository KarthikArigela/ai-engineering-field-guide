description: |
  About the Role

  You will build AI agents, work on LLM fine-tuning, integrate
  with cloud systems (AWS), and help deploy intelligent
  solutions in packaging / manufacturing domains.

  Key Responsibilities

  - Develop, train, fine-tune LLM models for
       domain-specific tasks.
  - Build AI agents, chatbots, and knowledge
       assistants.
  - Integrate AI modules with backend, edge, or cloud
       systems (AWS).
  - Work with DevOps / MLOps / data engineering teams
       to deploy models in production.
  - Monitor model performance, iterate, maintain
       models, ensure scalability & reliability.



  Required Qualifications & Skills

  - Bachelor’s / Master’s in Computer Science / AI /
       Data Science.
  - 3–5 years experience in AI/ML, specifically with
       language models.
  - Strong experience in LLM fine-tuning, prompt
       engineering.
  - Expertise in AWS (Sagemaker, Lambda, EC2, etc.).
  - Familiarity with DevOps / CI/CD, containerization
       (Docker, Kubernetes).

  Benefits

  - Competitive salary and incentives.
  - Opportunities for professional growth and learning.
  - Collaborative and dynamic work environment.
  - Exposure to large-scale government and PSU projects
  - Health & Accidental Insurance
  - 36 Annual Leaves (15 EL, 10 PTO, 6 ML, 5 RH)
  - Six-month appraisal cycle
