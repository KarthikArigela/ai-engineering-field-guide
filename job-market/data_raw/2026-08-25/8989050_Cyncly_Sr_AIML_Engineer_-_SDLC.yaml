description: |
  Job Title: Sr. AI/ML Engineer - SDLC Location: Bangalore,
  India (Hybrid) Permanent - Full Time

  About Us Cyncly is a global technology powerhouse with
  2,400+ employees and 70,000+ customers across 100+
  countries. Cyncly transforms the way customizable products
  and spaces are imagined, designed, sold, managed and made.
  Our end-to-end software solutions connect professional
  designers, retailers and manufacturers to the world's
  largest repository of product content. Today, our business
  spans across the Kitchen & Bath, Furniture, Window, Glass &
  Door, and Flooring industries with operations in North &
  South America, Europe, Asia Pacific and Africa.

  Cyncly brings over 30 years of experience to deliver more
  value for our customers through an expanded portfolio of
  end-to-end solutions. Our global presence allows us to
  provide world-class support and sales with a local touch,
  providing the best possible customer experience.

  Cyncly is now embarking on an exciting journey as we
  continue to expand through strong organic growth and
  complementary acquisitions, backed by leading growth private
  equity firms specializing in technology.

  Cyncly & The Power of AI At Cyncly, we believe in unlocking
  the power of AI to deliver highly personalized and
  extraordinary experiences for our customers and their
  clients. We are on a dynamic journey of seeking exceptional
  talent to add critical AI models and functionality to our
  products used by over 17,000 customers worldwide. This is
  opportunity to be a part of a collaborative team that
  fosters continuous learning and growth, where you'll work on
  exciting data driven projects that redefine the Spaces for
  Living industry. AI is reshaping private and business life
  at an unprecedented speed, and Cyncly is committed to
  leading the charge in delivering new sources of value for
  our customers.

  Availability between 12:30 PM to 9:30 PM IST is required to
  support collaboration with our global teams.

  About the role  We are seeking a Senior AI/ML Engineer -
  SDLC to serve as a core technical builder to drive adoption
  and excellence in AI-assisted development across our
  engineering organization. This role will empower developers
  and technical teams to leverage AI tools effectively,
  accelerating development velocity while maintaining code
  quality and engineering standards.

  Key Position Responsibilities Include: Design & Develop AI
  Solutions

  - Build AI/ML and GenAI-powered tools to optimize SDLC stages
    (requirements, coding, testing, deployment, maintenance).
  - Develop intelligent systems for code generation, review,
    testing automation, defect prediction and democratizing
    large respos for new users.

  Improve Engineering Productivity

  - Identify bottlenecks in development workflows and implement
    AI-driven optimizations. Reduce cycle time through
    automation and intelligent decision-support systems.

  GenAI & LLM Integration

  - Design and implement solutions using LLMs (e.g., GPT and
    open-source models) for code assistance, documentation
    generation, test case generation, and end-to-end
    application or feature development from PRDs.

  Platform & Tooling Development

  - Build reusable AI agents, APIs, and internal tools that can
    be adopted across engineering teams. Integrate AI
    solutions with existing DevOps tools, including CI/CD
    pipelines, issue-tracking systems, and version-control
    platforms.

  Data & Model Engineering

  - Work with structured and unstructured engineering data,
    including code repositories, logs, and tickets. Fine-tune
    models and develop Retrieval-Augmented Generation (RAG)
    pipelines where required.

  Governance & Best Practices

  - Ensure responsible AI usage, model performance monitoring,
    and security compliance. Establish standards and best
    practices for AI-assisted software development.

  Required Experience and Qualifications:

  - Bachelor’s/master’s in computer science, AI, Machine
    Learning, or related field.
  - 5+ years of experience in software engineering, with strong
    exposure to AI/ML.
  - Proven experience building AI/ML or GenAI-based products.
  - Strong polyglot programming skills (Python, Java, c# etc)
    and ability to adapt to various launguage ecosystems.
  - Hands-on experience with:LLMs (OpenAI, Hugging Face, etc.),
    Prompt engineering and evaluation, RAG architectures and
    vector databases.
  - Experience with Agentic frameworks (LangGraph, AutoGen, or
    LangChain).
  - Hands-on experience utilizing, evaluating, and fine-tuning
    open-source models (e.g., Qwen, DeepSeek, Llama, GLM) to
    automate key SDLC workflows is a strong advantage.
  - Familiarity with frameworks like vLLM or Ollama.
  - Solid understanding of software architecture, system design
    and modern DevOps practices.
  - Proven Experience with ASTs (Abstract Syntax Trees) and
    code-parsing tools like Tree-sitter or LSP (Language
    Server Protocols).
  - Hands on experience with Graph Databases (Neo4j, Arango DB
    or similar) and their application in Knowledge Graphs or
    GraphRAG.

  Core Competencies:

  - Measurable reduction in SDLC cycle time.
  - Increased developer productivity and efficiency.
  - Improved code quality and reduced defect leakage.
  - High adoption of AI tools across engineering teams.

  Working for Us At Cyncly, we call our team OneCyncly, a
  reflection of how we work together as one, united by our
  purpose: powering businesses that bring spaces to life. Our
  strength comes from our diversity of experiences,
  perspectives, and skills - and we thrive when we work
  together with openness, trust, and respect.

  Here, you’ll join a group of colleagues who take ownership,
  solve problems, and focus on making an impact. We embrace
  curiosity, welcome new ideas, and see mistakes as
  opportunities to learn. You’ll have the freedom to work
  flexibly and autonomously, supported by teammates and
  leaders who are committed to your growth.

  We celebrate the different ways people contribute and
  encourage everyone - from every background - to bring their
  authentic self to work. Because when we collaborate,
  challenge each other, and share what we know, we build
  something better together.

  If you want to work in a place where your ideas matter, your
  growth is valued, and your work shapes the spaces people
  live, work, and play in - Come join us.
