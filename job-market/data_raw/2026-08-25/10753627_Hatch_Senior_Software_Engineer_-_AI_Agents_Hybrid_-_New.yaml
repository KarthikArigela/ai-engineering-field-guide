title: Senior Software Engineer - AI Agents (Hybrid - New York City - United States)
company: Hatch
location: New York, USA
work_type: FULL_TIME
company_size: 59 Employees
description: |
  Summary

  Hatch engineering culture is driven by speed, ownership, and
  impact. We're a small, ambitious team building AI that
  transforms how service businesses grow, and we move fast.
  Engineers own problems end to end, ship to production early,
  and work across a modern stack (Elixir, Python, Go, React +
  TypeScript) on problems that directly shape the customer
  experience. At the end of the day, we're here to build
  something that matters, grow as engineers, and do it
  together.



  As part of the AI agents team, you'll work at the
  intersection of classic product engineering and AI -
  building the underlying systems that let our AI agents
  reason, act, and improve. Your work has a direct, measurable
  line to customer revenue.



  This opportunity requires you to be located in the United
  States.

  We’d love to have you apply, even if you don’t feel you meet
  every single requirement in this posting. At Hatch, we’re
  looking for great people, not just those who simply check
  off all the boxes.



  What you'll do

  - Design, build, and maintain scalable backend services, APIs,
    and third-party integrations and clearly communicate
    technical decisions and trade-offs to the team.
  - Partner closely with product and design as a true thought
    partner - bring a strong product sense and a product-
    oriented mindset to every feature, balancing user needs,
    business goals, and technical trade-offs.
  - Own your work end-to-end and deliver results on time,
    partnering across team boundaries when needed to unblock
    yourself, drive clarity, and ship.
  - Apply industry-standard engineering practices: thorough code
    review, automated testing, CI/CD, progressive delivery
    with feature flags and A/B experimentation, observability,
    and clear technical documentation.
  - Set the technical direction and quality bar for the team
    across architecture, code quality, and delivery practices.
  - Proactively identify and resolve critical technical issues,
    contribute to architectural discussions, and raise the bar
    for the group.
  - Mentor and guide junior engineers, fostering a culture of
    learning and technical excellence.



  What it takes to succeed

  - Solid backend experience in one or more of Elixir, Go,
    Python, or a comparable server-side language, with the
    curiosity and adaptability to pick up new languages and
    frameworks as our stack evolves.
  - Deep understanding of backend systems, API design, and data
    modeling - comfortable owning features end-to-end from
    architecture to production
  - Familiarity with ML/LLM systems including prompt
    engineering, evals, and model behavior is a plus.
  - Sense of ownership and bias for action - you take ambiguous
    problems from start to finish, work across team boundaries
    to unblock yourself when needed, stay accountable through
    delivery and evaluate edge cases to foresee potential
    problems outside of project requirements.
  - Excellent communication skills and the ability to
    collaborate effectively with technical and non-technical
    stakeholders.
  - Eager to keep up with the ever-changing landscape of AI
    capabilities - actively exploring new models, tools, and
    techniques, and thoughtfully applying them to your work
    and to the product.
  - Several years of experience shipping production software,
    with a track record of leading projects from spec to
    launch alongside multiple contributors.



  What you'll get

  - Full responsibility for projects from day one, a
    collaborative team, and a dynamic work environment
  - Effective your first day: Full medical, vision, and dental
  - Mental health support and services via Modern Health
  - 15 days PTO (accrual begins on date of hire and increases
    with 2+ years of tenure thereafter), 12 paid holidays,
    plus one floating holiday
  - Up to 14 weeks of parental leave
  - Monthly wellness stipend
  - 401(k) retirement savings plan
  - Employee stock purchase plan
  - Professional development reimbursement
  - Work from home reimbursement



  Why Hatch

  - Shape the future of AI-driven customer service
  - Build alongside founders and leaders who value speed,
    ownership,and ambition
  - Solve challenging problems and see the impact on real
    businesses and customers
  - Join a team of builders who care about great engineering,
    fast execution, and each other



  Closing

  - There are a variety of factors that go into determining a
    salary range, including but not limited to external market
    benchmark data, geographic location, and years of
    experience.
  - Based on the anticipated level of experience we are seeking,
    we expect the compensation range for this role to be
    between $112,000 and $216,000. You may also be offered a
    bonus and benefits.
  - In the event a candidate is hired into a role that is
    leveled higher or lower than the role specified in this
    job posting, the compensation range may vary accordingly.



