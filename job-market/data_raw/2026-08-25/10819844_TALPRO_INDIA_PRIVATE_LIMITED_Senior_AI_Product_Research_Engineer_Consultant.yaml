  Senior AI Product & Research Engineer (Consultant)

  Experience: 8–12 Years

  Location: Mumbai

  Work Mode: Hybrid (3 days/week WFO mandatory)

  Engagement: 12 Months C2H

  Budget: 22 LPA

  Joining: Immediate joiners only

  Role Overview

  We are looking for a Senior AI Product & Research Engineer
  who combines applied research expertise with hands-on
  product delivery. This role requires building, prototyping,
  and scaling enterprise AI systems from proof-of-concept to
  production.

  The candidate must have deep experience in LLM systems, RAG
  architectures, and agentic AI frameworks.

  Key Responsibilities

  - Design, prototype, and scale enterprise AI products.
  - Build and deploy LLM-based systems, RAG pipelines, and
    agentic AI frameworks.
  - Lead AI product initiatives from POC to production.
  - Define evaluation frameworks for performance, safety, and
    reliability.
  - Implement AI observability and monitoring systems.
  - Collaborate with product and engineering teams to align AI
    solutions with business goals.
  - Drive experimentation, benchmarking, and model validation.

  Required Skills

  ✔ 8–12+ years delivering AI systems in enterprise
  environments

  ✔ Strong hands-on Python skills

  ✔ Experience with LLMs, RAG, Agentic AI systems

  ✔ Experience taking AI products from concept to production

  ✔ Experience with AI coding agents

  ✔ Strong understanding of evaluation, safety, and
  observability

  Preferred

  - Experience in applied AI research
  - Exposure to AI governance and compliance standards
  - Strong architectural thinking and product mindset
