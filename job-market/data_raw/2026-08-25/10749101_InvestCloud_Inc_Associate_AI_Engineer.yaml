description: |
  Role Context

  InvestCloud is a private-equity backed platform business
  supporting over $6 trillion of assets globally, with deep,
  long-standing relationships across the asset and wealth
  management ecosystem. Private markets are rapidly becoming a
  core part of wealth portfolios — but the industry
  infrastructure has not kept pace. Most wealth managers still
  rely on manual processes, fragmented data, and operational
  workarounds to deliver private market exposure.

  InvestCloud’s Private Markets Network (PMN) is designed to
  change that. PMN is a network-level execution and processing
  platform that enables private market investments to be
  delivered at managed-account scale, with the same
  operational discipline and integration model that wealth
  managers expect in public markets.

  This role sits within the PMN engineering team and is
  focused on building practical AI-powered applications and
  internal tools that help connect systems, automate
  workflows, and improve how teams operate across the
  platform.

  Purpose of the Role

  We are looking for an early-career engineer who is excited
  about modern AI tooling and enjoys building real software
  products. This role would suit a strong graduate or someone
  with 1–2 years of software engineering experience who has
  experimented with LLMs, AI tooling, or automation projects
  either professionally, academically, or in their own time.

  You will work closely with experienced engineers, product,
  and operations teams to help build AI-enabled tools and
  platform capabilities across PMN and the broader InvestCloud
  ecosystem. The work is highly practical and hands-on —
  connecting systems, building internal applications,
  integrating APIs, and using modern AI frameworks where they
  genuinely improve outcomes.

  The role offers the opportunity to own the end-to-end build
  of technology solutions and would suit an individual who is
  excited by the opportunity to work with the business to
  define the problem and then build greenfield solutions.

  What You’ll Be Doing

  On any given week, you might be:

  - Building internal AI-powered tools that automate operational
    tasks or improve team workflows.
  - Connecting LLMs and AI services to existing systems, APIs,
    and business data.
  - Helping develop platform features across PMN and adjacent
    services.
  - Writing clean, maintainable, and well-tested code with
    support from senior engineers.
  - Experimenting with AI tooling and helping evaluate where it
    can add value to the business.
  - Supporting debugging, monitoring, and ongoing improvements
    to live applications.
  - Collaborating with product and engineering peers to turn
    validated concepts into production-ready tools.

  Key Responsibilities

  Engineering & Tool Development

  - Contribute to the development of PMN platform features and
    internal applications.
  - Build lightweight AI-enabled tools and workflow automations
    that solve real business problems.
  - Integrate APIs, services, and data sources across the
    InvestCloud ecosystem.
  - Work across backend services, internal tooling, and cloud-
    based applications.

  AI & Automation

  - Apply modern AI tooling such as LLMs, retrieval workflows,
    and prompt engineering in practical use cases.
  - Help prototype and productionize AI-powered applications.
  - Learn and apply best practices around evaluation,
    reliability, and responsible AI usage.
  - Explore opportunities to improve efficiency through
    automation and intelligent tooling.

  Software Development Best Practices

  - Write clean, readable, and maintainable code.
  - Participate in testing, code reviews, and documentation.
  - Contribute to reliable and observable systems with proper
    logging and monitoring.
  - Learn how large-scale production platforms are built and
    maintained.

  Collaboration

  - Work closely with PMN engineering, product and operations
    teams.
  - Partner with senior engineers to deliver production-quality
    solutions.
  - Share ideas and contribute to a collaborative engineering
    culture.
  - Learn quickly in a fast-moving environment with real
    business problems to solve.

  Key Stakeholders

  - PMN Engineering Leadership
  - Product & Prototyping Lead
  - PMN Operations
  - InvestCloud Core Platform Engineering
  - Internal business stakeholders

  Essential Skills & Experience

  - Bachelor’s degree in Computer Science, Engineering,
    Mathematics, or a related field — or equivalent practical
    experience.
  - 1–2 years of software engineering experience, internships,
    or strong personal/project portfolio.
  - Comfortable coding in at least one modern programming
    language such as Python or Golang.
  - Familiarity with APIs, databases, and cloud-based
    applications.
  - Interest in AI tooling and LLM-based applications, including
    personal or academic projects using tools such as OpenAI
    APIs, LangChain, RAG pipelines, or similar frameworks.
  - Strong problem-solving skills and willingness to learn
    quickly.
  - Good communication and collaboration skills.
  - Excited by building practical software products in a fast-
    moving environment.

  Desirable Skills & Experience

  - Exposure to AI tooling, prompt engineering, or automation
    frameworks.
  - Side projects, hackathons, internships, or open-source
    contributions involving AI or workflow automation.
  - Familiarity with cloud platforms such as AWS, Azure, or GCP.
  - Exposure to financial services, private markets, and SaaS
    platforms
  - Understanding of software testing, debugging, and deployment
    fundamentals.

  Personal Attributes

  - Curious and enthusiastic about modern AI tooling and
    software engineering.
  - Pragmatic and eager to learn from experienced teammates.
  - Enjoys building things and solving practical problems.
  - Comfortable working across different systems and
    technologies.
  - Collaborative, adaptable, and motivated by ownership and
    delivery.

  Why This Role Is Different

  This role offers:

  - The opportunity to work on real-world AI applications in
    production, not just prototypes.
  - Exposure to complex platform systems and large-scale
    financial technology infrastructure.
  - A chance to learn from experienced engineers while
    contributing meaningful code from day one.
  - Broad technical exposure across platform engineering, AI
    tooling, automation, and internal applications.
  - Significant growth potential as the PMN platform and AI
    capabilities continue to expand.



  About InvestCloud

  InvestCloud, a global leader in wealth technology, aspires
  to enable a smarter financial future. Driving the digital
  transformation of the wealth management industry, the
  company serves a broad array of clients globally, including
  Wealth and Asset Managers, Wirehouses, Banks, RIAs, and
  Insurers. In terms of scale, the company’s clients represent
  more than 40 percent of the $132 trillion of total assets
  globally. As a leader in delivering personalization and
  scale across advisory programs, including unified managed
  accounts (UMA) and separately managed accounts (SMA), the
  company is committed to the success of its clients. By
  equipping and enabling advisors and their clients with
  connected technology, enhanced intelligence, and inspired
  experiences, InvestCloud delivers leading digital wealth
  management and financial planning solutions, complemented by
  a dynamic data warehouse, which scale across the complete
  wealth continuum. In 2024, InvestCloud was named CNBC
  World’s Top Fintech Company, a proof point of the company’s
  commitment to innovation and client success. Headquartered
  in the United States, InvestCloud serves clients around the
  world. For more information, visit InvestCloud.com.

  Our Values

  - Client Connected
  - Human Centered
  - Technology Forward
  - Respect + Integrity
  - Excellence

  Compensation & Benefits

  - Competitive base salary
  - Discretionary bonus
  - Excellent pension, private medical, life assurance
  - Hybrid working model
  - 28 days holiday plus bank holidays

  #LI-BH1

  The actual salary will vary based on the applicant’s
  education, experience, skills, and abilities, as well as
  internal equity and alignment with market data. The salary
  may also be adjusted based on the applicant’s geographic
  location.
