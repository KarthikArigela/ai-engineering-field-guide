description: |
  We're looking for a hands-on AI engineer eager to grow. Join
  the ranks of top talent at one of the world's most
  influential companies.

  As an Applied AI ML Associate Senior -AI Engineer at
  JPMorgan Chase within the International Private Bank (IPB)
  Technology Artificial Intelligence and Machine Learning
  (AIML) Team, you will design, develop, and deliver
  components of our agentic AI and machine learning products.
  Working under the direction of senior engineers and the AIML
  Team Lead, you will turn well-defined problems into
  production-quality code, contributing to solutions that
  support IPB advisors and clients across international
  markets.

  This is an Associate-level role and an integral part of the
  IPB Tech AIML team, reporting to the AIML Team Lead.

  Job Responsibilities

  - Executes standard software solutions, design, development,
    and technical troubleshooting for the team's AI/ML
    products
  - Builds and tests features of agentic AI, LLM-powered and ML
    applications under the direction of senior engineers
  - Writes secure, high-quality production code and maintains
    algorithms that run synchronously with appropriate systems
  - Contributes to model evaluation, guardrail testing, and
    observability tasks to firm-wide Responsible AI standards
  - Participates in agile ceremonies, code reviews, and
    technical design discussions
  - Gathers, analyses, and draws conclusions from data to
    support feature delivery and troubleshooting
  - Learns continuously, using AI coding tools (e.g., Claude
    Code, GitHub Copilot) as part of day-to-day development

  Required qualifications, capabilities, and skills

  - Formal training or certification on AI/ML engineering
    concepts and 3+ years applied experience
  - Proficiency in Python and a working grasp of modern software
    engineering practices (testing, version control, code
    review)
  - Practical exposure to machine learning and/or Large Language
    Models (prompt engineering, RAG, or agentic frameworks)
    through study, projects, or work experience
  - Familiarity with AI coding tools as part of the development
    workflow
  - Understanding of CI/CD, containerisation, or cloud-native
    deployment concepts
  - Ability to communicate technical concepts clearly to
    teammates and stakeholders
  - BSc in Computer Science, Data Science, Engineering, or a
    related quantitative field

  Preferred qualifications, capabilities, and skills

  - Industry-recognised cloud / GenAI certification (e.g., AWS
    Certified Generative AI Developer - Professional, or
    similar)
  - Experience building or deploying an ML or LLM-powered
    application (academic, internship, or professional)
  - Exposure to financial services technology
  - Familiarity with Databricks, Kubernetes, or comparable ML /
    cloud platforms
  - Familiarity with JPM-internal AI/ML infrastructure and
    governance for internal candidates

