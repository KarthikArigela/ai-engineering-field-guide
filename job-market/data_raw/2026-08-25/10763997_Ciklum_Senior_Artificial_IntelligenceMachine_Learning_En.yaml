description: |
  Ciklum is looking for a Senior Artificial
  Intelligence/Machine Learning Engineer to join our team
  full-time in India.

  We are a custom product engineering company that supports
  both multinational organizations and scaling startups to
  solve their most complex business challenges. With a global
  team of over 4,000 highly skilled developers, consultants,
  analysts and product owners, we engineer technology that
  redefines industries and shapes the way people live.

  About the role:

  As a Senior Artificial Intelligence/Machine Learning
  Engineer, become a part of a cross-functional development
  team engineering experiences of tomorrow, driving innovation
  in AI-driven solutions with a global impact. This role is
  specifically tailored for a highly motivated professional
  with a strong technical background in Python and Java,
  hands-on expertise in developing Retrieval-Augmented
  Generation (RAG)-based chatbots, Machine Learning, Deep
  Learning, and solid cloud deployment experience, preferably
  on Azure/AWS.

  Responsibility :

  - Lead the design and development of AI-driven applications,
    with a strong focus on RAG-based chatbot solutions
  - Architect scalable, reliable, and maintainable solutions
    using Python and Java
  - Deploy, manage, and optimize AI applications on AWS cloud
    infrastructure while ensuring efficient resource
    utilization
  - Collaborate with cross-functional teams to gather
    requirements, define project scope, and deliver high-
    quality solutions
  - Mentor team members on software engineering best practices,
    AI methodologies, and cloud deployment strategies
  - Ensure solution quality through testing, debugging,
    performance optimization, and documentation
  - Stay updated on emerging AI technologies and incorporate
    innovative approaches into products and solutions

  Requirements:

  - Bachelor's or Master's degree in Computer Science,
    Engineering, Data Science, Mathematics, Statistics, or a
    related field
  - Minimum 5 years of professional experience in AI/ML
    Engineering
  - Strong programming expertise in Python and Java
  - Proven hands-on experience building RAG-based chatbots or
    similar Generative AI applications
  - Strong proficiency with cloud platforms, particularly AWS
    and Azure
  - Solid understanding of AI concepts, including NLP, vector
    databases, embedding models, and Large Language Model
    (LLM) integrations
  - Experience leading projects or teams and managing technical
    deliverables
  - AWS Certifications such as AWS Solutions Architect or AWS
    Machine Learning Specialty are preferred
  - Experience with AI/ML frameworks and libraries such as
    Hugging Face Transformers, TensorFlow, PyTorch, LangChain,
    or similar tools
  - Familiarity with Agile development methodologies
  - Excellent communication, analytical, and problem-solving
    skills

  What’s in it for you?

  - Strong community: Work alongside top professionals in a
    friendly, open-door environment
  - Growth focus: Take on large-scale projects with a global
    impact and expand your expertise
  - Tailored learning: Boost your skills with internal events
    (meetups, conferences, workshops), Udemy access, language
    courses, and company-paid certifications
  - Endless opportunities: Explore diverse domains through
    internal mobility, finding the best fit to gain hands-on
    experience with cutting-edge technologies
  - Care: We’ve got you covered with company-paid medical
    insurance, mental health support, and financial & legal
    consultations

  About us:

  At Ciklum, we are always exploring innovations, empowering
  each other to achieve more, and engineering solutions that
  matter. With us, you’ll work with cutting-edge technologies,
  contribute to impactful projects, and be part of a One Team
  culture that values collaboration and progress.

  India is a strategic innovation hub for Ciklum, with growing
  teams in Chennai and Pune leading advancements in EdgeTech,
  AR/VR, IoT, and beyond. Join us to collaborate on game-
  changing solutions and take your career to the next level.

  Explore, empower, engineer with Ciklum!

  Interested already? We would love to get to know you! Submit
  your application. We can’t wait to see you at Ciklum.

