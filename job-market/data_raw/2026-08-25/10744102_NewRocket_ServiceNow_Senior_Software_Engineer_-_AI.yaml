  Your Career

  NewRocket is a global team made up of ServiceNow
  professionals who help our customers run and grow their
  ServiceNow environments.  Founded with the insight that
  technology has the power to make people’s lives better and
  recognized as one of the world’s most innovative companies,
  ServiceNow provides a platform that makes workflows work.
  We are hiring for a ServiceNow Senior Sofware Engineer , to
  join our award-winning Customer team!

  - As a ServiceNow Senior Sofware Engineer -Platform/Custom
    Apps/ Integration you will be primarily developing
    customer applications for Work Order management,
    scheduling and dispatch.
  - Collaborate with stakeholders to identify key functionality
    within custom ServiceNow instance
  - Enhance ServiceNow (SN) event rules as necessary to ensure
    proper CMDB binding
  - Interact with technical SMEs to get necessary environment
    information to support your service map and event work

  Your Experience

  - Experience with ServiceNow Lead Engineer - Platform/Custom
    Apps/Integrations in ServiceNow
  - Comprehension of, and the ability to communicate and
    implement Platform/Custom Apps/Integrations
  - Ability to develop interfaces for each user audience
    depending on custom application models or Service Portals
  - Experience developing integrated logic and functional
    components to interface with ServiceNow internal services
    and APIs (via REST)
  - Service-oriented and distributed application architecture in
    the enterprise (web services, data access and persistence,
    client/server, etc.)
  - Understand Credential less and Credential based Discovery
  - Install, configure, and integrate software products from
    ServiceNowPlatform/Custom Apps/Integrations with a focus
    on the discovery, service mapping, certification
    management, Service Graph Connectors and Multisource CMDB
  - Ability to prevent duplicate Cis with CI identifiers
  - Extend Horizontal Discovery with custom Infrastructure
    Patterns and Application Patterns
  - Knowledge and ability to configure, manage and maintain MID
    servers
  - Proficient in working with command line console for Service
    Mapping
  - Ability to work with and migrate patterns between
    Environments for Service Mapping
  - Proficient in configuring Identification Rules for Service
    Mapping
  - Ability and knowledge in Discovery of multi-tier services
    including advance pattern configuration for Service
    Mapping



