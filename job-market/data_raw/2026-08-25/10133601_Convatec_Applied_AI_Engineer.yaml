description: |
  As an Applied AI Engineer, you will work hands-on with
  modern AI technologies to build intelligent agents, AI
  workflows and automation solutions using Microsoft's AI
  ecosystem. You'll collaborate closely with business
  stakeholders and technical teams to develop scalable
  solutions that can be deployed across the organisation.

  What Success Looks Like:

  - AI components meet defined accuracy, reliability and latency
    thresholds for each deployed workflow and application.
  - Safe fallback behaviour maintained across all deployed
    agents in production.
  - Frontier techniques evaluated with clear evidence-based
    recommendations within agreed timescales.
  - Model behaviour monitored continuously; issues identified
    and resolved proactively rather than reactively.
  - Reusable prompt and agent design patterns adopted across
    multiple initiatives.
  - Governance reviews pass first time with complete, well-
    documented AI component evidence.

  About Role

  - Design, build and optimise AI-powered solutions, agents and
    workflows that address real business challenges and
    deliver measurable value.
  - Develop solutions using Microsoft technologies including
    Azure AI Foundry, Copilot Studio, Azure OpenAI and
    Microsoft Fabric.
  - Collaborate with business stakeholders, product teams and
    technical colleagues to translate requirements into
    scalable AI and data solutions.
  - Build and integrate data pipelines, APIs and enterprise data
    sources to enable intelligent, production-ready
    applications.
  - Apply software engineering, data engineering and AI best
    practices to ensure solutions are secure, scalable and
    maintainable.
  - Support the full solution lifecycle, including prototyping,
    testing, deployment, monitoring and continuous
    improvement.
  - Implement DevOps, MLOps and AIOps practices to enable
    reliable deployment, observability and operational
    excellence.
  - Contribute to the development of reusable AI capabilities,
    engineering standards and best practices across the AI
    Centre of Excellence.
  - Partner with Data Engineers, UX teams and business
    stakeholders to drive adoption and successful delivery of
    AI-enabled solutions.
  - Stay current with emerging AI technologies and identify
    opportunities to leverage new capabilities to improve
    business outcomes.

  About You

  - 4+ years' experience in AI, ML or Data Engineering building
    production solutions on the Microsoft AI platform.
  - Hands-on experience building agentic solutions using
    Microsoft Copilot Studio and Microsoft Foundry.
  - Strong expertise in Azure AI and ML services including Azure
    Machine Learning, Azure OpenAI and Cognitive Services.
  - Proficiency with Microsoft Fabric, Azure Data Factory,
    Synapse and Foundry for large-scale data integration.
  - Solid understanding of data engineering principles - data
    lakes, Lakehouse (Delta/Parquet), ETL/ELT design and
    governance.
  - Strong skills in Python, SQL and API development (REST,
    GraphQL).
  - Experience implementing DevOps/MLOps and AIOps pipelines for
    deployment, testing and monitoring.

  Desirable

  - Experience integrating AI solutions with SAP or SAP Joule.
  - Knowledge of agentic AI architectures, prompt engineering
    and retrieval-augmented generation (RAG).
  - Experience with Power Platform, Dataverse or Power BI.
  - Familiarity with containerization technologies such as
    Docker and Kubernetes.
  - Understanding of Responsible AI, AI governance, GDPR and
    security compliance frameworks.

  Qualifications

  - Bachelor's or Master's degree in Computer Science, Data
    Science, Engineering or a related discipline, or
    equivalent practical experience.
  - Azure AI certifications are highly desirable.



