  Job Description

  Role: Senior Software Engineer - Javascript & AI

  Department: Engineering

  About the role and team:



  This is an opportunity to join a team working on the
  modernisation of web and marketing platforms. The team has
  recently inherited the CMS and is looking for support to
  delve deeper into team dynamics, responsibilities and the
  roadmap, with the core objective of refocussing the CMS team
  on higher-value marketing work and making the wider CMS
  operation more scalable and manageable. As a Senior Software
  Engineer, you’ll support the Principal Engineer in exploring
  proof of concepts (POCs), deep diving into agentic
  opportunities and helping shape how AI can contribute to the
  future of the platform.



  What you'll be doing:

  - Support the Principal Engineer in exploring technical
    opportunities across the CMS and wider web and marketing
    platforms.
  - Explore and prototype proof of concepts (POCs), turning
    promising ideas into practical options for the team.
  - Deep dive into agentic opportunities and consider where AI
    could create meaningful value for the platform and its
    users.
  - Contribute to understanding the current team dynamics,
    responsibilities and roadmap as the CMS capability is
    modernised.
  - Help identify opportunities to refocus the CMS team on
    higher-value marketing work while making the wider CMS
    operation more scalable and manageable.
  - Collaborate with the wider team to shape pragmatic technical
    approaches that support the future direction of the web
    and marketing platforms.

  We'd love to talk to you if:

  - Have strong software engineering experience with JavaScript
    and a passion for building modern web platforms.
  - Are comfortable exploring new technologies and working
    through ambiguity to understand what could work in
    practice.
  - Have an interest in AI and agentic approaches, with the
    curiosity to investigate where they can add genuine value.
  - Can work closely with a Principal Engineer and wider
    stakeholders to explore ideas, challenge assumptions and
    shape technical direction.
  - Enjoy improving how teams and platforms work, with a focus
    on scalable, manageable solutions and higher-value
    outcomes.

  What we’ll offer you:

  We trust people to do their best work. That means
  flexibility over rigid rules, impact over activity, and real
  investment in your growth both professionally and
  personally. You’ll be part of a supportive, and friendly
  culture, surrounded by smart, curious people who care deeply
  about what they do. We offer flexible working, including
  hybrid and remote options. Our office hubs are located in
  Edinburgh, Leeds, Manchester, London and Bulgaria, with
  occasional travel to client sites or CreateFuture offices
  when needed.

  We trust you to manage your time balancing collaboration
  with client time and focused work. What matters is the
  impact you have, not how busy you look.

  Our hiring process

  We try to keep our hiring process clear, fair and respectful
  of your time. We aim to get back to everyone who applies and
  we will be upfront about where you are in the process.

  It usually looks like this:

  - Call with our Talent Acquisition Team
  - Role specific capability interview

  Depending on the role, we might also ask you to do a short
  presentation, a practical or technical task or have a values
  focused conversation. We will explain what is involved
  before anything happens.

  Inclusion at CreateFuture

  We believe diverse teams build better workplaces and better
  products. We want CreateFuture to be a place where people
  feel able to be themselves and do their best work.

  If you need any adjustments or support during the
  application process, just. We will do what we can to help.

  We look forward to your application!
