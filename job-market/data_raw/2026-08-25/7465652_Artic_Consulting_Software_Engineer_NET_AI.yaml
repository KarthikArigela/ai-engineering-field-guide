description: |
  Job Summary:   Artic Consulting is seeking a talented Mid-
  Level Microsoft Application Developer with over 5+ years of
  experience to join our team. The ideal candidate will be
  proficient in Microsoft technologies and passionate about
  developing high-quality, scalable applications.

  Key Responsibilities:

  - Develop, test, and maintain robust and scalable web
    applications using Microsoft technologies, including .NET,
    C#, ASP.NET, and SQL Server.
  - Deep Knowledge and experience in developing solutions on
    Microsoft Azure, including deployment and management of
    cloud services.
  - Practical experience building or integrating AI
    workflows/AI-powered features
  - Ability to design and develop SQL queries, Store procedure,
    Functions, Views, Triggers and databases.
  - Design and implement front-end interfaces using HTML, CSS,
    JavaScript, and modern frameworks such as Angular or
    React.
  - Stay updated with the latest Microsoft technologies, tools,
    and frameworks, and evaluate their potential for
    application in our projects.
  - Write clean, efficient, and maintainable code following best
    practices and coding standards.
  - Conduct code reviews to ensure code quality and adherence to
    standards.
  - Troubleshoot, debug, and resolve application issues in a
    timely manner.
  - Stay current with emerging technologies and industry trends
    to ensure our applications remain competitive.
  - Provide technical support and mentorship to junior
    developers.

  Qualifications:

  - Bachelor's degree in Computer Science, Information
    Technology, or a related field.
  - 3-6 years of experience in full-stack application
    development using Microsoft technologies.
  - Understanding and implementation of Agile methodologies
    within Azure DevOps, Jira for project planning and
    execution.
  - Ability to create and utilize queries within Azure DevOps
    for managing tasks, bugs, and work items, under guidance.
  - Proficiency in .NET, C#, ASP.NET, MVC, and SQL Server.
  - Understanding of front-end technologies including HTML, CSS,
    JavaScript, and modern frameworks like Angular or React.
  - Experience with RESTful APIs and services.
  - Familiarity with cloud platforms such as Microsoft Azure is
    preferred.
  - Solid understanding of software development life cycle
    (SDLC) and Agile methodologies.
  - Excellent problem-solving skills and attention to detail.
  - Strong communication and collaboration skills.
  - Ability to work independently and as part of a team and
    train Junior Associates.

  What We Offer:

  - Innovative Projects: Work on cutting-edge projects that
    challenge your skills and inspire creativity.
  - Growth Opportunities: Access to continuous learning and
    professional development programs.
  - Collaborative Culture: Be part of a team that values
    collaboration, innovation, and inclusivity.
  - Mentorship: Receive guidance and mentorship from experienced
    professionals to accelerate your career growth
  - Working with US clients.
  - Training budget for learning new skills and technologies.
