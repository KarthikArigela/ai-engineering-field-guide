  Senior AIOPs Engineer

  Bottomline is at the forefront of digital transformation. 
  We are a growing global market leader uniquely equipped to
  address the changing needs of how businesses pay and get
  paid.  Our culture of working with and for each other
  enables us to delight our customers.  We empower our teams
  to think like owners driving customer delight, helping them
  grow their business and win in their markets.

  AI Ops Engineers at Bottomline are responsible for designing
  and delivering intelligent platforms, automation solutions,
  and AI-driven capabilities that transform how teams operate
  and innovate. By combining Artificial Intelligence, Machine
  Learning, Agentic AI, Generative AI, MLOPS , operational
  intelligence, and modern engineering practices, our team
  enables smarter decision-making, increased productivity,
  accelerated innovation, improved operational efficiency,
  reduced MTTR, and enhanced customer outcomes. We leverage
  emerging technologies to build intelligent, scalable, and
  resilient solutions that help drive automation, operational
  excellence, and digital transformation across the
  organization.

  In this role, you will be learning complex systems,
  specifically how they behave and fail in production. If you
  are inclined to identify, analyze, and eliminate failure
  modes through automation, operational intelligence, and AI-
  driven solutions, then you might be a good fit for the team.
  This important work not only drives growth for Bottomline
  but is also critical to helping our customers succeed in
  their markets.

  You might be a good fit for our team if the following
  describes you:

  - You are passionate about solving complex business and
    operational challenges through technology and automation.

  - You consistently leverage engineering, automation, and AI-
    driven approaches to improve efficiency and productivity.

  - You have experience working with cloud-native technologies,
    Kubernetes, APIs, and modern engineering platforms.

  - You think beyond individual tools and systems, understanding
    how data, applications, platforms, and people work
    together to deliver business outcomes.

  - You enjoy analyzing problems, identifying patterns, and
    developing innovative solutions.

  - You demonstrate strong learnability and the ability to
    rapidly adopt emerging technologies, frameworks, and
    industry trends.

  - You are curious about Artificial Intelligence, Machine
    Learning, Generative AI, Agentic AI, AI Agents, MCP, and
    MLOps practices.

  - You are enthusiastic about sharing knowledge, mentoring
    others, and fostering a culture of continuous learning.

  - You are driven to automate repetitive tasks, eliminate
    inefficiencies, and continuously improve existing
    processes.

  - You embrace experimentation, innovation, and data-driven
    decision-making.



  Preferred Technologies and Areas of Expertise

  - Programming Language (Python ,Java or any relevant )

  - Generative AI & LLMs

  - Agentic AI & AI Agent

  - MCP (Model Context Protocol)

  - RAG

  - MLOps & AI Platform Operations

  - AI Skill Files & Workflow Orchestrations

  - API Development & Enterprise Integrations

  - Kubernetes & Container Platforms

  - Cloud Platforms (AWS, Azure, GCP)

  - Python

  - API Integrations

  - CI/CD

  - Infrastructure as Code (IaC)

  - Observability Platforms

  - Vector Databases

  - Workflow Automation

  - Operational Intelligence & Analytics

  - Intelligent Automation



