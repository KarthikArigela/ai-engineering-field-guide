description: |
  OVERVIEW OF THE COMPANY

  Fox Corporation

  Under the FOX banner, we produce and distribute content
  through some of the world’s leading and most valued brands,
  including: FOX News Media, FOX Sports, FOX Entertainment,
  FOX Television Stations and Tubi Media Group. We empower a
  diverse range of creators to imagine and develop culturally
  significant content, while building an organization that
  thrives on creative ideas, operational expertise and
  strategic thinking.

  JOB DESCRIPTION

  ABOUT THE ROLE

  AI is transforming the way FOX operates, and we need
  builders who can turn possibility into reality. As a Staff
  Solutions Engineer on our AI Solutions Engineering team,
  you’ll develop and deploy AI-powered solutions that improve
  workflows, enhance creativity, and solve high-impact
  challenges across FOX. Whether you’re experimenting with
  large language models, automating repetitive processes, or
  helping teams seamlessly integrate AI, you’ll play a key
  role in advancing FOX’s use of cutting-edge technology. If
  you're energized by solving tough technical challenges,
  working across disciplines, and deploying AI where it makes
  a measurable difference, this is your opportunity to lead
  and make an impact.

  A SNAPSHOT OF YOUR RESPONSIBILITIES

  - Design, develop, and deploy AI-powered applications that
    solve real business challenges across FOX, with a strong
    focus on AI-driven technologies as part of the development
    process and as core components of the systems
  - Guide teams through AI adoption, providing best practices,
    hands-on onboarding, and technical support to ensure
    seamless integration
  - Research and evaluate AI/ML advancements, identifying
    opportunities where automation, prediction, or intelligent
    insights can create efficiency gains
  - Work cross-functionally with engineers, product managers,
    and stakeholders to embed AI into core business processes
  - Track, analyze, and refine AI initiatives, ensuring
    solutions continue to provide measurable value and align
    with FOX’s evolving priorities
  - Act as a tech lead guiding multiple engineering teams
    through development projects with business stakeholders
  - Manage senior stakeholders, driving conversations and
    ideation from a business perspective, and translating to
    technical collaboration with the engineering team

  WHAT YOU WILL NEED

  - Proficiency in modern programming languages (e.g.,
    TypeScript, Python) with an emphasis on building scalable,
    maintainable systems
  - Hands-on experience with AI/ML services, APIs, and
    automation tools, including large language models, prompt
    engineering, and system design patterns
  - Significant experience translating business needs into AI-
    driven solutions by selecting, fine-tuning, or integrating
    models within existing company infrastructure, ensuring
    seamless interoperability
  - Extensive experience with cloud environments (AWS, GCP,
    Azure) for deploying and managing AI-driven solutions at
    scale
  - Extensive experience architecting a variety systems using
    different compute and data paradigms while integrating
    with complex AI or ML subsystems
  - Strong communication skills, with the ability to explain
    complex AI concepts in a way that resonates with both
    technical and non-technical teams
  - A problem-solving mindset, with a focus on applying AI in
    practical, impactful ways that enhance efficiency,
    collaboration, and decision-making
  - Significant experience with tools / frameworks such as
    Next.js, AI SDK, Terraform, Node.js, React, FastAPI, AWS
    Lambda / GCP Cloud Functions, Kubernetes, a variety of
    database and streaming technologies such as DynamoDB,
    PostgreSQL, Kafka, queueing systems, Playwright, etc.

  WHY JOIN US?

  - Drive AI innovation at FOX, shaping how AI is used to
    create, distribute, and optimize content across our media
    brands
  - Tackle high-impact projects across news, sports,
    entertainment, and streaming, building AI-powered
    solutions that enhance workflows and drive efficiency
    across FOX
  - Work with cutting-edge AI tools and frameworks, exploring
    the latest in automation, predictive analytics, and
    machine learning
  - Collaborate with top engineers, product leaders, and media
    professionals, gaining exposure to a dynamic, fast-moving
    industry
  - Make a real impact by building solutions that drive
    efficiency and unlock new creative possibilities, while
    continuing to grow your expertise

  If you're excited about applying AI to real-world
  challenges, shaping the future of media and technology, and
  building solutions that make a measurable impact, we'd love
  to hear from you!

  #Ll-CC1

