description: |
  As a Senior AI Developer Experience Engineer, you will:

  - Drive the adoption and effective usage of GitHub Copilot and
    AI-assisted development tools across engineering teams
  - Enable developers to leverage AI coding assistants to
    improve productivity, code quality, and software delivery
    efficiency
  - Provide hands-on technical guidance and support for GitHub
    Copilot usage in real-world development environments
  - Define and promote best practices for AI-assisted software
    development, secure coding, and responsible AI usage
  - Troubleshoot and resolve issues related to GitHub Copilot
    integrations, developer workflows, and engineering
    toolchains
  - Collaborate with software engineers, architects, DevOps
    teams, and platform teams to optimize AI-driven
    development practices
  - Support implementation and rollout of GitHub Copilot across
    enterprise development environments
  - Conduct workshops, demonstrations, and enablement sessions
    to improve developer adoption and maturity
  - Analyze adoption metrics, productivity improvements, and
    usage patterns to measure the impact of AI development
    tools
  - Ensure alignment of AI-assisted development practices with
    enterprise security, governance, and compliance standards
  - Contribute to continuous improvement of engineering
    processes through automation and AI-enabled solutions

  What You Bring to the Table:

  - 8–10 years of experience in software engineering, DevOps,
    platform engineering, or developer enablement roles
  - Strong hands-on development experience with programming
    languages such as Python, Java, .NET, or similar
    technologies (Python preferred)
  - Practical experience with GitHub Copilot or similar AI-
    assisted coding platforms
  - Strong understanding of GitHub ecosystem including
    repositories, pull requests, Git workflows, branching
    strategies, and code collaboration practices
  - Experience with Azure DevOps, CI/CD pipelines, automation,
    and modern DevOps practices
  - Strong knowledge of software engineering principles, clean
    coding standards, design patterns, and application
    development lifecycle
  - Experience debugging, troubleshooting, reviewing, and
    optimizing application code
  - Familiarity with Microsoft Azure cloud services and cloud-
    based development environments
  - Knowledge of APIs, microservices architecture, Kubernetes,
    and modern application delivery practices
  - Experience with AI/ML developer tools, automation
    frameworks, or developer productivity platforms is
    preferred
  - Understanding of security and compliance considerations when
    implementing AI-assisted coding solutions
  - Strong communication skills with the ability to work with
    developers, architects, leadership teams, and business
    stakeholders

  You Should Possess the Ability To:

  - Enable engineering teams to successfully adopt AI-assisted
    development practices
  - Translate GitHub Copilot capabilities into practical
    engineering improvements and business value
  - Guide teams on secure, efficient, and responsible usage of
    AI coding assistants
  - Mentor developers and promote modern software engineering
    practices
  - Identify opportunities to improve developer productivity
    through AI, automation, and DevOps improvements
  - Work independently while collaborating effectively with
    cross-functional teams
  - Influence technical teams and stakeholders to drive adoption
    of new engineering capabilities

  What We Bring to the Table:

  - Opportunity to lead enterprise AI-assisted development
    adoption initiatives
  - Exposure to GitHub Copilot, Azure, DevOps automation, and
    modern engineering practices
  - Opportunity to shape developer productivity and engineering
    transformation strategies
  - Collaborative environment with development, architecture,
    security, and platform teams
  - Work on innovative AI-driven initiatives focused on
    improving software delivery and engineering excellence

