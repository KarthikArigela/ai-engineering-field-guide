description: |
  Donaldson is committed to solving the world’s most complex
  filtration challenges. Together, we make cool things. As an
  established technology and innovation leader, we are
  continuously evolving to meet the filtration needs of our
  changing world. Join a culture of collaboration and
  innovation that matters and a chance to learn, effect
  change, and make meaningful contributions at work and in
  communities.



  We are seeking a skilled Senior AI Developer to join our AI
  Center of Excellence (AI CoE) team drive enterprise-wide
  adoption of advanced AI technologies.

  In this position, the position will play a pivotal role in
  designing, developing, and operationalizing impactful AI
  solutions across customer engagement, knowledge management,
  e-commerce, market intelligence, and business operations.
  The candidate will lead the entire lifecycle of AI solution
  development, from initial design and architecture through
  deployment, governance, and integration, utilizing
  Generative AI, enterprise platforms, and agent-based
  architecture.

  In this role the candidate will work closely with business
  teams, enterprise architects, data teams, and product
  stakeholders to design reusable AI frameworks, accelerators,
  templates, and best practices that can scale across the
  organization

  Key Responsibilities

  - Design, develop, and deploy scalable AI agents and
    enterprise-grade AI/GenAI solutions tailored to business
    requirements.
  - Integrate agent capabilities into software applications and
    workflows via APIs and authorized platform interfaces.
  - Translate business needs into scalable AI solutions and
    architectural frameworks.
  - Foster development of reusable frameworks, templates, prompt
    libraries, and accelerators.
  - Support production readiness through monitoring, incident
    management, and model/agent behavior analysis.
  - Document solution functionalities, known limitations, and
    recommended usage practices.
  - Contribute to governance, scalability, and production
    readiness of AI solutions.
  - Mentor team members and assist in building internal
    capabilities across the AI CoE.
  - Maintain current knowledge of developments in AI, GenAI, and
    agent-based systems.
  - Construct AI-driven workflows employing prompt patterns,
    retrieval augmentation (RAG), semantic search, and agent-
    based architectures aligned with organizational standards.
  - Define and implement comprehensive evaluation methods
    including quality assurance, hallucination testing,
    safety/toxicity assessments, and robustness validation.

  Travel:

  - Up to 10% as required for business needs.

  Minimum Qualifications:

  - Master’s or Bachelor’s degree in Computer Science,
    Engineering, or a related field (or equivalent
    experience).
  - 4-6 years of proven experience in software development,
    including API integration and production deployment.
  - Demonstrated expertise in Python, SQL, and enterprise AI
    application development.
  - Experience delivering GenAI solutions, encompassing
    prompting, retrieval augmentation, evaluation, and
    workflow integration.
  - Ability to collaborate effectively with platform, data,
    security, and business stakeholders.

  Preferred Qualifications:

  - Experience with Azure AI (Foundry/SDKs) and Snowflake
    (Cortex AI).
  - Background in developing multi-step agents and production
    evaluation tools.
  - Familiarity with enterprise governance controls for GenAI
    (privacy, safety, auditability).
  - Experience optimizing inference costs/latency and
    implementing observability for AI features.

  Professional Skills

  - Strong analytical and problem-solving abilities.
  - Excellent communication and stakeholder management skills.
  - Capacity to thrive in agile, fast-paced environments.
  - Collaborative approach and leadership potential.
  - Commitment to continuous learning and skill development.
  - Effective task prioritization and project management across
    multiple initiatives.

