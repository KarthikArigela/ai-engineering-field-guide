description: |
  About Us

  KlearNow.AI is on a mission to futurize global trade. Our
  patented AI and machine learning platform digitizes and
  contextualizes unstructured trade documents to unlock real-
  time shipment visibility, drive smart analytics, and provide
  critical business intelligence—without the hassle of complex
  integrations.

  We empower supply chains to move faster, work smarter, and
  make data-driven decisions with confidence. With operations
  in the U.S., Canada, U.K., Spain, and the Netherlands—and
  aggressive growth plans underway—we’re scaling a global
  platform for the future of logistics.



  We achieve our goals by assembling a team of the best
  talents. As we expand, it's crucial to maintain and
  strengthen our culture, which places a high value on our
  people and teams. Our collective growth and triumphs are
  intrinsically linked to the success and well-being of every
  team member

  OUR VISION

  To empower people and optimize processes with AI-powered
  clarity.

  YOUR MISSION

  We’re building a team of bold thinkers, problem solvers, and
  storytellers. As part of our high-energy, inclusive
  workplace, you’ll challenge the status quo of traditional
  supply chains and help shape a more transparent,
  intelligent, and efficient world of trade.

  Whether you're a product innovator, logistics expert, or
  marketing storyteller—your work at KlearNow.AI will make a
  measurable impact.

  Why Klearnow.ai

  Global Impact: Be part of a platform live in five countries
  and expanding rapidly.

  Fast-Growing SaaS Company: Work in an agile environment with
  enterprise backing.

  Cutting-Edge Tech: AI-powered customs clearance, freight
  visibility, document automation, and drayage
  intelligence—all in one.

  People-First Culture: We invest in our team’s growth and
  well-being.

  Make Your Mark: Shape the future of trade with your ideas
  and energy.

  Responsibilities



  Position: Sr. AI Engineer/ AI Architect



  Company Overview:

  Klearnow is a leading technology company at the forefront of
  the AI revolution. We are dedicated to harnessing the power
  of artificial intelligence to drive innovation, enhance user
  experiences, and solve complex challenges across various
  industries. Our team is composed of passionate individuals
  who strive to create cutting-edge AI solutions that make a
  positive impact on the world.



  Role Overview

  We are looking for a hands-on Sr. AI Engineer/ AI Architect
  who is passionate about building production-grade AI systems
  and intelligent automation at scale. You will work on AI-
  driven backend services, LLM-powered workflows, and
  distributed AI systems that power mission-critical trade and
  logistics operations.

  Key Responsibilities

  - Design and build AI-powered applications and intelligent
    automation systems.
  - Develop scalable AI backend services using Python.
  - Build LLM-based workflows and AI agents to automate document
    and data processing.
  - Develop high-performance AI services using gRPC.
  - Work with event-driven architectures using Kafka for large-
    scale data processing.
  - Build AI pipelines for data ingestion, processing, and
    transformation.
  - Integrate AI capabilities with microservices-based
    architecture.
  - Rapidly prototype AI solutions and deploy them in production
    environments.
  - Optimize AI systems for performance, scalability, and
    reliability.
  - Collaborate closely with product, engineering, and platform
    teams.

  Key Qualifications

  - 6+ years of experience in AI engineering, backend
    engineering, or related roles.
  - Strong programming experience in Python.
  - Experience building AI systems, LLM applications, or
    intelligent automation workflows.
  - Experience with Kafka or similar event streaming platforms.
  - Experience building APIs/services using gRPC or similar
    technologies.
  - Good understanding of distributed systems and microservices
    architecture.
  - Familiarity with AI/ML frameworks such as PyTorch,
    TensorFlow, or Keras (good to have).
  - Experience with LLM frameworks, RAG pipelines, or AI agents
    is a plus.
  - Strong analytical thinking and problem-solving skills.

  Join our vibrant and forward-thinking team at KlearNow.ai as
  we continue to push the boundaries of AI/ML technology. We
  offer a competitive salary, flexible work arrangements, and
  ample opportunities for professional growth.

  We are committed to diversity, equality and inclusion.

  If you are passionate about shaping the future of logistics
  and supply chain and making a difference, we invite you to
  apply.
