description: |
  Job Description

  At SIXT, we are building the AI-powered future of security
  risk management and we need engineers who can make it real.
  As a Security AI Software Engineer, you will design and
  deploy intelligent agents that transform how SIXT assesses
  risk, aggregates evidence, and generates security insights
  at scale. You will bridge the gap between cutting edge AI
  capabilities and practical governance, risk, and compliance
  needs building an ecosystem that sets a new standard for how
  security risk is managed. If you are excited about
  pioneering AI driven security automation, apply now and
  become part of Team Orange!

  YOUR ROLE AT SIXT

  - You build and deploy AI agents that automate risk
    assessments, evidence collection, control testing, and
    risk scoring while gathering and visualising security data
    for executive dashboards and reporting
  - You leverage AI based software development and agentic AI to
    build intelligent automation tools, integrating them with
    cloud platforms, identity systems, and ticketing tools to
    drive seamless security risk and compliance operations
  - You develop conversational AI interfaces that enable risk
    and compliance teams to query data, generate reports, and
    access insights instantly through natural language
  - You train and enable Security teams to effectively use AI
    powered tools, measure ROI through metrics such as time
    saved and accuracy improved, and deliver demos and
    business cases that showcase tangible benefits
  - You iterate continuously based on user feedback and stay
    ahead of AI innovation by evaluating emerging capabilities
    including LLMs, autonomous agents, automation frameworks
    and applying them to solve real GRC challenges

  YOUR SKILLS MATTER

  - Education You have B.Tech, B.E, or Master's degree in
    Computer Science or a closely related discipline
  - Experience You have 4 to 8 years in software or system
    development with a demonstrable and recent focus on
    applying AI/ML to solve real business problems
  - AI & Automation You have hands-on experience building or
    deploying AI agents, automation workflows, and intelligent
    systems in enterprise environments, with solid familiarity
    in LLMs and prompt engineering
  - Communication You have strong ability to translate AI
    capabilities into tangible business value, influencing
    both technical and non-technical stakeholders effectively
  - Mindset You are a practical problem solver with a continuous
    learning approach you deliver working solutions
    iteratively and stay eager to explore and apply emerging
    AI technologies
  - Programming You have hands-on experience with Python (must-
    have)

  WHAT WE OFFER

  - Grow Further, Go Further Advance your skills and unlock your
    potential with our Education Assistance Program
  - Balance Your Career Benefit from a hybrid work environment
    complemented by flexible working hours
  - Fuel Your Day Great work deserves great fuel — enjoy meal
    benefits that keep you energised and ready to bring your
    A-game
  - Your Wellness Matters We are committed to your well-being
    through comprehensive insurance, wellness programs, health
    checkups, and fitness benefits
  - Recognition That Counts We create a culture of appreciation,
    rewarding your impact through referral incentives and
    loyalty perks as you grow with us
  - Growing Families, Growing Joy As your family grows, we are
    here to celebrate with a special newborn gift for your
    little one

  Additional Information

  About us:

  We are a globally leading mobility service provider with a
  revenue of €4.00 billion and around 9,000 employees
  worldwide. Our mobility platform ONE combines our products
  SIXT rent (car rental), SIXT share (car sharing), SIXT ride
  (taxi, ride, and chauffeur services), and SIXT+ (car
  subscription), giving our customers access to our fleet of
  350,000 vehicles, the services of 4,000 cooperation
  partners, and around 5 million drivers worldwide. Together
  with our franchise partners, we are present in more than 110
  countries at 2,000 rental stations. At SIXT, top-tier
  customer experience and outstanding customer service are our
  highest priorities. We believe in true entrepreneurship and
  long-term stability and align our corporate strategy with
  foresight. Get started with us and apply now!
