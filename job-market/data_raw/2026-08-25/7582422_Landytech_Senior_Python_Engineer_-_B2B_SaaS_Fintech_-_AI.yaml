description: |
  Landytech is on a mission to revolutionize the way that
  investment managers, asset owners and their advisors access
  asset information. Powered by Sesame, an industry-leading
  investment reporting platform, we are helping clients in
  over 15 countries make informed investment decisions and
  deliver insights faster.

  The company is growing rapidly and it's an exciting time to
  join, having secured $12M in Series B funding in January
  2023. In just four years, it has gone from two co-founders
  to a team of 100+ staff, with offices in London and Paris.
  At Landytech, we see diversity as our strength with a team
  from over 15 countries and 14 languages spoken.

  Team & Role

  We're seeking a talented Software Engineer to join our team.
  You'll build and maintain services and tools (written
  primarily in Python) that process and publish financial
  metrics, directly impacting how our customers access and
  utilize critical financial data.

   This is an excellent opportunity for engineers with strong
  fundamentals to develop their expertise in a finance-focused
  environment using modern technologies. We welcome candidates
  at all experience levels - whether you're early in your
  career and eager to learn, or a seasoned engineer seeking
  hands-on technical work in the fintech domain.

  Key Responsibilities

  - Develop and maintain robust APIs for processing and
    publishing financial metrics
  - Write clean, efficient, and well-documented code
  - Collaborate with the team to design scalable solutions for
    financial data pipelines
  - Participate in code reviews and contribute to engineering
    best practices
  - Debug and optimize existing systems for performance and
    reliability
  - Work closely with stakeholders to understand requirements
    and deliver solutions

  Your Skills & Expertise

  - Solid understanding of data structures, algorithms, and
    software design principles
  - Good knowledge of Python and object-oriented programming
    principles
  - Understanding of relational databases and database design
    fundamentals
  - Familiarity with unit testing and integration testing
    practices Comfortable working collaboratively in a team
    environments

  Nice to have

  - Experience with low-level programming languages (Rust, C++)
  - Financial domain knowledge: understanding of financial
    concepts, metrics, or fintech/finance experience
  - Experience building data pipelines, ETL processes, or
    handling large-scale data
  - Familiarity with modern data processing libraries (NumPy,
    Polars, DuckDB)

  What we're looking for

  - Beyond the technical requirements, we value engineers who:
  - Are self-motivated and eager to learn and expand their
    skills
  - Possess an analytical mindset with strong attention to
    detail
  - Take pride in writing maintainable, well-tested code
  - Are excited about working at the intersection of technology
    and finance
  - Bring fresh perspectives and ideas to the team

  Our Benefits

  - An opportunity to work in a fast growing fintech
    revolutionizing investment reporting
  - Hybrid style of work/WFH allowed depending on role
  - Competitive salary & stock options package
  - Private medical insurance with Bupa for you and your family
    members
  - Life insurance option
  - Pension Plan with NEST
  - Cycle to Work Scheme and gym allowance
  - Office food & drinks, regular socials

  If this sounds like a match to you, we are looking forward
  to receiving your application!
