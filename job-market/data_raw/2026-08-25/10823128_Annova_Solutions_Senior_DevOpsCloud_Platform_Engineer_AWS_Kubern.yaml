  Preferred Qualifications

  - AWS Certified Solutions Architect – Professional or
    Associate.
  - AWS Certified DevOps Engineer – Professional.
  - Certified Kubernetes Administrator (CKA) or Certified
    Kubernetes Application Developer (CKAD).
  - Experience with AI platforms, MLOps, or GPU infrastructure.
  - Experience deploying high-availability, multi-tenant SaaS
    applications.
  - Familiarity with service mesh technologies (Istio or
    Linkerd) is a plus.
