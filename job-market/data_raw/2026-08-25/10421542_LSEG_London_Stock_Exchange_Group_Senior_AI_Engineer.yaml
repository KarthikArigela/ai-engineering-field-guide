description: |
  ABOUT US:

  LSEG (London Stock Exchange Group) is more than a
  diversified global financial markets infrastructure and data
  business. We are dedicated, open-access partners with a
  dedication to excellence in delivering the services our
  customers expect from us. With extensive experience, deep
  knowledge and worldwide presence across financial markets,
  we enable businesses and economies around the world to fund
  innovation, manage risk and create jobs. It’s how we’ve
  contributed to supporting the financial stability and growth
  of communities and economies globally for more than 300
  years. Through a comprehensive suite of trusted financial
  market infrastructure services – and our open-access model –
  we provide the flexibility, stability and trust that enable
  our customers to pursue their ambitions with confidence and
  clarity.

  LSEG is headquartered in the United Kingdom, with
  significant operations in 70 countries across EMEA, North
  America, Latin America and Asia Pacific. We employ 25,000
  people globally, more than half located in Asia Pacific.
  LSEG’s ticker symbol is LSEG.

  OUR PEOPLE:

  People are at the heart of what we do and drive the success
  of our business. Our culture of connecting, creating
  opportunity and delivering excellence shape how we think,
  how we do things and how we help our people fulfil their
  potential. We embrace diversity and actively seek to attract
  individuals with unique backgrounds and perspectives. We
  break down barriers and encourage teamwork, enabling
  innovation and rapid development of solutions that make a
  difference. Our workplace generates an enriching and
  rewarding experience for our people and customers alike. Our
  vision is to build an inclusive culture in which everyone
  feels encouraged to fulfil their potential.

  We know that real personal growth cannot be achieved by
  simply climbing a career ladder – which is why we encourage
  and enable a wealth of avenues and interesting opportunities
  for everyone to broaden and deepen their skills and
  expertise. As a global organisation spanning 70 countries
  and one rooted in a culture of growth, opportunity,
  diversity and innovation, LSEG is a place where everyone can
  grow, develop and fulfil your potential with meaningful
  careers!!

  ROLE SUMMARY:

  We are looking for an enthusiastic Senior AI Engineer who is
  passionate about working with the latest artificial
  intelligence technologies and techniques. This is a
  demanding role with a wide range of essential skills - you
  will be fully engaged each day in the depths of AI
  engineering.

  WHAT YOU'LL BRING:

  - Azure architecture and engineering, including landing zones,
    networking, storage, compute, and Domain Name System (DNS)
    configuration.
  - Azure AI Foundry, including models, agents, deployments, and
    endpoints. Azure AI Search, including indexes, retrieval-
    augmented generation (RAG), vector search, and vector
    databases.
  - Azure Cosmos DB, including its use by agents and for storing
    agent memory. Azure API Management (APIM), particularly
    the secure exposure and management of large language
    models (LLMs).
  - Azure observability, including Azure Monitor, Application
    Insights, and Azure Workbooks.
  - Langfuse, including designing and conducting evaluations and
    assessing outcome quality and value relative to token
    usage and cost. Datadog for logging, observability, and
    LLM analytics.
  - RAG, vector databases, and advanced retrieval techniques
  - LiteLLM as an AI and Model Context Protocol (MCP) gateway.
    MCP gateways and their integration with MCP servers
  - Contemporary AI models—including, as of July 2026, Fable 5,
    GPT-5.6, and GLM-5—and an understanding of their
    performance, appropriate usage, and behaviour across
    different agent harnesses.
  - Claude Code, Codex, open-source agent harnesses, and GitHub
    Copilot, including their configuration, telemetry, and
    policy controls.
  - OpenTelemetry (OTel), including telemetry produced by agent
    harnesses and APIM, and its ingestion into Langfuse.

  - Developing experimental agents using Azure AI Foundry Agent
    Service and Azure AI SDKs. Advanced Langfuse usage,
    including datasets, experiments, prompt management, custom
    evaluators, tracing, and cost analysis.
  - Experimenting with advanced RAG techniques such as hybrid
    search, semantic ranking, query rewriting, reranking, and
    metadata filtering.

  Desirable skills and experience:

  - Building AI applications with LangChain and LangGraph,
    including agents, tool calling, memory, checkpoints, and
    human approval stages.
  - Building document-processing workflows with Azure AI
    Document Intelligence, Azure Storage, Azure Functions, and
    Azure AI Search. Applying Azure AI Content Safety and
    other guardrails to prompts, retrieved content, model
    responses, and tool execution.
  - Designing and evaluating multi-agent workflows, including
    delegation, shared context, permissions, and termination
    conditions.
  - Creating synthetic test data, adversarial test cases,
    evaluation datasets, and regression tests for AI
    experiments.

  Career Stage:

  Manager

  London Stock Exchange Group (LSEG) Information:

