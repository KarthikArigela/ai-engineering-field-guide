description: |
  About Nightfall:

  Nightfall is the AI-native, unified data loss prevention and
  insider risk management platform that protects sensitive
  data across SaaS apps, GenAI tools, email, endpoint devices,
  and more. Hundreds of customers, spanning AI innovators to
  top 10 banks, trust Nightfall to detect and stop data
  exfiltration at scale. Nightfall enables organizations to
  innovate freely without the risks of losing intellectual
  property or exposing customer data. Our agentic platform
  helps security teams regain their time by putting data loss
  prevention on autopilot. With automatic remediation,
  security violations can be resolved automatically before
  they become incidents, and end-users can be automatically
  trained and coached in the moment to self-heal violations
  that they introduce.

  Nightfall is backed by leading VC firms including Bain
  Capital Ventures (Enrique Salem - former CEO of Symantec),
  Venrock (early investors in Cloudflare), WestBridge Capital,
  Pear VC (early investors in Dropbox and Doordash), and a
  cadre of cybersecurity leaders including Frederic Kerrest
  (founder of Okta), Maynard Webb (former COO of eBay), Ryan
  Carlson (President of Chainguard), Kevin Mandia (founder of
  Mandiant), and many others.

  About the role:

  At Nightfall AI, we’re building the future of data security
  with machine learning at its core. Our AI systems detect and
  prevent data leaks in real time for leading organizations.

  We’re looking for a motivated, highly talented engineer to
  join our AI Platform team. You’ll work with world-class
  engineers to design and enhance the AI models that power our
  security products. Learn how to build and scale the
  underlying system that hosts these models.

  If you love solving hard problems, experimenting with the
  NLP model architectures, latest LLMs, eager to dive deep
  into the internals of the underlying systems, and ultimately
  make a real impact — this is your chance to jump in early
  and grow fast.

  What You’ll Do

  - Build and ship the AI systems that power Nightfall’s
    Security products.
  - Work hands-on with Python to analyze data, experiment with
    new natural language or other model architectures, fine
    tune models, benchmark and monitor model accuracy, build
    automation for automated training and deployment, real-
    time inferencing, or designing agentic workflows.
  - Work hands-on with Go to build the microservices that ingest
    and process data at scale through the use of streaming
    infrastructure, distributed caching, and highly concurrent
    execution.
  - Collaborate across engineering and product to turn ideas
    into live AI features
  - Participate in the team's oncall rotation to help drive
    operational excellence

  You’re a Great Fit If You:

  - 5+ years of industry experience with a graduate degree in
    Computer Science or Engineering with rigorous coursework
    in Artificial Intelligence, Machine Learning, Data Science
    or related field.
  - Code fluently in Python, and Go (or C++ or Java) with a
    solid understanding of Data Structures and Algorithms.
  - Hands-on experience with building Deep learning models and
    taking them to production at large scale, including
    complex software engineering in delivering end-to-end AI
    projects
  - Hands-on experience in building Agentic workflows and using
  - Thrive in fast-moving, high-ownership environments.
  - Are excited to learn from experienced mentors and level up
    quickly.

  Bonus Points For:

  - Hands-on experience with building models in Pytorch or other
    frameworks to solve complex problems in NLP or other
    domains, including fine-tuning LLMs or building agentic
    workflows around them
  - Familiarity with AWS, GCP and experience with systems such
    as Kafka, Redis, Postgres, etc.
  - Hands-on experience with MLOps for training, inferencing,
    evaluation, monitoring and deployment
  - Hackathon wins, research papers, or open-source
    contributions.

  Why Nightfall

  - Work with a tight-knit team of AI/ML builders who ship fast
    and mentor deeply.
  - Get hands-on experience with cutting-edge AI systems at
    scale.
  - See your models make an immediate impact in real-world
    security applications.
  - Hybrid schedule (3 days in-office) working out of our
    Bangalore office.

  If you’re ready to go beyond theory and build AI that
  matters — come join Nightfall.

  Environment

  Nightfall AI takes pride in being an equal-opportunity
  employer. We value a diverse and global talent pool and the
  collaboration that results from having a diverse and
  inclusive team. All applicants will be considered for
  employment without attention to race, color, religion, sex,
  sexual orientation, gender identity, national origin,
  veteran or disability status. Our hiring decisions are based
  exclusively on merit, qualifications, and business needs.

  Compensation

  Employee compensation will be determined based on interview
  performance, level of experience, specialization of skills,
  and market rate. During the offer discussion, your recruiter
  will review the finalized base salary, bonus (for applicable
  roles), benefits & perks, and stock options as they’ll be
  reflected in the offer letter.
