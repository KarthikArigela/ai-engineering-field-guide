  Job Description

  We are seeking a seasoned SAP BTP AI Developer/Consultant to
  design, develop, and deploy

  enterprise-grade Generative AI and Agentic AI solutions on
  the SAP Business Technology

  Platform. The ideal candidate will combine deep technical
  expertise in BTP extension

  frameworks with practical experience in AI orchestration
  (Joule, RAG) to deliver intelligent

  workflows that enhance business processes across S/4HANA
  landscapes.

