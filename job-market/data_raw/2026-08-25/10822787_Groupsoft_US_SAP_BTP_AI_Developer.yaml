  SAP BTP or SAP Generative AI certification is highly
  desirable

  Should have experience on integrating Large Language Models
  (OpenAI, Claude) and Python-

  based AI frameworks (LangChain).

  Familiarity with AI-powered development tools like Github
  Copilot or Claude Code.

  Should have experience with at least three of the components
  in SAP BTP, for example, SAP

  Joule AI, SAP integration suite, SAP extension suite, SAP
  database and data management, SAP

  HANA Cloud

  Should lead the design, configuration, and deployment of SAP
  BTP services (Integration Suite,

  Extension Suite, HANA Cloud)

  Should be able to build custom applications using BTP’s
  Extension Suite and ensure they meet

  business needs

