description: |
  Job Title: Senior AI Engineer position  Location:
  India/Remote Duration: Full time

  Job Overview: SoftClouds LLC is looking for an experienced
  Senior AI Engineer with a strong background in Python,
  React, LangChain, LangGraph, AWD Bedrock, and Azure Foundry.
  The ideal candidate will have a proven track record in
  developing and deploying advanced AI solutions and a passion
  for driving innovation in the field.



  Roles & Responsibilities:

  • Design, develop, and implement GEN AI products , AgentiC
  AI , predictive analytics , and algorithms using Python and
  related libraries.

  • Collaborate with cross-functional teams to integrate AI
  solutions into existing systems using React and LangChain.

  • Utilize LangGraph for efficient data processing and
  analysis.

  • Leverage AWD Bedrock and Azure Foundry for scalable and
  reliable AI solution deployment.

  • Conduct research and stay up-to-date with the latest
  advancements in AI technologies.

  • Troubleshoot and optimize AI models to improve performance
  and accuracy.

  • Mentor and guide junior engineers in best practices and
  advanced AI techniques.

  • Implement algorithms for processing, analyzing, and
  understanding textual data, ensuring high performance and
  scalability.

  • Focus on essential tasks like data manipulation, regular
  expressions, and data parsing using Python libraries such as
  Spacy, LlamaIndex,LangChain, and Regex.

  • Integrate with pre-built NLP models, ensuring efficient
  model usage for tasks like Text Generation, entity
  recognition, text classification and text summarization etc.

  • Write reusable Python code following best practices for
  quality, modularity, and performance.

  • Collaborate with teams to gather requirements and deliver
  Python-based solutions for business needs.

  • Optimize Python code to ensure efficiency, scalability,
  and minimal resource usage in production.

  • Use Git for version control, managing Python code updates,
  and collaborating with team members.

  • Research new libraries and tools to improve Python-based
  systems and workflows.

  • Solve complex problems efficiently, adapting to new
  challenges and evolving requirements.

  • Maintain clear documentation for all Python applications,
  ensuring clarity and ease of use.

  Requirements

  Required skills and experience:



  • Extensive experience in Python programming and AI
  development, working with various Python libraries and
  tools.

  • Proficient in libraries like Python libraries such as
  TensorFlow, PyTorch, spaCy, NLTK, and Hugging Face

  to build, train, and fine-tune NLP models for tasks and
  React for front-end development.

  • Hands-on experience with LangChain and LangGraph.

  • Familiarity with AWD Bedrock and Azure Foundry for AI
  deployment.

  • Strong problem-solving skills and the ability to work
  collaboratively in a team environment.

  • Experience with large datasets, handling, processing, and
  optimizing data workflows in Python.

  • Strong understanding of software development processes and
  methodologies like Agile and Git.

  • Write clean, modular, reusable code with focus on quality,
  scalability, and performance.

  • Experience using version control for collaborative
  development and code management.

  • Excellent communication skills for explaining complex
  technical concepts to both technical and non- technical
  teams.

  • Detail-oriented with a focus on writing error-free, high-
  quality Python code.

  • Adapt quickly to new technologies and take ownership of
  learning opportunities.

  • Knowledge and Experience of working with Large Language
  Models specifically OpenAI Models.

  • Knowledge and Experience of working with
  OpenSearch/Elasticsearch.

  • Knowledge/Experience in Vector Database, Vector Search,
  Retrieval Augmented Generation (RAG), Chunking and
  Splitting.

  • Knowledge and Experience in designing various prompts
  (Prompt Engineering).

  • Excellent communication skills and the ability to explain
  complex AI concepts to non-technical stakeholders.
