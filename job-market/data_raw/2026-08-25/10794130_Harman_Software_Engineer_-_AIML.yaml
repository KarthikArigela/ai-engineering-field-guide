  About the Role

  We are looking for a highly skilled Agentic AI Engineer to
  design and develop LLM-powered intelligent agents for
  embedded and edge platforms. This role focuses on building
  autonomous AI workflows, multimodal systems, and real-time
  inferencing solutions integrated into embedded environments.

  You will play a key role in advancing AI-driven automation,
  decision-making, and workflow orchestration in automotive
  and embedded systems.

  What You Will Do

  - Design and develop LLM-powered agentic workflows for
    embedded/edge platforms
  - Build AI agents and orchestration pipelines using frameworks
    such as LangChain / LangGraph
  - Develop multimodal AI systems integrating text, logs, and
    sensor-based inputs
  - Implement RAG (Retrieval-Augmented Generation) pipelines and
    prompt engineering strategies
  - Optimize edge AI inferencing , including:
    - TensorFlow Lite or similar frameworks
    - Model quantization and performance tuning
    - Efficient utilization of NPU / GPU resources
  - Develop microservices-based architectures for scalable AI
    deployment
  - Integrate AI agents into distributed systems and service-
    oriented platforms
  - Collaborate with cross-functional teams to embed AI
    capabilities into software development and validation
    workflows [Harman Pro...osal_MBRDI | PowerPoint]
  - Contribute to automation use cases, improving efficiency
    across development lifecycle (e.g., defect analysis,
    requirement processing, workflow automation) [Leads
