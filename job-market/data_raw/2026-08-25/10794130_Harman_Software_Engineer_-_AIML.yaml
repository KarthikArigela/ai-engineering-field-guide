  What You Need to Be Successful

  - 1 to 3 years of experience in AI/ML and software development
  - Strong hands-on experience in:
    - LLM-based application development
    - Agentic AI workflows and orchestration frameworks (e.g.,
      LangChain)
  - Good understanding of:
    - Multimodal AI systems
    - RAG pipelines and prompt engineering
  - Experience in edge AI deployment , including:
    - TensorFlow Lite or similar
    - Model optimization and quantization
  - Knowledge of hardware acceleration concepts:
