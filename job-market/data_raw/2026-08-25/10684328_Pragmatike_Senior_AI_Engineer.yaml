  About the Opportunity

  Pragmatike is recruiting on behalf of a fast-growing
  technology company building critical infrastructure that
  powers high-volume, real-time business operations across
  multiple systems and platforms.

  We are seeking a Senior AI Engineer to develop, deploy, and
  optimize production AI systems.

  What You'll Do

  - Develop and deploy machine learning and AI systems.
  - Work with LLMs, generative AI, and modern ML frameworks.
  - Build inference and evaluation pipelines.
  - Optimize model performance, latency, and cost.
  - Integrate AI capabilities into production applications.
  - Develop reliable data and model workflows.
  - Monitor AI systems in production.
  - Collaborate with product and engineering teams.

  What We're Looking For

  - 5+ years of software or ML engineering experience.
  - Strong Python and modern ML frameworks.
  - Experience deploying AI/ML systems to production.
  - Strong understanding of LLMs and model inference.
  - Solid software engineering and system design skills.
  - Strong analytical and problem-solving abilities.

  Nice to Have

  - PyTorch, Transformers, vLLM, TGI, or Triton.
  - Kubernetes and cloud infrastructure.
  - GPU optimization.
  - RAG, fine-tuning, or evaluation systems.
  - Startup or scale-up experience.

  Why Join?

  Our client is building highly scalable technology that sits
  at the core of critical business operations, offering
  engineers the opportunity to work on complex systems, large-
  scale integrations, and real-world technical challenges.

  You'll join a collaborative, fast-moving environment where
  ownership is encouraged, decisions are made quickly, and
  engineers have meaningful influence on architecture, product
  direction, and engineering culture.

  This role offers the opportunity to tackle challenging
  backend problems, work with modern technologies, and grow
  alongside an ambitious team building for scale.

  Full benefit package and competitive compensation.



