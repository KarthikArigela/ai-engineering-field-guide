  Job Description:

  The opportunity:

  As an AI/ML Engineer, you will be part of Operation Center,
  India (INOPC-PG), aiming to develop a global value chain,
  where key business activities, resources, and expertise are
  shared across geographic boundaries to optimize value for
  Hitachi Energy customers across markets. As part of
  Transformers BU, we provide high-quality engineering and
  Technology to Hitachi Energy world. This is an important
  step from Hitachi Energy's Global Footprint strategy.

  How you’ll make an impact:

  - A technically skilled and multidisciplinary professional to
    support the development, deployment, and scaling of an
    end-to-end analytical solution for monitoring and
    optimizing the Vapor Phase Drying (VPD) process in
    transformer manufacturing.
  - The candidate will work across software development, machine
    learning, data pipelines, and work with experts in
    dashboard design and machine learning.
  - Strong proficiency in Python including modular scripting,
    virtual environments, and key libraries (pandas, numpy,
    scikit-learn, pyarrow, seaborn, plotly, MLflow).
  - Solid understanding of Git version control and collaborative
    development. Basic Docker containerization knowledge.
  - Experience with Windows/Linux environments and cloud cluster
    configuration. Hands-on experience with Azure Data
    Explorer (Kusto) and Hive Metastore.
  - Understanding of ETL pipelines and data workflow
    orchestration. Proficiency in SQL/NoSQL database systems
    and data access patterns. Statistical analysis and
    hypothesis testing fundamentals Azure Cloud Ecosystem.
  - Azure Machine Learning Service for model development and
    deployment. Azure Databricks for big data processing
    (basic usage). Azure DevOps for CI/CD pipeline
    implementation.
  - Azure Data Factory for data pipeline creation and
    management. Experience training and validating ML models
    including Random Forest, Logistic Regression, KNN.
  - Specialized knowledge in Time Series Forecasting Models (AR,
    ARMA, ARIMA, Matrix Profile, Prophet).
  - Responsible to ensure compliance with applicable external
    and internal regulations, procedures, and guidelines.
  - Living Hitachi Energy’s core values of safety and integrity,
    which means taking responsibility for your own actions
    while caring for your colleagues and the business.

  Your background:

  - Bachelor’s degree in computer science, Data Science, AI/ML,
    or related discipline and at least 3-5 years of related
    working experience.
  - 2-3 years in Machine Learning or Data Science roles. At
    least 2 end-to-end ML projects successfully deployed in
    production.
  - Experience with cloud platforms, preferably Azure. Track
    record of working with industrial or IoT sensor data.
    Understanding of ethical considerations in AI.
  - Ability to collaborate effectively across R&D, IT,
    production, and business teams. Clear technical
    communication and comprehensive documentation skills.
  - Proactive problem-solving and process optimization approach.
  - Strong analytical thinking and systematic troubleshooting
    abilities.
  - Proficiency in both spoken & written English language is
    required.

