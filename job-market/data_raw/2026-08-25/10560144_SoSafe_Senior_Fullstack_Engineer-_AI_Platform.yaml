description: |
  SoSafe has the ambition to become the leading human risk
  management provider in Europe. Our award-winning awareness
  platform triggers behavioural change by providing effective
  and engaging training and simulations on cybersecurity and
  data protection. Cybercrime is costing the world >$10
  trillion annually and growing by 15% p.a. - we invite you to
  be part of the solution!

  Location Requirement: This role is open to candidates
  currently based in and legally authorized to work in the UK,
  Portugal, or Ireland. We are unable to consider applicants
  outside these locations.

  Why Us?

  AI is transforming how software is built. At SoSafe, you'll
  join the team building the AI platform that powers the next
  generation of AI capabilities across our products.

  Rather than building individual AI features, you'll create
  the shared infrastructure, tooling and services that enable
  every engineering team to build, deploy and operate AI
  safely and at scale. Working in a small, highly autonomous
  team, you'll have real ownership, shape technical direction,
  and build systems that engineers across SoSafe rely on every
  day.

  Here's how you'll make a difference

  - Build the core capabilities behind SoSafe's Agentic AI
    Platform, including agent runtimes, model routing, tool
    registries and shared platform services.
  - Design and build production-grade platform services and
    developer tooling using Node.js, TypeScript, NestJS and
    React.
  - Develop reusable AI infrastructure that enables engineering
    teams to build, deploy and operate AI agents securely and
    at scale.
  - Work hands-on with LLMs, LangChain/LangGraph and agent
    orchestration, solving platform challenges around
    governance, observability and scalability.
  - Own features end-to-end—from architecture and implementation
    through deployment and continuous improvement.
  - Shape the future of AI engineering at SoSafe by contributing
    ideas, improving developer experience and influencing
    platform architecture.

  What you'll bring

  - Strong experience building modern full-stack applications
    with Node.js, TypeScript and React.
  - Hands-on experience building AI-powered applications or
    platforms using LLMs, AI agents, LangChain, LangGraph, MCP
    or similar technologies.
  - A platform mindset—you enjoy building reusable systems, APIs
    and tooling that help other engineers move faster.
  - Confidence using AI coding tools as part of your daily
    workflow while applying sound engineering judgment to
    architecture, code quality and technical decisions.
  - The ability to thrive in ambiguity, take ownership and solve
    complex engineering problems in a fast-moving environment.
  - Experience with developer platforms, distributed systems,
    infrastructure-as-code, cloud-native architectures or AI
    governance is a strong advantage.

  What we offer*

  - Work/Life balance: Flexible hours, 33 vacation days
  - Wellbeing and financial support: Access to Open Up,
    corporate discounts
  - Connection & community: Virtual events, collaborative team
    activities, and opportunities for local meet-ups
  - And the list goes on: Tech equipment, referral bonuses, dog-
    friendly HQ

  *Perks and benefits listed above are for full-time employees
  and may vary slightly by office location. These are just a
  sample — you'll learn more during the interview process.

  About Us

  At SoSafe, we’re on a mission to make the digital world
  safer by addressing the human factor in cybersecurity. As
  one of the fastest-growing security awareness scale-ups
  worldwide, we leverage behavioural science and data-driven
  learning to empower people against cyber threats. Our Human
  Risk Management approach helps organisations turn their
  employees into their strongest line of defence.

  Backed by leading VCs like Highland Europe and Global
  Founders Capital, we’re rapidly expanding across the globe.
  We’re looking for team players who want to drive meaningful
  change in cybersecurity, take ownership of their work, and
  grow with us.

  If you thrive in a vibrant, purpose-driven environment that
  values innovation, diversity, and collaboration, then this
  is the place for you!
