description: |
  AgileEngine is an Inc. 5000 company that creates award-
  winning software for Fortune 500 brands and trailblazing
  startups across 17+ industries. We rank among the leaders in
  areas like application development and AI/ML, and our
  people-first culture has earned us multiple Best Place to
  Work awards.

  WHY JOIN US

  If you're looking for a place to grow, make an impact, and
  work with people who care, we'd love to meet you!

  ABOUT THE ROLE

  We are looking for a Lead Agentic AI Engineer to serve as
  the senior AI developer for a Cloud Security Tooling team,
  architecting GenAI workflows that automate configuration
  baseline enforcement, drift detection, and remediation
  across public cloud infrastructure. You will design RAG-
  based systems and LLM API integrations to generate compliant
  Terraform modules and Rego policies, lead a distributed
  engineering team in a follow-the-sun model, and own the
  technical strategy for AI enablement across cloud security
  tooling. The role requires 6+ years of software engineering
  experience with 2+ years each in cloud IaC and agentic AI
  development.

  WHAT YOU WILL DO

  - Architect Generative AI workflows utilizing RAG, vector
    databases, and LLM APIs to automate the creation of
    configuration requirements, Rego policies, and Terraform
    modules for new cloud services (e.g., AWS S3).

  - Oversee the development of AI-enabled drift detection,
    continuous discovery, and gap analysis capabilities to
    accelerate response and remediation activities.

  - Accelerate the generation and validation of compliant
    Terraform modules, Rego policies (for Wiz Custom
    Configuration Rules), and Regula test cases for CI/CD
    pipelines.

  - Act as the technical lead for the Cloud Security Tooling
    team’s AI enablement initiatives, designing service
    architecture and driving extensible frameworks.

  MUST HAVES

  - 6+ years of software engineering experience developing
    applications and services hosted on public cloud
    infrastructure.

  - 2+ years of experience with cloud infrastructure deployment
    pipelines and infrastructure as code (IaC).

  - 2+ years of experience developing Agentic models (e.g.,
    OpenAI, Anthropic) using Retrieval-Augmented Generation
    (RAG) and Vector databases.

  - Proven capability of technical leadership in a global
    organization developing technology strategy and driving
    technology programs.

  - Proven capability to lead and mentor engineers in a
    distributed, asynchronous, follow-the-sun model.

  - Upper-intermediate English level.

  NICE TO HAVES

  - Hands-on experience with modern AI orchestration frameworks
    (LangChain, LangGraph).

  - Hands-on experience writing Rego policies (Open Policy
    Agent) or Regula test cases.

  - Hands-on experience with Terraform.

  - Familiarity with cloud-native security services in Amazon
    Web Services, Azure, and Google Cloud Platform.

  - Familiarity with PagerDuty, Atlassian Suite, and ServiceNow.

  PERKS AND BENEFITS

  - Growth without limits: build your skills through mentorship,
    internal TechTalks, challenging projects, and a dedicated
    annual learning budget

  - Competitive compensation: get recognition that reflects your
    skills and impact, with regular performance and
    compensation reviews

  - Flexibility: work 100% remotely with flexible hours that
    support focus, autonomy, and a healthy work rhythm

  - Meaningful, modern projects: build impactful products using
    modern technologies alongside global teams and leading
    brands

  - Collaborative culture: join a supportive environment with
    zero micromanagement where ideas are welcomed and
    contributions are recognized

  - Well-being & support: access local well-being programs and
    people-focused support tailored to your location
