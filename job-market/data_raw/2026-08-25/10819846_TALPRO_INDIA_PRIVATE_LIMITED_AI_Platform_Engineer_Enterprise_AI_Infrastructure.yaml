description: |
  AI Platform Engineer (Enterprise AI Infrastructure)

  Experience: 8–12 Years

  Location: Mumbai

  Work Mode: Hybrid (3 days/week WFO mandatory)

  Engagement: 12 Months C2H

  Budget: 22 LPA

  Joining: Immediate joiners only

  Role Overview

  We are seeking a Staff-Level AI Platform Engineer to build
  and operate enterprise-grade AI infrastructure for
  production systems. This role focuses on architecting and
  managing scalable AI platforms across training, inference,
  and MLOps environments.

  The ideal candidate must have deep experience in Kubernetes,
  cloud-native architectures, CI/CD pipelines, and production
  AI system reliability.

  Key Responsibilities

  - Architect and manage AI infrastructure supporting model
    training and inference workloads.
  - Build scalable and secure AI platforms for enterprise-grade
    deployments.
  - Own reliability, availability, scalability, and security of
    AI systems.
  - Design and implement MLOps pipelines and CI/CD workflows.
  - Optimize Kubernetes-based deployments for AI workloads.
  - Collaborate with AI engineers and product teams to
    productionize AI models.
  - Implement monitoring, logging, and observability frameworks.
  - Drive platform-level governance, compliance, and
    infrastructure best practices.

  Required Skills

  ✔ 8–12+ years building and operating enterprise-grade
  platforms

  ✔ Strong experience in production AI infrastructure

  ✔ Deep expertise in Kubernetes

  ✔ Strong cloud experience (AWS/Azure/GCP)

  ✔ CI/CD and DevOps practices

  ✔ Strong Go (preferred) or Python

  ✔ Experience working with AI coding assistants

  Preferred

  - Experience managing distributed AI workloads
  - Experience in large-scale MLOps environments
  - Exposure to AI governance and model lifecycle management
