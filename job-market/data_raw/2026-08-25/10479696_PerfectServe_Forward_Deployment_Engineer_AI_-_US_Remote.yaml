description: |
  What is PerfectServe?

  PerfectServe is a leading provider of clinical communication
  and physician scheduling solutions in the health IT space.
  The company was founded in 1997 and has grown steadily since
  then, with a notable jump after several major acquisitions
  were announced in 2019. PerfectServe now has 400+ employees,
  30,000+ customers — spanning medical practices, hospitals,
  and health systems — and $100 million+ in annual revenue.
  PerfectServe’s mission is to accelerate speed to care by
  optimizing provider schedules and routing communications —
  including messages, pages, calls, and alerts — to the right
  place at the right time in any care setting. By facilitating
  real-time information sharing, building better schedules,
  and automating important clinical workflows, we believe we
  can help our customers advance patient care and improve the
  well-being of their clinicians. Leading analyst firms like
  Gartner® and KLAS Research have consistently validated our
  approach:

  - In 2026, PerfectServe was named highest in execution and
    furthest in vision in the Gartner Magic Quadrant™ for
    Clinical Communication and Collaboration — the clear
    segment leader.
  - PerfectServe also received two Best in KLAS awards in 2026 —
    one for physician scheduling and another for ambulatory
    clinical communications. That makes for 11 Best in KLAS
    awards over the past 9 years.

  At PerfectServe, you'll have a unique opportunity to join a
  collaborative team with decades of experience that finds new
  ways to delight our customers every day. This involves
  consistent efforts to stay on the cutting edge of product
  development, which includes everything from implementing AI
  in new and existing solutions to brainstorming with
  customers about novel workflows. But you don't have to be in
  product to make in impact — everybody at PerfectServe
  contributes to important work that moves the business
  forward. If you're looking for a well-established, tech-
  forward company full of smart people doing meaningful work,
  you've found the right place!

  PerfectServe is a leading healthcare communications platform
  that connects providers, patients, and care teams to improve
  clinical collaboration and patient outcomes. We are seeking
  a Forward Deployment Engineer, AI, to join our Professional
  Services organization. This is a core, high-impact role
  responsible for deploying our AI product to new customers,
  reducing the effort it takes to bring each customer live,
  and continuously optimizing and extending our AI offerings.

  Essential Functions:

  - Help configure and rollout customers of our existing AI
    voice agent
  - Build and run evaluation suites to validate behavior, catch
    regressions, and tune prompts as new customers are
    deployed
  - Develop new features and fixes to the core product
  - Optimize latency, inference cost, and hallucination
    guardrails
  - Run and improve model evaluation, benchmarking, and
    observability across the product
  - Monitor cost controls, usage monitoring, and security/PHI
    handling constraints
  - Partner with Product and Customer Success to turn customer
    requirements into working, validated deployments, and own
    customer go-live, post-launch monitoring, and production
    issue debugging
  - Help streamline and automate the onboarding process to
    reduce the engineering effortrequired to bring each new
    customer live

  Qualifications:

  - 3+ years software engineering experience with strong Python
    backend skills
  - 1+ years of production experience with LLM APIs, deploying
    and supporting GenAI systems at scale
  - Cloud-native architecture experience, preferably AWS
  - Experience in regulated or security-conscious environments
  - Product-minded systems thinker, comfortable with ambiguity
    and executive communication
  - Experience with voice or conversational AI a plus
  - Comfortable translating non-technical customer requirements
    into working configuration

  Why Join PerfectServe?

  At PerfectServe, we are transforming healthcare
  communication and collaboration to help clinicians deliver
  better care. You’ll work with a dedicated and mission-driven
  team in an environment that values growth, transparency, and
  innovation. We offer a salary range of $120,000 to $140,000
  USD per year, with compensation tailored to your background,
  strengths, and potential to grow within the team. The salary
  range listed for this role reflects our commitment to pay
  transparency and is based on market data, internal equity,
  and the scope of responsibilities. compensation will be
  determined by a combination of factors, including the
  candidate’s experience, skills, and the specific team or
  product area they support. We regularly review compensation
  across the company to ensure fairness and consistency. If
  you are a current employee and have questions about how your
  compensation aligns with our ranges, we encourage you to
  speak with your manager or People Operations.

  Benefits:

  - Remote first work environment
  - Health, Dental, Vision, Life and Disability Insurance
    options available day one.
  - 401K - with match and immediately vested.
  - 17 company holidays, 2 floating holidays plus competitive
    paid time off policy
  - Internal Advancement Opportunities

  PerfectServe offers unified healthcare communication
  solutions to help physicians, nurses, and care team members
  provide exceptional patient care. PerfectServe’s cloud-based
  solutions enhance patient safety and reduce provider burnout
  by automating workflows, speeding time to treatment,
  optimizing shift schedules, empowering nurse mobility, and
  engaging patients in their own care.
