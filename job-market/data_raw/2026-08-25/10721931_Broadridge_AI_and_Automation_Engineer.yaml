description: |
  At Broadridge, we've built a culture where the highest goal
  is to empower others to accomplish more. If you’re
  passionate about developing your career, while helping
  others along the way, come join the Broadridge team.

  This role requires strong Python and JavaScript capability,
  practical frontend development experience, database fluency,
  and working knowledge of AI/LLM integration patterns. The
  successful candidate will be expected to contribute to
  production-grade tools, automate manual workflows, integrate
  APIs and databases, build structured reports, and support
  secure, maintainable delivery practices.

  The position is designed for an engineer who can operate
  across backend, frontend, middleware, automation, analytics,
  and AI-assisted engineering use cases. The individual should
  be comfortable collaborating with business, technology, and
  operations stakeholders while delivering reliable solutions
  in a fast-paced environment.

  Key Responsibilities

  1. Build AI-Enabled Automation Solutions

  - Design, develop, and maintain automation solutions using
    Python, Django, JavaScript, TypeScript, and supporting
    frameworks.
  - Integrate LLM APIs for chat completions, function calling,
    prompt-driven workflows, retrieval-augmented generation
    basics, and streaming user experiences.
  - Develop reusable automation components for data extraction,
    document processing, reporting, workflow orchestration,
    and API integrations.
  - Apply practical engineering judgement to balance speed,
    maintainability, security, and production reliability.

  2. Deliver Full-Stack Web Application Enhancements

  - Develop Django views, URL routing, models, migrations,
    templates, middleware, sessions, and multi-database
    configurations.
  - Build and maintain frontend interactions using jQuery,
    vanilla JavaScript, AJAX, DOM manipulation, event
    handling, Promises, fetch, Bootstrap components, and JSON
    APIs.
  - Contribute to TypeScript-based extensions and agent-facing
    components, including typed interfaces, basic generics,
    and type-error resolution.
  - Debug issues using browser DevTools, application logs,
    database checks, and container-level diagnostics.

  3. Engineer Data, Reporting, and Document Workflows

  - Write and optimize MySQL and PostgreSQL queries, migrations,
    indexes, and data access patterns for application and
    reporting use cases.
  - Create PowerBI dashboards and reports by connecting to
    MySQL/PostgreSQL sources, building visuals, creating basic
    DAX measures, publishing to workspaces, and supporting
    refresh schedules.

  4. Support Browser and Desktop Automation

  - Develop Selenium and Playwright automation for web-based
    automations.
  - Design automation flows that are resilient to application
    changes, timing issues, authentication patterns, and
    operational failures.
  - Document automation behavior, assumptions, error handling,
    and support procedures for long-term maintainability.

  5. Apply Secure Engineering and Integration Practices

  - Consume REST APIs using requests, JSON handling, and
    defensible error handling.
  - Apply secure development practices related to SSO flows,
    session-based authentication, CSRF protection, and
    credential storage.
  - Use Git effectively for feature branching, pull requests,
    merge conflict resolution, interactive rebasing, stashing,
    tagging, and code reviews.
  - Build and debug Dockerfiles and docker-compose
    configurations for local development, environment
    variables, volume mounts, image builds, and container
    troubleshooting.

  6. Collaborate Across Product, Engineering, and Operations

  - Work with business users and technical stakeholders to
    translate manual or semi-manual processes into automation-
    ready requirements.
  - Communicate technical trade-offs clearly and provide
    practical recommendations for implementation, support, and
    improvement.
  - Participate in peer reviews, testing, release readiness
    checks, and production support activities.

  Required Experience

  - Approximately 5 years of relevant experience in software
    engineering, automation engineering, AI-enabled
    application development, data workflow automation, or
    related technology delivery roles.
  - Strong hands-on Python experience, including building
    maintainable scripts, backend services, automation
    workflows, data processing utilities, API integrations,
    and reusable tooling with a focus on clean, scalable, and
    production-ready code.
  - Solid Django experience across views, URL routing, models,
    migrations, templates, middleware, session handling, and
    multi-database configurations.
  - Strong JavaScript experience using jQuery and vanilla
    JavaScript for AJAX, DOM manipulation, event handling,
    async patterns, Bootstrap components, DevTools debugging,
    and JSON API integration.
  - Working knowledge of TypeScript, including reading and
    writing typed code, interfaces, basic generics, and
    understanding type errors.
  - Practical exposure to LLM API integration, prompt design,
    function calling, RAG basics, token-limit considerations,
    and SSE streaming.
  - Strong MySQL and PostgreSQL experience including queries,
    migrations, indexes, and basic performance tuning.
  - Experience with Git, Docker, REST APIs, frontend components,
    browser automation, document processing, and Windows
    automation libraries.

  Preferred Qualifications

  - Experience building internal productivity tools, workflow
    automation platforms, AI assistants, agents, or reporting
    automation solutions.
  - Experience contributing to PI agent extensions or similar
    AI/automation extension frameworks.
  - Exposure to enterprise SSO, secure credential management,
    and production support practices.
  - Experience publishing PowerBI reports to shared workspaces
    and supporting refresh schedules.
  - Experience working in financial services, fintech,
    enterprise technology, or other regulated environments.
  - Demonstrated ability to convert ambiguous business problems
    into practical engineering solutions.

  Required Technical and Functional Skills

  - Core skill expectations by category:

  Category

  Requirements

  Python

  Strong. OOP, exception handling, concurrent.futures,
  pathlib, decorators, generators.

  Django

  Solid. Views, URL routing, models/migrations, templates,
  middleware, multi-database configs, session handling.

  JavaScript

  Strong. jQuery plus vanilla JS for AJAX, DOM manipulation,
  event handling, async patterns including Promises and fetch,
  Bootstrap JS components, debugging in DevTools, and working
  with JSON APIs from the frontend.

  TypeScript

  Working knowledge. Reading and writing typed code,
  interfaces, basic generics, contributing to PI agent
  extensions, and understanding type errors.

  AI/LLM

  LLM API integration including chat completions and function
  calling, prompt design, RAG basics, understanding token
  limits, and SSE streaming.

  Databases

  MySQL strong; PostgreSQL for writing queries, migrations,
  indexes, and basic performance tuning; pandas to DB
  workflows; SQLAlchemy.

  Git

  Proficient. Feature branching, pull requests, resolving
  merge conflicts, interactive rebase, stashing, tagging
  releases, writing good commit messages, and code review via
  Git platforms.

  Docker

  Writing Dockerfiles, docker-compose for local development,
  building and pushing images, debugging container issues,
  environment variable management, and volume mounts for
  development.

  PowerBI

  Building reports and dashboards, connecting to
  MySQL/PostgreSQL data sources, basic DAX measures, creating
  visuals, publishing to workspace, and understanding data
  refresh schedules.

  Frontend

  Bootstrap 5, Select2, DataTables, responsive design, and
  basic CSS customization.

  Selenium

  Headless browser automation, WebDriverWait, element
  selection, and download handling.

  Security

  Understanding of SSO flows, session-based authentication,
  CSRF protection, and credential storage.

  Document Processing

  python-docx, openpyxl, PyMuPDF, and building structured
  reports.

  APIs

  RESTful consumption using requests, JSON handling, auth
  headers, and retry logic.

  Windows

  Comfortable with pywin32, Windows Credential Manager, and
  task scheduling in Windows.

  Leadership Competencies

  - Strong ownership and accountability for technical
    deliverables.
  - Ability to work independently while collaborating
    effectively across teams.
  - Practical problem-solving mindset with attention to
    reliability, usability, and maintainability.
  - Clear written and verbal communication with both technical
    and non-technical stakeholders.
  - Ability to promote reusable engineering practices.
  - Sound judgement in handling production issues, sensitive
    data, credentials, and automation risks.
  - Continuous learning mindset across AI, automation, backend
    engineering, frontend tooling, and enterprise platforms.
  - Ability to operate effectively in a fast-paced and evolving
    environment.

  We are dedicated to fostering a collaborative, engaging, and
  inclusive environment and are committed to providing a
  workplace that empowers associates to be authentic and bring
  their best to work. We believe that associates do their best
  when they feel safe, understood, and valued, and we work
  diligently and collaboratively to ensure Broadridge is a
  company—and ultimately a community—that recognizes and
