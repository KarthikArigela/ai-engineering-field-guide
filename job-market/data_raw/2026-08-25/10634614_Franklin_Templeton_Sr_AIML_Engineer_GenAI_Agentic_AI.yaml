description: |
  Fiduciary Trust International is a premier investment and
  wealth management firm with a commitment to growing and
  protecting wealth across generations. We offer a dynamic and
  collaborative approach to managing wealth for high-net-worth
  and ultra high-net-worth individuals and families, family
  offices, endowments, foundations, and institutions. Our
  investment managers, tax and estate planning professionals
  work together to develop holistic strategies to optimize
  clients’ portfolios while mitigating the impact of taxes on
  their wealth. As a fiduciary, the guidance we provide is in
  the best interests of our clients, without conflict or
  competing benefits. We offer boutique customization and deep
  expertise in specialized investment, tax and planning
  strategies alongside sophisticated technology and custody
  platforms.

  Fiduciary Trust International is owned by Franklin
  Templeton, a dynamic firm that spans asset management,
  wealth management, and fintech, giving us many ways to help
  investors make progress toward their goals. With clients in
  over 150 countries and offices on six continents, you’ll get
  exposed to different cultures, people, and business
  development happening around the world.

  About the Department:

  Our AI Engineering team develops and scales production-ready
  Generative AI and Agentic AI solutions that help solve
  complex business challenges and accelerate innovation across
  the organization. The team brings together AI engineers,
  architects, and business stakeholders who work
  collaboratively to design, build, and deploy secure,
  enterprise-grade solutions on Microsoft Azure. Joining this
  team offers opportunities to work with emerging
  technologies, influence AI standards and best practices, and
  contribute to high-impact initiatives in a collaborative and
  growth-oriented environment.

  How You Will Add Value?

  Core Responsibilities:

  - You will design and deploy Generative AI and Agentic AI
    solutions.
  - You will deliver applications from concept through
    production.
  - You will execute high-impact AI initiatives.
  - You will review and mentor fellow engineers.
  - You will build multi-step agentic workflows.
  - You will create production-ready architecture designs and
    technical artifacts to drive discussions with enterprise
    architecture and engineering teams.

  Strategic Responsibilities:

  - You will partner with business teams to solve complex
    problems.
  - You will collaborate with architects on scalable, secure
    solutions.
  - You will help define enterprise AI standards and practices.
  - You will contribute to knowledge graph and data pipeline
    strategies.

  Team & Collaboration:

  - You will work closely with engineers, architects, and
    stakeholders.
  - You will promote engineering excellence across development
    and operations.
  - You will support continuous improvement through mentoring
    and knowledge sharing.

  What Will Help You Be Successful in This Role?

  Experience, Education & Certifications:

  - 6+ years of software or AI/Machine Learning engineering
    experience.
  - Proven experience delivering Generative AI or Agentic AI
    solutions to production.
  - Experience mentoring engineers or leading projects.
  - Any cloud related certifications (preferably Azure or
    Snowflake) are advantageous.

  Technical Skills:

  - Strong understanding of the end-to-end Generative AI
    lifecycle.
  - Experience with Retrieval-Augmented Generation (RAG) and
    agent orchestration.
  - Hands-on experience with Microsoft Azure AI services.
  - Strong Python development skills.
  - Experience with LangChain, LangGraph, or similar frameworks.
  - Experience with modern data platforms and pipeline
    technologies.
  - Knowledge of knowledge graphs, graph databases, or Graph RAG
    is a plus.

  Soft Skills:

  - Strong collaboration and stakeholder management skills.
  - Ability to translate business needs into technical
    solutions.
  - Effective communication and teamwork skills.

   Work Shift Timings - 2:00 PM -11:00 PM IST

