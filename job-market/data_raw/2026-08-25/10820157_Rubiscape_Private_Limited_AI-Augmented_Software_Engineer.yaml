description: |
  About the Role

  At Rubiscape, software engineering is being reimagined from
  the ground up. As an AI-Augmented Software Engineer, you
  will work at the frontier of AI-assisted development, using
  LLM-powered pair-programming, spec-driven workflows, and
  intelligent code review tools to ship production-grade
  features across our six-studio Decision Intelligence
  Platform at speeds previously impossible. You will help
  establish the engineering culture and toolchain patterns
  that allow Rubiscape to deliver 3× faster pipelines and
  <90-day production use cases to Fortune 500 customers. This
  is not a role for prompt-curious hobbyists — it is for
  engineers who see AI as a force multiplier and want to build
  the systems that India’s enterprises run on.



  Key Responsibilities

  ·         Design and implement features across RubiFlow,
  RubiStudio, RubiSight, and RubiAI studios using an AI-first,
  spec-driven development workflow.

  ·         Pair with GitHub Copilot, Cursor, and custom
  internal LLM agents to accelerate code generation,
  refactoring, and test coverage without sacrificing code
  quality.

  ·         Translate structured functional specs into
  implementation plans, breaking ambiguous requirements into
  verifiable, AI-executable tasks.

  ·         Participate in AI-assisted code review cycles:
  generating review prompts, interpreting LLM feedback, and
  validating AI suggestions against platform architecture
  standards.

  ·         Contribute to the internal developer toolchain by
  writing prompt templates, agent configurations, and reusable
  spec patterns for common engineering scenarios.

  ·         Instrument and monitor AI-generated code in
  production, identifying drift patterns and feeding learnings
  back into the spec and prompt library.

  ·         Collaborate with Prompt Engineering and Spec
  Engineering teams to continuously raise the baseline quality
  of AI-assisted outputs across the engineering org.

  Nice to Have

  ·         Familiarity with LangChain, LlamaIndex, or similar
  LLM orchestration frameworks used in production settings.

  ·         Experience contributing to or maintaining an
  internal developer platform, CLI toolchain, or shared
  engineering standards library.

  ·         Exposure to data engineering or analytics
  engineering workflows (dbt, Apache Spark, Airflow) relevant
  to the RubiFlow studio.

  ·         Prior experience at a B2B SaaS or enterprise
  platform company serving regulated industries (BFSI,
  manufacturing, healthcare).







  About Rubiscape

  Rubiscape is India’s leading Decision Intelligence Platform,
  unifying data engineering, BI, machine learning, and agentic
  AI in a single governed platform. Built in Pune and trusted
  by Fortune 500 enterprises across BFSI, manufacturing,
  healthcare, and government. 8 international innovation
  patents. 10 Industry-Academia Labs & COEs. From BI to AI —
  One Platform. Every Decision.

  RequirementsRequirements

  ·         3+ years of software engineering experience in
  Python, TypeScript, or Java, with at least 1 year of hands-
  on AI-assisted development using Copilot, Cursor, or similar
  tools.

  ·         Proven ability to write precise, structured
  functional specifications that can be consumed reliably by
  LLM coding agents.

  ·         Strong understanding of REST API design,
  microservices architecture, and cloud-native deployment
  patterns (AWS, Azure, or GCP).

  ·         Experience with test-driven development and the
  ability to write and validate automated tests for AI-
  generated code.

  ·         Comfortable working in a fast-paced environment
  where methodologies are evolving and self-direction is
  expected.

  ·         B.E. / B.Tech in Computer Science, Information
  Technology, or a related engineering discipline.
