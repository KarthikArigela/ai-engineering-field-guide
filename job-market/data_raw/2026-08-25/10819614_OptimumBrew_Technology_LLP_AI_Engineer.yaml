description: |
  About Us  OptimumBrew is a global software product company
  based in Surat, India, building AI-powered graphic design
  and marketing products for small businesses worldwide. Our
  products help entrepreneurs create professional marketing
  content quickly across mobile and web platforms. Every day,
  users across 150+ countries use our applications to grow
  their businesses. We combine product innovation, AI, data
  analytics, and growth experimentation to build category-
  leading products with global impact. At OptimumBrew, you’ll
  work on real business challenges—not simulations. From
  analyzing millions of user interactions and optimizing
  growth funnels to experimenting with AI-driven features and
  scaling global products, your work directly influences
  product decisions and business growth. We believe in
  ownership, continuous learning, and solving meaningful
  problems with data. If you’re excited about building
  products for a global audience and making measurable impact
  from day one, you’ll feel at home here.

  Requirements

  Role Overview  As an AI/ML Engineer, you’ll work with our
  engineering and product teams to build AI-powered features
  and products using modern Large Language Models (LLMs),
  APIs, and intelligent workflows. Instead of training AI
  models, you’ll focus on integrating, orchestrating, and
  optimizing AI technologies to solve real customer problems.
  You’ll build AI features that improve productivity, automate
  workflows, generate content, and create intelligent user
  experiences across our products. This role is ideal for
  candidates who enjoy software development, problem-solving,
  and exploring how AI can transform modern applications. Key
  Responsibilities 1. AI Agent Development ● Build autonomous
  AI agents for real-world business workflows. ● Design multi-
  agent systems. ● Integrate tools using MCP and function
  calling. ● Optimize agent reasoning and execution. 2. AI
  Feature Development ● Build AI-powered features for web and
  mobile products. ● Integrate LLM APIs such as OpenAI and
  Gemini. ● Develop intelligent user workflows. ● Improve AI
  response quality and user experience. 3. Prompt Engineering
  ● Design and optimize prompts for different use cases. ●
  Experiment with prompting techniques. ● Evaluate AI output
  quality. ● Improve reliability and consistency. 4. AI
  Workflow Automation ● Build AI-driven workflows. ● Automate
  repetitive business processes. ● Develop multi-step AI
  pipelines. ● Integrate AI into existing product workflows.
  5. AI Product Engineering ● Convert product ideas into AI-
  powered features. ● Collaborate with Product, Design, and
  Engineering teams. ● Prototype new AI experiences rapidly. ●
  Optimize performance and usability. 6. API Integration ●
  Integrate AI APIs and third-party services. ● Build backend
  services around AI capabilities. ● Handle streaming
  responses. ● Manage structured outputs and function calling.
  7. AI Quality & Evaluation ● Test AI-generated responses. ●
  Improve accuracy and consistency. ● Analyze edge cases. ●
  Reduce hallucinations through better workflows. 8. Research
  & Innovation ● Explore new AI models and tools. ● Evaluate
  emerging AI technologies. ● Build proof-of-concepts. ●
  Recommend new product opportunities. 9. Engineering Best
  Practices ● Write clean, maintainable code. ● Participate in
  code reviews. ● Debug AI workflows. ● Improve system
  performance and scalability. What You’ll Learn ● Generative
  AI Development ● Large Language Models (LLMs) ● Prompt
  Engineering ● AI Product Development ● Agentic AI ●
  Retrieval-Augmented Generation (RAG) ● AI Workflow
  Automation ● Function Calling ● MCP Integration ● AI API
  Integration ● Product Thinking ● Scalable Backend
  Development ● AI Evaluation ● Modern Software Architecture
  Who Should Apply ● Currently pursuing or recently completed
  a Bachelor’s degree in Computer Science, Information
  Technology, AI, Software Engineering, or related fields. ●
  Strong programming fundamentals. ● Experience with
  JavaScript, TypeScript, Python, or similar languages. ●
  Strong problem-solving skills. ● Curious about Generative AI
  and modern software development. ● Passionate about building
  products using AI. ● Must have built at least one AI-powered
  application, automation, or personal project using Large
  Language Models (LLMs) or AI APIs Career Path Jr. AI/ML
  Engineer → AI/ML Engineer → Senior AI/ML Engineer → AI
  Technical Lead → Head of AI Engineering Note: This role
  focuses on building AI-powered software products using
  modern LLMs and AI APIs. It does not require experience in
  Machine Learning, Deep Learning, TensorFlow, or model
  training. Strong

