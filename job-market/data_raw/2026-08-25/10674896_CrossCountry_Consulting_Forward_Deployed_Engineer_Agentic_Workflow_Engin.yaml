description: |
  From the beginning, our goal was to establish an advisory
  firm that stands apart from the rest – one that is grounded
  in our Core Values and dedicated to creating a positive
  experience not just for our clients, but for our people too.
  We firmly believe in the strength of collaboration,
  enthusiasm, generosity, and perseverance as the driving
  forces behind our success. With advisory solutions spanning
  accounting and risk, technology-enabled transformation, and
  transactions, we partner with our clients to solve today’s
  challenges and deliver present and future value.

  Our commitment to our people has earned us numerous awards
  including Inc5000's Fastest Growing Companies and
  Glassdoor's Best Places to Work. Explore what our employees
  have to say about our unique culture by clicking here.

  By joining our rapidly growing AI Innovation &
  Transformation practice you will serve as a trusted partner
  to our clients. You’ll bring your first-hand engineering
  experience, unique perspectives, and functional knowledge to
  design, deploy, and manage production-grade agentic AI
  solutions for the Office of the CFO and other enterprise
  functions. As a Forward Deployed Engineer & Agentic Workflow
  Engineer at CrossCountry Consulting you will be the tip of
  the spear for AI deployment at clients—embedding directly
  with client finance and operations teams to build, test, and
  iterate on agentic workflows that deliver measurable
  enterprise value on a compressed timeline. Operating at the
  intersection of software engineering, finance domain
  expertise, and client partnership, you will write production
  code alongside your clients, own the deployment of agentic
  solutions, and mentor junior engineers as a member of the
  practice team.





  What you'll do:

  Practice Leadership: Serve as a key leader in the AI
  Innovation & Transformation practice by:

  - Developing reusable accelerators—contributing battle-tested
    code, workflow templates, and connector certifications
    back to the AI practice accelerator library to reduce
    deployment time on future engagements.
  - Creating new delivery methodologies and service offerings
    that scale agentic solutions across clients and enterprise
    functions.
  - Mentoring analysts and junior engineers on engagement teams,
    tracking and directing performance against objectives
    while encouraging continuous improvement and innovation.
  - Contributing to recruiting, proposal writing, and firm-wide
    AI innovation initiatives.

  What you'll bring:

  - 5+ years of software engineering experience with at least 2
    years focused on AI/LLM application development, agentic
    systems, or intelligent automation; prior “forward
    deployed” or client-embedded engineering experience
    strongly preferred.
  - Hands-on production experience building multi-agent systems
    with LangChain/LangGraph, CrewAI, AutoGen, or equivalent
    frameworks; understanding of agent-loop design, task
    planning, tool-use, and memory management.
  - Proficiency in Python (primary) and TypeScript/JavaScript;
    experience with FastAPI or equivalent for exposing agent
    capabilities as APIs.
  - Deep understanding of LLM capabilities and limitations:
    prompt engineering, structured outputs, function calling,
    context-window management, cost optimization, and latency
    tradeoffs across frontier models.
  - Experience integrating enterprise source systems via APIs
    and MCP connectors; familiarity with ERP, EPM, EDW/Data
    Lakes, and CRM data schemas in a finance context is a
    significant plus.
  - Working knowledge of cloud data platforms (Azure, GCP, or
    AWS) and containerization (Docker, Kubernetes); experience
    with vector databases (Pinecone, Weaviate, or equivalent)
    and RAG pipelines.
  - Finance domain fluency—ability to understand and implement
    workflows covering month-end close, variance analysis,
    revenue recognition, AR/AP, and FP&A without requiring
    extensive hand-holding from client finance teams.
  - Exceptional ability to operate in ambiguous, fast-moving
    client environments; a demonstrated track record of
    delivering working software in compressed, high-stakes
    timelines.
  - Clear, confident communication with both technical and non-
    technical stakeholders; ability to present live-agent
    demonstrations to CFOs and finance leadership.
  - Continuous Learning Mindset: Openness to continuously
    learning and applying emerging LLM capabilities, agent
    frameworks, and enterprise integration patterns.

  Qualifications:

  - A bachelor’s degree from an accredited university in
    computer science, software engineering, mathematics, or a
    related technical discipline.
  - Relevant certifications in cloud platforms (Azure AI
    Engineer, AWS Machine Learning Specialty, GCP Professional
    ML Engineer), LangChain, or equivalent agentic AI tooling
    preferred.
  - Willingness to travel domestically up to 20%–40% (varies by
    client engagement phase).
  - Availability to work on client site or in office 3 days a
    week, with 2 days remote (hybrid environment).

