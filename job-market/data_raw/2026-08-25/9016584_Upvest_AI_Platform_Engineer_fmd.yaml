description: |
  At Upvest, we are on a mission to make investing as easy as
  spending money. Upvest empowers businesses to offer a wide
  range of investment products and the best experience in the
  field of capital market investment and retirement planning.
  Upvest’s Investment API is easy to integrate so that
  fintechs and financial institutions can save resources and
  fully focus on their core business.

  We are proud to partner with Europe’s leading Fintechs and
  financial institutions such as DKB, Revolut, N26 and Raisin.
  Founded in 2017 by Martin Kassing, Upvest now brings
  together over 270 talented professionals from more than 70
  nationalities. Upvest is backed by €280M in total funding
  from world-class investors, including BlackRock, Tencent,
  Sapphire Ventures, and Bessemer Venture Partners, Earlybird,
  Notion Capital, and Motive. Our latest €105M funding round
  in March 2026 - led by Sapphire and Tencent - serves as a
  massive catalyst for our growth, allowing us to offer
  premier investment experience.

  About the Role

  As we enter our next stage of growth, we are looking for an
  exceptional AI Platform Engineer to join our Engineering
  team, reporting directly to Yurii Opryshko and working
  closely together with our SVP Engineering Roberto
  Fajardo.This is a senior individual contributor role, and
  one of the first two hires into a new Applied AI function.
  AI is reshaping how financial infrastructure companies
  operate — and at Upvest, we're moving fast. Our engineers
  have taken to it quickly. The rest of the company hasn't had
  the same run, and that's the gap this role exists to close.

  Product engineering stays focused on the core product. Your
  job is the layer underneath everything else: the shared
  infrastructure, tooling and standards that let every team at
  Upvest build with AI safely — and, crucially, the work that
  makes those teams able to do it without you.

  You will be one of two people in this function. Your
  counterpart comes from the business side and will spend
  their time in Operations, Growth, Compliance and Finance
  finding the problems worth solving. You'll be the one who
  makes solving them possible, repeatable, and safe.

  Build and run the AI platform

  You will design, build and operate the infrastructure that
  connects Claude and other LLMs to Upvest's internal systems
  — MCP servers, integrations to internal tools, APIs and data
  sources — and the hosted infrastructure behind the
  automation stack that other teams build on.

  You don't build in isolation. You plug into what our
  platform and engineering teams already run rather than
  standing up a parallel stack, and you're as willing to adopt
  and extend something that exists as you are to build it
  yourself.

  As adoption grows, you harden what you've built.
  Reliability, observability and evals for AI systems in
  production are your responsibility, not an afterthought.

  Make other teams self-sufficient

  This is half the job, not a footnote.

  You will work directly with people in Operations,
  Compliance, Growth and Finance to help them build their own
  workflows — sitting with them, understanding the actual
  process, and shipping the first version together. Then you
  make the second one something they can do without you:
  templates, patterns, guardrails, and enough teaching that
  the knowledge stays with the team rather than with you.

  The measure of success is not how many automations you've
  built. It's how many happen without you. If ten workflows
  are live and all ten depend on you personally, the platform
  hasn't worked.

  You seek out the AI champions already experimenting across
  the company and turn what they're doing into something
  secure, compliant and durable — without taking it away from
  them.

  Work alongside Security, not around them

  Upvest is a BaFin and FCA regulated firm. You understand the
  constraints that come with that and don't need convincing
  they're real.

  Security owns the controls. You are the main technical point
  of contact between them and everything the AI platform
  touches — translating how AI systems reach data and tools
  into terms Security can assess, and building so that access
  boundaries, audit trails and data handling are there by
  design rather than retrofitted.

  What you bring

  - Platform mindset, applied pragmatically: You've built
    infrastructure others built on top of. You also know when
    not to. You'd rather ship a narrow slice that creates
    value this week and generalise it once you've seen the
    same problem three times than design the general case
    before you understand it.
  - You make other people capable: You've handed something over
    and had it stick. You can point to work where the team you
    built for ended up able to carry it themselves, and you
    can say what made that work.
  - AI native: Hands-on experience shipping AI agents and end-
    to-end automations that ran in production and that other
    people depended on — not prototypes. You move fast and
    stay current.
  - Connecting LLMs to internal systems: You've securely
    connected models to internal tools, APIs and data sources,
    and you understand the access, scoping and audit questions
    that come with it. Experience building or operating MCP
    servers is a strong plus.
  - Automation and orchestration infrastructure: You've built
    and run workflow automation at production quality. We use
    n8n; the specific tool matters less than having done this
    for real.
  - Security-conscious collaborator: Comfortable being the
    technical counterpart to a Security team on AI systems —
    access control, data boundaries, audit trails — without
    owning security decisions yourself.
  - Regulated industry experience: You've worked in fintech or a
    closely adjacent field and understand compliance
    constraints first-hand.
  - Pragmatism: You define ROI, iterate and ship. A simple
    deterministic automation beats a complex agent when
    appropriate, and you can tell the difference.
  - Background: 5+ years in a scale-up, in roles such as
    platform engineer, infrastructure engineer, applied AI
    engineer, solutions engineer, or similar.
  - Location: Berlin preferred. English required; German a plus.

  This is not a data science role. We are looking for someone
  who applies and deploys AI, not someone who trains models or
  builds ML pipelines.

  Where this goes

  You're joining Engineering Enablement, an established team
  of eight engineers, so you won't be starting from zero —
  there's existing infrastructure, existing relationships
  across the business, and groundwork already underway. As the
  function proves itself and grows, it becomes its own team.

  How we Upvest in you

  - Best-in-class AI tools: Every Upvenger has €20,000 per year
    to spend on the best AI tools available — so you're always
    working with the most powerful models and tooling on the
    market.
  - Work with experts: Join a mission-driven engineering team
    solving hard, real-world problems at the intersection of
    AI and regulated financial infrastructure.
  - Professional development: Access an annual budget of €1,500
    for personal and professional training to master your
    craft.
  - Wellbeing: Recharge with 30 days of annual leave and
    maintain a healthy lifestyle with sports benefits. Access
    confidential professional coaching and enjoy the
    flexibility to work remotely abroad for up to 183 days a
    year.
  - Compensation and equity: We believe that all Upvengers
    contribute to our success and deserve a competitive,
    above-market salary and a participation in our employee
    equity program.
  - Flexible work environment: This role is based in Berlin. We
    are committed to flexibility — we understand you don't
    always have to be in the office to do your best work.
  - Team celebrations: Participate in company-wide events such
    as UpFest, dinners, offsites and our holiday party to
    connect with colleagues and celebrate our achievements.

  Our Values

  - Make it easy for others. We simplify the complex and act
    with the best intentions.
  - Own the outcome. We are proactive, fast and confident to get
    the job done, valuing progress over perfection.
  - Rise to the challenge. We aim high and push the boundaries.
    We stay curious, learn and celebrate our wins together.
  - Tell the story. We start with the Why to align on purpose.
    We are transparent and share knowledge to empower and
    inspire others.

  Upvest is an equal opportunity employer. We celebrate
  diversity and are committed to creating an inclusive
  environment for all employees.
