  and our goal to lead the future in media and technology, we
  want you to fast-forward your career at Comcast. Job Summary
  Responsible for validating product quality by analyzing and
  testing the quality of the code base. Focuses on writing
  code that will be executed in an automated and repeatable
  fashion which will reduce manual testing efforts and
  increase code quality and consistency. Develops and
  maintains code that validates front-end, middleware and
  database systems, using the latest tools and programming
  languages. Provides input into various software development
  lifecycle stages. Partners with software engineers to write
  efficient automation code using coding standards and best
  practices. Reports test execution results to senior
  leadership. Repairs complex broken automation scripts and
  performs peer reviews of automation codebase. Integrates
  knowledge of business and functional priorities. Acts as a
  key contributor in a complex and crucial environment. May
  lead teams or projects and shares expertise. Job Description
  Core Responsibilities

  - 10+ yrs in quality engineering, system validation, or
    software reliability.
  - Hands-on AI tool experience: Claude, ChatGPT, Replit,
    Copilot, or similar - professionally applied.
  - Experience designing agentic workflows or LLM-integrated
    automation pipelines.
  - Strong background in endurance testing, stability
    validation, and release/change management.
  - Knowledge of connectivity device software, embedded systems,
    or broadband/Wi-Fi environments.
  - Python, Shell, or equivalent scripting; strong release
    validation and risk-based testing knowledge.LangChain,
    AutoGen, or multi-agent orchestration frameworks.
  - RDK-B platforms, broadband gateways, routers, or embedded
    Linux devices.
  - ELK, Grafana, Kibana, or similar observability stacks.
  - CI/CD pipelines (Jenkins, GitHub, Gerrit).
  - Endurance/reliability testing, defect management, or release
    readiness reviews.
  - Global team coordination and offshore/onshore delivery model
    experience.

