description: |
  Why Coda

  Coda is a global growth engine for commerce, connecting
  people, digital products, and payments through trusted
  monetization and distribution solutions.

  With 600+ people from 57 nationalities across 23 locations,
  we’re a truly global team headquartered in Singapore, with
  offices in Amsterdam, Dubai, Bristol, Shanghai, Eindhoven,
  and across Southeast Asia.

  We power global commerce through a dual model. Our B2B
  solutions, Codapay, Coda Webstore, Coda Links, Coda
  Distribution, and Giftcloud, enable publishers and brands to
  monetize and distribute digital content globally. On the
  consumer side, we operate a portfolio of trusted storefronts
  including  Codashop, Recharge.com, Startselect.com, and
  mobiletopup.co.uk, that give customers secure and easy
  access to game top-ups, digital credits, vouchers, gift
  cards and prepaid products in over 70 markets.

  Our culture is built on respect, ownership, and
  collaboration. We move fast, support each other, and
  celebrate wins together.

  If you’re looking to grow your career and make a real impact
  in a global team, Coda is the place for you.

  The opportunity

  What you'll do

  - Develop AI agents and scalable automations that support
    internal teams, streamline processes, and enhance
    creativity across the organization
  - Integrate and orchestrate large language models (LLMs) into
    practical applications, ensuring seamless interaction with
    internal systems and data sources
  - Evaluate existing automations and propose innovative
    enhancements to improve their efficiency and
    effectiveness.
  - Design, build, and maintain RAG pipelines using vector
    databases, embeddings and feedback loops to enable
    accurate and context-aware AI applications
  - Contribute to best practices around prompt engineering, AI
    system design, and responsible AI usage within the
    organization.Collaborate closely with stakeholders across
    the business to identify opportunities where AI can
    deliver measurable value and improved workflows
  - Evaluate and optimize AI model cost and performance,
    ensuring accuracy, efficiency, and scalability in
    production environments
  - Stay up to date with the latest developments in AI,
    proactively exploring and proposing new tools, techniques,
    and use cases.

  What you'll bring

  - 5+ of professional experience in engineering, automation,
    software engineering, or a related field. Development of
    impactful AI projects in the last year
  - Strong understanding of generative AI concepts, including
    LLMs, AI agent architectures and prompt engineering
  - Hands-on experience designing and implementing innovative AI
    solutions, particularly leveraging LLMs and agentic
    workflows
  - Proficiency in Python and/or JavaScript, with solid
    experience in SQL and version control using Git
  - Ambition to continuously grow your expertise, including
    pursuing relevant cloud and AI certifications, and
    contributing within multidisciplinary teams
  - Experience with workflow automation tools (e.g., n8n) or
    vector databases (e.g., Pinecone)
  - Experience working with online marketing data or building
    marketing automation flows
  - Experience working with cloud platforms such as AWS or GCP.

  We are proud to be an equal opportunity employer, embracing
  the unique qualities of every individual, regardless of
  gender, race, age, religion, disability, or other local
  protected classes. Our goal is to foster an inclusive
  environment where everyone feels welcome and valued.



  Due to the large number of exceptional applications we
  receive, we can only reach out to shortlisted candidates. If
  you don't hear from us, rest assured there may be another
  opportunity at Coda that aligns better with your unique
  abilities. Remember to check our Careers Page for more
  exciting job openings!
