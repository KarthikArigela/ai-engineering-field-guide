description: |
  Sr Automation  Engineer  (T3)

  Position Summary

  We are seeking an experienced Senior Automation Engineer
  with strong proficiency in Database & C# to design, develop,
  and maintain robust automated test frameworks for our
  applications.

  As a Senior automation engineer, you will work in a product
  development team that develops highly configurable software
  in a collaborative environment employing agile development
  methodologies. As an individual contributor, you participate
  in the entire life cycle of product development and
  contribute to build quality product offerings. In
  conjunction with development engineers, you will design and
  implement strategies and tools for efficient and
  comprehensive automated testing. Mentoring junior engineers,
  and working closely with developers to deliver high-quality
  software.

  Under direct supervision, assists in testing application
  components, software tools, and utilities required for the
  operation, maintenance, and control of computer systems.
  Assists in validating existing software to work as per
  Business Requirements and create and maintain required
  documentation for regular validation.

  Education:

  - Bachelor’s in Engineering degree or equivalent degree.

  Technical Experience:

  - 7+ years of experience in software test automation.
  - Proven expertise in developing automated tests using C# and
    test frameworks like Selenium WebDriver, SpecFlow, NUnit,
    MSTest, or similar.
  - Proven expertise in developing automated tests using
    JavaScript and test frameworks like TestCafe, Playwright,
    Jest,.
  - Well versed with BDD frameworks like Cucumber etc.
  - Strong understanding of object-oriented programming and
    design patterns.
  - Strong understanding of SQL, data bricks, ADF and data
    validation.
  - Clear understanding of testing and automation concepts.
  - Hands-on experience integrating automated tests into CI/CD
    pipelines (e.g., Azure DevOps, Jenkins, GitHub Actions).
  - Good knowledge of API testing tools and frameworks (e.g.,
    Postman, RestSharp).
  - Familiarity with source control tools such as Git.
  - Solid understanding of software QA methodologies, tools, and
    processes.
  - Excellent problem-solving and debugging skills.
  - Experience on product testing in Agile environment; should
    know the various stages of product release & QA support
    needed
  - Experience on testing APIs and their automation
  - Contribution to design and implementation of framework(s)
  - Good communication skills and attitude

  Experience

  - 4-6 years of total experience in software testing
  - 2-4 years of experience on test automation ETL.
  - 2-4 years of experience on MS SQL.

  Nice to have

  - Experience with performance or load testing tools (e.g.,
    JMeter, Locust).
  - Familiarity with cloud-based testing infrastructure (e.g.,
    Sauce Labs, BrowserStack).

  Essential Duties and Responsibilities

  - Devise test approach/strategy
  - Support lead/architect to create/implement automation
    framework
  - Integrate automated tests into CI/CD pipelines and ensure
    test coverage is maintained as the application evolves.
  - Collaborate with cross-functional teams to understand
    requirements, acceptance criteria, and provide feedback on
    testability.
  - Write tests based on scenarios identified
  - Perform root cause analysis of failed tests and drive
    resolution.
  - Exploratory, negative testing
  - Identify, analyze, and document defects clearly in
    collaboration with the development team.
  - API testing (manual and automated as applicable)
  - Capture test preparation and execution data as needed
  - Write automation scripts using framework/tools like Selenium
    using C# (or Java as applicable)
  - Mentor and support junior automation engineers by sharing
    knowledge and best practices.
  - Use of test management & other components of tools like
    Azure Devops, Jira, Rally as applicable
  - Advocate for test automation best practices and contribute
    to a culture of quality across the team.
  - Continuously enhance automation frameworks to improve
    efficiency, stability, and maintainability.
  - Execute, track and report on automation test execution and
    coverage metrics in multiple environments.

