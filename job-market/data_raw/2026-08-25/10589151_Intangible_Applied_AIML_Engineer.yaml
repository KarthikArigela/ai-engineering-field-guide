description: |
  About Intangible

  Intangible is a spatial intelligence company, designed for
  creatives in industries where space and movement matter —
  everything from film & advertising to events and
  defense/space tech. We aim to move beyond verbal
  intelligence (prompts) to spatial intelligence (3D) by
  giving generative AI models a better understanding of
  exactly what humans imagine. We get there with camera-
  centric control system as well as technical innovation in 3D
  design, semantic systems, AI/ML, and knowledge graphs — all
  designed to live on the open web and deliver professional
  grade control over generative AI models.

  We are an interdisciplinary team of engineers, artists and
  designers that have built and shipped multiple end-to-end
  products at companies like Apple, Unity, Pixar, ILM, Google
  and Electronic Arts. Intangible is venture-funded by a16z
  Speedrun, Crosslink Capital and prominent angels.

  We are looking for like minded creative technologists who
  love their craft and building groundbreaking products.

  The Role

  We’re looking for a Applied AI/Machine Learning Engineer to
  join our growing team. You'll play a principal role in
  designing and building AI assistants that empower people to
  use interactive 3D as a medium.

  Location: Preference for SF/Bay Area, CA. Open to remote
  candidates in North America & Western EU.

  What You'll Do

  - Design and develop assistive AI technology for interactive,
    3D workflows.
  - Use the technology you build to propel human ability to
    communicate with interactive 3D.
  - Reduce the time it takes for someone to have an idea,
    visualize it, and share it with others.
  - Build and operate MCP servers at scale.



  Responsibilities

  - Build agentic AI pipelines that extract intent, entities,
    and semantic structure from user input.
  - Analyze opportunities for improving the AI system's
    performance and personalization.
  - Integrate cloud and client LLMs to drive creative workflows.
  - Design and maintain knowledge graphs to represent world,
    character, and story data.
  - Prototype and apply AI features in collaboration with
    product and engineering teams.
  - Fine-tune or augment foundation models for domain-specific
    tasks.

  Key Competencies

  - Evidence of exceptional ability in software development .
  - Understanding of ML principles, algorithms, and evaluation
    metrics.
  - Strong experience with modern agentic AI frameworks.
  - Experience with data storage and retrieval with vector
    databases.
  - Experience with graph databases (e.g., Neo4j, RDF, property
    graphs).
  - Experience developing and operating agentic backend
    experiences, tools, optimizations.
  - Proficient in Python and ML libraries (e.g., PyTorch,
    TensorFlow).
  - Ability to ship features end-to-end.

  Ideal Candidate Has:

  - Experience building AI copilots.
  - Experience building recommendation systems.
  - Cloud ops, containerization, IaC and multi-tenant
    experience.
  - Background in computational linguistics or knowledge
    representation.

  Benefits

  - We are a remote-first company with a small concentration in
    the Bay Area.
  - Health insurance for you and your dependants
  - 401(k) plan
  - Flexible PTO
