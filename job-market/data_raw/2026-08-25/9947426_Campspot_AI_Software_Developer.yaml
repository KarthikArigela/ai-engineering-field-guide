description: |
  Welcome to Campspot! Whether you are an avid camper, the
  occasional glamper, an expert RV-er, or new to the outdoors
  entirely, we're interested in working with you. Our team
  values diverse perspectives as we seek to create an easy-to-
  navigate and meaningful camping experience for everyone.

  We hope you will consider joining our team! ALL human beings
  are welcome, and we are committed to helping you thrive
  here. We believe our team, as well as the outdoors, is for
  everyone.

  AI FIRST DEVELOPMENT APPROACH

  Campspot is building a new AI-native platform that is
  purpose-built to bring intelligent automation, dynamic
  tooling, and agentic workflows to our product ecosystem. It
  is an actively evolving codebase where every feature shipped
  matters and where AI-assisted development is not a
  convenience but a core part of how we build.

  THE ROLE

  We are looking for a skilled software developer to
  accelerate feature development on the AI platform using
  Claude Code as their primary AI coding assistant. You will
  work alongside our core team to scope, build, and ship new
  capabilities using Claude Code to drive velocity while
  maintaining code quality, architectural integrity, and
  security best practices.

  Responsibilities:

  - Use Claude Code to implement new features and functions
    within the platform
  - Translate product requirements and design specs into clean,
    production-ready code
  - Review and refine AI-generated code to ensure correctness,
    performance, and maintainability
  - Leverage AI to write and update automated tests for all new
    functionality
  - Participate in async code reviews and provide constructive
    feedback
  - Ensure new features, APIs, and architectural decisions are
    documented as they are built
  - Proactively identify technical debt or gaps and surface them
    to the team

  Requirements:

  - 5+ years of professional software development experience
  - Experience shipping features on fast-moving platforms
  - Demonstrated experience working with Claude Code
  - Understanding of prompt engineering and context window
    management
  - Prior experience building on top of the Anthropic API or
    integrating LLMs into production applications
  - Familiarity with agentic workflow patterns and tool-use APIs
  - Strong proficiency in TypeScript and React
  - Solid understanding of REST APIs, async patterns, and modern
    web architecture
  - Ability to work independently, manage your own time, and hit
    milestones
  - Able to communicate complex technical concepts, lead
    discussions, and collaborate effectively with stakeholders
    across all levels.

  Compensation and Benefits:

  - Base salary: $120-160k
  - Competitive benefits, including medical, dental, vision,
    life, and disability insurance options at affordable rates
  - 401(k) plan with employer match
  - Flexible time off - use it as you need it
  - Employee camping credit to encourage getting outdoors and
    experiencing our product!

  This is a remote role, however we are prioritizing
  candidates in our hiring hubs of Grand Rapids (MI), Denver
  (CO), and Chicago (IL) who are interested in some in-person
  collaboration. Secondary consideration may be given to
  candidates who reside in states where we currently have
  employees outside of our hubs, including MA, NH, NY, NC, OR,
  TX, UT, VT, VA, and Canada. Candidates located outside of
  the locations listed previously are not able to be
  considered at this time.

  Campspot is a motivated team of outdoor enthusiasts and
  software professionals with decades of experience in the
  campground and outdoor industry. We’re looking to grow with
  people who embody our culture of learning, collaboration,
  and innovation. Today our portfolio includes two distinct
  but synergistic products:

  1. Campspot Management Software
  (https://software.campspot.com/) is the leading provider of
  reservation management software and tools for campgrounds
  and RV parks. It revolutionized the industry through its
  proprietary technology, allowing park owners to increase
  revenue through its inventory optimization tool and site-
  lock capabilities.

  2. The Campspot Marketplace (campspot.com and Campspot
  mobile app) is an online marketplace where travelers can
  find accommodations for their camping trips. Campspot’s
  inventory is 100% bookable and includes robust filters to
  help travelers customize their travel experience.
