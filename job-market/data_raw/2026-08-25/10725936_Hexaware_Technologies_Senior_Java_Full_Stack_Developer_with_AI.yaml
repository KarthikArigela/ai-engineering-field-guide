description: |
  Position: Senior Java Full Stack Developer with AI

  Location: McLean, VA (5 days onsite from office)

  Job Summary:

  We are seeking a Senior Java Full Stack Developer with
  strong experience in building scalable enterprise
  applications using modern Java, microservices, cloud, and
  front-end technologies.

  The ideal candidate will have hands-on expertise across
  backend development, UI integration, cloud-native
  deployment, and DevOps practices.

  Experience with AI-driven solutions, Python, LangChain, and
  LangGraph will be highly valuable for building next-
  generation intelligent applications and workflow
  orchestration solutions.

  Key Responsibilities: -

  Design, develop, and maintain scalable full stack
  applications using Java, Spring Boot, REST APIs, and modern
  UI frameworks.

  - Build and enhance microservices-based solutions with strong
    focus on performance, security, monitoring, and
    reliability.

  - Develop responsive and user-friendly front-end applications
    using Angular or ReactJS.- Design and implement cloud-
    based solutions using AWS services.

  - Collaborate with cross-functional teams to understand
    application architecture, build processes, and deployment
    requirements.

  - Contribute to CI/CD pipelines and DevOps automation using
    industry-standard tools.

  - Support application deployment, integration,
    troubleshooting, and performance optimization across
    target environments.

  - Explore and implement AI-powered application capabilities
    using Python and modern orchestration frameworks such as
    LangChain and LangGraph.

  Required Skills:

  - 7+ years of experience in design and development of
    applications using Java 8+, J2EE, Spring, Spring Boot,
    RESTful Services, and UI frameworks.

  - 2+ years of experience in designing and developing
    microservices using Spring Boot and REST APIs.

  - Experience with AI application development and integrating
    intelligent workflows into enterprise systems.

  - Hands-on experience with Python for backend scripting,
    automation, or AI/ML integrations.

  - Familiarity with LangChain, LangGraph.
