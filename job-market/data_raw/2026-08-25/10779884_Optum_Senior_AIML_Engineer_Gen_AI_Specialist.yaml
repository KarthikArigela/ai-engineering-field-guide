  - Experience with vector databases and knowledge platforms
    such as Pinecone, Weaviate, Chroma, FAISS, pgvector, Azure
    AI Search, Neo4j, or equivalent technologies
  - Experience implementing AI observability, tracing,
    evaluation, and monitoring frameworks for production of AI
    systems
  - Experience building reusable AI accelerators, enterprise AI
    frameworks, reference architectures, and shared platform
    services
  - Healthcare, financial services, insurance, or other
    regulated industry experience
  - Experience mentoring AI engineers, architects, and technical
    leaders within large enterprise environments
  - Proven deep expertise with Azure OpenAI, Azure AI Foundry,
    AWS Bedrock, Vertex AI, Anthropic, OpenAI, and open-source
    model ecosystems
  - Proven solid expertise in AI platform engineering, LLMOps,
    model lifecycle management, evaluation platforms, and
    enterprise AI governance
  - Proven expertise in AI security, AI risk management,
    compliance controls, and responsible AI deployment
    practices
  - Proven contributions to enterprise AI innovation programs,
    technical publications, patents, open-source projects, or
