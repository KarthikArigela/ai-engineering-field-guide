  - Experience building AI platforms, AI gateways, and
    enterprise AI services operating across multiple
    foundation model providers
  - Experience implementing AI observability, evaluation
    frameworks, performance monitoring, and operational
    governance
  - Experience with cloud-native AI platforms and managed AI
    services
  - Solid programming experience in Python and modern AI
    development frameworks
  - Solid understanding of:
    - Transformer architectures
    - Embeddings
    - Tokenization
