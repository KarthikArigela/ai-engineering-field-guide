description: |
  Job Title: Sr. AI/ML Engineer - Agentic Flows Location:
  Bangalore, India (Hybrid) Permanent - Full Time

  About Us Cyncly is a global technology powerhouse with
  2,400+ employees and 70,000+ customers across 100+
  countries. Cyncly transforms the way customizable products
  and spaces are imagined, designed, sold, managed and made.
  Our end-to-end software solutions connect professional
  designers, retailers and manufacturers to the world's
  largest repository of product content. Today, our business
  spans across the Kitchen & Bath, Furniture, Window, Glass &
  Door, and Flooring industries with operations in North &
  South America, Europe, Asia Pacific and Africa.

  Cyncly brings over 30 years of experience to deliver more
  value for our customers through an expanded portfolio of
  end-to-end solutions. Our global presence allows us to
  provide world-class support and sales with a local touch,
  providing the best possible customer experience.

  Cyncly is now embarking on an exciting journey as we
  continue to expand through strong organic growth and
  complementary acquisitions, backed by leading growth private
  equity firms specializing in technology.

  Cyncly & The Power of AI At Cyncly, we believe in unlocking
  the power of AI to deliver highly personalized and
  extraordinary experiences for our customers and their
  clients. We are on a dynamic journey of seeking exceptional
  talent to add critical AI models and functionality to our
  products used by over 17,000 customers worldwide. This is
  opportunity to be a part of a collaborative team that
  fosters continuous learning and growth, where you'll work on
  exciting data driven projects that redefine the Spaces for
  Living industry. AI is reshaping private and business life
  at an unprecedented speed, and Cyncly is committed to
  leading the charge in delivering new sources of value for
  our customers.

  Availability between 12:30 PM to 9:30 PM IST is required to
  support collaboration with our global teams.

  About the Role We are seeking an AI Champion to build
  agentic front ends for our products. Most of our products
  currently offer UI based interaction to our customers. Given
  the complexity involved in the flows, traditional UI based
  interaction needs training for users before they can develop
  desired proficiency in the product. We want to build NLP
  based interactive UIs where AI agents make flows not only
  easier to learn but also provide suggestive inputs to aid
  design process. This role will attempt at revolutionizing
  UI/UX for our customers by offering them a guided flow and
  thereby eliminating learning curve needed for understanding
  complex design process.

  Key Position Responsibilities Include:

  - Design and implement agentic workflows in the frontend
    (multi-step AI-driven user journeys).
  - Oversee development of UI components that interact with
    LLMs, APIs and agent orchestration layer.
  - Handle state management to ensure proper context is
    available LLMs to provide decision support.
  - Translate complex backend agent logic to clear, user-
    friendly interfaces.
  - Implement real-time interactions (chat interfaces, copilots
    (AI based kitchen designing), suggestions, searches etc.).
  - Ensure performance, scalability, and responsiveness of AI-
    powered UI flows.
  - Contribute to design systems that support AI-native UX
    patterns.

  Required Experience and Qualifications:

  - Overall 5+ years of experience in developing AI based
    solutions with 4+ years of experience in working with LLMs
    (openAI, Anthropic etc).
  - Exposure to agentic frameworks (LangGraph, LangChain,
    AutoGen, Semantic Kernel, etc.).
  - Experience in building chat-based or AI-assisted interfaces
    and Agent UI Protocols including JSON based UI rendering.
  - Understanding of prompt design and AI interaction patterns.
  - Knowledge of event-driven architecture and persistent state
    management in agentic loops.
  - Familiarity with tool calling / function calling paradigms.
  - Familiarity with setting up MCP and multi-agent
    interactions.
  - Knowledge of RAG based solutions and text-mining to find
    insights from chat histories.
  - Hands-on experience with Agent-to-Agent protocols and
    communication patterns.

  Core Competencies:

  - Define standards and guidelines for appropriate AI tool
    usage for building agentic flows.
  - Stay current with emerging AI tools and capabilities
    relevant for building real-time agentic interactions.
  - Work with engineering/product leadership to develop strategy
    and roadmap.
  - Monitor tool effectiveness and ROI, providing data-driven
    recommendations for tool selection and renewal.

  Soft Skills:

  - Experience in leading teams building AI/ML embedded
    products.
  - Ability to work in ambiguous, fast-evolving AI spaces.
  - Clear communication with cross-functional teams.
  - Curiosity about emerging AI/agent paradigms.

  Working for Us At Cyncly, we call our team OneCyncly, a
  reflection of how we work together as one, united by our
  purpose: powering businesses that bring spaces to life. Our
  strength comes from our diversity of experiences,
  perspectives, and skills - and we thrive when we work
  together with openness, trust, and respect. Here, you’ll
  join a group of colleagues who take ownership, solve
  problems, and focus on making an impact. We embrace
  curiosity, welcome new ideas, and see mistakes as
  opportunities to learn. You’ll have the freedom to work
  flexibly and autonomously, supported by teammates and
  leaders who are committed to your growth. We celebrate the
  different ways people contribute and encourage everyone -
  from every background - to bring their authentic self to
  work. Because when we collaborate, challenge each other, and
  share what we know, we build something better together. If
  you want to work in a place where your ideas matter, your
  growth is valued, and your work shapes the spaces people
  live, work, and play in - Come join us.
