description: |
  Where Ambition Meets Innovation

  Build a career that matches all your initiative with an
  impressive dose of innovation. From cutting-edge resources
  and a collaborative environment to the freedom to make an
  impact and more, you’ll find the ingredients you need at LPL
  Financial to shape your success while helping clients pursue
  their financial goals.

  Job Overview:

  We are looking for a passionate AI Security Engineer to join
  our Cyber security team and help secure our organization’s
  growing use of AI technologies. This role is ideal for
  someone early in their career who has a broad understanding
  of security principles and is eager to apply them in the
  evolving world of AI.

  Please note: This position does not offer work authorization
  sponsorship now or in the future. Applicants must have valid
  U.S. work authorization that does not require employer
  sponsorship.

  Responsibilities:

  - Support the development and implementation of governance
    policies and security standards for AI usage.
  - Collaborate on the integration of tools and security
    controls across various AI enabled platforms and services.
  - Contribute to the discovery and documentation of AI use
    cases throughout the organization.
  - Help design and apply the right security, privacy, and
    compliance frameworks for AI systems.
  - Work cross functionally with data, engineering, and
    compliance teams to ensure responsible and secure AI
    adoption.

  What are we looking for?

  We want strong collaborators who can deliver a world-class
  client experience. We are looking for people who thrive in a
  fast-paced environment, are client-focused, team oriented,
  and are able to execute in a way that encourages creativity
  and continuous improvement.

  Required:

  - 2+ years of experience in cybersecurity, DevSecOps, or a
    related field is required.
  - Foundational understanding of cybersecurity programs and
    risk management.
  - Familiarity with data protection, security automation, and
    network security concepts.
  - Exposure to security engineering and architecture
    principles.
  - Curiosity and adaptability to work on emerging technologies
    like AI in a security context.

  Preferred:

  - You're someone who may have started as a junior engineer or
    analyst and is now ready to take the next step, diving
    into the complex but exciting world of AI security. You
    bring broad knowledge, strong collaboration skills, and a
    desire to grow alongside a team that's shaping the secure
    future of AI

  Please note: This position does not offer work authorization
  sponsorship now or in the future. Applicants must have valid
  U.S. work authorization that does not require employer
  sponsorship.

  #LI-Hybrid



  Pay Range:

  $100,631.00 - $167,787.00 Actual base salary varies based on
  factors, including but not limited to, relevant skill, prior
  experience, education, base salary of internal peers,
  demonstrated performance, and geographic location.
  Additionally, LPL Total Rewards package is highly
  competitive, designed to support your success at work, at
  home, and at play – such as 401K matching, health benefits,
  employee stock options, paid time off, volunteer time off,
  and more. Your recruiter will be happy to discuss all that
  LPL has to offer!


  Company Overview:

  LPL Financial Holdings Inc. (Nasdaq: LPLA) is among the
  fastest growing wealth management firms in the U.S. As a
  leader in the financial advisor-mediated marketplace(6) ,
  LPL supports over 32,000 financial advisors and the wealth
  management practices of approximately 1,100 financial
  institutions, servicing and custodying approximately $2.3
  trillion in brokerage and advisory assets on behalf of
  approximately 8 million Americans. The firm provides a wide
  range of advisor affiliation models, investment solutions,
  fintech tools and practice management services, ensuring
  that advisors and institutions have the flexibility to
  choose the business model, services, and technology
  resources they need to run thriving businesses. For further
  information about LPL, please visit www.lpl.com.

  At LPL, independence means that advisors and institution
  leaders have the freedom they deserve to choose the business
  model, services, and technology resources that allow them to
  run a thriving business. They have the flexibility to do
  business their way. And they have the freedom to manage
  their client relationships, because they know their clients
  best. Simply put, we take care of our advisors and
  institutions, so they can take care of their clients.

  For further information about LPL, please visit www.lpl.com.

  Join the LPL team and help us make a difference by turning
  life’s aspirations into financial realities. Please log in
  or create an account to apply to this position. Principals
  only. EOE.

  Information on Interviews:

  LPL will only communicate with a job applicant directly from
  an @lplfinancial.com email address and will never conduct an
  interview online or in a chatroom forum.  During an
  interview, LPL will not request any form of payment from the
  applicant, or information regarding an applicant’s bank or
  credit card.  Should you have any questions regarding the
  application process, please contact LPL’s Human Resources
  Solutions Center at (855) 575-6947.

