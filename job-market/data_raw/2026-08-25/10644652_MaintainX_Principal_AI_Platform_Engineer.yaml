title: Principal AI Platform Engineer
company: MaintainX
location: USA
remote: true
work_type: FULL_TIME
description: |
  MaintainX is the world's leading AI-powered maintenance and
  asset management platform, serving 14,000+ customers
  including Duracell, Shell, Cintas, and Brenntag. We raised
  $150M in Series D funding led by Bessemer Venture Partners
  and Bain Capital Ventures, bringing our total funding to
  $254M. We were named to the Forbes 2025 Cloud 100, the
  definitive ranking of the top 100 private cloud companies in
  the world. We're growing fast and hiring the talent to
  match.

  The market is at a turning point. Manufacturing will need to
  fill 3.8 million vacant jobs through 2033. Technicians spend
  roughly 60% of their time on paperwork and research instead
  of actual wrench work. Most manufacturers expect to adopt
  AI-driven maintenance at scale by 2027. Our AI Platform is
  how we make that transition real for the frontline.

  The Role

  Our AI Platform is the catalog of Agents, Skills, and Tools
  that every product engineer at MaintainX assembles to ship
  AI-powered features. CoPilot, Root Cause Analysis, the Parts
  Agent, and the Scheduling Agent all run on it. As Principal
  Engineer, you will own the technical vision for the AI
  platform and scale it to match our ambition.

  This is a senior individual contributor role reporting to VP
  of Engineering. You will lead through architecture, high-
  leverage technical decisions and products that produce long-
  term company outcomes. You will set direction across
  multiple divisions, align executives on platform strategy,
  and hold leaders accountable for engineering-wide adoption.

  What you will own:

  - Define the Agent / Skill / Tool architecture. Evolve the
    platform so agents can reason, plan, and collaborate,
    skills are discoverable and reused across workflows, and
    tools expose structured, permission-aware access to
    operational data. Design for progressive autonomy as
    trust, reliability, and governance mature.
  - Scale the context graph. Architect the retrieval and
    knowledge systems that turn 14,000+ digitized equipment
    manuals, 370,000+ procedures created yearly, and 27M+
    annual work orders into customer-specific intelligence
    with cross-asset reasoning.
  - Build the developer experience. Own agent orchestration, an
    MCP tool registry, reproducible dev environments, and the
    observability layer that makes agents trustworthy at
    scale. Engineers should define agent behavior through
    schemas and prompts while the platform handles routing,
    validation, evaluation, and observability.
  - Build the evaluation and feedback loop. Design offline and
    online evaluation systems so every user interaction
    (accept, refine, override) improves agent performance.
  - Drive cross-division alignment. Partner with product
    engineering teams across Plant Setup, Maintenance
    Planning, Maintenance Execution, Reliability Engineering,
    Parts & Purchasing, and Reporting. Represent MaintainX
    engineering internally and externally.

  You have

  - 10+ years of software engineering experience, with
    significant depth in backend systems, distributed
    architecture, or platform / infrastructure engineering.
  - 3+ years building ML or LLM-powered systems in production,
    with real operating experience around evaluation, latency,
    cost, and reliability.
  - A track record of company-wide technical leadership at the
    Principal level. You have defined architecture for systems
    used by multiple teams, influenced engineering strategy
    beyond a single division, and held leaders accountable for
    adoption.
  - Internal platform experience where your customers are other
    engineers. You treat developer experience as a product:
    adoption, documentation, enablement, and ergonomics are
    first-class.
  - Strong Python backend expertise, with experience designing
    APIs, services, and data pipelines.
  - The ability to write a clear design document, facilitate a
    technical decision across teams, and represent engineering
    externally with credibility.

  Nice to have:

  - Production agentic systems: multi-agent orchestration, tool
    use, skill registries.
  - MCP, LangGraph, LlamaIndex, plus evaluation and
    observability platforms like Langfuse, LangSmith, or
    Braintrust.
  - RAG pipelines, vector databases, embedding strategies, and
    knowledge graphs at scale.
  - B2B SaaS, industrial software, IoT / OT, or other domains
    where AI must operate with high reliability and domain-
    specific context.

  We offer

  - Competitive base, equity, and variable comp aligned to role
    and location.
  - Equity in a high-growth, post-Series D company.
  - Day-1 health, dental, and vision coverage.
  - Unlimited PTO, which we actually take.
  - Flexible token limits.
  - Work from our San Francisco, Toronto, or Montreal hubs, or
    remote across the United States and Canada.

  How we work

  We hire for what you have shipped, not what your title was.
  We promote quickly when people deliver and have honest
  conversations early when fit isn't right. Output wins. If
  you would rather shape the architecture that every other
  engineer builds on than manage headcount, this is the right
  room.

  MaintainX is committed to building a diverse and inclusive
  team. We welcome applications from people of all
  backgrounds. If you're excited about this role but don't
  meet every qualification, we encourage you to apply. #LI-
  Remote

  Our mission is to deliver one platform for maintenance,
  repair & operations teams to keep the physical world
  running. We believe the greatest asset in any organization
  is the people. That’s why we built an intuitive, mobile-
  first solution to help boost productivity and collaboration
  across teams and locations.

  MaintainX is committed to creating a diverse environment.
  All qualified applicants will receive consideration for
  employment without regard to race, colour, religion, gender,
  gender identity or expression, sexual orientation, national
  origin, genetics, disability, age, or veteran status.
