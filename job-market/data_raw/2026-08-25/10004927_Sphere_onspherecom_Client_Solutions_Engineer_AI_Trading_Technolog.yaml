description: |
  ABOUT US

  We operate in the dynamic world of energy commodities
  trading, where information and speed are crucial for
  success. However, data in these markets is often fragmented
  and opaque, leaving participants with incomplete and poor-
  quality information….

  Here at Sphere, we aim to bring order to this chaos by
  leveraging our innovative voice and AI technologies, as well
  as our patented Liquidity Lake, which consolidates all
  actionable liquidity onto one screen. Enhanced by AI
  insights and quantitative analytics, our platform is
  designed to support even the most skilled traders; See more.
  Win more.

  THE OPPORTUNITY

  As a Trading Solutions Consultant (what we call someone who
  undertakes technical client support), you’ll sit at the
  intersection of technology, markets, and customer success,
  acting as the bridge between our trading and broking
  customers and Sphere’s engineering and product teams. You’ll
  combine deep technical understanding with strong commercial
  awareness to ensure our AI and aggregation solutions deliver
  measurable value to brokers, traders, and analysts across
  global energy markets.

  You’ll work directly with some of the world’s leading energy
  firms and brokers, supporting their day-to-day operations,
  integrations, and innovation initiatives. This is a hands-on
  role that blends technical acumen, relationship management,
  and product insight, ideal for someone who thrives in a
  fast-moving, collaborative startup environment.

  WHAT WE’RE LOOKING FOR IN YOU

  - Own the client relationship from a technical perspective –
    act as the trusted advisor and primary point of contact
    for trading desks, brokers, and IT teams. Ensure each
    client’s Sphere environment is healthy, performant, and
    aligned to their business goals through proactive reviews
    and monitoring.
  - Drive incident and problem resolution – take ownership of
    technical issues from initial triage to post-incident
    review. Collaborate with engineering to diagnose root
    causes.
  - Enable and empower clients – deliver onboarding sessions,
    product training, and workflow guidance to help users get
    the most from Sphere’s technology solutions.
  - Partner in pre-sales and delivery – join discovery calls to
    scope technical feasibility, identify integration points,
    and estimate implementation effort for client solutions or
    large-scale roll-outs.
  - Champion the voice of the customer – capture feedback and
    translate real-world trading and brokerage workflows into
    actionable insights for our Product and Engineering teams.
    Influence the roadmap and help shape the evolution of
    Sphere’s energy-market technology stack.

  YOUR SKILLS & EXPERIENCE

  - We are seeking someone with a 2:1 or above within a Computer
    Science degree (or directly related subject).
  - You’ll need to have had at least a couple of years
    experience in either a client facing/technically focused
    role post-graduation
  - Technology is right at the heart of our business, and in
    this role. You will need to be able to demonstrate a
    genuine for passion for tech outside of work – not just in
    a commercial or educational setting – and especially is
    using AI
  - You will need to be curious in your approach, to get under
    the surface of a problem, and be able to demonstrate how
    at heart you are a problem solver.
  - Excellent spoken and written English, confident and able to
    speak to all levels of seniority within our clients, both
    in person, and in writing.
  - Excellent organisation, communication, and consulting
    mindset: you act as an advisor to the client and internal
    champion for their success.
  - Willingness and ability to travel for client meetings,
    workshops, and in-person engagements.

  WHY JOIN SPHERE

  - Innovative Impact: We are fundamentally transforming the
    commodities trading landscape. By joining Sphere, you will
    work with cutting-edge technologies and collaborate with
    some of the largest commodity trading firms globally.
  - Career Growth: Experience exponential growth and be part of
    an organization where your contributions are visible and
    impactful.
  - Competitive Package: Benefit from a competitive remuneration
    package, including participation in the firm’s equity
    through our HMRC-approved EMI employee options scheme in a
    rapidly growing, high-potential business.
  - Professional Development: Gain access to continuous learning
    opportunities and professional development programs
    tailored to your career growth.
  - Flexible Work Environment: Enjoy a flexible working
    environment that promotes a healthy work-life balance.
  - Company Culture: Be part of a supportive and innovative
    company culture that values diversity, inclusivity, and
    teamwork.

  Here at Sphere, we believe that diversity drives innovation
  and excellence. We’re proud to be an equal opportunities
  employer and are committed to fostering a workplace where
  everyone feels respected, supported, and empowered to be
  their authentic selves.  All qualified applicants will be
  considered without regard to race, colour, religion, gender,
  gender identity or expression, sexual orientation, national
  origin, genetics, disability, or age.
