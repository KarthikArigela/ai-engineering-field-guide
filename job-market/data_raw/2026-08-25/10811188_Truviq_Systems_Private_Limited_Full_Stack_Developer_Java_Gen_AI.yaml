description: |
  Job Description: Experienced Full Stack Developer (GenAI)

  Position: Full Stack Developer (GenAI Applications)

  Location: Hyderabad, India

  Required: 5+ Years

  Employment Type: Full-Time

  Requirements

  Role Overview



  We are looking for a highly motivated and self-driven Full
  Stack Developer with strong expertise in Node.js, Java, and
  Python, along with hands-on experience in Generative AI
  development. The ideal candidate will play a pivotal role in
  building and scaling QMentisAI and other enterprise-grade
  GenAI-enabled solutions at QualiZeal. You will work on
  cutting-edge AI workflows such as RAG pipelines, Model
  Context Protocol (MCP), and Agentic frameworks using
  LangChain and LangGraph.

  This role is ideal for a go-getter who thrives in a fast-
  paced environment, has strong problemsolving skills, and can
  contribute to self-sustaining Agile teams delivering
  innovation in Quality Engineering.

  Key Responsibilities

  Full-Stack Development

  - Design, develop, and maintain scalable web applications
    using Node.js, Java, and
  Python.
  - Build and optimize APIs, microservices, and server-side
    logic.
  - Implement intuitive and responsive user interfaces using
    modern front-end
  frameworks (e.g., Angular, React, or Vue).

  Generative AI Integration

  - Develop and integrate LLM-powered features into enterprise
    QE workflows.
  - Implement RAG architectures, vector databases (Pinecone,
    Weaviate, FAISS),
  and embeddings pipelines.
  - Work with LangChain, LangGraph, and agentic AI frameworks to
    design
  intelligent automation flows.
  - Explore MCP (Model Context Protocol) for context-aware LLM
    integrations.

  Cloud & DevOps

  - Deploy and manage applications on AWS, Azure, or GCP.
  - Work with containerization/orchestration tools (Docker,
    Kubernetes) to ensure
  scalability and reliability.
  - Contribute to CI/CD pipelines for rapid development and
    deployment.

  Innovation & Collaboration

  - Stay ahead of emerging GenAI trends (e.g., LLM fine-tuning,
    agent frameworks,
  orchestration tools).
  - Collaborate with Product Owners, AI engineers, and UI/UX
    teams to deliver
  seamless features.
  - Mentor junior developers and actively contribute to Agile
    ceremonies.
  - Drive self-sustaining Agile squads, taking ownership of
    delivery outcomes.
  Required Skills & Qualifications

  Technical Expertise

  - Proficiency in Node.js, Java, Python with full-stack
    development experience.
  - Hands-on with LangChain, LangGraph, RAG, and vector
    databases.
  - Familiarity with cloud platforms (AWS, Azure, GCP).
  - Knowledge of microservices, REST/GraphQL APIs, and backend
    integration.
  •

  AI & GenAI Skills

  - Practical exposure to LLM-based application development.
  - Understanding of MCP (Model Context Protocol).
  - Experience with prompt engineering, embeddings, and agentic
    frameworks.

  Professional Attributes

  - 5+ years of relevant experience as a Full Stack Developer.
  - Strong debugging, optimization, and architectural design
    skills.
  - Self-motivated, proactive, and able to lead Agile teams
    independently.
  - Excellent communication and collaboration skills.

  Preferred Qualifications

  - Experience with test automation frameworks (Selenium,
    Playwright, Cypress).
  - Exposure to MLOps practices for LLM deployment.
  - Knowledge of ISO 29119, ISTQB standards, or Agile Testing
    Quadrants.
  - Prior experience in BFSI, Insurance, Healthcare, or Retail
    domains.
