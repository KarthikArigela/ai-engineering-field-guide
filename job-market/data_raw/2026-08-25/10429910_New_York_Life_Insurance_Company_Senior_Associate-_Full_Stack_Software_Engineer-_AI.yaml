description: |
  Job Requisition ID: 94474 Location Designation: Hybrid - 3
  days per week We are seeking a senior software engineer with
  AI expertise to help design and deliver modern, cloud-native
  agentic AI solutions. This role sits within our core systems
  team and partners closely with engineers, architects, data
  scientists, and product teams to build scalable, secure, and
  highly available solutions leveraging AWS, GCP, APIs,
  DevSecOps, and AI. You will play a key role in advancing
  automation, developer productivity, and AI-enabled
  capabilities while contributing to enterprise standards and
  best practices. What You'll Do:

  - Design, build and deploy cloud-native applications and
    platforms on AWS and GCP

  - Apply AI and automation to improve developer experience and
    productivity

  - Design and consume APIs and reusable services

  - Ensure solutions meet security, performance, resilience, and
    compliance standards

  - Support already existing generative and agentic AI
    applications

  - Collaborate with cross-functional teams in an Agile delivery
    environment

  - Contribute to architecture evolution, technical standards,
    and engineering best practices in the space of agentic AI

  What You'll Bring:

  - Bachelor's degree in Computer Science, Engineering, or
    related field

  - 5-7 years of software engineering experience building
    production-grade systems

  - Hands-on experience with AWS or GCP, cloud-native
    architecture, and infrastructure as code (Terraform)

  - Previous work using agentic frameworks for multi-agent
    orchestration (e.g. LangChain, Google ADK)

  - Experience building and deploying AI or Agentic AI use cases
    in production environments

  - Proficiency in data orchestration, vector database
    management, and data evaluations to optimize usage with
    LLMs

  - Proficiency with modern programming and scripting languages
    (e.g., Python, JavaScript, TypeScript)

  - Experience with containerization (EKS/ECR), APIs
    development, and modern development tools (GitHub, Jira)

  - Strong communication skills and ability to work effectively
    with technical and business partners

  Preferred Qualifications:

  - Experience in financial services, insurance, or wealth
    management Experience with LLM-based solutions and
    emerging AI technologies

  - Familiarity with DevSecOps platforms (e.g., Harness)

  - Relevant certifications in cloud, DevSecOps, or AI

