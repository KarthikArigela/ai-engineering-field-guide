description: |
  Who is Sonar?

  Sonar is driving the future of agent-centric software
  development. As the leader in AI code review and
  verification, we solve a critical problem: ensuring that
  software generated by AI-assisted developers or autonomous
  agents is reliable, secure, and maintainable.

  Integrating seamlessly with Claude Code, Codex, Cursor,
  GitHub Copilot, Gemini, and Devin, we help over 75% of the
  Fortune 100 build trusted, reliable, compliant software.
  Customers who use Sonar are 44% less likely to report an
  outage due to AI-generated code.

  We believe code verification is the critical missing link in
  the Agent-Centric Development Cycle (AC/DC). Industry giants
  like Nvidia, ServiceNow, Booking.com, Goldman Sachs,
  AstraZeneca, and Ford Motor Company count on us to provide
  independent, explainable, consistent review and governance
  of their AI-generated code via products like:

  - SonarQube: The world’s leading AI code review and
    verification platform.
  - SonarQube Foundation Agent: Currently topping the
    leaderboards for agentic software repair.
  - SonarSweep & Sonar Context Augmentation: Providing the
    enterprise-grade context and constraints agents need to be
    truly effective.

  Our team operates across global hubs in Austin, Bochum,
  Dubai, Geneva, London, Singapore, Tokyo, and Washington D.C.
  We move with a mindset we call CODE:

  - Committed to our customers and community.
  - Obsessed with quality.
  - Deliberate in our decisions.
  - Effective as one team.

  With over $400M in revenue and profitable, fast-paced
  growth, we are building the backbone of the AI software
  revolution. If you’re hungry to have an impact, want to
  build at a fast pace, and ready to work at the forefront of
  AI, we want to hear from you.

  Position description

  As Sonar’s Marketing AI Engineer, you design, build, and
  maintain the AI agents and automated workflows that multiply
  the impact of the marketing function. You spend time with
  marketing stakeholders to understand their work in depth,
  identify where automation creates real leverage, and then
  build and iterate until it works well. You produce clear
  reporting on efficiency and impact, keeping marketing
  leadership informed on what the automations are actually
  delivering.

  The best person for this role might be a marketing ops
  veteran who has taught themselves to build with AI, or an
  automation engineer who has gone deep on how marketing
  actually works. Either way, what matters is the combination:
  you understand marketing processes from the inside, and you
  can build reliable automations that make those processes
  faster, smarter, and more scalable.

  What you will do

