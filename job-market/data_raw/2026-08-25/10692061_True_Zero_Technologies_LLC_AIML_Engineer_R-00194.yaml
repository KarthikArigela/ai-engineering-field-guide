description: |
  True Zero Technologies, a veteran-owned small business, was
  founded on the principle that the purposeful enablement of
  people and technology in an organization directly ties to
  the quality of its outcomes. True Zero recognizes that those
  outcomes begin and end with our people, and that is what we
  have built a community of like-minded, driven, and
  passionate individuals and innovators who are aligned in a
  common goal of delivering top-tier services to our
  customers. Our culture and commitment have been recognized
  through numerous accolades, including being named one of the
  Best Places to Work in 2023 in two categories (“Prosperous
  and Thriving” ($5MM–$50MM in gross revenue) and “Mid-
  Atlantic Region” (DC, DE, MD, NC, VA, WV)), and again in
  2025 as a Best Places to Work honoree. In addition, True
  Zero earned coveted spots on the Inc. 5000 list of fastest-
  growing companies in America in 2022, 2023, and 2025, a
  testament to our sustained growth driven by our people-first
  approach and unwavering dedication to excellence.



  The AI/ML Engineer is responsible for designing, building,
  integrating, deploying, and operating artificial
  intelligence and machine learning capabilities that support
  mission and business workflows in secure government cloud
  environments. This role spans the AI/ML lifecycle, including
  data preparation, model and application development,
  evaluation, deployment, monitoring, and ongoing
  optimization.

  The engineer will leverage FedRAMP-authorized services
  available within AWS GovCloud, while ensuring all AI/ML
  solutions align with applicable security, data handling,
  compliance, and Zero Trust requirements. The ideal candidate
  has strong Python development skills, experience with modern
  AI/ML architectures and data pipelines, and practical
  knowledge of deploying and evaluating models in cloud
  environments.

  Job Responsibilities

  Job Qualifications

  - Bachelor’s degree in Cybersecurity, Computer Science,
    Information Technology, Information Systems, or a related
    technical discipline.
  - Experience with Generative AI, foundation models, and RAG
    architectures, where applicable to the program scope.
  - Experience with embeddings, vector search, semantic
    retrieval, prompt engineering, and LLM evaluation.
  - Experience with supervised or unsupervised machine learning,
    feature engineering, model training, and model selection
    where traditional ML is in scope.
  - Familiarity with MLOps or LLMOps practices for model and
    application lifecycle management.
  - Experience developing automated model and application
    evaluation frameworks.
  - Familiarity with responsible AI concepts, including model
    limitations, bias evaluation, explainability,
    traceability, and human oversight.
  - Experience deploying containerized workloads and
    microservices.
  - Experience working in government, defense, regulated, or
    other security-sensitive environments.

  We’re actively searching for talented security and
  technology practitioners who are ready to experience the
  True Zero difference. As a True Zero team member, you'll
  enjoy:



  - Competitive salary, paid twice per month

  - Best in class medical coverage

  - 100% of medical premiums covered by True Zero

  - Company wide new business incentive programs

  - Contribution Incentives (i.e. white papers, blog posts,
    internal webinars, etc.)

  - 3 weeks of PTO starting + 11 Paid Holidays Annually

  - 401k Program with 100% company match on the first 4%

  - Monthly reimbursement of Cell Phone and Home Internet costs

  - Paternity/Maternity Leave

  - Investment in training and certifications to broaden and
    deepen your technical skills
