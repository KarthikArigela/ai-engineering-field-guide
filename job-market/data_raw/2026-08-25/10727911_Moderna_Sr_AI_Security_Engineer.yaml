description: |
  If you’re interested in this role, please apply in English
  and include an English version of your Resume/CV.

  The Role: 

  As a Senior AI Security Engineer, your primary
  responsibility will be to help define and implement the
  enterprise security approach for AI adoption. You will
  develop practical security principles, architectural
  patterns, guardrails, and assessment approaches that help
  the organization deploy AI capabilities safely,
  consistently, and at scale.



  This role will also perform risk assessments of existing AI
  applications, agentic workflows, model-integrated services,
  and supporting data and access patterns. In addition, the
  role must be capable of executing baseline security reviews
  across more traditional domains such as code, cloud,
  networking, APIs, identity, and application design when
  needed. You will partner across engineering, platform,
  digital, and security teams to shape secure design decisions
  and reduce risk across both emerging AI capabilities and the
  broader technology estate.



  Here’s What You’ll Do:

  - Contribute to and help operationalize the enterprise AI
    security strategy, including target-state architecture,
    design principles, governance guardrails, and scalable
    security patterns for safe AI adoption.
  - Develop practical security standards and architectural
    guidance for AI systems, including model usage, agentic
    workflows, integration patterns, data access, identity
    boundaries, and operational controls.
  - Lead risk assessments and security reviews of existing AI
    applications, AI-enabled products, and agentic solutions,
    identifying material risks related to data exposure,
    excessive privilege, insecure integrations, unsafe
    outputs, prompt abuse, and runtime behavior.
  - Execute baseline security reviews across traditional
    technology domains such as code, cloud, networking, APIs,
    identity, and application architecture to support broader
    enterprise security needs.
  - Identify systemic control gaps, recommend pragmatic
    remediation strategies, and influence roadmaps to improve
    security outcomes across AI and non-AI environments.
  - Provide clear technical leadership and executive-ready
    guidance on AI risk, architectural tradeoffs, and
    enterprise security priorities.



  Here’s What You’ll Bring to the Table:

  - 7+ years of experience in cybersecurity, with a focus on
    network security, application security, and risk
    assessment.
  - Expertise in hybrid network environments, including on-prem
    and cloud security architectures (AWS, Azure, or GCP).
  - Experience defining security strategy and architecture for
    enterprise technology initiatives, with the ability to
    build practical standards, patterns, and guardrails that
    scale.
  - Demonstrated expertise in AI security, including security
    assessment of AI applications, model-integrated services,
    agentic workflows, data handling patterns, and attack
    paths unique to AI-enabled systems.
  - Strong ability to translate emerging AI risk into enterprise
    security strategy, architectural guidance, governance
    controls, and risk-based adoption decisions.
  - Sufficient technical breadth to execute solid baseline
    security reviews across traditional domains including
    code, cloud, networking, APIs, identity, and application
    architecture.
  - Ability to identify insecure design decisions, translate
    technical findings into prioritized recommendations, and
    influence remediation across multiple teams.
  - Excellent written and verbal communication skills, including
    the ability to explain complex architectural and risk
    issues to engineers, architects, and senior leaders.
  - Demonstrated leadership, strong judgment, and comfort
    operating in ambiguous environments with rapidly evolving
    technology and risk.
  - Experience in large-scale or regulated environments is
    strongly preferred.

