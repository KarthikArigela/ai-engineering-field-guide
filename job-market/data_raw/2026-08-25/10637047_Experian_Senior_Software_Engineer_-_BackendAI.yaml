  Job Description

  - Take a technical leadership role within development teams,
    solving complex engineering challenges and influencing
    system architecture and design - including AI/ML-
    integrated and GenAI-enabled systems.
  - Lead the end-to-end development lifecycle, including
    analysis, architecture, implementation, testing, and
    deployment of scalable GenAI solutions.
  - Design and prototype agentic workflows, LLM integrations,
    and AI-assisted tooling to accelerate engineering and
    outcomes.
  - Collaborate with Product, QA, UX, and DevOps teams to ensure
    cohesive planning and delivery of features.
  - Define and help accomplish the technical strategy for
    product development, including recommending appropriate
    technologies.
  - Ensure development work follows Agile principles and
    practices, contributing to ceremonies, backlog refinement,
    and cross-team coordination.
  - Participate in code reviews, technical discussions, and
    knowledge-sharing sessions to raise the engineering bar
    within the team.
  - You will report to a Senior Director
  - You will have to work from office 2 days a week as its a
    hybrid working

  Qualifications

  - We require you to have 5–8 years of software engineering
    experience with backend development using
    Python/Spark/Scala/Java/Spring Boot;
  - 3+ years of experience building AI-integrated or LLM-backed
    services is a strong plus
  - 3+ years of experience building cloud-native systems on AWS
    (Lambda, ECS, S3, API Gateway), including hosting and
    scaling GenAI inference workloads
  - Experience designing scalable, maintainable, and secure
    software architectures, including RAG pipelines, vector
    stores, and multi-agent orchestration patterns
  - Working knowledge of DevSecOps practices: CI/CD pipelines,
    Docker, and infrastructure-as-code; familiarity with MLOps
    or AI deployment workflows.
  - Hands-on experience with microservices, RESTful APIs, and
    messaging systems (Kafka, SQS); experience integrating LLM
    APIs or MCP-based tooling
  - Practical experience with Generative AI concepts and tools —
    including prompt engineering, agentic frameworks, and
    responsible AI principles

