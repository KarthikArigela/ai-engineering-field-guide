description: |
  Designation: Lead Software Engineer – .NET, Cloud, AI

  Location: Bangalore / Mumbai

  Work Mode: Hybrid

  Shift Timing: 12PM IST – 9PM IST

  Introduction:

  We are looking for an Expert Software Engineer who is
  recognised as a subject matter expert and advanced
  individual contributor within their discipline. This role
  goes beyond senior‑level delivery, it requires deep
  technical mastery, architectural influence, and the ability
  to drive engineering excellence across teams.

  You will work on highly complex, business‑critical systems
  within the Finance and KYC/AML domain, shaping the technical
  direction of our platforms, leading design decisions, and
  mentoring engineers across the organisation. You will
  operate with minimal supervision, exercising extensive
  independent judgment, and contributing directly to the
  evolution of our engineering standards, cloud strategy, and
  AI‑driven development practices.

  Some of the things you’ll be doing

  Technical Leadership & Architecture

  - Serve as a domain expert in .NET, distributed systems, API
    architecture, and cloud‑native design.
  - Lead the design and development of high‑performance Web
    APIs, microservices, event‑driven components and agentic
    AI solutions.
  - Partner with Architecture to define platform‑level
    blueprints, patterns, and long‑term technical direction.
  - Make high‑impact architectural decisions, evaluating
    trade‑offs and guiding teams toward scalable, secure
    solutions.
  - Drive engineering excellence through code quality standards,
    performance optimisation, and best‑practice adoption.

  AI‑Driven Engineering & Innovation

  - Lead the adoption and integration of AI, and agentic
    workflows across development, QA, and DevOps.
  - Design and build AI agents for development, testing,
    performance analysis, SAST/DAST automation, and workflow
    optimisation.
  - Demonstrate measurable AI value (e.g., reduced cycle time,
    improved test coverage, faster delivery).
  - Mentor teams on prompt engineering and AI‑assisted and
    driven development.
  - Communicate AI concepts to non‑technical stakeholders,
    promoting adoption and shaping organisational AI strategy.
  - Work with tools such as Azure AI Foundry, Azure OpenAI,
    Copilot, Claude, Cursor, and modern agent frameworks.

  Engineering Excellence & Delivery

  - Lead complex development efforts across multiple
    microservices and disconnected architectures.
  - Conduct deep‑dive code reviews, performance tuning, and
    architectural assessments.
  - Solve the most challenging technical problems across the
    stack, from API design to SQL optimisation to cloud
    scalability.
  - Mentor senior developers and guide teams in advanced
    engineering practices, design patterns, and system
    thinking.
  - Ensure high‑quality delivery across the full SDLC, including
    design, development, testing, deployment, and
    observability.

  Collaboration & Influence

  - Act as a trusted technical advisor to product, architecture,
    and leadership teams.
  - Influence engineering culture, standards, and strategic
    technology decisions.
  - Communicate complex technical concepts clearly to both
    technical and non‑technical audiences.
  - Lead by example, fostering a culture of innovation,
    ownership, and continuous improvement.

  What technical skills, experience, and qualifications do you
  need?

  Core Technical Expertise

  - 10–14+ years of experience in software engineering, ideally
    in financial services or KYC/AML.
  - Expertise in C#, .NET Core, Web API, LINQ, Entity Framework,
    MVC, and microservice architectures.
  - Strong full‑stack capability (JavaScript/React/Angular
    preferred).
  - Advanced SQL performance tuning and experience with complex,
    multi‑tier systems.
  - Strong grounding in SOLID principles, design patterns, and
    architectural decision‑making.
  - Experience designing and maintaining large‑scale,
    distributed, cloud‑native systems.

  Cloud & DevOps

  - Strong experience with Azure, including Function Apps, API
    Management, App Services, and DevOps pipelines.
  - Ability to design cloud‑native architectures with
    scalability, resilience, and security in mind.

  AI & Agentic Development

  - Solid experience in prompt engineering, agentic AI SDLC
    pipelines and patterns.
  - Hands‑on experience building AI agents for development, QA,
    performance testing, and security automation.
  - Knowledge of Azure AI Foundry, Azure OpenAI Service, and
    modern AI/ML frameworks.
  - Ability to design and optimise agentic SDLC workflows,
    demonstrating clear ROI and engineering efficiency gains.
  - Ability to communicate AI concepts to executives,
    architects, and non‑technical teams, influencing
    organisational adoption and strategy.
  - Experience with tools such as Copilot, Claude, Cursor, and
    frameworks like LangChain for building production‑grade AI
    systems.



  Leadership & Influence

  - Recognised as a go‑to expert within your current
    organisation.
  - Proven ability to mentor senior engineers and uplift team
    capability.
  - Strong communication skills, able to translate complex
    concepts into clear, actionable insights.

  Qualifications

  - Bachelor’s degree in IT or related field preferred.
  - 10–14+ years of relevant experience, or equivalent
    combination of education and expertise.

  Why This Role Matters

  This is a high‑impact role for someone who wants to shape
  the future of our engineering landscape, from architecture
  to AI adoption to platform evolution. You will influence not
  just what we build, but how we build, how fast we deliver,
  and how we scale.

