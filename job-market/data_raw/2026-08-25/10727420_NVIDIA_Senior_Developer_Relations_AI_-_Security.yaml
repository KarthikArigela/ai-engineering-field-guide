title: Senior Developer Relations, AI - Security
company: NVIDIA
location: USA
remote: true
work_type: FULL_TIME
description: |
  NVIDIA is seeking a technical Senior Developer Relations
  professional to engage in deep collaborations with the next
  generation of security companies building solutions for the
  AI and Agentic era. In this role, you will work directly
  with security companies, guiding them on how to leverage the
  NVIDIA software stack when developing solutions to secure AI
  and Agentic environments and other processing workloads! The
  ideal candidate brings a blend of deep technical expertise
  and commercial go-to-market experience, combined with a
  passion for developer advocacy and a talent for
  communicating about how NVIDIA technology can solve complex,
  real-world challenges!

  What You'll Be Doing:

  - Serve as the trusted technical advisor, problem solver, and
    champion for the developer ecosystem in the AI and Agentic
    Security industry, working with cross-functional partners
    to drive adoption of NVIDIA technologies.
  - Identify opportunities to accelerate critical workloads by
    demonstrating solutions that integrate the core NVIDIA
    stack into developer products, platforms, and pipelines.
  - Guide partners and startups through onboarding and
    integration with NVIDIA’s programs, fostering co-
    innovation and the development of next-generation
    solutions.
  - Map, track, and monitor the developer ecosystem to identify
    growth opportunities, inform technology roadmaps, and
    shape adoption strategies.
  - Collaborate cross-functionally with solution architects,
    engineering, product management, and marketing to drive
    developer engagement and optimize partner adoption
    strategies.
  - Represent and advocate for partner technical needs and
    feedback to NVIDIA’s internal product and engineering
    teams, supplying actionable insights from field
    deployments to influence product roadmaps.
  - Grow and activate developer communities around accelerated
    software, representing co-engineered products at
    conferences, meetups, and hackathons and delivering
    technical talks and hands-on workshops.
  - Surface developer sentiment and ecosystem trends,
    translating them into actionable intelligence that informs
    product direction and platform strategy.

  What We Need to See:

  - Bachelor’s of Computer Science, Engineering, or a related
    field, or equivalent experience.
  - 8+ years of overall professional experience in the
    technology industry across software engineering, developer
    relations, or technical partnerships, including 3+ years
    of direct experience in AI or Agentic Security.
  - Proven experience leading, partnering, and scaling developer
    programs at major technology companies, preferably
    security companies.
  - Significant technical proficiency in high-performance
    computing, cloud, AI/ML, and/or security frameworks and
    libraries.
  - Excellent interpersonal skills with the ability to distill
    complex technical concepts for diverse technical and non-
    technical audiences, from engineers to executives.
  - Experience leading technical collaborations with engineering
    and product teams, including architectural design, code
    reviews, technical mentorship, and delivery of technical
    talks or workshops.
  - Proven ability to structure and implement complex technical
    engagements, negotiate requirements, prioritize issues,
    and collaborate with internal or external partners across
    sales, legal, product, or marketing teams as needed.

  Ways to Stand Out from the Crowd:

  - Hands-on experience designing, building, or optimizing
    cybersecurity vertical-specific solutions, such as data
    pipelines, AI models, AI agents, ML analytics, etc.
  - Familiarity with advanced computing, AI, and/or accelerated
    computing platforms such as CUDA, Triton, NeMo, or DOCA.
  - Experience with AI/ML security, LLM application security, or
    applying AI to cybersecurity use cases.
  - Successful history of building and scaling developer
    communities and delivering impactful technical enablement
    programs.

  NVIDIA is widely considered one of the technology world’s
  most desirable employers. We have some of the world's most
  forward-thinking and hardworking people on our team. If
  you're creative and autonomous, we want to hear from you!

  Your base salary will be determined based on your location,
  experience, and the pay of employees in similar positions.
  The base salary range is 184,000 USD - 287,500 USD for Level
  4, and 224,000 USD - 356,500 USD for Level 5.

  You will also be eligible for equity and benefits.

  Applications for this job will be accepted at least until
  July 25, 2026.

  This posting is for an existing vacancy.

