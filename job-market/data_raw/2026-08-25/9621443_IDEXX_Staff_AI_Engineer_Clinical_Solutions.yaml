description: |
  As a Staff Data Scientist- AI Engineer Clinical Solutions,
  you will develop AI-powered solutions that advance
  veterinary healthcare. This role focuses on building models
  and analytical workflows using Python, Databricks, and
  generative AI tools to support clinical decision-making,
  disease risk modeling, and automated interpretation of
  diagnostic data. This is an opportunity to work at the
  intersection of AI and animal health, driving innovation
  across IDEXX products and internal solutions.

  The Data and AI Centre of Excellence (COE) develops and
  delivers data and AI solutions that enhance IDEXX products,
  services, internal operations, and business practices. You
  will work with diverse datasets spanning clinical, research,
  and business domains to enable next-generation capabilities
  across veterinary diagnostics, software, instruments, and
  services.

  In this role

  - You will design, prototype, and operationalize AI models
    using Python, Databricks, and MLflow for veterinary
    healthcare applications.
  - You’ll apply machine learning and natural language
    processing to structured and unstructured clinical data
    such as EMR records, diagnostic imaging, and laboratory
    results.
  - You will develop predictive models for disease risk,
    prognosis, and treatment outcomes.
  - You’ll partner with veterinary experts to translate domain
    questions into scalable data science solutions.
  - You will build explainable AI models to support clinical
    decisions and promote trust in automated insights.
  - You’ll contribute to evaluation frameworks for AI-driven
    tools and solutions.
  - You will collaborate with data engineers to implement
    scalable data pipelines on Databricks.
  - You’ll apply prompt engineering techniques and retrieval-
    augmented generation (RAG) to improve generative AI
    performance.
  - You will participate in agile development cycles,
    maintaining clear documentation and experiment
    traceability.
  - You’ll use best practices for version control using Git.

  Why this role matters

  This role directly contributes to advancing veterinary
  diagnostics and improving outcomes for animals worldwide. By
  combining AI innovation with clinical expertise, you will
  help deliver solutions that enhance diagnostic accuracy,
  enable earlier interventions, and drive better healthcare
  decisions for veterinarians and pet owners.

  What you need to succeed

  - Bachelor’s degree in Data Science, Computer Science,
    Biomedical Engineering, or related field
  - Mandatory experience with: Generative AI, LLM, Python,
    Databricks, LLM, and RAG
  - 5+ years of experience developing ML/AI solutions using
    Python (Pandas, PySpark, scikit-learn, MLflow)
  - Experience working with large, distributed datasets
  - Strong background in machine learning, NLP, and statistical
    methods
  - Experience in data exploration, analysis, and visualization
  - Ability to build and deploy end-to-end data science
    solutions
  - Strong SQL and data transformation skills
  - Experience using Git for collaborative development
  - Strong communication, collaboration, and documentation
    skills
  - Ability to work across the full data science lifecycle

  Preferred skills:

  - Experience with Databricks
  - Experience with prompt engineering and generative AI
    techniques
  - Experience with agentic workflows or LLM frameworks
  - Familiarity with healthcare or life sciences datasets (EMR,
    radiology, pathology)
  - Knowledge of knowledge graphs, ontologies, or semantic data
    modeling

  What you can expect from us

  - Salary: $155,000 - $165,000 / year
  - Opportunity for annual cash bonus
  - Health / Dental / Vision benefits Day-One
  - 5% matching 401k
  - Additional benefits including but not limited to pet
    insurance, mental health resources, volunteer paid days
    off, employee stock program, foundation donation matching,
    and more

  Why IDEXX

  We’re proud of the work we do, because our work matters. An
  innovation leader in every industry we serve since 1983, our
  team members help pet owners worldwide keep their companion
  animals healthy and happy, ensure safe drinking water for
  billions, and help farmers protect livestock and poultry
  from disease. We have customers in over 175 countries and a
  collaborative global workforce. Our culture embraces
  challenges and encourages learning and discovery. At IDEXX,
  you’ll be supported by competitive compensation, incentives,
  and benefits while enjoying purposeful work that drives
  improvement. If meaningful work and a sense of purpose are
  at the top of your list, you’ll find it here. Let’s pursue
  what matters together.

