description: |
  Get excited to join Scopely’s AI-native incubation team,
  which is focused on discovering the next generation of
  mobile games. This role can be remote in the US or hybrid in
  Culver City, LA.

  Rather than spending years developing a single title, we
  believe one of the most effective ways to find great games
  is to rapidly transform ideas into playable experiences,
  launch them to real players, and learn from live market
  feedback.

  We’re pioneering a new approach to game creation—one in
  which AI enables creators to work across traditional
  discipline boundaries, take greater ownership of ideas from
  concept through launch, and bring more great games to
  players.

  What You’ll Do

  If you’re passionate for rapid experimentation, enjoy
  navigating ambiguity, and love bringing ideas to life,
  you’ll feel at home on this team.

  We don’t organize our work strictly around traditional
  disciplines. We believe AI enables skilled creators to
  contribute to more of the game development process than ever
  before. Whether your background is in engineering, design,
  art, or another discipline, we’re looking for people who are
  excited to work across boundaries, develop new skills, and
  use AI to turn ideas into playable games.

  As an AI Game Developer, you’ll:

  - Own game ideas from concept through launch, helping to
    generate concepts and shape mechanics, player experiences,
    and creative direction.
  - Rapidly transform concepts into playable prototypes using
    AI-native workflows, modern game engines, and development
    tools.
  - Use AI to accelerate programming, design, art, content
    creation, testing, and production.
  - Design internal tools, automations, and agentic workflows
    that increase team velocity and unlock new creative
    possibilities.
  - Evaluate emerging AI technologies and experiment with new
    applications in game development.
  - Collaborate across disciplines to rapidly iterate on
    gameplay, features, and player experiences.
  - Launch prototypes to real players, analyze qualitative and
    quantitative feedback, and use those insights to guide
    future iterations.
  - Balance speed and quality by making thoughtful trade-offs
    that maximize learning.
  - Help define AI development practices that can scale across
    Scopely.
  - Challenge traditional game development workflows and help
    pioneer new approaches to creating games.

  What We’re Looking For

  - Strong expertise in at least one game development
    discipline, such as engineering, game design, art,
    technical art, or UX.
  - Enthusiasm for using AI to expand beyond your primary
    discipline and broaden your capabilities as a game
    creator.
  - Experience incorporating AI into creative or development
    workflows.
  - A preference for building, testing, and learning rather than
    relying on lengthy planning cycles.
  - Curiosity and adaptability, with an interest in learning new
    tools and techniques as the AI landscape evolves.
  - Strong product instincts and an understanding of what makes
    games engaging.
  - The ability to work effectively through ambiguity, rapid
    iteration, and changes in direction informed by player
    feedback.
  - Excellent communication skills and a collaborative mindset.

  For candidates in CA, CO, NJ, NY, and WA, the annual salary
  range is provided below. In addition to base pay, employees
  may be eligible for equity, bonuses, and a comprehensive
  benefits package, including healthcare benefits, retirement
  benefits, pet insurance, paid holidays, paid Scopely free
  days, and unlimited paid time off. Base pay offered may vary
  depending on job-related knowledge, skills, and experience.

  CA, CO, NJ, NY, and WA Annual Salary Range

  $169,600—$253,000 USD

  About Scopely

  Scopely is a leading video game and global interactive
  entertainment company, home to many of the world’s most
  beloved and enduring experiences, including two of the most
  successful mobile games of all-time “MONOPOLY GO!” and
  “Pokémon GO,” along with “Stumble Guys,” “Star Trek™ Fleet
  Command,” “MARVEL Strike Force,” “WWE Champions,” the
  Scrabble® franchise, “Yahtzee® With Buddies,” and many
  others. Across mobile, web, PC, and console, Scopely
  creates, develops, publishes, and live-operates one of the
  most diversified and award-winning portfolios in the games
  industry — bringing hundreds of millions of players together
  through a shared love of play.

  Founded in 2011, Scopely is powered by its exceptional team
  — including thousands of world-class gamemakers around the
  globe, a distinctive tenet-driven culture, and its
  proprietary technology platform, Playgami. Together, these
  strengths have fueled Scopely’s position as the #1 mobile
  games company in the U.S. and #2 globally, generating more
  than $10 billion in lifetime revenue. Whether building
  global sensations like “MONOPOLY GO!” from the ground up, or
  expanding through strategic acquisitions, including the
  FoxNext, GSN, and Scopely Explore games businesses — Scopely
  consistently delivers experiences players love today and
  return to for years to come.

  Recognized multiple times as one of the "100 Most
  Influential Companies in the World" by TIME magazine and one
  of Fast Company's "World's Most Innovative Companies" and
  “Best Workplaces for Innovators,” Scopely believes that
  video games can be a force for good — creating meaningful
  connections, vibrant communities, and making life better
  through play.

  Scopely has global operations and partners across four
  continents in more than a dozen countries worldwide. For
  more information, visit: https://www.scopely.com/.

