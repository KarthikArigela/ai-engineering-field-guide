title: AI/ML Engineer II
company: Astreya
location: IND
remote: true
work_type: FULL_TIME
company_size: 1,958 Employees
description: |
  What You'll Do

  - Embed with customers (onsite or remote) to deeply understand
    their technical stack, data structures, and business
    workflows
  - Design, build, and deploy custom solutions, integrations,
    and workflows on top of our platform to solve high-value
    customer problems
  - Write production-quality code - APIs, data pipelines,
    scripts, internal tools - tailored to each customer's
    environment
  - Act as the technical bridge between customers and the core
    product/engineering team, translating field learnings into
    product requirements and roadmap input
  - Rapidly prototype solutions during discovery, then harden
    them into scalable, maintainable systems
  - Debug and resolve complex technical issues across the
    customer's infrastructure and our own platform
  - Partner with sales and customer success teams during pre-
    sales technical evaluations, POCs, and pilots
  - Identify patterns across customer engagements that reveal
    opportunities for new product features or platform
    capabilities
  - Travel to customer sites as needed (varies by role/region)

  What We're Looking For

  - 4+ years of experience as a software engineer, solutions
    engineer, or similar hands-on technical role
  - Strong coding ability in at least one modern language
    (Python, TypeScript/JavaScript, Go, Java, etc.) and
    comfort working across the stack
  - Experience with databases, APIs, and data integration/ETL
    patterns
  - Demonstrated ability to work independently in ambiguous,
    fast-changing environments with limited specs
  - Strong communication skills - able to explain technical
    tradeoffs to both engineers and business stakeholders
  - Customer-facing experience or a strong desire to work
    directly with customers, not just behind a ticket queue
  - A builder's mindset: comfortable going from whiteboard to
    working prototype to production system
  - Willingness to travel (typically 20–50%, depending on team
    and customer base)

  Nice to Have

  - Experience with cloud infrastructure (AWS/GCP/Azure) and
    containerization (Docker/Kubernetes)
  - Background in a regulated or complex enterprise environment
    (finance, healthcare, government, logistics)
  - Prior experience at a startup in a customer-facing technical
    role
  - Familiarity with our specific domain (e.g., data infra,
    AI/ML, security)

  Why This Role Is Different

  - FDEs get unusually direct exposure to real customer problems
    and unusually direct influence on product direction. If
    you like the idea of shipping code that a customer uses
    within days - not quarters - and want your engineering
    work to be tightly coupled to business impact, this role
    is built for that.
