  expertise, exceptional problem-solving abilities, proven
  ownership of large-scale applications, and the ability to
  collaborate effectively across engineering and business
  teams. This position is expected to operate with a high
  degree of autonomy while driving engineering excellence,
  modernization efforts, platform scalability, and continuous
  improvement initiatives. Primary Responsibilities:

  - Technical Leadership
    - Lead technical design and solution discussions
    - Evaluate architectural trade-offs and recommend scalable
      solutions
    - Drive engineering standards, best practices, and code
      quality initiatives
    - Conduct architecture reviews, design reviews, and code
      reviews
    - Mentor and guide engineers across the team
  - Delivery Ownership
    - Own complex initiatives from design through production
      deployment
    - Independently drive execution with minimal supervision
    - Manage technical risks and dependencies proactively
    - Ensure predictable and high-quality delivery across multiple
      workstreams
  - Architecture & Solution Design
    - Design highly scalable, secure, and maintainable solutions
    - Contribute to technology strategy and technical roadmaps
    - Drive modernization efforts and technology upgrades
    - Identify opportunities for automation, optimization, and
      simplification
  - Platform Engineering
    - Improve application reliability, scalability, and
      performance
    - Support high-availability platform architectures
    - Lead root-cause analysis of production issues
    - Drive operational excellence and technical debt reduction
      initiatives
  - Stakeholder Management
    - Collaborate with Product Owners, Architects, Engineering
      Leaders, and Business Stakeholders
    - Translate business requirements into technical solutions
    - Provide technical recommendations and implementation
      strategies
    - Communicate technical concepts effectively to diverse
      audiences
  - AI & Engineering Innovation
    - Drive adoption of AI-assisted engineering practices
    - Evaluate AI and GenAI solutions for productivity
      improvements
    - Identify opportunities for automation using AI technologies
    - Mentor engineers on responsible AI usage and engineering
      innovation
