  POS-22209

  Principal Machine Learning Engineer

  HubSpot is an all-in-one marketing, sales, and service
  software platform that helps businesses grow and succeed.
  With a user-friendly interface and powerful tools, HubSpot
  enables businesses to attract, engage, and delight
  customers, ultimately driving growth and increasing revenue.
  From marketing automation to CRM, HubSpot offers a
  comprehensive solution that empowers businesses to succeed
  in the digital age.

  The AI Platform Group at HubSpot delivers the ML and AI
  foundations that enable product teams across the company to
  create easy, accurate, and consistent AI features for our
  millions of customers and their customers. This Principal
  Machine Learning Engineer role will focus on AI Context:
  building the systems that help HubSpot's AI understand
  customer, company, activity, and workflow data across the
  CRM platform.

  As a Principal Machine Learning Engineer at HubSpot, you'll
  help define the technical direction for applied ML and AI
  systems that transform complex data into customer value. You
  will work across product, engineering, data, and ML teams to
  take ambiguous 0-to-1 opportunities through model
  development, evaluation, productionization, experimentation,
  and measurable customer or business impact.

  We are looking for people who:

  - Have a long track record of delivering high-value, high-
    impact, cross-team and cross-product projects. Principal
    MLEs are among the most senior individual contributors at
    HubSpot; they continually raise the technical bar for the
    engineering and ML organizations, help shape product
    vision, and build shared technical direction through
    strong collaboration and hands-on execution.
  - Wish to stay hands-on in technical design, model
    development, production systems, and code while leading by
    example through collaboration with cross-functional and
    internal stakeholders.
  - Have a history of developing solutions to ambiguous problems
    that have had an outsized impact on a large organization's
    customer experience, product strategy, or business goals.
  - Provide strategic direction and architectural leadership for
    major ML and AI projects across multiple teams, systems,
    or product surfaces.
  - Regularly mentor, coach, and teach engineers in their areas
    of expertise, including helping senior ICs grow through
    complex technical projects.
  - Demonstrate pragmatic decision-making and problem-solving
    abilities, including strong judgment around when to use
    ML, LLMs, retrieval, rules, platform changes, or product
    changes.
  - Have expert understanding of a range of ML techniques, such
    as deep learning, optimization, regression, transformers,
    large language models, transfer learning, retrieval,
    ranking, recommendations, classification, NLP, and
    personalization, as well as tools and frameworks such as
    scikit-learn, PyTorch, TensorFlow, and modern model-
    serving and evaluation systems.
  - Are expert in crafting the right architecture for a variety
    of ML and AI Context problems from business requirements,
    often identifying where ML solutions can be effective in
    adjacent product areas.
  - Expand analysis beyond offline and online metrics by
    evaluating privacy, bias, security, reliability, cost,
    maintainability, model quality, and data governance
    concerns across the ML lifecycle.
  - Exhibit enthusiasm for building reliable, scalable systems
    for data processing, feature generation, context
    retrieval, model training, inference, experimentation,
    monitoring, and feedback loops.
  - Can guide teams beyond the status quo; we need engineers who
    lead us beyond what we have and toward what we can build,
    while creating a shared notion of how to get there.
  - Bring deep expertise in the machine learning concepts behind
    Applied and Predictive AI, such as recommendation
    algorithms and systems, binary and multiclass
    classification, ranking and relevance, semantic retrieval,
    embeddings, entity understanding, and experimentation.
  - Have experience turning messy, incomplete, or heterogeneous
    data into useful AI context for customer-facing products,
    such as customer, company, activity, workflow,
    conversation, behavioral, CRM, or unstructured document
    data.
  - Embody our engineering team values.

  If you are passionate about leveraging machine learning and
  AI to transform the way businesses interact with their
  customers in a collaborative work environment, come join us
  in the HubSpot AI Group!

  We know the confidence gap and impostor syndrome can get in
  the way of meeting spectacular candidates, so please don’t
  hesitate to apply — we’d love to hear from you.

  If you need accommodations or assistance due to a
  disability, please reach out to us using this form.

  At HubSpot, we value both flexibility and connection.
  Whether you’re a Remote employee or work from the Office, we
  want you to start your journey here by building strong
  connections with your team and peers. If you are joining our
  Engineering team, you will be required to attend a regional
  HubSpot office for in-person onboarding. If you join our
  broader Product team, you’ll also attend other in-person
  events, such as your Product Group Summit and other
  gatherings, to continue building on those connections.

  If you require an accommodation due to travel limitations or
  other reasons, please inform your recruiter during the
  hiring process. We are committed to supporting candidates
  who may need alternative arrangements

