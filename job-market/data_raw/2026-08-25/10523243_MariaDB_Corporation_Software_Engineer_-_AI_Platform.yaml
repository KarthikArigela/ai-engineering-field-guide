description: |
  About MariaDB

  MariaDB is making a big impact on the world. Whether you’re
  checking your bank account, buying a coffee, shopping
  online, making a phone call, listening to music, taking out
  a loan or ordering takeout – MariaDB is the backbone of
  applications used everyday. Companies small and large,
  including 75% of the Fortune 500, run MariaDB, touching the
  lives of billions of people. With massive reach through
  Linux distributions, enterprise deployments and public
  clouds, MariaDB is uniquely positioned as the leading
  database for modern application development.

  The OpportunityAbout the Role

  We are looking for a Developer to join a small, high-
  ownership team building next-generation AI capabilities on
  top of a widely deployed relational database engine. You
  will design and implement the application layers, business
  logic, and API workflows that sit at the intersection of
  data management, AI applications, and relational database
  operations—components that enterprise AI applications depend
  on for correctness, performance, and governance.

  This is a hands-on, end-to-end role. You will go from
  whiteboard to production: owning the implementation of the
  features you build, writing clean and scalable application
  code, integrating AI orchestrators, and ensuring robust
  deployment across cloud and on-premises environments. The
  team is small by design, which means high individual impact
  and direct visibility into product and engineering strategy.

  The ideal candidate has worked across multiple cloud
  providers, has deep experience building with modern AI agent
  frameworks, and approaches every feature with an ownership
  mindset — shipping things that work in production, not just
  in demos.

  Key Responsibilities

  - End-to-End Feature Development: Lead the full software
    development lifecycle—from application design and API
    implementation to deployment and feature monitoring.
  - AI & Agent Integration: Connect production applications with
    agent frameworks (e.g., LangChain) and interoperability
    protocols (e.g., MCP, A2A) to support scalable, framework-
    agnostic APIs.
  - Database & Data Management: Develop secure, versioned
    application data models that enforce multi-tenant
    isolation, auditability, and data classification using
    advanced relational database features.
  - Multi-Cloud & Deployment: Build application services that
    deploy consistently across AWS, Azure, GCP, and on-
    premises environments, while utilizing automated CI/CD
    pipelines.
  - Application Performance: Define and meet feature-level
    performance goals through rigorous query optimization,
    code profiling, caching strategies, and proactive security
    practices.
  - Leadership & Collaboration: Maintain full ownership of
    application components, facilitate constructive design and
    code reviews, mentor team members, and drive decisions in
    an async-first environment.

  Required QualificationsExperience

  - 5+ years of professional software development experience,
    with at least 2 years focused on data-intensive
    applications, database-adjacent features, or enterprise
    software.
  - Demonstrated end-to-end ownership of a non-trivial
    production feature or module: you have taken something
    from functional specification through implementation to
    production.
  - Hands-on production experience deploying, debugging, and
    managing application services across at least two major
    public clouds (AWS, Azure, GCP).
  - Experience building or integrating with vector databases,
    embedding pipelines, semantic search, or retrieval-
    augmented generation (RAG) systems.
  - Prior work building LLM-based applications or workflows
    using AI agent frameworks (LangChain, LangGraph, CrewAI,
    AutoGen, or equivalent).

  Technical Skills

  - Strong proficiency in Python for AI application development,
    alongside high proficiency in at least one backend
    language (such as Go, Java, or C++).
  - Deep, practical application of relational databases: writing
    complex SQL, structural indexing, query optimization,
    transactions, and schema design.
  - Experience implementing temporal data models, event-driven
    tracking, audit logs, or utilizing system-versioned
    tables.
  - Solid understanding of application security fundamentals:
    authentication, authorization, RBAC, row-level security,
    and multi-tenant data isolation at the application layer.
  - Proficiency with modern application monitoring tooling:
    structured logging, distributed tracing (OpenTelemetry),
    and functional alerting.
  - Experience designing and implementing REST and/or gRPC APIs
    used by external consumers or frontend systems.

  Preferred Qualifications

  - Experience contributing to or maintaining open-source
    projects in the database, AI/ML application, or agent-
    tooling ecosystem.
  - Hands-on experience developing MCP servers or integrating
    A2A (Agent2Agent) protocols into production systems.
  - Familiarity with agent memory frameworks such as Mem0,
    Graphiti, or Letta.
  - Experience leveraging graph databases or multi-hop graph
    traversal (Neo4j, Kuzu, FalkorDB, or similar) within
    applications.
  - Background with in-memory data grids or semantic caching
    systems (Redis or similar) to optimize AI token usage.
  - Experience packaging applications for on-premises or air-
    gapped deployment environments, including regulated
    infrastructure.
  - Knowledge of MariaDB or MySQL application development,
    system-versioned tables, or temporal SQL.

  The Team & How We Work

  You will join a small, senior, and highly autonomous
  engineering team. We are remote-first and async-by-default,
  with a strong bias for written communication and explicit
  design decisions over meeting-driven consensus.

  We keep the team small deliberately: every developer has
  high individual impact, owns meaningful pieces of the system
  end-to-end, and interacts directly with customers and
  product leadership. There is no room for passengers, and
  there is no ceiling on contribution.

  We are disciplined about scope: we build only what is
  genuinely ours to own, adopt open-source aggressively where
  it is the right substrate, and cede work that belongs to the
  ecosystem. We expect every developer to internalize and
  defend that line, not just follow it.

  Location

  India remote

  What's in it for you?

  Impact the world of technology by pushing the boundaries of
  technology and business models, working at MariaDB, plc. Be
  part of a game-changing organization that encourages
  outside-the-box thinking, values empowerment, and is truly
  shaping the future of the software industry.

  You’ll be collaborating with high-caliber colleagues around
  the world, offering unparalleled learning and growth
  opportunities. We provide a very competitive compensation
  package, 25 days paid annual leave (plus holidays) and a
  massive degree of flexibility and freedom, and more.

  Salaries for candidates outside the U.S. will vary based on
  local compensation structures.

  How to Apply

  If you are interested in this position, please submit your
  application along with your CV/Resume through our ATS
  Greenhouse on our MariaDB Careers site.

  At MariaDB we celebrate the diverse experiences and
  perspectives of our employees because this drives innovation
  and success. MariaDB is an equal opportunity employer
  dedicated to creating a welcoming and inclusive workplace
  for everyone.

  MariaDB does not sponsor work visas or relocation.

  MariaDB is committed to providing accommodations for
  individuals with disabilities within our application and
  interview process. To request an accommodation due to a
  disability, please inform your recruiter.

  MariaDB will not accept agency resumes without a prior
  contractual agreement with HR. Please do not forward resumes
  to any recruiting alias or employee directly. MariaDB is not
  responsible for paying any fees associated with any
  unsolicited submitted CV/Resumes.
