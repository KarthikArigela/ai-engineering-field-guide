description: |
  Description

  Jeen empowers enterprises with generative AI through
  advanced AI agents, automations, voice analytics, and
  knowledge-based insights across any cloud or on-premise
  environment. Trusted by industry leaders shaping tomorrow's
  technological landscape.

  About the Role

  We’re looking for an AI Solution Engineer to lead the
  technical side of complex AI opportunities.

  You’ll work directly with Tier 1 enterprise customers
  globally, leading technical discovery, solution design,
  POCs, and technical validation while helping customers adopt
  advanced AI solutions at scale.

  Responsibilities

  - Lead technical discovery and solution design sessions with
    enterprise customers
  - Build and deliver proofs-of-concept for AI/ML solutions
    (NLP, knowledge retrieval, conversational AI,
    integrations)
  - Present to executives, respond to RFPs/RFIs, and own
    technical validation in deals
  - Develop light production-quality code and integrations in
    Python and at least one of Java, JavaScript/TypeScript
  - Travel frequently to customer sites (40–80%)

  Requirements

  - ﻿3+ years of experience in pre-sales, solution engineering,
    or technical program management
  - Hands-on experience designing and delivering enterprise
    AI/ML solutions, including RAG architectures, agent
    orchestration, conversational AI, knowledge retrieval, and
    integration protocols such as MCP
  - Hands-on experience with Kubernetes, Terraform /
    Infrastructure as Code (IaC), and VPC deployments across
    AWS and Azure, including familiarity with on-prem and air-
    gapped environments
  - Proficiency in Python and one of Java or
    TypeScript/JavaScript, with the ability to build
    integrations, scripts, and light production code
  - Understanding of enterprise AI governance and compliance,
    including RBAC, audit trails, data lineage, security, and
    access controls
  - Strong customer-facing capabilities, with the ability to
    lead technical discovery sessions, whiteboard
    architecture, and technical validation
  - Strong presence with CxO and technical stakeholders,
    including ownership of RFP/RFI responses, executive
    presentations, and proofs of concept
  - Willingness to travel frequently to customer sites (40–80%)

  Preferred Qualifications

  - Exposure to regulated industries
  - Experience with conversational AI platforms
  - Cloud certifications
  - SaaS startup experience

  The estimated annual base salary range for this AI Solution
  Engineer role is $120,000-$150,000. Actual compensation will
  be determined based on factors including relevant
  experience, technical expertise, qualifications and business
  needs.
