description: |
  Job Summary: 

  The Gen AI Solutions Engineer, Investment Solutions role at
  Clearwater Analytics spans a spectrum of responsibilities
  with a focus on designing, implementing, and managing
  software systems. The role requires continuous learning and
  application of new technologies and trends. Engineers at
  entry-level work on coding, debugging, and learning new
  software technologies. With progression in this track, the
  responsibilities expand to include leading teams, designing
  complex software systems, providing mentorship, and managing
  cross-functional integration. The more senior roles are
  responsible for defining the company's technological vision,
  making strategic decisions, driving innovation, and setting
  new industry standards. Across all levels, a successful
  software development engineer will demonstrate strong
  problem-solving skills, clear communication, excellent
  coding abilities, a keen understanding of the software
  ecosystem, and a cooperative team player attitude. 

  Responsibilities: 

  - Design, build, deploy, and maintain quality code that is
    simple, well-structured, clear, and well-tested.

  - Effectively break down and solve complex problems that
    require research or collaboration.

  - Communicate effectively, regardless of medium, audience, or
    timing.

  - Collaborate with cross-functional teams to understand
    project requirements and contribute to the development of
    innovative AI solutions.

  - Strong command of multiple levels of automated testing
    (e.g., unit, integration, contract, end-to-end, etc.).

  - Mentor new and less-experienced team members.

  - Initiate design and feature discussions, advocating for
    improvements in software performance, scalability,
    reliability, and security.

  - Coordinate with other teams to ensure the successful
    integration of software applications.

  - Troubleshoot and resolve production incidents quickly and
    effectively.

  - Understand, respond to, and address customer needs and
    issues with empathy and timeliness.

  - Any other reasonable activity required by management.

  Required Skills:  

  - Proficiency in Python

  - Strong familiarity with investment management industry and
    concepts

  - Experience writing multi-asset portfolio management and
    trading software

  - Deep knowledge of software methodologies, tools, and typical
    architectural patterns.

  - Driven by client satisfaction.

  - Strong teamwork skills.

  - Ability to manage own time and deliver expected results on
    time.

  - Commitment to continuous learning and improvement.

  - Exceptional analytical skills.

  - Excellent attention to detail and strong documentation
    skills.

  - Outstanding verbal and written communication skills.

  - Strong organizational and interpersonal skills.

  - Exceptional problem-solving abilities.

   Education and Experience:  

  - Degree in Computer Science or related field.

  - 4+ years of software development experience.

    What we offer: 

  - Business casual atmosphere in a flexible working environment

  - Team-focused culture that promotes innovation and ownership

  - Access cutting-edge investment reporting technology and
    expertise

  - Defined and undefined career pathways, allowing you to grow
    your way

  - Competitive medical, dental, vision, and life insurance
    benefits

  - Maternity and paternity leave

  - Personal Time Off and Volunteer Time Off to give back to the
    community

  - Work from anywhere 3 weeks out of the year

  - Work from home Fridays

  Why Join Us? This is an incredible opportunity to lead a
  passionate engineering team that is shaping the future of
  investment management technology. If you're ready to take
  your career to the next level and make a significant impact,
  apply now! 

  Salary Range

  $137,770.00 - $178,250.00

  This is the pay range the Company believes it will pay for
  this position at the time of this posting. Consistent with
  applicable law, compensation will be determined based on
  relevant experience, other job-related
  qualifications/skills, and geographic location (to account
  for comparative cost of living). The Company reserves the
  right to modify this pay range at any time. For this role,
  benefits include: health/vision/dental insurance, 401(k),
  PTO, parental leave, and medical leave, STD/LTD insurance
  benefits. Clearwater Analytics is An Equal
  Opportunity/Affirmative Action Employer. All qualified
  applicants will receive consideration for employment without
  regard to race, color, religion, sex, sexual orientation,
  gender identity, national origin, disability or veteran
  status, age or any other federally protected class.
