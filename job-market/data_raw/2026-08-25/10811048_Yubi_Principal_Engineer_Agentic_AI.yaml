description: |
  ABOUT YUBI

  Yubi (formerly CredAvenue) is redefining global debt markets
  by freeing the flow of finance between borrowers, lenders,
  and investors — the world's possibility platform for the
  discovery, investment, fulfilment, and collection of any
  debt solution. In March 2022, we became India's fastest
  fintech unicorn with a $137M Series B. Our platforms — Yubi
  Credit Marketplace, Yubi Invest, Financial Services
  Platform, Spocto, and Corpository — serve 17,000+
  enterprises and 6,200+ investors, facilitating over
  ₹1,40,000 crore in debt volumes. Backed by Insight Partners,
  Sequoia Capital, Dragoneer, B Capital, LightSpeed, and
  Lightrock.

  ROLE OVERVIEW

  As a Principal Engineer (Agentic AI), you will be the
  technical visionary behind Yubi's AI platform — setting the
  long-term architecture direction, establishing engineering
  excellence standards, and driving the adoption of agentic AI
  across our entire product suite. This is a hands-on
  leadership role: you will write critical code, mentor senior
  engineers, define platform-level abstractions, and partner
  directly with the CTO and VP Engineering to shape Yubi's AI
  strategy. Your work will determine how intelligent agents
  transform the future of debt markets at scale.

  KEY RESPONSIBILITIES

  Platform Architecture & Strategy

  - Define the multi-year technical vision and architecture for
    Yubi's Agentic AI platform — spanning agent runtimes, LLM
    integration layers, data pipelines, and developer tooling.
  - Establish platform-level abstractions and internal
    frameworks that accelerate agent development across
    multiple product teams.
  - Lead architectural reviews across engineering, ensuring AI
    systems are scalable, explainable, compliant, and cost-
    efficient at millions-of-transactions scale.
  - Identify build vs. buy decisions for AI infrastructure;
    evaluate and adopt emerging frameworks, foundation models,
    and tooling ahead of the curve.
  - Define and own AI engineering standards: prompt versioning,
    evaluation frameworks, guardrail policies, and responsible
    AI practices.

  Hands-On Agentic AI Engineering

  - Design and build the most complex, high-stakes agent systems
    — multi-agent orchestration, long-horizon planning,
    reflection loops, and tool-augmented reasoning.
  - Architect LLM fine-tuning and alignment workflows for
    domain-specific financial tasks where general models fall
    short.
  - Own the agent evaluation and reliability framework — golden
    datasets, LLM-as-judge pipelines, regression suites, and
    production monitoring.
  - Drive RAG platform evolution — advanced retrieval, hybrid
    search, knowledge graph integration, and context
    compression.
  - Build developer experience tooling — internal SDKs, agent
    testing harnesses, and observability dashboards used by
    all AI teams.

  Organizational Impact

  - Mentor and coach Lead, and Senior engineers across AI teams;
    act as a technical multiplier across the organization.
  - Define the engineering hiring bar for AI roles; lead final-
    round technical interviews and calibration sessions.
  - Represent Yubi's engineering at external conferences, tech
    talks, and open-source communities to attract top talent.
  - Collaborate with CTO, VP Engineering, and business
    leadership to translate AI opportunities into executable
    technical roadmaps.

  Requirements

  REQUIRED SKILLS & QUALIFICATIONS

  Technical

  - 8–12 years of full-stack engineering experience; 2+ years in
    production LLM / AI agent system development.
  - Very strong problem solving capability and doing HLD and LLD
    for a given problem
  - Good understanding of data structures , algorithms
  - Good Understanding of CI/CD  pipelines and test driven
    development
  - Deep expertise in Spring Boot, Spring Cloud, and Hibernate
    for enterprise-grade, high-throughput microservices.
  - Deep Understanding of Observability frameworks , Async
    processing frameworks
  - Strong React/TypeScript and Node.js skills; experience with
    large-scale frontend architectures.
  - Proven track record of architecting and shipping production
    LLM-powered systems handling significant load.
  - Expert-level knowledge of agent orchestration (LangGraph,
    AutoGen, custom runtimes), RAG pipelines, and LLM
    evaluation.
  - Deep experience with Kafka, event-driven architectures, and
    large-scale data pipelines.
  - Kubernetes, AWS (EKS, MSK, RDS, SageMaker), and
    infrastructure-as-code expertise.
  - Strong understanding of responsible AI — explainability,
    bias mitigation, hallucination control, and regulatory
    compliance.

  Leadership & Soft Skills

  - Demonstrated technical leadership across multiple teams and
    products simultaneously.
  - Exceptional written and verbal communication — able to
    influence executives, engineers, and external partners.
  - Track record of building and growing high-performing
    engineering teams.
  - Strategic thinker who can operate at both the architecture
    white-board and the code editor.
  - B.E. / B.Tech in Computer Science or related field; M.Tech /
    PhD advantageous.
