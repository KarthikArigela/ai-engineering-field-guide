job_id: 10729073
title: "Principal Solutions Engineer, Data & AI"
company: MedScout
location: USA
remote: true
work_type: FULL_TIME
description: |
  At MedScout, our mission is to empower MedTech commercial
  teams with the data, insights, and tools they need to
  deliver life-changing medical innovations to the patients
  who need them most. We’re creating a best-in-class revenue
  acceleration platform that unites the latest medical claims
  intelligence with an intuitive user experience built
  specifically for sales professionals at medical device and
  diagnostic companies.

  We've raised $31.8M from incredible investors to redefine
  this category at a fast pace. To keep up with demand, we're
  looking for a founding solutions engineer: technical enough
  to architect and validate data solutions, commercial enough
  to create the art of the possible, and ready to own the
  technical outcome of our largest enterprise deals.

  What the Role is…

  This is the founding Solutions Engineering role. We are
  hiring a senior, hands-on solutions leader to serve as the
  technical and data expert in our most important enterprise
  sales cycles. This is not a traditional demo-support role.
  You will help customers understand how MedScout fits into
  their data and insights strategy, build tailored demo and
  proof-of-value experiences, lead claims-data and integration
  discussions, and show what is possible as our AI
  capabilities evolve.

  You are the connective tissue between the commercial team
  and Engineering. You translate what a customer is asking for
  into something our data and product teams can act on, and
  translate what we can do into something a buyer can decide
  on.

  You will work closely with Sales, Product, Data, and
  Engineering and will help turn the deep industry knowledge
  held by MedScout's commercial leadership into repeatable
  tools, stories, and best practices for the broader team.

  What You Will Do…

  - Lead technical discovery and solution design. You diagnose
    before you defend. Working across analytics, data
    engineering, IT, security, commercial ops, and executive
    stakeholders, surface the commercial questions the
    customer is trying to answer (where procedures are
    happening, which providers matter, where referrals leak)
    and map the environment those answers land in: CRM,
    warehouse, identity spine, incumbent vendors. You leave
    discovery able to name the gap between their data today
    and what their strategy needs, and to turn that into clear
    requirements, delivery method, and architecture.
  - Turn our data into commercial insight. The data team owns
    how the data is built. You own what it means to a buyer.
    Coverage, latency, identity resolution, attribution, and
    code set logic come up live in technical evaluation,
    including longitudinal patient journey questions where you
    scope precisely what the data can and cannot answer.
    Ensure confidence in the data, confidence in ability, and
    confidence in the partnership.
  - Scope data delivery into customer environments. Snowflake
    Secure Data Sharing, Databricks Delta Sharing, cloud
    object storage, API delivery, CRM, and downstream
    analytics workflows. You own the scoping conversation and
    the repeatable motion around it: what the customer needs,
    what we have committed to, and what Engineering has to
    build.
  - Run the RFP and security review. You own the outcome on the
    technical, methodology, and governance sections of every
    RFP, RFI, and questionnaire, including SOC 2, HIPAA, BAAs,
    and data use agreements. You are the orchestrator and the
    editor. You pull the right answer out of data,
    engineering, product, and legal, keep an answer library so
    we stop rewriting the same response, and own quality and
    turnaround.
  - Enable the demo environment. Fresh data templates, working
    accounts, a defined reset cadence, persona-specific paths
    for the sales leader, analytics buyer, data evaluator, and
    executive sponsor(s), and packaged plays for our core use
    cases: territory optimization, competitive displacement,
    referral leakage, site of care shift, patient journey, and
    launch targeting.
  - Own the technical narrative for AI. Our in-product agent,
    our public MCP server, and what customers build when their
    commercial intelligence reaches their own AI tools. Answer
    the provenance, grounding, access control, and governance
    questions, so AI stops being a deal blocker. Track how the
    AI tool ecosystem is moving and translate it into what a
    specific customer should actually build with our data.
  - Own SE pipeline reporting. You are the source of truth on
    how technical evaluation affects deal outcomes: stage
    conversion by product, time engaged per opportunity, and
    win and loss intelligence on the deals you touched.
    Credibly forecast the opportunities, and fix the patterns
    you see repeating.
  - Institutionalize what you learn. Convert tribal knowledge
    into discovery guides, training materials, answer
    libraries, architecture patterns, and enablement, and run
    the feedback loop from the field back to Product.

  What We Are Looking For…

  - 5+ years in a customer-facing technical role. Solutions
    engineer, sales engineer, solutions architect, solutions
    consultant, or heavily client facing data consulting.
    Title matters less than scope: you have personally owned
    the technical outcome of enterprise deals.
  - Credible on modern data platforms. Snowflake, Databricks, or
    equivalent. You write SQL comfortably, and you understand
    at a working level how warehouse cost, performance, and
    secure data sharing behave. You need enough depth that a
    customer's data engineer takes you seriously and enough
    judgment to know when to stop and bring ours in. Bonus
    points if you've built apps on Streamlit in Snowflake
    (SiS) or Databricks Apps, or if you've used modern BI
    tools like Tableau, Hex, Superset, etc.
  - Real integration experience. You have delivered data into
    someone else's environment by warehouse share, API, or
    file, and survived the security review and the data use
    agreement that came with it. You can talk credibly about
    REST API design, authentication, pagination, rate limits,
    and webhooks with a customer's engineering team.
  - CRM fluency. You can speak to managed packages, object
    models, field mapping, and sync direction, and advise a
    customer on what to bring into Salesforce, HubSpot, or
    Dynamics, and what to leave in the warehouse.
  - Healthcare claims or real world data fluency. Earned on the
    buy side, in a health system, or at a vendor, all count
    equally. Working command of CPT, HCPCS, ICD-10, PLA, DRG,
    place of service, NPI and taxonomy, and site of care
    logic.
  - Command of the room, and clear writing. You can hold your
    own with a data engineer and a VP of Sales back to back,
    and you know when the room needs the methodology and when
    it needs the punchline. A large part of this job is
    writing.
  - Daily working use of AI tools. Claude, ChatGPT, Copilot,
    Cursor, or similar, so you can speak credibly to a
    customer about agentic workflows because you build with
    them.
  - Builder instinct. You are energized rather than unsettled by
    an unwritten job, and you have built something reusable
    that outlived your involvement.

  Strongly preferred: MedTech, diagnostics, or digital health
  commercial experience rather than broad healthcare IT; time
  at a claims or provider intelligence vendor such as
  AcuityMD, Definitive Healthcare, Komodo, IQVIA, Veeva,
  Salesforce Life Sciences, Kythera Labs, Symphony Health, and
  / or H1; familiarity with MCP, agent tooling, or LLM powered
  workflows on a data product; BI depth and comfort with basic
  Python; exposure to enterprise healthcare security and
  governance review.

  The Ideal Candidate…

  You are a builder who can move comfortably between a data
  engineer, a VP of Sales, and an executive buyer. You can
  turn an ambiguous customer question into clear requirements,
  a credible solution, and a compelling story. You are
  technically rigorous, commercially curious, and energized by
  the opportunity to help define a new solutions function.

  Are we a fit for each other?

  At our stage, we believe how you operate is more important
  than what you’ll do day-to-day. As an early team member,
  we’re looking for individuals with strong alignment with the
  following core values.

  - Effort on our inputs: We prepare diligently, leave it all on
    the "field", and move on quickly. Focusing on good habits
    and work ethic, not individual outcomes, ultimately
    creates a winning culture and a successful company.
  - Earn Trust: We keep our commitments to our customers,
    partners, and each other. We listen attentively, speak
    candidly, and treat others respectfully. We strive to
    demonstrate empathy, inclusion, and intellectual honesty.
  - We are a Learning Organization: The only sure path to
    continuous improvement is a hypothesis-driven approach
    that prioritizes focus, decisive experimentation, rapid
    learning, and iteration. We expect low ego and a high
    degree of collaboration to enable us to find the right
    answer as quickly as possible.
  - “Top Right” is the Expectation: We hire and reward driven,
    innately curious individuals who work hard to gain a deep
    understanding of our market, their craft, and the outcomes
    we strive to deliver for our partners.

  What can you expect from us?

  - Fully covered healthcare and a great vision, dental, and
    401k package.
  - Generous budget for learning and development + any tools you
    feel would make you more effective.
  - Stipends for new office setup and continued support.
  - Stipends for health and wellness.
  - Remote first culture and on-sites with the rest of the
    MedScout Team.
  - You will feel heard. You will hear, "Yes, let's do that!"
    and then have the opportunity to execute your ideas
    successfully.
  - We stay in nice hotels and eat well when we travel for work.
    No one feels like a badass walking into a Quality Inn.

  MedScout embraces diversity and equal opportunity in a
  serious way. We are committed to building a team that
  represents a variety of backgrounds, perspectives, and
  skills. We believe the more inclusive we are, the better our
  work will be.

  We will ensure that individuals with disabilities are
  provided reasonable accommodation who need it. We want you
  to be able to participate in the job application or
  interview process, to perform essential job functions, and
  to receive other benefits and privileges of employment. If
  you require any accommodation please let us know!
