description: |
  Powering Trade For The Emerging Cannabis Industry



  Distru is the #1 ERP in the Cannabis Industry with $3B in
  annual sales processed through our platform! We are a fully
  remote and global team building a software platform to
  streamline the supply chain for the cannabis industry. Most
  of the top cannabis brands and distributors across the
  United States use our software to manage their entire
  operation and stay compliant.



  As part of our next phase of growth, last year we launched
  Distru Commerce; a wholesale platform that extends our ERP
  into the B2B marketplace layer, giving operators a single
  system to manage their internal operations and their
  external wholesale sales channels in one fully integrated
  system. But we're not stopping here. AI is now a core part
  of how we build and where we're placing our bets. The AI
  Order Agent is live and already changing how our customers
  operate: buyers can submit orders from any source and any
  format saving time spent on manual data entry. That's one
  piece of a bigger picture: using AI to take the repetitive,
  heavy-lifting work out of running an ERP so operators can
  focus on running their business.



  We take a tremendous amount of pride in our culture and have
  5/5 stars on Glassdoor because we truly care about our
  people. We are stable, profitable, and heavily investing in
  growing new product lines to expand our reach. Our investors
  include Felicis Ventures, Global Founders Capital, Poseidon
  Asset Management, and Village Global who have funded
  companies such as Shopify, Cruise, HelloFresh, Facebook,
  Slack, and Opendoor.





  The Opportunity

  We're looking for an AI Product Engineer, working directly
  with our CTO, to architect and build an agentic harness —
  think of it as the Claude Cowork for vertical-specific SaaS.
  This product will bridge the tools businesses already use to
  run their operations (ERP, CRM, spreadsheets, calendars,
  email, analytics, compliance systems) and fundamentally
  change how they interface with their own data and systems.

  This is not a "bolt AI onto existing features" role. You'll
  be building a new, standalone agentic product from the
  ground up, which means you'll operate as both the engineer
  and the product owner: scoping the problem, making
  architecture calls, and shipping without a lot of structure
  around you. You'll report directly to the CTO and work
  closely with product, engineering, and design as this fits
  into Distru's broader AI-native roadmap.

  Distru is at an inflection point. We have deep market
  penetration in cannabis ERP, a commerce layer live and
  growing, and a roadmap that's increasingly AI-native. This
  role owns one of the most ambitious pieces of that roadmap —
  building the connective tissue that lets an entire industry
  run its business through an agentic interface.

