description: |
  Position Summary

  Why join our team? The AIX team sits at the centre of
  Samsung Ads’ company-wide AI transformation. Our mandate is
  direct business impact: putting powerful, safe AI tools into
  the hands of every department — from Sales and Marketing to
  Finance, HR, Legal, and Operations. You’ll partner with a
  dedicated Product Owner and Principal Architect from
  Engineering to drive a GenAI enablement roadmap that is
  rapidly expanding into agentic AI territory. The team is
  small, senior, and high-trust. You will have direct
  visibility with business leadership, the autonomy to shape
  how an entire organisation works with AI, and a mandate to
  move fast on solutions that matter.

  Role and Responsibilities

  Your key responsibilities

  As a Senior GenAI Engineer, you are the hands-on driving
  force behind AI-powered automation at Samsung Ads.
  Partnering directly with non-technical teams across every
  department, you will uncover complex business bottlenecks
  and translate those pain points into production-ready
  Generative AI solutions. Your critical focus will be on
  pioneering agentic AI workflows—enabling autonomous, multi-
  step process automation that fundamentally changes how our
  company operates.

  You won't just take tickets; you will own the end-to-end AI
  lifecycle. From proactively identifying high-impact use
  cases to evolving our entire AI tooling ecosystem, you will
  ensure every solution you ship is safe, compliant, and
  highly measurable.

  - Ship High-Impact Solutions: Design, build, and deploy custom
    GenAI automation and productivity tools directly for our
    business teams in Sales, Marketing, Finance, HR, Legal,
    and Operations.
  - Architect Agentic Workflows: Build and scale complex agentic
    workflows from scratch—implementing advanced task
    decomposition, tool orchestration, decision-making loops,
    and smart human-in-the-loop checkpoints.
  - Master Multi-Agent Orchestration: Design and maintain multi-
    agent patterns to automate heavy-lifting tasks like deep
    document analysis, research synthesis, data
    transformation, and seamless cross-system process
    automation.
  - Own our Tech Stack: Serve as the go-to, hands-on technical
    expert for AWS Bedrock, Claude, AnythingLLM, and our
    homegrown GenAI platform.
  - Connect Enterprise Systems: Integrate your agentic AI
    workflows deeply with our core business systems (including
    CRM, HRIS, finance tools, and collaboration platforms) to
    make automation truly seamless.
  - Build Safe & Secure AI: Define robust safety guardrails,
    clear escalation paths, and human oversight mechanisms for
    autonomous workflows, ensuring all solutions strictly
    comply with Samsung's security, privacy, and HQ data
    classification policies.
  - Measure What Matters: Define and track concrete, business-
    focused KPIs—measuring workflows automated, hours saved,
    tool adoption rates, and user satisfaction.
  - Drive Build-vs-Buy Decisions: Evaluate emerging AI tools and
    vendors, conducting rapid, hands-on Proof of Concepts
    (POCs) to guide our long-term technical roadmap.

  What we need for this role

  To be successful, you will possess the following skills and
  attributes:

  - Strong Software/Systems Engineering (5+ Years): You are an
    engineer first. You know how to build, deploy, and
    automate systems (CI/CD, GitHub Actions, etc.).
  - Production GenAI Experience (2+ Years): You have moved past
    the "tinkering" phase. You have actually deployed LLMs
    into a production environment (even if just for internal
    company users) and understand the security and limitations
    of live AI systems.
  - Core AI Tech Stack: Absolute proficiency in Python, RAG
    architectures, and Vector Databases.
  - Mastery of Context (MCP): Deep understanding of MCP (Model
    Context Protocol / Master Control Prompts), including best
    practices and security guardrails for building useful
    assistants.
  - Communication Skills: You can clearly explain complex AI
    capabilities to a non-technical HR or Sales leader without
    relying on jargon.
  - Tooling Familiarity: Familiarity with AWS Bedrock and hands-
    on experience with open-source AI tooling.
  - Bonus Points: Familiarity with agentic frameworks
    (LangGraph, CrewAI, Claude Agent SDK) and enterprise data
    classification.

  What does success look like?

  - First 6 months: You will have completed a full AI tool and
    data flow audit, established strong relationships with
    cross-departmental stakeholders, documented safety
    guardrails, and deployed at least one production agentic
    workflow that is actively used by a business team.
  - 6–12 months: You will have multiple agentic workflows
    running in production across at least three departments,
    and established a self-service AI resource library for
    non-technical users.
  - The Ultimate Metric: Your success is measured entirely on
    business impact—workflows automated, hours saved per week,
    and user adoption rates—not raw model benchmarks.

  Skills and Qualifications

  Benefits of working at Samsung include

  - Hybrid working - 3 days in the office and 2 days at home per
    week
  - Bonus scheme linked to individual, team and company
    performance
  - Income protection
  - Enhanced pension contribution
  - Private medical insurance
  - Three volunteering days each year
  - Flexible benefit portal and contribution of £55 per month -
    including travel insurance, gym membership, season ticket
    loan, Tastecard, dental insurance and more
  - Holiday - 25 days plus bank holidays and an additional day
    off for your birthday
  - Access to discounts on a wide range of Samsung products
  - Access to a discount shopping portal

