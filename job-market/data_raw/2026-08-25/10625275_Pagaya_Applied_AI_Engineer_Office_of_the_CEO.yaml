description: |
  About Pagaya

  Shape the Future of Finance Pagaya is building a leading
  artificial intelligence network to help our partners grow
  their businesses and better serve their customers. Pagaya is
  a global technology company making life-changing financial
  products and services available to more people nationwide,
  as it reshapes the financial services ecosystem. By using
  machine learning, a vast data network and a sophisticated
  AI-driven approach, Pagaya provides comprehensive consumer
  credit and residential real estate solutions for its
  partners, their customers, and investors. Its proprietary
  API and capital solutions integrate into its network of
  partners to deliver seamless user experiences and greater
  access to the mainstream economy. Pagaya has offices in New
  York and Tel Aviv. For more information, visit pagaya.com.

  Let's create better outcomes together!

  About the Role

  As an Applied AI Engineer embedded within the Office of the
  CEO and President (OCEO/OOP), you will serve as a high-
  impact builder driving the future of AI-enabled business
  transformation at Pagaya. Working at the intersection of
  business strategy, data architecture, and modern artificial
  intelligence, you will build and deploy practical, high-
  value AI solutions, automations, and intelligent agents that
  modernize internal workflows.

  Starting within the OCEO/OOP to address high-visibility
  executive priorities, your work will quickly expand to
  partner with key business functions across Capital Markets,
  Finance, and broader Operations. Combining a strong
  background in Business Intelligence (BI) with hands-on AI
  engineering capabilities, you will translate complex
  financial workflows into durable, scalable AI systems that
  elevate operational speed and analytical precision across
  the company.

  Responsibilities

  - Embedded AI Development: Act as the primary technical
    builder, advisor, and problem-solver for AI-enabled
    workflow transformations - starting in the OCEO/OOP and
    expanding into Capital Markets, Finance, and key
    operational units.
  - Workflow Automation & Agentic Systems: Identify manual,
    repeated, or data-dense business processes and build
    production-ready AI tools, customized copilots, and
    agentic workflows to streamline execution.
  - BI & Data Integration: Leverage a robust background in
    Business Intelligence and data analysis to connect LLMs,
    foundation models, and AI agent frameworks directly into
    Pagaya’s data infrastructure, dashboards, and financial
    models.
  - Cross-Functional Execution: Work closely with business
    leadership, financial analysts, and capital markets teams
    to translate ambiguous business problems and complex
    financial data into practical, user-friendly technical
    solutions.
  - Rapid Prototyping & Scale: Design, iterate, and deploy
    prototypes rapidly based on stakeholder feedback, while
    adhering to enterprise standards for data security,
    governance, and responsible AI usage.
  - Enablement & Documentation: Templatize and document
    solutions to enable scalable reuse across departments;
    lead walkthroughs and light enablement to drive active
    user adoption across technical and non-technical teams.

  Requirements

  - Experience: 4+ years of experience in data engineering,
    business intelligence, or software engineering with
    demonstrated hands-on experience building applied AI
    solutions, internal tools, or AI-driven automations.
  - Business Intelligence Core: Strong mastery of SQL, data
    modeling, BI tools (e.g., Tableau, PowerBI, Looker), and
    experience processing, analyzing, and structuring large
    data sets.
  - Technical & Coding Proficiency: Advanced proficiency in
    Python (or JavaScript/TypeScript) for data manipulation,
    backend scripting, and rapid software prototyping; comfort
    generating, debugging, and refactoring AI-generated code.
  - Modern AI Tooling & Frameworks: Hands-on experience with
    modern LLM APIs/ecosystems (OpenAI, Claude, Gemini),
    agentic orchestration frameworks, RAG (Retrieval-Augmented
    Generation) architectures, and enterprise AI platforms.
  - Communication & Stakeholder Management: Exceptional written
    and verbal communication skills with a proven track record
    of distilling technical and financial concepts for non-
    technical leadership and cross-functional teams.
  - Adaptability & Drive: An entrepreneurial mindset with the
    ability to manage multiple complex, fast-paced projects
    simultaneously, delivering meticulously accurate, self-
    audited work within tight deadlines.
  - Education: Bachelor’s degree in Computer Science, Data
    Science, Information Systems, Finance, Engineering, or an
    equivalent quantitative discipline required.
  - Preferred: Prior exposure to financial services, structured
    finance, fixed income, or capital markets workflows is a
    strong plus.

  The pay ranges for New York-based hires are commensurate
  with candidate experience.

  Pay ranges for candidates working in locations other than
  New York may differ based on the cost of labor in that
  location.

  Compensation Range for New York Based Hires

  $140,000—$170,000 USD

  Our Team

  Pagaya was founded in 2016 by seasoned research, finance,
  and technology entrepreneurs with our head quarters located
  in NYC and Tel Aviv.

  We move fast and smart, identifying new opportunities and
  building end-to-end solutions from AI models and unique data
  sources. Every Pagaya team member is solving new and
  exciting challenges every day in a culture based on
  partnership, collaboration, and community.

  Join a team of builders who are working every day to enable
  better outcomes for our partners and their customers.

  Our Values

  - Continuously Learn- We challenge ourselves for the sake of
    getting better as individuals, as teams, and as an
    organization to deliver for our partners.
  - Debate and Commit- We respectfully and openly debate to
    strengthen our ideas and build shared conviction - once we
    decide, we go all in, together.
  - Dream Big and Act- We boldly tackle complex problems,
    pressure-test solutions in real-time, and adapt with speed
    and energy.
  - Advance Inclusion- We create a world where everyone can win,
    designing systems that better represent people and
    generate sustainable value for our employees, partners and
    investors.
  - Be Accountable Together- We proudly own our actions and our
    results, taking initiative to ensure our work gets over
    the finish line as a team.

  More than just a job

  We believe health, happiness, and productivity go hand-in-
  hand. That's why we're continually looking to enhance the
  ways we support you with benefits programs and perks that
  allow every Pagayan to do the best work of their life.
