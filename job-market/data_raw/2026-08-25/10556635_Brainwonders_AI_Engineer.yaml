description: |
  Company Description

  BRAINWONDERS

  About Company: At Brainwonders, we are proud to be India’s
  largest career counselling and guidance company, recognized
  for our commitment to transforming students' futures. With
  1223+ educational institutes using our services, 93+
  corporate connections, and 108+ franchisees, we have built
  an expansive network of support for students, educators, and
  professionals.

  Brainwonders has earned numerous national and regional
  awards for excellence in career counselling and guidance,
  and is consistently rated as one of the highest-paying
  employers in the counselling industry by various job
  portals.

  Job Description

  As an AI Engineer, you will work closely with our AI and
  Technology team to design, develop, and implement Artificial
  Intelligence solutions for real-world applications. You will
  gain hands-on experience in AI development, Machine
  Learning, Large Language Models (LLMs), workflow automation,
  backend development, APIs, and software engineering while
  working on live industry projects.

  Key Responsibilities

  • Develop AI-powered applications and automation workflows.
  • Assist in building and integrating Large Language Model
  (LLM) solutions. • Develop and maintain backend services and
  REST APIs. • Integrate third-party APIs and automation
  platforms. • Work on Machine Learning models, prompt
  engineering, and AI integrations. • Participate in software
  testing, debugging, optimization, and deployment. •
  Collaborate with cross-functional teams on live AI projects.
  • Prepare technical documentation and maintain project
  records. • Research emerging AI technologies and recommend
  innovative solutions. • Perform additional AI and software
  development tasks assigned by the reporting manager.

  Requirements

  • Bachelor's or Master's degree (Pursuing or Completed) in
  Computer Science, Information Technology, Artificial
  Intelligence, Data Science, Software Engineering, or a
  related field. • Good knowledge of Python programming. •
  Basic understanding of Machine Learning concepts. •
  Knowledge of APIs, databases, and backend development. •
  Strong analytical and problem-solving skills. • Good
  communication and teamwork abilities. • Willingness to learn
  new technologies and work on live AI projects.

  Preferred Skills

  • Knowledge of Python. • Familiarity with FastAPI, Flask, or
  Django. • Understanding of SQL and databases. • Basic
  knowledge of Git/GitHub. • Strong logical thinking and
  debugging skills. • Positive attitude and willingness to
  learn.

  What You'll Gain

  • Hands-on experience in Artificial Intelligence, Machine
  Learning, Automation, and Software Development. • Exposure
  to live AI products and client projects. • Mentorship from
  experienced AI professionals. • International Internship
  Certificate upon successful completion of the tenure. •
  Letter of Recommendation based on performance. • ₹1,00,000/-
  (Rupees One Lakh Only) Completion Benefit upon successful
  completion of the mandatory tenure, subject to satisfactory
  performance, attendance, and compliance with Company
  policies. • Opportunity for long-term employment based on
  performance.

  Eligibility

  Bachelor's or Master's degree (Pursuing or Completed) in
  Computer Science, Information Technology, Artificial
  Intelligence, Data Science, Software Engineering, or a
  related field.

  Freshers are encouraged to apply.

  Internship Details

  Location: Mumbai (Hybrid)

  Working Days: Monday to Saturday

  Working Hours: 10:00 AM – 7:00 PM

  Duration: 6 Months

  Completion Benefit: ₹1,00,000/- (Rupees One Lakh Only)
  payable upon successful completion, subject to satisfactory
  performance and Company policies.

  Certification: International Internship Certificate upon
  successful completion.

  If you are passionate about Artificial Intelligence, solving
  real-world problems, and building innovative AI solutions,
  we'd love to hear from you.

  Internship Terms

  The engagement follows a mandatory six (6) month program.
  Upon successful completion of the tenure, eligible
  candidates will receive a Completion Benefit of ₹1,00,000/-
  (Rupees One Lakh Only) along with an International
  Internship Certificate, subject to satisfactory performance,
  attendance, and compliance with Company policies.

  Qualifications

  Bachelor's or Master's degree (Pursuing or Completed) in
  Computer Science, Information Technology, Artificial
  Intelligence, Data Science, Software Engineering, or a
  related field.

  Additional Information



  Freshers with a strong passion for Artificial Intelligence,
  Machine Learning, and Software Development are encouraged to
  apply.
