description: |
  At Broadridge, we've built a culture where the highest goal
  is to empower others to accomplish more. If you’re
  passionate about developing your career, while helping
  others along the way, come join the Broadridge team.

  Requirements / Qualifications:

  - Education: Bachelor’s or Master’s degree in Computer
    Science, Data Science, Artificial Intelligence, or a
    related field.
  - Experience: 5+ years of overall IT experience, with at least
    3+ years of hands-on experience in AI/ML, Generative AI,
    or LLM-based solution development.
  - Programming: Strong proficiency in Python; knowledge of Java
    or similar technologies is an added advantage.

  Generative AI Skills:

  - Strong understanding of Large Language Models (LLMs) and
    prompt engineering.
  - Experience in designing and optimizing RAG (Retrieval-
    Augmented Generation) pipelines.
  - Hands-on experience with Vector Databases such as Pinecone,
    Weaviate, FAISS, or Milvus.
  - Familiarity with agentic frameworks and orchestration tools
    such as LangChain, LangGraph, LlamaIndex, etc.
  - Expertise in chunking strategies and embeddings optimization
    for knowledge-driven applications.
  - Experience in chatbot development, conversational AI, and
    enterprise Q&A assistants.
  - Exposure to Text-to-SQL models and natural language querying
    across structured and unstructured data.
  - Experience in PDF/document extraction pipelines and advanced
    context retrieval techniques.
  - Knowledge of advanced RAG approaches such as query
    rewriting, multi-vector retrieval, and reranking.

  Web / UI Basics:

  - Basic knowledge of HTML, CSS, or React components for simple
    UI integration with GenAI applications.

  We are dedicated to fostering a collaborative, engaging, and
  inclusive environment and are committed to providing a
  workplace that empowers associates to be authentic and bring
  their best to work. We believe that associates do their best
  when they feel safe, understood, and valued, and we work
  diligently and collaboratively to ensure Broadridge is a
  company—and ultimately a community—that recognizes and
  celebrates everyone’s unique perspective.

  Use of AI in Hiring

  As part of the recruiting process, Broadridge may use
  technology, including artificial intelligence (AI)-based
  tools, to help review and evaluate applications. These tools
  are used only to support our recruiters and hiring managers,
  and all employment decisions include human review to ensure
  fairness, accuracy, and compliance with applicable laws.
  Please note that honesty and transparency are critical to
  our hiring process. Any attempt to falsify, misrepresent, or
  disguise information in an application, resume, assessment,
  or interview will result in disqualification from
  consideration.
