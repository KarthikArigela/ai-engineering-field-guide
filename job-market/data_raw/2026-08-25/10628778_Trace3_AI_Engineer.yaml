  JOB SUMMARY:

  The AI Engineer is responsible for designing, building, and
  deploying AI-powered applications, agents, and automation
  solutions across the organization. This role is central to
  Trace3’s internal AI strategy and will focus heavily on
  building AI agents and copilots that directly impact
  productivity across executive leadership, Sales, Operations,
  Legal, and IT. While initial priorities focus on internal AI
  agents and copilots, this role will expand to support a
  broader range of AI use cases, including workflow
  automation, integrations, and scalable AI-driven solutions.
  This role emphasizes end-to-end engineering of AI
  solutions—translating business needs into production-ready
  systems using modern AI frameworks and cloud platforms
  (primarily Azure).

  SUMMARY OF ESSENTIAL JOB FUNCTIONS:

  AI Application & Agent Development

  - Design and build AI-powered applications, including agents,
    copilots, and intelligent workflows.
  - Develop solutions using LLMs, RAG architectures, and
    orchestration frameworks.
  - Build reusable components and scalable AI patterns.
  - Design agent behavior that adapts to user‑defined
    preferences, rules, and governance constraints.

  Integration & Automation

  - Integrate AI solutions with enterprise platforms (NetSuite,
    ServiceNow, Microsoft 365, etc.)
  - Develop APIs, connectors, and event-driven workflows.
  - Embed AI capabilities into business processes to drive
    automation and efficiency.

  Governance, Security & Responsible AI

  - Ensure AI agents and applications comply with Trace3
    governance, security, and data protection standards.
  - Design systems that prevent sensitive or restricted data
    from being exposed or misused.
  - Partner with AI leadership to evaluate risks, controls, and
    guardrails for new AI capabilities before deployment.
  - Balance speed of delivery with safe, responsible AI
    practices in an enterprise environment.

  Prompting, Evaluation & Optimization

  - Design and refine prompts for consistency, accuracy, and
    reliability.
  - Evaluate outputs and improve performance through iteration
    and testing.
  - Implement guardrails, observability, and responsible AI
    practices.

  Cloud Engineering & Deployment

  - Build and deploy solutions in Azure (preferred) or other
    cloud environments.
  - Ensure scalability, performance, and cost optimization.
  - Monitor, troubleshoot, and maintain production AI systems.

  Collaboration & Innovation

  - Partner with AI leadership on roadmap execution and
    prioritization.
  - Work with business stakeholders to translate requirements
    into solutions.
  - Contribute to AI standards, reusable frameworks, and best
    practices.

  REQUIRED SKILLS AND EXPERIENCE:

  - Bachelor’s degree in Engineering, Computer Science, or
    related field (or equivalent experience) required.
  - Minimum 4 years of experience building AI-powered
    applications or systems.
  - Strong programming skills (Python preferred).
  - Experience with APIs, microservices, and system
    integrations.
  - Understanding of LLMs, prompt engineering, and RAG concepts.
  - Experience with cloud platforms (Azure preferred, AWS/GCP
    acceptable).
  - Experience with Azure OpenAI, Semantic Kernel, LangChain, or
    similar frameworks.
  - Experience building AI agents, copilots, or automation
    solutions.
  - Familiarity with vector databases, embeddings, and search
    architectures.
  - Experience integrating with enterprise SaaS platforms.
  - Understanding of security, governance, and responsible AI
    practices.
  - Strong problem-solving and analytical skills with attention
    to detail.
  - Ability to collaborate effectively within teams and
    communicate technical concepts clearly.
  - Ability to operate independently, with minimal supervision.
  - Comfortable managing multiple and changing priorities, and
    meeting deadlines in an entrepreneurial environment.
  - Self-motivated with a strong desire to learn and grow in
    technical expertise.

