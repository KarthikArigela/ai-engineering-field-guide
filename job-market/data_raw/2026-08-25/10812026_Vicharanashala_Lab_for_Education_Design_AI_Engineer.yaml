description: |
  This is a remote position.

  About us :

  ANNAM.AI is a transformative initiative established as a
  Center of Excellence (CoE) under the Ministry of Education
  at the prestigious Indian Institute of Technology (IIT)
  Ropar. Dedicated to revolutionizing India's agricultural
  landscape, ANNAM.AI integrates cutting-edge Artificial
  Intelligence (AI) technologies into sustainable and scalable
  farming practices.

  The name “Annam” signifies nourishment and the sustenance of
  life, embodying our mission to ensure food security while
  advancing eco-friendly and efficient agricultural solutions
  through AI innovation.








   Job Summary:


  We are seeking a skilled AI Engineer / AI Developer to
  design, develop, and deploy AI-driven solutions that enhance
  research and development. The ideal candidate has a strong
  foundation in machine learning, deep learning, data
  engineering, and software development.

   Key Responsibilities:


  - Design and implement machine learning models and AI
    algorithms.
  - Use Large Language Models (LLMs) to generate, validate, and
    optimize challenge datasets for testing AI robustness.
  - Work with large datasets to train and evaluate models.
  - Collaborate with data scientists, software engineers, and
    product teams.
  - Integrate AI models into production-grade systems or APIs.
  - Conduct research to improve current algorithms and
    processes.
  - Monitor model performance and update models as needed.
  - Maintain documentation and codebase for reproducibility and
    scalability.






  Requirements

   Required Skills & Qualifications:


  - Bachelor's or Master’s degree in Computer Science, AI, Data
    Science, or related field.
  - Proficiency in Python (preferred), with experience in ML/DL
    libraries like TensorFlow, PyTorch, Scikit-learn.
  - Understanding of data structures, algorithms, and software
    design.
  - Experience with cloud platforms (AWS, GCP, Azure) and
    deployment pipelines.
  - Familiarity with NLP, computer vision, or recommendation
    systems is a plus.
  - Good communication and problem-solving skills.








  Benefits



   Work Location: Remote [Work From Home]









   Work Hours: 9:00 AM – 6:00 PM IST









   Salary Compensation: ₹8–12 LPA (Based on experience and
  skillset)
