description: |
  WHO WE ARE

  At Acclaro, we're more than a localization company. We're a
  global team of language enthusiasts, cultural connectors,
  and technology innovators. Our mission is to help brands
  speak the world’s languages and resonate deeply across
  cultures by blending human expertise with cutting-edge
  technology.

  With over two decades of experience and our proprietary
  platform, we support some of the world’s most recognizable
  brands in expanding their global reach. Join us on our
  journey to be the model localization company of the next
  decade, one that’s loved by clients, colleagues, and
  communities alike.

  YOUR NEXT ROLE

  As an AI & NLT Solutions Engineer, you’ll help lead the
  development, implementation, and optimization of machine
  translation and AI technologies that power our localization
  workflows. You'll combine language and tech expertise to
  enhance quality, boost productivity, and drive efficiencies
  across teams. In this highly collaborative role, you'll be
  part of the Solutions & Onboarding team, supporting internal
  stakeholders and clients with cutting-edge strategies that
  evolve how we deliver language at scale.

  WHAT YOU’LL DO

  - Drive MT and AI adoption, present recommendations, and
    support cross-team initiatives

  - Lead strategic implementation of AI and MT tools that
    enhance workflows and boost adoption

  - Build and deploy machine learning and NLP models to uncover
    insights and streamline processes

  - Fine-tune MT engines for domain-specific content and
    multilingual markets

  - Partner with Engineering and Production to optimize file
    prep and pre-translation workflows

  - Provide expert guidance to internal teams and clients on AI
    and MT solutions

  - Evaluate client requests, compare MT engines, and recommend
    the best-fit technologies

  - Test and benchmark LLMs, AI tools, and MT engines for
    accuracy and impact

  - Design scalable, cost-efficient processes to evaluate MT
    output quality

  - Use post-editing data to continuously improve MT performance
    with smart tech choices

  - Create clear, usable documentation and training for
    linguists and project teams

  - Stay on the cutting edge—monitor trends and assess emerging
    AI and localization tools

  THIS ROLE IS FOR YOU IF YOU

  - Bring 5+ years of experience in the localization or
    technology space, including 1–3 years focused on machine
    translation, AI, or NLP

  - Hold a bachelor’s degree or equivalent professional or
    military experience

  - Navigate localization workflows, language assets, and
    content adaptation like a pro

  - Think critically and solve complex MT challenges with ease

  - Know your way around Python and libraries like TensorFlow,
    PyTorch, Hugging Face, spaCy, and NLTK

  - Work independently, prioritize like a champ, and own your
    responsibilities

  - Communicate clearly, collaborate confidently, and thrive in
    cross-functional teams

  - Are fluent in English and excited to engage with global
    audiences

  YOU’LL STAND OUT IF YOU

  - Are familiar with multiple language pairs and domain-
    specific vocabulary

  - Bring added fluency in additional languages

  WHY JOIN ACCLARO?

  - Global Team, Local Impact: Collaborate with colleagues
    around the world while making meaningful contributions
    locally.

  - People-First Culture: Work in a supportive, inclusive
    environment that values your voice and well-being.

  - Flexible Work Style: Enjoy remote work, flexible PTO, and a
    healthy work-life balance.

  - Career Growth: Access mentorship, development programs, and
    clear pathways for advancement.

  - Impactful Work: Help top-tier brands succeed globally while
    promoting cultural understanding and connection.

  - Competitive Compensation & Benefits: Market-leading pay,
    bonuses, and comprehensive medical and retirement plans.

  - Recognition & Support: Be seen and celebrated through
    regular recognition programs and supportive leadership.

  VALUES WE LIVE BY

  - Passion with a Purpose – We’re energized by our work and why
    it matters.

  - Go the Extra Mile – We strive for excellence and proactive
    value.

  - Honesty in Action – We act with integrity, openness, and
    respect.

  - Own It, Do It – We follow through, take accountability, and
    take pride in our outcomes.

  INCLUSION & EQUAL OPPORTUNITY - Acclaro is proud to be an
  Equal Opportunity Employer. We celebrate diversity and are
  committed to creating an inclusive environment for all
  employees. All employment decisions are made based on
  qualifications, merit, and business needs.
