description: |
  Raisin is the world’s leading platform for savings and
  investment products. Founded in 2012, the FinTech connects
  consumers with banks in the EU, the UK and the US. This
  gives consumers better interest rates and banks a
  diversified form of refinancing. Our vision is to offer
  savings and investments without barriers and thus open up
  the global 160 trillion euro market.

  Raisin currently employs more than 800 people from over 75
  countries worldwide. Today, the platform holds over 80
  billion euros in assets from more than one million investors
  which have accrued over 5 billion euros in returns.

  Team

  The AI Enablement team supports the adoption of AI
  capabilities across Raisin’s products and internal systems.

  The team focuses on establishing a consistent and reliable
  approach to using AI in production by providing shared
  foundations, guidance, and reusable solutions. This includes
  working with engineering teams to integrate AI into existing
  systems, ensuring solutions are scalable, maintainable, and
  aligned with security and regulatory requirements.

  The scope ranges from improving internal workflows to
  enabling new product capabilities, depending on where AI can
  deliver measurable value.

  Your Responsibilities

  As an AI Engineer, you will help shape how AI is applied
  across the organization by combining hands-on engineering
  with enablement and guidance.

  Enable teams to adopt AI effectively

  - Work with product and engineering teams to identify and
    refine AI use cases
  - Support teams in integrating AI capabilities into their
    systems and workflows by providing clear guidance on
    patterns, trade-offs, and practical implementation
    approaches
  - Promote consistent and reusable solutions to reduce
    fragmentation across teams

  Contribute to shared capabilities where needed

  - Develop or extend shared components, integrations, or
    services when required to unblock teams
  - Define and implement patterns for integrating LLM
    capabilities into the platform
  - Contribute to shared components or lightweight services that
    simplify access to AI capabilities across teams
  - Manage AI costs and budget usage when providing shared model
    access and services to other teams.
  - Support teams in developing retrieval-based approaches that
    make internal knowledge accessible to AI-driven use cases

  Guide technical decisions

  - Evaluate tools, platforms, and approaches with consideration
    for scalability, security, and maintainability
  - Help teams choose appropriate solutions based on context
    rather than applying AI by default
  - Contribute to establishing a pragmatic and consistent
    approach to AI usage

  Ensure robustness and responsible usage

  - Optimize AI system efficiency by making principled model
    selections based on cost-performance trade-offs, inference
    latency, and token usage optimization
  - Support the implementation of safeguards such as access
    controls, validation, and monitoring
  - Collaborate with Security, Legal, and other stakeholders on
    requirements related to AI usage
  - Contribute to practices that ensure solutions are reliable
    and aligned with internal standards

  Your ProfileBackground

  - Strong experience as a Software Engineer (5+ years), with
    focus on backend or platform development
  - Strong generalist mindset, comfortable working across
    technical domains
  - Experience working on production systems and collaborating
    across teams
  - Comfortable operating in environments with evolving scope
    and priorities

  Technical Skills

  - Proficiency in at least one programming language (Python
    preferred; JVM languages also relevant)
  - Experience with cloud environments (AWS preferred)
  - Solid understanding of APIs, system integration, and
    distributed systems

  AI Experience

  - Practical experience working with AI tools or platforms
    (e.g. LLM APIs or similar technologies)
  - Familiarity with concepts such as prompt design, context
    engineering, retrieval-based approaches, or AI-driven
    workflows
  - Ability to assess where AI adds value and where it does not

  Join our mission, join our team – and grow with us!

  At Raisin, we care about each other and it is one of our top
  priorities to foster an open and caring environment in which
  everyone feels welcome and comfortable. Our culture is
  strongly driven by our ambitious team, which connects more
  than 75 different nationalities.

  As part of our team, you will benefit from:

  - Employee Development Budget of €2,000 and four full training
    days per year.
  - Flexible working hours, home office and 30 vacation days.
  - A company pension scheme (Betriebliche Altersvorsorge),
    which we support with 20%.
  - Enjoy more than 50+ different sports with Urban Sports Club:
    We subsidize your membership with more than €20 per month.
  - Do you miss being in the office? The Deutschland Ticket gets
    you there, which we subsidize with €25 per month.
  - Love cycling? With JobRad, lease the bike of your choice and
    enjoy tax savings, plus Raisin covers your monthly
    insurance costs.
  - Hungry all the time? Snacks, daily fresh fruit as well as
    drinks provided at the office.
  - You are moving from another country or city to join us? We
    may support your relocation.

  Raisin Applicant Privacy Policy

  We value diversity and the unique experiences each
  individual brings. If you’re excited about this role but
  don’t meet every requirement, we still encourage you to
  apply.

  We are an equal opportunity employer and are committed to
  creating an inclusive environment for everyone, regardless
  of race, colour, ancestry, religion, sex, national origin,
  sexual orientation, age, citizenship, marital status,
  disability, or gender identity.
