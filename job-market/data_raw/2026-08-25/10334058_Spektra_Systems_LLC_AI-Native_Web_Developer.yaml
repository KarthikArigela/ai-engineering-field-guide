  What we’re looking for


  - AI fluency. You’ve shipped real production work with Claude
    Code, Cursor, or similar. You know which model to reach
    for, when to start fresh vs. continue a session, when to
    spawn a sub-agent, and how to give an agent the context it
    actually needs (paths, line numbers, prior-art file
    references — not vibes).
  - Design taste.  You know that monochromatic isn’t always bad
    and that color variety isn’t always good. You don’t
    confuse “looks like a generic SaaS template”with
    “shipped.”
  - Multi-brand judgment. You can hold five distinct voices in
    your head and switch fluently between them. You don’t
    homogenize everything to the same template.
  - Frontend chops. Astro, Next, React, Tailwind v4, modern
    build tooling, OKLCH color, dark/light theming. You read
    code fluently even when you didn’t type it. You know git.
  - SEO depth. You know what a canonical loop is and why it
    hurts. You know when a 301 is right and when it isn’t.
    You’ve broken SEO  and recovered from it
  - Bias to ship. You’d rather merge an iteration today than
    perfect tomorrow.
  - Comfortable with brutal feedback loops. Most of what you
    build will get critiqued and reworked. You don’t take it
    personally; you take it as signal.

  What we don’t care about


  - Years of experience. Show us output.
  - Whether you “can also code without AI.” Obviously you can.
    That’s not the point.

  How to apply


   Send links to two or three marketing sites, landing pages,
  or component libraries you’ve shipped — ideally ones an AI
  agent helped you build.




   In three sentences, tell us:




  - What you did vs. what the agent did.
  - The single dumbest thing the agent tried to ship that you
    caught.
  - What you’d do differently next time.
