description: |
  The Opportunity As an AI Engineer - Senior Associate -
  Commercial Technology & Innovation, you will leverage
  advanced technologies and techniques to design and develop
  robust data solutions for clients. Within our Advisory
  practice, you will transform raw data into actionable
  insights, enabling informed decision-making and driving
  business growth. As a Senior Associate, you will focus on
  building meaningful client connections and learning how to
  manage and inspire others. You will navigate increasingly
  complex situations, growing your personal brand and
  deepening your technical skills. You are expected to
  anticipate the needs of your teams and clients, and to
  deliver quality work. Embracing increased ambiguity, you
  will be comfortable when the path forward isn't clear,
  asking questions and using these moments as opportunities to
  grow. In this role, you will apply data, algorithms, and
  software engineering to build and deploy software and
  platform systems that create Artificial Intelligence and
  Machine Learning-based solutions at scale. Your work will
  involve designing AI systems, data wrangling, and software
  implementation to enable the AI models to be useful and
  scalable. This is an opportunity to be part of a dynamic
  team that is at the forefront of innovation, driving
  business growth through cutting-edge technology solutions.
  Responsibilities
  - Designing and implementing AI systems to transform raw data
    into actionable insights
  - Developing scalable machine learning models using Python and
    TensorFlow
  - Integrating data from various sources to enhance data
    quality and infrastructure
  - Conducting complex data analysis to support informed
    decision-making
  - Building and deploying AI and machine learning solutions at
    scale
  - Collaborating with clients to understand their needs and
    deliver tailored AI solutions
  - Utilizing programming languages such as C++ and Java for
    software development
  - Applying natural language processing techniques for text
    analytics and sentiment analysis
  - Managing data pipelines and confirming data integrity within
    analytics frameworks
  - Mentoring junior team members and guiding them in AI and
    data engineering tasks
  What You Must Have
  - At least a Bachelor's degree
  - At least 3 years of experience
  What Sets You Apart
  - Preference for at least one of the following fields of
    study: Analytics/Data Science, Artificial
    Intelligence/Robotics, Computer Science/Information
    Systems, Engineering
  - At least one of the following: Certifications aligned to
    data engineering, machine learning, and cloud platforms,
    including AWS, Google Cloud, Microsoft Azure, Databricks,
    Snowflake, or related data and AI credentials
  - Demonstrating proficiency in AI implementation and machine
    learning libraries
  - Utilizing Python and C++ for complex data analysis and
    modeling
  - Excelling in developing and managing data pipelines and
    infrastructure
  - Applying natural language processing techniques for text
    analytics
  - Leveraging TensorFlow and Scikit-Learn for deep learning
    projects
  The salary range for this position is: $77,000 - $202,000.
