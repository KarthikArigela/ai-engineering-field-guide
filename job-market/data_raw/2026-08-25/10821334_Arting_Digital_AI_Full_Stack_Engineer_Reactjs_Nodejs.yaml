  Position: AI Full Stack Engineer (React.js + Node.js)
  Experience: 3+ Years Location: Baner, Pune (Work from
  Office) Employment Type: Full-time Job Summary

  We are looking for an AI Full Stack Engineer with expertise
  in React.js and Node.js to build scalable, AI-powered web
  applications. The ideal candidate should have experience
  integrating LLMs, developing REST APIs, and delivering
  responsive user interfaces.

  Key Responsibilities

  - Develop responsive web applications using React.js.
  - Build scalable backend services and REST APIs using Node.js
    & Express.js.
  - Integrate AI/LLM platforms (OpenAI, Azure OpenAI, Gemini,
    Claude, etc.).
  - Implement AI features such as chatbots, RAG, document
    analysis, semantic search, and automation.
  - Develop secure authentication (JWT/OAuth) and optimize
    databases (MongoDB/PostgreSQL/MySQL).
  - Integrate third-party APIs and cloud services.
  - Collaborate with cross-functional teams, write clean code,
    and participate in Agile development.

  Required Skills

  - Frontend: React.js, JavaScript (ES6+), TypeScript, HTML/CSS,
    Tailwind CSS/Material UI/Bootstrap, Redux/Context API
  - Backend: Node.js, Express.js, REST APIs, JWT/OAuth,
    WebSockets (preferred)
  - AI: LLM integration, LangChain/LangGraph, RAG, Vector
    Databases (Pinecone, ChromaDB, FAISS), AI Agents
    (preferred)
  - Database: MongoDB, PostgreSQL/MySQL
  - Tools: Git, Docker, CI/CD, AWS/Azure/GCP (preferred)

  Preferred Qualifications

  - Bachelor's/Master's in Computer Science, IT, or related
    field.
  - Experience with AI-powered enterprise applications and
    scalable architectures.
  - Python knowledge for AI/ML integration is a plus.
  - Strong problem-solving and communication skills
