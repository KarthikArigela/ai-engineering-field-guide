description: |
  At Epiq, your work contributes to complex, global legal
  outcomes. You’ll join a values‑driven community where
  integrity guides decisions, relentless service sets the bar,
  and we thrive on big challenges together. We invest in your
  growth with enterprise‑wide learning and mobility. We
  celebrate who you are, and we respect life beyond work with
  flexibility that’s recognized externally. Enabled by modern
  platforms and AI, you’ll do the most meaningful work of your
  career and see your impact at scale.

  Job Description:

  Summary

  We are seeking a highly skilled AI/ML Engineer with good
  knowledge on AI/ML Implementation, Data and Software
  Development for our company's machine learning operations.

  As an AI/ML Consultant, you will work closely with business
  stake holders, clients, data scientists, software engineers,
  QA engineers, DevOps engineers. You will also be responsible
  for implementing and maintaining complex data and AI/ML
  Solutions for our clients.

  Job Responsibilities:

  - Participate in discussion and analyzing client’s data and
    its complexity. Every client’s data consistency may vary.
    Not only you should understand the data, but also provide
    solutions in that can fit in our product and solution
    offering.
  - Conducting ad-hoc analysis to answer specific business
    questions.
  - Collecting and organizing large sets of data from various
    sources.
  - Cleaning and preprocessing data to ensure accuracy and
    consistency.
  - Machine Learning Algorithms: Knowledge of advanced machine
    learning algorithms and their implementation.
  - Must have exposure to software programming, integration, and
    implementation experience.
  - Identify and evaluate new technologies to improve
    performance, maintainability, and reliability of existing
    machine learning systems.
  - Analyzing data to identify patterns, trends, and insights.
  - Developing and maintaining dashboards and other tools to
    monitor key performance indicators.
  - Proficiency in working with deep learning frameworks like
    TensorFlow, PyTorch, scikit-learn, etc.
  - Collaborating with other data engineers and data scientists
    to ensure data quality and accuracy.
  - Design, implement, and maintain the data infrastructure and
    pipelines for machine learning operations.
  - Communicating insights and recommendations to stakeholders
    in a clear and concise manner.
  - Stay up to date with the latest advancements in data
    engineering and machine learning and recommend new tools
    and techniques to improve our operations.

  Requirements / Skills :

  - Bachelors / master’s degree in information or computer
    science required – B.Tech, MCA, MS Computers.
  - 5+ years of experience in AI/ML implementation, Data and
    Software development area
  - Experience with cloud-based infrastructure such as Microsoft
    Azure, AWS.
  - Proficiency in Python
  - Handson end-to-end development onGen AI, Agentic AI, NLP,
    FastAPI, LangChain, HuggingFace, RAGAS, PySpark, ETL, OCR.
  - Must have exposure to software programming, integration, and
    implementation experience.
  - Experience with some NLP libraries
  - Cloud & DevOps - Azure & AWS, AppInsight, Databricks,
    Docker,
  - Knowledge of machine learning algorithms and their
    implementation.
  - Implementation with visualization tools such as PBI or
    similar.
  - Familiarity with Metadata Management tools
  - Experience working with LLMs
  - Proficiency in integrating APIs.
  - Strong analytical and problem-solving skills
  - All-round communication skills and ability to work
    collaboratively.
  - Good to have: Knowledge of Power BI
  - Familiarity with data science concepts, machine learning
    algorithms, and frameworks like TensorFlow, PyTorch,
    scikit-learn, Keras, Pandas, etc.
  - Added advantage – Knowledge on data technologies such Data
    wrangling, Data Integration/ETL, Data Profiling & Data
    Quality, Data Discovery
  - Clear understanding of Data Engineering, Machine Learning
    and AI Models, LLMs

  Competencies

  Integrity – Behaves in an honest, fair, and ethical manner;
  shows consistency in words and actions; does what she/he
  commits to doing; respects the confidentiality of
  information or concerns shared by others; is honest and
  forthright with people; carries his/her fair share of the
  workload; takes responsibility for own mistakes.

  Client Focus – Takes action with the clients, both internal
  and external, and sees their needs as a primary focus;
  builds a sustaining collaborative and productive
  relationship with clients; seeks to understand client
  situations, issues, expectations, etc.; takes appropriate
  action to meet client needs and address concerns; implements
  or utilizes methods to monitor and evaluate client feedback.

  Results-Driven – Sets stretch goals for personal and team
  accomplishment and works tenaciously to achieve those goals;
  acts with a sense of urgency; takes the initiative on
  actions; identifies what needs to be done and takes action
  before being asked; does more than what is normally required
  in a situation; establishes metrics to monitor progress and
  measure success; maintains focus by avoiding or overcoming
  roadblocks.

  Entrepreneurial Orientation – Proposes innovative business
  opportunities/ideas to customers and business partners;
  encourages and supports entrepreneurial behavior in others;
  demonstrates willingness to take calculated risks to achieve
  business goals.

  Decisiveness – Makes well-informed, effective, and timely
  decisions even when data is limited, or solutions produce
  unpleasant consequences; perceives the impact and
  implications of decisions; can make tough decisions.

