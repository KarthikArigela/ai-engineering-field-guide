  AI Builder Responsibilities:

  - Use approved GenAI tools, including Copilot or equivalent
    enterprise-authorized tools, to accelerate ideation, code
    generation, test generation, documentation, debugging, and
    productivity improvements
  - Apply AI-assisted development techniques responsibly to
    improve code clarity, maintainability, testability, and
    engineering flow while validating outputs before use
  - Develop scripts, utilities, workflow automations, and
