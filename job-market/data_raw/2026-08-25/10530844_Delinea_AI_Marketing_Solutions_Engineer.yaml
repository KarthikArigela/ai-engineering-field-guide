description: |
  About Delinea: Delinea is a pioneer in securing human and
  machine identities through intelligent, centralized
  authorization, empowering organizations to seamlessly govern
  their interactions across the modern enterprise. Leveraging
  AI-powered intelligence, Delinea’s leading cloud-native
  Identity Security Platform applies context throughout the
  entire identity lifecycle – across cloud and traditional
  infrastructure, data, SaaS applications, and AI. It is the
  only platform that enables you to discover all identities –
  including workforce, IT administrator, developers, and
  machines – assign appropriate access levels, detect
  irregularities, and respond to threats in real-time. With
  deployment in weeks, not months, 90% fewer resources to
  manage than the nearest competitor, and a 99.995% uptime,
  Delinea delivers robust security and operational efficiency
  without compromise. Learn more about Delinea on Delinea.com,
  LinkedIn, X, and YouTube.

  Join our passionate, global team at Delinea and help us make
  the world a safer and more secure place. Our success is
  driven by world-class product leadership, outstanding
  engineers, and strategic investment from TPG. We value
  diversity, innovation, and a culture of respect and
  fairness. If you're ready to push boundaries and challenge
  the status quo in security, we want to hear from you.


  Apply today to help us achieve our mission.

  Position Summary:

  The AI Marketing Solutions Engineer is responsible for
  executing AI-powered marketing programs that improve
  productivity, accelerate campaign delivery, and enhance
  customer engagement across the marketing organization.
  Working closely with demand generation, content, digital,
  solution marketing, operations, and creative teams, this
  role identifies opportunities to apply AI across marketing
  workflows and turns them into scalable, repeatable
  processes.

  The role combines marketing execution with hands-on AI
  expertise, including prompt engineering, workflow design, AI
  content creation, automation, and optimization. The AI
  Marketing Solutions Engineer will write and refine prompts
  for large language models (LLMs), develop reusable prompt
  libraries, test emerging AI tools, and embed AI into day-to-
  day marketing operations to improve quality, speed, and
  performance.

  Success in this role requires a blend of strategic thinking
  and practical execution, with a focus on driving measurable
  business outcomes while ensuring AI is used responsibly,
  consistently, and effectively across the marketing team.

  What You'll Do:

  - Design and build custom Marketing AI skills, workflows and
    agents that help automate marketing tasks, campaign
    development, draft content production and refinement,
    research, and reporting.
  - Build and execute skills and workflows to automate system
    processes and tasks within integrated marketing campaigns,
    with human-in-the-loop input/guardrails across systems and
    channels, from concept through launch and results.
  - Package skills within projects and automated workflows to
    help streamline and compound growth and use.
  - Partner with Demand Generation, Content, Solutions
    Marketing, Brand, Creative, and Marketing Operations to
    embed AI into marketing programs and day-to-day workflows.
  - Prototype and pilot AI tools, skills, and agents across
    platforms, including Claude, ChatGPT, custom GPTs and
    automation platforms, and recommend what scales.
  - Evaluate emerging AI tools and technologies, lead pilot
    programs, and recommend solutions that deliver measurable
    business value.
  - Explore, create, and help connect AI-powered systems your
    teammates can use without needing to be AI experts
    themselves.
  - Train, coach, and support marketing teams on prompt
    engineering, AI workflows, and responsible AI practices to
    drive adoption across the organization.
  - Measure and report on the impact of AI initiatives,
    including productivity gains, campaign performance,
    content velocity, adoption, and marketing effectiveness.
  - Maintain documentation and mapping of AI Marketing skills,
    systems, projects, and workflows in addition to changes in
    standard operating procedures for marketing’s AI use and
    development.
  - Help establish governance, quality standards, and processes
    to ensure AI-generated outputs are accurate, compliant,
    secure, and aligned with Delinea's brand and marketing
    standards.

  What You Bring:

  - 5+ years of marketing experience across campaigns, content
    or product marketing.
  - Demonstrated hands-on AI experience. You’ve used AI tools to
    build something, whether that’s a skill, an automation or
    a workflow, and you can show your work.
  - Some form of AI training, whether formal coursework,
    certifications or serious selfdirected learning.
  - A systems mindset. You see the process behind the output and
    look for ways to make it repeatable and scalable.
  - Comfort moving between strategy and execution, paving new
    ways between unknown and known, in the same day.
  - Strong writing and communication skills. You can explain a
    technical workflow to a non-technical stakeholder.
  - Experience with marketing automation and AI and data &
    intent signal tools, Make, HubSpot, Salesforce, Zapier,
    Anthropic (Claude), PowerBI, 6sense, DemandBase.
  - Background in cybersecurity, SaaS or B2B technology
    marketing.
  - A portfolio or recorded examples of AI skills, agents or
    automations you’ve built.

  You’re a Great Fit If:

  - You’re curious by default and treat every new AI tool as
    something to test, not fear.
  - You’re a self-starter who doesn’t wait for a playbook that
    doesn’t fully exist yet and you get things done.
  - You collaborate well and know the best systems get built
    with input from the people using them.
  - You hold yourself to a high bar for detail while keeping the
    bigger picture in view. You’re an independent thinker, who
    can evaluate and
  - You act with integrity, respect security governance
    processes, especially when the tools you’re using are new
    enough that the guardrails are still being built.
  - You’re comfortable in a fast-moving environment where the
    org, tools and workflows keep evolving.
  - You’re ready for a career and skill-building adventure.

  Why work at Delinea?

  - We're passionate problem-solvers helping the world's largest
    organizations protect what matters most: their human and
    machine identities.

  - We invest in people who are smart, self-motivated, and
    collaborative.

  - What we offer in return is meaningful work, a culture of
    innovation and great career progression.

  At Delinea, our core values are STRONG and guide our
  behaviors and success:

  - Spirited - We bring energy and passion to everything we do

  - Trust - We act with integrity and deliver on our commitments

  - Respect - We listen, value different perspectives, and work
    as one team

  - Ownership - We take initiative and follow through

  - Nimble - We adapt quickly in a fast-changing environment

  - Global - We embrace diverse people and ideas to drive better
    outcomes

  We believe weaving these core values into our day-to-day
  actions, and our process for hiring, evaluating, and
  promoting employees, helps us cultivate a work environment
  that embraces collaboration and camaraderie.

  We take care of our employees. We offer competitive
  salaries, a meaningful bonus program, and excellent
  benefits, including healthcare insurance, as well as
  pension/retirement matching, comprehensive life insurance,
  an employee assistance program, time off plans, and paid
  company holidays.

  Delinea is an Equal Opportunity and Affirmative Action
  employer and prohibits discrimination and harassment of any
  type with regard to race, color, religion, age, sex,
  national origin, disability status, genetics, protected
  veteran status, sexual orientation, gender identity or
  expression, or any other characteristic protected by
  federal, state or local laws.

  Upon conditional offer of employment, candidates are
  required to complete comprehensive criminal background
  check, verification of education, and verification of
  employment, per employment policy. In addition, all publicly
  posted social media sites may be reviewed.
