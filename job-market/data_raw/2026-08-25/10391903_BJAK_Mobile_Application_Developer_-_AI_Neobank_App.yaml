description: |
  About KIRA

  Our mission is to make money smart, reliable and within
  reach for everyone. In 2019, we built the first mobile-
  first, insurance platform, enabling insurance to be
  accessible online by millions in the region.

  Today, it's the leading insurance platform in Southeast
  Asia. Today, we are expanding ways to help people in Asia
  and it includes spending, saving, investing, exchanging,
  travelling, and more. Our objective is to build tools that
  will help people get more from their money and at ease and
  self reliance, become an expert. We believe AI will help us
  achieve this in our generation.

  We are looking for the most talented and driven people we
  can find. We are looking for people who work for their
  passion, not counting hours. Who loves building great next-
  generation products, not status quo. Who cares about
  redefining how everyone around us can get the best financial
  applications, not for an exclusive few.

  We have teams working around the world, with over 20
  nationalities and growing from our offices and remotely.
  Join us and build a better future



  The Role

  We are looking for Android engineers to build the native
  Android experience for KIRA's AI Neobank App. This role is
  for someone who cares about clean user flows, fast
  performance, product quality and shipping reliable mobile
  features used by real customers.



  What You'll Own

  - Build and ship Android features using Kotlin.
  - Create clean mobile flows for insurance, payments, claims,
    renewals and financial services.
  - Work with product and design to simplify complex user
    journeys.
  - Integrate backend APIs and ensure mobile flows are stable,
    secure and reliable.
  - Improve app performance, crash rate, loading states,
    responsiveness and memory usage.
  - Use analytics, user behaviour and production issues to
    improve the product.
  - Build AI-assisted mobile experiences only where they
    genuinely improve the user journey.



  What We're Looking For

  - 3+ years of Android development experience using Kotlin.
  - Strong Android fundamentals and experience shipping
    production apps.
  - Good knowledge of Jetpack, Coroutines, Flow and modern
    Android architecture.
  - Strong sense of mobile UX, usability, edge cases and user
    flows.
  - Experience integrating REST APIs and debugging production
    issues.
  - Fast execution, high ownership and strong attention to
    product quality.
  - App links, GitHub, screenshots or examples of shipped work
    are a strong advantage.



  Tech Stack

  - Kotlin
  - Jetpack Compose
  - Android SDK
  - Coroutines & Flow
  - SQL / NoSQL
  - TensorFlow Lite (on-device inference)



  The Kind of Builder We Want

  - Thinks in user journeys, not just screens.
  - Cares about making complex financial products feel simple.
  - Moves fast without creating messy code.
  - Notices UX, performance and reliability issues before users
    complain.
  - Honest about what they personally built, what was team-owned
    and what impact they can or cannot claim.



  This Role Is Not For

  - Engineers who only want fully defined tickets.
  - Developers who build screens without caring about user
    experience.
  - People who ignore crashes, edge cases, loading states or
    performance.
  - Engineers who move slowly in a startup environment.
  - People who exaggerate impact without explaining their actual
    contribution.



  Location

  This role is remote, but candidates must be based in United
  States. We are hiring specifically for this market, so
  applicants should already be based in United States.



  Language

  English is our main working language across global teams.
  Strong English communication is required.



  Interview Process

  Our process is designed to move fast:

  - Online assessment or practical task
  - Role-specific interview
  - CEO / final round

  For strong candidates, we aim to complete the process and
  make an offer within 1 week from the start of the interview
  process. Candidates who complete assessments quickly will be
  prioritized.
