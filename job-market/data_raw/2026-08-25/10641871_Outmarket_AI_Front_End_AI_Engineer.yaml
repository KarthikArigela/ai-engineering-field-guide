description: |
  ABOUT OUTMARKET

  Outmarket is the AI platform for insurance, trusted by more
  than 250 brokerages to run the work their business depends
  on. Commercial insurance still runs on dense documents and
  slow, manual workflows, and that is exactly what we
  automate: quote comparisons, coverage gap and tower
  analysis, policy review, and proposal generation, all
  grounded in our customers’ own data and source-cited so
  teams can trust the output.

  The impact is concrete. Teams save 12 to 15 hours per person
  every week, cut errors by roughly 65 percent, and win more
  business, all on infrastructure that is SOC 2 Type II
  certified, single-tenant, and never used to train AI models.
  We are an AI-first company in both what we build and how we
  work, shipping quickly and in close partnership with the
  agencies that rely on us.

  WHAT YOU’LL GET

  - A high-impact role with ownership from day one.
  - Competitive compensation and meaningful equity.
  - Direct collaboration with founders and real users.
  - Remote-first flexibility.
  - The opportunity to help build an AI-native product from the
    ground up.

  ABOUT THE ROLE We are hiring a Front End AI Engineer to
  build intuitive, high-performance product experiences that
  bring complex AI workflows to life. We want someone who
  cares how the product behaves, how customers use it, and how
  interface decisions affect trust in AI.

  WHY THIS ROLE

  - Build the user-facing layer of AI-powered workflows used by
    real customers.
  - Define fast, intuitive interfaces in a product with
    meaningful workflow complexity.
  - Shape a design system and frontend foundation that scales
    with the company.

  WHAT YOU’LL DO

  - Collaborate with design and backend teams to ship seamless
    experiences in React from Figma designs.
  - Build and maintain reusable UI components and systems that
    scale across customers.
  - Implement frontend features that interact with AI services
    such as document review, entity extraction, and quote
    comparison.
  - Rapidly prototype and iterate based on user feedback and
    evolving priorities.

  WHAT WE’RE LOOKING FOR

  - 2+ years building frontend applications with React.
  - Proficiency with design tools and handoff workflows,
    especially Figma.
  - Strong product sense and the ability to translate complex
    workflows into clean UX.
  - Familiarity with REST or GraphQL APIs and state management
    patterns.
  - Good judgment about where polish matters and where speed
    matters.

  BONUS IF YOU HAVE

  - Experience with data-rich or document-heavy interfaces.
  - Experience building LLM-integrated product experiences.
  - Modern dev-tool fluency (e.g., Cursor).
