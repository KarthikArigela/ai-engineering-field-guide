  company reasonably expects to offer for this position,
  aligned to the broader job family base pay structure. Actual
  base pay may vary based on skills, experience, and location,
  including job family level. In addition to base pay, Arctic
  Wolf offers variable incentive compensation, new hire equity
  grants, and a comprehensive benefits package.
