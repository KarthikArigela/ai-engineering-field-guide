description: |
  Your role

  We are looking for an experienced AI/ML Engineer to join our
  Central Data Platform team and take ownership of the machine
  learning and GenAI infrastructure that powers advanced
  analytics and AI use cases across the organisation.

  In this role, you will design, build, and maintain end to
  end ML pipelines in Vertex AI, ensuring that models move
  seamlessly from prototype to production ready, monitored,
  cost efficient, and compliant pipelines. You will also
  pioneer GenAI enablement, including retrieval augmented
  generation, embeddings, and AI driven applications, while
  embedding governance, reproducibility, and scalability from
  day one.

  This is a pivotal position with high impact on how AI and
  machine learning capabilities are delivered, scaled, and
  governed at Sunday Natural. You will act as the bridge
  between Data Engineers, Senior Data Analysts, Data
  Scientists, and business stakeholders, ensuring AI/ML work
  has measurable, repeatable, and strategic business impact.

  - Design, build, and maintain modular, reusable ML pipelines
    in Vertex AI Pipelines covering training, evaluation,
    deployment, monitoring, and retraining.
  - Develop GenAI capabilities including embeddings, retrieval
    pipelines, vector databases, and RAG frameworks for
    chatbots, personalisation, and semantic search.
  - Build and manage feature stores and reusable datasets in
    collaboration with Data Engineers and Analysts.
  - Productionise workflows with Prefect orchestration and CI/CD
    pipelines in Bitbucket.
  - Implement continuous evaluation, drift detection,
    performance monitoring, rollback strategies, and
    retraining triggers for deployed models.
  - Embed GDPR compliance, RBAC, anonymisation, explainability,
    fairness, and auditability into every model and pipeline.
  - Document lineage of features, models, and inference
    workflows, and partner with the Data Governance Lead on
    ethical AI frameworks.
  - Translate technical capabilities into business friendly
    outcomes, communicating trade offs across accuracy,
    latency, and cost to non technical stakeholders.
  - Mentor Data Engineers in ML Ops and GenAI techniques, and
    contribute to internal AI/ML guilds and best practices.

  Your profile

  - at least 5 years of experience in Data Engineering or ML
    Ops, with at least 3 years focused on productionising ML
    pipelines.
  - A degree in Computer Science, Data Science, Engineering, or
    a related field. PhD a plus.
  - Expert proficiency in Python and ML/DL libraries such as
    scikit-learn, TensorFlow, PyTorch, Hugging Face, and
    LangChain.
  - Strong with BigQuery, db, and SQL for feature and data
    preparation.
  - Hands-on experience with Vertex AI for pipeline
    orchestration, deployment, and monitoring (or AWS/GCP
    equivalents).
  - Experience with Prefect orchestration and CI/CD pipelines in
    Bitbucket.
  - Familiarity with ML Ops frameworks such as MLflow or TFX,
    and containerisation with Docker and Kubernetes.
  - Experience with vector databases such as Pinecone, FAISS, or
    Milvus.
  - Proven delivery of ML or GenAI use cases in production with
    measurable business impact.
  - Strong stakeholder communication and the ability to
    translate AI/ML into measurable business outcomes.
  - Systems thinker with strong ethical grounding in responsible
    AI; balances innovation with operational reliability and
    cost control.

  What we offer

  - An appealing discount on all of our products – from
    essential oils to vitamins & nutrients
  - We offer 28 days of paid time off per year plus up to 5 days
    off between Christmas and New Year
  - The Urban Sports Club membership and either Swapfiets bike
    rental or a subsidy for the Deutschlandticket
  - We believe great things happen when we meet in person, which
    is why we embrace a hybrid model with one home office day
    per week – up to two depending on the area you are working
    in – and up to two weeks per year working from abroad
  - Receive various discounts of up to more than 50 percent on
    attractive brands such as Flaconi, Bosch, Apple or Expedia
  - You will be given real ownership and plenty of room for new
    initiatives, as well as the opportunity to contribute your
    expertise and implement your great ideas
  - Inviting office spaces with access to plenty of organic teas
    and superfoods from around the world
  - We like to celebrate each other! Regular tea & office
    parties, Christmas and summer feasts and various
    influencer events such as Women's Day

  Sunday Natural emerged from a long-standing passion and
  research in the fields of health, healing, and personal
  growth. The lack of natural, high-quality products on the
  market was the original motivation for founding Sunday
  Natural in 2013. We aim to produce the products we ourselves
  would love to buy – as natural as possible, absolutely pure,
  free from any additives, and of the highest quality. In a
  strategic partnership with CVC, Sunday Natural is now one of
  Germany's most renowned quality manufacturers, with its own
  research and development department in Berlin. For the
  continuous improvement of our products, we collaborate with
  selected research institutes, scientists, therapists,
  farmers, and professional associations.  We take our
  ecological responsibility very seriously: that’s why the
  majority of our product range is vegan. We also take an
  innovative approach to packaging: most of our products are
  packaged in glass, making them almost entirely recyclable.
  Our diverse team in Berlin consists of over 400 employees
  from more than 45 nationalities and continues to grow – but
  at a sustainable pace. Our goal is to foster a
  collaborative, supportive, and inclusive work environment
  with a diverse group of motivated, talented, and visionary
  team members. We highly value equality of opportunity and
  inclusivity, and we would like to particularly encourage
  women and candidates from under-represented backgrounds to
  apply, even if you don’t match with 100% of the
  requirements.

