description: |
  We are looking for an expert in machine learning to help us
  extract value from our data. You will lead all the processes
  from data collection, cleaning, and preprocessing, to
  training models and deploying them to production.

  The ideal candidate will be passionate about artificial
  intelligence and stay up-to-date with the latest
  developments in the field.

  Responsibilities

  - Understanding business objectives and developing models that
    help to achieve them, along with metrics to track their
    progress

  - Managing available resources such as hardware, data, and
    personnel so that deadlines are met

  - Analyzing the ML algorithms that could be used to solve a
    given problem and ranking them by their success
    probability

  - Exploring and visualizing data to gain an understanding of
    it, then identifying differences in data distribution that
    could affect performance when deploying the model in the
    real world

  - Verifying data quality, and/or ensuring it via data cleaning

  - Supervising the data acquisition process if more data is
    needed

  - Finding available datasets online that could be used for
    training

  - Defining validation strategies

  - Defining the preprocessing or feature engineering to be done
    on a given dataset

  - Defining data augmentation pipelines

  - Training models and tuning their hyperparameters

  - Analyzing the errors of the model and designing strategies
    to overcome them

  - Deploying models to production

  Requirements

  - Proficiency with a deep learning framework such as
    TensorFlow or Keras or Pytorch

  - Proficiency with Python and basic libraries for machine
    learning such as scikit-learn and pandas

  - Expertise in visualizing and manipulating big datasets

  - Proficiency with OpenCV

  - Familiarity with Linux

  - Ability to select hardware to run an ML model with the
    required latency

  Benefits

  We are a bunch of technocrats who’re passionate at heart and
  we drive impact by synergizing with each other’s forces &
  having fun while we are at it.

  Our people define our culture. If there is anything we need
  to change/improve, we do.

  Personal Benefits

  - Health Comes First: Extensive Medical Insurance for you and
    your family.
  - Flexible Working Hours: Decide your own productive time per
    your project/client.
  - Dental, Eye, and Body Checkups: Routine checkups help to
    keep you updated.
  - Gaming Zone: Dedicated place for enjoying a refreshing work
    break any time of the day.
  - Celebrations: Celebrate festivals and the diversity of our
    culture.
  - Parties: We just need a reason to party regularly and a BIG
    trip yearly.
  - Handmade tea and coffee, as you like it fresh: Who doesn't
    like fresh beverages after all.

  Professional Benefits

  - Latest technologies: Opportunity to stay ahead in the
    constantly changing technology trends globally.
  - Vibrant work environment: Everybody helps everyone. Fueling
    your growth with impactful learning & growth
    opportunities.
  - Certifications: Company-sponsored certifications to fuel
    your competence.

  Monetary Benefits

  - Work Anniversary Bonus: One-month additional salary as a
    bonus every year.
  - Gratuity: Your long-term commitment pays.
  - Interest-Free Loan up to 3 times the salary: No
    documentation, get money directly in your account.
  - Excellent Referral Bonus: Help a friend and get rewarded
    every time.
  - Make money from your money: Earn a guaranteed 10% on your
    investments in NBFC without any charges.

