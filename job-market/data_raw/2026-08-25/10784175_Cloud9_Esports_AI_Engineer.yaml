job_id: 10784175
title: AI Engineer
company: Cloud9 Esports
location: Los Angeles, USA
work_type: FULL_TIME
description: |
  Who We Are

  Founded in 2013, Cloud9 has grown to become one of the most
  recognizable esports organizations in the world. With
  championships industry-wide, unmatched viewership hours, and
  extensive benefits packages for players and staff, Cloud9
  prides itself on being the best in all categories.
  Currently, Cloud9 fields multiple professional teams
  spanning across several game titles.

  To find more information about Cloud9, visit
  https://www.cloud9.gg.

  What We’re Looking For:

  We are looking for a highly skilled and innovative AI
  Engineer to join our Technology team. You will play a key
  role in bridging machine learning and production software
  engineering by building, deploying, and maintaining scalable
  LLM solutions, automated tools, and predictive models
  directly across Cloud9's ecosystem. Additionally, you will
  support key technical partners, define technical submission
  specifications, and drive initiatives like hackathons to
  expand our internal platforms and increase partnership
  reach.

  This role will report to the Vice President of Technology
  and Business Development and work within the Technology team
  to develop solutions for Cloud9’s Product teams (Content,
  Social, Graphics, Merch, & Marketing) and Competitive teams.

  What You’ll Do:

  - Build, optimize, deploy, and maintain machine learning
    models and LLM solutions directly into live production
    software systems at scale.
  - Implement software engineering production standards, define
    and refine system architecture, and maintain complex
    systems across Cloud9's tech ecosystem.
  - Build and maintain efficient ETL data pipelines for seamless
    data processing and ingestion.
  - Document software functionality, perform unit testing, and
    regularly review and debug team code.
  - Collaborate on technical partner initiatives, developing
    custom tools, executing hackathons, and showcasing
    cutting-edge technical integrations in partner content.
  - Develop AI tools for content creation, automated content
    generation, social media engagement optimization, and
    personalized fan experiences for Cloud9’s Club9 program.
  - Work with game data across League of Legends, VALORANT, and
    other major titles to build AI-powered tools and
    predictive models.
  - Partner with coaches and performance staff to design user-
    facing tools that enhance player training, scouting, and
    coaching strategies.
  - Implement AI automation solutions to streamline internal
    workflows across finance, marketing, partnerships, and
    operations.
  - Other duties as assigned.

  Requirements

  - Bachelor's degree in Artificial Intelligence/Machine
    Learning, Computer Science, Data Science, Software
    Engineering, or a related field.
  - 2+ years of experience.
  - Must be local to Los Angeles.
  - Technical familiarity including: Python, SQL, and Git.
  - Hands-on experience with LLMs, prompt engineering,
    retrieval-augmented generation (RAG), and data modeling.
  - Experience with cloud platforms (AWS, GCP, or Azure).
  - Familiarity with software development life-cycle (SDLC) best
    practices, CI/CD, and production standards.
  - Knowledge and passion for esports, specifically League of
    Legends and VALORANT.
  - Strong analytical and problem-solving abilities.
  - Ability to translate complex technical concepts to non-
    technical stakeholders (coaches, marketing, external
    partners).
  - Capacity to thrive under pressure in a fast-paced, dynamic
    environment.
  - High growth-oriented mindset with a strong internal need for
    achievement; self-directed in pursuing meaningful
    technical challenges rather than reactively awaiting
    direction.
  - Ability to apply technical intelligence to practical, real-
    world scenarios where a "book solution" does not exist,
    solving problems in a timely manner with incomplete
    information.
  - Flexibility to adjust behaviors and skills as tech demands
    evolve, possessing both the capacity and eagerness to
    learn new tools and frameworks.
  - Goal-focused and persistent through technical setbacks,
    viewing obstacles and failed iterations as opportunities
    to improve.
  - Natural inclination to challenge the status quo in pursuit
    of better information, cleaner code, and innovative AI
    solutions.

  Benefits

  - We offer a comprehensive compensation and benefits package
    where you’ll be rewarded based on your performance and
    recognized for the value you bring to the business.
  - Our benefits include medical, dental, vision, HSA, and a
    matching 401K.
  - We believe in work/life balance and hence we offer a
    generous paid time off policy, which includes sick time,
    vacation time, and parental leave.
  - Fast-paced environment within a rapidly growing company.
  - Access to industry-leading esports resources and community.
  - Part of a winning team with a growth mindset.
  - The wage range for this role incorporates the multiple
    factors that are considered in making compensation
    decisions including but not limited to skill sets,
    experience and training, licensure and certifications, and
    other business and organizational needs. A reasonable
    estimate of the current range is $100,000 - $110,000.
  - You may also be eligible to participate in a discretionary
    annual incentive program, subject to the rules governing
    the program, whereby an award, if any, depends on various
    factors, including, without limitation, individual and
    organizational performance.

  Equal Employment Opportunity

  Cloud9 Esports is an equal opportunity employer. We provide
  equal employment opportunity to individuals who are
  qualified to perform job requirements regardless of their
  race, color, national origin, ancestry, sex, pregnancy,
  childbirth, sexual orientation, gender identity or
  expression, transgender status, age, religious creed,
  physical or mental disability, medical condition, marital or
  domestic partnership status, veteran or military status, or
  any other characteristic or status protected by federal,
  state or local laws. Cloud9 is committed to providing
  reasonable accommodation for candidates with disabilities in
  our recruiting process. If you need any assistance or
  accommodation due to a disability, please let us know at
  recruiting@cloud9.gg.

  Background Checks

  Cloud9 will consider qualified candidates with criminal
  histories in a manner consistent with the law.

  Security Disclaimer

  Please note that Cloud9 Esports takes the security and
  privacy of our employees and job applicants very seriously.
  We would like to remind you to be cautious and vigilant when
  receiving unsolicited emails or phone calls claiming to be
  from our company. Our only and official email address domain
  is @cloud9.gg and anything other than that is fraud.

  If you receive any such requests for sensitive information
  or are unsure about the authenticity of a communication,
  please do not provide any personal information and contact
  us immediately.

  Cloud9 Esports will not be responsible for any losses or
  damages resulting from fraudulent attempts by third parties.
