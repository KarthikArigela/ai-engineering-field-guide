title: Senior Backend Engineer - Node.js/TypeScript (AI Integration)
company: Global Software Solutions Group
location: Chennai, IND
work_type: FULL_TIME
company_size: 160 Employees
description: |
  GSS Tech Group is hiring a Senior Backend Engineer to design
  and own production grade backend systems that integrate AI
  models, APIs, and data pipelines for our banking and fintech
  client base across the UAE.

  This is a hands on engineering role. You will be building
  services that ship into real products with real SLAs, not
  prototyping in a notebook.

  Responsibilities

  - Design, build, and maintain scalable backend services using
    Node.js and TypeScript
  - Integrate LLMs and AI services into production systems using
    Azure OpenAI, OpenAI API, or AWS Bedrock
  - Build and optimize RESTful APIs and data layers across
    PostgreSQL, Redis, and MongoDB
  - Implement RAG pipelines using vector databases, covering
    chunking, embedding, and retrieval tuning
  - Write and maintain automated tests using Jest and Playwright
    as part of CI
  - Deploy and operate services on Azure and/or AWS
  - Apply agentic workflow patterns using LangChain or LangGraph
    where appropriate

  Required qualifications

  - 5+ years backend engineering experience with Node.js and
    TypeScript
  - Strong experience with Express.js and RESTful API design
  - Production experience with at least two of PostgreSQL,
    Redis, MongoDB
  - Hands on experience shipping LLM integration to production,
    not just experimentation
  - Working knowledge of vector databases and RAG implementation
  - Working knowledge of Azure and/or AWS cloud services
  - Testing experience with Jest and Playwright
  - Foundational understanding of linear algebra, probability,
    and statistics as applied to embeddings and retrieval

  Preferred qualifications

  - Experience with AWS Bedrock specifically
  - Multi model orchestration experience
  - Regulated industry experience, including PII handling and
    audit logging
  - Banking or fintech domain background
