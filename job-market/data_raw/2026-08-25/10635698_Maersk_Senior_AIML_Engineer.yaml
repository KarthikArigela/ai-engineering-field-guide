description: |
  Data AI/ML (Artificial Intelligence and Machine Learning)
  Engineering involves the use of algorithms and statistical
  models to enable systems to analyze data, learn patterns,
  and make data-driven predictions or decisions without
  explicit human programming. AI/ML applications leverage vast
  amounts of data to identify insights, automate processes,
  and solve complex problems across a wide range of fields,
  including healthcare, finance, e-commerce, and more. AI/ML
  processes transform raw data into actionable intelligence,
  enabling automation, predictive analytics, and intelligent
  solutions. Data AI/ML combines advanced statistical
  modeling, computational power, and data engineering to build
  intelligent systems that can learn, adapt, and automate
  decisions.

  Job Title: Gen AI Engineer

  Relevant Experience: 4-10 Years  Location: Banglore / Pune /
  Anywhere Employment Type: Full-time

  Shape the Future with Generative AI

  Are you passionate about harnessing cutting-edge Generative
  AI to create transformative real-world applications? Do you
  dream of building autonomous systems that learn, adapt, and
  make decisions independently? At Maersk, we’re reimagining
  how businesses solve complex problems with the power of
  Generative AI and Autonomous Agents.

  We’re looking for a Gen AI Engineer to join our dynamic team
  and play a pivotal role in building AI solutions that will
  define the future of intelligent systems. If you're excited
  about applying your expertise to projects that disrupt
  industries and drive measurable impact, we want to hear from
  you! This is an exciting opportunity for self-motivated
  engineers with technical expertise, creative problem-solving
  skills, and a talent for disruptive process transformation
  using Gen AI

  What you’ll do:

  - Lead with autonomy: Take ownership of Gen AI projects from
    ideation to deployment, pushing boundaries of innovation

  - Design the future: Develop and fine-tune Generative AI
    models (LLMs, diffusion models, GANs, VAEs, etc.) to
    optimize SCP business processes and enhance productivity;

  - Empower AI agents: Create agent AI architectures for
    autonomous decision-making, task delegation, and multi-
    agent collaboration using Agentic AI frameworks like
    AutoGPT.

  - Innovate with LLM’s: Build & optimize LLM’s applications,
    leveraging RAG and build robust Machine Learning pipelines
    for NLP, Multimodal AI tasks;

  - Work with cutting-edge tools: Harness the power of Vector
    Databases (e.g., Pinecone, FAISS, ChromaDB) and LLM APIs
    (OpenAI, Anthropic, Hugging Face, Mistral, Llama).

  - Collaborate for impact: Partner with cross-functional teams
    to integrate AI solutions into real-world applications
    like chatbots, copilots, automation tools, etc.).

  - Stay ahead: Perform continuous research on state-of-the-art
    AI methodologies, exploring advancements in Generative AI,
    Autonomous Agents, and NLP to drive innovation.

  Required Skills & Qualifications [Must have]

  Strong foundation in Machine Learning & Deep Learning with
  expertise in neural networks, optimization techniques and
  model evaluation  Experience with LLMs, Transformer
  architectures (BERT, GPT, LLaMA, Mistral, Claude, Gemini,
  etc.).  Proficiency in Python, LangChain, Hugging Face
  transformers,  MLOps.  Experience with Reinforcement
  Learning and multi-agent systems for decision-making in
  dynamic environments.  Knowledge of multimodal AI
  (integrating text, image, other data modalities into unified
  models.

  Nice-to-have skills

  Experience with Prompt Engineering, Fine-tuning, and RAG
  techniques.  Familiarity with Cloud Platforms (AWS, GCP,
  Azure) and deployment tools like Docker, Kubernetes,
  FastAPI, or Flask.

  Why Join Us:

  - Innovate at scale: Work on groundbreaking Generative AI
    technologies that redefine what’s possible.

  - Transform industries: Your work will directly impact how
    global organizations drive productivity and solve complex
    supply chain challenges.

  - Collaborate with the best: Join a team of forward-thinking
    engineers, researchers, and product visionaries who are
    shaping the future of AI.

  - Accelerate your growth: Enjoy opportunities to learn, grow,
    and lead in a fast-paced, innovation-driven environment.

