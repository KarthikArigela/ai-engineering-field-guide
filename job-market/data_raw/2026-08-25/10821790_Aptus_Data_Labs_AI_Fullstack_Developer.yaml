description: |
  About the Role:



  We are seeking a highly skilled AI Full-Stack Developer to
  join our team. The ideal candidate will be responsible for
  designing, developing, and deploying AI-driven applications.
  This role requires expertise in both front-end and back-end
  technologies, as well as experience in integrating AI/ML
  models into scalable web applications.



  Key Responsibilities:

  AI/ML Development:

                  •              Develop and integrate AI/ML
  models into web applications.

                  •              Optimize model performance
  and deployment.

                  •              Work with frameworks like
  TensorFlow, PyTorch, or OpenAI APIs.

                  Front-End Development:

                  •              Build responsive and
  interactive UI/UX using React.js, Angular, or Vue.js.

                  •              Optimize applications for
  speed and scalability.

                  Back-End Development:

                  •              Develop robust RESTful or
  GraphQL APIs.

                  •              Work with Node.js, Python
  (Django/Flask/FastAPI),

                  •              Manage databases (SQL/NoSQL)
  and cloud services.

                  DevOps & Deployment:

                  •              Deploy AI models and
  applications on cloud platforms (AWS, GCP, Azure).

                  •              Work with Docker, Kubernetes,
  CI/CD pipelines.

                  Collaboration & Innovation:

                  •              Work closely with data
  scientists, designers, and product teams.

                  •              Stay updated with AI
  advancements and industry best practices.



  Requirements

  Requirements:

  Education & Experience:

                  •              Bachelor’s/Master’s degree in
  Computer Science, AI, or a related field.

                  •              4+ years of experience in
  full-stack development with AI integration.

  Technical Skills:

                  •              Proficiency in Python,
  JavaScript/TypeScript, and relevant frameworks.

                  •              Experience with AI/ML
  frameworks (TensorFlow, PyTorch, OpenAI API).

                  •              Strong knowledge of databases
  (PostgreSQL, MongoDB, Firebase).

                  •              Experience with cloud
  computing (AWS Lambda, Google Cloud Functions).

                  •              Proficiency in Docker,
  Kubernetes, and CI/CD pipelines.

  Soft Skills:

                  •              Strong problem-solving
  abilities and analytical thinking.

                  •              Excellent communication and
  teamwork skills.



  Must Have:

                  •              Experience with LLMs (Large
  Language Models) and NLP.

                  •              Familiarity with MLOps
  practices.

                  •              Knowledge of Web3 or
  blockchain technologies.

  Benefits

  Why Join Us?

                  •              Work with cutting-edge
  technologies and a talented team.

                  •              Competitive salary and
  benefits package.

                  •              Flexible work environment
  with growth opportunities.

                  •              Access to professional
  development and learning resources.
