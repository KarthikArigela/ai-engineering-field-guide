title: AI Forward Deployed Engineer
company: Magical
location: USA
remote: true
work_type: FULL_TIME
description: |
  Our agentic AI platform brings "AI employees" into the
  workplace to take over the repetitive, soul-crushing
  workflows that slow teams down. The result: organizations
  move faster, with sharper focus, and deliver better outcomes
  where it matters most, like improving patient care.

  The shift to agentic work is inevitable, and we’re leading
  it.. As a founding member of our team you’ll be shaping the
  playbook for the future of work alongside a small,
  relentless team pushing the edge of what’s possible with AI.

  We're backed by the investors behind OpenAI, Anthropic,
  Huggingface, and Notion, including Greylock, Coatue, Altman
  Capital and Lightspeed. The runway is long. The ambition is
  high. And the market is wide open.

  About the role

  - Design and orchestrate agentic workflows by combining AI
    prompting with Magical’s multi-agent platform, extending
    its capabilities to solve complex, customer-specific
    challenges.
  - Act as a technical bridge between customers and Magical’s
    product and engineering teams, capturing real-world
    feedback and translating it into platform improvements.
  - Diagnose and resolve issues across deployments,
    integrations, and performance optimizations, ensuring
    reliability in high-stakes environments like healthcare.
  - Shape the internal playbook by building tools,
    documentation, and reference implementations that
    accelerate future customer rollouts and scale Magical’s
    multi-agent ecosystem.

  About you

  - You have 3+ years of experience in engineering, QA
    engineering, solutions engineering, or similar technical
    background
  - You’re deeply curious about AI prompting, multi-agent
    systems, and automation. Prior experience here is a plus,
    but a fast learner with strong fundamentals will thrive.
  - Have a strong bias towards action, a willingness to do
    whatever it takes, and embody show > tell
  - Have a strong sense of agency, effectively prioritizing and
    unblocking yourself without much outside input.
  - You thrive in early-stage chaos: you’re excited to define
    the playbook rather than follow one.
  - Studied science or engineering in college (dropout welcome)
  - Located in SF/Toronto or willing to relocate

  What we offer

  - A chance to be an early team member at a fast-growing,
    ambitious company
  - The opportunity to push the boundaries of what’s possible
    with AI
  - A modern stack and the latest tools to do your best work
  - Competitive salary and meaningful equity
  - Unlimited PTO
  - Fun team offsites, past trips include Iceland, Lisbon,
    Cancun, and Costa Rica
