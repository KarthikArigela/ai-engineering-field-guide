description: |
  Within Data Ingestion at Aledade we have two major problems:
  1) Scale, 2) Variability. As an Ingestion AI Engineer at
  Aledade, you will be focused on the variability problem.
  Leveraging cutting edge AI tools you will design systems
  that handle the variability of data received from external
  sources. Within healthcare, while there are format
  standards, they are loosely followed and in many cases for
  the data we receive, no standard exists. Handling
  hundreds/thousands of disparate formats quickly is a
  challenge. The faster we are able to stand up new data
  feeds, the more information we have about our patient
  population, the better care we enable our providers to
  render. We're looking for engineers who know that writing
  new code is not always the solution to a problem, but when
  technological changes are needed they create secure,
  maintainable, performant, correct, scalable, and stable
  solutions to the complex and unique challenges in our corner
  of the healthcare industry.

  They embrace strategies that minimize risk, leaning towards
  observability, alerting, metrics, high test coverage, and
  frequent releases that incrementally build value.

  Primary Duties:

  Minimum Qualifications:

  - BS/BTech (or higher) in Computer Science, Engineering or a
    related field.
  - 6+ years experience as an engineer doing backend or data
    engineering development as part of a cross-functional
    team.
  - 3+ years of experience working with SQL or other database
    querying language on large multi-table data sets.
  - 3+ years of experience acting as a trusted technical
    decision-maker in a team setting, solving for short-term
    and long-term business value.
  - 3+ years of experience coaching other engineers.

  Preferred KSA’s:

  Physical Requirements:

  - Sitting for prolonged periods of time. Extensive use of
    computers and keyboard. Occasional walking and lifting may
    be required.
