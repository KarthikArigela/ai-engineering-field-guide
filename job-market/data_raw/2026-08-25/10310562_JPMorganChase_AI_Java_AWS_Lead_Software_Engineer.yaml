description: |
  We have an opportunity to impact your career and provide an
  adventure where you can push the limits of what's possible.

  As a Lead Software Engineer at JPMorganChase within the
  Consumer and Community Banking Connected Commerce team, you
  are an integral part of an agile team that works to enhance,
  build, and deliver trusted market-leading technology
  products in a secure, stable, and scalable way. As a core
  technical contributor, you are responsible for conducting
  critical technology solutions across multiple technical
  areas within various business functions in support of the
  firm’s business objectives.



  Job responsibilities



  - Executes creative software solutions, design, development,
    and technical troubleshooting with ability to think beyond
    routine or conventional approaches to build solutions or
    break down technical problems.
  - Writes secure and high-quality code using Java and Sprint
    Boot, and Spring Cloud concepts
  - Drives team adoption of enterprise-authorized AI-assisted
    engineering practices within the work environment to
    improve code quality, delivery speed, and operational
    outcomes (e.g., AI-assisted code review/refactoring, test
    strategy acceleration, incident/root-cause analysis
    support), while establishing consistent validation
    standards (secure coding, peer review, automated testing)
    and promoting reuse of effective patterns across the team.
  - Applies knowledge of tools within the Software Development
    Life Cycle toolchain, including enterprise-authorized AI-
    assisted development and automation capabilities, to
    improve the value realized by automation.
  - Sets up monitoring and reliability for both infrastructure
    and models (drift detection, model accuracy) using
    Prometheus/Grafana.
  - Designs, develops, codes, and troubleshoots with
    consideration of upstream and downstream systems and
    technical implications.
  - Applies knowledge of tools within the Software Development
    Life Cycle toolchain to improve the value realized by
    automation.
  - Applies technical troubleshooting to break down solutions
    and solve relative complex technical problems.
  - Gathers, analyzes, and draws conclusions from large, diverse
    data sets to identify problems and contribute to decision-
    making in service of secure, stable application
    development.
  - Identifies opportunities to eliminate or automate
    remediation of recurring issues to improve overall
    operational stability of software applications and systems
  - Leads communities of practice across Software Engineering to
    drive awareness and use of new and leading-edge
    technologies.





  Required qualifications, capabilities, and skills



  - Formal training or certification on software engineering
    concepts and 5+ years applied experience
  - Hands-on practical experience in system design, application
    development, testing, and operational stability.
  - 8+ years experience in full life cycle development and
    experience leading varying levels of Software Engineers
  - Demonstrated experience leading effective use of approved
    AI-assisted software development tools (e.g., for coding,
    code review, test acceleration, troubleshooting) with the
    ability to set team expectations for validating AI outputs
    for correctness, performance, and security
  - Strong understanding of responsible AI use in engineering
    workflows, including data sensitivity considerations,
    secure handling of inputs/outputs, and adherence to
    resiliency and security expectations; experience coaching
    engineers on safe, compliant adoption within delivery
    practices
  - Strong hands on coding in Java and Sprint Boot, with good
    understanding of Spring Cloud concepts and AWS
  - Hands-on experience to utilize monitoring and tracing tools
    (e.g. Splunk, Dynatrace, Postman, etc)Demonstrated
    knowledge of software applications and technical processes
    within a technical discipline (e.g., cloud, artificial
    intelligence/machine learning, etc.)
  - Exposure to agile methodologies such as CI/CD, Application
    Resiliency, and Security
  - Participate in code reviews, troubleshooting, and
    performance tuning
  - Contribute to system architecture and technical decision-
    making
  - Leadership experience with varying levels of Software
    Engineers





  Preferred qualifications, capabilities, and skills



  - Proven expertise in architecting and delivering highly
    scalable, resilient, and stable systems on public cloud
    platforms such as AWS
  - Extensive experience with event-driven messaging and
    streaming technologies (e.g., Kafka), both NoSQL and
    relational databases, and cloud-native API/microservice
    development
  - Strong hands-on proficiency with modern software development
    tools and technologies, including Jira, Confluence,
    IntelliJ IDEA, Maven, Git, Jenkins, Sonar, Artifactory,
    and AI-powered code assistants

