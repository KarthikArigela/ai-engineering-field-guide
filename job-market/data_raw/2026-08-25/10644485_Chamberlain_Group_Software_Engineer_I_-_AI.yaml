title: Software Engineer I - AI
company: Chamberlain Group
location: USA
remote: true
work_type: FULL_TIME
description: |
  Chamberlain Group (CG) is a global leader in intelligent
  access and Blackstone portfolio company. Powered by our myQ
  technology, we make access simple and secure for millions of
  homeowners, businesses, and communities worldwide. Our
  flagship brands, LiftMaster®  and Chamberlain® , are found
  in 51+ million homes, and 14 million+ people rely on the
  myQ®  app daily.

  Job Summary (Description of the role, what success in the
  position looks like, how it fits into the organization)

  Chamberlain Group is a global leader in access solutions
  with top brands, such as LiftMaster and Chamberlain, found
  in millions of homes, businesses, and communities worldwide.
  We are looking for a Software Engineer I who is passionate
  about building with modern AI tools and eager to grow in the
  rapidly evolving world of Generative AI and intelligent
  systems. This role is ideal for a recent graduate who has
  completed academic or personal projects using LLMs, AI
  coding assistants, and modern software development tools.

  You will work alongside experienced engineers on real-world
  AI applications including intelligent assistants, automation
  tools, and AI-driven product features. This role emphasizes
  learning, experimentation, and hands-on development while
  contributing to production systems.

  Essential Duties and Responsibilities (in descending order
  of percentage of time required)

  ·      Contribute to development of AI-powered applications
  and internal tools.

  ·      Build and test features using LLMs, APIs, and modern
  development frameworks.

  ·      Use AI coding tools (Cursor, Claude, Codex, Copilot,
  etc.) to accelerate development and improve code quality.

  ·      Assist in building prototypes and proof-of-concepts
  for new AI features.

  ·      Support integration of AI services into mobile, web,
  and backend systems.

  ·      Participate in code reviews, sprint planning, and
  technical discussions.

  ·      Write clean, well-documented, maintainable code.

  ·      Learn and apply best practices in software
  engineering and AI development.

  ·      Collaborate with product managers, designers, and
  senior engineers.

  Supervision Exercised (this section should be filled out
  when an employee has supervisory responsibilities)

  Minimum Qualifications (requirements necessary to perform
  listed duties and responsibilities)

  Education

  ·       Bachelor’s or Master’s degree in Computer Science,
  Electrical Engineering, or a related field.

  Experience:

  ·      Bachelor’s degree in Computer Science, Software
  Engineering, or related field (or graduating soon).

  ·      Internship, coursework, or personal projects
  involving:

  o   Generative AI

  o   Chatbots or assistants

  o   AI-assisted coding workflows

  o   Automation tools

  ·      Experience building projects using:

  o   OpenAI APIs

  o   Claude

  o   HuggingFace

  o   LangChain or similar frameworks (nice to have)

  ·      Portfolio, GitHub, or demo projects strongly
  preferred.

  Knowledge, Skills, and Abilities:

  ·      Strong fundamentals in computer science and software
  engineering.

  ·      Coursework in System Design, Distributed Systems

  ·      Proficiency in at least one programming language
  (Python preferred; JavaScript/TypeScript also useful).

  ·      Familiarity with REST APIs, Git, and modern
  development workflows.

  ·      Experience using AI coding tools such as:

  o   Cursor

  o   Claude

  o   Codex / Copilot

  o   ChatGPT or similar tools

  ·      Understanding of basic LLM concepts:

  o   Prompt engineering

  o   API-based model usage

  o   Retrieval-augmented generation (RAG) basics

  ·      Ability to debug and iterate quickly.

  ·      Strong curiosity and willingness to learn new tools
  and frameworks.

  ·      Good communication and teamwork skills.

  ·

  Other:

  ·       Ability to travel up to 10% of the time domestically
  and internationally

  Preferred Qualifications

  Education/Certifications:

  - Master’s degree in Computer Science, Computer Engineering,
    or related field
  - Experience in IoT, software services, video, and AI

  Experience: Preferred internship experience in AI-focused
  startups, developer-tooling or cloud platforms, consumer
  technology/IoT companies, or enterprise SaaS organizations
  building applications with Generative AI and modern software
  tools.

  The pay range for this position is $69,495.00 - $118,619.50;
  base pay offered may vary depending on a number of factors
  including, but not limited to, the position offered,
  location, education, training, and/or experience. In
  addition to base pay, also offered is a comprehensive
  benefits package and 401k contribution (all benefits are
  subject to eligibility requirements). This position is
  eligible for participation in a short-term incentive plan
  subject to the terms of the applicable plans and policies.

  Chamberlain Group wants all of its employees to succeed and
  encourages people of all backgrounds to apply. We’re proud
  to be an Equal Opportunity Employer, and you’ll be
  considered for this role regardless of race, color,
  religion, sex, national origin, age, sexual orientation,
  ancestry; marital, disabled or veteran status. We’re
  committed to fostering an environment where people of all
  lived experiences feel welcome.

  Persons with disabilities who anticipate needing
  accommodations for any part of the application process may
  contact, in confidence Recruiting@Chamberlain.com.

  NOTE: Staffing agencies, headhunters, recruiters, and/or
  placement agencies, please do not contact our hiring
  managers directly.
