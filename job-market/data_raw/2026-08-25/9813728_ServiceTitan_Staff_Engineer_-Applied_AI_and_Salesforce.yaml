title: Staff Engineer -Applied AI and Salesforce
company: ServiceTitan
location: USA
remote: true
work_type: FULL_TIME
description: |
  Ready to be a Titan?

  ServiceTitan is looking for a Lead Salesforce Engineer to
  join our team. In this role, you'll own the architecture,
  development, and ongoing evolution of our Salesforce
  platform — with a deep focus on CPQ and Billing — while
  collaborating with stakeholders across Sales, Revenue
  Operations, and Engineering. You'll leverage AI tools to
  accelerate delivery, raise quality, and push the boundaries
  of what our Salesforce org can do.

  What You'll Do

  - Partner directly with Marketing, Sales, SDR, RevOps, and GTM
    Systems leaders to identify, prioritize, and define high-
    value AI use cases.
  - Translate business problems into scalable technical
    solutions rather than simply implementing predefined
    requirements.
  - Own solution delivery from discovery, technical design, and
    prototyping through production deployment, adoption,
    monitoring, and optimization.
  - Design and build production-grade applications using Python,
    Azure, Salesforce, LLMs, RAG architectures, APIs, and
    third-party AI tools.
  - Design reusable agentic solutions spanning orchestration,
    MCP servers and connectors, live system tool calling,
    conversational experiences across Slack, embedded chat,
    APIs, and Salesforce, with standardized connector
    libraries, deployment patterns, and Dev, UAT, and
    Production promotion paths.
  - Develop AI solutions for:
    - Account and prospect research
    - Lead qualification and prioritization
    - Personalized seller and SDR outreach
    - Seller productivity and workflow automation
    - Opportunity intelligence and next-best actions
    - Pipeline inspection and deal-risk identification
    - Forecast management and accuracy
    - Guided selling and knowledge retrieval
  - Integrate AI capabilities into Salesforce and the broader
    GTM technology ecosystem through APIs, platform events,
    automation, and embedded user experiences.
  - Establish evaluation practices for AI quality, groundedness,
    relevance, task completion, hallucination risk, latency,
    cost, reliability, and business impact.
  - Implement appropriate security, access, privacy, monitoring,
    and responsible-AI controls.
  - Evaluate Salesforce-native, Azure-native, and third-party AI
    solutions and recommend whether to buy, build, or
    integrate.
  - Convert successful solutions into reusable services,
    components, templates, evaluation datasets, and
    architecture patterns.
  - Lead technical design and code reviews, mentor engineers,
    and help establish engineering standards for GTM AI
    solutions.
  - Partner with business teams to drive workflow redesign,
    adoption, and measurable business outcomes.

  What We're Looking For

  - Typically 10+ years of software engineering, solutions
    engineering, systems engineering, or technical
    architecture experience.
  - Experience building AI-powered solutions for Sales, SDR,
    Revenue Operations, or pre-sales organizations.
  - Demonstrated experience designing, building, and operating
    production applications using Salesforce, Integration
    platforms, Python and Microsoft Azure.
  - Strong hands-on experience with LLM-based applications, RAG,
    embeddings, vector or hybrid retrieval, prompt and context
    management, structured outputs, tool calling, and AI
    evaluation.
  - Strong Salesforce expertise, including Salesforce Apex,
    Flow, Lightning Web Components, Platform Events, data
    models, APIs, integrations, automation, security, and
    custom development.
  - Experience integrating Salesforce with cloud services,
    enterprise data sources, and third-party platforms.
  - Deep functional understanding of GTM processes, including:
    - Sales development and prospecting
    - Lead and account management
    - Opportunity lifecycle
    - Pipeline generation and inspection
    - Deal progression
    - Forecast management
    - Sales productivity
  - Experience building production APIs, services, integrations,
    and data-processing workflows.
  - Strong understanding of cloud security, identity, access
    management, data privacy, observability, testing, and
    deployment practices.
  - Experience with CI/CD, infrastructure as code, and automated
    testing.
  - Proven ability to work directly with business stakeholders,
    uncover root problems, challenge assumptions, and
    recommend pragmatic solutions.
  - Ability to independently navigate ambiguity and move from
    problem definition to production deployment.
  - Strong written and verbal communication skills across
    technical, business, and executive audiences.

  Preferred Qualifications

  - Experience with Azure OpenAI, Microsoft Foundry, Azure AI
    Search, Azure Functions, Azure Container Apps, API
    Management, Key Vault, and Azure Monitor.
  - Experience with Vercel AI SDK, Mulesoft, Salesforce
    Agentforce and Data Cloud.
  - Familiarity with modern AI orchestration frameworks, model
    gateways, vector databases, and evaluation platform

  Be Human With Us: Being human isn’t about checking every box
  on a list. It’s about the experiences we have, people we
  meet, and the perspectives we share. So, if you have the
  skills but are hesitant to apply because of your background,
  apply anyway. We need amazing people like you to help us
  challenge the conventional and think differently about the
  problems that we’re solving. We’re in this together. Come be
  human, with us.

  Use of AI Technology:

  We use technology, including automated and AI-assisted
  tools, to support certain aspects of our recruitment
  process. These tools are designed to improve efficiency and
  enhance the candidate experience. AI tools are not used to
  make hiring decisions; all hiring decisions are made by our
  hiring teams.

  What We Offer:

  When you join our team, you’re not just accepting a job.
  You’re making a career move. Here’s how we’ll support you in
  doing some of the most impactful work of your career:

  - Flextime, recognition, and support for autonomous work:
    Flexible time off with ample learning and development
    opportunities to continue growing your career. We offer a
    comprehensive onboarding program, leadership training for
    Titans at all levels, and other programs and events. Great
    work is rewarded through Bonusly, peer-nominated awards,
    and more.
  - Holistic health and wellness benefits: Company-paid medical,
    dental, and vision (with 100% employer paid options and
    90% coverage for dependents), FSA and HSA, 401k match, and
    telehealth options including memberships to One Medical.
  - Support for Titans at all stages of life: Parental leave and
    support, up to $20k in fertility services (i.e. IUI and
    IVF), surrogacy, and adoption reimbursement, on demand
    maternity support through Maven Maternity, free breast
    milk shipping through Maven Milk, pet insurance, legal
    advisory services, financial planning tools, and more.

  At ServiceTitan, we celebrate individuality and uniqueness.
  We believe that the convergence of fresh perspectives and
  experiences from all walks of life is what makes our product
  and culture so great. We strongly encourage people from
  underrepresented groups to apply. We do not discriminate
  against employees based on race, color, religion, sex,
  national origin, gender identity or expression, age,
  disability, pregnancy (including childbirth, breastfeeding,
  or related medical condition), genetic information,
  protected military or veteran status, sexual orientation, or
  any other characteristic protected by applicable federal,
  state or local laws.

  ServiceTitan is committed to fair and equitable compensation
  for all of our employees. We thoughtfully consider a wide
  range of factors when determining individual compensation,
  which may change over time. We comply with all applicable
  minimum wage laws. For candidates in the United States, the
  good faith salary ranges estimate for this role is

  Zone 1: $163,400 USD - $245,000 USD Applicable for: CA, CT,
  DC, MD, MA, NJ, NY, VA, and WA

  Zone 2: $152,600 USD - $229,000 USD Applicable for: All
  other US locations.

  International Compensation for candidates residing outside
  the United States will vary by location and will be
  discussed during the hiring process. Actual compensation
  within a range is determined by factors including relevant
  experience, skill set, qualifications, and performance. In
  addition to base salary, our total compensation package
  includes an annual bonus, equity, and a holistic suite of
  benefits.
