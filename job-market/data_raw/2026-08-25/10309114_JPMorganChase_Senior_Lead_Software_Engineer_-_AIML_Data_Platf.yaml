description: |
  If you are a software engineering leader ready to take the
  reins and drive impact, we’ve got an opportunity just for
  you.

  As a Senior Lead Software Engineer at JPMorganChase within
  the AI/ML & Data Platforms group, you lead a technical area
  and drive impact within teams, technologies, and projects
  across departments. Utilize your in-depth knowledge of
  software, applications, technical processes, and product
  management to drive multiple complex projects and
  initiatives, while serving as a primary decision maker for
  your teams and be a driver of innovation and solution
  delivery.

   Job responsibilities

  - Leads technology and process implementations to achieve
    functional technology objectives
  - Executes creative software solutions, design, development,
    and technical troubleshooting with ability to think beyond
    routine or conventional approaches to build solutions or
    break down technical problems
  - Makes decisions that influence teams’ resources, budget,
    tactical operations, and the execution and implementation
    of processes and procedures
  - Carries governance accountability for coding decisions,
    control obligations, and measures of success such as cost
    of ownership, maintainability, and portfolio operations
  - Drives adoption and governance of approved AI-assisted
    engineering practices across teams to improve code
    quality, delivery speed, and operational outcomes (e.g.,
    AI-assisted code review/refactoring, test acceleration,
    release readiness, incident/root-cause analysis), while
    establishing measurable validation standards (secure
    coding, peer review, automated testing) and promoting
    reuse of proven patterns and automation within the
    SDLC/TLM toolchain.
  - Applies knowledge of tools within the Software Development
    Life Cycle toolchain, including approved AI-assisted
    development and automation capabilities, to improve the
    value realized by automation at scale.
  - Delivers technical solutions that can be leveraged across
    multiple businesses and domains
  - Influences peer leaders and senior stakeholders across the
    business, product, and technology teams
  - Champions the firm’s culture of diversity, opportunity,
    inclusion, and respect

  Required qualifications, capabilities, and skills

  - Hands-on practical experience delivering system design,
    application development, testing, and operational
    stability
  - Experience working at code level
  - Formal training or certification on software engineering
    concepts and 10+ years applied experience
  - Extensive experience in building and running AWS/public
    cloud based applications
  - Demonstrated experience leading effective use of enterprise-
    authorized AI-assisted software development tools within
    the work environment (e.g., for coding, code review, test
    acceleration, troubleshooting) with the ability to set
    team expectations for validating AI outputs for
    correctness, performance, and security
  - Strong understanding of responsible AI use in engineering
    workflows, including data sensitivity considerations,
    secure handling of inputs/outputs, and adherence to
    resiliency and security expectations; experience coaching
    senior engineers/leads on compliant usage patterns and
    controls.
  - Experience developing or leading cross-functional teams of
    technologists
  - Experience with hiring, developing, and recognizing talent

