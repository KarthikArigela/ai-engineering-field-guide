  Job Summary:

  We are looking for a hands-on Python Automation Engineer
  with strong experience in Python-based automation and
  enterprise application integrations. The ideal candidate
  should be capable of building scalable automation solutions
  by leveraging a combination of technologies and integrating
  with enterprise systems.

  Experience: 5 - 8 Years

  Location: Bangalore

  Mode of Work: Bangalore

  Key Responsibilities:

  - Develop and maintain automation solutions using Python.
  - Build automation scripts using Selenium for web automation
    and testing.
  - Utilize Pandas for data processing, manipulation, and
    reporting.
  - Design and implement integrations with enterprise
    applications using REST APIs and authentication mechanisms
    such as OAuth, API Keys, and Basic Authentication.
  - Work with relational databases to query, manipulate, and
    validate data.
  - Develop end-to-end automation solutions by combining
    multiple technologies based on business requirements.
  - Collaborate with cross-functional teams to understand
    automation requirements and deliver scalable solutions.
  - Troubleshoot and optimize existing automation workflows for
    improved efficiency and reliability.

  Must Have Skills:

  - Strong hands-on experience with Python.
  - Experience with Selenium web automation.
  - Good knowledge of Pandas.
  - Understanding REST APIs, API integrations, and
    authentication mechanisms.
  - Good knowledge of SQL and relational databases.
  - Experience designing solutions involving multiple
    technologies and enterprise application integrations.
  - Strong debugging, analytical, and problem-solving skills.

  Good to Have

  - Experience with Automation Anywhere (A360).
  - Experience with Microsoft Power Automate.
  - Experience working with enterprise automation or RPA
    solutions.
  - Knowledge of Git and CI/CD practices.
  - Familiarity with cloud platforms is an added advantage.

  This version clearly positions Python as the primary skill
  while treating Automation Anywhere (A360) and Power Automate
  as secondary, aligning with the updated requirement.

