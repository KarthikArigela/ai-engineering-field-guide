description: |
  As we expand our digital footprint, we are investing in AI-
  first discovery and search optimization (AEO)—ensuring our
  platforms and content are accurately discovered,
  interpreted, and surfaced across AI-driven search engines
  and assistants.

  Role Overview

  We are looking for a Senior Website Developer with expertise
  in AI Search Optimization (AEO) to lead the development of
  AI-ready digital experiences. This role goes beyond
  traditional SEO—focusing on structuring, engineering, and
  optimizing web content so it can be accurately interpreted
  and surfaced by AI-driven systems.

  In addition, you will play a key role in building and
  managing a high-performance website using WordPress and
  Elementor, ensuring flexibility, scalability, and rapid
  content deployment aligned with AEO best practices.

  You will ensure our digital presence is discoverable,
  interpretable, and prioritized in AI-generated responses.

  Key Responsibilities

  - Lead the development of corporate websites optimized for
    Answer
       Engine Optimization (AEO).
  - Design,
       develop, and maintain websites using WordPress and
  Elementor, ensuring performance, scalability, and ease of
  content updates.
  - Customize themes, templates, and plugins to support advanced
    content
       structuring and AI discoverability.
  - Structure content for AI readability and retrieval,
       including:
  - Implement structured data (JSON-LD, schema.org) to enhance
       machine readability.
  - Apply semantic HTML and content hierarchy best practices.
  - Collaborate with content and marketing teams to identify
    high-value
       queries and AI search patterns.
  - Monitor how AI platforms (ChatGPT, Google SGE, Perplexity,
    etc.)
       surface content and optimize accordingly.
  - Continuously test and refine content structure, layout, and
    copy to improve AI answer accuracy.
  - Optimize knowledge bases, product pages, and corporate
    content for NLP and entity recognition.
  - Drive implementation of headless CMS / API-driven content
       architectures.

  Requirements

  Required Skills & Experience

  Core Development

  - 8–10 years of experience in web development / frontend
       engineering.
  - Strong expertise in HTML5, CSS3, JavaScript (semantic-first
       approach).
  - Extensive
       experience with WordPress development (custom themes,
  plugins, performance optimization).
  - Hands-on expertise with Elementor (custom
  widgets, templates, responsive design).
  - Experience with React, Next.js, or similar frameworks.
  - Hands-on experience with headless CMS platforms.

  AEO / AI Search

  - Strong understanding of AI search behavior and Answer Engine
       Optimization (AEO).
  - Experience with:
  - Familiarity with AI assistants and conversational search.

  Analytics & Optimization

  - Experience with Google Search Console, GA4, or similar
    tools.
  - Ability to measure and improve AI-driven visibility.

  Good to Have

  - Technical SEO (crawlability, indexing, site architecture)
  - Experience optimizing WordPress performance (Core Web
    Vitals,
       caching, CDN integration)
  - Exposure to API-first / microservices architectures
  - Basic understanding of LLMs, RAG, or embeddings
  - Experience in B2B SaaS environments

