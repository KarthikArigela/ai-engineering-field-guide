description: |
  This is a remote position.

  We are looking for a highly creative and technically skilled
  AI Prompt Engineer to work on a high-quality, professional
  feature film intended for theatrical release. This role sits
  at the intersection of cinematography, storytelling, and AI
  generation, requiring someone who understands a director’s
  vision and can translate it into powerful AI-driven visuals.

  If you have a strong sense of camera, framing, lighting, and
  cinematic storytelling, along with expertise in AI prompting
  tools, this is a unique opportunity to be part of a next-
  generation filmmaking process.

  Key Responsibilities


  - Translate director’s vision and narrative intent into
    effective AI prompts for visual generation
  - Create high-quality, cinematic AI-generated visuals aligned
    with film production standards
  - Collaborate closely with directors, editors, and creative
    teams to maintain visual consistency
  - Apply knowledge of camera angles, lighting, shot
    composition, and cinematography in prompt creation
  - Experiment with and optimize prompts for realistic and
    stylized outputs
  - Stay updated with the latest advancements in AI tools and
    visual generation techniques
  - Ensure continuity and coherence across scenes generated
    using AI
  - Troubleshoot and refine outputs to match professional film
    quality benchmarks






  Requirements


  - Strong understanding of cinematography, framing, lighting,
    and visual storytelling
  - Experience with AI image/video generation tools (e.g.,
    Midjourney, Stable Diffusion, Runway, etc.)
  - Excellent English communication skills (written & verbal)
  - Ability to interpret and execute creative direction from
    film makers
  - Strong prompt engineering skills with attention to detail
  - Creative mindset with a strong visual imagination






  Benefits


  - Work on a cutting-edge AI-powered feature film
  - Be part of an innovative team redefining filmmaking using AI
  - Opportunity to contribute to a theatrical release project
  - Creative freedom and exposure to next-gen production
    techniques
