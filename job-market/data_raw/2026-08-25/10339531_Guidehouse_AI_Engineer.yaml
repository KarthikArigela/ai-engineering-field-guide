work_type: FULL_TIME
description: |
  Job Family:

  Data Engineering & Architecture Consulting

  Travel Required:

  Up to 25%

  Clearance Required:

  None

  Guidehouse is seeking an AI Engineer to support the design,
  development, validation, and deployment of AI-enabled
  capabilities across a Revenue Cycle Management (RCM)
  platform. This role focuses on building production-grade AI
  systems that improve operational workflows across claims,
  denials, AR management, coding, and performance analytics.
  The role includes deploying AI solutions on cloud-native,
  containerized infrastructure using Kubernetes.

  What You Will Do: Design and deploy AI-enabled workflows for
  RCM use cases; Build LLM-based applications including RAG
  and agent orchestration; Develop containerized AI services
  using Docker and Kubernetes (AKS/EKS/GKE); Implement CI/CD
  pipelines for Kubernetes deployments; Integrate AI with
  enterprise systems and data pipelines; Support agent
  runtime, evaluation frameworks, and human-in-the-loop
  workflows; Ensure scalability and reliability of AI services
  in production. What You Will Need:

  - Minimum of FIVE (5)+ years of overall work experience
    required.
  - LLMs, RAG, and generative AI application development
  - Python, APIs, and backend microservices engineering
  - Cloud AI platforms (Azure AI, AWS Bedrock/SageMaker, GCP
    Vertex AI)
  - Data pipelines, ETL/ELT, and enterprise data integration
  - Vector databases, embeddings, and semantic search
  - AI/ML model evaluation, validation, and monitoring
  - CI/CD and MLOps for production AI systems
  - AI governance (explainability, auditability, compliance)
  - Experience delivering AI solutions from prototype to
    production

  What Would Be Nice To Have:

  - Experience building AI/ML or LLM applications in production;
    Strong Python and API development skills; Experience with
    Azure AI, AWS, or GCP; Experience with RAG and vector
    databases; Experience with Docker and Kubernetes;
    Understanding of container orchestration and scalable
    system design.
  - Preferred Qualifications
  - Experience in healthcare RCM; Experience with agent-based
    orchestration; Familiarity with MLOps practices;
    Experience with Kubernetes tooling such as Helm and
    service mesh technologies; Experience with GPU workloads
    in Kubernetes.
  - What Success Looks Like
  - AI features deployed into live RCM workflows; measurable
    improvements in productivity and throughput; scalable AI
    services operating across Kubernetes environments
    supporting multiple clients.
  - Docker and Kubernetes (AKS/EKS/GKE) for containerized
    deployments

  The annual salary range for this position is
  $130,000.00-$216,000.00. Compensation decisions depend on a
  wide range of factors, including but not limited to skill
  sets, experience and training, security clearances,
  licensure and certifications, and other business and
  organizational needs.

