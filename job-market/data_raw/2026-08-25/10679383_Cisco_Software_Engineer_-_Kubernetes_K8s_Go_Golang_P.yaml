description: |
  Meet the Team

  Cisco Nexus Dashboard is the unified operations platform
  designed to simplify and accelerate data center management.
  Built on a robust, Kubernetes-based microservices
  architecture, it serves as a single pane of glass for the
  Cisco data center portfolio, including ACI and Nexus
  Dashboard Fabric Controller (NDFC). By integrating advanced
  telemetry, orchestration, and policy management services,
  the platform empowers organizations to streamline their
  operational workflows, enhance visibility, and ensure
  consistent configuration and security across diverse
  physical and virtual environments.

  The Nexus Dashboard infrastructure team serves as the
  backbone of our platform, engineering the critical services
  that ensure stability, security, and seamless lifecycle
  management for our global data center customers. By managing
  the core Kubernetes-based architecture, our team provides
  the essential foundation upon which advanced orchestration,
  telemetry, and policy services are built and scaled. We are
  a fast-paced, dynamic group of engineers who thrive on
  collaboration and constant innovation, working closely with
  cross-functional teams to solve complex infrastructure
  challenges in real-time. We foster a culture of continuous
  learning and technical excellence, making this the ideal
  environment for engineers who are passionate about building
  robust, high-scale infrastructure.

  Your Impact

  Joining Nexus Dashboard infrastructure team means operating
  at the cutting edge of platform technologies, where you will
  have the opportunity to directly influence the future of
  data center automation and platform reliability.

  - Core Platform Engineering: Architect and maintain the core
    infrastructure of the Nexus Dashboard, a Kubernetes-based
    platform, ensuring high availability and performance
    across its integrated data stack, including PostgreSQL,
    OpenSearch, and Kafka.

  - Cluster Lifecycle Management: Oversee the full deployment
    lifecycle of multi-node clusters, including automated
    installation, configuration, and seamless inline software
    upgrades across diverse physical and virtual form factors.

  - System Reliability & Observability: Develop and support
    critical infrastructure services, including robust backup
    and restore frameworks, automated anomaly detection, and
    comprehensive audit logging to ensure platform reliability
    and operational transparency.

  - Security & Identity Infrastructure: Implement and manage
    enterprise-grade security protocols, focusing on
    centralized Authentication and Authorization (AAA) and
    end-to-end certificate lifecycle management for both
    cluster-level and microservice-level communications.

  - Scalability & Performance Optimization: Collaborate with
    cross-functional engineering teams to optimize platform
    scalability and resource efficiency, ensuring the Nexus
    Dashboard remains a resilient and performant foundation
    for data center telemetry and orchestration services.

   Minimum Qualifications

  - Bachelors 8+ years related experience or Masters +4 years of
    related experience.

  - Experience programming in languages such as Go and Python,
    including leveraging AI-assisted development tools to
    write, test, and optimize code.

  - Experience with rapid prototyping of AI solutions and AI
    workflow/agent engineering.

  - Proven experience in developing, deploying, and managing
    microservices on Kubernetes-based orchestration platforms.

  - Experience designing and implementing robust test plans to
    ensure software quality, reliability, and coverage across
    all use cases.

  - Solid understanding of computer science fundamentals and
    software engineering, with an aptitude for learning new
    technologies.

  Preferred Qualifications

  - Proficiency in Linux system internals, including process
    management, file systems, and networking.

  - Understanding of distributed databases and messaging
    systems, such as PostgreSQL, OpenSearch, Kafka.

  - Hands-on experience with CI/CD pipelines.

  Why Cisco?

  At Cisco, we’re revolutionizing how data and infrastructure
  connect and protect organizations in the AI era – and
  beyond. We’ve been innovating fearlessly for 40 years to
  create solutions that power how humans and technology work
  together across the physical and digital worlds. These
  solutions provide customers with unparalleled security,
  visibility, and insights across the entire digital
  footprint.

  Fueled by the depth and breadth of our technology, we
  experiment and create meaningful solutions. Add to that our
  worldwide network of doers and experts, and you’ll see that
  the opportunities to grow and build are limitless. We work
  as a team, collaborating with empathy to make really big
  things happen on a global scale. Because our solutions are
  everywhere, our impact is everywhere.

  We are Cisco, and our power starts with you.
