title: AI Operations Engineer
company: SuperDial
location: New York, USA
work_type: FULL_TIME
company_size: 15 Employees
description: |
  SuperDial is looking for an AI Operations Engineer to
  increase trial-to-paid customer conversion, maintain high
  retention, and improve internal operational performance.
  This role is highly cross-functional and ideal for someone
  who blends strategic thinking with executional rigor.

  About the role:

  - Own and optimize the customer trial experience to increase
    conversion rates.
  - Analyze engagement and usage data to identify and resolve
    friction points in the customer journey.
  - Own quality initiatives to maintain high retention alongside
    the customer success team
  - Improve operational efficiency across call center and
    support workflows through process redesign, automation,
    and performance tracking.
  - Collaborate across teams (Product, Customer Success,
    Engineering) to implement scalable systems and workflows.

  About you:

  - 3+ years in engineering; startup experience a plus.
  - Strong analytical skills with experience using Excel, SQL,
    or other data tools.
  - Highly organized and detail-oriented, with a proactive
    problem-solving mindset.
  - Ability to manage multiple tasks and work cross-functionally
    in a fast-paced environment.
  - Strong verbal and written communication skills, with the
    ability to present data clearly.

  Preferred qualifications:

  - Proficient in data analysis and operational tooling (SQL,
    Excel/Sheets, dashboards).
  - Strong problem-solving, communication, and cross-functional
    collaboration skills.
  - Bonus: Background in healthcare, SaaS onboarding, or call
    center operations.

  What’s in it for you?

  - The opportunity to contribute to key operational
    improvements at a fast-growing AI-powered healthcare
    company.
  - A dynamic, entrepreneurial culture where your work directly
    impacts efficiency and customer experience.
  - Competitive salary, equity and benefits, including health,
    dental, vision and unlimited PTO.

  Who we are:

  SuperDial is transforming AI in healthcare, helping
  organizations improve efficiency, reduce administrative
  burden, and optimize revenue cycle management. Our
  operations team is at the core of ensuring seamless
  execution and continuous improvement. Join us and help shape
  the future of AI in healthcare.

  The base salary for this role ranges from $75,000 to
  $110,000, depending on experience, skill set, and fit. We
  also offer equity and benefits as part of our total
  compensation package. Final offers may vary based on
  experience and qualifications - we’re always open to
  exceptional talent.
