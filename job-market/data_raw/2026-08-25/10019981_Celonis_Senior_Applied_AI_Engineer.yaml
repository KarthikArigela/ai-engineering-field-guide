description: |
  Celonis is the trusted platform to industrialize Enterprise
  AI. At our core is the Celonis Context Model — which
  combines process data, business knowledge, and intelligence
  into a living digital twin of the enterprise that AI can
  actually understand, turning AI's operational blind spots
  into operational clarity. World's leading companies trust
  Celonis and its global ecosystem of partners to make their
  AI agents, people, systems, and processes work together,
  achieving transformational outcomes. We believe there's a
  massive opportunity to unlock global productivity and
  sustainability by giving AI the context to understand how
  every business process really works. Join our mission to
  make processes work for people, companies, and the planet.

  The Team:

  You will be joining our global Digital and Marketing
  Operations organization, a central function that enables our
  global marketing teams to run efficiently and effectively.
  Our team’s mission is to empower all marketing functions,
  from Field to Brand, with the technology, data, and
  processes they need to succeed.

  The Role:

  As a Senior Applied AI Engineer you will be a key player in
  building and deploying practical, internal-facing AI
  solutions that significantly boost the efficiency and
  effectiveness of our global marketing organization. This is
  a hands-on, executional role in a fast-paced B2B SaaS
  environment. You will translate strategic needs into
  tangible tools that save time, improve data quality, and
  enable our marketing teams to better serve our customers.
  You will have a direct impact on how our marketing
  organization operates, making it more intelligent and data-
  driven.

  The work you’ll do:

  - Design and build AI-powered solutions to automate key
    marketing tasks. This includes creating AI agents to
    assist with creative brief routing and content
    translation.
  - Develop and implement hybrid solutions that leverage AI to
    augment human workflows, ensuring a seamless and efficient
    user experience.
  - Create and manage API integrations to automate data
    ingestion from various marketing platforms (e.g., Hubspot,
    Monday.com) into custom built AI solutions.
  - Improve CRM data quality and integrity by developing tools
    for automated lead-to-account matching, duplicate record
    removal, and data enrichment.
  - Collaborate with cross-functional teams like Brand and
    Communications to build AI solutions for content
    generation (e.g., press releases, social media copy) and
    real-time market trend analysis.
  - Measure and optimize the business impact of your solutions,
    ensuring they deliver measurable efficiency gains for our
    teams.
  - Proactively research and recommend new AI tools and
    technologies to drive future efficiency and innovation.

  The qualifications you need:

  - 5-7 years of experience in a development or engineering
    role, with hands-on experience in building and deploying
    production-level applications, bots, or automated
    workflows.
  - Proficiency in Python or other scripting languages like
    Javascript and a strong understanding of its libraries for
    data manipulation (e.g., Pandas).
  - Hands-on experience with AI/automation frameworks and
    platforms such as Langchain, Make, Zapier, or similar
    tools.
  - Experience with API development and integration using REST
    and GraphQL.
  - A strong understanding of Large Language Models (LLMs) and a
    proven ability to apply advanced prompt engineering
    principles to solve business problems.
  - A strong sense of ownership and a "product-oriented"
    mindset, with the ability to build user-centric and
    scalable solutions.
  - Excellent communication skills, with the ability to
    translate complex technical concepts into clear, business-
    focused language for non-technical stakeholders.
  - Familiarity with marketing technology platforms (MarTech)
    such as Salesforce, HubSpot, or Marketo is a significant
    advantage.
  - Experience working in a B2B SaaS environment is a plus.

  What Celonis can offer you:

  - Pioneer Innovation: Work with the global leader in Process
    Mining and the Process Intelligence Graph to shape the
    future of AI-driven business operations.
  - Ownership from Day 1: Every full-time "Celonaut" is an
    owner, receiving Restricted Stock Units (RSUs) and merit-
    based refresh grants.
  - Unrivaled Family Support: Benefit from our inclusive
    parental leave policy—24 weeks of fully paid leave for
    primary carers and 12 weeks for supporting carers,
    available from your first day of employment.
  - Work-Life Integration: Enjoy Unlimited PTO (in applicable
    regions) and generous PTO globally, as well as a flexible
    hybrid work model that balances remote focus with vibrant
    office collaboration.
  - Continuous Growth: Elevate your skills through our 70-20-10
    learning framework, mentorship programs, and access to a
    dedicated learning platform.
  - Holistic Well-being: Prioritize your health with subsidized
    Wellhub memberships, mental health counseling, and
    dedicated "Wellness Weeks" that prioritize work/life
    balance.
  - Drive Sustainability: Participate in annual Impact Days,
    where you receive paid time off to volunteer for community
    and environmental causes with your local office, or
    virtually.
  - Global Inclusion & Belonging: Find community through our
    Inclusion Think Tank and participate in our annual
    Inclusion Days, ensuring every voice is heard and valued.
  - Value-Driven Impact: Join a mission-led organization where
    our core values—Live for Customer Value, The Best Team
    Wins, We Own It, and Earth Is Our Future—drive every
    decision.

  About Us:

  Celonis is the trusted platform to industrialize Enterprise
  AI, empowering organizations to analyze, design, and operate
  AI-driven processes. The Celonis Platform is powered by the
  Celonis Context Model, which combines process data, business
  knowledge, and intelligence to create a living digital twin
  of the enterprise that AI can understand — turning AI’s
  operational blind spots into operational clarity. Industry-
  leading companies around the world trust Celonis and its
  global ecosystem of partners to make their AI agents,
  people, systems, and processes work together, achieving
  transformational outcomes. Celonis is headquartered in
  Munich, Germany, and New York City, USA, with more than 20
  offices worldwide.

