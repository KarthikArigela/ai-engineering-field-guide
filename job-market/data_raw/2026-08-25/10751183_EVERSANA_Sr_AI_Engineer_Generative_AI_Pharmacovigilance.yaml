  Job Description

  We are seeking a highly motivated AI Engineer with 5+ years
  of experience in Artificial Intelligence, Machine Learning,
  Generative AI, and Agentic Engineering to join our
  Pharmacovigilance Technology team.

  The ideal candidate will work closely with Pharmacovigilance
  SMEs, Product Owners, Data Scientists, Safety Operations
  Teams, and Software Engineers to design, develop, and deploy
  AI-powered solutions that enhance drug safety monitoring,
  adverse event case processing, signal detection, literature
  surveillance, regulatory reporting, and medical document
  intelligence.

  This role offers an opportunity to shape next-generation AI
  products leveraging Large Language Models (LLMs), Retrieval-
  Augmented Generation (RAG), NLP, Machine Learning, and
  Agentic AI frameworks within the Life Sciences domain.

  ESSENTIAL DUTIES AND RESPONSIBILITIES

  Our employees are tasked with delivering excellent business
  results through the efforts of their teams.  These results
  are achieved by:

  AI Solution Development

  - Design, develop, and deploy AI/ML solutions for
    Pharmacovigilance business processes.
  - Build Generative AI applications using OpenAI, Azure OpenAI,
    Anthropic, Llama, or equivalent LLM platforms.
  - Develop domain-specific AI assistants for PV operations and
    safety case management.
  - Build intelligent document processing solutions for source
    documents, ICSRs, safety narratives, and regulatory
    reports.

  Large Language Models & GenAI

  - Build and optimize RAG-based applications using vector
    databases.
  - Develop prompt engineering frameworks and evaluation
    methodologies.
  - Fine-tune domain-specific models using pharmacovigilance
    datasets.
  - Develop AI agents and workflow automation capabilities using
    Agentic AI frameworks.
  - Develop and implement evaluation strategies for LLM and
    Agentic AI applications.

  Data Engineering & Integration

  - Collaborate with data engineers to integrate safety systems
    and clinical data sources.
  - Develop data pipelines for structured and unstructured PV
    data.
  - Integrate APIs and enterprise applications into AI
    workflows.
  - Work with structured and graph-based data sources to support
    advanced AI applications.

  MLOps & Deployment

  - Deploy AI models and GenAI applications into production
    environments.
  - Implement monitoring, model evaluation, drift detection, and
    performance optimization.
  - Maintain scalable, secure, and compliant AI infrastructure.
  - Implement observability and telemetry for AI/ML applications
    and services using OpenTelemetry.
  - Support CI/CD and automated deployment pipelines for AI
    applications.

  Compliance & Governance

  - Ensure AI solutions comply with GxP, GVP, FDA, EMA, MHRA,
    and internal quality standards.
  - Support AI validation, audit readiness, traceability, and
    documentation requirements.
  - Implement Responsible AI and model governance practices.

  Stakeholder Collaboration

  - Partner with Pharmacovigilance SMEs and Product Managers to
    understand business requirements.
  - Translate regulatory and safety requirements into scalable
    AI solutions.
  - Support demos, proof-of-concepts, and innovation
    initiatives.

  Qualifications

