description: |
  Company Overview: We are a dynamic software and content
  creation company headquartered in Scotland, UK, with a
  talented development and production team based in Pune,
  India. We specialise in creating high-quality Architectural
  digital experiences and producing immersive visual content.
  We foster a collaborative; international working environment
  focused on innovation and quality.

  Role Summary: We are looking for an AI-first Full Stack
  Developer who actively uses modern AI coding tools and
  agent-driven workflows to accelerate software delivery. This
  role is ideal for someone already building with tools such
  as OpenAI Codex, Anthropic Claude, Cursor, GitHub Copilot,
  and autonomous coding agents as part of their day-to-day
  development process. You’ll work across front-end, back-end
  and AI-powered platform features to help build intelligent
  web applications and internal tooling. We are particularly
  interested in developers who understand how to combine
  strong engineering fundamentals with AI-assisted development
  practices to move quickly while maintaining quality

  Key Responsibilities:

  - Build and maintain modern front-end applications
       using React or Angular
  - Develop scalable APIs and services using .NET,
       Node.js, Laravel or similar back-end frameworks
  - Use AI-assisted development tools and coding agents
       to accelerate delivery, prototyping and testing
  - Collaborate with AI specialists to integrate
       LLM-powered functionality into products and workflows
  - Design and iterate rapidly using agentic
       development approaches and AI-enhanced engineering
  practices
  - Optimise application performance, maintain code
       quality and ensure maintainable architecture
  - Contribute to cloud infrastructure, deployments and
       data management
  - Participate in product discussions, technical
       discovery and solution design

  Essential Skills:

  - Strong full-stack development experience across
       front-end and back-end technologies
  - Proficiency with React or Angular, HTML, CSS and
       JavaScript/TypeScript
  - Back-end development experience using .NET,
       Node.js, Laravel or similar frameworks
  - Practical experience using AI coding tools such as
       Codex, Claude, Cursor, GitHub Copilot or similar agent-
  based workflows
  - Experience integrating AI or LLM functionality into
       applications, or strong evidence of rapidly adopting
  AI-assisted development practices
  - Familiarity with cloud platforms such as Azure or
       AWS
  - Experience with relational databases (SQL), NoSQL
       databases and ideally vector databases
  - Understanding of APIs, microservices and modern web
       architecture
  - Comfortable working in fast-moving, iterative
       delivery environments
  - Strong written and verbal communication skills in
       English, with the ability to explain technical concepts
  clearly to both technical and non-technical stakeholders
  - Experience working with international clients,
       distributed teams or cross-border stakeholders
  - Ability to manage stakeholder expectations, gather
       requirements and communicate project progress
  effectively
  - Experience working in Agile, Scrum or hybrid
       delivery environments

  Requirements

  Desirable Skills, Experience & Qualifications:

  - Experience with autonomous coding agents, AI
       orchestration frameworks or multi-agent workflows
  - Familiarity with prompt engineering, retrieval
       workflows or embedding/vector search systems
  - Experience building or consuming RESTful APIs or
       GraphQL services
  - Git/GitHub workflows and Agile delivery practices
  - Experience with WebGL, Three.js or interactive 3D
       web experiences
  - Exposure to DevOps, CI/CD pipelines and
       cloud-native deployment practices
  - A bachelor’s degree in computer science, Software
       Engineering, or a related technical field.

  Personal Attributes:

  - Proactive, curious, and eager to learn new
       technologies, especially in the AI space.
  - Detail-oriented with a strong commitment to writing
       high-quality, maintainable code.
  - A collaborative team player with excellent
       problem-solving abilities.
  - Adaptable and capable of working effectively in a
       fast-paced environment.
  - Strong communication skills, both written and
       verbal, in English.
  - Passionate about building innovative products and
       delivering excellent user experiences.

  We’re particularly interested in developers who:

  - Think AI-first rather than AI-adjacent
  - Already use AI tools daily to plan, build, review
       and refactor software
  - Understand where AI accelerates development and
       where traditional engineering discipline still matters
  - Can move quickly without sacrificing clarity,
       maintainability or product thinking
  - Are excited by the future of agent-assisted
       software development and modern engineering workflows



  Benefits

  What We Offer:

  - Opportunity to contribute to an exciting,
       AI-enabled web platform within an international
  company.
  - Exposure to diverse and cutting-edge projects in
       the ArchViz and digital experiences sector.
  - A collaborative and supportive work environment
       connecting Pune and Scotland.
  - Competitive salary and benefits package.
  - A unique opportunity to be part of a rapidly
       growing company and to grow your career with it.
