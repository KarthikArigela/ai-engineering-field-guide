description: |
  Ciklum is looking for a Senior AI Engineer to join our team
  full-time in India.

  We are a custom product engineering company that supports
  both multinational organizations and scaling startups to
  solve their most complex business challenges. With a global
  team of over 4,000 highly skilled developers, consultants,
  analysts and product owners, we engineer technology that
  redefines industries and shapes the way people live.

  About the role:

  As a Senior AI Engineer, become a part of a cross-functional
  development team engineering experiences of tomorrow, who
  thrives at the intersection of cutting-edge AI technology
  and real-world business execution. In this role, you won't
  just write code in a silo—you will embed directly with
  client teams, map complex and manual workflows, and engineer
  autonomous AI-agent solutions to replace them.

  You will own the solution lifecycle end-to-end: discovery,
  architecture, build, deployment, and iteration. Working with
  minimal direction, you’ll serve as the technical authority
  who bridge the gap between complex agentic architectures and
  high-impact business outcomes.

  Responsibilities:

  - Client Embedding & Workflow Discovery: Partner directly with
    business stakeholders to break down manual enterprise
    processes, map complex decision-making steps, and
    translate them into robust agentic workflows
  - Agentic AI Engineering: Design, build, and deploy custom
    multi-agent systems, function-calling pipelines, RAG
    implementations, and reusable agent skills
  - End-to-End System Ownership: Develop production-ready
    backend services and integration layers to connect AI
    agents with core enterprise platforms (e.g., SharePoint,
    Jira, SAP, email)
  - Cloud & Infrastructure Management: Package, host, and scale
    agent workloads using modern cloud architectures (AWS
    AgentCore, serverless, containerized environments) with
    automated CI/CD
  - Safety & Observability: Implement guardrails, human-in-the-
    loop checkpoints, and agent evaluation loops to ensure
    reliability, mitigate hallucinations, and ensure
    enterprise compliance

  Requirements:

  - Agentic AI & LLMs
    - Frameworks: Hands-on experience with Strands (primary
      framework), along with familiarity in LangGraph, CrewAI,
      or AutoGen
    - Agent Core Concepts: Deep understanding of tool use,
      function calling, streaming, context management, system
      prompts, and chain-of-thought methodologies
    - MCP & Agent Protocols: Proven ability to build/consume Model
      Context Protocol (MCP) servers, alongside multi-agent
      coordination (A2A), task delegation, and result
      aggregation
    - RAG Pipelines: Hands-on build experience with vector
      databases (e.g., Pinecone, pgvector, OpenSearch),
      chunking strategies, embeddings, and retrieval
      optimization
    - Skill Building & Guardrails: Design reusable skills for
      agent consumption; implement observability,
      hallucination mitigation, and human-in-the-loop
      checkpoints
  - Backend Development & Data
    - Python Mastery: Strong experience with Python 3.10+ using
      async/await and strict type hinting
    - APIs & Web Frameworks: Proficiency with FastAPI (or
      equivalent), REST API design, and modern auth flows (JWT
      / OAuth2)
    - Data Processing: Solid SQL skills (queries, filters, joins)
      and expertise in unstructured data processing
      (extracting/classifying data from PDFs, Excel, and
      legacy enterprise documents)
  - Infrastructure & DevOps
    - AWS & Hosting: Experience hosting/operating agent workloads
      using AWS AgentCore (understanding lifecycle, scaling,
      and invocation patterns) along with core services
      (EC2/ECS, Lambda, RDS, S3)
    - Containers & CI/CD: Docker proficiency and experience
      setting up GitHub Actions pipelines
  - Qualifications & Experience
    - Software Engineering Track Record: Strong foundation in core
      software engineering principles and production-grade
      software development
    - Production LLM Experience: At least one production project
      successfully delivered using LLM agents, skill-building
      architectures, or RAG pipelines
    - End-to-End Ownership: Demonstrated ability to drive projects
      independently from zero to one with minimal guidance
    - Client-Facing Communication: Comfortable interfacing with
      non-technical business partners—gathering requirements,
      explaining technical decisions, and presenting live
      solutions

  What’s in it for you?

  - Strong community: Work alongside top professionals in a
    friendly, open-door environment
  - Growth focus: Take on large-scale projects with a global
    impact and expand your expertise
  - Tailored learning: Boost your skills with internal events
    (meetups, conferences, workshops), Udemy access, language
    courses, and company-paid certifications
  - Endless opportunities: Explore diverse domains through
    internal mobility, finding the best fit to gain hands-on
    experience with cutting-edge technologies
  - Care: We’ve got you covered with company-paid medical
    insurance, mental health support, and financial & legal
    consultations

  About us:

  At Ciklum, we are always exploring innovations, empowering
  each other to achieve more, and engineering solutions that
  matter. With us, you’ll work with cutting-edge technologies,
  contribute to impactful projects, and be part of a One Team
  culture that values collaboration and progress.

  India is a strategic innovation hub for Ciklum, with growing
  teams in Chennai and Pune leading advancements in EdgeTech,
  AR/VR, IoT, and beyond. Join us to collaborate on game-
  changing solutions and take your career to the next level.

  Explore, empower, engineer with Ciklum!

  Interested already? We would love to get to know you! Submit
  your application. We can’t wait to see you at Ciklum.

