title: AI Enablement Engineer
company: JustPark
location: London, GBR
work_type: FULL_TIME
company_size: 96 Employees
description: |
  JustPark is the premier partner offering both B2B solutions
  for destinations and B2C services for drivers, giving us the
  best of both worlds. We simplify the entire parking
  experience. From venues and local government to private
  driveways, our platform makes it simple for drivers to find,
  book, and pay for parking—while empowering our operating
  partners to deliver exceptional parking experiences.

  We’ve always believed parking should be easier—from end to
  end. That’s why we, two trailblazing companies—ParkHub and
  JustPark—have come together to make that vision a reality.

  ParkHub revolutionized event parking in the US, optimizing
  venue operations for a smoother, stress-free experience.
  JustPark transformed parking in the UK, turning the hunt for
  a spot into a simple, seamless task.

  Now, as one unified company, we’re combining expertise to
  offer a full-service, frictionless parking solution for both
  businesses and consumers.

  We’re hiring a technical problem solver and generalist.
  We’re not hiring an admin for a single tool or a specialist
  in a single domain.

  We're looking for someone who understands what a sales
  cycle, marketing campaign or QBR actually requires
  operationally, and can translate that directly into working
  agents/tools — built with Claude Code — rather than writing
  requirements for someone else to build.

  This is a high-autonomy, high-ambiguity role: you'll be
  identifying where teams are losing the most time,
  prioritising ruthlessly, shipping working solutions yourself
  and supporting others to ship solutions independently.

  Success in the first 90 days means having mapped processes
  and built agents/tools which are delivering real business
  value in multiple departments/teams.

  Based in our London office, hybrid, working closely with
  teams across the US and UK.

  What You’ll Do

  Forward Deployed Engineering / Enablement for Internal Teams

  - Partner with leaders/domain experts across different
    departments (commercial, marketing, finance, operations,
    success, support, etc) and develop a strong understanding
    of each domain
  - Develop and use a framework to identify, prioritise and
    select opportunities for AI solutions/enablement
  - Document existing/new processes and identify opportunities
    for improvement
  - Build agents, skills, etc to fully or partially automate
    workflows
  - Build new tools (using Claude Code) to replace existing
    tools, solve gaps in processes, etc
  - Upskill and support internal teams to build agents, skills,
    tools, etc so they are empowered to use AI to solve
    problems
  - Develop and use a framework to track the value of AI
    solutions (key metrics, targets, actuals, etc)

  Collaboration with Product, Engineering & Data

  - Partner with product managers, engineers, data analysts,
    DevOps, etc
  - Contribute to overall AI strategy including input on both
    internal (efficiency, speed, quality, etc) and external
    (customer/client interfaces) aspects
  - Identify and surface opportunities to enhance our
    client/customer facing product, e.g. an internal
    tool/agent which could be incorporated or rebuilt into the
    core product
  - Provide input (requirements, feedback, etc) into the
    development of APIs, MCPs, CLIs and other interfaces
    consumed by AI tooling

  Ops / Success / Support - Systems & Tooling

  - Partner with Asana, Jira, Salesforce, Slack and Zendesk
    admins and provide expertise on integrations and cross-
    department workflows
  - Create and continuously improve complex and custom
    integrations

  Requirements

  Must Have

  - 5+ years of experience, which must include;
  - Experience using Codex, Claude Code or similar to ship
    working solutions (this may be in personal projects)
  - Broad understanding of AI technology (LLM vs ML) and
    relevant patterns, approaches, etc
  - Technical fluency to read API specs, use Postman and
    troubleshoot error scenarios
  - Familiarity with Git version control and use of GitHub,
    GitLab or similar tools
  - Strong process design instincts; able to map a workflow,
    identify failure points, and build something that scales
  - Clear written communication, you'll be writing playbooks,
    training materials, and process docs that others will
    actually use
  - Excellent interpersonal skills with the ability to
    communicate clearly and credibly across teams and levels
  - Good strategic/commercial awareness; you know what matters
    to a business and you can clearly articulate the
    connection/value of specific deliverables to those
    business goals and metrics
  - Strong organizational skills, able to work independently,
    take ownership of assigned tasks and context-switch in a
    fast paced environment

  Nice-to-have

  - Experience building AI agents, agentic workflows or similar
    (this may be in personal projects)
  - Experience using Replit, Lovable, Base44 or similar no-code
    AI builders
  - Experience as an admin for Asana, Jira, Planhat, Salesforce,
    Zendesk or any other similar platform
  - Experience building reports/dashboards with Tableau, PowerBI
    or similar tooling
  - Experience in technical account management, pre-sales/sales
    engineering or similar commercially oriented technical
    roles
  - Experience working with teams and/or clients across multiple
    time zones
  - Experience working in B2B2C environments involving both B2B
    clients and end-users where the commercial model is partly
    driven by end-user transactions
  - Background in parking technology, mobility, event management
    or venue operations

  You're Probably a Good Fit If…

  - You enjoy working across a wide range of tools and domains
  - You are passionate about solving problems and optimising
    processes
  - You think about OODA loops in your spare time

  Benefits

  Recharge your batteries

  - Generous holiday policy: 25 days + bank holidays + managers
    can grant up to 5 extra days for high performance (total
    of 38 days a year)
  - Free lunch on all office days via Feedr with daily meal
    choice
  - Free snacks & drinks on all office days

  Investment in you and your wellbeing

  - Private Medical Insurance with Vitality
  - Life assurance through YuLife
  - £25 credit for eye tests per year
  - Free O2 concert tickets through our partnership with the O2

  Simplifying journeys so you can breathe easier

  - £50 parking credit per month via JustPark
  - Cycle-to-work salary sacrifice scheme
  - EV salary sacrifice car scheme via Octopus Energy

  We look out for your family

  - Enhanced parental leave with 6-months enhanced maternity
    leave and 4 weeks fully-paid paternity leave
  - Help finding great childcare with funded hours via Koru Kids
  - Look after the pennies
  - Competitive pension offering with standard and salary
    sacrifice options

  Success is best when it's shared

  - Quarterly away days with the whole UK team
  - Quarterly team social budget
  - Social activities and celebrations on our gorgeous rooftop
    in King's Cross
