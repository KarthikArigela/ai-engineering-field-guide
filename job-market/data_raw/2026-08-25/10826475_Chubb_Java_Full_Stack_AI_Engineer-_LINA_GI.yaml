description: |
  About Chubb

  Chubb is a world leader in insurance. With operations in 54
  countries and territories, Chubb provides commercial and
  personal property and casualty insurance, personal accident
  and supplemental health insurance, reinsurance and life
  insurance to a diverse group of clients. The company is
  defined by its extensive product and service offerings,
  broad distribution capabilities, exceptional financial
  strength and local operations globally. Parent company Chubb
  Limited is listed on the New York Stock Exchange (NYSE: CB)
  and is a component of the S&P 500 index. Chubb employs
  approximately 40,000 people worldwide. Additional
  information can be found at: http://www.chubb.com/

  About Chubb India

  At Chubb India, we are on an exciting journey of digital
  transformation driven by a commitment to engineering
  excellence and analytics. With a team of over 2500 talented
  professionals, we foster a startup mindset that promotes
  collaboration, diverse perspectives, and a solution-driven
  attitude. We are dedicated to building expertise in
  engineering, analytics, and automation, empowering our teams
  to excel in a dynamic digital landscape. We offer an
  environment where you will be part of an organisation that
  is dedicated to solving real-world challenges in the
  insurance industry. Together, we will work to shape the
  future through innovation and continuous learning.

  Position Details:

  Job Title: Technical Lead

  Function/Department: Technology

  Location: Hyderabad

  Employment Type: Full-time

  Position Overview:

  As a Full Stack Lead Engineer, you will own features end-to-
  end—from design to deployment. You’ll work closely with our
  tech leads, designers, and product managers to deliver
  solutions that meet the highest standards of quality and
  performance. This role is ideal for someone who thrives in a
  cloud-native environment (preferably Azure) and enjoys
  collaborating across disciplines.

  Key Responsibilities:

  - Build and maintain full-stack applications using Java &
    Angular
  - Translate product requirements into clean, maintainable
    technical solutions
  - Design and develop RESTful APIs, integrate with databases,
    and ensure backend performance and security
  - Participate in code reviews, architecture discussions, and
    technical design sessions
  - Monitor application performance and troubleshoot production
    issues as needed
  - Stay current with industry trends, best practices, and
    emerging technologies
  - Mentor junior engineers and help improve our engineering
    practices
  - Take ownership of code quality and ensure adherence to clean
    code principles

  Qualifications

  - Bachelor’s degree in software development, computer science,
    or information systems
  - Over 12 years of software engineering experience with deep
    expertise in core programming languages
  - Strong backend development skills with Java
  - Solid understanding of ApI Designs, Api Security and OOPS
    Concepts.
  - Experience building and maintaining full-stack applications
  - Proficient with relational databases (SQL Server) and basic
    caching strategies
  - Cloud experience, preferably Azure (App Services, Azure SQL,
    Functions, Key Vault)
  - Experience with CI/CD pipelines (Azure DevOps or
    equivalent), Git, and containerization (Docker)
  - Strong ownership and accountability mindset

  Why Join Us?

  - Be at the forefront of digital transformation in the
    insurance industry.
  - Lead impactful initiatives that simplify claims processing
    and enhance customer satisfaction.
  - Work alongside experienced professionals in a collaborative,
    innovation-driven environment.

