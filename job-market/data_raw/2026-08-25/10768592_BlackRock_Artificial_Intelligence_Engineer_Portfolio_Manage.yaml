title: Artificial Intelligence Engineer, Portfolio Management Group, Associate
company: BlackRock
location: Mumbai, IND
work_type: FULL_TIME
company_size: 25,000 Employees
description: |
  About this role

  About Global Fixed Income Team BlackRock’s active fixed
  income portfolio strategies stretch across a range of
  investment styles and segments of the fixed income universe.
  The breadth and depth of our platform puts us in a strong
  position to potentially deliver attractive returns in
  various market environments. With a focus on alpha
  generation and risk management, the team uses a top-down
  view from lead portfolio managers and bottom-up expertise
  from our sector specialists.

  Responsibilities:

  - Design and develop generative AI and machine learning
    solutions to address fixed income investment and business
    problems
  - Experiment with and implement generative AI techniques such
    as retrieval-augmented generation (RAG), embeddings, and
    LLM-based workflows
  - Build, train, and fine-tune machine learning and deep
    learning models using appropriate frameworks and
    methodologies
  - Analyze large structured and unstructured datasets to
    extract insights, engineer features, and support model
    development
  - Apply statistical methods and hypothesis-driven
    experimentation to evaluate model performance and validate
    results
  - Work closely with portfolio managers, researchers, and
    business stakeholders to translate investment problems
    into data science solutions
  - Contribute to the deployment and integration of models into
    production systems, including APIs and scalable pipelines
  - Collaborate with data engineers to ensure high-quality data
    pipelines and efficient data access
  - Ensure adherence to responsible AI principles including
    model interpretability, fairness, and data governance
  - Communicate model outputs, insights, and recommendations
    clearly to technical and non-technical stakeholders.
  - Stay updated with advancements in AI, machine learning, and
    quantitative methods to continuously enhance solutions

  Education and Qualifications/Skills:

  - Bachelor's or Master's degree in Computer
    Science/Engineering or related field.
  - 4+ years of relevant experience.
  - Good understanding of the foundations and working principles
    of machine learning algorithms, linear algebra,
    probability theory, statistics, and optimization theory.
  - Knowledge of at least one of the following domains:
    generative AI, statistical learning, optimization, NLP,
    deep learning or time series analysis.
  - Should have strong proficiency in the following
  - Languages: Python, SQ
  - Frameworks: PyTorch, TensorFlow, Scikit-learn, Hugging Face,
    LangChain, LlamaInde
  - Data & Storage: large‑scale distributed data analytics
    engines, Pandas, Snowflake, FAISS, Pinecone, Chrom
  - Familiarity with cloud platforms (GCP, Azure, AWS
  - Proficiency in version control systems (e.g., Git/GitHub).
  - Strong analytical thinking skills with an ability to
    creatively solve business problems, innovating new
    techniques as needed.
  - Excellent verbal and written communication skills.
  - Self-driven and results oriented team player with ability to
    collaborate effectively across geographies/time zones
  - Passion for solving interesting and relevant real-world
    problems in Finance using a data science and AI
    approaches.
  - Prior experience in financial services or large-scale
    enterprise systems is a plus.

  Our benefits To help you stay energized, engaged and
  inspired, we offer a wide range of benefits including a
  strong retirement plan, tuition reimbursement, comprehensive
  healthcare, support for working parents and Flexible Time
  Off (FTO) so you can relax, recharge and be there for the
  people you care about.

  Our hybrid work model

  BlackRock’s hybrid work model is designed to enable a
  culture of collaboration and apprenticeship that enriches
  the experience of our employees, while supporting
  flexibility for all. Employees are currently required to
  work at least 4 days in the office per week, with the
  flexibility to work from home 1 day a week. Some business
  groups may require more time in the office due to their
  roles and responsibilities. We remain focused on increasing
  the impactful moments that arise when we work together in
  person – aligned with our commitment to performance and
  innovation. As a new joiner, you can count on this hybrid
  model to accelerate your learning and onboarding experience
  here at BlackRock.

  Guidance on AI use for candidates

  At BlackRock, AI has long been part of how we work –
  enhancing decision-making, improving operations, and helping
  us deliver better outcomes for clients. We encourage
  candidates to use AI thoughtfully to learn, prepare, and
  work more effectively; but during our interview process, we
  want to focus on getting to know you through your own
  experiences, thinking, and judgment. To support you, we’ve
  provided guidance on when and how to use AI during our
  hiring process so you can approach each step with confidence
  and showcase your best self.

  About BlackRock

  At BlackRock, we are all connected by one mission: to help
  more and more people experience financial well-being.  Our
  clients, and the people they serve, are saving for
  retirement, paying for their children’s educations, buying
  homes and starting businesses. Their investments also help
  to strengthen the global economy: support businesses small
  and large; finance infrastructure projects that connect and
  power cities; and facilitate innovations that drive
  progress.

  This mission would not be possible without our smartest
  investment – the one we make in our employees. It’s why
  we’re dedicated to creating an environment where our
  colleagues feel welcomed, valued and supported with
  networks, benefits and development opportunities to help
  them thrive.

  To learn more about BlackRock, please visit
  Careers.BlackRock.com. We also encourage you to get to know
  us on LinkedIn, Instagram, YouTube, X, and TikTok.

  BlackRock is proud to be an Equal Opportunity Employer.  We
  evaluate qualified applicants without regard to age,
  disability, family status, gender identity, race, religion,
  sex, sexual orientation and other protected attributes at
  law.
