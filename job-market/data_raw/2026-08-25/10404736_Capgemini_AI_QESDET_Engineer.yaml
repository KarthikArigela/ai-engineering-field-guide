title: AI QE/SDET Engineer
company: Capgemini
location: Los Angeles, USA
work_type: FULL_TIME
description: |
  About the Engagement

  This role sits within a client's spec-driven SDLC platform —
  an agent-first system where the specification is the single
  source of truth and downstream artifacts are generated from
  it, not described by it. The platform spans Requirements
  authoring, Test Data Management, CodeGen, and the QE test
  harness on a common foundation, built on three pillars:
  agent-first, input-flexible, and deterministic. Deployed on
  ROSA with Snowflake as the data platform and Portkey as the
  AI gateway.

  Responsibilities

  - Re-architect the harness for headless, multi-tenant
    execution — durable orchestration, queued and scheduled
    runs
  - Wire it into the E2E SDLC spine.
  - Integrate with TDM's two-lane architecture and the Repo
    Knowledge Plane
  - Instrument telemetry, flake detection, and stability scoring
    that gate promotion

  Requirements

  - Experienced software engineering, recent platform/backend
    work
  - Demonstrated experience re-platforming an IDE-bound tool
    into a shared service — core to the role
  - Strong Python and/or TypeScript; API design, event-driven
    orchestration
  - Test automation depth — Gherkin/BDD, Playwright or Selenium,
    CI integration
  - Agentic/LLM frameworks (LangGraph, CrewAI, Strands) with
    deterministic control around probabilistic components
  - Kubernetes/OpenShift (ROSA a plus), Snowflake, AI gateway
    patterns
  - LLM cost-awareness — token economics as a design constraint

  Nice to Have

  - TDM or synthetic data pipeline ownership
  - Brownfield sequencing experience
  - Insurance domain experience

  Benefits

  This position comes with competitive compensation and
  benefits package:

  - Competitive salary and performance-based bonuses
  - Comprehensive benefits package
  - Career development and training opportunities
  - Flexible work arrangements (remote and/or office-based)
  - Dynamic and inclusive work culture within a globally known
    group
  - Private Health Insurance
  - Retirement Benefits
  - Paid Time Off
  - Training & Development
  - *Note: Benefits differ based on employee level

  About Capgemini

  Capgemini is a global leader in partnering with companies to
  transform and manage their business by harnessing the power
  of technology. The Group is guided everyday by its purpose
  of unleashing human energy through technology for an
  inclusive and sustainable future. It is a responsible and
  diverse organization of over 420,000 team members in more
  than 50 countries. With its strong 55-year heritage and deep
  industry expertise, Capgemini is trusted by its clients to
  address the entire breadth of their business needs, from
  strategy and design to operations, fueled by the fast
  evolving and innovative world of cloud, data, AI,
  connectivity, software, digital engineering and platforms.
  The Group €22.5 billion in revenues in 2025.
