description: |
  Company Description



  Job Description

  Senior AI & Platforms Engineer Location: NYC, NY (3 days
  onsite minimum) Contract

  Need only local candidates who can go for F2F.

  Job Summary: Role Overview We are seeking a Senior Engineer
  to build and scale our next-generation AI platforms.

  Key Responsibilities

  - AI & Agentic Engineering: Design and implement autonomous
    multi-agent systems and cognitive architectures using
    cutting-edge agentic frameworks.
  - Backend Architecture: Build high-performance, asynchronous
    Python microservices and robust REST/gRPC APIs.
  - AIOps & CI/CD: Establish end-to-end MLOps/AIOps pipelines,
    automating the testing, deployment, and monitoring of AI
    models and data products.
  - Data Infrastructure: Architect scalable data pipelines and
    query patterns across data platforms such as
    Snowflake/Databricks/Lakehouse.

  Qualifications

  Required Qualifications

  - Python Expertise: Good knowledge of advanced Python
    (Asyncio, FastAPI, Pytest) applied to distributed
    microservices.
  - Agentic Frameworks: Hands-on experience developing with
    frameworks like LangGraph, CrewAI, AutoGen, or Semantic
    Kernel.
  - Data Ecosystem: Deep technical proficiency with Snowflake,
    Databricks (Unity Catalog, Delta Lake), or Lakehouse
    architectures.
  - DevOps & AIOps: Proven track record building CI/CD pipelines
    (GitHub Actions, GitLab CI) and monitoring infrastructure
    (Prometheus, Grafana, MLflow).

  Additional Information

  All your information will be kept confidential according to
  EEO guidelines.
