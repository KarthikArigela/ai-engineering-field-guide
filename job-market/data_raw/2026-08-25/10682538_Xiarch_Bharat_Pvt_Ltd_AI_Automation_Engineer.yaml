description: |
  About Xiarch Bharat Infrastructure & Security
  OperationsXiarch Bharat is a CERT-In empanelled
  cybersecurity services company with over 20 years of
  experience. We specialize in 24×7 SOC monitoring,
  Vulnerability Assessment & Penetration Testing (VAPT), GRC,
  DPDP compliance, ISO audits, and Zero Trust networking
  solutions (pfSense/FortiGate). We serve 4000+ clients across
  India and are rapidly scaling our infrastructure and product
  capabilities with AI-powered security solutions

  About the Role - We’re a fast-growing technology company
  building AI-powered automations to run leaner and ship
  faster. We’re looking for sharp, self-driven freshers and
  interns who genuinely enjoy building with AI — people who
  would rather create a workflow that handles a task 100 times
  than do it manually once. This is a pure automation and
  tooling role. You will work directly with the founder and
  teams to find repetitive processes and turn them into
  reliable, AI-assisted pipelines. Your job is to build the
  automations — not to work in any specialist domain. You will
  start building and shipping real automation from week one.

  What You’ll Do• Build and maintain automation workflows
  using n8n, Make.com, or Zapier to connect internal systems
  (CRM, email,  ticketing, reporting). • Use LLM APIs (Claude,
  OpenAI) and strong prompt engineering to automate report
  drafting, data extraction, summarization, and research
  workflows. • Build internal AI tools — RAG-based knowledge
  assistants, document generators, and simple dashboards that
  teams actually use every day. • Identify manual, repetitive
  processes across the company and turn them into reliable
  automated pipelines. • Work with structured and unstructured
  data (PDFs, spreadsheets, logs) to clean, parse, and feed it
  into automated workflows. • Test, document, and iterate on
  everything you build so others can trust and reuse it.

  Tools You’ll Work With -You’ll get hands-on experience with
  a modern automation stack: • LLM APIs: OpenAI, Claude •
  Automation Platforms: n8n, Make.com, Zapier • Languages &
  Frameworks: Python, LangChain, CrewAI • Data & Integrations:
  REST APIs, Webhooks, Vector Databases • Tools: GitHub,
  Google Workspace, Notion What We’re Looking For • Genuine
  interest in AI and automation — you’ve already experimented
  with ChatGPT/Claude, n8n/Make/Zapier, or similar tools on
  your own. • Basic coding ability (Python preferred) — enough
  to write scripts, call APIs, and debug simple issues. •
  Logical, structured thinking — you can break a messy manual
  process into clear, automatable steps. • Strong ownership &
  curiosity — you figure things out, ask good questions, and
  take initiative without waiting to be told what to do. •
  Good written English for documentation and prompt writing
