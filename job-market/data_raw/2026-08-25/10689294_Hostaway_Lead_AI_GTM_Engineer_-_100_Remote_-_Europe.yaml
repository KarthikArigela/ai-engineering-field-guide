description: |
  NOTE: This is a FULLY remote role, but the candidate must be
  within Europe to collaborate with their team, peers, and
  internal customers. You do not have to be in the specific
  country or city shown in this listing, but please only apply
  if you are physically based within Europe.

  Trusted by 20,000+ property managers worldwide, Hostaway is
  an industry leading, AI-powered vacation rental management
  platform designed for professional short-term rental
  operators. Hostaway brings everything together for greater
  efficiency and faster growth.

  Profitable, high-growth, and the first short-term rental PMS
  unicorn 🦄. Join us at our most exciting stage yet! Learn
  more about our recent valuation and story here.

  About the role

  Hostaway is looking for a Lead AI GTM Engineer to build the
  systems, workflows, and AI-powered tools that make our
  global marketing team faster, smarter, and more effective.

  This is a senior individual contributor role for someone who
  combines deep technical expertise with a strong
  understanding of how modern marketing teams operate. You
  will work across Brand, Content, Demand Generation, Product
  Marketing, and Marketing Operations to identify where AI can
  improve performance, reduce manual work, and increase the
  quality and speed of execution.

  You will decide where to buy, build, or automate; design and
  deploy agents and workflows; integrate AI into our marketing
  technology stack; and measure whether those solutions
  improve marketing performance and ROI.

  This role requires both strategic thinking and hands-on
  execution. You should be equally comfortable mapping a
  complex GTM workflow, evaluating a new AI platform, building
  an agent, connecting systems through APIs, and explaining
  the business impact to senior marketing leaders.

  Your mission

  - Design, build, and deploy AI-powered solutions, including
    agents, multi-step workflows, automations, and internal
    tools that solve real marketing problems.
    - For example, building a campaign builder that allows a
      marketer to input a brief, and the agentic workflow
      creates all of the assets, including versions and
      localizations, and connects to platforms like
      Meta/LinkedIn/Google to execute the ads in market.
  - Own build-vs-buy decisions by evaluating emerging AI and GTM
    platforms, testing their capabilities, and determining
    when to implement an existing solution versus build
    something custom.
  - Integrate AI agents and workflows with our marketing
    platforms, data sources, APIs, and internal systems.
    - For example, you can build an email automation workflow that
      connects to our platform to identify signals that would
      trigger an email cadence with all the branching logic,
      including writing the email, and connecting to HubSpot
      to deploy the email.
  - Establish AI evaluation and quality standards by testing
    accuracy, reliability, and output quality and continuously
    improving production workflows.
  - Optimize the economics of AI across token usage, API
    consumption, software costs, infrastructure, and human
    effort.
  - Stay ahead of emerging models, agent frameworks, platforms,
    and approaches, turning the most promising developments
    into practical advantages for Hostaway.

  - Full-stack builder: Past engineering experience required,
    and you can independently design, build, deploy, and
    maintain AI-powered applications, agents, and multi-step
    workflows.
  - AI engineering expertise: You have built AI agents and
    agentic workflows that have measurably improved team
    performance. This requires you to be comfortable working
    across models, APIs, orchestration frameworks, and coding
    environments such as Claude Code or similar tools.
  - AI platform fluency: You have hands-on experience evaluating
    and implementing emerging AI and GTM platforms such as
    Qualified, Clay, Jasper, Copy.ai, HubSpot Breeze, or
    similar tools, and you can quickly determine if they solve
    real-world business problems.
  - Platform integration expertise: You know how to connect
    systems. You have hands-on experience integrating
    platforms such as HubSpot, Salesforce, Meta, Google, and
    LinkedIn and creating reliable data flows between them.
  - GTM fluency: You understand how modern B2B marketing works
    across brand, content, demand generation, product
    marketing, and marketing operations, and how those teams
    work together across the buyer journey and funnel.

  - Strong economic judgment: You understand the cost of
    automation and can evaluate tradeoffs between human
    effort, purchased software, API consumption,
    infrastructure, and token usage to choose the most
    efficient solution.
  - Data acquisition expertise: You are comfortable using APIs,
    web scraping, and other methods to turn external data into
    structured inputs for marketing, competitive intelligence,
    targeting, and automation.
  - Able to navigate ambiguity: You can identify the highest-
    impact opportunities, make pragmatic decisions with
    incomplete information, and move quickly from idea to
    working solution without needing heavy process or a large
    team.

  What we offer

  - Competitive Compensation: We offer competitive pay based on
    market rates in the country of the applicant.
  - 100% Remote: Enjoy the freedom to work from anywhere within
    your country of residence—be it a co-working space, your
    home office, or even your dining room table. The choice is
    yours. Just don’t ask to work in our office (we don’t have
    one).
  - Equity: Every role in our company comes with valuable stock
    options in a fast-growing and profitable company. This
    ensures we all share in the company’s success.
  - Values-Driven Leadership: Our Core Values are not just words
    we’ve written to make us feel good. We leverage them daily
    when making strategic and tactical decisions.
  - Professional Growth: Our rapid growth offers unparalleled
    learning and development opportunities, along with a
    multitude of career advancement opportunities.
  - Annual Paid Leave: The specific amounts vary by country and
    are aligned with country and/or contract-specific norms.
  - Geographic Specific Benefits: As an international employer,
    we offer different country-specific benefits such as
    Health Insurance and Pensions in countries where these
    perks are customary. The specifics depend on the country
    of the applicant.
  - Dynamic Team Culture: As a global company with team members
    in over 40 countries, our diverse and international
    culture fuels our innovation and creativity, providing a
    key pillar to our success (and making it a lot of fun to
    work here).

  Thank you for your interest. If you apply for this role, you
  will receive an email from our Talent Acquisition team after
  your application has been reviewed alongside the
  qualifications for this role and the qualifications of
  others who have applied.
