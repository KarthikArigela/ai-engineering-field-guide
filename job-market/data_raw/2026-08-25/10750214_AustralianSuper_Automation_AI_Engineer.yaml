description: |
  Job Title: AI & Automation Engineer

  Location: London, King’s Cross

  Hybrid

  - Design and deliver agentic AI solutions that can reason,
    plan, orchestrate workflows and execute tasks.
  - Work with Microsoft Foundry, Copilot Studio, Power Platform,
    Azure and modern agent orchestration frameworks.
  - Help establish the standards and guardrails for safe,
    scalable and responsible AI across a complex global
    organisation.

  About AustralianSuper

  At AustralianSuper, our purpose is to help members achieve
  their best financial position in retirement.

  Technology, data and digital capability are critical to
  delivering that purpose. As expectations, regulation and
  technology continue to evolve, we are investing in
  intelligent and autonomous solutions that can improve
  decision-making, strengthen operational resilience and
  create more efficient ways of working.

  We are now looking for an AI & Automation Engineer to join
  our AI & Automation team in London and help shape how
  agentic AI and intelligent automation are designed, governed
  and deployed across the Fund.

  The role:

  You will be a hands-on technical specialist responsible for
  designing, building, operating and supporting agentic AI and
  intelligent automation capabilities.

  This role brings together applied AI, automation
  engineering, solution architecture, enterprise integration
  and operational support. You will create intelligent, goal-
  driven systems that can reason, plan, adapt, use tools,
  orchestrate workflows and execute tasks with an appropriate
  level of autonomy.

  You will work collaboratively with colleagues across
  Technology, Data and Digital to embed reliable AI and
  automation capabilities into enterprise platforms and end-
  to-end business processes.

  In this role, you will:

  - Design, build and maintain agentic AI and automation systems
    that support intelligent decision-making, goal-driven
    planning and autonomous task execution.
  - Translate complex business challenges into agent-based
    solution architectures, selecting suitable models, tools,
    memory strategies, control mechanisms and automation
    patterns.
  - Develop AI-enabled workflows incorporating orchestration,
    adaptive behaviour, exception handling, human oversight
    and safe escalation paths.
  - Design agent orchestration using frameworks such as Semantic
    Kernel, LangChain or equivalent technologies.
  - Build and optimise Retrieval-Augmented Generation pipelines,
    grounding agent behaviour in trusted, approved and
    governed knowledge sources.
  - Engineer prompts, tool-use patterns, planning strategies and
    reasoning approaches that produce consistent, explainable
    and reliable outcomes.
  - Integrate AI agents and automation solutions with core
    applications, APIs, digital channels and enterprise data
    services.
  - Productionise solutions using appropriate DevOps and MLOps
    practices, with a focus on reliability, scalability,
    observability and ongoing support.
  - Monitor agent performance, drift, hallucination risk,
    unintended actions, incidents and service degradation.
  - Implement appropriate controls, guardrails, human-in-the-
    loop mechanisms and auditability across autonomous
    solutions.
  - Contribute to reusable AI and automation standards,
    architecture patterns and engineering best practices.
  - Communicate solution designs, outcomes, risks and
    opportunities clearly to technical and non-technical
    stakeholders.

  What you’ll need

  We are looking for an experienced engineer who combines
  strong technical capability with curiosity, sound judgement
  and a practical approach to solving complex enterprise
  problems.

  To succeed in this role, you will bring:

  - Strong hands-on experience in hands-on technical engineering
    roles within complex enterprise environments.
  - Demonstrated experience designing, delivering and supporting
    production-grade AI-enabled, intelligent automation or
    decision-support solutions.
  - Practical experience with agentic AI systems, autonomous
    workflows, orchestration patterns, adaptive automation and
    goal-driven decision architectures.
  - A strong understanding of Generative AI, large language
    models and agent-based system design, including reasoning,
    planning, memory, tool use, model selection and routing.
  - Experience designing autonomous solutions with suitable
    guardrails, controls, human oversight and escalation
    paths.
  - Strong expertise in Microsoft Power Platform, including
    Power Automate, Power Apps and Copilot Studio.
  - Experience with Microsoft Foundry, including Foundry Models
    and Foundry Agents Service.
  - An understanding of agent integration and extensibility
    standards such as Model Context Protocol and Agent-to-
    Agent.
  - Experience owning complex technical problems through design,
    implementation, deployment, operational support, incident
    resolution and continuous improvement.
  - The ability to work autonomously, manage competing
    priorities and make informed engineering decisions in
    ambiguous or evolving environments.
  - Excellent communication and stakeholder management skills,
    with the ability to explain complex concepts to both
    technical and non-technical audiences.
  - A tertiary qualification in Computer Science, Engineering,
    Data Science or a related discipline, or equivalent
    practical industry experience.



  Experience in any of the following would also be valuable:

  - Azure services and cloud-native solution design within a
    Microsoft environment.
  - CI/CD, environment management, monitoring and lifecycle
    management using GitHub or Azure DevOps.
  - Python, PowerShell, Bash or a similar scripting language.
  - ServiceNow and IT service management processes.
  - Microsoft Fabric, Azure Databricks, Azure Synapse Analytics
    or equivalent enterprise data platforms.
  - AI governance, privacy, security, ethical AI and regulatory
    compliance.
  - Financial services, pension, superannuation, insurance or
    another regulated environment.
  - Agile, Lean, DevOps or startup-style delivery models.



  Life at AustralianSuper

  At AustralianSuper, we care about our colleagues and
  recognise that work and life are closely connected. We are
  committed to building an inclusive workplace where different
  perspectives are valued and where colleagues have the
  opportunity to learn, grow and contribute to meaningful
  outcomes for members.

  Joining our London office means becoming part of a
  collaborative and growing international environment, working
  with colleagues across functions, locations and time zones.
  This role offers the opportunity to work with emerging
  technologies while contributing to the safe and responsible
  adoption of AI and automation across the organisation.

  If you require reasonable adjustments during the recruitment
  process, please let our recruitment team know.

  What’s next?

  Apply now if you are passionate about agentic AI,
  intelligent automation and engineering excellence, and want
  to help turn emerging AI capability into safe, scalable and
  reliable real-world solutions.

  If you share our values of Energy, Integrity, Generosity of
  Spirit and Excellent Outcomes, we would love to hear from
  you.

  Progress, powered by purpose.

  AustralianSuper uses AI to review resumes and conduct
  initial phone interviews. This involves processing your
  resume, cover letter, and voice recording in Australia, the
  UK and the USA to help assess your suitability for the
  applied role. When invited to an AI phone screening, you may
  opt for a traditional phone screening instead. For
  information on how we handle your personal data, please
  refer to our Candidate Privacy Policy.
