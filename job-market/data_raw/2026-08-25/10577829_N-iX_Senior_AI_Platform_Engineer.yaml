description: |
  N-iX is a global software development company founded in
  2002, connecting over 2,400+ tech professionals across 40+
  countries. We deliver innovative technology solutions in
  cloud computing, data analytics, AI, embedded software,IoT,
  and more to global industry leaders and Fortune 500
  companies. Join us to create technology that drives real
  change for businesses and people across the world.

  Our client is a leading online car marketplace group
  operating across Europe and North America, bringing together
  market-leading brands to shape the future of our industry by
  combining the best of both regions.

  About the Role: Join our client's Platform Engineering team,
  where they build the internal platform that 600+ developers
  rely on to ship software quickly and safely: centralized
  Kubernetes, managed CI/CD, project templates, and developer
  tooling running on AWS.  A big part of that today is making
  developers more productive with AI — secure environments for
  AI coding tools, AI-assisted CI, agentic workflows on AWS
  (Bedrock, Agent Core), and MCP-based integrations. AI is the
  means, not the end: what we care about is a faster, smoother
  day-to-day for every engineer.

  We are looking for a Senior Platform Engineer who works
  fluently with modern AI tooling and uses it to move fast —
  someone who'd rather build something and learn from it than
  research it forever, and who brings solid infrastructure/AWS
  fundamentals along with the product thinking and
  communication skills to own a topic end to end.

  Responsibilities:

  - Build and operate the internal AI platform: secure AI coding
    environments, AI in CI/CD, agentic workflows on AWS
    (Bedrock / Agent Core), and reusable building blocks teams
    adopt by default.
  - Own products end to end — design, build, run, and improve
    them with a product mindset, treating fellow engineers as
    your customers and shaping interfaces that are genuinely
    easy to build with.
  - Start from the developer's day: figure out where the real
    friction is, decide what would actually make their work
    easier, and measure whether people adopt it once it ships.
  - Take ownership of a topic, plan the work, drive it to done,
    and keep stakeholders in the loop.
  - Set the bar for how we build with AI — turn an interesting
    idea into tooling people can actually rely on, and bring
    the rest of the team along with you.
  - Shape architecture and technology choices for our platform
    foundations (Kubernetes, CI/CD, IaC on AWS) and for the AI
    capabilities on top, and share your perspective in
    technical discussions.
  - Keep the platform reliable, secure, observable, and cost-
    aware. You'll join the on-call rotation and help
    troubleshoot production incidents.
  - Capture reusable patterns, templates, and blueprints so the
    whole organization moves faster.

  Requirements:

  - Senior-level experience (5+ years) building and operating
    infrastructure or platform products.
  - Hands-on GenAI experience — you've built with LLM APIs,
    tool/function calling, retrieval, agents, or agent
    frameworks and put them into real workflows.
  - Modern AI coding tools (e.g., Claude Code, Codex) are part
    of how you work day to day.
  - Strong AWS fundamentals and a genuine appreciation for
    Infrastructure as Code and Pipeline as Code.
  - A real feel for developer experience — you can look at a
    feature and tell whether it'll make a developer's life
    easier or just add another thing to learn, because you've
    lived that friction yourself.
  - Strong communication and collaboration skills — you work
    well in a team, share your opinions clearly, and can move
    a topic forward with people across functions.
  - Solid engineering fundamentals: testing, debugging, code
    quality, and getting things production-ready.
  - Familiarity with SRE / DevOps principles and observability
    concepts (CloudWatch, Datadog, OpsGenie, or similar).
  - Proficiency in at least one language, ideally Python, Go, or
    TypeScript.
  - A bias for shipping — you're comfortable taking something
    ambiguous and turning it into a working solution with
    sensible scope.

  We offer*:

  - Flexible working format - remote, office-based or flexible
  - A competitive salary and good compensation package
  - Personalized career growth
  - Professional development tools (mentorship program, tech
    talks and trainings, centers of excellence, and more)
  - Active tech communities with regular knowledge sharing
  - Education reimbursement
  - Memorable anniversary presents
  - Corporate events and team buildings
  - Other location-specific benefits

  *not applicable for freelancers
