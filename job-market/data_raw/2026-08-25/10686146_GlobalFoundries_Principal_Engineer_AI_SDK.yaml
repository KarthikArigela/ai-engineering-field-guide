  Sr Principal Engineer AI SDK

  About GlobalFoundries

  GlobalFoundries is a leading full-service semiconductor
  foundry providing a unique combination of design,
  development, and fabrication services to some of the world’s
  most inspired technology companies. With a global
  manufacturing footprint spanning three continents,
  GlobalFoundries makes possible the technologies and systems
  that transform industries and give customers the power to
  shape their markets. For more information, visit www.gf.com.

  About the Role

  MIPS by GF is looking for seasoned AI/ML Sr. Principal
  Software Engineer for a technical lead for Linux based AI
  SDK. In this role you will drive the architecture,
  development, and production of embedded AI software stacks
  on Linux based RISCV AI Hardware architecture. Lead, design
  and build the end-to-end Linux software development kit
  (SDK), including Board Support Packages (BSP), kernel
  drivers, and tooling. Key duties include leading firmware/OS
  bring-up, optimizing neural network acceleration, building
  developer tooling, and bridging SoC hardware with production
  frameworks like PyTorch or TensorFlow This is a senior
  individual contributor role with significant cross-
  functional scope and organizational influence.

  Required Qualifications:

  - BS or MS (preferred) in EE, CE, CS, or equivalent, with 10+
    years in software engineering, hardware architecture,
    Linux based SDK, ML systems, or related fields, and a
    track record of technical leadership.
  - Deep expertise in CPU and SoC architecture — memory
    hierarchies, Linux operating system, open-source software
    development, power management — and how these interact
    with AI/ML workloads.
  - Familiarity with AI compiler infrastructure: MLIR-based
    toolchains, IREE, TVM, TFLite, or equivalent. Establish
    automated testing frameworks, system observability, and
    CI/CD pipelines for continuous SDK integration and
    performance regression testing
  - Effective cross-functional collaborator who can drive
    technical consensus without direct authority, writes
    clearly, and calibrates technical depth for different
    audiences.

  GlobalFoundries is an equal opportunity employer,
  cultivating a diverse and inclusive workforce. We believe
