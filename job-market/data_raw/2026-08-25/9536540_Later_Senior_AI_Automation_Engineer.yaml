description: |
  Later is the world’s most intelligent influencer marketing
  company, built to give brands the confidence to create
  unforgettable campaigns. By combining real creator
  relationships, trusted intelligence, and expert guidance,
  Later removes fear and guesswork from one of marketing’s
  most visible investments.

  Built on a native, AI-powered platform and more than a
  decade of proprietary data—including billions of social
  interactions, impressions, and $2.4B+ in verified
  influencer-driven purchases—Later helps teams understand
  what will work before they launch.

  By combining trusted insight with expert guidance, Later
  removes guesswork from influencer marketing, enabling brands
  to choose the right creators, execute fully managed
  campaigns, and drive meaningful growth across awareness,
  engagement, and revenue. Trusted by leading enterprise
  brands including Nike, Wayfair, Unilever, and Southwest
  Airlines, Later bridges creativity and performance so
  campaigns don’t just look good—they deliver results. Learn
  more at later.com.

  About this position:

  We're hiring an AI Automation Engineer to embed across teams
  at Later, Operations, Finance, Marketing, Customer Success,
  and beyond, and replace manual, repetitive work with durable
  AI-powered tooling.

  This role sits at the intersection of engineer, internal
  consultant, and coach: you'll build the automations that
  move the needle today and level up non-technical colleagues
  to build the next wave themselves. This is a high-leverage
  role for someone who gets energy from solving real business
  problems, ships pragmatic v1s in days rather than months,
  and knows when a scrappy prototype needs to be hardened into
  something the whole org can rely on. You'll work across
  Later's lines of business (Later Influence, Later Social,
  and Mavely), with regular exposure to senior leadership and
  broad visibility into how the company actually runs.

  What you'll be doing:Partnership & Discovery

  - Embed with non-technical stakeholders across Operations,
    Finance, Marketing, Customer Success, and other functions
    to understand their workflows in depth.
  - Surface the highest-impact automation opportunities and
    translate fuzzy, ambiguous problems into clear technical
    solutions.
  - Leave every stakeholder conversation with a sharper problem
    definition than you walked in with.

  Building & Shipping

  - Build automations and internal tools using AI-native
    platforms, scripting, APIs, and whatever else gets the job
    done, pragmatism over purity.
  - Ship working v1s quickly so stakeholders can validate value
    before investment scales.
  - Wire together LLMs, agents, RAG patterns, and prompt design
    with existing systems to deliver real workflow outcomes.

  Scaling & Reliability

  - Take working prototypes and harden them with the
    reliability, observability, error handling, and
    reusability needed for production use.
  - Define when a one-off solution is good enough as-is versus
    when it needs to be promoted into something the whole org
    can rely on.
  - Build the monitoring and documentation that lets automations
    run unattended and recover gracefully when they don't.

  Enablement & Coaching

  - Coach and advise non-technical colleagues who are building
    their own automations: review their work, unblock them,
    and level up their skills over time.
  - Run lightweight enablement (working sessions, office hours,
    shared documentation) that grows the citizen-developer
    community at Later.
  - Communicate technical tradeoffs clearly to non-technical
    audiences and teach others to fish.

  Platform Thinking

  - Identify patterns across teams and build shared components,
    templates, and frameworks that compound the org's
    automation leverage over time.
  - Create reusable building blocks (prompt libraries,
    integration patterns, automation templates) that turn
    individual wins into org-wide capability.
  - Partner with Engineering and IT on the platform decisions
    that make this leverage durable.

  What success looks like:

  - Within your first 6-12 months, success in this role will
    look like:
  - A portfolio of automations in production with documented
    business impact (hours saved, error rates reduced, cycle
    times shortened) across at least three different teams.
  - A measurable lift in the number of non-technical colleagues
    confidently building their own automations, supported by
    templates, documentation, and coaching you've put in
    place.
  - A reusable library of components, patterns, and templates
    that other builders, technical and non-technical, can pick
    up and apply.
  - Recognition as the go-to partner across Operations, Finance,
    Marketing, and Customer Success for 'can this be
    automated?' and 'is this worth automating?' questions.
  - A clear point of view on Later's automation roadmap: what
    the next high-leverage opportunities are, and where the
    platform investments need to land.

  What you bring:

  We are committed to building an inclusive, supportive place
  for you to do the best and most rewarding work of your
  career. If you identify with any of the following, we
  encourage you to apply!

  - A track record of building and shipping automations,
    internal tools, or AI-powered workflows that delivered
    measurable business impact.
  - Strong fluency with modern AI tooling (LLMs, agents, RAG,
    prompt design) and comfort wiring together APIs, scripts,
    and no-code/low-code platforms.
  - A business-first mindset: you start with the problem and the
    user, not the technology, and can sharpen a non-technical
    partner's problem definition through the right questions.
  - Resourcefulness and a bias to action: you ship a working v1
    in days, not months, and iterate from there.
  - An instinct for scale, knowing when something is good enough
    as a one-off versus when it needs to be built to serve the
    whole org.
  - Strong written and verbal communication skills, with the
    ability to explain technical tradeoffs to non-technical
    audiences and coach others to build their own solutions.
  - Experience in an internal-tools, RevOps, BizOps, or 'applied
    AI' function is a plus.
  - A background in supporting or training non-technical
    builders (citizen developers, ops teams running their own
    tooling) is a bonus.
  - Comfort with data: pulling it, cleaning it, and reasoning
    about it.

  How you work:

  - Driven by Impact: You deliver results that
    matter—prioritizing high-value work, meeting deadlines,
    and adapting quickly while keeping outcomes clear.
  - Strategic & Customer-Centric: You anticipate risks and
    opportunities, connect decisions to long-term growth, and
    build trust through proactive insights.
  - Curious & Growth-Oriented: You seek knowledge, ask sharp
    questions, and apply learnings fast—challenging the status
    quo with a mindset of improvement.
  - Collaborative & Resilient: You thrive in change by staying
    resourceful, solution-focused, and positive—removing
    roadblocks, sharing insights, and keeping morale high.
  - Accountable & Honest: You own your work, hold yourself and
    others to a high bar, and use transparent feedback to
    drive growth.
  - Emotionally Intelligent: You build trust through empathy and
    collaboration, foster inclusion, and inspire others with
    grit, optimism, and integrity.

  Our approach to compensation:

  We take a market-based & data-driven approach to
  compensation. We leverage data from trusted third-party
  compensation sources to help us understand the market value
  of a role based on function, level, geographic location, and
  scope. We evaluate compensation bi-annually, including
  performance and market-related factors.

  Our salaries are benchmarked against market Total Cash
  Compensation for the geographic location of our job posting.
  Compensation for some roles is structured as On Target
  Earnings (OTE = base + commission/variable) while for others
  it is structured as Salary only. The salary range listed for
  this role reflects the zones that applies to the location of
  this posting.

  To comply with local legislation and ensure transparency, we
  share salary ranges on all job postings. Skills, experience
  and other factors help determine the final salary we offer
  which may vary from the original range posted.

  Additionally, all permanent team members are eligible to
  participate in various benefits plans as part of their
  overall compensation package.

  $110,000-160,000 CAD

  #LI-Hybrid

  Where we work:

  We have offices in Boston, MA; Vancouver, BC; and Vancouver,
  WA. For select positions, we are open to hiring fully remote
  candidates. We post our positions in the location(s) where
  we are open to having the successful candidate be located.

  Diversity, inclusion, and accessibility:

  At Later, we are committed to fostering a culture rooted in
  an inclusion-first mindset at every level of the company,
  embracing the importance of hiring and building teams for
  culture add rather than culture fit. We openly build and
  maintain unbiased hiring, pay, and promotion practices to
  create a foundation for an equitable workplace, paving the
  way for systemic change.

  We are committed to creating a diverse environment and are
  proud to be an equal opportunity employer. All applications
  will receive consideration for employment without regard to
  race, color, religion, gender, gender identity or
  expression, national origin, disability, or age. Please let
  us know if you require any accommodations or support during
  the recruitment process.
