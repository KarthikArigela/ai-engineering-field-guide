description: |
  As an AI Engineer, you will:

  - Design, develop, and deploy AI and Machine Learning
    solutions to solve complex business problems.
  - Build, train, test, and optimize machine learning models
    using Azure Machine Learning (Azure ML).
  - Develop and implement AI Agents for automation, decision-
    making, and intelligent workflows.
  - Collaborate with cross-functional teams in an Agile/Scrum
    environment to deliver high-quality AI-driven solutions.
  - Translate business requirements into scalable AI and ML
    models.
  - Ensure AI models are production-ready, monitored, and
    continuously improved.
  - Work closely with developers, data engineers, and product
    teams to integrate AI solutions into applications and
    platforms.

  What You Bring to the Table:

  - 6–8 years of overall experience in AI, Machine Learning, or
    related engineering roles.
  - Strong hands-on experience as an AI Engineer.
  - Proven expertise in Azure Machine Learning (Azure ML) for
    model development and deployment.
  - Practical experience working with AI Agents and intelligent
    automation systems.
  - Solid understanding of Agile ways of working, including
    sprint planning, reviews, and retrospectives.

  You should possess the ability to:

  - Analyze complex data and identify opportunities for AI-
    driven solutions.
  - Build and optimize machine learning models with a focus on
    accuracy, scalability, and performance.
  - Design intelligent AI agents that support automation and
    advanced decision-making.
  - Work effectively in fast-paced, Agile digital environments.
  - Continuously learn and adapt to emerging AI technologies and
    best practices.

  What We Bring to the Table:

  - Opportunity to work on advanced AI and Machine Learning
    initiatives.
  - Exposure to modern cloud-based AI platforms, particularly
    Azure ML.
  - A collaborative Agile digital environment that encourages
    innovation.
  - Challenging projects involving AI Agents and intelligent
    systems.

