description: |
  This is a remote position.





  Ayrin Digital is looking for a Full Stack Software Engineer
  who operates like a product builder—not just a feature
  implementer.



  This role is ideal for someone who is comfortable working
  across frontend, backend, infrastructure, and collaborating
  on product development, with a strong focus on building AI-
  powered systems.



  You will be expected to bring a strong product mindset and
  take ideas from concept to production-ready solutions.



  This is a high-ownership role where engineering, product
  thinking, and AI expertise come together.

   Key Responsibilities: 1. End-to-End Development


  - Build scalable, production-ready features across the stack
  - Own delivery from UI → backend → deployment

   2. Product Collaboration


  - Work closely with Product Owners and SMEs
  - Contribute to improving usability, performance, and business
    outcomes

   3. Full Stack Development


  - Frontend: React, Next.js
  - Backend: Node.js, NestJS
  - Database: PostgreSQL
  - Cloud: AWS

   4. AI-Powered Systems


  - Build AI-driven features that deliver real value
  - Design AI workflows using LLMs and automation tools

   5. AI Development & Optimization


  - Implement AI skills and workflows
  - Work with tools like Claude, OpenRouter, LangChain, n8n
  - Optimize latency, cost, and performance
  - Integrate multiple AI models where needed

   6. AI-Enabled Engineering


  - Use AI tools to accelerate development
  - Define best practices for AI-assisted coding

   7. Scalable Architecture


  - Design flexible, scalable systems
  - Balance speed with long-term maintainability








  Requirements

   Required Skills: Core Engineering


  - Strong experience with:
    - React, Next.js
    - Node.js, NestJS
    - PostgreSQL
  - Experience with APIs, microservices, distributed systems
  - Strong understanding of AWS or cloud infrastructure

   AI / ML Expertise


  - Hands-on experience with LLMs
  - Experience with:
    - Prompt engineering
    - Model selection & evaluation
    - Performance & cost optimization
  - Familiarity with:
    - Claude, OpenRouter, LangChain
    - Multi-model orchestration
  - Experience building AI systems in production

   Product Mindset


  - Strong focus on usability and product quality
  - Ability to convert ideas into working solutions
  - Experience collaborating with product teams

   AI-Enabled Development


  - Experience using AI tools in development workflows
  - Understanding of where AI adds value

   Nice to Have:


  - Experience with CrewAI or similar frameworks
  - Exposure to Hugging Face / open-source LLMs
  - Experience with RAG pipelines and vector databases
  - Background in data engineering
  - CI/CD, DevOps, observability
  - Startup / 0→1 product experience
  - Polyglot experience (Python, Java, .NET)

   What Success Looks Like:


  - Delivering high-quality, AI-enabled features end-to-end
  - Translating product ideas into shipped solutions
  - Building scalable systems
  - Driving effective use of AI across engineering



  BenefitsWhy Join Us:

  This role is at the intersection of engineering and product
  innovation. You’ll work on building real-world AI-powered
  products and have a direct impact on business outcomes.
