  Junior AI Developer

  Full Time | Delhi | 1-2 Years Experience

  About CivicDataLab

  We, at CivicDataLab, work at the intersection of data,
  technology, design and social science to strengthen access
  to public information, evidence-based decision-making and
  citizen participation in governance. CivicDataLab (CDL)
  harnesses the potential of open knowledge movements to
  strengthen the data-for-public-good ecosystem and enable
  citizens to engage in matters of public reform. We work
  closely with governments, non-profits, think tanks, media
  houses and universities to enhance their data and technology
  capacity to better data-driven decision-making at scale.

  Our current areas of expertise include digital public goods
  & infrastructure (DPGs & DPI), climate change, public
  finance, urban development, open contracting and law &
  justice. We have co-created digital public goods and
  emerging technology solutions like open data platforms, data
  exchanges, data science models and citizen-led apps for
  improving participatory data-driven governance in India and
  other countries.

  Responsible AI At CivicDataLab

  Our work in the Responsible AI space spans the following
  areas:

  - Participatory evaluation of multilingual AI systems in high-
    risk domains, sourcing
  - Onboarding datasets for low-resource Indian languages to
    make AI more linguistically inclusive,
  - Applied research in model compression to make capable AI
    accessible in resource-constrained settings.
  - We also work on AI applications for disaster risk reduction
    and run skilling initiatives to build responsible AI
    literacy among practitioners and communities.

  RequirementsJob Summary

  LLMs · Multilingual AI · Applied NLP · AI Evaluations ·
  Rapid Prototyping · Chatbot Development · Agentic AI

  We are looking for a Junior AI Developer to join our growing
  Responsible AI team. You will work closely with our AI
  Engineer, contributing hands-on to building AI systems,
  developing prototypes, and supporting applied research
  across CDL's active projects. This role is ideal for someone
  who is technically sharp, curious about applied AI in the
  public sector, and comfortable working independently on
  well-scoped tasks.

  Key Responsibilities

  - Implement and experiment with prompting strategies,
    retrieval architectures, and LLM integrations across CDL's
    active projects
  - Develop and iterate on multilingual conversational AI
    interfaces for CivicDataLab's use cases
  - Build and maintain RAG pipelines for document-heavy datasets
  - Assess and improve dataset readiness for NLP tasks,
    including schema alignment and metadata tagging, using
    standards like Croissant
  - Build evaluation modules to measure model outputs for
    hallucination, bias, safety, and privacy issues across
    multilingual and domain-specific contexts

  Essential Qualifications

  - Education: Bachelor's or Master's in Computer Science,
    Engineering, or a related field with a focus on machine
    learning and/or NLP
  - Experience: 1-2 years as an AI/ML engineer, data scientist,
    or software engineer
  - Working knowledge of LLMs, embeddings, RAG workflows,
    chatbots and agentic architectures
  - Proficiency with Python
  - Comfortable working across multiple projects with some
    autonomy, and communicating proactively about progress and
    blockers

  Good to Have

  - Familiarity with Indic languages or prior work on
    multilingual/low-resource NLP
  - Ability to scope loosely defined ideas into small, testable
    prototypes without needing fully specified requirements
  - Interest in responsible AI, fairness, safety, transparency,
    or AI policy
  - Research curiosity, comfortable in reading papers,
    reproducing results, or translating research ideas into
    working prototypes
  - Exposure to open government data, civic tech, or public
    sector AI applications

  Benefits

  Cost to Organisation(CTO) range  INR 6.5–7.5 LPA

  The overall compensation package includes fixed
  remuneration, statutory benefits, and performance-linked
  components, in accordance with organisational policies. A
  portion of the annual compensation is linked to continuity
  with the organisation and achievement of agreed performance
  expectations. Exceptional performance may also be eligible
  for additional incentives under the organisation's reward
  and recognition framework.

  The organisation also provides professional development
  support, wellness benefits, and other resources to enable
  employees to perform effectively and grow in their roles.

  Our Commitment to Diversity

  We are committed to inclusive hiring and strongly encourage
  applicants from diverse and under-represented gender and
  caste identities and/or sociocultural backgrounds to apply
  for this role. Our organisational policies are gender-
  neutral, including the POSH policy and leave policy. We
  provide 6 months of paid time off as parental leave for the
  primary caregiver and 6 weeks of paid time off for the
  secondary caregiver, including adoption.
