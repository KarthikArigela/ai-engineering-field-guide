description: |
  𝗧𝗵𝗶𝘀 𝗿𝗼𝗹𝗲 𝗶𝘀 𝗳𝗼𝗿 𝗼𝗻𝗲 𝗼𝗳 𝘁𝗵𝗲 𝗪𝗲𝗲𝗸𝗱𝗮𝘆'𝘀 𝗰𝗹𝗶𝗲𝗻𝘁𝘀

  𝗦𝗮𝗹𝗮𝗿𝘆 𝗿𝗮𝗻𝗴𝗲: 𝗥𝘀 𝟲𝟱𝟬𝟬𝟬𝟬𝟬 - 𝗥𝘀 𝟴𝟱𝟬𝟬𝟬𝟬𝟬 (𝗶𝗲 𝗜𝗡𝗥 𝟲𝟱-𝟴𝟱 𝗟𝗣𝗔)

  Experience: 10+ yrs

  Location: Bengaluru, Karnataka, India

  Job Type: Full-time

  We are looking for an experienced Java Tech Lead to lead the
  design, development, and delivery of scalable, secure, and
  high-performance enterprise applications. The role combines
  hands-on Java development, technical leadership,
  architecture, and team management, with a strong focus on
  modern backend engineering and distributed systems.

  The ideal candidate will have deep expertise in Java, Spring
  Boot, Microservices, REST APIs, Kafka, and databases, along
  with proven experience mentoring engineering teams and
  driving technical excellence across the software development
  lifecycle.

  RequirementsKey Responsibilities

  - Lead and mentor a team of Java engineers throughout the
    software development lifecycle.
  - Design, develop, and maintain enterprise applications using
    Java, Spring Boot, and Microservices.
  - Architect scalable, secure, and high-performance RESTful
    APIs and distributed applications.
  - Define technical architecture, coding standards, development
    practices, and engineering guidelines.
  - Conduct detailed code reviews to ensure quality, security,
    maintainability, and performance.
  - Guide engineers in designing distributed systems and
    implementing messaging solutions using Apache Kafka.
  - Collaborate with frontend teams on full-stack feature
    delivery using ReactJS, where required.
  - Design, optimize, and maintain MongoDB and relational
    database schemas, queries, and performance.
  - Drive CI/CD automation and release processes using Jenkins.
  - Work closely with Architecture, Product, QA, Business
    Analysis, and DevOps teams to ensure successful project
    delivery.
  - Estimate development efforts, plan sprint activities, manage
    technical dependencies, and identify delivery risks.
  - Mentor junior and mid-level engineers through technical
    guidance, code reviews, and knowledge-sharing sessions.
  - Troubleshoot complex production issues and provide technical
    leadership during critical releases.
  - Communicate technical decisions, project status, risks, and
    delivery progress to stakeholders and onshore teams.
  - Continuously improve application architecture, engineering
    practices, performance, security, and scalability.
  - Contribute to Agile/Scrum ceremonies and promote a culture
    of ownership and continuous improvement.

  What Makes You a Great Fit

  - 10+ years of hands-on experience in Java software
    development, with at least 3+ years in a Tech Lead or
    equivalent technical leadership role.
  - Expert-level knowledge of Java, Spring Boot, Spring MVC,
    Spring Data JPA, and Microservices architecture.
  - Strong experience designing and developing scalable RESTful
    APIs.
  - Good working knowledge of ReactJS and full-stack application
    development.
  - Strong experience with MongoDB and relational databases such
    as PostgreSQL, MySQL, Oracle, or SQL Server.
  - Hands-on experience with Apache Kafka or similar messaging
    platforms.
  - Experience designing and implementing CI/CD pipelines using
    Jenkins.
  - Strong understanding of object-oriented programming, design
    patterns, clean code, and software engineering principles.
  - Experience with Git and modern version-control practices.
  - Knowledge of Docker and Kubernetes is an advantage.
  - Exposure to cloud platforms such as AWS, Azure, or GCP is
    desirable.
  - Proven ability to lead, mentor, and develop high-performing
    engineering teams.
  - Strong problem-solving, analytical, and debugging
    capabilities.
  - Excellent communication and stakeholder-management skills.
  - Ability to drive technical discussions and influence
    architecture and engineering decisions.
  - Strong ownership mindset with the ability to manage multiple
    priorities in a fast-paced environment.
  - Experience working in Agile/Scrum development environments.
  - Experience in Financial Services, Banking, or Capital
    Markets is preferred.
  - Bachelor's or Master's degree in Computer Science,
    Information Technology, Engineering, or a related
    discipline is preferred.
