title: Senior Automation Test Engineer (AI-enabled QE)
company: Zensar Technologies
location: Hyderabad, IND
work_type: FULL_TIME
company_size: 10,000 Employees
description: |
  We are seeking a highly skilled Senior Automation Test
  Engineer to join the Quality Engineering team. The ideal
  candidate will bring strong expertise in automation testing
  along with hands-on experience or strong interest in
  leveraging AI-driven approaches to accelerate QE
  initiatives. This role requires seamless collaboration with
  a client team and the ability to quickly onboard and
  contribute.

  Responsibilities

  - Design, develop, and maintain scalable automation frameworks
    and test suites
  - Collaborate with QE leads and developers to ensure quality
    deliverables
  - Leverage AI/ML or intelligent automation tools to improve
    test efficiency, coverage, and execution speed
  - Analyze requirements and define automation strategy aligned
    with project goals
  - Execute automated test suites and ensure defect tracking,
    reporting, and resolution
  - Participate in CI/CD integration and ensure continuous
    testing practices
  - Drive innovation in QE through adoption of modern tools,
    frameworks, and AI accelerators
  - Provide mentorship and technical guidance to junior team
    members (if required)

  Qualifications

  - Bachelor’s degree in engineering, or related field
  - 10-15 years of experience in software testing with strong
    focus on test automation
  - Hands-on expertise in automation tools such as Selenium,
    Cypress, Playwright, or similar
  - Strong programming skills (Java / Python / JavaScript)
  - Experience with CI/CD tools (Jenkins, Azure DevOps, GitHub
    Actions, etc.)
  - Solid understanding of SDLC, STLC, Agile methodologies
  - Experience working in distributed/vendor-based team
    environments
  - Strong analytical, problem-solving, and communication skills

