description: |
  Overview

  Microsoft Dynamics 365 is a suite of easy-to-learn and easy-
  to-use business solutions tailored to any market, designed
  for any business size, and dedicated to growing business
  through happy customers. The Customer Service Applications
  Team delivers business applications for Connected Customer
  Care for Contact Centers. We are building the next
  generation of our applications with cutting edge AI
  technology and AI Agentic development  to deliver high
  value, complete, and predictive application scenarios across
  all devices and form factors.

  As an Senior AI Engineer in the Microsoft Dynamics Customer
  Experience Applications team, you will contribute to the
  design and implementation of intelligent solutions within
  Dynamics 365 by applying both software engineering and AI
  skills. You’ll work closely with senior engineers, business
  stakeholders, and partners to help build scalable,
  production-ready systems that leverage AI to address real-
  world business challenges.

  In this role, you are expected to demonstrate strong
  software engineering fundamentals -including coding,
  testing, and deployment - while integrating and optimizing
  AI models and frameworks. You will contribute to delivering
  solutions that are reliable, impactful, and innovative, with
  mentorship and guidance from more senior team members.

  We innovate and collaborate closely with our partners and
  customers in a very agile environment. If the opportunity to
  collaborate with a diverse engineering team, on enabling
  end-to-end business scenarios using cutting-edge
  technologies and to solve challenging problems for large
  scale 24x7 business SaaS applications excite you, we would
  love to talk to you!

  Responsibilities

  As software engineer with applied AI focus in the Microsoft
  Dynamics Customer Experience Applications team, you will
  apply both software engineering and AI expertise to build
  intelligent, scalable solutions that power Dynamics 365
  services used globally. You’ll collaborate with cross-
  functional teams to deliver high-impact features aligned
  with enterprise standards and cloud-scale requirements. Your
  responsibilities include:

  - Envision, Design, implement, test, deploy, maintain, and
    improve our software components and services

  - Develop highly usable, scalable application capabilities,
    integrating AI models and enhancing existing features to
    meet evolving customer needs.
  - Optimize AI model performance and reliability in production
    environments, including retraining, evaluation, and
    continuous monitoring.

  - Embrace and use state-of-the-art new technologies
  - Participate in technical discussions and bring new ideas on
    the table
  - Own quality of your code and fully leverage AI development
    tools to accelerate development
  - Work with Product Managers, Architects and UX Designers to
    design and specify new features from the engineering
    standpoint
  - Develop software that empowers customers to optimize their
    business processes
  - Work with key customers to enable faster adoption and meet
    their business goals
  - Contribute to the positive, solution focused and creative
    team spirit
  - Support less experienced team members in their progress and
    development

  Throughout your tasks, you will work closely with Program
  Managers and other Software Engineers to optimize design,
  quality and functionality as Microsoft places a premium on
  the ability to work well in a team environment.

  Qualifications

  - Expert knowledge on building responsive and engaging front
    end and scalable backend
  - 8+ years professional software development with at least one
    of the following C#/C++/Java
  - 8+ years of professional experience building cloud
    applications focused on front end development using
    technologies like React/JavaScript/TypeScript/CSS/HTML
  - 3+ years of experience with GenAI, LLMs, or agentic systems
  - Experience with design and implementation of enterprise-
    scale services
  - Experienced in architecting, building, and maintaining UX
    component libraries that adhere to modern web standards.
  - Experience delivering Dynamics 365 and/or Power Platform
    solutions desirable
  - Strong Experience in AI Agentic development and leveraging
    AI Development
  - Excellent verbal, written, and cross-team collaboration
    skills are essential to succeed in this role.
  - A strong team player and collaborator, across time zones and
    diverse stakeholder groups.
  - Passion for improving software quality and engineering
    excellence.
  - Experience in developing, debugging, and supporting code in
    object-oriented languages and database querying languages.
  - Experience with building infrastructure using Microsoft
    Azure technology like Service Fabric, App Service, Docker.

