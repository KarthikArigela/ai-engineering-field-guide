  JOB DESCRIPTION

  As a Senior Software Engineer embedded in an energetic agile
  team of Software and QA Engineers, you will be part of the
  team in creating software products utilizing React and Java
  technologies. You will be hands on, involved in designing
  applications and flexible services that expose core
  capabilities to different applications and user bases, to
  achieve the vision through technical decision-making, and
  facilitating company-wide collaboration. All of this will be
  accomplished with cutting edge, lean-agile, software
  development methodologies. Our culture fosters
  collaboration, innovation, integrity, mentorship, commitment
  to success and fun. Our managers are dedicated to growing
  their people and offering an opportunity that allows you to
  make impact in your career.

  Key Responsibilities:

  Essential job functions included but are not limited to the
  following:

  ·         Responsible for developing new features, enhancing
  existing features. Responsible for production.

  ·         Engage with product team to understand business
  requirements, processes, and pain points.

  ·         Convert business requirements into technical
  implementation.

  ·         Take ownership of the full development lifecycle,
  ensuring adherence to timelines and quality standards.

  ·         Actively leverages AI-assisted development tools
  and multi-agent workflows throughout the SDLC to accelerate
  delivery, improve code quality, and reduce cycle time —
  while applying rigorous prompt engineering, spec-driven
  design, and enterprise-grade governance to ensure all AI-
  generated contributions meet security, privacy, and
  performance standards.

  ·         Conduct code reviews to ensure adherence to best
  practices and optimize performance, scalability, and
  security.

  ·         Work with cross-functional teams, including UX/UI
  designers, QA engineers, and product owners, to ensure
  seamless integration of front-end and back-end services.

  ·         Maintain clear technical documentation for the
  solutions built to ensure ease of knowledge transfer and
  maintenance.

  ·         Troubleshoot issues across the whole stack - OS,
  DB, applications, JavaScript, and network.

  ·         Guide junior developers on React and JAVA best
  practices. Share what they know by mentoring other team
  members.

  Required Technical Skills:

  ·         Frontend Development

  o    Build dynamic, responsive, and user-friendly interfaces
  using React.

  o    Collaborate with UI/UX designers to translate
  wireframes into functional applications.

  o    Optimize front-end performance and ensure cross-browser
  compatibility.

  ·         Backend Development

  o    Design, develop, and maintain enterprise applications
  using Java, Struts, Spring Boot, Hibernate, JSP, and
  Servlets.

  o    Implement business logic and database interactions with
  Oracle 19c.

  o    Develop RESTful APIs and microservices for distributed
  systems.



  ·         AI Augmentation:

  o    Drive the end-to-end software development by actively
  utilizing modern AI-assisted development toolkits (e.g.,
  GitHub Copilot, Claude Code etc.) to optimize daily coding
  velocity and documentation.

  o    Utilize AI diagnostics to accelerate root-cause
  analysis and triage bugs across the entire application
  stack.

  o    Demonstrate strong prompt-engineering habits.

  o    Demonstrate curiosity and willingness to learn modern
  AI-native engineering practices and emerging AI development
  tools.

  o    Critically review, audit, and benchmark AI-assisted
  code contributions against rigorous enterprise performance,
  data privacy, and security standards before production
  rollout.

  ·         Database Management

  o    Write efficient SQL queries, stored procedures, and
  triggers in Oracle 19c.

  o    Perform database tuning

  ·         Messaging & Integration

  o    Implement asynchronous communication and message-driven
  architectures using RabbitMQ.

  o    Integrate distributed systems and ensure reliable
  message delivery.

  ·         System Architecture & Design

  o    Collaborate with architects to design scalable, secure,
  and maintainable solutions.

  o    Apply design patterns and best practices in enterprise
  application development.

  ·         Collaboration

  o    Work closely with cross-functional teams including QA,
  DevOps, and Product Owners.

  o    Provide mentorship and technical guidance to junior
  developers.

  ·         Testing & Deployment

  o    Write unit and integration tests to ensure code
  quality.

  o    Participate in CI/CD pipelines for automated builds and
  deployments.

  Nice to have skills:

  ·         Performance Optimization

  o    Proven ability to optimize React applications using
  lazy loading, code splitting, and efficient state management
  techniques to improve application performance.



  ·         Version Control & CI/CD:

  o     Proficiency with Git and experience in managing
  feature branches and release cycles using GitLab.

  o    Experience setting up CI/CD pipelines for automated
  testing, building, and deploying React applications using
  tools like GitLab.



  ·         Collaboration:

  o    Collaboration Tools:

  §  Proficiency in using tools like Rally and Teams to manage
  Agile workflows and communicate effectively across global
  teams.

  o    Agile Methodologies:

  §  Experience working in Agile/Scrum environments, actively
  participating in sprint planning, retrospectives, and
  iterative development cycles.



  ·         Platform/Tools:

  o    Experience with AWS cloud platforms (EC2, S3 etc),
  Terraform.

