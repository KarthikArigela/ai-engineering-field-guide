description: |
  Build financial products that help credit union members move
  forward.

  Meridianlink Coach powers adverse action notices, warm-
  decline journeys, credit monitoring, and the portals used by
  members and credit union teams. Our products handle real
  financial data and high-stakes moments, so thoughtful
  engineering matters.

  How we work

  AI agents are part of our engineering workflow, not an
  experiment. They handle meaningful implementation work;
  engineers set direction, review the output, and own what
  ships. You will use our agents, improve them, and help build
  what comes next.

  What you'll do

  - Own member- and credit-union-facing features from idea
    through production, planning pragmatic solutions for
    rising traffic and data volume.
  - Build across our TypeScript stack: React 19, React Router 7,
    Tailwind CSS, Hono, and Drizzle/Postgres, with AWS
    infrastructure managed through SST/Pulumi across Lambda,
    SQS, EventBridge, and S3. Experience with Terraform, AWS
    CDK, or similar infrastructure-as-code tools transfers
    well.
  - Turn product needs into simple, reliable experiences and
    integrations.
  - Monitor production, investigate issues, and improve what you
    ship.
  - Partner with design, customers, and stakeholders to make
    practical product decisions.

  What you bring

  - 5+ years building, scaling, and running production software.
  - Strong full-stack skills, with depth in modern front-end
    development and typed backend systems.
  - Experience building reliable products with React and
    relational data, including integrations with third-party
    and public APIs such as OpenAI or Anthropic Claude.
  - Current, hands-on experience using AI coding tools and
    reviewing their output.
  - Strong product judgment, clear written communication, and a
    bias toward simple solutions.
  - The autonomy to own outcomes and the judgment to bring
    others in when it matters.

  We use Bun, Vitest, and Playwright for development and
  testing; exact tool overlap matters less than strong product
  engineering fundamentals.

  If you want broad ownership, contact with users, and a
  chance to shape AI-native product engineering, we'd love to
  hear from you.
