description: |
  This is a remote position.



      Roxonn is seeking innovative AI/ML Developers and Full-
  Stack Engineers to contribute to a groundbreaking feature on
  our platform: the "AI Task Master." Your work will help
  simplify project onboarding for users by leveraging
  Generative AI to break down high-level ideas into actionable
  tasks. This is a paid bounty opportunity to make a
  significant impact on a core platform module.







  Requirements

      Roxonn is building a Decentralized Software Organization
  (DSO) on the XDC Network. Our mission is to revolutionize
  how software is developed and how talent is rewarded
  globally. We connect businesses and open-source projects
  with skilled contributors, using blockchain for transparent
  funding, task management, and instant crypto-based rewards
  (XDC and future ROXN tokens). Roxonn aims to create a fair,
  efficient, and accessible ecosystem for decentralized
  collaboration.


  Task Description (Based on GitHub Issue #1):

  Contribute to the Minimum Viable Product (MVP) of the "AI
  Task Master" feature:



  - Develop backend services to take a user's project
    description (text input or .txt/.md file) and interface
    with a configured GenAI model (e.g., OpenAI, Anthropic
    API).
  - Implement AI-powered task decomposition logic to analyze the
    project description and generate a structured list of
    suggested task titles and brief descriptions.
  - Develop frontend components within the Roxonn platform
    (React/TypeScript) for users to input their project idea
    and then view, edit, add, delete, and reorder the AI-
    generated task list.
  - Ensure basic error handling for AI model API calls and file
    processing.
  - (Refer to GitHub Issue #1 for full MVP scope and acceptance
    criteria).

  Required Skills:



  - Backend Development (Node.js/TypeScript, Express.js).
  - Frontend Development (React/TypeScript).
  - Experience with Generative AI / LLM API Integration (e.g.,
    OpenAI, Anthropic, LangChain).
  - Strong understanding of Prompt Engineering principles.
  - Ability to design and implement RESTful APIs.
  - Familiarity with data structures and algorithms for task
    processing.
  - Basic understanding of project management concepts (task
    breakdown).
  - (Optional but helpful) UX/UI design sensibility for the task
    editing interface.






  Benefits

  About Roxonn:

  Roxonn connects GitHub with the XDC blockchain, creating a
  platform where developers and creators earn cryptocurrency
  (XDC tokens, and soon ROXN) for their open-source and
  project contributions. We're proud to be part of the XDC
  Finternet Accelerator Program at T-Hub, driving innovation
  in the Web3 space.

  Our Unique Approach:

  Contribute to impactful open-source projects, showcase your
  skills to a global audience, build your professional
  portfolio with verifiable achievements, and get rewarded in
  cryptocurrency. Exceptional contributors to the Roxonn
  Platform may be considered for core team roles or ongoing
  collaborations as we grow.

  Platform Information: How Rewards Work



  - What is this rewards system? Roxonn rewards contributions
    with XDC tokens (and soon our native ROXN token), a
    cryptocurrency earned by completing tasks (bounties) on
    our platform.
  - How it works:



  - Sign in to the Roxonn platform with your GitHub account (a
    compatible XDC wallet is auto-created or can be linked).
  - Choose a task (like this one, detailed in GitHub Issue #1)
    from our project.
  - Submit your work via a Pull Request on GitHub, linking it to
    the issue (e.g., "Closes #1").
  - Upon review, approval, and merge of your PR, XDC tokens for
    the bounty are sent directly to your wallet on the Roxonn
    platform.



  - What can you do with XDC? Earned XDC tokens are
    transferable. You can send them to other XDC wallets, use
    them within the XDC ecosystem, or exchange them for
    INR/other fiat currencies on platforms that support XDC.

  Learn More:



  - Find this task on GitHub: https://github.com/Roxonn-
    FutureTech/Roxonn-Platform/issues/1
  - Watch our process video on LinkedIn or email us with
    questions: connect@roxonn.com

