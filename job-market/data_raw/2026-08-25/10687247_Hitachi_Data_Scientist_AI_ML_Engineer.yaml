  Job Description:

  Job Title:  Data Scientist / AI & ML Engineer

  Designation:  Researcher / Senior Research Engineer

  Company: Hitachi India Pvt Ltd.

  Location: Bengaluru, Karnataka, India

  Salary: As per Industry



  Company Overview:

  Hitachi India Pvt. Ltd. (HIL) markets and sells a wide range
  of products/services ranging from Information &
  Telecommunications Systems, Digital Solutions & Services,
  Infrastructure Systems, Industrial Systems like Water, Oil &
  Gas supply and management to Transportation and Urban
  Development Systems. Together with further localization,
  Hitachi aims to contribute to developing a sustainable
  society in India as well as contributing to the country's
  economic growth.

  Role Overview:

  We are looking for a highly motivated Data Scientist / AI &
  ML Engineer to design, develop, and deploy scalable AI-
  driven solutions for real-world digital services challenges.
  The role involves working at the intersection of research
  and engineering to build production-ready systems, rapid
  prototypes, and innovative AI models.

  Job Roles & Responsibilities:

  - Design and develop AI/ML solutions to address customer and
    business problems.
  - Build, train, and deploy machine learning and deep learning
    models across use cases.
  - Build and deploy LLM-powered applications using techniques
    such as prompt engineering, RAG (Retrieval-Augmented
    Generation), and fine-tuning.
  - Develop scalable data architectures for large-scale data
    processing and analytics
  - Set up and manage big data environments for rapid
    prototyping (on-premises and cloud)
  - Design and develop agentic AI systems (multi-agent
    workflows, tool-using agents, autonomous decision loops)
  - Collaborate with cross-functional teams to translate
    business requirements into technical solutions
  - Build and maintain robust data pipelines using modern data
    engineering tools
  - Optimize performance, reliability, and scalability of data
    and ML systems
  - Enable seamless data access for researchers across
    programming environments
  - Stay updated with the latest advancements in AI/ML, data
    engineering, and financial technologies
  - Contribute to research initiatives, PoCs, and innovation-
    driven projects

  Required Skills:

  - Strong hands-on experience in machine learning, statistical
    analysis, and data modeling
  - Solid experience with big data technologies (Hadoop
    ecosystem, Spark, etc.)
  - Proficiency in Python, R, or Shell scripting
  - Experience with cloud platforms: AWS / Azure / Google Cloud
  - Strong programming skills in Java and/or Scala
  - Experience with RDBMS (MySQL, PostgreSQL) and NoSQL
    databases (MongoDB, etc.)
  - Experience building data pipelines using tools like Kafka,
    Flume, Spark
  - Familiarity with DevOps tools (Jenkins, CI/CD pipelines,
    containerization)
  - Experience in distributed systems and large-scale
    application development
  - Knowledge of data visualization/BI tools (Tableau, Power BI,
    etc.)
  - Strong problem-solving, communication, and stakeholder
    management skills
  - Experience working in Agile environments

  Preferred Skills:

  - Master’s degree in Computer Science or related field
  - Experience in Deep Learning and advanced AI techniques
  - Proven experience in building prototypes and production-
    grade PoCs
  - Exposure to financial services or fintech domain (preferred)
  - Experience with MLOps frameworks and model lifecycle
    management
  - Experience designing multi-agent systems and autonomous
    workflows
  - Exposure to fine-tuning, RLHF, or model optimization
    techniques
  - Experience with evaluation frameworks for LLMs

  Experience: 5+ years of relevant experience

  Education: Bachelor’s degree in computer science or related
  field.



