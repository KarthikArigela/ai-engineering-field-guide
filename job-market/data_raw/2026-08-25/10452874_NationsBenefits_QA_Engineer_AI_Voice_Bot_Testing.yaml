description: |
  Job Title: QA Engineer – AI Voice Bot Testin

  Experience: 5+ Years

  Location: Hyderabad, India

  Employment Type: Full-time

  About NationsBenefits:

  At NationsBenefits, we are leading the transformation of the
  insurance industry by developing innovative benefits
  management solutions. We focus on modernizing complex back-
  office systems to create scalable, secure, and high-
  performing platforms that streamline operations for our
  clients. As part of our strategic growth, we are focused on
  platform modernization — transitioning legacy systems to
  modern, cloud-native architectures that support the
  scalability, reliability, and high performance of core
  backoffice functions in the insurance domain.

  Role Summary: We are looking for a skilled and detail-
  oriented QA Engineer to support testing activities for AI-
  powered voice bot solutions. The QA Engineer will work
  closely with the Testing Lead, Product team, Operations
  team, and Development team to validate business
  functionality, conversational workflows, and system
  integrations.The ideal candidate should have strong
  experience in software testing, automation, and production
  support, along with the ability to create and execute test
  cases based on Business Documents (BDs) and functional
  requirements.

  Key Responsibilities: Functional & Business Testing • Review
  Business Documents (BDs), user stories, and functional
  requirements to create test cases and test scenarios. •
  Execute functional, regression, integration, and user
  acceptance testing for AI voice bot applications. • Validate
  conversational flows, business rules, API integrations, and
  escalation workflows. • Ensure voice bot responses and
  workflows align with business and operational requirements.
  Collaboration & Coordination • Work closely with: o Testing
  Lead for test planning and execution activities. o
  Operations teams to understand customer interaction flows
  and business processes. o Product teams to validate feature
  requirements and acceptance criteria. o Development teams
  for defect tracking and issue resolution. • Participate in
  sprint planning, requirement reviews, and release
  activities. Automation & AI Testing Support • Support
  development and execution of automation test scripts and AI-
  driven testing solutions. • Assist in testing AI voice bots
  for: o Intent recognition o Response validation o Workflow
  accuracy o Business functionality • Contribute to improving
  automation coverage and testing efficiency. Defect
  Management & Reporting • Identify, log, track, and retest
  defects using defect management tools. • Prepare test
  execution reports and communicate testing status to the
  Testing Lead. • Support production validation and post-
  release monitoring activities.

   Required Qualifications: • 5+ years of experience in
  Software Testing, Application Support, or QA Engineering. •
  Strong understanding of software testing methodologies and
  QA processes. • Experience creating and executing test cases
  from Business Documents (BDs) and functional requirements. •
  Experience in functional testing, regression testing,
  integration testing, and API testing. • Exposure to AI Voice
  Bots, Chatbots, IVR systems, or Conversational AI platforms.
  • Knowledge of automation testing tools such as Selenium,
  Cypress, Playwright, or similar. • Familiarity with
  Agile/Scrum methodologies. • Strong analytical and
  communication skills.

   Preferred Skills: • Experience with Conversational AI
  platforms such as Dialogflow, Amazon Lex, or Microsoft Bot
  Framework. • Exposure to NLP and speech-to-text testing. •
  Knowledge of SQL, API testing tools (Postman, Swagger), and
  defect tracking tools (JIRA, Azure DevOps). • Experience
  supporting production releases and troubleshooting issues.
  Reporting Structure • Reporting To: Testing Lead / QA Lead •
  Team Collaboration: Product, Operations, Development, and
  Support Teams Success Metrics • Accurate and comprehensive
  test execution. • Reduced production defects and improved
  release quality. • Increased automation coverage and testing
  efficiency. • Timely defect identification and resolution
  support. • Improved voice bot performance and customer
  experience.
