title: Developer Experience Engineer II and/or Senior Developer Experience Engineer - AI Frameworks
company: Microsoft
location: USA
remote: true
work_type: FULL_TIME
description: |
  Overview

  The Artificial Intelligence Frameworks team (AIFX) at
  Microsoft develops the software used to optimize and deploy
  the world’s most advanced AI models on Microsoft's AI
  supercomputers. The pace of innovation in AI is
  unprecedented, with new models, architectures, hardware
  platforms, and optimization techniques emerging
  continuously. To keep pace, our team must be able to
  develop, validate, and deploy our software quickly and
  reliably. We are seeking a Developer Experience Engineer II
  and/or Senior Developer Experience Engineer - AI Frameworks,
  to enhance and accelerate our software engineering work.
  This engineer will build and maintain development workflows,
  build pipelines, CI systems, containerized development
  environments, SDK packaging and release pipelines, AI
  performance dashboards, and software productivity tools that
  our team relies on to develop, test, and ship our software
  efficiently. Our culture is highly collaborative and we
  regularly partner with researchers, hardware architects,
  platform engineers, and other software groups across the
  company.

  Microsoft’s mission is to empower every person and every
  organization on the planet to achieve more. As employees we
  come together with a growth mindset, innovate to empower
  others and collaborate to realize our shared goals. Each day
  we build on our values of respect, integrity, and
  accountability to create a culture of inclusion where
  everyone can thrive at work and beyond.

  Responsibilities

  In the role of Developer Experience Engineer II and/or
  Senior Developer Experience Engineer - AI Frameworks, you
  will be responsible for the following:

  - Design and build high-quality, scalable, and secure software
    solutions.
  - Design and build developer tools & customer SDKs for novel
    hardware platforms.
  - Collaborate broadly across multiple disciplines from
    hardware architects to ML developers.
  - Identify requirements, scope solutions, estimate work,
    schedule deliverables.
  - Help establish and drive the adoption of outstanding coding
    standards and patterns and help enhance our inclusive
    engineering culture.
  - Implement and optimize CI/CD, deployment automation, and
    production readiness processes.

  Qualifications

  Required Qualifications

  Bachelor's Degree in Computer Science or related technical
  field AND 2+ years technical engineering experience with
  coding in languages including, but not limited to, C, C++,
  or Python OR equivalent experience.

  Other Requirements

  Ability to meet Microsoft, customer and/or government
  security screening requirements are required for this role.
  These requirements include, but are not limited to the
  following specialized security screenings: Microsoft Cloud
  Background Check: This position will be required to pass the
  Microsoft Cloud background check upon hire/transfer and
  every two years thereafter.



   Preferred Qualifications:

  - 2+ years experience with C/C++
  - Experience with modern build systems and tooling (e.g.,
    CMake, Azure Pipelines, Bazel, Ninja)
  - Experience managing and organizing large C++ codebases.
  - Experience building and managing containerized workloads
  - Experience developing and publishing SDKs
  - Experience building developer tools and specifically
    developer tools for AI
  - Experience profiling and measuring performance
  - Experience implementing and optimizing AI workloads
  - Technical background and solid foundation in software
    engineering principles
  - Intellectual curiosity and an interest in learning new
    technologies
  - Cross-team collaboration skills and communication skills
  - A commitment to a diverse and inclusive workgroup culture



