  Lead Software Engineer – AI Platform Engineering Location:
  Bangalore, India (Hybrid)About Neuron7.ai

  Neuron7.ai is a leading Enterprise AI company building
  Agentic AI solutions that help Fortune 500 organizations
  transform customer service and field operations. Our AI
  platform enables enterprises to diagnose, resolve, and
  automate complex service issues using Large Language Models
  (LLMs), enterprise knowledge, and intelligent automation.

  As part of our Customer Engineering organization, you'll
  work directly with some of the world's largest enterprises,
  helping them deploy and scale AI solutions that deliver
  measurable business outcomes.

  Role Overview

  We are looking for a Lead Software Engineer – AI Solutions
  with 10–12 years of experience who enjoys solving complex
  customer problems and building enterprise-grade AI
  solutions.

  This is a customer-facing technical leadership role, where
  you'll partner with enterprise customers, Product,
  Engineering, and AI teams to design, customize, and
  implement AI-powered solutions. The ideal candidate combines
  strong software engineering expertise with excellent
  communication and stakeholder management skills.

  Key ResponsibilitiesCustomer Engagement

  - Partner with enterprise customers to understand their
    business challenges and technical requirements.
  - Lead technical discovery sessions, architecture discussions,
    and solution design workshops.
  - Translate customer requirements into scalable AI-powered
    solutions.
  - Serve as a trusted technical advisor throughout
    implementation and deployment.
  - Support customer onboarding, production rollouts, and post-
    deployment optimization.

  Solution Development

  - Design, develop, and customize AI-powered applications using
    Neuron7's platform.
  - Build integrations with customer enterprise systems, APIs,
    CRMs, and knowledge repositories.
  - Develop scalable backend services, workflows, and automation
    using Java or Python.
  - Configure and optimize Retrieval-Augmented Generation (RAG)
    pipelines and AI agents.
  - Troubleshoot complex production issues and provide technical
    guidance to customers.

  Technical Leadership

  - Lead solution architecture for strategic customer
    implementations.
  - Mentor engineers and promote engineering best practices.
  - Drive code reviews, design reviews, and technical quality.
  - Collaborate with Product and Engineering teams to influence
    product improvements based on customer feedback.

  Cross-Functional Collaboration

  - Work closely with Product Management, AI Research, Customer
    Success, and Professional Services teams.
  - Share customer insights to improve product capabilities.
  - Contribute to reusable implementation frameworks and best
    practices.

  Required Qualifications

  - Bachelor's or Master's degree in Computer Science or a
    related field.
  - 10–12 years of software engineering experience, including
    customer-facing implementation or solution engineering.
  - Strong hands-on programming experience in Java (Spring Boot)
    or Python.
  - Experience designing and building scalable distributed
    systems and APIs.
  - Strong understanding of software architecture, integration
    patterns, and cloud-native applications.
  - Experience integrating enterprise applications using REST
    APIs and event-driven architectures.

  AI & Technical Experience

  Hands-on experience with one or more of the following:

  - Large Language Models (OpenAI, Anthropic, Gemini, Llama)
  - Retrieval-Augmented Generation (RAG)
  - AI Agents and Agentic AI frameworks
  - LangChain, LangGraph, LlamaIndex, CrewAI, or similar
    frameworks
  - Prompt engineering and AI workflow orchestration
  - Vector databases (Pinecone, Weaviate, Milvus, FAISS, Chroma)
  - Enterprise search and knowledge management solutions

  Customer-Facing Skills

  - Experience working directly with enterprise customers during
    implementation and deployment.
  - Ability to communicate complex technical concepts to both
    technical and business stakeholders.
  - Strong presentation and solution architecture skills.
  - Experience leading customer workshops and technical
    discussions.
  - Ability to manage multiple customer engagements
    simultaneously.
  - Strong problem-solving and stakeholder management skills.

  Preferred Qualifications

  - Experience in Customer Engineering, Solutions Engineering,
    Professional Services, or Technical Consulting.
  - Experience implementing SaaS or Enterprise AI solutions.
  - Knowledge of ServiceNow, Salesforce, SAP, Microsoft
    Dynamics, or similar enterprise platforms.
  - Experience working with Fortune 500 customers.
  - Exposure to cloud platforms (AWS, Azure, or GCP).
  - Willingness to travel occasionally to customer locations, if
    required.

  Success in This Role

  You'll be successful if you:

  - Build trusted relationships with enterprise customers.
  - Deliver high-quality AI solutions that solve real business
    problems.
  - Influence product direction through customer feedback.
  - Lead complex customer implementations successfully.
  - Mentor engineers and contribute to technical excellence.
  - Represent Neuron7 as a trusted technical advisor.

  Why Join Neuron7?

  - Work on cutting-edge Agentic AI products used by Fortune 500
    enterprises.
  - Collaborate with world-class AI researchers, engineers, and
    product leaders.
  - Solve complex customer challenges using innovative AI
    technologies.
  - Competitive compensation and ESOPs.
  - Comprehensive health insurance.
  - Hybrid work environment.
  - Opportunity to shape the future of Enterprise AI and
    customer success.

  Neuron7 is an Equal Opportunity Employer. We celebrate
  diversity and are
