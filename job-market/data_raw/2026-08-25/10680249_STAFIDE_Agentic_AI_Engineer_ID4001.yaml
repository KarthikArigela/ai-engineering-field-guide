  - 5+ years of experience in software development, AI
    engineering, or a related field
  - Strong programming experience with Python
  - Hands-on experience with Generative AI and LLMs
  - Experience developing AI agents or Agentic AI solutions
  - Knowledge of AI frameworks such as LangChain, LangGraph,
