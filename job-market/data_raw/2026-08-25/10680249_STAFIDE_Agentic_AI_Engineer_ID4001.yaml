  - Good understanding of RAG, prompt engineering, embeddings,
    and vector databases
  - Experience working with APIs, microservices, and cloud
    platforms
  - Familiarity with Azure, AWS, or GCP
  - Understanding of CI/CD and DevOps practices
  - Strong problem-solving and communication skills

  You Should Possess the Ability To:

  - Develop reliable and scalable AI solutions
  - Translate business requirements into technical AI solutions
  - Work independently and as part of an Agile team
  - Troubleshoot and improve AI applications
  - Stay updated with emerging AI and LLM technologies

  What We Bring to the Table:

  - Opportunity to work on innovative AI and Generative AI
    projects
  - Exposure to modern Agentic AI and cloud technologies
  - Collaborative and technology-driven working environment
  - Opportunity to work on enterprise-level AI solutions
  - Continuous learning and professional growth opportunities

