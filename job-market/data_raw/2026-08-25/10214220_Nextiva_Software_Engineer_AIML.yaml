description: |
  Redefine the future of customer experiences. One
  conversation at a time.

  At Nextiva, we’re reimagining how businesses connect,
  bringing together customer experience and team collaboration
  on a single, conversation centric platform. Powered by AI,
  driven by human innovation.

  Our culture is forward thinking, customer obsessed and built
  on the belief that meaningful connections drive better
  business outcomes. Whether it’s through our signature
  Amazing Service®, the technology we create, or the
  experiences we cultivate, connection is at the core of who
  we are.

  If you’re ready to collaborate with incredible people, make
  an impact, and help businesses everywhere deliver truly
  amazing experiences, this is where you belong.

  Location: This is an onsite role based at Nextiva’s
  Bengaluru office (Wilshire III by MFAR, 492, Hobli, RHB
  Colony, Mahadevapura, Bengaluru, Karnataka 560048). Working
  together onsite strengthens how we operate, enabling faster
  decisions, clearer communication, and stronger execution, so
  you can make a greater impact and move work forward with
  speed and clarity.

  In-Office Expectation: This role is expected to work onsite
  four days per week, with the potential to increase to five
  days per week, as required by the business. Specific
  scheduling and flexibility will be guided by your leader to
  support both team collaboration and individual productivity.

  We are seeking an experienced NLP and Generative AI
  Developer to design, develop, and deploy advanced AI models
  that solve complex business problems through natural
  language understanding and generation capabilities. The
  ideal candidate will implement cutting-edge GenAI solutions,
  optimize model performance, and collaborate with cross
  functional teams to align AI initiatives with business
  objectives.  Key Responsibilities Model Development &
  Implementation • Design and implement generative AI models
  using state-of-the-art techniques including GPT, VAE, GANs,
  and transformer architectures • Develop and deploy NLP
  algorithms for text processing, semantic extraction, and
  language understanding systems • Build and fine-tune large
  language models (LLMs) for specific use cases using transfer
  learning and domain adaptation techniques • Implement prompt
  engineering strategies to optimize GenAI model performance
  and output quality Technical Execution • Work with deep
  learning frameworks including TensorFlow, PyTorch, Keras, or
  scikit-learn to build scalable AI solutions • Process and
  analyze large datasets using text representation techniques,
  word embeddings, and feature engineering • Integrate NLP and
  GenAI components into existing systems and production
  pipelines with proper cloud or on-prem infrastructure •
  Optimize existing models for improved performance,
  scalability, and efficiency through hyperparameter tuning
  and experimentation Research & Innovation • Stay current
  with latest advancements in generative AI, machine learning,
  NLP techniques, and identify opportunities for integration •
  Conduct research on emerging techniques such as RAG
  (Retrieval Augmented Generation) architecture, vector
  databases, and LangChain framework • Evaluate model
  performance through rigorous testing frameworks and iterate
  to improve accuracy and reliability Required Qualifications
  Education & Experience • Minimum 3-4 years of hands-on
  experience in NLP, machine learning, and generative AI
  development • Bachelor's or Master's degree in Computer
  Science, Artificial Intelligence, Machine Learning, or
  related field Technical Skills • Strong proficiency in
  Python programming with experience in libraries like NumPy,
  SciPy, Pandas • Deep understanding of NLP techniques
  including tokenization, named entity recognition, sentiment
  analysis, text classification, and sequence modeling •
  Hands-on experience with LLMs such as OpenAI GPT, LLaMA,
  Claude, or similar models • Expertise in deep learning
  architectures including LSTM, Transformers, attention
  mechanisms, and neural networks • Experience with NLP
  libraries and frameworks such as Hugging Face, SpaCy, NLTK •
  Knowledge of vector databases, embeddings, and semantic
  search technologies • Familiarity with cloud platforms (AWS,
  Azure, GCP) for deploying ML models Soft Skills • Strong
  problem-solving and analytical thinking abilities •
  Excellent communication skills to convey complex technical
  concepts to diverse audiences • Ability to work
  independently and collaboratively in fast-paced, dynamic
  environments Preferred Skills • Experience with fine-tuning
  open-source models and model compression techniques •
  Knowledge of conversational AI, chatbot development, and
  dialogue systems • Familiarity with MLOps practices and
  model deployment pipelines • Experience with distributed
  computing frameworks like PySpark • Understanding of data
  governance, security, and compliance requirements •
  Professional certifications in AI/ML or cloud platforms What
  You'll Work On • Generative AI applications for content
  creation, summarization, and language generation • NLP
  systems for text analytics, information extraction, and
  semantic understanding • Conversational AI solutions
  including chatbots and virtual assistants • Prompt
  engineering and optimization for LLM-based applications

  Nextiva DNA (Core Competencies)

  Nextiva’s most successful team members share common traits
  and behaviors:

  - Drives Results: Action-oriented problem solvers who quickly
    bring clarity and simplicity to ambiguity, challenge the
    status quo, and lead meaningful change; celebrating wins
    to fuel momentum. They act swiftly and pragmatically,
    learning and improving as they go.
  - Critical Thinker: Data-driven, forward-thinking individuals
    who identify key drivers, anticipate risks, and deliver
    clear recommendations. They confidently leverage AI and
    automation to reduce friction, improve decision-making,
    and focus on higher-value work.
  - Right Attitude: Collaborative, competitive, and resilient
    team players who jump in to solve tough problems, learn
    from setbacks, and foster a culture of service, respect,
    and care for customers and teammates.

  Total Rewards

  Our Total Rewards offerings are designed to allow our
  employees to take care of themselves and their families so
  they can be their best, in and out of the office.

  Our compensation packages are tailored to each role and
  candidate's qualifications. We consider a wide range of
  factors, including skills, experience, training, and
  certifications, when determining compensation. We aim to
  offer competitive salaries or wages that reflect the value
  you bring to our team. Depending on the position,
  compensation may include base salary and/or hourly wages,
  incentives, or bonuses.

  - Medical 🩺 - Medical insurance coverage is available for
    employees, their spouse, and up to two dependent children
    with a limit of 500,000 INR, as well as their parents or
    in-laws for up to 300,000 INR. This comprehensive coverage
    ensures that essential healthcare needs are met for the
    entire family unit, providing peace of mind and security
    in times of medical necessity.
  - Group Term & Group Personal Accident Insurance 💼 - Provides
    insurance coverage against the risk of death / injury
    during the policy period sustained due to an accident
    caused by violent, visible & external means.
    - Coverage Type - Employee Only
    - Sum Insured - 3 times of annual CTC with minimum cap of INR
      10,00,000
    - Free Cover Limit - 1.5 Crore
  - Work-Life Balance ⚖️ - 15 days of Privilege leaves per
    calendar year, 6 days of Paid Sick leave per calendar
    year, 6 days of Casual leave per calendar year. Paid 26
    weeks of Maternity leaves, 1 week of Paternity leave, a
    day off on your Birthday, and paid holidays
  - Financial Security💰 - Provident Fund & Gratuity
  - Wellness 🤸‍ - Employee Assistance Program and comprehensive
    wellness initiatives
  - Growth 🌱 - Access to ongoing learning and development
    opportunities and career advancement

