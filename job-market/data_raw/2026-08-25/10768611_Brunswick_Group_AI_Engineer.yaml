description: |
  Opportunity

  Brunswick is recruiting for an AI Enablement Specialist to
  join our pioneering AI Lab.

  Brunswick’s AI Lab serves as the firm’s central hub for AI
  innovation. The Lab researches, builds and maintains
  cutting-edge AI solutions, while partnering with client
  teams to provide advanced technical expertise on complex
  mandates.

  As AI adoption accelerates across the firm, the Lab plays a
  critical role in ensuring Brunswick remains at the forefront
  of AI-enabled advisory work and equipping our teams with the
  tools, skills and confidence to deliver differentiated value
  to clients.

  This role is focused on enabling people across the firm to
  use AI tools confidently, effectively and responsibly. It
  combines training delivery, content creation, tool
  evaluation, hands-on support, and close engagement with
  teams to embed AI into day-to-day workflows.

  The successful candidate will work closely with Partners,
  Directors and teams globally to drive adoption and ensure AI
  tools deliver tangible business value.

  About the Role

  Your day-to-day responsibilities will include:

  Leading adoption, embedding and providing user support

  - Embed within teams for defined periods to help them
    integrate AI tools into live client work.
  - Identify barriers to adoption and work with the AI Lab to
    address them.
  - Track recurring issues and feedback themes to inform
    training, documentation and product improvements.
  - Give input into the overall AI adoption plan.
  - Act as first-line support for AI tools, answering user
    queries and troubleshooting common issues.
  - Provide practical guidance on effective prompting and
    workflow integration.

  Adoption and training

  - Design and deliver structured AI training programmes,
    including:
    - In-person workshops and office sessions
    - Virtual training sessions
    - Written guidance and internal communications
    - Recorded training videos
  - Create clear, practical materials that translate technical
    capabilities into relevant business use cases, presented
    in language that will resonate with different audiences.
  - Drive internal adoption campaigns to increase awareness,
    confidence and usage of approved AI tools.
  - Travel to Brunswick offices to deliver training and support
    local AI embedding efforts.

  Tool Evaluation and Selection

  - Support the evaluation of emerging AI tools, including
    hands-on testing and business relevance assessment.
  - Gather structured feedback from users to inform tool
    selection, prioritisation, and business needs.
  - Provide input into decisions on tool rollout, retirement,
    and optimisation.
  - Stay current with developments across the generative AI
    landscape (e.g. ChatGPT, GPTs, Claude and related tools)
    and assess their relevance to the firm.

  What We're Looking For

  The successful candidate will combine strong communication
  skills, curiosity about both business and technology, and
  the ability to operate effectively in ambiguous
  environments. They will be comfortable moving between
  strategic conversations with senior stakeholders and hands-
  on practical support with end users. Standout candidates
  demonstrate:

  - Practical experience using generative AI tools (e.g.,
    ChatGPT, GPTs, Claude) in a professional setting with a
    strong understanding of where they add value and where
    they don’t.
  - Exceptional written communication skills and able to
    translate complex ideas into clear, concise, actionable
    guidance that people can immediately apply.
  - Strong presentation skills, including developing high-
    quality PowerPoint materials and delivering engaging
    sessions to senior audiences.
  - Confidence working with senior stakeholders, with the
    ability to flex your style and messaging depending on the
    audience.
  - Experience evaluating digital tools or technology solutions,
    with sound judgement about business impact, risks, and
    practical implementation.
  - A natural ability to bring structure to ambiguity and
    turning broad business challenges into practical
    workflows, tools, and guidance.
  - Comfortable working independently, taking ownership, and
    rolling up your sleeves to get things done in fast-moving
    environments.
  - High emotional intelligence and genuine curiosity about how
    people and teams work, and how to help them work better.
  - Willingness to travel internationally to deliver training
    and embed within teams when needed.
  - Experience in professional services or advisory environments
    would be advantageous.

  Why Join Us

  Whether you are joining a client facing team, a core
  services team, or starting out on your professional career
  journey, joining Brunswick unlocks a range of employee
  benefits to support your financial future, health and
  wellness, family and community and continuous professional
  development.

  About Brunswick

  Brunswick is a global advisory firm. We help companies
  tackle high-stakes issues, navigate complex stakeholder
  relationships, and deliver high-impact outcomes.

  Our clients value our ability to anticipate, shape, and
  respond to the key players and forces in the financial and
  investment arena, regulatory and geopolitical universe, NGO
  community, workforce and beyond. They rely on us for deep
  experience, fresh perspectives and original thinking. So, in
  Brunswick you will find an exceptional range of experience
  and talent with a rich mix of backgrounds. From the
  beginning, we have prioritized attracting, developing, and
  retaining the best professionals in the industry, united by
  a culture of inclusivity, excellence, and intellectual
  curiosity.

  Founded in 1987 in London, the firm has organically grown to
  27 offices in 18 countries across the Americas, Europe,
  Middle East, Africa, Asia and Australia. We operate as a
  “one-firm firm” with no individual profit centers. This
  allows us to assemble fully integrated, bespoke teams for
  each client, able to draw on the full resources of Brunswick
  anywhere in the world.

  Brunswick is an equal opportunity employer.  All qualified
  applicants will be considered without regard to race,
  religion, color, national origin, gender, sexual
  orientation, age, disability, pregnancy, genetic
  information, or any other status protected by applicable
  law. Please read our Global Privacy Notice to understand how
  your data is managed.
