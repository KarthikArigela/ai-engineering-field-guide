description: |
  What You Will Do

  - Partner with engineering, product, cloud, security,
    operations, and business teams to identify practical AI
    opportunities and support implementation from concept
    through delivery.
  - Provide hands-on technical guidance for AI initiatives,
    including solution design, architecture trade-offs,
    integration patterns, and implementation best practices.
  - Develop and maintain reusable AI reference architectures,
    implementation guides, design patterns, sample solutions,
    and enablement materials.
  - Contribute to AI standards, governance practices, and
    responsible AI guidance in partnership with architecture,
    security, legal, privacy, and compliance stakeholders.
  - Help define practical guidance for the use of approved AI
    platforms and open source LLM models, including security,
    compliance, evaluation, and operational considerations.
  - Support architecture reviews for AI initiatives and provide
    recommendations that improve scalability, reliability,
    maintainability, observability, and responsible AI
    practices.
  - Create and deliver AI training, workshops, demos, office
    hours, and communities of practice to help teams build
    confidence and capability with AI technologies.
  - Work with product development, support, and internal teams
    to integrate AI capabilities into workflows that improve
    productivity, product capabilities, and customer
    experiences.
  - Collaborate with cloud and platform teams to provide input
    into shared AI platform capabilities, reusable services,
    and developer enablement needs.
  - Promote AI development best practices, including testing,
    evaluation, monitoring, observability, cost awareness, and
    operational readiness.
  - Help establish lightweight processes to track AI usage,
    cost, adoption, lessons learned, and continuous
    improvement opportunities.
  - Partner with teams to define success measures for AI
    initiatives, including productivity gains, quality
    improvements, customer impact, and operational efficiency.
  - Stay current on emerging AI technologies, tools, and
    practices, and translate relevant trends into practical
    recommendations for engineering and business teams.
  - Mentor and coach team members on practical AI adoption,
    responsible implementation, and effective use of AI tools
    in day-to-day work.

  What You Will Need to Succeed

  - 5+ years of experience in Software Engineering,
    architecture, cloud architecture, or enterprise
    architecture.
  - 2+ years of experience designing, implementing, or enabling
    AI and/or machine learning solutions.
  - Strong understanding of Generative AI, Large Language Models
    (LLMs), AI Agents, RAG architectures, and prompt
    engineering.
  - Experience with Azure AI Services, OpenAI, Claude, AWS
    Bedrock, Google Vertex AI, or similar AI platforms.
  - Strong knowledge of modern software engineering practices,
    APIs, cloud-native architectures, and SaaS platforms.
  - Experience developing enterprise standards, governance
    frameworks, and architectural guidance.
  - Understanding of AI security, privacy, compliance, and
    responsible AI principles.
  - Experience with DevOps, MLOps, and AI operational practices.
  - Strong facilitation, mentoring, and stakeholder management
    skills.
  - Excellent communication and presentation skills for both
    technical and non-technical audiences.
  - Ability to influence without direct authority and drive
    organizational change.

  Desired Skills

  - Experience leading AI transformation or enablement
    initiatives across large organizations.
  - Experience implementing AI Centers of Excellence (CoE).
  - Azure and AWS Certificaitons focused on AI like Azure AI
    Engineer Associate (AI-102), Azure Solutions Architect
    Expert (AZ-305), or equivalent certifications.
  - Experience with enterprise SaaS products and cloud
    platforms.
  - Experience creating training programs and technical
    enablement materials.
  - Familiarity with ERP, supply chain, manufacturing,
    distribution or enterprise business applications is a
    great plus!

