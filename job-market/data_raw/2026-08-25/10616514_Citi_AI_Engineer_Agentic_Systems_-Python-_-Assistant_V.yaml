description: |
  The Applications Development Senior Programmer Analyst is an
  intermediate level position responsible for participation in
  the establishment and implementation of new or revised
  application systems and programs in coordination with the
  Technology team. The overall objective of this role is to
  contribute to applications systems analysis and programming
  activities, with a focus on Python-based Generative AI and
  agentic solutions.

  Responsibilities:

  - Conduct tasks related to feasibility studies, time and cost
    estimates, IT planning, risk technology, applications
    development, model development, and establish and
    implement new or revised application systems and programs
    to meet specific business needs or user areas
  - Design, develop, test, and support Python-based Generative
    AI and agentic applications using appropriate frameworks
    and integration patterns
  - Build secure REST APIs and microservices using FastAPI or
    Flask, including asynchronous processing, testing,
    packaging, and structured-output handling
  - Implement retrieval-augmented generation solutions using
    embeddings and vector databases, and evaluate retrieval
    and model quality
  - Integrate agent tools using MCP or comparable patterns and
    contribute to multi-agent orchestration where applicable
  - Monitor and control all phases of the development process,
    including analysis, design, construction, testing,
    implementation, and operational support
  - Utilize in-depth specialty knowledge to analyze complex
    problems, evaluate business and system processes, and
    recommend practical solutions aligned with industry
    standards
  - Recommend and develop security and control measures,
    including responsible AI practices, to support successful
    system design and functionality
  - Consult with users, clients, and other technology groups;
    communicate technical options clearly and provide
    production support when required
  - Ensure essential procedures are followed and help define
    operating standards, engineering practices, and
    documentation
  - Serve as advisor or coach to new or lower-level analysts,
    contribute to code reviews, and support knowledge sharing
  - Operate with a limited level of direct supervision, exercise
    independence of judgement and autonomy, and act as a
    subject matter expert to senior stakeholders and team
    members
  - Appropriately assess risk when business decisions are made,
    demonstrating particular consideration for the firm's
    reputation and safeguarding Citigroup, its clients and
    assets, by driving compliance with applicable laws, rules
    and regulations, adhering to Policy, applying sound
    ethical judgment regarding personal behavior, conduct and
    business practices, and escalating, managing and reporting
    control issues with transparency

  Recommended Qualifications:

  - 7-9 years of relevant software engineering experience
  - Strong hands-on experience in Python application development
  - Experience delivering and supporting enterprise software
    applications

  Must-have (Core):

  - FastAPI or Flask, asynchronous programming, automated
    testing, and Python packaging
  - Hands-on experience with at least two agentic or AI
    frameworks such as LangGraph, LangChain, Google ADK,
    AutoGen, CrewAI, LlamaIndex, Hugging Face, or equivalent
  - Experience with vector databases such as
    PostgreSQL/pgvector, FAISS, or equivalent
  - Experience with embeddings, retrieval-augmented generation,
    and retrieval or model evaluation
  - MCP or comparable agent tool-integration patterns
  - REST API and microservices design
  - SQL, Git, code reviews, and technical documentation
  - Ability to work under pressure and manage deadlines or
    unexpected changes in expectations or requirements

  Nice-to-have:

  - Financial-services or regulated-industry experience
  - Cloud-native development experience
  - Experience with locally hosted or open-source large language
    models
  - Multi-agent orchestration experience
  - AI observability and guardrail tooling
  - Responsible AI awareness and secure AI engineering practices

  Engineering Basics:

  - Agile or SAFe delivery practices
  - Structured-output and JSON handling
  - CI/CD, Linux, containers, and production monitoring concepts
  - Stakeholder communication and collaboration across
    technology and business teams

  Education:

  - Bachelor's degree/University degree or equivalent experience

