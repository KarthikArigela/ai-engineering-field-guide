description: |
  01Health is at an inflection point. The platform is built,
  revenue is accelerating, and we are moving from a single-
  specialty company to a multi-vertical specialist healthcare
  platform, with AI as embedded clinical infrastructure. Our
  vision is to help all clinicians deliver the latest
  innovations in healthcare, improving the standard of care
  for millions of people. Backed by the investors behind
  Revolut, CityMapper, and Depop, we're scaling fast across
  the UK and beyond, and are looking for exceptional people to
  join us on our mission.

  What is happening at 01Health right now:

  - Balderton-backed Series A company
  - 90% of UK patients can reach an 01Health–affiliated clinic
    within 30 minutes
  - All growth has been inbound, ~50% word of mouth
  - 4.98★ customer rating from the dentists who use us
  - Aerox (sleep) ready for national rollout to top-performing
    01 Partners, with a 300+ clinic waitlist
  - US expansion live
  - New verticals being tested and prototyped

  We are not searching for product–market fit anymore. We are
  ready to dominate the market, and to do it across multiple
  medical specialties, transforming lives in the process.

  The role:

  We are seeking a Forward Deployed AI Engineer to lead the
  end-to-end design, development, and scaling of critical
  product verticals across our platform. You will identify,
  build, and ship AI-driven features that meaningfully enhance
  clinician and patient experiences while driving measurable
  business outcomes.

  This role sits at the intersection of clinical needs,
  technical feasibility, and commercial strategy. You will
  spend most of your time in the codebase, writing and
  maintaining the technical solutions to the problems you
  identify, often embedded directly with clinicians and
  customers.

  What you will do:

  Engineering & Delivery

  - Design, build, and ship AI-powered features that improve
    clinical decision-making, patient outcomes, and
    operational efficiency.
  - Own the end-to-end feature lifecycle: prototype, production
    code, deployment, and post-launch optimisation, ensuring
    quality, performance, and measurable impact.
  - Work directly with clinicians and customers to turn real-
    world problems into working software, iterating quickly on
    live feedback.
  - Collaborate with other engineers to keep solutions
    technically sound, scalable, and maintainable.

  Applied AI

  - Evaluate emerging AI technologies, prototype rapidly, and
    define implementation approaches with a bias toward
    shipping.
  - Translate ambiguous opportunities into concrete technical
    requirements and working systems.

  Data-Driven Decision Making

  - Creating and maintaining key feature evals to monitor and
    improve products you have built.
  - Use quantitative and qualitative insights, including product
    analytics, user feedback, and clinical research, to
    prioritise what to build and validate hypotheses.
  - Define and instrument key metrics for feature adoption,
    effectiveness, and business impact, continuously iterating
    for optimal outcomes.

  Customer & Market Insight

  - Conduct hands-on user research to identify unmet needs where
    engineering can deliver significant value.
  - Benchmark against competitors and emerging AI trends to keep
    the product innovative.

  Commercial & Business Impact

  - Connect what you build to strategic outcomes such as user
    retention, operational efficiency, and revenue growth.
  - Serve as the technical owner for your verticals,
    communicating progress and impact to stakeholders across
    the business.

  What we are looking for:

  - Strong engineering ability and a drive to build; you'd
    rather ship a working prototype than write a spec about
    one.
  - Naturally curious about AI, actively seeking opportunities
    to enhance products and internal workflows through
    emerging technologies.
  - Comfortable owning features end-to-end, from writing
    production code to deploying and iterating in front of
    real users.
  - Strong commercial awareness and an interest in connecting AI
    opportunities to measurable business outcomes.
  - User-focused and insight-driven, leveraging qualitative and
    quantitative inputs to inform thoughtful technical
    decisions.
  - Startup mindset: proactive, adaptable, and energized by
    working in fast-moving, evolving environments.
  - Location: Able to commute to our London office on Mondays,
    Wednesdays, and Fridays.

  Why join us:

  - Real impact, every day - your work directly changes patient
    outcomes. You'll feel it, and so will the people whose
    care you're improving.
  - 25 days holiday + your birthday off - because no one should
    work on their birthday!
  - Outsized leverage and full ownership - real authority today,
    lasting impact tomorrow; what you build now shapes how
    this company operates at every stage after.
  - Grow fast - backed by top VCs and built by the best; you'll
    be learning from some of the sharpest minds in health-tech
    every single day.
  - Vitality Health cover - private medical insurance, because
    we take care of the people who take care of the business.
  - Team Perks - enjoy regular team lunches, quarterly socials,
    and an annual company retreat.
  - Hybrid working - we all come together three days a week, but
    the rest of the time, enjoy the flexibility to work from
    home or our Hoxton office.
