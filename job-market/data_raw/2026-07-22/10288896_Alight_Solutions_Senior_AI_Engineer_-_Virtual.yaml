description: |
  Our Story

  At Alight, we believe a company’s success starts with its
  people. Alight embraces values that come directly from our
  people – purposeful, human, united and growth-minded –
  reflecting our inclusive culture and promise that our
  clients expect. We are passionate about connecting purpose
  with impact.  Alight empowers clients to build a healthier
  and more financially secure workforce by unifying the
  benefits ecosystem across health, wealth, wellbeing,
  navigation, and absence management.

  Our Benefits

  With a comprehensive total rewards package, Alight offers
  programs and plans that support your mind, body, wallet, and
  life. Benefits include health, dental and vision coverages
  starting Day One. Additionally, Alight colleagues enjoy
  wellbeing programs, retirement plans with contribution
  matching, generous time off, parental leave, continuing
  education, and career growth opportunities – all within a
  thriving global organization.

  Flexible Working

  So that you can be your best at work and home, we consider
  flexible working arrangements wherever possible. Alight has
  been a leader in the flexible workspace and “Top 100 Company
  for Remote Jobs” 6 years in a row.

  Great Place to Work

  Thanks to the work of every colleague, Alight has received
  multiple awards of recognition including “Great Place to
  Work” for the past 7 years and Fortune’s “Best Companies to
  Work For.” To learn more about our company culture and
  awards Click Here.

  We invite you to join our team!  Learn more at
  careers.alight.com.

  We are currently seeking an experienced AI engineer who will
  collaborate closely with cross-functional teams to develop
  and deploy AI-powered features and tools that optimize
  employee experiences and drive business outcomes.

  Key Responsibilities

  - As a senior AI/ML engineer, you will be responsible for
    designing, developing, and deploying machine learning
    models and AI applications that solve complex business
    problems.
  - Design and develop search and chat applications that utilize
    agentic AI.
  - Design and develop AI pathed paths for the Alight
    engineering organization.
  - Experiment to evaluate application performance, including
    designing experiments to evaluate the performance of
    machine learning models, and then analyze and interpret
    the results to improve model performance.
  - Stay up to date with new tools and technologies and
    evaluating their potential impact on the business.
  - Work with stakeholders to develop and tune algorithms to
    address business needs. You should be able to effectively
    communicate your ideas in non-technical terms to help
    educate business partners
  - Collaborate on a high-performing, agile team with a global
    presence

  Requirements

  - Bachelor’s degree with preferred concentrations in Computer
    Science, Data Science, Math, Actuarial Science,
    Engineering, or related field.
  - Experience writing and working in Python or Spark
    (ScalaSpark or PySpark) and with popular machine learning
    libraries such as TensorFlow, Keras, PyTorch
  - AI/ML engineers should have experience with data preparation
    and data engineering tasks such as data cleaning, feature
    engineering, and data transformation
  - Knowledge of deep learning architectures and techniques,
    such as convolutional neural networks (CNNs), recurrent
    neural networks (RNNs), and reinforcement learning.
  - Familiarity with AWS data and data science tools including
    SageMaker, Glue, Lambdas, etc.
  - Experience in Agile and DevOps development process
  - Must be able to clearly communicate complex technical
    concepts to a non-technical audience
  - Manage services provided to the federal government or
    federal government contractor and therefore requires US
    Citizenship. Proof of citizenship status will be required
    at time of hire.
  - Familiarity with Git, JIRA, Artifactory, CI/CD tools like
    Jenkins

  Application and Interview

  By applying for a position with Alight, you understand that,
  should you be made an offer, it will be contingent on your
  undergoing and successfully completing a background check
  consistent with Alight’s employment policies. Background
  checks may include some or all the following based on the
  nature of the position: SSN/SIN validation, education
  verification, employment verification, and criminal check,
  search against global sanctions and government watch lists,
  credit check, and/or drug test. You will be notified during
  the hiring process which checks are required by the
  position.

  Alight requires all virtual interviews to be conducted on
  video.  Please be aware that Alight is a camera-on culture
  and may require occasional travel to one of our physical
  office locations.

  Our commitment to Inclusion

  We celebrate differences and believe in fostering an
  environment where everyone feels valued, respected, and
  supported. We know that diverse teams are stronger, more
  innovative, and more successful.

  At Alight, we welcome and embrace all individuals,
  regardless of their background, and are dedicated to
