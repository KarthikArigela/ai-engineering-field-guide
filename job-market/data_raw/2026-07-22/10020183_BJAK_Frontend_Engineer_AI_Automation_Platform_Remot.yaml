description: |
  BJAK is building AI-powered automation systems that simplify
  complex insurance workflows- from quotations and policy
  issuance to claims and customer support. To make this
  possible, we need intuitive, fast and scalable user
  experiences. We're looking for an experienced Frontend
  Engineer based in the United Kingdom to help build the next
  generation of AI-powered web applications used by both
  customers and internal teams. This is a fully remote role
  where you'll collaborate closely with our global engineering
  team while working with product and operations teams based
  in Malaysia.

  Your Mission

  Build exceptional frontend experiences that make complex AI-
  powered workflows feel simple. You'll develop modern web
  applications that help customers purchase insurance more
  easily while enabling internal teams to operate faster
  through intelligent automation.

  What You'll Do

  - Build modern web applications using React, Next.js,
    TypeScript and modern frontend technologies.
  - Develop customer-facing products alongside internal AI-
    powered operational tools.
  - Translate product and UX requirements into fast, responsive
    and intuitive interfaces.
  - Integrate frontend applications with backend APIs and AI
    services.
  - Improve application performance, scalability and
    reliability.
  - Build reusable components and maintain a scalable frontend
    architecture.
  - Participate in code reviews and contribute to engineering
    best practices.
  - Collaborate closely with product managers, designers,
    backend engineers and QA throughout the development
    lifecycle.
  - Help shape technical decisions and continuously improve our
    frontend stack.

  What We're Looking For

  - Bachelor's degree in Computer Science, Software Engineering
    or a related discipline, or equivalent industry
    experience.
  - Proven experience building production-grade web
    applications.
  - Strong experience with React and TypeScript.
  - Experience with modern frameworks such as Next.js (or
    similar frameworks like Vue or Angular).
  - Solid understanding of HTML5, CSS3 and responsive web
    development.
  - Experience consuming REST APIs.
  - Strong understanding of component-based architecture and
    frontend application design.
  - Experience optimising frontend performance and debugging
    production applications.
  - Familiarity with Git and modern software development
    workflows.
  - Comfortable working within CI/CD environments.
  - Strong problem-solving skills and attention to detail.
  - Excellent communication skills and ability to work
    effectively in a distributed team.
  - Comfortable working in a fast-moving, product-focused
    environment.

  Nice to Have

  - Experience building AI products or AI-enabled user
    experiences.
  - Experience with workflow automation or SaaS platforms.
  - Experience with Next.js, Vite or modern frontend tooling.
  - Familiarity with Node.js or Python.
  - Experience with Playwright, Cypress, Jest or Vitest.
  - Knowledge of authentication, authorisation and web security.
  - Experience with Redux, Zustand or similar state management
    libraries.
  - Contributions to open-source projects or active
    participation in developer communities.

  We're Looking For Builders Who

  - Think beyond simply implementing designs.
  - Care deeply about user experience, performance and
    usability.
  - Take ownership from idea through production.
  - Write clean, maintainable and scalable code.
  - Balance engineering quality with execution speed.
  - Enjoy solving complex technical and product challenges.
  - Want to build AI products with measurable business impact.

  This Role Isn't Right If You

  - Prefer highly structured environments with detailed
    specifications for every task.
  - Focus only on writing code without understanding user
    problems.
  - Avoid ownership beyond implementation.
  - Are uncomfortable working in a fast-paced startup where
    priorities evolve quickly.

  Success in This Role

  You'll thrive if you can:

  - Deliver fast, intuitive and reliable frontend experiences.
  - Simplify complex workflows through thoughtful product
    design.
  - Build scalable frontend architecture that supports rapid
    growth.
  - Maintain high engineering standards while shipping quickly.
  - Become a trusted technical partner across engineering,
    product and operations.

  Why Join BJAK

  - Build AI Products – Work on cutting-edge AI and automation
    systems that solve real business problems.
  - Global Engineering Team – Collaborate with experienced
    engineers and cross-functional teams across multiple
    countries.
  - Fully Remote – Work remotely from UK while collaborating
    with our Malaysia-based teams.
  - International Exposure – Gain experience building products
    used across Southeast Asia and work with globally
    distributed teams.
  - Learning & Development Budget – Receive support for
    technical courses, certifications, conferences and
    continuous learning.
  - Career Growth – Fast career progression with opportunities
    to take ownership of impactful projects.
  - Innovative Challenges – Solve large-scale engineering
    problems in a high-growth technology company.
  - Modern Engineering Culture – Code reviews, knowledge
    sharing, continuous improvement and engineering
    excellence.
  - Competitive Compensation – Attractive salary package based
    on experience and performance.

  Interview Process

  We assess culture, working style and frontend execution. The
  process usually includes application review, two interviews
  and a technical task or code review.
