  Job Summary

  We are looking for a motivated AI Solutions Engineer ready
  to take us to the next level! If you have experience with
  Prompt Engineering, Generative AI/LLM Solutions, and API
  Integration, and are looking for your next career move,
  apply now

  Job Description

  We are looking for an AI Solutions Engineer to design,
  develop, and optimize Generative AI and LLM-based solutions
  that drive business value. This position will be full-time
  and remote.

  What You’ll Do

  - Design and refine prompts and context frameworks to improve
    the accuracy and effectiveness of AI-generated outputs
  - Develop and deploy Generative AI and LLM-based solutions
    aligned with business use cases
  - Prepare, manage, and optimize structured and unstructured
    data for AI solution testing and validation
  - Integrate AI models with enterprise applications, systems,
    and workflows using APIs
  - Evaluate model performance, test output quality, and
    implement continuous improvements
  - Measure and communicate the business impact of AI solutions
  - Ensure responsible AI practices with a focus on privacy,
    security, compliance, and ethical usage

  What You’ll Need

  Required:

  - 3–8 years of experience in AI/ML, software development, or a
    related technical field
  - Hands-on experience building Generative AI or LLM-based
    solutions
  - Strong understanding of large language models and generative
    AI technologies
  - Experience with prompt engineering and context design
  - Knowledge of data preparation and management for AI
    applications
  - Experience integrating APIs and connecting AI solutions with
    enterprise systems
  - Ability to evaluate AI outputs and optimize solution
    performance
  - Understanding of responsible AI principles, data privacy,
    security, and compliance requirements

  Preferred:

  - Experience delivering AI solutions in enterprise
    environments
  - Experience measuring and improving business outcomes through
    AI initiatives
  - Knowledge of AI governance and ethical AI best practices

  Physical Demands

  - Ability to remain in a stationary position for extended
    periods
  - Ability to operate a computer and other standard office
    equipment
  - Ability to communicate effectively in a virtual work
    environment
  - Ability to perform the essential functions of the position
    with or without reasonable accommodation

  Reasonable accommodation statement

  If you require a reasonable accommodation in completing this
  application, interviewing, completing any pre-employment
  testing, or otherwise participating in the employment
  selection process, please direct your inquiries to
  application.accommodations@cai.io or (888) 824 – 8111.
