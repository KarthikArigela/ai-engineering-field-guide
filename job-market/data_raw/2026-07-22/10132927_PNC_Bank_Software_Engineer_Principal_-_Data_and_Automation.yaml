title: Software Engineer Principal - Data and Automation Artificial Intelligence (GenAI, API Design)
company: PNC Bank
location: USA
work_type: FULL_TIME
description: |
  Job Profile

  Position Overview

  At PNC, our people are our greatest differentiator and
  competitive advantage in the markets we serve. We are all
  united in delivering the best experience for our customers.
  We work together each day to foster an inclusive workplace
  culture where all of our employees feel respected, valued
  and have an opportunity to contribute to the company’s
  success. As a Software Engineer Principal within PNC's Data
  and Automation Artificial Intelligence organization, you
  will be based in Pittsburgh, PA or Springfield, VA •
  Responsible for architecting and evolving enterprise GenAI
  platforms, with a strong focus on Retrieval Augmented
  Generation (RAG) and agentic systems that enable scalable,
  reusable capabilities across the organization • Serves as a
  hands on technical authority for designing and implementing
  GenAI patterns, including knowledge retrieval,
  orchestration, tool using agents, and human in the loop
  workflows • Partners closely with product, data,
  architecture, security, and risk teams to ensure GenAI
  solutions are production ready, governed, and aligned to
  enterprise standards and responsible AI practices • Defines
  and drives platform engineering best practices for GenAI
  systems, influencing how teams build, deploy, observe, and
  operate RAG and agent based solutions at scale • Operates
  with broad autonomy to solve the most complex and ambiguous
  platform challenges, balancing innovation, performance, cost
  efficiency, and long term extensibility This position may be
  eligible for remote work in select geographic locations,
  subject to approval by PNC. If approved, work must be
  conducted from a quiet, secure, and confidential home-based
  workspace. Occasional in-office participation may be
  required based on business needs.

  PNC will not provide sponsorship for employment visas or
  participate in STEM OPT for this position.Job Description

  - Aligns business strategy with software solutions.
  - Proposes, designs & codes software solutions to address
    complex business needs. Oversees technical and procedural
    documentation required.
  - Leads complex problem solving.
  - Provides technical guidance and support to colleagues and
    solution development.
  - Displays an innovative approach to apply modern principles,
    methodologies and tools to advance business initiatives
    and capabilities.

  PNC Employees take pride in our reputation and to continue
  building upon that we expect our employees to be:

  - Customer Focused - Knowledgeable of the values and practices
    that align customer needs and satisfaction as primary
    considerations in all business decisions and able to
    leverage that information in creating customized customer
    solutions.
  - Managing Risk - Assessing and effectively managing all of
    the risks associated with their business objectives and
    activities to ensure they adhere to and support PNC's
    Enterprise Risk Management Framework.

  Qualifications

  Successful candidates must demonstrate appropriate
  knowledge, skills, and abilities for a role. Listed below
  are skills, competencies, work experience, education, and
  required certifications/licensures needed to be successful
  in this position.

  Preferred SkillsAPI Design, Application Development,
  Business Management, Customer Solutions, Design, Generative
  AI, Group Problem Solving, Process Improvements, Release
  Management, Software Solutions, User Experience (UX) Design

  CompetenciesApplication Design, Architecture, Packaged
  Application Integration, Product and Vendor Evaluation,
  Software Process Improvement (SPI), System Development Life
  Cycle, Technical Troubleshooting

  Work ExperienceRoles at this level typically require a
  university / college degree, with 5+ years of industry-
  relevant experience. Specific certifications are often
  required. In lieu of a degree, a comparable combination of
  education, job specific certification(s), and experience
  (including military service) may be considered.

  EducationBachelors

  CertificationsNo Required Certification(s)

  LicensesNo Required License(s)

  Pay Transparency

  Base Salary: $87,500.00 – $202,800.00

  Salaries may vary based on geographic location, market data
  and on individual skills, experience, and education. This
  role is incentive eligible with the payment based upon
  company, business and/or individual performance.

  Application Window

  Generally, this opening is expected to be posted for two
  business days from 03/25/2026, although it may be longer
  with business discretion.

  Benefits

  PNC offers a comprehensive range of benefits to help meet
  your needs now and in the future. Depending on your
  eligibility, options for full-time employees include:
  medical/prescription drug coverage (with a Health Savings
  Account feature), dental and vision options; employee and
  spouse/child life insurance; short and long-term disability
  protection; 401(k) with PNC match, pension and stock
  purchase plans; dependent care reimbursement account; back-
  up child/elder care; adoption, surrogacy, and doula
  reimbursement; educational assistance, including select
  programs fully paid; a robust wellness program with
  financial incentives.

  In addition, PNC generally provides the following paid time
  off, depending on your eligibility: maternity and/or
  parental leave; up to 11 paid holidays each year; 9
  occasional absence days each year, unless otherwise required
  by law; between 15 to 25 vacation days each year, depending
  on career level; and years of service.

  To learn more about these and other programs, including
  benefits for full time and part-time employees, visit
  pncthrive.com.

  Disability Accommodations Statement

  If an accommodation is required to participate in the
  application process, please contact us via email at
  AccommodationRequest@pnc.com. Please include “accommodation
  request” in the subject line title and be sure to include
  your name, the job ID, and your preferred method of contact
  in the body of the email. Emails not related to
  accommodation requests will not receive responses.
  Applicants may also call 877-968-7762 and say "Workday" for
  accommodation assistance. All information provided will be
  kept confidential and will be used only to the extent
  required to provide needed reasonable accommodations.

  At PNC we foster an inclusive and accessible workplace.  We
  provide reasonable accommodations to employment applicants
  and qualified individuals with a disability who need an
  accommodation to perform the essential functions of their
  positions.

  Equal Employment Opportunity (EEO)

  PNC provides equal employment opportunity to qualified
  persons regardless of race, color, sex, religion, national
