description: |
  At TTEC Digital, we coach clients to ensure their employees
  feel valued, and fully supported, because an amazing
  customer experience is an employee first process. Our vision
  is the same, a place where employees know they can thrive.

  The AI Developer is responsible for the development, testing
  and delivery of the NICE CXone AI software platform. This is
  a hands-on, technical role for individuals skilled in
  technical development experience. You will be tasked to
  implement the NICE Proactive AI Agent, Omilia and Cognigy
  software. Technical experience with various call center
  technologies including NICE CXone, IVR/ACD, VoIP, Email,
  SMS, and Chat systems will be beneficial. Key
  responsibilities include the development of the NICE
  Proactive AI product and features, unit testing, code
  reviews, resolving defects encountered during the QA cycle,
  supporting the production environment, and assisting other
  developers in a team environment.

  What You'll Be Doing

  - Developing and enhancing conversational chat bot solutions
    in relation to Cognigy and NICE Proactive AI Agent for
    client implementation projects.
  - Work as a member of the TTEC Digital project team to enhance
    and improve software written in JavaScript.
  - Code and test projects.
  - Deliver high-quality software on time.
  - Attend meetings and training as required.
  - Perform system analysis and project management duties for
    the successful completion of a project.
  - Excellent customer-facing presentation skills with the
    ability to develop new solution pitches, value
    propositions, and demo experiences.
  - Exercises wide latitude in determining objectives and
    approaches to engagements.
  - Mitigating and resolving code errors for development and
    future concepts.

  What You'll Bring to the Role

  - 3 years of professional experience building and delivering
    Natural Language Processing (NLP) systems, including Large
    Language Models (LLM) based or Generative AI solutions.
  - 3 or more years of software development, to include design,
    custom development (JavaScript, Python, Java), and testing
    of real time systems.
  - 5+ years JavaScript experience.
  - Experience with products such as DialogFlow, Kore.ai,
    Cognigy, Amazon Lex or Omilia.
  - Hands on experience with modern chat bot creation, AI
    Virtual Agents/Agent Assist.
  - Contact Center as a Service (CCaaS), NICE CXone and CXone
    Studio experience is nice to have
  - Team Player and the ability to mentor team members
  - Desire to work in a fast-paced environment.

