description: |
  Job Description ROLE SUMMARY

  The AI Acceleration (AIA) function within the Chief
  Marketing Office (CMO) is the single, business-led engine
  that owns the design, delivery, and scale-up of priority AI
  capabilities across Commercial. AIA works in tight
  collaboration with various Pfizer functions to deploy and
  maintain production-grade AI solutions that simplify how we
  work and drive measurable value across all processes.

  As a  Full-stack Software Engineer, you will be involved in
  complex software development tasks in a hands-on manner. You
  will prototype code and participate in code reviews,
  facilitate breaking down user stories into technical tasks
  and help manage the process by which code is delivered. Your
  expertise will expand into Cloud technologies, full-stack
  software engineering, and DevOps.

  Role Responsibilities  •    Develop complex end-to-end
  software products being involved in discussions from
  designing the systems to productionizing and deployment •
  Work closely with other Front-end and Backend engineers to
  integrate workflows end-to-end •    Develop features and fix
  bugs as defined the product roadmap by working in an agile
  manner •    Implement best practices for engineering
  standards, QA/Risk Management, CI/CD, MLOps •    Work
  closely with cross-functional team of Product Owners, Data
  Scientists, Product Designers, UI/UX Developers, Scrum
  Masters and business stakeholders from across Pfizer to
  build end-to-end production solutions •    Demonstrate a
  proactive approach to identifying and resolving potential
  system issues. •    Contribute to the best practices of the
  team and help colleagues grow. •    Communicate complex
  technical concepts and insights to both

