description: |
  To get the best candidate experience, please consider
  applying for a maximum of 3 roles within 12 months to ensure
  you are not duplicating efforts.

  Job Category

  Software Engineering

  Job Details

  About Salesforce

  Salesforce is the #1 AI CRM, where humans with agents drive
  customer success together. Here, ambition meets action. Tech
  meets trust. And innovation isn’t a buzzword — it’s a way of
  life. The world of work as we know it is changing and we're
  looking for Trailblazers who are passionate about bettering
  business and the world through AI, driving innovation, and
  keeping Salesforce's core values at the heart of it all.

  Ready to level-up your career at the company leading
  workforce transformation in the agentic era? You’re in the
  right place! Agentforce is the future of AI, and you are the
  future of Salesforce.

  Applications will be accepted until 08/31/2026.About the
  Role

  We're looking for an AI GTM Developer to help build the
  future of our Go-To-Market organization.

  This is a unique engineering role focused on building
  internal applications that make our Solutions Engineering,
  Sales, and Marketing teams dramatically more effective.
  You'll combine strong software engineering fundamentals with
  modern AI-assisted development to rapidly design, build, and
  maintain tools that solve real business problems.

  You'll partner directly with GTM leaders to identify
  opportunities, prototype solutions using AI-first
  development workflows, and build a portfolio of internal AI
  products that become essential to how our Solutions
  Engineering, Sales, and Marketing teams operate.

  If you enjoy building software that has an immediate impact
  on how teams operate—and want to leverage AI to build faster
  than ever before—this role is for you.

  What You'll Do

  - Design and build internal applications and AI-powered
    products that improve how our Solutions Engineering,
    Sales, and Marketing teams operate.
  - Partner directly with GTM leaders to understand business
    challenges and translate them into software solutions.
  - Use AI-native development tools, including Claude Code, as a
    core part of your daily development workflow.
  - Rapidly prototype new applications and products, gather
    feedback, and iterate into production-ready solutions.
  - Own a growing portfolio of internal AI products—from
    architecture and development through deployment, adoption,
    maintenance, and continuous enhancement.
  - Treat each application as a product, continuously improving
    functionality, usability, and adoption based on user
    feedback and evolving business needs.
  - Build AI-powered workflows, automations, dashboards, demo
    utilities, and internal productivity tools.
  - Integrate with internal and third-party APIs to streamline
    GTM processes.
  - Prioritize incoming feature requests while maintaining a
    high-quality, reliable portfolio of internal AI products.
  - Continuously evaluate emerging AI development tools and best
    practices to maximize development velocity.

  What We're Looking For

  - 2–6+ years of software engineering, computer science, or
    application development experience.
  - Experience building and shipping full-stack applications.
  - Strong programming fundamentals and software architecture
    skills.
  - Experience developing production-quality web applications or
    internal business tools.
  - Comfortable working across frontend, backend, APIs,
    databases, and cloud services.
  - Hands-on experience using AI coding assistants as part of
    your development workflow.
  - Experience with Claude Code is strongly preferred.
  - Ability to independently scope, architect, build, and
    deliver projects with minimal oversight.
  - Strong product instincts with a focus on usability,
    scalability, and business impact.
  - Excellent communication skills and the ability to
    collaborate with technical and non-technical stakeholders.

  Preferred Experience

  - Experience with Claude Code or similar AI-native development
    environments.
  - Experience using tools such as Cursor, GitHub Copilot,
    Windsurf, or other AI coding platforms.
  - Experience integrating with SaaS platforms and REST APIs.
  - Familiarity with LLM APIs and AI application development.
  - Experience deploying and maintaining cloud-hosted
    applications.
  - Passion for learning and adopting emerging AI technologies.

  Success in this Role

  Within your first year, you'll:

  - Build and launch multiple AI products that become core tools
    for our Solutions Engineering, Sales, and Marketing teams.
  - Eliminate repetitive work through intelligent automation.
  - Establish an AI-first development practice that enables our
    GTM organization to move faster.
  - Build and own a portfolio of internal AI products that
    become foundational to how our GTM organization operates
    and scales.
  - Become the trusted technical partner GTM leaders rely on to
    transform ideas into software that delivers measurable
    business impact.

  Why This Role Matters

  Our GTM organization is constantly evolving, and the speed
  at which we can build internal products directly impacts how
  effectively we engage customers and scale the business.

  This role isn't about building one-off tools or
  automations—it's about creating a portfolio of internal AI
  products that give our GTM teams a competitive advantage.
  You'll leverage AI-first development practices and tools
  like Claude Code to rapidly transform ideas into production-
  ready products, continuously iterate based on user feedback,
  and help define how AI accelerates software development
  across the company.

  If you love building software, experimenting with the latest
  AI development tools, and creating products that make entire
  teams more productive, we'd love to meet you.

  Unleash Your Potential

  When you join Salesforce, you’ll be limitless in all areas
  of your life. Our benefits and resources support you to find
  balance and be your best, and our AI agents accelerate your
  impact so you can do your best. Together, we’ll bring the
  power of Agentforce to organizations of all sizes and
  deliver amazing experiences that customers love. Apply today
  to not only shape the future — but to redefine what’s
  possible — for yourself, for AI, and the world.

  Accommodations

  If you need a reasonable accommodation during the
  application or the recruiting process, please submit a
  request via this Accommodations Request Form.

  Please note that Salesforce uses artificial intelligence
  (AI) tools to help our recruiters assess and evaluate
  candidates’ resumes and qualifications throughout the
  recruiting process. Humans will always make any candidate
  selection and hiring decisions. Please see our Candidate
  Privacy Statement for more information about how we use your
  personal data and your rights, including with regard to use
  of AI tools and opt out options.

