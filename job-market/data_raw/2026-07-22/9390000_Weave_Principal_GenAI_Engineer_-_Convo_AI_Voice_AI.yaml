title: "Principal GenAI Engineer - Convo AI | Voice AI"
company: Weave
location: USA
remote: true
work_type: FULL_TIME
description: |
  Weave is looking for a Principal Engineer to join the
  Machine Learning Team specialized in voice and audio
  modalities, where you will be at the forefront of enabling
  product innovation and building AI-powered applications. In
  this role, you will help design how teams across Weave build
  out AI-powered features, serving as a technical leader who
  bridges the gap between sophisticated machine learning and
  practical, customer-facing products.

  As a technical cornerstone, you will design the platforms
  that allow our engineering organization to incorporate AI
  into their features seamlessly. Your success is measured by
  the scalability of our ML infrastructure and the ability of
  our product teams to deliver world-class, AI-driven
  experiences to 30,000+ healthcare practices.

  This is a strategic leadership position requiring deep
  expertise in MLOps and GenAI. You will consult with teams on
  common ML patterns and tradeoffs, ensuring that our
  technical strategy for data and intelligence positions Weave
  as a leader in the healthcare communication space.

  The Data Fellowship encompasses multiple engineering teams
  responsible for Weave's core data and AI/ML capabilities We
  own or support products such as Call Intelligence and AI
  Receptionist as well as the ML Platform used by all other
  engineering teams at Weave. You will work across these teams
  as a technical leader, partnering with Engineering Managers,
  Staff Engineers, and cross-functional stakeholders to drive
  architectural coherence and strategic technical initiatives.

  • This position is remote (US-based).

  • Reports to: Sr Director of Engineering

  What You Will OwnInfrastructure & Delivery

  - Design and develop ML infrastructure, tooling, and models to
    help teams deliver world class experiences
  - Build internal and external products and platforms to enable
    teams to incorporate AI into their features and customer
    facing products
  - Translate product goals into actionable engineering plans
    and build scalable, resilient services for data
    integration and event processing

  Cross-Team Problem Solving

  - Help product and development teams understand the data
    lifecycle and consult with teams on common ML
    patterns/tradeoffs
  - Coach and collaborate inside and outside the team to elevate
    technical standards
  - Write high-quality, performant, sustainable, and testable
    code while working in a cloud environment

  Strategic Technical Leadership

  - Monitor the industry landscape, anticipate where
    technological advances are heading, and ensure Weave stays
    ahead of the curve
  - Cut through noise and hype to identify genuine strategic
    value; advocate for and lead key initiatives that prepare
    Weave for emerging challenges
  - Shape company-wide standards for engineering excellence,
    observability, and reliability in distributed systems

  Mentorship & Organizational Capability

  - Actively mentor Staff and Senior Engineers across the
    fellowship, developing the next generation of technical
    leaders
  - Elevate architectural thinking across teams through design
    reviews, documentation standards, and hands-on guidance
  - Build organizational capability that persists beyond your
    individual contributions

  What You Will Need to Accomplish the Job

  - 12+ years of software engineering experience with
    progressive technical leadership scope
  - Demonstrable experience building and deploying ML driven B2B
    multi-tenant applications in production environments at
    scale for external products and customers
  - Deep expertise in distributed systems architecture,
    including building and operating services that handle
    hundreds of millions of transactions and terabytes of data
  - 8+ years of experience in Machine Learning or AI, with a
    focus on or expertise in audio and voice GenAI solutions
    at scale
  - Deep expertise with modern ML tools and techniques such as
    LLMs, RAG, Prompt Engineering, Fine Tuning, and
    specifically high-scale audio/voice models and LLM
    evaluations
  - Strong background in scalable data stores—both relational
    (PostgreSQL at scale, Vitess, Spanner) and NoSQL
    (Bigtable, Redis, etc.)
  - Operational experience with cloud-native infrastructure on
    GCP or AWS, including Kubernetes, infrastructure-as-code,
    and highly available system design
  - Track record of leading cross-team technical initiatives
    that delivered measurable business outcomes
  - Demonstrated ability to influence without direct authority,
    build consensus across organizational boundaries, and
    translate technical tradeoffs into business terms

  What Will Make Us Love You

  - Expertise with customer facing GenAI at scale, in production
  - Expertise building low latency high accuracy AI Agents
  - Audio or Voice GenAI in Production at scale: Mandatory deep
    experience delivering meaningful voice/audio solutions to
    external products (confirming "been there, done that"
    experience, not aspirational)
  - Background in compliance-heavy environments (healthcare,
    fintech) with experience navigating regulatory
    requirements in technical design
  - History of external technical leadership: open source
    contributions, conference speaking, or published technical
    writing
  - Strong opinions, loosely held—you bring conviction to
    technical discussions while remaining genuinely open to
    better ideas

  Employment with Weave is contingent upon the successful
  completion of a background check, conducted in accordance
  with applicable laws.

  At Weave, we use Artificial Intelligence (AI) tools to help
  us work more efficiently and create a smoother candidate
  experience. AI may assist with things like writing job
  descriptions, scheduling interviews, or reviewing
  applications against job-related criteria. For additional
  information, please review the External AI Policy Statement
  available on our Careers page.

  Weave is an equal opportunity employer that is committed to
  fostering an inclusive workplace where all individuals are
  valued and supported. We welcome anyone who is hungry to
  learn, problem-solve and progress regardless of race, color,
  ancestry, religion, sex, national origin, sexual
  orientation, age, citizenship, marital status, disability,
  gender identity, veteran status, or other applicable legally
  protected characteristics. If you have a disability or
  special need that requires accommodation, please let us
  know.

  Beware of recruitment fraud. All official correspondence
  will occur through Weave branded email. We will never ask
  you to share bank account information, cash a check from us,
  or purchase software or equipment as part of your interview
  or hiring process.
