title: Software Engineer II, Enterprise AI Enablement (Employer of Record)
company: Credit Acceptance Corporation
location: IND
remote: true
work_type: FULL_TIME
company_size: 1,937 Employees
description: |
  Credit Acceptance is proud to be an award-winning company
  with workplace recognition in multiple categories! Our
  world-class culture is shaped by dedicated Team Members who
  share a drive to succeed as professionals and together as a
  company. A great product, amazing people and our stable
  financial history have made us one of the largest used car
  finance companies in the United States.

  In this role, you will work as a dedicated member of a
  globally distributed team, partnering closely with business
  partners in the U.S. to design, build, and scale solutions
  that directly impact our customers and operations. While
  your legal employer will be our EoR partner, you will be
  fully integrated into our Credit Acceptance team for day-to-
  day work and collaboration.

  Put AI to work where it changes lives: We are looking for a
  Software Engineer II for our Enterprise AI Enablement team.
  In this role, you will work as a dedicated member of a
  globally distributed team, partnering closely with business
  partners in the U.S. You will design, build, test, and ship
  production software that uses modern AI capabilities to
  improve workflows for dealers, consumers, and team members.
  This is a hands-on engineering role focused on turning
  problems into reliable, maintainable solutions. While your
  legal employer will be our EoR partner, you will be fully
  integrated into our Credit Acceptance team for day-to-day
  work and collaboration.  Build for leverage: You will
  develop and implement solutions designed for reuse across
  enterprise workflows. You will own features that act as
  pluggable building blocks for multiple solutions, while
  staying close to implementation details, quality, telemetry,
  and production outcomes.



  This position will work remotely from India.

  Outcomes and Activities:

  - Work closely with customers, product partners, and team
    members to understand workflows, clarify requirements, and
    translate needs into well-scoped technical deliverables.
  - Build applied AI capabilities across high-value enterprise
    workflows such as automation, document intelligence,
    decision support, fraud intelligence, and intelligent
    assistants.
  - Implement components of context-aware AI systems that
    integrate prompts, tools, APIs, retrieval patterns, and
    business logic using established architecture patterns.
  - Contribute to reusable engineering building blocks,
    services, and platform capabilities that can support
    multiple enterprise workflows rather than one-off
    solutions.
  - Identify when existing agents, models, APIs, or platform
    capabilities can be reused and contribute to practical
    build vs. reuse recommendations.
  - Stay current on practical AI engineering patterns and bring
    forward ideas that improve quality, speed, or customer
    value.
  - Design and develop software and improve existing code
  - Write unit-tests and validate your software against
    acceptance criteria
  - Apply team coding, documenting and testing standards
  - Conduct impact analysis to proactively identify impact of a
    change within an application
  - Participate in code reviews and communicate application
    changes
  - Document code and projects so others can easily understand,
    maintain and support
  - Debug the problems which arise in production and propose
    effective solutions
  - Read and write design documents
  - Learn the business process domain to better support the
    business
  - Contribute to team's sprint commitments and actively
    participate in our Agile practices
  - Contribute to continuous learning activities to improve
    design and code quality as well as to increase application
    domain knowledge
  - Guide and aid less experienced software engineers

  Competencies: The following items detail how you will be
  successful in this role.

  - Customer Empathy: Customer Empathy is the ability to
    understand the perspectives, pain points, and experiences
    of customers. It involves actively putting oneself in the
    customer’s shoes, comprehending their needs and
    challenges, and using that understanding to provide a
    better, more customer-centric experience.
  - Engineering Excellence: Engineering Excellence is about
    bringing great craftsmanship and thought leadership to
    deliver an outstanding product that delights customers and
    solves for the business. This involves the pursuit and
    achievement of high standards, best practices, innovation,
    and superior solutions.
  - One Team: A One Team mindset refers to a collaborative
    approach across the organization, where individuals work
    together seamlessly, without boundaries, as a single,
    cohesive team. Shared goals, open communication and mutual
    support create a sense of collective purpose. This enables
    teams to navigate challenges and pursue shared objectives
    more effectively.
  - Owner’s Mindset: Owner’s Mindset involves adopting a set of
    behaviors that reflect a sense of responsibility,
    accountability, strategic thinking, and a proactive
    approach to managing your domain. As an owner, you
    understand the business and your domain(s) deeply and
    solve for the right outcome for the domain(s) and the
    business.

  Requirements:

  - Bachelor’s degree in Computer Science, Information Systems,
    or closely related field of study; or equivalent work
    experience
  - Minimum 2 years of software engineering experience or
    comparable depth of experience
  - Experience developing applications that integrate with AI
    services, enterprise APIs, data platforms, or workflow
    automation capabilities.
  - High ownership, sound judgment, and ability to operate
    effectively in partially defined or ambiguous problem
    spaces, with a bias for action.
  - Strong grasp of software engineering fundamentals, including
    system design, APIs, CI/CD, version control, and
    disciplined development workflows
  - Use of one or more object-oriented programming languages and
    design patterns
  - Willingness to participate in an on-call rotation

  Preferred:

  - Advanced degree in Computer Science, Machine Learning,
    Information Systems, or a related technical field.
  - Experience building generative AI, automation, intelligent
    assistant, or AI-enabled workflow capabilities in
    production or production-like environments.
  - Experience with reliability, observability, evaluation,
    guardrails, API integration, or compliance considerations
    for AI-enabled systems.
  - Experience using modern developer tools and AI-assisted
    engineering practices to improve development speed, code
    quality, testing, or maintainability.

  Knowledge and Skills:

  - Show initiative and offer assistance when needed
  - Be introspective and open to feedback to continuously
    improve. Prioritize personal development and identify
    potential barriers
  - Be collaborative with other team members, seeking a
    diversity of thought to meet business outcomes
  - Ability to communicate complex technical information (both
    verbal and written) to all levels, including senior
    leadership

  CTC Range: ₹27.32.275 – ₹40.07.275

  Total Compensation (CTC): Final CTC will be shared during
  the offer stage and will include all compensation components
  in detail as per EoR vendor's structure.

  Final compensation within the range is influenced by many
  factors including role-specific skills, depth and experience
  level, industry background, relevant education and
  certifications.

  This role is hired through an Employer of Record (EoR)
  partner in India.

  - You will be legally employed in India through our EoR
    partner
  - While your legal employer is the EoR partner, you will work
    full-time and be fully aligned to Credit Acceptance
  - Your day-to-day work, responsibilities, and performance
    expectations will be consistent with our global team
    members
  - You will receive locally compliant payroll, benefits, and
    statutory coverage through the EoR partner

  Our Company Values:

  To be successful in this role, Team Members need to be:

  - Positive by maintaining resiliency and focusing on
    solutions.
  - Respectful by collaborating and actively listening.
  - Insightful by cultivating innovation, accumulating business
    and role specific knowledge, demonstrating self-awareness
    and making quality decisions.
  - Direct by effectively communicating and conveying courage.
  - Earnest by taking accountability, applying feedback and
    effectively planning and priority setting.

  Expectations:

  - Regularly overlap with U.S. business hours to support
    collaboration with global team members.
  - Remain compliant with our policies, processes and guidelines
  - All other duties as assigned
  - Attendance as required by department

  Play the video below to learn more about our Company
  culture.
