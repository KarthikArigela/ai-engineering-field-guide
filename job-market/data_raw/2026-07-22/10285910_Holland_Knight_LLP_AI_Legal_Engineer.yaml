title: AI Legal Engineer
company: "Holland & Knight LLP"
location:
work_type: FULL_TIME
description: |
  We are a Firm where people truly believe in what they do and
  strive to achieve the highest standards of performance and
  success.



  This position can be based in our global operations center
  in Tampa, FL, or at one of the Firm's offices: Atlanta,
  Austin, Birmingham, Boston, Century City, Charlotte,
  Chattanooga, Chicago, Dallas, Denver, Fort Lauderdale,
  Houston, Jacksonville, Los Angeles, Miami, Nashville,
  Newport Beach, New York, Orlando, Philadelphia, Portland,
  Richmond, San Francisco, Seattle, Stamford, Tallahassee,
  Tysons, Washington, D.C., or West Palm Beach.

  General Description:

  The AI Legal Engineer is responsible for partnering with
  subject matter experts to design, build, and operationalize
  AI-enabled workflows that solve concrete problems for the
  Firm's practice groups, and for equipping attorneys to
  build, refine, and govern their own workflows over time.

  This role pairs hands-on workflow or skill development
  including prompt design, retrieval pipelines, document
  templates, evaluations, and guardrails with practice-group-
  facing training, enablement, and change management. The AI
  Legal Engineer will serve as a primary, trusted resource for
  our practice groups, supporting the successful rollout and
  sustained adoption of AI solutions and driving meaningful,
  long-term behavior change.


  The AI Legal Engineer works closely with the AI Product
  team, AI Adoption team, the broader Knowledge & Innovation
  team, IT, the Innovation Practice Group, and Professional
  Development to translate attorney needs into reliable,
  repeatable AI solutions that deliver measurable value in
  daily legal work.


  Key Responsibilities and Essential Job Functions:

  - Design, build, test, and deploy AI legal workflows and
    skills across firm-approved AI tools, supporting use cases
    such as contract review, due diligence, drafting,
    research, and summarization.
  - Partner directly with attorneys and knowledge management
    professionals to identify high-value use cases, map
    workflows, and translate practice needs into structured AI
    solutions.
  - Develop and maintain retrieval pipelines, document
    templates, and reusable workflow components with clear,
    attorney-ready documentation.
  - Build and execute evaluation frameworks to measure workflow
    quality, accuracy, and reliability; monitor performance
    and iterate based on feedback and outcomes.
  - Serve as a go-to resource for enablement and change
    management for developed workflows, partnering with the AI
    Adoption team to drive usage, deliver training sessions
    and workshops, 1:1 coaching, and develop practical
    playbooks and materials that support sustained adoption.
  - Develop and scale best-practice standards, use-case
    libraries, and playbooks that empower attorneys to
    responsibly and independently leverage AI tools while
    maintaining quality and risk controls.
  - Embed human-review checkpoints and audit mechanisms aligned
    with Firm governance, confidentiality, and professional
    responsibility requirements.
  - Collaborate closely with cross-functional stakeholders
    including the AI Product team, AI Adoption team, Knowledge
    & Innovation team, IT, Innovation Practice Group, and
    Professional Development to ensure aligned delivery and
    support.
  - Track adoption, usage, and impact metrics for deployed
    workflows and recommend refinements or expansion
    opportunities.
  - Manage ongoing maintenance of production workflows,
    including updates to prompts, retrieval sources, and
    guardrails in response to model and platform changes, user
    feedback, or evolving practice needs.
  - Represent the AI Products & Adoption team in internal
    meetings, committees, and practice group sessions.
  - Expected to maintain a regular and predictable work schedule
    and full attention to and engagement in work activities on
    behalf of the firm during business hours unless otherwise
    approved or required by applicable law.
  - Special projects and duties as assigned.

  Required Skills:

  - Demonstrated ability to design and build AI-enabled
    workflows in legal or professional-services settings,
    including prompt engineering, retrieval-augmented
    generation (RAG) concepts, and evaluation of model
    outputs.
  - Working understanding of legal practice and attorney
    workflows, with the judgment to identify where AI is, and
    is not, appropriate.
  - Strong interpersonal skills with experience building trusted
    relationships with attorneys, including partners and
    senior stakeholders.
  - Clear, confident communicator able to teach AI concepts and
    workflow-building skills to non-technical legal audiences
    in practical terms.
  - Comfort iterating in ambiguity: scoping a use case, building
    a prototype, gathering feedback, and refining toward a
    production-ready workflow.
  - Strong attention to quality, accuracy, and risk; instinct to
    build in human-review and verification steps for legal
    output.
  - Consistently reliable, responsive, and solutions oriented.
  - Working knowledge of the legal AI vendor landscape (e.g.,
    Harvey, Legora, Microsoft Copilot, and similar) and
    familiarity with the components of modern AI workflow
    builders.
  - Proficient in Microsoft Office Suite, or Microsoft 365.

  Required Qualifications & Education:

  - Juris Doctor (JD) or equivalent legal background (e.g.,
    practicing attorney, knowledge lawyer, paralegal with
    substantive practice experience)
  - 3–6+ years of experience in legal, legal technology,
    knowledge management, practice innovation, or a comparable
    professional-services environment.
  - Demonstrated experience designing or implementing AI,
    automation, or workflow solutions in a legal or
    professional-services context.
  - Experience delivering training, enablement, or onboarding
    programs to attorney or client-facing audiences.

  Preferred Qualifications & Education:

  - Prior experience at an AmLaw firm, in-house legal
    department, or legal technology company (e.g., Harvey,
    Legora, or similar).
  - Hands-on experience with workflow builders, prompt
    libraries, RAG pipelines, and AI evaluation methods.
  - Familiarity with AI governance frameworks and emerging AI
    regulation relevant to legal practice.
  - Light coding fluency (e.g., Python, SQL, or scripting) a
    plus but not required.

  Physical Requirements:

  - Ability to sit or stand for extended periods of time.
  - Moderate or advanced keyboard usage.

  This position may be filled in multiple locations. In
  accordance with applicable Pay Transparency Laws, the pay
  range(s) for this position are listed below. These ranges
  may not be applicable to other locations. An individual's
  actual compensation will depend on the individual's
  qualifications and experience. In addition to the base
  compensation, Holland & Knight provides bonus opportunities
  and an exceptional benefits package.

  California, Massachusetts, New York (City), District of
  Columbia: $163,000.00 - $245,000.00 per year Illinois,
  Washington, Tysons: $150,000.00 - $224,000.00 per year
  Colorado, Richmond: $136,000.00 - $204,000.00 per year

  Benefits: Our goal is to promote a work environment in which
  individuals have access to the resources they need to be
  their best both professionally and personally, which
  includes resources that encourage individuals to focus on
  their health and well-being.

  Below are the benefits we offer: comprehensive medical (PPO
  and HDHPs), dental and vision plans including coverage for
  domestic partners; life and AD&D insurance; short and long
  term disability insurance; tax-advantaged accounts for
  health care expenses, including FSAs and HSAs; FSAs for
  dependent care; health advocacy services; behavioral health
  and counseling resources for all family members; 401(k);
  profit sharing; backup dependent care; senior care planning
  support; resources for individuals with development
  disabilities and their caregivers; and paid holidays and
  other paid time off, including paid leave for new parents.

