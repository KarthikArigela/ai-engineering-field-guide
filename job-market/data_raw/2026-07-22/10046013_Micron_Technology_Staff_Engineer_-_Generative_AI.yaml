  Our vision is to transform how the world uses information to
  enrich life for all .  Micron Technology is a world leader
  in innovating memory and storage solutions that accelerate
  the transformation of information into intelligence,
  inspiring the world to learn, communicate and advance faster
  than ever. Our vision is to transform how the world uses
  information to enrich life for all. Micron Technology is a
  world leader in innovating memory and storage solutions that
  accelerate the transformation of information into
  intelligence, inspiring the world to learn, communicate and
  advance faster than ever. About the Role We are looking for
  a hands-on Senior Software Engineer - Generative AI to
  compose, build, and productionize enterprise-grade GenAI
  applications on AWS. This role is ideal for an engineer who
  combines strong software engineering fundamentals with real-
  world experience delivering LLM-powered solutions in
  production. You will operate in a forward-deployed
  engineering model-working closely with business and product
  teams to understand workflows, rapidly prototype solutions,
  and drive them to full-scale production. Responsibilities:

  - Develop, build, and productionize GenAI applications on AWS,
    using services such as Amazon Bedrock and core cloud
    infrastructure.
  - Build RAG pipelines, agentic workflows, tool/function-
    calling systems, and AI-powered enterprise assistants.
  - Work directly with business collaborators to understand
    workflows, find opportunities, and deliver impactful AI
    solutions.
  - Build backend services, APIs, and orchestration layers for
    GenAI systems, including vector search, embeddings, and
    model integration.
  - Own end-to-end lifecycle from prototype to production:
    architecture, development, deployment, monitoring, and
    optimization.
  - Build and implement evaluation pipelines (accuracy,
    groundedness, latency, cost, safety) for GenAI systems.
  - Ensure enterprise-grade security and responsible AI
    practices, including access control, PII handling,
    guardrails, and prompt-injection mitigation.
  - Build reusable frameworks, templates, and playbooks to scale
    GenAI adoption across teams.
  - Stay hands-on with the codebase, participate in build
    reviews, and mentor engineers on GenAI guidelines.

  Minimum Qualifications:

  - 8-12 years of professional software engineering experience.
  - Minimum 2+ years of production experience with Generative AI
    / LLM-based systems.
  - Strong backend engineering expertise in Python with
    experience in APIs, microservices, and distributed
    systems.
  - Hands-on experience building production GenAI applications
    using RAG, agents/tool calling/orchestration, embeddings,
    and vector databases.
  - Strong experience with AWS cloud ecosystem, preferably
    including Amazon Bedrock, S3, Lambda, ECS/EKS, API
    Gateway, OpenSearch/vector search, RDS/Postgres, IAM, KMS,
    Secrets Manager, and CloudWatch.
  - Experience crafting scalable, secure, and reliable systems
    in production.
  - Strong problem-solving skills with the ability to translate
    ambiguous business problems into technical solutions.
  - Excellent communication and collaborator management skills.

  Preferred Qualifications:

  - Experience with frameworks such as LangChain, LangGraph,
    LlamaIndex, DSPy, Semantic Kernel, CrewAI, AutoGen.
  - Experience building multi-agent systems, enterprise
    copilots, document intelligence, or search systems.
  - Knowledge of LLMOps / MLOps practices (model versioning, A/B
    testing, evaluation pipelines).
  - Experience in customer-facing or forward-deployed
    engineering roles.
  - Exposure to frontend frameworks (React / Angular).
  - Experience with Kubernetes, Docker, Terraform/CDK.

  Who Will Succeed in This Role You are a hands-on builder who
  enjoys solving real business problems using AI-not just
  crafting demos. You are comfortable working across
  ambiguity, writing production-grade code, and collaborating
  closely with partners. If you enjoy owning solutions end-to-
  end-from problem discovery to production deployment-and want
