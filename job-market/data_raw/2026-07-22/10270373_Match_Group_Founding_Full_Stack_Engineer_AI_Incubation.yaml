description: |
  Know where you belong! Match Group is a leading provider of
  dating products across the globe. Our portfolio includes
  Tinder, Hinge, Match, Meetic, PlentyOfFish, OkCupid, The
  League, HER, and others, each designed to spark meaningful
  connections for singles worldwide. Creating a sense of
  belonging doesn’t stop at our products - it’s the foundation
  of every team we hire.



  When it comes to dating, the connection starts online, but
  the real magic happens once you meet in real life (IRL).  We
  think the same is true for creating the best platforms, so
  we work together IRL 3 days/week.

  At Match Group, our mission is to spark meaningful
  connections for every single person worldwide. Across our
  portfolio of trusted brands, we help millions of people
  discover, connect, date, and build relationships in ways
  that reflect their identities, intentions, cultures, and
  communities.

  We work together to solve complex problems at the
  intersection of human connection, behavioral science,
  network economics, AI and ML, safety, privacy, cultural
  nuance, loneliness, love, sex, and relationships.

  As the world’s leading portfolio of dating products, Match
  Group has a unique opportunity to imagine what comes next
  for dating — including how emerging technologies can help
  people feel more understood, more intentional, and more
  confident as they connect.

  The Team

  Match Group is building an internal incubation focused on
  AI-powered dating experiences to redefine the category.

  Dating is a deeply human experience, but many of today’s
  products were built before AI could understand context,
  intent, nuance, and feedback at scale. We believe there is
  an opportunity to rethink parts of the dating experience
  from first principles, combining strong consumer product
  craft with AI-native systems that help people connect with
  more confidence, clarity, and trust.

  This team will operate like a small startup inside Match
  Group. We are moving from product hypothesis to prototype to
  pilot, with the goal of learning quickly from real users and
  identifying whether there is a new product opportunity that
  can scale.

