title: Senior Front-end Engineer (Libra - Legal AI Assistant) (m/f/d)
company: Wolters Kluwer
location: Berlin, DEU
work_type: FULL_TIME
company_size: 18,996 Employees
description: |
  As a Senior Frontend Engineer (m/f/d), you'll be joining
  Libra to help legal and compliance professionals enhance
  productivity, mitigate risk, and solve complex problems
  confidently.



  There are hundreds of thousands of lawyers across Europe —
  and at Libra, we're transforming how they work. Our AI
  platform combines deep legal reasoning with cutting-edge
  generative technology, fundamentally changing how lawyers
  research, draft, and deliver legal work.



  About the role



  We're looking for an exceptional Senior Frontend Engineer to
  join our fast-growing engineering team. You'll be joining at
  a stage where the product has grown quickly and the frontend
  is ready for its next chapter — the opportunity to shape
  structure, raise the bar, and define what mature looks like
  is wide open.



  You'll own significant product surfaces end-to-end, lead the
  consolidation of our component library, and bring your own
  opinions on architecture, state, and performance to the
  work. You'll build novel UX at the forefront of human-AI
  interaction in legal — collaborating closely with our design
  team and in-house legal experts to make AI that lawyers
  actually want to use.



  This is a role for someone who reads "still maturing" as
  opportunity rather than red flag — and who wants real
  ownership over how a fast-moving legal AI product evolves
  into something stable, scalable, and a pleasure to build on.



  You'll be part of a highly skilled technology organization
  and a fast-growing product organization. An ambitious and
  thrilling place to be as you'll be essential to both
  strategic alignment and local execution. You'll be working
  at the vibrant Merantix AI Campus in Berlin, surrounded by a
  community of AI innovators. We value collaboration,
  curiosity, and a bias toward action.



  What you'll do

  - Own significant product surfaces end-to-end across our
    SvelteKit application — from architecture decisions
    through to the polish of the final user experience.
  - Lead the consolidation of UI patterns into a coherent
    component library — bringing consistency to an area that's
    still finding its shape.
  - Drive frontend quality forward — raise the bar on type
    safety, reduce duplication, and establish patterns the
    rest of the team can follow.
  - Partner with design and UX to evolve the design system and
    push it through to broad adoption across the product.
  - Build novel UX at the forefront of human-AI interaction in
    legal — streaming responses, citation rendering, source
    attribution, and tool-use surfaces.
  - Raise the bar across the team through code review, pairing,
    and mentoring.



  What you'll bring



  Education

  Bachelor's degree preferred in Software Engineering or a
  related technical field.



  Experience

  - Minimum 5 years of relevant experience in product frontend
    engineering.
  - Deep proficiency in TypeScript and strong experience with
    Svelte/SvelteKit — or comparable depth in React or Vue
    with the willingness to ramp up quickly.
  - Solid command of modern CSS and design tokens; experience
    with Tailwind is a plus.
  - Hands-on experience with real-time UI patterns — streaming
    responses, SSE, optimistic updates.
  - Proven experience building or significantly evolving a
    design system or component library.
  - Experience using AI coding agents like Cursor or Claude
    Code.
  - Bonus: You've built UX for LLM-powered or otherwise non-
    deterministic products.
  - Bonus: Full-stack experience (especially Python/FastAPI) is
    a plus, but not required — this is a frontend-focused
    role.



  Skills

  - Comfortable bringing structure to an evolving codebase — and
    you find that energizing rather than off-putting.
  - Entrepreneurial mindset with strong ownership and urgency.
  - A pragmatic approach to problem solving. It's more important
    to you to solve the problem than to use new/hyped
    technology.
  - Strong product sensibility — you own user outcomes, not just
    shipped tickets.
  - Excellent communication in English; German is a plus.



  Working together



  This is a hybrid role, where you will spend at least eight
  days a month at our office, where you'll enjoy the benefits
  of connecting and collaborating with your colleagues in
  person.



  What we offer

  - Permanent employment day one.
  - Remote work & flexibility: Work remotely up to 3 days per
    week (home office) (= 8 days a month in the office) with
    flexible working hours.
  - Work abroad flexibly: Work from anywhere within the EU for
    up to 20 days within a twelve-month period.
  - Rest & time off: 26 vacation days.
  - Show your commitment: 1 additional day off per year for your
    volunteer work (Volunteer Day).
  - Support for development: E-learning via LinkedIn, online
    language training with goFluent, and other training and
    development opportunities.



  In just over a year, we've established ourselves as Europe's
  fastest-growing legal AI company by partnering with leading
  law firms, corporate legal departments, and publishers.
  Libra is building the operating system for modern legal work
  — and you can help us write its next chapter.

  #LI-Hybrid



  Our Interview Practices

  To maintain a fair and genuine hiring process, we kindly ask
  that all candidates participate in interviews without the
  assistance of AI tools or external prompts. Our interview
  process is designed to assess your individual skills,
  experiences, and communication style. We value authenticity
  and want to ensure we’re getting to know you—not a digital
  assistant. To help maintain this integrity, we ask to remove
  virtual backgrounds and include in-person interviews in our
  hiring process. Please note that use of AI-generated
  responses or third-party support during interviews will be
  grounds for disqualification from the recruitment process.

  Applicants may be required to appear onsite at a Wolters
  Kluwer office as part of the recruitment process.
