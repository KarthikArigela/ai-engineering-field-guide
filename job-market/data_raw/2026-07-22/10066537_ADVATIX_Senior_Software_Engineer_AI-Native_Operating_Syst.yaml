  Overview As a foundational Senior Software Engineer in New
  York City, you will architect the AI-native operating system
  that powers the future of food distribution. This is a high-
  agency role where you will build and ship production-grade
  AI agents designed to automate complex operational workflows
  like purchasing, inventory management, and order intake. You
  will move beyond prototypes to develop sophisticated multi-
  step reasoning systems, tool-use frameworks, and memory
  architectures that can reason over messy, real-world ERP
  data. Working in a forward-deployed model, you will partner
  directly with customers to turn ambiguous manual processes
  into scalable AI-native workflows while ensuring the
  reliability of these systems through rigorous evaluation and
  monitoring loops. This position is designed for a technical
  leader with a clear trajectory toward becoming Head of
  Engineering. You will sit at the center of the core team,
  reviewing code and raising the bar for engineering standards
  and architectural integrity across the platform. We are
  looking for a senior engineer with raw intellectual
  horsepower who has successfully shipped LLM systems in
  production and possesses the managerial instincts to mentor
  others. You should thrive in a high-velocity, intellectually
  competitive environment where you own projects from initial
  concept to live execution. Responsibilities You'll be a
  foundational senior engineer building the AI agents that run
  real food-distribution businesses — working directly with
  the founders, raising the bar across the core team, and on
  track to grow into Head of Engineering. Build and ship AI
  agents that automate operational workflows like purchasing,
  inventory management, order intake, and customer support
  Architect multi-step agent systems with tool use, structured
  outputs, memory, and orchestration across complex workflows
  Develop context + memory systems that let agents reason over
  transaction history, customer behavior, and SKU-level
  operational data Work directly with live ERP and ops data —
  incomplete, inconsistent, and very real Create evaluation,
  monitoring, and feedback loops to continuously improve agent
  reliability in production Partner directly with customers in
  a forward-deployed model, turning ambiguous, poorly
  documented processes into AI-native workflows Review code
  and sit on top of the core teams day-to-day, raising the bar
  on architecture, code quality, and engineering standards Own
  the holistic scalability of the platform and partner with
