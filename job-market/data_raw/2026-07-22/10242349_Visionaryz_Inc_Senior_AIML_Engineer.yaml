description: |
  Job Summary:

  We are seeking a highly skilled and experienced Senior AI/ML
  Engineer to join our team. This position will play a crucial
  role in the creation of a new unit focused on building
  AI/ML-powered solutions and piloting the adoption of cloud
  platforms, including Azure, or Oracle's data science
  platform. The successful candidate will be responsible for
  setting up end to end MLOps and integrating model outputs
  into business user reports using PowerBI, Oracle Analytics
  or APIs.

  Key Responsibilities:

  - End-to-end usage of AI/ML models, with a focus on LLMs fine
    tuning/RAG.
  - Design and implement MLOps processes to ensure efficient and
    reliable model training, validation, deployment, and
    monitoring.
  - Evaluate and pilot the adoption of Azure, Google, or
    Oracle's data science/ML cloud platforms to determine the
    best fit for the company's needs.
  - Configure and set up ML platforms on Azure or Oracle from
    scratch, ensuring robust and scalable infrastructure.
  - Collaborate with cross-functional teams to understand data
    requirements and integrate AI/ML solutions with existing
    systems.
  - Develop process to continuously pretrain and fine-tune the
    LLM.
  - Document technical processes, methodologies, and best
    practices to support knowledge sharing and team growth.

  Work with developers to integrate model outputs into
  business user reports using PowerBI or Oracle Analytics.

  Qualifications:

  - Education:
    - Master's or Ph.D. in Computer Science, Data Science, Machine
      Learning, or a related field.
    - Certifications in Azure ML or Oracle ML or similar.

  Experience:

  - Required:
    - Minimum of 3 years of experience in AI/ML engineering.
    - Proven track record in developing and deploying AI/ML models
      in a production environment.
    - Hands-on experience with MLOps, including model training,
      validation, deployment, and monitoring.
    - Strong programming skills in Python and experience with
      AI/ML frameworks such as TensorFlow, PyTorch, or
      similar.
    - Experience configuring and setting up ML platforms on Azure
      or Oracle from scratch.
    - Experience with integrating model outputs into business user
      reports using PowerBI or Oracle Analytics.
    - Experience with cloud platforms, preferably with Azure or
      Oracle Data Science Cloud, or willingness to learn.
