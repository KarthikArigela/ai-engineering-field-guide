description: |
  This role is for one of the Weekday's clients

  Salary range: Rs 2500000 - Rs 4000000 (ie INR 25-40 LPA)

  Min Experience: 8+ years

  Location: Hyderabad, Bengaluru

  JobType: full-time

  We are looking for an experienced and innovative Lead
  Engineer – Java, Microservices & AI to join our engineering
  team. This role is ideal for a technology leader who
  combines deep expertise in Java-based enterprise application
  development with modern microservices architecture and
  emerging AI technologies. The ideal candidate will have
  strong technical leadership skills, hands-on development
  experience, and the ability to mentor engineering teams
  while driving the delivery of scalable, secure, and high-
  performing software solutions.

  As a Lead Engineer, you will collaborate with cross-
  functional teams including Product Management, Architecture,
  DevOps, QA, and UX to design, build, and deploy next-
  generation applications. You will also play a key role in
  evaluating and implementing AI-powered development practices
  to improve engineering productivity and product
  capabilities.

  RequirementsKey Responsibilities

  - Lead the design, development, and deployment of enterprise-
    grade applications using Java and microservices
    architecture.
  - Architect scalable, resilient, and secure backend services
    while ensuring high availability and performance.
  - Develop responsive and modern user interfaces using React to
    deliver seamless user experiences.
  - Drive the adoption of AI technologies to enhance software
    development, automation, and intelligent application
    capabilities.
  - Collaborate with product owners, architects, and engineering
    teams to translate business requirements into technical
    solutions.
  - Review code, enforce engineering best practices, and ensure
    high standards of software quality through testing and
    continuous integration.
  - Mentor and guide developers through technical challenges,
    design reviews, and knowledge-sharing sessions.
  - Participate in architectural discussions, technology
    evaluations, and strategic engineering initiatives.
  - Identify performance bottlenecks and optimize applications
    for scalability, reliability, and maintainability.
  - Work closely with DevOps teams to streamline deployment
    pipelines and support CI/CD practices.

  Required SkillsMust-Have Skills

  - Strong expertise in Java with extensive experience building
    enterprise-scale applications.
  - Hands-on experience in designing and developing
    Microservices using modern architectural patterns.
  - Solid experience with React for building scalable and
    interactive web applications.
  - Practical knowledge of Artificial Intelligence (AI) concepts
    and integrating AI capabilities into enterprise
    applications.
  - Strong understanding of RESTful APIs, distributed systems,
    multithreading, and object-oriented design principles.
  - Experience with SQL/NoSQL databases, version control
    systems, and Agile development methodologies.
  - Excellent problem-solving, debugging, analytical, and
    communication skills.
  - Proven ability to lead technical teams and deliver complex
    projects successfully.

  Good-to-Have Skills

  - Experience working with Microsoft Azure cloud services.
  - Familiarity with GitHub Copilot and AI-assisted software
    development practices.
  - Exposure to Microsoft Copilot or similar AI productivity
    tools.
  - Understanding of containerization technologies, Kubernetes,
    and cloud-native application development.
  - Experience implementing DevOps and CI/CD pipelines.

  Qualifications

  - Bachelor's or Master's degree in Computer Science,
    Information Technology, Engineering, or a related
    discipline.
  - 8–14 years of professional software development experience
    with significant exposure to enterprise application
    development.
  - Demonstrated experience leading engineering teams and
    driving technical excellence across multiple projects.
