description: |
  Join a dynamic team at the pulse of global markets, where we
  deliver innovative software and service solutions for
  essential financial reporting and capital markets
  transactions. At DFIN, we are a values-driven organization
  that empowers you to build a fulfilling career while
  bringing your authentic self to work every day. Our "Win as
  One" mentality ensures that our team's success is directly
  linked to Client, Shareholder and Employee Satisfaction.  In
  2026, DFIN was named #1 on the 2026 Top 100 Global Most
  Loved Workplaces® by Best Practice Institute. We have also
  been recognized as one of America's Most Loved Workplaces®
  for five consecutive years and a Built In Best Place to Work
  for six years, reflecting our continued commitment to
  supporting employees' total well-being. Enjoy competitive
  compensation, a flexible workplace, comprehensive benefits,
  and opportunities for professional growth. Bring your
  passion and talents to DFIN - because being YOU thrives
  here. Summary: We are looking for a hands-on AI Automation
  Engineer to help drive AI-enabled transformation across the
  Client Experience organization. This role will design,
  build, and scale AI agents and automation solutions that
  improve customer interactions, increase efficiency, and
  solve complex business problems. The ideal candidate enjoys
  both technical AI development and end-to-end ownership -
  from identifying opportunities and building solutions to
  deployment, measurement, and continuous improvement.
  Responsibilities: • Design, build, and deploy AI agents and
  automation workflows that support Client Experience use
  cases across Support, Services, and Customer Success •
  Develop multi-step automation solutions that integrate with
  internal systems using APIs and other integration methods •
  Partner with stakeholders to identify, prioritize, and
  execute high-impact AI and automation opportunities. •
  Translate business problems into scalable technical
  solutions that are maintainable and aligned with enterprise
  architecture • Work closely with Product, Engineering, IT,
  Security, Support, and Services teams to align requirements,
  timelines, approvals, and delivery. • Support responsible AI
  deployment by documenting data flows, access controls, and
  solution architecture for governance, privacy, and
  compliance review • Define and track success metrics such as
  automation rate, resolution improvement, efficiency gains,
  and customer outcome improvements. Qualifications: Required
  Qualifications • 2-5 years of experience in a technical role
  within the technology industry • Hands-on experience
  building, coding, or implementing AI and automation
  solutions. • Experience working with APIs and integrating
  systems in a production environment. • Strong understanding
  of how AI can be applied to real-world business use cases. •
  Ability to deliver projects from concept through execution
  while working cross-functionally. • Strong communication
  skills with both technical and non-technical stakeholders. •
  Experience partnering with IT or Security teams on
  approvals, governance, or implementation processes.
  Preferred Qualifications • Experience building AI agents,
  copilots, or workflow automation solutions. • Familiarity
  with customer support, customer success, or client
  experience workflows. • Experience with AI platforms, LLMs,
  or automation tools. • Background in technical project or
  program management. • Experience working in regulated or
  enterprise environments with security requirements. What
  Success Looks Like: Success in this role means AI agents and
  automation solutions are deployed, adopted, and delivering
  measurable improvements in efficiency, automation, and
  customer outcomes. The role will also help build strong
  partnerships across business and technical teams while
  maintaining a scalable pipeline of high-impact AI use cases.
