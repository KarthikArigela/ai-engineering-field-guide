  About Convatec

  Pioneering trusted medical solutions to improve the lives we
  touch:

  Convatec is a global medical products and technologies
  company, focused on solutions for the management of chronic
  conditions, with leading positions in Advanced Wound Care,
  Ostomy Care, Continence Care, and Infusion Care. With over
  10,000 colleagues, we provide products and services in
  around 90 countries, united by a promise to be forever
  caring. Our solutions provide a range of benefits, from
  infection prevention, treatment for hard to heal wounds, at-
  risk skin and ulcerated tissue to supporting debilitating
  conditions, improved patient outcomes and reduced care
  costs. Convatec's revenues in 2025 were over $2 billion. The
  company is a constituent of the FTSE 100 Index (LSE:CTEC).
  To learn more please visit: http://www.convatecgroup.com.
