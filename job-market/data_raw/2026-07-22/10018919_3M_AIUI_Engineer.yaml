  Job Description:

  AI/UI Engineer

  Collaborate with Innovative 3Mers Around the World

  Choosing where to start and grow your career has a major
  impact on your professional and personal life, so it’s
  equally important you know that the company you choose will
  support and guide you. With a wide variety of people, global
  locations, technologies, and products, 3M is a place where
  you can collaborate with other curious, creative 3Mers.

  The Impact You’ll Make in this Role

  As an AI/UI Engineer, you will be instrumental in designing,
  developing, and deploying AI-driven applications that
  enhance our product offerings. This role emphasizes the
  practical application of AI technologies to solve complex
  business challenges, focusing on integrating AI capabilities
  into scalable and reliable systems. You will collaborate
  closely with cross-functional teams to ensure seamless
  integration of AI solutions into our products. Your key
  responsibilities would be to:

  - Build responsive, accessible, high-performance enterprise
    UI/UX solutions from Figma designs to MVP using
    React.js/Next.js, TypeScript, TailwindCSS, and Material
    UI, including AI-powered experiences such as chatbots,
    dashboards, and dynamic recommendations.
  - Develop secure, scalable full-stack solutions with
    Node.js/Python, RESTful and GraphQL APIs, and databases
    including PostgreSQL, MongoDB, Redis, and vector stores
    such as Pinecone, Weaviate, and FAISS.
  - Integrate LLM APIs, build RAG pipelines, and implement real-
    time streaming AI responses within applications using
    platforms such as Azure OpenAI, Anthropic, Azure Cognitive
    Search, AWS Kendra, and LangChain.
  - Deploy, automate, and manage secure, scalable, highly
    available applications across Azure and AWS using App
    Services, ECS/EKS, serverless architectures, and CI/CD
    pipelines.
  - Collaborate cross-functionally with AI/ML engineers,
    designers, and product teams to optimize model deployment
    and deliver high-quality user experiences.

  Your Skills and Expertise

  To set you up for success in this role from day one, 3M
  requires (at a minimum) the following qualifications:

  - Bachelor’s degree in Computer Science, Artificial
    Intelligence, Data Science, or a related field.
  - 5+ years of experience building full-stack AI applications,
    including at least 1 year focused on Generative AI.
  - Proven expertise in AI applications such as RAG solutions,
    agentic AI systems, and UI/UX design.
  - Hands-on experience evaluating, fine-tuning, deploying, and
    benchmarking LLMs such as GPT, Claude, or similar models.
  - Strong ability to optimize AI solutions for accuracy,
    relevance, cost, scalability, and low-latency performance.

  Additional qualifications that could help you succeed even
  further in this role include:

  - Demonstrated excellent communication and collaboration
    skills across product managers, data scientists,
    engineers, and business stakeholders.
  - Familiarity with MLOps practices, including model lifecycle
    management and CI/CD processes.
  - Experience deploying AI applications on major cloud
    platforms such as AWS, Azure, and GCP.

  Work Location: Hebbal, Bangalore (Karnataka), Hybrid Mode

  Supporting Your Well-being

  3M offers many programs to help you live your best life –
  both physically and financially. To ensure competitive pay
  and benefits, 3M regularly benchmarks with other companies
  that are comparable in size and scope.

  Learn more about 3M’s creative solutions to the world’s
  problems at www.3M.com or on Instagram, Facebook, and
  LinkedIn @3M.

  Safety is a core value at 3M. All employees are expected to
  contribute to a strong Environmental Health and Safety (EHS)
  culture by following safety policies, identifying hazards,
  and engaging in continuous improvement.

