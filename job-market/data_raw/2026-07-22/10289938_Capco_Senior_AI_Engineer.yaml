description: |
  Senior AI Engineer (Principal Consultant) Location: London
  (Hybrid) | Practice Area: Technology & Engineering | Type:
  Permanent

  Empower the next frontier of AI with Capco. Shape, build,
  and deliver future-ready generative systems.

  The Role

  We’re looking for a Senior AI Engineer (Senior/Principal
  Consultant) to join our Technology Delivery team. In this
  role, you’ll combine deep expertise in AI/ML engineering and
  software development to design, build, and deploy advanced
  generative AI and agentic systems for leading financial
  services clients. You’ll work hands-on across the full AI
  engineering lifecycle, from architecting intelligent multi-
  agent systems to deploying scalable production-grade AI
  applications within enterprise environments. As a senior
  consultant, you’ll also collaborate closely with
  multidisciplinary teams and client stakeholders to drive
  innovation, accelerate adoption, and deliver measurable
  business impact.

  What You’ll Do

  - Architect and develop autonomous AI systems leveraging
    multi-modal large language models across text, image,
    audio, and video
  - Design and implement agentic workflows using prompt
    engineering, Retrieval-Augmented Generation (RAG), APIs,
    and enterprise data integrations
  - Fine-tune, optimize, and deploy large language and multi-
    modal models with a focus on scalability, reliability, and
    low-latency performance
  - Build scalable MLOps pipelines and cloud-native AI
    applications to support secure, production-grade
    deployments
  - Collaborate with clients and cross-functional teams to shape
    AI engineering strategy and accelerate GenAI adoption
    across complex environments

  What We’re Looking For

  - Bachelor’s degree or higher in Computer Science, Artificial
    Intelligence, Engineering, or a related STEM discipline
  - Proven hands-on experience deploying LLMs and multi-modal AI
    models within enterprise or large-scale production
    environments
  - Strong software engineering expertise in Python, including
    backend development, API design, and distributed systems
  - Solid understanding of scalable MLOps, observability, CI/CD
    practices, and cloud-native AI deployment architectures
  - Excellent communication, stakeholder management, and
    problem-solving skills within agile delivery environments

  Bonus Points For

  - Experience building AI agent frameworks or autonomous
    orchestration platforms
  - Knowledge of vector databases, semantic search, and advanced
    RAG architectures
  - Experience with cloud platforms such as AWS, Azure, or GCP
    for AI workloads
  - Familiarity with financial services, banking, or regulated
    enterprise environments
  - Exposure to AI governance, model monitoring, and responsible
    AI practices

  Why Join Capco

  - Deliver high-impact technology solutions for Tier 1
    financial institutions
  - Work in a collaborative, flat, and entrepreneurial
    consulting culture
  - Access continuous learning, training, and industry
    certifications
  - Be part of a team shaping the future of digital financial
    services
  - Help shape the future of digital transformation across FS &
    Energy

  Benefits We offer a competitive, people-first benefits
  package designed to support every aspect of your life:

  - Core Benefits: Discretionary bonus, competitive pension,
    health insurance, life insurance and critical illness
    cover.
  - Mental Health: Easy access to CareFirst, Unmind, Aviva
    consultations, and in-house first aiders.
  - Family-Friendly: Maternity, adoption, shared parental leave,
    plus paid leave for sickness, pregnancy loss, fertility
    treatment, menopause, and bereavement.
  - Family Care: 8 complimentary backup care sessions for
    emergency childcare or elder care.
  - Holiday Flexibility: 5 weeks of annual leave with the option
    to buy or sell holiday days based on your needs.
  - Continuous Learning: Your growth, your way - minimum 40
    Hours of Training Annually. Take your pick; workshops,
    certifications, e-learning. Also, Business Coach assigned
    from Day One: Get one-on-one guidance to fast-track your
    goals and accelerate your development.
  - Healthcare Access: Convenient online GP services.
  - Extra Perks: Gympass (Wellhub), travel insurance, Tastecard,
    season ticket loans, Cycle to Work, and dental insurance.

  Inclusion at Capco We’re committed to making our recruitment
  process accessible and straightforward for everyone. If you
  need any adjustments at any stage, just let us know - we’ll
  be happy to help. We value each person’s unique perspective
  and contribution. At Capco, we believe that being yourself
  is your greatest strength. Our #BeYourselfAtWork culture
  encourages individuality and collaboration – a mindset that
  shapes how we work with clients and each other every day.
