description: |
  This role is for one of the Weekday's clients

  Salary range: Rs 1000000 - Rs 2500000 (ie INR 10 - 25 LPA)

  Min Experience: 6+ years

  Location: Hyderabad

  JobType: full-time

  We are looking for a highly skilled Senior AI-Native Full
  Stack Developer to design, develop, and deliver modern,
  scalable web applications enhanced with AI capabilities. The
  ideal candidate has strong expertise across frontend,
  backend, cloud, and AI technologies, and is comfortable
  using AI-assisted development tools to improve engineering
  productivity while maintaining high standards of code
  quality. You will collaborate with cross-functional teams,
  contribute to architecture decisions, mentor engineers, and
  own the end-to-end delivery of complex features.

  Requirements

  KEY RESPONSIBILITIES  ● Design, develop, and maintain
  scalable full-stack web applications. ● Build responsive,
  high-performance user interfaces using React.js or Angular,
  Next.js, TypeScript, Tailwind CSS, HTML5, and CSS3. ●
  Develop backend services using Node.js/Express.js or
  Python/FastAPI and design RESTful and GraphQL APIs. ● Design
  and optimize PostgreSQL (including pgvector), MongoDB, and
  Redis data models. ● Integrate LLM APIs into production
  applications, including RAG pipelines, prompt engineering
  workflows, and AI-powered features. ● Leverage AI coding
  assistants such as Claude Code and Cursor while validating
  and improving generated code. ● Own CI/CD pipelines, Docker-
  based deployments, and cloud infrastructure on Azure or AWS
  with exposure to Kubernetes. ● Participate in architecture
  discussions involving authentication, RBAC, scalability,
  performance, and microservices/monolithic design. ● Perform
  code reviews, mentor junior developers, and promote
  engineering best practices. ● Implement automated testing
  using Playwright and Cypress. ● Estimate development effort,
  manage technical delivery, and communicate effectively with
  stakeholders. REQUIRED TECHNICAL SKILLS ● Frontend: React.js
  or Angular, TypeScript, Next.js, Tailwind CSS, HTML5, CSS3.
  ● Backend: Node.js, Express.js, Python, FastAPI, REST APIs,
  GraphQL. ● Databases: PostgreSQL, pgvector, MongoDB, Redis.
  ● Cloud & DevOps: Azure or AWS, Docker, CI/CD ownership,
  basic Kubernetes. ● AI-Native Development: Claude Code,
  Cursor, LLM API integration, Prompt Engineering, RAG,
  CLAUDE.md workflows. ● Testing: Playwright, Cypress. ●
  Architecture: JWT, OAuth2, RBAC, System Design,
  Microservices & Monolithic Architecture. QUALIFICATIONS ● 6+
  years of professional Full Stack development experience. ●
  Strong understanding of scalable software architecture and
  distributed systems. ● Hands-on experience delivering AI-
  powered applications in production. ● Experience mentoring
  developers and conducting code reviews. ● Excellent
  debugging, analytical, communication, and problem-solving
  skills. ● Ability to independently estimate, prioritize, and
  deliver complex features. PREFERRED SKILLS ● Production
  Kubernetes experience. ● Knowledge of vector databases,
  semantic search, AI agent frameworks, or LangChain. ●
  Experience with Azure OpenAI, AWS Bedrock, or equivalent LLM
  platforms. ● Exposure to observability, monitoring, and
  application performance optimization.

  Good-to-have skills

