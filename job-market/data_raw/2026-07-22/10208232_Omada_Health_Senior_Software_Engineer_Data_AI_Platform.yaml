title: "Senior Software Engineer, Data & AI Platform"
company: Omada Health
location: USA
work_type: FULL_TIME
description: |
  Omada Health is on a mission to bend the curve of chronic
  disease.

  Job overview:

  We are seeking a Senior Software Engineer to help design,
  build, and scale modern data platform capabilities using
  cloud-native technologies and AI-driven solutions.

  In this role, you will develop reusable frameworks, platform
  services, and engineering patterns that enable teams to
  build reliable, scalable data-products and AI-powered
  workflows. You will also leverage Generative AI to enhance
  data discovery, governance, developer productivity, and
  self-service access to trusted data. Working closely with
  cross-functional teams, you will help shape a modern data
  platform that accelerates innovation while ensuring
  security, reliability, and operational excellence.

  Your Impact:

  - Design, build, and operate scalable Data & AI platform
    capabilities for analytics, data science, and Generative
    AI use cases with strong practices around data quality,
    lineage, observability, security, and governance.
  - Develop reusable abstractions, templates, services, and
    workflows that standardize how teams build and manage data
    pipelines and data products.
  - Partner with Analytics, Applied-AI, Data-engineering and
    application teams to deliver platform capabilities that
    support business and clinical decision-making
  - Evaluate and integrate modern data and AI technologies with
    a focus on scalability, reliability, developer experience,
    and cost efficiency
  - Apply Generative AI technologies to improve data enablement,
    documentation, discovery, workflow automation, and
    platform usability
  - Promote software engineering best practices, including clean
    code, automated testing, CI/CD, infrastructure-as-code,
    monitoring, and secure data handling

  About you:

  - 5+ years of professional software engineering or data
    engineering experience building scalable data platforms,
    services, pipelines, or analytics infrastructure
  - Hands-on experience with modern data architectures,
    including data lakes, lakehouses, warehouses, analytical
    datastores, and batch or real-time processing systems
  - Strong programming skills in Python and SQL, with experience
    building production-grade data systems
  - Working knowledge of distributed computing and cloud-native
    technologies such as Spark, Kubernetes etc
  - Hands-on experience with Infrastructure as Code using
    Terraform (or a similar tool such as Pulumi,
    CloudFormation/CDK) to provision and manage cloud
    infrastructure.
  - Experience applying data engineering best practices around
    data quality, lineage, governance, reliability,
    observability, and operational excellence
  - Practical experience using Generative AI tools or
    technologies to improve engineering workflows, automation,
    analytics, or data platform capabilities
  - Strong problem-solving, communication, and collaboration
    skills, with the ability to work effectively across
    technical and non-technical teams
  - Self-directed, pragmatic, and comfortable working through
    ambiguity in a fast-moving environment

  Bonus Points for:

  - Hands-on experience with Databricks, including Delta Lake,
    Unity Catalog, Workflows, Delta Live Tables, MLflow, Model
    Serving.
  - Experience with NoSQL datastores, including document
    databases, graph databases, key-value stores, wide-column
    stores, or search-oriented systems
  - Experience with Generative AI application patterns such as
    RAG, knowledge-graph, etc.
  - Experience working with sensitive data in regulated
    environments such as healthcare, privacy, fintech, or
    other compliance-heavy industries

  Benefits:

  - Competitive salary with generous annual cash bonus
  - Equity grants
  - Remote first work from home culture
  - Flexible Time Off to help you rest, recharge, and connect
    with loved ones
  - Generous parental leave
  - Health, dental, and vision insurance (and above market
    employer contributions)
  - 401k retirement savings plan
  - Lifestyle Spending Account (LSA)
  - Mental Health Support Solutions
  - ...and more!

  It takes a village to change health care. As we build
  together toward our mission, we strive to embody the
  following values in our day-to-day work. We hope these hold
  meaning for you as well as you consider Omada!

  - Cultivate Trust. We listen closely and we operate with
    kindness. We provide respectful and candid feedback to
    each other.
  - Seek Context. We ask to understand and we build connections.
    We do our research up front to move faster down the road.
  - Act Boldly. We innovate daily to solve problems, improve
    processes, and find new opportunities for our members and
    customers.
  - Deliver Results. We reward impact above output. We set a
    high bar, we’re not afraid to fail, and we take pride in
    our work.
  - Succeed Together. We prioritize Omada’s progress above team
    or individual. We have fun as we get stuff done, and we
    celebrate together.
  - Remember Why We’re Here. We push through the challenges of
    changing health care because we know the destination is
    worth it.

  About Omada Health: Omada Health (Nasdaq: OMDA) is reverse
  engineering the way healthcare is delivered in America,
  putting the space between doctor visits–where health is won
  or lost–at the center of care. Today's healthcare system
  poorly serves chronic conditions that require ongoing
  support outside of the exam room, like obesity, diabetes,
  hypertension, cholesterol, and musculoskeletal conditions.
  Omada’s virtual-first model combines human-led care teams,
  connected devices, and AI-enabled technology to deliver
  personalized care at scale, including support for GLP-1
  therapy. Omada has served more than two million members
  since launch across 2,000+ employers, health plans, pharmacy
  benefit managers, and health systems. Learn more at
  omadahealth.com.

