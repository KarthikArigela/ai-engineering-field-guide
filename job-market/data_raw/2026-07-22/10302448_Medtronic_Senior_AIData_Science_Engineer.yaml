  Recruitment Fraud Alert

  We are aware of phishing scams targeting job seekers. Please
  keep the following in mind:

  Apply only through official Medtronic channels. All
  legitimate Medtronic recruiting communications come from
  approved Medtronic platforms and official @medtronic.com
  email addresses.

  Medtronic will never ask for payment or sensitive personal
  information (such as bank account or Social Security
  details) during early stages of the hiring process. Any such
  requests are not legitimate.

  If you receive a suspicious message claiming to be from
  Medtronic, do not respond, click links, or open attachments.

  If you have any questions, concerns regarding the
  authenticity of a communication alleged to have been made by
  or on behalf of Medtronic, please contact us immediately at
  AskHR@medtronic.com.

