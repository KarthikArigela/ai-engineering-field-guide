description: |
  About this role: Wells Fargo is seeking a Senior Systems
  Operations Engineer. Payments Modernization Platform
  Engineer / SRE to join Payments & Liquidity Technology
  (GPLT), supporting the International Payments team. This
  role sits at the intersection of engineering, service
  management, and reliability. You will be embedded early in
  the Payments Modernization lifecycle to ensure platforms are
  operable, resilient, observable, and supportable by design,
  not retrofitted after go-live. You will work closely with
  Application Engineering, Architecture and Service Operations
  teams to shape how new payment capabilities are built,
  tested, released, and stabilized at scale. In this role, you
  will:

  - Lead or participate in managing all installed systems and
    infrastructure within the Systems Operations functional
    area
  - Contribute in increasing system efficiencies and lowering
    the human intervention time on related tasks
  - Review and analyze moderately complex operational support
    systems, application software, and system management tools
    to ensure the highest levels of systems and infrastructure
    availability
  - Work with vendors and other technical personnel for problem
    resolution
  - Lead team to meet technical deliverables while leveraging
    solid understanding of technical process controls or
    standards
  - Collaborate with vendors and other technical personnel to
    resolve technical issues and achieve highest levels of
    systems and infrastructure availability

  Required Qualifications:

  - 4+ years of Systems Engineering, Technology Architecture
    experience, or equivalent demonstrated through one or a
    combination of the following: work experience, training,
    military experience, education

  Desired Qualifications:

  - 4+ years Observability: Distributed tracing, metrics,
    logging, SLO tooling
  - 4+ years Testing & Resilience Validation: BlazeMeter, Chaos
    Monkey
  - Strong experience in SRE, Production Engineering, Platform
    Engineering, or Service Transition within a complex
    technology or financial services environment
  - Demonstrated ability to productionize new platforms, not
    just support them
  - Experience working with event-driven, distributed
    architectures
  - Proven ability to partner with engineering teams while
    representing the production and operational lens
  - Comfortable operating in early-stage, ambiguous
    transformation environments
  - Strong communication skills, with the ability to explain
    technical risk to senior stakeholders

  Job Expectations:

  - L2 Support experience with strong ITIL process and strong
    troubleshooting skills
  - Hands-on experience in automation using shell/pearl/Python
    and AI tools
  - Strong knowledge on any of monitoring tools like ITRS
    Geneos, AppDynamics, Splunk
  - Strong knowledge on Database, MQ and middleware technologies

