description: |
  Binance is a leading global blockchain ecosystem behind the
  world’s largest cryptocurrency exchange by trading volume
  and registered users. We are trusted by 300+ million people
  in 100+ countries for our industry-leading security, user
  fund transparency, trading engine speed, deep liquidity, and
  an unmatched portfolio of digital-asset products. Binance
  offerings range from trading and finance to education,
  research, payments, institutional services, Web3 features,
  and more. We leverage the power of digital assets and
  blockchain to build an inclusive financial ecosystem to
  advance the freedom of money and improve financial access
  for people around the world.

  About The Team

  Join one of Binance's core Tech functions, the 'Home, Market
  & Dashboard' team, and help shape the essential user
  interfaces and experiences on our platform. This team
  ensures seamless access to market data, account details, and
  trading functionalities, enhancing the overall user
  experience. Be part of a team that drives innovation and
  excellence in the world of digital finance.



  About The Role

  We’re seeking a talented Senior Java Spring Engineer with 5+
  years of experience to join our team. The ideal candidate
  will have strong expertise in Java Spring Boot and
  microservice development. Experience with AWS, full-stack
  development, and blockchain technology is a plus.
  Additionally, candidates must have proven experience with
  recommendation algorithms and large language models (LLMs),
  which is a key requirement for this role.

  Responsibilities

  - Design, develop, and maintain backend services and APIs for
    global products using Java.
  - Build a high-performance, highly available, and secure
    backend system to provide robust support for business
    operations.
  - Working closely with team members across different time
    zones to ensure effective collaboration and communication.
  - Collaborate closely with product managers and project
    managers to own the end-to-end system architecture.
  - Optimize system performance, reliability, and scalability in
    a production environment.
  - Build production LLM systems to power business functions,
    from data to production, emphasizing automation and
    reproducibility.
  - Optimize and support LLM workloads in on-prem environments.

  Requirements

  - Bachelor's degree in Computer Science, Engineering, or
    related field.
  - Minimum of 5 years of experience in software development and
    architecture.
  - Strong expertise in Java and backend frameworks (e.g.,
    Spring Boot, RESTful APIs)
  - Experience with databases (SQL and/or NoSQL), messaging
    systems (e.g., Kafka, RabbitMQ), and microservices
    architecture
  - Experience in LLM-related project architecture design, code
    development, and performance tuning.
  - Experience in LLM training and development of optimization-
    related platform tools.
  - Bilingual English/Mandarin is required to be able to
    coordinate with overseas partners and stakeholders.

  Nice To Have

  - Full-stack development experience is an advantage.
  - Experience with AWS cloud services is a plus.
  - Knowledge of blockchain technology is preferred.

  Why Binance

  • Shape the future with the world’s leading blockchain
  ecosystem

  • Collaborate with world-class talent in a user-centric
  global organization with a flat structure

  • Tackle unique, fast-paced projects with autonomy in an
  innovative environment

  • Thrive in a results-driven workplace with opportunities
  for career growth and continuous learning

  • Competitive salary and company benefits

  • Work-from-home arrangement (the arrangement may vary
  depending on the work nature of the business team)

  Binance is committed to being an equal opportunity employer.
  We believe that having a diverse workforce is fundamental to
  our success.

  By submitting a job application, you confirm that you have
  read and agree to our Candidate Privacy Notice.
