  - LinkedIn + GitHub Profile
  - 2–3 minute screen share video covering: Building an agent
    using Cursor/Claude/Codex/OpenClaw
  - Shortlisted candidates will complete a paid technical trial
    before the final offer.

  If you enjoy building AI-native products, leading teams and
  creating reusable platforms that scale globally, we'd love
