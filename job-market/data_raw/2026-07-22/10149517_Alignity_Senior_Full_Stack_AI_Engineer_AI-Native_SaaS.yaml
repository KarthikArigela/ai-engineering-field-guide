  Contract-to-Hire (60–90 Days) Who We Are

  Alignity AI Labs is building AI-powered products for
  Recruiting, Wellness and Business Networking.

  Our vision is to build AI-BOS (AI Business Operating
  System)—a reusable AI platform that powers multiple products
  through shared workflows, AI agents and integrations.

  Why Join Us?

  - Founding engineering team with direct access to the
    Founder/CEO.
  - Build reusable AI platform components—not just another
    application.
  - Opportunity to become Technical Lead and mentor a growing
    engineering team.
  - Work on multiple AI products using the latest AI engineering
    tools.

  Your Mission

  Build, stabilize and scale AI-BOS while accelerating
  multiple AI SAAS products.

  Responsibilities

  - Design reusable backend services using Node.js, TypeScript
    and PostgreSQL.
  - Build Workflow Engine, Analysis Engine and Provider Adapter
    Layer.
  - Develop Agentic AI workflows using OpenAI and modern AI
    frameworks.
  - Integrate OpenAI, ElevenLabs, HeyGen, Resend and third-party
    APIs.
  - Build scalable APIs, automation workflows and DevOps
    pipelines.
  - Lead a team of 2–5 engineers, review PRs and mentor junior
    developers.
  - Drive architecture, security, performance and engineering
    standards.
  - Maximize engineering productivity using Cursor, Claude,
    Codex, OpenClaw and Lovable.

  Mandatory Skills

  - 7+ years Full Stack Engineering.
  - Experience leading 2–5 member engineering teams.
  - Expert in Node.js, TypeScript, REST APIs and PostgreSQL.
  - Strong DevOps (Docker + DigitalOcean/AWS/Azure/GCP).
  - Agentic AI and LLM integration experience.
  - Hands-on with Cursor, Claude, Codex and OpenClaw.
  - Startup mindset with strong ownership and communication.

  Nice to Have:

  Lovable, n8n, LangGraph, MCP, Vector DBs, Chrome Extensions,
  Playwright/Puppeteer, Apify, ElevenLabs, HeyGen,

  Success in First 90 Days

  - Build reusable AI-BOS platform components.
  - Improve engineering velocity using AI to GotoMarket
  - Act fast to refine the product based on early user feedback

