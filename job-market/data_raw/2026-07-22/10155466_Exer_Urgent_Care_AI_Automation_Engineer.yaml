job_id: 10155466
title: AI Automation Engineer
company: Exer Urgent Care
location: El Segundo, USA
work_type: FULL_TIME
description: |
  About the Role

  Exer Urgent Care is running an AI and automation
  transformation program across finance, operations, and
  clinical-support functions, led by the Chief AI Officer.
  We're looking for an early-career engineer to join as a
  hands-on builder, someone who can take a spec, a rough
  sketch, or a "here's the problem" conversation and turn it
  into a working automation quickly.

  This isn't a maintenance role on an established team. You'll
  work directly with the CAIO, picking up real build projects
  already in flight and helping stand up new ones, with real
  autonomy and a short distance between idea and shipped tool.

  What You'll Work On

  Real examples of the kind of work on the table right now:

  AP invoice automation. Extending vendor coverage on an
  existing browser-automation pipeline that logs into vendor
  portals, pulls invoices, and feeds them into finance
  systems. First task on day one: closing out the last handful
  of vendors.

  Lease and rent-roll data. Pulling structured data out of
  lease documents and reconciling it against landlord
  statements.

  Internal AI agents and tools. Building structured intake
  tools, AI-assisted workflows, and small internal apps that
  give non-technical staff a simple front end to something AI-
  powered underneath.

  Data plumbing. Databases, spreadsheet and workspace-tool
  integrations, business-intelligence connections, wiring up
  whatever system actually holds the data.

  Prototyping. Fast, scrappy proofs of concept that test
  whether an automation idea holds up before committing real
  build time.

  What We're Looking For

  1 to 3 years of professional software engineering experience
  (a new grad with strong internships is also a great fit).

  Solid TypeScript/JavaScript, comfortable working in React
  and Next.js.

  Working knowledge of relational databases (Postgres or
  similar); Supabase experience is a plus.

  Genuine curiosity about applied AI: prompt engineering, LLM
  APIs, or agent frameworks, even if that experience comes
  from personal projects rather than a job.

  Comfortable with ambiguity. Specs here often start as a
  planning doc or a conversation, not a fully scoped ticket.

  Able to work independently once pointed at a problem, and to
  flag blockers early rather than sit on them.

  Based in or willing to work from the Los Angeles area out of
  Exer's corporate office.

  Nice to Have

  Exposure to browser-automation or RPA-style tooling.

  Experience with background job or workflow-orchestration
  systems.

  Familiarity with deploying on Vercel or similar platforms.

  Any experience handling sensitive or regulated data
  carefully, healthcare or finance, even from coursework or an
  internship. Full training on compliance constraints (HIPAA
  and related) is provided on the job.

  Why This Role

  Direct line of sight from idea to production. No multi-layer
  approval chain for small builds.

  Broad exposure across finance, operations, and clinical-
  support automation, an unusually wide range for an

   early-career role.

  Work side by side with the Chief AI Officer on a real,
  funded transformation program at an operating healthcare
  company, not a slide deck.

  Room to grow into ownership of a full initiative as the
  program and team grow.

  Logistics

  Location: Based out of Exer's corporate office in El
  Segundo, CA
