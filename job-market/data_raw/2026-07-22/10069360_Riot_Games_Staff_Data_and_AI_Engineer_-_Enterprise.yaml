job_id: 10069360
title: Staff Data and AI Engineer - Enterprise
company: Riot Games
location: Los Angeles, USA
work_type: FULL_TIME
description: |
  Riot’s Enterprise Technology organization ensures Rioters
  have what they need to unlock their full potential, from
  efficient business platforms to next-generation AI
  capabilities.

  As a Staff Data and AI Engineer on the Enterprise Data & AI
  team, you will operate at the intersection of data
  engineering, data architecture, and AI solutions for Riot
  Enterprise. You will be instrumental in designing and
  building the enterprise data warehouse, developing scalable
  data integrations (connecting platforms like OneStream,
  Oracle, Workday, and Databricks), and delivering critical
  Enterprise agentic analytics and AI services.

  The ideal candidate blends hands-on technical expertise with
  a strategic, platform-oriented mindset. You will be
  responsible for creating robust technical solutions,
  including scalable data pipelines, comprehensive data
  warehouse models, and AI enabled workflow and process
  automations. This work involves close collaboration with
  Enterprise leaders, architects, and system owners, and data
  specialists to translate corporate strategic and operations
  business requirements into secure, high-value, and
  maintainable solutions.

  The role will report to the Senior Manager, Enterprise Data
  and AI.

  Responsibilities:

  - Partner with stakeholders across Finance, HR, Legal, IT, and
    Operations to understand business workflows, clarify
    requirements, and translate them into technical designs,
    with an immediate focus on process automation,
    conversational agents, and data integrations for key
    corporate systems.
  - Design, build, and maintain the data and platform components
    of Riot’s Enterprise AI ecosystem, contributing to
    reference architectures for RAG/agents (indexing, vector
    stores, caching) and orchestration frameworks.
  - Contribute to conceptual and logical data models for
    enterprise domains and help connect those models to
    business capabilities, processes, and downstream
    applications.
  - Design, build, and maintain data pipelines, transformations,
    integrations, and warehouse-oriented data products across
    enterprise platforms and data systems.
  - Support reporting, analytics, and application capabilities
    by helping shape reliable data foundations and
    implementation patterns.

  Required Qualifications:

  - Bachelor’s degree in Computer Engineering, Computer Science,
    Information Systems, or related field (or equivalent
    experience delivering enterprise technology solutions).
  - 8+ years of experience in enterprise applications, data
    engineering, or platform engineering spaces, including
    delivery of data and automation solutions at scale.
  - Experience delivering AI (traditional or generative) or
    advanced agentic automation solutions at scale.
  - Strong technical knowledge of orchestration platforms
    (Workato, n8n, Camunda) and AI platforms (e.g., Google
    Vertex/Agent Platform, Anthropic Claude Platform, OpenAI
    Platform) and their enterprise applications, including
    Retrieval-Augmented Generation (RAG), as well as knowledge
    management, data governance, quality, and architecture in
    enterprise contexts.
  - Hands-on experience building or supporting data pipelines
    and integrations across enterprise applications, APIs,
    middleware, and data platforms.
  - Required hands-on experience with Databricks for developing,
    transforming, and operationalizing data workflows or
    warehouse-oriented solutions.
  - Strong familiarity with data transformation and data
    warehousing methodologies, including dimensional modeling
    and medallion architecture patterns.
  - Strong technical knowledge of enterprise platforms (e.g.,
    Workday, ServiceNow, Coupa, Concur, Oracle, IronClad) and
    respective integration options.

  Desired Qualifications:

  - Experience supporting master data, reporting, analytics, or
    business intelligence use cases.
  - Strong hands-on experience with Workato, including
    implementing agentic workflows and AI-powered operational
    analytics and automations.
  - Familiarity with frameworks for agent development (e.g.,
    LangChain, Pydantic AI) and orchestration platforms (e.g.,
    LangGraph, CrewAI, Vertex AI Agent Builder, Microsoft
    AutoGen, or similar).
  - Experience building or integrating enterprise knowledge
    search platforms (e.g., federated search, vector DBs,
    retrieval-augmented generation) for enterprise use cases.
  - Experience with cloud data and application technologies such
    as AWS data services, dbt, or event-driven integration
    patterns.
  - Experience leading change in complex organizations and
    mentoring teammates or helping less technical partners
    adopt better data and systems practices.

  For this role, you'll find success through craft expertise,
  a collaborative spirit, and choices that focus on your
  fellow Rioters, who are the customers of your work. Being a
  dedicated fan of games is not necessary for this position!

  Our Perks:

  Riot focuses on work/life balance, shown by our open paid
  time off policy and other perks such as flexible work
  schedules. We offer medical, dental, and life insurance,
  parental leave for you, your spouse/domestic partner, and
  children, and a 401k with company match. Check out our
  benefits pages for more information.

  At Riot Games, we put players first. That mission drives
  every decision in our quest to create games and experiences
  that make it better to be a player. Whether you’re working
  directly on a new player-facing experience or you’re
  supporting the company as a whole, everyone at Riot is part
  of our mission. And just like in our games, we’re better
  when we work together. Our goal is to create collaborative
  teams where you are empowered to bring your unique
  perspective everyday. If that sounds like the kind of place
  you want to work, we’re looking forward to your application.

  It’s our policy to provide equal employment opportunity for
  all applicants and members of Riot Games, Inc. Riot Games
  makes reasonable accommodations for handicapped and disabled
  Rioters and does not unlawfully discriminate on the basis of
  race, color, religion, sex, sexual orientation, gender
  identity or expression, national origin, age, handicap,
  veteran status, marital status, criminal history, or any
  other category protected by applicable federal and state
  law. We consider for employment all qualified applicants,
  including those with criminal histories, in a manner
  consistent with applicable federal, state and local law,
  including the California Fair Chance Act, the City of Los
  Angeles Fair Chance Initiative for Hiring Ordinance, the Los
  Angeles County Fair Chance Ordinance for Employers, the San
  Francisco Fair Chance Ordinance, and the Washington Fair
  Chance Act.

  Per the Los Angeles County Fair Chance Ordinance, the
  following core duties may create a basis for disqualifying
  candidates with relevant criminal histories:

  - Safeguarding confidential and sensitive Company data
  - Communication with others, including Rioters and third
    parties such as vendors, and/or players, including minors
  - Accessing Company assets, secure digital systems, and
    networks
  - Ensuring a safe interactive environment for players and
    other Rioters

  These duties are directly related to essential operations,
  safety, trust, and compliance obligations within our
  organization. Please note that job duties may evolve based
  on business needs and additional responsibilities may be
  assigned as necessary to maintain operational efficiency and
  security.
