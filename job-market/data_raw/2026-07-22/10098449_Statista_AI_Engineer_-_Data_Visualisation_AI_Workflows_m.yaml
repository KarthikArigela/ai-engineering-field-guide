description: |
  At Statista, we’re all about facts and data, for we are the
  world's leading business data platform. By providing
  reliable and easy-to-use data as well as various data
  analytics products and services, we empower people worldwide
  to make fact-based decisions.

  Founded in Hamburg in 2007, we have quickly grown into a
  global company with offices in major cities such as London,
  New York, Berlin and Tokyo. And we still have a lot of
  plans. Our constant growth does not only prove our success,
  but also keeps creating new development and career
  opportunities for our employees.

  We value and celebrate our diverse culture. You are welcome
  here for who you are, no matter where you come from, what
  you look like, or whether you prefer bar graphs to pie
  charts. Your story matters – keep writing it as part of our
  team.

  Are you ready to join us?

  Your team Join Statista’s Data Visualization team,
  responsible for how data is presented and experienced across
  the platform and beyond (e.g., APIs, LLM integrations). The
  team transforms, structures, and optimizes data to make it
  clear, actionable, and reusable — powering everything from
  charts on statista.com to exports into tools like PowerPoint
  or ChatGPT. You’ll be the dedicated AI Engineer in the team,
  working closely with engineers, product, and design while
  collaborating with AI specialists across the company.

  Your role

  - Build and optimize AI-driven workflows for data
    visualization and export
  - Develop systems that analyze datasets and recommend the best
    visualization types
  - Design and evaluate LLM-based features, including prompt
    strategies and quality metrics
  - Work on data classification, structuring, and enrichment to
    improve usability
  - Turn experiments into production-ready services (Java-based
    backend)
  - Define and track quality and success metrics (e.g., output
    accuracy, user value)



  Your profile

  - Experience building data-driven or AI-powered systems (e.g.,
    classification, RAG, data workflows)
  - Strong Python skills (analysis, experimentation,
    prototyping)
  - Pragmatic, product-focused mindset with interest in end-user
    impact
  - Motivation to learn and work with Java in production

  - Knowledge of data visualization principles (chart types,
    best practices)
  - Experience with LLMs, prompt engineering, or evaluation
    frameworks
  - Familiarity with AWS, event-driven systems, or messaging
    tools

  What we offer

  In addition to our great team, culture, and our shared goal
  of empowering people with data, there are many other things
  that make Statista a great place to work! Join us and
  benefit from:

  - Work from abroad up to 30 calendar days a year
  - Hybrid work and flex-time
  - International team and social events
  - Subsidized urban mobility and access to fitness and wellness
    options
  - Free access to Langdock and all its amazing functionalities
  - Career & training opportunities
  - Attractive locations and modern offices
  - Mental health support with OpenUp

  Some of the benefits listed here apply only to the German
  entity and to Junior-level roles or above.
