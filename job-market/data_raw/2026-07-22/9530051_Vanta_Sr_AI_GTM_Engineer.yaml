title: Sr. AI GTM Engineer
company: Vanta
location: USA
remote: true
work_type: FULL_TIME
description: |
  At Vanta, our mission is to help businesses earn and prove
  trust. We believe that security should be monitored and
  verified continuously, and we empower companies to practice
  better security and prove it with ease. Vanta has a kind and
  talented team, and while some have prior security
  experience, many have been successful at Vanta without it.

  As a Sr. AI GTM Engineer on Vanta's GTM Engineering team,
  you will design and ship internal AI products and processes
  that completely transform how our go-to-market teams operate
  and win. You'll embed with Sales, Customer Success, and
  Revenue Operations to build novel applications and platforms
  that accelerate pipeline generation, improve win rates, and
  scale how Vanta engages customers.

  You will also own end-to-end outcomes, move quickly from
  concept to production, and directly shape how customers
  experience Vanta in the field. This role is ideal for AI-
  pilled builders who want to be close to users, solve complex
  business problems with elegant technical solutions, and
  define entirely new categories of enterprise software.

  Vanta's GTM Engineering team operates as an internal
  incubator: applying AI at scale to revolutionize customer
  engagement. We build high-impact tools that reshape
  conversations, learn from every customer interaction, and
  demonstrate the value of our platform in real-world
  scenarios. This team sits at the intersection of engineering
  and GTM, shipping solutions that range from rapid prototypes
  to production-grade systems.

  What you'll do as a Senior AI GTM Engineer at Vanta:

  - Ideate and build products that transform how Vanta generates
    new business, interfaces with prospects and customers, and
    grows existing customer relationships
  - Own the full product lifecycle: prototype, iterate, ship,
    and maintain solutions that solve real-world customer and
    internal workflow problems
  - Partner closely with Vanta’s CRO and executive leadership
    teams to architect and execute plans that bring Vanta to
    the forefront of GTM orgs leveraging AI
  - Apply AI and modern technologies in novel ways to
    systematize and automate GTM workflows (e.g. building
    fully agentic SMEs and sellers)
  - Design, develop, and maintain internal-facing web
    applications and AI-driven agents using a mix of
    frameworks, APIs, and code (Python, TypeScript, SQL)
  - Ship reliable, maintainable systems with technical
    documentation, monitoring, and testing frameworks to
    ensure adoption and observability
  - Translate learnings from customer-facing work into feedback
    for product and research teams to inform broader product
    development
  - Evaluate and implement new technologies, orchestration
    tools, and AI platforms with a clear "build vs. buy"
    perspective

  How to be successful in this role:

  - 5+ years of software engineering experience with a strong
    focus on building and shipping full-stack applications
  - You've built products from the ground up, navigated
    ambiguity, and owned outcomes in a fast-paced, resource-
    constrained environment
  - Deep technical skill set: proficiency in modern programming
    languages (Python, TypeScript/JavaScript), experience with
    web frameworks (React, Node.js), and strong SQL skills
  - Experience with how AI and automation can be applied to
    business workflows: experience with LLM APIs, prompt
    engineering, or workflow automation tools is a strong plus
  - Experience working closely with non-technical stakeholders
    (Sales, Operations, Customer Success) to translate
    business needs into technical requirements and ship
    impactful solutions
  - Product mindset: you care about user experience, business
    impact, and building systems that people love to use, not
    just technical elegance
  - Demonstrated ability to move quickly from prototype to
    production, make effective tradeoffs, and ship
    incrementally
  - Excellent communication skills and the ability to explain
    technical decisions to business stakeholders and executive
    leadership
  - Experience with GTM systems (Salesforce, HubSpot, Gong,
    workflow automation tools like Workato or n8n) or modern
    data stack tools (Snowflake, dbt) is a plus

  At Vanta, we are committed to hiring diverse talent of
  different backgrounds and as such, it is important to us to
  provide an inclusive work environment for all. We do not
  discriminate on the basis of race, gender identity, age,
  religion, sexual orientation, veteran or disability status,
  or any other protected class. As an equal opportunity
  employer, we encourage and welcome people of all backgrounds
  to apply.

  About Vanta

  We started in 2018, in the wake of several high-profile data
  breaches. Online security was only becoming more important,
  but we knew firsthand how hard it could be for fast-growing
  companies to invest the time and manpower it takes to build
  a solid security foundation. Vanta was inspired by a vision
  to restore trust in internet businesses by enabling
  companies to improve and prove their security. From our
  early days automating security monitoring for compliance
  standards like SOC 2, HIPAA and ISO 27001 to creating the
  world's leading Trust Management Platform, our vision
  remains unchanged.

  Now more than ever, making security continuous—not just a
  point-in-time check— is essential. Thousands of companies
  rely on Vanta to build, maintain and demonstrate their
  trust— all in a way that's real-time and transparent.

  Referral Instructions

  If you are being referred for the role, please contact that
  person to apply on your behalf.
