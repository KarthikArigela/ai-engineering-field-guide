description: |
  Company Overview

  KLA is a global leader in diversified electronics for the
  semiconductor manufacturing ecosystem. Virtually every
  electronic device in the world is produced using our
  technologies. No laptop, smartphone, wearable device, voice-
  controlled gadget, flexible screen, VR device or smart car
  would have made it into your hands without us. KLA invents
  systems and solutions for the manufacturing of wafers and
  reticles, integrated circuits, packaging, printed circuit
  boards and flat panel displays. The innovative ideas and
  devices that are advancing humanity all begin with
  inspiration, research and development. KLA focuses more than
  average on innovation and we invest 15% of sales back into
  R&D. Our expert teams of physicists, engineers, data
  scientists and problem-solvers work together with the
  world’s leading technology providers to accelerate the
  delivery of tomorrow’s electronic devices. Life here is
  exciting and our teams thrive on tackling really hard
  problems. There is never a dull moment with us.

  Group/Division

  With over 40 years of semiconductor process control
  experience, chipmakers around the globe rely on KLA to
  ensure that their fabs ramp next-generation devices to
  volume production quickly and cost-effectively. Enabling the
  movement towards advanced chip design, KLA's Global Products
  Group (GPG), which is responsible for creating all of KLA’s
  metrology and inspection products, is looking for the best
  and the brightest research scientist, software engineers,
  application development engineers, and senior product
  technology process engineers. The LS-SWIFT Division of KLA’s
  Global Products Group provides patterned wafer inspection
  systems for high-volume semiconductor manufacturing. Its
  mission is to deliver market-leading cost of ownership in
  defect detection for a broad range of applications in the
  production of semiconductors. Customers from the foundry,
  logic, memory, automotive, MEMS, advanced packaging and
  other markets rely upon high-sample wafer inspection
  information generated by LS-SWIFT products. LS (Laser
  Scanning) systems enable cost-effective patterned wafer
  defect detection for the industry’s most sophisticated
  process technologies deployed in leading-edge foundry,
  logic, DRAM, and NAND fabs. SWIFT (Simultaneous Wafer
  Inspection at Fast Throughput) systems deliver all-wafer-
  surface (frontside, backside, and edge) macro inspection
  that is critical for automotive IC, MEMS, and advanced
  packaging processes as well as foundry/logic and memory
  fabs. LS-SWIFT operates from a global footprint that
  includes the US, Singapore, India and Germany, and serves a
  worldwide customer base across Asia, Europe and North
  America.

  Job Description/Preferred Qualifications

  Responsibilities :

  - Designing, developing, modifying and diagnosing complex ML
    and DL algorithms
  - Ability to invent, prototype and deploy new image processing
    algorithms and ideas
  - Hands-on experience in object-oriented and functional
    programming
  - Excellent written and verbal communication skills.
  - Ability to work both independently and in a team
    environment.

  Minimum Qualifications

  Doctorate (Academic) Degree and related work experience of 3
  years; Master's Level Degree and related work experience of
  6 years; Bachelor's Level Degree and related work experience
  of 8 years

  - Strong background in one or more of the following areas:
    machine Learning, deep learning, computer vision, image
    processing
  - Familiar with one of common deep learning frameworks like
    TensorFlow, PyTorch
  - Hands-on experience with training ML/AI models that have
    been deployed in a product
  - Ability to write model architectures from scratch, modify
    loss functions

  We offer a competitive, family friendly total rewards
  package. We design our programs to reflect our commitment to
  an inclusive environment, while ensuring we provide benefits
  that meet the diverse needs of our employees.

  KLA is proud to be an equal opportunity employer

