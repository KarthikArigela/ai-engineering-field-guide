description: |
  Company Description

  Scalable Capital is a leading digital investment and banking
  platform with a full banking licence, empowering people
  across Europe to shape their own finances. Scalable Broker
  makes it easy and affordable for clients to invest
  professionally in stocks, ETFs, cryptocurrencies, and
  derivatives, as well as set up savings plans. Scalable
  Wealth, the digital wealth management service, offers
  clients professional investment in ETF portfolios, and is
  also adopted as a white-label solution by banks and other
  B2B partners. The company’s offerings are rounded off by
  attractive interest rates, loans, and private equity. With
  the European Investor Exchange, Scalable Capital offers an
  exchange specifically for retail investors. Over one million
  clients have already entrusted more than €30 billion to the
  platform.

  Founded in 2014, Scalable Capital now employs over 700
  people across Munich, Berlin, Vienna, Milan, and London.
  Together with the founding and management team, including
  Erik Podzuweit and Florian Prucker, they are working on a
  new generation of financial services.

  Visit our finance blog or check out our Social Media
  channels to find out what our Expert Teams have to say.

  Our Company Values guide us every day in how we work and
  collaborate. To learn more about them, you can find our
  values here (English).

  Job Description

  - Build and run one of the fastest growing neo-brokers in
    Europe
  - Be part of a highly motivated cross-functional team in the
    Data Science & AI tribe, focused on building Scalable’s
    new Agentic Experience
  - Help shape agentic features across Scalable and contribute
    to a unified, ambitious product experience in the age of
    AI
  - Work on products such as our CLI, Scalable MCP server, and
    the unified Scalable Agentic Chat, bringing together
    insights and chatbot experiences
  - Make interacting with Scalable simpler, smarter, and more
    enjoyable by enriching our products with state-of-the-art
    AI-powered features
  - Get to work on cutting-edge technology and be part of modern
    software development practices, such as agile and self-
    sufficient teams, continuous integration and deployment,
    test automation, cloud-based infrastructure, and tooling
  - Write clean, testable, maintainable, and well-documented
    code and treat security as a first-class citizen
  - Lead technical conversations with engineers, product, data
    science, AI, and other stakeholders
  - You actively take part in architecture decisions and help
    shape scalable foundations for agentic product experiences

  Qualifications

  - Solid experience in complex software projects with end-to-
    end ownership
  - University degree in a relevant field of study, such as
    computer science, engineering, sciences, or a comparable
    qualification, background in FinTech is a strong plus
  - Ability to think outside the box and work independently in a
    fast-moving, ambiguous product environment
  - Analytical proficiency, both in the technical and product
    domain
  - Excellent communication skills that are clear, concise, and
    targeted towards your audience, whether engineering,
    product, data science, AI, or other stakeholders
  - A strong professional or academic background in our
    technology stack: TypeScript, ReactJS, Webpack, Next.js,
    Apollo GraphQL, Docker, and AWS
  - Experience with or strong interest in AI-powered products,
    agentic systems, LLM-based applications, MCP, chat
    interfaces, or developer tooling is a strong plus
  - An interest in other technology stacks and a willingness to
    work across product, platform, and AI-related domains
  - Professional fluency in English is required

  Additional Information

  - Be part of one of the fastest-growing and most visible
    Fintech startups in Europe, creating innovative services
    that have a substantial impact on the lives of our
    customers
  - Work with an international, diverse, inclusive, and ever-
    growing team that loves creating the best products for our
    clients
  - Be productive with the latest hardware and tools
  - Learn and grow by joining our in-house knowledge sharing or
    career development sessions and spending your individual
    Education Budget
  - Learn and experience German culture first hand by joining
    our free German language classes
  - International relocation support is provided if required
  - Opportunity to work from abroad
  - Benefit from an attractive compensation package and from the
    company pension scheme
  - Monthly contribution of 50% for the ‘Deutschland Jobticket’
  - Say goodbye to order commissions and say hello to your
    complimentary subscription of Scalable Capital's PRIME+
    Broker
  - Enjoy flexible and discounted sports activities with Urban
    Sports Club
