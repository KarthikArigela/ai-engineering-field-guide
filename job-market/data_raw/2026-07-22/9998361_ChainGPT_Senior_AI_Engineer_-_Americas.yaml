description: |
  Senior AI Engineer

  Location: Remote — global applications welcome; please apply
  via the region closest to you Company: ChainGPT Type: Full-
  Time

  About ChainGPT

  ChainGPT is a fast-moving Web3 and AI company building
  products at the intersection of blockchain infrastructure,
  token ecosystems, and intelligent automation. We value
  speed, ownership, clarity, and high standards. Our team is
  made up of self-driven operators who move fast, think
  independently, and use cutting-edge tools to create real
  commercial impact.

  We foster a transparent, collaborative, and high-performance
  culture where strong ideas win, autonomy is expected, and
  execution matters.

  We’re building Brain by AIVM, a platform that makes
  enterprise AI verifiable, governed, and genuinely
  trustworthy.

  This is a hard problem in a category that is forming right
  now. We’re a small, fast-moving team building real product
  at the frontier of AI, enterprise trust, governance, and
  agentic systems.

  We use the best AI tooling available to move quickly, but we
  care deeply about quality, security, reliability, and
  building systems that people can actually depend on.

  About the Role

  We’re looking for a senior engineer who has fully
  internalized AI-native development.

  This is for someone who can ship at the pace of a small team
  by directing AI coding agents, while still bringing the
  judgment, fundamentals, and technical ownership of a
  senior/staff-level engineer.

  You understand where AI tools are powerful, where they fail,
  and when human judgment needs to lead. You can move quickly
  from prototype to production, own complex technical
  decisions, and help shape the product at a very early stage.

  You’ll work directly alongside the founders and senior team,
  with meaningful ownership over core parts of the product.

  What You’ll Do

  - Build and ship core product features, systems, and
    infrastructure.
  - Turn fast-moving, AI-assisted prototypes into reliable,
    scalable, production-grade software.
  - Own architecture, security, quality, and technical direction
    across major parts of the product.
  - Use tools like Codex, Claude Code, and modern AI coding
    agents to dramatically increase engineering output.
  - Direct, evaluate, and control agentic development workflows
    while maintaining strong human oversight.
  - Help define how the team builds: engineering standards,
    architecture patterns, review practices, and AI-native
    workflows.
  - Work closely with founders on product, strategy, technical
    tradeoffs, and execution.
  - Debug complex issues, make high-judgment technical
    decisions, and raise the overall engineering bar.

  RequirementsWhat We’re Looking For

  - 8–12+ years of experience building and shipping real
    production software.
  - Strong experience owning systems used by real users,
    including production incidents, scale, reliability, and
    long-term maintainability.
  - AI is central to how you work: you use tools like Codex,
    Claude Code, Cursor, or similar AI coding tools daily.
  - You know how to use AI agents to multiply your output, while
    maintaining control over quality, security, and
    architecture.
  - Deep software engineering fundamentals across architecture,
    debugging, system design, and code quality.
  - Strong security instincts and the ability to identify where
    AI-generated code can introduce risk.
  - Excellent judgment around where AI tools excel, where they
    hallucinate, and where human expertise is required.
  - A strong ownership mindset: you run toward responsibility,
    ambiguity, and hard technical problems.
  - Startup, 0→1, founder, first-engineer, or early-stage
    product experience.

  Bonus Points

  - You’ve been a founder, first engineer, or early technical
    leader.
  - You’ve worked on enterprise, security, compliance,
    infrastructure, or mission-critical systems.
  - You’ve built products involving AI agents, developer tools,
    AI infrastructure, governance, or automation.
  - You’ve designed or managed agentic coding workflows at
    scale.
  - You have a strong public body of work: open-source projects,
    technical writing, demos, talks, or content around AI-
    native development.

  Why Join Us

  - Real impact: You’ll be one of the people defining the
    product from the ground up.
  - High ownership: You’ll own meaningful technical decisions
    and major parts of the system.
  - Founder-level exposure: You’ll work directly with the
    founders on product, architecture, and strategy.
  - Frontier work: You’ll build in one of the most important and
    fast-moving categories in tech.
  - AI-native environment: You’ll work with a team that uses
    modern AI tooling deeply, not superficially.
  - Meaningful upside: Significant ownership and autonomy for
    the right person.

  Benefits

  What We Offer

  - Work alongside the ChainGPT core team on high-impact AI and
    Web3 products across our ecosystem.
  - Remote-first setup with flexible hours, focused on outcomes,
    trust, and ownership.
  - Competitive compensation, with performance-based upside
    where applicable to the role.
  - Fast-moving environment with direct collaboration across all
    team members, including senior management, and clear
    accountability with no micromanagement.
  - The support to do your best work, including the tools you
    need, structured onboarding, and clear room to grow.

  Company Culture and Values

  At ChainGPT, we value Trust, Effective Speed, Innovation,
  and Growth. As our Senior AI Engineer, you will embody these
  core values and have the opportunity to contribute to our
  culture and help drive our success. Join us on this exciting
  journey as we shape the future of blockchain and crypto
  technology.

