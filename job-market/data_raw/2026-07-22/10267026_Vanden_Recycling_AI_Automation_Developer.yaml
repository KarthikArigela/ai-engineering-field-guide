description: |
  AI & Automation Developer

  Location: Delhi, India Team: IT / Business Improvement
  Reporting to: Senior Business Analyst

  Be part of something special. Join Vanden.

  Vanden is a global recycling and trading business focused on
  creating value from plastic waste. Since 2005, we have grown
  across the UK, Europe, Turkey and Asia, working with
  customers in more than 20 countries.

  We are now looking for an AI & Automation Developer to help
  transform how our global business operates.

  The Role

  You will design and deliver AI-powered tools, automation
  workflows and system integrations that improve the way
  Vanden trades, reports, manages compliance and supports its
  customers.

  Working closely with senior leadership and teams across the
  business, you will identify inefficient or repetitive
  processes and turn them into practical, scalable solutions.

  This is a high-impact role with significant autonomy. You
  will be expected to actively identify opportunities, build
  solutions from the ground up and take ownership from initial
  idea through to deployment and adoption.

  What You’ll Do

  - Design, build and deploy AI agents and automation workflows.
  - Automate repetitive and manual processes across Vanden’s
    global operations.
  - Build integrations between Microsoft Business Central,
    SharePoint, Microsoft 365 and third-party platforms.
  - Develop solutions using Power Automate, Power Apps and Power
    BI.
  - Use tools and APIs such as Azure AI, OpenAI and LangChain to
    create intelligent assistants and document-processing
    solutions.
  - Build dashboards and data pipelines using Power BI and
    Python.
  - Work with business teams to map processes and identify
    automation opportunities.
  - Own automation projects from requirements and development
    through to testing, deployment and user training.
  - Support colleagues as new systems and automated processes
    are introduced.
  - Ensure solutions are secure, reliable, scalable and clearly
    documented.
  - Stay up to date with developments in AI and automation and
    bring new ideas to the business.

  What We’re Looking For

  - At least two years’ hands-on experience in software
    development, automation or AI engineering.
  - Practical experience using Python and/or JavaScript.
  - Experience working with AI tools, frameworks or APIs such as
    Azure AI, OpenAI, LangChain or similar.
  - A good understanding of REST APIs, webhooks and system
    integrations.
  - Experience using Microsoft Power Platform, including Power
    Automate, Power Apps or Power BI.
  - Exposure to Microsoft Azure or another cloud platform.
  - Experience working with ERP or business systems would be an
    advantage.
  - Strong analytical and problem-solving skills.
  - The ability to explain technical ideas clearly to non-
    technical colleagues.
  - The confidence to work independently and take ownership of
    delivery.

  A degree in Computer Science, Information Technology,
  Software Engineering or a related field would be beneficial,
  but practical experience and evidence of what you have built
  are equally important.

  Why Join Vanden?

  - Build Vanden’s AI and automation capability from the ground
    up.
  - Work on projects with visible impact across a global
    business.
  - Take genuine ownership of your roadmap and solutions.
  - Work directly with senior leaders who are investing in
    digital transformation.
  - Join a growing international sustainability business.
  - Collaborate with colleagues across more than ten countries.
  - Enjoy a varied role where you are encouraged to experiment,
    improve and challenge how things are done.

  Our Mission

  To make recycling part of the supply chain, optimise the use
  of plastics and create greater value from plastic waste.

  Our Values

  Teamwork. Add Value. Growth. Ownership. Enjoy the Ride.
  Gratefulness.
