description: |
  TCP is committed to cultivating a diverse and inclusive
  team. However, we are not able to sponsor visas for this
  role. 

  About TCP (TimeClock Plus):    

  For more than 30 years, TCP has helped organizations engage
  their people by providing flexible, mobile timekeeping and
  workforce management solutions. Trusted by tens of thousands
  of customers and millions of users, TCP delivers best-in-
  class technology and personalized support to organizations
  of all sizes in the public and private sector to meet their
  complex timekeeping, employee scheduling, leave management
  and other workforce needs. Growth is happening and our
  vision for a successful future is clear – We’d love for you
  to join us on this journey! For more information on TCP,
  visit www.tcpsoftware.com or follow us
  on LinkedIn or Facebook. 

  As a Software Engineer IV (AI), you will:

  - Design, develop, test, and document cloud-hosted web
    applications in a cross-functional agile environment.
  - Deliver quality code backed by unit tests and automated
    acceptance tests.
  - Review, define, analyze, and improve detailed specifications
    and implement feature development.
  - Build and maintain test automation to ensure fast delivery
    of quality products.
  - Lead peer code reviews and guide the team toward best
    practice design patterns.
  - Use AI-assisted development tools to accelerate delivery and
    hold AI-generated code to the same review standard as
    human-written code.
  - Mentor junior team members and provide technical leadership.
  - Operate independently, setting priorities and goals while
    continuing to learn and grow technically.

  Our Technology Stack:

  - Backend: C# on modern .NET and .NET Framework in a multi-
    tier service architecture.
  - Frontend: JavaScript and AngularJS, with Jasmine unit tests.
  - Database: Microsoft SQL Server, including schema projects
    and idempotent migration scripts.
  - Delivery: Docker, Jenkins CI/CD, and cloud-hosted
    deployment.
  - AI tooling: agentic development pipelines, MCP integrations,
    and AI-assisted code review.

  Requirements

  - 6+ years of professional software development experience.
  - Deep production experience with C#/.NET, SQL Server, and web
    application development.
  - Experience with JavaScript frameworks, including maintaining
    or modernizing legacy frontends.
  - The ability to understand requirements and solve technical
    issues without supervision, serving as a technical lead.
  - Recognition as an emerging technical leader within the team,
    often acting as a team lead.

  AI Experience Requirements:

  - Hands-on daily use of AI coding assistants or agentic tools,
    such as Claude Code, GitHub Copilot, or Cursor.
  - The ability to critically review, test, and harden AI-
    generated code before it ships.
  - Familiarity with prompt design and multi-agent or automated
    development workflows.
  - A clear understanding of the limits and risks of AI-
    generated code, including security and licensing concerns.
  - Preferred: experience with LLM APIs, MCP servers, or
    building internal AI tooling.

  Physical Requirements:

  - Prolonged periods sitting at a desk and working on a
    computer.
  - Must be able to lift up to 15 pounds at times.

  Benefits

  - Competitive salary
  - 20 Days of PTO (Paid Time Off) and 13 days of companywide
    holidays
  - 8 hours to volunteer and impact the community
  - Comprehensive benefits (Health/Dental/Vision/ 401K)
  - Employee Choice Pre-Tax Benefit

  TCP is an equal opportunity employer. We celebrate diversity
  and are committed to creating an inclusive environment for
  all employees.
