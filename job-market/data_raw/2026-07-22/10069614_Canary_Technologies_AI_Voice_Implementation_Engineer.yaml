  Join us in shaping the future of hospitality!



  About the Role

  Behind every great Voice AI experience is telephony that
  just works — and getting hotels live means getting their
  phone set up right the first time. As our AI Voice
  Implementation Engineer, you'll be the telephony subject
  matter expert who owns the technical onboarding for every
  Voice AI deployment, and the person who jumps in when a live
  property's calls aren't behaving. You'll get on the call
  with a hotel's IT, their PBX vendor, and their carrier,
  surface the requirements, and drive the configuration end-
  to-end until calls route, transfer, and answer exactly as
  they should. When something needs troubleshooting — a
  transfer that won't connect, audio that needs tuning, a
  number that won't port, an attestation problem — you're the
  person who reads the logs and figures out why. You'll also
  partner closely with Product on how calls should flow and
  escalate, bringing telephony reality to the table while
  thinking in terms of modern conversational AI, not static
  phone trees. This is a hands-on, customer-facing role for
  someone who knows telephony cold, likes being the one who
  makes it work, and is excited about where voice is headed.

