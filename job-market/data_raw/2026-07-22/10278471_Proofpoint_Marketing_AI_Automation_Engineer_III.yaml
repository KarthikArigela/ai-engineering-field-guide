  Overview

  We are building an AI-driven go-to-market infrastructure
  where automation, predictive intelligence, and unified data
  power every stage of the customer lifecycle. The Manager,
  GTM AI Automation & Martech Activation will design and
  operationalize the systems that enable this
  vision—integrating Salesforce, 6sense, Clay, Snowflake, CDP-
  like platforms, Marketo, and AI systems to create a fully
  automated, data-driven marketing and revenue engine. This
  role is ideal for someone who has architected modern GTM
  stacks, cleaned and structured Salesforce environments,
  activated MarTech platforms for real business impact, and
  operationalized AI models into scalable marketing workflows.
  The role partners closely with Marketing, Revenue
  Operations, Sales, Data Engineering, and IT teams.

  Key Responsibilities

  - Define and implement an AI-first automation strategy across
    the marketing and revenue lifecycle.

  - Activate and optimize the modern MarTech stack including
    Salesforce, 6sense, Clay, Snowflake, and marketing
    automation platforms.

  - Operationalize AI and machine learning models for
    segmentation, targeting, and lead scoring.

  - Leverage Intent tooling for account intelligence, buying
    intent analysis, and account-based marketing activation.

  - Use Clay.io or similar enrichment platforms to automate
    contact discovery and expand ICP coverage.

  - Clean, restructure, and optimize Salesforce environments
    including deduplication and account hierarchy
    normalization.

  - Identify missing contacts and incomplete records across
    target accounts to improve GTM coverage.

  - Build unified marketing data models leveraging Snowflake or
    similar data warehouse platforms.

  - Establish governance standards for CRM data quality, AI
    usage, and MarTech platform performance.

  - MarTech Activation, AI Integrations & MCP Framework Ensure
    full activation and utilization of the modern MarTech
    stack including Salesforce, 6sense, Clay, Snowflake, and
    marketing automation systems.

  - Design integrations across the GTM ecosystem using APIs,
    automation platforms, and Model Context Protocol (MCP).

  - Implement MCP-enabled integrations allowing AI systems to
    interact with CRM systems, marketing platforms, and data
    infrastructure.

  - Build scalable orchestration frameworks connecting marketing
    platforms, data infrastructure, and AI-driven automation
    workflows.

  AI Systems

   - You’ll Build AI-powered lead and account intelligence
     systems integrating Salesforce and 6sense.

  - Context-aware AI systems using context engineering
    frameworks that incorporate data from Salesforce,
    Snowflake, Clay, and marketing platforms.

   - AI-driven data enrichment and contact discovery workflows
     using Clay and enrichment platforms.

  - AI lifecycle orchestration engines that automate customer
    journeys based on behavioral and intent signals.

  - MCP-based AI integration frameworks that allow AI agents to
    interact securely with GTM systems.

  Required Qualifications

  - 7-10+ years in Marketing Operations, Revenue Operations,
    Growth Operations, or MarTech leadership.

  - Deep expertise in Salesforce architecture, CRM data
    governance, and marketing automation.

  - Proven experience cleaning and optimizing Salesforce
    environments including deduplication and account hierarchy
    management.

  - Experience working with modern GTM platforms such as 6sense,
    Clay, and Snowflake.

  - Experience implementing machine learning lead scoring or
    predictive segmentation.

  - Experience designing automation-ready marketing data
    architectures.

  - Experience implementing context engineering approaches for
    AI workflows.

  - Experience integrating AI systems using APIs, automation
    frameworks, or MCP.

  Preferred Qualifications

   - Marketo certification, Salesforce Admin Experience with SQL,
     AI-enabled CRM capabilities.

  - Experience with composable CDP or warehouse-native marketing
    architectures.

  - Experience building AI-enabled GTM infrastructure in B2B
    SaaS environments.

