  Job Description

  We are seeking a highly skilled and experienced Senior Cloud
  Engineer to join our cloud engineering team in Bangalore,
  India. This role will focus on deploying, configuring, and
  optimizing Databricks platforms and applications on Google
  Cloud Platform and Microsoft Azure

  You will play a critical role in building secure, scalable,
  and high-performance cloud environments, with a focus on
  networking, automation, and platform operations, while
  leveraging AI-driven capabilities to significantly enhance
  engineering productivity, accelerate delivery, and enable
  scalable operations.

  Qualifications

  Key Responsibilities

  - Deploy, configure, and operate Databricks environments on
    either GCP, Azure, or both
  - Build and support Databricks applications (notebooks, jobs,
    workflows, integrations)
  - Design and implement cloud networking (VPCs, subnets,
    firewalls, private connectivity, hybrid connectivity) for
    Databricks and related services
  - Ensure secure, reliable connectivity between Databricks,
    cloud services, and enterprise systems
  - Design, build, and leverage AI-powered tools and assistants
    to improve developer productivity, streamline workflows,
    and reduce manual effort
  - Develop AI-driven automation solutions to handle routine
    engineering tasks such as environment setup, configuration
    validation, and deployment orchestration
  - Integrate AI capabilities into CI/CD, infrastructure
    automation, and operational workflows to increase
    efficiency and scalability
  - Evaluate and adopt emerging AI/ML tools, frameworks, and
    copilots to enhance cloud engineering effectiveness
  - Drive a culture of AI-assisted engineering, promoting reuse,
    intelligent automation, and continuous efficiency
    improvements
  - Develop and manage Infrastructure as Code (Terraform) and
    automate environment provisioning
  - Build and maintain CI/CD pipelines for infrastructure and
    Databricks deployments
  - Integrate Databricks with enterprise data platforms and
    cloud services (e.g., GCP Storage, BigQuery, Pub/Sub)
  - Monitor, troubleshoot, and resolve networking, platform, and
    deployment issues
  - Enforce security, governance, and cost controls across cloud
    environments
  - Collaborate with platform, data, and security teams; mentor
    junior engineers and contribute to best practices

  Required Qualifications

  - Bachelor’s degree in Computer Science, Engineering, or
    related field
  - 7–10+ years of total experience, including 5–7 years in
    cloud engineering
  - Strong hands-on experience with either GCP, Azure, or both
  - Proven experience with Databricks deployment and operations
  - Hands-on experience building or leveraging AI-based tools to
    improve engineering productivity and automate workflows
  - Experience integrating AI capabilities into DevOps, platform
    engineering, or cloud operations processes
  - Deep understanding of cloud networking and hybrid
    connectivity
  - Experience with containers and Kubernetes (GKE / AKS)
  - Strong experience with Terraform (IaC), CI/CD pipelines, and
    automation
  - Proficiency in Python, Bash, or PowerShell

  Preferred Qualifications

  - GCP, Azure, or Databricks certifications
  - Experience working in Agile/Scrum environments

