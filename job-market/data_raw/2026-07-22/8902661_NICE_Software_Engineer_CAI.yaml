description: |
  At NiCE, we don’t limit our challenges. We challenge our
  limits. Always. We’re ambitious. We’re game changers. And we
  play to win. We set the highest standards and execute beyond
  them. And if you’re like us, we can offer you the ultimate
  career opportunity that will light a fire within you.

  Tech Stack & Focus Areas

  Core: C#, .NET 10

  Cloud & Orchestration: Kubernetes, Helm, Docker, Azure

  AI Development: Claude Code (primary), prompt engineering,
  AI agents & agentic workflows, LLM API integration
  (Anthropic, Azure OpenAI, OpenAI)

  Architecture: Event-driven systems, Microservices, SOLID,
  platform-oriented reusable component design

  Performance: Multithreading, concurrency, high-throughput
  distributed systems

  Security: Encryption, zero-trust principles, secure coding

  Quality: Unit testing, integration testing, CI/CD pipelines,
  automated quality tooling, intelligent
  observability/monitoring

  Who We Are

  We're an energetic and technically minded team of software
  builders based in Alkmaar, operating under the belief that
  AI-First is AI-Proof. We care deeply about engineering
  quality, craftsmanship, and building products that matter —
  and we're using AI to do it faster and better than ever
  before.

  Our culture is grounded in three pillars: competence,
  craftsmanship, and trustworthiness. We work in a social,
  international, and inclusive environment where your ideas
  shape our technology. Our office is easy to reach, our
  culture is collaborative, and we value healthy work/life
  balance.

  We offer competitive pay, strong benefits, and the chance to
  work on meaningful systems used by some of the world's
  largest financial institutions.

  So, what’s the role all about?

  We build advanced Financial Market Compliance solutions that
  help global banks detect, prevent, and investigate financial
  fraud.

  We are mid-transformation — moving from individual products
  into a unified, AI-native compliance platform. This platform
  is designed to be shared, modular, and built to scale across
  every product line we support.

  The AI features we're actively building include false-
  positive elimination, automated investigation workflows, and
  advanced compliance search — capabilities that were
  previously intractable and are now unlocked by AI. Engineers
  joining now will be core contributors to this platform from
  the ground up.

  How will you make an impact?

  - Contribute to building our new horizontal compliance
    platform — designing shared components and plug-and-play
    modules used across every product
  - Work in a cross-functional team alongside engineers, QA,
    architects, and product owners, spanning foundational,
    data engineering, and application layers of the
  - Write clean, maintainable, well-tested code using Claude
    Code as your primary AI development tool — accelerating
    your output while maintaining full ownership and quality
    standards over everything you ship.
  - Build and work with AI agents to automate development
    workflows, eliminate toil, and unlock capabilities that
    previously required manual effort.
  - Design APIs, microservices, and data flows for large-scale
    distributed
  - Share what you learn — internal tech talks, documentation,
    and mentoring peers across platform layers are first-class
    contributions here.
  - Own the full lifecycle of the components you build:

  Have you got what it takes?

  Bachelor or Master’s degree in Computer Science (or
  equivalent practical experience)

  - Bachelor or Master's degree in Computer Science (or
    equivalent practical experience)
  - 4+ years of professional software engineering experience
  - Strong C# / .NET development background
  - Hands-on daily use of AI coding assistants (e.g. GitHub
    Copilot, Cursor, or Claude Code) as a core part of your
    development workflow — not just occasional use
  - Ability to critically evaluate, verify, and improve AI-
    generated code — you own what gets committed, regardless
    of how it was produced
  - Working knowledge of prompt engineering for development
    tasks: writing effective prompts for code generation,
    refactoring, test writing, and documentation
  - Solid understanding of design patterns (DDD, SOLID), clean
    code, maintainability, and modern development practices
  - Experience building distributed, cloud-native, or
    microservices systems
  - Familiarity with Kubernetes, Helm, Docker, and cloud
    infrastructure (Azure)
  - Understanding of multithreading, concurrency, and
    performance optimization
  - Knowledge of secure coding, encryption, and application
    security
  - Good English communication skills — direct, clear, and
    collaborative
  - A positive team mindset and passion for building great
    software
  - Collaborate through Git-based workflows, code reviews, and
    continuous integration practices

  You will have an advantage if you also have:

  - Experience with event-driven architectures (RabbitMQ, Kafka,
    Azure Service Bus)
  - Cloud-native observability (OpenTelemetry, Prometheus,
    Grafana)
  - Integration of LLM APIs (Azure OpenAI, Anthropic, OpenAI)
    into production systems
  - Experience designing or working with AI agents and agentic
    automation workflows
  - Experience evaluating and rolling out AI developer tooling
    across an engineering team

