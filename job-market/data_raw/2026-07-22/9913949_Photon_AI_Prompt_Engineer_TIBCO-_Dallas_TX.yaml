title: AI Prompt Engineer (TIBCO)- Dallas, TX
company: Photon
location: USA
remote: true
work_type: FULL_TIME
description: |
  We are looking for a detail-oriented prompt engineer
  responsible for designing and optimizing the interactions
  between users and AI language models. Your primary focus
  will be the development of effective prompt strategies to
  ensure consistent accuracy in AI-generated outputs.



  You will also be responsible for collaborating with product
  teams to integrate AI capabilities into customer-facing
  applications.



  Responsibilities



  ▪ Design and craft prompts for content generation data
  analysis



  ▪ Run systematic A/B tests to measure prompt effectiveness



  ▪ Create versioned prompt libraries with clear documentation
  and use case examples



  ▪ Integrate AI prompt solutions into existing workflows



  ▪ Collaborate with data engineers / ML engineers / product
  teams to fine-tune prompts



  ▪ Document prompt experiments and outcomes.



  ▪ Stay updated on the latest advancements in AI, NLP, and
  prompt engineering techniques



  ▪ other responsibilities specific to TIBCO implementation




  Required prompt engineer skills and qualifications



  ▪ 8+years of experience working with AI or NLP technologies



  ▪ Proficient in prompt engineering with experience in at
  least one major AI platform, such as OpenAI API, Anthropic
  Claude, Google Gemini, Microsoft Copilot, depending on your
  tech stack



  ▪ Strong command of English for nuanced prompt crafting



  ▪ Knowledge of prompt chaining and multi-step reasoning
  techniques



  ▪ Understanding of token economics and context window
  management



  ▪ Familiarity with tech stack: JavaScript & Java frameworks



  ▪ Experience measuring and reporting on prompt performance
  metrics



  ▪ Strong analytical and problem-solving skills, with
  attention to detail.




  Preferred qualifications



  ▪ Python programming skills and familiarity with AI/ML
  frameworks (e.g., TensorFlow, PyTorch) are a plus



  ▪ Experience with prompt chaining and multi-agent
  architectures using automation platforms



  ▪ Knowledge of RAG systems, vector databases, fine-tuning
  processes.



  ▪ Previous work in Banking industry.





  Compensation, Benefits and Duration

  Minimum Compensation: USD 38,000 Maximum Compensation: USD
  135,000 Compensation is based on actual experience and
  qualifications of the candidate. The above is a reasonable
  and a good faith estimate for the role. Medical, vision, and
  dental benefits, 401k retirement plan, variable
  pay/incentives, paid time off, and paid holidays are
  available for full time employees. This position is not
  available for independent contractors No applications will
  be considered if received more than 120 days after the date
  of this post
