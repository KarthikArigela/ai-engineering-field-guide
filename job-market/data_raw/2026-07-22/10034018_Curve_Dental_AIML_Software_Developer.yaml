description: |
  About Curve Dental:

  Build the Next Generation of AI-Enabled Dental Software

  Curve Dental is the leading cloud-based dental practice
  management platform, helping thousands of dental practices
  streamline operations, improve patient experiences, and grow
  their businesses.

  We’re entering the next phase of the Curve platform.  We
  believe the future of dental software isn’t simply AI-
  powered, it is AI-enabled.  Curve is building a shared
  intelligence platform that brings agentic AI into every
  aspect of the dental practice.  From revenue cycle
  management and patient communications to scheduling,
  clinical documentation, insurance workflows, and operational
  automation, our goal is to create intelligent systems that
  help practices operate more efficiently while allowing
  dental teams to focus on delivering exceptional patient
  care.

  To help bring this vision to life, we’re looking for an AI
  Software Developer to join our team.  Working alongside our
  AI Platform Software Developer, Architecture team, and
  highly skilled development teams,  you’ll help design,
  build, and deliver production AI capabilities that power
  intelligent workflows throughout the Curve platform.

  This is a hands-on development role.  You’ll spend the
  majority of your time, designing, building, testing,
  reviewing, and delivering production software while helping
  bring intelligent agents, machine learning models, and AI-
  powered workflows into the hands of thousands of customers.

  We move quickly, collaborate closely, and take ownership.
  Whether you’re building  a new intelligent workflow,
  deploying a machine learning model, troubleshooting a
  production issue, or helping another developer solve a
  difficult technical challenge, you’ll be expected to jump in
  where needed and help deliver the best possible product.

  This is an opportunity to help build the AI capabilities
  that will power the next generation of dental software.

  What You’ll Do

  As an AI Software Developer, you’ll work alongside our
  Architecture, Development and Product teams to build and
  deliver intelligent capabilities across the Curve platform.

  Your responsibilities will include:

  - Designing, building, testing, and delivering production AI
    capabilities, including intelligent agents, workflows, MCP
    servers, integrations, machine learning models, and shared
    services
  - Developing AI-powered products that automate clinical,
    operational, financial, and patient-facing workflows
    across the Curve platform
  - Building, training, evaluating, deploying, monitoring, and
    continuously improving machine learning models and
    intelligent services running in production
  - Developing reusable MCP tools, APIs, and platform components
    that accelerate AI development across multiple platform
    teams
  - Writing high-quality production code while leveraging modern
    AI-assisted development tools, including Claude Code, to
    improve software quality and development productivity
  - Participating in technical design discussions, code reviews,
    testing, production deployments, and production support
    throughout the software development lifecycle
  - Working closely with Product, UX, Architecture, and
    development teams to transform business requirements into
    secure, scalable, maintainable software
  - Continuously improving AI capabilities through
    experimentation, prompt engineering, model tuning,
    evaluation, monitoring, and operational feedback
  - Taking ownership of production software by troubleshooting
    complex issues, improving reliability, and helping deliver
    exceptional customer experiences

  What We’re Looking For

  We’re looking for an exceptional software developer who
  combines deep hands-on AI expertise with a passion for
  building production systems.

  Required Qualifications

  - 5+ years of professional software development experience
    building scalable SaaS applications
  - 2+ years designing, building, and deploying production AI
    applications, platforms, or intelligent workflow solutions
  - Demonstrated experience taking AI-powered solutions from
    proof-of-concept through production deployment and
    continuously improving them through evaluation,
    monitoring, iteration and operational feedback
  - Demonstrated experience writing high-quality production code
    and supporting production software
  - Strong expertise in modern backend development, with
    experience in Python or similar technologies
  - Experience building intelligent agents, MCP servers, AI
    tools, or similar integration architectures
  - Experience training, deploying, evaluating, and maintaining
    machine learning models in production
  - Experience working with LLMs, embeddings, Retrieval-
    Augmented Generation (RAG), vector databases, and prompt
    engineering
  - Strong understanding of distributed systems, APIs, cloud-
    native architectures, and modern software development
    practices
  - Experience participating in technical design discussions,
    code reviews, and collaborative software development
  - Experience using AI-assisted development tools such as
    Claude Code, Cursor, GitHub Copilot, or similar
    technologies
  - Thrives in a fast-paced environment, embraces ownership, and
    enjoys solving difficult development challenges

  Preferred Qualifications

  Experience with one or more of the following:

  - Production AI platforms (LangGraph, Amazon Bedrock, OpenAI,
    Anthropic, or similar technologies)
  - Agentic AI frameworks and MCP servers, and AI integration
    ecosystems
  - Production AI operations, including model deployment,
    evaluation, observability, governance, or MLOps
  - Conversational AI, speech technologies or customer facing AI
    applications
  - Retrieval-Augmented Generation (RAG), vector databases, and
    semantic search
  - Building AI capabilities within large-scale, multi-tenant
    SaaS platforms
  - Experience building software in healthcare or other highly
    regulated environments

  What Success Looks Like

  During your first year, you will:

  - Deliver production AI capabilities that are adopted across
    the Curve platform and used by thousands of dental
    practices
  - Become a trusted technical contributor on AI initiatives
    across multiple product teams
  - Build reusable agents, tools, workflows, and platform
    components that accelerate AI development throughout the
    organization
  - Help evolve Curve’s AI platform through practical
    implementation, continuous improvement, and production
    feedback
  - Consistently deliver high-quality production software while
    helping improve development practices across the
    development organization
  - Become a developer that others rely on when solving
    difficult AI development challenges and building reliable
    production systems
