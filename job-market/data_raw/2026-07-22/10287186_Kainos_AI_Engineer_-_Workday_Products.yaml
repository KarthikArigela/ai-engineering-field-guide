description: |
  Join Kainos and Shape the Future

  At Kainos, we’re problem solvers, innovators, and
  collaborators - driven by a shared mission to create real
  impact. Whether we’re transforming digital services for
  millions, delivering cutting-edge Workday solutions, or
  pushing the boundaries of technology, we do it together.

  We believe in a people-first culture, where your ideas are
  valued, your growth is supported, and your contributions
  truly make a difference. Here, you’ll be part of a diverse,
  ambitious team that celebrates creativity and collaboration.

  Ready to make your mark? Join us and be part of something
  bigger.

  As an Associate AI Engineer within Kainos’ Workday Products
  division, you will support the team in productionising AI
  and machine learning solutions, working closely with and
  under the guidance of senior engineers to help integrate AI
  models into production systems. You will work closely with
  data scientists, software engineers, and product teams to
  deliver robust, scalable AI solutions that enhance our
  Workday product offerings – including Kainos Smart (Smart
  Test, Smart Audit and Smart Shield), Employee Document
  Management and Pay Transparency Analyzer. This is an
  opportunity to build foundational skills in MLOps, cloud
  deployment, and software engineering practices while
  contributing to real-world AI solutions that enhance our
  Workday product offerings.


  Essential Experience:

  - Typically 2+ years of relevant industry experience

  - Foundational experience in software development, with
    working knowledge of Python (or a similar language such as
    Java or C++), and a willingness to develop clean,
    maintainable code under guidance.

  - Some exposure to deploying or supporting AI/ML models —
    through academic projects, internships, or early career
    experience — with an interest in developing MLOps skills
    (CI/CD, model versioning, monitoring).

  - Awareness of responsible AI, security, and data privacy
    practices, with the ability to follow agreed guidelines
    such as handling sensitive data correctly, using approved
    tools, and raising potential risks to senior colleagues.

  - Basic understanding of cloud platforms (AWS, Azure, or GCP);
    exposure to cloud-native AI tools (e.g., SageMaker, Vertex
    AI, Azure ML Studio) is a plus.

  - Awareness of containerisation technologies (e.g., Docker);
    exposure to orchestration tools (e.g., Kubernetes) is
    beneficial but not essential.

  - Emerging data engineering skills, such as working with data
    pipelines or data wrangling, gained through coursework,
    internships, or personal projects.

  - Some exposure to agile software development practices, e.g.
    through internships, university projects, or previous
    roles.

  - Good interpersonal skills, with enthusiasm for collaborating
    with cross-functional teams and communicating technical
    ideas clearly.

  Desirable Experience:

  - BSc in Computer Science, Machine Learning, Software
    Engineering, or a related field

  - Personal, academic, or internship projects demonstrating an
    interest in AI/ML productionisation.

  - Familiarity with Workday APIs, data structures, and
    integration patterns is an advantage but not required.

  - Exposure to generative AI concepts or tools (e.g., OpenAI
    GPT, Hugging Face Transformers) through coursework or
    self-directed learning.

  - Basic awareness of deep learning concepts (CNNs, RNNs,
    Transformers) gained through study or personal
    exploration.

  - Enthusiasm for participating in team knowledge-sharing
    activities, such as internal show-and-tells or learning
    sessions.

  Embracing our differences  

  At Kainos, we believe in the power of diversity, equity and
  inclusion. We are committed to building a team that is as
  diverse as the world we live in, where everyone is valued,
  respected, and given an equal chance to thrive.   We
  actively seek out talented people from all backgrounds,
  regardless of age, race, ethnicity, gender, sexual
  orientation, religion, disability, or any other
  characteristic that makes them who they are.   We also
  believe every candidate deserves a level playing field.

  Our friendly talent acquisition team is here to support you
  every step of the way, so if you require any accommodations
  or adjustments, we encourage you to reach out.

  We understand that everyone's journey is different, and by
  having a private conversation we can ensure that our
  recruitment process is tailored to your needs.
