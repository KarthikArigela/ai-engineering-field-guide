description: |
  About Warmly Warmly is a fast-growing Series A company
  backed by Y-Combinator, Felicis, and Sequoia, with a high-
  velocity, transparent, and data-driven work culture. Our AI
  sales platform saves hundreds of hours/week for sales teams
  while helping our customers achieve their mission faster. We
  are scaling from $3M to $10M in ARR and 250 to 500 customers
  in advance of a Series B. We foster a work environment where
  ideas are encouraged, experiments thrive, and individuals
  take ownership to drive impact.

  We are looking for a Staff AI Engineer to lead the
  architectural evolution of our Inbound, Outbound, and Signal
  Agents. You will be responsible for turning raw intent
  signals into high-conversion pipeline through LLM-driven
  reasoning, advanced identity resolution, and seamless
  workflow automation.

  What You’ll Build

  - Autonomous Inbound Agents: Lead the development of AI agents
    that don't just "chat," but identify, qualify, and route
    leads using our proprietary Inbound Identity graph.
  - Signal Intelligence: Architect the data pipelines that
    ingest millions of signals to determine
    "Strategic/Executive Value" for our customers.
  - LLM Ops & Scalability: Build the infrastructure to move from
    "prompt engineering" to "agentic reasoning," ensuring our
    AI is reliable, cost-efficient, and fast enough for real-
    time web traffic.
  - Data Room Ready Engineering: Maintain rigorous documentation
    and clean architecture, ensuring our tech stack is a
    "plug-and-play" asset for our Series B due diligence.

  Tech stack:

  - Backend: TypeScript, Node.js, GraphQL, tRPC
  - Infrastructure: PostgreSQL, Redis, Elasticsearch, Google
    Cloud Platform, Kubernetes, Docker
  - Third-party Integrations: Salesforce, Hubspot, Pipedrive,
    Outreach, Apollo, Slack
  - Experience with TypeScript
  - Experience with Node.js
  - Experience with React
  - Experience with PostgreSQL, Redis

  Who You Are

  - The 10x Architect: You have a track record of taking AI
    products from 0 to 1 and then scaling them to 100. You
    understand that "Growth at all costs" is dead—you build
    for unit economic efficiency.
  - Technical Depth: Expert in Python, TypeScript, and the
    modern AI stack (LangChain/LlamaIndex, Vector DBs,
    OpenAI/Anthropic APIs).
  - Product-Minded: You don't just build features; you solve
    problems for our core personas—Marketing, Sales, and
    RevOps.
  - Lean & Mean Mindset: You are excited about the challenge of
    a high-performance, consolidated team and thrive in an
    environment where speed-to-market is the primary metric.
  - 8+ years of experience

  Why Warmly?

  - Proven PMF: Our top champions are already buying for Inbound
    Identity. You are joining a rocket ship that already has
    its trajectory set.
  - Series B Readiness: We are sharpening our tools and our team
    to dominate the market. You will have a seat at the table
    as we scale the engineering org.
  - Equity & Impact: High-leverage role with significant equity
    upside as we prepare for our next major milestone.
