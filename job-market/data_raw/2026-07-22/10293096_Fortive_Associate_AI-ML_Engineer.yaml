description: |
  AI/ML Engineer Job Summary

  We are seeking a highly motivated AI/ML Engineer to join our
  growing Artificial Intelligence and Automation team. The
  ideal candidate will have a strong foundation in Machine
  Learning, Generative AI, Python development, and data-driven
  problem solving. This role provides an excellent opportunity
  to work on cutting-edge AI initiatives, including Large
  Language Models (LLMs), Agentic AI systems, Retrieval-
  Augmented Generation (RAG), MLOps, Intelligent Automation,
  and AI-powered enterprise solutions.

  The candidate will collaborate with cross-functional teams
  to design, develop, deploy, and optimize AI solutions that
  drive business value across multiple domains.

  Key Responsibilities

  - Develop and implement Machine Learning and Generative AI
    solutions to solve business challenges.
  - Build, test, and optimize AI models using Python and modern
    AI/ML frameworks.
  - Design and develop Retrieval-Augmented Generation (RAG)
    applications using enterprise knowledge sources.
  - Assist in developing AI Agents and multi-agent workflows
    using frameworks such as LangChain, LangGraph, CrewAI, or
    similar technologies.
  - Perform data preparation, feature engineering, model
    training, evaluation, and performance monitoring.
  - Support deployment and operationalization of AI models using
    MLOps best practices.
  - Integrate AI solutions with enterprise applications, APIs,
    databases, and cloud platforms.
  - Collaborate with business stakeholders, developers, and data
    teams to gather requirements and deliver AI-driven
    solutions.
  - Conduct research on emerging AI technologies, tools, and
    frameworks and recommend innovative solutions.
  - Create technical documentation, test cases, and deployment
    artifacts for developed solutions.
  - Participate in code reviews, knowledge-sharing sessions, and
    continuous improvement initiatives.

  Required Qualifications

  - Bachelor's degree in Computer Science, Information
    Technology, Artificial Intelligence, Data Science, or
    related field.
  - 0-2 years of experience in AI, Machine Learning, Data
    Science, Software Development, or related areas.
  - Strong programming skills in Python.
  - Understanding of Machine Learning concepts including
    supervised and unsupervised learning.
  - Familiarity with Generative AI and Large Language Models
    (LLMs).
  - Knowledge of data structures, algorithms, and software
    engineering fundamentals.
  - Basic understanding of REST APIs, databases, and cloud
    technologies.
  - Strong analytical and problem-solving skills.
  - Excellent communication and collaboration abilities.

  Preferred Skills

  - Experience with Python libraries such as Pandas, NumPy,
    Scikit-learn, TensorFlow, PyTorch, or Hugging Face.
  - Exposure to LLM platforms such as OpenAI, Anthropic Claude,
    Azure OpenAI, Gemini, or similar.
  - Familiarity with LangChain, LangGraph, CrewAI, AutoGen, or
    agentic AI frameworks.
  - Understanding of Vector Databases and Retrieval-Augmented
    Generation (RAG).
  - Knowledge of MLOps concepts including MLflow, model
    deployment, monitoring, and CI/CD practices.
  - Exposure to cloud platforms such as Azure, AWS, or Google
    Cloud.
  - Understanding of Git, Docker, and containerized deployments.
  - Experience working on AI-related academic, internship,
    personal, or open-source projects.

  What You'll Gain

  - Hands-on experience with enterprise-scale AI and Automation
    initiatives.
  - Opportunity to work on Generative AI, Agentic AI, and next-
    generation AI technologies.
  - Exposure to cloud-native AI solutions and MLOps practices.
  - Mentorship from experienced AI and technology leaders.
  - Opportunity to contribute to impactful business
    transformation programs through AI innovation.
