description: |
  Grounded in a talent-centric mindset, Maker Lab is a
  marketing agency designed to build decentralised technology-
  led agency teams, rooted in collaboration with clients from
  the ground up. Maker Lab’s cross-functional teams of
  multidisciplinary specialists are embedded into client teams
  across digital marketing competencies — from measurement &
  analytics to content production.

  Job Summary:

  We're looking for a Junior Marketing AI & Data Engineer to
  support one of our amazing clients in the music and
  entertainment industry. Join a team transforming the way
  music connects with audiences — using AI, automation, and
  data to unlock insights, solve real marketing challenges,
  and create smarter ways to engage fans across APAC.

  Role:

  - Monitor and troubleshoot daily data ingestion routines for
    the unified data engine, ensuring real-time feeds from
    DSPs, social networks, and eCommerce platforms run without
    interruption.
  - Run, evaluate and test existing machine learning models to
    track product consumption velocity, supporting validation
    of early-stage trend spikes and real-time success
    probabilities.
  - Assist with routine technical testing of data pipelines to
    confirm localised data tokenisation and anonymisation
    filters are functioning correctly under relevant regional
    data protection regulations.
  - Update, refine and manage front-end interfaces and
    interactive dashboards, keeping them functional and
    accessible for non-technical marketing teams.
  - Manage daily intake spillover from the natural-language AI
    briefing form, resolving formatting gaps and mapping
    historical campaign data into new briefs.
  - Execute automated bulk CSV configuration macros to
    accelerate ad deployments for the Paid Media team, and
    prompt-tune Gen AI scripts to support bulk creative asset
    generation.

  You:

  - BA/BS degree or equivalent experience.
  - 2+ years of professional experience or structural
    familiarity with data engineering, data analytics, or
    predictive pipelines within tech or digital media.
  - Competence writing basic Python and SQL queries, with a
    strong willingness to learn how production data models are
    structured within Databricks environments.
  - Eagerness to use modern AI coding assistants and LLMs to
    accelerate routine code management, testing cycles, and
    dashboard building.
  - Basic understanding of data privacy principles and why
    cross-border data handling protocols matter when working
    with regulated markets.
  - Exceptional verbal and written English communication and
    presentation skills.

  Contract Type: 12-months Fixes Term Contract

  Please note: due to the high volume of applications, only
  successful candidates will be contacted with a follow-up
  introduction email.  If you do not receive an email from
  Maker Lab, your application has been unsuccessful this time
  around. Look out for future roles! By submitting your
  application, you consent to the collection, use and
  disclosure of your data by the Maker Lab team for the
  purposes of your application. Where your application
  contains personal data of third parties, you confirm that
  you have obtained all necessary consents to provide the
  Maker Lab team with such personal data and that we may
  collect, use and/or disclose such data in accordance with
  the Personal Data Protection Act 2012.
