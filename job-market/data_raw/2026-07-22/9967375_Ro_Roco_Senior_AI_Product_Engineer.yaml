description: |
  Join Tech @ Ro to build the future of healthcare, from the
  ground up!

  At Ro, we believe that when people achieve their health
  goals, they can achieve their life goals. The highest-
  leverage way to move society forward is to give people their
  health, and the current healthcare system isn’t built to do
  that. It was built to bill, not to serve patients.

  We’re building a new system. One where the patient is in
  control. One designed from scratch for the digital age.

  At Ro, technology isn’t just a function… It's core to how we
  deliver care. We’ve built a vertically integrated healthcare
  platform that connects telehealth, diagnostics, pharmacy,
  and logistics into a seamless, end-to-end experience for
  millions of patients.

  …and we’re just getting started.

  As part of Tech @ Ro, you’ll work on systems that operate at
  scale, with an opportunity to:

  - Solve complex, high-concurrency problems across a full-stack
    platform
  - Build and ship quickly with tight feedback loops and real-
    world impact
  - Own systems end-to-end, from architecture to production
    performance
  - Work alongside experienced operators, technical leaders, and
    clinicians
  - Help define how modern healthcare should be delivered

  We’re a performance-driven team with a strong sense of
  ownership and urgency. We move fast, learn quickly, and hold
  a high bar for what we build, and do so with a big heart —
  because patients depend on it.

  If you’re motivated by impact, scale, and the chance to help
  lead the patient revolution, come build with us.

  The Role

  Ro is building a team focused on shipping LLM-powered
  products across the patient experience, clinical operations,
  and internal tooling.

  We're hiring a Senior AI Product Engineer to join a new team
  we're building from the ground up. This is a hybrid Product
  + Engineering role for someone who wants to own the full
  lifecycle of AI products: from identifying high-value
  problems to building, shipping, and measuring solutions.

  You'll embed with clinical operations, pharmacy, and care
  teams to understand how work gets done, identify the
  highest-leverage opportunities for AI, and build the systems
  yourself. You'll write prompts, orchestration code,
  evaluations, and Python services, partnering closely with
  engineers while remaining hands-on in implementation.

  You'll own a portfolio of opportunities and help decide what
  to build, what to buy, and what to tackle next.

  What You'll Do

  - Embed directly with operators and clinical teams to dissect
    manual workflows and rebuild them with LLMs and agentic
    patterns.
  - Drive build-vs-buy strategy: when to build custom
    orchestration, when to integrate a third-party tool.
  - Write prompts, evaluation suites, and Python code that
    connect AI systems to Ro's products and internal
    operations.
  - Create golden datasets, define evaluation rubrics, and run
    experiments that continuously improve quality and
    reliability.
  - Define success metrics, measure product impact, and use data
    to prioritize future investments.
  - Shape prioritization, sequencing, and technical direction
    across the AI pod.

  Who You Are

  - 5+ years of experience spanning product management, software
    engineering, applied AI, technical program management, or
    a combination of these disciplines.
  - You can write Python and call an API; you don't need to
    architect a backend, but you're not bottlenecked waiting
    for someone who can.
  - You've shipped at least one AI powered feature you can talk
    about in detail,  including the metrics that justified it.
  - You have strong product judgment and are comfortable
    operating with ambiguity, identifying opportunities
    through direct observation rather than waiting for
    detailed requirements.
  - You’re excited about using AI tools to build software
  - You enjoy working directly with users and operators, rapidly
    testing ideas, and iterating based on real-world feedback.
  - Bonus: clinical, healthcare, or other regulated-industry
    experience.

  A note on reporting structure

  This is a new function at Ro, and we're being deliberate
  about not over-defining it. Your manager and where you sit
  on the org chart will depend on the specific shape of the
  team we end up with. We'd rather find the right people and
  figure out the lines around them than pre-draw boxes and
  miss great candidates. If that ambiguity is a deal-breaker,
  this isn't the right role; if it sounds like an opportunity,
  we want to talk.

  -



