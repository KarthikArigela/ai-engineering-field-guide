description: |
  About CONXAI

  CONXAI has built a no-code, agentic AI platform for the
  Architecture, Engineering and Construction (AEC) and
  physical industries, focused on knowledge-automation. We
  automate high-stakes, knowledge-intensive workflows
  traditionally trapped in siloed data, fragmented tools and
  tacit (undocumented) human expertise.

  Our multi-agent systems perform complex reasoning in the
  physical world; and transform bespoke, service-heavy
  processes into scalable Service-as-a-Software automation.

  CONXAI is trusted by some of the leading AEC companies in
  Europe, US, LATAM and Japan.

  Your Role

  Validate non-deterministic AI outputs in deterministic AEC
  workflows In a world of no-code AI and agentic reasoning,
  traditional testing isn't enough. We are looking for a Test
  Automation Engineer to ensure our platform’s reliability is
  bulletproof. You will design and implement a testing
  framework that captures friction in user journeys and
  ensures our knowledge-automation workflows deliver the
  "measurable customer value" we promise.

  What You’ll Do

  - Framework Development: Build and maintain an end-to-end
    automation suite using TypeScript and Cypress
  - Quality Diagnostics: Audit complex user journeys to identify
    where AI outputs might deviate from expected business
    logic
  - Integration Testing: Ensure our platform integrates
    seamlessly with fragmented AEC data tools and third-party
    silos
  - Regression & Scale: Automate repetitive testing tasks to
    allow for rapid feature deployment without compromising
    platform stability
  - Cross-Functional Feedback: Work closely with Product and
    Engineering to translate "silent failures" into actionable
    bug reports and improvements

  Who You Are

  - 5+ years in Test Automation, specifically within a modern
    SaaS environment
  - TypeScript/Cypress Pro: You can write clean, maintainable,
    and highly performant test scripts
  - Attention to Detail: You have a "detective" mindset, capable
    of finding edge cases in non-linear, AI-driven workflows
  - User-Centric: You don't just test code; you test the
    experience to ensure every workflow is intuitive and
    friction-free

  Why CONXAI

  - Edge of Reliability: Architect the automated testing
    framework for real-time agentic AI
  - Systems Autonomy: Drive the end-to-end testing strategy to
    ensure our platform scales and evolves without regression
  - Incentive: Competitive compensation
  - Top-Tier Peer Group: Collaborate with a global team of ML
    engineers and software architects to define the boundaries
    of "done"
