description: |
  Overview

  Microsoft is a company where passionate innovators come to
  collaborate, envision what can be, and take their careers
  further. This is a world of more possibilities, more
  innovation, more openness, and the sky is the limit thinking
  in a cloud-enabled world.

  The CoreAI organization at Microsoft builds the end-to-end
  AI stack and is core to Azure AI innovation and
  differentiation, as well as all of Microsoft’s flagship
  products, from GitHub, to Office, Teams, and Xbox. We are
  the team building Responsible AI, Azure OpenAI, Model as a
  Service, Azure ML, Cognitive Services, and the global Azure
  AI infrastructure for running the largest AI workloads on
  the planet. We do not just value differences or different
  perspectives, we seek them out and invite them in so we can
  tap into the collective power of everyone in the company. As
  a result, our customers are better served. Within CoreAI,
  the Foundry team empowers builders around the world of all
  skill levels to easily create AI apps.

  The Responsible AI group focuses on identifying, measuring,
  mitigating, and monitoring Responsible AI risks in AI-
  generated and human-generated content spanning text, image,
  audio, video, and multimodal content. We are looking for a
  Principal Software Engineer - Responsible AI who is
  passionate about building customer-facing AI services with
  scalable and sustainable architecture and implementation and
  with high performance, low latency, and high availability.
  In this role, you will work with a unique group of talented
  engineers, scientists, and product managers to build the
  industry's best Responsible AI services. You will own the
  design of new AI services and integration with existing
  services such as Azure AI Content Safety, Azure OpenAI
  Service, Azure AI Studio, and more.

  Microsoft’s mission is to empower every person and every
  organization on the planet to achieve more. As employees we
  come together with a growth mindset, innovate to empower
  others, and collaborate to realize our shared goals. Each
  day we build on our values of respect, integrity, and
  accountability to create a culture of inclusion where
  everyone can thrive at work and beyond.  

  In alignment with our Microsoft values, we are committed to
  cultivating an inclusive work environment for all employees
  to positively impact our culture every day.  

  Responsibilities

  - Design, and develop large-scale distributed cloud services
    and solutions with a focus on high availability,
    scalability, robustness, and observability.
  - Lead project development across the organization and work
    with subject matter experts and stakeholders to drive
    development and release plans.
  - Evaluate alternative architectures and technologies that
    best fit the business requirements and service KPIs.
  - Take end-to-end responsibility for the development lifecycle
    and production readiness of the services you build and
    drive the team’s DevOps culture.
  - Drive and uphold the best practices of modern software
    engineering through code and design reviews and take
    effective service decisions based on data and telemetry.
  - Understand Microsoft businesses and collaborate with
    stakeholders towards cohesive, end-to-end experiences for
    Microsoft customers.
  - Embrace a growth mindset and stay up to date with the
    current and state-of-the-art technologies to improve
    customer experience and better serve the product’s
    business needs.

  Qualifications

  Required/Minimum Qualifications: 

  - Bachelor's Degree in Computer Science or related technical
    field AND 6+ years technical engineering experience with
    coding in languages including, but not limited to, C, C++,
    C#, Java, JavaScript, Go, or Python
    - OR equivalent experience

  Other Requirements:

  Ability to meet Microsoft, customer and/or government
  security screening requirements are required for this role.
  These requirements include, but are not limited to the
  following specialized security screenings:

  - Microsoft Cloud Background Check: This position will be
    required to pass the Microsoft Cloud background check upon
    hire/transfer and every two years thereafter.

  Preferred/Additional Qualifications:

  - 6+ years of technical engineering experience designing and
    delivering highly available, large-scale cloud services
    and distributed systems.
  - 4+ years of technical engineering experience with machine
    learning model development, release, and operations.
  - Ability to navigate the company and influence and inspire
    peers in engineering and broad product development.
  - Demonstrate depth of knowledge and understanding of software
    architecture, design tradeoffs, and practices of mature
    DevOps culture.
  - Track record of pursuing and delivering innovative insights
    that translate to value generation.



