description: |
  About CONXAI

  CONXAI has built a no-code, agentic AI platform for the
  Architecture, Engineering and Construction (AEC) and
  physical industries, focused on knowledge-automation. We
  automate high-stakes, knowledge-intensive workflows
  traditionally trapped in siloed data, fragmented tools and
  tacit (undocumented) human expertise.

  Our multi-agent systems perform complex reasoning in the
  physical world; and transform bespoke, service-heavy
  processes into scalable Service-as-a-Software automation.

  CONXAI is trusted by some of the leading AEC companies in
  Europe, US, LATAM and Japan.

  Your Role

  As a Sr. Computer Vision Engineer, you are the architect of
  the models that power the intelligence engine of our
  platform. You don’t just train neural networks; you design
  sophisticated architectures where 2D DNNs, 3D Vision
  algorithms and Agentic AI converge to solve complex, real-
  world problems. You will be responsible for the end-to-end
  development of State-of-the-Art (SOTA) architectures for AEC
  use-cases that deliver superior customer outcomes in high-
  stakes production environments.

  What You’ll Do

  - R&D: Research and design AI architectures that achieve SOTA
    performance on visual scene understanding and multi-agent
    reasoning
  - Bridge Vision & Logic: Build and leverage multi-modal
    knowledge graphs to ground AI agents, ensuring their
    reasoning is domain-specific, use-case relevant, context-
    aware and reliable
  - Optimize for Impact: Transform theoretical SOTA research
    into production-ready models that are optimized for
    latency, cost, and most importantly, value for customers
  - Iterate for Excellence: Lead the research and implementation
    of feedback loops to continuously improve model accuracy
    based on real-world production telemetry

  What We’re Looking For

  - M Tech / PhD in Computer Science or related field from a
    Tier 1 university
  - 5+ years of industry experience, incl. 3+ years in Computer
    Vision and Deep Learning
  - 2+ years of leading Machine Learning (Deep Learning)
    projects
  - 1+ years of leading a team of ML engineers
  - Experience in Agentic AI implementations with RAG,
    Langgraph/LlamaIndex
  - Experience in Natural Language Processing is a plus
  - Exceptional implementation experience in developing new Deep
    Learning models in PyTorch
  - Thorough understanding of software design
  - Previous experience in a fast-paced technology startup
    environment is a plus
  - Fluent and articulate in English

  Why CONXAI

  - Edge of Innovation: Be at the absolute forefront of AI in
    the construction tech space
  - High Autonomy: Contribute to a new paradigm for multi-modal
    scene understanding and reasoning - owning the logic,
    performance, and customer impact
  - Top-Tier Peer Group: Work with a global team of ML
    engineers, software engineers and industry practitioners
  - Equity & Scale: Competitive compensation with significant
    equity upside
