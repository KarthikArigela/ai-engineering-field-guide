description: |
  About Legatics

  Legatics is one of the world's leading LegalTech scale-ups.
  We put users at the heart of our design to provide legal
  transaction experiences that everybody loves, and we're on a
  mission to transform the market for legal services
  worldwide.

  Legatics is a transaction management platform that
  streamlines the way lawyers collaborate and close deals,
  transforming traditional paper and email based processes
  into simple, highly automated software that frees lawyers
  from administrative tasks and improves profitability. Our
  customers include some of the world's top law firms, and
  Legatics has been used on live transactions originating in
  more than 20 countries.

  The role

  You'll build production AI systems that change how our
  commercial teams work. This is a hands-on engineering role:
  you'll design, ship and maintain LLM-powered applications,
  automation and models that solve real problems across Sales,
  Marketing and Customer Success. You'll work close to the
  business, turning messy commercial questions into working
  software.

  What you'll do

  - Design, build and deploy production AI applications (LLM-
    powered tools, agents, automation) that commercial teams
    use daily.
  - Build and maintain ML models for problems like churn risk,
    lead scoring, pipeline and revenue forecasting, and
    expansion signals.
  - Ship fast: prototype, get it in front of users, iterate.
    You'll own features end to end, from data to interface.
  - Integrate systems via APIs so data flows cleanly between our
    CRM, product analytics and data warehouse.
  - Work directly with commercial leaders to find the highest-
    impact problems, then build the tools that solve them.
  - Set sensible practices for responsible AI (evaluation,
    monitoring, bias, explainability) as we scale usage.

  Requirements

  What we need from you

  - 4+ years building and shipping production software, with
    recent hands-on work deploying AI/ML or LLM-powered
    applications. We care about what you've built and run in
    production, not just prototyped.
  - Strong general engineering fundamentals: you write clean,
    maintainable code (Python or similar), work confidently
    with APIs, databases and modern data stacks, and can
    reason about system design.
  - Practical experience building applications on LLMs (OpenAI,
    Anthropic, open-source), including prompt engineering and
    RAG architectures.
  - Experience training, deploying or productionising ML models,
    and measuring whether they actually work.
  - Ability to translate a vague business problem into a
    technical solution and measure its commercial impact.
  - Strong communication: you can present to non-technical
    stakeholders and C-suite, and translate technical work
    into business value.
  - Bias for shipping working solutions over perfect
    architectures.



  Desirable

  - Experience with commercial or CRM data (Salesforce
    especially), or a willingness to own it.
  - Familiarity with fine-tuning, evaluation frameworks or
    causal inference for measuring intervention impact.
  - Experience with BI tools (Tableau, Looker, Power BI,
    QuickSight) and building dashboards.
  - Background in RevOps, commercial analytics or SaaS growth
    analytics.
  - Experience in LegalTech, professional services software or
    complex B2B sales environments.
  - Track record of building internal tools used by non-
    technical teams.



  Bonus points (not essential)

  - Exposure to B2B SaaS, regulated industries or LegalTech.
  - Experience collaborating directly with Product and
    Customers.

  Benefits

  What we offer you

  - Competitive salary (depending on experience)
  - 25 days holiday per year (plus public holidays).
  - Early Finish Fridays - on the last Friday of every month, we
    finish at lunchtime!
  - Pension with NEST.
  - Personal Learning & Development budget.
  - Enhanced parental leave policies so you can spend more time
    with your family.
  - Lots of opportunities for accelerated professional
    development and career progression.
  - Work alongside a supportive and talented team with the
    opportunity to grow one of the world’s leading LegalTech
    scale-ups.
  - A warm, genuinely collaborative culture and an awesome team;
    and
  - Regular socials.

  Power in diversity

  We put users at the heart of our design to provide legal
  transaction experiences that everyone loves. In order to
  make that a reality, we seek to foster a diverse and
  inclusive working environment that can empower our people to
  be creative, effective and innovative, to build a brand we
  are proud of.

  We don’t discriminate against gender, race, religion or
  belief, disability, age, marital status or sexual
  orientation. Whatever your background may be, we welcome
  anyone with talent, drive and emotional intelligence. We're
  committed to building a diverse team, and are constantly
  looking for ways to improve our processes to help us do
  that.
