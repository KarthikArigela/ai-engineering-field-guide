description: |
  About Amigo

  Amigo partners with healthcare organizations to deploy
  robust AI infrastructure that directly serves patients and
  providers. Our agents handle clinical workflows and patient
  engagement across the entire journey: pre-visit intake, care
  navigation, post-visit care plans, patient monitoring, and
  more.

  We're fresh off our Series A backed by Tier 1 investors like
  Madrona, General Catalyst, and Optum Ventures. Our work is
  validated with leading academic medical institutions. Our
  agents have reached 3M+ patient encounters and are on track
  to 10x this year.

  About this role

  Applied AI (Pre-Sale) is how we show a customer what
  production AI can do for their hardest clinical workflow
  before they commit. You take a vague problem, build a
  working prototype or a live demo, and put something real in
  front of them quickly. You partner with account executives
  on technical discovery, scope what we can build, and give
  prospects the confidence to move forward.

  The work is equal parts experimentation and research. Each
  prospect is a question about what's achievable in a clinical
  domain we haven't tackled yet, and you answer it in code.
  You track what new models make possible the week they ship,
  test them against real customer problems, and learn what
  holds up before it reaches a demo.

  The role exists so our delivery engineers can stay focused
  on production deployments while you own the pre-sales
  technical surface. You sit at the intersection of sales and
  engineering: close enough to the product to build on it,
  curious enough to push it into new territory.

  We hire across every level, from new grads to deeply
  experienced engineers, and we work out level together once
  we've met you. What matters is not years on a resume but
  whether you can turn an ambiguous problem into something
  working, fast.

  What you might work on

  - Building rapid POCs and demo environments tailored to
    specific prospect workflows and clinical use cases
  - Running technical discovery with account executives to scope
    what's possible and shape deal architecture
  - Designing and delivering live technical demonstrations that
    turn prospect pain points into working agent experiences
  - Prototyping experimental agent configurations that explore
    new use cases and push the boundaries of what our platform
    can do
  - Researching what new models and techniques make possible,
    testing them against real customer problems, and
    separating what works from what only demos well
  - Running technical deep dives with prospect clinical, IT, and
    operations teams to understand integration requirements
    and workflow constraints
  - Creating reusable demo assets, reference architectures, and
    POC templates that accelerate future sales cycles
  - Turning technical objections into solutions during the sales
    process, from security to compliance to integration
    feasibility
  - Handing won deals cleanly to the delivery team, documenting
    POC learnings and customer expectations
  - Feeding insights from the field back to product and
    engineering: what prospects ask for, what patterns emerge,
    and where the platform should go next

  You may be a fit if

  - You have strong hands-on coding ability and can build a
    working prototype, not just talk about one. Python
    proficiency matters here
  - You have experience with LLMs, prompt engineering, and
    building on AI platforms, or you'll get there fast
  - You have a hacker mentality: fast, scrappy, and energized by
    building things from scratch under time pressure
  - You're genuinely excited by AI experimentation and novel use
    cases, and you follow the space closely
  - You can run a room, present to technical and executive
    audiences, handle objections live, and think on your feet
  - You have strong discovery skills and ask the questions that
    uncover the real problem, not just the stated one
  - You're comfortable with ambiguity. Prospects don't hand you
    clean requirements, and you do your best work when they
    don't
  - You're low ego, direct, and hold yourself to a high bar
  - You can work on site in New York City

  Nice to have

  - Experience in healthcare technology or regulated industries
  - A background moving between engineering and customer-facing
    work in either direction
  - Familiarity with healthcare workflows, EHR systems, or
    clinical terminology
  - Experience building demo environments or sandbox platforms
  - Understanding of healthcare compliance requirements (HIPAA,
    SOC 2)
  - A track record of influencing deal outcomes through
    technical work



  Benefits (available to Full-Time Employees)

  Health & Wellness

  - Comprehensive health, dental, and vision insurance
  - Daily catered lunch and dinner
  - Mental health support and wellness coaching
  - Flexible wellness stipend for fitness, therapy, or personal
    growth

  Growth & Development

  - Annual learning budget for courses, books, or conferences
  - Conference attendance budget for professional development
  - Annual team offsite
  - Academic collaboration opportunities
  - Unlimited PTO

  Our Core Values

  - Patients Win, We WinIf patients aren't getting better care,
    we haven't earned the right to scale. Every internal
    decision gets pressure-tested: does this make patients'
    lives better? If we can't draw the line, we question why
    we're doing it.
  - High Standards, High CareWe hold a high bar for the team
    because patients are counting on us to get this right. But
    high standards only work with genuine investment in each
    other. You can take risks, admit mistakes, and challenge
    ideas—not despite our standards, but because of them.
  - Thoughtful UrgencyWe move fast by default, but speed without
    judgment is recklessness. The discipline is knowing which
    decisions are reversible vs. not. In healthcare AI, the
    companies that win will be fast everywhere they can be and
    careful everywhere they must be. We build the muscle to do
    both.
  - Intensely MeasuredWe instrument patient outcomes, provider
    ROI, system performance, and clinical accuracy. But data
    without action is surveillance. Every metric should have
    an owner, a threshold, and a response plan. If we're
    measuring something but never acting on it, we stop
    measuring it.

  Who Builds With Us

  - Low ego: Politics and territory don't interest you. The best
    ideas win, regardless of who has them.
  - Direct: You say the hard thing, challenge ideas openly, and
    commit fully once decided.
  - High agency: You thrive on trust rather than instruction.
    When you see something is broken, you fix it. You don’t
    file tickets and wait for someone else.
  - Bar of excellence: You hold yourself to a bar most people
    wouldn't, and you want teammates who do the same.
  - Skeptical: You push back on rules that don’t make sense and
    question assumptions that haven’t earned their place.
