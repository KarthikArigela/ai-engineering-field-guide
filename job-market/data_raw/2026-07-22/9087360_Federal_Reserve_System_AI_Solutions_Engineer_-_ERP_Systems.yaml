description: |
  CompanyFederal Reserve Bank of Richmond

  When you join the Federal Reserve—the nation's central
  bank—you’ll play a key role, collaborating with a dynamic
  and diverse team of mission-driven professionals to
  strengthen and protect our economy and our communities.
  Bring your passion and expertise, and we’ll provide the
  opportunities that will challenge you and propel your
  growth—along with a wide range of benefits and perks that
  support your health, wealth, and life. In addition to
  competitive compensation, we offer a comprehensive benefits
  package that includes tuition assistance, generous paid time
  off, top-notch health care benefits, child and family care
  leave, professional development opportunities, a 401(k)
  match, pension, and more. All brought together in a flexible
  work environment where you can truly find balance. Onsite
  presence is required.

  About the Opportunity

  The Enterprise Resources Planning department has an
  immediate opening for an AI Solutions Engineer, reporting to
  Senior Manager - Product Manager.

  The Enterprise Resource Planning (ERP) Support Office seeks
  an AI Solutions Engineer with Cloud experience to bring AI
  innovation across our enterprise while building the
  Platform-as-a-Service (PaaS) foundation that enables it.
  This is a ground-floor opportunity to be a part of driving
  how AI transforms HR, finance, and procurement—while
  establishing the cloud platform capabilities needed to scale
  those solutions.

  You'll begin by deploying and configuring native AI features
  within ERP vendor platforms (intelligent agents, assistants,
  automation), then progressively build the platform
  capabilities needed for custom AI applications, advanced
  integrations, and end-to-end automation solutions that
  connect across the enterprise. Your cloud engineering
  experience will be instrumental in developing deployment
  pipelines and engineering processes as we mature our PaaS
  capabilities.

  This is a fully onsite position located in Richmond, Boston
  and Kansas District location.

  What You Will Do:

  - Translate business and operational challenges into practical
    AI opportunities and technical solutions
  - Deploy and configure AI capabilities in ERP platforms and
    products such as Workday and SAP Ariba (AI agents,
    assistants, automation features)
  - Build custom AI solutions including intelligent agents,
    chatbots and automation leveraging Gen AI and LLMs as
    platform maturity increases
  - Define and document technical specifications for deploying
    ERP and AI solutions and capabilities.
  - Lead AI projects from concept to production, ensuring
    business alignment and measurable ROI
  - Enable PaaS environments within Workday and SAP to support
    AI deployments and future custom development
  - Help develop deployment pipelines and engineering processes
    as we establish PaaS services, bringing your cloud
    engineering expertise
  - Configure and integrate platform services, security, and
    governance with corporate cloud computing services and
    other business systems
  - Assess emerging technologies and recommend adoption
    approaches, contributing to the ERP technology roadmap
  - Evaluate vendor AI capabilities versus custom solutions
    based on requirements and total cost of ownership
  - Champion AI literacy through training, demonstrations, and
    knowledge sharing across the organization
  - Provide production support and knowledge training for
    solutions you deploy

  Qualifications:

  - Bachelor’s degree in Computer Science, Engineering, or
    related field
  - 10+ years in IT/software engineering with hands-on
    experience in corporate/industry environments
  - Proven track record deploying AI solutions to production in
    corporate settings (traditional AI, Gen AI, or agentic AI)
  - 3+ years with enterprise cloud platforms (Workday, SAP,
    Oracle, Salesforce, or similar) in technical or
    configuration capacity
  - Strong communication skills to explain complex or technical
    concepts to non-technical stakeholders, especially with
    regards to AI solutions
  - Experience with deployment pipelines, CI/CD, or DevOps
    practices
  - Hands-on experience deploying AI/ML solutions including
    Machine Learning, Gen AI, LLMs, AI agents, or chatbots to
    production
  - Platform configuration expertise with enterprise SaaS/PaaS
    systems or experience with IaaS environments
  - Integration skills: RESTful APIs, webhooks, data flows,
    authentication (OAuth, SAML)
  - Data management: SQL, data pipelines, data quality
    assessment
  - Programming proficiency in Python

  Preferred Qualifications

  - Hands-on experience with Workday AI, SAP AI capabilities, or
    similar vendor-embedded AI
  - Knowledge or experience with Workday Extend, SAP BTP, or
    similar platforms for custom development
  - Process workflow automation knowledge/experience
  - DevOps/MLOps experience building CI/CD pipelines and
    automation frameworks
  - Cloud platform experience (AWS, Azure, GCP) and AI/ML
    services and frameworks
  - Domain knowledge in HR, finance, or procurement
  - AI/ML or cloud certifications

  Discover the Reason Why So Many People Love It Here!

  When you join the Richmond Fed, not only will you find a
  challenging and purposeful career, you’ll also have access
  to a wide range of benefits and perks that support your
  health and wealth, including:

  - Great medical benefits
  - Pension and 401(k) with employer match
  - Paid time off
  - Tuition reimbursement
  - Paid volunteer leave
  - Onsite amenities that make working here fun!

  Other Requirements and Considerations:

  - Candidates should review the Bank’s Employee Code of Conduct
    to ensure compliance with conflict of interest rules and
    personal investment restrictions.
  - If you need assistance or an accommodation due to a
    disability, please notify rich.recruit@rich.frb.org.
  - Sponsorship is not available for this role. The selected
    candidate will be subject to a government security
    investigation and must meet eligibility requirements for
    access to classified information. Eligibility for this
    specific position requires U.S. Citizenship.
  - The hiring salary range is $133,000 – $183,000 annually.
  - For candidates located outside of Richmond, VA, the listed
    hiring and salary ranges may be adjusted based on your
    geographic location.
  - Salary offered will be based on the job responsibilities and
    the individual’s knowledge, skills, and experience as
    defined in the job qualifications.
  - Applications are reviewed on a rolling basis.
  - Always verify and apply to jobs on Federal Reserve System
    Careers or through verified Federal Reserve Bank social
    media channels.

