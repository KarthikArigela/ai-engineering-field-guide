  apply to Octopus - what's more important to us is finding
  the right octofit!

  • 🎉 Octopus Energy Group is a unique culture. An
  organisation where people learn, decide, and build quicker.
  Where people work with autonomy, alongside a wide range of
  amazing co-owners, on projects that break new ground. We
  want your hard work to be rewarded with perks you actually
  care about! We were recently named the UK's top company to
  work for, and we ranked in the top ten in the Sunday Times
  Best Places to Work 2024. Our Group CEO, Greg has recorded a
  podcast about our culture and how we empower our people.
  We’ve also been placed in the top 10 companies for senior
  leadership

  • 🎁 Visit our UK perks hub - Octopus Employee Benefits

  If this sounds like you then we'd love to hear from you. 🚀

  P.S. Our process usually takes up to 4 weeks, but we’ll
  always do our best to flex around what works for you. Along
  the way, you’ll chat with our recruitment team and your
  Recruiter will help you throughout different stages. Got any
  burning questions before then? Drop us a message at
  talent@octoenergy.com and we’d love to help!

  Are you ready for a career with us? We want to ensure you
  have all the tools and environment you need to unleash your
  potential. Need any specific accommodations? Whether you
  require specific accommodations or have a unique preference,
  let us know, and we'll do what we can to customise your
  interview process for comfort and maximum magic!

  Studies have shown that some groups of people, like women,
  are less likely to apply to a role unless they meet 100% of
  the job requirements. Whoever you are, if you like one of
  our jobs, we encourage you to apply as you might just be the
  candidate we hire. Across Octopus, we're looking for
  genuinely decent people who are honest and empathetic. Our
  people are our strongest asset and the unique skills and
  perspectives people bring to the team are the driving force
  of our success. As an equal opportunity employer, we do not
  discriminate on the basis of any protected attribute. Our
  commitment is to provide equal opportunities, an inclusive
  work environment, and fairness for everyone.
