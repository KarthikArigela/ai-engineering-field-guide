description: |
  About the role

  Octopus was founded with a mission to use technology to
  accelerate us towards a low-carbon future. That’s why we
  created Kraken - our own technology platform from scratch
  which now serves over 70 Million households and is a core
  reason why Octopus is the number one energy supplier in the
  UK. We do it by hiring clever, curious, and self-driven
  people, enabling them with modern tools and infrastructure
  and giving them lots of autonomy.

  We have been using GenAI in live, customer-facing
  environments since 2022, including one system that creates
  tens of thousands of high-quality emails for our Energy
  Specialists, combining our deep knowledge of the energy
  industry and the Octo communication style with customer-
  specific data from Kraken.

  We are now looking for a Senior AI Engineer. You will build
  and scale the systems that allow Octopus teams to use
  Generative AI models (LLMs, RAG, agents). You will be hands-
  on, working with a cross-functional team to build out
  flagship AI projects, and the platforms that enable others
  to succeed with Generative AI.

  You’ll work on developing solutions that genuinely move us
  closer to Net Zero in a company passionate about building
  great technology to change the way customers use energy.
  You’ll have wide open problems to solve, so you’ll need to
  be comfortable with ambiguity, figuring out an approach and
  validating it fast.

  What you’ll do

