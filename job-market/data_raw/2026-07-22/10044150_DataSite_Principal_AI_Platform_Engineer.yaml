description: |
  Datasite and its associated businesses are the global center
  for facilitating economic value creation for companies
  across the globe. From data rooms to AI deal sourcing

  and more. Here you’ll find the finest technological
  pioneers: Datasite, Blueflame AI, Grata, and Sherpany. They
  all, collectively, define the future for business growth.



  Apply for one position or as many as you like. Talent
  doesn’t always just go in one direction or fit in a single
  box. We’re happy to see whatever your superpower is and find
  the best place for it to flourish.



  Get started now, we look forward to meeting you..

  Job Description:

  The Principal AI Platform Engineer covers enterprise-facing
  software development, DevOps, deployment, observability, and
  security. The person is a senior escalation path, and
  reviews code. We use Postgres, Kubernetes, Docker, Argo, and
  GitHub, and ship continuous delivery into zero-downtime
  environments. The role participates in the on-call rotation
  providing 24/7 coverage.

  Duties and Responsibilities

  - Use AI and agent workflows to build and operate the
    platforms the company runs on, including work that
    previously required a larger team.
  - Use AI as the cornerstone of all software development work
    including code creation, test engineering (unit and
    integration), performance tuning and optimization,
    deployment, and functional monitoring.
  - Set standards and review processes for AI-generated code, so
    what ships is safe to deploy.
  - Use infrastructure-as-code to automate provisioning,
    configuration, identity, and recovery for the enterprise
    cloud platform.
  - Build infrastructure to house internal applications and
    production quality datasets.
  - Secure and control access using SSO via Entra permissions,
    groups, and app registrations.
  - Accelerate and facilitate the deployment of the vision of
    SME AI developed applications and workflows.
  - Own resiliency for critical systems. Prevent outages where
    possible and shorten the ones that happen.
  - Work with architects and engineers to build security into
    the delivery pipeline.
  - Act as a senior escalation path. Document the work, review
    code, and cross-train other engineers.
  - Other duties as assigned

  Qualifications

  - Bachelor's degree in IT or related field, or equivalent
    experience
  - Operating production Linux (Ubuntu), Windows, and Mac across
    servers, workstations, and mobile, through scripting and
    automated configuration management
  - Substantial professional experience in planning,
    performance, monitoring, management, and cloud computing
    design
  - Hands-on cloud experience deploying IaaS and/or PaaS systems
    in Azure through automation
  - Working proficiency in several programming and scripting
    languages
  - Working knowledge of CIS security best practices
  - Experience with enterprise networks
  - Experience reducing and eliminating technical debt
  - Business continuity / disaster recovery practices
  - Experience with the following:
    - Intune
    - Cloud networking configuration and management
    - Kubernetes, Docker, and Argo for delivery
    - Azure (NSG, subnets, express routes, firewalls, peering),
      AWS, and GCP
    - Prometheus, Grafana, and Instana for observability
    - Terraform, Bicep, and Ansible for infrastructure-as-code
    - Entra and Sentinel for identity and security
    - GitHub, JIRA, and Confluence for the development workflow
    - JAMF experience a plus

  Work Location & Flexibility

  This position can be located remotely however if the
  candidate is based in our Minneapolis or New York City
  locations the office follows a hybrid work model. Employees
  in these locations are expected to work on-site a minimum of
  two days per week. Please note that specific business units
  or role requirements may necessitate additional in-office
  days based on team collaboration needs or operational
  priorities.

  The base salary range represents the estimated low and high
  end for this position based on a good faith assessment of
  the role and market data at the time of posting. Consistent
  with applicable law, each candidate’s compensation offer may
  vary and will be determined based on but not limited to,
  your geographic region, skills, qualifications, and
  experience along with the requirements of the position. This
  position may be eligible for bonuses, commissions, or
  overtime if applicable. Benefits include health insurance
  (medical, dental, vision), a retirement savings plan, paid
  time off, and other employee benefits. Specific details will
  be provided during the interview process. Datasite reserves
  the right to modify this pay range at any time.

  $117,500.00 - $206,700.00

