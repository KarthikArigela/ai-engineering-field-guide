description: |
  We are a leading global asset management firm with over
  3,000 employees across 20 offices in 15 countries; we help
  millions of investors around the world pursue their
  financial goals.

  We hire critical thinkers. People who thrive in a
  collaborative culture like ours where we solve real problems
  while building the future of finance.

  You

  - Are excited to be part of a vibrant engineering community
    that values diversity, hard work, and continuous learning.
  - Love solving complex real-world business problems.
  - Recognize that cross-functional collaboration is a core
    component of success for the team.
  - Believe there are multiple ways to solve most technical
    problems and are willing to debate the trade-offs.
  - Have become a stronger engineer by making mistakes and
    learning from them.
  - Are a doer, someone who wants to grow their career and gain
    experience across technologies and business functions.

  We

  - Continuously invest in a high-performance and inclusive
    culture, in which a diversity of backgrounds, experiences
    and viewpoints are celebrated and valued.
  - Encourage career mobility, so you can benefit from learning
    different functions and technologies, and we gain the
    benefits of your experience across teams.
  - Run technology pro bono programs that help the non-profit
    community and give our engineering community opportunities
    to volunteer and participate.
  - Offer education reimbursements and ongoing training in
    technology, communication, and diversity & inclusion.
  - Embrace knowledge sharing through lunch-and-learns, demos,
    and technical forums.
  - Consider our people to be our greatest asset—we will help
    you learn what PIMCO Technology has to offer so you can
    participate in activities that benefit your career while
    delivering impactful technology solutions.

  PIMCO is seeking a Senior Forward-Deployed AI Engineer to
  join the Tactical AI Automations team. This role requires
  strong technical depth in AI/LLM tooling combined with
  exceptional communication and stakeholder management skills
  to deploy AI tools across Portfolio Management and
  Analytics, drive adoption, and translate user feedback into
  the roadmap for the PM AI platform. The role also carries
  operational responsibility for supporting Lane Assist and
  POET (PIMCO's portfolio optimization tools) during European
  business hours.

  Project Overview

  PIMCO is scaling the adoption of AI tools — including LLM-
  based assistants, agentic workflows, and internal AI
  platforms — across its investment teams. The Forward-
  Deployed AI Engineer sits at the intersection of users and
  the PM AI platform, with a focus on Portfolio Management and
  Analytics (including Quant and Research): embedding directly
  with these teams, configuring and deploying AI tooling for
  their workflows, teaching effective use, and feeding
  structured requirements back to the platform team to drive
  the PM AI platform roadmap.

  As the senior AI presence in the London office, you will
  also serve as the first line of support for Lane Assist /
  POET (PIMCO's portfolio optimization engine technology)
  during European hours, partnering closely with the US-based
  engineering teams.

  Responsibilities

  AI Deployment, Enablement & Adoption

  - Onboard and configure AI tools (LLM assistants, agentic
    coding tools, retrieval-augmented workflows, internal AI
    platforms) for individuals and teams across Portfolio
    Management and Analytics, including Quant and Research.
  - Deliver hands-on training, office hours, demos, and
    documentation that teach effective and responsible use of
    AI tooling, including prompting practices, workflow
    integration, and limitations.
  - Embed with PM and Analytics teams to understand investment
    and research workflows, identify high-value AI use cases,
    and build proofs of concept that demonstrate impact.
  - Collect, structure, and synthesize user feedback, pain
    points, and feature requests from PM and Analytics users;
    translate them into clear requirements and prioritized
    recommendations for the PM AI platform team.
  - Identify patterns across PM and Analytics teams to surface
    high-impact opportunities, quantify potential impact, and
    drive the PM AI platform roadmap; flag use cases with
    broader applicability to the wider AI organization.
  - Champion responsible AI usage, ensuring deployments adhere
    to firm policies on data security, model governance, and
    compliance.

  European Hours Production Support — Lane Assist / POET

  - Provide first-line support for Lane Assist and the Portfolio
    Optimization Engine Technology (POET) platform during
    European business hours, triaging issues raised by
    Portfolio Managers and other users.
  - Diagnose, resolve, or escalate production issues,
    coordinating handoffs with US-based engineering and
    support teams.
  - Maintain runbooks, support documentation, and known-issue
    logs to improve supportability and reduce time to
    resolution.
  - Build familiarity with POET's data pipelines, optimization
    workflows, and APIs sufficient to investigate issues
    independently.

  Qualifications

  - BS/MS in Computer Science, Mathematics, Engineering, or a
    related quantitative field.
  - 8+ years of experience in software engineering, solutions
    engineering, technical consulting, or related roles,
    including 2+ years of hands-on work with LLMs, AI tooling,
    or ML systems.
  - Strong Python skills and comfort reading, debugging, and
    prototyping production-quality code.
  - Demonstrated experience deploying technology directly with
    end users in a forward-deployed, solutions engineering, or
    customer/field engineering capacity.
  - Excellent communication skills, with a proven ability to
    teach technical concepts to both technical and non-
    technical audiences.
  - Experience gathering and synthesizing requirements across
    multiple stakeholder groups and influencing product or
    platform roadmaps.
  - Familiarity with LLM ecosystems (e.g., prompting, RAG,
    agents, MCP, fine-tuning, evaluation) and major AI
    platforms/APIs.
  - Experience in financial services, asset management, or
    portfolio analytics is a strong plus.
  - Good-to-have: experience with production support or SRE-
    style operations, SQL/Snowflake, data pipelines, or web
    applications.

  Additional Skills

  - Strong ownership mindset with the ability to operate
    independently as the senior AI presence in a regional
    office.
  - High empathy for users and genuine enthusiasm for driving
    adoption and behavioral change.
  - Intellectual curiosity about the rapidly evolving AI
    landscape and discipline to separate durable capabilities
    from hype.
  - Comfortable balancing strategic enablement work with hands-
    on operational support in a fast-paced financial
    environment.

