  Job Description

  Senior AI Automation Developer

  Locations: Hyderabad | Hybrid

  Get To Know Us:

  As a leading financial services and healthcare technology
  company based on revenue, SS&C is headquartered in Windsor,
  Connecticut, and has 27,000+ employees in 35 countries. Some
  20,000 financial services and healthcare organizations, from
  the world's largest companies to small and midmarket firms,
  rely on SS&C for expertise, scale, and technology.

  Why You Will Love It Here!

  - Flexibility: Hybrid Work Model and Business Casual Dress
    Code, including jeans
  - Your Future: Provident Fund
  - Work/Life Balance: Flexible Personal/Vacation Time Off, Sick
    Leave, Paid Holidays
  - Your Wellbeing: Mediclaim, Term Life Insurance, Accidental
    Coverage, Employee Assistance Program, Parental Leave
  - Diversity & Inclusion: Committed to Welcoming, Celebrating
    and Thriving on Diversity
  - Training: Hands-On, Team-Customized, including SS&C
    University
  - Extra Perks: Diwali voucher, Monthly remunerated RnR program

  What You Will Get To Do:

  - Build, optimize, and maintain scalable automation workflows
    using Claude Code and modern AI development tools to
    accelerate software delivery.
  - Develop and deploy autonomous AI agents and skills that
    interact with LLMs via the SS&C AI Gateway, integrating
    them with WHQ Agents and Digital Workers.
  - Design robust automation frameworks for desktop (FlaUI) and
    web (Playwright) applications, moving away from legacy
    application-spying techniques.
  - Design and optimize high-throughput automation architectures
    using Blue Prism v7 Work Queues (Work HQ) for
    transactional data, case locking, and exception handling.
  - Lead the technical design of end-to-end Intelligent
    Automation solutions, incorporating Blue Prism Chorus for
    BPM and GenAI orchestration with human-in-the-loop review.
  - Design, evaluate, and refine prompt structures and system
    instructions to ensure predictable, structured AI model
    outputs.
  - Adhere to GIDS best practices, ensuring automation
    components and GenAI integrations meet enterprise
    security, data privacy, and ethical AI standards.

  What You Will Bring:

  - 3+ years of experience in Python for AI/LLM tooling and
    automation scripting (Playwright, Lang Chain)
  - Experience in Architecting and implementing multi-agent
    systems
  - Strong experience with PostgreSQL / MS SQL.
  - Strong experience in TypeScript for web automation with
    Playwright and API orchestration
  - Experience with RPA, preferably Blue Prism V7 and above
  - Experience integrating cloud AI platforms such as AWS
    Bedrock, Azure OpenAI
  - Understanding of advanced prompting techniques
  - Expert knowledge in processing complex, unstructured data
    using GenAI extraction and advanced OCR tools.
  - Familiarity with vector databases will be an added advantage
  - Experience with C#.NET is a bonus

  We encourage applications from people of all backgrounds to
  enable us to bring diverse perspectives to our thinking and
  conversation. It's important to us that we strive to have a
  workforce that is diverse in the widest sense.

  Thank you for your interest in SS&C! If applicable, to
  further explore this opportunity, please apply directly with
  us through our Careers page on our corporate website @
  www.ssctech.com/careers.

