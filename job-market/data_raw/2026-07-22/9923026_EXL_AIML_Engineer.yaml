  systems. 6. Familiarity with LLM orchestration frameworks.
  7. Solid understanding of software engineering fundamentals.
  8. Proficient with Git and CI/CD practices.

  Qualifications

  1. Bachelors or Masters in Computer Science 2. Experience
  with MLOps for model deployment and monitoring. 3. Knowledge
  of distributed systems and data processing. 4. Contributions
  to open-source projects or strong AI project portfolio. 5.
  Strong communication skills and ability to explain technical
  concepts clearly.
