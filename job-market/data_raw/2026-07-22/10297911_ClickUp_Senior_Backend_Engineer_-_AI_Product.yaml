title: Senior Backend Engineer - AI Product
company: ClickUp
location: USA
work_type: FULL_TIME
description: |
  At ClickUp, we're building the future of work: the first
  truly converged AI workspace unifying tasks, docs, chat,
  calendar, and enterprise search, all supercharged by
  context-driven AI. We are an AI-native company. Every team
  member is expected to leverage AI daily, and we evaluate AI
  fluency as part of our hiring process. Join us and help
  redefine what's possible. 🚀

  ClickUp is building the world's most complete platform for
  work by bringing tasks, docs, chat, search, and AI into one
  connected experience. We're hiring a Senior Backend Engineer
  - AI Product to join the AI Engineering team and build the
  backend services and product features that power ClickUp's
  next-generation AI capabilities.



  This is a backend product engineering role at its core, but
  with one key difference: you'll be building AI-powered
  product experiences directly, not internal tooling or
  abstract platform layers. You'll ship features end-to-end in
  support of an AI team that is deep on coding agents, multi-
  agent orchestration, and production AI systems. We're
  looking for someone who is AI-native (you live in this
  space, you get the patterns, you're excited about what's
  possible) but whose strength is shipping reliable, scalable
  backend product code that delivers real user value.

  Own and ship the backend product work that brings ClickUp's
  AI-driven experiences to life, ensuring the features our
  users interact with are fast, reliable, and well-
  architected.

  What success looks like

  - Ship backend product features that power AI-driven user
    experiences at scale: agent interactions, intelligent
    workflows, and context-aware product capabilities.
  - Build services that are reliable, observable, and tightly
    integrated with the product surface.
  - Partner closely with AI engineers, product managers, and
    designers to translate product vision into production-
    ready backend implementations.
  - Move fast without breaking things: balance iteration speed
    with code quality and system reliability.
  - Help the team make smart tradeoffs between feature velocity,
    system durability, and user experience.

  Key outcomes and responsibilities

  - Design and implement backend APIs, services, and data flows
    that power user-facing AI product features.
  - Own features end-to-end: from technical design through
    implementation, testing, rollout, and production
    monitoring.
  - Build the backend logic for agent-driven product
    experiences: context retrieval, action execution,
    conversation management, and intelligent routing.
  - Work directly with product and design to scope, estimate,
    and deliver features that users interact with daily.
  - Drive reliability and quality: observability, incident
    response, performance tuning, and rollout safety for AI-
    serving product surfaces.
  - Identify product-level bottlenecks and propose pragmatic
    backend solutions that improve the user experience.
  - Contribute to architecture decisions that balance product
    velocity with long-term maintainability.

  Required qualifications

  - 5+ years of backend engineering experience building and
    shipping user-facing product features at meaningful scale.
  - Strong fundamentals in API design, service architecture,
    data modeling, and performance optimization.
  - Experience working directly with or in support of AI/ML
    systems in production (model integration, inference
    pipelines, or agent-driven features).
  - Product-minded: you care about what the user experiences,
    not just what the system does internally.
  - Comfort working in ambiguous, fast-moving environments where
    the AI landscape is shifting constantly.
  - Ability to break down product requirements into clean
    technical implementations and ship them iteratively.
  - AI-native mindset: you're not just adjacent to AI, you're
    genuinely excited about agents, LLMs, and building the
    product experiences that make them useful.

  Preferred qualifications

  - Experience building backend features for agent-based or AI-
    powered product experiences.
  - Familiarity with LLM integration patterns: RAG, function
    calling, tool use, prompt routing, context management.
  - Experience with event-driven or asynchronous architectures.
  - Proficiency in TypeScript/Node.js, Python, or Go.
  - Experience in SaaS, productivity, or developer-platform
    environments.
  - Familiarity with modern AI patterns: vector databases, model
    gateways, inference optimization, orchestration
    frameworks.
  - Background at a startup or high-growth company where you
    shipped product fast and wore multiple hats.

  Location

  - Fully remote

