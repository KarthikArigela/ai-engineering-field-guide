description: |
  Innovative Senior Software ML Engineer with over 8 years of
  experience in developing scalable AI Agentic frameworks, ML
  pipelines, and cloud-native applications. Expertise in
  Python, Langchain/LangGraph, and RAG systems. Proven ability
  to design end-to-end solutions, mentor teams, and drive
  cross-functional collaboration to achieve impactful results



  Job Title: Vice President L1, Senior AI Forward Deployed
  Engineer



  EXL (NASDAQ: EXLS) is seeking a visionary and technically
  adept Vice President (VP) in EXL’s AI Innovation & R&D team
  to spearhead our innovative client-facing initiatives in the
  rapidly evolving fields of Generative and Agentic AI. This
  high-impact, senior consulting role requires a unique blend
  of deep technical expertise in AI solutioning and
  deployment, Fortune 500 client stakeholder management
  skills, and the ability to drive thought leadership. You
  will be instrumental in advising Insurance, Healthcare, and
  Banking clients, designing cutting-edge AI solutions,
  leading complex implementations, and shaping EXL’s strategy
  and market presence in Generative and Agentic AI. You will
  collaborate closely with data science, technology, business
  development, and client teams to identify opportunities,
  architect robust solutions, and deliver transformative
  results.

  Responsibilities



  - Software Engineering: Innovative Senior Software Engineer
    experience in developing scalable AI Agentic frameworks,
    ML modeling pipelines, and cloud-native applications.
    Expertise in Python, Langchain/LangGraph, and RAG systems.
    Proven ability to design end-to-end solutions, mentor
    teams, and drive cross-functional collaboration to achieve
    impactful results



  - AI Architecture Innovation Research & Design: Our mantra is
    Innovation at Speed. Focus on new innovative methods of
    designing and architecting AI and GenAI systems and be
    able to grasp and adapt monthly and weekly AI innovation
    coming out in the industry and apply it to our clients’
    use cases and needs in new modern ways.



  - Client Advisory & Solutioning: Engage directly with senior
    client stakeholders (including C-suite) to understand
    complex business challenges, identify opportunities for
    GenAI and Agentic AI, and define project scope.



  - Domain background: Any domain background in Insurance,
    Trading, Banking, Credit Risk, Healthcare, and Finance.



  - Workshop Facilitation: Design, lead, and facilitate high-
    impact client workshops and strategy sessions focused on
    identifying and prioritizing Generative and Agentic AI use
    cases and roadmap development.



  - Technical Leadership & Architecture: Design, architect, and
    oversee the development and deployment of scalable,
    robust, and cutting-edge Generative AI and sophisticated
    Agentic AI systems (including multi-agent workflows) for
    client and internal projects.



  - Project & Engagement Leadership: Lead large-scale, complex
    Generative AI and Agentic AI projects from strategic
    conception through successful deployment, managing cross-
    functional teams (internal and client-side) and ensuring
    timely delivery of high-quality solutions.



  - Technical Mentorship: Mentor and guide technical teams (data
    scientists, data and AI engineers) in best practices for
    advanced AI development, deployment, MLOps/LLMOps, and
    agentic system design.



  - Stakeholder Management: Build and maintain strong
    relationships with key internal and external stakeholders,
    effectively communicating complex technical concepts and
    project progress.



  - Quality & Best Practices: Ensure adherence to rigorous
    software engineering principles, Agile methodologies, and
    responsible AI practices throughout the solution
    lifecycle.



  - Stay Current: Maintain deep expertise in the latest trends,
    research, tools, and technologies within Generative AI,
    Large Language Models (LLMs), and Agentic AI paradigms.

  Qualifications





  Technical Skills:







  - Combined skills: Python, Langchain, LangGraph, RAG systems,
    AI Agents, Agentic Frameworks, ScikitLearn, Numpy, Pandas,
    Gradient Boost models, Ensembles, Reinforcement Learning,
    LSTMs, Transformers, RlLib, AWS SageMaker, AWS BedRock,
    NLP, ML pipelines, Docker, Kubernetes, Terraform, FastAPI,
    PostgreSQL, ReactJS, Redis, GCP, CI/CD (Jenkins, GitHub
    Actions), Prompt engineering, cross-functional
    collaboration, mentorship, iterative development,
    analytics automation, scalable AI framework







  - Programming & Libraries: Deep proficiency in Python and
    extensive experience with relevant AI/ML/NLP libraries
    (e.g., Hugging Face Transformers, spaCy, NLTK). Experience
    using Cursor, Windsurf, Replit, and Github Copilot.







  - LLM Expertise: Proven experience developing applications
    leveraging state-of-the-art LLMs (e.g., GPT series, Llama
    series, Mistral, Claude) including prompt engineering,
    fine-tuning, and evaluation.







  - GenAI & Agentic Frameworks: Hands-on mastery of core GenAI
    frameworks (e.g., LangChain, LlamaIndex, Langfuse) and
    practical experience with Agentic AI frameworks and
    concepts (e.g., AutoGen, CrewAI, LangGraph, agent
    planning, tool use integration, multi-agent
    collaboration).







  - AI Architecture: Deep understanding of AI/ML system
    architecture patterns, including microservices, event-
    driven architectures, and patterns specific to RAG
    (Retrieval-Augmented Generation), Graph RAG, Agentic RAG,
    and multi-agent systems.







  - Data: Knowledge of industry approaches to data engines and
    data labeling like Scale.ai and Mercor. Experience with
    auto data-labeling and synthetic data generation
    techniques.







  - Vector Databases & Embeddings: Expertise in working with
    various embedding models and vector databases (e.g.,
    Pinecone, Weaviate, Chroma, FAISS).







  - Advanced AI Concepts: Strong grasp of advanced techniques
    such as complex task decomposition for agents, reasoning
    engines, knowledge graphs, autonomous agent design, and
    evaluation methodologies for complex AI systems.







  - Software Engineering: Strong foundation in software
    engineering principles for building scalable,
    maintainable, and production-ready AI systems.







  - Cloud Platforms: Strong working knowledge and practical
    deployment experience on at least one major cloud platform
    (AWS, Azure, GCP), including their AI/ML services.







  - LLMOps/MLOps: Expertise in designing and implementing robust
    MLOps/LLMOps pipelines for automated testing, CI/CD,
    monitoring, and governance of complex AI models and
    applications.












  Leadership & Communication:







  - Proven ability to lead and motivate diverse, global teams







  - Excellent communication skills, capable of explaining
    complex AI concepts to various stakeholders







  - Strong project and program management skills and experience
    working in Agile environments












  Qualifications:







  - Education: Bachelor's degree in computer science, AI,
    Machine Learning, or a related quantitative field.
    Master's or Ph.D. strongly preferred.







  - Experience: Minimum 10 years of experience in AI/ML/Data
    Science, with at least 5 years in significant leadership
    roles involving solution architecture, team management,
    and project delivery.







  - Deployment Success: Demonstrated track record of
    successfully architecting and deploying large-scale AI
    projects, preferably including complex GenAI and/or
    Agentic AI applications in enterprise or client settings.







  - Consulting Background: Prior experience in technology
    consulting or a client-facing technical specialist role
    within a technology provider is highly advantageous.







  - Global Experience: Experience working effectively with
    global teams across multiple geographic locations is a
    plus.












  Additional Considerations:







  We seek a leader who excels at translating cutting-edge
  Generative and Agentic AI capabilities into tangible
  business value for clients and the organization. The ideal
  candidate bridges the gap between advanced AI research and
  practical, robust, scalable, and ethical business
  applications, possessing both deep hands-on technical
  credibility and strategic consulting acumen to architect and
  implement AI solutions at an enterprise scale.












  We Offer:







  - The opportunity to work on pioneering Generative and Agentic
    AI projects with a talented, global team.







  - A platform to influence AI strategy and adoption for major
    clients across various industries.







  - A competitive salary and comprehensive benefits package.







  - A supportive, collaborative, and innovative work
    environment.







  - The chance to be a visible leader and make a significant
    impact on the future of AI application.






  The typical base pay range for this role across the U.S. is
  USD $200,000 - $280,000 per year.







  For more information on benefits and what we offer please
  visit us at https://www.exlservice.com/us-careers-and-
  benefits







  The posted range is the hiring range for this role — a
  subset of the broader range available to employees over time
  — and reflects base salary across our national hiring scale.







  Final offers are based on several factors, including the
  candidate's skills and experience, internal pay equity, work
  location, market conditions for the role, and the specific
  scope and responsibilities of the position.







  The top of the range is reserved for candidates who notably
  exceed the requirements; the lower end applies to those with
  less experience or fewer preferred qualifications. For
  positions based in higher-cost zones (e.g., California, New
  York, New Jersey), actual compensation may exceed the posted
  range; your recruiter will share specifics during the
  process.
