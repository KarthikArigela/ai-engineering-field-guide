title: AI Marketing Automation Engineer
company: Zeely – AI Admaker
location: USA
work_type: FULL_TIME
description: |
  Join us as an AI Marketing Automation Engineer and help us
  build user-facing AI workflows, agents, and product features
  that help marketing teams around the world research, create,
  analyze, and scale advertising campaigns faster.

  Zeely is an AI marketing platform that helps small
  businesses, creators, and marketing teams create UGC videos,
  ad banners, product visuals, and launch effective campaigns
  on Meta and TikTok — without agencies, complex marketing
  tools, or deep performance marketing expertise.

  We are expanding how AI supports the full marketing
  workflow: from creative research and content production to
  campaign launch, performance insights, recommendations, and
  scaling.

  We already have 1.5M+ users in the US, are ranked among the
  Top-1 products in our category on the US market, and
  continue growing more than 4x year-over-year. Our team has
  grown to over 200 specialists. About The Role: We are
  looking for a hands-on AI automation builder who can turn
  complex marketing and creative workflows into scalable user-
  facing product features. You will build AI-powered
  workflows, agents, and integrations inside the Zeely
  platform that help small businesses, creators, and marketing
  teams around the world automate creative research, asset
  preparation, campaign analysis, recommendations, and other
  high-volume advertising workflows. Your Key
  Responsibilities:

  - Analyze how Zeely users research, create, launch, and
    optimize advertising campaigns to identify repetitive
    tasks, bottlenecks, and opportunities for AI automation.
  - Design user-facing AI workflows for creative research, asset
    preparation, campaign analysis, reporting,
    recommendations, and campaign optimization.
  - Build prototypes and MVPs using LLMs, APIs, automation
    platforms, scripts, databases, and product integrations.
  - Work with ad creatives, UGC videos, hooks, scripts, briefs,
    campaign data, performance insights, and public competitor
    research sources.
  - Connect AI models, marketing data, content sources, external
    services, APIs, and product data into scalable workflows
    inside the Zeely platform.
  - Validate automation quality through real user scenarios:
    accuracy, reliability, usefulness, edge cases, clarity,
    and measurable value for marketing teams.
  - Improve workflows based on user feedback, product analytics,
    failed runs, data quality issues, and changing marketing
    needs.
  - Document system logic, prompts, integrations, data flows,
    experiments, and decisions so solutions can be reused,
    improved, and scaled across the product.

  What We Are Looking For:

  - 3+ years of hands-on experience in AI Automation, TechOps,
    Marketing Automation, Growth Operations, Creative
    Operations, Product Automation, or similar roles with a
    strong technical automation focus.
  - Experience working with creative factories, performance
    marketing teams, media buying, adtech products, agencies,
    mobile apps, SaaS products, or content production teams
    where many creatives, campaigns, launches, and experiments
    run at scale.
  - Proven ability to turn manual marketing or creative
    workflows into scalable automation systems — for example:
    creative research, brief generation, asset preparation,
    campaign insights, reporting, recommendations, or workflow
    automation.
  - Strong understanding of how marketing and creative teams
    work: research → brief → creative concept → production →
    launch → performance analysis → iteration.
  - Strong technical foundation: APIs, webhooks, databases, data
    pipelines, automation platforms, AI / LLM tools, and
    Python or JavaScript.
  - Ability to work with messy, undefined product problems:
    understand user needs, clarify requirements, identify
    bottlenecks, design an MVP, and bring it to a usable
    product workflow.
  - Strong product thinking: you care not only that automation
    works technically, but also that it is useful, clear,
    reliable, and easy for real users to adopt.
  - High ownership, structure, and maturity: you can work
    directly with Product, Marketing, Analytics, and
    Engineering teams, make trade-offs, document decisions,
    and move solutions forward independently.
  - Portfolio or case studies are important for us: AI
    automations, agents, user-facing workflows, product
    features, dashboards, creative production systems,
    marketing automation tools, or similar examples. Sanitized
    screenshots, Loom demos, Miro / Notion diagrams, or
    written case studies are fully okay.

  Why It Is Exciting To Work With Us:

  - Work with fast-evolving AI technologies and build practical
    AI-powered tools for real marketing and creative
    workflows.
  - Join a strong, ambitious team where you can take ownership,
    move fast, and see the direct impact of your work.
  - Remote-first cooperation: work from anywhere, with the
    option to visit our hubs in Warsaw and Kyiv.
  - Regular feedback and performance discussions to keep
    expectations, growth, and collaboration transparent.
  - Financial support: consultations for private entrepreneurs
    from our dedicated finance team.

  Recruitment Process: Intro call > Test Task > Final
  Interview > Reference Check > Offer. Send us your CV — we’d
  love to get to know you better!
