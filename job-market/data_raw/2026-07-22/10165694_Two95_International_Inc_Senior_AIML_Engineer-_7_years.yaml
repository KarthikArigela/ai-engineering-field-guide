job_id: 10165694
title: Senior AI/ML Engineer- 7 years
company: Two95 International Inc.
location: Bengaluru, IND
work_type: FULL_TIME
company_size: 158 Employees
description: |
  We are looking for a skilled AI/ML Engineer to design,
  develop, and deploy scalable Artificial Intelligence and
  Machine Learning solutions. The ideal candidate will have
  strong experience in machine learning, deep learning,
  Generative AI, MLOps, and cloud platforms such as AWS or
  Azure. The role involves working closely with Data
  Scientists, Data Engineers, and business stakeholders to
  build innovative AI-driven products and solutions.

  Key Responsibilities:

  - Develop, train, evaluate, and deploy machine learning models
    for various business use cases.
  - Build predictive analytics, recommendation systems,
    forecasting models, and anomaly detection solutions.
  - Design and implement Generative AI applications using Large
    Language Models (LLMs).
  - Develop Retrieval-Augmented Generation (RAG) solutions and
    AI-powered chatbots.
  - Perform data preprocessing, feature engineering, model
    tuning, and performance optimization.
  - Build scalable data pipelines for AI and ML workloads.
  - Deploy and manage machine learning models in production
    environments.
  - Implement MLOps best practices, including model monitoring,
    versioning, and CI/CD automation.
  - Collaborate with cross-functional teams to gather
    requirements and deliver AI solutions.
  - Ensure model reliability, scalability, security, and
    compliance with organizational standards.

  Required Skills:

  - Python, SQL
  - Machine Learning and Deep Learning
  - TensorFlow, PyTorch, Scikit-Learn
  - Generative AI, LLMs, Prompt Engineering
  - LangChain, LlamaIndex, RAG
  - Apache Spark / PySpark
  - Docker, Kubernetes
  - MLflow, Kubeflow
  - AWS or Azure Cloud
  - Git, CI/CD Pipelines

  Preferred Skills:

  - Experience with OpenAI, Llama, Claude, or similar LLMs
  - Vector Databases (Pinecone, ChromaDB, Weaviate, FAISS)
  - MLOps and Model Monitoring
  - Data Engineering and ETL Pipelines
  - AI Governance and Responsible AI

  Qualifications:

  - Bachelor's or Master's degree in Computer Science,
    Artificial Intelligence, Data Science, or related field.
  - 5+ years of experience in AI/ML development and deployment.
  - Experience building and deploying production-grade AI
    solutions.

  Soft Skills:

  - Strong analytical and problem-solving abilities.
  - Excellent communication and stakeholder management skills.
  - Ability to work independently and in a collaborative
    environment.
  - Strong ownership mindset and attention to detail.
