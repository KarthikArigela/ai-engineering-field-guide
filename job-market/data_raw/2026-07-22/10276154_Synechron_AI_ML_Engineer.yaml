description: |
  Must Have

  • Strong proficiency in Python. • Hands-on experience with
  LLMs and prompt engineering. • Expertise in Azure OpenAI
  SDKs, APIs, and deployment strategies. • Knowledge of
  agentic systems and Model Context Protocol (MCP). •
  Familiarity with cloud integration, REST APIs, and
  containerization (Docker/Kubernetes).


  JOB DESCRIPTION Senior Engineer – Enterprise AI Search &
  Retrieval (Azure AI Search, Azure OpenAI, RAG): This role
  requires hands‑on experience building secure, AI search and
  retrieval for large‑scale enterprise document platforms
  using Azure AI Search and Azure OpenAI. 1.      Enterprise
  Document Platform Experience with large‑scale enterprise
  document repositories 2.      AI Search & Retrieval
  Foundations Strong understanding of: a.
  Retrieval‑Augmented Generation (RAG), b.      Vector search
  c.      Experience grounding LLM responses in enterprise
  data sources 3.      Azure AI Search / Cognitive Search a.
  Index design for unstructured enterprise documents Use of
  hybrid search (keyword + vector) c.      Semantic ranking
  and relevance tuning 4.      Azure OpenAI Generative Q&A
  Summarization Embedding generation Experience designing
  prompts that Constrain responses to source documents, Reduce
  hallucinations, Support citation‑based answers 5.
  Backend / Platform Engineering a.      Strong backend
  engineering experience (Java, Python) b.      Experience
  building APIs or services that orchestrate: Search,
  Retrieval, LLM calls c.      Familiarity with cloud‑native
  service design (scalability, resiliency, observability) 6.
  Security & Governance Awareness Experience implementing
  security‑aware retrieval, including Document‑level access
  control, Metadata‑driven filtering of search results b.
  Awareness of compliance considerations (PII, PCI,
  confidential data) c.      LLMs access restrictions for
  unauthorized content. 7.      Observability & Quality a.
  Experience measuring and improving: Retrieval relevance,
  Answer accuracy, Latency across search and generation b.
  Familiarity with logging prompts, citations, and outputs for
  audit and debugging 8.      Enterprise Integration a.
  Experience integrating AI search into Internal applications
  9.       Advanced / Principal‑Level Criteria a.
  Experience designing enterprise RAG platforms b.
  Leading or influencing AI architecture decisions (retrieval
  patterns, security models) c.      Experience with agentic
  or multi‑step retrieval for complex documents d.
  Ability to balance: Accuracy, Explainability, Compliance,
  Cost, Proven ability to mentor other engineers in AI search
  / retrieval patterns

