description: |
  Traba is the AI operating layer for the industrial supply
  chain. We started in workforce—temp staffing, the biggest
  operational pain point for the manufacturing and logistics
  customers we serve—and used it to embed ourselves inside
  their daily operations and create a far better customer
  experience through technology. Now those same customers are
  pulling us beyond staffing into the broader operational
  workflows that run their facilities. That foundation gave us
  proprietary data from millions of shifts and deep enterprise
  relationships. But our edge is more than data: by connecting
  to the systems running across every facility and activating
  the workers already on our platform to execute against them,
  we are building applied AI that drives real productivity
  gains and transforms how the global supply chain operates at
  scale. We are backed by Founders Fund, Khosla Ventures, and
  General Catalyst.

  You'll build Traba's product on top of AI agents—taking
  frontier models and existing agents and putting them to work
  across our staffing marketplace to automate the pipeline
  that sources, vets, matches, and places workers on millions
  of shifts. (Our AI Agents team builds the agent platform;
  you apply it everywhere it creates leverage.) This is a
  product-engineering role first, so you'll go where the
  priorities are: some weeks that's wiring up an agent that
  automates vetting or matching, others it's a payments flow
  or UI work. You'll join the founding team, partner with our
  CTO on the product roadmap, own product decisions, and help
  build our foundational tech platform.

  About You:

  - An applier, not a researcher. You take frontier models and
    existing agents and wire them into real product across the
    stack—you care about shipping reliable automation, not
    owning the orchestration internals. And you don't need
    every task to be an AI task: you take the highest-priority
    problem, model or not.
  - Voracious learner. You explore new languages and frameworks
    happily, and can talk product with a designer one minute
    and infrastructure with a tech lead the next.
  - Strong front-end chops. You have experience with (or a real
    desire to learn) React Native, and you love building
    performant apps users enjoy.

  You Will:

  - Apply existing agents and frontier models across the
    stack—worker app, business app, ops platform,
    marketplace—to automate vetting, matching, and
    fulfillment.
  - Write and review high-quality code across our React Native
    app, React/TypeScript web apps, and Node.js/PostgreSQL
    APIs.
  - Architect core systems—from real-time matching to autonomous
    worker-vetting pipelines powered by ML and agents.
  - Partner with design to ship polished, intuitive UIs.

  You Have:

  - 1+ years with TypeScript, React/React Native, Node.js,
    and/or PostgreSQL.
  - Experience integrating LLMs or agents into real
    product—prompting, tool wiring—or a clear drive to learn.
  - Comfort in an early-stage team: ambiguity, self-direction,
    and fast iteration.

  Benefits:

  - 📈 Start-up equity
  - 💰 Competitive Salary
  - 🩺 100% Paid health, dental & vision coverage
  - 🍽️ Dinner Provided via DoorDash, free DashPass & stocked
    kitchen for NY employees
  - 🚍 Commuter benefit
  - 🏋🏽 Gympass Benefit
  - ✚✚ Additional: One Medical Membership, Gympass, HSA via
    Optum, Talkspace, HealthAdvocate, Teledoc Health

  Salary Range Details

  The compensation range for this position is set between
  $140,000 and $200,000, reflecting our market analysis and
  other relevant considerations. However, exceptions may be
  made for candidates with qualifications that significantly
  differ from those outlined in the job description.

  Equal Opportunity Employer

