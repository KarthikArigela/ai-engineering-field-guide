description: |
  Company Description

  It all started when engineer Fred Luddy wrote code that
  automated a tedious task for his coworker, Phyllis. She
  cried tears of joy. That moment inspired Fred to build a
  company that could do that for everyone—freeing people from
  busywork so they could focus on meaningful work. Today,
  ServiceNow is the AI control tower for business reinvention.
  Our ServiceNow AI platform brings together any AI, any data,
  and any workflow— helping 85% of the Fortune 500® work
  smarter, faster, and better. We're building an AI-native
  culture where technology and talent are unstoppable
  together. And we're just getting started.

  Join us to put AI to work for people.

  Job Description

  About the Role

  As a AI Agent Engineer (AIAE), specializing in strategic
  implementations and partnership initiatives at Moveworks,
  you’ll be responsible for ensuring a successful technical
  delivery of the Moveworks platform for new customers and
  initiatives, working alongside Implementation Managers and
  the broader Partner ecosystem to understand customer
  requirements, perform discovery, and drive all technical
  aspects around our post-sales engagements. You are a
  critical, high-leverage technical individual that operates
  at the intersection of Customer Success, Product Management,
  and Engineering.

  Your primary mission is to translate complex customer
  business process challenges into innovative, high-impact AI
  solutions built on our platform. This role provides full-
  stack ownership of technical success, allowing you to not
  only deploy capabilities in the current product but also
  directly influence the product's evolution by ensuring that
  learnings are folded back into our core platform.

  This is not a back-office engineering role. You will be in
  front of customers regularly and are expected to travel up
  to 25% of the time.

  Core Responsibilities & Impact

  - Customer Technical Relationships: Partner deeply with
    customers throughout the entire delivery lifecycle of AI
    Agents on the Moveworks Platform: Vision-Lock, Solution
    Design/Architecture, Building, Tuning, and launch.
  - Custom Solution Design: Architect, design and consult with
    customers to develop high-impact technical AI solutions on
    the Moveworks platform by helping them leverage AI in
    novel and meaningful ways to solve complex business
    challenges.
  - Integration & Implementation: Design and build secure,
    performant integrations between the Moveworks Platform and
    customer enterprise systems including ServiceNow, Workday,
    Okta, Jira, and others.
  - Strategic Advisory: Serve as a trusted technical advisor,
    helping customers develop their Agentic AI roadmap and
    upskilling their teams to operate the platform
    independently over time.
  - Product Feedback Loop: Synthesize on-the-ground customer
    feedback and technical gaps, working directly with
    Moveworks Engineering and Product teams to influence
    platform evolution.
  - Reusability & Knowledge Sharing: Generalize successful
    customer solutions into reusable templates and share
    learnings broadly across the team.

  About You

  You are a technical generalist who genuinely enjoys working
  directly with customers. You thrive at the intersection of
  engineering, consulting, and customer success — and you're
  equally energized by solving a complex integration problem
  and presenting a solution narrative to a customer's
  executive team.

  - Customer-First Mindset: You have strong communication and
    relationship skills, and you're compelled to develop and
    deliver compelling solution narratives through high-
    quality artifacts — architecture diagrams, solution
    proposals, SOWs — tailored to both technical and business
    audiences.
  - Technical Mastery: You have a strong grasp of API-based
    systems integration, LLM-based systems design including
    prompt engineering, context engineering, and data
    modeling.
  - Curiosity & Adaptability: You are a rapid learner with high
    technical aptitude — equally curious about what's
    happening under the hood and why a business process works
    the way it does.
  - Product Judgment: You have strong product taste and are
    obsessed with delivering exceptional experiences for end
    users.
  - Entrepreneurial Grit: You lean into ambiguity, navigate
    legacy systems with patience, and actively seek exposure
    across engineering, product, and business functions.
  - Accountability: You have a strong sense of personal
    accountability to both customers and internal teammates
    who rely on your expertise.

  Qualifications

  Required:

  - 8+ years of experience in a customer-facing technical role —
    Solutions Engineer, Customer Success Engineer, Solutions
    Architect, Implementation Consultant, or Consulting
    Engineer
  - Demonstrated track record of driving successful technical
    adoption with mid-to-large enterprise customers
  - Experience designing, building, and launching full-stack
    workflows and automations leveraging REST APIs, iPaaS
    tools (Workato, Azure Functions, AWS Lambdas, ServiceNow
    Flow Designer), or scripting languages (Python,
    JavaScript, Golang)
  - Proven ability to determine methods and procedures on new
    assignments independently, exercising strong judgment to
    select the right approaches and drive results across
    complex, cross-functional problems
  - Experience leading projects and coordinating other team
    members, with strong networks across departments and key
    external stakeholders
  - Willingness and ability to travel up to 25% of the time
  - Ability to operate across multiple business functions and
    technical domains

  Preferred:

  - Familiarity with enterprise platforms such as ServiceNow,
    Jira Service Desk, Zendesk, Workday, or Okta
  - Familiarity with Linux and Windows environments and command
    line
  - Current on the latest AI tools, frameworks, and agentic
    design patterns — and thoughtful about how to apply them
    to build reliable, scalable solutions

  FD21

  For positions in this location, we offer a base pay of
  $137,700 - $241,000, plus equity (when applicable),
  variable/incentive compensation and benefits. Sales
  positions generally offer a competitive On Target Earnings
  (OTE) incentive compensation structure. Please note that the
  base pay shown is a guideline, and individual total
  compensation will vary based on factors such as
  qualifications, skill level, competencies, and work
  location. We also offer health plans, including flexible
  spending accounts, a 401(k) Plan with company match, ESPP,
  matching donations, a flexible time away plan and family
  leave programs. Compensation is based on the geographic
  location in which the role is located and is subject to
  change based on work location.

  Additional Information

