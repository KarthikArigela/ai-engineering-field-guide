title: Software Engineer II and Sr. Software Engineer - AI Frameworks
company: Microsoft
location: USA
work_type: FULL_TIME
description: |
  Overview

  Are you looking for opportunities to deliver innovations to
  hundreds of millions of users that impact their daily life?
  Do you want to be part of a fast-cycle, highly competitive,
  and hardcore AI/ML frameworks team with ambitious goals to
  advance AI technology?

  The AI Frameworks team at Microsoft develops software that
  pushes the cutting edge of performance and experience in
  machine learning in production and research. We bridge the
  gap between the latest state-of-the-art AI models and
  hardware eco-systems. We build software to enable running AI
  models everywhere, from the world’s fastest super cloud
  computers, to servers, desktops, mobile phones, IoT devices,
  and internet browsers.  The framework we develop is powering
  AI experience for all major Microsoft products, such as
  Windows, Office, Microsoft 365, Bing, SQL Server, VSCode,
  Cognitive Service, Copilot+ PC, and many others.

  As a Software Engineer on our team, you would have the
  opportunity to work on:

  - ONNX: an open standard format for representing AI models,
    enabling AI developers to work on AI models with a variety
    of frameworks, tools, runtimes, and compilers.

  - ONNX Runtime: ONNX based cross-platform, high performance ML
    inferencing and training accelerator.

  - Foundry Local: an on-device AI inference solution offering
    performance, privacy, customization, and cost advantages.
    It integrates seamlessly into your existing workflows and
    applications through an intuitive CLI, SDK, and REST API.

  We value our team members’ happiness and encourage everyone
  to constantly learn new things and take risks. We
  collaborate closely and openly to accomplish big things
  together while having fun.

  Microsoft’s mission is to empower every person and every
  organization on the planet to achieve more. As employees we
  come together with a growth mindset, innovate to empower
  others, and collaborate to realize our shared goals. Each
  day we build on our values of respect, integrity, and
  accountability to create a culture of inclusion where
  everyone can thrive at work and beyond.

  Employees who live within 50 miles of Redmond, Mountain
  View, Boston, and NYC are expected to be in the office 3
  days a week. Employees who live more than 50 miles from a
  Microsoft hub may work fully remotely.

  Responsibilities

  As a Software Engineer on the team the common tasks of the
  job would include, but not be limited to

  - Design, implement, and test a function or component for our
    AI/ML frameworks and tools

  - Speeding up/reducing complexity of key components/pipelines
    to improve performance and/or efficiency of our systems

  - Interacting and collaborating with our partners both
    internal and external

  - Interacting with and providing tech support for our
    customers/users

  - Embody our Culture and Values

  Qualifications

  Required Qualifications:

  - Bachelor's degree in computer science, or related technical
    discipline AND 2+ years technical engineering experience
    with coding in languages including, but not limited to, C,
    C++, C#, Python OR equivalent experience.

  Other Qualifications:

  Ability to meet Microsoft, customer and/or government
  security screening requirements are required for this role.
  These requirements include, but are not limited to the
  following specialized security screenings:

  - Microsoft Cloud Background Check: This position will be
    required to pass the Microsoft Cloud background check upon
    hire/transfer and every two years thereafter.

  Preferred Qualifications:

  - Bachelor's Degree in Computer Science or related technical
    field AND 4+ years technical engineering experience with
    coding in languages including, but not limited to, C, C++,
    C#, or Python OR equivalent experience.
  - 4+ years of experience in AI frameworks, large scale
    distributed computation, system programming, compiler or
    machine learning (ML).
  - 2+ years of experience building Android applications from
    scratch.
  - Experience working on systems performance optimization.
  - Working with Open-Source code.
  - 4+ years of experience successfully collaborating with cross
    functional teams, owning deliverables and driving results
    to meet business objectives.



