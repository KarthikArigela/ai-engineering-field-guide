  Defense SIEM provides organizations with the first and only
  AI-Reinforced solution built with a cybersecurity mesh
  architecture on a highly scalable data cloud. Enhanced by
  Securonix EON’s AI capabilities, our innovative cloud-native
  solution delivers a seamless CyberOps experience, empowering
  organizations to scale their security operations and keep up
  with evolving threats.



  Recognized as a five-time leader in the Gartner Magic
  Quadrant for SIEM and highly rated on Gartner Peer Insights,
  our award-winning Unified Defense SIEM provides
  organizations with 365 days of ‘hot’ data for rapid search
  and investigation, threat content-as-a-service, proactive
  defense through continuous peer and partner collaboration,
  and a fully integrated Threat Detection, Investigation, and
  Response (TDIR) experience—all within a single platform.
  Built on a cloud-native architecture, the platform leverages
  the Snowflake Data Cloud for unparalleled scalability and
  performance.

  Securonix is proud to be a cybersecurity unicorn and
  featured in CRN's 2024 Security 100 list. Backed by Vista
  Equity Partners, one of the largest private equity firms
  with over $100 billion in assets under management, we have a
  unique advantage in driving innovation and growth. With a
  global footprint, we serve more than 1,000 customers
  worldwide, including 10% of the Fortune 100. Our network of
  150+ partners and Managed Security Service Providers (MSSPs)
  enables us to deliver unmatched security solutions on a
  global scale.



  At Securonix, we are driven by our core values and place our
  people at the heart of everything we do:



  - Winning as One Team: We work together with universal respect
    to achieve aligned outcomes
  - Customer Driven Innovation: We innovate to stay ahead of the
    market and create value for our customers
  - Agility in Action: We embrace change and are unified in our
    purpose and objectives amidst change

  Join us as we redefine cybersecurity, innovate fearlessly,
  and grow together as one team.



  Role Summary:

  We are looking for a full-stack developer who can build
  practical internal tools while also supporting and improving
  the systems that power our GTM organization. This person
  will sit at the intersection of software development,
  revenue systems, and AI automation. They will help build
  lightweight applications, integrations, scripts, workflows,
  and AI-enabled tools that make our Sales, Partnerships,
  Customer Success, and GTM teams faster and more effective.

  This is not a traditional Salesforce administration role. We
  already have Salesforce admin coverage, and this role will
  partner closely with that function. The ideal candidate is a
  builder who can understand business problems, work across
  GTM systems, and create scalable technical solutions using
  modern development practices and AI-assisted workflows.



  What You Bring:

  • Strong full-stack development experience, with the ability
  to build, maintain, and improve internal tools, lightweight
  applications, integrations, scripts, dashboards, and
  workflow automations. Preferred experience in Python &
  Next.js • Hands-on experience working across APIs,
  databases, front-end interfaces, back-end logic,
  authentication, data flows, and third-party SaaS systems. •
  Strong fluency with AI tools and AI-assisted development
  workflows, including tools such as Codex, Claude, ChatGPT,
  GitHub Copilot, or similar platforms. • Experience building
  or implementing AI-driven automations, agents, workflow
  tools, prompt-based applications, LLM API integrations, or
  other AI-enabled productivity solutions. • Experience with
  or willingness to deeply learn GTM and revenue systems,
  including Salesloft, ZoomInfo, RingLead, LinkedIn Sales
  Navigator, Lusha, Orum, PRM/partner portals, and related
  sales technology platforms. • Familiarity with Salesforce
  and how it supports GTM operations; this role partners
  closely with Salesforce administration but does not own
  Salesforce administration. • Ability to translate business
  needs from Sales, Partnerships, Customer Success, and GTM
  leadership into scalable technical solutions. • Automation-
  first mindset with a bias toward simplifying repeatable
  processes, improving data quality, and reducing manual work.
  • Curiosity, ownership, and a practical approach to solving
  business problems with technology. • Ability to work cross-
  functionally with technical and non-technical stakeholders.

  Role Responsibilities:

  • Build, maintain, and improve internal full-stack tools,
  scripts, automations, dashboards, integrations, and workflow
  enhancements that support GTM teams. • Own the technical
  execution of lightweight applications and internal tooling
  that improve seller productivity, operational efficiency,
  and data quality. • Support and optimize core GTM systems
  including Salesloft, ZoomInfo, RingLead, LinkedIn Sales
  Navigator, Lusha, Orum, partner portals/PRM tools, and
  related RevOps platforms. • Partner with Salesforce
  administrators and GTM stakeholders to ensure sales systems,
  workflows, data, and processes operate effectively across
  the revenue technology stack. • Identify process gaps across
  Sales, Partnerships, and GTM operations, then design and
  build practical technical solutions to improve speed,
  accuracy, and adoption. • Use AI tools such as Codex,
  ChatGPT, Claude, and similar platforms to accelerate
  development, analysis, documentation, automation, and
  internal tooling. • Design and implement practical AI-driven
  solutions, including agents, LLM-powered workflows, prompt-
  based tools, API integrations, automation prototypes, and
  AI-assisted operational processes. • Partner with sellers
  and GTM teams to understand pain points and translate them
  into scalable tools, integrations, workflows, and system
  improvements. • Assist with reporting, data hygiene, process
  documentation, testing, enablement, and change management
  for new tools or workflows. • Continuously look for ways to
  automate manual work, improve system reliability, and
  enhance the seller experience.

  Benefits:

  As a full-time employee with Securonix, you will be eligible
  for the following employee benefits:

  - Health Insurance with a total sum insured is INR 7,50,000
  - Coverage: Self, Spouse, 2 kids, Dependent parents, or
    parents-in-law
  - Personal Accident with total sum insured is INR 10,00,000
  - Term Life Insurance with a sum assured for employees is 5
    times fixed base pay is covered.

