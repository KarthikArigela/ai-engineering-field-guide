description: |
  About Us:

  As a Fortune 50 company with more than 400,000 team members
  worldwide, Target is an iconic brand and one of America's
  leading retailers. Target in India operates as a fully
  integrated part of Target’s global team and has more than
  4,000 team members supporting the company’s global strategy
  and operations.

  Tech Overview:

  Every time a guest enters a Target store or browses
  Target.com, they experience the impact of Target’s
  investments in technology and innovation. We’re the
  technologists behind one of the most loved retail brands,
  delivering joy to millions of our guests, team members, and
  communities. Join our global in-house technology team of
  more than 4,000 of engineers, data scientists, architects,
  coaches and product managers striving to make Target the
  most convenient, safe and joyful place to shop. We use agile
  practices and leverage open-source software to adapt and
  build best-in-class technology for our team members and
  guests—and we do so with a focus on diversity and inclusion,
  experimentation and continuous learning.


  Pyramid Overview:


  We create technology solutions for Target at an enterprise
  scale, unlocking value for our team members, guests, and
  suppliers.


  Team Members rely on us to manage $108B+ in revenue, care
  for our team of 450k+ (pay and benefits), enable 3M+
  candidates applying to Target, access to every Target
  facility, and resolve challenges through our service
  centers.

  Guests rely on us every day to quickly and efficiently help
  them with inquiries such as credit card statements, finding
  a product, price match, returns, and much more. We ensure
  guests can leverage their Circle Card to get exclusive
  benefits. Guests and B2B clients also rely on us to buy

  gift cards for that special occasion. Suppliers rely on us
  to assist with financial management, sourcing and
  procurement processes, compliance and risk assessment
  processes, coordinating visits for field engineers,
  providing support for Target+ and Roundel Partners, as well
  as supporting revenue growth to accelerate vendor
  acquisition and onboarding for partners.

  About You:

  - 4-year degree or equivalent experience.
  - 5+ years of software development experience, with at least
    one full-cycle implementation.
  - Strong domain-specific knowledge of Target’s technology
    capabilities, key competitors’ products, and
    differentiating features.
  - Proficiency in Java and Python.
  - Experience with PostgreSQL, OpenSearch/Elasticsearch, and
    object storage platforms such as S3 or similar.
  - Hands-on experience with modern LLM ecosystems, including
    OpenAI, Anthropic, Llama, Gemini, and similar platforms.
  - Experience productionizing Generative AI capabilities.
  - Strong knowledge of emerging Generative AI patterns,
    frameworks, and use cases, including:
    - LangGraph, LangChain, Google GenAI, or similar frameworks.
    - Context engineering, RAG, and Agentic AI.
  - Experience designing scalable and reliable systems with
    strong awareness of performance, cost, and operational
    health.
  - Strong stakeholder communication skills, with the ability to
    lead through influence across teams and partners.
  - Experience building highly scalable distributed systems.
  - Broad and deep expertise in multiple programming languages
    and frameworks, including open-source technologies.
  - Ability to design, develop, and approve end-to-end
    functionality for a product line, platform, or
    infrastructure.

  Nice to Have

  - Exposure the UI development using react and distributed
    event streaming platform like Kafka

