description: |
  About this role

  Are you interested in building innovative technology that
  shapes the financial markets? Do you like working at the
  speed of a startup, but want to solve some of the world’s
  most complex problems? Do you want to work with, and learn
  from, hands-on leaders in technology and finance? At
  BlackRock, we are looking for Software Engineers who like to
  innovate and solve complex problems. We recognize that
  strength comes from diversity, and will embrace your unique
  skills, curiosity, drive, and passion while giving you the
  opportunity to grow technically and as an individual. With
  over USD $14+ trillion of assets we have an exceptional
  responsibility: our technology empowers millions of
  investors to save for retirement, pay for college, buy a
  home, and improve their financial wellbeing. Being a
  developer at BlackRock means you get the best of both
  worlds: working for one of the most advanced financial
  companies and being part of a software development team
  responsible for next generation technology and solutions.
  What is Aladdin and Aladdin Engineering (AE)? You will be
  working on BlackRock's investment operating system Aladdin.
  Aladdin is used both internally and externally by many
  financial institutions. Aladdin combines sophisticated risk
  analytics with comprehensive portfolio management, trading
  and operations tools on a single platform to power informed
  decision-making and create a connective tissue for thousands
  of users investing worldwide. Our development team sits
  inside Aladdin Engineering. We collaboratively build the
  next generation of technology that changes the way
  information, people, and technology intersect for global
  investment firms. We build and package tools that manage
  trillions in assets and supports millions of financial
  instruments. We perform risk calculations and process
  millions of transactions for thousands of users every day
  worldwide! The Analytics and Compliance Engineering team is
  responsible for developing and maintaining tools to ensure
  that organizations using Aladdin® comply at different stages
  of the asset management process. This includes ensuring that
  clients follow guidelines established internally, by
  themselves, and by the market regulators. The system
  accomplishes this through high-throughput rule-based
  compliance engines, which sit at the heart of the investment
  system and process millions of calculations per day. As a
  senior member of the Analytics and Compliance Engineering
  organization, you will lead the transformation of compliance
  technology through Artificial Intelligence, Agentic Systems,
  and Intelligent Automation. You will drive the adoption of
  AI-native engineering practices, leveraging LLMs, AI agents,
  knowledge retrieval systems, and advanced analytics to build
  the next generation of compliance, risk management, and
  regulatory technology platforms.



  What We Are Looking For



  AI-First Innovator

  - Leverage Generative AI, Agentic AI, intelligent automation,
    and predictive analytics to redefine how compliance
    solutions are designed, developed, and operated.
  - Identify high-impact opportunities where AI can improve
    developer productivity, regulatory insight generation,
    operational efficiency, and decision-making.

  Tenacious Problem Solver

  - Thrive in a fast-paced environment solving complex
    regulatory, data, and engineering challenges at global
    scale.
  - Navigate ambiguity and rapidly evolving AI technologies
    while maintaining strong governance and operational
    excellence.

  Strategic & Creative Thinker

  - Evaluate emerging AI technologies, foundation models, agent
    frameworks, RAG architectures, vector databases, and
    distributed systems to determine optimal solutions.
  - Balance innovation, explainability, risk, and compliance
    requirements when deploying AI-powered capabilities.

  Collaborative AI Leader

  - Partner closely with engineering, product management,
    compliance, legal, risk, and business stakeholders to
    deliver AI-enabled outcomes.
  - Foster an AI-learning culture focused on experimentation,
    responsible AI adoption, and continuous improvement.

  Continuous Learner

  - Remain current on advances in Generative AI, AI Agents, LLM
    orchestration, cloud-native AI infrastructure, and machine
    learning techniques.
  - Champion modern AI engineering practices across the
    organization.

  Responsibilities

  - Drive the strategic adoption of AI across compliance
    workflows, regulatory monitoring, reporting, and rule
    management capabilities.
  - Define and execute an AI transformation roadmap aligned with
    business priorities and regulatory requirements.
  - Design highly available, fault-tolerant, cloud-native
    systems capable of supporting AI-driven workloads at
    enterprise scale.
  - Own projects priorities, deadlines and deliverables using
    AGILE methodologies.
  - Significantly contribute to development of Aladdin’s global,
    multi-asset trading platform
  - Provide impact and expertise as a senior individual
    contributor in building various capabilities of the
    compliance system, including developing a next-gen
    compliance rule evaluation engine and compliance violation
    management at scale.
  - Work with product management and business users to define
    the roadmap for the product.
  - Design and develop innovative solutions to complex problems,
    identifying issues and roadblocks.
  - Be a leader with vision and a partner in brainstorming
    solutions for team productivity, efficiency, guiding and
    motivating developers.

  Qualifications

  - Bachelor's or Master's degree in Computer Science,
    Engineering, Mathematics, Data Science, Artificial
    Intelligence, or a related quantitative discipline.
  - Hands-on experience designing and deploying:
    - Generative AI solutions
    - LLM-powered applications
    - Agentic AI workflows
    - RAG architectures
    - Vector search platforms
    - AI orchestration frameworks (LangChain, LangGraph, Semantic
      Kernel)
    - AI observability and evaluation frameworks
    - Knowledge of prompt engineering, context engineering, model
      evaluation, and AI governance practices
  - Over 5 years of hands-on experience in Java.
  - In-depth understanding of concurrent programming and
    designing high throughput, high availability, fault-
    tolerant distributed applications.
  - Expertise in building distributed applications using SQL
    and/or NoSQL technologies such as MSSQL, Flexible JSON
    document data store, Snowflake, or In-memory data stores
    for caching and real-time analytics.
  - Strong interest in distributed systems, infrastructure
    services, cloud technology and AI/ML techniques.
  - Prior experience with message broker technology such as
    Real-time distributed event streaming platform or gRPC.
  - Excellent analytical and software architecture design
    skills, with an emphasis on test-driven development.
  - Strong communication and presentation skills, both written
    and verbal.



  For New York, NY Only the salary range for this position is
  USD$162,000.00 - USD$215,000.00 . Additionally, employees
  are eligible for an annual discretionary bonus, and benefits
  including healthcare, leave benefits, and retirement
  benefits. BlackRock operates a pay-for-performance
  compensation philosophy and your total compensation may vary
  based on role, location, and firm, department and individual
  performance.

  Our benefits To help you stay energized, engaged and
  inspired, we offer a wide range of benefits including a
  strong retirement plan, tuition reimbursement, comprehensive
  healthcare, support for working parents and Flexible Time
  Off (FTO) so you can relax, recharge and be there for the
  people you care about.

  Our hybrid work model

  BlackRock’s hybrid work model is designed to enable a
  culture of collaboration and apprenticeship that enriches
  the experience of our employees, while supporting
  flexibility for all. Employees are currently required to
  work at least 4 days in the office per week, with the
  flexibility to work from home 1 day a week. Some business
  groups may require more time in the office due to their
  roles and responsibilities. We remain focused on increasing
  the impactful moments that arise when we work together in
  person – aligned with our commitment to performance and
  innovation. As a new joiner, you can count on this hybrid
  model to accelerate your learning and onboarding experience
  here at BlackRock.

  Guidance on AI use for candidates

  At BlackRock, AI has long been part of how we work –
  enhancing decision-making, improving operations, and helping
  us deliver better outcomes for clients. We encourage
  candidates to use AI thoughtfully to learn, prepare, and
  work more effectively; but during our interview process, we
  want to focus on getting to know you through your own
  experiences, thinking, and judgment. To support you, we’ve
  provided guidance on when and how to use AI during our
  hiring process so you can approach each step with confidence
  and showcase your best self.

  About BlackRock

  At BlackRock, we are all connected by one mission: to help
  more and more people experience financial well-being.  Our
  clients, and the people they serve, are saving for
  retirement, paying for their children’s educations, buying
  homes and starting businesses. Their investments also help
  to strengthen the global economy: support businesses small
  and large; finance infrastructure projects that connect and
  power cities; and facilitate innovations that drive
  progress.

  This mission would not be possible without our smartest
  investment – the one we make in our employees. It’s why
  we’re dedicated to creating an environment where our
  colleagues feel welcomed, valued and supported with
  networks, benefits and development opportunities to help
  them thrive.

  To learn more about BlackRock, please visit
  Careers.BlackRock.com. We also encourage you to get to know
  us on LinkedIn, Instagram, YouTube, X, and TikTok.

