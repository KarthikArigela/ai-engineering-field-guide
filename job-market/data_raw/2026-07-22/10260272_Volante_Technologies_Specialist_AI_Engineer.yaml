description: |
  About Us

  Volante Technologies is the leading global provider of low-
  code cloud Payments as a Service solution for financial
  businesses. We are disruptors and innovators and we are
  growing fast. For the last three years, we have been the #1
  seller of wholesale payment systems worldwide. At Volante,
  we are all about revolutionizing the world of Payments.

  Role Summary

  We are looking for a passionate AI Engineer to build, test,
  and deploy AI-powered applications and services. The ideal
  candidate should have a strong software engineering
  foundation and a working knowledge of Large Language Models
  (LLMs), Retrieval Augmented Generation (RAG), prompt
  engineering, and cloud-native development.

  What You’ll Do (Key Responsibilities)

  - Develop AI-powered applications using LLMs and Generative AI
    technologies.
  - Build and maintain REST APIs and microservices supporting AI
    workloads.
  - Implement RAG pipelines using vector databases and embedding
    models.
  - Develop prompt templates and evaluate model performance.
  - Integrate OpenAI, Anthropic, Azure OpenAI, or open-source
    models into enterprise applications.
  - Build data ingestion, preprocessing, and indexing pipelines.
  - Participate in model testing, benchmarking, and evaluation.
  - Work closely with product managers, architects, and senior
    AI engineers.
  - Follow software engineering best practices including CI/CD,
    testing, observability, and documentation.
  - Contribute to reusable AI frameworks and accelerators.

  What You Bring (Skills & Qualifications)

  Required Skills:

  - Python (mandatory), Java preferred, SQL
  - LLMs, Prompt Engineering, RAG, Embeddings, Vector Databases
  - LangChain or LlamaIndex, FastAPI, HuggingFace
  - MongoDB, PostgreSQL, Qdrant/Pinecone/Weaviate/Chroma
  - Azure, AWS, or GCP, Docker, Kubernetes, Git

  Preferred Qualifications:

  - Experience building GenAI applications.
  - Knowledge of Agentic AI frameworks.
  - Exposure to MLOps concepts.
  - Open-source contributions are a plus.

  Success Metrics:

  - Quality and reliability of AI services delivered.
  - Model response accuracy and performance.
  - Delivery velocity.
  - Code quality and test coverage.
  - Contribution to reusable AI assets.

  What We Offer

  ✔ Competitive compensation ✔ Health benefits ✔
  Remote/flexible work options ✔ Professional development
  support



  📍 Location Pune/Hyderabad/Chennai



