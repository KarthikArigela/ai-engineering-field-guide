description: |
  We're looking for a Senior AI QA Engineer who doesn't wait
  to be told what to test. You'll own quality across our
  entire Wealth Management experience — from strategy to
  execution, from microservices to the UI your customers
  touch. This isn't a "write test cases and sign off
  acceptance criteria" role. This is a role where you shape
  how quality works, where you push automation into the hands
  of developers, where you challenge the team to shift left,
  and where you hold the bar when the pressure is on.

  You'll be the quality voice in every room you walk into —
  product discussions, architecture reviews, incident
  retrospectives. When something breaks, you're already
  halfway through debugging it. When a new product launches,
  you've already stress-tested it.

  What you can expect to be doing:

  - Own the Quality Strategy. You define and execute the test
    strategy for every new product and feature across the
    Wealth Management business line. You don't inherit a plan
    — you build one, adapt it, and make sure it holds up under
    real-world conditions.
  - Drive Automation Where It Matters. You build and maintain
    automation frameworks for microservices, APIs, and end-to-
    end flows. Your goal is to make your team self-sufficient,
    not dependent on you for every regression pass.
  - Lead Performance Testing. You own performance testing end to
    end — designing load profiles, scripting scenarios,
    analysing results, and working with engineering to fix
    what you find. You treat performance as a first-class
    quality concern, not an afterthought before release.
  - Champion Shift-Left Practices. You embed quality thinking
    early in the development lifecycle. You're in design
    reviews asking "how will we test this?" before a single
    line of code is written. You bring testing closer to
    development and make feedback loops shorter.
  - Monitor, Observe, Debug. You have strong instincts around
    monitoring and observability. You know how to read logs,
    trace requests through distributed systems, and
    independently debug issues without waiting for someone to
    hand you a root cause.
  - Operate Under Pressure. You context-switch across multiple
    projects without dropping the ball. You manage competing
    priorities, communicate tradeoffs clearly, and deliver
    consistently even when the pace is relentless.
  - Influence and Collaborate. You work across product,
    engineering, and stakeholder teams. You're vocal — you
    raise risks early, challenge assumptions constructively,
    and bring people along with you rather than working in
    isolation.

  What we’re looking for:

  - 7+ years in QA, with a track record of owning quality across
    complex, modern systems — not just executing someone
    else's test plan.
  - Deep programming ability. You are extremely strong in at
    least one language. We prefer TypeScript across our stack,
    but if your fundamentals are solid in another language,
    we're confident you'll pick it up fast.
  - Automation expertise for microservices. You've built and
    scaled test automation for distributed, service-oriented
    architectures. You understand contract testing, API
    testing, and how to keep test suites fast and reliable.
  - Performance testing proficiency. You have hands-on
    experience with performance and load testing tools — we
    prefer K6, but equivalent depth with other tools (Gatling,
    Locust, JMeter) works too. You understand how to design
    realistic load models and interpret results meaningfully.
  - CI/CD fluency. You've integrated test automation into CI/CD
    pipelines and understand how to keep builds green and
    feedback fast. Experience with AWS infrastructure is
    strongly preferred.
  - Monitoring and observability know-how. You're comfortable
    with tools like Datadog, Grafana, CloudWatch, or similar —
    and you use them proactively, not just when something is
    already on fire.
  - Strong communication and presence. You participate fully in
    agile ceremonies, product discussions, and cross-team
    conversations. You don't sit quietly when something needs
    to be said.

  Experience with AI & Agentic Systems

  As Chip evolves its product with AI-driven personalisation
  and intelligent automation, we increasingly value QA
  engineers who understand the unique challenges of testing
  non-deterministic systems. Experience in any of the
  following is a strong plus:

  - Testing agentic AI systems, LLM-powered features, or
    recommendation engines where outputs are probabilistic
    rather than fixed.
  - Designing validation strategies for non-deterministic
    behaviour — including output quality scoring, assurance
    testing, guardrail verification, and regression approaches
    that account for acceptable variance.
  - Evaluating AI model outputs for accuracy, safety, bias, and
    hallucination.

  If you haven't worked with AI systems yet but you're
  curious, opinionated, and ready to learn — that matters to
  us too.

  Nice to Have

  - Experience in fintech, wealth management, or regulated
    financial services.
  - Contributions to internal quality guilds, communities of
    practice, or engineering culture initiatives.
  - Experience mentoring junior QA engineers or developers on
    testing best practices.

  What we’re really looking for: ✍️

  Beyond the skills and the experience, we want someone who
  operates with ownership and independence. You don't wait for
  permission to improve something. You see a gap in coverage,
  a flaky test, a missing dashboard — and you fix it. You
  treat the Wealth Management experience line as yours, and
  you hold yourself to the same standard you hold the product
  to.

  You're not a gatekeeper. You're a quality enabler. And you
  make every team you work with better at shipping reliable
  software.

  Interested? We'd love to hear from you. Apply and tell us
  about a time you changed how quality worked on a team — not
  just what you tested, but how you made testing better for
  everyone around you.

  ⏰ Working Hours ⏰

  - Monday to Thursday: 9:00 AM – 6:00 PM
  - Friday: 8:00 AM – 4:00 PM (Start your weekend early!)

  Enjoy a structured yet balanced workweek, with an early
  Friday finish to kickstart your weekend!

  PERKS 🎁

  - £60,000 - £70,000 per annum
  - Discretionary Performance-Related Annual Bonus
  - Workplace pension scheme - We invest in your future with a
    workplace pension scheme, contributing 5% on earnings up
    to £50,000. Plan ahead with confidence while you grow your
    career! 🚀
  - Private medical insurance (medical history disregarded)
  - Employee Assistance Programme
  - Cycle to work scheme
  - Season ticket loan
  - Free ChipX subscription for UK-based employees
  - We are an equal-opportunity employer and value diversity
  - Flexible working arrangements
  - 28 days holiday plus bank holidays, plus the days between
    Christmas and New Year ✈️
  - Annual training budget for courses, workshops, or
    conferences to help you advance your career.
  - £30 per month Chip Fitness Benefit to suit your
    Mental/Physical Wellbeing
  - Company laptop
  - Opportunity to have a huge impact on our product while fast-
    tracking your knowledge, responsibility and skills in a
    high-growth fintech startup 🚀

  Our Interview Process: 📖

  - Video screen with someone from our Talent team
  - Short take-home test
  - Video technical interview with the hiring manager
  - Final interview with Head of AI

   About Chip

  Chip’s mission is to make your life wealthy  We're building
  the wealth super app of the future. An app to build your
  long-term wealth across savings, investments and pensions.
  We use technology to break down barriers so users can invest
  like the ultra-wealthy, giving them one simple place to
  manage, grow and protect their wealth. The Sunday Times
  listed Chip as the 6th fastest growing tech company in
  Britain… and we're not slowing down. Chip serves over
  400,000 active customers and looks after over £6billion in
  assets. These customers trust us to build the most amazing
  product we can, so working at Chip comes with real purpose.
  Chip is being built by a fast-growing team of designers,
  developers, customer service professionals, marketers,
  banking experts, and entrepreneurs. Our funding story though
  is a little different. Chip is one of the most crowd-funded
  businesses in Europe, having raised over £50m from 29,000
  investors, over 9 years. Crowdfunding is in our DNA and only
  Brewdog has more investors than Chip.

  Our vision

  To be the most personal digital wealth manager in the UK

  Who we are

  Chip has a creative and diverse team of 180, from all
  different backgrounds and industries. We’re driven and
  passionate people, but no one takes themselves too
  seriously.

  Don’t just take our word for it. We have a few awards under
  our belt, including Best Personal Finance App at the 2022,
  2024 & 2025 British Bank Awards.

  Our Values

  Be ACCOUNTABLE

  Everything you do matters, Care about the end result,
  Challenge the norm, Disagree, yet commit to making it happen
  once a decision has been made, Do the best job possible

  Be BOLD

  Share our Ambition and do your bit to achieve it, Innovate:
  challenge the norm, break the mould and make it happen, Set
  goals that truly align with our mission, Do your best for
  our customers

  Be COLLABORATIVE

  Work cross-functionally - we win as a team, Build strong
  relationships based on trust, Treat others fairly and
  respectfully, Hold others to account, Be supportive and
  inclusive, Have fun together

  Equal Opportunities

  We are passionate and committed to our people and go beyond
  the rhetoric of diversity and inclusion. You will be working
  in an inclusive environment and be encouraged to bring your
  whole self to work. We will do all that we can to help you
  successfully balance your work and home life. As a growing
  business we will encourage you to develop your professional
  and personal aspirations, enjoy new experiences, and learn
  from the talented people you will be working with. It’s
  talent that matters to us and we encourage applications from
  people irrespective of their gender, race, sexual
  orientation, religion, age, disability status or caring
  responsibilities.

  Note to Agencies

  Chip does not accept unsolicited CVs from recruiters or
  employment agencies in response to any of our live roles on
  our career page. Chip will not consider or agree to payment
  of any referral compensation or recruiter fee relating to
  these unsolicited CVs. Chip explicitly reserves the right to
  hire those candidate(s) without any financial obligation to
  the recruiter or agency. Any unsolicited CVs, including
  those submitted to hiring managers, are deemed to be the
  property of Chip.
