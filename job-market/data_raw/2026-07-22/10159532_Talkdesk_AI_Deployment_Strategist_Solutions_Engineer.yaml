title: AI Deployment Strategist, Solutions Engineer
company: Talkdesk
location: USA
remote: true
work_type: FULL_TIME
description: |
  About the Team & Role:

  We are building the future of customer experience, and our
  AI Pilots team is at the forefront of this 0-to-1 motion.
  This isn’t a role for someone who wants a playbook; this is
  for the builder who wants to write it. We are looking for a
  high-agency individual to join our team as a founding AI
  Deployment Strategist. Your mission will be to act as a
  trusted consultant and AI thought leader for our most
  strategic customers, understand their business from first
  principles, and deploy cutting-edge AI agents that deliver
  undeniable value.

  You will operate at the intersection of strategy, sales,
  consulting, and hands-on engineering. This role requires the
  ability to lead executive-level workshops, design
  transformative AI solutions, and then roll up your sleeves
  to bring them to life. If you thrive in ambiguity, take
  extreme ownership, and are passionate about building what's
  next, this is the team for you.

  What You'll Do:

  - Own the AI Lifecycle: Lead end-to-end customer engagements,
    from initial discovery and strategic scoping to hands-on
    deployment, value realization, and executive readout.
  - Be a Strategic Consultant & Thought Leader: Act as the
    primary technical advisor and consultant for our
    customers. Lead workshops, cut through the industry hype
    to guide their AI strategy, and build trust-based
    relationships with senior stakeholders by connecting
    technical capabilities to tangible business outcomes.
  - Design & Build AI Agents: Dive deep into customer workflows
    to design, build, and iterate on AI agents. While you will
    partner closely with our Forward Deployed Engineering team
    on complex integrations, you are expected to have the
    hands-on ability to configure and deploy agents yourself.
  - Develop the Playbook: You are building our deployment motion
    from the ground up. You will be responsible for creating
    and refining the playbooks, best practices, and processes
    that will scale our AI program.
  - Drive Business Impact: Identify and prioritize high-impact
    use cases that generate clear, decision-ready signals tied
    to business value. Your success is measured by the
    outcomes you deliver for our customers and the growth you
    drive for Talkdesk.
  - Shape the Product: Act as the voice of the customer,
    providing a tight feedback loop to our Product and
    Engineering teams to help shape the future of our AI
    platform.

  What We're Looking For:

  - 3+ years of experience in a customer-facing, technical role
    such as Solutions Engineering, Technical Consulting,
    Customer Success, or Product Management.
  - Consultative AI Expertise: A consultative approach and the
    ability to act as an AI thought leader—educating customers
    on market trends, best practices, and the transformative
    potential of agentic AI.
  - A proven track record of taking ownership over complex,
    ambiguous projects and delivering measurable results in a
    fast-paced environment.
  - Strong technical aptitude with hands-on experience deploying
    AI, automation, or enterprise SaaS solutions. Direct
    experience with AI agents, LLMs, and related frameworks is
    a must.
  - Exceptional communication and presentation skills, with the
    ability to command a room, articulate complex technical
    concepts to both technical and executive audiences, and
    drive alignment.
  - A "seller mindset" with commercial instincts; you are
    comfortable engaging in deal conversations and are
    motivated by driving customer value and expansion.
  - High-agency and a "first principles" approach to problem-
    solving. You can see what needs to be done and have the
    bias for action to do it without being asked.

  Bonus Points:

  - Experience in a high-growth startup environment.
  - Background in product management, conversation design, or a
    forward-deployed engineering role.
  - Familiarity with contact center operations or CRM platforms.

  Pay Range (OTE Pay):   $165,000 - $207,000

  Other Types of Pay: Based on level and role the employee may
  be eligible for long term incentives in the form of equity
  and short term incentives of either bonus or commission.

  Health Insurance: Medical, Dental, Vision, Life and
  Disability Insurance, Employee Assistance Program (EAP).

  Retirement Benefits: 401(k) plan

  Paid Time Off: Talkdesk offers an uncapped paid time off
  program for exempt employees and an accrual-based program
  for non-exempt employees; both are subject to manager
  approval and consistent with business needs.

  Paid Holidays: Talkdesk offers 14 paid holidays each year.

  Paid Sick Leave: Exempt employees have uncapped paid time
  off and non-exempt sick leave follows accrual standards;
  both are subject to manager approval and consistent with
  business needs.

  Method of Application: Apply online.

  Application Window: The application window is expected to
  close at least 5 days from the posting date. The application
  was posted on 07/09/2026.

  Benefits and perks listed above may vary based on the nature
  of your employment with Talkdesk.

  All questions or concerns about this posting should be
  directed to the Talent team at Talent@talkdesk.com.

  Talkdesk is pioneering a new era of Customer Experience
  Automation (CXA), redefining how the world’s most admired
  brands interact with their customers through AI. Our global
  team of courageous innovators is customer-obsessed, building
  AI-first solutions that put empathy, trust, and transparency
  at the center of every interaction. We foster an inclusive
  culture where diverse perspectives drive our success and
  every voice belongs. Combining the stability of a global
  leader with the agility of a disruptor, Talkdeskers are
  empowered with the autonomy to drive meaningful impact,
  while giving back to the communities and environment around
  us.

  Talkdesk has been recognized as a Leader in the Gartner®
  Magic Quadrant™ for Contact Center as a Service (CCaaS) and
  in the G2 Overall Grid® Reports for AI Agents and Contact
  Center. With seven consecutive years on the Forbes Cloud 100
  and multiple AI Breakthrough awards, there has never been a
  more exciting time to join us as we shape the future of
  customer experience automation!

  Work Environment and Physical Requirements:

  Primarily office-environment work, extended periods of
  sitting or standing, computer-based work. Limited lifting,
  and equipment usage limited to computer-related equipment
  (keyboards, mouse, etc.)

  The Talkdesk story hinges on empathy and acceptance. It is
  the shared goal among all Talkdeskers to empower a new kind
  of customer hero through our innovative software solution,
  and we firmly believe that the best path to success for our
  mission is inclusivity, diversity, and genuine acceptance.
  To that end, we will hire, promote, work along, cheer for,
  bond with, and warmly welcome into the Talkdesk family all
  persons without regard to ethnic and racial identity,
  indigenous heritage, national origin, religion, gender,
  gender identity, gender expression, sexual orientation, age,
  disability, marital status, veteran status, genetic
  information, or any other legally protected status.
