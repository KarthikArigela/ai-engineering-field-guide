description: |
  The Applications Development Technology Lead Analyst is a
  senior level position responsible for establishing and
  implementing new or revised application systems and programs
  in coordination with the Technology team. The overall
  objective of this role is to lead applications systems
  analysis and programming activities. Responsibilities:

  - Partner with multiple management teams to ensure appropriate
    integration of functions to meet goals as well as identify
    and define necessary system enhancements to deploy new
    products and process improvements
  - Resolve variety of high impact problems/projects through in-
    depth evaluation of complex business processes, system
    processes, and industry standards
  - Provide expertise in area and advanced knowledge of
    applications programming and ensure application design
    adheres to the overall architecture blueprint
  - Utilize advanced knowledge of system flow and develop
    standards for coding, testing, debugging, and
    implementation
  - Develop comprehensive knowledge of how areas of business,
    such as architecture and infrastructure, integrate to
    accomplish business goals
  - Provide in-depth analysis with interpretive thinking to
    define issues and develop innovative solutions
  - Serve as advisor or coach to mid-level developers and
    analysts, allocating work as necessary
  - Appropriately assess risk when business decisions are made,
    demonstrating particular consideration for the firm's
    reputation and safeguarding Citigroup, its clients and
    assets, by driving compliance with applicable laws, rules
    and regulations, adhering to Policy, applying sound
    ethical judgment regarding personal behavior, conduct and
    business practices, and escalating, managing and reporting
    control issues with transparency.

  Recommended Qualifications:

  - AI Engineer with Python----Experience: At least 10+ years of
    hands-on application development experience.Design,
    develop, and maintain ETL processes to extract, transform,
    and load data from various sources into our data
    warehouse.Write complex SQL queries and PL/SQL scripts to
    perform data manipulation, validation, and
    transformation.Develop and maintain data pipelines using
    Python and related libraries (e.g., Polar
    ,Pandas).Optimize ETL processes and data pipelines for
    performance and scalability.Collaborate with data analysts
    and other stakeholders to understand data requirements and
    develop solutions to meet their needs.Implement data
    quality checks and monitoring to ensure data accuracy and
    consistency.Troubleshoot and resolve data-related
    issues.Create and maintain technical documentation for ETL
    processes, data pipelines, and database solutions.Stay up-
    to-date with the latest trends and technologies in data
    management and analytics.Database Knowledge: Basic
    knowledge of databases such as Oracle/SQL.Scripting: Basic
    knowledge of Python.Problem-Solving: Excellent analytical
    and problem-solving skills.Communication: Strong
    communication and interpersonal skills.Teamwork: Ability
    to work effectively in a team environment.Methodology of
    AI includes Chunking, Embedding, AI Engineering, Prompt
    Engineering  Deep hands-on experience in engineering and
    executing scalable enterprise solutions. Expert-level
    proficiency in Python (e.g., FastAPI, Flask, PySpark) or
    Java (e.g., Spring Boot, Spring Cloud, Spring Security).
    Proficiency in UI (e.g., Angular, React, Node.js,
    TypeScript) for full-stack development. Proficiency in
    database technologies, such as Oracle, Postgres, or
    MongoDB. Solid understanding of core AI concepts,
    including knowledge representation, automated planning,
    decision-making under uncertainty, and multi-agent
    systems. Hands-on experience with relevant frameworks
    (e.g., Google ADK, LanGraph, LangChain, AutoGen, CrewAI,
    N8N). Extensive experience with machine learning
    frameworks (e.g., TensorFlow, PyTorch) and relevant
    libraries (e.g., Scikit-Learn, NumPy, Pandas). Proven
    experience in creating, deploying, and integrating MCPs
    (Model Context Protocol) into agentic AI systems. Deep
    familiarity with large language models (LLMs) such as
    ChatGPT, Claude, Gemini, and Llama, including their
    application within agentic systems. Demonstrated
    experience in designing and implementing robust APIs for
    AI services. Proficient in software development best
    practices, including version control (Git), CI/CD
    pipelines, comprehensive testing, and code reviews. Strong
    understanding of agile methodologies, application
    resiliency, and security principles applied to complex AI
    projects. Proven expertise in system design, application
    development, and ensuring operational stability for AI
    initiatives. Deep experience with application and data
    architecture patterns and designs. Experience leveraging
    managed services and existing platforms, with a strong
    emphasis on API-First Design, microservices, and event-
    driven architectures. Hands-on experience with Docker and
    Openshift.

  Education:

  - Bachelor’s degree/University degree or equivalent experience
  - Master’s degree preferred

