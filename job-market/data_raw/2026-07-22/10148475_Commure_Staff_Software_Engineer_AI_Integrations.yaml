description: |
  At Commure, we're building the AI Operating System for
  healthcare, the foundation that defines how care is
  delivered, documented, and financed. Our platform spans the
  full care journey: Ambient AI and Dictation eliminating
  documentation burden at the point of care, intelligent
  Agents automating patient and revenue workflows, and
  autonomous RCM processing billions in claims, all on a
  single AI-native platform integrated with 60+ EHRs.

  Healthcare carries a $1 trillion administrative burden and
  we're at the center of transforming it. Today, 500,000+
  clinicians across 500+ healthcare organizations nationwide
  trust Commure to handle $25B+ in annual claims and support
  over 200 million patient interactions. Our latest $70M raise
  at a $7B valuation reflects the confidence the market has
  placed in this mission. We've also been named to the Fortune
  Future 50 list and the 2026 AI Breakthrough Awards for
  “Overall NLP Company of the Year.”

  Our team works directly alongside clinicians, not through
  layers of process, which means the gap between what you
  build and its impact on patient care is immediate. We move
  fast, deploy daily, and take full ownership from early
  thinking to production. If you're energized by hard
  problems, high stakes, and a team that holds itself to a
  high bar, you'll find your people here.

  The future of healthcare is being built right now. Come
  deliver this transformation.

  About the Role

  At Commure, the AI Integration Team plays a crucial role in
  supporting the company’s core products, Revenue Cycle
  Management (RCM) and Ambient, by ensuring seamless data flow
  between our platform and over 40 Electronic Medical Records
  (EMRs). This team is responsible for fetching vital
  Encounter and Appointment data from multiple EMRs and, when
  necessary, writing data back to these systems. The team's
  work ensures the interoperability and smooth exchange of
  healthcare data via HL7, enabling healthcare providers to
  deliver more efficient and accurate care while streamlining
  administrative processes. We're looking for a Staff Software
  Engineer who takes ownership end-to-end, moves fast, and
  wants their work to directly impact how care is delivered.

  What You'll Do

  - Design and implement complex integration solutions between
    our platform and third-party healthcare systems (EHRs,
    insurance providers, etc.) while ensuring high
    performance, reliability, and scalability.
  - Utilize the latest developments in LLM technology to
    automate the reverse-engineering of electronic health
    records.
  - Collaborate with cross-functional teams (product,
    engineering, and healthcare) to gather integration
    requirements, define technical approaches, and prioritize
    tasks based on business needs.
  - Contribute to the technical direction of the integration
    platform by proposing and implementing improvements to
    architecture, tools, and technologies.
  - Take ownership of end-to-end integration workflows, from
    design and development through to deployment and post-
    launch monitoring.
  - Identify and resolve performance bottlenecks, troubleshoot
    integration issues, and proactively improve the
    reliability of integrations in production environments.
  - Ensure all integration work adheres to healthcare compliance
    and security standards (e.g., HIPAA, HL7, FHIR) and
    collaborate with security teams to protect sensitive data.
  - Work closely with junior engineers to provide technical
    guidance and mentorship, helping them solve problems and
    ensuring high-quality code standards are followed.
  - Drive the implementation of best practices for integration
    development, including testing, error handling, version
    control, and continuous integration.
  - Collaborate with DevOps and QA teams to implement monitoring
    and alerting systems that ensure integration reliability
    and system health in production.
  - Stay up-to-date with industry trends in healthcare
    technology, integration patterns, and emerging tools,
    continuously suggesting and applying innovations that can
    improve system performance and integration capabilities.
  - Participate in agile development cycles, contributing to
    sprint planning, retrospectives, and maintaining a
    collaborative and efficient working environment

  What You Have

  - [Required] Bachelor’s or Master’s degree in Computer
    Science, Engineering, or a related field, or equivalent
    extensive experience
  - 10+ years of professional software development industry
    experience
  - Proficiency in backend languages like Python, Go, or C++.
  - Proficiency in frontend languages like Javascript, HTML, CSS
  - Experience including but not limited to Git, GCP / AWS,
    Docker, Kubernetes, relational and non-relational DBs, and
    monitoring/alerting tools
  - Proven track record of designing and implementing end-to-end
    solutions and making successful architectural decisions
  - Excellent communication and collaboration skills, with the
    ability to work in a fast-paced, dynamic environment.

  Please be aware that all official communication from us will
  come exclusively from email addresses ending in
  @commure.com. Any emails from other domains are not
  affiliated with our organization.

  Employees will act in accordance with the organization’s
  information security policies, to include but not limited to
  protecting assets from unauthorized access, disclosure,
  modification, destruction or interference nor execute
  particular security processes or activities. Employees will
  report to the information security office any confirmed or
  potential events or other risks to the organization.
  Employees will be required to attest to these requirements
  upon hire and on an annual basis.
