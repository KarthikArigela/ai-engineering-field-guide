description: |
  This role is for one of the Weekday's clients

  Salary range: Rs 100000 - Rs 600000 (ie INR 1-6 LPA)

  Experience: 4+ yrs

  Location: Bengaluru

  Job Type: Full-Time

  We are looking for a Founding AI Engineer to build AI-native
  products that combine modern full-stack engineering with
  advanced Large Language Model (LLM) capabilities. This is a
  high-ownership role for an engineer who enjoys taking ideas
  from concept to production while working across frontend,
  backend, AI workflows, and cloud-native infrastructure.

  The ideal candidate will have strong experience developing
  scalable web applications using Python and modern JavaScript
  frameworks, along with hands-on expertise in integrating
  LLMs, Retrieval-Augmented Generation (RAG), AI agents, and
  workflow automation into production systems. You will play a
  key role in designing AI-powered features, building
  intelligent automation pipelines, and creating reliable,
  user-centric applications that leverage the latest
  advancements in Generative AI.

  This position requires a builder mindset, the ability to
  work independently, and the curiosity to explore emerging AI
  technologies while delivering production-ready software.

  RequirementsKey Responsibilities

  - Design, develop, and own AI-powered product features from
    concept through deployment.
  - Build scalable backend services, REST APIs, authentication
    systems, asynchronous jobs, and data processing pipelines
    using Python frameworks such as FastAPI or Django.
  - Develop responsive, high-performance frontend applications
    using React, Next.js, TypeScript, and modern UI
    frameworks.
  - Integrate Large Language Models (LLMs) into enterprise
    workflows using prompt engineering, structured outputs,
    tool calling, embeddings, and Retrieval-Augmented
    Generation (RAG).
  - Build intelligent AI agent workflows capable of research,
    summarization, information extraction, validation, and
    multi-step task automation.
  - Design and implement research automation pipelines that
    collect, transform, and organize structured and
    unstructured data into actionable insights.
  - Develop reusable APIs and data models that support AI
    workflows, user management, projects, and system
    operations.
  - Integrate third-party services, external APIs, vector
    databases, and enterprise data sources into AI-enabled
    applications.
  - Ensure production readiness through monitoring, logging,
    deployment automation, performance optimization, security,
    and error handling.
  - Collaborate closely with product, design, and business
    stakeholders to translate requirements into scalable
    technical solutions.
  - Utilize AI-assisted development tools responsibly to improve
    engineering productivity while maintaining high standards
    of code quality and maintainability.

  What Makes You a Great Fit

  - 5+ years of experience building production-grade full-stack
    applications.
  - Strong expertise in Python, FastAPI or Django REST, REST
    APIs, asynchronous programming, and backend architecture.
  - Hands-on experience with React, Next.js, TypeScript,
    Tailwind CSS, and modern frontend development.
  - Practical experience integrating LLM APIs such as OpenAI or
    Anthropic into real-world applications.
  - Strong understanding of AI concepts including prompt
    engineering, Retrieval-Augmented Generation (RAG),
    embeddings, structured outputs, tool calling, and AI
    evaluation techniques.
  - Experience building AI agents, workflow automation, or
    intelligent research platforms is highly desirable.
  - Familiarity with PostgreSQL, Redis, vector databases,
    semantic search, and modern data modeling practices.
  - Experience with Docker, cloud platforms, CI/CD pipelines,
    deployment automation, monitoring, and logging.
  - Comfortable using AI-assisted development tools such as
    GitHub Copilot, Claude, Cursor, or ChatGPT to accelerate
    software development.
  - Excellent analytical, communication, and problem-solving
    skills with the ability to work independently in fast-
    paced product environments.
  - Experience in startups, early-stage product development, or
    AI-native platforms will be a strong advantage.
  - Passion for building innovative AI-powered products with a
    focus on scalability, usability, and continuous
    improvement.
