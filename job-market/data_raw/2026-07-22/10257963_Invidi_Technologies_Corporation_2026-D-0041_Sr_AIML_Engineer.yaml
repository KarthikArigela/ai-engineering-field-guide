description: |
  Sr. AI/ML Engineer

  Bangalore, India

  Who we are:

  INVIDI Technologies is the world's leading developer of
  software transforming television all over the world. Our
  two-time Emmy® Award-winning technology is widely deployed
  by cable, satellite, and telco operators. We provide a
  device-agnostic solution delivering ads to the right
  household no matter what program or network you’re watching,
  how you're watching, or whether you’re in front of your TV,
  laptop, cell phone or any other device. INVIDI created the
  multi-billion-dollar addressable television business that
  today is growing rapidly globally.

  INVIDI is right at the heart of the very exciting and fast-
  paced world of commercial television; companies benefiting
  from our software include DirecTV and Dish Network, networks
  such as CBS/Viacom and A&E, advertising agencies such as
  Ogilvy and Publicis, and advertisers such as Chevrolet and
  Verizon.

  INVIDI’s world-class technology solutions are known for
  their flexibility and adaptability. These traits allow
  INVIDI partners to transform their video content delivery
  network, revamping legacy systems without significant
  capital or hardware investments. Our clients count on us to
  provide superior capabilities, excellent service, and ease
  of use.

  The goal of developing a unified video ad tech platform is a
  big one and the right Sr. AI/ML Engineers - like you -
  flourish in INVIDI’s creative, inspiring, and supportive
  culture. It is a demanding, high- energy, and fast-paced
  environment. INVIDI’s testers are self-motivated quick
  studies, can-do individuals who embrace the challenge of
  solving difficult and complex problems.

  About the role:

  We seek highly dedicated, motivated, and passionate Sr.
  AI/ML Engineers who can use the right tools to find the best
  solutions to problems. We embrace the Agile methodology and
  as part of a scrum team you will play an important role in
  all aspects of product development--design, development,
  integration, and testing. And you will share in the pride
  and satisfaction as your work makes it into production at
  INVIDI’s clients.

  As a Sr. AI/ML Engineer to own the computer vision and
  visual search platform that powers our mobile and cloud
  applications. You'll work across the full machine learning
  lifecycle, from data collection and model training to
  production deployment and performance optimization, building
  AI systems that operate reliably in real-world conditions.
  You'll have the opportunity to improve existing models,
  introduce new approaches, and help define the future AI
  architecture of our platform. This is a hands-on engineering
  role where you'll collaborate closely with mobile, backend,
  and product teams to deliver production-grade AI
  experiences.

  Key Responsibilities:

   Build and Improve Production AI Models

  - Design, train, fine-tune, and deploy state-of-the-art
    computer vision models for object detection, image
    understanding, and visual search.
  - Improve model robustness across challenging real-world
    scenarios including varying lighting conditions,
    perspective changes, motion blur, occlusion, compression
    artifacts, and partial captures.
  - Continuously evaluate and iterate on models using production
    feedback and newly collected data.

  Optimize AI for Mobile and Cloud

  - Optimize inference performance for both edge and cloud
    deployments, balancing accuracy, latency, memory usage,
    and operational cost.
  - Improve mobile ML performance across iOS and Android while
    accounting for device constraints such as thermal
    throttling, battery usage, and hardware acceleration.
  - Build scalable cloud inference services capable of
    supporting high-volume production workloads.

  Build a World-Class ML Platform

  - Design reproducible training pipelines, model versioning
    strategies, and automated evaluation workflows.
  - Establish quality gates and validation processes to ensure
    models meet production standards before deployment.
  - Improve CI/CD pipelines, artifact management, and promotion
    workflows across development, staging, and production
    environments.

  Own Data Quality and Evaluation

  - Develop data collection strategies that improve model
    performance and generalization.
  - Create synthetic and augmented datasets to increase
    robustness across diverse operating conditions.
  - Build automated benchmarking and evaluation pipelines with
    measurable performance metrics and regression testing.

  Improve Visual Search and Retrieval

  - Design and optimize image embedding and similarity search
    pipelines.
  - Improve semantic matching, reranking, and retrieval quality
    for image-based search experiences.
  - Evaluate new architectures and techniques that enhance
    accuracy and user experience.

  Collaborate Across Engineering Teams

  - Work closely with mobile and backend engineers to integrate
    AI models into production applications.
  - Debug end-to-end ML systems, from training pipelines and
    inference services to client-side image preprocessing and
    post-processing.
  - Contribute to technical architecture decisions and establish
    best practices for scalable AI development.

  Drive Innovation

  - Evaluate emerging AI technologies and identify opportunities
    to improve existing capabilities.
  - Prototype new features in computer vision, multimodal AI,
    recommendation systems, and conversational AI.
  - Help shape the long-term AI strategy and technical roadmap.

  Skills & Qualifications:

  - 5+ years of experience building and deploying production
    machine learning systems.
  - Strong expertise in computer vision, including object
    detection, image understanding, and visual embeddings.
  - Experience training, fine-tuning, evaluating, and deploying
    deep learning models using real-world datasets.
  - Hands-on experience with modern deep learning frameworks
    such as PyTorch or TensorFlow.
  - Experience optimizing models for both cloud and edge/mobile
    deployment.
  - Strong understanding of vector search, similarity retrieval,
    and embedding-based systems.
  - Experience building scalable ML pipelines, model evaluation
    frameworks, and production inference services.
  - Excellent Python development skills and the ability to work
    across multiple parts of the technology stack.
  - Strong experience with AWS cloud services, including
    designing and deploying ML solutions using SageMaker,
    Lambda, S3 and related services.

  It would be very good if you have experience in:

  - Experience with MLOps, model registries, automated training
    pipelines, and CI/CD for machine learning.
  - Experience deploying AI applications on AWS or similar cloud
    platforms.
  - Familiarity with mobile machine learning frameworks and
    optimization techniques.
  - Background in content recognition, recommendation systems,
    visual search, AdTech, media, or consumer applications.
  - Experience with Infrastructure as Code (Terraform or
    similar).

  Physical requirements:

  - INVIDI is a conscious, clean, well-organized, and supportive
    office.

  - Prolonged periods of sitting at a desk and working on a
    computer are normal.

  Note:

  - Candidate must be legally authorized to work in India.

  - Final candidates must successfully pass INVIDI’s background
    screening requirements.

