  .NET Full Stack GenAI Engineer

  Location:

  Chennai, Tamil Nadu; Coimbatore, Tamil Nadu; Kochi, Kerala

  Project Overview:

  We are seeking a skilled Full Stack Gen AI Engineer to join
  our team, focusing on the innovative development and
  integration of generative AI solutions. Leveraging expertise
  in AI frameworks, full-stack development, and cloud
  platforms, this role will contribute to the creation of
  cutting-edge applications in a dynamic and fast-paced
  environment.

  Key Responsibilities:

  - Design, develop, and maintain scalable full-stack
    applications using .NET technologies, React, and Angular.
  - Develop and integrate AI and natural language processing
    (NLP) solutions using Azure Open AI, AWS Bedrock, and
    Semantic Kernel.
  - Implement and optimize APIs, including .NET Web API, REST
    API, and FastAPI, for seamless backend/frontend
    communication.
  - Leverage advanced frameworks like RAG and langchain for
    generative AI solutions, applying prompt engineering
    techniques to build innovative applications.
  - Implement and manage CI/CD pipelines using Azure DevOps and
    ensure robust application security and containerization
    with Docker.
  - Collaborate with cross-functional teams to deploy and manage
    AI solutions on cloud platforms such as Microsoft Azure
    AI.
  - Ensure the code quality, maintainability, and scalability of
    deliverables while adapting to new project requirements in
    a fast-paced setting.

  Required Skills and Experience:

  - Mandatory:Expertise in .NET technologies including .NET 8,
    ASP.Net Core, and Entity Framework Core.
  - Front-end development skills using React, Angular, and
    Blazor.
  - Proficiency in AI platforms like Azure Open AI and AWS
    Bedrock, as well as tools like Semantic Kernel and
    langchain.
  - Experience with Microsoft SQL Server, Python, C#, and prompt
    engineering for AI applications.
  - Familiarity with REST API, FastAPI, Git, Docker, Azure
    DevOps, and CI/CD practices.
  - Strong knowledge of application security in modern
    development environments.
  - 5-8 years of relevant experience required.

