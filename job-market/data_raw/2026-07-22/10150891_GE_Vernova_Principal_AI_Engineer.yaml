description: |
  Job Description SummaryAs a Principal AI Software Engineer,
  you will drive technical vision and architect enterprise AI
  applications for multiple initiatives across the company.
  You will designs, program, document, test, and fixes bugs
  involved in creating and maintaining AI applications and
  frameworks. You’ll integrate LLMs, agent workflows, NLP,
  computer vision, and predictive analytics to build secure,
  high-availability and cost-efficient AI based solutions.
  You’ll partner with product, data science, and engineering
  leaders, mentor teams, and raise standards in Agile,
  testing, security, and documentation. We support growth,
  autonomy, and collaboration across research and product.

  Job Description

  Roles and Responsibilities

  - Design, build, deliver and maintain AI software applications
    & services. Working in the areas of AI, cloud, platforms
    and/or application. Responsible for full software
    lifecycle including activities such as requirement
    analysis, documentation/procedures, implementation, and
    bug fixing.
  - Establish AI architecture and technical vision across
    products.
  - Lead cross-team initiatives with product and data science.
  - Design RAG and agent workflows; optimize LLM integrations.
  - Build multi-tenant, high-availability systems with
    observability.
  - Establish AI cost management, monitoring, and security
    standards
  - Stay informed of AI industry trends and guide teams to
    upskill on best practices.
  - Communicate strategy and direction of AI application
    delivery to relevant stakeholders.
  - Lead functional teams or projects with minimal resource
    requirements, risk, and/or complexity. Communicates
    difficult concepts and influence others' options on
    particular topics. Guide others to consider a different
    point of view.

  Required Qualifications

  - Bachelor’s degree in Computer Science, Computer Engineering,
    or related technical field.
  - 10+ years of programming experience in a relevant language
    using modern front-end frameworks (React, Vue, or Angular)
    and multiple backend languages (Python preferred, Java,
    Node.js or Go).
  - Proven track record designing and shipping production
    applications that incorporate LLMs or AI services at
    scale.
  - Experience with vector databases (e.g. Milvus, Pinecone,
    Weaviate, pgvector) and advanced embedding model
    optimization in production applications.
  - Expertise with multiple LLM providers and advanced AI
    orchestration frameworks (LangChain, LlamaIndex, custom
    frameworks).
  - Extensive experience leading technical teams, driving cross-
    team initiatives, and providing technical mentorship.
  - Expert-level experience with cloud platforms (AWS, GCP, or
    Azure) and advanced containerization (EKS).
  - Strong oral and written communication skills. Strong
    interpersonal and leadership skills. Demonstrated ability
    to analyze and resolve problems. Demonstrated ability to
    lead programs / projects. Ability to document, plan,
    market, and execute programs.

  Desired Characteristics

  - 15+ years of full software development lifecycle experience,
    including architecture design, technical leadership, and
    large-scale system optimization.
  - Advanced understanding of enterprise RAG architectures,
    semantic search optimization, and conversation memory
    management at massive scale.
  - Experience with multi-modal AI integration, model fine-
    tuning, and deployment of custom AI models.
  - Experience with AI observability tools, cost optimization
    strategies, and performance monitoring at enterprise
    scale.
  - Experience with cross-organizational collaboration and
    influencing other teams’ directions and road maps.
  - Experience with technical strategy development and
    technology roadmap planning.

  Additional Information

  Relocation Assistance Provided: Yes
