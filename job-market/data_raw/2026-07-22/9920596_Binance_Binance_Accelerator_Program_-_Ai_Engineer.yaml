description: |
  Binance is a leading global blockchain ecosystem behind the
  world’s largest cryptocurrency exchange by trading volume
  and registered users. Binance is trusted by more than 320
  million people in 100+ countries for its industry-leading
  security, transparency, trading engine speed, protections
  for investors, and unmatched portfolio of digital asset
  products and offerings from trading and finance to
  education, research, social good, payments, institutional
  services, and Web3 features. Binance is devoted to building
  an inclusive crypto ecosystem to increase the freedom of
  money and financial access for people around the world with
  crypto as the fundamental means.



  About Binance Accelerator Program

  Binance Accelerator Program (BAP) is a 3-6 month internship
  program designed for Early Career talent to have firsthand
  experience in the rapidly expanding digital assets space.
  You will be given the opportunity to develop your skills at
  Binance and understand what it’s like to work at the world's
  leading blockchain ecosystem. As part of your internship in
  the BAP, there will also be opportunities for networking and
  development, which will expand your professional network and
  build transferable skills to propel you forward in your
  career. Learn about the BAP Program HERE.



  Who may apply

  Current university students and recent graduates.

  *Terms of employment / engagement shall be subject to
  contract and local applicable laws



  Responsibility

  - Contribute to backend and/or full-stack feature development,
    testing, and release for core products/platforms,
    delivering production-ready code.
  - Collaborate with senior engineers on module design,
    API/interface definition, system integration, and
    deployment (including logging, monitoring, and performance
    optimization).
  - Write and maintain automated tests and CI/CD-related
    configurations to improve development efficiency and code
    quality.
  - Support the engineering deployment of AI/LLM capabilities
    based on business needs, such as integrating LLM APIs,
    building basic RAG pipelines, and embedding tool/agent
    capabilities into existing systems.
  - Help build and maintain datasets and benchmarks for
    evaluation/regression, track online performance, and
    assist with debugging and fixing issues.
  - Produce necessary technical documentation and communicate
    effectively across teams.

  Requirements

  - Currently pursuing a Bachelor’s or Master’s degree in
    Computer Science, Software Engineering, Artificial
    Intelligence, or a related field.
  - Solid software engineering fundamentals: data structures and
    algorithms, object-oriented design, common design
    patterns, and coding best practices.
  - Proficient in at least one primary programming language for
    engineering work; Python is required. Experience with
    Java/Go/TypeScript/JavaScript is a plus.
  - Familiar with common engineering tools and workflows: Git,
    basic Linux, debugging skills; understanding of
    unit/integration testing, RESTful APIs, and databases
    (SQL/NoSQL).
  - Some AI/LLM project or internship experience is sufficient
    (no deep research required), e.g., prompt
    engineering/function calling, RAG, vector databases, or
    experience integrating frameworks like LangChain/LangGraph
    is a plus.
  - Strong ownership, good communication and collaboration
    skills, and the ability to learn quickly and deliver.
  - Able to commit to at least 6 months, 5 days per week.

  Nice to Have

  - Experience shipping web/backend services; knowledge of
    caching, message queues, concurrency, and performance
    tuning.
  - Familiarity with containerization and deployment
    (Docker/Kubernetes), cloud platforms (AWS/GCP/Azure), or
    observability (Prometheus/Grafana/ELK).
  - Exposure to LLM evaluation, prompt iteration, data feedback
    loops, or basic fine-tuning workflows.

  Why Binance

  • Shape the future with the world’s leading blockchain
  ecosystem

  • Collaborate with world-class talent in a user-centric
  global organization with a flat structure

  • Tackle unique, fast-paced projects with autonomy in an
  innovative environment

  • Thrive in a results-driven workplace with opportunities
  for career growth and continuous learning

  • Competitive salary and company benefits

  • Work-from-home arrangement (the arrangement may vary
  depending on the work nature of the business team)



  Binance is committed to being an equal opportunity employer.
  We believe that having a diverse workforce is fundamental to
  our success.

  By submitting a job application, you confirm that you have
  read and agree to our Candidate Privacy Notice.
