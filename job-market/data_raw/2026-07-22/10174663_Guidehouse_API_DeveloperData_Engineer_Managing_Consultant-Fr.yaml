description: |
  Job Family:

  Technology Consulting

  Travel Required:

  Up to 50%

  Clearance Required:

  Ability to Obtain Public Trust

  What You Will Do:

  The API Developer/Data Engineering Managing (Lead)
  Consultant serves as a trusted advisor and delivery lead for
  AI and Data engagements. This role owns solution strategy,
  oversees delivery teams, develops technical solutions, and
  partners with clients to drive measurable business outcomes.

  Key Responsibilities

  - Lead the design, development, and deployment of data
    integration and API solutions within related data
    platforms.
  - Architect and implement end-to-end data pipelines, including
    ingestion, transformation, validation, and delivery of
    structured and unstructured data.
  - Develop and maintain ontology models, data schemas, and
    relationships to support analytics, search, and
    operational use cases.
  - Integrate data across multiple systems and platforms (e.g.,
    cloud storage, APIs, analytics environments) using
    scalable and secure patterns.
  - Collaborate with cross-functional teams (data engineering,
    analytics, product, and security) to ensure seamless
    system interoperability and data consistency.
  - Implement data validation, quality assurance, and governance
    processes (e.g., completeness checks, schema validation,
    metadata integrity).
  - Support development of AI-enabled capabilities (e.g.,
    semantic search, entity resolution, analytics) by enabling
    high-quality, well-structured data pipelines.
  - Operate within an Agile delivery model, contributing to
    sprint planning, backlog refinement, user story
    development, and iterative delivery of technical
    solutions.
  - Translate business and mission needs into technical
    requirements and scalable integration designs.
  - Ensure compliance with security, privacy, and audit
    requirements, including role-based access controls,
    logging, and data protection standards.
  - Drive technical design decisions, mentor junior engineers,
    and act as a technical lead within a matrixed team
    environment.

  What You Will Need:

  - Bachelor’s degree in Computer Science, Engineering,
    Information Systems, or related field (or equivalent
    experience).
  - Based on our contractual obligations, candidate must be
    located within the United States and a US Citizen.
  - Must be able to OBTAIN and MAINTAIN a Federal or DoD "PUBLIC
    TRUST" clearance.
  - 5+ years of experience in data engineering, system
    integration, or platform engineering roles.
  - Proficiency in Python, Java/JS, .NET (C#), RESTful API, XML,
    and strong SQL skills (including SQL Server) with
    experience integrating APIs with enterprise applications,
    databases, and third-party systems.
  - Proficiency in Java/JS, .NET (C#), RESTful API, XML for data
    transformation, querying, and API development.
  - Proficiency working with various data structure formats
    (CSV/TXT, JSON, XML, Parquet, etc.).
  - Strong hands-on experience with API development and
    integration, including:- Building and managing data
    pipelines- Ontology/data model development and
    relationship mapping- Integration of data across multiple
    systems
  - Experience working within cloud platforms (particularly GCP)
    for scalable data transformation, enrichment, and
    analytics workflows.
  - Strong understanding of data modeling, schema alignment, and
    metadata management across integrated systems.
  - Experience implementing data quality, validation, and
    governance controls.
  - Familiarity with cloud security and access controls,
    including IAM, encryption, and audit logging.
  - Proven ability to lead technical workstreams, mentor junior
    staff, and collaborate across cross-functional and
    matrixed teams.
  - Preference will be given to candidates located in the DMV.
  - Travel may be up to 25-50% for candidates not located in the
    DMV.

  What Would Be Nice to Have:

  - Experience building APIs for and/or working with entity
    validation/entity resolution solutions.
  - Experience with API gateways (Apigee, Kong, Azure API
    Management, AWS API Gateway).
  - Experience with Python and SQL (including SQL Server).
  - Previous experience working with federal agencies or
    government environments, including familiarity with
    security, compliance, and data governance requirements.
  - Previous experience working with LexisNexis (or other
    similar third-party data provider) products via API
    endpoints and integrating data into solution
    environment(s).
  - Experience working in a consulting environment and/or
    delivering solutions in a matrixed organization.
  - Experience supporting training, user enablement, and scaling
    of technical capabilities across teams or organizations.
  - Experience building AI/ML-enabled data products,
    particularly those leveraging unstructured data (e.g.,
    NLP, document processing, image-based analytics).
  - Familiarity with ontology-driven applications, graph-based
    data modeling, and relationship analytics.
  - Experience implementing role-based access control (RBAC) and
    auditability compliance.
  - Relevant certifications or equivalent demonstrated
    expertise.
  - Experience with fraud and/or FinCrime data and monitoring
    systems.
  - Hands-on experience with financial crime compliance
    technology and data solutions, e.g., Oracle Mantas,
    Actimize, Fircosoft, LexisNexis Bridger, World-Check, Dow
    Jones, Chainalysis, Elliptic, TRM Labs, etc.

  The annual salary range for this position is
  $130,000.00-$216,000.00. Compensation decisions depend on a
  wide range of factors, including but not limited to skill
  sets, experience and training, security clearances,
  licensure and certifications, and other business and
  organizational needs.

  What We Offer:

  Guidehouse offers a comprehensive, total rewards package
  that includes competitive compensation and a flexible
  benefits package that reflects our commitment to creating a
  diverse and supportive workplace.

  Benefits include:

  - Medical, Rx, Dental & Vision Insurance
  - Personal and Family Sick Time & Company Paid Holidays
  - Position may be eligible for a discretionary variable
    incentive bonus
  - Parental Leave and Adoption Assistance
  - 401(k) Retirement Plan
  - Basic Life & Supplemental Life
  - Health Savings Account, Dental/Vision & Dependent Care
    Flexible Spending Accounts
  - Short-Term & Long-Term Disability
  - Student Loan PayDown
  - Tuition Reimbursement, Personal Development & Learning
    Opportunities
  - Skills Development & Certifications
  - Employee Referral Program
  - Corporate Sponsored Events & Community Outreach
  - Emergency Back-Up Childcare Program
  - Mobility Stipend

