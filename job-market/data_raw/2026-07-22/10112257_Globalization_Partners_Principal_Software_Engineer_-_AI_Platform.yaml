description: |
  About Us

  Our leading SaaS-based Global Employment Platform™ enables
  clients to expand into over 180 countries quickly and
  efficiently, without the complexities of establishing local
  entities. At G-P, we’re dedicated to breaking down barriers
  to global business and creating opportunities for everyone,
  everywhere.

  Our diverse, remote-first teams are essential to our
  success. We empower our Dream Team members with flexibility
  and resources, fostering an environment where innovation
  thrives and every contribution is valued and celebrated.

  The work you do here will positively impact lives around the
  world. We stand by our promise: Opportunity Made Possible.
  In addition to competitive compensation and benefits, we
  invite you to join us in expanding your skills and helping
  to reshape the future of work.

  At G-P, we assist organizations in building exceptional
  global teams in days, not months—streamlining the hiring,
  onboarding, and management process to unlock growth
  potential for all.

  What you will do:

  - Lead AI Agent Strategy: Architect and drive the technical
    evolution of our customer-facing AI agents, ensuring they
    deliver intuitive, intelligent, and highly reliable
    interactions.
  - Innovate with Super Agents: Spearhead the development of
    "Super Agents"—complex, multi-agent systems capable of
    reasoning, planning, and executing multi-step tasks across
    our platform.
  - Workflow Automation: Design and implement robust frameworks
    to automate complex business workflows that agents can
    reliably execute, reducing manual overhead and increasing
    operational efficiency.
  - Collaborate: Work closely with product managers, data
    scientists, and cross-functional engineering teams to
    translate business needs into scalable agentic solutions.
  - Technical Leadership: Provide hands-on technical guidance,
    set best practices for LLM integration, prompt
    engineering, and agent orchestration, while safeguarding
    scalability, security, and performance.
  - Mentorship: Mentor senior engineers on AI/ML best practices,
    agentic design patterns, and the integration of emerging
    AI technologies into production systems.

  What we are looking for:

  - 12+ years of experience in architecting and developing
    highly scalable enterprise-level services, platforms, or
    products.
  - Deep expertise in building and deploying large-scale
    distributed enterprise applications.
  - Extensive experience with AI/ML frameworks (e.g., PyTorch,
    TensorFlow) and proven experience deploying LLMs and
    agentic architectures in production environments.
  - Strong understanding of agent orchestration patterns, chain-
    of-thought prompting, and automated workflow design.
  - Proficiency in modern backend stacks (Java, Node.js, Python,
    Golang) and experience with scalable database technologies
    (SQL and NoSQL).
  - Experience with cloud architectures and serverless
    ecosystems (AWS/GCP/Azure).
  - Excellent communication skills, with the ability to
    articulate complex technical and AI-driven concepts to
    both technical and non-technical stakeholders.
  - Startup or high-growth environment experience is highly
    desirable.

  Our ranges are established using objective market
  benchmarking data for this level of work. Final placement
  within the range is determined by gender-neutral criteria,
  including the candidate's relevant skills, experience, and
  specific qualifications for the role.

  Actual compensation for this position may vary and will
  depend on multiple factors such as relevant qualifications,
  experience, education, and geographic location. For Full-
  Time Regular Employees, this position is also eligible for
  additional compensation as follows:

  - Sales Roles: This position is eligible for a commission
    structure in addition to base salary.
  - Non-Sales Roles: This position is eligible for an annual
    bonus which is paid dependent on various factors,
    including and without limitation, individual and company
    performance in addition to base salary.

  Benefits

  G-P values its employees and offers excellent benefits and
  perks including generous paid parental leave, flexible time
  off, spending accounts, medical insurance, dental insurance,
  vision insurance, sabbatical after 5 years and more.



