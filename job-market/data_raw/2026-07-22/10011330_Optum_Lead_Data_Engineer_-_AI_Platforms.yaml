  Connecting. Growing together. Primary Responsibilities: AI-
  First Data Platform Architecture

  - Lead the architecture, design, and implementation of AI-
    first enterprise data platforms supporting AI/ML,
    Generative AI, Agentic AI, advanced analytics, and
    operational workloads
  - Define enterprise data strategy, architecture standards, and
    AI-ready data platform capabilities
  - Design end-to-end data architectures spanning:
    - Data ingestion
    - Data processing
    - Data storage
    - Data serving
    - Data governance
    - Data consumption
    - Semantic knowledge layers
  - Architect modern data platforms using:
    - Lakehouse Architecture
    - Data Lakes
    - Data Warehouses
    - Medallion Architecture (Bronze, Silver, Gold)
    - Data Products
    - Data Mesh principles
  - Design scalable architectures that support AI training,
    inference, Retrieval-Augmented Generation (RAG), Agentic
    AI, enterprise copilots, and advanced analytics

  AI Data Foundations & Engineering

  - Build AI-ready data platforms capable of supporting:
    - Feature stores
    - Embedding generation pipelines
    - Vectorized datasets
    - Semantic indexing
    - AI inference workloads
    - Enterprise knowledge retrieval systems
  - Develop scalable ingestion frameworks supporting structured,
    semi-structured, and unstructured data at enterprise scale
  - Architect distributed data systems utilizing partitioning,
    sharding, clustering, workload distribution, and parallel
    processing strategies
  - Implement Lambda and Kappa architectural patterns to support
    batch, streaming, and real-time processing requirements
  - Design highly resilient and fault-tolerant data pipelines
    utilizing:
    - Idempotency
    - Retry mechanisms
    - Checkpointing
    - Recovery strategies
    - Delivery guarantees
  - Optimize storage formats, indexing, partitioning, query
    performance, and data lifecycle management for scalability
    and cost efficiency
  - Design data architectures that appropriately balance
    consistency, availability, scalability, and latency
    requirements across distributed environments

  Semantic & Knowledge Architecture

  - Design and implement enterprise Semantic Layers that
    transform raw data into business-aware, AI-consumable
    knowledge assets
  - Build semantic abstractions on top of structured, semi-
    structured, and unstructured data to expose business
    context, entity relationships, taxonomies, ontologies, and
    domain knowledge
  - Architect intelligent knowledge platforms that unify data
    products, metadata, embeddings, lineage, knowledge graphs,
    and business semantics into a single AI-ready foundation
  - Develop semantic models that enable AI systems, copilots,
    RAG applications, and Agentic AI workflows to understand
    context, meaning, relationships, and intent
  - Create reusable semantic APIs and knowledge services that
    provide governed, context-aware access to enterprise
    knowledge assets
  - Build architectures supporting:
    - Knowledge Graphs
    - Ontologies
    - Semantic Search
    - Vector Search
    - Enterprise Knowledge Repositories
    - Agent Memory Systems
    - Retrieval Platforms
    - AI Copilots and Agents
  - Establish semantic interoperability standards that enable
    consistent AI consumption and enterprise-wide knowledge
    discovery

  Governance, Security & Data Trust

  - Establish enterprise-wide data governance frameworks
    including:
    - Data ownership and stewardship
    - Metadata management
    - Data cataloging
    - Data lineage
    - Data traceability
    - Data lifecycle governance
  - Implement enterprise-grade data quality controls through
    validation, anomaly detection, deduplication, SLA
    monitoring, and automated quality enforcement
  - Ensure compliance with regulatory requirements including
    HIPAA, GDPR, PII protection, and enterprise governance
    standards
  - Define and enforce security controls including:
    - Role-Based Access Control (RBAC)
    - Encryption
    - Data masking
    - Access auditing
    - Secure data sharing
  - Build secure and governed access layers supporting
    analytics, AI platforms, and downstream enterprise
    applications

  Platform Reliability & Operational Excellence

  - Implement end-to-end observability through monitoring,
    logging, lineage tracking, alerting, operational
    dashboards, and data platform telemetry
  - Optimize enterprise data platforms for scalability,
    availability, reliability, performance, and cost
    efficiency
  - Establish architecture standards, reusable patterns, and
    platform accelerators supporting enterprise-wide adoption
  - Lead platform modernization, cloud transformation, and AI
    data platform initiatives
  - Collaborate with AI/ML Engineers, Data Scientists, Applied
    Scientists, Platform Engineers, and Enterprise Architects
    to ensure data platforms effectively support model
    training, inference, RAG systems, and Agentic AI
    applications
  - Mentor engineering teams and drive technical excellence
    across the organization

  Builder Responsibilities:

  - Design, develop, and deploy AI-powered solutions using no-
    code, low-code, and advanced platforms, translating
    business needs into scalable applications that enhance
    products, workflows, and decision-making
  - Comply with the terms and conditions of the employment
    contract, company policies and procedures, and any and all
    directives (such as, but not limited to, transfer and/or
    re-assignment to different work locations, change in teams
    and/or work shifts, policies in regards to flexibility of
    work benefits and/or work environment, alternative work
    arrangements, and other decisions that may arise due to
    the changing business environment). The Company may adopt,
    vary or rescind these policies and directives in its
    absolute discretion and without any limitation (implied or
    otherwise) on its ability to do so

