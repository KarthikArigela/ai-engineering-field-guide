  Job Description: AI Platform Testing Engineer (Remote) Job
  Title

  AI Platform Testing Engineer

  Location

  Remote

  Employment Type

  Full-time / Contract

  Job Summary

  We are looking for an experienced AI Platform Testing
  Engineer to join our team remotely and play a key role in
  ensuring the quality, performance, and reliability of our
  AI-powered platform before its official launch. The ideal
  candidate will have a strong background in software testing,
  an understanding of AI applications, and working knowledge
  of programming languages to effectively test, validate, and
  troubleshoot platform functionality.

  Key Responsibilities


  - Design, execute, and maintain test plans, test cases, and
    testing scenarios.
  - Perform functional, integration, regression, usability, and
    end-to-end testing.
  - Test AI features, prompts, workflows, and generated
    responses for accuracy, consistency, and reliability.
  - Identify, document, prioritize, and track defects through to
    resolution.
  - Validate bug fixes and perform regression testing before
    releases.
  - Test APIs, integrations, and system performance.
  - Ensure compatibility across browsers, operating systems, and
    devices.
  - Collaborate with developers, product managers, and AI
    engineers to improve platform quality.
  - Prepare detailed testing reports and provide launch
    readiness recommendations.
  - Suggest improvements to enhance platform stability and user
    experience.

  Required Qualifications


  - 3+ years of experience in Software QA, AI application
    testing, or platform testing.
  - Strong understanding of software testing methodologies and
    quality assurance best practices.
  - Experience testing web-based applications and AI-powered
    platforms.
  - Good understanding of programming languages such as Python,
    JavaScript, Java, C#, or similar.
  - Experience with API testing tools (e.g., Postman) and bug
    tracking tools (e.g., Jira).
  - Ability to understand application logic, troubleshoot
    issues, and communicate effectively with development
    teams.
  - Strong analytical, problem-solving, and documentation
    skills.
  - Excellent written and verbal communication skills.
  - Ability to work independently in a remote environment and
    manage priorities effectively.

  RequirementsPreferred Qualifications


  - Experience with automation testing tools such as Selenium,
    Playwright, or Cypress.
  - Familiarity with CI/CD pipelines and Git.
  - Knowledge of SQL and database testing.
  - Understanding of Large Language Models (LLMs), prompt
    engineering, and AI model evaluation.
  - Experience working in Agile/Scrum development environments.

  What We Offer


  - Fully remote work environment.
  - Opportunity to work on an innovative AI platform.
  - Flexible working hours.
  - Competitive compensation based on experience.
  - Collaborative and fast-paced team with opportunities for
    professional growth.






  Benefits




  Compensation

  Competitive salary based on qualifications, experience, and
  institutional policies.
