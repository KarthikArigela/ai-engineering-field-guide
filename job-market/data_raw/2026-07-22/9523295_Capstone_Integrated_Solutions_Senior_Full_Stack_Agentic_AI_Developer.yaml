title: Senior Full Stack Agentic AI Developer
company: Capstone Integrated Solutions
location: USA
work_type: FULL_TIME
description: |
  Capnexus is a comprehensive services provider. Our team
  consists of outstanding professionals, highly experienced in
  designing, building, and supporting retail software. We see
  ourselves as a build-as-a-service provider who follows a
  repeatable business pattern that can be applied to a variety
  of platforms and verticals. Having a culture built on
  outcomes and delivery at the core of the business, Capstone
  is providing its customers with a complete suite of services
  for software development, system analysis, integration,
  implementation, and support, as well as the option to engage
  a single team to perform all the services they require.

  Who You Are and What You’ll Do:

  CapNexus is looking for a highly skilled Senior Full Stack
  Agentic AI Developer specializing in AWS serverless
  architecture and Amazon Bedrock agentic AI to join our
  growing team. This is an exciting opportunity to work on
  cutting-edge generative AI and agentic solutions that
  transform how enterprise customers engage with their data,
  automate intelligent workflows, and deliver personalized
  customer experiences at scale.



  Responsibilities:

  - Design and implement agentic workflows using Amazon Bedrock
    Agent Core, including Agent Core Runtime for agent
    execution and Agent Core Gateway for API exposure, action
    groups, and Lambda-backed tool use.
  - Build agents for real-world customer-facing use cases —
    reservation bookings, service requests, customer-assist
    chat and voice — integrated with Amazon Connect for
    omnichannel delivery.
  - Implement RAG pipelines using Knowledge Bases for Bedrock,
    including embedding model selection, chunking strategy,
    and retrieval quality optimization.
  - Design and develop serverless backend services using AWS
    Lambda, Step Functions, EventBridge, and API Gateway.
  - Build, debug, and maintain Lambda functions in production
    using Lambda Powertools, structured logging, CloudWatch
    Logs Insights, and X-Ray tracing for observability and
    performance optimization.
  - Design and develop the Customer 360 API layer to expose
    unified customer profiles and CDP outputs to downstream
    applications and dashboards.
  - Build responsive UI/UX for customer-facing and internal
    applications including the Customer Portal, preference
    management center, and campaign management interfaces
    using React.
  - Develop and maintain bi-directional integration with
    NetSuite for lead creation, contact synchronization, and
    opportunity management.
  - Implement integrations with third-party platforms including
    Camp Spot, Office 365, Zoom Phones, and Amazon Connect to
    support omnichannel workflows.
  - Build customer journey tracking features and front-end
    components to visualize lifecycle analytics and engagement
    data.
  - Implement the customer preference management center
    supporting opt-in/opt-out, communication preferences, and
    data compliance workflows (GDPR right-to-forget, right-to-
    access).
  - Consume SageMaker and Bedrock model outputs to surface AI-
    driven insights — lead scoring, audience segmentation,
    hyper-personalization — within applications.
  - Collaborate with Data/ML and DevOps/MLOps engineers to
    ensure seamless end-to-end data flows from back-end
    pipelines to front-end interfaces.
  - Support UAT for application features and contribute to
    technical documentation.



  Qualifications:

  - 5+ years of full stack development experience with
    demonstrated depth on the backend.
  - Hands-on experience building agentic workflows on Amazon
    Bedrock Agent Core — specifically Agent Core Runtime and
    Agent Core Gateway — not surface-level familiarity. This
    is a hard requirement.
  - Demonstrated ability to design agent action groups, tool use
    patterns, and multi-step agent reasoning flows for real
    production use cases.
  - Experience implementing RAG architectures: embedding models,
    chunking strategy, Knowledge Bases for Bedrock, retrieval
    quality tuning.
  - Deep hands-on experience with AWS serverless services:
    Lambda (including production debugging and optimization),
    Step Functions, EventBridge, and API Gateway —
    architectural depth required, not just familiarity.
  - Proven experience with Lambda observability in production:
    structured logging, CloudWatch Logs Insights, AWS X-Ray
    tracing, and Lambda Powertools.
  - Strong experience building and consuming RESTful APIs;
    familiarity with GraphQL or AWS AppSync a plus.
  - Proficiency in Python or Node.js/TypeScript for serverless
    function development.
  - Experience integrating with third-party CRM or ERP systems
    (NetSuite, Salesforce, or similar).
  - Front-end proficiency in React or equivalent; able to build
    responsive, accessible UI but with equal or stronger
    backend capability.
  - Familiarity with AWS Cognito (authentication), DynamoDB or
    RDS (data persistence), and S3 (asset storage).
  - Understanding of data privacy and compliance concepts as
    applied to application design.
  - Comfortable working in Agile/Scrum teams alongside senior
    technical stakeholders.



  Nice to Have:

  - Experience integrating with Amazon Connect or omnichannel
    communication platforms.
  - Familiarity with Amazon QuickSight embedded analytics.
  - Experience with Strands Agents (AWS) or LangGraph for agent
    orchestration.
  - AWS Certification (Developer Associate or Solutions
    Architect Associate/Professional).
  - Background in real estate, property management, or marketing
    technology platforms.

  "Our Culture":

  At Capnexus, the central principles that we all adhere to,
  and the glue that holds us together, are our keystones. Our
  four keystones are:

  - "A Customer Obsessed, Delivery Focused, Culture"

  - We’re driven to exceed our customers’ expectations by
    listening, leading, solving problems, and delivering what
    we promise

  - We aim to be the most dependable and trusted partner serving
    our customers. TRUST = CONSISTENCY x TIME

  - "A Culture of Learning and Sharing"

  - We value “Lifetime Learners”; those who are hungry,
    competitive, curious, and self-motivated in their pursuit
    of knowledge.

  - Personal and professional growth depends on teamwork and
    continuous learning. By sharing knowledge, skills, ideas,
    and effort, we benefit our customers, ourselves, and our
    communities.

  - We recognize that the thoughts, feelings, and backgrounds of
    others are as important as our own. Everyone has something
    to learn and everyone has something they can teach.

  - Knowledge and ability are valued. Sharing knowledge and
    helping others learn new capabilities is valued
    exponentially.

  - "A Culture of Growth and Scalability"

  - Growth comes from not establishing barriers in your role.
    “Cross functional skill sets are valued and help us
    deliver to our customers in a truly agile fashion. It
    comes with understanding that when asked to do something
    new, you will need support, have questions, and make some
    mistakes along the way.

  - The most elegant solution is a simple solution. Simple
    doesn’t mean easy. It’s often more difficult to break a
    complex problem down into simple, scalable terms. We don’t
    appreciate, or value, over architected solutions or
    superfluous coding.

  - Time is one of our most precious commodities. Scalability
    implies being respectful of this and passionate about
    making the most efficient use of each and every one of our
    team members time.

  - "All Work is Strategic"

  - No matter how small a project or assignment appears, every
    single engagement is an opportunity for us to prove
    ourselves, build trust, and develop relationships that
    last and grow

  - Every task, interaction, and commitment matters

  - Big or small, we execute our plans and strategies with
    focus, commitment, and passion



  We offer:

  Job Type: Full-time, contract work



  Capnexus is an equal opportunity employer. We embrace and
  celebrate diversity and are committed to creating an
  inclusive and safe environment for all employees. Experience
  comes in many forms, and we’re dedicated to adding new
  perspectives to the team. We encourage you to apply even if
  your experience doesn’t perfectly align with what we have
  listed. We look forward to hearing from you.

  No Agencies Please!
