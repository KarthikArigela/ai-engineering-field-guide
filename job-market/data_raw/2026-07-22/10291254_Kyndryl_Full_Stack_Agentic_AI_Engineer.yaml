description: |
  Who We Are

  At Kyndryl, we run and reimagine the mission-critical
  technology systems that drive advantage for the world’s
  leading businesses.  We are at the heart of progress; with
  proven expertise and a continuous flow of AI-powered
  insight, enabling smarter decisions, faster innovation, and
  a lasting competitive edge. For our people—Kyndryls—that
  means doing purposeful work that powers human progress. Join
  us and experience a flexible, supportive environment where
  your well-being is prioritized and your potential can
  thrive.

  The Role

  Your role: As a Full-Stack Agentic AI Engineer at Kyndryl,
  you will translate architectural blueprints into robust,
  production-ready code to drive next-generation customer
  solutions. In this hands-on, highly technical position, you
  will build and seamlessly integrate autonomous AI
  capabilities directly into enterprise-level software
  systems. What you will do:

  - Develop and implement end-to-end AI-driven applications,
    integrating generative AI models
  - Build and maintain scalable front-end interfaces using
    modern web frameworks (React, Angular, Vue.js)
  - Design and develop robust back-end services using Node.js,
    Python, or other back-end technologies
  - Integrate large language models (LLMs) and multimodal AI
    models into applications
  - Optimize application performance, ensuring efficiency in AI
    inference and API response times
  - Develop and maintain RESTful and GraphQL APIs for AI model
    interaction
  - Deploy AI applications on cloud platforms (AWS, GCP, Azure)
    using containerization and serverless technologies
  - Ensure security, scalability, and compliance of AI-driven
    applications
  - Stay up to date with the latest advancements in
    Generative/Agentic4 AI, web development, and cloud
    technologies

  Your Future at Kyndryl The career path ahead is full of
  exciting opportunities to grow and advance within the job
  family. With dedication and hard work, you can climb the
  ladder to higher bands, achieving coveted positions such as
  Principal Engineer or Vice President of Software. These
  roles not only offer the chance to inspire and innovate, but
  also bring with them a sense of pride and accomplishment for
  having reached the pinnacle of your career in the software
  industry.

  Who You Are

  You’re good at what you do and possess the required
  experience to prove it. However, equally as important – you
  have a growth mindset; keen to drive your own personal and
  professional development. You are customer-focused – someone
  who prioritizes customer success in their work. And finally,
  you’re open and borderless – naturally inclusive in how you
  work with others.

  Required Skills & Qualifications

  - Bachelor’s degree in computer science, Software Engineering,
    or a related field (or equivalent experience).
  - 6+ years of experience in full-stack development, with a
    track record of building scalable, production-ready
    systems.
  - Strong proficiency in JavaScript/TypeScript, Python, and
    modern front-end frameworks (React, Vue, or Angular).
  - Experience with agentic frameworks such as LangChain,
    AutoGen or CrewAI.
  - Hands-on experience with integrating AI models via APIs
    (OpenAI, Hugging Face, etc.).
  - Knowledge of vector databases, embeddings, and retrieval-
    augmented generation (RAG) techniques.
  - Experience with cloud platforms (e.g., AWS, Azure, GCP),
    containerization (Docker, Kubernetes), and CI/CD
    pipelines.
  - Strong understanding of database technologies (SQL, NoSQL,
    Firebase, MongoDB, PostgreSQL).
  - Ability to design scalable and maintainable architectures
    for AI-driven applications.
  - Capable of working closely with cross-functional teams to
    deliver cohesive, end-to-end functionality.
  - Knowledge of message queues (e.g., RabbitMQ, Kafka) and
    caching systems (e.g., Redis).

  Preferred Skills & Qualifications

  - Experience with Temporal Workflows, Langfuse, LLM gateways
    such as LiteLLM
  - Prior experience in prompt engineering
  - Experience in building AI-powered chatbots, content
    generators, or recommendation systems.
  - Familiarity with LLM fine-tuning, prompt engineering, and AI
    model optimization.
  - Knowledge of serverless computing, edge AI, and streaming
    architectures.
  - Background in handling large-scale data or real-time
    systems.

  Being You

  The “Kyn” in Kyndryl means kinship, which represents the
  strong bonds we have with each other, our customers and our
  communities. We focus on ensuring all Kyndryls feel included
  and we welcome people of all cultures, backgrounds, and
  experiences. Even if you don’t meet every requirement, we
  encourage you to apply. We believe in growth, and we’re
  excited to see what you can bring. At Kyndryl, employee
  feedback has told us that our number one driver of employee
  engagement is belonging. That sense of belonging — being a
  valued, respected, trusted member of the team — is
  fundamental to our culture and fueling great experiences for
  our customers. This dedication to welcoming everyone into
  our company means that Kyndryl gives you the ability to
  thrive and contribute to our culture of empathy and shared
  success. That’s The Kyndryl Way.

  What You Can Expect

  Your career with us isn’t just a job—it’s an adventure with
  purpose.  We offer a dynamic, hybrid-friendly culture that
  supports your well-being and empowers you to grow. Our Be
  Well programs are thoughtfully designed to support your
  financial, mental, physical, and social health—because we
  know that when you feel your best, you do your best.  From
  your very first day, you’ll dive into impactful work that
  powers the systems our customers rely on every day. You
  won’t just contribute—you’ll make a difference, tackling
  meaningful projects that sharpen your skills and fuel your
  growth. We’re here to champion your journey. With powerful
  tools to chart your career path, personalized development
  goals aligned with your ambitions, and continuous feedback
  to keep you inspired and on track, you’ll have everything
  you need to thrive and evolve. You’ll develop in-demand
  skills to grow your career and achieve your ambitions with
  access to cutting-edge learning opportunities—from
  certifications with Microsoft, Google, and Amazon to
  coaching and hands-on experiences. And through it all,
  you’ll be part of a culture that values empathy, restless
  learning, and a devotion to shared success. We want you to
  thrive here—and we’re committed to helping you do just that.
  Ready to make an impact? Join us and help shape what’s next.

  Get Referred!

  If you know someone that works at Kyndryl, when asked ‘How
  Did You Hear About Us’ during the application process,
  select ‘Employee Referral’ and enter your contact's Kyndryl
  email address.
