description: |
  About Jimdo

  We exist to unleash the power of the self-employed - helping
  solopreneurs and micro-businesses thrive by doing what
  they're passionate about and removing the complexity of
  building lasting, successful businesses.

  Jimdo started in 2007 when three school friends built a
  website builder in a Northern German farmhouse to help
  everyone build a presence online. Today, we're a profitable,
  remote-first company with 220+ people from 50+ nationalities
  working across 15+ countries. We've helped build over 36
  million websites to get online across the world.

  We're more than just a website builder. We're an AI-powered
  platform that helps self-employed people actually run and
  build successful businesses — from getting found online,
  winning customers and running their business with a peace of
  mind by knowing exactly what to do next to move forward.

  At the heart of Jimdo is a strong belief in personalized,
  data-driven guidance. Our platform combines design, business
  tools, and an AI-powered core that turns real customer data
  into clear insights and next steps helping our customers
  focus on what moves their business forward.

  Role Overview :

  As a Senior AI Fullstack Engineer, you'll join our AI Team
  to build Jimdo Companion—our intelligent AI assistant
  designed to become the trusted business partner for millions
  of entrepreneurs. Companion orchestrates multiple AI agents
  to automate business tasks, provide personalised
  recommendations, and help customers grow their businesses
  through proactive, AI-powered experiences.

  You'll work across the full stack, designing scalable
  backend systems, building intuitive frontend experiences,
  and developing agentic AI workflows powered by large
  language models. This is a highly impactful senior
  individual contributor role where you'll help shape our AI
  platform, influence technical direction, and enable other
  product teams to build AI-powered experiences on top of the
  foundations you create. You'll report directly to the
  Engineering Manager, AI Team.

  Your impact:

  - Design and build the core systems powering Jimdo Companion,
    including agent orchestration, recommendation engines, and
    scalable APIs.
  - Develop AI-powered features that automate real business
    tasks and improve customer outcomes.
  - Build high-quality backend services and engaging frontend
    experiences using modern full-stack technologies.
  - Design, evaluate, and optimise LLM-powered workflows,
    prompts, guardrails, and agent coordination.
  - Build reusable AI platform capabilities that empower other
    engineering teams to create AI-enabled products.
  - Partner closely with Product Managers, Designers, Data
    Analysts, and engineers to deliver customer-centric
    solutions.
  - Champion AI-augmented software development by leveraging
    modern AI coding assistants and sharing best practices
    across the engineering team.

  What you bring:

  - 5+ years of professional software engineering experience,
    including experience in a senior or technical leadership
    capacity.
  - Strong full-stack expertise with Node.js, TypeScript, and
    React.
  - Hands-on experience building AI-powered products using LLMs,
    prompt engineering, agentic workflows, or AI APIs that
    have reached production users. Preferably using the
    LangChain & LangGraph framework.
  - Strong understanding of distributed systems, REST APIs,
    microservices, cloud infrastructure (AWS preferred), and
    modern engineering practices.
  - Experience using AI coding assistants such as Cursor, Claude
    Code, or similar to accelerate software development while
    maintaining engineering quality.
  - Strong system design skills, product thinking, and the
    ability to quickly understand complex technical domains.
  - Excellent collaboration skills and enthusiasm for working in
    a remote-first, cross-functional environment.

  What we offer:

  Inspiring Mission: At our core, we are driven by a
  meaningful mission - to  empower solopreneurs and small
  businesses to succeed and  to contribute to the
  sustainability and vibrancy of the communities they serve.

  Flexibility and Trust: Our work environment thrives on
  flexibility and trust. We offer fully remote work set-up
  with opportunities for in-person collaboration. You can
  manage your working hours flexibly because we prioritize the
  results you deliver over the number of hours you put in.

  An International Diverse Team: Our team is a mosaic of over
  248 individuals hailing from 50+ different countries and
  working across 15+ diverse locations. We take pride in our
  openness and inclusivity, with an Employee-led DEI Council
  and active ERGs that ensure everyone's voices are heard.

  Continuous  Growth and Career Development: We invest in your
  growth with company-wide access to LinkedIn Learning and
  Hack Weeks, Deep Work Thursdays, conferences and access to
  technical eLearning platforms. From day one, you have the
  chance to contribute your ideas and create a meaningful
  impact. Our flat hierarchies and swift decision-making
  processes provide an open platform for your career
  progression.

  Competitive Benefits Package:

  - Annual compensation reviews to ensure you're rewarded
    fairly.
  - A remote office set-up bonus to enhance your workspace.
  - An employee assistance program, offering resources and
    counseling.
  - Plus, a perk that keeps giving: up to three free Jimdo
    websites for your personal or professional projects that
    you get to keep forever.

  Jimdo is proud to be an equal opportunity employer. This
  means that we don’t discriminate based on race or ethnic
  origin, color, the language(s) you speak, where you (or your
  parents) are from, or whether or not you consider yourself
  to have a disability. Neither will your age, gender, gender
  identity, sexual orientation, religion, beliefs, or
  political opinions play a part in your application with us.
  Our diverse team values and celebrates the uniqueness of
  each individual. We embrace differences and believe that
  they enrich our organization, making us stronger and more
  innovative. Join us, and let's continue to create a
  workplace where everyone can thrive, regardless of
  background or identity.

  By sending your application, you declare that you read and
  understand the Jimdo Applicant Privacy Policy
