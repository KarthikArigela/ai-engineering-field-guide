    development, and unit testing for AI-enabled features
    using Cisco Preferred LLM, Cisco LLM, and SDLC Agents,
    with Copilot for Code support to accelerate implementation
  - Investigate and resolve bugs, performance issues, data
    discrepancies, and security concerns—using AI to minimize
    development lifecycle impact
  - Define best practices and determine development scope using
    AI-driven processes
  - Maintain and improve production AI solutions to ensure
    reliability and long-term maintainability
  - Collaborate tightly with BSA and the Product Owner to
    deliver prioritized outcomes through the Solution and
    Execution phases of the Ops Mode

