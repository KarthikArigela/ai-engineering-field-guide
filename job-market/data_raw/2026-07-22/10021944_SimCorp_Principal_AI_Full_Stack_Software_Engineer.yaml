description: |
  Principal AI & Full Stack Software Engineer – Cloud & AI
  Accelerator Team



  WHAT MAKES US, US

  Join some of the most innovative thinkers in FinTech as we
  lead the evolution of financial technology. If you are an
  innovative, curious, collaborative person who embraces
  challenges and wants to grow, learn and pursue outcomes with
  our prestigious financial clients, say Hello to SimCorp!

  At its foundation, SimCorp is guided by our values — caring,
  customer success-driven, collaborative, curious, and
  courageous. Our people-centered organization focuses on
  skills development, relationship building, and client
  success. We take pride in cultivating an environment where
  all team members can grow, feel heard, valued, and
  empowered.

  If you like what we’re saying, keep reading!

  WHY THIS ROLE IS IMPORTANT TO US

  We are looking for a Principal AI & Full Stack Software
  Engineer to join our newly established Cloud & AI
  Accelerator team.

  The team focuses on helping accelerate high-impact and
  strategic initiatives across SimCorp. We work where we
  believe we can create the most value — helping shape new
  solutions, explore opportunities enabled by AI and cloud
  technologies, and support important business initiatives
  that require speed, innovation, and strong engineering
  foundations. Our focus is where we can create the biggest
  impact, and we value engineers who thrive in dynamic
  environments and enjoy solving new challenges.

  You will work across the full stack using technologies such
  as Azure, .NET, TypeScript, and Angular, while collaborating
  closely with engineers, architects, UX designers, and
  business stakeholders across SimCorp.

  AI will play an important role both in what we build and how
  we build. We actively explore modern engineering practices
  and AI-assisted development workflows, including tools such
  as Claude Code, to support experimentation, learning, and
  developer productivity.

  We value people who care deeply about creating meaningful
  solutions — not only from a technical perspective, but also
  from a user and business perspective. We are looking for
  curious, creative, and collaborative engineers who want to
  help shape both products and ways of working.

  WHAT YOU WILL BE RESPONSIBLE FOR

  - Help explore how AI can improve user experiences, workflows,
    and engineering productivity.
  - Build AI agents for and in collaboration with different
    business domains
  - Design, develop, test, and maintain AI agents & modern
    cloud-based applications across the full stack.
  - Collaborate closely with other engineers, product
    stakeholders, UX designers, and architects to shape
    solutions that solve real user problems.
  - Contribute to frontend and backend development using
    technologies such as .NET, TypeScript, and Angular.
  - Participate in discovery, experimentation, and iterative
    product development.
  - Build scalable and maintainable solutions with a strong
    focus on quality, testing, and operational excellence.

  WHAT WE VALUE

  - You are passionate about AI and have some experience
    implementing AI agents
  - You have experience as a software engineer working with both
    frontend and backend technologies for atleast 10 - 15
    years.
  - You have experience with modern frontend development using
    frameworks such as Angular and TypeScript. Experience with
    React or similar frontend frameworks is also valuable.
  - You have experience with C#, .NET, and cloud-based
    development.
  - You are interested in modern engineering practices, cloud
    technologies, and AI-assisted development.
  - You enjoy collaborating with others, sharing ideas, and
    contributing to a positive engineering culture.
  - You thrive in environments where we learn and adapt as we
    go, and where creativity, initiative, and experimentation
    are encouraged.
  - Experience with Angular, Azure, distributed systems, micro
    frontends, or investment management workflows is a plus,
    but not required.
  - We know that great candidates rarely match every single
    point perfectly. Most importantly, we are looking for
    people who are motivated by learning, improving, and
    building meaningful products together with the team.

  BENEFITS

  Attractive salary, bonus scheme, and pension are essential
  for any work agreement. However, in SimCorp we believe we
  can offer more. Therefore, in addition to the traditional
  benefit scheme, we provide a good work-life balance:
  flexible working hours and a hybrid model. Simcorp follows a
  global hybrid policy, asking employees to work from the
  office two days each week while allowing remote work on
  other days.

  Simcorp does offer opportunities for professional
  development: there is never just only one route - we offer
  an individual approach to professional development to
  support the direction you want to take.



  NEXT STEPS

  Please send us your application in English via our career
  site as soon as possible, we process incoming applications
  continually. Please note that only applications sent through
  our system will be processed. At SimCorp, we recognize that
  bias can unintentionally occur in the recruitment process.
  To uphold fairness and equal opportunities for all
  applicants, we kindly ask you to exclude personal data such
  as photos, age, or any non-professional information from
  your application. Thank you for aiding us in our endeavor to
  mitigate biases in our recruitment process.

  If you are interested in being a part of SimCorp but are not
  sure this role is suitable, submit your CV to
  aditya.gurijala@simcorp.com. SimCorp is on a positive growth
  journey, and our Talent Acquisition Team is ready to assist
  you discover the right role for you. The approximate time to
  consider your CV is three weeks.

  We are focused on continually improving our talent
  acquisition process and making everyone’s experience
  positive and valuable. Therefore, during the process we will
  ask you to provide your feedback, which is highly
  appreciated.



  WHO WE ARE

  For over 50 years, we have worked closely with investment
  and asset managers to become the world’s leading provider of
  integrated investment management solutions. We are 3,000+
  colleagues with a broad range of nationalities, educations,
  professional experiences, ages, and backgrounds.

  SimCorp is an independent subsidiary of the Deutsche Börse
  Group. Following the recent merger with Axioma, we leverage
  the combined strength of our brands to provide an industry-
  leading, full, front-to-back offering for our clients.

  SimCorp is an equal opportunity employer and welcome
  applicants from all backgrounds, without regard to race,
  gender, age, disability, or any other protected status under
  applicable law. We are committed to building a culture where
  diverse perspectives and expertise are integrated into our
  everyday work. We believe in the continual growth and
  development of our employees, so that we can provide best-
  in-class solutions to our clients.

