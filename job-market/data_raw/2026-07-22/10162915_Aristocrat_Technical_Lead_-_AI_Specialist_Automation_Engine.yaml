description: |
  At Aristocrat, we're on a mission to bring happiness to life
  through the power of play. We believe our innovative and
  inclusive culture drives our success. We're committed to
  making a positive impact in the gaming industry. As a
  Technical Lead - AI Specialist / Automation Engineer, you'll
  have the chance to develop the future of our AI-based tools
  and platforms. You will make a significant impact within our
  engineering, creative, and quality assurance teams. This is
  an outstanding opportunity for someone passionate about
  using modern technologies to improve our workflows and
  deliver world-class gaming experiences. Join our ambitious
  team and help us continue to raise the standard in
  responsible gameplay and sustainability!

  What You'll Do

  - Cross-Functional AI Tooling: Partner with Dev, Creative, and
    QA leads to identify operational bottlenecks and engineer
    tailored AI solutions.
  - Build and prioritize custom graphics tools to capture and
    multiply both static and animated art assets. These tools
    ensure they closely match our studio's outstanding art
    style.
  - Architecture & Development: Build, test, and deploy internal
    AI applications, custom web portals, and Slack/Teams bots
    using modern LLM APIs.
  - Workflow Automation: Build end-to-end automated pipelines
    connecting software systems like Jira, GitHub, and CMS
    using orchestration frameworks.
  - Prompt Engineering & Fine-Tuning: Develop, evaluate, and
    optimize complex system prompts and workflows for high-
    quality outputs.
  - Evaluation & Maintenance: Monitor tool performance, manage
    API cost optimization, mitigate model hallucination, and
    ensure strict data privacy and security compliance.

  Domain-Specific Impact Areas

  - For Dev & Math Teams: Automate tasks such as summarizing
    technical documentation, generating boilerplate code, and
    AI-assisted code reviews. Develop specialized AI tools to
    assist with complex math tooling and game balancing.
  - For Creative Teams: Build asset-generation pipelines,
    automated game rules generation, and tools to generate
    themes that help Artists/Animators scale content securely.
  - For QA Teams: Build agents that parse acceptance criteria to
    generate comprehensive test cases, automate synthetic test
    data generation, generate submission documents, and
    categorize bug reports.

  What We're Looking For

  - Experience: 5+ years in software engineering, with at least
    1.5+ years of hands-on experience building production-
    grade AI/LLM applications.
  - Specialized Expertise: Strong experience with art and
    animation pipelines is highly favorable.
  - Programming: Proficiency in Python or TypeScript/Node.js.
  - AI Ecosystem: Deep familiarity with LLM APIs, orchestration
    frameworks, and Vector Databases.
  - Integrations: Proven track record of working with REST APIs,
    webhooks, and SDKs for various platforms like GitHub,
    Jira, Figma, Adobe, Slack, and Teams.

  Soft Skills & Approach

  - Product Approach: Ability to interview internal users,
    translate their difficulties into technical requirements,
    and build intuitive UX/UI.
  - Ambiguity Champion: Comfortable working in a rapidly
    shifting AI landscape, evaluating new frameworks, and
    picking the right tool for the job.

  Qualification

  - Education: Computer Science Education (B.Tech/BE/MCA).

  Why Aristocrat?

  Aristocrat is a world leader in gaming content and
  technology, and a top-tier publisher of free-to-play mobile
  games. We deliver great performance for our B2B customers
  and bring joy to the lives of the millions of people who
  love to play our casino and mobile games. And while we focus
  on fun, we never forget our responsibilities. We strive to
  lead the way in responsible gameplay, and to lift the bar in
  company governance, employee wellbeing and sustainability.
  We’re a diverse business united by shared values and an
  inspiring mission to bring joy to life through the power of
  play.

  We aim to create an environment where individual differences
  are valued, and all employees have the opportunity to
  realize their potential. We welcome and encourage
  applications from all people regardless of age, gender,
  race, ethnicity, cultural background, disability status or
  LGBTQ+ identity. EEO M/F/D/V

  - World Leader in Gaming Entertainment
  - Robust benefits package
  - Global career opportunities

  Our Values

  - All about the Player
  - Talent Unleashed
  - Collective Brilliance
  - Good Business Good Citizen

