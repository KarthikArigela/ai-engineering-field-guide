  Underpinned by unmatched speed and performance power, we are
  the trusted backbone that’s taking the insurance industry
  from friction to flow with Distribution Velocity – speed,
  performance, and trust - to drive growth at scale.

  With over 95% of the top agencies and insurers and 50% of
  industry compliance transactions running through Vertafore,
  we lead at the intersection of innovation and trust, giving
  insurance professionals the confidence to transform and win
  in the AI era.

  Our reach is global, with headquarters in Denver, Colorado,
  and offices across the U.S., Canada, and India.

  JOB DESCRIPTION

  We seek a highly skilled Sr. Tech Lead – Software
  Engineering to join our product development project team. As
  a Sr. Tech Lead, you will lead the design, development, and
  deployment of complex web applications using React, focusing
  on front-end architecture and strong collaboration with
  cross-functional teams. You will also guide the team on best
  practices, scalability, and performance optimization to
  deliver high-quality solutions.

  Key Responsibilities:

  Essential job functions included but are not limited to the
  following:

  ·         Technical Leadership: Lead end-to-end full stack
  development efforts using latest React version, JAVA, Oracle
  and related tools, focusing on building scalable and
  efficient web applications.

  ·         Project Ownership: Take ownership of the full
  development lifecycle, from design and development to
  deployment, ensuring adherence to timelines and quality
  standards.

  ·         Collaboration: Work with cross-functional teams,
  including UX/UI designers, QA engineers, and product owners,
  to ensure seamless integration of front-end and back-end
  services.

  ·         Requirement Gathering: Engage with product team to
  understand business requirements, processes, and pain
  points.

  ·         Translation to Technical Solutions: Convert
  business requirements into technical implementation.

  ·         AI-Augmented Engineering: Drives team governance
  and AI-native standards, designs high-context
  specifications, evaluates new AI capabilities, and mentors
  the team on advanced engineering workflows.

  ·         Code Reviews: Conduct code reviews to ensure
  adherence to best practices and optimize performance,
  scalability, and security.

  ·         Mentorship: Guide junior developers on best
  practices and technologies.

  ·         Performance Optimization: Ensure applications'
  performance, scalability, and security by implementing
  industry-leading practices and tools.

  ·         Documentation: Maintain clear technical
  documentation for the solutions built to ensure ease of
  knowledge transfer and maintenance.

  Required Technical Skills:

  Must Have Skills:

  Front-End Development:

  React:

  - Strong knowledge of React (version 18), including new
    features like Concurrent Rendering and Automatic Batching.
  - Expertise in building and optimizing applications with React
    functional components and leveraging React Hooks for state
    and side effects management (e.g., useState, useEffect,
    useCallback, useMemo).
  - Experience designing responsive, cross-browser compatible
    UIs using Flexbox, media queries etc
  - Ability to abstract logic using reusable custom hooks for
    cleaner and maintainable components.

  Provider in React & Context API:

  - Experience with setting up Context Providers and effectively
    using React Context API for managing and passing data
    across component trees without prop drilling.
  - Experience using Redux Toolkit for global state management
    in complex applications.

  Form Management:

  - Strong experience in building and managing forms in React
    using Formik, including handling complex form states and
    validations.
  - Expertise in using Yup library for schema-based validation
    of forms, ensuring comprehensive client-side form
    validation.

  TypeScript:

  Strong hands-on experience with TypeScript for building
  type-safe React applications.

  Deep understanding of TypeScript features like interfaces,
  generics, type inference, and modules for ensuring code
  reliability and scalability.

  Build Tools & Bundling Strategies

  - Proficient with modern JavaScript build tools such as
    Webpack, Vite, and Parcel for efficient module bundling,
    asset optimization, and development workflows.
  - Experience configuring custom build pipelines, including
    setting up loaders, plugins, environment variables, and
    code splitting strategies to optimize performance and
    build size.

  HTML/CSS & UI Frameworks:

  HTML/CSS:

  - Strong understanding of semantic HTML and modern CSS for
    responsive web design.

  API & Backend Integration:

  REST API Knowledge:

  - Experience consuming and integrating RESTful APIs into React
    applications, including error handling, request
    optimization, and managing API responses using tools like
    Axios or Fetch API.

  AI Augmentation:

  - Drive the end-to-end software development by actively
    utilizing modern AI-assisted development toolkits (e.g.,
    GitHub Copilot, Claude Code etc.) to optimize daily coding
    velocity and documentation.
  - Utilize AI diagnostics to accelerate root-cause analysis and
    triage bugs across the entire application stack.
  - Demonstrate strong prompt-engineering habits.
  - Demonstrate curiosity and willingness to learn modern AI-
    native engineering practices and emerging AI development
    tools.
  - Critically review, audit, and benchmark AI-assisted code
    contributions against rigorous enterprise performance,
    data privacy, and security standards before production
    rollout.
  - Champion the adoption of modern, AI-native engineering
    practices across the team, elevating overall engineering
    velocity while maintaining flawless software quality.

  Testing and Quality Assurance:

  - Experience in writing and executing Playwright/Jest/RTL test
    cases to ensure the quality and performance of end-to-end
    user flows.

  Performance Optimization

  - Proven ability to optimize React applications using lazy
    loading, code splitting, and efficient state management
    techniques to improve application performance.

  Build Tools:

  - Hands-on experience with build tools like Webpack, Vite, or
    Parcel to optimize development workflows and manage modern
    JavaScript applications efficiently.

  Backend Development

  - Design, develop, and maintain enterprise applications using
    Java, Struts, Spring Boot, Hibernate, JSP, and Servlets.
  - Implement business logic and database interactions with
    Oracle 19c.
  - Develop RESTful APIs and microservices for distributed
    systems.

  Database Management

  - Write efficient SQL queries, stored procedures, and triggers
    in Oracle 19c.
  - Perform database tuning, performance optimization.

  Messaging & Integration

  - Implement asynchronous communication and message-driven
    architectures using RabbitMQ.
  - Integrate distributed systems and ensure reliable message
    delivery.

  System Architecture & Design

  - Architect and design scalable, secure, and maintainable
    solutions.
  - Apply design patterns and best practices in enterprise
    application development.

  Nice to have skills:

  Version Control & CI/CD:

  - Proficiency with Git and experience in managing feature
    branches and release cycles using GitLab.
  - Experience setting up CI/CD pipelines for automated testing,
    building, and deploying React applications using tools
    like GitLab.

  Collaboration:

  Collaboration Tools:

  - Proficiency in using tools like Rally and Teams to manage
    Agile workflows and communicate effectively across global
    teams.

  - Agile Methodologies:
  - Experience working in Agile/Scrum environments, actively
    participating in sprint planning, retrospectives, and
    iterative development cycles.

  Platform/Tools:

  - Experience with AWS cloud platforms (EC2, S3 etc),
    Terraform.

  Qualifications:

  - Bachelor’s or master’s degree in computer science,
    Engineering, or a related field.
  - Have an intense passion for building software and mentoring
    their teams
  - Are very strong in both design and implementation at an
    enterprise level.
  - 8+ years of professional experience with the above-mentioned
    skills.
  - Strong verbal and written communication ability.
  - Strong leadership skills with experience managing and
    mentoring teams.
  - Proven experience in requirement analysis and documentation.
  - Ability to translate complex business needs into technical
    implementations.
  - Problem-solving mindset with attention to detail.
  - Are in-tune with high performance and high availability
    design/programming
  - Have experience in security best practices for software and
    data platforms
  - Design 'perfect-fit' solutions with engineering teams and
    business units to drive business growth and customer
    satisfaction.
  - Are interested and capable of learning other programming
    languages as needed.

