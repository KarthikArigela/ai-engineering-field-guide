title: AI Marketing Engineer
company: Assured
location: USA
work_type: FULL_TIME
description: |
  Assured is on a mission to modernize insurance. Claims
  processing (i.e. should we pay this claim?), while often
  overlooked, is the foundation of the entire industry. It’s
  currently highly manual, involving phone calls, faxes, and
  gut instinct, costing tens of billions of dollars a year. We
  can do better.

  At Assured, we provide large insurers with the software
  solutions they need to win in a modern, technology-driven
  world. From self-service claim-filing software to backend
  fraud detection, we’re the engine that powers claims
  processing for some of the largest insurers in the world.

  The challenges we face are deep and diverse, from creating
  digital experiences that provide comfort and clarity to
  claimants at their most stressed and vulnerable to
  orchestrating large-scale ML-driven decision-making on
  billions of dollars of claims payments, life at Assured is
  dynamic, collaborative, and rewarding.

  We are looking for an AI Marketing Engineer to stand up and
  own the system underneath our entire marketing function –
  the data model, the dashboards, and the agentic workflows
  that make our marketing look like the AI company we are. You
  are the single point of accountability for whether the
  system is on, and a force multiplier for every other person.

  We buy the platforms and build the agentic glue. You will
  lock and integrate an opinionated stack across the
  intelligence, automation, CRM, and analytics layers, then
  build the internal agents – on Claude – that produce account
  briefs, objection prep, content drafts, and named-account
  monitoring. You will also build the weekly data dashboards
  that the CEO, the Head of Marketing and Head of Sales can
  read in under five minutes.

  This is a rare blend of agentic marketing operations, data
  engineering, and applied AI. If you want to dogfood the
  category we sell and build the nervous system of a modern
  go-to-market team, this is your seat.



  What You’ll Do

  🤖 Build agentic workflows – Design and ship internal agents
  -or entire orchestrated agentic workflows- on Claude for
  research, account briefs, objection prep, content drafting,
  and named-account monitoring – or any other use case we
  consider valuable.

  🗄️ Build the data model – Stand up a warehouse-backed
  marketing data model (e.g., Snowflake) that stitches all
  data sources into one source of truth.

  📊 Ship the GTM/Marketing dashboards – Build and maintain the
  weekly data dashboards that the CEO, Head of Marketing and
  Head of Sales read in under five minutes.

  🔗 Integrate the intelligence stack – Wire up product
  marketing to ABM, campaigns to execution, GTM strategy to
  pipeline.

  🚀 Be the force multiplier – Give every other hire – product
  marketing, integrated growth, community – the data, tooling,
  and automation they need to move faster.

  🛡️ Keep it compliant and observable – Build inside carrier
  compliance norms and make the system’s health and pipeline
  legible at a glance.



  What You’ll Bring

  🎯 6+ years in AI operations, revenue/growth engineering,
  data engineering, or a closely related marketing/technical
  role.

  🧠 Demonstrated ability to build with LLMs and agentic
  workflows – you’ve shipped real automations, not just
  prototypes.

  🔌 Experience integrating intelligence and data tools into a
  coherent stack.

  🏗️ A builder who is comfortable being the owner of a system
  in a fast-moving environment.

  📈 Strong sense for data quality, observability, and making
  complex systems legible to non-technical leaders.

  💪 High ownership, low ego, and genuine enthusiasm for
  dogfooding AI in our own go-to-market.

  Benefits:

  🤑 Competitive Compensation: Competitive salary and equity
  packages for all employees

  🏥 Healthcare Plan: Platinum medical, dental, and vision

  🛡️ Free life insurance: Including long-term disability &
  short-term disability

  🏄 Unlimited PTO: Uncapped vacation days & paid holidays

  👶 Family Leave: Maternity & paternity

  📈 401(k) Contribution: Assured contributes 3% of your
  income, even if you don't contribute

  🏠 WFH Benefits: Lunch on us 2x/week, monthly phone stipend &
  other home office perks

  👪 Health FSAs & HSAs: Pre-tax accounts for out-of-pocket
  medical expenses

  🤝 Team events & Offsites: We're remote, but we regularly get
  together

  **We have been made aware of individuals falsely posing as
  recruiters from Assured Insurance Technologies Inc. Please
  note that we only contact candidates from official
  @assured.claims email addresses and all interviews are
  conducted through verified company channels. If you are
  unsure whether a message is legitimate, please contact us
  directly at recruiting-ops@assured.claims before sharing any
  personal information**

  Our Commitment: We are an equal opportunity employer and
  value diversity at our company. We do not discriminate on
  the basis of race, religion, color, national origin, sex,
  gender, gender expression, sexual orientation, age, marital
  status, veteran status, or disability status. We will ensure
  that individuals with disabilities are provided reasonable
  accommodation to participate in the job application or
  interview process, perform essential job functions, and
  receive other benefits and privileges of employment. Please
  contact us to request accommodation.
