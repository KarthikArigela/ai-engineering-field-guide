description: |
  We are seeking an experienced AI Automation Engineer to
  design, build, and deploy enterprise AI solutions that
  improve business processes, automate workflows, and enable
  data-driven decision making. This role combines expertise in
  artificial intelligence, data engineering, cloud
  technologies, and automation to develop scalable solutions
  using the Microsoft AI and Azure ecosystem. The ideal
  candidate has strong hands-on experience with large language
  models (LLMs), Microsoft Copilot, Microsoft Fabric, and
  modern data architectures, along with a passion for applying
  AI to solve complex business challenges.

  Key ResponsibilitiesAI Solutions & Automation

  - Design, develop, and deploy AI-powered applications and
    automation solutions that improve operational efficiency
    and business outcomes.
  - Implement Microsoft Copilot solutions and integrate AI
    models to deliver intelligent insights, natural language
    querying, and enhanced user experiences.
  - Integrate Large Language Models (LLMs) and Generative AI
    services into business applications using APIs,
    connectors, and workflow orchestration tools.
  - Develop prompt engineering strategies, Retrieval-Augmented
    Generation (RAG) pipelines, AI agents, vector databases,
    and tokenization workflows to support enterprise AI
    initiatives.
  - Evaluate emerging AI technologies and recommend innovative
    solutions that align with business objectives.

  Data Engineering & Analytics

  - Design and maintain scalable Medallion Architecture data
    lakes (Bronze, Silver, Gold) within Microsoft Fabric.
  - Develop ETL/ELT pipelines using Dataflows Gen2, Fabric
    Notebooks, PySpark, Python, and Azure Data Factory.
  - Build enterprise-grade Power BI semantic models utilizing
    Direct Lake, DAX, and Kusto Query Language (KQL) to
    deliver high-performance analytics.
  - Optimize data models, pipelines, and query performance to
    support large-scale reporting and AI workloads.
  - Collaborate with business stakeholders to translate data
    requirements into scalable AI and analytics solutions.

  Governance, Security & Platform Management

  - Implement enterprise-grade governance, security, and
    compliance standards across Microsoft Fabric and Azure
    environments.
  - Configure Row-Level Security (RLS), workspace governance,
    access controls, and data protection policies.
  - Ensure solutions follow best practices for scalability,
    reliability, performance, and cost optimization.
  - Partner with IT, business leaders, and development teams to
    establish AI governance and responsible AI practices.

  RequirementsEducation & Experience

  - Bachelor's degree in Computer Science, Information
    Technology, Data Science, Engineering, or a related field.
  - 5+ years of experience in data engineering, AI development,
    analytics, or cloud platform engineering.
  - Experience designing and deploying enterprise AI and
    automation solutions in Microsoft Azure environments.

  Technical Skills

  - Advanced proficiency in:
  - Strong experience with:
  - Experience building scalable ETL/ELT pipelines and modern
    data lake architectures.

  AI & Automation Expertise

  - Hands-on experience with:
  - Knowledge of enterprise AI architecture, model integration,
    and responsible AI practices.

  Preferred Qualifications

  - Microsoft certifications such as:
  - Experience with Azure AI Foundry, Azure OpenAI Service,
    Microsoft Copilot Studio, or similar enterprise AI
    platforms.
  - Familiarity with DevOps, CI/CD pipelines, Git, and
    Infrastructure as Code.
  - Excellent analytical, problem-solving, and communication
    skills with the ability to collaborate across technical
    and business teams.

