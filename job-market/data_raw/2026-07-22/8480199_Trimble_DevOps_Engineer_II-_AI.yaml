description: |
  Job Title: DevOps Engineer III

  Location: Chennai, India

  Department: Trimble Cloud xOps

  Flexible Working: 4 Days per week @ Trimble Office location

  About the Role

  As a member of Trimble’s global AI & Cloud Engineering team,
  you will focus on accelerating AI enablement and adoption
  across the cloud engineering team and Trimble divisional
  customers.

  In this role, you will contribute to the development and
  support of Trimble’s strategic projects, incorporating AI to
  ensure a high-quality, intuitive product experience for our
  global customer base. We are seeking a collaborative,
  motivated professional with solid, mid- to senior-level
  experience in developing responsive, customer-facing
  applications, leveraging modern technologies and frameworks
  to deliver scalable and reliable solutions.

  What You Will Do

  Technical, Operational & Functional Expertise

  - AI-Assisted IaC: Design and implement Generative AI-assisted
    tooling to automate the generation and validation of
    Infrastructure as Code (IaC) templates, reducing
    configuration errors and accelerating development cycles.
  - Pipeline Optimization: Create and optimize end-to-end
    automated product deployment pipelines to ensure rapid,
    reliable delivery.
  - AI-Driven DevOps: Integrate AI-driven strategies into DevOps
    workflows, leveraging RAG (Retrieval-Augmented Generation)
    and Agentic AI to automate incident resolution and
    knowledge retrieval.
  - Cloud Infrastructure: Engineer and manage scalable AWS/Azure
    infrastructure using Infrastructure as Code (IaC) to drive
    operational efficiency.
  - Proactive Defect Detection: Implement AI/ML-based proactive
    detection systems to predict pipeline failures and
    minimize system downtime.
  - Advanced Automation: Streamline complex automation workflows
    using Agentic AI and modern protocols like MCP (Model
    Context Protocol) to enhance inter-system communication.
  - Observability: Advance monitoring and observability
    frameworks to transition operations from reactive to
    proactive management.
  - Disaster Recovery: Design robust Disaster Recovery (DR)
    strategies on AWS/Azure, utilizing automated backup and
    failover mechanisms.
  - CI/CD Modernization: Modernize and maintain enterprise CI/CD
    pipelines using GitHub Actions and Jenkins for continuous
    delivery.
  - Scripting & Tooling: Develop high-quality automation scripts
    and tooling utilizing advanced Python expertise.
  - Configuration Integrity: Govern and maintain version-
    controlled IaC repositories in Bitbucket and GitHub.

  Your Goals Will Include:

  - DevOps Standardization: Champion DevOps standardization by
    aligning all infrastructure and security practices with
    Trimble Cyber, xOps compliance frameworks, and AWS/Azure
    Well-Architected Standards.
  - High-Velocity Release: Orchestrate high-velocity, automated
    deployment pipelines and agentic fleets to ensure
    seamless, reliable releases.
  - Security Compliance: Closely align with Trimble
    Cybersecurity controls and SLAs to ensure Cloud
    Engineering customers' compliance.
  - Operational Discipline: Meet and exceed established KPIs,
    SLAs, and OLAs through rigorous operational discipline.
  - Self-Healing Infrastructure: Maximize system reliability and
    availability by implementing proactive monitoring,
    observability, and automated self-healing infrastructure.
  - Developer Productivity: Drive developer productivity by
    leveraging engineering metrics (DORA/SPACE) to identify
    and mitigate process bottlenecks.
  - Toil Reduction: Accelerate service delivery by automating
    routine operational tasks and security remediation,
    significantly reducing manual toil across the engineering
    organization.
  - Continuous Improvement: Continuously improve operational
    workflows by defining, tracking, and optimizing processes
    for maximum service efficiency and quality.

  What Skills & Experience You Should Bring

  - Experience: 6–9 years of hands-on experience with enterprise
    DevOps & Observability platforms in a large-scale
    enterprise environment.
  - Certifications: AWS/Azure certifications (e.g., Solutions
    Architect, DevOps Engineer).
  - AI & Automation Skills: * Practical expertise utilizing AI-
    driven tools such as Microsoft Copilot or Cursor to manage
    and enhance AI workloads.
    - Expertise in leveraging Agentic AI and the Model Context
      Protocol (MCP) to automate and optimize complex cloud
      infrastructure workflows.
    - Ability to leverage AI for proactive monitoring, predictive
      analytics, and automated root-cause analysis within
      CI/CD pipelines.
    - Understanding of AI/ML lifecycle management, governance, and
      operational best practices in enterprise cloud
      environments.
    - Experience implementing AI-assisted tools to automate
      routine tasks and enhance developer productivity.
  - Observability Platforms: Proficiency with tools such as
    Azure DevOps, Datadog, Nagios, New Relic, Grafana,
    Prometheus, Splunk, and ELK Stack.
  - Containerization: Strong hands-on knowledge of Docker,
    Kubernetes, ECS, and EKS.
  - Disaster Recovery: In-depth knowledge of cloud-native DR
    services (e.g., AWS/Azure Backup, Elastic Disaster
    Recovery, Lambda).
  - Infrastructure as Code: Deep expertise in Terraform and
    AWS/Azure CloudFormation.
  - Core Architecture: Solid understanding of cloud networking,
    security, and storage architectures.
  - Soft Skills & Alignment: * Exceptional problem-solving
    capabilities with meticulous attention to detail.
    - Proven ability to collaborate effectively in cross-
      functional teams and operate autonomously.
    - Strategic Business Alignment: Ability to drive
      organizational growth by proactively aligning
      engineering outcomes with customer needs and market
      goals.
    - Influential Partnership: Ability to build deep credibility
      and stakeholder confidence to accurately diagnose needs
      and influence strategic decisions.
    - Operational Agility: A continuous improvement mindset that
      removes technical/process waste and turns disagreements
      into productive innovation.

  Key Result Areas

  - Full accountability for assignments, ensuring timely
    delivery while meeting or exceeding Trimble's quality
    requirements.

  How to Apply: Please submit an online application for this
  position by clicking on the ‘Apply Now’ button located in
  this posting.

  Join a Values-Driven Team: Belong, Grow, Innovate.

