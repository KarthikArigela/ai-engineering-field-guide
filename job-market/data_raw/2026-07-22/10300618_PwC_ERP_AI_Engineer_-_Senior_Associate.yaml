title: ERP AI Engineer - Senior Associate
company: PwC
location:
work_type: FULL_TIME
description: |
  At PwC, our people in business application consulting
  specialise in consulting services for a variety of business
  applications, helping clients optimise operational
  efficiency. These individuals analyse client needs,
  implement software solutions, and provide training and
  support for seamless integration and utilisation of business
  applications, enabling clients to achieve their strategic
  objectives. In Oracle data and analytics at PwC, you will
  utilise Oracle's suite of tools and technologies to work
  with data and derive insights from it. You will be
  responsible for tasks such as data collection, data
  cleansing, data transformation, data modelling, data
  visualisation, and data analysis using Oracle tools like
  Oracle Database, Oracle Analytics Cloud, Oracle Data
  Integrator, Oracle Data Visualization, and Oracle Machine
  Learning. Focused on relationships, you are building
  meaningful client connections, and learning how to manage
  and inspire others. Navigating increasingly complex
  situations, you are growing your personal brand, deepening
  technical expertise and awareness of your strengths. You are
  expected to anticipate the needs of your teams and clients,
  and to deliver quality. Embracing increased ambiguity, you
  are comfortable when the path forward isn't clear, you ask
  questions, and you use these moments as opportunities to
  grow. Examples of the skills, knowledge, and experiences you
  need to lead and deliver value at this level include but are
  not limited to: Respond effectively to the diverse
  perspectives, needs, and feelings of others. Use a broad
  range of tools, methodologies and techniques to generate new
  ideas and solve problems. Use critical thinking to break
  down complex concepts. Understand the broader objectives of
  your project or role and how your work fits into the overall
  strategy. Develop a deeper understanding of the business
  context and how it is changing. Use reflection to develop
  self awareness, enhance strengths and address development
  areas. Interpret data to inform insights and
  recommendations. Uphold and reinforce professional and
  technical standards (e.g. refer to specific PwC tax and
  audit guidance), the Firm's code of conduct, and
  independence requirements. The Opportunity As part of the
  DCM AI Labs team, you will develop innovative AI and machine
  learning systems that drive impactful solutions. As a Senior
  Associate, you will analyze complex problems, mentor junior
  team members, and build meaningful client relationships
  while navigating the evolving landscape of technology. This
  role offers the chance to deepen your technical knowledge
  and grow your personal brand in a dynamic environment.
  Responsibilities
  - Design and implement advanced AI and machine learning
    solutions
  - Analyze intricate challenges and provide actionable insights
  - Mentor and guide junior team members in their professional
    development
  - Cultivate meaningful relationships with clients to
    understand their needs
  - Navigate the rapidly changing technology landscape
    effectively
  - Enhance personal knowledge and contribute to team insights
  - Collaborate with cross-functional teams to deliver
    exceptional outcomes
  - Uphold professional standards and ethical practices in every
    engagement
  What You Must Have
  - Bachelor's Degree in Computer Science, Data Science,
    Software Engineering, Mathematics, Statistics, or a
    related quantitative field
  - At least 3 years of professional experience developing AI/ML
    systems, building full-stack applications, or integrating
    AI into software products
  What Sets You Apart
  - Master's Degree in Computer Engineering, Computer Science,
    Artificial Intelligence and Robotics, Data
    Processing/Analytics/Science, Software Engineering
    preferred
  - Experience with LLMs, prompt engineering, and orchestration
    tools
  - Experience with multi-agent frameworks and agentic AI
    patterns
  - Proficiency with Docker, Kubernetes, and cloud-native
    architectures
  - Experience with CI/CD for ML systems and model monitoring
  - Experience with vector databases and embedding models
  - Track record of fine-tuning models on domain-specific data
  - Experience processing and managing data pipelines
  - Contributions to open-source AI/ML projects or hackathons
  The salary range for this position is: $77,000 - $202,000.
