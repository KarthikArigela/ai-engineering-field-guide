description: |
  If you’re interested in this role, please apply in English
  and include an English version of your Resume/CV.

  The Role

  Joining Moderna means advancing mRNA science to transform
  medicine. Work with exceptional global teams on a broad
  pipeline and build a career that makes a real difference for
  patients.

  Moderna is strengthening its international business services
  hub in Warsaw, supporting our growing global operations. We
  welcome professionals ready to help advance our mission and
  shape the future of mRNA medicines.

  This is an opportunity to help shape the future of
  enterprise automation by driving the adoption of Microsoft
  Power Platform and AI-powered solutions across Moderna. As a
  hands-on engineer within the Power Platform Center of
  Excellence (CoE), you will combine platform administration,
  governance, solution architecture, and development expertise
  to enable secure, scalable automation while empowering the
  business to innovate. Working across Microsoft Power
  Platform, Copilot Studio, Microsoft 365, enterprise
  integrations, and emerging Generative AI capabilities, you
  will help deliver intelligent digital solutions that improve
  efficiency while maintaining enterprise-grade governance and
  compliance.

  Here’s What You’ll Do

  - Support the administration of Microsoft Power Platform
    across development, validation, and production
    environments.
  - Support the implementation and continuous evolution of the
    Power Platform Center of Excellence governance framework,
    including environment strategy and lifecycle management.
  - Administer and maintain Data Loss Prevention (DLP) policies,
    connector governance, security roles, licensing, and
    access controls.
  - Apply and maintain platform guardrails that ensure Power
    Platform solutions remain secure, compliant, scalable, and
    supportable.
  - Manage the application lifecycle (ALM), including solution
    promotion, versioning, release management, and change
    control.
  - Partner with Security, Compliance, and Enterprise
    Architecture teams to ensure adherence to enterprise
    technology standards.
  - Maintain the platform in a GxP-qualified state, ensuring
    compliance with validation requirements within regulated
    environments.
  - Maintain and update platform documentation, including System
    Administration SOPs, Use and Operation SOPs, and
    Configuration/Design Specifications (CDS).
  - Ensure all platform changes follow appropriate validation,
    documentation, audit readiness, and governance processes.
  - Design, develop, and support AI-first automation solutions
    using Microsoft Power Apps, Power Automate, and Copilot
    Studio.
  - Contribute to solution architecture decisions, recommending
    the optimal use of Power Apps, Power Automate, Copilot
    Studio, or hybrid solution patterns.
  - Develop production-grade Canvas Apps, Model-Driven Apps,
    Power Automate workflows, intelligent process automations,
    and Copilot Studio agents.
  - Lead prompt engineering and conversational design
    activities, including conversation topics, triggers,
    escalation paths, and AI interaction design.
  - Partner with business stakeholders to identify opportunities
    for AI-driven automation and implement solutions that
    deliver measurable business value.
  - Integrate Power Platform solutions with Microsoft 365,
    Dataverse, ServiceNow, Jira, enterprise APIs, and other
    business platforms.
  - Develop reusable templates, components, and development
    patterns that enable scalable solution delivery across the
    enterprise.
  - Ensure operational excellence through effective logging,
    monitoring, alerting, exception handling, and platform
    support.
  - Evaluate opportunities to extend automation capabilities
    through Robotic Process Automation (RPA) technologies,
    including UiPath.
  - Support enterprise-wide adoption of Microsoft Power Platform
    by contributing to enablement initiatives across the
    organization.
  - Contribute to adoption metrics and reporting, including
    active makers, automation usage, and business value
    delivered.
  - Develop and deliver structured training programs, onboarding
    pathways, workshops, and knowledge-sharing sessions.
  - Participate in Community of Practice activities while
    supporting office hours and advisory sessions for makers
    and citizen developers.
  - Provide architecture guidance, solution design reviews,
    production readiness reviews, and best-practice
    recommendations.
  - Enable a federated development model supported by strong
    central governance and secure development practices.
  - Monitor platform health, performance, adoption, usage
    trends, failures, and operational risks across AI
    solutions and automations.
  - Build dashboards using Power Platform analytics and Power BI
    to monitor adoption, engagement, operational performance,
    business impact, and risk.
  - Drive continuous improvement of platform governance,
    development standards, tooling, and operational processes.
  - Stay current with Microsoft's Power Platform and AI roadmap,
    evaluating new capabilities and recommending opportunities
    to enhance the enterprise platform.

  The key Moderna Mindsets you'll need to succeed in the role:

  We obsess over learning. We don’t have to be the smartest,
  we have to learn the fastest.

  We digitize everywhere possible using the power of code to
  maximize our impact on patients.

  Here’s What You’ll Need (Minimum Qualifications)

  - 5+ years of demonstrated experience as Microsoft Power
    Platform administrator and hands-on developer in an
    enterprise environment.
  - Deep expertise in Microsoft Power Platform, including Power
    Apps, Power Automate, and Copilot Studio.
  - Experience designing and developing enterprise-grade Power
    Apps (Canvas Apps and/or Model-Driven Apps).
  - Experience designing end-to-end Power Platform solutions
    that combine Power Apps, Power Automate, Copilot Studio,
    Microsoft 365, Dataverse, APIs, and enterprise systems.
  - Experience designing and delivering AI-driven automation
    solutions.
  - Experience integrating with enterprise systems via APIs or
    MCP servers.
  - Strong troubleshooting skills and ability to support
    production‑grade AI and automations.

  Here’s What You’ll Bring to the Table (Preferred
  Qualifications):

  - Experience with UiPath (development and/or administration).
  - Experience in regulated environments (e.g., pharma,
    healthcare, GxP, SOX).
  - Experience with scripting (PowerShell, Python) to complement
    automation workflows.
  - Power Platform certifications (PL‑400, PL-500, PL‑600,
    PL-200, PL-100, Copilot Studio‑related certifications).
  - Strong communication skills and comfort working within a
    centralized CoE supporting distributed teams.

  Pay & Benefits

  At Moderna, we believe that when you feel your best, you can
  do your best work.  That’s why our benefits and well-being
  resources are designed to support you—at work, at home, and
  everywhere in between.

  - Competitive healthcare, plus voluntary benefit programs to
    support your unique needs
  - A holistic approach to well-being with access to fitness,
    mindfulness, and mental health support
  - Family building benefits, including fertility, adoption, and
    surrogacy support
  - Generous paid time off, including vacation, bank holidays,
    volunteer days, sabbatical, global recharge days, and a
    discretionary year-end shutdown
  - Savings and investments to help you plan for the future
  - Location-specific perks and extras

  The benefits offered may vary depending on the nature of
  your employment with Moderna and the country where you work.

  About Moderna

  Since our founding in 2010, we have aspired to build the
  leading mRNA technology platform, the infrastructure to
  reimagine how medicines are created and delivered, and a
  world-class team. We believe in giving our people a platform
  to change medicine and an opportunity to change the world. 

  By living our mission, values, and mindsets every day, our
  people are the driving force behind our scientific progress
  and our culture. Together, we are creating a culture of
  belonging and building an organization that cares deeply for
  our patients, our employees, the environment, and our
  communities.

  We are proud to have been recognized as a Science Magazine
  Top Biopharma Employer, a Fast Company Best Workplace for
  Innovators, and a Great Place to Work in the U.S.

  As we build our company, we have always believed an in-
  person culture is critical to our success. Moderna champions
  the significant benefits of in-office collaboration by
  embracing a 70/30 work model. This 70% in-office structure
  helps to foster a culture rich in innovation, teamwork, and
  direct mentorship. Join us in shaping a world where every
  interaction is an opportunity to learn, contribute, and make
  a meaningful impact.

  If you want to make a difference and join a team that is
  changing the future of medicine, we invite you to visit
  modernatx.com/careers to learn more about our current
  opportunities.

  Moderna is a smoke-free, alcohol-free, and drug-free work
  environment.

  Moderna is a place where everyone can grow. If you meet the
  Basic Qualifications for the role and you would be excited
  to contribute to our mission every day, please apply!

  Moderna is committed to equal opportunity in employment and
  non-discrimination for all employees and qualified
  applicants without regard to a person's race, color, sex,
  gender identity or expression, age, religion, national
  origin, ancestry or citizenship, ethnicity, disability,
  military or protected veteran status, genetic information,
  sexual orientation, marital or familial status, or any other
  personal characteristic protected under applicable law. We
  consider qualified applicants regardless of criminal
  histories, consistent with legal requirements.

  We’re focused on attracting, retaining, developing, and
  advancing our employees. By cultivating a workplace that
  values diverse experiences, backgrounds, and ideas, we
  create an environment where every employee can contribute
  their best.

  Moderna is committed to offering reasonable accommodation or
  adjustments to qualified job applicants with disabilities.
  Any applicant requiring an accommodation or adjustment in
  connection with the hiring process and/or to perform the
  essential functions of the position for which the applicant
  has applied should contact the Accommodations and
  Adjustments team at leavesandaccommodations@modernatx.com.

