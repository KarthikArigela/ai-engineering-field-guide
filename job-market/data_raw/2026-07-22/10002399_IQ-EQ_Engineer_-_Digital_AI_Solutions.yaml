description: |
  Company Description

  ABOUT IQ-EQ

  We’re a leading Investor Services group offering end-to-end
  services in administration, accounting, reporting,
  regulatory and compliance needs of the investment sector
  worldwide.  We employ a global workforce of 6,500+ people
  across 24 jurisdictions and have assets under administration
  (AUA) exceeding US$857 billion. We work with 13 of the
  world’s top-15 private equity firms.

  Our services are underpinned by a Group-wide commitment to
  ESG and best-in-class technology including a global data
  platform and innovative proprietary tools supported by in-
  house experts.

  Above all, what makes us different is our people. Operating
  as trusted partners to our clients, we deliver intelligent
  solutions through a combination of technical expertise and
  strong relationships based on deep client understanding. 

  We’re driven by our Group purpose, to power people and
  possibilities.

  Job Description

  JOB DESCRIPTION: ENGINEER DIGITAL & AI SOLUTIONS Office:
  Hyderabad Department: Digital & AI Reports to: Technology
  Lead - Digital & AI Solutions

  - You'll collaborate with cross-functional teams to gather
    business requirements, identify technical solutions, and
    architect scalable digital & AI systems.
  - You'll design and develop applications, algorithms, and
    models using advanced AI techniques such as machine
    learning, NLP, computer vision, and predictive analytics.
  - You'll implement and optimize Python-based codebases with
    frameworks like TensorFlow, PyTorch, and scikit-learn,
    ensuring performance, reliability, and maintainability.
  - You'll test, debug, and troubleshoot digital and AI
    solutions, while mentoring junior engineers and
    contributing to continuous improvement of processes and
    tools.
  - You'll leverage big data and cloud platforms (AWS, Azure,
    GCP) with distributed frameworks (Hadoop, Spark), ensuring
    compliance, conducting cost-benefit analysis, and
    effectively communicating technical concepts to
    stakeholders.

  What we offer

  - Comprehensive remuneration: Competitive financial packages
    based upon market rates for your role, proportionate to
    your qualifications, level of experiences and skills
    profile
  - Pension Scheme: Generous employer contribution with the
    ability to increase employee contributions
  - Wellbeing: Additional social benefits such as medical
    insurance & life assurance, discounted gym memberships and
    the opportunity to engage with our local community
    via sports activities, charity programmes & environmental
    initiatives
  - Flexible working: We recognise the value of working flexibly
    and enable our employees to enjoy an excellent work-life
    blend
  - Support and development: We will ensure you have the right
    training, tools and development plan to grow and improve
    your skills every day.

  Qualifications

  Qualifications

  - You hold a bachelor’s or master’s degree in Computer
    Science, Engineering, or a related field, with 2+ years of
    proven software development experience focused on digital
    technologies and AI.
  - You are proficient in Python and frameworks such as
    TensorFlow, PyTorch, and scikit-learn, with strong
    knowledge of AI concepts including machine learning, deep
    learning, reinforcement learning, and natural language
    processing.
  - You have experience working with big data technologies,
    cloud platforms (AWS, Azure, GCP), and distributed
    computing frameworks like Hadoop and Spark.
  - You demonstrate solid software engineering principles,
    design patterns, and best practices, along with strong
    problem-solving skills, attention to detail, and the
    ability to deliver high-quality solutions on time and
    within budget.
  - You excel in communication and collaboration, can mentor
    junior engineers, clearly explain logic in Jupyter
    notebooks, and use analytical abilities to derive insights
    from public databases.

  Desired Criteria:

  - Systems Analysis Qualification
  - Experience working in Agile/Scrum methodologies.
  - Certifications in relevant technologies or methodologies
    (e.g., AWS Certified Solutions Architect, Microsoft
    Certified Azure AI Engineer).
  - • Experience of operating within a firm that shares some of
    the following features: -
    - Globally distributed teams
    - Financial Services
  - Fast-paced and rapidly evolving environment
  - Knowledge of or experience working in a Private Equity /
    Investor services industry

  Key competencies for position and level

  - Communicates Effectively
  - Effective Team Player
  - Demonstrates Resilient
  - Plans and Aligns
  - Organisation Savvy
  - Embodies our ABC values: Authentic, Bold, and Collaborative.

  Additional Information

  OUR COMMITMENT TO YOU AND THE ENVIRONMENT

  Sustainability is integral to our strategy and operations.
  Our sustainability depends on us building and maintaining
  long-term relationships with all our stakeholders –
  including our employees, clients, and local communities –
  while also reducing our impact on our natural environment.

  There is always more we can, and should do, to improve –
  whether in relation to our people, our clients, our planet,
  or our governance. Our ongoing success as a business depends
  on our sustainability and agility in a changing and
  challenging global landscape. We’re committed to fostering
  an inclusive, equitable and diverse culture for our people,
  led by our Diversity, Equity, and Inclusion steering
  committee.

  Our learning and development programmes and systems
  (including PowerU and MyCampus) enable us to invest in
  growing our employees’ careers, while our hybrid working
  approach supports our employees in achieving balance and
  flexibility while remaining connected to their colleagues.
  We want to empower our 6,500+ employees - from 94
  nationalities, across 24 countries - to each achieve their
  potential.  Through IQ-EQ Launchpad we support women
  managers launching their first fund, in an environment where
  only 15% of all private equity and venture capital firms are
  gender balanced.

  We’re committed to growing relationships with our clients
  and supporting them in achieving their objectives. We
  understand that our clients’ sustainability and success lead
  to our sustainability and success. We’re emotionally
  invested in our clients right from the beginning.
