description: |
  The next part of your journey is right around the corner —
  with The Standard.

  A genuine desire to make a difference in the lives of others
  is the foundation for everything we do. With a customer-
  first mindset and an intentional focus on building strong
  teams, we’ve been able to uphold our legacy of financial
  stability while investing in new, innovative technologies
  that support the needs of our customers. Our high-
  performance culture focused on operational excellence
  thrives thanks to remarkable people united by compassion and
  a customer-first commitment. Are you ready to make a
  difference?

  Job Summary

  The Standard is hiring an AI Software Engineer IV to design,
  build and ship full-stack features across our web platform
  for web-based AI products. As a senior individual
  contributor, you will solve complex problems end to end,
  from data model and API through to the user interface, while
  supporting the DevOps practices, cloud infrastructure and
  data platform integrations needed to run reliable production
  systems. You will set the technical direction for the
  systems you touch, raise the quality bar through code review
  and mentorship, and partner closely with product, design,
  data science, machine learning and engineering teams to
  deliver software that customers depend on.

  This is a fully remote role open to candidates based in the
  United States. We collaborate asynchronously and value clear
  written communication.

  Key Responsibilities:

  - Design and build full-stack features, taking ownership from
    technical design through implementation, testing,
    deployment and ongoing operation.
  - Develop responsive, accessible user interfaces and the
    backend services and APIs that power them.
  - Lead the technical design of medium-to-large projects and
    break them into clear, actionable work for the team.
  - Write well-tested, maintainable code and uphold engineering
    standards through thorough code review.
  - Improve the performance, reliability, scalability and
    operability of the systems you own, including cloud
    infrastructure, deployment workflows and reduction of
    operational toil. Mentor engineers, share knowledge and
    help grow the technical skills of the team.
  - Collaborate with product managers and designers to scope
    requirements and translate them into shippable solutions.
  - Participate in an on-call rotation and contribute to a
    strong culture of operational excellence.
  - Collaborate with Data Scientists and Machine Learning
    Engineers to make their models fast, accessible,
    transparent, and safe.
  - Support reliable integrations with Azure Databricks, DevOps
    tooling and related data platform services where needed.

  Skills and Background You’ll Need

  Education: A Bachelor’s degree in Software Engineering,
  Computer Science or Information Systems, or equivalent
  experience as a substitute, is required. At this level,
  graduate coursework may be desirable.

  Experience: 8+ years of professional software engineering
  experience building and operating production web
  applications.

  - Strong proficiency across the stack, including a modern
    frontend framework (preferably Angular) and a backend
    language (for example, Node.js or Python).
  - Strong skills in implementing Python API design patterns
    using frameworks like FastAPI or Flask.
  - Solid experience designing APIs and working with relational
    and non-relational databases and graph databases such as
    Neo4j.
  - Demonstrable experience in configuring and implementing
    Azure Application Gateway and API management solutions
    like Azure API Management or Kong Konnect.
  - Hands-on experience implementing and optimizing API
    applications for sub-second performance.
  - Experience in load testing REST API applications with tools
    like Apache JMeter or SOAPUI.
  - Experience in developing API applications to include
    package/dependency management tools (e.g., Poetry) and
    functional testing (e.g., Pytest, PyLint).
  - A track record of leading projects, making sound
    architectural decisions and delivering on time.
  - Experience with cloud infrastructure, DevOps practices and
    infrastructure management, preferably using Azure and
    Terraform.
  - Working knowledge of data engineering concepts, including
    Databricks, MLflow and production data
    pipelines.Experience with cloud WAF configuration
    (Imperva, Azure WAF or similar) and API security policies
    like OAuth2/OIDC, JWT.
  - Experience building and maintaining CI/CD pipelines and Git-
    based release workflows using Azure DevOps, GitHub
    Actions, ArgoCD or similar tools.
  - Working within an Agile delivery / DevOps methodology to
    deliver proof of concept and production implementation in
    iterative sprints.
  - Able to Work Independently and Collaborate with Product
    Owners, Data Scientists, Machine Learning Engineers and AI
    Engineers
  - Clear written and verbal communication, with the ability to
    work effectively in a distributed, asynchronous team.
    Strong problem solving and analytical skills.
  - A commitment to testing, code quality and continuous
    improvement.

  Preferred:

  - Experience with containerization and orchestration (Docker).
  - Familiarity with observability tooling, performance
    profiling and incident response.
  - Exposure to TypeScript, GraphQL or event-driven
    architectures.
  - Prior experience mentoring engineers or leading a small
    team.

  Key Behaviors of a Successful Candidate

  - Adaptability: Adapts quickly to competing demands and
    shifting priorities and modifies viewpoints and direction
    in light of new information.
  - Customer Focus: Develops positive internal and external
    customer relationships by consistently and efficiently
    delivering value.
  - Improvement Mindset: Sees old problems and status quo as
    opportunities to improve; identifies opportunities to
    improve team performance

  #LI-Remote

  Why Join The Standard?

  We have built an enduring legacy of stability, financial
  strength and exceptional customer service through the
  contributions of the service-oriented people who choose to
  work at The Standard. To ensure we can attract and retain
  the best talent, when you join The Standard you can expect:

  - A rich benefits package including medical, dental, vision
    and a 401(k) plan with matching company contributions
  - An annual incentive bonus plan
  - Generous paid time off including 11 holidays, 2 wellness
    days, and 8 volunteer hours annually — PTO increases with
    tenure
  - A supportive, responsive management approach and
    opportunities for career growth and advancement
  - Paid parental leave and adoption/surrogacy assistance
  - An employee giving program that double matches your
    donations to eligible nonprofits and schools

  In addition to the competitive salary range below, our
  employee-focused benefits support work-life balance. Learn
  more about working at The Standard.

  - Eligibility to participate in an incentive program is
    subject to the rules governing the program and plan. Any
    award depends on a variety of factors including individual
    and organizational performance.

  The actual compensation for this role will be based on a
  combination of education and experience, knowledge and
  skills, position budget, internal equity, and market data.

  Salary Range:

  $131,750.00 - $223,500.00

  Positions will be posted for at least 5 days from original
  posting date.

