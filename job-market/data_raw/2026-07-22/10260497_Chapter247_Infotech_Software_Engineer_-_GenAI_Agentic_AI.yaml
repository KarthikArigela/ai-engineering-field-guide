    RAG, and Agentic AI.
  - Integrate databases, vector search, and third-party APIs
    into scalable solutions.
  - Ensure secure, reliable, and production-ready AI systems
    with proper guardrails.
  - Collaborate with team members and contribute to technical
    discussions and solution design.
