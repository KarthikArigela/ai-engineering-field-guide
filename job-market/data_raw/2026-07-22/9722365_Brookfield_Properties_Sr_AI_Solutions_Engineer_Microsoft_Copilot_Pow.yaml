description: |
  Location

  Calgary - 4906 Richard Road SW

  Business

  At Brookfield Residential, a leading North American land
  developer and homebuilder for over 65 years, we have had one
  goal in mind – creating the best places to call home. From
  the development of award-winning, master-planned communities
  to the creation of well-designed homes, we are committed to
  cultivating exceptional life experiences for our customers,
  partners, employees, and members of the community. As part
  of Brookfield — one of the largest alternative asset
  managers in the world — we harness our resources to bring a
  fresh approach, unparalleled creativity, relentless
  innovation, and sound Sustainability practices to the
  planning, development, and management of buildings
  everywhere. From offices, retail spaces, and logistics
  facilities to multifamily residences, hospitality
  establishments, and mixed-use structures — we are
  reimagining real estate from the ground up.

  If you're ready to be a part of our team, we encourage you
  to apply.

  Job Description

  Overview:

  We are seeking a Sr AI Solutions Engineer for a 3-to-6-month
  contract to maintain continuity and momentum across
  enterprise AI initiatives during a planned leave period
  (existing vacancy).

  In this role, you will serve as the senior technical lead
  and AI solution development advisor for Brookfield
  Residential's AI program. Your responsibilities will include
  building solutions, development, targeted delivery support,
  and governance input across Microsoft Copilot Studio, Power
  Platform, M365 Copilot, Azure AI services, and related AI-
  enabled automation.

  This role is uniquely positioned to blend building,
  development, delivery, governance, and continuity support.
  You will translate complex business needs into scalable and
  supportable AI solutions, ensuring alignment with
  Brookfield’s enterprise guardrails. You will also
  collaborate closely with internal teams and vendors and
  support a seamless knowledge transfer at the end of the
  engagement.


  Key Responsibilities:

  - Act as the senior AI Solutions Engineer and technical lead
    for ongoing AI initiatives. Translate business
    requirements into solution builds spanning Copilot Studio
    agents, AI-enabled Power Automate workflows, Azure OpenAI
    / Azure AI services, and broader Power Platform solutions.
    Recommend architectural decisions, development patterns,
    security considerations, and integration approaches before
    development begins.
  - Support and guide steady-state delivery, improvement,
    troubleshooting, and optimization of Copilot Studio
    agents, with hands-on contribution where required. This
    may include AI Navigator, Bid Package Manager, myIT
    Assist, and similar internal use cases as priorities
    require. Maintain supporting Power Automate flows,
    Dataverse models, connectors, Teams/SharePoint
    integrations, and agent-related assets. Coordinate
    delivery priorities with the AI Huddle and internal
    owners.
  - Provide technical feasibility, guardrail, and integration
    input to Product & Engineering leadership, IT
    collaborators, and the AI Accelerator Council / Technology
    Task Force. Support AI governance activities including
    3-Zone DLP considerations for AI connectors, citizen-AI
    guardrails, emerging AI tool evaluations / POCs,
    responsible AI considerations, and Application Insights
    telemetry for Copilot Studio agents.
  - Coordinate and support the Citizen Development program,
    guiding internal users on guidelines for building secure
    and scalable solutions within the Power Platform and
    Copilot environments.
  - Support M365 Copilot pilot and early-adopter activities by
    offering technical feasibility and integration mentorship
    regarding M365 Copilot use cases, deployment and licensing
    questions, and custom Copilot agents/extensions across
    Teams and SharePoint. Serve as a technical advisor for
    M365 Copilot usage and extensibility questions.
  - Provide targeted advisory and support for AI-adjacent Power
    Platform and Azure integration workflows, including Power
    Automate cloud/desktop flows, Dataverse, Power Apps, Azure
    Logic Apps, app registrations, Key Vault, Application
    Insights, and related services where they connect to the
    AI program or address critical issues in business
    automation needs.
  - Maintain clear user documentation, solution diagrams,
    architecture artifacts, environment notes, runbooks,
    support paths, and design-decision records. Complete a
    structured knowledge transfer and handoff to designated
    internal owners before contract completion.

  What You'll Bring:

  - 10+ years of experience crafting and developing systems
    using programming concepts (Object-Oriented Design &
    Development).
  - 2+ years of hands-on experience in building and developing
    AI solutions, delivering enterprise-grade AI, automation,
    cloud, or Microsoft platform solutions, translating
    business requirements into scalable solutions.
  - Deep familiarity with enterprise AI solution patterns,
    including LLM-enabled workflows, AI agents, governance,
    and integration with business systems.
  - A solid understanding of the Microsoft AI stack is highly
    preferred, including Copilot Studio, Power Platform, M365
    Copilot, and Azure AI services.
  - Solid ability to bridge technical execution and business
    strategy.
  - Comfortable operating independently in a contract / interim
    role with limited ramp-up time.
  - Experience working in real estate, construction, corporate
    IT, internal application teams, or enterprise shared
    services is an asset.
  - Bachelor’s degree or equivalent experience in Computer
    Science, Management Information Systems, or a related
    field.
  - Relevant certifications in AI, cloud architecture, Microsoft
    Power Platform, Azure, or solution architecture are an
    asset.
  - Clear communicator who can explain technical concepts to
    both technical and non-technical collaborators.
  - Strong architectural judgment, especially around security,
    supportability, maintainability, and business risk.
  - Practical, delivery-oriented approach with the ability to
    prioritize urgent operational needs, advisory requests,
    and work that can be deferred.
  - Strong documentation and knowledge transferring the field.

  What We Offer:

  - Hybrid / Remote flexibility for this role. Calgary-based
    candidates are preferred for occasional in-person
    collaboration.
  - $60–$85 USD/hour or $131,000–$175,000 USD annually.
  - A culture based on our values of Passion, Integrity and
    Community!

  The above statements are intended to describe the general
  nature and level of work being performed. They are not
  intended to be an extensive list of all responsibilities,
  duties, and skills required.

  #LI-BT1

  #BRP

  We are proud to create a diverse environment and are proud
  to be an equal opportunity employer. We are grateful for
  your interest in this position, however, only candidates
  selected for pre-screening will be contacted.
