title: Associate AI Engineer
company: Levent Analytics
location: Raipur, IND
work_type: FULL_TIME
company_size: 4 Employees
description: |
  Most enterprise AI stops at the pilot. Levent Analytics is a
  boutique AI services firm built to take agentic and
  predictive AI into production: in the client's data, on
  their platforms, accountable to their outcomes. We are
  hiring an Associate AI Engineer in Raipur to build that
  production work for clients across the GCC and beyond.

  What you'll do

  - Ship your first production contribution inside 90 days: a
    working piece of a client agent or RAG pipeline, with
    senior review.
  - Build and test LLM integrations: prompts, retrieval, tool
    calling, and the evaluation harnesses that prove they
    work.
  - Contribute to our internal delivery accelerators, designed
    to compress month-long consulting delivery into sprints.
  - Write the tests, logging, and documentation that make AI
    systems operable, not just demoable.
  - Shadow client sessions from early on; by the one-year mark
    you own tasks across an accelerator or client component
    and ship with lighter review.

  Requirements

  What we're looking for

  - You write clean Python and are comfortable with Git and code
    review.
  - You can explain how embeddings, retrieval, agent
    orchestration, and LLM APIs fit together, at working
    depth.
  - You have built something real with an LLM (project,
    internship, or open source) and can walk us through your
    decisions.
  - Solid fundamentals: data structures, debugging, reading
    unfamiliar code.
  - Clear written and spoken communication; we serve
    international clients.

  Nice to have: exposure to Dataiku, Databricks, or any major
  cloud. Agent and RAG frameworks vary by engagement; you will
  pick up whatever the client runs.

  If you hit most of the must-haves, apply. We would rather
  talk to ten near-misses than miss one great fit.

  Benefits

  How we work

  You work directly with the senior engineers who own the
  client relationship, with no layers of management in
  between. Everything you ship gets structured senior review,
  with a defined capability path to the next level. We are a
  small firm with thin process and real client deadlines.
  Everyone ships production work, not decks. If you want high
  ownership and direct access to senior people, that is the
  offer; if you want big-company structure, this role will
  frustrate you.

  Package

  - Health insurance (self coverage)
  - 15 days annual leave minimum, increasing with level
  - Company laptop
  - Assistance finding accommodation if you relocate to Raipur
  - International travel when client work requires it

  Process

  - Screening call: background and fit.
  - Live coding session: Python and problem solving.
  - Case study round: how you approach a client-style AI
    problem.

  The full process typically completes within two weeks.

  Levent Analytics is an equal opportunity employer.
