description: |
  Opportunity

  Brunswick is on an exciting journey to harness the power of
  artificial intelligence and data science to enhance the way
  we work and the advice we provide to clients. As we continue
  to expand our AI capabilities, we are looking for an AI
  Engineer to join our growing team.

  In this role, you will be responsible for designing,
  developing, and maintaining AI-powered applications that
  deliver real value across the business. Working closely with
  our existing AI team, you will help build innovative
  solutions using modern AI technologies, with a particular
  focus on large language models (LLMs).

  This is an excellent opportunity for someone with hands-on
  experience developing and deploying AI applications who
  enjoys solving complex problems, working with a high degree
  of autonomy, and turning emerging technologies into
  practical, high-quality products.

  You will thrive in this role if you are curious, creative,
  and passionate about applying AI to solve real-world
  business challenges. You take pride in writing robust,
  maintainable code and enjoy collaborating with colleagues to
  continuously improve and expand our AI capabilities.

  About the Role

  Your main responsibilities will include:

  - Support, run, and iterate existing AI applications.
  - Design, develop, deploy, and maintain new AI applications
    which can be scaled across multiple business use cases,
    driving operational and commercial outcomes.
  - Trial and test solutions with end users to iterate and
    optimise them.
  - Research and analyse data sets using a variety of
    statistical and machine learning techniques.
  - Track and understand the evolving AI landscape.

  What We’re Looking For

  The successful candidate will be a highly professional,
  well-rounded individual with strong problem-solving skills,
  engineering expertise, strategic thinking, and excellent
  interpersonal skills. They will have a strong academic
  background complemented by an outstanding career to date.
  Standout candidates will demonstrate:

  - Experience building solutions with large language models
    (LLMs) and a deep understanding of the broader generative
    AI landscape.
  - Experience designing datasets, conducting model evaluations,
    and fine-tuning foundation models to improve task-specific
    performance.
  - Strong Python development skills, including experience
    writing production-quality code.
  - Experience with front-end technologies such as JavaScript,
    React, HTML, and CSS.
  - A solid understanding of statistics and machine learning
    fundamentals.
  - An undergraduate degree in a quantitative discipline, such
    as Mathematics or Computer Science, or equivalent relevant
    industry experience.
  - Excellent verbal and written communication skills, with the
    ability to communicate technical concepts effectively to
    both technical and non-technical audiences.
  - The ability to thrive in a fast-paced, evolving environment
    with changing priorities and an iterative, user-focused
    approach to development.
  - Curiosity, a strong sense of ownership, and the ability to
    work effectively both independently and collaboratively.
  - Previous experience in professional services would be
    advantageous.
  - Experience developing cloud applications on Microsoft Azure
    would be advantageous.
  - Experience with DevOps practices and tools (e.g. CI/CD, Git)
    would be desirable.
  - Knowledge of, or experience with, secure software
    development practices would be advantageous.

  Why Join Us

  Whether you are joining a client facing team, a core
  services team, or starting out on your professional career
  journey, joining Brunswick unlocks a range of employee
  benefits to support your financial future, health and
  wellness, family and community and continuous professional
  development.

  About Brunswick

  Brunswick is a global advisory firm. We help companies
  tackle high-stakes issues, navigate complex stakeholder
  relationships, and deliver high-impact outcomes.

  Our clients value our ability to anticipate, shape, and
  respond to the key players and forces in the financial and
  investment arena, regulatory and geopolitical universe, NGO
  community, workforce and beyond. They rely on us for deep
  experience, fresh perspectives and original thinking. So, in
  Brunswick you will find an exceptional range of experience
  and talent with a rich mix of backgrounds. From the
  beginning, we have prioritized attracting, developing, and
  retaining the best professionals in the industry, united by
  a culture of inclusivity, excellence, and intellectual
  curiosity.

  Founded in 1987 in London, the firm has organically grown to
  27 offices in 18 countries across the Americas, Europe,
  Middle East, Africa, Asia and Australia. We operate as a
  “one-firm firm” with no individual profit centers. This
  allows us to assemble fully integrated, bespoke teams for
  each client, able to draw on the full resources of Brunswick
  anywhere in the world.

  Brunswick is an equal opportunity employer.  All qualified
  applicants will be considered without regard to race,
  religion, color, national origin, gender, sexual
  orientation, age, disability, pregnancy, genetic
  information, or any other status protected by applicable
  law. Please read our Global Privacy Notice to understand how
  your data is managed.
