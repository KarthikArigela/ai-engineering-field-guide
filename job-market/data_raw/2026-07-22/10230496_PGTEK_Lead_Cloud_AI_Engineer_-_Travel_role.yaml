description: |
  Lead Cloud AI Engineer (Lead / Senior)

  Location: Various U.S. Federal Client Sites (Onsite) Travel:
  Yes – Travel to federal client sites as required Salary:
  $120,000 – $150,000 Clearance: Active TS/SCI

  About PGTEK

  PGTEK is a leading provider of enterprise IT modernization,
  cloud transformation, and infrastructure solutions
  supporting U.S. Federal Government agencies. As we expand
  our Google Cloud and AI practice, we're seeking a Lead Cloud
  AI Engineer to serve as the senior technical authority for
  enterprise cloud migration and AI platform modernization
  initiatives.

  This is a highly visible leadership role responsible for
  architecting secure, compliant Google Cloud environments
  while mentoring engineering teams and guiding customers
  through large-scale cloud transformation efforts.

  Position Summary

  As the Lead Cloud AI Engineer, you will own the technical
  strategy, architecture, and execution of Google Cloud and
  Gemini for Government deployments. You'll work directly with
  federal customers to design secure cloud solutions, lead
  complex migration initiatives, establish architectural
  standards, and ensure every deployment aligns with FedRAMP,
  DoD, and NIST compliance requirements.

  This role combines hands-on technical leadership with
  customer engagement, mentoring, and enterprise architecture.

  Responsibilities

  - Lead architecture and design for enterprise Google Cloud
    Platform (GCP) environments
  - Develop migration strategies for legacy, hybrid, and multi-
    cloud infrastructures
  - Design secure cloud architectures using Google Cloud Assured
    Workloads
  - Establish governance and architectural standards based on
    Google Cloud Well-Architected Framework
  - Serve as the primary technical advisor to federal customers
    and agency leadership
  - Lead cloud modernization initiatives from planning through
    implementation
  - Design secure IAM, resource hierarchy, networking, and
    encryption strategies
  - Architect solutions utilizing Cloud KMS, CMEK, VPC Service
    Controls, Organization Policies, and hierarchical
    firewalls
  - Drive FedRAMP authorization and Authority to Operate (ATO)
    efforts alongside compliance teams and 3PAOs
  - Lead infrastructure automation, CI/CD, deployment
    governance, and operational excellence initiatives
  - Oversee observability, monitoring, release management,
    penetration testing, and continuous compliance
  - Guide implementation of Gemini for Government, Google AI
    APIs, Model Garden, and enterprise AI solutions
  - Mentor Associate and Mid-Level Cloud Engineers while helping
    develop the organization's Google Cloud practice
  - Provide technical leadership throughout the full project
    lifecycle including planning, deployment, optimization,
    and ongoing support

  Requirements

  - Bachelor's degree in Computer Science, Computer Engineering,
    or a related STEM discipline
  - 5–8+ years of experience designing and leading enterprise
    cloud solutions
  - Extensive experience architecting and deploying Google Cloud
    Platform (GCP) environments
  - Strong background leading enterprise cloud migration
    initiatives
  - Deep understanding of Google Cloud Professional Cloud
    Architect domains
  - Experience implementing Google Cloud Well-Architected
    Framework best practices
  - Strong knowledge of NIST SP 800-53, RMF, and federal
    security compliance
  - Experience leading ATO efforts and working with federal
    agencies
  - Proven leadership experience managing technical teams and
    customer engagements
  - Excellent communication and presentation skills

  Preferred Qualifications

  - Experience supporting FedRAMP High, DoD IL4, IL5, or IL6
    environments
  - Experience with Gemini for Government and enterprise AI
    platforms
  - Knowledge of Google AI APIs, Agent Builder, and Model Garden
  - Experience with AI Hypercomputer, GPU, or TPU environments
  - Familiarity with Google Distributed Cloud (GDC) air-gapped
    environments
  - Strong software development lifecycle (SDLC) and DevSecOps
    experience
  - Experience with enterprise API management (Apigee)
  - Background in cloud financial management and migration
    planning

  Required Certifications

  - Google Cloud Certified – Professional Cloud Architect (PCA)
    (Required at time of hire)
  - Google Cloud Certified – Associate Cloud Engineer (ACE)
    (Required or expected foundational certification)

  Security Clearance

  - Active TS/SCI clearance - or eligibility to get one (meaning
    at least an active Top Secret).

  Benefits

  Our comprehensive benefits package for full-time salaried
  employees is effective immediately upon the start date.
  Benefits include comprehensive PPO medical coverage with
  access to a Health Savings Account (HSA) option, a vision
  plan, and dental insurance with the base dental plan option
  paid for by PGTEK. Life Insurance, Short and Long-Term
  disability, and Critical Illness insurance have premiums
  covered.  Additionally, PGTEK offers a matching 401(k) plan
  and a discount on pet insurance through ASPCA Pet Insurance.
  An Employee Assistance Program is available at no cost to
  all employees.  PGTEK offers a generous amount of PTO and
  Holidays, and an Education Assistance Program is available
  after 12 months of employment.

  ABOUT PGTEK

  PGTEK is a true consulting organization dedicated to helping
  clients achieve their business and technology objectives
  utilizing our decades of experience and business
  relationships. PGTEK invests in the educational advancements
  of our staff by providing the necessary resources to
  complete Professional and Business Certifications. Our
  company is our people, and we treat them like family.

  EOE, including disability/veterans
