description: |
  About Chubb

  Chubb is a world leader in insurance. With operations in 54
  countries and territories, Chubb provides commercial and
  personal property and casualty insurance, personal accident
  and supplemental health insurance, reinsurance and life
  insurance to a diverse group of clients. The company is
  defined by its extensive product and service offerings,
  broad distribution capabilities, exceptional financial
  strength and local operations globally. Parent company Chubb
  Limited is listed on the New York Stock Exchange (NYSE: CB)
  and is a component of the S&P 500 index. Chubb employs
  approximately 40,000 people worldwide. Additional
  information can be found at: www.chubb.com.

  About Chubb India

  At Chubb India, we are on an exciting journey of digital
  transformation driven by a commitment to engineering
  excellence and analytics. We are proud to share that we have
  been officially certified as a Great Place to Work® for the
  third consecutive year, a reflection of the culture at Chubb
  where we believe in fostering an environment where everyone
  can thrive, innovate, and grow

  With a team of over 2500 talented professionals, we
  encourage a start-up mindset that promotes collaboration,
  diverse perspectives, and a solution-driven attitude. We are
  dedicated to building expertise in engineering, analytics,
  and automation, empowering our teams to excel in a dynamic
  digital landscape.

  We offer an environment where you will be part of an
  organization that is dedicated to solving real-world
  challenges in the insurance industry. Together, we will work
  to shape the future through innovation and continuous
  learning.

  Position Details

  - Job Title: Lead Engineer (.Net FSD- ASP .Net Core + Angular
    + API Integration + Cloud + AI)
  - Function/Department: Technology
  - Location: Hyderabad
  - Employment Type: Full Time
  - Reports To:  Madhuri Tadepalli

  KEY OBJECTIVE

  We are looking for a visionary Web Chapter Lead to own and
  drive the end-to-end website strategy across our digital
  portfolio. You will lead the architecture, engineering
  standards, and AI-augmented delivery of 50+ websites and a
  mission-critical Agent Portal, setting the direction for how
  we build, scale, and evolve our web presence. This is a
  senior leadership role at the intersection of engineering
  excellence, platform strategy, and AI-driven innovation —
  built on our core stack of Angular and .NET middleware. The
  role demands someone who can zoom out to set multi-year
  direction and zoom in to unblock teams, challenge existing
  designs, and cultivate a high-performing engineering
  chapter.

  MAJOR DUTIES AND RESPONSIBILITIES

  Strategy & Leadership

  - Define and own the web chapter's multi-year technology
    roadmap, aligning with business goals across all digital
    touchpoints.
  - Champion a platform-thinking mindset — treating websites and
    the Agent Portal as products, not projects.
  - Partner with product, design, marketing, and IT leadership
    to translate business needs into scalable web solutions.
  - Build and nurture a high-performing chapter of web
    engineers, setting standards for craft, velocity, and
    quality.

  AI-Augmented Web Development

  - Lead the adoption of AI-assisted development practices
    (Claude) to accelerate delivery across the Angular/.NET
    portfolio.
  - Evaluate and integrate AI tools for content generation,
    personalisation, intelligent search, and automated
    testing.
  - Establish guardrails and best practices for responsible AI
    usage within the web development lifecycle.
  - Explore AI-generated component scaffolding and automated
    migration tooling to modernise legacy Angular modules at
    scale.
  - Share learnings, establish team-wide AI best practices, and
    define guardrails for responsible AI use in development.

  Monorepo & Platform Architecture

  - Architect and govern a scalable monorepo strategy (Nx
    recommended) to unify the 50+ Angular site portfolio under
    a shared codebase, component library, and CI/CD pipeline.
  - Define standards for shared Angular libraries, design
    tokens, CMS integrations, and deployment pipelines.
  - Own Angular workspace governance — enforcing module
    boundaries, Nx project graph discipline, and shared vs.
    app-specific library management.
  - Drive consistency without sacrificing the autonomy of
    individual site teams.

  .NET Middleware Ownership

  - Define standards and patterns for the .NET middleware layer
    that powers API aggregation, authentication, content
    delivery, and backend-for-frontend (BFF) logic.
  - Partner with backend teams to ensure the middleware is
    performant, secure, and easy to extend as new sites
    onboard.
  - Champion API contract discipline between Angular frontends
    and .NET services.

  Agent Portal Ownership

  - Own the technical strategy and evolution of the Agent Portal
    — a high-traffic, mission-critical Angular application for
    internal and external agents.
  - Collaborate with stakeholders to define portal capabilities,
    integrations, and self-service features.
  - Ensure the portal meets enterprise-grade standards for
    performance, security, and accessibility.

  Engineering Excellence

  - Set and enforce engineering standards: code quality,
    unit/e2e testing (Jest, Cypress/Playwright),
    observability, accessibility (WCAG 2.1 AA), and
    performance (Core Web Vitals).
  - Drive Angular best practices at scale: standalone
    components, signals-based state management, lazy loading,
    and micro-frontend patterns via Module Federation where
    applicable.
  - Lead shift-left culture on security, performance, and SEO
    from day one of development.
  - Produce architecture decision records (ADRs) to document
    significant technical decisions, rationale, and
    alternatives considered.
  - Identify technical debt proactively and advocate for its
    resolution alongside feature delivery, articulating the
    business risk of deferral.
  - Mentor senior, mid-level, and junior engineers on
    architectural principles, design patterns, and engineering
    best practices.

  EXPERIENCE

  Must-Have

  - 12+ years of experience in web engineering, with at least 3
    years in a technical leadership or chapter/guild lead
    role.
  - Expert-level Angular experience in an enterprise, multi-site
    context — including workspace architecture, shared
    libraries, and upgrade management.
  - Hands-on experience with .NET middleware (ASP.NET Core) in a
    BFF or API gateway pattern serving Angular frontends.
  - Proven experience managing a large-scale multi-site
    portfolio (30+ sites).
  - Strong grasp of monorepo tooling — Nx strongly preferred —
    including project graph, affected builds, and code
    generation.
  - Practical experience integrating AI tools (Claude) into
    engineering workflows and delivery pipelines.
  - Experience leading or architecting a portal or platform
    product (agent, customer, or employee-facing).
  - Track record of driving cross-functional alignment between
    engineering, product, and business stakeholders.
  - Outstanding communication, presentation abilities and
    teamwork skills; fluent in English both written and
    spoken.
  - Ability to work autonomously, well organised, pragmatic and
    open minded; strong decision-making and judgement skills.

  Strong Advantage

  - Experience in insurance, financial services, or B2B
    enterprise environments.
  - Familiarity with headless CMS platforms integrated with
    Angular (Contentful, Sitecore, Magnolia).
  - Knowledge of Angular Universal / SSR and its trade-offs for
    SEO-heavy marketing sites.
  - Experience with Module Federation for micro-frontend
    architecture across a large Angular portfolio.
  - .NET performance tuning, middleware caching strategies, and
    API security patterns.
  - Exposure to design system governance and Angular component
    library ownership (e.g., Angular Material or custom).
  - Experience with matrix organization and business projects
    with multi-disciplinary teams.

  Qualifications

  - A recognized degree in Computer Science, Software
    Engineering, or similar technical field of study, or
    equivalent practical experience.
  - Overall 10+ years of experience in web/software development
    with progressive technical leadership responsibility.
  - Deep knowledge of Angular (latest LTS) and ASP.NET Core
    (.NET 8+) in enterprise environments.
  - Microsoft Azure certification (AZ-204 Developer or AZ-305
    Architect) is a strong advantage.
  - Nx / monorepo certification or demonstrable expert-level
    practical experience is an advantage.

  Desired Candidate Profile

  - Demonstrated ability to clearly articulate and implement
    solutions for complex multi-repository (multi-repo)
    architectures, including scalability, maintainability, and
    collaboration considerations.
  - Strong hands-on experience and/or in-depth knowledge of Web
    SEO, Google Tag Manager (GTM), and web analytics best
    practices.
  - Proven capability to design and deliver cross-country/global
    web applications, with a strong understanding of front-end
    architecture, localization, performance, and user
    experience considerations.
  - Ability to provide accurate, scalable, and well-structured
    front-end solutions for complex business and technical
    challenges.

  What We Are Looking For

  We are seeking a candidate who can take ownership of the
  overall web strategy, drive architectural decisions, and
  effectively solve complex web platform challenges. The ideal
  candidate should possess strong expertise in multi-repo
  environments, SEO and tagging frameworks, and global
  application development, enabling them to confidently
  address similar business and technical problems encountered
  by our team.

  WHAT SUCCESS LOOKS LIKE (FIRST 12 MONTHS)

  Milestone

  Target

  Nx monorepo foundation established

  Month 3

  Chapter-wide Angular + .NET standards published

  Month 3

  AI tooling (Claude) adopted by 80%+ of chapter

  Month 4

  Agent Portal v2 roadmap delivered

  Month 6

  All 50+ sites on unified CI/CD pipeline

  Month 9

  Core Web Vitals green across top 20 sites

  Month 12

