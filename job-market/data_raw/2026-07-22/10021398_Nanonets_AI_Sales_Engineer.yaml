  Learn more about us here:

  Youtube

  Hugging Face

  Nanonets Research

  We’re on a mission to hire the very best and are committed
  to creating exceptional employee experiences where everyone
  is respected and has access to equal opportunity.

  About the role

  We’re looking for a technically strong, customer-facing
  problem solver to bridge product, engineering, and go-to-
  market teams. In this role, you’ll support the sales process
  by building tailored demos, validating technical
  requirements, and translating customer needs into practical
  workflows and solutions. You’ll work closely with Sales,
  Product, and Customer Success to ensure a smooth journey
  from discovery to onboarding, while also prototyping quick
  solutions to accelerate deal cycles.

  What You’ll Do

  - Build and customize high-impact customer demos by setting up
    tailored environments and workflows aligned to each
    prospect’s use case, including configuring agents,
    integrations, and realistic sample data.
  - Partner closely with Sales on customer-facing calls to
    showcase technical capabilities, answer implementation
    questions, and translate product features into clear,
    customer-specific workflows and ROI narratives.
  - Drive technical validation during discovery by deeply
    understanding customer requirements, assessing
    feasibility, and evaluating integration needs across
    systems such as EHRs, payer portals, telephony platforms,
    and APIs.
  - Proactively identify edge cases, potential blockers, and any
    custom work required early in the sales cycle to ensure
    smooth downstream execution.
  - Support activation and onboarding by collaborating with
    Activation/Customer Success and Product teams to deploy
    custom agents, configure workflows, fine-tune prompts, and
    assist with initial QA/UAT.
  - Own rapid prototyping efforts by building lightweight
    workflows or custom solutions that help accelerate deal
    cycles and bridge gaps until fully productised features
    are available.

  Required Qualifications -

  - B.E/B.Tech or from a Tier 1 school.
  - Minimum 2 years in a technical role.

  Need to Have:

  - Python
  - Relational Database (any major DB)
  - Understanding of APIs
  - Git version control
  - Excellent written & verbal communication skills

  Good to Have:

  - Experience with React, NodeJS, Golang, Cassandra,
    Kubernetes, Docker
  - Exceptional verbal and written communication skills,
    including the ability to work with technical and non-
    technical audiences; as well as communicate effectively to
    individual contributors, management, and executive
    leadership.
  - Strong communications skills, with the distinctive ability
    to empower and influence people without authority or a
    direct reporting relationship.
