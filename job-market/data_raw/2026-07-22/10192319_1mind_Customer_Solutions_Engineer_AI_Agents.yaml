description: |
  Customer Solutions Engineer, AI Agents

  This is a fully remote opportunity and can be worked from
  any location in the United States.

  About Us

  1mind is building the next generation of revenue teams.

  We are creating a new category of enterprise software:
  Autonomous Customer Experience. Our platform deploys
  Superhumans, go-to-market teammates with a face, a voice,
  and a GTM brain that serve the buyer across the entire
  journey with one continuous memory. They engage, demo,
  onboard, and support in the moments no company could ever
  staff, so the handoffs disappear and growth stops leaking.

  Join us as we define the category and build the platform
  that powers the next generation of revenue teams. When the
  buyer wins, the company wins. Every1 Wins.

  About the Role

  As an Agent Architect at 1mind, you are the master
  orchestrator of our AI Superhumans. You don’t just "onboard"
  customers; you design the digital consciousness and
  operational framework that allows our AI to integrate
  seamlessly into a customer’s ecosystem.

  This is a hybrid role requiring a key blend of technical
  engineering, systems thinking, and consultative leadership.
  You will be the primary technical guide for our customers,
  taking them from a conceptual vision to a fully activated,
  high-performing AI workforce. You will map complex
  workflows, configure intricate agent behaviors, and ensure
  our Superhumans are transformative team members for our
  clients.

  What You’ll Do

  - Architect Superhuman Activation: Lead the technical
    discovery and "blueprint" phase for new customers, mapping
    their existing business systems to our AI framework
  - System Mapping & Integration: Design and implement the data
    flows between 1mind agents and client tech stacks (CRMs,
    MAPs, APIs, and proprietary databases)
  - Experiential Configuration: Fine-tune Superhuman
    experiential elements such as visualizations, logic gates,
    and response triggers
  - Customer Consultation: Serve as the technical face of the
    services team, guiding stakeholders through the activation
    journey and translating complex technical hurdles into
    clear, actionable outcomes
  - Quality Assurance & Optimization: Conduct rigorous testing
    of agent behaviors pre & post-deployment to ensure peak
    performance and reliability
  - Feedback Loop: Partner with Product and Engineering teams to
    advocate for new features and platform enhancements based
    on real-world activation challenges

  What You'll Bring

  - 3 - 5+ years in a technical, customer-facing role (e.g.,
    Solutions Architect, Implementation Engineer, or Technical
    Account Manager) within a SaaS environment
  - Proven track record of system integration: You should be
    comfortable working with REST APIs, webhooks, and
    middleware
  - Background in Workflow Design: Experience mapping complex
    business processes using tools like LucidChart, Miro, or
    Visio
  - Client Management: Experience managing high-stakes projects
    for enterprise-level stakeholders, specifically during the
    "onboarding" or "activation" lifecycle

  What Will Help You Thrive

  - The "Architect" Mindset: You enjoy zooming out to see the
    big picture of a system, but you have the discipline to
    zoom in and fix a broken line of logic
  - High Emotional Intelligence: You can read a room and pivot
    your communication style from "deeply technical" for
    developers to "value-driven" for executive stakeholders
  - Adaptability: You are excited by the "blank canvas" of AI
    and aren't afraid to build the playbook as you go in a
    fast-evolving industry
  - Relentless Curiosity: You want to understand the "why"
    behind every customer request to build a better "how."

  Preferred Skills

  - AI/ML Literacy: Familiarity with LLM prompt engineering,
    vector databases, or natural language processing (NLP)
    concepts
  - Technical Proficiency: Knowledge of Python, JavaScript, or
    SQL is a major plus for troubleshooting integrations
  - Industry Knowledge: Experience in CX (Customer Experience)
    or Digital Transformation sectors
  - Project Management: Proficiency with tools like Asana, Jira,
    or Monday.com to keep multi-phase activations on track

  Why Join Us

  - Be at the forefront of AI-powered GTM operations
  - Shape the future of how humans and AI collaborate in high-
    stakes business environments
  - Work alongside a team of builders at the forefront of AI,
    product design, and GTM innovation
  - Design for a product that lives at the intersection of
    visual design, voice, motion, and intelligence
  - Remote-first, fast-moving culture with ownership, autonomy,
    and impact from day one
  - Expand your network of Superhumans!

  1mind's total compensation package is designed to be
  competitive and includes base salary, equity, and a full
  range of benefits and perks. Final compensation will depend
  on factors such as your skills, experience, qualifications,
  and location, and will be determined during the interview
  process. The hiring manager will share more details about
  the full compensation package and benefits as you move
  through the process.

  [Please note that all legitimate communication from 1mind
  will come only from email addresses ending in @1mind.com. We
  will never ask for payment, financial information, or
  personal details outside of our official application
  process. If you receive a suspicious message, please
  disregard it and alert us at careers@1mind.com]

  We may use artificial intelligence (AI) tools to support
  parts of the hiring process, such as reviewing applications,
  analyzing resumes, notetaking, or summarizing responses.
  These tools assist our recruitment team but do not replace
  human judgment - all hiring decisions are made by people. If
  you would like more information about how your data is
  processed or prefer to opt out of any AI-assisted tools,
  please let your recruiter know. Opting out will not impact
  your experience or consideration.
