description: |
  About this role: Wells Fargo is seeking a senior software
  engineer In this role, you will:

  - Lead moderately complex initiatives and deliverables within
    technical domain environments
  - Contribute to large scale planning of strategies
  - Design, code, test, debug, and document for projects and
    programs associated with technology domain, including
    upgrades and deployments
  - Review moderately complex technical challenges that require
    an in-depth evaluation of technologies and procedures
  - Resolve moderately complex issues and lead a team to meet
    existing client needs or potential new clients needs while
    leveraging solid understanding of the function, policies,
    procedures, or compliance requirements
  - Collaborate and consult with peers, colleagues, and mid-
    level managers to resolve technical challenges and achieve
    goals
  - Lead projects and act as an escalation point, provide
    guidance and direction to less experienced staff

  Required Qualifications:

  - 4+ years of Software Engineering experience, or equivalent
    demonstrated through one or a combination of the
    following: work experience, training, military experience,
    education

  Desired Qualifications:

  - 4+ years of hands-on experience in building application
    using Java, Spring framework and Spring Boot
  - Strong experience in designing and building microservices/
    web services.
  - Experience in Front end development experience with ReactJS
    or Angular JavaScript, NodeJS
  - Familiarity with MongoDB, including querying, data
    validation, and understanding of document schemas.
  - Experience in the payments domain with working knowledge of
    Wires/SWIFT, and ISO 20022 message structures.
  - Familiarity with ElasticSearch, including indexing concepts,
    search/query validation, and interpreting results.
  - Familiarity with GenAI tools such as GitHub Copilot, Agentic
    AI workflows, and LLM based test generation.
  - Knowledge on messaging service like Kafka, Solace, etc.
  - Experience in working on relation database like Oracle, MS
    SQL Server, etc
  - Knowledge on caching solutions like Redis, Ignite, Coherence
  - Working experience in cloud environment like PCF/OCP/Azure/
    GCP
  - Experience with CI/CD technologies such as Jenkins, GitHub,
    Artifactory, Sonar etc.
  - Experience with Agile development methodologies such as
    SCRUM
  - Excellent organizational, verbal, and written communication
    skills

  Job Expectations:

  - We are open for both the locations - Hyderabad or Bangalore
    and will be required to work in the office as per
    organizations In Office Adherence / Return To Office (RTO)
  - Comfortable working in an Agile software delivery
    environment and desire to collaborate and work closely
    with cross-functional teams
  - Working closely with multiple technology teams to understand
    their requirements and deliver solutions.
  - Learning, adapting and implementing new concepts,
    technologies and improvements.
  - Strong Technical Leadership & Engineering solution
    development- Provide expertise, direction, and assistance
    to junior engineers
  - Experience of cloud migration of applications and Azure/GCP
    certification will be an added advantage.
  - Evaluation of latest tools and technology and onboarding
    them to improve productivity.
  - Technology Mentoring to meet the overall Efficiency &
    Effectiveness objectives of the organization - This
    includes coaching junior engineers and providing technical
    design and architecture guidance for initiatives.

