title: "Senior Engineer – AI & Workplace Enablement"
company: dunnhumby
location: London, GBR
work_type: FULL_TIME
company_size: 4400 Employees
description: |
  dunnhumby is the global leader in Customer Data Science,
  partnering with the world’s most ambitious retailers and
  brands to put the customer at the heart of every decision.
  We combine deep insight, advanced technology, and close
  collaboration to help our clients grow, innovate, and
  deliver measurable value for their customers.

  dunnhumby employs nearly 2,500 experts in offices throughout
  Europe, Asia, Africa, and the Americas working for
  transformative, iconic brands such as Tesco, Coca-Cola,
  Nestlé, Unilever and Metro.



  We are seeking a hands-on Senior Engineer to modernise our
  digital workplace through automation, AI-enabled solutions
  and scalable engineering practices. This role focuses on
  simplifying operations, improving user experience and
  driving measurable value across Microsoft 365 and endpoint
  ecosystems.

  Key Responsibilities

  Microsoft 365 E5 Full-Stack Service

  - Own and continuously improve the Microsoft 365 E5 service
    stack across Exchange Online, SharePoint Online, Microsoft
    Teams, OneDrive, Entra ID, Intune, Defender, Purview and
    Power Platform services

  - Act as a full-stack Microsoft 365 engineer, translating
    business requirements into secure, scalable and
    supportable workplace technology solutions.

  - Design, configure and support identity, access and
    governance controls across Entra ID, Conditional Access,
    MFA, privileged access, lifecycle management and group-
    based access models.

  - Manage endpoint and device services across Intune, Windows
    Autopilot, Windows 11, macOS, application deployment,
    configuration profiles, compliance policies and device
    lifecycle standards.

  - Support Microsoft Defender capabilities across endpoint
    security, vulnerability management, attack surface
    reduction, device compliance and security operations
    integration.

  - Drive Microsoft Purview and compliance capabilities,
    including information protection, retention, data loss
    prevention, sensitivity labels, eDiscovery readiness and
    audit controls.

  - Optimise collaboration and communication services across
    Teams, SharePoint, OneDrive, Exchange Online, Teams Rooms
    and meeting room technology to improve employee
    experience.

  - Develop automation, reporting and operational controls using
    PowerShell, Microsoft Graph, Power Platform, Azure
    Automation, APIs and Infrastructure as Code practices.

  - Provide third-line engineering support, root cause analysis,
    service improvement and technical leadership across the
    Microsoft 365 E5 workplace estate.



  Copilot & AI Enablement Responsibilities

  - Copilot adoption: Drive Microsoft 365 Copilot adoption
    working with business teams to identify use cases, improve
    productivity and embed AI-enabled workflows.

  - Copilot Studio agents: Build, manage and improve Copilot
    Studio agents for business workflows, including API
    integrations and reusable automation patterns.

  - AI governance: Ensure AI solutions align with enterprise
    standards, security requirements, data grounding
    principles, responsible AI practices and compliance
    expectations.

  - Reporting and cost controls: Build Power BI dashboards and
    provide actionable insights across Copilot adoption, agent
    usage, AI token consumption, platform value and cost
    controls.

  - Training and enablement: Grow the AI champions community,
    deliver monthly lunch-and-learn sessions, develop prompt
    frameworks and support wider adoption of Copilot features.

  Skills & Experience

  - Microsoft 365 E5: 7 to 8 years of strong experience across
    the Microsoft 365 ecosystem, including Exchange Online,
    SharePoint Online, Microsoft Teams, OneDrive, Entra ID,
    Intune and core E5 services.

  - Endpoint management: Strong experience managing Windows 11,
    macOS, Kandji. Intune, Autopilot, application deployment,
    configuration policies and device compliance

  - Automation and engineering: pro-level scripting, automation,
    application packaging and repeatable engineering
    practices, with the ability to simplify manual processes
    and improve operational consistency.

  - AI and Copilot: Strong experience with Microsoft 365
    Copilot, Copilot Studio, AI solution design, deployment,
    monitoring and business adoption, including exposure to
    broader AI vendor platforms.

  - DevOps and delivery: Experience working with DevOps
    environments, CI/CD pipelines, controlled release
    practices and code-led configuration management.

  - Security and compliance: Good grounding in endpoint
    security, patching, vulnerability management, compliance
    controls and Microsoft Purview capabilities.

  - Stakeholder engagement: Strong communication skills, with
    the ability to work confidently with technical and non-
    technical audiences and maintain a clear delivery mindset.

  Preferred Certifications

  - AZ-104 – Azure Administrator Associate
  - MD-102 – Endpoint Administrator
  - MS-102 – Microsoft 365 Administrator
  - SC-200 / SC-300 – Security & Identity

  What you can expect from us

  We won’t just meet your expectations. We’ll defy them. So
  you’ll enjoy the comprehensive rewards package you’d expect
  from a leading technology company. But also, a degree of
  personal flexibility you might not expect.  Plus, thoughtful
  perks, like flexible working hours and your birthday off.

  You’ll also benefit from an investment in cutting-edge
  technology that reflects our global ambition. But with a
  nimble, small-business feel that gives you the freedom to
  play, experiment and learn.

  And we don’t just talk about diversity and inclusion. We
  live it every day – with thriving networks including dh
  Gender Equality Network, dh Proud, dh Family, dh One, dh
  Enabled and dh Thrive as the living proof.  We want everyone
  to have the opportunity to shine and perform at your best
  throughout our recruitment process. Please let us know how
  we can make this process work best for you.

  Our approach to Flexible Working

  At dunnhumby, we value and respect difference and are
  committed to building an inclusive culture by creating an
  environment where you can balance a successful career with
  your commitments and interests outside of work.

  We believe that you will do your best at work if you have a
  work / life balance. Some roles lend themselves to flexible
  options more than others, so if this is important to you
  please raise this with your recruiter, as we are open to
  discussing agile working opportunities during the hiring
  process.

