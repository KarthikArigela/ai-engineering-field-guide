description: |
  At FMX Services, LLC, we are looking for an experienced AI
  Engineer to join our dynamic team in the Fenics UST
  Development department. In this role, you will play a
  crucial part in designing and building AI-powered
  applications that support our rates and derivatives exchange
  business. Your expertise will be instrumental in developing
  agentic AI workflows, evaluating LLM-powered systems, and
  contributing to our technical strategy and architectural
  decisions. As an AI Engineer, you will have the opportunity
  to mentor other engineers, raise the team's AI engineering
  capabilities, and stay at the forefront of advancements in
  the field.

  Responsibilities

  - Design, build, and maintain production-grade AI applications
    for FMX's exchange business.
  - Develop agentic AI workflows utilizing LLMs, tool use,
    planning, and structured outputs.
  - Architect reliable AI application patterns with human-in-
    the-loop controls and monitoring.
  - Evaluate LLM-powered systems using quantitative and
    qualitative methods, including benchmark design and red-
    team testing.
  - Analyze model behavior, identify failure modes, and
    implement improvements for accuracy and reliability.
  - Build and integrate APIs, data pipelines, and vector
    databases to support AI application development.
  - Apply software engineering best practices, including clean
    architecture and automated testing.
  - Partner with cross-functional teams to translate business
    needs into technical designs.
  - Contribute to technical strategy and architectural decisions
    for AI platforms and reusable components.
  - Mentor other engineers and help raise the team's AI
    engineering capabilities.

  Qualifications

  - Bachelor's degree in computer science, machine learning, or
    a related technical field.
  - 5+ years of professional software engineering experience,
    including production systems.
  - 2+ years of hands-on experience developing AI or LLM-powered
    applications.
  - Demonstrated experience building agentic AI systems,
    including tool-using agents and multi-step workflows.
  - Strong programming skills in C++ and Python, with a focus on
    writing production-quality code.
  - Experience with modern LLM development patterns, such as
    prompt engineering and structured outputs.
  - Practical understanding of LLM failure modes and mitigation
    strategies.
  - Experience designing evaluation frameworks for AI
    applications, including test datasets and scoring methods.
  - Hands-on experience with APIs, microservices, and cloud
    deployment.
  - Strong understanding of security, privacy, and responsible
    AI considerations.

  Compensation Expectations: $300,000  - $350,000 Total

