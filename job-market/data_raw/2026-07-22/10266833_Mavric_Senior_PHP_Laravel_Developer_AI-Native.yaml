title: Senior PHP Laravel Developer (AI-Native)
company: Mavric
location: USA
remote: true
work_type: FULL_TIME
description: |
  Role Overview

  We are looking for a Senior PHP Laravel Developer who goes
  beyond traditional backend development and operates as an
  AI-native engineer. This role requires hands-on experience
  in building intelligent systems, AI agents, and automated
  workflows integrated into real-world products.

  You should be comfortable designing systems where AI is not
  an add-on, but a core part of the architecture.

  Key Responsibilities

  Backend Development

  - Design, develop, and maintain scalable applications using
    PHP and Laravel
  - Build clean, modular, and high-performance APIs
  - Optimize database queries, system performance, and
    application scalability
  - Lead backend architecture decisions and enforce best
    practices

  AI-Native Development

  - Design and build AI-powered features using LLMs (OpenAI,
    Claude, etc.)
  - Develop AI agents capable of task execution, reasoning, and
    workflow automation
  - Build and manage prompt pipelines, memory handling, and tool
    integrations
  - Integrate AI services into Laravel-based systems via APIs
    and SDKs
  - Design intelligent workflows using tools like n8n or similar
    automation platforms
  - Work with vector databases and embeddings for semantic
    search and retrieval

  AI Workflow Automation

  - Build end-to-end AI workflows for business use cases (e.g.,
    recruitment, sales, support)
  - Automate decision-making pipelines using AI agents
  - Integrate third-party tools (Slack, Notion, CRMs, etc.) into
    AI workflows
  - Monitor and improve AI output quality and reliability

  System Design

  - Architect systems combining traditional backend + AI layers
  - Design event-driven and microservices-based systems where
    needed
  - Ensure security, scalability, and maintainability of AI-
    integrated systems

  Collaboration

  - Work closely with product, data, and business teams to
    identify AI opportunities
  - Mentor junior developers and drive engineering standards
  - Stay updated with evolving AI tools and frameworks

  Required Skills & Experience

  Core Experience

  - 7+ years of professional experience in PHP development
  - Strong expertise in Laravel framework like Livewire.
  - Solid understanding of REST APIs, microservices, and system
    design
  - Experience with MySQL/PostgreSQL and query optimization

  AI-Native Capabilities (Must-Have)

  - Hands-on experience with LLM APIs (OpenAI, Anthropic, etc.)
  - Experience building AI agents or autonomous workflows
  - Strong understanding of:
    - Prompt engineering
    - Context management and token optimization
    - Function calling / tool usage in LLMs
  - Experience with vector databases (Pinecone, Weaviate, or
    similar)
  - Understanding of embeddings and semantic search

  Automation & Integration

  - Experience with workflow automation tools (n8n, Zapier,
    Make, etc.)
  - Ability to connect multiple systems into a unified AI-driven
    workflow
  - Experience integrating external APIs and SaaS tools

  Dev Practices

  - Strong knowledge of Git, CI/CD pipelines
  - Experience with Docker or containerization is a plus
  - Familiarity with cloud platforms (AWS, GCP, or Azure)

  Preferred Qualifications

  - Experience building multi-agent systems or AI copilots
  - Exposure to Python for AI-related tasks
  - Experience with event-driven architectures
  - Knowledge of frontend frameworks (Vue/React) is a plus
  - Prior experience in AI-first product development
    environments

  What We’re Really Looking For

  - Someone who thinks in workflows, not just endpoints
  - Someone who sees AI as a system layer, not a feature
  - Someone who experiments, builds fast, and iterates
  - Someone who can translate business problems into AI-driven
    solutions

  Sample Projects You Might Work On

  - AI-powered recruitment pipeline with autonomous candidate
    screening
  - Internal AI copilots for engineering and business teams
  - Workflow automation agents for sales and operations
  - Smart knowledge systems using embeddings and retrieval

  Success Metrics

  - Delivery of AI-powered features that reduce manual effort
  - Performance and reliability of AI workflows
  - Quality and accuracy of AI agent outputs
  - System scalability and maintainability
