  3D Artist(AR/ AI Engineer) Job Summary

  We are looking for a creative and detail-oriented 3D Artist
  to create high-quality 3D models, textures, renders, and
  visual assets for our projects. The ideal candidate should
  have a strong artistic eye, technical expertise, and the
  ability to leverage AI-powered tools to improve productivity
  and creative output.

  Key Responsibilities

  - Create high-quality 3D models, textures, materials, and
    renders.
  - Develop realistic or stylized assets based on project
    requirements.
  - Optimize 3D assets for games, AR/VR, animation, product
    visualization, or digital marketing.
  - Use AI-powered tools to accelerate concept generation,
    texturing, rendering, asset creation, and workflow
    automation.
  - Collaborate with designers, developers, and project managers
    to deliver projects on time.
  - Revise and improve assets based on feedback.
  - Maintain organized project files and follow production
    pipelines.

  Required Skills

  - Proficiency in Blender, Autodesk Maya, 3ds Max, or Cinema
    4D.
  - Experience with Substance Painter, ZBrush, Photoshop, or
    similar tools.
  - Strong understanding of 3D modeling, UV mapping, texturing,
    lighting, rendering, and asset optimization.
  - Familiarity with AI-assisted creative tools such as Adobe
    Firefly, ChatGPT, Midjourney, Stable Diffusion, Meshy AI,
    Tripo AI, or similar platforms.
  - Basic knowledge of animation and rigging is an advantage.
  - Strong creativity, attention to detail, problem-solving, and
    communication skills.

  Qualifications

  - Bachelor's degree or diploma in Animation, Multimedia, Fine
    Arts, or a related field (preferred but not mandatory).
  - 1–3 years of experience (Freshers with an exceptional
    portfolio are welcome).
  - A portfolio showcasing 3D modeling, rendering, and AI-
    assisted creative work is mandatory.

  Preferred Skills

  - Understanding of AI-driven content creation and workflow
    optimization.
  - Ability to manage multiple projects and meet deadlines in a
    fast-paced environment.
