description: |
  Gravitee is a 2025 Gartner® Magic Quadrant™ Leader, on a
  mission to govern the world’s intelligence.

  We deliver the industry’s most advanced platform for Any
  API, Any Event, and Any AI Agent, trusted by global leaders
  like Michelin, Roche, and Blue Yonder.

  Why join us?

  - The Mission: We are the first to bridge traditional API
    Management with the new frontier of AI Agent Security
  - The Momentum: A high-growth Leader - combining market
    credibility with startup speed
  - The DNA: We hire people who Hold Nothing Back - passionate
    builders who want to redefine digital infrastructure

  Don’t just watch the AI revolution. Build the infrastructure
  that controls and secures it.

  The Role

  AI is transforming how software is built, tested and
  delivered. We’re looking for an experienced Quality Engineer
  who combines strong testing fundamentals with an AI-first
  mindset.

  As our champion for AI adoption within QA, you’ll help
  redefine quality engineering by introducing intelligent
  automation, evaluating emerging AI-powered testing
  approaches and enabling engineering teams to build quality
  faster, smarter and at scale.

  What You’ll Be Doing

  At Gravitee, impact isn’t abstract, it’s visible. In this
  role, you will:

  - Partner with the engineering and product team throughout the
    software development lifecycle to build quality into every
    feature from the start.
  - Design, build and maintain automation frameworks and
    automated test suites across UI, API and end-to-end
    testing, integrated into our CI/CD pipelines.
  - Define risk-based testing strategies and drive the
    transition from manual regression to intelligent, scalable
    automation across multiple engineering teams.
  - Collaborate across engineering to improve testability,
    investigate production issues and establish QA automation
    best practices.
  - Use LLMs and AI coding assistants (such as Claude, Cursor,
    GitHub Copilot or similar) as a core part of your
    engineering workflow to accelerate test design, automation
    and debugging.
  - Champion AI adoption across Quality Engineering by
    introducing AI-native testing approaches, establishing
    best practices and using production insights to
    continuously improve quality.
  - Validate AI-generated code and AI-powered product
    capabilities, ensuring outputs are reliable, secure and
    suitable for production use.

  Your impact will be visible, measurable, and global.

  Essential Skills

  - 5+ years’ experience in QA Automation, Test Automation,
    Quality Engineering, or Software Development in Test, with
    strong hands-on experience designing, building and
    maintaining automated tests.
  - Strong understanding of software testing principles, risk-
    based testing and automation framework design.
  - Experience building automated UI and API test suites and
    integrating them into CI/CD pipelines.
  - Strong programming skills in Java, TypeScript or another
    modern programming language.
  - Experience with modern automation tools such as Playwright,
    Cypress, Postman, Jest or similar technologies.
  - Hands-on experience using LLM platforms and AI coding
    assistants (such as Claude, ChatGPT, Gemini, Cursor or
    GitHub Copilot) as part of your day-to-day engineering
    workflow, with the judgement to know when AI-generated
    outputs require human review.
  - Strong communication skills with the ability to collaborate
    across cross-functional engineering teams.
  - A proactive, curious mindset with a passion for continuously
    improving quality engineering practices.

  Desired Skills

  - Experience testing AI-powered products, LLM-based
    applications, RAG systems or agentic workflows.
  - Experience with AI-native testing platforms or autonomous
    testing solutions (such as Mabl, Testsigma, Katalon
    TrueTest, KaneAI, Applitools or similar).
  - Experience with production observability and shift-right
    testing practices.
  - Prompt engineering experience for software development or
    test generation.

  Who Thrives at Gravitee

  At Gravitee, our growth is powered by people who bring
  passion to what they build, act with professionalism in how
  they work, and hold nothing back in their commitment to
  doing things well.

  You’ll do well here if you:

  - Care deeply about quality, clarity, and impact
  - Are curious, adaptable, and excited by emerging technologies
    like AI
  - Take ownership and follow through
  - Value collaboration, openness, and continuous improvement

  Bonus points if you’ve worked with APIs, cloud-native
  platforms, AI-enabled systems, or open source, but curiosity
  matters most.

  Life at Gravitee

  At Gravitee, we invest in humans, not just roles.

  You’ll get:

  - Competitive medical coverage
  - Pension / 401k program options
  - Stock options - you build it, you own it
  - 25 days holiday + in-country national holidays
  - 3 mental health days + wellness allowance
  - Your birthday off 🎉
  - Professional development budget to fuel your growth
  - Hybrid work culture with hubs across regions
  - Quarterly team events + annual offsite at an exciting
    location
  - A meaningful, progressive, global company culture that is as
    fun as it is hardworking
  - Endless growth opportunities

  At Gravitee, we believe diverse perspectives make better
  products and stronger teams.

  At Gravitee, no employee or applicant will be treated less
  favorably on the grounds of sex, marital status, race,
  color, nationality or ethnic or national origin, disability,
  gender, sexual orientation, gender identity, age, pregnancy
  or maternity, marital or civil partner status, or religion
  or belief.

  By clicking submit below, you consent to allow Gravitee to
  store and process the personal information submitted above.
