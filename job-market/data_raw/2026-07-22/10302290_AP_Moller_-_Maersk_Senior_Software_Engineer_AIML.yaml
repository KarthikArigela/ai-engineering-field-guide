description: |
  Senior Software Engineer (AI/ML)About the Role

  We are looking for a highly skilled Senior Software Engineer
  (AI/ML) to join our engineering team. In this role, you will
  design, develop, deploy, and maintain AI/ML-powered
  applications and intelligent systems that solve complex
  business problems. You will work across the end-to-end
  machine learning lifecycle—from data preparation and model
  development to deployment, monitoring, and continuous
  optimization—while collaborating with cross-functional teams
  to build scalable, production-ready AI solutions.

  You will leverage modern AI frameworks, foundation models,
  and software engineering best practices to deliver
  innovative, reliable, and secure AI applications.

  Key Responsibilities

  - Design, develop, test, deploy, and maintain AI/ML-driven
    applications and services.
  - Build and productionize machine learning models, Generative
    AI applications, and intelligent automation solutions.
  - Develop scalable APIs and backend services to integrate AI
    capabilities into enterprise applications.
  - Work across the complete ML lifecycle, including data
    engineering, feature engineering, model training,
    evaluation, deployment, monitoring, and retraining.
  - Leverage Large Language Models (LLMs), foundation models,
    and Retrieval-Augmented Generation (RAG) techniques to
    build enterprise AI solutions.
  - Optimize model performance, scalability, reliability, and
    cost for production environments.
  - Build and maintain MLOps pipelines for automated model
    training, deployment, versioning, and monitoring.
  - Collaborate with Product Managers, Data Scientists, Software
    Engineers, and business stakeholders to define technical
    solutions and deliver high-quality products.
  - Apply software engineering best practices, including code
    reviews, automated testing, CI/CD, and secure coding
    standards.
  - Mentor junior engineers and contribute to architecture
    discussions, technical decisions, and engineering
    excellence.
  - Stay current with advancements in AI/ML, Generative AI, and
    cloud-native technologies, recommending new approaches
    where appropriate.

  Required Skills & Qualifications

  - Bachelor's or Master's degree in Computer Science,
    Artificial Intelligence, Machine Learning, Data Science,
    or a related field.
  - 8+ years of software engineering experience, with
    significant hands-on experience in AI/ML development.
  - Strong programming skills in Python and experience with
    software engineering best practices.
  - Hands-on experience with machine learning frameworks such as
    PyTorch, TensorFlow, or Scikit-learn.
  - Experience with Generative AI technologies, including Large
    Language Models (LLMs) and AI application frameworks such
    as LangChain, LlamaIndex, or similar.
  - Experience working with Hugging Face models and
    transformers.
  - Strong understanding of classical machine learning
    algorithms, deep learning, NLP, and model evaluation
    techniques.
  - Experience building REST APIs and microservices using
    frameworks such as FastAPI, Flask, or similar.
  - Experience with cloud platforms such as Azure, AWS, or
    Google Cloud Platform.
  - Experience with containerization and orchestration
    technologies such as Docker and Kubernetes.
  - Good understanding of MLOps concepts, model versioning,
    monitoring, and CI/CD pipelines.
  - Experience with databases such as PostgreSQL, MongoDB, or
    vector databases (e.g., Pinecone, Weaviate, ChromaDB) is
    an advantage.
  - Strong understanding of distributed systems, scalability,
    and performance optimization.
  - Excellent analytical, problem-solving, and communication
    skills.

  Preferred Qualifications

  - Experience building enterprise-scale AI/ML platforms or
    products.
  - Hands-on experience with Retrieval-Augmented Generation
    (RAG), AI agents, prompt engineering, and agentic AI
    frameworks.
  - Experience with ML orchestration tools such as MLflow,
    Kubeflow, Airflow, or Azure ML.
  - Familiarity with Responsible AI, AI governance, model
    explainability, and security best practices.
  - Experience working in Agile/Scrum environments.
  - AI/ML or cloud certifications are a plus.

  What We're Looking For

  - Passion for solving complex business problems using AI and
    Machine Learning.
  - Strong ownership and accountability for delivering
    production-ready solutions.
  - Ability to lead technical initiatives and mentor engineering
    teams.
  - A continuous learner who stays updated with the latest AI
    technologies and industry trends.
  - Excellent collaboration skills with the ability to work
    effectively across engineering, product, and business
    teams.

  Maersk is committed to a diverse and inclusive workplace,
  and we embrace different styles of thinking. Maersk is an
  equal opportunities employer and welcomes applicants without
  regard to race, colour, gender, sex, age, religion, creed,
  national origin, ancestry, citizenship, marital status,
  sexual orientation, physical or mental disability, medical
  condition, pregnancy or parental leave, veteran status,
  gender identity, genetic information, or any other
  characteristic protected by applicable law. We will consider
  qualified applicants with criminal histories in a manner
  consistent with all legal requirements.



  We are happy to support your need for any adjustments during
  the application and hiring process. If you need special
  assistance or an accommodation to use our website, apply for
  a position, or to perform a job, please contact us by
  emailing  accommodationrequests@maersk.com.
