description: |
  Overview

  Are you curious, enthusiastic about infrastructure, and
  ready to solve complex challenges in the AI era? Join us as
  a Solution Engineer - Cloud & AI Infrastructure  focused on
  the Azure Platform for commercial customers at Microsoft.

  In this technical sales role, you will help customers design
  secure, scalable, and resilient cloud architectures that
  support their modernization goals. Using Azure’s IaaS and
  PaaS services, you will guide organizations through
  migration, modernization, optimization, and
  innovation—translating technical capabilities into
  significant business outcomes. You will also collaborate
  across teams to deliver impactful solutions that enhance
  agility, reduce costs, and unlock value through AI-powered
  infrastructure.

  As a Solution Engineer - Cloud & AI Infrastructure, you will
  play a key role in helping customers modernize their
  infrastructure and unlock the full value of Microsoft’s
  cloud. You will work directly with technical and business
  stakeholders to design and implement secure, scalable, and
  resilient architectures that support AI workloads and
  business-critical applications. You will bring deep
  expertise in migrating core workloads—including Windows, SQL
  Server, Linux, PostgreSQL, and Oracle—to Azure.

  Beyond migration, you'll lead customers through
  modernization using the 6R strategy, containerization best
  practices, and Azure-native services like AKS and Arc, while
  exploring how AI and intelligent agents can accelerate
  legacy transformation.  You will also apply strong
  networking knowledge to design hybrid and cloud-native
  solutions, including virtual networks, VPNs, and secure
  routing architectures that meet enterprise performance and
  compliance needs. You complement this with trusted partner
  solutions like NetApp, VMware, RedHat, and SAP to ensure a
  secure, optimized, and scalable migration experience.

  As you join the team, You will have the opportunity to grow
  your technical expertise with access to a wide range of
  Microsoft learning resources—including support for earning
  industry-recognized certifications across Azure
  infrastructure, security, and AI. With a solid understanding
  of Azure security services and compliance frameworks, you
  will help customers meet regulatory requirements and build
  Cloud environments that are ready for the future.

  By applying to this role, you will be considered for
  multiple opportunities within Microsoft across the United
  States including locations beyond where the role is posted.
  This role is flexible in that you can work up to 50% from
  home. Travel percentages will vary according to role.

  Microsoft’s mission is to empower every person and every
  organization on the planet to achieve more. As employees, we
  come together with a growth mindset, innovate to empower
  others, and collaborate to realize our shared goals. Each
  day we build on our values of respect, integrity, and
  accountability to create a culture of inclusion where
  everyone can thrive at work and beyond.

  Responsibilities

  - Own technical sales with customers’ technical decision
    makers leveraging processes and tools, demos, programs,
    offers, and drive proof of concepts (POCs) using
    consultative sales methodology and technical expertise
    across other Solution Engineers to influence the customer
    vision.
  - Build trusted advisor relationship with customers’ technical
    decision makers and use proactive effort to find and
    understand customers’ pain points and work together with
    customers to co-develop secure & resilient solution
    architecture for production scale delivery using Cloud
    Adoption Framework (CAF) best practices including Unified
    Support and Cloud Migration Factory (CMF) offer for every
    opportunity.
  - Overcome competitors and technical objections and manage
    customer escalation with Global Black Belt and engineering
    team to share insights and best practices for product
    improvements.
  - Maintain deep knowledge and grow expertise in Cloud
    Migration (Win, SQL, Linux, PGSQL, App workloads,
    resiliency, security, compliance) and enterprise
    applications (SAP, Oracle).
  - Maintain knowledge and grow expertise in VMware with Azure
    VMware Services (AVS).
  - Maintain up to date with market trends and competitive
    insights; collaborate and share with the Infrastructure
    technical community.
  - Embody our culture and values

  Qualifications

  Required Qualifications:

  - 5+ years technical pre-sales or technical consulting
    experience OR equivalent experience OR Bachelor's Degree
    in Computer Science, Information Technology, or related
    field AND 4+ years technical pre-sales or technical
    consulting experience OR Master's Degree in Computer
    Science, Information Technology, or related field AND 3+
    years technical pre-sales or technical consulting
    experience.

  Other Requirements:

  - This position is not eligible for visa sponsorship.
    Candidates must have authorization to work in the United
    States that does not now or in the future require employer
    sponsorship.

  Preferred Qualifications:

  - 8+ years technical pre-sales, technical consulting, or
    technology delivery, or related experience OR equivalent
    experience.
  - 6+ years experience with cloud and hybrid, or on premises
    infrastructures, architecture designs, migrations,
    industry standards, and/or technology management.
  - Certification in relevant technologies or disciplines
    - Azure Certifications: AZ-305 Azure Solutions Architect
      Expert or AZ-104 Azure Administrator Associate or AZ-700
      Azure Network Engineer Associate or AZ-500 Azure
      Security Engineer Associate or Administering Windows
      Server Hybrid Core Infrastructure

  - Experience with enterprise platforms such as SAP, Oracle,
    and ISVs like NetApp, VMware, and RedHat.
  - Experience designing or selling solutions involving hybrid
    networking, secure connectivity, or network performance
    optimization in enterprise environments.
  - Experience xperience with Azure Kubernetes Service (AKS),
    App Platform, and containerization strategies.
  - Knowledable of Azure services, including security,
    compliance, and hybrid cloud scenarios.



