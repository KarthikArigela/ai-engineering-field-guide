description: |
  SoSafe is Europe's leading human risk management company,
  trusted by 6,000+ organisations to turn their people into a
  line of defence against cyberattacks. We've built something
  real, and we're nowhere near done.

  This role is on the Adaptive Defence team, SoSafe’s newest
  most innovative product where we build products fast, AI-
  native from day zero, and we put it in front of customers
  before it's perfect. We iterate in fast cycles. We're not
  here to maintain a roadmap. We're here to build what's next.

  We've got the distribution, the customers, and the brand.
  What we need are builders: people who've taken something
  from 0 to 1, who prototype before they specify, who use AI
  to move faster, and who have no patience for process for its
  own sake.

  Title and years don't decide this. What you've shipped does.
  If you're a builder, let's talk.

  Location: Ireland, UK, or Portugal (remote). Candidates
  based in Portugal also have the option to work hybrid from
  our Lisbon office.

  What you'll own

  Ship, don't specify

  - Own a product problem end to end: from framing to prototype
    to production.
  - Move in short cycles. Days and weeks, not quarters. Your
    output is working software in users' hands, not decks.
  - Own the feedback loop. Get in front of customers, learn, and
    ship the next version fast.

  Build AI-native

  - Agentic coding and rapid prototyping are your default, not a
    side experiment.
  - You're a multiplier: you ship at a pace a conventional team
    can't match.
  - You'll help shape how we build with AI. That's a happy side
    effect, not the mission. The product is.
  - Our stack is TypeScript, React, Node, and AWS. We care more
    about how fast you ramp than what you know today.

  Own the outcome

  - You own the quality bar and the judgement behind what you
    build, not just the output.
  - Make product, design, and scope calls without waiting for a
    committee, and own them when you're wrong.
  - When the brief is incomplete, you narrow it yourself and
    move.
  - Your name's on what ships. You're measured on impact, not
    tickets closed.

  What we're looking for

  - You've built 0 to 1. You've taken something from nothing to
    shipped, and you can point to the calls you owned and what
    came of them. Founder, indie builder, or early employee
    with outsized scope all count. Coordinating other people's
    work doesn't.
  - You're hungry and not afraid. New domain, new stack, hard
    problem: you run at it. You'd rather ship something
    imperfect and learn than polish something that never
    ships.
  - You build AI-native. AI tools are core to how you work, not
    an add-on. You have opinions on what's actually useful,
    and the scars to back them. Tool-agnostic on the way in;
    you'll converge with the team here.
  - You keep your edge inside a structure. You've done things
    your own way. You know the difference between autonomy,
    which you'll have, and authority over everything, which
    nobody has.

  Strong signals

  - You've prototyped something real and put it in front of
    users in days.
  - You've built your own tooling or workflow to go faster, and
    you can show it.
  - You've got taste: a point of view on what great security or
    B2B SaaS looks like.
  - You've lived startup or early-stage, where nothing works
    until you make it work.
  - You actually care about human risk and cybersecurity, not
    just the market.

  What you get

  - The best tools, no rationing. Frontier LLMs are your daily
    driver, not a budget line you fight for.
  - A lean, senior team with full ownership. No waiting on other
    teams, no design-by-committee, no politics.
  - Build the product that sets the next standard in
    cybersecurity, with SoSafe's distribution behind you from
    day one.
  - Room to move at your own speed. We won't slow you down with
    process.

  What we offer

  - Work/Life balance: Flexible hours, 33 vacation days
  - Wellbeing and financial support: Access to Open Up,
    corporate discounts
  - Connection & community: Virtual events, collaborative team
    activities, and opportunities for local meet-ups
  - Tech equipment, referral bonuses, dog-friendly HQ

  *Perks and benefits listed above are for full-time employees
  and may vary slightly by office location. These are just a
  sample — you'll learn more during the interview process.

  About Us

  At SoSafe, we’re on a mission to make the digital world
  safer by addressing the human factor in cybersecurity. As
  one of the fastest-growing security awareness scale-ups
  worldwide, we leverage behavioural science and data-driven
  learning to empower people against cyber threats. Our Human
  Risk Management approach helps organisations turn their
  employees into their strongest line of defence.

  Backed by leading VCs like Highland Europe and Global
  Founders Capital, we’re rapidly expanding across the globe.
  We’re looking for team players who want to drive meaningful
  change in cybersecurity, take ownership of their work, and
  grow with us.

  If you thrive in a vibrant, purpose-driven environment that
  values innovation, diversity, and collaboration, then this
  is the place for you!
