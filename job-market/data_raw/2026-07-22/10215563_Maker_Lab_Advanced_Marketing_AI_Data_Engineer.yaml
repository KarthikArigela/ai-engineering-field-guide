description: |
  Grounded in a talent-centric mindset, Maker Lab is a
  marketing agency designed to build decentralised technology-
  led agency teams, rooted in collaboration with clients from
  the ground up. Maker Lab’s cross-functional teams of
  multidisciplinary specialists are embedded into client teams
  across digital marketing competencies — from measurement &
  analytics to content production.

  Job Summary:

  We're looking for an Advanced Marketing AI & Data Engineer
  to support one of our amazing clients in the music and
  entertainment industry. You'll be at the forefront of AI-
  powered marketing innovation, building intelligent solutions
  that transform complex audience signals into meaningful
  insights. Combining machine learning, data engineering, and
  automation, you'll help teams across APAC unlock new
  opportunities, make smarter decisions, and create deeper
  connections with fans.

  Role:

  - Architect, scale and maintain the front-end UX and backend
    data pipeline for a unified data engine, automating real-
    time ingestion from DSPs, social networks and eCommerce
    platforms.
  - Code, train and deploy machine learning models that monitor
    product consumption velocity, flag early-stage trend
    spikes, and calculate real-time success probabilities for
    upcoming releases.
  - Build localised data tokenisation and anonymisation filters
    into the pipeline to ensure compliance with cross-border
    data regulations when extracting data from regulated
    markets.
  - Use modern AI coding assistants to rapidly build and deploy
    front-end interfaces and interactive dashboards for non-
    technical marketing teams to monitor campaign performance.
  - Build and optimise a natural-language AI briefing intake
    form, enabling automated gatekeeping of incomplete or non-
    compliant briefs alongside AI-generated brief enhancements
    from historical campaign data.
  - Collaborate with Paid Media on automated bulk CSV
    configuration macros to accelerate ad deployment for
    strong-performing campaigns, and with Creative teams on
    bulk Gen AI script generation for proven creative assets.

  You:

  - BA/BS degree or equivalent experience.
  - 5+ years of professional experience in machine learning
    engineering, data architecture, or predictive pipeline
    development within high-volume tech or digital media.
  - Deep hands-on experience structuring production data models
    within Databricks environments, with advanced proficiency
    in Python, SQL and API configurations.
  - Fluent in using modern AI coding assistants and LLMs to
    accelerate front-end deployment and software testing
    cycles.
  - Strong understanding of data privacy frameworks and cross-
    border data security protocols, particularly when
    extracting data from complex regulatory environments.
  - Exceptional verbal and written English communication and
    presentation skills.

  Contract Type: 12-months Fixed Term Contract

  Please note: due to the high volume of applications, only
  successful candidates will be contacted with a follow-up
  introduction email.  If you do not receive an email from
  Maker Lab, your application has been unsuccessful this time
  around. Look out for future roles! By submitting your
  application, you consent to the collection, use and
  disclosure of your data by the Maker Lab team for the
  purposes of your application. Where your application
  contains personal data of third parties, you confirm that
  you have obtained all necessary consents to provide the
  Maker Lab team with such personal data and that we may
  collect, use and/or disclose such data in accordance with
  the Personal Data Protection Act 2012.
