description: |
  About Pivotal Health

  Pivotal Health is the leading technology platform that helps
  healthcare providers get paid fairly in an increasingly
  complex reimbursement landscape.

  Today, many providers face persistent underpayment from
  health insurance companies, despite delivering high-quality
  care. While processes like IDR (Independent Dispute
  Resolution) were designed to promote fairness, they’re often
  administrative-heavy, time-consuming, and difficult to
  navigate without the right tools.

  Pivotal Health combines software, data, and service into a
  seamlessly integrated, AI-driven platform that simplifies
  these complex reimbursement workflows. We help providers
  efficiently dispute underpaid claims, reduce administrative
  burden, and recover the reimbursement they’re entitled to;
  without adding more work to already stretched teams.

  Our full-service IDR solution is just the starting point.
  We’re building solutions that enable providers to operate
  with clarity, control, and confidence across the
  reimbursement journey.

  About The Role

  Pivotal Health is investing heavily in AI as a core
  strategic capability to transform healthcare operations. We
  are building intelligent systems that automate complex
  workflows, improve decision-making, and create measurable
  business impact across critical areas of the organization.
  From document understanding and workflow orchestration to
  next-generation decisioning systems, AI is becoming
  foundational to how we operate and scale.

  As a Senior Applied AI/ML Engineer, you will design, build,
  and improve production AI systems that directly influence
  our most important business outcomes. Reporting to the Head
  of AI/ML Engineering, you will work at the intersection of
  software engineering, machine learning, and operational
  workflows to transform ambiguous business challenges into
  scalable, reliable solutions.

  This role is focused on applied AI engineering—not research
  in isolation. You will own systems end-to-end, from problem
  definition and evaluation design to deployment and
  operational improvement. Your work will help establish how
  AI is adopted across the organization while ensuring the
  systems we build are production-ready, measurable, and
  impactful.

  If you thrive in fast-moving environments, enjoy solving
  complex operational problems, and want to build AI systems
  that create tangible business value, this role offers the
  opportunity to shape a critical capability for the future of
  the company.

  What You'll Do

  - Own and improve production AI systems. Design, deploy, and
    optimize AI/ML solutions that support critical business
    workflows and operational decision-making.
  - Build AI-powered workflow platforms. Develop and refine
    production workflows leveraging generative AI models,
    agent frameworks, orchestration systems, and decisioning
    engines.
  - Design evaluation and experimentation frameworks. Create
    robust evaluation methodologies, testing strategies, and
    measurement systems that improve model quality, workflow
    performance, and business outcomes.
  - Translate business problems into scalable systems. Partner
    with product, operations, and engineering teams to define
    success metrics and convert ambiguous requirements into
    production solutions.
  - Optimize model and workflow performance. Improve prompts,
    retrieval strategies, agent behavior, and system-level
    workflows through continuous experimentation and feedback
    loops.
  - Drive engineering excellence. Contribute to architecture,
    testing, observability, deployment safety, and operational
    reliability across AI-powered systems.
  - Accelerate AI adoption across the organization. Leverage AI
    tools and best practices to improve team productivity
    while helping establish scalable AI-native ways of
    working.

  Who You Are

  - 5–8+ years of experience building software systems in
    production environments, with a strong track record of
    owning and delivering complex technical solutions.
  - Experience building and operating applied AI, LLM, agentic,
    or decisioning systems in production environments.
  - Experience designing experiments, evaluation frameworks,
    optimization loops, or performance measurement systems.
  - Strong software engineering background with Python and
    backend systems supporting production-scale AI
    applications.
  - Proven ability to translate complex operational requirements
    and real-world data into reliable, shipped products.
  - Experience working within healthcare or similarly complex
    operational domains.
  - Product-oriented mindset with a bias toward ownership,
    execution, and delivering measurable outcomes.
  - Comfortable navigating ambiguity and driving initiatives
    from concept through production deployment.
  - Demonstrated ability to balance technical excellence with
    business impact.

  Nice to Have

  - Experience in domains such as marketplaces, pricing
    optimization, ad technology, credit decisioning, lending,
    revenue optimization, or operational analytics.
  - Experience with retrieval systems, prompt engineering,
    structured generation, model routing, agent architectures,
    or tool-using AI systems.
  - Familiarity with modern evaluation frameworks and production
    monitoring approaches for LLM-based applications.
  - Experience scaling AI systems that support high-volume
    operational workflows.

  This position is not eligible for employer-sponsored work
  authorization. Applicants must be legally authorized to work
  in the United States on a permanent basis without the need
  for current or future visa sponsorship.*

  Why You’ll Love Working Here

  We’re a collaborative, low-ego team on a mission to make
  healthcare reimbursement fairer for providers. While we
  primarily hire around our core hubs–Los Angeles and New
  York–we remain open to exceptional talent outside those
  regions. Remote and hybrid flexibility varies by role and
  team, and is outlined in each job description.

  If you’re excited by solving complex problems and making a
  real-world impact, we’d love to hear from you.

  Benefits Include:

  - Competitive compensation, including equity
  - Full health, dental, and vision coverage
  - Retirement savings plan through 401(k)
  - Flexible time off
  - Opportunities for company-wide connection and events

  Ready to Make an Impact? We’re building something
  meaningful; and we want you on the team.

  Bring your ideas, curiosity, and drive, and let’s transform
  healthcare reimbursement together.

  Employment Information

  Work Authorization

  Candidates must be authorized to work in the United States
  without current or future employer sponsorship.

  Equal Employment Opportunity

  Pivotal Health is an Equal Opportunity Employer. We
  celebrate diversity and are committed to creating an
  inclusive environment for all employees. We do not
  discriminate on the basis of race, color, religion, sex,
  gender identity or expression, sexual orientation, national
  origin, age, disability, veteran status, or any other
  legally protected status.

  Reasonable Accommodations

  Pivotal Health provides reasonable accommodations for
  qualified individuals with disabilities in accordance with
  applicable laws. If you need assistance during the
  application or interview process, please let us know.

  Background Checks

  Employment is contingent upon successful completion of
  applicable background checks, where permitted by law.

  At-Will Employment

  Employment with Pivotal Health is at-will and may be
  terminated by either party at any time, with or without
  cause or notice, in accordance with applicable law.
