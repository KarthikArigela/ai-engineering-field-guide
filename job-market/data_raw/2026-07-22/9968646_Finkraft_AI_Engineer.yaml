description: |
  About Finkraft

  Finkraft is a fast-growing fintech startup building
  infrastructure to simplify and modernize financial
  operations. We are embedding production-grade AI and agentic
  systems into core workflows to drive automation and real
  business outcomes.

  Role Overview

  We’re looking for an AI Engineer to design and scale agentic
  AI systems that move beyond experimentation into real-world
  usage. You’ll build intelligent agents, integrate LLMs into
  production, and own AI systems end-to-end.

  What You’ll Do

  - Build and deploy AI agents for multi-step workflows
  - Design RAG pipelines, tool usage, memory, and orchestration
    logic
  - Integrate LLMs into production systems with monitoring and
    safety
  - Define evaluation metrics, feedback loops, and guardrails
  - Select and manage LLMs, vector databases, and frameworks
  - Collaborate with product, data, and engineering teams to
    ship AI features
  - Deploy AI models on AWS infrastructure and microservices
  - Work with data pipelines (Python, Airflow) to prepare
    training data
  - Implement AI testing and monitoring (Selenium, Playwright
    for integration testing)
  - Collaborate with backend teams on API integration (REST
    APIs)
  - Ensure AI systems integrate with PostgreSQL & MongoDB data
    stores

  Requirements

  What We’re Looking For

  - 4-6 years in AI Engineering
  - Hands-on experience with LLMs, RAG, vector stores, and agent
    frameworks
  - Strong Python programming and system design skills
  - Experience deploying AI systems in production
  - Strong problem-solving with focus on real-world outcomes
  - Ability to balance speed, reliability, and scalability

  Good to Have

  - MLOps Tools (MLflow, Weights & Biases for model tracking)
  - Prompt Engineering (advanced techniques and optimization)
  - Fine-tuning LLMs (custom model adaptation)
  - Evaluation Frameworks (RAGAS, LangSmith for AI evaluation)
  - Observability Tools (monitoring AI system performance)
  - Playwright/Selenium (testing AI-driven workflows)
  - Kafka (streaming data for AI pipelines)
  - Fintech or enterprise workflow experience
  - AI safety and alignment principles

  Benefits

  Why Join Us

  - Build real AI systems used in production
  - Shape how AI integrates into fintech workflows
  - High ownership, work closely with founders
  - High-impact role with strong growth potential
  - Work on cutting-edge agentic AI systems
