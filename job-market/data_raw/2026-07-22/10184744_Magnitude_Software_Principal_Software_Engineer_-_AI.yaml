description: |
  About Us:

  insightsoftware is a global provider of reporting,
  analytics, and performance management solutions that unlock
  the potential of business data and transform the way finance
  and data teams operate. We empower leaders from over 32,000
  organizations to make timely and intelligent decisions. Our
  comprehensive solutions span Financial Planning and Analysis
  (FP&A), Controllership, and Data and Analytics. We deliver
  finance teams the insights required to navigate any economic
  climate and drive greater financial intelligence, while
  increasing productivity, visibility, accuracy, and
  compliance. Learn more at insightsoftware.com.

  Job Description:

  Are you an AI leader in the Software Engineering space?  Do
  you challenge the status quo?  Do dive right in with the
  latest AI Development tools so that you can leverage them to
  create new innovative solutions, modernize existing
  solutions, and address that history of tech debt?  All while
  leveraging AI to move faster and be more scalable? Do you
  evangelize and empower your peers and cross functional
  partners to do the same?  Are you constantly asking others
  to consider “How can AI help with that?”  If so, look no
  further.

  As a Principal Software Engineer, you will leverage the
  latest AI Development tools to amplify engineering output,
  while also building agentic capabilities into our enterprise
  SaaS and desktop applications. You will be an AI evangelist
  on the team — ensuring AI-first practices are incorporated
  into our solutions.  You will champion AI usage amongst your
  peers while actively participating in Agile planning,
  refinement, and retrospective ceremonies.

  You will work across several strategic product initiatives
  spanning AI centric product solutions including but not
  limited to new modules and applications, modernizing legacy
  architectures, and optimizing application operations.  Our
  tools consist of Copilot, Claude, Devin, Lovable, and C#,
  .NET, React, TypeScript, SQL to name a few.  Have others;
  we’d love to see what you bring to the table.  You will work
  in cross-functional product teams alongside Engineers and QA
  Engineers following Agile SDLC.

  You are a great fit if AI is at the forefront of your
  development practices, you thrive in fast-changing
  environments, and you are committed to continuously
  improving yourself, your team, and our products.

  Responsibilities •    Be the tip of the spear in using and
  evangelizing AI within Software Development •    Integrate
  AI capabilities into product features, including agentic
  workflows, and AI-assisted user experiences •    Provide
  technical leadership in solving complex software development
  challenges that meet and exceed customer expectations •
  Design and implement robust, scalable, and high-performing
  backend solutions using .NET / .NET Core, C#, and SQL •
  Own the full development lifecycle from requirements through
  testing — producing clean, reusable, and maintainable code •
  Lead, critique, and coach others in code reviews,
  architecture discussions, while identifying dependencies and
  resolving impediments for other engineers •    Interact with
  product owners and stakeholders to clarify requirements and
  translate them into well-architected solutions

  Qualifications •    8+ years of experience designing and
  developing SaaS web applications using JavaScript, .NET and
  C#, Java or equivalent •    Demonstrated application in the
  use of AI tools within the Software Development space
  (Claude, Copilot, Devin, Lovable, etc.) •    Hands-on
  experience integrating LLMs into production software (prompt
  engineering, API integration with OpenAI, Azure OpenAI, or
  similar) •    Experience with data replication patterns, ETL
  pipelines, or connector/adapter framework design •    Strong
  experience modernizing legacy architectures. Demonstrates
  the ability to read, rapidly understand, diagnose and port
  from legacy codebases •    Expertise in database security
  principles and best practices •    Ability to mentor junior
  and mid-level engineers in best practices •    Strong
  written and verbal communication skills; able to collaborate
  effectively across engineering, product, QA, and executive
  stakeholders •    Familiarity with enterprise financial
  systems (ERPs, GL platforms, FP&A or reporting tools) and an
  understanding of the data workflows that drive finance teams
  a nice to have

  The salary range in United States of America for this
  position is 160,000.00 to 201,000.00 USD Annual.

  Your specific offer within this range will be determined by
  your skills, experience, and qualifications. For non-sales
  roles, you may be eligible for a bonus. For sales roles,
  this range includes a commission target.

  We are committed to pay transparency and fair compensation
  practices. If you have questions about our compensation
  approach, please don't hesitate to ask during the interview
  process.

  Additional Information

  All your information will be kept confidential according to
  EEO guidelines.

  Learn more about our high-energy, high-performance global
  team: Work With Us

