  Job Description

  We are seeking a highly skilled Senior Google Cloud Platform
  (GCP) Engineer to join our Cloud Platform Engineering team.
  In this role, you will be responsible for designing,
  implementing, and managing scalable, secure, and automated
  cloud infrastructure on Google Cloud Platform (GCP). You
  will work closely with application development, DevOps, Site
  Reliability Engineering (SRE), security, and architecture
  teams to deliver enterprise-grade cloud platform solutions.

  The ideal candidate will possess strong hands-on experience
  in Google Cloud Platform, Kubernetes (GKE), Infrastructure
  as Code (Terraform), cloud networking, security, CI/CD
  automation, and AI-powered cloud services such as Vertex AI,
  Agent Builder, and Gemini Enterprise.



  ESSENTIAL DUTIES AND RESPONSIBILITIES:

  - Design, build, and maintain scalable, secure, and highly
    available infrastructure on Google Cloud Platform (GCP).
  - Design and implement AI-powered cloud solutions using Vertex
    AI, Agent Builder, and Gemini Enterprise.
  - Deploy, manage, and optimize containerized workloads using
    Google Kubernetes Engine (GKE) and Cloud Run.
  - Develop reusable Infrastructure as Code (IaC) using
    Terraform, including Terraform modules and automated
    deployment pipelines.
  - Design and implement secure cloud networking including VPCs,
    Subnets, Firewall Rules, Private Service Connect, VPNs,
    DNS, and Load Balancers.
  - Configure and manage IAM, Cloud Identity, Service Accounts,
    RBAC, and Workload Identity Federation.
  - Build and maintain CI/CD pipelines using Azure DevOps,
    GitHub Actions, or GitLab CI.
  - Monitor, troubleshoot, and optimize cloud infrastructure
    using Cloud Monitoring and Cloud Logging.
  - Implement high availability, disaster recovery, and
    performance optimization strategies.
  - Collaborate with application development, architecture,
    security, and DevOps teams to deliver cloud-native
    solutions.
  - Participate in production support, incident management, root
    cause analysis, and continuous improvement initiatives.
  - Stay up to date with emerging Google Cloud technologies, AI
    capabilities, and cloud best practices.

