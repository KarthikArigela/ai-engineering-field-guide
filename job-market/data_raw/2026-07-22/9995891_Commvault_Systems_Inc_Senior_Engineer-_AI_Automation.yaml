  Recruitment Fraud Alert

  We’ve learned that scammers are impersonating Commvault team
  members—including HR and leadership—via email or text. These
  bad actors may conduct fake interviews and ask for personal
  information, such as your social security number.

  What to know:

  - Commvault does not conduct interviews by email or text.
  - We will never ask you to submit sensitive documents
    (including banking information, SSN, etc) before your
    first day.

  If you suspect a recruiting scam, please contact us at
  wwrecruitingteam@commvault.com

  About Commvault

  Commvault (NASDAQ: CVLT) is the gold standard in cyber
  resilience. The company empowers customers to uncover, take
  action, and rapidly recover from cyberattacks – keeping data
  safe and businesses resilient. The company’s unique AI-
  powered platform combines best-in-class data protection,
  exceptional data security, advanced data intelligence, and
  lightning-fast recovery across any workload or cloud at the
  lowest TCO. For over 25 years, more than 100,000
  organizations and a vast partner ecosystem have relied on
  Commvault to reduce risks, improve governance, and do more
  with data.

  Senior Engineer- AI & Automation

  The Opportunity

  We have an outstanding career opportunity for Senior
  Engineer- AI & Automation at Bangalore, Hyderabad and Pune
  locations. We’re seeking a Senior AI/ML & Automation
  Engineer for our Solutions Engineering team to deliver AI-
  driven solutions and automated workflows using Commvault
  APIs, automation tools, and cloud services. You’ll work
  independently or collaboratively in a distributed team,
  balancing innovation with strong execution, documentation,
  and a customer-first mindset.

  What you’ll do…

  - Build and deploy AI/ML solutions (NLP, computer vision,
    supervised/unsupervised) informed by data analysis.
  - Partner with product and customer teams to embed AI into
    workflows that meet objectives and compliance needs.
  - Run discovery with technical/non-technical stakeholders;
    translate requirements into scoped designs and outcomes.
  - Deliver and document solutions using Commvault APIs, built-
    in automation/reporting, and third-party integrations.
  - Implement automation and reporting with
    PowerShell/shell/orchestration; use AI coding tools while
    upholding standards.
  - Support remote delivery: deploy, test, and hand over
    solutions to our customers.
  - Manage time across projects; lead customer discussions,
    capture notes, and drive action items.

  Who you are…

  - Bachelor's degree required.
  - 6+ years in IT with strong enterprise infrastructure,
    application operations, and process expertise.
  - 4+ years in project-based delivery teams (customer-facing or
    cross-functional).
  - 3+ years delivering automation and reporting
    (scripting/orchestration).
  - 2+ years programming (Python preferred) with ML frameworks
    (TensorFlow/PyTorch/Scikit-learn).
  - Cloud experience (AWS/Azure/GCP), including AI services.
  - Comfortable using AI-assisted coding tools while maintaining
    quality via reviews and standards.
  - Strong OS, storage, networking, security, and cloud
    fundamentals.
  - SQL Server (T-SQL) query skills for reporting/automation.
  - Scripting with Java/Groovy/JavaScript (or another OO
    language).
  - REST API integration experience (tokens, OAuth, basic/cert
    auth).
  - CI/CD and version control knowledge; hands-on with GitLab CI
    and/or Azure DevOps.
  - Commvault experience (preferred) or another enterprise
    backup/recovery platform.
  - Proven use of AI-assisted tools for development,
    troubleshooting, documentation, and solution design.
  - Orchestration in private clouds (VMware/Hyper-V) and public
    clouds (AWS/Azure).
  - Security and SaaS experience strongly preferred.

  You’ll love working here because:

  - Employee stock purchase plan (ESPP)
  - Continuous professional development, product training, and
    career pathing
  - Annual health check-ups, Car lease Program, and Tuition
    Reimbursement
  - An inclusive company culture, an opportunity to join our
    Community Guilds
  - Personal accident cover and Term life cover

