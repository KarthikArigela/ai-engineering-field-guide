title: AI GTM Engineer
company: hillock.
location: USA
work_type: FULL_TIME
description: |
  The Reality

  Most companies claim to be “AI-powered”—but treat LLMs as a
  magic API. At hillock., you won’t be shipping “proofs of
  concept”; you’ll engineer production-grade systems that
  actually move the revenue needle for clients.

  What You’ll Actually Do

  You’re the engineer who turns “Our engine found 847 high-
  intent prospects matching your ICP” into automated pipelines
  that generate measurable pipeline and revenue. This isn’t
  about building demos; it’s about shipping reliable AI-
  powered systems that let client execs sleep at night.

  AI System Design & GTM Automation

  - Turn proprietary ICP and market research into robust go-to-
    market automations—whether programmatic outreach, SEO,
    ABM, or influencer marketing—using AI/ML tools and
    frameworks.
  - Eliminate random acts of marketing: Architect data-driven,
    repeatable GTM workflows instead of hand-crafted campaign
    hacks.
  - Drive measurable results: Enable 73% of clients to hit
    pipeline targets in Q1 through automation and
    precision—not “one-size-fits-all” playbooks.

  Technical Execution & Performance Tracking

  - Build, deploy, and maintain AI-powered GTM tools and
    integrations—think automated prospecting, lead scoring,
    campaign orchestration, and attribution systems.
  - Prioritize business-critical metrics: pipeline velocity,
    cost per qualified lead, revenue contribution—not vanity
    stats.
  - Ensure reliability and scalability: ship software that works
    across multiple client accounts without constant
    babysitting.

  Cross-functional Collaboration

  - Work directly with GTM strategists and client leads who have
    taken companies from zero to $100M ARR—we make sure
    engineering aligns to business impact.
  - Communicate technical concepts to CEOs/CMOs and non-
    technical stakeholders, translating AI possibilities into
    commercial outcomes.
  - Collaborate on internal product development that multiplies
    humans with automation—not replaces them.

  What We’re Looking ForThe Essentials

  - 3+ years building production software in GTM/growth,
    marketing tech, data engineering, or AI/ML environments
    (track record > tenure).
  - Experience deploying and integrating ML, LLM, or automation
    tools into real-world marketing or sales workflows.
  - Comfort juggling multiple projects and priorities—delivering
    predictable outcomes at pace.

  What Sets You Apart

  - You see marketing as an engineering problem, not just a
    branding race.
  - Strong with data analysis, pipelines, and workflow
    automation. You’ve worked with AI-driven platforms, open-
    source tools, and have a builder’s mindset.
  - Passion for tracking what moves the dial: you debug both
    code and metrics, and can explain “why it works” to a
    founder or marketer.

  The Real Test

  - You know the difference between fragile AI demos and
    production-grade automation.
  - Not afraid to push back when commercial ideas exceed what
    tech can do—or to rapidly prototype until it can.
  - Dismiss buzzwords, prioritize accountability.

  Why hillock. Works Differently

  - No Agency Theater: You’ll engineer with direct access to
    proprietary AI, ICP research, and workflow automation
    tools that dwarf what most “AI agencies” have.
  - No Random Acts of Marketing: Build unified GTM systems with
    measurable impact.
  - Real Technical Depth: Collaborate with top-tier strategists
    and operators, not just “visionaries” with no shipping
    record.
  - Actually Remote-First: Results matter more than location.

  Most GTM engineering roles mean translating vague growth
  goals into technical hand-waving. Here, you’ll ship
  production AI that drives revenue—and always know if it’s
  working.

  Ready to engineer the future of AI-powered GTM? Tell us your
  best story—where did you save a go-to-market team from
  technical chaos, or build something nobody thought possible?
