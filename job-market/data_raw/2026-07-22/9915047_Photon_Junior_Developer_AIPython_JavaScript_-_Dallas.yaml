description: |
  Job Title: Junior Developer AI(Python / JavaScript)



  Location: Dallas, TX



  Experience: 1 years



  Employment Type: Full-time





  Job Summary:



  Looking for a highly motivated and enthusiastic individual
  with a passion for coding and a desire to kickstart your
  career in software development. We're looking for a bright
  and eager Junior Developer to join our dynamic team. This is
  an excellent opportunity for a recent graduate or someone
  early in their career to gain hands-on experience, learn
  from experienced professionals, and contribute to impactful
  projects.



  Technical Skills:



  Solid foundational knowledge in programming concepts and
  data structures.



  Demonstrable experience with either Python or JavaScript
  (through academic projects, personal projects, internships,
  or bootcamps).



  Familiarity with version control systems (e.g., Git) is a
  plus.



  Understanding of web development concepts (HTML, CSS) for
  JavaScript roles is a bonus.







  Soft Skills:



  Excellent communication skills, both written and verbal.
  Ability to articulate technical concepts clearly and
  effectively.



  Eager to learn and have a strong desire for continuous self-
  improvement.



  Proactive, curious, and a problem-solving mindset.



  Ability to work effectively both independently and as part
  of a team.



  Strong attention to detail.



  What You'll do:



  Collaborate with senior developers and cross-functional
  teams to design, develop, and implement software solutions.



  Write clean, efficient, and well-documented code primarily
  in Python or JavaScript.



  Participate in code reviews, testing, and debugging to
  ensure high-quality software.



  Assist in the maintenance and improvement of existing
  applications.



  Learn and adapt to new technologies, frameworks, and best
  practices.



  Contribute to all phases of the software development
  lifecycle.




  Compensation, Benefits and Duration



  Minimum Compensation: USD 40,000 Maximum Compensation: USD
  140,000 Compensation is based on actual experience and
  qualifications of the candidate. The above is a reasonable
  and a good faith estimate for the role. Medical, vision, and
  dental benefits, 401k retirement plan, variable
  pay/incentives, paid time off, and paid holidays are
  available for full time employees. This position is not
  available for independent contractors No applications will
  be considered if received more than 120 days after the date
  of this post
