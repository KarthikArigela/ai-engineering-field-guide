description: |
  Requisition Number: 2370563 Optum is a global organization
  that delivers care, aided by technology to help millions of
  people live healthier lives. The work you do with our team
  will directly improve health outcomes by connecting people
  with the care, pharmacy benefits, data and resources they
  need to feel their best. Here, you will find a culture
  guided by inclusion, talented peers, comprehensive benefits
  and career development opportunities. Come make an impact on
  the communities we serve as you help us advance health
  optimization on a global scale. Join us to start Caring.
  Connecting. Growing together. We are looking for experienced
  AI/Python Developers with 7-9 years of overall professional
  experience to support time-critical AI-driven, cloud-native
  initiatives across Talent Acquisition and Provider Services.
  The role requires hands-on expertise in .NET, Python, SQL,
  Azure or GCP, LLM-based frameworks, Generative AI, Agentic
  AI, RAG-based architectures, cognitive services, and
  scalable system design. The resources will be responsible
  for designing, developing, testing, deploying, and
  maintaining enterprise-grade AI solutions that reduce manual
  dependencies, improve data accuracy, remediate high-volume
  transaction failures, and deliver measurable hard savings
  for the business. Primary Responsibilities:

  - Design, develop, and deploy AI-powered solutions using no-
    code, low-code, and advanced platforms, translating
    business needs into scalable applications that enhance
    products, workflows, and decision-making
  - Design and develop AI-driven, cloud-native applications,
    intelligent automation workflows, and AI agents using
    Python, .NET, SQL, Azure and/or GCP
  - Build, integrate, test, and deploy GenAI, Agentic AI, LLM,
    and RAG-based solutions for enterprise use cases across
    Talent Acquisition and Provider Services
  - Create and maintain automation frameworks, validation
    engines, data extraction capabilities, and autonomous
    remediation workflows to reduce manual effort and improve
    operational accuracy
  - Collaborate with business stakeholders, architects, product
    owners, and engineering teams to translate requirements
    into scalable, secure, production-ready technical
    solutions
  - Ensure code quality, CI/CD readiness, testing coverage,
    documentation, monitoring, and compliance with enterprise
    engineering, AI governance, and delivery standards
  - Development skills - As an AI Builder create Code for the
    project along with other development resources
  - Accelerated Delivery: Enables faster development and
    deployment of high-impact AI solutions aligned to
    enterprise priorities
  - Technical Excellence: Ensures architectural integrity, code
    quality, and scalable system design
  - Risk Mitigation: Reduces delivery delays and operational
    risk through proven engineering practices
  - Future-Ready Operations: Supports long-term maintainability,
    compliance, and audit readiness
  - Documentation and Reporting - create project relevant
    documents and reports for leadership updates
  - Comply with the terms and conditions of the employment
    contract, company policies and procedures, and any and all
    directives (such as, but not limited to, transfer and/or
    re-assignment to different work locations, change in teams
    and/or work shifts, policies in regards to flexibility of
    work benefits and/or work environment, alternative work
    arrangements, and other decisions that may arise due to
    the changing business environment). The Company may adopt,
    vary or rescind these policies and directives in its
    absolute discretion and without any limitation (implied or
    otherwise) on its ability to do so

  Required Qualifications:

  - 7+ years of overall professional experience in software
    engineering, cloud application development, automation, or
    AI solution delivery
  - 5+ years of hands-on experience across .NET, Python, SQL,
    application development, and enterprise solution
    implementation
  - 2+ years of hands-on experience delivering AI, Agentic AI,
    LLM-based, GenAI, or RAG-based projects in a production or
    enterprise environment
  - Solid experience with Azure and/or GCP cloud platforms,
    including cloud-native design, deployment, integration,
    and operational support.
  - Experience with AI productivity and engineering tools such
    as GitHub Copilot, Microsoft 365 Copilot, Codex, Claude,
    and Visual Studio Code-based AI-assisted development
  - Hands-on knowledge of LLM-based frameworks, Agentic
    frameworks such as LangGraph, LangChain or CrewAI, and
    exposure to MCP-based patterns
  - Good understanding of RAG patterns, embeddings, vector
    databases, semantic search, Azure AI Search, Chroma DB,
    MongoDB, cognitive services, NLP, and knowledge retrieval
    capabilities
  - Proven solid engineering fundamentals including APIs,
    microservices, scalable system design, testing, debugging,
    documentation, and secure development practices

  Preferred Qualifications:

  - Experience with GitHub, source control, CI/CD pipelines,
    release management, and DevOps-enabled delivery practices
  - Experience in the healthcare domain is preferred; claims
    process knowledge and provider services experience are
    highly recommended
  - Experience working with US-based customers, distributed
    teams, and enterprise stakeholders
  - Exposure to Agile delivery methodology, sprint-based
    execution, backlog refinement, demos, and iterative
    delivery
  - Proven good communication skills with the ability to explain
    technical concepts clearly to both technical and non-
    technical stakeholders
  - Proven exposure to Gemini, Databricks, Azure OpenAI, Vertex
    AI, responsible AI practices, AI governance controls, and
    production guardrails

  AI Skills and Productivity Expectations

  - Demonstrate baseline proficiency in enterprise-approved AI
    tools including GitHub Copilot, Microsoft 365 Copilot,
    Codex, Claude, and other approved GenAI platforms
  - Maintain consistent use of AI tools, with an expectation of
    minimum 90% weekly usage where applicable to coding,
    documentation, analysis, and delivery workflows
  - Apply AI tools to improve developer productivity, solution
    quality, documentation efficiency, testing support, data
    analysis, and decision-making workflows.
  - Stay current with evolving AI capabilities, LLM frameworks,
    agentic patterns, RAG techniques, and enterprise AI
    governance expectations

  At UnitedHealth Group, our mission is to help people live
  healthier lives and make the health system work better for
  everyone. We believe everyone-of every race, gender,
  sexuality, age, location and income-deserves the opportunity
  to live their healthiest life. Today, however, there are
  still far too many barriers to good health which are
  disproportionately experienced by people of color,
  historically marginalized groups and those with lower
  incomes. We are committed to mitigating our impact on the
  environment and enabling and delivering equitable care that
  addresses health disparities and improves health outcomes -
  an enterprise priority reflected in our mission.
