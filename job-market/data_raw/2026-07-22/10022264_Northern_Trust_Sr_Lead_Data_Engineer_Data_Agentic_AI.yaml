description: |
  About Northern Trust

  As a global leader in innovative wealth management, asset
  servicing, asset management and banking services, Northern
  Trust (Nasdaq: NTRS) is proud to guide the world’s most
  successful individuals, families, corporations and
  institutions.

  Since 1889, we have aligned our efforts with our three
  guiding Principles That Endure: Service, Expertise, and
  Integrity. Together, they reflect the three cornerstones of
  business conduct which we strive to instill in our
  employees, whom we call partners, and to provide to our
  clients and the communities we serve worldwide.

  With more than 135 years of financial experience and over
  24,000 partners, we serve the world’s most sophisticated
  clients using leading technology and exceptional service.

  Northern Trust Asset Management (NTAM) is seeking a hands-on
  Senior Lead Data Engineer to design, build, and operate
  modern data and AI-driven solutions. This is a deeply
  technical role focused on building scalable data platforms
  and applying Agentic AI to solve real-world data
  engineering, quality, and analytics challenges.

  Role Overview

  This role sits within NTAM’s Data & AI engineering
  organization and partners closely with investment,
  operations, and technology stakeholders. The successful
  candidate will work hands-on across the full data
  lifecycle—data ingestion, modeling, validation, analytics,
  and AI augmentation—using Snowflake as the core data
  platform.

  Key Responsibilities

  Design, build, and maintain scalable data pipelines, data
  models, and analytics solutions on Snowflake.

  Lead hands-on development of Agentic AI solutions within the
  data platform, focused on automation and augmentation of
  data engineering and analytics workflows.

  Implement intelligent data quality checks, QA automation,
  reconciliation, and validation frameworks.

  Build automated impact analysis capabilities to assess
  downstream effects of changes to data pipelines, schemas,
  and business logic.

  Translate business and operational data problems into well-
  defined agent-based architectures with clear decision
  boundaries and human-in-the-loop controls.

  Integrate AI agents with enterprise data services including
  Snowflake, APIs, metadata and lineage services, and
  analytics layers.

  Partner with business stakeholders to identify high-value AI
  and data use cases and deliver production-ready solutions.

  Provide technical leadership, code reviews, and
  architectural guidance to engineering teams.

  Ensure solutions meet enterprise standards for data
  security, privacy, auditability, and responsible AI.

  Continuously evaluate emerging data and Agentic AI
  technologies for practical enterprise adoption.

  Agentic AI – NTAM Data Platform Context

  The role applies Agentic AI specifically within NTAM’s
  enterprise data platform, with Snowflake at the core.
  Agentic AI solutions are expected to augment and automate
  data engineering and analytics workflows rather than operate
  as standalone AI systems.

  Hands-on responsibilities include building intelligent
  agents that reason over data, metadata, and business rules
  to proactively detect data quality issues, perform QA
  validation, assess downstream impact of changes, and surface
  actionable insights for engineering and business users.

  All Agentic AI solutions must be production-grade,
  explainable, secure, and aligned with NTAM’s data governance
  and compliance standards.

  Required Skills & Experience

  Expertise designing and building data-driven solutions on
  Snowflake.

  Strong experience in data modeling, ETL/ELT pipelines, and
  data warehouse best practices.

  Hands-on experience delivering Agentic AI or AI-driven
  automation in the data domain.

  Experience with data quality frameworks, and data impact
  analysis.

  Strong understanding of relational and dimensional data
  modeling.

  Experience integrating data platforms with APIs, metadata
  services, and analytics tools.

  Strong programming and problem-solving skills.

  Excellent stakeholder communication and collaboration
  skills.

  Qualifications

  Bachelor’s degree in computer science, Engineering, or a
  related discipline.

  10+ years of hands-on experience in data engineering and
  analytics.

  Experience working in investment management or asset
  management banks preferred.

  Working with Us

  As a Northern Trust partner, you will be part of a flexible
  and collaborative work culture, which has a strong history
  of financial strength and stability. Movement within the
  organization is encouraged, senior leaders are accessible,
  and you can take pride in working for a company committed to
  an inclusive workplace and assisting the communities we
  serve.

  Philanthropy is deeply rooted in Northern Trust’s history
  and is an essential element of our culture. Employees around
  the world give their time and talent to work for the greater
  good of their communities.

  Reasonable Accommodation

  Northern Trust is committed to working with and providing
  adjustments to individuals with health conditions and
  disabilities. If you need a reasonable accommodation for any
  part of the employment process, please email our HR Service
  Center at MyHRHelp@ntrs.com, or alternatively you can
  discuss your individual requirements with the recruiter you
  are working with.

  About Our Bangalore Office

  The Northern Trust Bangalore office, established in 2005, is
  home to over 5,600 employees.  In this stunning office
  space, we offer fantastic amenities which include our
  Arrival Hub - Jungle, the GameZone, and the Employee
  Experience Zone that appeal to both clients and employees.
  Learn more.
