description: |
  About Zscaler

  Zscaler accelerates digital transformation to ensure our
  customers can be more agile, efficient, resilient, and
  secure. As an AI-forward enterprise, we are constantly
  pushing the envelope, leveraging the world’s largest
  security data lake to power our cloud-native Zero Trust
  Exchange platform. This innovation protects our customers
  from cyberattacks and data loss by securely connecting
  users, devices, and applications in any location.

  Here, impact in your role matters more than title and trust
  is built on results. We say, impact over activity. We seek
  innovators who actively use AI to amplify their impact and
  who thrive in an environment where we leverage intelligent
  systems to stay ahead of evolving threats. We believe in
  transparency and value constructive, honest debate—we’re
  focused on getting to the best ideas, faster. We build high-
  performing teams that can make an impact quickly and with
  high quality. To do this, we are building a culture of
  execution centered on customer obsession, collaboration,
  ownership, and accountability.

  We value high-impact, high-accountability with a sense of
  urgency where you’re enabled to do your best work and
  embrace your potential. If you’re driven by purpose, thrive
  on solving complex challenges, and want to be part of the
  team that’s helping to secure the AI age, we invite you to
  bring your talents to Zscaler and help shape the future of
  cybersecurity.

  Role

  We are looking for a AI Engineer to join our team. The
  position is based out at Bangalore or Mohali role, reporting
  to the Snr Manager, Product Business Operations in the AI
  Native - Product Operations Platform department. We are
  seeking a hands-on engineer to help scale the agentic layer
  of our platform by designing production-grade AI systems and
  expanding foundational capabilities. This role is built for
  a strong builder who understands modern AI systems in
  practice and thrives in a high-velocity, rapid-iteration
  environment.

  What you’ll do (Role Expectations)

  - Build and scale the agentic layer of the AI Native - Product
    Operations Platform by designing production-grade AI
    systems and supporting platform capabilities
  - Develop hands-on across FastAPI, NextJS, and Postgres while
    applying practical knowledge of RAG architectures,
    embeddings, and vector retrieval
  - Implement standards, patterns, and guardrails to ensure AI
    development on the platform remains scalable, reliable,
    and cohesive
  - Partner closely with Product and other stakeholders to
    translate business needs into scalable technical solutions
    optimized for cost and throughput
  - Contribute to a high-velocity delivery environment
    characterized by frequent releases, rapid iteration, and
    end-to-end execution

  Who You Are (Success Profile)

  - You are a pragmatic builder with a passion for rolling up
    your sleeves to create, iterate, and ship production-grade
    software.
  - You thrive in ambiguity and fast-paced environments,
    maintaining focus and execution velocity amidst rapid
    change.
  - You act like an owner, bringing deep accountability, a
    strong bias for action, and end-to-end execution to every
    project.
  - You are a high-trust collaborator who excels at partnering
    with cross-functional teams to translate business needs
    into technical solutions.
  - You champion simplicity, with a proven ability to distill
    complex technical problems and AI architectures into
    clean, actionable plans.

  What We’re Looking for (Minimum Qualifications)

  - 8 +yrs of industry experience with demonstrated curiosity
    and active exploration of AI tools, with a proven history
    of integrating new technologies to enhance daily workflows
    and augment problem-solving
  - Bachelor’s degree in Computer Science or a related technical
    field, or equivalent practical experience
  - Strong hands-on software engineering experience with
    FastAPI, NextJS, and Postgres, including building
    application stacks end-to-end
  - Proven experience building and deploying agentic AI systems,
    RAG architectures, embeddings, and vector retrieval
    systems in production environments
  - Familiarity with prompt engineering, orchestration patterns,
    agent workflows, and the implementation of evaluation
    frameworks or guardrails
  - Comfortable operating in a high-velocity delivery
    environment with a track record of supporting weekly
    feature releases

  What Will Make You Stand Out (Preferred Qualifications)

  - Experience working in a startup or fast-scaling product
    environment with a broad technical range across backend,
    frontend, and platform engineering
  - Proven ability to design AI systems optimized for low cost,
    high throughput, extensibility, and long-term scalability
  - Experience selecting and implementing AI development tools,
    observability frameworks, and LLM application patterns

