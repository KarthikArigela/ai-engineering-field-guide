  Job Description:

  Why Work with Us

  At Blueflame AI for Datasite, you will be part of a dynamic
  team that is at the forefront of AI technology in the
  investment management and dealmaking industry. You will have
  the opportunity to work with cutting-edge products and make
  a significant impact on our clients' success. Join us to be
  part of a company that values innovation, client
  satisfaction, and continuous improvement.

  The Software Engineer II position at Blueflame AI plays a
  key role in building high-quality software solutions that
  power the Blueflame AI platform. Working closely with our
  Engineering, Product, and Client Success (Professional
  Services) teams, you'll develop backend services, APIs, and
  platform capabilities that enable our customers to leverage
  AI effectively.

  This role is ideal for an engineer with strong backend
  development experience who enjoys solving complex technical
  problems in a fast-paced startup environment. You'll
  contribute to the design, implementation, and continuous
  improvement of our platform while collaborating with senior
  engineers on architecture and technical direction.

  This is a hybrid position in NYC with 3 days per week in the
  office.

  Responsibilities

  - Design, develop, and maintain backend services for the
    Blueflame AI platform using Python
  - Develop, maintain, and optimize databases including MongoDB
    and Redis
  - Build and maintain RESTful APIs that support frontend
    applications and third-party integrations
  - Write clean, scalable, and well-tested code following
    engineering best practices
  - Implement security measures to protect data and applications
    from unauthorized access and vulnerabilities
  - Contribute to system design and architectural decisions —
    evaluate tradeoffs and communicate technical direction
  - Review and approve pull requests; plan and scope
    deliverables against timelines
  - Optimize platform performance and identify and fix bugs
  - Collaborate with Product, Client Success and Engineering
    teams to deliver new features

  Must have

  - 5-6 years of professional software engineering experience
  - Strong proficiency in Python
  - Experience designing and building RESTful API's
  - Familiarity with distributed systems, asynchronous
    programming, or multi-threaded applications Strong system
    design and architecture experience
  - Experience working with MongoDB and/or Redis
  - Currently based in (or willing to relocate to) the NYC metro
    area
  - Able to work onsite in NYC three days per week

  Nice to Have

  - Experience with LLMs or applied AI
  - End-to-end SDLC ownership
  - Experience leading a team or coordinating across multiple
    stakeholders

