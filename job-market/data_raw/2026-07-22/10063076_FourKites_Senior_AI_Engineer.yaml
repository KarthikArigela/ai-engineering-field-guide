description: |
  At FourKites we have the opportunity to tackle complex
  challenges with real-world impacts. Whether it's medical
  supplies from Cardinal Health or groceries for Walmart, the
  FourKites platform helps customers operate global supply
  chains that are efficient, agile and sustainable.

  Join a team of curious problem solvers that celebrates
  differences, leads with empathy and values inclusivity.

  As a Senior AI Engineer, you'll join a 10-person team
  focused on data integrations (shippers and carriers moving
  in and out of the FourKites ecosystem) and our active AI
  agent workstreams — including a support automation agent
  handling 60-70% of customer tickets, a voice agent that
  calls carriers to gather and update information, and an end-
  to-end carrier onboarding agent (email + voice). You'll work
  on features end to end (~75-80% backend, ~20-25% frontend)
  using Python, Java/GoLang, agentic frameworks like
  LangGraph, React, Redis and PostgreSQL. You'll develop
  products that change the logistics landscape for some of the
  biggest corporations in the world, and work closely with our
  US team and customers to shape the future of the industry.

  What you’ll be doing:

  - Design, build, and productionize AI agents/workflows (e.g.,
    support automation, voice, and onboarding agents) using
    agentic frameworks such as LangGraph
  - Develop, test, and maintain backend applications in Python
    and Java or GoLang
  - Write clean, efficient, and well-documented code across the
    full SDLC — development, QA, and release
  - Design and implement data models and database schemas
  - Collaborate with the frontend team to integrate the backend
    with the user interface
  - Perform code reviews and ensure code quality standards are
    met
  - Troubleshoot and debug applications, including AI agent
    workflows in production
  - Work with the DevOps team to deploy and manage applications
    in production (Kubernetes)
  - Continuously learn and stay up to date with new technologies
    and industry trends, particularly in the AI/agentic space

  About the team:

  Our product and engineering teams are dedicated to providing
  the industry's best-in-class end-to-end supply chain
  visibility platform. This team of 10 (one staff engineer,
  plus senior and junior engineers) owns data integrations
  across our shipper/carrier ecosystem and is actively
  building out FourKites' AI agent capabilities. We are
  committed to building a high-performing team with software
  craftsman-thinking, dedicated to developing and enhancing
  our core platform — and we want you to be a central part of
  it! Who you are:

  - 3+ years of experience as a Backend/Software Developer, with
    hands-on exposure to AI/agentic systems (deep AI expertise
    not required, but you should be comfortable in the
    ecosystem)
  - Python — mandatory
  - Java or GoLang — proficiency in at least one
  - Hands-on experience (2+ years) with LangGraph or similar
    agentic frameworks — non-negotiable for this role
  - Strong understanding of object-oriented programming
    principles
  - Experience with databases such as MySQL, PostgreSQL, or
    MongoDB
  - Familiarity with front-end technologies such as HTML, CSS,
    JavaScript, and React
  - Good knowledge of RESTful APIs and microservices
    architecture
  - Working knowledge of Kubernetes
  - Full Agile SDLC experience — development, QA, and release
  - Excellent problem-solving and analytical skills
  - Ability to work independently and in a team environment
  - Strong knowledge of Git (branches, submodules, rebasing) and
    Agile tools such as JIRA and Confluence
  - Experience with Amazon Web Services or other cloud services
    is a plus
  - Excellent oral and written communication skills

  Who we are:

  FourKites, the leader in AI-driven supply chain
  transformation for global enterprises and pioneer of real-
  time visibility, turns supply chain data into automated
  action. FourKites Intelligent Control Tower® breaks down
  enterprise silos by creating a real-time digital twin of
  orders, shipments, inventory and assets. This comprehensive
  view, combined with AI-powered digital workers, enables
  companies to prevent disruptions, automate routine tasks and
  optimize performance across their supply chain. FourKites
  processes over 3.2 million supply chain events daily — from
  purchase orders to final delivery — helping 1,600-plus
  global brands prevent disruptions, make faster decisions and
  move from reactive tracking to proactive supply chain
  orchestration. For more information, visit
  www.fourkites.com.

  FourKites provides competitive compensation with stock
  options, outstanding benefits and a collaborative culture
  for all employees around the globe. To help you be your
  best, we have 5 global recharge days, in addition to
  generous PTO and standard holidays. Parental leave for all
  parents, an annual wellness stipend and volunteer days also
  provide you with time and resources for self care and to
  care for others. Throughout the year, FourKites sets aside
  time during the workday to learn and celebrate diversity.
  We're always listening for new ways to support everyone in
  and out of the office. Benefits:

  - Medical  benefits start on first day of employment
  - 36 PTO days( Sick, Casual and Earned) , 5 recharge days, 2
    volunteer days
  - Home Office set ups and Technology reimbursement
  - Lifestyle & Family benefits
  - Mental Wellness support and guidance
  - Ongoing learning & development opportunities (Professional
    development program, Toast Master club etc.)

  FourKites is an equal opportunity employer. We celebrate
  diversity and are committed to creating an inclusive
  environment for all employees.
