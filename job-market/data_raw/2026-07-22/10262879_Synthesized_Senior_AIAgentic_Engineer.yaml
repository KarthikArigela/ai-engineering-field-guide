description: |
  👋 About Us

  It's hard to build a reliable system. It's harder to make
  sure that what you've built is really reliable.

  Synthesized is redefining software testing. Our platform
  automates test data, test cases, and test environments -
  empowering enterprise teams to ship faster, reduce
  compliance risks, and modernise QA at scale.

  We’re an ambitious VC-backed startup, having recently gone
  through Series A with leading global investors including
  redalpine, IQ Capital, Seedcamp, and Deutsche Bank. We have
  ambitious growth plans, and we are so keen for you to join
  us on the journey.

  🔍 The Role

  We are hiring an AI Engineer to help form the strategic
  direction of our agentic offering - turning vision into
  shipped, scalable systems.

  This is a hands-on, builder-first role on our small applied-
  AI team. You'll work with our Product team to identify
  opportunities, scope them, and ship production-grade agentic
  capabilities integrated across our wider platform.

  🛠️ Stack & How We Work

  - Python, LangChain, Anthropic SDK, Pydantic, Docker
  - Spec-driven: product and tech specs live in Notion before
    code does
  - Benchmark-driven: every change scored against a golden-set
    rubric. Agents that demo well but regress under load don't
    ship
  - LangSmith for trace-driven debugging and agent observability

  📋 What You’ll Be Doing

  - Drive product direction for our agentic offering, in close
    collaboration with our Product team
  - Identify opportunities, scope them, and ship
  - We're looking for engineers who think like product builders,
    comfortable shaping the "what" as well as the "how"
  - Own the design, architecture, and implementation of agentic
    offerings, including:
    - End-to-end solution delivery
    - Integrations with wider ecosystems
      (partners/customers/platforms)
  - Drive prototypes through to production code, deployed
    alongside other Synthesized product offerings
  - Support partner/customer technical integration discussions
    where needed
  - Raise the bar for agentic systems engineering through the
    code you ship and the patterns you share with the team

  🌱 About You

  - Proven experience in design, architecture, and
    implementation of agentic offerings, including complete
    solutions and ecosystem integrations
  - Built and shipped agents in production - tool/prompt design,
    framework tradeoffs, eval loops that catch regressions
  - Nice to have: experience in test data management, test
    automation, or QA tooling
  - Broader awareness of Software Quality Engineering is a
    supporting advantage
  - Comfortable operating in ambiguity
  - Demonstrated ownership and high velocity

  ✨ What We Offer

  - 💰 Competitive salary & meaningful equity – so you share in
    our success
  - 🌴 25 days annual leave + celebration days + your birthday
    off
  - 🌍 Work From Anywhere – up to 1 month per year, fully
    flexible
  - 🏢 Hybrid working – a mix of home and our London offices
  - 📚 Learning & development budget – for coaching, courses, and
    conferences
  - ⚕️ Private medical, dental & vision cover
  - ✈️ Regular team socials & offsites – connect, celebrate, and
    recharge
  - 🤝 A collaborative team – smart, ambitious, and supportive
  - 🐤 Generous family leave – because life outside of work
    matters too

  🌍 Equal Opportunities

  We are committed to an inclusive and diverse workplace at
  Synthesized. Synthesized is an equal opportunity employer.
  We do not discriminate based on race, ethnicity, colour,
  ancestry, national origin, religion, sex, sexual
  orientation, gender identity, age, disability, veteran
  status, genetic information, marital status or any other
  legally protected status.
