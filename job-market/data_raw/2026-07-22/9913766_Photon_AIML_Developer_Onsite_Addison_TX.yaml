title: "AI/ML Developer | Onsite | Addison, TX"
company: Photon
location: USA
work_type: FULL_TIME
description: |
  Role Overview



  We are seeking a skilled AI/ML Developer with 5–6 years of
  experience to design, develop, and deploy machine learning
  models and AI-driven solutions. The ideal candidate should
  have strong programming skills, hands-on experience with ML
  frameworks, and the ability to translate business problems
  into scalable AI solutions.



  Key Responsibilities:



  - Design, build, and optimize machine learning and deep
    learning models
  - Develop end-to-end ML pipelines (data preprocessing,
    training, evaluation, deployment)
  - Work with large datasets and perform feature engineering
  - Deploy models using cloud platforms and APIs
  - Collaborate with cross-functional teams to integrate AI
    solutions into products
  - Monitor model performance and retrain as needed
  - Stay updated with the latest advancements in AI/ML



  Required Skills:



  - Strong proficiency in Python and ML libraries (TensorFlow,
    PyTorch, Scikit-learn)
  - Experience with NLP, computer vision, or predictive
    analytics
  - Solid understanding of data structures, algorithms, and
    statistics
  - Experience with cloud platforms (AWS, Azure, or GCP)
  - Knowledge of MLOps tools (Docker, Kubernetes, CI/CD
    pipelines)
  - Familiarity with SQL and big data tools (Spark, Hadoop)



  Qualifications:



  - Bachelor’s or Master’s degree in Computer Science, AI, Data
    Science, or related field
  - 5–6 years of relevant experience in AI/ML development



  Good to Have:



  - Experience with generative AI or LLMs
  - Knowledge of model explainability and ethical AI
  - Exposure to real-time ML systems



  Compensation, Benefits and Duration



  Minimum Compensation: USD 44,000 Maximum Compensation: USD
  154,000 Compensation is based on actual experience and
  qualifications of the candidate. The above is a reasonable
  and a good faith estimate for the role. Medical, vision, and
  dental benefits, 401k retirement plan, variable
  pay/incentives, paid time off, and paid holidays are
  available for full time employees. This position is
  available for independent contractors No applications will
  be considered if received more than 120 days after the date
  of this post
