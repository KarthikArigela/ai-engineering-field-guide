  Your Next Career Opportunity – RPA & AI Enablement
  Developer/Workflow Automation Developer

  The primary function of this position is to integrate
  automated workflows and data-driven insights into SBAs
  Domestic Operation organization, establishing a foundation
  for scalable, AI-Driven processes in the future.

  This position is responsible for combining strong technical
  skills in workflow automation with a deep understanding of
  operational processes. The role will focus on developing and
  deploying scalable RPA solutions using tools like UiPath and
  Power Automate, while also leveraging platforms such as
  Power BI to monitor performance, highlight efficiency gains,
  and support data-driven decision-making.

  We’re seeking a forward-thinking RPA & AI Enablement
  Developer to help streamline critical processes across SBA’s
  Domestic Operations organization. This role bridges hands-on
  technical delivery with real-world operational
  impact—designing solutions that reduce manual effort,
  improve accuracy, and enhance visibility across teams. The
  ideal candidate will have experience implementing automation
  in business environments and will contribute to building a
  foundation for AI enablement as the organization matures its
  digital capabilities.

  What You Will Do – Primary Responsibilities

  - Identify and develop workflow automation opportunities
    across Tower Operations, Field Services, New Asset
    Development, and Strategic Sales to reduce manual effort
    and streamline workflows.
  - Design, develop, and maintain robust Robotic Process
    Automation (RPA) solutions using UiPath, Power Automate,
    and SharePoint in alignment with business goals.
  - Collaborate with operational leaders to evaluate repetitive,
    high-effort tasks and translate them into scalable RPA
    solutions.
  - Build dashboards and reporting mechanisms using Power BI to
    visualize process efficiency, automation performance, and
    operational impact.
  - Ensure integration of automation workflows with existing
    enterprise systems, including ServiceNow, PMDB, and other
    operational platforms.
  - Partner with business analysts and IT to ensure data
    quality, workflow accuracy, and the scalability of
    automation pipelines.
  - Support adoption of Microsoft Copilot and other Microsoft
    365 tools through guided use cases and lightweight
    prototypes.
  - Contribute to an AI-ready culture by documenting workflows,
    standardizing automation patterns, and identifying future
    use cases where AI can be layered onto existing processes.
  - Promote a culture of continuous improvement by monitoring
    RPA workflows, gathering feedback, and optimizing
    performance to ensure long-term value and usability.
  - Assist in creating internal training resources and
    supporting end-users in leveraging automation tools
    effectively.
  - Stay abreast of emerging AI technologies and recommend new
    tools or frameworks aligned with operational need

  What You’ll Need – Qualifications & Requirements

  - Bachelor’s degree in Computer Science, Information Systems,
    Business Technology, or a related field; equivalent
    professional experience will be considered.
    - 3+ years of hands-on experience in workflow automation,
      process optimization, or operations technology support
  - Proven ability to design, develop, and deploy scalable
    automation solutions using RPA tools such as UiPath, Power
    Automate, or Automation Anywhere
  - Strong working knowledge of the Microsoft Power Platform,
    including Power Automate, Power BI, and SharePoint
    integrations
  - Demonstrated experience mapping business workflows and
    translating them into automated processes with measurable
    impact
  - Familiarity with process documentation, change management,
    and stakeholder collaboration in enterprise settings
  - Ability to work cross-functionally and communicate clearly
    with both technical and non-technical stakeholders
  - Comfortable working in a dynamic environment and
    continuously learning new tools and platforms as
    automation capabilities evolve
  - Interest in exploring AI-enhanced workflow tools (e.g.,
    Microsoft Copilot) as part of future process improvement
    efforts

