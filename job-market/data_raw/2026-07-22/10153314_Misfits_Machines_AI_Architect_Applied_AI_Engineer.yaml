description: |
  AI Architect (Applied AI Engineer)

  Location: Remote Status: Full-Time

  At Misfits & Machines, the innovation sister company of
  Marketing Architects, we’re not just exploring what AI can
  create—we’re building transformative technologies that help
  marketers machine remarkable growth in the age of AI. Our
  team is obsessed with reimagining the marketing value chain
  through automation, machine learning, and scalable
  innovation. If you believe the future belongs to bold ideas
  executed with precision and humanity, we’d love to meet you.

  ROLE OVERVIEW

  As an AI Architect, you’ll report to the Head AI Architect
  and work hands-on with our creative, product, and
  engineering teams to design and build the AI systems behind
  our generative video platform. This is a hands-on
  architecture role at the frontier of applied AI: you’ll sit
  with stakeholders, translate their ideas into agentic
  systems in real time, and build and ship them yourself.
  You’ll also own how we measure and improve those systems,
  keeping a close read on how everything performs in
  production.

  What you'll do:

  - Design and build agentic systems: Create and maintain the AI
    agent workflows and orchestration pipelines that power the
    platform, using Mastra, n8n, or the right tool for the
    job.
  - Turn ideas into architecture, live: Sit in working sessions
    with creative and product stakeholders, gather
    requirements on the fly, and translate them into working
    AI systems.
  - Craft and refine the intelligence: Write, test, and
    iteratively improve prompts and multi-step systems,
    creative generators, evaluation/judging panels, and
    guardrail checks.
  - Own observability and evals: Manage prompts and traces in
    Weave (or a comparable tool), craft and run evals, and
    meet with product stakeholders to understand how prompts
    are performing.
  - Make the architecture calls: Decide when to use agents vs.
    workflows, where logic should live, and how to keep
    systems flexible as the product evolves.

  Who you are:

  - Experienced engineer: 5+ years in software engineering,
    including 2+ years building and shipping LLM-powered or
    agentic systems in production.
  - Agentic system builder: You’ve designed and shipped LLM
    agent systems end-to-end and understand the difference
    between agents and workflows, orchestration, tool use, and
    memory.
  - Prompt engineer: You can reliably shape an LLM’s behavior,
    personality, and output, and you’ve built evaluation,
    judging, or guardrail systems to keep quality high.
  - Observability-minded: Hands-on experience running evals and
    tracing LLM systems; familiarity with Weave (Weights &
    Biases) or a comparable tool is a strong plus.
  - Fluent in code: Proficient in TypeScript / JavaScript and
    Node.js, and an active user of AI-assisted coding tools
    like Cursor or Claude Code.
  - Framework-flexible: Experience with Mastra or an equivalent
    agent-orchestration framework and workflow tools like n8n
    (Mastra itself is a nice-to-have, it’s new and quick to
    pick up).
  - Multi-model: Familiar with multiple LLM providers (Claude,
    GPT, Gemini) and how model choice shapes output.

  What this role is not:

  - A people-management or team-lead role, you’ll build
    shoulder-to-shoulder with the team as a hands-on
    individual contributor, not manage it.
  - A pure research or prototyping role, you’ll ship working
    systems that make it to production, not just decks and
    demos.
  - Prompt-writing in isolation, you’ll own the architecture and
    observability end-to-end.

  Your First 90 Days:

  - Ramp fast on the platform architecture and creative
    pipeline, we’re in an active build phase, so speed
    matters.
  - Design and ship working agentic workflows, and get the
    team’s evals running in Weave.
  - Partner closely with the Head AI Architect and
    creative/product stakeholders, taking real work off their
    plates.

  BENEFITS OVERVIEW

  We offer rewarding careers that encourage growth while
  providing industry-leading benefits including:

  - Fully remote within the US
  - 100% employer-paid medical, dental and disability, with
    vision option
  - Traditional and Roth 401(k) with a 4% company match
  - Flexible paid time off, 9 paid holidays plus 2 floating
    holidays
  - Paid parental leave
  - Annual office supply allowance, monthly internet stipend and
    employer-paid cell phone
  - Opportunities to connect virtually and in-person twice a
    year with our fully remote team

  Learn more at https://misfitsandmachines.com/

  ADDITIONAL INFORMATION

  We want applications from everyone, regardless of race,
  creed, color, religion, sex, sexual orientation, gender
  identity, national origin, marital status, citizen status,
  age, disability, military or protected veteran status,
  genetic predisposition or carrier status or any other
  legally protected status.

  Our remote-friendly work model supports flexibility across
  the US, however we are currently unable to support
  employment in California. We are unable to consider
  applicants who live outside of the US.

  At this time, we're not considering candidates that need any
  type of immigration sponsorship (additional work
  authorization or permanent work authorization) now or in the
  future. This includes, but is not limited to: F1-OPT,
  F1-CPT, H-1B, TN, L-1, J-1, O-1, etc.

  The application for this position may request a short, job
  relevant assessment as part of our multi-stage interview
  process. Reasonable accommodations are available for this
  assessment, please reach out to talentteam@markarch.com.

  The actual base pay is dependent upon many factors, such as
  training, transferable skills, work experience, business
  needs, location and market demands. The base pay range is
  subject to change and may be modified in the future.

