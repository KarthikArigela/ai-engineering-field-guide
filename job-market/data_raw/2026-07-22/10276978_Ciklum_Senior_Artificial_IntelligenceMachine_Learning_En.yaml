description: |
  Ciklum is looking for a Senior Artificial
  Intelligence/Machine Learning Engineer to join our team
  full-time in India.

  We are a custom product engineering company that supports
  both multinational organizations and scaling startups to
  solve their most complex business challenges. With a global
  team of over 4,000 highly skilled developers, consultants,
  analysts and product owners, we engineer technology that
  redefines industries and shapes the way people live.

  About the role:

  We are seeking a Senior Artificial Intelligence/Machine
  Learning Engineer with 6+ years of experience in AI/ML
  engineering. The ideal candidate will have strong Python
  skills, hands-on experience with embedding pipelines,
  retrieval-augmented generation (RAG) loops, and applied NLP
  with multilingual models. You will work closely with the
  AI/ML lead to design, implement, and optimize pipelines that
  power knowledge generation and retrieval across multiple
  languages.

  Responsibilities:

  - Implement the retrieval and generation pipeline under the
    guidance of the AI/ML lead
  - Build and tune the embedding pipeline to ensure high-quality
    vector representations
  - Develop the draft-to-publish KB article generation loop with
    confidence scoring
  - Ensure multilingual quality across all confirmed Phase 1
    languages
  - Build retrieval evaluation harnesses to measure pipeline
    performance
  - Lay the groundwork for LLM tuning in Phase 2, including
    fine-tuning strategies and evaluation metrics

  Requirements:

  - 6+ years of experience in AI/ML engineering
  - Strong proficiency in Python for ML and data workflows
  - Experience building embedding pipelines and RAG generation
    loops
  - Familiarity with vector databases (Qdrant or pgvector)
  - Applied NLP experience, ideally with multilingual models
  - Hands-on experience with LLM API integration
  - Solid understanding of ML evaluation methods and confidence
    scoring

  Desirable:

  - Strong problem-solving and analytical skills
  - Ability to collaborate effectively with leads and cross-
    functional teams
  - Experience working with large-scale knowledge systems
  - Passion for advancing AI/ML solutions in real-world
    enterprise environments

  What’s in it for you?

  - Strong community: Work alongside top professionals in a
    friendly, open-door environment
  - Growth focus: Take on large-scale projects with a global
    impact and expand your expertise
  - Tailored learning: Boost your skills with internal events
    (meetups, conferences, workshops), Udemy access, language
    courses, and company-paid certifications
  - Endless opportunities: Explore diverse domains through
    internal mobility, finding the best fit to gain hands-on
    experience with cutting-edge technologies
  - Care: We’ve got you covered with company-paid medical
    insurance, mental health support, and financial & legal
    consultations

  About us:

  At Ciklum, we are always exploring innovations, empowering
  each other to achieve more, and engineering solutions that
  matter. With us, you’ll work with cutting-edge technologies,
  contribute to impactful projects, and be part of a One Team
  culture that values collaboration and progress.

  India is a strategic innovation hub for Ciklum, with growing
  teams in Chennai and Pune leading advancements in EdgeTech,
  AR/VR, IoT, and beyond. Join us to collaborate on game-
  changing solutions and take your career to the next level.

  Explore, empower, engineer with Ciklum!

  Interested already? We would love to get to know you! Submit
  your application. We can’t wait to see you at Ciklum.
