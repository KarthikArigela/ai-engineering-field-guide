description: |
  Careers that change lives start here. Medtronic is a global
  leader in healthcare technology with a Mission to alleviate
  pain, restore health, and extend life. Our 95,000 employees
  work across more than 150 countries to put patients first —
  developing innovative medical technologies that improve the
  lives of 72+ million patients each year. Your unique talents
  will help shape the future of healthcare while building a
  career grounded in purpose, growth, and impact.

  A Day in the LifeAs a Software Engineer II, you will be part
  of the data streaming operations team responsible for
  designing, operating, and integrating the real-time message
  platform centered around Confluent Kafka. Responsibilities
  include platform reliability, scalability, security,
  platform evolution, and developer experience. This position
  will participate in on call support (on need basis) to
  ensure platform availability and operational excellence. You
  will focus on automated deployment of infrastructure through
  CI/CD pipelines and self service workflows for application
  teams. You will work directly with application teams as the
  subject matter expert to provide guidance on event-driven
  design & best-practices.

  Responsibilities may include the following and other duties
  may be assigned.

  - Work independently under limited supervision to own and
    operate data streaming platforms.
  - Manage Confluent Cloud–based Kafka environments to ensure
    high availability, scalability, and performance.
  - Support self‑managed Kafka clusters on Kubernetes.
  - Implement and maintain supporting components such as Schema
    Registry, Kafka Connect, Flink, & Tableflow.
  - Set up proactive monitoring, alerting, and observability to
    ensure platform uptime and reliability using Dynatrace,
    Prometheus, & Grafana, & ELK.
  - Lead troubleshooting of production incidents and perform
    root‑cause analysis and post‑incident reviews.
  - Use platform metrics and usage statistics to guide capacity
    planning and infrastructure right‑sizing.
  - Build automation and Infrastructure as Code to streamline
    Kafka provisioning, configuration, and lifecycle
    management through CI/CD pipelines.
  - Automate routine administrative tasks.
  - Partner with application, security, and cloud infrastructure
    teams to align platform capabilities with business needs.

  Required Knowledge and Experience:

  - 4-7 years of IT experience with a Bachelor’s degree in
    Computer Engineering, Software Engineering, Computer
    Science, or a related technical field.
  - Relevant Experience: Minimum 1 year hands‑on experience in
    Platform Engineering (not application development
    experience) working with Apache Kafka or Confluent Cloud
    in production.
  - Minimum 3 year of experience working with any of these cloud
    providers – AWS / Azure / GCP.
  - Hands‑on experience with Infrastructure as Code (IAC) tools
    like Terraform or AWS CloudFormation or Azure ARM/Bicep.
  - Experience with source control systems such as Git/GitHub.
  - Working experience with CI/CD pipelines and GitOps
    practices.
  - Experience deploying to Kubernetes.
  - Basic understanding of distributed systems and event-driven
    architecture.
  - Strong problem‑solving skills with the ability to
    troubleshoot complex production issues.
  - Strong written and verbal communication skills and ability
    to collaborate across teams and geographies.
  - Ability to take business and technical requirements and work
    independently to deliver scalable solutions.
  - Self-motivated mindset and willingness to embrace challenges
    and maintain initiative.Nice to have:
  - Experience working with AWS native tools such as IAM Roles,
    Secrets Manager, S3, Lambda, Route53, & VPC’s.
  - Experience developing event driven applications.
  - Previous healthcare or regulated‑industry experience is a
    plus

  Physical Job Requirements The above statements are intended
  to describe the general nature and level of work being
  performed by employees assigned to this position, but they
  are not an exhaustive list of all the required
  responsibilities and skills of this position.

