  ·       Fertility support and paid parental leave

  On-Camera Policy To support a fair, transparent, and
  engaging interview experience, candidates interviewing
  remotely are expected to be on camera during all video
  interviews. Being on camera fosters authentic connection,
  improves communication, and allows for full engagement from
  both candidates and interviewers. We understand that
  technical, bandwidth, or location-related challenges may
  occasionally prevent video use. If this applies, candidates
  are required to notify us in advance so we can explore
  appropriate accommodations.

  Security Requirements Conducts duties and responsibilities
  in accordance with AWN’s Information Security policies,
  standards, processes, and controls to protect the
  confidentiality, integrity, and availability of AWN business
  information (in accordance with our employee handbook and
  corporate policies). Background checks are required for this
  position. This position may require access to information
  protected under U.S. export control laws and regulations,
  including the Export Administration Regulations (“EAR”).
  Please note that, if applicable, an offer for employment
  will be conditioned on authorization to receive software or
  technology controlled under these laws and regulations.

