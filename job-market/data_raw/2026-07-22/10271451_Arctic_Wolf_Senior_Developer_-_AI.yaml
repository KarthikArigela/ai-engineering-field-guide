  About the Role

  Why Arctic Wolf?

  At Arctic Wolf, we foster a collaborative and inclusive work
  environment that thrives on diversity of thought,
  background, and culture. This is reflected in our multiple
  awards, including Top Workplace USA (2021-2024), Best Places
  to Work – USA (2021-2024), Great Place to Work – Canada
  (2021-2024), Great Place to Work – UK (2024), and Kununu Top
  Company – Germany (2024). Our commitment to bold growth and
  shaping the future of security operations is matched by our
  dedication to customer satisfaction, with over 7,000
  customers worldwide and more than 2,000 channel partners
  globally. As we continue to expand globally and enhance our
  technology, Arctic Wolf remains the most trusted name in the
  industry.

  Our Values 

  Arctic Wolf recognizes that success comes from delighting
  our customers, so we work together to ensure that happens
  every day. We believe in diversity and inclusion, and truly
  value the unique qualities and unique perspectives all
  employees bring to the organization. And we appreciate
  that—by protecting people’s and organizations’ sensitive
  data and seeking to end cyber risk— we get to work in an
  industry that is fundamental to the greater good. We
  celebrate unique perspectives by creating a platform for all
  voices to be heard through our Pack Unity program. We
  encourage all employees to join or create a new alliance.
  See more about our Pack Unity here.   We also believe and
  practice corporate responsibility, and have recently joined
  the Pledge 1% Movement, ensuring that we continue to give
  back to our community. We know that through our mission to
  End Cyber Risk we will continue to engage and give back to
  our communities. 

  All wolves receive compelling compensation and benefits
  packages, including: 

  ·       Equity for all employees

