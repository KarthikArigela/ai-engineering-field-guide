description: |
  At Arctic Wolf, we're redefining the cybersecurity
  landscape. With our employee Pack members, spread out
  globally, committed to setting new industry standards. Our
  accomplishments speak for themselves, from our recognition
  in the Forbes Cloud 100, CNBC Disruptor 50, Fortune Future
  50, and Fortune Cyber 60 to winning the 2024 CRN Products of
  the Year award. We’re proud to be named a Leader in the IDC
  MarketScape for Worldwide Managed Detection and Response
  Services and earning a Customers' Choice distinction from
  Gartner Peer Insights. Our Aurora Platform also received
  CRN’s Products of the Year award in the inaugural Security
  Operations Platform category. Join a company that’s not only
  leading, but also shaping, the future of security
  operations.

  Our mission is simple: End Cyber Risk. We’re looking for a
  Senior Developer - Security Research Services Development
  (SRSD) to be part of making this happen.

  About the Role:

  - Design, develop, and maintain backend services and
    microservices using Python, Go, and cloud-native
    technologies.

  - Build secure, scalable systems leveraging AWS services
    including RDS, DynamoDB, and Kubernetes.

  - Integrate software components into robust, production-ready
    systems with clear documentation and maintainability.

  - Mentor junior developers and contribute to team growth
    through knowledge sharing and technical leadership.

  - Collaborate with cross-functional teams to understand
    product requirements and deliver impactful solutions.

  - Apply test-driven development and CI/CD practices using
    tools like Git, Jenkins, Terraform, and Docker.

  - Solve complex problems creatively, using advanced analytical
    and debugging techniques.

  - Participate in R&D demos and annual hackathons to showcase
    innovation and explore new ideas.


  What You Bring:

  - 4-9 years of professional software development experience,
    with a strong focus on backend systems.
  - Proven ability to work independently on large-scale features
    and systems.
  - Deep understanding of software engineering principles, cloud
    architecture, and secure coding practices.
  - Experience with Python/Go programming languages.
  - Hands-on experience with container orchestration
    (Kubernetes), System designing.
  - Familiarity with cloud platforms (preferably AWS) and
    distributed systems.
  - Strong collaboration and communication skills, with a
    passion for mentoring and team development. .
  - Cybersecurity, such as threat intelligence, threat
    detection, SIEM, EDR/XDR, malware analysis, security
    analytics, identity security, or cloud security.
  - AI Agent development, including experience with LLM-based
    applications and agentic frameworks such as LangChain,
    LangGraph, Langfuse, RAG,  MCP, vector databases, AI
    evaluation, prompt engineering, or agent orchestration.

