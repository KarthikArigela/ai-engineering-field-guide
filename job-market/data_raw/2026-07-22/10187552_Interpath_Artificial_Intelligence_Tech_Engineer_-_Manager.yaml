  Artificial Intelligence / Tech Engineer - Manager

  Interpath | Gurugram

  About Interpath

  Interpath is an international and fast-growing advisory
  business with deep expertise in a broad range of specialisms
  spanning Deals, Advisory and Restructuring capabilities.

  We deliver tangible results for global businesses, their
  investors, and stakeholders when complex problems arise, and
  critical decisions need to be made. Interpath is agile,
  independent, and conflict-free, and our passion for doing
  what’s right, every time, sets us apart.

  Our diverse teams provide specialist technical knowledge
  combined with deep sector experience across our service line
  specialisms. Since our foundation in 2021, Interpath has
  grown rapidly, and we now have a presence across the UK,
  Ireland, France, Germany, Austria, Spain, BVI, Cayman
  Islands, Bermuda, Barbados, and Hong Kong. By 2030 we aim to
  be one of the world’s leading advisory firms with a truly
  global footprint.

  About the role

  You are the hands-on technical lead of the AI function —
  designing and building AI solutions (agents, tools,
  copilots), leading use cases and pilots from idea to
  production, and supporting business teams as a technical
  subject-matter expert on complex topics.

  Key responsibilities artificial intelligence

  - Build AI solutions (agents, tools) — design and build LLM
    agents, tools, copilots and integrations, including
    planning/tool-calling, RAG, guardrails and evaluation.
  - Lead use cases & pilots — own delivery of priority use cases
    end-to-end: scope, prototype, pilot, harden and move to
    production.
  - Support the business on complex topics — act as technical
    SME to business teams; translate problems into solutions,
    assess feasibility and de-risk delivery.
  - Integrate solutions with enterprise systems, data and MLOps;
    ensure reliability, security and cost-efficiency.
  - Set technical standards and mentor junior engineers;
    contribute reusable accelerators and patterns.
  - Partner with the PMO Lead and AI Support on delivery
    tracking and stakeholder updates.

  Requirements

  Required qualifications

  - Min 7+ years in software / ML / AI engineering with strong
    Python.
  - Hands-on with LLM and agent frameworks (LangChain /
    LangGraph), RAG and vector databases.
  - Full-stack and/or ML engineering depth and cloud (AWS /
    Azure / GCP).
  - Experience leading delivery of technical projects and
    engaging business stakeholders.
  - A portfolio of shipped work — production apps, agents, demos
    or GitHub.

  Preferred or Desired Experience (nice to have)

  - Shipped production GenAI applications or agents.
  - MLOps / LLMOps experience; team-lead experience.
  - Domain knowledge in the target business area.

  Education/experience lending itself to demonstrate strong
  commercial acumen:

  - Post Graduation degree / MBA or equivalent professional
    course certification
  - Advanced degree in CS / ML / Engineering

  Tech & tools

  Python, LangGraph / LangChain, RAG & vector DBs (pgvector /
  Pinecone / Weaviate), OpenAI / Anthropic APIs, FastAPI /
  Node, cloud ML (SageMaker / Vertex / Azure ML), Docker.

  Our Values:

  Embrace different: - From cultures to mindsets, we welcome
  them all. Our global presence means we’re inclusive by
  nature and we believe that people are equal, but not the
  same.

  Do the right thing: - Our comfort zone is uncomfortable; we
  always make the right decision not what is simply easy or
  popular. Always consider how to implement these decisions,
  people will always remember how you made them feel.

  All hands on deck: - We stand shoulder to shoulder with
  colleagues and clients, be that physically or from afar. Our
  individual expertise may find them answers, but it is
  through teamwork that it is implemented.

  Passion drives success: - The impossible is always possible,
  we push the boundaries of what is expected because we’re
  never satisfied with the status quo. Our clients expect a
  positive result when they engage with us, and it’s only by
  delivering this that we win.

