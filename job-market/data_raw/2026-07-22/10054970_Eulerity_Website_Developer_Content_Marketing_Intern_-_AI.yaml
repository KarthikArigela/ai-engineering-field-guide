description: |
  The Role

  Eulerity is looking for a technically skilled intern to
  build, maintain, and improve our marketing website and the
  content that lives on it. This is a hands-on role for
  someone who can write clean code and clear copy. You will
  work directly with the marketing team to ship landing pages,
  publish long-form content, and improve site performance,
  with real ownership over what visitors and prospects see.
  Because Eulerity is an AI-native company, you will also use
  AI tools daily to accelerate both development and content
  production.

  Core Responsibilities

  Website Development

  - Build and maintain web pages: Develop, update, and QA
    landing pages, product pages, and blog templates using
    HTML, CSS, and JavaScript within our CMS and site stack.
  - Performance and SEO: Improve page speed, mobile
    responsiveness, structured data, and on-page SEO
    fundamentals so our content is discoverable by both search
    engines and AI answer engines.
  - Conversion optimization: Implement and test forms, CTAs, and
    page variants that turn visitors into qualified leads, and
    track results through analytics.
  - Site operations: Manage deployments, fix bugs, and keep the
    site infrastructure clean, fast, and reliable.

  Content Writing

  - Web copy: Write and edit landing page copy, product
    descriptions, and site messaging that is clear, accurate,
    and aligned with our brand voice.
  - Long-form content: Draft blog posts, industry insight
    articles, and resource pages on AI and Ad-Tech topics,
    using AI tools to accelerate drafting while maintaining
    quality and originality.
  - Content upkeep: Audit existing pages for outdated
    information, broken links, and inconsistent messaging, and
    keep the site current.

  Marketing Support

  - AI-first workflows: Help build lightweight automations for
    content production and publishing using tools like n8n,
    Zapier, or Make.
  - Analytics and reporting: Pull site and campaign data,
    summarize what is working, and recommend changes based on
    evidence.

  About Eulerity

  Eulerity is an AI-powered marketing automation platform that
  simplifies digital advertising for businesses of all sizes,
  from local franchises to global enterprises. As an intern on
  our marketing team, you will play a real role in how we
  present our AI capabilities to the market, with direct
  exposure to how a growing B2B SaaS company builds its demand
  engine.

  Requirements

  - Technical foundation: Working knowledge of HTML, CSS, and
    JavaScript. Experience with a modern framework such as
    React or Next.js, or with a CMS such as WordPress or
    Webflow, is a strong plus.
  - Writing ability: Strong written English with the ability to
    explain technical and marketing concepts clearly. Writing
    samples or a personal blog are a plus.
  - Portfolio: A website, project, GitHub repository, or
    published work you can show us. We care more about what
    you have built than where you have studied.
  - AI curiosity: Comfort using AI tools for coding and writing,
    with judgment about when to rely on them and when not to.
  - Eligibility: Currently pursuing or recently completed a
    degree in Computer Science, Marketing, Communications, or
    a related field, or equivalent self-taught experience.
  - Startup DNA: Comfortable with ambiguity, able to own small
    projects end to end, and willing to wear multiple hats.

  What You Will Gain

  - Direct mentorship from the marketing and product teams at an
    AI-native company.
  - A portfolio of shipped work: live pages, published content,
    and measurable results you can point to.
  - Exposure to modern marketing operations, including
    automation tooling and AI-driven workflows.
  - Potential pathway to a full-time role on the marketing team.

  Details

  - Paid internship, compensation commensurate with experience.
  - Hybrid, 2 days per week in our New York office.
  - In-office lunch credits and commuter benefits on in-office
    days.

  Logistics

  - Summer 2026, with potential to extend based on performance.
  - Hybrid out of our NYC office, 4 days per week in person.
  - 30-40 hours per week, flexible schedule.
  - $18 to $20 per hour.
  - Lunch credits and unlimited snacks when in-office.
  - Direct mentorship from senior operators on our team.

