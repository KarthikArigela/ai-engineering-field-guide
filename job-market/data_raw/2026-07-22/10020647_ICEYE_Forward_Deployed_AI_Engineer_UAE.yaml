  Working at ICEYE

  At ICEYE, you’ll join a diverse and highly engaged team
  united by the ambition to make the impossible possible. As a
  global scale-up, we combine speed and ambition with the
  opportunity to take real ownership from day one. Your
  growth, wellbeing, and success are a priority, with
  continuous professional development, training opportunities,
  and a culture where collaboration is how we win.

  How We Work (Our Values)

  Make the impossible possible: We set ambitious goals and
  stay calm under pressure. We bring grit, optimism, and
  ownership when things get hard, and we keep moving until we
  find a way.

  - Be curious: Go deep, ask questions, listen carefully, and
    think critically. Understand the “why” behind decisions.
  - See the big picture: Stay close to what’s happening across
    the company so you can make better decisions. Consider how
    your work affects others.
  - Drive effective teamwork: Create psychological safety,
    invite different perspectives, and build inclusive teams.
    There are no bad questions.
  - Act as one team: We win together. We match tasks to the
    right owner and stay agile as priorities shift.
  - Have fun: What we do matters—and it should be enjoyable.
    Celebrate progress, take pride in results, and share the
    wins.

  Benefits

  Our benefits are designed to support your health and
  wellbeing—at work and beyond. We keep improving them based
  on employee feedback, and offerings vary by location. Talent
  Acquisition will confirm what applies for this role and
  location during the process.

  Our commitment to Diversity, Equity and Inclusion

  We want ICEYE to be a place where people can be themselves
  and do great work. Different backgrounds and perspectives
  make us stronger, which is why we work to create an
  environment where people feel included, respected, and able
  to speak up. Whatever your background, we want you to bring
  your authentic self to the table.

  We’re committed to fair, inclusive hiring and equal
  opportunity. Everyone is welcome to apply. If you need any
  adjustments or support during the recruitment process, tell
  us—we’ll do our best to help.

  Apply now to start your ICEYE journey, and help us continue
  to make the impossible possible together. Read more about
  ICEYE and working with us at iceye.com
