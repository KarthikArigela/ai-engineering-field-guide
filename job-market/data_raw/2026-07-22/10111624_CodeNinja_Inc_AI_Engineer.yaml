description: |
  About the Company CodeNinja is a global AI and engineering
  services company helping enterprises build, scale, and
  operate intelligent systems. With 350+ engineers across four
  continents and 400+ successful deployments, CodeNinja
  enables organizations to harness artificial intelligence
  through Global Capability Centers, Work AI, Physical AI, and
  AI Labs. Recognized among Pakistan’s fastest-growing AI
  firms and a multi-award recipient on Clutch, CodeNinja
  empowers over 250 clients worldwide to innovate, automate,
  and compete in the intelligence economy.

  About the role We are looking for a hands-on AI Engineer
  responsible for designing, developing, and operating AI-
  powered software systems that deliver immediate, real-world
  value. This role sits at the intersection of software
  engineering, product engineering, and applied artificial
  intelligence, with a strong focus on practical
  implementation rather than research or theoretical model
  development. As part of CodeNinja’s AI-first operating
  model, you will leverage LLMs, AI agents, and automation to
  fundamentally improve how software is built, deployed, and
  operated.

  Key Responsibilities

  - Prompt Engineering: Design, test, and optimize complex
    prompts for accurate financial text and data extraction.
  - Data Visualization: Command generative AI tools and
    programmatic code to output rich analytics charts.
  - Process Automation: Build autonomous LLM workflows and
    agents to replace manual reporting processes.
  - Model Customization: Fine-tune or apply RAG (Retrieval-
    Augmented Generation) to models using financial
    documentation.
  - Data Processing: Clean, manipulate, and restructure raw
    financial files into optimized prompt payloads.

  Requirements

  - Experience: 3+ years in AI, data science and software
    engineering, with practical experience in banking
    projects.
  - Core Languages: Advanced Python (Pandas, NumPy, Matplotlib,
    Seaborn, LangChain, LlamaIndex).
  - AI Tooling: Extensive hands-on experience with commercial
    LLMs, vector databases, and DataRobot, SAS EG.

  Why Join Us

  - Work at the forefront of AI-first software engineering,
    redefining how software is built today.
  - Build real, production-grade AI-enabled systems with
    measurable impact.
  - Operate with high ownership and autonomy, amplified by
    powerful AI tools.
  - Collaborate with talented engineers and product leaders in
    an innovation-driven environment.
  - Be part of a culture that values execution, learning, and
    engineering excellence.

  Disclaimer CodeNinja is an equal opportunity employer. We
  celebrate diversity and are committed to creating an
  inclusive environment for all employees. All aspects of
  employment including the decision to hire, promote,
  discipline, or discharge, will be based on merit,
  competence, and performance. Female and minorities are
  strongly encouraged and preferred to apply for the role.
