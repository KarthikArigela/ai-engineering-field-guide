description: |
  At Compass, our mission is to help everyone find their place
  in the world. Founded in 2012, we’re revolutionizing the
  real estate industry with our end-to-end platform that
  empowers residential real estate agents to deliver
  exceptional service to seller and buyer clients.

  About the Role

  The Engineering Platform organization owns the systems that
  every engineer at Compass depends on to build, test, deploy,
  and operate software. Our mission is to reduce friction
  across the SDLC, improve engineering effectiveness, and
  build the foundation for AI-enabled software development.

  This role is centered on maximizing localized engineering
  velocity by creating fast feedback loops, optimizing system
  efficiency, and building reliable workflows across the
  software development lifecycle. As a Senior Engineer within
  the Developer Intelligence pillar, you will be an autonomous
  contributor focused on key components of our platform -
  working across observability, engineering telemetry,
  software catalog systems, and AI-assisted workflows to
  deliver durable, high-quality team capabilities.

  Applying AI to the software development lifecycle is a
  first-class responsibility for this role. You will own and
  implement systems that use engineering signals to automate
  manual developer work, improve testing frameworks, assist
  with production troubleshooting, and create smart workflow
  orchestrations across your team’s technical domain.

  Responsibilities

  - Deliver and implement technical solutions for Developer
    Intelligence systems, focusing on engineering telemetry
    collection, observability instrumentation, and AI-assisted
    tooling.
  - Analyze developer workflows and SDLC feedback loops to
    design testable, maintainable, and efficient software
    components that resolve architectural deficiencies.
  - Build and maintain subsystems that reliably collect,
    correlate, and operationalize data from CI/CD pipelines,
    source control, testing infrastructure, and developer
    workflows.
  - Write high-quality, stable, and performant code to integrate
    AI tools into daily engineering workflows, including
    automated code reviews, software validation, and incident
    triaging.
  - Work closely with teammates and stakeholders to balance
    technical requirements, clear project roadblocks, and
    participate actively in design reviews.
  - Identify and resolve systemic operational bottlenecks,
    automate processes, and continuously leave codebases
    cleaner and easier to maintain.
  - Actively mentor peers, provide insightful code reviews, and
    help train newer team members on platform architecture.

  Basic Qualifications

  - BS in Computer Science, Software Engineering, or equivalent
    practical experience.
  - 5+ years of professional software development experience,
    with a proven track record of delivering complex technical
    components autonomously.
  - Proficiency in Go and professional experience with Python
    (highly preferred for telemetry pipelines and AI
    workflows).
  - Practical experience working with data pipelines,
    engineering telemetry streams, large-scale observability
    infrastructures (logs, metrics, traces), or developer
    metrics frameworks.
  - Experience embedding AI models, LLM APIs, or automated
    orchestration tools into software pipelines or system
    triaging workflows.
  - Experience developing, deploying, and operating software
    components on a major cloud infrastructure (AWS, GCP, or
    Azure).

  Preferred Qualifications

  - Familiarity with core SDLC infrastructure - including
    exposure to build systems, local development environments,
    or automated testing frameworks.
  - A strong track record of building internal tools for other
    engineers, with an active focus on resolving developer
    pain points.
  - Experience automating and simplifying internal development
    practices to boost team-wide engineering productivity.

  Compensation: The base pay range for this position is
  $149,000-$166,000; however, base pay offered may vary
  depending on job-related knowledge, skills, and experience.
  Bonuses and restricted stock units may be provided as part
  of the compensation package, in addition to a full range of
  benefits. Base pay is based on market location. Minimum wage
  for the position will always be met.

  Perks that You Need to Know About:

  Participation in our incentive programs (which may include
  eligible cash, equity, or commissions). Plus paid vacation,
  holidays, sick time, parental leave, and recharge leave;
  medical, tele-health, dental and vision benefits; 401(k)
  plan; flexible spending accounts (FSAs); commuter program;
  life and disability insurance; Maven (a support system for
  new parents); Carrot (fertility benefits); UrbanSitter
  (caregiver referral network); Employee Assistance Program;
  and pet insurance.



  Do your best work, be your authentic self.

  At Compass, we believe that everyone deserves to find their
  place in the world — a place where they feel like they
  belong, where they can be their authentic selves, where they
  can thrive.  Our collaborative, energetic culture is
  grounded in our Compass Entrepreneurship Principles and our
  commitment to diversity, equity, inclusion, growth and
  mobility. As an equal opportunity employer, we offer
  competitive compensation packages, robust benefits and
  professional growth opportunities aimed at helping to
  improve our employees' lives and careers.

