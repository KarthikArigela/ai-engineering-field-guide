description: |
  Join our Team About This Opportunity We are looking for a
  motivated Junior AI Agent Developer who is passionate about
  Generative AI, Large Language Models (LLMs), and AI-powered
  applications. This is an exciting opportunity to work on
  cutting-edge AI solutions, including AI agents, chatbots,
  workflow automation, and Retrieval-Augmented Generation
  (RAG) systems. You will collaborate with experienced
  engineers and product teams while gaining hands-on exposure
  to modern AI frameworks, vector databases, cloud
  technologies, and backend development. If you are a curious
  problem-solver with a strong foundation in Python and a
  passion for continuous learning, we would love to hear from
  you. What You Will Do

  - Design and develop AI agents using modern LLM frameworks
    such as LangChain, LangGraph, LlamaIndex, or CrewAI.
  - Build AI-powered chatbots, assistants, and workflow
    automation solutions.
  - Work with Prompt Engineering, RAG architectures, and
    semantic search applications.
  - Integrate AI solutions with REST APIs, third-party
    platforms, and external services.
  - Develop and maintain backend services using Python
    frameworks such as FastAPI or Flask.
  - Implement and optimize vector database solutions using tools
    like Chroma, FAISS, Pinecone, or Qdrant.
  - Debug, test, and improve the performance, scalability, and
    reliability of AI applications.
  - Collaborate closely with developers, product managers, and
    stakeholders to deliver innovative AI solutions.
  - Explore, evaluate, and adopt emerging AI technologies,
    tools, and best practices.

  You Will Bring

  - A degree in B.E./B.Tech/MCA (Computer Science, IT, or
    related field).
  - Strong programming skills in Python, with working knowledge
    of SQL and basic JavaScript/TypeScript.
  - Understanding of Prompt Engineering, AI Agents,
    Function/Tool Calling, and RAG fundamentals.
  - Experience working with LLM APIs such as OpenAI, Gemini,
    Claude, or similar platforms.
  - Knowledge of at least one AI framework, including LangChain,
    LangGraph, LlamaIndex, or CrewAI.
  - Experience building backend APIs using FastAPI or Flask, and
    working with REST APIs, JSON, Git, and GitHub.
  - Familiarity with databases such as PostgreSQL or MySQL, with
    exposure to MongoDB and Redis being a plus.
  - Basic knowledge of vector databases including Chroma, FAISS,
    Pinecone, or Qdrant.
  - Understanding of software development fundamentals,
    including Data Structures, OOP, testing, and debugging.
  - Exposure to Docker and cloud platforms (AWS, Azure, or GCP)
    is an advantage.
  - Experience with AI-related projects such as AI chatbots, RAG
    applications, Document Q&A systems, resume analyzers, AI
    assistants, customer support bots, or workflow automation
    solutions.
  - Strong communication skills, a collaborative mindset,
    curiosity for new technologies, and a passion for learning
    and innovation.

