description: |
  Cin7 is a fast-growing global software company that provides
  solutions for modern-day product sellers. We help these
  sellers keep track of their inventory at scale, and help
  them sell their products across multiple sales channels
  around the world.

  Cin7 is expanding very quickly with a mission to become the
  leading Inventory Management Software brand in the world,
  and we are looking for a motivated and driven individual to
  join the team.

  Cin7 India is proud of our culture and has been officially
  recognised with Great Place to Work® Certification™.

  How you'll make an impact:



  We are looking for a Senior QA Engineer with a strong
  automation mindset and genuine, hands-on experience using AI
  tools in day-to-day QA work. You will join the Cin7 Core QA
  team, own automation frameworks written in TypeScript, drive
  AI-assisted testing workflows using tools like Cursor and
  Claude Code, and mentor other engineers on modern quality
  practices. This is a high-impact role where your work
  directly shapes the quality of Cin7 Core.

  What you'll do:

  - Use AI coding assistants (Cursor, Claude Code) daily to
    accelerate test authoring, script generation, and coverage
    analysis across Cin7 Core.
  - Design, build, and maintain robust TypeScript-based
    automated test frameworks covering UI, API, and
    integration layers.
  - Lead the adoption and continuous improvement of AI-driven QA
    practices — including AI-assisted test case generation,
    intelligent defect triage, and self-healing selectors.
  - Define and own the end-to-end test strategy for new
    features, collaborating with Engineering, Product, and
    DevOps from requirements through release.
  - Integrate automated test suites into CI/CD pipelines on
    Microsoft Azure DevOps, ensuring fast, reliable feedback
    loops.
  - Conduct thorough exploratory and regression testing on
    complex, interconnected Cin7 Core modules (inventory,
    orders, integrations, APIs).
  - Review pull requests and technical specifications to
    identify testability gaps and quality risks early.
  - Author and maintain test cases in Zephyr Scale; track,
    report, and follow up on defects in Jira with clear,
    actionable detail.
  - Mentor junior and mid-level QA engineers; run knowledge-
    sharing sessions on TypeScript automation patterns and AI
    tooling.
  - Produce clear quality reports and dashboards for QA
    management and cross-functional stakeholders.

  What you'll bring:

  - Hands-on, daily experience with AI coding assistants —
    specifically Cursor and/or Claude Code — for test
    scripting, code generation, or QA workflow automation.
  - Demonstrated ability to use AI tools to improve test
    coverage, reduce manual effort, or accelerate defect
    detection in a real project context.
  - Solid understanding of prompt engineering and working with
    LLMs in a development or testing workflow.
  - Strong TypeScript proficiency — this is our primary
    automation language and non-negotiable for this role.
  - 5+ years of software QA experience, with at least 3 years
    focused on test automation.
  - Hands-on proficiency with at least one major automation
    framework: Playwright, Cypress, or equivalent (TypeScript-
    based preferred).
  - Solid API testing experience using tools such as Postman,
    RestAssured, or similar.
  - Demonstrated experience integrating automated tests into
    CI/CD pipelines (Azure DevOps preferred).
  - Experience with Jira and a test management tool (Zephyr
    Scale, TestRail, or equivalent).
  - Solid understanding of SDLC and agile/scrum methodologies.
  - Excellent written and verbal communication skills — able to
    articulate quality risks clearly to both technical and
    non-technical stakeholders.

  It's a nice to have if you bring:

  - Experience testing SaaS products in inventory management,
    ERP, or supply chain domains.
  - Familiarity with Microsoft Azure services and cloud-native
    testing approaches.
  - Experience with performance and load testing tools (k6,
    JMeter, Gatling).
  - ISTQB certification (Foundation or Advanced) or equivalent
    industry qualification.
  - Exposure to model-based testing, mutation testing, or AI-
    generated test data techniques.

  Why work for us?

  Why CIN7?

  CIN7 is a leader in one of the most exciting software
  verticals right now, and we're growing exponentially. We're
  looking to add people to our team who are passionate about
  working with a fast growth tech company.

  At CIN7, we make great products available to everyone. Every
  month, millions of sales orders flow through our platform
  reducing the cost, effort and time for product sellers so
  they can quickly get products to customers and build their
  brands without worrying about their operations. We pride
  ourselves on providing Inventory Management and Supply Chain
  software to help medium-large product businesses thrive in a
  highly competitive, digital world. CIN7 centrally manages
  inventory across multiple locations and channels, connecting
  500+ systems to support receiving, selling and shipping
  stock.

  We value diversity at Cin7, and bring people into the heart
  of everything we do.  We hire, recruit, and promote without
  regard to race, color, religion, sex, sexual orientation,
  gender identity or expression, national origin, pregnancy or
  maternity, veteran status or any other status protected by
  applicable law. We understand the importance of creating a
  safe and comfortable work environment and encourage
  individualism and authenticity in every member of our team.
