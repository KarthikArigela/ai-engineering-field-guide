description: |
  We are seeking a Senior Full-stack Engineer to join our
  Engineering & Integration (E&I) team. The ideal candidate
  blends deep full-stack development expertise with strong
  general software engineering skills, experience developing
  in Salesforce environments, and a commitment to harnessing
  AI-augmented development and other cutting-edge technologies
  to address complex business challenges.

  This is an engineering role first. You will write
  production-quality code, design scalable platform
  capabilities, and set the technical standard for how the
  team builds. Our primary tools and languages span
  Salesforce, MuleSoft, AWS and other cloud services, Python,
  and front-end development.

  Our team operates at the bleeding edge of IT. We function as
  a combined Product and Engineering team under the IT
  umbrella, rewriting the build-vs-buy ratio that IT
  organizations have lived under for decades — building
  custom, in-house solutions to problems that are normally
  reserved for purchased SaaS. We hold ourselves to a high
  standard of excellence in every product we build and
  maintain.

  Central to this role is our AI-SDLC methodology — an AI-
  native software development lifecycle in which we utilize a
  variety of AI models in conjunction with AI coding tools as
  a core part of how we design, build, test, and ship
  software. We expect you to be fluent with these tools, to
  stay invested in the rapidly evolving AI landscape, and to
  actively bring the best of it into the team’s day-to-day
  work.

  This role is an integral part of the E&I Engineering Team,
  collaborating closely with Operations, Finance, Accounting,
  Sales, Support, Implementation, Product, Engineering, and
  key stakeholders from other functional units to develop and
  sustain the processes and data that support Smarsh’s diverse
  business needs. The team is entrusted with conceiving,
  implementing, testing, maintaining, and optimizing software
  solutions that align with the organization’s objectives.

  Essential Functions

  Education and Experience
