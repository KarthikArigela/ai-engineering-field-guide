description: |
  Job Title: AI Engineer - Application Development

  Job Category: Information Technology

  Time Type: Full time

  Minimum Clearance Required to Start: None

  Employee Type: Regular

  Percentage of Travel Required: None

  Type of Travel: None

  * * *

  The Opportunity: Join our team as an AI Engineer to design
  and deliver AI based solutions for a web-based workflow
  application for the Federal Government. You will learn
  customer business workflows, refine business use cases that
  can leverage AI enablement and build cutting-edge AI
  solutions that directly result in productivity increase,
  enhanced user experience and cost savings. You will work
  with cross-functional teams to develop AI-enabled features,
  build Proof of Concept (POC) for agentic solutions and
  translate it into Production Ready systems. You will utilize
  latest AI tools to develop AI chatbots, Agentic workflows,
  intelligent dashboards and application assistants.

  Only US citizens need to apply. (Non-Citizens and Visa
  Candidates need not apply)

  Geographic location – Strictly from EST and CST time zones
  only.

  Responsibilities: •             Design and develop AI-
  enabled features for web-based workflow applications using
  LLMs, GenAI, and agentic AI patterns •             Build RAG
  pipelines using application data, policy documents, user
  manuals, help cards and business process publications. •
  Implement agentic workflows using orchestration frameworks
  (LangGraph, Agno, Haystack, CrewAI) for AI based application
  assistants. •             Implement prompt engineering
  strategies and integrate AI/LLM APIs (OpenAI, Bedrock). •
  Architect full-stack AI features with reliable API
  integrations, error handling, and graceful degradation. •
  Establish LLM observability (cost, latency, quality) and
  responsible AI guardrails (hallucination detection, output
  validation, CUI safeguards). •             Maintain full-
  stack applications (including Web Application development
  using modern technologies such as React, TypeScript, NodeJS,
  Python and Java) •             Address security
  vulnerabilities and ensure compliance with cybersecurity
  standards. •             Participate in code reviews, CI/CD
  pipelines, and collaborative development workflows. •
  Document technical implementations and stay current with AI
  and ML developments. Qualifications: Required: •
  Bachelor’s degree in computer science, Data Science,
  Mathematics, or related STEM field. •             5+ years
  of experience with software implementation across all
  aspects of the SDLC •             1+ years of hands-on
  experience developing generative AI / LLM-powered
  applications •             Expert-level proficiency in
  Python; strong JavaScript proficiency •
  Experience with RESTful APIs and integrating AI/LLM APIs
  (OpenAI, Bedrock) •             Experience with prompt
  engineering techniques (few-shot, chain-of-thought, system
  prompts) •             Experience with LLM orchestration
  frameworks such as LangGraph, Agno, CrewAI, or similar •
  Experience with RAG architecture, agentic patterns, and
  vector databases •             Strong understanding of ML
  fundamentals (supervised/unsupervised learning, model
  evaluation, feature engineering, NLP) •
  Experience with data analysis and ML libraries (pandas,
  NumPy, scikit-learn, or equivalent) •             Experience
  with containerization (Docker) and at least one major cloud
  platform (AWS, Azure, or GCP) Desired: •
  Proficiency with Git version control and CI/CD pipelines •
  Strong written and verbal communication skills

  -

  What You Can Expect:

   A culture of integrity.

  At CACI, we place character and innovation at the center of
  everything we do. As a valued team member, you’ll be part of
  a high-performing group dedicated to our customer’s missions
  and driven by a higher purpose – to ensure the safety of our
  nation.

  An environment of trust.

  CACI values the unique contributions that every employee
  brings to our company and our customers - every day. You’ll
  have the autonomy to take the time you need through a unique
  flexible time off benefit and have access to robust learning
  resources to make your ambitions a reality.

  A focus on continuous growth.

  Together, we will advance our nation's most critical
  missions, build on our lengthy track record of business
  success, and find opportunities to break new ground — in
  your career and in our legacy.

  Pay Range:

  There are a host of factors that can influence final salary
  including, but not limited to, geographic location, Federal
  Government contract labor categories and contract wage
  rates, relevant prior work experience, specific skills and
  competencies, education, and certifications. Our employees
  value the flexibility at CACI that allows them to balance
  quality work and their personal lives. We offer competitive
  compensation, benefits and learning and development
  opportunities. Our broad and competitive mix of benefits
  options is designed to support and protect employees and
  their families. At CACI, you will receive comprehensive
  benefits such as; healthcare, wellness, financial,
  retirement, family support, continuing education, and time
  off benefits.

  Since this position can be worked in more than one location,
  the range shown is the national average for the position.

  The proposed salary range for this position is:

  $75,200-$158,100

  CACI is an Equal Opportunity Employer. All qualified
  applicants will receive consideration for employment without
  regard to race, color, religion, sex, pregnancy, sexual
  orientation, age, national origin, disability, status as a
  protected veteran, or any other protected characteristic.
