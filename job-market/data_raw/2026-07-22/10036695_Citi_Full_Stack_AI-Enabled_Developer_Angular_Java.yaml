description: |
  Job Title: Full Stack AI-Enabled Developer (Angular & Java)

  Location: Pune

  About the Role:

  We are seeking an experienced Full Stack AI-Enabled
  Developer with a strong background in Java, Spring Boot, and
  Angular. The ideal candidate will have at least 6 years of
  experience and be proficient in developing and maintaining
  robust, scalable applications, with a strong emphasis on
  leveraging Artificial Intelligence (AI) and Machine Learning
  (ML) to build intelligent and data-driven features.
  Knowledge of MongoDB, RESTful APIs, and cloud technologies
  including Docker, Kubernetes, and CI/CD tools is essential,
  alongside an understanding of how to integrate and
  operationalize AI/ML capabilities.

  Key Responsibilities:

  - Develop and maintain web applications using Java, Spring
    Boot, and Angular, ensuring high performance, quality, and
    responsiveness.
  - Design, implement, and integrate AI/ML models and services
    into full-stack applications to deliver intelligent
    features.
  - Develop and deploy AI-powered features such as predictive
    analytics, recommendation systems, natural language
    processing components, or intelligent automation
    solutions.
  - Collaborate closely with data scientists, AI/ML engineers,
    and product teams to define, develop, and productionize
    AI/ML models and capabilities.
  - Design and implement robust and scalable RESTful APIs for
    application-to-application communication, including those
    for AI/ML model inference and data exchange.
  - Work with MongoDB and other data storage solutions for
    efficient data management, including data relevant to
    AI/ML workflows.
  - Write clean, maintainable, and efficient code adhering to
    best practices and architectural patterns.
  - Debug, troubleshoot, and resolve complex technical issues
    across the full stack.
  - Participate actively in code reviews, providing constructive
    feedback and ensuring code quality.
  - Utilize cloud technologies such as Docker and Kubernetes for
    containerization and orchestration of both application and
    AI/ML components.
  - Implement and maintain CI/CD pipelines to ensure continuous
    delivery and deployment of AI-enabled applications.

  Required Skills and Qualifications:

  - Bachelor’s degree in Computer Science, Engineering, or a
    related field.
  - 4-8 years of experience as a Full Stack Developer, with
    demonstrable experience or strong interest in AI/ML
    integration.
  - Strong knowledge of Java and the Spring Boot framework.
  - Proficiency in Angular for front-end development.
  - Hands-on experience with MongoDB.
  - Solid understanding and experience with RESTful APIs.
  - Experience with caching frameworks.
  - Experience with cloud technologies, including Docker and
    Kubernetes.
  - Experience with CI/CD tools.
  - Experience with version control systems, such as Git.
  - Familiarity with AI/ML concepts, methodologies, and their
    practical application in software development.
  - Understanding of data processing, feature engineering, and
    data pipelines for AI/ML workloads.
  - Excellent problem-solving skills and attention to detail.
  - Strong communication and teamwork skills.

  Preferred Qualifications:

  - Practical experience integrating AI/ML models (e.g., using
    Python-based frameworks like TensorFlow/PyTorch or Java-
    based AI libraries) into production systems.
  - Experience with cloud AI/ML platforms and services (e.g.,
    AWS Sagemaker, Google AI Platform, Azure ML).
  - Knowledge of MLOps principles and tools for deploying,
    monitoring, and maintaining AI models.
  - Familiarity with specific AI domains such as Natural
    Language Processing (NLP), Computer Vision, or time series
    analysis.
  - Experience with cloud platforms and services beyond
    containerization.
  - Familiarity with IntelliJ IDEA or similar IDEs.
  - Knowledge of OAuth2 and LDAP authentication.
  - Experience with logging frameworks and debugging tools.



