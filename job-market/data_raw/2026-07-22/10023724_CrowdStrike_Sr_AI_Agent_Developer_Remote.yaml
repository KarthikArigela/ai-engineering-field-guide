description: |
  As a global leader in cybersecurity, CrowdStrike protects
  the people, processes and technologies that drive modern
  organizations. Since 2011, our mission hasn’t changed —
  we’re here to stop breaches, and we’ve redefined modern
  security with the world’s most advanced AI-native platform.
  We work on large scale distributed systems, processing
  almost 3 trillion events per day and this traffic is growing
  daily. Our customers span all industries, and they count on
  CrowdStrike to keep their businesses running, their
  communities safe and their lives moving forward. We're proud
  to work for a mission-driven company leveraging AI to
  transform the way we work. CrowdStrikers drive their careers
  through flexibility and autonomy while also being expected
  to contribute to a culture of responsible AI adoption,
  experimentation, and innovation. We use an AI-first mindset
  as a force multiplier to proactively and continuously
  accelerate execution, build expertise, uncover insights, and
  solve complex problems. We’re always looking to add talented
  CrowdStrikers to the team who have limitless passion, a
  relentless focus on innovation and a fanatical commitment to
  our customers, our community and each other. Ready to join a
  mission that matters? The future of cybersecurity starts
  with you.

  About the Role: The IT department at CrowdStrike is at the
  forefront of enabling our company's rapid growth and
  technological innovation. We are looking for a Sr AI Agent
  Developer who is first and foremost a builder—someone who
  can put their head down, design, and deliver working AI
  agent solutions that make an immediate impact. This role is
  about building, shipping, and iterating on generative AI
  agents that enhance productivity, enable new capabilities,
  and unlock opportunities for revenue. You will collaborate
  with teams across Engineering, Legal, IT, Go-To-Market,
  Support, and more.

  What You'll Do:

  - Build AI Agents (Core Focus): Design, develop, and deploy
    production-ready AI agents that support critical workflows
    across the enterprise. Deliver cost-effective, secure, and
    scalable solutions that integrate seamlessly into business
    processes.
  - Ship & Iterate: Rapidly prototype, test, and refine agents
    to ensure high performance and adoption. Build evaluation
    datasets, measure outcomes, and optimize for both
    functionality and cost.
  - Reimagine Workflows: Work with stakeholders across the
    business to identify where AI can deliver real value.
    Redesign workflows with agents at the center, balancing
    innovation with empathy for change management.
  - Contribute to the AI Center of Excellence: Share hands-on
    expertise, frameworks, and tools that help colleagues
    across CrowdStrike build better agents. Participate in AI
    training, knowledge sharing, and governance discussions.
  - Stay on the Frontier: Continuously evaluate new AI
    capabilities, frameworks, and standards, adapting
    solutions to ensure long-term impact, security, and
    scalability.

  What You'll Need:

  - Hands-on development skills: Strong proficiency in Python
    (or similar languages) with direct experience building and
    deploying production AI/ML applications and workflows.
  - LLM/Agent experience: Deep understanding of large language
    models and modern AI systems, with a proven ability to
    design, build, and optimize practical agent solutions.
  - Builder mindset: A passion for creating, iterating, and
    delivering real solutions—not just strategy or advisory
    work.
  - AI safety & governance knowledge: Awareness of emerging
    standards, risks, and guardrails for responsible AI agent
    development.
  - Flexibility & adaptability: Comfort working in a fast-
    evolving AI landscape, with the ability to adjust and
    pivot as tools and approaches change.
  - Business acumen: Ability to understand enterprise workflows
    and design AI solutions that align with business needs.
  - Collaboration & communication: Proven ability to partner
    across functions and translate technical solutions into
    clear business value
  - Proven experience utilizing AI technologies to enhance
    decision-making, streamline workflows and processes,
    improve efficiency and drive business outcomes.

  #LI-Remote #LI-RC1

