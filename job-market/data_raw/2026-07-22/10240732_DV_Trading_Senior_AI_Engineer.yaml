  All resumes submitted by search firms to DV via e-mail, the
  Internet, personal delivery, facsimile, or any other method
  without a valid written agreement shall be deemed the sole
  property of DV, and no fee will be paid in the event the
  candidate is hired by DV. DV is proud to be an equal
  opportunity employer and committed to creating an inclusive
  environment for all employees.

  The range below reflects the expected base salary for this
  position. It represents a good-faith estimate of the base
  pay we anticipate offering, with actual compensation
  determined by your experience, education, skills, and
  performance throughout the interview process. This role is
  also eligible for a discretionary bonus (at DV Trading's
  discretion) and DV Trading's benefits package, including the
  benefits listed above.

  Base Salary Range

  $200,000—$300,000 USD
