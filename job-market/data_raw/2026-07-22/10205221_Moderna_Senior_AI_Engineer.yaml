description: |
  The Role

  Moderna is seeking a Senior AI Engineer in Cambridge, MA/
  Warsaw, Poland to provide deep technical leadership for the
  design, implementation, and operation of AI software
  platforms and Cloud-based deployment patterns for Supply
  Chain and enterprise Digital. This is a senior individual
  contributor role that sets architecture, codes critical
  components, establishes engineering standards, and mentors
  engineers while partnering closely with product and business
  leaders.

  You will own end-to-end application architecture and
  delivery strategy for AI and data products: lakehouse
  patterns, Unity Catalog governance, CI/CD and release
  automation, MLflow model lifecycle, feature/data product
  packaging, model serving, vector search, observability,
  cost/performance optimization, and validated releases for
  GxP use cases. The role requires demonstrated experience
  shipping scalable AI/ML/GenAI systems, APIs, and data
  applications in enterprise environments.

  Here's What You’ll Do

  - Define the technical strategy and reference architecture for
    AI software delivery, GenAI applications, agentic
    workflows, ML services, and cloud-based data/AI platforms.
  - Lead end-to-end Cloud deployment standards across
    development, test, validation, and production
    environments, including workspace architecture, Delta
    Lake/Lakehouse design, Unity Catalog, Workflows/Jobs,
    MLflow, model serving, deployment automation,
    observability, and access governance.
  - Build and review critical software components, APIs,
    orchestration patterns, model-serving interfaces, reusable
    libraries, and platform accelerators that enable teams to
    move AI prototypes into production reliably.
  - Establish engineering practices for AI/ML/LLMOps, including
    automated testing, CI/CD, infrastructure-as-code, release
    management, model and prompt versioning, evaluation,
    monitoring, incident response, and rollback.
  - Guide integration of SAP and enterprise data sources into
    trusted data products, feature pipelines, semantic layers,
    and decision-support services for Supply Chain, Quality,
    Manufacturing, Finance, and Digital stakeholders.
  - Partner with product owners, architects, cybersecurity,
    quality, validation, and infrastructure teams to ensure
    solutions meet business outcomes, security expectations,
    GxP requirements, and enterprise architecture standards.
  - Coach and mentor engineers across regions, raise the quality
    of design reviews and code reviews, and help build a
    practical AI/Data/Automation Center of Excellence with
    reusable standards and assets.
  - Improve platform reliability, performance, cost efficiency,
    data quality, and developer experience through metrics,
    architectural guardrails, operational playbooks, and
    continuous feedback from users and support teams.

  Here’s What You’ll Need (Basic Qualifications)

  - Bachelor's or Master's degree in Computer Science, AI, Data
    Science, Engineering, Applied Mathematics, Physics, or a
    related technical field; equivalent deep technical
    experience will be considered.
  - 7+ years of software, data, or AI engineering experience,
    including 4+ years delivering production ML, GenAI,
    analytics, automation, or data-intensive systems.
  - Expert proficiency with Python and SQL, strong software
    architecture fundamentals, and experience with at least
    one additional language such as Java, Scala, or
    TypeScript.
  - Hands-on frontend engineering experience with
    TypeScript/JavaScript and a modern framework such as
    React, Angular, Vue, or Svelte, including reusable
    components, state management, forms, charts, browser
    fundamentals, accessibility, and responsive design.
  - Hands-on backend engineering experience designing production
    APIs and services using Python, Node.js, Java, Scala, or
    comparable technologies, including REST/GraphQL patterns,
    service boundaries, authentication, authorization,
    testing, observability, and production debugging.
  - Demonstrated experience architecting and operating LLM/GenAI
    systems, including RAG, agents/tool use, embeddings/vector
    search, model and prompt evaluation, guardrails,
    monitoring, and human-in-the-loop controls.
  - Strong background in cloud architecture on AWS, Azure, or
    GCP, including IAM, networking, secrets management, CI/CD,
    infrastructure-as-code, and production support models.
  - Experience designing secure, compliant, auditable systems in
    regulated environments, with practical understanding of
    GxP, data integrity, validation documentation, and change
    control.

  Here’s What You’ll Bring to the Table (Preferred
  Qualifications)

  - Experience in life sciences, pharmaceutical manufacturing,
    supply chain, quality, or another regulated operational
    domain.
  - Experience with SAP-centric supply chain data and
    integration patterns, including SAP ECC/S/4HANA, IBP, MM,
    PP, QM, SD, EWM/WM, MDG, BTP, or related analytics
    enablement.
  - Advanced experience with Databricks Asset Bundles, Terraform
    or infrastructure-as-code, Databricks SQL, Feature
    Engineering/Feature Store, Vector Search, model
    monitoring, and lakehouse governance patterns.
  - Applied expertise in forecasting, optimization, simulation,
    anomaly detection, scheduling, inventory, logistics, or
    decision intelligence methods.
  - Track record of mentoring senior engineers, shaping
    engineering communities of practice, and influencing
    technical direction across global teams.

  Pay & Benefits

  At Moderna, we believe that when you feel your best, you can
  do your best work. That’s why our benefits and well-being
  resources are designed to support you—at work, at home, and
  everywhere in between.

  - Competitive healthcare, plus voluntary benefit programs to
    support your unique needs
  - A holistic approach to well-being, with access to fitness,
    mindfulness, and mental health support
  - Family planning benefits, including fertility, adoption, and
    surrogacy support
  - Generous paid time off, including vacation, volunteer days,
    sabbatical, global recharge days, and a discretionary
    year-end shutdown
  - Savings and investments to help you plan for the future
  - Location-specific perks and extras

  The salary range for this role is $145,900.00 - $234,200.00.
  This is the lowest to highest salary we in good faith
  believe we would pay for this role at the time of this
  posting. An individual’s position within the salary range
  will be based on several factors including, but not limited
  to, specific competencies, relevant education,
  qualifications, certifications, experience, skills,
  performance, and business or organizational needs.

  The successful candidate may be eligible for an annual
  discretionary bonus, other incentive compensation, or equity
  award, subject to company plan eligibility criteria and
  individual performance.

  About Moderna

  Since our founding in 2010, we have aspired to build the
  leading mRNA technology platform, the infrastructure to
  reimagine how medicines are created and delivered, and a
  world-class team. We believe in giving our people a platform
  to change medicine and an opportunity to change the world.

  By living our mission, values, and mindsets every day, our
  people are the driving force behind our scientific progress
  and our culture. Together, we are creating a culture of
  belonging and building an organization that cares deeply for
  our patients, our employees, the environment, and our
  communities.

  We are proud to have been recognized as a Science Magazine
  Top Biopharma Employer, a Fast Company Best Workplace for
  Innovators, and a Great Place to Work in the U.S.

  If you want to make a difference and join a team that is
  changing the future of medicine, we invite you to visit
  modernatx.com/careers to learn more about our current
  opportunities.

  Our Working Model 

  As we build our company, we have always believed an in-
  person culture is critical to our success. Moderna champions
  the significant benefits of in-office collaboration by
  embracing a 70/30 work model. This 70% in-office structure
  helps to foster a culture rich in innovation, teamwork, and
  direct mentorship. Join us in shaping a world where every
  interaction is an opportunity to learn, contribute, and make
  a meaningful impact.

  Moderna is a smoke-free, alcohol-free, and drug-free work
  environment.

