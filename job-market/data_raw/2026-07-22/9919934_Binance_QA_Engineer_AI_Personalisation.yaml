description: |
  Binance is a leading global blockchain ecosystem behind the
  world’s largest cryptocurrency exchange by trading volume
  and registered users. We are trusted by 300+ million people
  in 100+ countries for our industry-leading security, user
  fund transparency, trading engine speed, deep liquidity, and
  an unmatched portfolio of digital-asset products. Binance
  offerings range from trading and finance to education,
  research, payments, institutional services, Web3 features,
  and more. We leverage the power of digital assets and
  blockchain to build an inclusive financial ecosystem to
  advance the freedom of money and improve financial access
  for people around the world.

  We are looking for a QA Engineer who has strong capabilities
  in platform product testing, can understand complex backend
  service call flows, and is interested in AI-driven testing
  and end-to-end automation.

  This role will be responsible for functional testing of
  platform products, API testing, end-to-end test design, and
  exploring the application of AI in test case coverage and
  automated testing.

  Our product supports personalized experiences at scale,
  where different users may see different features, UI, and
  content in the app. Behind this are algorithm- and strategy-
  driven systems, while the frontend relies on dynamic UI
  rendering. Therefore, this role requires strong end-to-end
  testing capability, system-level thinking, and the ability
  to validate complex cross-functional scenarios.

  Responsibilities

  - Own functional testing for platform products, including test
    planning, test design, execution, and quality assurance
    for releases.
  - Perform API testing and understand the overall service
    invocation flow, including upstream/downstream
    dependencies across long and complex backend chains.
  - Design and execute end-to-end test scenarios covering
    frontend, backend, strategy, and algorithm-driven
    interactions.
  - Validate personalized user experiences, ensuring correctness
    and consistency across different user segments, feature
    exposure, UI variations, and content delivery.
  - Build and improve test coverage, testing methodologies, and
    quality assurance processes for complex platform
    capabilities.
  - Explore and drive the adoption of AI in testing, including:
    - AI-assisted test case generation and coverage
    improvement  - AI-driven end-to-end automation testing  -
    Intelligent approaches to improve testing efficiency in
    complex scenarios
  - Work closely with Product, Engineering, Algorithm, and
    Strategy teams to identify issues, drive root cause
    analysis, and ensure quality closure.
  - Continuously improve testing approaches and propose
    innovative quality solutions for evolving business
    scenarios.

  Requirements

  - Bachelor’s degree or above in Computer Science, Software
    Engineering, Information Technology, or a related field.
  - Experience in QA / software testing, preferably with
    platform product testing experience.
  - Solid understanding of functional testing and API testing
    methodologies, with the ability to independently design
    and execute test cases.
  - Basic understanding of backend infrastructure and service
    interaction flows; able to understand the full calling
    process rather than testing isolated APIs only.
  - Strong end-to-end testing mindset, with the ability to
    validate scenarios involving frontend/backend
    interactions, dynamic configuration, strategy execution,
    and algorithm-driven logic.
  - Ability to understand the fundamentals of test automation
    and be familiar with common testing frameworks and
    automation concepts.
  - Familiarity with or strong interest in AI-driven testing,
    including the use of AI for test case coverage,
    automation, and quality analysis.
  - Strong analytical thinking, problem-solving skills, and the
    ability to work effectively across teams in complex
    environments.
  - Innovative mindset with a willingness to explore new testing
    methods, tools, and quality assurance approaches.

  Why Binance

  • Shape the future with the world’s leading blockchain
  ecosystem

  • Collaborate with world-class talent in a user-centric
  global organization with a flat structure

  • Tackle unique, fast-paced projects with autonomy in an
  innovative environment

  • Thrive in a results-driven workplace with opportunities
  for career growth and continuous learning

  • Competitive salary and company benefits

  • Work-from-home arrangement (the arrangement may vary
  depending on the work nature of the business team)

  Binance is committed to being an equal opportunity employer.
  We believe that having a diverse workforce is fundamental to
  our success.

  By submitting a job application, you confirm that you have
  read and agree to our Candidate Privacy Notice.
