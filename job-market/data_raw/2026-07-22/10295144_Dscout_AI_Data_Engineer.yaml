description: |
  At Dscout, we’re building the most flexible and powerful UX
  research platform on the market—trusted by the world’s top
  brands in finance (JP Morgan Chase, Intuit, Charles Schwab,
  PayPal), healthcare (Aya, Headspace), consumer goods (Keen,
  Verizon, Target, Northface), and tech (Google, Amazon,
  Facebook, Meta, Spotify, AirBnB). Our tools help teams
  deeply understand the humans behind their products, so they
  can build better ones. We are expanding our smart and driven
  team and would love for you to join us.

  AI is a core part of how Dscout operates. Feature quality
  relies heavily on the data pipelines and infrastructure
  under the hood. As an AI Data Engineer you will be at the
  intersection of ML systems and data engineering, working
  closely with our MLE and analytics engineering teams to
  build the pipelines, models, and evaluation systems that
  make our AI features trustworthy in production.

  Dscout sits at a unique intersection: a platform where rich
  human behavior data meets the researchers trying to make
  sense of it. Getting that data right: structured,
  trustworthy, and ready to power both AI features and the
  reporting researchers rely on is foundational work. That's
  what this role is about.

  What you'll do

  - Design, build, and own the data pipelines that move and
    transform data from our application and third-party
    sources into relational databases - keeping them reliable
    and well-modeled as volume and complexity grow
  - Partner with analytics engineering to build the data models
    and reporting that give researchers and teams real
    visibility into how their work is performing
  - Own data quality as a first-class concern across ingestion,
    modeling, and reporting. Catch problems before they reach
    a model, a dashboard, or a user, and fix them
  - Build and ship production AI systems the data infrastructure
    and services that ML features run on
  - Design and own evaluation systems that tell us whether an AI
    feature is ready to ship and holding up over time: eval
    harnesses, test datasets, and production monitoring built
    as software, not one-off analyses
  - Set the standard for how data work gets done. Write clearly,
    share context early, and make the people around you faster

  What you bring

  - 5+ years of experience in data engineering, with meaningful
    exposure to ML systems in production
  - Deep data engineering experience: you've personally built
    and owned pipelines that move data from application
    sources into a warehouse at scale, and you know what
    breaks, when, and why
  - Strong Python skills and fluency across the data stack (we
    use Snowflake and Postgres)
  - Experience with orchestration tools like Airflow, Dagster,
    or similar
  - Experience working with cloud computing environments like
    GCP or AWS.
  - A track record of working closely with analytics engineers
    or data analysts to build reliable, well-documented data
    models
  - Hands-on experience shipping AI or ML systems that real
    users depended on in production, and owning what happened
    after launch
  - A genuine point of view on evaluation: you treat evals as
    something you build, not a report you write
  - A high-agency mindset. You can take an ambiguous problem and
    drive it to a working outcome without a fully-scoped
    ticket
  - Fluency across the data lifecycle, from production-facing
    features to the internal analytics that drive decision-
    making
  - Comfort working across the data lifecycle, from production-
    facing features to the internal analytics that drive
    decision-making
  - Comfort using AI coding tools (Cursor, Claude Code, Copilot,
    or similar) as a real part of your workflow

  Nice to have

  - Experience with dbt or similar data modeling frameworks
  - Familiarity with LLM evaluation and observability tooling
  - Exposure to MCP-based tooling or agentic data workflows

  If this role excites you but you're not sure you check every
  box, we'd still love to hear from you.

  Of course, what is outlined above is an ideal set of
  expectations; however, business needs and other projects and
  tasks may shift, and additional tasks could be assigned at
  the discretion of your manager.



  About Dscout



  Dscout is a team of passionate, empathetic, and curious
  professionals. As a recognized leader in the Forrester Wave,
  we’re at the cutting edge of experience research technology.
  The power of research drives us - how in-context insights
  from real people can build more enjoyable products and
  services.

  We prioritize learning, sharing, and building. We also
  deeply value being a diverse and inclusive team and company
  and look for team members who align with that belief. Join
  our dynamic team and help shape product roadmaps and
  business strategies for the world’s most loved brands.



  It doesn't stop there. When you join the Dscout team, you
  will get:

  - A strong and competitive compensation package with a built-
    in bonus and equity program.
  - An incredible and progressive benefits package (for both you
    and your dependents) to support work/life balance,
    including flexible PTO, 15 company holidays, 12 weeks of
    paid parental leave, 401k match, and much more.
  - An education stipend to support your growth & development,
    and a remote work stipend.
  - A company that is open and transparent with our team. You
    will know what is happening and why it matters.

