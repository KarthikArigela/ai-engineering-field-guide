description: |
  Job Summary

  As a Lead AI Engineer, you will own the design, delivery,
  and evolution of AI enabled legal solutions that support
  contract and compliance driven workflows across the
  enterprise. This role focuses on building and orchestrating
  agent based AI systems that integrate with Contract
  Lifecycle Management (CLM) platforms and enterprise workflow
  tools to ensure AI is embedded into governed, auditable
  legal processes.

  You will lead end‑to‑end solution design from intake through
  execution and post signature intelligence while making
  informed buy vs. build decisions, providing delivery
  estimation, and implementing scalable, secure AI solution
  architecture. This role requires close partnership with
  Legal, Procurement, Compliance, and IT, to deliver AI
  solutions that accelerate legal operations while maintaining
  regulatory and risk controls.

  Key Responsibilities

  - Lead design and implementation of end‑to‑end Legal AI
    workflows, including intake, orchestration, execution, and
    post signature intelligence
  - Evaluate and execute buy vs. build decisions for Legal AI
    capabilities, including delivery estimation, integration
    complexity, and total cost of ownership
  - Design and build custom AI agents to support legal use cases
    such as contract analysis, clause extraction,
    summarization, risk identification, and compliance
    validation
  - Implement orchestrated, multi‑agent systems that integrate
    AI services with CLM platforms and enterprise workflows
  - Architect and maintain secure, scalable integrations between
    AI systems and legal platforms, ensuring CLM remains the
    authoritative system of record
  - Establish engineering best practices for prompt design,
    agent orchestration, evaluation, monitoring, and AI
    governance in legal contexts
  - Collaborate closely with Legal, Procurement, Compliance, and
    IT stakeholders to translate legal requirements into
    durable AI solutions
  - Provide technical leadership and mentorship to engineers
    contributing to Legal AI initiatives

  Required Qualifications

  - Bachelor’s degree in Computer Science, Engineering, Data
    Science, or a related field
  - 6–10+ years of experience designing and delivering software
    or AI enabled systems in production environments
  - Strong experience building LLM powered applications, agentic
    workflows, and AI driven services
  - Proven ability to design end-to‑end enterprise workflows,
    including integrations with multiple business systems
  - Strong programming experience in Python and API based
    integration development
  - Experience leveraging AI assisted development tools (e.g.,
    Claude Code or similar) to accelerate agent development,
    integration, and iterative refinement
  - Demonstrated experience making architecture and delivery
    tradeoff decisions in complex enterprise environments
  - Strong communication skills with the ability to engage
    technical and non‑technical stakeholders

  Preferred Qualifications

  - Experience working with Contract Lifecycle Management (CLM)
    or legal workflow platforms
  - Familiarity with legal or enterprise platforms such as
    Agiloft, Eudia, ServiceNow App Engine, GEP CLM, or similar
    systems
  - Domain knowledge in any of the following areas:
    - Procurement contracting
    - Commercial and vendor contract lifecycle management
    - Marketing compliance
    - Legal or regulatory affairs
  - Experience implementing AI solutions that clearly separate
    intelligence layers, workflow orchestration, and systems
    of record
