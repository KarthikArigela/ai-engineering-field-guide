description: |
  PLEASE NOTE: Bitovi has been engaged by Avalara to lead
  initial and technical interviews for this role. While Bitovi
  will conduct the early rounds, the final interview and
  hiring decision will be made by Avalara directly. Candidate
  Location: India

  What You'll Do

  Avalara is looking for an AI Automation Engineer to help
  build an enterprise-grade automation ecosystem that improves
  how work is automated, orchestrated, governed, and scaled
  across the company. In this high-impact individual
  contributor role, you will use n8n as a core platform to
  design secure, reliable, and measurable automation solutions
  that reduce manual work, improve process quality, and
  support faster business transformation. You will work across
  functions to embed artificial intelligence-enabled
  workflows, intelligent decisioning, reusable automation
  patterns, and observability into enterprise processes. You
  will help Avalara raise its automation standards by building
  practical solutions, mentoring others, and improving how
  teams use artificial intelligence to increase productivity,
  quality, and operational scale. You will report to Sr
  Director, IT Support #LI-Remote

  What Your Responsibilities Will Be

  - Engineer scalable, secure, and resilient automation
    solutions using n8n and related integration platforms.
  - Design hybrid automation patterns using n8n, Boomi,
    application programming interfaces, event-driven systems,
    and artificial intelligence agents.
  - Build artificial intelligence-enabled workflows that support
    intelligent decisioning, human-in-the-loop controls,
    prompt management, and model integrations.
  - Define development standards, reusable templates, exception
    handling, retry strategies, approval patterns, and
    security protocols for enterprise automation.
  - Implement environment strategies, continuous integration and
    continuous delivery pipelines, versioning, and governance
    models for automation workflows.
  - Establish logging, monitoring, reliability guardrails,
    anomaly detection, and alerting to improve uptime,
    workflow trust, and recovery time.
  - Define responsible artificial intelligence governance for
    model selection, cost controls, prompt and version
    management, data privacy, and auditability.
  - Lead technical design sessions, workflow reviews,
    architecture reviews, and post-incident reviews.
  - Mentor engineers, contractors, and implementation teams on
    automation design, artificial intelligence agents, prompt
    engineering, and responsible automation practices.
  - Use metrics such as adoption, cycle-time reduction, service
    levels, recovery time, cost per workflow, and business
    impact to guide improvement.

  What You'll Need to be Successful

  - Bachelor's degree in Computer Science Engineering
  - 10+ years of experience in enterprise automation, workflow
    engineering, integration engineering, or platform
    architecture.
  - Deep hands-on experience with n8n or Boomi, including
    building cross-functional automations, artificial
    intelligence-enabled workflows, agents, and orchestration
    patterns.
  - Experience designing application programming interface-first
    and event-driven architectures, including REST, webhooks,
    OAuth, JSON Web Tokens, application programming interface
    security, and secure integration of artificial
    intelligence services.
  - Experience with cloud platforms such as Amazon Web Services,
    Microsoft Azure, or Google Cloud Platform, including
    artificial intelligence or machine learning services such
    as Amazon Bedrock or Azure OpenAI.
  - Applied experience using large language models, prompt
    engineering, artificial intelligence agents,
    observability, monitoring, and automation metrics to
    improve productivity, reliability, quality, scale, cost,
    or cycle time.

  #LI-Remote

  Avalara is an AI-first Company

  AI is embedded in our workflows, decision-making, and
  products.  Success here requires embracing AI as an
  essential capability.

  - You’ll bring experience using AI and AI-related
    technologies, ready to thrive here.
  - You’ll apply AI every day to business challenges - improving
    efficiency, contributing solutions, and driving results
    for your team, our company, and our customers.
  - You’ll grow with AI by staying curious about new trends and
    best practices, and by sharing what you learn so others
    can benefit too.

  How We'll Take Care of You

  Total Rewards

  In addition to a great compensation package, paid time off,
  and paid parental leave, many Avalara employees are eligible
  for bonuses.

  Health & Wellness  Benefits vary by location but generally
  include private medical, life, and disability insurance.

  Inclusive culture and diversity  Avalara strongly supports
  diversity, equity, and inclusion, and is committed to
  integrating them into our business practices and our
  organizational culture. We also have a total of 8 employee-
  run resource groups, each with senior leadership and exec
  sponsorship.

  What You Need To Know About Avalara

  We’re defining the relationship between tax and tech.

  We’ve already built an industry-leading cloud compliance
  platform, processing over 54 billion customer API calls and
  over 6.6 million tax returns a year. Our growth is real -
  we're a billion dollar business - and we’re not slowing down
  until we’ve achieved our mission - to be part of every
  transaction in the world.

  We’re bright, innovative, and disruptive, like the orange we
  love to wear. It captures our quirky spirit and optimistic
  mindset. It shows off the culture we’ve designed, that
  empowers our people to win. We’ve been different from day
  one. Join us, and your career will be too.

  We’re An Equal Opportunity Employer

  Supporting diversity and inclusion is a cornerstone of our
  company — we don’t want people to fit into our culture, but
  to enrich it. All qualified candidates will receive
  consideration for employment without regard to race, color,
  creed, religion, age, gender, national orientation,
  disability, sexual orientation, US Veteran status, or any
  other factor protected by law. If you require any reasonable
  adjustments during the recruitment process, please let us
  know.
