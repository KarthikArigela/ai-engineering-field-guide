description: |
  The next wave of enterprise software won’t be dashboards or
  copilots.

  It will be Digital Workers, autonomous AI systems capable of
  executing complex workflows end-to-end. At causaLens, we are
  building the platform that enables enterprises to deploy
  these Digital Workers safely and at scale.

  Our Digital Worker Factory allows organizations to design,
  deploy, and manage AI agents that automate decision-making,
  analytics, and operational workflows across the enterprise.
  These systems are already being used by global companies
  including Johnson & Johnson, Syneos Health and Cisco to
  transform how work gets done.

  We are particularly focused on pharmaceutical and life
  sciences organizations, where AI is rapidly becoming the
  operating system for commercial analytics, forecasting,
  regulatory workflows, and medical intelligence.

  Backed by $50M+ in funding from Molten Ventures, Dorilton
  Capital, and IQ Capital, and supported by visionary
  investors including the CEO of Revolut, causaLens is scaling
  rapidly. Our team includes leading AI researchers,
  engineers, and scientists, almost 20% with PhDs.

  Here are 2 articles that define our culture: 1. A Hiring
  Framework for a New Kind of Services Company

  2. The Primacy of Winning

  The Role

  We’re hiring a Lead AI Engineer to design and deliver
  enterprise-grade AI systems and digital workers in
  production. You’ll work closely with global organisations,
  embedding with clients to untangle complex workflows and
  translate them into reliable, scalable agentic
  systems—integrating models, data, and enterprise
  infrastructure into solutions that operate in real-world
  environments.

  We’re looking for experienced lead engineers who can own
  end-to-end delivery ofvadvanced AI systems. You’ll work
  across LLMs, multi-agent coordination, retrieval
  andvreasoning, and enterprise data integration; driving the
  development of systems that automate workflows and execute
  real business tasks at scale.

  Our stack typically includes Python, modern LLM frameworks,
  orchestration tools, and cloud platforms such as AWS, GCP,
  or Azure.

  What you’ll bring

  - Deep, hands-on experience building and deploying production-
    grade AI systems using LLMs, RAG pipelines, MCPs, and
    agentic workflows
  - Proven track record of leading complex, client-facing
    engagements with a forward-deployed mindset, partnering
    with both technical and business stakeholders
  - Strong system design and architecture expertise, with the
    ability to translate ambiguous business challenges into
    scalable, reliable AI solutions
  - Experience guiding technical projects, setting technical
    direction, and driving delivery to measurable outcomes
  - Solid understanding of evaluation, reliability, and
    performance considerations in production AI systems

  What you’ll do

  - Work directly with enterprise clients to understand complex
    operational and analytical workflows
  - Translate ambiguous business challenges into clear technical
    strategies and system designs
  - Design scalable AI architectures and agentic systems
    combining LLMs, multi-agent orchestration, and knowledge
    retrieval
  - Break down initiatives into structured engineering plans and
    drive execution across teams
  - Lead technical delivery end-to-end, from architecture
    through production deployment and iteration
  - Guide engineers through implementation decisions and provide
    strong technical leadership throughout delivery

  Our culture values intellectual rigour, ownership, and the
  primacy of winning. We expect team members to work from the
  office 1-2 days per week.

  Benefits We care about our people’s lives, both inside and
  outside of causaLens. Beyond the core benefits like
  competitive remuneration and a great work-life balance, we
  offer the following:

  - 25 days of paid holiday, plus bank holidays
  - carry over/sell holiday options (up to 5 days)
  - Share options
  - Pension scheme
  - Core life cover for all employees, equivalent to 4x your
    annual basic salary
  - Happy hours and team outings
  - Referral bonus program
  - Cycle to work scheme
  - Friendly tech purchases
  - Benefits to choose from, including Health/Dental Insurance
  - Special Discounts
  - Learning and development budget
  - Work abroad days
  - Office snacks and drinks

  Logistics

  - Recruiter Screen
  - Hiring Manager / Team Interview (30 mins): Deep dive into
    past projects, recentcodebases
  - Take-Home Challenge (3 hours): Testing structured thinking
    and practicalcoding/problem-solving.
  - "Day 0" Onsite (Hammersmith): * 3 x 30-minute technical
    interviews.-Founders/Exec Interview

  If you require accommodations during the application process
  or in your role at causaLens, please contact us at
  talent@causalens.com
