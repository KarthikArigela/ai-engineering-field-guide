description: |
  Kenvue is currently recruiting for a:

  Fullstack Staff Engineer – Cloud Native & AI

  What we do

  At Kenvue, we realize the extraordinary power of everyday
  care. Built on over a century of heritage and rooted in
  science, we’re the house of iconic brands - including
  NEUTROGENA®, AVEENO®, TYLENOL®, LISTERINE®, JOHNSON’S® and
  BAND-AID® that you already know and love. Science is our
  passion; care is our talent.

  Who We Are

  Our global team is ~ 22,000 brilliant people with a
  workplace culture where every voice matters, and every
  contribution is appreciated.  We are passionate about
  insights, innovation and committed to delivering the best
  products to our customers. With expertise and empathy, being
  a Kenvuer means having the power to impact millions of
  people every day. We put people first, care fiercely, earn
  trust with science and solve with courage – and have
  brilliant opportunities waiting for you! Join us in shaping
  our future–and yours. For more information, click here.

  Role reports to:

  Director, Platform Engineering

  Location:

  Asia Pacific, India, Karnataka, Bangalore

  Work Location:

  Hybrid

  What you will do

  Kenvue is seeking a Fullstack Staff Engineer – Cloud Native
  to join our innovative and forward-thinking software
  engineering team. You will play a pivotal role in designing,
  building, and delivering platforms and applications that
  shape the future of digital healthcare for our consumer
  health business.

  As a technical leader reporting to the Software Engineering
  Manager, you will drive the development, testing, and
  release of products that power our business. You will
  champion modern engineering practices, implement robust
  solutions in a multi-cloud, event-driven architecture, and
  collaborate across teams to enable high-performing, product-
  centric delivery.

  Key Responsibilities

  - Demonstrate ownership and foster a collaborative team
    environment.
  - Lead the software development lifecycle, from design to
    deployment.
  - Deliver high-quality features and tools aligned with
    reference architecture and coding standards.
  - Ensure production-ready solutions for various product
    initiatives.
  - Stay engaged with the evolving Consumer Health landscape.

  Qualifications

  - Bachelor’s degree in Computer Science, Computer Engineering,
    Software Engineering, or related field.
  - 10+ years of IT experience, including at least 7+ years of
    hands-on software development.

  Full Stack Development

  - JavaScript, React.JS, Node.JS / Java
  - PostgreSQL / SQL
  - Cloud: Azure or AWS (preferred)
  - Containerization: Docker & Kubernetes

  AI Engineering & Automation

  We’re looking for engineers who’ve built intelligent systems
  from scratch, including:

  - LLM & Prompt Engineering
  - Azure OpenAI / Amazon Bedrock
  - Prompt chaining, context optimization, embeddings, vector
    stores

  Retrieval-Augmented Generation (RAG)

  - Agentic Workflows & Autonomous Execution
  - Multi-agent systems, tool/function calling
  - Robotic Business Systems (RBS), task orchestration
  - Semantic search, ranking, indexing
  - Document chunking, metadata tagging, latency optimization

  ML Ops & Optimization

  - CI/CD for model deployment
  - Cost-performance tuning, caching, dynamic model routing

  If you are an individual with a disability, please check our
  Disability Assistance page for information on how to request
  an accommodation.
