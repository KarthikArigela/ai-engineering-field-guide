description: |
  CoreWeave is The Essential Cloud for AI™. Built for pioneers
  by pioneers, CoreWeave delivers a platform of technology,
  tools, and teams that enables innovators to build and scale
  AI with confidence. Trusted by leading AI labs, startups,
  and global enterprises, CoreWeave combines superior
  infrastructure performance with deep technical expertise to
  accelerate breakthroughs and turn compute into capability.
  Founded in 2017, CoreWeave became a publicly traded company
  (Nasdaq: CRWV) in March 2025. Learn more at
  www.coreweave.com.

  About the Role:

  As a Software and AI Engineer, IT Systems, you’ll design and
  develop AI agents and first-party applications that bring
  intelligence, automation, and great user experience to
  CoreWeave’s internal ecosystem. You’ll work across the stack
  ranging from agentics frameworks (using iPaas platforms like
  Workato) or latest software frameworks from LangChain,
  LangGrapsh, Cohere, ChatGPT agentflow, OpenAI API, Gemini
  agent flow, or Glean API to rich, React-based interfaces and
  mobile experiences to robust backend services written in
  Node.js and Go.

  What You’ll Do:

  - Develop agents using AI capabilities into applications using
    frameworks such as LangChain, LangGraph, ChatGPT API, and
    Glean API
  - Design and build first-party web and mobile applications
    using React (TypeScript) and modern front-end frameworks
  - Develop scalable backend services in Node.js and Go for data
    processing, orchestration, and automation
  - Build internal AI agents and copilots that assist with tasks
    in Finance, Billing, and Supply Chain domains, integrating
    with systems like ERP, HRIS, MRP, DCIM, Data Warehouse
    among others - either natively or via an iPaaS like
    Workato or Boomi
  - Implement APIs and microservices that enable modular and
    event-driven application architectures
  - Leverage GenAI tools (Cursor, Claude, Copilot, ChatGPT
    Codex) to accelerate development, testing, and
    documentation
  - Ensure robust observability, maintainability, and security
    across the application stack
  - Collaborate with stakeholders in Finance, Accounting,
    Security, and Engineering to design intelligent, user-
    centered workflows

  Who You Are:

  - Programming Experience: 7+ years of professional programming
    experience in languages such as TypeScript, Python, Go,
    C++, C#, or Java, specifically for delivering production-
    grade cloud services.
  - Full-Stack Proficiency: Proven expertise in modern backend
    (e.g., FastAPI, gRPC) and frontend technologies (e.g.,
    React, Next), including the development of scalable
    backend services in Node.js and Go.
  - AI/LLM Experience: Solid familiarity with Generative AI
    frameworks (LangChain, LangGraph, ChatGPT API, or Glean
    API) and experience shipping production-grade AI/ML/LLM-
    based applications, or strong desire to build them.
  - Architecture: Solid experience designing and implementing
    RESTful APIs, microservices, and event-driven integration
    architectures.
  - Cloud & DevOps: Strong understanding of cloud environments
    (AWS, Azure, or GCP), container orchestration (e.g.,
    Kubernetes), and proficiency with DevOps and CI/CD
    principles.
  - Automation Tooling: 7+ years of experience in scripting
    (Python or Bash) for automation and tooling.

  Preferred:

  - Experience developing AI-powered or agentic applications
    integrated with complex enterprise data (ERP, HRIS, DCIM,
    Data Warehouse).
  - Proficiency with machine learning and data engineering
    platform tools (e.g., Ray, Kafka, Spark).
  - Experience with iPaaS platforms (Workato, Boomi) for
    building internal AI agents and copilots.
  - Exposure to the functional domains of Marketing, Finance,
    Billing, or Supply Chain where intelligent automation can
    drive measurable business efficiency.

  Wondering if you’re a good fit?

  We believe in investing in our people, and value candidates
  who can bring their own diversified experiences to our teams
  – even if you aren't a 100% skill or experience match. Here
  are a few qualities we’ve found compatible with our team. If
  some of this describes you, we’d love to talk.

  - You love to leverage cutting-edge GenAI tools (like Cursor,
    Claude, or Copilot) to accelerate your own development,
    testing, and documentation processes.
  - You’re curious about designing solutions with user
    experience (UX) and long-term system maintainability as a
    top priority.
  - You’re an expert in collaborating with non-technical
    stakeholders (like Finance and Accounting) to translate
    complex needs into intelligent, user-centered, and secure
    workflows.

  Why CoreWeave?

  At CoreWeave, we work hard, have fun, and move fast! We’re
  in an exciting stage of hyper-growth that you will not want
  to miss out on. We’re not afraid of a little chaos, and
  we’re constantly learning. Our team cares deeply about how
  we build our product and how we work together, which is
  represented through our core values:

  - Be Curious at Your Core
  - Act Like an Owner
  - Empower Employees
  - Deliver Best-in-Class Client Experiences
  - Achieve More Together

  We support and encourage an entrepreneurial outlook and
  independent thinking. We foster an environment that
  encourages collaboration and provides the opportunity to
  develop innovative solutions to complex problems. As we get
  set for take off, the growth opportunities within the
  organization are constantly expanding. You will be
  surrounded by some of the best talent in the industry, who
  will want to learn from you, too. Come join us!

  The base salary range for this role is $182,000 to $242,000.
  The starting salary will be determined based on job-related
  knowledge, skills, experience, and market location. We
  strive for both market alignment and internal equity when
  determining compensation. In addition to base salary, our
  total rewards package includes a discretionary bonus, equity
  awards, and a comprehensive benefits program (all based on
  eligibility).

  What We Offer

  The range we’ve posted represents the typical compensation
  range for this role. To determine actual compensation, we
  review the market rate for each candidate which can include
  a variety of factors. These include qualifications,
  experience, interview performance, and location.

  In addition to a competitive salary, we offer a variety of
  benefits to support your needs. The benefits below reflect
  our US-based offerings; for roles in other locations,
  benefits vary and are shared during the hiring process.
  These include:

  - Medical, dental, and vision insurance - 100% paid for by
    CoreWeave
  - Company-paid Life Insurance
  - Voluntary supplemental life insurance
  - Short and long-term disability insurance
  - Flexible Spending Account
  - Health Savings Account
  - Tuition Reimbursement
  - Ability to Participate in Employee Stock Purchase Program
    (ESPP)
  - Mental Wellness Benefits through Spring Health
  - Family-Forming support provided by Carrot
  - Paid Parental Leave
  - Flexible, full-service childcare support with Kinside
  - 401(k) with a generous employer match
  - Flexible PTO
  - Catered lunch each day in our office and data center
    locations
  - A casual work environment
  - A work culture focused on innovative disruption

