  - Thorough understanding and experience of DL/AI/ML lifecycle
    - full neural network pipeline, starting from data
    collection to model building to experimental framework to
    data analytics.
  - Developed/optimized various models in computing domain
    (Video, Statistics , Audio and others).
  - Demonstrated experience in completing data science projects
    with or without minimal supervision.
  - Must possess conceptual understanding of various modelling
    techniques, pros and cons of each technique.

  Added Advantage:

  - Proven record of migrating Al/ML/DL models/algorithms to low
    level platforms.
  - Familiar with optimizing code for minimal usage of CPU and
    memory.

