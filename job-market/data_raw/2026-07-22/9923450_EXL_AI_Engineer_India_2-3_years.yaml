description: |
  AI Engineer, India, 2-3 years

  Responsibilities

  • Design, build, and optimize agentic AI systems leveraging
  LLMs, multi-agent frameworks, tool‑use orchestration,
  retrieval systems, and autonomous workflows to solve complex
  real‑world problems.

  • Develop scalable ML pipelines and infrastructure including
  data processing, feature engineering, model
  training/evaluation and deployment using modern ML-Ops
  practices (Docker, Kubernetes, CI/CD, observability).

  • Integrate agents with enterprise tools and APIs enabling
  autonomous planning, reasoning, and execution chains across
  cloud platforms, internal systems, and third‑party services.

  • Collaborate cross‑functionally with product, engineering,
  and domain SMEs to design end‑to‑end intelligent workflows,
  ensure reliability/safety, and translate business needs into
  production‑grade agentic solutions.

  Qualifications

  • Minimum 2 year(s) of hands-on experience with Python
  (comfortable with PyTorch/TensorFlow)

  • Minimum 1 year(s) of experience with LangChain/LlamaIndex

  • Minimum 1 year(s) of experience with RAG pipelines and
  vector databases

  • Practical exposure to agentic/LLM systems such as
  tool‑calling, autonomous task execution, workflow
  orchestration, reasoning chains, prompt engineering, and
  integrating models with APIs or enterprise systems.

  • Strong MLOps & engineering discipline including experience
  with cloud platforms (Azure/AWS/GCP), containerization
  (Docker), CI/CD, data pipelines, and deploying ML systems
  into production environments.

  • Problem‑solving mindset and cross‑functional communication
  skills with the ability to translate business requirements
  into intelligent workflows, run experiments, and iterate
  quickly in a fast-paced AI environment.
