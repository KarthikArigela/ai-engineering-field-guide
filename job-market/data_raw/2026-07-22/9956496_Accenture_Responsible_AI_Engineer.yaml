description: |
  Project Role : Responsible AI Engineer Project Role
  Description : Assess AI systems for adherence to predefined
  thresholds and benchmarks related to responsible, ethical
  and sustainable practices. Design and implement technology
  mitigation strategies for systems to ensure ethical and
  responsible standards are achieved. Must have skills :
  Microsoft Agentic AI Architecture Good to have skills : NA
  Minimum 3 year(s) of experience is required Educational
  Qualification : 15 years full time education Summary: We are
  seeking a highly skilled Full Stack Developer experienced in
  Pro-Code development within Azure Foundry to design, build,
  and deploy scalable enterprise applications and intelligent
  Copilot experiences. The ideal candidate will have hands-on
  expertise across the full development lifecycle—from front-
  end UI through backend microservices—and deep familiarity
  with Azure PaaS services, DevOps pipelines, and secure
  deployment within Microsoft s ecosystem.

  Roles & Responsibilities:
  - Design, develop, and deploy full-stack applications using
    Azure Foundry and Microsoft Cloud Services (App Services,
    Functions, Cosmos DB, etc.).
  - Build and maintain REST APIs, GraphQL endpoints, and service
    integrations with Microsoft Graph, Dataverse, and Power
    Platform connectors.
  - Implement secure authentication and authorization models
    leveraging Entra ID (Azure AD) and managed identities.
  - Develop front-end components using React, TypeScript, and
    Fluent UI, ensuring accessibility and responsive design.
  - Implement CI/CD pipelines using Azure DevOps with automated
    build, test, and deployment workflows.
  - Collaborate with UX designers, solution architects, and PMs
    to translate business requirements into technical
    solutions.
  - Optimize performance, scalability, and maintainability
    through code reviews, telemetry (Application Insights),
    and observability best practices.
  - Support modernization of legacy applications into Azure
    Foundry microservice architecture.

  Professional & Technical Skills:
  - Professional experience in full-stack software development.
  - Proven hands-on expertise with Azure Foundry or equivalent
    Azure PaaS microservice architecture.
  - Strong programming skills in C# / .NET Core, JavaScript /
    TypeScript, Python and React.
  - Experience with Azure DevOps, GitHub Actions, or equivalent
    CI/CD platforms.
  - Familiarity with Microsoft Graph, Dataverse, and Power
    Platform integration patterns.
  - Understanding of cloud security, DLP, and compliance best
    practices.

  Additional Information:
  - The candidate should have minimum 3 years of experience in
    Microsoft Agentic AI Architecture.
  - This position is based at our Pune office.
  - A 15 years full time education is required.


  15 years full time education

