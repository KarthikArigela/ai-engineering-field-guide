description: |
  We are seeking an experienced engineering leader to drive
  the transformation of quality engineering practices across
  Thomson Reuters Tax & Accounting products. This individual
  will lead the transition from manual, QA-dependent processes
  to an AI-enabled, automation-first engineering culture where
  quality is owned by the entire delivery team.

  The ideal candidate combines deep software engineering
  expertise, modern test automation experience, AI-assisted
  development practices, and a proven track record of leading
  organizational change. This role will partner with
  engineering leaders to establish automation standards,
  improve product quality, elevate engineering practices, and
  help build a modern quality engineering organization.



  About the Role

  In this opportunity as a Staff Software Engineer AI I you
  will:

  - Leverage Generative AI and AI-assisted engineering
    techniques to accelerate testing, automation development,
    defect analysis, and quality insights.

  - Design frameworks that use AI to improve test coverage, test
    creation, and maintenance efficiency.

  - Establish modern AI-enabled quality engineering practices
    across multiple product teams.

  - Evaluate emerging AI tools and drive practical adoption
    across engineering organizations.

  - Define and execute a multi-year automation strategy
    supporting development, testing, staging, and production
    environments.

  - Establish automation as a required component of the software
    development lifecycle.

  - Build scalable and maintainable automation frameworks that
    can be leveraged across teams.

  - Partner with developers to increase automation ownership
    within engineering teams.

  - Lead the transition from traditional QA practices to a
    modern Quality Engineering model.

  - Drive a culture where quality is a shared responsibility
    across developers, quality engineers, and product teams.

  - Coach teams on shift-left practices, continuous validation,
    and engineering excellence.

  - Influence organizational change through strong technical
    leadership and stakeholder engagement.

  - Mentor engineers and quality professionals on automation,
    AI-assisted development, and modern engineering practices.

  - Establish standards, metrics, and governance processes that
    improve software quality.

  - Partner with engineering managers and architects to
    continuously raise engineering quality standards.

  - Serve as a trusted advisor to leadership on quality
    transformation initiatives.
  - Provide technical leadership and mentorship across
    engineering and quality teams.

  - Support workforce transformation efforts through coaching,
    talent development, and performance management.

  - Help identify skill gaps and establish training and
    upskilling plans.

  - Foster a high-performance culture focused on accountability,
    continuous improvement, and engineering excellence.



  About You

  You’re a fit for the role of Staff Software Engineer - AI if
  you have the following required qualifications:

  - 10+ years of software engineering, quality engineering, or
    test automation experience.

  - Strong experience building enterprise-scale automation
    frameworks and quality engineering solutions.

  - Hands-on development experience with C#, Java, Python,
    TypeScript, or similar modern programming languages.

  - Experience implementing automation within CI/CD pipelines
    and modern DevOps environments.

  - Demonstrated success leading engineering transformation
    initiatives and driving organizational change.

  - Deep understanding of software architecture, APIs,
    distributed systems, and cloud-native applications.

  - Strong communication and influencing skills with experience
    working across multiple teams and leadership levels.

  - Proven track record of mentoring engineers and improving
    engineering culture.

  - Experience applying Generative AI and AI coding assistants
    within software engineering workflows.

  - Experience using AI to automate testing, quality analysis,
    defect prediction, or engineering productivity
    improvements.

  - Experience leading Quality Engineering transformations
    within large organizations.

  - Prior people leadership experience, including coaching,
    performance management, and talent development.

  - Experience with Playwright, Selenium, Cypress, API
    automation frameworks, and test infrastructure platforms.

  - Experience working within highly regulated or enterprise
    software environments.

  #LI-VGA1

  What’s in it For You?

  - Hybrid Work Model: We’ve adopted a flexible hybrid working
    environment (2-3 days a week in the office depending on
    the role) for our office-based roles while delivering a
    seamless experience that is digitally and physically
    connected.
  - Flexibility & Work-Life Balance: Flex My Way is a set of
    supportive workplace policies designed to help manage
    personal and professional responsibilities, whether caring
    for family, giving back to the community, or finding time
    to refresh and reset. This builds upon our flexible work
    arrangements, including work from anywhere for up to 8
    weeks per year, empowering employees to achieve a better
    work-life balance.
  - Career Development and Growth: By fostering a culture of
    continuous learning and skill development, we prepare our
    talent to tackle tomorrow’s challenges and deliver real-
    world solutions. Our Grow My Way programming and skills-
    first approach ensures you have the tools and knowledge to
    grow, lead, and thrive in an AI-enabled future.
  - Industry Competitive Benefits: We offer comprehensive
    benefit plans to include flexible vacation, two company-
    wide Mental Health Days off, access to the Headspace app,
    retirement savings, tuition reimbursement, employee
    incentive programs, and resources for mental, physical,
    and financial wellbeing.
  - Culture: Globally recognized, award-winning reputation for
    inclusion and belonging, flexibility, work-life balance,
    and more. We live by our values: Obsess over our
    Customers, Compete to Win, Challenge (Y)our Thinking, Act
    Fast / Learn Fast, and Stronger Together.
  - Social Impact: Make an impact in your community with our
    Social Impact Institute. We offer employees two paid
    volunteer days off annually and opportunities to get
    involved with pro-bono consulting projects and
    Environmental, Social, and Governance (ESG) initiatives.
  - Making a Real-World Impact: We are one of the few companies
    globally that helps its customers pursue justice, truth,
    and transparency. Together, with the professionals and
    institutions we serve, we help uphold the rule of law,
    turn the wheels of commerce, catch bad actors, report the
    facts, and provide trusted, unbiased information to people
    all over the world.

  About Us

  Thomson Reuters informs the way forward by bringing together
  the trusted content and technology that people and
  organizations need to make the right decisions. We serve
  professionals across legal, tax, accounting, compliance,
  government, and media. Our products combine highly
  specialized software and insights to empower professionals
  with the data, intelligence, and solutions needed to make
  informed decisions, and to help institutions in their
  pursuit of justice, truth, and transparency. Reuters, part
  of Thomson Reuters, is a world leading provider of trusted
  journalism and news.

  We are powered by the talents of 26,000 employees across
  more than 70 countries, where everyone has a chance to
  contribute and grow professionally in flexible work
  environments. At a time when objectivity, accuracy,
  fairness, and transparency are under attack, we consider it
  our duty to pursue them. Sound exciting? Join us and help
  shape the industries that move society forward.

  As a global business, we rely on the unique backgrounds,
  perspectives, and experiences of all employees to deliver on
  our business goals. To ensure we can do that, we seek
  talented, qualified employees in all our operations around
  the world regardless of race, color, sex/gender, including
  pregnancy, gender identity and expression, national origin,
  religion, sexual orientation, disability, age, marital
  status, citizen status, veteran status, or any other
  protected classification under applicable law. Thomson
  Reuters is proud to be an Equal Employment Opportunity
  Employer providing a drug-free workplace.

  We also make reasonable accommodations for qualified
  individuals with disabilities and for sincerely held
  religious beliefs in accordance with applicable law. More
  information on requesting an accommodation here.

