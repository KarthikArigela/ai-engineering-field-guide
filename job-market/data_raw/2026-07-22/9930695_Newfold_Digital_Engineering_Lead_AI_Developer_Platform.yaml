job_id: 9930695
title: "Engineering Lead – AI & Developer Platform"
company: Newfold Digital
location: Mumbai, IND
work_type: FULL_TIME
company_size: 5,687 Employees
description: |
  Who we are.  

  At Bluehost, we believe all small businesses deserve the
  opportunity to succeed online. Our mission is to give small
  businesses the confidence to think big. We're the all-in-one
  platform for small businesses to grow online with powerful
  simplicity, premium performance, smart tools and human
  support.

  We’re looking for a strong engineering lead to drive next-
  generation AI and Developer Platform initiatives across
  multiple brands and product ecosystems. This role is ideal
  for someone who can operate hands-on at the architecture
  level while also leading platform thinking, developer
  experience improvements, AI integrations, automation,
  observability, and scalable engineering practices.

  The person will work closely with product, infrastructure,
  platform, and application engineering teams to modernize
  internal systems and accelerate AI adoption across customer-
  facing and internal platforms

  What you’ll do & how you’ll make your mark.

  - Lead architecture and implementation of companywide
    initiatives leveraging AI
  - Build scalable developer platform capabilities for
    engineering teams
  - Drive AI integrations across customer flows, internal tools,
    automation, and support systems
  - Improve engineering productivity through tooling, workflows,
    CI/CD, observability, and automation
  - Define long-term technical direction for platform
    modernization
  - Partner with Infra, SRE, Security, and Product teams for
    platform reliability and scalability
  - Establish engineering standards, reusable frameworks, and
    best practices
  - Mentor engineers and influence cross-functional technical
    decisions
  - Evaluate and introduce modern AI tooling, LLM integrations,
    RAG systems, copilots, and agentic workflows
  - Drive operational excellence around logging, monitoring,
    telemetry, debugging, and platform reliability
  - Develop and own your application(s), pipelines, deployment,
    logging and telemetry

  Core Engineering

  - Strong experience in distributed HA systems, scalable web
    platforms
  - Strong coding skills in Java,  (bonus points if also
    familiar with Node.Js)
  - Hands on experience with spring boot, maven, docker, java 16
    to java 21, microservices (bonus points if in spring),
    jwt, oauth
  - Good to have experience with spring ai, redis
  - Basic understanding of networking, kafka, grafana, linux
    commands, tomcat

  AI & Platform Experience

  This is primarily an SDE role focused on adding AI
  capabilities to our  existing systems - you won't be doing
  foundational ML work, but you'll be encouraged to build and
  maintain pipelines where they solve a real problem.

  - Experience integrating LLM capabilities into products —
    prompt engineering, embeddings, RAG pipelines
  - Familiarity with agent/orchestration frameworks (e.g.,
    LangChain, LangGraph) or agentic tooling like MCP
  - Comfortable using AI-assisted coding tools (Copilot, Cursor,
    Claude Code) in daily workflow
  - Bonus: understanding of transformer/model architecture, or
    experience building your own ML pipeline

  Cloud & Infrastructure

  - Mandatory: k8s (need to know how to debug k8s errors),
    docker, AWS or GCP or OCI (need to know and worked with at
    least one cloud provider not limited to the ones
    mentioned), Grafana or Datadog (or some alternative that
    performs the same role)
  - Good to have: jenkins, helm or terraform (one of the two,
    bonus points if both), OTEL, Loki or Prometheus or
    Clickhouse (need to have worked with anyone, bonus points
    if more than one)

  Leadership Expectations

  - Ability to lead ambiguous and fast-moving initiatives
  - Strong ownership mindset and execution capability
  - Excellent communication and stakeholder management
  - Comfortable working across product, infra, and engineering
    teams
  - Ability to challenge existing systems and drive
    modernization
  - Experience mentoring engineers and leading technical
    discussion

  Who you are & what you’ll need to succeed.

  - 6–10+ years of engineering experience
  - Experience building internal developer platforms
  - Experience in large-scale enterprise or multi-brand
    ecosystems
  - Knowledge of identity systems, authentication, SSO, or
    platform integrations
  - Exposure to AI governance and AI security
  - Experience with event-driven systems and workflow
    orchestration
  - Previously worked as Senior Engineer, Staff Engineer, Tech
    Lead, Principal Engineer, or Engineering Lead
  - Hands-on builder with strong architecture skills
  - Passionate about AI evolution and developer tooling
  - Able to balance speed, scalability, and business impact

  Why you’ll love us.

  - We’ve evolved: We provide three work environment scenarios.
    You can feel like a Newfolder in a work-from-home, hybrid,
    or work-from-the-office environment.
  - Work-life balance: Our work is thrilling and meaningful, but
    we know balance is key to living well.
  - We celebrate one another’s differences: We’re proud of our
    culture of diversity and inclusion. We foster a culture of
    belonging. Our company and customers benefit when
    employees bring their authentic selves to work. We have
    programs that bring us together on important issues and
    provide learning and development opportunities for all
    employees. We have 20+ affinity groups where you can
    network and connect with employees globally.
  - We care about you: At Bluehost, taking care of our employees
    is our top priority. We make sure that cutting edge
    benefits are in place for you. Some of the benefits you
    will have: We have partnered with some of the best
    insurance providers to provide you excellent Health
    Insurance options, Education/ Certification Sponsorships
    to give you a chance to further your knowledge, Flexi-
    leaves to take personal time off and much more. Building a
    community with one domain at a time, one employee at a
    time.
  - Where can we take you? We’re fans of helping our employees
    learn different aspects of the business, be challenged
    with new tasks, be mentored, and grow their careers.
    Unfold new possibilities with Bluehost #OTOD!

