description: |
  System Performance Test Engineer (AI, Automation)



  This role has been designed as ‘Hybrid’ with an expectation
  that you will work on average 2 days per week from an HPE
  office.

  Who We Are:

  Hewlett Packard Enterprise is the global edge-to-cloud
  company advancing the way people live and work. We help
  companies connect, protect, analyze, and act on their data
  and applications wherever they live, from edge to cloud, so
  they can turn insights into outcomes at the speed required
  to thrive in today’s complex world. Our culture thrives on
  finding new and better ways to accelerate what’s next. We
  know varied backgrounds are valued and succeed here. We have
  the flexibility to manage our work and personal needs. We
  make bold moves, together, and are a force for good. If you
  are looking to stretch and grow your career our culture will
  embrace you. Open up opportunities with HPE.

  Job Description:



  High Performance Computing, AI and Labs is a critical
  element of HPE. We are focused on delivering innovative
  solutions that accelerate our customers' digital
  transformation, enabling them to tackle their complex, data-
  intensive workloads. Combining deep expertise with the
  development of the world's most cutting-edge high-
  performance supercomputers is defining the next era of
  computing and delivering valuable insights and innovation.
  Join us and redefine what's next for you.

  About the Role: HPE NonStop is seeking a hands-on System
  Performance Test Engineer to drive AI-powered innovation and
  automation across our existing NonStop System Performance
  test suite. Many of the test beds in our catalog have some
  degree of automation already built within them; however, we
  are looking to identify and execute potential AI innovations
  and automation opportunities.

  We're looking for someone who will bring new ideas to the
  organization and drive them through implementation. In
  addition to AI productivity experience, we are seeking an
  engineer who also has previous experience with system
  performance testing. As a member of the NonStop Performance
  Team, you will also participate in NonStop System
  Performance testing.

  Our NonStop Performance Team provides end-to-end performance
  evaluation of the NonStop Compute and Software solution,
  including x86 processors, memory, networking, and storage
  subsystem components.

  You will work as a member of the Performance Team, which
  owns benchmarking strategy, deep-dive profiling, performance
  tuning, and capacity characterization on Intel x86
  platforms, high-speed interconnects (e.g., InfiniBand/RDMA),
  and our proprietary operating system and network stack (SSH,
  NFS, SMB/Samba, DNS, FTP/SFTP, NTP, and IPsec).

  This team's role is pivotal for customers in payment
  gateways, banking, stock exchanges, and telecom
  switching—domains that demand low latency, high throughput,
  and high availability.

  What You'll Do:

  As a member of the NonStop Performance Team:

  - Become a participating member of the NonStop Performance
    Team to understand day-to-day performance testing
    workflows and identify AI innovation and automation
    opportunities.
  - Collaborate with the NonStop Performance Team Engineering
    Lead to identify and execute prioritized AI productivity
    innovations and automation.
  - As a member of the Performance Team, you may be tasked to:
    - Execute, define, and drive performance activities, including
      metrics, KPIs, SLOs, benchmarks, acceptance criteria,
      and regression gates for releases.
    - Translate product performance and workload requirements into
      repeatable performance test plans.
    - Use tools such as Measure, ProcessH, XProfile, Wireshark
      (runtime performance data collection), and LoadRunner
      analysis tools to perform full-stack profiling (CPU,
      memory, cache, NUMA locality, I/O paths, interrupts,
      network stack, and kernel scheduling).
    - Analyze contention (locks, queues), interrupt distribution,
      socket backlogs, TCP/IP and RDMA tuning, storage queues,
      and filesystem behavior to produce clear root-cause
      analyses with system software development teams.
    - Partner with hardware, firmware, OS, storage, and networking
      teams to co-own performance outcomes, participate in
      design and code reviews, and advocate for performance-
      centric architecture and testability.

  In Support of AI Innovation Initiatives:

  You may be tasked to:

  - Create and maintain team-level AI artifacts, including:
    - AGENTS.md
    - .github/copilot-instructions.md
    - Reusable prompts
    - Workflow playbooks
  - Build and refine AI personas for specific use cases.
  - Implement AI-assisted test suite workflow automations
    (GitHub, CI/CD, scripts, and internal tooling).
  - Prototype and deliver tools in Python (or similar
    languages), with clear documentation and adoption
    guidance.
  - Track and report impact metrics for implemented changes,
    including:
    - Adoption
    - Cycle time
    - Review quality
    - Defect trends
  - Provide enablement support through demos, office hours, and
    team training sessions.

  What You Need to Bring:Education & Experience

  - Bachelor's degree in Computer Science, Electrical
    Engineering, Electronic Engineering, IT Engineering, or a
    related field (or equivalent practical experience).
  - 5+ years of experience in system performance engineering
    with strong coding skills.
  - Proficiency in Python programming for test automation,
    tooling development, AI-assisted workflow automation, data
    analysis, and integration of AI-powered solutions into
    engineering processes.
  - Practical experience using AI coding tools (GitHub Copilot,
    ChatGPT, Claude, or similar) in software development
    workflows.
  - Experience delivering automation or developer tooling used
    by multiple engineers.
  - Strong written and verbal communication skills, with the
    ability to clearly explain technical trade-offs.
  - Comfortable operating in ambiguous environments while
    maintaining execution focus.
  - Familiarity with Git-based workflows and CI/CD systems.
  - Growth mindset, curiosity, and willingness to experiment and
    iterate quickly.

  Nice-to-Have

  - Experience with prompt design and structured evaluation of
    AI output quality.
  - Experience creating internal technical documentation,
    runbooks, or enablement content.
  - Exposure to secure coding or quality engineering practices
    in review workflows.

  Desired Characteristics

  - Passion for improving productivity through AI and
    automation.
  - Strong technical curiosity and a data-driven mindset.
  - Ability to influence teams and drive adoption without direct
    authority.
  - Comfortable operating amid ambiguity in fast-moving AI
    tooling environments, where standards, models, and best
    practices evolve rapidly.

  Additional Skills:

  Cloud Architectures, Cross Domain Knowledge, Design
  Thinking, Development Fundamentals, DevOps, Distributed
  Computing, Microservices Fluency, Full Stack Development,
  Security-First Mindset, Solutions Design, Testing &
  Automation, User Experience (UX)

  What We Can Offer You:

  Health & Wellbeing

  We strive to provide our team members and their loved ones
  with a comprehensive suite of benefits that supports their
  physical, financial and emotional wellbeing.

  Personal & Professional Development

  We also invest in your career because the better you are,
  the better we all are. We have specific programs catered to
  helping you reach any career goals you have — whether you
  want to become a knowledge expert in your field or apply
  your skills to another division.

  Unconditional Inclusion

  We are unconditionally inclusive in the way we work and
  celebrate individual uniqueness. We know varied backgrounds
  are valued and succeed here. We have the flexibility to
  manage our work and personal needs. We make bold moves,
  together, and are a force for good.

  Let's Stay Connected:

  Follow @HPECareers on Instagram to see the latest on people,
  culture and tech at HPE.

