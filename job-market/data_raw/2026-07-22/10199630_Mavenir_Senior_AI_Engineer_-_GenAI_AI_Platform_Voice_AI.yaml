description: |
  Mavenir is building the future of networks and pioneering
  advanced technology, focusing on the vision of a single,
  software-based automated network that runs on any cloud. As
  the industry's only end-to-end, cloud-native network
  software provider, Mavenir is transforming the way the world
  connects, accelerating software network transformation for
  250+ Communications Service Providers in over 120 countries,
  which serve more than 50% of the world’s subscribers.

  Role Summary

  We are looking for a highly capable Senior AI Engineer with
  3–4 years of hands-on AI/ML experience to design, build, and
  productionize scalable AI systems across Generative AI, AI
  platforms, AI gateways, Voice AI, LLM fine-tuning, ML
  training, and ML pipelines. This role is for someone who can
  take ownership of complex AI initiatives end-to-end — from
  problem understanding, architecture, experimentation,
  model/pipeline development, deployment, observability, and
  continuous improvement. The ideal candidate should be
  comfortable working across application engineering, ML
  engineering, LLM systems, APIs, infrastructure, and
  production-grade AI platform components

  Key Responsibilities

  GenAI Application Engineering

  Design and build production-ready GenAI applications using
  LLMs, SLMs, RAG, agents, tool-calling, workflow
  orchestration, and prompt engineering

  AI Gateway & AI Platform Engineering

  Contribute to the design and implementation of AI platform
  capabilities that enable safe, governed, and scalable use of
  AI models

  Voice AI Engineering

  Design and implement Voice AI systems involving speech-to-
  text, text-to-speech, speech translation, voice agents, and
  real-time conversational AI.

  LLM Fine-Tuning & Model Training

  Work on fine-tuning and training workflows for LLMs, SLMs,
  and task-specific ML models

  ML Pipelines & MLOps

  Design and maintain scalable ML pipelines for data
  preparation, training, evaluation, deployment, monitoring,
  and retraining

  Job Requirements

  Skills Required:

  Strong C, C++ and Python programming skills

  Hands-on GenAI/LLM application development

  Understanding of ML training and evaluation workflows

  Ability to build APIs and backend services

  Understanding of scalable system design

  Experience with at least one ML/LLM framework

  Ability to work with data pipelines and model pipelines

  Fine-tuning frameworks such as PEFT, LoRA, QLoRA, TRL, or
  Unslot

  Workflow orchestration using Airflow, Prefect, Kubeflow,
  Dagster, or similar tools

  Containerization using Docker

  Practical understanding of deployment, observability, and
  production readiness

  3 to 4 years of hands-on experience in AI/ML, GenAI, or ML
  engineering

  Strong practical exposure to building AI/ML systems, not
  just theoretical knowledge

  Accessibility

  Mavenir is committed to working with and providing
  reasonable accommodation to individuals with physical and
  mental disabilities. If you require any assistance, please
  state in your application or contact your recruiter.

  Mavenir is an Equal Employment Opportunity (EEO) employer
  and welcomes qualified applicants from around the world,
  regardless of their ethnicity, gender, religion,
  nationality, age, disability, or other legally protected
  status.
