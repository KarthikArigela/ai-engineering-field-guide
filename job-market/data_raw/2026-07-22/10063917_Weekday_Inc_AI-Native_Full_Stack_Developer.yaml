description: |
  This role is for one of the Weekday's clients

  Salary range: Rs 500000 - Rs 2000000 (ie INR 5 - 20 LPA)

  Min Experience: 3+ years

  Location: Hyderabad

  JobType: full-time

  We are seeking a talented AI-Native Full Stack Developer
  with a passion for building modern, scalable web
  applications and leveraging AI-assisted development tools.
  You will contribute to the complete software development
  lifecycle, delivering high-quality frontend and backend
  solutions while integrating AI capabilities into production-
  ready applications. This role offers the opportunity to work
  with experienced engineers on AI-first products for global
  customers.

  Requirements

  Key Responsibilities

  • Develop, enhance, and maintain scalable full-stack web
  applications.

  • Build responsive and user-friendly interfaces using
  React.js or Angular, JavaScript/TypeScript, HTML5, and CSS3.

  • Develop backend services using Node.js/Express.js or
  Python and build/consume RESTful APIs.

  • Design and manage data using PostgreSQL and MongoDB with
  modern ORMs such as Prisma, Mongoose, and SQLAlchemy.

  • Integrate LLM APIs into applications and implement prompt-
  based AI workflows.

  • Utilize AI development tools such as Claude Code and
  GitHub Copilot to improve productivity while validating
  generated code.

  • Write unit and integration tests using Jest and Pytest,
  with exposure to Playwright and Cypress.

  • Implement secure authentication using JWT and OAuth and
  follow Git-based development and CI/CD practices.

  • Deploy Docker-based applications and independently deliver
  assigned features with high quality.

  Required Technical Skills

  • Frontend: React.js or Angular, JavaScript, TypeScript,
  HTML5, CSS3.

  • Backend: Node.js, Express.js, Python, REST API
  Development.

  • Database: PostgreSQL, MongoDB, Prisma, Mongoose,
  SQLAlchemy.

  • Cloud & DevOps: Azure or AWS fundamentals, Git, Docker,
  CI/CD basics.

  • AI-Native Development: Claude Code, GitHub Copilot, LLM
  API Integration, AI-assisted development workflows.

  • Testing & Security: Jest, Pytest, Playwright/Cypress
  (basic), JWT, OAuth.

  Qualifications

  • 3+ years of professional Full Stack development
  experience.

  • Strong understanding of frontend and backend development
  fundamentals.

  • Experience designing and consuming REST APIs.

  • Hands-on exposure to AI-assisted development tools and LLM
  integrations.

  • Strong debugging, analytical, and problem-solving skills.

  • Excellent communication, teamwork, and ownership mindset.

  Preferred Skills

  • Experience with Next.js, Tailwind CSS, FastAPI, GraphQL,
  and Redis.

  • Exposure to Prompt Engineering and Retrieval-Augmented
  Generation (RAG).

  • Experience with Azure OpenAI, OpenAI APIs, or similar AI
  platforms.

  • Basic knowledge of Kubernetes and container orchestration.

  Why Join Us  • Build AI-first products used by global
  customers. • Work with modern AI tools and cutting-edge
  technologies. • Gain exposure to scalable architecture,
  cloud platforms, and best engineering practices. • Enjoy
  continuous learning, mentorship, and career growth
  opportunities.

  Good-to-have skills

  Full Stack Developer
