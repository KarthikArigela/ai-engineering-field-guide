description: |
  About GovPilot:

  GovPilot has spent over 20 years building the technology
  that local governments run on. Today, hundreds of local
  governments and environmental health regulatory agencies
  across North America rely on our suite of software products
  to automate workflows, digitize records, and streamline
  permitting and compliance — helping public agencies serve
  their communities better.

  We're an AI-first company. Not in how we talk about AI, but
  in how we expect people to use it. Our CEO, Javier, sums it
  up simply: your job isn't just about finding ways AI can
  help you do the job you have today, it's about rethinking
  how AI changes the job itself. This is a process that you
  can drive, not only for greater efficiency but also for
  greater enjoyment. We see a future where AI can make our
  jobs not just faster but also more enjoyable and rewarding.
  As a result this is a huge opportunity, not a threat: AI
  takes on the repetitive, so people can focus on judgment,
  creativity, and the problems that actually need a person.

  We're building the team that figures out what AI-driven
  software delivery looks like at GovPilot, not just using AI
  tools, but rethinking how software gets built, shipped, and
  run.

  What We Offer:

  - Competitive salary
  - Unlimited PTO
  - Flexible hours and remote work
  - Comprehensive health, dental, and vision insurance
  - Professional development budget
  - Home office and IT budget
  - Real autonomy and high-impact work

  Please note: we're unable to sponsor or take over
  sponsorship of an employment visa at this time.

  The Role:

  We're looking for an AI engineer who wants to help us
  rewrite the rules of how we build software. You'll work
  across the GovPilot ecosystem, GovTech, SDL, and Hedgerow,
  on a team figuring out what comes after the standard agile
  playbook when AI agents can write, test, and ship code.

  This is not a role for someone who wants a defined stack and
  a backlog. You'll move across languages and codebases as
  needed. You'll be judged on outcomes, not on hours logged or
  tickets closed. We want someone who runs fast, sets up their
  own systems, and pushes AI-assisted development further than
  we've taken it so far, and does it safely.

  You should be someone who is obsessed with AI engineering:
  you read the papers, try the new tools the week they ship,
  and have opinions about where this is all going.

  What You'll Do:

  - Build and ship features across the GovPilot, SDL, and
    Hedgerow codebases, picking up new languages and
    frameworks as the work demands
  - Design and build systems and workflows that let AI agents
    work at scale without sacrificing safety or quality
  - Run your own email, calendar, and task management with a
    high degree of autonomy. No one is going to hand you a
    step-by-step plan
  - Propose and pilot new ways of working that go beyond
    standard agile or sprint-based development
  - Set up guardrails, evals, and review processes so AI-
    generated work can be trusted and shipped quickly
  - Partner with engineering leadership to figure out what our
    development lifecycle should look like a year from now,
    and start building toward it now

  What You Bring:

  - Deep hands-on experience with AI coding tools (Claude Code,
    Cursor, Copilot, or similar) as a daily driver, not an
    occasional assist
  - Comfort moving across programming languages and stacks
    without needing ramp-up time
  - A track record of working with minimal oversight: you set
    your own priorities and follow through
  - Strong instincts for what can and can't be trusted to run
    autonomously, and the judgment to build guardrails around
    it
  - Genuine curiosity about how AI changes software development,
    not just as a productivity boost but as a different way of
    working
  - You must reside in and be authorized to work in the United
    States

  What Makes You Stand Out:

  - Experience designing or running agentic workflows in
    production, not just prototypes
  - A history of building or proposing new team processes, not
    just following the ones you were given
  - Experience across both legacy and modern systems
  - A public track record (blog, open source, talks) of thinking
    seriously about AI engineering

  How to Apply

  If you're the kind of person who's already been
  experimenting with agentic AI workflows on your own time,
  and you want to help a team figure this out for real, send
  us your resume.

  Equal Opportunity Employer

  We are an equal opportunity employer and value diversity. We
  do not discriminate on the basis of race, religion, color,
  national origin, gender, sexual orientation, age, marital
  status, veteran status, or disability status. We believe our
  workforce should reflect people of all backgrounds,
  identities, and experiences.

  Join us in creating amazing technology solutions that make a
  difference. Apply today!
