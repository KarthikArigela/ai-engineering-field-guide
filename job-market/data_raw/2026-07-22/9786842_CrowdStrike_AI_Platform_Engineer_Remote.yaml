description: |
  As a global leader in cybersecurity, CrowdStrike protects
  the people, processes and technologies that drive modern
  organizations. Since 2011, our mission hasn’t changed —
  we’re here to stop breaches, and we’ve redefined modern
  security with the world’s most advanced AI-native platform.
  We work on large scale distributed systems, processing
  almost 3 trillion events per day and this traffic is growing
  daily. Our customers span all industries, and they count on
  CrowdStrike to keep their businesses running, their
  communities safe and their lives moving forward. We're proud
  to work for a mission-driven company leveraging AI to
  transform the way we work. CrowdStrikers drive their careers
  through flexibility and autonomy while also being expected
  to contribute to a culture of responsible AI adoption,
  experimentation, and innovation. We use an AI-first mindset
  as a force multiplier to proactively and continuously
  accelerate execution, build expertise, uncover insights, and
  solve complex problems. We’re always looking to add talented
  CrowdStrikers to the team who have limitless passion, a
  relentless focus on innovation and a fanatical commitment to
  our customers, our community and each other. Ready to join a
  mission that matters? The future of cybersecurity starts
  with you.

  About the Role: The Enterprise AI space is evolving at an
  unprecedented pace, and so is our project portfolio. We are
  seeking a highly versatile and technically proficient AI
  Platform Engineer to join the AI Platforms team within IT
  Enterprise AI team. In this role, you will be the critical
  bridge between rapid prototyping and scalable infrastructure
  for our internal agents. You won't be confined to pure
  development or high-level architecture. Instead, you will
  operate in a dynamic R&D environment to scale, secure, and
  implement the custom API-driven AI technologies that power
  our internal 'run-the-business' agents. You will partner
  closely with AI developers, InfoSec, Identity, and other
  cross-functional teams to enablehigh-code agent
  environments, agentic security, and advanced AI platforms.
  If you thrive in a fast-paced environment where you can
  pivot quickly, evaluate new vendors, and build the
  infrastructure that powers next-generation AI agents, this
  is the role for you.

  What You'll Do:

  - Scale AI Infrastructure: Implement and scale critical
    infrastructure for advanced agents in cloud environments
    (AWS, GCP), working closely with developers to transition
    rapid prototypes into robust, scalable solutions
  - Enable Agentic Security & Identity: Implement advanced AI
    Gateways and integrate Okta for robust agent identity and
    security posture
  - Build & Manage Environments: Create and maintain agile
    environments dedicated to testing and prototyping new AI
    vendors, components, models, and integrations, while
    carving a clear path to production releases
  - Technology Evaluation: Develop and execute rigorous
    evaluation criteria for emerging AI technologies, ensuring
    we adopt the best tools for our high-code agent
    environments
  - Cross-Functional R&D: Function as a key technical pivot
    point in a group focused on rapid prototyping,
    collaborating seamlessly with Information Security,
    Identity, and wider IT teams. Partner with enterprise
    architects to align rapid prototypes with broader
    architectural standards, helping to validate and offer
    critical feedback
  - Agent Observability & Telemetry: Design and implement
    monitoring solutions to trace complex agent workflows,
    tracking tool usage, latency, and LLM decision pathways to
    ensure reliability at scale
  - Drive Innovation: Continuously monitor the rapidly changing
    AI landscape, helping the team innovate and adapt our
    platform architecture to support future AI capabilities

  What You'll Need:

  - Core Tech Stack: Advanced proficiency with
    Python/Typescript, containerization
  - (Docker/Kubernetes), REST APIs and identity protocols
    (OAuth2, OIDC)
  - Infrastructure & Pipeline Collaboration: Proven ability to
    build rapid cloud prototypes (AWS/GCP) and partner with
    core DevOps teams to translate those into scalable
    Terraform architectures. Familiarity with adapting CI/CD
    pipelines specifically for agentic innovations, model
    deployments, and high-code AI workflows
  - Prototyping Mindset: A track record of thriving in R&D or
    rapid prototyping environments, with a passion for taking
    experimental concepts and figuring out how to scale them
  - Evaluation & Testing: Ability to methodically evaluate new
    vendor technologies, set
  - testing criteria, and present actionable findings
  - Collaborative Communication: Excellent communication skills
    to bridge the gap between AI developers, product managers,
    and external security/infrastructure teams
  - Security & Governance: Familiarity with AI-specific threat
    vectors (e.g., OWASP Top 10 for LLMs), implementing
    runtime AI guardrails, and securing non-human/machine
    identities at scale
  - Proven experience utilizing AI technologies to enhance
    decision-making, streamline workflows and processes,
    improve efficiency and drive business outcomes.

