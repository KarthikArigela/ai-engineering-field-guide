description: |
  Rockstar is recruiting for a national natural food &
  beverage brokerage dedicated to an ethically valued business
  that positively impacts people, community, and the industry.
  Their team is driven by the desire to transform the retail
  landscape while infusing passion, integrity, and
  transparency. They are committed to building meaningful
  partnerships that will reshape the future of foods available
  in the marketplace.

  Job Description: Description, Scope, Responsibilities

  Position: Applied AI Developer

  Coverage Area: National Support Role

  Office Location: Remote / Home

  Hours of Operation: M-F, Standard Business Hours. May
  require occasional flexibility to accommodate project
  deadlines and cross-functional team needs.

  Reporting Structure: The AI Developer / AI Integration
  Engineer will report to senior leadership. The company
  encourages a flat organizational structure, where each team
  member is independently proactive yet works in harmony with
  others.

  Department: Business Intelligence Team

  Responsibilities & Duties

  The AI Developer / AI Integration Engineer will be
  responsible for designing, building, and deploying AI-
  powered solutions across the company. This role bridges
  modern artificial intelligence capabilities with existing
  technology platforms — driving operational efficiency,
  enabling smarter workflows, and shaping how AI is applied
  across the organization. The ideal candidate is AI-native, a
  solid developer, and a systems thinker.

  Will include but not limited to:

  - Design and deploy AI-powered workflows and automation across
    internal systems
  - Integrate LLM APIs (OpenAI, Anthropic, etc.) into
    operational platforms and internal tooling, with examples
    including:
  - Build and maintain custom AI agents, automation pipelines,
    and retrieval-augmented generation (RAG) systems
  - Own the bridge between AI capabilities and the existing
    technology stack
  - Evaluate and prototype emerging AI tools for business
    relevance and operational fit
  - Collaborate with operations, sales, and leadership teams to
    identify and prioritize AI opportunities
  - Contribute to platform development features and maintain
    clean, well-documented code
  - Translate AI capabilities for non-technical stakeholders and
    gather real requirements from business teams
  - Maintain a running roadmap of AI enhancements tied to
    business goals and project timelines
  - Consistently exemplify established best practices, serving
    as the internal subject matter expert on applied AI

  Additional Responsibilities:

  - Provide team or company-wide AI training and education where
    applicable.
  - Create & manage technical documentation for all AI systems,
    integrations, and workflows.

  Qualifications & Requirements

  - AI-Native Mindset: Deep familiarity with LLMs, prompt
    engineering, agents, tool use, and AI orchestration
    frameworks (LangChain, LlamaIndex, CrewAI, etc.)
  - Solid Development Foundation: Proficiency in Python and/or
    JavaScript. Comfortable building APIs, working with
    databases, and deploying to cloud environments as well as
    front end experience. Node JS, React.
  - Integration Experience: Track record connecting disparate
    systems via APIs, webhooks, or middleware. Experience with
    Airtable, Zapier, Make, or similar platforms is a plus
  - Platform Sensibility: Understands how internal tools and
    operational platforms are built and scaled. Can contribute
    to product thinking, not just feature execution
  - Cross-Functional Communicator: Can translate AI concepts for
    non-technical stakeholders and gather real requirements
    from business teams

  Measurables

  The Employee’s performance will be measured and evaluated on
  meeting project deadlines, goals and objectives, quality and
  adoption of AI solutions delivered, cross-functional
  collaboration, 1% for the Planet participation,
  communication, and feedback.

  Full Disclosure

  This position requires passion for the space and a personal
  philosophy, “do whatever it takes to get the job done.”

  The company is a national, natural food & beverage brokerage
  dedicated to an ethically valued business that positively
  impacts people, community, and the industry. The team is
  driven by the desire to transform the retail landscape while
  infusing passion, integrity, and transparency in all that
  they do. The company’s commitment is to build meaningful
  partnerships that will ultimately re-shape the future of
  foods available in the marketplace.

  The company is very proud of the reputation they have built
  in the industry and excited about their continued growth.
  They are happy to offer this position and excited for the
  opportunity to have the candidate as part of their awesome
  team!
