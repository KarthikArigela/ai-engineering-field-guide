description: |
  We Are

  Accenture Song accelerates growth and value for our clients
  through sustained customer relevance. Our capabilities span
  ideation to execution: growth, product and experience
  design; technology and experience platforms; creative, media
  and marketing strategy; and campaign, content and channel
  orchestration. With strong client relationships and deep
  industry expertise, we help our clients operate at the speed
  of life through the unlimited potential of imagination,
  technology and intelligence.

  Visit us at: https://www.accenture.com/gb-
  en/about/accenture-song-index

  The Data & AI Team

  The Data and AI revolution is changing everything. It's
  everywhere – transforming how we work and play. Join
  Accenture and help transform leading organisations and
  communities around the world. Accenture Data and AI is
  driving these exciting changes and bringing them to life
  across 40 industries in more than 120 countries.

  Accenture's Data and AI practice covers the range of Data
  and AI skills, from Strategy, Data Science, Data
  Architecture, AI Engineering and Visual Insights. When
  combined with Accenture's broader Strategy and Consulting
  practice, we are able to bring together the unique ability
  to drive end to end business change through the application
  of Data and AI.

  In the Data & AI Team You Will

  - Be at the forefront of the industry, creating and owning AI
    solutions that make a real impact for clients
  - Become an integral part of our Data & AI Song team with the
    credibility, expertise and insight clients depend on
  - Work with famous brands and household names
  - Drive and implement real world AI solutions into production
    that deliver measurable business value
  - Work alongside global teams to collaborate and deliver the
    best solutions for our clients
  - Build reusable AI assets and best practices that influence
    how consulting is delivered at scale

  As a Customer AI Developer Specialist, You Will

  Play a key part in delivering impactful Machine Learning
  (ML) and Generative AI solutions across a variety of
  industries. You will build and ship AI-powered products —
  from problem definition through to deployment and iteration
  — operating at the intersection of data science, technology,
  and business strategy.

  We Need Builders & Solution oriented people

  This role is for someone who sees a problem and
  instinctively starts building. Not waiting for perfect
  requirements. Building. We look for people who see the gap
  and can't help themselves — they're already sketching the
  solution.

  You thrive when a problem is messy and ill-defined. You know
  how to cut through complexity, run a quick experiment to
  test your assumptions, learn what is working, and iterate
  fast. You measure your success by what ships and the impact
  it creates — not by the elegance of your design document.

  You are energised by ambiguity, not paralysed by it. When a
  solution doesn't work, you debug it, rethink your approach,
  and try again. You leave things better than you found them —
  cleaner, faster, more scalable — because continuous
  improvement is how you naturally operate.

  Key Responsibilities

  Machine Learning & AI Development

  - Solve complex, real-world business challenges using advanced
    ML and Generative AI techniques
  - Design, build, and ship AI-powered tools, services, and
    experiments end-to-end
  - Implement and optimise agentic AI workflows, multi-step
    reasoning pipelines, and RAG architectures
  - Define strategies to embed, scale, and optimise ML models in
    production environments
  - Experiment rapidly with new approaches — test early, learn
    fast, improve continuously
  - Stay current with emerging AI research, tools, and
    techniques — and apply them before they become mainstream

  Product Mindset & Delivery

  - Break complex problems into simpler, testable, scalable
    components
  - Take full ownership — from idea to deployed solution —
    without waiting to be told what to do next
  - Balance speed of experimentation with robustness, security,
    and maintainability
  - Document patterns and best practices to enable reuse and
    scaling across the practice
  - Operate confidently in ambiguity — define the path forward
    when requirements are unclear

  Business Impact & Collaboration

  - Translate business problems into AI solutions with clear,
    measurable value
  - Communicate technical concepts clearly to senior client
    leadership and non-technical stakeholders
  - Contribute to capability building and knowledge sharing
    across the Data & AI practice

  What You Will Bring

  Required — Technical Skills

  - Advanced Python — writing clean, production-grade code, not
    just scripts (OOP, async, packaging, testing)
  - Generative AI & LLM development — prompt engineering, fine-
    tuning, RAG pipelines, context window management
  - Agentic AI frameworks — LangChain, LangGraph, AutoGen, or
    similar; building multi-step autonomous workflows
  - Machine Learning — model development, training, evaluation,
    and deployment
  - APIs & backend development — FastAPI, REST APIs,
    microservices architecture
  - Vector databases & embeddings
  - Cloud platforms — Azure GCP, or AWS; deploying and managing
    AI/ML workloads at scale
  - Version control & MLOps — Git, CI/CD pipelines, model
    versioning, monitoring in production
  - Data handling

  Required — Experience & Mindset

  - Demonstrated end-to-end delivery: problem → build → deployed
    solution → iteration
  - Strong experience with Generative AI in production — not
    just experimentation
  - A track record of building working solutions, not just
    prototypes or proofs of concept
  - Hands-on experience with LLM tooling (Claude, GPT-4, Gemini,
    or equivalent)
  - Strong analytical and problem-solving skills — you debug
    fast and think in systems
  - Comfortable working with messy, incomplete requirements and
    driving clarity through action
  - English fluency and comfort working in global, cross-
    functional teams

  Preferred

  - Experience with NLP, computer vision, or multimodal AI
    models
  - Knowledge of AI safety, guardrails, and responsible AI
    practices in production
  - Familiarity with Snowflake, Databricks, or similar data
    platforms
  - Prior experience acting as an AI champion or innovator
    within a larger organisation
  - Consulting or client-facing delivery experience
  - Bachelor or Master degree in Computer Science, Data Science,
    Engineering, or related field

  Key Competencies

  - Solution oriented mentality — sees a problem, starts
    building, ships, improves
  - Experimental mindset — runs fast tests, learns from failure,
    iterates without ego
  - Strong execution and delivery orientation
  - Advanced AI engineering and Generative AI expertise
  - Collaborative team player
  - Curiosity and commitment to continuous learning

  What's in it for You

  Our Total Rewards consist of a competitive basic salary,
  annual performance bonus, opportunities to acquire equity
  and a wide range of health and wellbeing benefits. These
  include:

  - 25 days of leave per year plus 3 extra volunteering days for
    charitable work of your choice
  - Family-friendly and flexible work policies
  - Attractive pension plan with financial wellbeing support and
    resources
  - Private healthcare insurance plan and Mental Wellbeing
    support
  - Employee Assistance Programme, Career Development and
    Counselling
  - A range of generous Parental Leave offerings

