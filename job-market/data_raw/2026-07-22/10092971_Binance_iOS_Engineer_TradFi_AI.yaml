description: |
  Binance is a leading global blockchain ecosystem behind the
  world’s largest cryptocurrency exchange by trading volume
  and registered users. We are trusted by 300+ million people
  in 100+ countries for our industry-leading security, user
  fund transparency, trading engine speed, deep liquidity, and
  an unmatched portfolio of digital-asset products. Binance
  offerings range from trading and finance to education,
  research, payments, institutional services, Web3 features,
  and more. We leverage the power of digital assets and
  blockchain to build an inclusive financial ecosystem to
  advance the freedom of money and improve financial access
  for people around the world.

  About the role:

  You'll join one of the largest feature team on the Binance,
  responsible for the modules that millions of users interact
  with daily. The team owns the core user-facing experience —
  from home feed and markets discovery, to account and
  identity, and the platform's server-driven UI framework.
  Given the breadth of ownership, you will work across teams
  and collaborate closely with engineers from infrastructure,
  finance, payments, fiat, and other feature teams on a daily
  basis. You will build and maintain production-scale Swift
  features across many modules, shipping to one of the most
  downloaded finance apps worldwide.

