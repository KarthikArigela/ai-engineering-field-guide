description: |
  About Abound

  We’re redefining consumer lending in the UK, and beyond.
  Using advanced AI and Open Banking data, we make fair,
  affordable personal finance available to more people. While
  traditional lenders rely almost entirely on credit scores,
  we look at the full financial picture - how much you spend,
  and what you can afford to repay to build a deeper, more
  accurate understanding of each customer's unique financial
  situation.

  And we've shown it works at scale. We’ve issued over £1.3bn
  in loans directly to customers while delivering market-
  leading credit performance - for every 10 defaults the
  industry expects, we see only 3. We also reached
  profitability just 2.5 years after launch.

  Backed by £2bn+ of funding from top-tier investors including
  Citi, GSR Ventures, and Deutsche Bank, we’re recognised as
  one of Europe’s fastest-growing fintechs (Sifted, CNBC).
  Now, we’re expanding into new markets and product lines -
  and we’re looking for ambitious people who want to learn
  fast, take ownership, and grow with us.

  Your Graduate Scheme (AI Engineering Route)

  - There will be opportunities to work on projects ranging from
    our core AI-powered customer operations to new agentic
    workflows and automation products that we're just getting
    off the ground
  - You'll work cross-functionally with our UK and Shenzhen
    engineering teams, as well as risk, compliance, and
    customer operations teams
  - You'll start shipping code from week one, and learn by doing
  - You will join our AI Engineering team and might be
    contributing by
    - Building Generative AI and AI agent solutions for customer
      operations, internal automation, and lending operations
    - Designing prompts, workflows, and evaluation processes to
      make AI systems more reliable and useful
    - Integrating LLMs with internal tools, APIs, databases, and
      business systems
    - Writing clean, scalable, and maintainable Python code for
      real production use cases
  - Mentorship Program: pair with senior engineers throughout
    the scheme
  - Bi-annual technical reviews and career progression planning
  - Real Impact: See your AI systems go live and directly
    improve customer operations, risk workflows, and lending
    decisions for thousands of customers

  Who You Are

  - You believe that learning is the most important thing to
    optimise for as you start your career, and want to learn
    by doing at the fastest growing fintech in London
  - You like using AI to solve complex, real-world problems, not
    just build demos
  - You thrive when given ownership, and autonomy
  - You also want to learn about the commercial impact of any
    technical changes you make
  - A recent (or soon-to-be) graduate with a degree in a
    technical or quantitative field (e.g. Computer Science,
    AI/Machine Learning, Statistics, Engineering or
    Mathematics - STEM field)
  - Programming: Proficiency in Python or similar languages or a
    good understanding of computer science and eagerness to
    learn and perform in Python based technologies.
  - Understanding and genuine interest in Generative AI
    concepts, including LLMs, embeddings, RAG, prompt
    engineering, structured outputs, and model limitations

  Why Join Us

  - Learn from experienced AI Engineers, and product leaders in
    a flat, fast-paced team
  - A chance to shape the future of credit using the latest
    Generative AI and agentic technologies
  - A collaborative, diverse, flexible culture that values
    growth, ownership, and keeping our customers first in all
    of our engineering
  - Position yourself at the forefront of the AI and financial
    services revolution
  - Exceptional promotion opportunities from rapid company
    growth

  What We Offer

  - Hybrid with 3 days a week in the office
  - 25 days' holiday a year, plus 8 bank holidays
  - 2 paid volunteering days per year
  - One month paid sabbatical after 4 years
  - Free gym membership
  - Team wellness budget to be active together - set up a yoga
    class, a tennis lesson or go bouldering

  The Interview Process:

  - Take Home Test (20-30 mins)
  - Remote (video call) Technical Interview (1 hour)
  - In-person interview day where you'll meet 3-4 people across
    Engineering and Senior Leadership (1.5 hours)

  Scheme details:

  - Our graduate scheme runs for one year, with the opportunity
    to convert to a permanent role based on performance
  - Start date: Late September – Early October 2026 (TBC)

  Please note: we are unable to offer visa sponsorship for
  this role.
