description: |
  Luxury Presence is building the AI growth platform for real
  estate. Backed by Bessemer Venture Partners and other top
  investors, we're a Series C company that has hit $100M in
  annual recurring revenue. More than 90,000 real estate
  professionals, including over 30% of the WSJ Real Trends top
  100 agents in the United States, use us to run and grow
  their business.

  The Opportunity

  We don't just use AI. We build with it, ship with it, and
  think with it. We're in the top 1% of companies applying AI
  effectively, not just to our products, but to how we build
  them. With an unlimited budget for Anthropic tokens, our
  engineers use AI agents to write, review, and ship
  production code every day. We're building toward a world
  where humans design systems and AI builds them, and we're
  already further along that path than almost anyone else.

  As a Staff Software Engineer, you'll be a technical leader
  at the center of this transformation. You'll shape platform
  architecture, drive AI-powered product delivery, and raise
  the bar for what a small, AI-augmented engineering team can
  accomplish. This is a role for someone who already lives in
  their terminal with AI, who has strong opinions about how AI
  changes system design, and who wants to help define what a
  next-generation engineering organization looks like.

  What You'll Do

  Drive large-scale technical initiatives. You'll take
  complex, cross-functional projects from concept through
  production, aligning architecture decisions with business
  goals and shipping outcomes that matter.

  Ship AI-native product experiences. Working closely with
  product, design, and AI teams, you'll deliver intelligent
  features that leverage LLMs, agent frameworks, and real-time
  data to transform how real estate professionals run their
  businesses.

  Lead system design in an AI-native codebase. You'll own the
  architecture of critical platform capabilities, from our AI-
  powered site builder pipeline to our multi-tenant
  infrastructure serving thousands of real estate businesses.
  You'll set patterns that other engineers follow.

  Define how we build, not just what we build. You'll shape
  our engineering standards, review practices, and developer
  tooling. You'll have a direct hand in evolving how AI agents
  integrate into our development workflow.

  Mentor and elevate engineers across the org. Staff Engineers
  at LP are force multipliers. You'll raise the technical bar
  across teams, coach engineers through hard design problems,
  and influence career growth.

   What We're Looking ForAttributes

  - You already build with AI daily. You use Claude Code as a
    core part of your workflow, not as a novelty
  - You have strong opinions, loosely held, about how AI changes
    software architecture, team structure, and engineering
    culture
  - You think in systems. You connect technical decisions to
    customer outcomes and long-term business value
  - You communicate clearly and directly. You can explain
    complex tradeoffs to product, design, and executive
    stakeholders
  - You're energized by ambiguity and speed. You thrive in a
    fast-growing company where the roadmap evolves and
    ownership is real
  - You like to have fun at work. We take our craft seriously,
    but we don't take ourselves too seriously. We celebrate
    wins, crack jokes, and genuinely enjoy building together

  Skills and Experience

  - 8+ years of professional software engineering experience,
    with meaningful time in senior or staff-level roles
  - Deep expertise in TypeScript, Node.js, and React
  - Experience designing and operating scalable microservice
    architectures in cloud-native environments (AWS preferred)
  - Strong understanding of GraphQL, event-driven systems
    (Kafka, SQS), and distributed databases (PostgreSQL,
    DynamoDB, Elasticsearch)
  - Proven track record leading high-impact initiatives from
    concept through production in a SaaS environment
  - Expert-level grasp of software design principles and
    experience with multi-tenant platform architectures

  Tech Stack

  - Frontend: React, Tailwind, Apollo
  - Backend: Node/TypeScript Microservices
  - Data: Postgres, Redis, Elasticsearch
  - Infrastructure: AWS, Kubernetes, Lambda, Temporal
  - Messaging: Kafka, SQS

  Join us in shaping the future of real estate



  The real estate industry is in the midst of a seismic shift,
  and the future belongs to those who break new ground. As one
  of the fastest-growing companies in the proptech and
  marketing sectors, Luxury Presence challenges the status quo
  of what technology can do for real estate agents, leaders,
  and brokerages.



  We're a team of agile and tenacious innovators working
  collaboratively to drive the industry forward. Together, we
  build game-changing products that empower modern real estate
  entrepreneurs to dominate their markets. From award-winning
  web design to agile SEO solutions to cutting-edge AI tools,
  we deliver tech that anticipates market shifts and keeps our
  clients ahead of their competition.



  Founded in 2016 by Stanford Business School alum Malte
  Kramer, Luxury Presence has grown to a global team ranked on
  the Inc. 5000 fastest-growing companies list three years in
  a row. We're backed by world-class investors, including
  Bessemer Venture Partners, NextEquity Partners, Toba
  Capital, and Switch Ventures, and have raised $89 million to
  date.



  More than 18,000 real estate businesses rely on our
  platform, including 30% of the Wall Street Journal
  RealTrends top agents and teams. Additionally, many of the
  industry's most powerful brokerages rely on Luxury Presence
  as a trusted business partner.



  Every year since 2020, Luxury Presence has ranked on
  BuiltIn's Best Place to Work lists. HousingWire named our
  founder and CEO a 2024 Tech Trendsetter, we've received
  several Tech100 Awards, and we just scored an Inman
  Innovation Award for Best AI-Powered Platform.



  Luxury Presence is an Equal Opportunity Employer. All
  qualified applicants will receive consideration for
  employment without regard to race, color, religion, sex,
  sexual orientation, gender identity, or national origin.
