description: |
  Company Description

  You’ll join as an AI (Platform) Engineer in the young,
  enthusiastic Data Science Lab team within the AI Excellence
  Center of 30+ highly skilled and energetic colleagues. As
  part of the AI community, you’ll work closely with various
  specialists, including business stakeholders, domain
  experts, data engineers, software engineers, mathematicians,
  and data scientists. In our team, we work together to
  explore, develop, and use the newest GenAI technologies.
  Together, we drive KPN toward becoming a truly AI-driven
  organization.

  Ready to take your career to the next level?

  Job Description

  In this role, you’re the driving force behind developing
  reusable building blocks for the whole company to build
  their GenAI use cases. You’ll leverage the Azure cloud
  technology stack and cutting-edge tools to design and
  implement solutions that are scalable, reliable, secure, and
  production ready. Your key focus will be on:

  - Developing and maintaining our central GenAI Gateway (LLM
    Gateway) on Azure, integrating both OpenAI and non-OpenAI
    models (Anthropic, Mistral, Llama, etc.)
  - Managing the complete lifecycle of LLM deployed models.
  - Implementing CI/CD pipelines using Azure DevOps for
    automated deployments and testing.
  - Defining priorities and influencing the GenAI Lab roadmap.
  - Operationalizing and integrating AI capabilities into
    business processes, IT systems, and data platforms.
  - Collaborating continuously with team members, domain
    experts, and business stakeholders to refine and implement
    the most effective solutions.

  Qualifications

  You’re a hands-on engineer who thrives in cloud-native
  environments and is passionate about GenAI technologies.
  You’re analytically strong, carry a strong sense of
  responsibility, and excel at bridging the gap between
  technical and non-technical stakeholders. You’re eager to
  learn, adaptable, and enjoy working in a fast-paced,
  innovative environment.

  To be successful in this role, you bring:

  - At least 5 years of experience as an AI/ML Engineer, Cloud
    Engineer, or similar role
  - Master’s degree in a quantitative domain, such as Computer
    Science, Software Engineering, Data Science, or related
    field
  - Strong proficiency in Python for developing GenAI
    applications and automation
  - Solid experience with Azure cloud services.
  - Expertise in Infrastructure-as-Code (Terraform, Bicep, or
    ARM templates)
  - Experience building production-grade GenAI applications.
  - Knowledge of vector databases (Azure AI Search)
  - Experience with containerization and orchestration (Docker,
    Kubernetes/AKS)
  - Deep knowledge of Azure DevOps for CI/CD pipelines, version
    control, and release management
  - Excellent understanding of software engineering best
    practices including coding standards, code reviews,
    testing, security, and observability

  Nice to have to be a success in this role:

  - Hands-on experience deploying and managing multiple LLM
    providers (OpenAI, Anthropic Claude, Azure OpenAI, open-
    source models)
  - Experience with LLM Gateway patterns and API management at
    scale
  - Familiarity with API design patterns (REST, streaming,
    WebSocket’s) and asynchronous processing (message queues,
    event-driven architectures)
  - Understanding of AI governance, monitoring, and
    observability tools (e.g. Azure Monitor, Application
    Insights, Dataiku, LangSmith, or Openlayer)
  - Working knowledge of LangChain and other GenAI orchestration
    frameworks
  - Knowledge of semantic caching and optimization techniques
    for LLM applications
  - Experience with authentication and authorization patterns
    (OAuth2, API keys, Azure AD)

  Additional Information

  As an employer, we have a lot to offer you. Here’s what you
  get from us:

  - A gross monthly salary starting from € 5.190 to a maximum of
    € 7.803, depending on your work experience, based on a
    40-hour workweek.
  - A guaranteed 13th-month salary: part of it is paid out
    monthly, and part in January of the following year. Or you
    can allocate it towards a FLEX & BOOST goal of your
    choice! Click here to learn more.
  - Annual individual and collective salary increases according
    to our collective labor agreement (CAO).
  - € 1,500 per year in a personal development budget that you
    can use at your discretion for training, coaching, or
    courses.
  - Flexible leave days: our employees can (in consultation with
    their manager) decide how they want to handle their leave.
  - A healthy work-life balance, with 2 days in the office and 3
    days working from home, transition leave, and the option
    to swap holidays for ones that align with your religious
    or cultural preferences.
  - A home office setup workshop to optimize your remote
    workspace, including a mobile phone and laptop.
  - 50% discount on our products and services, so you can enjoy
    affordable internet, calls, and streaming.
  - Excellent travel reimbursement: full coverage for public
    transport or € 0.23 per kilometer if you travel by car.
    Prefer cycling? You can receive € 0.40 per kilometer.
  - The option to purchase a lease bike co-funded by KPN (with a
    permanent contract): whether it’s a city bike, e-bike,
    racing bike, or speed pedelec, you get to choose.
  - Outstanding pension benefits: a total contribution of 23% of
    your pensionable salary, with KPN contributing 16% and you
    contributing 7%.

  Would you like to learn more? Feel free to contact our
  recruiters Adumobia Rogers via E-mail at adumobia.rogers-
  noteboom@kpn.com

  At KPN, we have recruitment talent that collaborates smartly
  and wins together. Unsolicited acquisition regarding this
  vacancy is not appreciated.
