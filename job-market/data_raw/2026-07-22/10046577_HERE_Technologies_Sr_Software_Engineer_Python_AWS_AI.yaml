description: |
  What's the role? As a Senior Software Engineer, you will
  design and build scalable systems that power quality
  validation, KPI reporting, and large-scale data processing
  across HERE's ecosystem. You will work closely with cross-
  functional teams to deliver high-performance solutions that
  enhance product quality insights. You will

  - Design and develop scalable software solutions for quality
    validation and data processing
  - Build and maintain robust data engineering pipelines and
    infrastructure
  - Develop modern full-stack applications and data
    visualizations to enable ainsights
  - Automate statistical analysis and integrate AI-driven
    capabilities into workflows
  - Translate business and customer requirements into technical
    solutions
  - Collaborate within Agile teams, contributing to planning,
    development, and delivery
  - Conduct code reviews and promote engineering best practices
    and code quality
  - Support CI/CD processes and continuous improvement of
    development workflows

  Who are you? You are a problem-solver who enjoys working
  with data, building scalable systems, and collaborating
  across teams. You bring strong technical expertise along
  with a learning mindset and attention to detail. To be
  successful in this role, you bring:

  - A degree in Computer Science, Data Science, or a related
    field, along with relevant professional experience in data
    or software engineering
  - Experience working in Agile development environments
  - Hands-on experience building AI-powered applications,
    including technologies such as RAG, AI agents, semantic
    search, or LLM integrations
  - Experience using AI-assisted development tools such as
    GitHub Copilot, ChatGPT, or similar platforms
  - Strong programming skills in languages such as Python, AWS
  - Experience developing full-stack web applications with
    scalable architectures
  - Familiarity with integrating AI-driven capabilities such as
    intelligent search, recommendations, or conversational
    interfaces into applications
  - Experience working with version control systems and CI/CD
    pipelines
  - Knowledge of cloud platforms such as AWS or similar
    environments
  - A solid foundation in data structures, object-oriented
    programming, and SQL
  - Strong analytical thinking, problem-solving, and
    communication skills
  - The ability to manage priorities, collaborate effectively,
    and contribute to a team-focused environment

  What we offer  HERE offers an opportunity to work in a
  cutting-edge technology environment with challenging
  problems to solve! You can make a direct impact on delivery
  of company's strategic goals and the freedom to decide how
  to perform your work. We will support you in delivering your
  day-to-day tasks and achieving your personal goals and
  developing your skills. Personal development is highly
  encouraged at HERE. You can take different courses and
  training at our online Learning Campus and join cross-
  functional team projects within our Talent Platform. HERE is
  an equal opportunity employer. We evaluate qualified
  applicants without regard to race, color, age, gender
  identity, sexual orientation, marital status, parental
  status, religion, sex, national origin, disability, veteran
  status, and other legally protected characteristics. Who are
  we? HERE Technologies is a location data and technology
  platform company. We empower our customers to achieve better
  outcomes - from helping a city manage its infrastructure or
  a business optimize its assets to guiding drivers to their
  destination safely. At HERE we take it upon ourselves to be
  the change we wish to see. We create solutions that fuel
  innovation, provide opportunity and foster inclusion to
  improve people's lives. If you are inspired by an open world
  and driven to create positive change, join us. Learn more
  about us on our YouTube Channel. As a Sr Software Engineer
  within HERE, the Product Quality Engineering (PQE) who will
  play a critical role in ensuring the quality and reliability
  of our map content, location services, and platform
  offerings. The team focuses on building scalable systems,
  data pipelines, and analytical tools that enable end-to-end
  quality validation and actionable insights for internal
  stakeholders and global customers, including leading
  automotive partners.
