  AI Fullstack Developer

  Gurgaon, India

  About the Role

  Anaplan is looking for a versatile and experienced Fullstack
  Developer to build and own end-to-end features on our
  industry-leading platform. This is a deeply hands-on role
  for a talented engineer who is passionate about working
  across the entire technology stack, from crafting intuitive
  user interfaces with React to building robust backend
  services with Node.js. You will be a key individual
  contributor, responsible for the design, implementation, and
  delivery of complete, scalable solutions that power the
  Anaplan experience.

  Key Responsibilities

  - Actively write clean, maintainable, and high-quality code
    for both the front-end (React, TypeScript) and back-end
    (Python, Nodejs).
  - Build responsive, accessible UI for AI‑assisted user
    journeys in React, TypeScript, state management(redux),
    component libraries, and testing.
  - Develop APIs, services, and workers to support AI features
    using Node.js and TypeScript or Python (FastAPI),
    REST/GraphQL.
  - Build and maintain scalable backend services, APIs, and data
    models.
  - Develop responsive and performant user interfaces using
    modern front-end technologies.
  - Collaborate closely with product managers, designers, and
    other engineers to define and implement solutions.
  - Participate actively in code reviews across the stack,
    providing and receiving constructive feedback to ensure
    quality and consistency.
  - Mentor other developers on full-stack best practices and
    help elevate the team’s technical capabilities.

  Required Qualifications

  - 8+ years of software engineering experience with 2+ years
    focused on ML/AI systems
  - Front-End Expertise:
  - Strong, hands-on professional experience building complex
    web applications with React.
  - Deep proficiency in JavaScript (ES6+) and TypeScript.
  - Solid experience with state management libraries like Redux,
    Zustand, or Recoil.
  - Expertise with testing frameworks such as Vite and React
    Testing Library.
  - Back-End Expertise
  - Strong professional experience in server-side development
    using Python.
  - Experience building and consuming RESTful APIs or GraphQL.
  - Proficiency with databases, both SQL (e.g., PostgreSQL,
    MySQL) and NoSQL databases
  - Experience with ORMs like Prisma, TypeORM, or Sequelize.
  - A true passion for full-stack development and a desire to
    remain deeply involved in coding.
  - Experience shipping production Generative AI application.
  - Hands‑on with LLM APIs and embeddings, prompt engineering,
    and evaluation methodologies.
  - Practical knowledge of data modeling, relational databases,
    and vector databases.
  - Expertise in testing (unit/integration/e2e), CI/CD, and
    cloud deployment (AWS, GCP, or Azure) with infrastructure
    basics (containers; IaC is a plus).
  - Excellent problem-solving skills and the ability to work
    independently.

  Preferred Qualifications

  - Bachelor’s degree in Computer Science, Engineering, or a
    related technical field.
  - Experience with containerization (Docker) and orchestration
    (Kubernetes).
  - Familiarity with CI/CD pipelines and infrastructure-as-code
    (e.g., Jenkins , Terraform).
  - Experience in a SaaS or enterprise software environment.
  - Knowledge of microservices architecture.

  What Makes This Role Exciting

  This is a role for a true builder who enjoys working across
  the technology landscape. You will have the unique
  opportunity to own features from concept to deployment,
  making a direct and tangible impact on a product used by
  major global enterprises. You will tackle diverse
  challenges, from optimizing database queries to fine-tuning
  UI performance, while working with a talented team in a
  collaborative environment. If you thrive on end-to-end
  ownership and love to code, this is the perfect opportunity
  to grow your skills and see your work come to life.

