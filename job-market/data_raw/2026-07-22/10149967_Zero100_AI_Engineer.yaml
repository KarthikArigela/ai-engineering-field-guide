description: |
  What we do:

  Zero100 is a membership-based intelligence company that
  connects, informs, and inspires the world's most influential
  C-Level Operations & Supply Chain Officers – and their teams
  – to unlock the true potential of the AI and Digital
  Revolution.

  Our members use Zero100's research, advisory services, data,
  and peer community to sharpen strategy, challenge
  assumptions, and accelerate progress on their most important
  transformation priorities from AI adoption and digitization
  to resilience and decarbonization.

  With a rapidly expanding headquarters in central London,
  Zero100's members include Nike, Walmart, Unilever, Pfizer,
  Google, Honeywell, and General Motors.

  Recent recognition:

  - 2026 King's Award for Enterprise in International Trade
  - The Sunday Times Best Places to Work 2026
  - The Sunday Times 100 (#43), 2025
  - LinkedIn Top 25 Start-Ups (#12), 2025

  What you will do:

  Note that this is a primarily office-based role (~4 days per
  week).

  As an AI Engineer at Zero100, you will support the
  development of AI, data and agentic systems used by our
  research, product, and member-facing teams.

  This role is ideal for someone who wants to build practical
  experience with production AI systems. You will work closely
  with senior engineers to implement features, improve data
  pipelines, support retrieval workflows, test AI outputs, and
  help turn prototypes into reliable internal tools and
  product capabilities.

  You will be hands-on with Python, SQL, cloud platforms, data
  processing, and LLM-based workflows and you will be expected
  to take ownership of well-defined technical tasks, support
  production systems, debug issues, document your work, and
  collaborate with non-technical teams to turn practical
  business needs into working solutions.

  Responsibilities:

  - Implement well-defined AI, data, and backend engineering
    tasks under guidance from senior engineers.
  - Build and maintain smaller components of RAG pipelines,
    agent workflows, data pipelines, and internal AI tools.
  - Write clean Python and SQL code for data processing, API
    integrations, model workflows, and automation tasks.
  - Help prepare, clean, transform, and validate datasets used
    by research, product, and AI systems.
  - Support retrieval workflows by improving chunking, metadata
    tagging, embeddings, search quality, and evaluation
    datasets.
  - Assist with testing and evaluating AI outputs, including
    prompt tests, regression checks, and basic quality
    measurements.
  - Conduct exploratory prototyping of new AI/ML approaches and
    evaluate emerging models, frameworks, and techniques
  - Work closely with research, product, and member-facing teams
    to understand data requirements and deliver clean,
    reusable data products
  - Learn and apply engineering best practices around version
    control, testing, CI/CD, data governance, and maintainable
    code.
  - Contribute to engineering standards, documentation, and
    processes as the team scales

  Requirements

  - 2–3 years of experience in software, data, ML, or AI
    engineering roles, ideally in startup or high-growth
    environments, with examples of work you have taken through
    to production
  - Strong Python and SQL skills, with experience building
    software deployed in production cloud environments
  - Experience implementing or building applications using LLMs,
    AI APIs, or open-source language models
  - Working knowledge of cloud platforms such as AWS or Google
    Cloud
  - Familiarity with modern software development practices,
    including version control, testing, code review,
    containerization, CI/CD, and API development
  - Bachelor's degree in Computer Science, Software Engineering,
    Artificial Intelligence, Data Science, Mathematics,
    Engineering, or a related technical discipline, or
    equivalent industry experience demonstrating strong
    software engineering fundamentals
  - Master's degree in Data Science, Data Engineering,
    Artificial Intelligence, or a related technical discipline
  - Strong communication skills and ability to work with
    technical and non-technical stakeholders to understand
    needs and explain complex ideas clearly
  - Eligible to work in the UK
  - Able to work 4 days per week on-site
  - A genuine interest in agentic AI systems and emerging LLM-
    based architectures and frameworks such as LangGraph
  - Comfortable with ambiguity and excited to learn quickly,
    take ownership, and grow with the team as we scale
  - Knowledge of supply chain and operations contexts is a plus.
  - Experience working cross-functionally with research teams,
    product teams, or member-facing commercial teams is a
    plus.

  Benefits

  Benefits:

  - Unlimited holidays
  - Private healthcare & Life Insurance
  - Enhanced pension
  - Enhanced Parental Leave Policy
  - Custom designed offices with free breakfasts & snacks

  Zero100 is an Equal Opportunity-Affirmative Action Employer,
  welcoming applications from individuals of all backgrounds.
  We embrace diversity and inclusion in our workplace.
