description: |
  About Huzzle

  At Huzzle, we connect high-performing professionals with
  global companies across the UK, US, Canada, Europe, and
  Australia. Our clients include startups, digital agencies,
  and tech platforms in industries like SaaS, MarTech,
  FinTech, and EdTech. We match top talent to full-time remote
  roles where they’re hired directly into client teams and
  provided ongoing support by Huzzle.

  Role Type: Full-time

  Engagement: Independent Contractor

  Job Summary

  We are hiring a highly skilled AI Automation Engineer to
  design, build, and optimize intelligent workflows and
  automation systems. This role is ideal for someone
  experienced in integrating AI tools (such as LLMs and APIs)
  into business processes, with a strong focus on operational
  efficiency and scalability.

  This is a remote AI engineering role offering the
  opportunity to work on cutting-edge automation projects in a
  fast-paced, high-growth environment.

  Key Responsibilities

  - Design and implement AI-driven automation workflows using
    tools like Zapier, Make (Integromat), and custom APIs
  - Integrate large language models (LLMs) such as OpenAI,
    Claude, or similar into business processes
  - Build and maintain automation pipelines for sales,
    marketing, and customer support functions
  - Develop scripts and backend logic (Python, JavaScript) to
    support scalable automation
  - Optimize workflows for performance, reliability, and cost-
    efficiency
  - Collaborate with cross-functional teams to identify
    automation opportunities
  - Monitor and troubleshoot automation systems to ensure smooth
    operation
  - Document processes and create scalable SOPs for internal use

  Requirements

  - 2+ years of experience in automation engineering, AI
    integration, or workflow automation
  - Strong experience with automation platforms (Zapier, Make,
    n8n, or similar)
  - Hands-on experience with AI tools and APIs (e.g., OpenAI,
    Anthropic, Hugging Face)
  - Proficiency in Python and/or JavaScript
  - Experience with REST APIs, webhooks, and database
    integrations
  - Familiarity with CRM systems (e.g., HubSpot, Salesforce) is
    a plus
  - Strong problem-solving skills and ability to think in
    systems and processes
  - Excellent written and verbal communication skills
  - Experience working in remote, fast-paced environments

  Benefits

  💻 Fully Remote: Work from anywhere with international teams

  🚀 Career Growth: Join companies in SaaS, MarTech, and B2B
  services

  🤝 Peer Community: Connect with high-performing sales
  professionals in our network

  🧭 Ongoing Support: Receive guidance from Huzzle before and
  after placement

  💰 Tailored Compensation: Salaries vary by client and
  candidate preference — we’ll match you with options that fit
  your goals
