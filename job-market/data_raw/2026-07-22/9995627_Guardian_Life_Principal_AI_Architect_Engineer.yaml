  Please be aware that if you apply for a specific position
  with Guardian, you will have the choice of opting out of
  Guardian’s use of AI Tools during the job application
  process. If you would like to request an alternative process
  that does not utilize AI Tools or would like to request a
  reasonable accommodation, within ten business days of your
  position application, you must email your request to
  MyHR@glic.com, making sure to provide your name and job
  requisition identification number. Guardian will retain your
  applicant materials and resume and all information therefrom
  in accordance with Guardian’s document retention policy, a
  copy of which you may request via MyHR@glic.com.

  Additionally, at applicable times, Guardian will make public
  the most recent bias audit results for such AI tools, which
  may be found here.

  Current Guardian Colleagues: Please apply through the
  internal Jobs Hub in Workday.
