  materials and resumes relative to their indication that the
  applicant meets the requirements for the specific job for
  which they are applying, as specified in the listing posted
  on Guardian’s jobs website (Careers at Guardian at
  https://www.guardianlife.com/careers). At Guardian, we do
  not use AI Tools to substantially assist or replace human
  judgment or discretionary decision making in our hiring
  process. All hiring decisions will be made by Guardian
