  Job Description:

  Why Work with Us

  At Blueflame AI for Datasite, you will be part of a dynamic
  team that is at the forefront of AI technology in the
  investment management and dealmaking industry. You will have
  the opportunity to work with cutting-edge products and make
  a significant impact on our clients' success. Join us to be
  part of a company that values innovation, client
  satisfaction, and continuous improvement.

  Blueflame AI is hiring hybrid senior backend engineers with
  deep Python expertise (8+ years) and extensive experience
  designing production API's and distributed systems.

  Our engineers play a critical role in producing high-quality
  software solutions to support the Blueflame AI platform.
  This position requires close collaboration with our Client
  Success (Professional Services) and Product teams and other
  members of our Engineering team to develop and implement
  software components and ensure the reliability and
  performance of the platform. This role also contributes to
  system design and architectural decisions. The ideal
  candidate will be organized, energetic, and comfortable
  working in a fast-paced startup environment.

  This is a hybrid position in NYC with 3 days in office
  (Mondays, Wednesdays and Thursdays).

  Responsibilities

  - Design and implement server-side logic and functionality for
    the Blueflame AI platform, ensuring efficient data
    processing and management
  - Create, maintain, and optimize databases (MongoDB, Redis),
    ensuring data integrity and security
  - Develop and maintain RESTful APIs to enable communication
    between server and client-side applications, as well as
    with third-party services
  - Implement security measures to protect data and applications
    from unauthorized access and vulnerabilities
  - Contribute to system design and architectural decisions —
    evaluate tradeoffs and communicate technical direction
  - Review and approve pull requests; plan and scope
    deliverables against timelines
  - Optimize platform performance and identify and fix bugs
  - Collaborate with Product and Client Success on requirements
    and delivery
  - Write and maintain documentation for code, processes, and
    best practices

  Must have

  - 8+ years of professional software engineering experience
  - Expert-level Python
  - Extensive experience building production REST API's
  - Strong system design and architecture experience
  - Experience with distributed systems
  - MongoDB and Redis
  - Currently based in (or willing to relocate to) the NYC metro
    area
  - Able to work onsite in NYC three days per week

  Nice to Have

  - Experience with LLMs or applied AI
  - End-to-end SDLC ownership
  - Experience leading a team or coordinating across multiple
    stakeholders

