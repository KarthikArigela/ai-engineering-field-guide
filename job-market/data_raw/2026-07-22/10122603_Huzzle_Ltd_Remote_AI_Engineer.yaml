description: |
  About Huzzle

  At Huzzle, we connect exceptional talents with top
  opportunities at leading companies across the UK, US,
  Canada, Europe, and Australia. Our clients include startups,
  digital agencies, and tech platforms in industries such as
  SaaS, MarTech, FinTech, and AI.

  Unlike an outsourcing agency, we place you directly with a
  client where you’re hired in-house as a valued member of
  their team.

  Role Type: Full-time

  Engagement: Independent Contractor

  Job Summary

  We are seeking a skilled and innovative Remote AI Engineer
  with experience in machine learning, large language models
  (LLMs), and AI application development. You will work
  closely with product managers, software engineers, and data
  teams to design intelligent systems, develop AI-powered
  features, and improve model performance across various
  applications.

  This is an exciting opportunity for someone passionate about
  artificial intelligence, automation, and scalable software
  development.

  Key Responsibilities

  - Design, develop, and deploy AI and machine learning models
    for production environments.
  - Build AI-powered applications using LLMs such as GPT,
    Claude, Gemini, or open-source models.
  - Create and optimize prompt engineering workflows for
    generative AI applications.
  - Develop APIs and backend systems that integrate AI services
    into web and mobile applications.
  - Fine-tune models and improve inference performance, latency,
    and scalability.
  - Work with structured and unstructured datasets for model
    training and evaluation.
  - Collaborate with cross-functional teams to translate
    business needs into AI solutions.
  - Implement vector databases, embeddings, and retrieval-
    augmented generation (RAG) pipelines.
  - Monitor AI system performance and continuously improve
    reliability and accuracy.
  - Stay updated with the latest advancements in AI, machine
    learning, and automation technologies.

  Requirements

  - 3+ years of experience in software engineering, machine
    learning, or AI development.
  - Strong proficiency in Python and modern AI/ML frameworks
    such as PyTorch, TensorFlow, LangChain, or Hugging Face.
  - Experience working with OpenAI APIs, Anthropic, Gemini, or
    similar AI platforms.
  - Familiarity with LLMs, RAG architectures, vector databases,
    and prompt engineering.
  - Experience building REST APIs and scalable backend systems.
  - Knowledge of cloud platforms such as AWS, GCP, or Azure.
  - Understanding of CI/CD pipelines, Docker, and cloud
    deployment workflows.
  - Strong problem-solving and analytical thinking skills.
  - Excellent communication skills and ability to work
    independently in a remote environment.
  - Bachelor’s degree in Computer Science, Engineering, AI, Data
    Science, or related field preferred.
  - Experience deploying AI agents or autonomous workflows.
  - Familiarity with MLOps tools and AI monitoring systems.
  - Experience with Pinecone, Weaviate, FAISS, or ChromaDB.
  - Knowledge of frontend frameworks such as React or Next.js is
    a plus.
  - Previous experience in SaaS or startup environments.

  Benefits

  💰 Competitive salary based on experience and location

  🌎 Fully remote role with flexible work environment

  🚀 Work on cutting-edge AI automation projects with real
  business impact

  📈 Strong growth opportunity into senior AI / systems roles

  🧠 Exposure to LLMs, prompt engineering, and scalable AI
  system design

  🤝 Direct collaboration with a fast-moving, high-performance
  team
