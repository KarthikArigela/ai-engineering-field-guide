description: |
  Senior AI Software Engineer

  As you go about your daily life, do you often find yourself
  thinking “I bet I could automate that”? This might seem
  crazy, but… you’re not the only one.

  At Fixify, we believe that technology is more than clean
  code or fancy algorithms – it’s an opportunity to actually
  improve people’s lives. If you’ve ever locked yourself out
  before a big presentation, you’ll probably agree that an
  automated solution in the right moment can turn what would
  otherwise be a nightmare into an unforgettable moment of
  relief and gratitude. For us, there’s no greater joy than
  seeing the code we wrote save someone’s day. Our mission is
  simple – we want to deliver these day-saving moments, at
  scale. To that end, we’re in search of like-minded engineers
  to grow our team, allowing us to bring all kinds of useful
  automations to bear, solving real problems for users every
  day.

  As a Senior Software Engineer on our Automation team, you’ll
  work collaboratively with other engineers, data scientists,
  and subject matter experts to build and maintain Fixify’s
  automation capabilities. You’ll get hands-on, real world
  experience with bleeding edge tools and techniques,
  unlocking novel new solutions to historically difficult
  problems. Working hand-in-hand with data scientists, you
  will contribute to our AI architecture, helping us harness
  LLMs while ensuring our solutions are safe, reliable, and
  scalable. As a member of our product organization, you’ll be
  encouraged to be creative, and bring your own unique
  perspective and experiences to bear. Sure, you’ll build
  software… but you’ll also build relationships across our
  business, learning from different functions and
  perspectives. Most importantly, you’ll be connected directly
  to our customers, and the problems we aim to solve for them,
  allowing you to ship solutions that make a real difference.

  What we can do for you

  - Point you at interesting problems and equip you with the
    latest and greatest tools to solve them.
  - Provide you with work that influences organizations globally
    and makes a tangible difference in how people connect and
    collaborate.
  - Welcome you into a team that values every voice and learns
    from every challenge.
  - Share the “why” behind every decision so you learn from our
    collective journey.
  - Connect you with users for direct visibility into how people
    use the integrations and how your changes impact their
    day-to-day lives.

  What you can do for us

  - Utilize your expertise in Python and Typescript to
    contribute to both the back-end and front-end code bases
    of the platform.
  - Thrive knowing it’s an iterative experience and you’ll learn
    more from shipping then from reading all the docs.
  - Constantly strive to refine and improve the code you
    inherit, not only the code you create.
  - Approach challenges with a blend of technical skill and
    creative thinking.
  - Be a self-motivated professional who finds and fills gaps,
    embraces a growth mindset, and makes our culture even
    stronger.

  What you should bring with you

  - A track record of building and maintaining services in
    Python and Typescript.
  - Hands-on experience building with AI frameworks (Pydantic
    AI, Langchain).
  - At least 5 years of experience building scalable and
    observable SaaS solutions with one of the big three cloud
    platforms (AWS, GCP, Azure).
  - A practice of “kind engineering” that produces well
    documented, modular code that’s a delight for the next
    engineer that works on it.
  - A keen eye for detail – especially when reviewing pull
    requests.
  - A genuine interest in understanding user needs and
    translating them into technical solutions.
  - The ability to work cross-functionally and lift the team
    with your positive energy.
  - A curious nature and a drive to keep improving.

  Perks & benefits

  - Flexible work environment: 100% remote with flexible core
    working hours
  - Time to recharge: Unlimited PTO plus 12 paid federal
    holidays
  - Connectivity stipend: $150 monthly to support cell phone,
    internet, or equipment expenses
  - Retirement: Participation in our 401(k) program
  - Equity: Option grants to purchase shares through Fixify's
    equity program
  - Health insurance: Medical, dental, and vision coverage with
    100% of your deductible covered by Fixify
  - Parental leave: Paid parental leave for birth, adoption, or
    surrogacy
