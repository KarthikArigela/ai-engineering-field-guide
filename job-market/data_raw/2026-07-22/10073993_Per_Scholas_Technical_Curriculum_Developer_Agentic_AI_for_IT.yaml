description: |
  ABOUT PER SCHOLAS:

  For 30 years, Per Scholas has been on a mission to drive
  mobility and opportunity in the ever-advancing technology
  landscape by unlocking the untapped potential of
  individuals, uplifting communities, and meeting the needs of
  employers through rigorous tech training. By teaming up with
  dynamic employer partners, ranging from Fortune 500
  companies to innovative startups, we're forging inclusive
  tech talent pipelines, fulfilling an ever-increasing need
  for skilled talent. With national remote training and
  campuses in 20+ cities and counting, Per Scholas offers no-
  cost training programs in the most sought-after tech skills,
  spanning Cloud, Cybersecurity, Data Engineering, IT Support,
  Software Engineering, and more. To date, 30,000+ individuals
  have been trained through Per Scholas, propelling their
  professional trajectories into high-growth tech careers with
  salaries three times higher than their pre-training
  earnings. Learn more by visiting PerScholas.org and follow
  us on LinkedIn, X, Facebook, Instagram, and YouTube.

  Per Scholas preferred hires reside within the following
  states: AZ, CA, CO, FL, GA, IL, IN, KS, MD, MA, MI, MO, NC,
  NJ, NY, OH, PA, TX, WA

  DEPARTMENT: Curriculum Solutions

  POSITION TITLE: Technical Curriculum Developer (Agentic AI
  for IT Support and Data Analytics)

  LOCATION:  Remote, EST (5–10% travel for video production)

  REPORTS TO: VP, Product Development & Operations

  EMPLOYMENT TYPE: Temporary 3 months

  WHO WE’RE LOOKING FOR

  We are seeking a technically strong and instructionally
  minded Content Developer to design, develop, and deliver a
  high-impact on-camera workshop series on Agentic AI for IT
  Support and Data Analytics.

  This role is for a technical practitioner and educator -
  someone who understands real-world IT support and Data
  Analytics workflows and can translate them into structured,
  hands-on learning experiences using AI tools such as
  ChatGPT.

  You are not just a content writer; you are a builder and
  demonstrator who can apply AI tools to real IT and Data
  Analysis tasks, design practical learning experiences, and
  confidently deliver high-quality recorded instructional
  content.

  WHAT YOU’LL DO

  - Content Design & Development (30%)

  - Module Creation: Design and develop a multi-module learning
    series that applies AI across both IT Support tasks
    (documentation, customer interaction, troubleshooting,
    automation, and scripting) and Data Analytics tasks (data
    cleaning, exploratory analysis, querying, visualization,
    and reporting), sequenced so learners advance from GenAI
    prompting to lightweight agentic workflows.
  - Technical Documentation: Develop lesson plans, scripts,
    facilitation guides, and learner materials for both
    domains.
  - Scenario-Based Learning: Create real-world scenarios: IT
    support tickets, logs, and user issues, alongside Data
    Analytics cases such as messy datasets, business
    questions, and dashboard/reporting requests.
  - Curriculum Architecture: Translate IT Support and Data
    Analytics job tasks into structured, progressive learning
    modules aligned to entry-level roles.

  - On-Camera Instructional Delivery (30%)

  - Video Production: Script and record concise 5-8 minute
    instructional videos demonstrating real-time use of GenAI
    and, in later modules, agentic AI tools across both IT
    Support and Data Analytics.
  - Demonstration-Based Teaching: Show prompting techniques,
    iterative workflows, and validation methods, building
    toward agent/tool orchestration and multi-step automation.
  - Engagement & Clarity: Deliver clear, structured, and
    engaging content for asynchronous learners.

  - Hands-on Workshop Design (40%)

  - Workshop Development: Create 30-45-minute hands-on workshops
    aligned with each module across both tracks.
  - Task-Based Learning: Design activities using AI:
    troubleshooting, documentation, automation, and scripting
    (IT Support), and data cleaning, querying, analysis, and
    visualization (Data Analytics).
  - Assessment Design: Build performance-based exercises that
    validate learner competency in both domains.

  WHAT YOU’LL BRING TO US

  - Hands-on experience across IT Support and Data Analytics
    workflows.
  - Demonstrated ability to apply AI tools (e.g., ChatGPT) to
    real technical tasks.
  - Strong communication skills and comfortable demonstrating on
    camera.

  Required Skill Sets

  Technical Expertise

  - 2-5 years of combined experience across IT Support (Help
    Desk, Desktop Support, or Service Desk) and Data Analytics
    (analyst, reporting, or BI work).
  - Strong understanding of OS troubleshooting, networking
    basics, and ticketing workflows.
  - Data Analytics fundamentals: data cleaning, querying (SQL),
    spreadsheet analysis, and data visualization (e.g.,
    Excel/Google Sheets, and a BI tool such as Tableau or
    Power BI).
  - Experience applying AI tools like ChatGPT to documentation,
    troubleshooting, scripting, and data analysis tasks.
  - Familiarity with basic scripting (PowerShell, Bash, or
    Python); Python for data analysis (e.g., pandas) is a
    plus.
  - Exposure to agentic AI concepts such as tool use,
    automation, and multi-step agent workflows (e.g., custom
    GPTs, Copilot, or similar), or a clear willingness to
    build this into the curriculum.

  Instructional Design & Professional Skills

  - 1-3 years of experience in instructional design or technical
    content creation.
  - Strong ability to simplify technical workflows into
    structured learning.
  - Proficiency in Google Workspace.
  - Strong written and verbal communication skills.
  - Experience with training video series production.

  Preferred Skill Sets

  - Familiarity with LMS platforms (e.g., Canvas).
  - Experience in workforce training or bootcamp environments.
  - Hands-on experience building agentic AI workflows or
    automations (e.g., custom GPTs, Copilot Studio, n8n,
    Zapier, or similar).
  - Exposure to cloud platforms or DevOps concepts.
  - Access to video production equipment and software
    technologies.

  Personal Characteristics

  - You thrive in a creative, inventive, fast-paced startup
    environment with people who are passionate about their
    work and mission.
  - You are data-driven, result-oriented, and a forward-looking
    catalyst for social change.
  - You have a collaborative and flexible work style. You’re
    excited to work cross-functionally with other departments
    and independently.
  - You are a lifelong learner.
  - You are an effective communicator with strong oral and
    written skills.
  - You are tech-savvy and learn new tools quickly.
  - You are detail-oriented and have exceptional organizational
    skills.
  - You are adept at managing your time and balancing multiple
    projects and tasks.
  - You stand behind our mission, believing that individuals
    from any community should have access to well-paying
    career positions and that talent should be recognized and
    recruited from diverse sources.

  Compensation

  For this role specifically, we are targeting a salary range
  of $45 - $50 where the difference in salary is typically
  determined by several factors, including geography in which
  the selected candidate resides, and alignment with
  qualifications and experience.

  Benefits & Perks

  Per Scholas offers a comprehensive benefits package designed
  to support your health, financial well-being, and overall
  quality of life!

  Holidays & PTO: Full-Time Per Scholas team members enjoy
  over 40 days of paid time off each year through a mix of
  holidays, vacation, and sick/personal time! All employees
  are eligible for Holiday pay upon hire (a total of 22
  holidays annually, including a week off for Independence day
  and a week before the New Year). Full-Time Benefits Eligible
  employees also receive 80 Wellness Hours to use for Sick,
  Safe, or Personal reasons and accrue Vacation at a rate of 8
  hours at the beginning of every month, supporting rest,
  recharge, and work-life balance. Vacation accruals increase
  with tenure. Part-time employees are afforded time off on a
  prorated basis and in accordance with local requirements.

  Comprehensive Medical Coverage: Benefit eligible employees
  can choose from multiple medical plans through Cigna or
  Kaiser Permanente (where available), with options to fit
  your needs. Eligible employees also have access to a Health
  Reimbursement Account (HRA) that reimburses eligible out-of-
  pocket expenses, up to $4,000 for individuals and $8,000 for
  families.

  Dental and Vision Insurance: Eligible employees can select
  from two dental plan options and a vision plan. Employees
  who waive medical coverage receive employer paid dental and
  vision premiums.

  Retirement Savings: 401(k) plan with a current 100% employer
  match on contributions up to 6%, eligible employees are
  offered entry and full vesting after 90 days with the
  company.

  Employee Assistance Program (EAP): Free, confidential, 24/7
  access to counseling, legal support, and financial resources
  for employees and their household members

  Parental Leave: Eligible employees are offered up to 6 weeks
  of 100% paid parental leave to support employees as they
  welcome a new child and bond with their family.

  Additional Benefits & Perks: Eligible employees have access
  to employer-paid life and AD&D Insurance, as well as
  employer-paid short-term disability coverage, with the
  option to elect additional life coverage and long-term
  disability insurance. Flexible Spending accounts are
  available for healthcare, dependent care, and commuting
  expenses. Per Scholas also offers a range of voluntary
  benefits, including: Accident, Critical Illness, Hospital
  Indemnity, Legal Services, and Pet Insurance. Additional
  resources include healthcare concierge support, financial
  wellness tools, and employee discount programs.

  QUESTIONS?

  If you have any questions about this role, please feel free
