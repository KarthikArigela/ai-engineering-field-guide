description: |
  Who We Are

  At Kyndryl, we run and reimagine the mission-critical
  technology systems that drive advantage for the world’s
  leading businesses.  We are at the heart of progress; with
  proven expertise and a continuous flow of AI-powered
  insight, enabling smarter decisions, faster innovation, and
  a lasting competitive edge. For our people—Kyndryls—that
  means doing purposeful work that powers human progress. Join
  us and experience a flexible, supportive environment where
  your well-being is prioritized and your potential can
  thrive.

  The Role

  About the Role At Kyndryl, we deploy AI innovation where it
  creates the greatest real-world impact. As a Forward
  Deployed Engineer, you will collaborate directly with
  customers to solve complex challenges, shaping solutions
  that redefine industries. You will be empowered to work at
  speed, supported by a global AI ecosystem, and play a
  pivotal role in delivering outcomes that matter. This
  position operates within our triad delivery model, where
  engineering, consulting, and product expertise come together
  to drive transformative results for customers. This is not
  traditional consulting or pure software engineering; it is a
  hybrid role designed for the complexities of real-world AI
  deployment, with accountability for outcomes not just code.
  You will blend deep engineering expertise with consultative
  engagement to deliver tailored solutions that drive
  measurable business value. Operating in dynamic environments
  and working closely with customer teams - often on-site -
  you will scope, prototype, and deploy solutions at pace.
  Technologies include Generative AI, Agentic AI
  architectures, and multi-agent ecosystems, with insights
  continually fed back into Kyndryl’s platforms and frameworks
  to accelerate future deployments. If you are motivated by
  solving complex problems, excel in direct customer
  engagement, and aspire to shape the future of enterprise AI,
  this role is designed for you.

  Key Responsibilities 1. Customer Engagement & Solution
  Integrity: Partner with customers to understand business
  challenges and translate them into high‑quality,
  fit‑for‑purpose technical solutions, prioritising the right
  outcome over the fastest one. 2. Rapid Prototyping: Build
  and iterate custom AI solutions tailored to customer needs,
  leveraging agentic AI frameworks. 3. Ownership, Deployment &
  Partnership: Own delivery end to end, from scoping to
  production. Working as part of the customer team to engineer
  and deploy production‑ready solutions that drive adoption
  and measurable business outcomes. 4. Optimisation:
  Troubleshoot and enhance system performance, scalability,
  and reliability. 5. Field Intelligence: Systematically
  capture deployment learnings, document best practices, and
  proactively share insights to inform enhancements to
  Kyndryl’s core platforms and frameworks. 6. Continuous
  Learning: Adapt quickly to emerging technologies and
  evolving customer requirements by engaging in ongoing
  professional development. 7. Platform Contribution: Actively
  contribute to the evolution of Kyndryl’s AI platforms
  through feedback, code contributions, and collaboration with
  product teams.

  Your Future at Kyndryl Every position at Kyndryl offers a
  way forward to grow your career. We have opportunities that
  you won’t find anywhere else, including hands-on experience,
  learning opportunities, and the chance to certify in all
  four major platforms. Whether you want to broaden your
  knowledge base or narrow your scope and specialize in a
  specific sector, you can find your opportunity here.

  Who You Are

  You’re good at what you do and possess the required
  experience to prove it. However, equally as important – you
  have a growth mindset; keen to drive your own personal and
  professional development. You are customer-focused – someone
  who prioritizes customer success in their work. And finally,
  you’re open and borderless – naturally inclusive in how you
  work with others. Required Skills & Experience

  - 3-6 years of relevant IT experience in which at least 1
    years of working experience in Agentic AI Frameworks,
    Orchestration, Deployment and 2 years on GenAI solutions
  - Programming Proficiency: Demonstrable expertise in Python;
    experience working with AI/ML frameworks like TensorFlow
    or PyTorch is a plus.
  - Open-Source Ecosystems: Familiarity with community-driven AI
    tools and libraries, including Hugging Face and relevant
    repositories.
  - T-shaped Profile: Deep technical expertise in one or two
    domains, with broad understanding across AI/ML, cloud, and
    consulting.
  - Agentic AI Systems: Experience designing, building, or
    integrating multi-agent systems and orchestration
    frameworks (e.g., LangGraph, Semantic Kernel, Agent
    Framework, AutoGen, CrewAI), including the development of
    agent protocols and coordination mechanisms.
  - Retrieval-Augmented Generation (RAG) & Knowledge Systems:
    Practical knowledge of deploying RAG architectures and
    integrating structured and unstructured knowledge sources
    into AI solutions.
  - Software Engineering: Solid grasp of the software delivery
    lifecycle, version control (Git & GitHub), and data
    engineering tools such as Pandas and Spark.
  - Cloud & Distributed Systems: Experience with cloud AI
    platforms (AWS, Azure, Google AI) and distributed
    computing architectures.
  - Performance & Security: Knowledge of system-level
    optimisation and security best practices for scalable AI
    systems.
  - Business Acumen: Ability to translate business requirements
    into technical solutions and communicate technical value
    to diverse stakeholders, including executive audiences.
  - Flexibility: Willingness to travel and work on customer
    premises as required.

  Education: Degree-level qualification in Computer Science,
  Informatics, Data Science, Engineering, or a closely related
  discipline - or equivalent professional experience.

  Preferred Experience :

  - Experience in Observability and evaluation platforms – e.g.
    Langsmith

  Why join us? You will become part of a team that values
  pace, autonomy, and tangible impact. At Kyndryl, you will
  have full visibility of the delivery lifecycle, with
  opportunities to lead engagements and shape strategic
  direction. Our triad delivery model means you will work
  alongside experts in engineering, product, and consulting,
  fostering continuous learning and innovation. Career
  progression is clearly defined, from Junior to Principal
  levels, with pathways to influence the evolution of our AI
  platforms. You will contribute directly to platform
  development and see the results of your work in real-world
  applications. If you are seeking an environment where your
  ideas are valued and execution drives results, this is the
  place to make a difference. If you want to work where
  innovation meets execution, apply now.

  Being You

  The “Kyn” in Kyndryl means kinship, which represents the
  strong bonds we have with each other, our customers and our
  communities. We focus on ensuring all Kyndryls feel included
  and we welcome people of all cultures, backgrounds, and
  experiences. Even if you don’t meet every requirement, we
  encourage you to apply. We believe in growth, and we’re
  excited to see what you can bring. At Kyndryl, employee
  feedback has told us that our number one driver of employee
  engagement is belonging. That sense of belonging — being a
  valued, respected, trusted member of the team — is
  fundamental to our culture and fueling great experiences for
  our customers. This dedication to welcoming everyone into
  our company means that Kyndryl gives you the ability to
  thrive and contribute to our culture of empathy and shared
  success. That’s The Kyndryl Way.

  What You Can Expect

  Your career with us isn’t just a job—it’s an adventure with
  purpose.  We offer a dynamic, hybrid-friendly culture that
  supports your well-being and empowers you to grow. Our Be
  Well programs are thoughtfully designed to support your
  financial, mental, physical, and social health—because we
  know that when you feel your best, you do your best.  From
  your very first day, you’ll dive into impactful work that
  powers the systems our customers rely on every day. You
  won’t just contribute—you’ll make a difference, tackling
  meaningful projects that sharpen your skills and fuel your
  growth. We’re here to champion your journey. With powerful
  tools to chart your career path, personalized development
  goals aligned with your ambitions, and continuous feedback
  to keep you inspired and on track, you’ll have everything
  you need to thrive and evolve. You’ll develop in-demand
  skills to grow your career and achieve your ambitions with
  access to cutting-edge learning opportunities—from
  certifications with Microsoft, Google, and Amazon to
  coaching and hands-on experiences. And through it all,
  you’ll be part of a culture that values empathy, restless
  learning, and a devotion to shared success. We want you to
  thrive here—and we’re committed to helping you do just that.
  Ready to make an impact? Join us and help shape what’s next.

  Get Referred!

  If you know someone that works at Kyndryl, when asked ‘How
  Did You Hear About Us’ during the application process,
  select ‘Employee Referral’ and enter your contact's Kyndryl
  email address.
