description: |
  🚀 Who we are & What we’re building

  Peakflo is a rapidly growing Agentic AI company. We are
  revolutionizing the way global finance teams work with our
  cutting-edge agentic workflows, and we are actively seeking
  exceptional professionals across diverse disciplines to
  champion this transformation, uniting multidisciplinary
  expertise to propel our global strategic vision.

  - Our Growth Story: Peakflo is backed by top-tier global
    accelerators and investors. We are proud alumni of the
    prestigious Y-Combinator (W22) and the Google AI
    Accelerator. Our momentum and impact have been recognized
    globally by top tech and finance publications:
    - TechCrunch Exclusive: Peakflo’s bid to build business
      payments for Southeast Asia attracts capital, customers
    - PYMNTS: Peakflo Raises $4.1M in Seed Funding to streamline
      vendor payments
    - Grit Daily: Latest Feature on Peakflo's Innovations

  Our Culture : We believe in building a vibrant, high-
  performance culture that rewards curiosity, ownership, and
  innovation. Our team spans the globe, and we love coming
  together to solve hard problems and celebrate our wins. Most
  importantly, we have begun building an environment that
  provides the support and mentorship needed to succeed,
  learn, and grow. ❤️

  💻 What we’re Looking For:

  We're looking for a Technical Operations & AI Automation
  Engineer who loves two things equally: diagnosing gnarly
  production issues and then building the AI agent that
  prevents it from ever happening again.

  This is an L2 support and automation role. You'll be the
  last line of defense on escalated database investigations,
  complex data migrations, and payment flow failures — and
  you'll be expected to close those loops by automating
  everything repeatable. You'll work directly with the CTO and
  Core Engineering.

  If your natural instinct after fixing something is to
  immediately write the script that catches it earlier next
  time, you'll thrive here.

  💪 What you’ll do

  - L2 Investigation & Incident Response
    - Own escalated production issues — database anomalies, failed
      transactions, data corruption, ghost records
      - Deep-dive PostgreSQL/MongoDB query analysis: explain plans,
        slow query logs, lock contention, index misuse
    - Triage and resolve payment failures across Southeast Asian
      rails, PSP integrations, and reconciliation gaps
    - Lead complex data migrations: schema changes, multi-tenant
      data moves, backfills with zero data loss
    - Write post-mortems and build runbooks so the same issue
      never costs us twice
  - AI-Powered Automation
    - Build internal AI agents and tools that automate repetitive
      investigation and support workflows
    - Deploy LLM-powered diagnostics: log summarization, anomaly
      detection, automated root cause drafts
    - Instrument production systems with observability tooling
      (Langfuse, OpenLLMetry, or equivalent) to proactively
      catch issues before they escalate
    - Identify any task you've done manually more than twice —
      then automate it out of existence
  - Platform & Developer Tooling
    - Build and maintain CLI tools, internal dashboards, and
      scripts that help the engineering team ship faster
    - Manage CI/CD pipelines and deployment workflows; keep
      staging and production tightly aligned
    - Contribute to GCP infrastructure upkeep: IAM, secret
      management, container deployments via Docker/K8s
    - Partner with core engineering on ERP integrations (NetSuite,
      Xero) and payment provider onboarding

  🕵️‍♀️ Who we’re looking for

  - 2+ years of hands-on experience in technical operations,
    backend engineering, or DevOps
  - Real fluency with PostgreSQL and/or MongoDB: you can read an
    explain plan and know what to do with it
  - Experience debugging payment flows, reconciliation failures,
    or financial data pipelines
  - Strong Python and bash scripting — you automate as a reflex,
    not an afterthought
  - Comfortable owning ambiguous, high-pressure incidents with
    limited documentation

  ➕ We’re Particularly Interested In People Who Have:

  - Experience with Southeast Asian payment providers (GrabPay,
    PayNow, PromptPay, Xendit, etc.)
  - Practical use of AI coding agents (Claude Code, Cursor,
    Copilot) in day-to-day engineering work
  - LLMOps exposure: deploying, monitoring, or routing LLM APIs
    in production
  - Background in fintech, B2B SaaS, or finance operations
    tooling
  - Familiarity with NetSuite, Xero, or other ERP integrations

  ⚡ What We Value Most

  In order: Drive → Potential → Expertise. We'll take someone
  who is relentlessly resourceful and still learning over
  someone experienced but waiting to be told what to do.
  Ownership is the job.

  🙂Benefits :

  - Competitive compensation package
  - Comprehensive health and wellness benefits.
  - Direct access to leadership — you'll work closely with the
    CTO from day one
  - Collaborative and innovative work environment.
  - Flexible work hours and remote work options.
  - A platform with real engineering depth — payments, AI
    agents, ERP integrations, multi-tenant SaaS
  - The opportunity to automate an entire operations function
    from the ground up
