description: |
  About Charlotte Tilbury Beauty

  Founded by British makeup artist and beauty entrepreneur
  Charlotte Tilbury MBE in 2013, Charlotte Tilbury Beauty has
  revolutionised the face of the global beauty industry by de-
  coding makeup applications for everyone, everywhere, with an
  easy-to-use, easy-to-choose, easy-to-gift range. Today,
  Charlotte Tilbury Beauty continues to break records across
  countries, channels, and categories and to scale at pace.

  Over the last 10 years, Charlotte Tilbury Beauty has
  experienced exceptional growth and is one of the most talked
  about brands in the beauty industry and beyond. It has
  become a global sensation across 50 markets (and growing),
  with over 2,300 employees globally who are part of the Dream
  Team making the magic happen.

  Today, Charlotte Tilbury Beauty is a truly global business,
  delivering market-leading growth, innovative retail and
  product launches fuelled by industry-leading tech — all with
  an internal culture of embracing challenges, disruptive
  thinking, winning together, and sharing the magic. The
  energy behind the bran­d is infectious, and as we grow, we
  are always looking for extraordinary talent who want to be
  part of this our success and help drive our limitless
  ambitions. About the role

  The AI & ML Engineering team accelerates the adoption of AI
  across the business, championing innovation while ensuring
  our machine learning solutions are robust, scalable, and
  cost-efficient. We enable teams to solve problems using
  existing AI tools where possible and build custom solutions
  when needed. Our remit spans AI enablement, agentic systems
  development, and “conventional” ML engineering for non-GenAI
  applications e.g. recommender systems, forecasting models,
  and more.

  We're looking for an AI & ML Engineer who is passionate
  about building production-ready AI and machine learning
  solutions. You'll work across a variety of AI initiatives,
  contributing to the design, implementation and deployment of
  scalable AI systems.

  You will be expected to deliver high-quality AI/ML solutions
  across the full development lifecycle, from proof of concept
  through to production and ongoing optimisation. Working
  closely with other engineers and stakeholders across the
  business, you'll contribute to building reusable platforms,
  services and best practices while continuously developing
  your technical expertise.


  This role reports to the Lead AI & ML Engineer and sits
  within the Data function, working as part of a specialist AI
  engineering team. You'll contribute to a mix of dedicated AI
  initiatives and larger cross-functional projects alongside
  colleagues from Technology, Data and Product.

  As a AI & ML Engineer you will

  The role covers the full AI/ML engineering lifecycle, from
  discovery to deployment and monitoring. Responsibilities
  include

  - Designing and implementing agentic systems using techniques
    spanning RAG, grounding, prompt engineering, and
    orchestration on a GCP-first stack.

  - Building and maintaining production ML pipelines and
    services for non-GenAI use cases (e.g. recommender
    systems, customer segmentation models, marketing
    optimisation modules, leveraging supervised, unsupervised
    and/or econometric modelling approaches).

  - Developing APIs and microservices for AI/ML solutions,
    ensuring security, scalability, and observability.

  - Implementing CI/CD for ML services, writing infrastructure
    as code, and monitoring for model/data drift and
    performance.

  - Establishing robust guardrails for safe AI usage, including
    prompt security, practical evaluation frameworks, and
    compliance with privacy regulations.

  - Contributing to reusable components, documentation and
    engineering best practices that improve AI/ML delivery
    across the organisation.

  - Collaborating with data engineers, data scientists, front &
    back-end engineers, product managers to deliver impactful
    solutions.

  - Supporting the evaluation of new AI technologies, frameworks
    and tooling, contributing ideas and recommendations for
    continuous improvement.

  Who you will work with

  - Data and AI Team

  About you

  The role requires a blend of technical depth and product
  sense, including

  - Strong Python engineering skills (FastAPI, testing, typing)
    and experience with cloud-native development (GCP
    preferred).

  - Hands-on experience with GCP Vertex AI (model endpoints,
    pipelines, embeddings, vector search) or equivalent cloud-
    native AI/ML platforms (e.g. AWS SageMaker, Azure ML) and
    agent orchestration frameworks (e.g. LangChain, LangGraph,
    ADK).

  - Solid understanding of MLOps - CI/CD, IaC (Terraform),
    experiment tracking, model registry, and monitoring.

  - Proven experience deploying and operating ML systems in
    production (batch and real-time).

  - Familiarity with RAG architectures, prompt engineering,
    guardrails and evaluation techniques.

  - Previous experience developing agentic capabilities, such as
    agent skills, MCP servers, tool usage.

  - Strong grasp of security, privacy, and governance principles
    (IAM, secrets, PII handling).

  - Effective communication skills and ability to work with both
    technical and non-technical stakeholders.

  - An interest in evaluating new AI technologies and
    contributing to technical discussions around build, buy or
    configure decisions.

  - Bachelor’s or Master’s degree in Computer
    Science/Engineering/related field, or demonstrable
    relevant experience.

  In addition to the above, we would LOVE if you have

  - Knowledge of vector databases and retrieval strategies.

  - Experience with recommender systems and ranking models.

  - Familiarity with LLM evaluation tools (e.g., RAGAS, TruLens,
    LangSmith, Arize).

  - A working understanding of cloud networking and platform
    infrastructure.

  - Experience in e-commerce or retail environments.

  Why join us?

  - Be a part of this values driven, high growth, magical
    journey with an ultimate vision to empower everyone,
    everywhere to be the best version of themselves.
  - We’re a hybrid model with flexibility, allowing you to work
    how best suits you.
  - 25 days holiday (plus bank holidays) with an additional day
    to celebrate your birthday.
  - Inclusive parental leave policy that supports all parents
    and carers throughout their parenting and caring journey.
  - Financial security and planning with our pension and life
    assurance for all.
  - Wellness and social benefits including Medicash, Employee
    Assist Programs and regular social connects with
    colleagues.
  - Bring your fury friend to work with you on our allocated dog
    friendly days and spaces and not to forget our generous
    product discount and gifting!

  At Charlotte Tilbury Beauty, our mission is to empower
  everybody in the world to be the most beautiful version of
  themselves. We celebrate and support this by encouraging and
  hiring people with diverse backgrounds, cultures, voices,
  beliefs, and perspectives into our growing global workforce.
  By doing so, we better serve our communities, customers,
  employees - and the candidates that take part in our
  recruitment process.
