  About the role and team:

  A hands-on senior AI engineer embedded in client delivery
  teams, responsible for designing, building, and operating
  production-grade agentic AI systems on AWS. This role sits
  at the intersection of AI engineering and cloud
  architecture, owning the end-to-end implementation of multi-
  agent pipelines, knowledge bases, and orchestration
  frameworks using Amazon Bedrock and its surrounding
  ecosystem. The right candidate has shipped real AI agents to
  production — not just prototypes — and brings the rigour of
  a software engineer to a space that often lacks it. Key
  Responsibilities

  - Design and implement production agentic AI systems on Amazon
    Bedrock, including multi-agent orchestration, memory
    management, and tool integration using Amazon Bedrock
    AgentCore and Strands Agents
  - Build, integrate, and maintain MCP (Model Context Protocol)
    servers that expose capabilities to AI agents across
    client platforms
  - Architect and implement RAG pipelines using Amazon Bedrock
    Knowledge Bases, managing vector stores, embeddings, and
    document ingestion from S3 and other sources
  - Apply the A2A (Agent-to-Agent) protocol to enable
    interoperability between agents across systems and
    workflows
  - Instrument AI systems with observability and tracing tooling
    — CloudWatch, spans, and traces — to support debugging,
    performance monitoring, and compliance requirements
  - Integrate LLMs into client applications through prompt
    engineering, context management, and function/tool calling
    patterns
  - Leverage serverless infrastructure — AWS Lambda, DynamoDB,
    S3 — to build scalable, cost-efficient backends for AI
    workloads
  - Collaborate with client engineering and product teams to
    translate requirements into agent architectures,
    contributing to technical roadmaps and AI strategy

  Skills & Experience

  - Amazon Bedrock at scale — hands-on implementation of agents,
    knowledge bases, and model inference in production
    environments, not limited to basic API calls
  - Agentic AI and multi-agent systems — direct experience
    designing and deploying agent pipelines with real
    orchestration complexity
  - MCP (Model Context Protocol) — built or integrated MCP
    servers in a production or near-production context
  - Strands Agents — familiarity with the framework and its
    application to agentic workflows on AWS
  - RAG implementation — knowledge base design, chunking
    strategy, vector store configuration, and retrieval
    evaluation
  - Python — strong, applied proficiency in an AWS and AI
    context
  - AWS infrastructure — working knowledge of Lambda, DynamoDB,
    and S3 as components of AI system backends
  - Observability — experience instrumenting AI systems with
    tracing, logging, and monitoring tooling (CloudWatch
    preferred)
  - LLM integration — prompt engineering, tool/function calling,
    context window management, and output parsing
  - AWS certifications desirable, particularly the AI/ML
    Specialty









