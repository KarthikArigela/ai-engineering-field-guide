title: Founding Engineer (Python / AI / Data Platform)
company: Jahnel Group
location: New York, USA
work_type: FULL_TIME
company_size: 130 Employees
description: |
  Jahnel Group’s mission is to provide the absolute best
  environment for software creators to pursue their passion by
  connecting them with great clients doing meaningful work.

  Who We’re Looking For

  We’re looking for a Founding Engineer to help build the core
  data and AI infrastructure powering how healthcare policy
  information is structured, queried, and used in production
  systems.

  This is a high-ownership role in an early-stage environment
  where you will work directly with founders, define core
  architecture decisions, and build systems from the ground
  up. You’ll be responsible for turning complex, unstructured
  healthcare data into reliable, AI-powered infrastructure
  that scales.

  This role is ideal for someone who thrives in ambiguity,
  enjoys building end-to-end systems, and is excited about
  applying modern AI/LLM techniques to real-world data
  problems.

  Primary Responsibilities

  - Design and build core backend systems using Python and SQL
  - Build and scale data ingestion pipelines for unstructured
    healthcare policy data
  - Define and evolve data models, schemas, and APIs for long-
    term platform scalability
  - Build AI-powered pipelines using LLMs, embeddings, and RAG
    architectures
  - Develop evaluation frameworks for LLM systems (testing,
    benchmarking, monitoring, QA workflows)
  - Improve data quality, traceability, and system reliability
    across the platform
  - Rapidly prototype and productionize new ideas in close
    collaboration with founders
  - Build systems for auditability, explainability, and
    validation of AI-generated outputs
  - Continuously iterate on architecture, performance, and
    product direction

  Some Must Haves:

  - 5+ years of experience building backend or data-heavy
    systems
  - Strong proficiency with Python, SQL, and Postgres
  - Experience building data pipelines and data-driven software
    systems
  - Hands-on experience with AI/LLM systems (RAG, embeddings,
    prompt engineering, evals, hallucination mitigation)
  - Strong system design and architecture skills
  - Experience working with cloud infrastructure (AWS preferred)
  - Strong product mindset and ability to make tradeoffs between
    technical and business value
  - Comfort working in highly ambiguous, fast-paced environments
  - Proven ability to own projects end-to-end without heavy
    direction

  Nice to Have:

  - Experience in healthcare, payer/provider, or health tech
    domains
  - Startup or early-stage founding team experience
  - Experience with FastAPI or similar backend frameworks
  - Familiarity with modern data warehouses (e.g., Snowflake)
  - Exposure to TypeScript/React frontend development
  - Experience with Terraform or infrastructure-as-code
  - Experience with containerized systems and orchestration

  Where We’re Looking For It

  - New York

  Other Information

  This is a high-impact founding role working directly with
  company leadership. Expect fast iteration, high autonomy,
  and significant ownership of core systems. Work hours align
  with US collaboration needs.

  Position available immediately.
