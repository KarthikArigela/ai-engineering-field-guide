description: |
  We are seeking an experienced Senior AI Engineer to join our
  dynamic team, driving innovation in  AI-driven solutions
  with a global impact. This role is specifically tailored for
  a highly motivated professional with a strong technical
  background in Python and Java, hands-on expertise in
  developing Retrieval-Augmented Generation (RAG)-based
  chatbots, Machine Learning, Deep Learning, and solid cloud
  deployment experience, preferably on AWS. As our Senior AI
  Engineer, you will spearhead the end-to-end development
  lifecycle, including solution architecture, design,
  implementation, deployment, and scaling of cutting-edge AI
  applications. Your leadership will ensure the delivery of
  high-performance, reliable, and impactful solutions. What
  You Will Do:

  • Lead the design and development of AI-driven applications,
  particularly focusing on RAGbased chatbot solutions.

  • Architect robust solutions leveraging Python and Java to
  ensure scalability, reliability, and  maintainability.

  • Deploy, manage, and scale AI applications using AWS cloud
  infrastructure, optimizing  performance and resource
  utilization.

  • Collaborate closely with cross-functional teams to
  understand requirements, define  project scopes, and deliver
  solutions effectively.

  • Mentor team members, providing guidance on best practices
  in software development, AI  methodologies, and cloud
  deployments.

  • Ensure solutions meet quality standards, including
  thorough testing, debugging,  performance tuning, and
  documentation.

  • Continuously research emerging AI technologies and
  methodologies to incorporate best  practices and innovation
  into our products

  Requirements

  Required Skills & Qualifications

  • Bachelor's or master's degree in computer science,
  Engineering, Data Science,  Mathematics, Statistics or
  related fields.

  • At least 3 years of professional experience in AI/Machine
  Learning engineering.

  • Strong programming skills in Python and Java.

  • Demonstrated hands-on experience building Retrieval-
  Augmented Generation (RAG)- based chatbots or similar
  generative AI applications.

  • Proficiency in cloud platforms, particularly AWS,
  including experience with EC2, Lambda,  SageMaker, DynamoDB,
  CloudWatch, and API  Gateway.

  • Solid understanding of AI methodologies, including natural
  language processing (NLP),  vector databases, embedding
  models, and large language model integrations.

  • Experience with leading projects or teams, managing
  technical deliverables, and ensuring  high-quality outcomes.

  Preferred Qualifications:

  • AWS certifications (e.g., AWS Solutions Architect, AWS
  Machine Learning Specialty).

  • Familiarity with popular AI/ML frameworks and libraries
  such as Hugging Face  Transformers, TensorFlow, PyTorch,
  LangChain, or similar.

  • Experience in Agile development methodologies.

  • Excellent communication skills, capable of conveying
  complex technical concepts clearly  and effectively.

  • Strong analytical and problem-solving capabilities, with
  the ability to navigate ambiguous  technical challenge

