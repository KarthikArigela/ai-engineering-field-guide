description: |
  The next wave of enterprise software won’t be dashboards or
  copilots. It will be Digital Workers, autonomous AI systems
  capable of executing complex workflows end-to-end. At
  causaLens, we are building the platform that enables
  enterprises to deploy these Digital Workers safely and at
  scale.

  Our Digital Worker Factory allows organizations to design,
  deploy, and manage AI agents that automate decision-making,
  analytics, and operational workflows across the enterprise.
  These systems are already being used by global companies
  including Johnson & Johnson, Syneos Health and Cisco to
  transform how work gets done.

  Backed by $50M+ in funding from Molten Ventures, Dorilton
  Capital, and IQ Capital, and supported by visionary
  investors including the CEO of Revolut, causaLens is scaling
  rapidly. Our team includes leading AI researchers,
  engineers, and scientists, almost 20% with PhDs.

  Here are 2 articles that define our culture: 1. A Hiring
  Framework for a New Kind of Services Company

  2. The Primacy of Winning

  The Role

  We’re hiring an AI Engineer to build and deploy enterprise-
  grade AI systems and digital workers in production. You’ll
  work closely with global organisations, embedding with
  clients to untangle complex workflows and translate them
  into reliable, scalable agentic systems—integrating models,
  data, and enterprise infrastructure into solutions that
  operate in real-world environments.

  We’re looking for engineers who want to apply advanced AI to
  meaningful business problems. You’ll contribute to systems
  spanning LLMs, multi-agent coordination, retrieval and
  reasoning, and enterprise data integration; building
  software that automates workflows and takes action, rather
  than producing static outputs.

  Our stack typically includes Python, modern LLM frameworks,
  orchestration tools, and cloud platforms such as AWS, GCP,
  or Azure.

  What you’ll bring:

  - Proven hands-on experience building production-grade
    solutions using LLMs, RAG pipelines, MCPs, and agentic
    workflows
  - A forward-deployed, client-first mindset, with experience
    working directly with both technical teams and business
    stakeholders
  - Strong delivery capabilities, with the ability to translate
    complex business problems into scalable AI systems
  - A track record of delivering measurable impact through
    applied AI

  What you’ll do:

  - Partner with leading enterprises to understand their needs
    and design tailored agentic workflows
  - Implement robust, scalable systems leveraging the latest
    advancements in AI
  - Own the end-to-end delivery of high-impact AI products, from
    concept through to production deployment

  Our culture values intellectual rigour, ownership, and the
  primacy of winning. We expect tech team members to work from
  the office 1-2 days per week.

  Benefits

  We care about our people’s lives, both inside and outside of
  causaLens. Beyond the core benefits like competitive
  remuneration and a great work-life balance, we offer the
  following:

  - 25 days of paid holiday, plus bank holidays
  - carry over/sell holiday options (up to 5 days)
  - Share options
  - Pension scheme
  - Core life cover for all employees, equivalent to 4x your
    annual basic salary

  - Happy hours and team outings
  - Referral bonus program
  - Cycle to work scheme
  - Friendly tech purchases
  - Benefits to choose from, including Health/Dental Insurance
  - Special Discounts
  - Learning and development budget
  - Work abroad days
  - Office snacks and drinks

  Logistics

  - Recruiter Screen
  - Hiring Manager / Team Interview (30 mins): Deep dive into
    past projects, recent codebases
  - Take-Home Challenge (3 hours): Testing structured thinking
    and practical coding/problem-solving.
  - "Day 0" Onsite (Hammersmith): * 3 x 30-minute technical
    interviews.

         -Founders/Exec Interview

  If you require accommodations during the application process
  or in your role at causaLens, please contact us at
  talent@causalens.com
