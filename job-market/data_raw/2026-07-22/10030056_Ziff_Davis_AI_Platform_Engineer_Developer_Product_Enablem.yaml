title: "AI Platform Engineer – Developer & Product Enablement"
company: Ziff Davis
location: USA
work_type: FULL_TIME
description: |
  The Opportunity:

  The AI Platform team is seeking an AI Platform Engineer to
  design and build the foundational systems, APIs, and tooling
  that empower our engineering and product teams to work
  efficiently. In this role, you will architect the AI-powered
  infrastructure layer that development and product teams rely
  on—ranging from internal developer tooling and code
  generation pipelines to AI-assisted product lifecycle
  systems. This position supports the Tech & Shopping (T&S)
  division of Ziff Davis (NASDAQ: ZD), which operates digital
  media and software brands including CNET, RetailMeNot,
  Mashable, PCMag, Lifehacker, and Spiceworks. This is your
  chance to lead high-impact projects! Do you want to see the
  direct impact of your performance and thrive both personally
  and professionally? This role operates on a remote work
  arrangement with no regular travel requirements.

  Key Responsibilities:

  The individual in this position will own the lifecycle of
  internal AI APIs, SDKs, and developer tooling to abstract
  LLM complexity and establish reliable, production-grade
  primitives. You will build and maintain CI/CD-integrated AI
  systems, including code review automation, test generation
  pipelines, and agentic systems capable of executing multi-
  step engineering tasks. Additionally, you will drive product
  development acceleration by integrating AI capabilities
  directly into existing collaborative workflows like Jira,
  GitHub, and Slack.

  ●        Design evaluation frameworks and automated testing
  pipelines to ensure AI system outputs meet quality
  thresholds.

  ●        Build observability tooling to monitor model
  behavior, token costs, latency, and production output
  quality.

  ●        Establish shared prompt libraries, model routing
  logic, and reusable context management systems.

  ●        Define and enforce engineering standards for AI
  system development across the division.

  ●        Provide technical guidance and conduct
  architectural reviews of AI features built by product teams.

  Job Qualifications:

  The ideal candidate brings deep software engineering
  fundamentals paired with a clear, collaborative approach to
  raising the technical bar across engineering cohorts. You
  possess strong capabilities in system design, API design,
  and distributed infrastructure management.

  ●        5+ years in software engineering, platform
  engineering, or infrastructure, with at least 2 years
  building production AI/ML systems.

  ●        Deep experience with LLM APIs and a strong
  understanding of how these systems behave under real
  production load.

  ●        Experience building internal developer platforms,
  tooling, or shared infrastructure used by other engineers.

  ●        Proficiency in Python and at least one compiled
  language; comfortable across the full backend stack.

  ●        Preferred: Familiarity with agentic frameworks, RAG
  architectures, vector databases, or infrastructure-as-code
  (Terraform).

  About Tech & Shopping

  Our portfolio unites the most trusted brands in tech,
  shopping, savings, and lifestyle to help people and
  businesses thrive. The CNET Group stands as the leader in
  tech media, offering expert editorial, insights,
  communities, and solutions that reach 81 million unique
  visitors each month. Complementing this, Ziff Davis Shopping
  serves as the most trusted purchase companion, delivering
  exceptional user and partner experiences. We connect brands
  to large, contextually-aligned audiences and help users find
  the best offers, cash back rewards, seasonal deals, and
  expert content for all their shopping needs. Together, we
  provide a comprehensive destination for expert guidance,
  from critical tech decisions to everyday purchase solutions.

  About Ziff Davis

  Ziff Davis (NASDAQ: ZD) is a vertically focused digital
  media and internet company whose portfolio includes leading
  brands in technology, shopping, gaming and entertainment,
  connectivity, health, cybersecurity, and martech. Today,
  Ziff Davis is focused on seven key verticals – Technology,
  Connectivity, Shopping, Entertainment, Health & Wellness,
  Cybersecurity and Marketing Technology. Its brands include
  IGN, Mashable, RetailMeNot, PCMag, Humble Bundle,
  Spiceworks, Ookla (Speedtest), RootMetrics, Everyday Health,
  BabyCenter, Moz, iContact and Vipre Security.

  Our Benefits

  Ziff Davis offers competitive salaries in addition to
  robust, health and wellness-focused benefits, including
  comprehensive medical, dental, and vision coverage, as well
  as life and disability benefits. We offer amazing benefits!
  Our employees enjoy Flexible Spending Accounts (FSAs), a
  401(k) with company match, and an Employee Stock Purchase
  Plan.

  We are committed to work-life balance with Flexible Time
  Off, Volunteer Time Off, and paid holidays. We offer family
  building and caregiving support and generous Family Care and
  Parental leave, when you need it. We also provide Fitness
  Reimbursement and access to wellness programs, ensuring our
  team stays healthy both physically and mentally.

  At Ziff Davis, we remain dedicated to creating an
  environment where everyone feels valued, respected, and
  empowered to succeed. We offer Employee Resource Groups,
  company-sponsored events, and regular opportunities for
  professional growth through educational support, mentorship
  programs, and career development resources. Our employees
  are recognized and celebrated through employee engagement
  programs and recognition awards.

  If you're seeking a dynamic and collaborative work
  environment where you can see the direct impact of your
  performance and thrive both personally and professionally,
  then the Tech & Shopping Division is the place for you. Are
  you ready to own the strategy for our next-generation
  platform?

  Compensation Range

  Ziff Davis provides a range for the base pay. Factors that
  may be used to determine your actual pay may include your
  specific job related knowledge, skills, experience, and
  geographic location. The salary compensation for this role
  is $185,000 to $200,000. Individual pay within the
  compensation range for this business unit specific role is
  determined based on a variety of factors including
  experience, scope of the role, capabilities to perform the
  role, education and training, as well as business and
  company performance.

