  Company Description

  ABOUT IQ-EQ We’re a leading Investor Services group offering
  end-to-end services in administration, accounting,
  reporting, regulatory and compliance needs of the investment
  sector worldwide.

  We employ a global workforce of 6,500+ people across 24
  jurisdictions and have assets under administration (AUA)
  exceeding US$857 billion. We work with 13 of the world’s top
  15 private equity firms.

  Our services are underpinned by a Group-wide commitment to
  ESG and best-in-class technology including a global data
  platform and innovative proprietary tools supported by in-
  house experts.

  Above all, what makes us different is our people. Operating
  as trusted partners to our clients, we deliver intelligent
  solutions through a combination of technical expertise and
  strong relationships based on deep client understanding. 

  We’re driven by our Group purpose, to power people and
  possibilities.

  Job Description

  Introduction

  We are seeking a Senior AI Engineer to drive AI strategy,
  architecture, and development. This role focuses on building
  scalable AI solutions using LLMs, RAG, multi-agent
  frameworks, and AI-driven automation while ensuring secure
  and ethical AI practices.

  What you'll do

  - You’ll lead and mentor a team of AI engineers and data
    scientists while driving AI strategy and solutioning.
  - You’ll design scalable AI architectures integrating LLMs,
    multi-agent systems, and secure AI frameworks for
    enterprise applications.
  - You’ll develop and optimize AI solutions using advanced RAG
    techniques, vector databases, LangChain, LlamaIndex, and
    deep learning frameworks like TensorFlow and PyTorch.
  - You’ll build and deploy conversational AI, APIs (FastAPI),
    and microservices for real-time, AI-powered applications
    with strong performance optimization.
  - You’ll ensure robust AI deployment by integrating LLM
    security practices, working with databases, and leveraging
    cloud, containerization, and CI/CD tools for scalable
    solutions.

  What we offer

  - Competitive Total Rewards Package: Comprehensive annual
    compensation including basic salary, HRA, special
    allowance, provident fund, gratuity, internet allowance,
    and food allowance.
  - Health & Insurance Coverage: Medical insurance, group term
    life insurance, and personal accident insurance.
  - Allowances & Support: Transportation/transport allowance and
    shift allowance.
  - Paid Time Off: Generous leave policy to support work–life
    balance.

  Qualifications

  About you

  - You have 9+ years of experience, including 6+ years in AI,
    data science, or machine learning.
  - You have strong expertise in LLMs, RAG, vector databases,
    and multi-agent AI frameworks.
  - You are proficient in AI/ML tools such as TensorFlow,
    PyTorch, LangChain, and LlamaIndex.
  - You have hands-on experience in API development,
    microservices architecture, and AI deployment.
  - You have strong leadership, problem-solving, and stakeholder
    collaboration skills.

  Additional Information

  OUR COMMITMENT TO YOU AND THE ENVIRONMENT

  As a forward-looking business, sustainability is integral to
  our strategy and operations. Our sustainability depends on
  us building and maintaining meaningful, long-term
  relationships with all our stakeholders – including our
  employees, clients, and local communities – while also
  reducing our impact on our natural environment.

  There is always more we can, and should do, to improve –
  whether in relation to our people, our clients, our planet,
  or our governance. Our ongoing success as a business depends
  on our sustainability and agility in a changing and
  challenging global landscape. We’re committed to fostering
  an inclusive, equitable and diverse culture for our people,
  led by our Diversity, Equity, and Inclusion steering
  committee.

  Our learning and development programmes and systems enable
  us to invest in growing our employees’ careers, while our
  hybrid working approach supports our employees in achieving
  balance and flexibility while remaining connected to their
  colleagues. We want to empower our 6,500+ employees - from
  94 nationalities, across 24 countries - to each achieve
  their potential. Through IQ-EQ Launchpad we support female
  managers launching their first fund, in an environment where
  only 15% of all private equity and venture capital firms are
  gender balanced.

  We’re committed to growing long-term relationships with our
  clients and supporting them in achieving their objectives.
  We understand that our client’s sustainability and success
  leads to our sustainability and success. We’re emotionally
  invested in our clients right from the beginning.
