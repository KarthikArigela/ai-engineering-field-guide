description: |
  Job Requisition ID #

  26WD97978

  Position Overview


  The DMD team builds AI agents that help Autodesk users work
  with design and manufacturing data access and collaboration.
  You'll contribute across the full stack — backend agent
  logic and the React/TypeScript UIs that surface it to users.

  Responsibilities

  - Lead and deliver full-stack features across backend
    services, AI Agent and UI.

  - Design and Drive technical decisions on agent behavior,
    tooling, and developer experience

  - Mentor teammates and set quality standards across the
    codebase

  - Own features end-to-end from design through deployment

  Minimum Qualifications

  - 10-14 years of software engineering experience, with a track
    record of delivering large scaled production systems

  - Hands-on experience with LLM application patterns: tool use,
    streaming, multi-turn conversation

  - Experience with MCP (Model Context Protocol) or agent
    frameworks

  - Proficient in Python — async patterns, testing, clean module
    design and Java

  - Experience building and deploying REST APIs on AWS （Lambda +
    API Gateway）

  - Comfortable leading in a polyglot monorepo

  - Production experience with React and TypeScript

  - Actively uses AI coding tools (e.g. Claude Code, Cursor,
    Copilot) as part of daily workflow

  - Strong communication skills — able to drive trade-off
    discussions and work autonomously in a small team

  Nice to have

  - Familiarity with RAG pipelines or vector search

  - Experience with spec-driven development workflows (e.g.
    OpenSpec)

