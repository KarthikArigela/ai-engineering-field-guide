description: |
  Welcome to Glow25!

  At Glow25, we unite beauty with science and cutting-edge
  technology – AI is a natural part of our everyday work. As
  Germany's leading collagen brand, we help people feel
  confident at every life stage and enhance their natural
  beauty.

  For our continued growth, we're looking for people with
  substance: reliable, motivated, and genuinely invested in
  building something meaningful together. At Glow25, you'll
  find ambitious goals and an environment that fosters
  ownership and values performance—regardless of which role
  you take on.

  We look forward to getting to know you.

  These are our current challenges and future goals:

  As Glow25 grows, more of our internal complexity shows up as
  manual work, fragile handoffs, and operational friction
  across teams like Operations, Support, Finance, and
  Technology.

  This role exists to reduce that friction.

  The focus is applied automation in production. The goal is
  to make existing processes faster, more reliable, and easier
  to operate by using software, integrations, and AI where it
  clearly adds value.

  This is where we need your support:

  You will work on concrete, high-impact problems, typically
  end to end.

  Identify automation opportunities

  - Partner with Operations, Support, and Technology to
    understand where manual effort and repetition create
    friction.
  - Focus on workflows that are high-volume, repeatable, and
    business-critical.
  - Help prioritize opportunities based on impact, risk, and
    feasibility.

  Design and build automations

  - Build production-grade workflows using APIs, webhooks, and
    event-based systems.
  - Apply AI or LLMs for tasks such as classification, routing,
    summarization, or decision support, where they clearly add
    value.
  - Integrate with existing systems rather than replacing them.

  Own reliability and iteration

  - Ensure automations are observable, testable, and
    maintainable.
  - Monitor behavior in production and improve solutions over
    time.
  - Reduce fragile one-off scripts in favor of reusable
    patterns.

  You have the following experience:

  - Experience designing and operating reliable automations in
    production, including workflow orchestration
  - Comfortable working across imperfect systems and APIs, with
    a strong sense for operational risk and trade-offs
  - Practical experience applying AI or LLMs in real workflows
    where they add clear, measurable value
  - Thoughtful about when automation helps and when it does not

  That's something you can look forward to:

  - Work flexibly, in the way that suits you best. Work when and
    where you’re most productive – with flexible hours and
    smart time tracking.
  - Home office? Done right. We’ve got you covered: receive a
    one-time €500 allowance to set up your perfect workspace.
  - Fully equipped from day one. Mac or Windows – you choose
    what works best for you.
  - Glow Card – your monthly treat. Get €50 every month to spend
    however you like – that’s €600 a year, just because.
  - Learning is part of the deal. Whether it’s our Glowcademy,
    dedicated learning time, or personal development support –
    we invest in you, not just in numbers.
  - Let’s Glow! Enjoy 40% off our entire product range – yes,
    everything.
  - Take a break – you’ve earned it. 30 vacation days + 1
    personal holiday + up to 10 additional unpaid days off
    when you need a real reset. Oh, and New Year’s Eve? That’s
    a day off too!
  - Stay healthy, stay glowing. Our company health insurance
    reimburses up to €600 per year for extras like vision
    aids, alternative medicine, or dental cleanings.
  - Thinking ahead. After your probation period, we’ll
    contribute €600 toward your pension plan – and if you add
    more, we’ll top it up with an extra 20%.
  - Exclusive partner perks. Get access to discounts and special
    offers from top brands through our corporate benefit
    platforms.
  - Culture that truly shines. For five years in a row, we’ve
    been recognized as a Top Company on Kununu - proof of the
    strong, positive, and genuine culture we live every day.
  - Move your way. From workouts to wellness retreats – you
    decide how to stay active. Choose between Urban Sports
    Club or Wellpass.

  Yay! You've made it this far!

  But there’s one more thing we want to say: Don’t hesitate!
  Especially if you’re a woman, or from an underrepresented
  group. Even if you don’t check every box, we want to
  encourage you to apply anyway. We believe that a diverse
  range of perspectives and experiences makes a team stronger
  – and the stronger our team is, the better we can fulfil our
  mission of helping people bring more energy into their daily
  lives.
