description: |
  About Kanerika:

  Who we are:

  Kanerika Inc. is a premier global software products and
  services firm that specializes in providing innovative
  solutions and services for data-driven enterprises. Our
  focus is to empower businesses to achieve their digital
  transformation goals and maximize their business impact
  through the effective use of data and AI. We leverage
  cutting-edge technologies in data analytics, data
  governance, AI-ML, GenAI/ LLM and industry best practices to
  deliver custom solutions that help organizations optimize
  their operations, enhance customer experiences, and drive
  growth.

  Awards and Recognitions

  Kanerika has won several awards over the years, including:

  · CMMI Level 3 Appraised in 2024.

  · Best Place to Work 2022 & 2023 by Great Place to Work®.

  · Top 10 Most Recommended RPA Start-Ups in 2022 by RPA
  today.

  · NASSCOM Emerge 50 Award in 2014.

  · Frost & Sullivan India 2021 Technology Innovation Award
  for its Kompass composable solution architecture.

  · Recognized for ISO 27701, 27001, SOC2, and GDPR
  compliances.

  · Featured as Top Data Analytics Services Provider by
  GoodFirms.

  Working for us

  Kanerika is rated 4.6/5 on Glassdoor, for many good reasons.
  We truly value our employees' growth, well-being, and
  diversity, and people’s experiences bear this out. At
  Kanerika, we offer a host of enticing benefits that create
  an environment where you can thrive both personally and
  professionally. From our inclusive hiring practices and
  mandatory training on creating a safe work environment to
  our flexible working hours and generous parental leave, we
  prioritize the well-being and success of our employees. Our
  commitment to professional development is evident through
  our mentorship programs, job training initiatives, and
  support for professional certifications. Additionally, our
  company-sponsored outings and various time-off benefits
  ensure a healthy work-life balance. Join us at Kanerika and
  become part of a vibrant and diverse community where your
  talents are recognized, your growth is nurtured, and your
  contributions make a real impact. See the benefits section
  below for the perks you’ll get while working for Kanerika.

  Locations

  We are located in Austin (USA), Singapore, Hyderabad, Indore
  and Ahmedabad (India).

  Job Location: Hyderabad, Indore and Ahmedabad (India)

  Requirements

  Key Responsibilities:

  · Lead the design and development of AI-driven applications,
  particularly focusing on RAG-based chatbot solutions.

  · Architect robust solutions leveraging Python and Java to
  ensure scalability, reliability, and maintainability.

  · Deploy, manage, and scale AI applications using AWS cloud
  infrastructure, optimizing performance and resource
  utilization.

  · Collaborate closely with cross-functional teams to
  understand requirements, define project scopes, and deliver
  solutions effectively.

  · Mentor team members, providing guidance on best practices
  in software development, AI methodologies, and cloud
  deployments.

  · Ensure solutions meet quality standards, including
  thorough testing, debugging, performance tuning, and
  documentation.

  · Continuously research emerging AI technologies and
  methodologies to incorporate best practices and innovation
  into our products.

  ---

  Required Qualifications:

  · Bachelor’s or Master’s degree in Computer Science,
  Engineering, Data Science, Mathematics, Statistics or
  related fields.

  · At least 5 years of professional experience in AI/Machine
  Learning engineering.

  · Strong programming skills in Python and Java.

  · Demonstrated hands-on experience building Retrieval-
  Augmented Generation (RAG)-based chatbots or similar
  generative AI applications.

  · Proficiency in cloud platforms, particularly AWS,
  including experience with EC2, Lambda, SageMaker, DynamoDB,
  CloudWatch, and API Gateway.

  · Solid understanding of AI methodologies, including natural
  language processing (NLP), vector databases, embedding
  models, and large language model integrations.

  · Experience with leading projects or teams, managing
  technical deliverables, and ensuring high-quality outcomes.

  · AWS certifications (e.g., AWS Solutions Architect, AWS
  Machine Learning Specialty).

  · Familiarity with popular AI/ML frameworks and libraries
  such as Hugging Face Transformers, TensorFlow, PyTorch,
  LangChain, or similar.

  · Experience in Agile development methodologies.

  · Excellent communication skills, capable of conveying
  complex technical concepts clearly and effectively.

  · Strong analytical and problem-solving capabilities, with
  the ability to navigate ambiguous technical challenges.

  Benefits

  Employee Benefits

  1. Culture:

  a. Open Door Policy: Encourages open communication and
  accessibility to management.

  b. Open Office Floor Plan: Fosters a collaborative and
  interactive work environment.

  c. Flexible Working Hours: Allows employees to have
  flexibility in their work schedules.

  d. Employee Referral Bonus: Rewards employees for referring
  qualified candidates.

  e. Appraisal Process Twice a Year: Provides regular
  performance evaluations and feedback.

  2. Inclusivity and Diversity:

  a. Hiring practices that promote diversity: Ensures a
  diverse and inclusive workforce.

  b. Mandatory POSH training: Promotes a safe and respectful
  work environment.

  3. Health Insurance and Wellness Benefits:

  a. GMC and Term Insurance: Offers medical coverage and
  financial protection.

  b. Health Insurance: Provides coverage for medical expenses.

  c. Disability Insurance: Offers financial support in case of
  disability.

  4. Child Care & Parental Leave Benefits:

  a. Company-sponsored family events: Creates opportunities
  for employees and their families to bond.

  b. Generous Parental Leave: Allows parents to take time off
  after the birth or adoption of a child.

  c. Family Medical Leave: Offers leave for employees to take
  care of family members' medical needs.

  5. Perks and Time-Off Benefits:

  a. Company-sponsored outings: Organizes recreational
  activities for employees.

  b. Gratuity: Provides a monetary benefit as a token of
  appreciation.

  c. Provident Fund: Helps employees save for retirement.

  d. Generous PTO: Offers more than the industry standard for
  paid time off.

  e. Paid sick days: Allows employees to take paid time off
  when they are unwell.

  f. Paid holidays: Gives employees paid time off for
  designated holidays.

  g. Bereavement Leave: Provides time off for employees to
  grieve the loss of a loved one.

  6. Professional Development Benefits:

  a. L&D with FLEX- Enterprise Learning Repository: Provides
  access to a learning repository for professional
  development.

  b. Mentorship Program: Offers guidance and support from
  experienced professionals.

  c. Job Training: Provides training to enhance job-related
  skills.

  d. Professional Certification Reimbursements: Assists
  employees in obtaining professional certifications.

  e. Promote from Within: Encourages internal growth and
  advancement opportunities.
