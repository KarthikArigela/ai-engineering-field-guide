description: |
  Who We Are

  Notion is the collaborative AI workspace where teams and
  agents think together. We're building one place where your
  knowledge, projects, meetings, and AI tools live side by
  side, so work is faster, clearer, and less fragmented.
  Millions of individuals, small teams, and large companies
  run their work on Notion.

  Notinos (our employees) are customer zero in bringing this
  future of work to life. We care about craft, building things
  that last, and the belief that great work is still
  fundamentally human. Our goal isn’t to ship the next
  feature. Each and every team of Notinos is working to set
  the standard for how humans work together in the AI era.
  From building a business’s system of record to making and
  managing AI agents to automating away the busy work, we care
  deeply about giving our customers more time for their life’s
  work.

  About the Role:

  Millions of people use Notion — and this number is
  increasing every day. That means millions of people trust us
  to deliver a fast, reliable, and secure experience, and we
  value this more than anything. We want to keep earning
  trust, while also continuing to amaze our users with the
  tools they can build in Notion.

  The AI Platform team is responsible for building the shared
  foundations that let Notion ship AI products quickly and
  operate them safely at scale. You’ll join a team of talented
  engineers focused on making speed and quality compatible:
  reliability and availability through provider changes,
  quality and correctness systems like evals and release
  gates, observability that makes failures explainable, and
  shared primitives for model integrations, context
  management, long-running actions, and cost/performance
  tradeoffs. Notion’s AI platform is vital to helping product
  teams move faster with production-grade guardrails as
  models, providers, and AI capabilities rapidly evolve.

  This role can be based in either San Francisco or New York
  City. We work from our offices on Mondays, Tuesdays and
  Thursdays (our Anchor Days) because we do our best thinking
  and building together in person. We’re looking for someone
  who’s excited to work alongside the team during those days.

  What You'll Achieve:

  - You'll own and play a pivotal role in the prototyping,
    development and scaling of systems and core AI platform
    primitives.
  - You’ll partner closely with product teams to provide paved
    paths and production-ready guardrails that help new AI
    features ship faster with less duplicated work.
  - You’ll work across infrastructure, shared libraries, APIs,
    and product integration points to make AI platform
    capabilities easy to adopt and high-leverage across
    Notion.
  - You’ll operate critical AI systems in production, using
    observability and diagnostics to understand provider/model
    behavior, debug failures, improve latency and cost, and
    evolve systems with minimal user disruption.
  - You’ll help Notion safely adopt new models, providers, and
    AI capabilities through versioning, controlled rollouts,
    compatibility layers, and clear quality/reliability gates.

  Skills You'll Need to Bring:

  - Passion for AI systems at scale: You’ve worked on LLM, ML
    platform, data, or infrastructure teams that own critical
    shared systems. You understand the challenges of scaling
    reliability, latency, cost, and quality as usage and model
    complexity grow. You care deeply about building platforms
    that are dependable, efficient, and easy for other
    engineers to use.
  - Adaptable and curious: You like going deep on how systems
    behave in practice, especially when models, providers, and
    product requirements are changing quickly. You’re eager to
    use AI tools to work smarter and are willing to move
    across backend, infrastructure, libraries, and product
    code when that’s what the problem requires.
  - Extreme ownership: You’re comfortable working across
    ambiguous problem spaces, aligning stakeholders around a
    clear path forward, and driving execution with
    accountability. You take ownership of platform outcomes
    including reliability, quality, adoption, and operational
    follow-through beyond team boundaries.
  - Thoughtful problem-solving: For you, problem-solving starts
    with a clear and accurate understanding of the context.
    You can decompose ambiguous system behavior, debug across
    layers, and work toward clean, pragmatic solutions by
    yourself or with teammates. You’re comfortable asking for
    help when you get stuck.
  - Pragmatic and business-oriented: You understand that AI
    platform work is full of tradeoffs across quality,
    latency, cost, reliability, and speed of execution. You
    prioritize based on product and business impact, balancing
    craft with urgency and operational simplicity.

  Nice to Haves:

  - 2-4 years of experience as a Software Engineer
  - Experience with applied AI product development (prompting,
    evals, model integrations, or quality measurement).
  - You've built out and scaled data processing pipelines at
    scale with Apache Spark or Ray.
  - You’ve past experience working full-stack in Typscript and
    node.js ecosystem
  - You have experience building MLOps and ML serving
    infrastructure.

  Notion is committed to providing highly competitive cash
  compensation, equity, and benefits. The compensation offered
  for this role will be based on multiple factors such as
  location, the role’s scope and complexity, and the
  candidate’s experience and expertise, and may vary from the
  range provided below. For roles based in San Francisco or
  New York City, the estimated base salary range for this role
  is $180,000 - $201,000 per year.

  By clicking “Submit Application”, I understand and agree
  that Notion and its affiliates and subsidiaries will collect
  and process my information in accordance with Notion’s
  Global Recruiting Privacy Policy and NYLL 144.

  #LI-Onsite

  A Note on AI

  You don’t need deep AI expertise for every role, but we do
  expect every Notino to be intellectually curious, drawn to
  tinkering and discovery, and excited to use AI as a real
  collaborator in their work. For some roles, AI fluency is a
  core requirement — when that’s the case, we'll say so
  explicitly in the qualifications. People who thrive here
  don’t treat AI as a novelty. They use it to think better,
  and make their work easier for others to build on.

