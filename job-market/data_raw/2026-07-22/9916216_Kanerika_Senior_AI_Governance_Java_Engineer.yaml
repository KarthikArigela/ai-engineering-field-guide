description: |
  About the Role:

  We are seeking strong Senior Java + AI Platform Engineers to
  work on strategic enterprise initiatives focused on building
  scalable AI Governance, observability, and Compliance
  platforms.

  The ideal candidate will have strong expertise in Java
  backend engineering, distributed systems, AI integrations,
  telemetry pipelines, and cloud-native architectures. This
  role involves designing scalable enterprise-grade platforms
  capable of monitoring, governing, and securing AI
  interactions across large-scale enterprise environments.

  Key Responsibilities:

  - Design and build pluggable evaluator services using Java and
    Spring Boot

  - Develop scalable SaaS/cloud-native backend services and
    microservices

  - Integrate with AI platforms including AWS Bedrock, Azure AI
    Foundry, Google Vertex AI, OpenAI, and Anthropic APIs

  - Build orchestration frameworks and schedulers for evaluation
    execution workflows

  - Develop AI risk scoring systems and evaluation pipelines

  - Design and implement telemetry, monitoring, and
    observability solutions

  - Build dashboards and reporting systems for evaluation
    results and governance insights

  - Develop integrations/connectors for cloud-native event
    streams and event-driven architectures

  - Collaborate with cross-functional engineering teams in an
    Agile sprint environment

  - Participate in code reviews, CI/CD setup, and quality
    engineering practices

  - Ensure adherence to software development lifecycle and
    engineering best practices

  Requirements

  Required Skills & Qualifications

  - 4–7 years of strong backend engineering experience using
    Java and Spring Boot

  - Proven expertise in SaaS application development and cloud-
    native architecture

  - Strong understanding of REST APIs and microservices
    architecture

  - Hands-on experience with at least one AI platform: - AWS
    Bedrock - Azure OpenAI - Google Vertex AI -OpenAI APIs
  - Experience with cloud SDKs such as AWS SDK for Java, Azure
    SDK, or Google Cloud Java libraries

  - Strong knowledge of CI/CD tools like GitHub Actions,
    Jenkins, or similar

  - Experience with testing frameworks including unit,
    integration, and contract testing

  - Understanding of orchestration/scheduler frameworks such as
    Quartz or Spring Batch

  - Experience with event streaming platforms such as Kafka, AWS
    Kinesis, Azure Event Hub, or GCP Pub/Sub

  - Knowledge of ETL/ELT pipelines and stream processing
    technologies like Flink or Spark Streaming

  - Experience designing schemas and data models for high-volume
    telemetry/time-series data

  - Strong understanding of event-driven architecture and
    connector development

  Preferred Skills

  - Familiarity with LLM evaluation frameworks such as: -RAGAS
    -TruLens -DeepEval
  - Knowledge of AI governance standards and EU AI Act
    requirements

  - Experience with workflow orchestration frameworks

  - Cloud certifications in AWS, Azure, or GCP

  - Exposure to AI risk assessment and governance tooling

  Must-Have Skills (Non-Negotiable)

  - Strong production-grade experience in Java + Spring Boot

  - Experience building multi-tenant SaaS/cloud-ntive
    applications

  - Strong software development lifecycle discipline

  - Hands-on exposure to at least one AI platform

  - REST API and Microservices architecture expertise

  - Experience with AI evaluation/testing frameworks

  - Telemetry and observability engineering expertise

