description: |
  About Town

  Town is an AI-powered assistant that connects to your tools
  to do real work on your behalf -- triaging your inbox,
  drafting in your voice, managing your schedule, and running
  workflows across everything you use. It knows you deeply and
  gets sharper over time.

  About the Role

  The core technical challenge at Town is: context from
  everywhere, action anywhere. The assistant pulls from your
  email, calendar, Slack, docs, and connected tools to build a
  deep understanding of who you are and what you need -- then
  executes reliably across all of them.

  Town is not a chat wrapper. It's a rethinking of email,
  calendar, and contacts through an AI-native lens, a workflow
  builder that lets anyone automate real work, a suggestion
  engine that discovers what to automate before you think to
  ask, and a network of assistants that talk to each other
  across teams and organizations. You'll design and ship the
  experiences that make all of that legible and loved.

  You'll be a foundational hire, working across the full stack
  but anchored on the product. You own features end to end --
  from making tasteful UI/UX decisions to the backend plumbing
  that makes them real. Everyone has direct influence over
  product direction. The bar is high: the product has to feel
  polished, fast, and obviously better than the alternatives,
  on every surface.

  Example projects include...

  - Rethinking email, calendar, and contacts as AI-native
    experiences -- autonomous triage, drafts in your voice,
    100% automated scheduling, an auto-built relationship
    graph
  - Building the suggestion engine -- tasks and workflow
    suggestions to inspire users on what to automate next
  - Designing the workflow builder -- making it trivial for
    anyone to build, share, and install automations
  - Building team and shared workflow surfaces -- one person
    builds, the whole team benefits
  - Building across web, desktop, mobile -- meeting users
    everywhere they work
  - Rethinking approvals, notifications, and the home screen --
    the everyday surfaces that make or break trust in an agent

  You might thrive in this role if you...

  - Are a generalist by choice -- comfortable moving between
    frontend, backend, and infrastructure as the problem
    demands.
  - Are excited about owning surface area end to end in an
    ambiguous, fast-moving environment -- not just executing
    within a defined spec.
  - Have strong product taste and can hold the whole experience
    in your head -- from the pixel to the prompt to the
    database schema. You care about how it feels, not just
    whether it works.
  - Have tuned your AI-native coding workflow that makes you
    dramatically faster and more effective.
  - Have experience with LLM-powered products, agentic UX, or
    any product where non-determinism is a first-class design
    constraint.
  - Have shipped product at a high-growth startup through an
    inflection point -- you were there when the product was
    being defined, not maintained. We want to hear your
    concrete shipping stories.
  - Care about trajectory over tenure. We're less interested in
    years of experience than how fast you got here and what
    you built along the way.
  - Are excited about working in-person, five days a week. We
    believe it matters at this stage.

  Location

  5 days per week in person in either SF or NYC.
