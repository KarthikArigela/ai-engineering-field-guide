description: |
  This role is for one of the Weekday's clients

  Salary range: Rs 1000000 - Rs 1200000 (ie INR 10-12 LPA)

  Experience: 4+ yrs

  Location:Kochi, Bangalore

  Job Type: full-time

  We are seeking a highly skilled AI Engineer to design,
  develop, and deploy enterprise-grade AI solutions powered by
  modern Generative AI technologies. The ideal candidate will
  have strong expertise in Azure OpenAI, Python, and Microsoft
  Copilot, with experience building intelligent applications
  that enhance business productivity and automate complex
  workflows. This role involves collaborating with cross-
  functional teams to deliver scalable AI-powered solutions
  that leverage large language models (LLMs), cloud-native
  services, and modern software engineering practices.

  As an AI Engineer, you will play a key role in developing AI
  applications, integrating Azure AI services, and
  implementing secure, scalable, and production-ready
  solutions. You will work closely with business stakeholders,
  solution architects, developers, and data professionals to
  translate business requirements into innovative AI products
  while ensuring performance, security, and responsible AI
  practices. This position offers an exciting opportunity to
  work on cutting-edge AI technologies and shape the future of
  enterprise intelligent automation.

  RequirementsKey Responsibilities

  - Design, develop, and deploy AI-powered applications using
    Azure OpenAI, Python, and Microsoft Copilottechnologies.
  - Build intelligent copilots, conversational AI solutions, and
    enterprise automation workflows using Large Language
    Models (LLMs).
  - Integrate Azure AI services with enterprise applications,
    APIs, databases, and cloud platforms to deliver scalable
    AI solutions.
  - Develop prompt engineering strategies, retrieval-augmented
    generation (RAG) pipelines, and AI orchestration workflows
    to improve response quality and business outcomes.
  - Collaborate with business stakeholders to understand
    requirements and translate them into practical AI-driven
    solutions.
  - Develop, test, and optimize AI models, APIs, and backend
    services for performance, scalability, and reliability.
  - Implement secure AI architectures while ensuring compliance
    with data privacy, governance, and responsible AI
    principles.
  - Monitor AI application performance, troubleshoot issues, and
    continuously optimize models, prompts, and system
    efficiency.
  - Work closely with DevOps and cloud teams to support
    deployment, CI/CD pipelines, monitoring, and production
    support.
  - Prepare technical documentation, architecture diagrams, and
    implementation guides while contributing to AI best
    practices and knowledge sharing.
  - Stay current with advancements in Generative AI, Microsoft
    AI technologies, Azure services, and emerging industry
    trends to drive continuous innovation.

  What Makes You a Great Fit

  - 4+ years of experience in AI engineering, software
    development, or cloud-based AI solution development.
  - Strong hands-on expertise with Azure OpenAI services and
    enterprise AI application development.
  - Advanced proficiency in Python for AI development,
    automation, API integration, and backend programming.
  - Experience building and customizing Microsoft Copilot
    solutions and AI-powered productivity applications.
  - Solid understanding of Large Language Models (LLMs), prompt
    engineering, RAG architectures, embeddings, and
    conversational AI.
  - Experience integrating AI solutions with Azure cloud
    services, REST APIs, enterprise applications, and data
    platforms.
  - Knowledge of AI security, governance, responsible AI
    practices, and enterprise deployment standards.
  - Familiarity with Azure AI Studio, Cognitive Services,
    Microsoft Graph APIs, and cloud-native development is an
    advantage.
  - Strong analytical, debugging, and problem-solving skills
    with the ability to optimize AI solution performance.
  - Excellent communication and stakeholder management skills
    with the ability to collaborate effectively across
    technical and business teams.
  - Self-motivated, innovative, and passionate about leveraging
    artificial intelligence to solve real-world business
    challenges in a fast-paced environment.
