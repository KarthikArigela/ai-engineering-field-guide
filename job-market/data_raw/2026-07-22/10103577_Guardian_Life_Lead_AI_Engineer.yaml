description: |
  - The employee serves as a Lead AI Engineer responsible for
    architecting, developing, deploying, and supporting
    enterprise-scale Agentic AI solutions.
  - In this role, he designs and implements scalable AI systems
    utilizing Large Language Models (LLMs), retrieval-
    augmented generation (RAG) pipelines, model orchestration
    frameworks, Agentic frameworks, and secure API solutions
    that automate Guardian’s business processes and enhance
    decision-making.
  - He ensures AI solutions comply with enterprise security,
    governance, and compliance requirements.
  - The position requires advanced knowledge of machine learning
    engineering, distributed systems, cloud infrastructure,
    and various AI platforms.
  - He collaborates cross-functionally with data scientists,
    software engineers, infrastructure teams, product teams,
    and business stakeholders to implement AI solutions that
    provide business value for Guardian.
  - The role also includes evaluating emerging technologies,
    contributing to enterprise AI roadmap, and mentoring
    junior engineers. His work directly impacts operational
    efficiency, customer experience, and enterprise automation
    capabilities.
  - The role also includes evaluating emerging technologies and
    building core AI capabilities pursuant to digital
    enterprise roadmap
  - In this role, employee also has to mentor junior engineers.
  - His work directly impacts operational efficiency, customer
    experience, and enterprise automation capabilities.

  Salary Range:

  $118,980.00 - $195,465.00

  The salary range reflected above is a good faith estimate of
  base pay for the primary location of the position. The
  salary for this position ultimately will be determined based
  on the education, experience, knowledge, and abilities of
  the successful candidate. In addition to salary, this role
  may also be eligible for annual, sales, or other incentive
  compensation.

