description: |
  Complexio is the intelligence layer for enterprise AI. Our
  platform builds a connected understanding of how businesses
  actually operate — across people, processes, and systems.

  Enterprises have invested heavily in AI platforms, copilots,
  and data infrastructure — yet daily work still runs on
  manual hand-offs and thousands of unseen tasks buried in
  emails, chats, and spreadsheets. Complexio closes that
  automation gap.

  Our Event Knowledge Graph ingests structured and
  unstructured data to create a living map of how an
  organisation truly works — every task, interaction, and
  dependency. Our Context Broker unifies this knowledge across
  enterprise systems in real time, enabling our Orchestration
  layer and Enterprise Automator to discover, design, and
  execute workflows autonomously. Stevie, our conversational
  AI assistant, gives teams a natural way to query and act on
  that intelligence.

  Complexio deploys securely within your infrastructure and
  integrates with the enterprise platforms you already run on
  — turning organisational knowledge into measurable business
  outcomes.

  A joint venture between Hafnia and Símbolo, backed by
  leading maritime partners including Marfin Management, C
  Transport Maritime, Trans Sea Transport, and BW Epic Kosan.
  Born in maritime, now scaling rapidly across industries.

  As a Senior AI Engineer with broad expertise, you will be a
  vital part of our team, developing innovative applications
  that leverage AI capabilities to enhance user experiences
  and streamline communication. You will work alongside a
  talented team of Data Scientists, DevOps, Product Managers,
  Business Analysts experts and play a key role in designing
  and implementing specialised AI assistant technology.

  Requirements

   You have

  - Excellent problem-solving and technical skills.
  - Strong communication and collaboration skills, with the
    ability to work in a team.
  - Interest and experience in working on early-stage software
    and a wide range of tasks.
  - Proven experience using technology and how it helped you
    build a lasting product.

  Key Responsibilities

  - Collaborate with cross-functional teams to develop key
    features and applications, including product managers,
    designers, and other engineers.
  - Design, develop, and maintain both front-end and back-end
    components of web applications, ensuring a seamless user
    experience.
  - Benchmark, analyze, and optimize web applications for
    scalability, security, and responsiveness.
  - Troubleshoot and resolve software defects and issues,
    ensuring high software quality.
  - Participate in code reviews, documentation, and the
    development of coding standards.

  Requirements

  - Preferred M.Sc or Ph.d degree in Computer Science or a
    related field.
  - 7+ years of experience in Software development
  - Work experience using both compiled languages (Rust, Ocaml,
    Golang, Java, C#) or dynamic languages (Javascript,
    Python, Ruby)
  - Experience building web applications or desktop applications
    technologies such as Electron, tauri, React, Vue.js
  - Familiarity with CI/CD principles and technologies,
    including experience with GitHub Actions or similar.
  - Experience working with Relational and NoSQL databases such
    as Postgres, Redis, Neo4j, Milviousor MongoDB, and a good
    understanding of data consistency tradeoffs.
  - Proven Knowledge of cloud platforms (e.g., AWS, Azure, or
    GCP).

  Benefits

  - Experience with graph databases such as neo4js, pinecone or
    milvious or similar.
  - Experience building native desktop apps.
  - Experience with NLP libraries and frameworks, such as spaCy,
    or Transformers.
  - Familiarity with machine learning concepts and the ability
    to work with NLP datase
