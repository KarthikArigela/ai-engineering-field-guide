description: |
  Job Description SummaryAs a Senior Staff AI Engineer, you’ll
  lead enterprise full stack and AI platform development at
  scale for multiple initiatives across the company. You’ll
  design and ship microservices and REST APIs, build RAG and
  multimodal LLM features, and set standards for AI-assisted
  development. You’ll own technical decisions end-to-end,
  balancing reliability, performance, and cloud cost for AI
  systems. You’ll partner with internal teams and external
  contractors, mentor engineers, and run reviews and
  integrations. You’ll drive Agile practices, establish
  testing for prompts and model performance, and implement
  observability for AI features. We value autonomy, continuous
  learning, and measurable impact.

  Job Description

  Responsibilities:

  - Design, Implement, Fix and Support AI Applications and
    Services.
  - Identify and deliver AI Reusable Services.
  - Ship resilient REST APIs and microservices.
  - Build RAG, Multimodal LLM features and Agents.
  - Design agentic workflows for autonomous tasks.
  - Mentor engineers and provide guidance to contractors and
    partners.
  - Maintain code quality through best practices, unit testing
    and code quality automation
  - Be responsible for providing technical leadership and
    defining, developing, and evolving software in a fast
    paced and agile development environment using the latest
    software development technologies and infrastructure

  Required Qualifications:

  - Bachelor’s degree in computer science, Computer Engineering,
    or a related technical field.
  - 8+ years of experience with at least one general purpose
    programming language (Python [preferred], Java, or Go) and
    front-end experience with JavaScript/TypeScript.
  - Proven track record shipping production applications that
    incorporate LLMs, RAG, MCPs and AI services at scale.
  - Demonstrated experience leading technical teams and
    providing guidance to external contractors or vendors.
  - Strong experience with cloud platforms (AWS, GCP, or Azure)
    and advanced containerization (Docker, Kubernetes).
  - Experience with technical oversight, code review processes,
    and quality assurance methodologies.

  Preferred Qualifications:

  - 13+ years of experience in AI/ML, including architectural
    design, technical leadership, and system optimization.
  - Experience with modern front-end frameworks (React, Vue, or
    Angular) and advanced state management.
  - Experience with vector databases (e.g. Milvus, Pinecone,
    Weaviate, pgvector) and embedding model optimization.
  - Experience with multiple LLM providers and advanced AI-
    orchestration frameworks (e.g. LangChain, LlamaIndex).
  - Experience with enterprise RAG architectures, semantic
    search optimization, and conversation memory management at
    scale.
  - Experience building and scaling AI-powered features for
    100k+ users.

  Additional Information

  Relocation Assistance Provided: Yes
