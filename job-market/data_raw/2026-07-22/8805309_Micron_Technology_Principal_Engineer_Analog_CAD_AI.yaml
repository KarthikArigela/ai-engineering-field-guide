description: |
  Our vision is to transform how the world uses information to
  enrich life for all .  Micron Technology is a world leader
  in innovating memory and storage solutions that accelerate
  the transformation of information into intelligence,
  inspiring the world to learn, communicate and advance faster
  than ever. Role Summary - Responsible for developing and
  implementing end-to-end AI workflows for Analog IP creation,
  including schematic generation, layout, design optimization,
  simulation, verification, and signoff at advanced FinFET
  nodes using available EDA AI tools and collaborating with
  Data Science teams throughout all phases. Job Requirements -
  15+ years of experience in defining Analog and Digital
  design methodologies and flows. Strong proficiency in
  Python, SVRF, SKILL scripting for CAD and automation. Strong
  understanding of transistor-level circuit design, including
  device behavior, biasing, matching, noise, and variability.
  Proven experience architecting custom design and
  verification methodologies for mixed-signal IPs. B.Tech /
  M.Tech / MS in VLSI Design, Microelectronics, or a related
  field. Prior experience applying AI/ML in EDA or design
  automation is a strong plus. About Micron Technology, Inc.
  We are an industry leader in innovative memory and storage
  solutions transforming how the world uses information to
  enrich life for all . With a relentless focus on our
  customers, technology leadership, and manufacturing and
  operational excellence, Micron delivers a rich portfolio of
  high-performance DRAM, NAND, and NOR memory and storage
  products through our Micron® and Crucial® brands. Every day,
  the innovations that our people create fuel the data
  economy, enabling advances in artificial intelligence and 5G
  applications that unleash opportunities - from the data
  center to the intelligent edge and across the client and
  mobile user experience. To learn more, please visit
