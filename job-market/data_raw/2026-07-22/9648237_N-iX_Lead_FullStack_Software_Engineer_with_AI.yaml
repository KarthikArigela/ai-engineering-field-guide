description: |
  About the client:

  Our customer is the European online car market, with over 30
  million monthly users and a presence in 18 countries. As a
  Lead FullStack Engineer, you will play a pivotal role in
  shaping the future of online car markets and enhancing the
  user experience for millions of car buyers and sellers.

  Responsibilities:

  - Developing fast, high-traffic public-facing websites
  - Explore new technologies and help the team to use them
  - Work using AI tools and apply them to the SDLC
  - Following software development best practices while
    delivering the work
  - Following testing principles while testing your own code to
    ensure production readiness
  - Follow the philosophy of: you-build-it-you-run-it (be
    responsible for the SDLC processes)

  Requirements:

  - 5+ years developing reliable, highly available, and scalable
    software systems
  - Strong understanding of software architecture and design
    patterns
  - Firm grasp of clean code principles and coding standards
  - Strong proficiency using AI tooling, such as ChatGPT/Codex,
    for rapid development
  - Experience integrating AI tooling into your development
    environment for streamlined usage
  - Experience with AI Frameworks like Vercel AI SDK, LangChain,
    etc.
  - Strong proficiency with backend development with C# or
    Node.js
  - Strong proficiency with TypeScript
  - Strong proficiency with SQL& NoSQL datastores (GraphQL,
    Redis)
  - Strong proficiency with frontend development (HTML, CSS,
    JavaScript)
  - Strong proficiency with component-based frameworks and SSR
    (Next.js/React or Vue.js) or Angular with the desire to
    learn React/ Vue.js.
  - Hands-on experience developing and maintaining 3rd party
    content management systems
  - Knowledge of modern cloud infrastructures and tools, such as
    AWS, Terraform, and Docker
  - Experience with APIs and developing in a service-based
    application environment
  - Experience building optimized UIs for performance
  - Proficiency with version control systems such as Git
  - Experience working within a formal CI/CD pipeline
  - Experience with logging, monitoring, and alerting services
    like Datadog, Newrelic
  - Solid approach to testing and ensuring quality of code, Unit
    testing, backend, and frontent
  - At least Upper-intermediate English level
  - This role requires mandatory timezone coverage: work must
    align with the Toronto (ET) timezone for LATAM hours and
    13:00–21:00 EET for EU hours approximately.

  We offer*:

  - Flexible working format - remote, office-based or flexible
  - A competitive salary and good compensation package
  - Personalized career growth
  - Professional development tools (mentorship program, tech
    talks and trainings, centers of excellence, and more)
  - Active tech communities with regular knowledge sharing
  - Education reimbursement
  - Memorable anniversary presents
  - Corporate events and team buildings
  - Other location-specific benefits

  *not applicable for freelancers
