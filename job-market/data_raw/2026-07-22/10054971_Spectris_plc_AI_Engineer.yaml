  About us - Malvern Panalytical, Micromeritics and SciAps.
  Together we are a powerful and highly complementary
  combination of market leading technologies.

  We are the toolmakers for the world's most innovative
  companies, academic institutions, and government
  laboratories. We are their partners in discovery.

  Malvern Panalytical instruments analyze the chemical,
  physical and structural nature of materials, from proteins
  to polymers and semiconductors to minerals. Our leading
  technologies measure particle size, shape, concentration and
  zeta potential, biomolecular interactions and stability,
  elemental concentrations and crystallographic structure.

  Micromeritics manufactures systems for the characterization
  of particles, powders, and porous materials for a wide-
  range of end markets including catalysts, chemicals,
  building materials, clean-tech and battery.  Our leading
  technologies measure surface area, porosity, density,
  adsorption and particle activity.

  SciAps specializes in portable X-ray fluorescence (XRF),
  laser-based (LIBS) and near-infrared (NIR) analyzers to
  measure any element in any environment. SciAps is the Center
  of Excellence for our handheld instruments. We have a global
  footprint with R&D and manufacturing sites in North America,
  Europe, and Asia.

  We are more than 2,500 employees in a customer-focused
  organization with sales and service offices in 20 countries,
  all committed to delivering expert and responsive customer
  support.

  We are part of Spectris. Spectris combines precision with
  purpose, delivering progress for a more sustainable world.
  Precision is at the heart of what we do – our leading, high-
  tech instruments and software equip our customers to solve
  some of their greatest challenges to make the world cleaner,
  healthier and more productive.

