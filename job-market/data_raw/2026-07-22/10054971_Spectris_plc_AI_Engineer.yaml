  Become part of making the impossible possible.

  About the role:

  As an AI Engineer, you will play a key role in designing,
  developing, and deploying enterprise-grade Azure AI
  solutions that enable scalable conversational AI,
  intelligent automation, and advanced analytics across
  scientific and business workflows. You will combine hands-on
  engineering with solution design, integrating large language
  models, vector search technologies, data pipelines, and
  cloud services into secure, reliable, and governed
  platforms.

  Working closely with data scientists, product managers,
  engineers, and business stakeholders, you will translate
  complex requirements into practical AI capabilities that
  deliver measurable business value. You will help drive
  innovation through intelligent systems while ensuring that
  solutions are scalable, maintainable, compliant, and aligned
  with organisational architecture and governance standards.

  This is an exciting opportunity for an AI professional who
  is passionate about emerging technologies, enjoys solving
  complex problems, and wants to help shape the future of AI-
  enabled products and services.

  What you'll be doing:

  • Design and implement end-to-end AI solutions using Azure
  AI Foundry, Azure Machine Learning, and Cognitive Services
  to support innovative business and scientific applications •
  Develop, fine-tune, and deploy Large Language Model
  (LLM)-powered chatbots and autonomous AI agents that enhance
  user experiences and business processes • Define, maintain,
  and optimise AI models, data flows, and integration patterns
  across enterprise platforms • Collaborate with data
  scientists, data engineers, product managers, and business
  stakeholders to translate requirements into scalable
  technical solutions • Integrate AI services, vector
  databases, embeddings, and cloud-native technologies into
  secure and resilient architectures • Ensure AI solutions
  comply with governance standards, metadata management
  practices, and traceability requirements • Contribute to the
  continuous improvement of AI platforms, frameworks, and
  engineering practices to drive innovation and operational
  excellence • Support the adoption of AI technologies across
  the business by providing technical expertise and guidance
  to stakeholders and colleagues

  About you:

  • Bachelor's degree in Computer Science, Information
  Technology, or a related discipline, or equivalent practical
  experience • Typically 2+ years of experience in AI
  Engineering, Machine Learning Engineering, or a similar
  industry role • Strong experience designing and deploying
  Azure AI solutions in enterprise environments • Hands-on
  experience with Large Language Models (LLMs), vector
  databases, embeddings, conversational AI, and autonomous
  agent development • Proficiency in Python, PowerShell, SQL,
  JSON, and integrating AI services with wider business
  applications • Understanding of AI governance, metadata
  management, traceability, and responsible AI practices •
  Strong analytical and problem-solving skills with the
  ability to design practical solutions for complex challenges
  • Excellent communication and stakeholder engagement skills,
  with experience collaborating across multidisciplinary teams
  • Azure AI certifications are desirable • Experience in
  scientific, research, or technology-driven environments
  would be advantageous

  What's in It for You

  • Join an ambitious, growing international organisation
  where innovation and technology are central to our success •
  Play a key role in shaping the future of AI solutions that
  create value for customers and the business • Collaborate
  with global teams of engineers, scientists, and technology
  specialists working on cutting-edge projects • Benefit from
  ongoing learning opportunities and professional development
  in one of the fastest-growing technology domains • Enjoy a
  comprehensive and competitive rewards package designed to
  support your wellbeing, growth, and success

