description: |
  About Brain Co.

  Brain Co. is an Applied AI startup founded by Elad Gil and
  Jared Kushner, and backed by many of Silicon Valley’s
  leading builders — including Patrick Collison (CEO of
  Stripe), Andrej Karpathy (Cofounder of OpenAI), Mike Krieger
  (CPO of Anthropic), Kevin Weil (CPO of OpenAI), and Aravind
  Srinivas (CEO of Perplexity).We are building an AI platform
  and applications for the world’s most important institutions
  - delivering impact on real-world problems.Our progress so
  far

  - Automated construction permitting for a sovereign government
    → 80% faster, unlocking $375M+ in value
  - Optimized supply chains for a leading global energy company
    → 30% lower cost, 99% reliability, preventing $100M+ in
    losses
  - Streamlined hospital patient care across national health
    systems → 40% better outcomes, 80% less admin work
  - Raised a $30M Series A from top investors
  - Built a team of 40+ AI experts from Tesla, Google DeepMind,
    NVIDIA, and Databricks

  At Brain Co., your work will be deployed in the real world,
  not stuck in research. We move fast, with more demand than
  we can serve, and are looking for exceptional people to take
  ownership from day one.

  About The Role

  As an AI/ML Engineer at Brain Co., you will play a crucial
  role in deploying state-of-the-art models to automate
  various real world problems in sectors such as healthcare,
  government and energy. Part of the role will involve turning
  research breakthroughs into practical solutions for various
  nation states. This role is your opportunity to make a
  significant impact by making AI technology both accessible
  and influential.

  In This Role, You Will:

  - Innovate and Deploy: Design and deploy advanced LLM models
    to tackle real-world problems, particularly in automating
    complex, manual processes in a range of real-world
    verticals.
  - Optimize and Scale: Build scalable data pipelines, optimize
    models for performance and accuracy, and prepare them for
    production. Monitor and maintain deployed models to ensure
    they continue delivering value across various governments
    worldwide.
  - Make a Difference: Engage in projects including but not
    limited to optimizing the world's most advanced energy
    production systems, modernizing core government workflows,
    or improving patient outcomes in advanced public
    healthcare systems. Your work will directly impact how AI
    benefits individuals, businesses, and society at large.
  - Engage with Leaders: interact directly with government
    officials in various countries and apply the first of its
    kind AI solutions while working alongside experienced ex.
    Founders, AI researchers, and software engineers to
    understand complex business challenges and deliver AI-
    powered solutions. Join a dynamic team where ideas are
    exchanged freely and creativity flourishes. You will be
    able to wear many hats: software building, product
    management, sales, interpersonal skills.
  - Learn and Lead: Keep abreast of the latest developments in
    machine learning and AI. Participate in code reviews,
    share knowledge, and set an example with high-quality
    engineering practices.

  You Might Thrive In This Role If You:

  - Hold a BSc/Master’s/PhD degree in Computer Science, Machine
    Learning, Data Science, or a related field.
  - Have experience building GenAI-focused applications with the
    latest technologies, including but not limited to Agents,
    reasoning models and RAG.
  - Have at least a high level familiarity with the architecture
    and operation of large language models.
  - Have personally implemented models in common ML frameworks
    such as PyTorch, Jax or TensorFlow.
  - Possess a strong foundation in data structures, algorithms,
    and software engineering principles.
  - Exhibit excellent problem-solving and analytical skills,
    with a proactive approach to challenges.
  - Can work collaboratively with cross-functional teams.
  - Thrive in fast-paced environments where priorities or
    deadlines may compete.
  - Are eager to own problems end-to-end and willing to acquire
    any necessary knowledge to get the job done.



  Benefits

  - Competitive salary plus equity
  - Daily lunches
  - Commuter benefits
  - Unlimited PTO



  Why Join Us

  - Ship quickly, iterate constantly and see your work deployed
    at global scale
  - Collaborate with industry veterans from Tesla, DeepMind,
    Databricks, and more
  - Accelerate your career with ownership based on impact, not
    tenure
  - Earn competitive compensation + meaningful equity in a high-
    growth company
  - Thrive in a culture built on speed, curiosity, and impact

  If you want to see your work deployed at scale with real
  impact, Brain Co. is the place to build.

  This is a hybrid role that can be based in our London office
