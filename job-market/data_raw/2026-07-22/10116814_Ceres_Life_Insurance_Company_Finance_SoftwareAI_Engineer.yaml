description: |
  Company Overview

  Westaim and CC Capital have joined forces to strategically
  transform Westaim from a holding company into a global
  alternative credit asset manager with a unique, integrated
  insurance platform, branded as The Westaim Corporation. This
  partnership supports a long-term vision to deliver
  innovative, customized financial solutions across
  alternative credit and insurance, creating scalable growth
  and meaningful client impact.

  Ceres USA Holdings, LLC, part of the insurance platform
  within The Westaim Corporation strategy, is the parent
  company of Ceres Life Insurance—a fast-growing, technology-
  driven annuity carrier startup. Ceres is focused on
  redefining retirement security by combining modern fintech
  capabilities, top-tier talent, and strong vendor
  partnerships to deliver exceptional annuity solutions and
  digital experiences.

  Ceres is deeply committed to a client-centered culture.
  Through its Digital Contact Center and advisor-facing
  platforms, the company delivers proactive, personalized, and
  technology-enabled support that empowers clients and
  advisors while maintaining the highest standards of trust,
  security, and regulatory compliance.

  Position Summary

  The Finance Software / AI Engineer will design, develop, and
  support innovative software solutions, AI-powered
  applications, and automation initiatives across Ceres Life’s
  Finance, Actuarial, and Insurance platforms. Working closely
  with Finance, Actuary, Data Engineering, Technology teams,
  this role will help drive operational efficiency, modernize
  financial and insurance workflows, and deliver AI-powered
  solutions that support business growth, decision-making, and
  customer experience.

  Key Responsibilities

  Software Development & Integration

  - Design, develop, and maintain enterprise applications, APIs,
    and integrations supporting Finance, Accounting, Treasury
    and Actuarial functions.
  - Build scalable cloud-based solutions, internal tools,
    dashboards, and workflow applications.
  - Integrate financial, operational, and third-party systems to
    improve data accessibility and business processes.

  AI & Automation

  - Develop and deploy AI-powered solutions, including
    conversational assistants, document intelligence,
    knowledge search, and workflow automation tools.
  - Leverage Large Language Models (LLMs), prompt engineering,
    and retrieval-augmented generation (RAG) to solve business
    challenges.
  - Automate finance and operational processes such as
    reporting, forecasting, reconciliations, and document
    processing.

  Data & Analytics

  - Partner with Data Engineering and Analytics teams to support
    data pipelines, reporting solutions, and predictive
    analytics initiatives.
  - Develop tools and dashboards that provide actionable
    insights to business and executive stakeholders.
  - Monitor application and AI solution performance and drive
    continuous improvement.

  Collaboration & Governance

  - Collaborate with Finance and Actuarial teams to identify and
    deliver high-impact solutions.
  - Ensure security, privacy, auditability, and regulatory
    compliance across software and AI initiatives.
  - Stay current on emerging technologies and contribute to
    Ceres Life’s innovation and technology roadmap.

  Qualifications

  Technical Expertise

  - 7+ years of experience in Software Engineering, AI
    Engineering, Machine Learning, or related disciplines.
  - Strong proficiency in Python and experience building
    enterprise applications, APIs, and cloud-based solutions.
  - Experience working with Generative AI, LLMs, prompt
    engineering, and AI application development.
  - Familiarity with cloud platforms (AWS, Azure, or GCP), CI/CD
    pipelines, Docker, and modern software development
    practices.

  Finance &Actuarial Experience

  - Experience supporting Finance, Accounting, Treasury, Actuary
    or Wealth Management environments preferred.
  - Understanding of financial reporting, forecasting,
    accounting workflows, regulatory controls, or investment
    operations is highly desirable.
  - Exposure to annuities, insurance products, policy
    administration systems, actuarial processes, or retirement
    services is a plus.

  Professional Skills

  - Strong analytical, problem-solving, and communication
    skills.
  - Ability to translate technical concepts into business value
    and collaborate effectively with cross-functional teams.
  - Self-starter mindset with the ability to thrive in a fast-
    paced, entrepreneurial environment.

  Education

  - Bachelor’s degree in computer science, Engineering, Data
    Science, Information Systems, or a related field.

  Why Join Us?

  Build the Future of Insurance & Finance

  Help shape the technology foundation of a rapidly growing
  insurtech organization while driving innovation across
  finance, operations, and customer experience.

  High-Impact Work

  Develop solutions that directly influence business
  performance, operational efficiency, and strategic decision-
  making.

  AI-Driven Innovation

  Work with cutting-edge AI technologies, cloud platforms, and
  modern software architectures to transform the insurance and
  retirement industry.

  Growth & Leadership Opportunities

  Partner with executive leadership and play a key role in
  defining the future of software engineering and AI
  capabilities at Ceres Life.

  If you're passionate about building modern software
  solutions, leveraging AI to solve business challenges, and
  transforming financial services through technology, we'd
  love to meet you.
