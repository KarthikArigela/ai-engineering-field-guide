description: |
  Req ID: FEQ327R439 x 2 New roles

  Recruiter: Dina Hussain

  Location: London (or surrounding areas)

  At Databricks, our core values are at the heart of
  everything we do; creating a culture of proactiveness and a
  customer-centric mindset guides us to create a unified
  platform that makes data science and analytics accessible to
  everyone. We aim to inspire our customers to make informed
  decisions that push their business forward. We provide a
  user-friendly and intuitive platform that makes it easy to
  turn insights into action and fosters a culture of
  creativity, experimentation, and continuous improvement. You
  will be an essential part of this mission, using your
  technical expertise to demonstrate how our Databricks Data
  Intelligence Platform can help customers solve their complex
  data challenges. You'll work with a collaborative, customer-
  focused team that values innovation and creativity, using
  your skills to create customised solutions to help our
  customers achieve their goals and guide their businesses
  forward. Join us in our quest to change how people work with
  data and make a better world!

  You will be reporting to the Manager, Field Engineering.

  The impact you will have:

  - Form successful relationships with clients throughout your
    assigned territory to provide technical and business value
    in collaboration with an Account Executive and a Senior
    Solutions Architect.
  - Gain excitement from clients about Databricks through hands-
    on evaluation and Spark programming, integrating with the
    wider cloud ecosystem and 3rd party applications.
  - Contribute to building the Databricks technical community
    through engagement at workshops, seminars, and meet-ups.
  - Become a Big Data Analytics advisor on aspects of
    architecture and design.
  - Support your customers by authoring reference architectures,
    how-tos, and demo applications.
  - Develop both technically and in the pre-sales aspect with
    the goal of becoming an independently operating Solutions
    Architect.

  What we look for:

  - Experience, technical customer-facing and with a background
    ideally in Data Science / Generative AI / Machine
    Learning, but will also consider Data Warehousing or Data
    Engineering.
  - You will be working in the following any of the following
    vertical sectors:
  - Any experience in Pre-sales or post-sales experience working
    with external clients
  - Familiarity with working with clients, creating a narrative,
    answering customer questions, aligning the agenda with
    important interests, and achieving tangible outcomes.
  - Ability to independently deliver a technical proposition,
    identify customers' pain points and explain important
    areas for business value to develop a trusted advisor
    skillset.
  - Code in a core programming language such as PySpark, Python,
    Java, or Scala.
  - Knowledgeable in a core Big Data Analytics domain with some
    exposure to advanced proofs-of-concept and an
    understanding of a major public cloud platform (AWS, GCP,
    Azure).
  - Experience diving deeper into solution architecture and
    design.

  - The role requires travel to customer sites in the UK.
    Travelling approx. 20-30% of the time

  - Nice to have: Databricks Certification

  About Databricks

  Databricks is the data and AI company. More than 10,000
  organizations worldwide — including Comcast, Condé Nast,
  Grammarly, and over 50% of the Fortune 500 — rely on the
  Databricks Data Intelligence Platform to unify and
  democratize data, analytics and AI. Databricks is
  headquartered in San Francisco, with offices around the
  globe and was founded by the original creators of Lakehouse,
  Apache Spark™, Delta Lake and MLflow. To learn more, follow
  Databricks on Twitter, LinkedIn and Facebook. Benefits At
  Databricks, we strive to provide comprehensive benefits and
  perks that meet the needs of all of our employees. For
  specific details on the benefits offered in your region
  click here.

