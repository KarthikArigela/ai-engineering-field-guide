title: Solutions Engineer, AI/ML
company: Cake (cake.ai)
location: USA
work_type: FULL_TIME
description: |
  About the Company

  Cake is on a mission to make cutting-edge AI accessible to
  every business. We remove complexity and cost barriers,
  empowering teams to adopt AI/ML faster and more easily.
  Backed by top investors, including Google’s Gradient
  Ventures and Primary Venture. Partners, Cake solves the
  entire AI infrastructure problem for customers 10x faster
  and 10x cheaper than alternatives.

  Our platform comprises four layers: compute infrastructure
  management, open-source components, common integrations, and
  pre-built recipes.

  Security and monitoring are built-in, ensuring a smooth path
  to production. This approach resonates strongly across mid-
  market enterprises, and we’re poised for significant growth
  in the coming year.

  Intensity, humility, and collaboration are the cornerstones
  of our culture. We’re a dynamic team of forward-thinking
  technologists who love to learn from each other and push the
  boundaries of AI at an incredibly fast pace. If you’re
  excited about reshaping the future of AI, we’d love to hear
  from you.

  What You’ll Do

  - Work hands on with customers to deliver high quality
    production-ready AI and Software solutions
  - Drive exceptional customer success as reflected in
    successful implementations and high POC conversion rates,
    renewal rates, and customer satisfaction scores
  - Leverage deep technical expertise to support customers and
    troubleshoot complex issues
  - Work with the product team to prioritize the roadmap based
    on real customer feedback
  - Communicate findings to stakeholders in a clear and concise
    way

  Requirements

  - 6+ years of experience in AI, Data Science, Machine
    Learning, and/or software engineering
  - 2+ years of experience developing AI Solutions, including
    modern Generative AI technologies, such as LLMs, Vector
    DBs, Agent frameworks, Tools, and MCP
  - Strong grasp of the full MLOps lifecycle, including data
    engineering, training/evaluation, serving, and monitoring
  - Experience with cloud platforms (AWS, GCP, Azure) and
    ideally Kubernetes
  - Strong programming skills in Python
  - Proven ability to manage multiple projects and customers
    simultaneously
  - Excellent communication, collaboration, and customer
    relationship management skills

  Benefits

  - Competitive cash compensation
  - Top-tier fully covered medical, dental, and vision insurance
  - Life insurance
  - 401k program

  Additional Perks

  - Unlimited PTO
  - Monthly half day
  - Citi Bike membership
  - Monthly wellness stipend
  - Office equipment stipend, including reimbursement for
    approved disability-related accommodations
  - Investment in employee learning and growth opportunities

  Cake is committed to providing equal employment
  opportunities to all employees and job seekers regardless of
  race, color, religion, national origin, sexual orientation,
  gender, gender identity, marital status, disability, veteran
  status, or any other legally protected category. As an equal
  opportunities employer, we value diversity and its positive
  impact on our culture.

  Cake also complies with the Americans with Disabilities Act
  (ADA). We are dedicated to working with and providing
  reasonable accommodation to job applicants with physical or
  mental disabilities. If you require accommodation, please
  email us at accommodationrequest@cake.ai and we will
  promptly address your request.
