title: "Senior Data Science, AI & Analytics Engineer"
company: Clean Energy
location:
work_type: FULL_TIME
description: |
  About Clean Energy Fuels

  Clean Energy Fuels is North America's largest provider of
  renewable natural gas (RNG) and alternative fueling
  solutions for the transportation industry. We operate a
  nationwide network of fueling infrastructure that supports
  fleets across transit, trucking, municipal services,
  airports, waste management, and other critical industries.

  At Clean Energy Fuels, we are investing in next-generation
  analytics, AI, Industrial IoT, cloud platforms, and
  intelligent automation to improve operational performance,
  increase reliability, enhance decision-making, and support
  our mission of delivering cleaner transportation energy
  solutions.

  This is not a traditional reporting or analytics role. It is
  an opportunity to build practical AI solutions, intelligent
  automation capabilities, modern data products, and
  operational intelligence platforms that support real-world
  business operations, connected assets, field teams, and
  enterprise decision-makers across North America.

  We offer a competitive compensation and benefits package
  with compensation between $140,000 -$150,000 for well
  qualified candidates.

  As part of the IoT, Data Science & Advanced Analytics team,
  you will work on initiatives that directly impact
  operations, supply chain, finance, environmental reporting,
  asset performance, predictive maintenance, and business
  productivity.

  Why Join Clean Energy?

  At Clean Energy, your work won't disappear into another
  advertising algorithm or consumer application. You'll have
  the opportunity to solve meaningful business challenges
  using AI, analytics, automation, and IoT technologies that
  directly impact real-world operations, sustainability
  initiatives, and critical infrastructure across North
  America.

  As part of the IoT, Data Science & Advanced Analytics team,
  you'll work at the intersection of:

  • Artificial Intelligence and Intelligent Automation

  • Industrial IoT and Operational Intelligence

  • Advanced Analytics and Data Science

  • Cloud Data Platforms and Modern Data Engineering

  • Predictive Maintenance, Digital Twin and Asset Performance
  Management

  • Enterprise Reporting and Business Intelligence

  • Digital Transformation and Process Automation

  You will help build solutions that support hundreds of
  connected assets, operational facilities, business
  processes, and decision-makers across the organization.

  This role offers the opportunity to work with modern
  technologies including Azure Databricks, Generative AI, AI
  Agents, Power BI, Grafana, cloud analytics platforms,
  enterprise and third-party APIs, IoT telemetry, streaming
  data, and intelligent automation capabilities while
  partnering directly with business leaders and operational
  teams.

  If you enjoy solving complex problems, building practical AI
  solutions, modernizing business processes, and creating
  technology that delivers measurable business value, you'll
  find a unique opportunity to make a significant impact at
  Clean Energy.

  Position Summary

  Reporting to the Director, IoT, Data Science & Advanced
  Analytics, the Senior Data Science, AI & Analytics Engineer
  is a hands-on technical role responsible for designing,
  developing, and supporting artificial intelligence,
  intelligent automation, data engineering, analytics, and
  operational intelligence solutions across Clean Energy
  Fuels.

  The successful candidate will work across the full solution
  lifecycle—from business requirements and architecture
  through development, deployment, and support—to deliver
  scalable solutions that improve operational visibility,
  automate business processes, enhance reporting capabilities,
  and enable data-driven decision making.

  This role combines data engineering, AI enablement, cloud
  technologies, enterprise integrations, operational
  intelligence, and IoT analytics to solve complex business
  challenges across multiple functions of the organization.

  Key Responsibilities

  Data Engineering, Integration & Intelligent Automation

  • Design, develop, and maintain scalable data pipelines,
  enterprise data products, APIs, integrations, and analytics
  solutions using Azure Databricks, SQL, Python, and cloud-
  based technologies.

  • Develop and support data integration frameworks connecting
  ERP systems, operational platforms, financial applications,
  IoT devices, external systems, and third-party data
  providers.

  • Design and maintain secure API-based integrations that
  enable efficient data exchange across enterprise
  applications and business processes.

  • Develop trusted, reusable, and governed datasets that
  support reporting, analytics, AI, automation, and
  operational intelligence initiatives.

  • Implement modern data engineering practices including data
  quality validation, automated testing, monitoring,
  observability, lineage tracking, and performance
  optimization.

  • Improve scalability, reliability, maintainability, and
  security of enterprise data and analytics platforms.

  • Modernize manual, spreadsheet-based, and legacy business
  processes through automation and cloud-based solutions.

  AI & Intelligent Automation

  • Design, develop, and support AI-enabled solutions that
  improve productivity, operational efficiency, and business
  decision-making.

  • Build intelligent automation workflows using Generative
  AI, machine learning, AI agents, APIs, workflow
  orchestration, and enterprise data platforms.

  • Develop AI-powered assistants, custom copilots,
  recommendation engines, knowledge solutions, and decision-
  support capabilities.

  • Integrate AI services and intelligent automation into
  enterprise applications, reporting solutions, and
  operational workflows.

  • Develop predictive analytics, intelligent auditing,
  anomaly detection, forecasting, optimization, and
  recommendation solutions.

  • Identify opportunities to reduce manual effort through
  automation and AI-driven process transformation.

  • Collaborate with business stakeholders to evaluate,
  prioritize, and implement high-value AI initiatives.

  • Support AI governance, monitoring, testing, and continuous
  improvement to ensure scalable and responsible AI adoption.

  IoT & Operational Intelligence

  • Design and support data pipelines and analytics solutions
  that leverage IoT, telemetry, operational, and industrial
  data sources.

  • Develop near real-time operational monitoring, alerting,
  and intelligence capabilities that improve visibility into
  business and field operations.

  • Support predictive maintenance, condition-based
  monitoring, asset performance management, and operational
  optimization initiatives.

  • Build scalable streaming and event-driven data solutions
  capable of processing high-volume operational and telemetry
  data.

  • Develop dashboards, analytics, and operational
  intelligence solutions that provide visibility into asset
  health, utilization, reliability, performance trends, and
  business KPIs.

  • Collaborate with Operations, Engineering, and business
  teams to identify opportunities to improve efficiency,
  reduce downtime, and optimize performance through data, AI,
  and automation.

  • Support the evolution of connected asset, digital
  operations, and industrial intelligence capabilities across
  Clean Energy's fueling and operational network.

  Data Governance & Quality

  • Support enterprise data governance, reporting
  certification, and data quality initiatives.

  • Develop automated monitoring, validation, reconciliation,
  and exception-reporting capabilities.

  • Assist with metadata management, lineage tracking,
  documentation, and governance practices.

  • Partner with business stakeholders to improve the
  accuracy, consistency, reliability, and trustworthiness of
  enterprise data assets.

  Business Intelligence & Analytics

  • Power BI development.

  • Semantic model and dataset development.

  • DAX and Power Query.

  • Dashboard design and optimization.

  • Reporting automation and self-service analytics.

  Solution Delivery

  • Translate business requirements into practical and
  scalable technical solutions.

  • Participate in all phases of solution delivery including
  discovery, design, development, testing, deployment, and
  production support.

  • Collaborate closely with cross-functional teams to ensure
  solutions align with business objectives.

  • Contribute to technical documentation, knowledge sharing,
  and continuous improvement initiatives.

  Technical Skills

  Data Engineering & Integration

  • Advanced SQL development and optimization.

  • Strong Python programming skills.

  • ETL/ELT pipeline design and development.

  • API design, integration, and data exchange patterns.

  • Data modeling and transformation techniques.

  • Structured and semi-structured data processing.

  • Power BI development and administration.

  • Semantic model development.

  • DAX and Power Query.

  Cloud & Analytics Platforms

  • Azure Databricks.

  • Delta Lake and Lakehouse architecture.

  • Unity Catalog.

  • Databricks Workflows.

  • Cloud-based storage and integration technologies.

  • Azure DevOps, DataOps, CI/CD, and platform automation.

  Artificial Intelligence & Automation

  • Generative AI technologies and AI-assisted workflows.

  • AI agents, copilots, intelligent automation, and workflow
  orchestration.

  • Machine learning and predictive analytics.

  • Statistical analysis and data science methodologies.

  • Model deployment, monitoring, and lifecycle management.

  IoT & Operational Analytics

  • IoT, telemetry, industrial, or operational data
  environments.

  • Streaming and near real-time data processing.

  • Operational intelligence and monitoring solutions.

  • Predictive maintenance and asset monitoring.

  Professional Competencies

  Business & Technical Execution

  • Ability to independently manage technical workstreams from
  concept through deployment and support.

  • Strong organizational skills with the ability to manage
  multiple priorities simultaneously.

  • Focus on delivering business value through practical and
  scalable solutions.

  Problem Solving & Solution Design

  • Ability to translate complex or ambiguous business
  requirements into actionable technical solutions.

  • Strong analytical and troubleshooting skills across data,
  analytics, and platform environments.

  • Comfortable working across both technical and business
  domains.

  Communication & Collaboration

  • Ability to communicate effectively with technical and non-
  technical audiences.

  • Strong stakeholder engagement and relationship-building
  skills.

  • Collaborative approach to solution development and problem
  solving.

  Continuous Improvement

  • Proactively identifies opportunities to improve
  automation, efficiency, data quality, and reporting
  capabilities.

  • Maintains awareness of emerging technologies, analytics
  techniques, and AI capabilities.

  • Committed to learning, innovation, and continuous
  improvement.

  Qualifications

  Required

  • 7–10+ years experience

  • Enterprise-scale data platforms

  • Cloud analytics architecture

  • API integration development

  • Advanced SQL and Python

  Preferred

  • Power BI administration and governance experience.

  • PySpark and distributed processing experience.

  • Data governance and data quality experience.

  • Experience supporting AI and machine learning solutions.

  • IoT, telemetry, or operational analytics experience.

  • Experience with enterprise data modernization initiatives.

  Why Join Our Team?

  This role offers the opportunity to work on a diverse
  portfolio of high-impact initiatives spanning data
  engineering, AI, analytics, automation, operational
  intelligence, and digital transformation. You will
  contribute to projects involving Azure Databricks, Power BI,
  enterprise reporting, AI-powered automation, predictive
  analytics, IoT data platforms, data governance, and cloud
  analytics solutions.

  Working alongside business and technology teams across the
  organization, you will help modernize data processes,
  enhance analytical capabilities, improve decision-making,
  and support Clean Energy Fuels' continued investment in
  data, analytics, and AI-driven innovation.

  Supervisory Responsibilities

  This position has no supervisory responsibilities.

  Qualifications

  To perform this job successfully, an individual must be able
  to perform each essential duty satisfactorily. The
  requirements listed below are representative of the
  knowledge, skill, and/or ability required. Reasonable
  accommodation may be made to enable individuals with
  disabilities to perform the essential functions.

  Quality: Consistently produces high quality work (accurate,
  neat, and thorough). Strives to improve productivity,
  processes, and quality. Demonstrates strong knowledge and
  skills related to the job. Presents a professional image
  with dress, demeanor, and manners. Maintains clean
  workspace, company equipment, and company vehicles. Safety
  is a high priority; performs job safely.

  Communication: Communicates clearly, concisely, effectively,
  professionally and timely. Exhibits good listening and
  comprehension skills. Keeps others appropriately informed
  and shares ideas even when unpopular. Listen to what others
  have to say. Maintains open and active communication with
  colleagues. Effectively uses knowledge and experience in
  asking, probing, and anticipating issues to ensure quality
  is provided.

  Teamwork: Fosters the spirit of working with each other.
  Displays respect, courtesy, politeness, tact, and openness.
  Handles conflict in an appropriate and professional manner.
  Builds relationships, promotes cohesiveness, models
  collaboration with others. Considers impact and issues for
  our customer and other departments. Engages other impacted
  departments early for solutions.

  Persistence: Develops workable alternatives and solutions.
  Exhibits persistence in following assignments through
  completion. Promote process improvements.

  Reliable: Responds in a timely manner. Is honest, ethical,
  value-driven and trustworthy. Keeps commitments made,
  completes assignments, and meets deadlines. Accountable--
  Takes responsibility for your own actions and performance.
  Meets attendance and punctuality guidelines. Available and
  accessible.

  Entrepreneurial: Takes initiative and appropriate action. Is
  engaged and committed to achieving the company’s mission.
  Pursues better ways to get things done and takes appropriate
  risks. Keeps up to date with competitor information and
  market trends. Controls costs and thinks in terms of profit,
  loss and added value. Is committed to the satisfaction of
  customers.

  Passion: Is excited and creates enthusiasm about the
  company’s future. Promotes a sense of company pride.
  Displays sense of pride in the department and its
  contributions. Displays passion for the job.

  Physical Demands

  The physical demands described here are representative of
  those that must be met by an employee to successfully
  perform the essential functions of this job. Reasonable
  accommodations may be made to enable individuals with
  disabilities to perform the essential functions.

  While performing the duties of this Job, the employee is
  regularly required to use hands to finger, handle, or feel;
  reach with hands and arms and talk or hear. The employee is
  frequently required to walk and sit. The employee is
  occasionally required to stand. The employee must
  occasionally lift and/or move up to 25 pounds. Specific
  vision abilities required by this job include close vision,
  distance vision, color vision, peripheral vision, depth
  perception and ability to adjust focus. Always practice good
  judgment and refer to the safety guidelines.

  Work Environment

  The work environment characteristics described here are
  representative of those an employee encounters while
  performing the essential functions of this job. Reasonable
  accommodations may be made to enable individuals with
  disabilities to perform the essential functions. Always
  practice good judgment and refer to the safety guidelines.

  The noise level in the work environment is usually moderate.

