description: |
  At PointClickCare our mission is simple: to help providers
  deliver exceptional care. And that starts with our people.
  As a leading health tech company that’s founder-led and
  privately held, we empower our employees to push boundaries,
  innovate, and shape the future of healthcare.

  With the largest long-term and post-acute care dataset and a
  Marketplace of 400+ integrated partners, our platform serves
  over 30,000 provider organizations, making a real difference
  in millions of lives. We also reinvest a significant
  percentage of our revenue back into research and
  development, ensuring our employees have the resources to
  innovate and make a lasting impact. Recognized by Forbes as
  a top private cloud company and honored as one of Canada’s
  Most Admired Corporate Cultures, we offer flexibility,
  growth opportunities, and meaningful work.

   At PointClickCare, we empower our people to be the
  architects of a smarter healthcare future; one that is
  human-first and accelerated by AI to create meaningful and
  lasting change. Employees harness AI as a catalyst for
  creativity, productivity, and thoughtful decision-making. By
  integrating AI tools into our daily workflows, collaboration
  is enhanced, outcomes are improved, and every team member
  has the proficiency to maximize their impact. It all starts
  with our hiring practices where we uncover AI expertise that
  complements our mission, and we continue to invest in
  training and development to nurture innovation throughout
  the employee journey.

  Join us in redefining healthcare — so it doesn’t just
  survive, it thrives. To learn more about PointClickCare,
  check out Life at PointClickCare and connect with us on
  Glassdoor and LinkedIn.

  **Travel to Office expectations**

  For Remote Roles: If this role is remote, there will be in-
  office events that will require travel to and from the
  Mississauga and/or Salt Lake City office. These will
  include, but not limited to, onboarding, team events, semi-
  annual and annual team meetings.

  For Hybrid Roles: If this role is Hybrid, there will be an
  expectation to reside within commutable distance to the
  office/location specified in the job listing. This will
  include, but not limited to, weekly/bi-weekly/monthly events
  in the office with your specific team. This is a requirement
  for this role.

   What your day-to-day will look like:

  · Identify, prioritize and execute tasks in the software
  development life cycle

  · Work with business to iterate over software requirements

  · Develop tools and applications by producing clean,
  efficient code

  · Automate tasks through appropriate tools and scripting

  · Analyze and debug systems

  · Perform validation and verification testing in a test-
  driven manner

  · Review the work of others, and invite others to review
  your work

  · Collaborate with internal teams and vendors to fix and
  improve products

  · Ensure software is up-to-date with latest technologies



  What qualifications we’re looking for:

  · Experience writing clean code that performs well at scale
  using Java (or other functional or object-oriented
  languages).

  · Experience with Azure cloud services or equivalent

  · Experience with cloud native streaming using Azure Event
  Hub/Service Bus (or others, such as AWS Kinesis, Google
  Pub/Sub)

  · In-depth knowledge of relational databases (e.g. Microsoft
  SQL Server, PostgreSQL)

  · Experience with GitHub Actions, Jenkins CI/CD pipeline

  · Experience with Spring Boot

  · Solid experience writing RESTful API endpoints



  Absolutely love TDD and have working knowledge of it

  · Proficient in GIT

  · Experience using system and performance monitoring tools
  (e.g. Azure Log Analytics,       Grafana, DataDog)

  · Experience with automated testing frameworks (e.g.
  Selenium, Cypress,Jest, Playwright)

  · Excellent organization, critical-thinking and personal
  leadership skills

  · Self-starter with the ability to deliver with minimal
  supervision

  · Being okay with the uncomfortable feeling that comes from
  learning new things

  · Team player

  · Analytical mind with problem-solving aptitude

  · BSc/BA in Computer Science or a related degree



  Generative AI Code Assistants

  - Use of Generative AI Code Assistants (e.g. GitHub Copilot)
    is a must and working      knowledge of spec-driven
    development. Daily application of the latest Generative AI
    Model capabilities is a must.

  - Extensive experience building and maintain AI platform
    infrastructure, Kubernetes, and container security.

  - Demonstrated expertise in observability, and monitoring
    frameworks, with a focus on real-time performance (i.e:
    experience with OpenTelemetry, NLPFlow).

  - Experience with AI infrastructure components such as vector
    databases, prompt/versioning stores, and AI IDEs.



  Bonus points for:

  · Experience with Kafka, or Kafka compatible platforms (e.g.
  Redpanda, WarpStream, or others)

  · Experience with integration engines such as Rhapsody,
  Mirth, or others

  · Experience with message brokers such as RabbitMQ·

  · Experience with Docker, Kubernetes and Istio

  · Experience with Ansible

  · Experience with SAML, OAuth and OpenID Connect

  · Experience working on a SaaS product

  · Experience with Service Oriented Architecture

  · Knowledge of scripting languages such as Python,  Bash

  - Familiarity with vLLM, SGLang or similar framework to host
    LLM inference workloads.

  - Experience with CI/CD pipelines and automation for AI model
    deployment and platform operations

  - Strong knowledge of authentication and authorization
    frameworks integrated into AI platforms.

