    achieve your career goals.
  - Rewards: Comprehensive benefits and wellness packages, 401K
    with company match, and competitive pay and paid time off.
  - Community: Award-winning culture of innovation and a
    military-friendly workplace.

  OWN YOUR OPPORTUNITY:

  - Explore a career in program management at GDIT and you’ll
    find endless opportunities to grow alongside colleagues
    who share your passion for the mission and delivering
    results.

