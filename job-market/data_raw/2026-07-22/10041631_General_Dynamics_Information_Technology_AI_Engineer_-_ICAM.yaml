  Job Description:

  As an AI Engineer for the ICAM program, you will be
  responsible for researching, designing, developing, and
  implementing Artificial Intelligence (AI) solutions that
  enhance Identity, Credential, and Access Management (ICAM)
  capabilities across the Department of War enterprise.

  You will work with identity architects, cybersecurity
  engineers, data analysts, software developers, and mission
  stakeholders to identify opportunities where AI can improve
  identity analytics, access governance, operational
  efficiency, cybersecurity, and decision support.

  This position is 100% remote. MEANINGFUL WORK AND PERSONAL
  IMPACT: This role will help establish and mature AI
  capabilities across the ICAM ecosystem by leveraging machine
  learning, generative AI, predictive analytics, natural
  language processing, and intelligent automation
  technologies. The AI Engineer will support the full
  lifecycle of AI initiatives from concept development and
  experimentation through production implementation and
  sustainment while ensuring compliance with DoW security
  requirements and responsible AI principles.

  - Design, develop, test, and implement AI and machine learning
    solutions supporting enterprise ICAM objectives.
  - Identify opportunities to improve identity governance,
    access management, onboarding processes, and operational
    workflows through AI-driven capabilities.
  - Develop predictive analytics, anomaly detection, behavioral
    analysis, and risk-scoring models using identity and
    access management data.
  - Support the implementation of Generative AI solutions, Large
    Language Models (LLMs), Retrieval Augmented Generation
    (RAG), and intelligent assistants to improve operational
    efficiency and user support.
  - Analyze large volumes of authentication, authorization,
    audit, entitlement, and access governance data to identify
    trends, risks, and actionable insights.
  - Collaborate with engineers and architects to integrate AI
    capabilities into existing ICAM platforms and enterprise
    services.
  - Evaluate emerging AI technologies and recommend solutions
    applicable to ICAM, Zero Trust, and cybersecurity use
    cases.
  - Develop proof-of-concepts, prototypes, and pilot programs to
    validate AI capabilities before enterprise adoption.
  - Support creation of AI governance processes, model
    validation procedures, and responsible AI controls.
  - Develop technical documentation, architecture artifacts,
    implementation plans, and operational procedures.
  - Participate in Agile development activities including sprint
    planning, backlog refinement, demonstrations, and
    retrospectives.
  - Collaborate with cybersecurity teams to ensure AI
    capabilities align with DoW security requirements, privacy
    protections, and risk management frameworks.
  - Support data preparation, feature engineering, model
    evaluation, tuning, and performance monitoring activities.
  - Provide technical leadership and subject matter expertise
    regarding AI technologies and industry best practices.

  WHAT YOU’LL NEED TO SUCCEED (Required): Bring your expertise
  and drive for innovation to GDIT. The AI Engineer must have:

  Education & Experience: Bachelor’s Degree and a minimum of 8
  years’ experience required.  An additional 4 years of
  experience may be substituted in lieu of degree.

  Clearance: Minimum of an active Secret security clearance
  required.

  Certification: Minimum of an active CompTIA Security+
  certification or higher.

  Technical Skills:

  - 5+ years of experience in artificial intelligence, machine
    learning, data science, advanced analytics, or software
    engineering.
  - Experience designing, developing, or implementing enterprise
    AI solutions.
  - Strong experience with Python and AI/ML development
    frameworks.
  - Experience with machine learning libraries such as
    TensorFlow, PyTorch, Scikit-learn, Hugging Face, or
    equivalent technologies.
  - Experience developing and implementing Large Language Model
    (LLM) solutions, prompt engineering techniques, and
    Retrieval Augmented Generation (RAG) architectures.
  - Experience with natural language processing (NLP), semantic
    search, vector databases, and knowledge retrieval
    technologies.
  - Experience working with structured and unstructured
    datasets, data preparation, model training, and
    performance evaluation.
  - Understanding of statistical analysis, predictive modeling,
    classification, clustering, and anomaly detection
    techniques.
  - Experience integrating AI solutions with enterprise
    applications, APIs, and business processes.
  - Familiarity with Microsoft Azure AI Services, Azure OpenAI,
    AWS Bedrock, Anthropic, OpenAI, or equivalent AI
    platforms.
  - Proven track record supporting enterprise IT customers,
    preferably within DoW or Federal Government environments.

  GDIT IS YOUR PLACE: At GDIT, the mission is our purpose, and
  our people are at the center of everything we do.

  - Growth: AI-powered career tool that identifies career steps
    and learning opportunities.
