title: Staff Software Engineer (AI Governance)
company: Coder
location: USA
work_type: FULL_TIME
description: |
  We’re looking for a Staff Software Engineer to help shape AI
  governance for developer tooling at Coder. This role sits on
  our AI Governance team, which builds and maintains two
  enterprise-grade components of Coder's AI governance stack.

  AI Gateway is a centralized LLM gateway that sits between
  coding agents and providers such as OpenAI or Anthropic,
  providing organizations with audit trails, token tracking,
  cost control, and centralized authentication. Agent Firewall
  wraps those agents with default-deny network policies,
  controlling which domains and methods they can reach inside
  workspaces.

  This team works across the full stack - from Go backend and
  React frontend to integrating with LLM provider APIs. Day to
  day, you'll be shipping features, hardening security
  boundaries, collaborating with enterprise customers on real-
  world policy needs, and contributing to Coder's open-source
  ecosystem.



  What you'll do here

  - Design and build product features that push the standard for
    remote development in self-hosted environments
  - Create and improve upon popular open source projects that
    integrate with VS Code, JetBrains, and other developer
    tools
  - Champion best practices to both internal team members and
    external contributors
  - Collaborate with Product and Design teams at Coder, as well
    as with partners like JetBrains, to execute key product
    integrations
  - Document the design, implementation, and operations of
    systems for knowledge sharing within the team
  - Work alongside Customer Success teams to support Coder’s
    enterprise user base
  - Work with cutting-edge AI technologies to create seamless,
    painless developer experiences
  - Rapidly iterate from prototype to implementation in a highly
    adaptive, reactive team environment

  What we're looking for

  - 8+ years of full-stack experience writing code in a
    professional setting, with 1+ year(s) writing Go (ideally
    in current or most recent position)
  - Proficiency in building distributed systems in Go
  - Excellent verbal and written communication skills
  - Exceptional debugging and troubleshooting skills, and the
    tenacity to drive a solution to a conclusion
  - You are self-motivated with a creative and analytical
    mindset



  Our tech stack

  - Frontend: Typescript, React, Vite
  - Backend: Go, Postgres, GCP, Kubernetes, gRPC
  - Observability: Prometheus, Grafana
  - CI/CD: GitHub Actions
  - General: GitHub, Slack, Discord, Notion



  Bonus tacos if you have

  - (Tacos? If you need an ice-breaker, ask how we say thanks by
    giving tacos!)
  - Experience with TypeScript and React
  - You have a background in developer tooling, platform
    engineering, or IaC
  - You have a curiosity about the latest tech trends and what
    is going on in the world of developer tools

  About Coder

  Coder is an AI software development company leading the
  future of autonomous coding. We empower teams to build
  software faster, more securely, and at scale through the
  collaboration of AI coding agents and human developers. Our
  mission is to make agentic AI a safe, trusted, and integral
  part of every software development lifecycle.

  Our self-hosted AI Development Environment is the foundation
  for deploying agentic AI in the enterprise. It provides a
  secure, standardized, and governed workspace to deploy
  autonomous coding agents alongside human developers,
  accelerating innovation while maintaining control and
  compliance. Coder's isolated, policy-driven environments
  improve productivity, cut cloud costs, and reduce data
  risks. Developers transition to AI at their own pace using
  their own tools. Platform and security teams can govern,
  audit, and manage a great developer experience at scale.

  Interview process

  We believe that the interview process should be transparent,
  consistent, and enjoyable. We value your time and hope to
  complete the interview process in two to four weeks, if
  schedules allow. Through your interviews, you will meet a
  mix of individual contributors, managers, and senior
  leaders.

  AI use during the interview process

  As an AI company, Coder embraces the use of AI tools, and we
  want to be transparent about our expectations as you
  navigate our interview process.

  Not permitted: Using AI assistance during conversational
  interviews.

  Permitted: Using AI tooling for take-home assessments.
  Please flag where and to what extent it was used in your
  take-home. Your submission will not be penalized for using
  AI as long as it is done honestly.

  Our use of AI in hiring

  We use AI tools to help manage our recruitment process
  efficiently and fairly. Specifically:

  - Ashby helps us review inbound applications by surfacing
    candidates who best match the role requirements we've
    defined. This tool does not make hiring decisions - it
    helps our team prioritize which applications to review
    first.
  - Granola takes notes during our interview calls so our team
    can focus on the conversation with you.

  All hiring decisions are made by humans. Our team reviews
  applications, conducts interviews, and makes final
  selections. AI tools assist us but never replace human
  judgment, and these practices are conducted in compliance
  with applicable data protection, AI governance, and labor
  laws. Your data is not used to train AI models.

  In accordance with New York City Local Law 144, an
  independent bias audit has been conducted on "Automated
  Employment Decision Tools"; results are available for Ashby.

  If you're applying for a role at Coder and have questions
  about how we use AI in our process, or if you'd like to
  request information about the data we collect, please
  contact careers@coder.com.



