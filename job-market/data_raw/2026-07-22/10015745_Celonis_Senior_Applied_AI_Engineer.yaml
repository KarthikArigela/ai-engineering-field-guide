title: Senior Applied AI Engineer
company: Celonis
location: New York, USA
work_type: FULL_TIME
company_size: 3,000 Employees
description: |
  Celonis is the global leader in Process Intelligence and the
  pioneer of Process Mining technology. As one of the world’s
  fastest-growing enterprise SaaS companies, we are
  changemakers pushing the boundaries of what’s possible. We
  invest heavily in advanced AI capabilities—specifically our
  Process Intelligence Graph—to turn data insights into
  immediate business action. We believe there is a massive
  opportunity to unlock global productivity and sustainability
  by placing intelligence at the core of every business
  process. Join our mission to make processes work for people,
  companies, and the planet.

  The Role:

  As a Lead Applied Value Engineer, you are spearheading our
  mission of solving critical operational challenges for
  enterprise customers. You will be working with strategic
  clients to understand their unique objectives, from
  modernizing legacy systems to optimizing finance processes
  and deploying an agentic business. In partnership with the
  Celonis Sales Teams, you have full responsibility for the
  end-to-end value journey of our customers. You are our
  customers' trusted advisor and help them drive adoption and
  realize measurable business value using Celonis.

  You can expect to blend process and industry expertise with
  a solution-first mindset, analyzing customer data and
  deploying tactical solutions. By using the Celonis Process
  Intelligence platform to feed critical operational context
  to AI and LLM tools, you will help our customers move past
  simple automation to deploy intelligent, autonomous agents
  that solve complex business bottlenecks. You’re the Celonis
  expert, connecting the dots between their pain points and
  how our platform can solve the problem. You’d be managing
  weekly cadences, QBRs, and value plans to demonstrate the
  value of our solutions to VP+ level executives.

  Key Responsibilities:

  - Pre- and Post-Sales Execution: Actively drive the full
    customer lifecycle. Lead technical discovery and
    capability demonstrations during the pre-sales expansion
    cycles and remain deeply involved post-sale to guide
    implementation, ensuring agreed value and adoption
    thresholds are successfully met.

  Insights framing and value realization: Owns driving
  enterprise-wide ROI and adoption programs. Increasingly
  accelerates customer autonomy with improved cadences and
  executive sponsorship through QBRs, strategic roadmaps, and
  enterprise-wide value opportunities. Enables cross-
  functional alignment and establishes repeatable frameworks
  for customers to independently track, realize, and expand on
  business value.Domain & Industry Leadership:  Serve as the
  internal and external technical subject matter expert for
  your customer industry domain to scale knowledge across the
  organization.

  - AI Discovery & Solutioning: Understand your customers' AI
    strategies and specific challenges. As a Celonis product
    expert, find the best problem-solution fit and translate
    customer requirements into innovative solutions that
    deliver measurable impact.

  Requirements:

  - 4+ years of experience in pre-sales, customer success,
    and/or consulting functions with a background in pre/post-
    sales consulting, strategy consulting, business process
    improvement, digital transformations, or customer value
    realization
  - Strong Technical Skills across Microsoft or competitor
    equivalent (e.g., AWS) certification in relevant
    technologies (e.g. Azure, Data Engineering..etc).
    Knowledge of Data Connections, Data Objects, Data
    Validation and Data Analysis. Knowledge and use of LLM’s,
    across Microsoft or competitor equivalent (e.g. Claude,
    Copilot…etc). Understanding of basic prompting and data
    constructs within a prompt.
  - Value driven selling through expertise in identifying and
    prioritising use cases, implementing improvement measures
    and becoming a change agent for the customer by
    establishing an operating model and training users for the
    customer to realize value and renew/expand their
    subscription with Celonis
  - Project Management: You are able to plan and manage project
    scope, expectations and timelines. You will need to manage
    multiple projects across your aligned accounts that will
    be at different parts of the value journey. Also, you will
    leverage partners from the Celonis Ecosystem wherever
    possible.
  - Strong presentation skills to both internal and external
    stakeholders, whether leading technical whiteboarding
    sessions or formal readouts and demos.
  - Bachelor’s Degree required; Focus in computer science,
    engineering, mathematics, or related fields, or equivalent
    work experience preferred.

   Nice to have (big plus):

  - Understanding of business processes across sectors (such as
    Supply Chain or Finance) with the ability to translate
    high-level business needs into specific AI use cases.
  - Good knowledge of Python and common ML libraries (such as
    LangChain, pandas, sklearn, PyTorch) as well as data
    engineering tools and technologies.
  - Hands-on experience building agentic systems using LLM
    orchestration, RAG, function calling, and prompt
    engineering, while ensuring safety through rigorous
    evaluations and guardrails.

  Visa sponsorship is not offered for this role.

  The base salary range below is for the role in the specified
  location, based on a Full Time Schedule.  Total compensation
  package will include base salary + bonus/commission + equity
  + benefits (health, dental, life, 401k, and paid time off).
  Please note that the base salary range is a guideline, and
  that the actual total compensation offer will be determined
  based on various factors, including, but not limited to,
  applicant's qualifications, skills, experiences, and
  location.

  The base salary range below is for the role in New York,
  based on a Full Time Schedule.

  $140,000—$160,000 USD

  What Celonis can offer you:

  - Pioneer Innovation: Work with the global leader in Process
    Mining and the Process Intelligence Graph to shape the
    future of AI-driven business operations.
  - Ownership from Day 1: Every full-time "Celonaut" is an
    owner, receiving Restricted Stock Units (RSUs) and merit-
    based refresh grants.
  - Unrivaled Family Support: Benefit from our inclusive
    parental leave policy—24 weeks of fully paid leave for
    primary carers and 12 weeks for supporting carers,
    available from your first day of employment.
  - Work-Life Integration: Enjoy Unlimited PTO (in applicable
    regions) and generous PTO globally, as well as a flexible
    hybrid work model that balances remote focus with vibrant
    office collaboration.
  - Continuous Growth: Elevate your skills through our 70-20-10
    learning framework, mentorship programs, and access to a
    dedicated learning platform.
  - Holistic Well-being: Prioritize your health with subsidized
    Wellhub memberships, mental health counseling, and
    dedicated "Wellness Weeks" that prioritize work/life
    balance.
  - Drive Sustainability: Participate in annual Impact Days,
    where you receive paid time off to volunteer for community
    and environmental causes with your local office, or
    virtually.
  - Global Inclusion & Belonging: Find community through our
    Inclusion Think Tank and participate in our annual
    Inclusion Days, ensuring every voice is heard and valued.
  - Value-Driven Impact: Join a mission-led organization where
    our core values—Live for Customer Value, The Best Team
    Wins, We Own It, and Earth Is Our Future—drive every
    decision.

  About Us:

  Celonis makes processes work — for people, companies, and
  the planet. Powered by process mining and AI, the Celonis
  Process Intelligence Platform integrates process data and
  business context to create a living digital twin of business
  operations. We enable thousands of companies worldwide to
  understand how their business actually runs and, together
  with their partners, build intelligent solutions that
  transform and continuously improve the way they operate —
  unlocking billions in value. Celonis is headquartered in
  Munich, Germany, and New York City, USA, with more than 20
  offices worldwide.

  Get familiar with the Celonis Process Intelligence Platform
  by watching this video.

