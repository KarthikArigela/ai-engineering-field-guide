description: |
  Binance is a leading global blockchain ecosystem behind the
  world’s largest cryptocurrency exchange by trading volume
  and registered users. We are trusted by over 230 million
  people in 100+ countries for our industry-leading security,
  user fund transparency, trading engine speed, deep
  liquidity, and an unmatched portfolio of digital-asset
  products. Binance offerings range from trading and finance
  to education, research, payments, institutional services,
  Web3 features, and more. We leverage the power of digital
  assets and blockchain to build an inclusive financial
  ecosystem to advance the freedom of money and improve
  financial access for people around the world.

  About the Pioneer Talent Program

  Are you an early-career professional ready to kickstart your
  career in the dynamic world of blockchain? Binance’s Pioneer
  Talent Program is designed to nurture ambitious individuals
  like you. The program offers full-time roles where
  participants will gain hands-on expertise via a tailored
  training curriculum and personalized 1:1 mentorship from
  industry leaders. Dive behind the scenes of the world’s
  leading blockchain ecosystem while building the skills to
  thrive in Web3. Launch your career with purpose—join us in
  shaping the future of digital innovation.

  Who May Apply

  Candidates with up to 5 years of relevant work experience

  About the Role

  As AI profoundly transforms how engineering teams work, we
  are looking for Full Stack Engineers to serve as "seeds"
  across our product teams. You will be among the first
  dedicated full stack engineers, helping the organization
  establish a highly autonomous, AI-augmented, end-to-end
  development model.

  Responsibilities

  Requirements

  - Bachelor's degree or above; Computer Science or AI-related
    major preferred
  - 1–5 years of professional experience
  - Solid foundation in at least one backend language: Java or
    Golang
  - Proficiency in Node.js and React
  - Experience owning end-to-end projects in production — not
    just personal side projects
  - Familiarity with database design, data modeling, and core
    backend concepts
  - Highly proficient with mainstream AI coding tools (Cursor,
    Copilot, Claude Code, or similar)
  - Ability to clearly articulate requirements and constraints
    to AI tools; strong enough fundamentals to review,
    validate, and correct AI-generated code
  - Self-driven and boundaryless — you don't wait for tasks to
    be assigned; you proactively identify what needs to be
    done
  - Product and operational mindset — you can turn vague ideas
    into clear specs
  - Curious observer — you pay attention to how other teams work
    and actively suggest improvements
  - Strong logical thinking and communication skills; passionate
    about learning new technologies

  Nice to have

  Why Binance

  • Shape the future with the world’s leading blockchain
  ecosystem

  • Collaborate with world-class talent in a user-centric
  global organization with a flat structure

  • Tackle unique, fast-paced projects with autonomy in an
  innovative environment

  • Thrive in a results-driven workplace with opportunities
  for career growth and continuous learning

  • Competitive salary and company benefits

  • Work-from-home arrangement (the arrangement may vary
  depending on the work nature of the business team)

  Binance is committed to being an equal opportunity employer.
  We believe that having a diverse workforce is fundamental to
  our success.

  By submitting a job application, you confirm that you have
  read and agree to our Candidate Privacy Notice.
