title: Staff Engineer, AI Developer Experience (Remote, US)
company: Renew Home
location: USA
remote: true
work_type: FULL_TIME
description: |
  Who We Are

  Renew Home is on a mission to change how we power the world
  by making it easier for customers to save energy and money
  at home as part of the largest residential virtual power
  plant in North America.

  We partner with industry-leading brands to better manage
  residential energy for users by prioritizing efficiency,
  savings, and comfort — and cleaner energy for everyone.

  We are an Equal Opportunity employer striving to create a
  diverse, equitable, and inclusive work environment where
  everyone feels that they have a voice that is heard.

  We strongly encourage candidates to check out our website at
  www.renewhome.com  to learn more about the world-changing
  work we are doing.

  Role Summary

  At Renew Home, we are embracing AI-assisted development as a
  core part of how we work — and we are looking for a Staff
  Engineer to lead that effort from the inside. This role will
  help define how our engineers interact with AI tools and
  agents, shape the standards and guardrails that make
  adoption safe and effective, and continuously improve the
  inner loop of software development: the daily experience of
  writing, building, testing, and iterating on code.

  You will be embedded directly within the application
  development teams, giving you firsthand exposure to their
  workflows and friction points. While other engineers across
  the organization already contribute meaningfully to DevX,
  you will bring dedicated ownership, drive prioritization,
  and serve as the primary point of accountability for making
  progress. You won't be starting from scratch, and you won't
  be working alone.

  The application engineering teams are your primary
  customers. Success here means earning their trust,
  understanding their daily workflows, and shipping
  improvements they notice and value. We want someone who
  brings expertise and fresh ideas, and who also knows how to
  build buy-in, incorporate feedback, and make durable change
  through iteration.

  This is a high-impact individual contributor role with
  meaningful technical leadership responsibility. You will act
  as a force multiplier across the engineering organization by
  mentoring engineers, incorporating feedback, influencing
  engineering culture, and helping shape how we work.

  What You Will Do

  - Lead the evolution of our AI Developer Experience, enabling
    engineers to safely and effectively leverage AI throughout
    the software development lifecycle.
  - Drive the evaluation, adoption and governance of AI
    development tooling (code generation, in-editor
    assistance, agentic workflows), ensuring that adoption is
    practical, secure and measurable.
  - Measure and improve the speed of common developer actions
    across our TypeScript/Node and Python codebases. This
    includes build times, pre-push hooks, linting, type
    checking, conformance checks, and Nx task orchestration.
  - Own our devcontainer strategy, both local and cloud-based,
    to ensure a secure, consistent and reproducible
    development experience that scales across multiple
    concurrent projects.
  - Maintain and improve local testing frameworks and developer-
    facing test infrastructure.
  - Own and evolve shared internal libraries and configuration
    systems used across application teams, ensuring they are
    well-documented, versioned, and easy to adopt.
  - Contribute to related areas including CI/CD and delivery
    pipelines, SDLC definition, language and library upgrade
    cycles (Node/Python, NPM, PyPI), developer onboarding and
    documentation, and observability.

  Requirements

  - 7+ years of software engineering experience, with meaningful
    time spent on developer tooling, platform engineering, or
    developer productivity.
  - Deep familiarity with TypeScript/Node and Python ecosystems
    — you know the package management landscape, common build
    tooling, and where things tend to break.
  - Experience with monorepo tooling (Nx or similar) and an
    intuition for how to make large codebases fast to work
    with.
  - Hands-on experience designing, configuring, and improving
    devcontainer-based development environments.
  - Practical experience evaluating and integrating AI
    development tools (GitHub Copilot, Claude, OpenAI, Cursor,
    Codex) including thinking carefully about standards and
    guardrails, not just rollout.
  - Strong listening, communication, and leadership skills — you
    seek out feedback from the engineers you serve and know
    when to lead and when to follow.
  - Bonuses:

  Benefits

  What You'll Get

  - A full-time position, with a competitive salary based on
    experience. The base salary for this role is $170k -
    $220k. In addition to base compensation, this role is
    eligible for a target annual bonus of 15% of base salary,
    and participation in long-term incentive programs tied to
    company growth and performance. We use market data and
    consider your job family, background, skills, experience,
    and U.S. work location to determine compensation within
    our established pay range.
  - Fully remote work environment with home office set-up
    allowance.
  - Real and lived work-life balance - Company perks include no
    pre-set vacation limits (with a top-down culture of taking
    meaningful PTO every year!), parental leave benefits, and
    a corporate value of working sustainably and putting
    families first.
  - Competitive benefits package that includes numerous health
    and wellness benefits.
  - 401(k) plan, with employer contributions to the same.
  - Opportunity to work with amazing people who are passionate
    about their mission, thriving in a fully-remote work
    environment, and learning and growing every day.

  At this time, Renew Home is unable to sponsor or take over
  sponsorship of employment visas. Candidates must be
  authorized to work in the United States without current or
  future immigration from the company, including training
  plans for foreign students.

  EQUAL OPPORTUNITY EMPLOYER

  Individuals seeking employment at Renew Home are considered
  without regard to race, color, religious creed, sex, gender
  identification, national origin, citizenship status, age,
  physical or mental disability, sexual orientation, marital,
  parental, veteran or military status, unfavorable military
  discharge, or any other status protected by applicable
  federal, state or local law.

  We will ensure that individuals with disabilities are
  provided reasonable accommodation to participate in the job
  application or interview process, to perform essential job
  functions, and to receive other benefits and privileges of
  employment. Please contact us to request accommodation.
