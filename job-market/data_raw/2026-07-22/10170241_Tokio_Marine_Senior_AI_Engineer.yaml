description: |
  Senior AI Engineer

  Assignment type: 6 month contract (outside IR35)

  TMHCC is seeking a Senior AI Engineer to support the build-
  out of our AI Ops capability and delivery of strategic AI
  transformation initiatives across insurance operations,
  including Policy Revamp and FNOL (First Notice of Loss).

  The role will focus on designing and implementing
  enterprise-grade Agentic AI solutions using Azure AI
  Foundry, Python, Azure Functions, and modern cloud-native
  engineering practices.

  This is a hands-on engineering role requiring strong
  experience in AI workflow orchestration, secure Azure
  architecture, API integration, and scalable AI solution
  delivery.

  Key Responsibilities

  - Design and develop Agentic AI solutions using Azure AI
    Foundry and Azure OpenAI
  - Build AI orchestration workflows using Python and Azure
    Durable Functions
  - Develop document-processing and AI-driven automation
    solutions for insurance workflows
  - Implement secure Azure architectures using Private Endpoints
    and enterprise networking standards
  - Build and maintain Azure Function Apps and supporting
    backend services
  - Develop integrations with enterprise systems and external
    APIs
  - Establish and maintain CI/CD pipelines using Azure DevOps
  - Manage source control, branching strategy, and code quality
    standards using GitHub
  - Collaborate with architects, business stakeholders, and
    delivery teams
  - Produce technical documentation and support knowledge
    transfer activities
  - Contribute to AI engineering standards, reusable frameworks,
    and best practices

  Required Skills & Experience

  Essential

  - Strong Python development experience
  - Experience with Azure AI Foundry / Azure OpenAI
  - Experience building AI agent or LLM-based workflows
  - Experience with Azure Functions and Durable Functions
  - Experience with REST APIs and asynchronous workflow
    orchestration
  - Strong Azure cloud engineering experience
  - Experience implementing secure cloud solutions using Private
    Endpoints
  - Experience with CI/CD pipelines using Azure DevOps
  - Strong GitHub and version control practices
  - Experience with document processing, OCR, or AI extraction
    workflows
  - Strong understanding of scalable and resilient solution
    design

  Desirable

  - Experience with Agentic AI frameworks
  - Experience with AI orchestration patterns
  - Knowledge of vector search / Azure AI Search
  - Experience with insurance domain workflows (FNOL, Policy
    Admin, Claims)
  - Experience with monitoring and observability tooling
  - Exposure to Pega platform integration
  - Experience mentoring junior engineers or graduate trainees

  Technical Stack

  - Python
  - Azure AI Foundry
  - Azure OpenAI
  - Azure Functions / Durable Functions
  - Azure Storage / Cosmos DB
  - Azure DevOps
  - GitHub
  - REST APIs
  - OCR / Document Intelligence
  - AI Agent orchestration patterns

  Key Deliverables

  - AI-driven Policy Revamp solution
  - FNOL AI workflow implementation
  - Secure Azure AI platform setup
  - AI orchestration services and reusable frameworks
  - CI/CD and deployment pipelines
  - Technical documentation and knowledge transfer
