title: Senior Frontend Engineer (React) – AI-Native Product Development
company: Streamhub
location: Bengaluru, IND
work_type: FULL_TIME
company_size: 24 Employees
description: |
  Streamhub is a global analytics platform powering total
  audience measurement, planning and targeting for TV and
  streaming services. Our mission is simple: make video data
  actionable and accessible for the entire media ecosystem. We
  work with broadcasters, streaming platforms and advertisers
  in multiple countries, combining advanced analytics, AI and
  scalable engineering to solve complex problems in the
  advertising value chain.

  We are in a growth phase, expanding our teams across
  Bangalore, London and Tokyo to reinforce our international
  and entrepreneurial culture.

  The Role

  We are looking for a Senior Frontend Engineer who builds
  software the way modern teams actually ship it: with AI
  agents as active collaborators in the development loop, not
  as afterthoughts.

  This isn't a role where "AI-native" means occasionally
  prompting a chatbot. It means designing your architecture so
  that agents can read, modify, and verify your code — and
  catching their mistakes mechanically through typed
  boundaries, lint rules, and fast automated feedback loops.

  You will own the frontend of a data-intensive SaaS product,
  shaping how complex audience and measurement data is
  visualised and interacted with. While primarily frontend-
  focused, you'll gain exposure to full-stack data engineering
  workflows across the AdTech and MarTech ecosystem.

  As a senior member of the team, you will drive frontend
  architecture, set AI-native engineering standards, mentor
  fellow engineers, and directly influence product direction.

  What You'll Do

  - Build and maintain modern React applications within a
    structured monorepo (Turborepo), using reusable, scalable
    components that are readable and modifiable by both
    engineers and AI agents.
  - Develop highly interactive, data-intensive user experiences
    using React Hooks, TypeScript, and modern frontend
    patterns — with typed API contracts generated from backend
    specs, not hand-written, keeping AI-generated code
    reliable at the boundary.
  - Collaborate with backend engineers through a server-side
    proxy pattern to integrate RESTful APIs and ensure
    seamless, secure data flow across the application.
  - Work closely with Product, Design, and Data teams to deliver
    intuitive and impactful user experiences, maintaining in-
    repo convention documentation (CLAUDE.md or equivalent per
    package) so both teammates and agents stay aligned on how
    the codebase works.
  - Design and implement robust frontend testing strategies —
    unit, integration, and end-to-end — giving agents a
    reliable feedback loop where they can verify their own
    changes rather than compound errors.
  - Build responsive, accessible, and cross-browser compatible
    applications across major platforms.
  - Integrate and optimise third-party libraries for data
    visualisation, analytics, and other business-critical
    functionality, preferring libraries whose components live
    as readable source in the repo rather than behind opaque
    APIs.
  - Contribute to frontend architecture, coding standards, and
    CI/CD improvements — including custom lint rules that
    mechanically enforce team and agent invariants, catching
    convention violations that style guides alone won't
    prevent.
  - Participate in technical discussions, code reviews, and
    mentoring, with a bias toward decisions that make the
    codebase more navigable for humans and agents alike.
  - Take ownership of application performance, reliability,
    maintainability, and scalability.
  - Continuously explore and adopt modern frontend technologies,
    tools, and AI-native engineering practices that keep the
    team's development loop fast and self-correcting.

  You HaveCore Requirements

  - 6+ years of professional experience building complex web
    applications, including significant hands-on experience
    with React and modern frontend development practices.
  - Strong expertise in React and React Hooks.
  - A working understanding of AI-native development practices.
  - Excellent knowledge of TypeScript, JavaScript (ES6+), and
    modern browser APIs.
  - Strong understanding of component-driven architecture,
    reusable design patterns, and frontend application
    scalability.
  - Experience integrating and debugging RESTful APIs in
    frontend applications.
  - Strong understanding of responsive design, cross-browser
    compatibility, and accessibility best practices.
  - Experience implementing automated testing strategies,
    including unit and end-to-end testing.
  - Experience optimizing frontend performance and
    troubleshooting complex UI issues.
  - Familiarity with Git workflows, code review practices, and
    Agile development methodologies.
  - Strong communication, collaboration, and problem-solving
    skills.
  - Ability to work effectively in a fast-paced startup
    environment with a high degree of ownership and autonomy.

  Preferred Technical Experience

  - Experience with Tailwind CSS, Vitest, and Playwright for
    responsive UI development and automated testing.
  - Experience with Vite or similar modern build platforms.
  - Experience with server-state management and data fetching
    libraries (e.g. TanStack Query), client-side routing, and
    lightweight state management (e.g. Zustand).
  - Experience building with component libraries following the
    shadcn/ui pattern — components as owned source, not opaque
    dependencies.
  - Experience with complex data grids (e.g. AG Grid) and
    interactive data visualisation libraries (e.g. Highcharts
    or recharts).
  - Experience with Angular (v10+), particularly candidates who
    have worked across Angular-to-React migrations or multiple
    frontend ecosystems.

  - Experience working on analytics, reporting, BI, AdTech,
    MarTech, or SaaS products.
  - Experience building data-intensive applications and complex
    visualizations.
  - Exposure to CI/CD pipelines, observability, and modern
    deployment workflows.
  - Experience mentoring engineers and influencing frontend
    architecture decisions.

  Why Join Streamhub?

  - Competitive salary.
  - Hybrid working model.
  - Flexible working hours.
  - Entrepreneurial team culture with a high degree of ownership
    and autonomy.
  - Opportunity to work on challenging data-intensive products
    and technologies handling terabytes of data.
  - Exposure to cutting-edge problems in the AdTech and Media
    industries.
  - Annual training and self-development budget of ₹50,000.
  - Work laptop provided.
  - 28 days holiday, including public holidays.
  - Health insurance and pension cover.

  If you've read all the way to the bottom of this
  description, thank you for your interest in Streamhub!

  We are committed to equal employment opportunities
  regardless of race, color, ancestry, religion, sex, national
  origin, sexual orientation, age, citizenship, marital
  status, disability, gender, gender identity or expression,
  or veteran status. We are proud to be an equal opportunity
  workplace.
