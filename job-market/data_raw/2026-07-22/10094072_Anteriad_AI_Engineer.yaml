   Job Summary:

  AI Engineer with hands-on experience in designing,
  architecting, and building production-grade AI applications
  using Large Language Models (LLMs), Agentic AI, and
  Retrieval-Augmented Generation (RAG). The ideal candidate
  will have experience in providing scalable AI solutions that
  automate enterprise workflows and solve real-world business
  problems.

  This role requires strong expertise in AI application
  architecture, LLM orchestration, multi-agent systems, and
  backend development. The candidate should be passionate
  about evaluating emerging AI technologies and applying them
  to build intelligent, production-ready solutions.

   What You’ll Do:

  - Build Agentic AI systems using frameworks such as LangChain,
    LangGraph, CrewAI, Google ADK, or similar orchestration
    frameworks
  - Build intelligent conversational AI applications, enterprise
    copilots, knowledge assistants, and AI automation
    platforms.
  - Design, architect enterprise-grade AI applications using
    Large Language Models (LLMs).
  - Design and implement Retrieval-Augmented Generation (RAG)
    pipelines using vector databases and embedding models.
  - Design AI workflows involving multi-agent orchestration,
    function execution, and workflow automation.
  - Collaborate with cross-functional teams to understand
    business problems and translate them into AI-powered
    solutions.
  - Deploy, monitor, and maintain AI applications on cloud
    platforms such as AWS, Azure, or GCP.
  - Stay updated with advancements in Generative AI, Agentic AI,
    LLMs, and AI application architecture.

  What You’ll Bring:

  - Bachelor's or master’s degree in computer science,
    Artificial Intelligence, Machine Learning, Data Science,
    or a related field.
  - Looking for candidates with 1-2 years of experience.
  - Strong programming skills in Python.
  - Hands-on experience with:

    - Large Language Models (OpenAI GPT, Claude, Gemini, Llama,
      etc.)
    - LangChain
    - LangGraph
    - Retrieval-Augmented Generation (RAG)
    - Prompt Engineering
    - Agentic AI
    - FastAPI or Flask
  - Experience designing production-grade AI applications and
    intelligent automation solutions.
  - Experience integrating AI applications with enterprise APIs
    and external tools.
  - Ability to design and architect scalable AI applications.
  - Passion for researching and evaluating emerging AI
    technologies and applying them to real-world business
    challenges

