title: Agentic AI Integration Engineer (Remote)
company: Blue Acorn iCi
location: USA
remote: true
work_type: FULL_TIME
description: |
  Position Overview

  Blue Acorn iCi is seeking an Agentic AI Integration Engineer
  to join our AI & Emerging Technology practice. This hands-on
  engineering role is responsible for designing, building, and
  deploying production-ready agentic AI systems that automate
  complex enterprise workflows.

  Working alongside client stakeholders and cross-functional
  delivery teams, this individual will identify high-value
  automation opportunities, rapidly prototype intelligent
  solutions, and deliver scalable multi-agent systems that
  integrate seamlessly with enterprise platforms.

  The initial focus for this role will be marketing operations
  and work management, leveraging technologies such as Adobe
  Workfront, AI orchestration frameworks, and enterprise APIs
  to improve campaign execution, approvals, reporting, and
  operational efficiency. Location: Remote - United States

  Key ResponsibilitiesAgentic AI Solution Development

  - Design, develop, and deploy production-ready AI agents and
    multi-agent systems that automate enterprise business
    workflows.
  - Build reusable agent frameworks, orchestration patterns, and
    integration components that accelerate future client
    implementations.
  - Own the full software development lifecycle from proof of
    concept through production deployment.
  - Implement evaluation frameworks, guardrails, observability,
    and error handling for production AI systems.
  - Stay current with emerging AI models, orchestration
    frameworks, and agent technologies, incorporating new
    capabilities where they provide measurable business value.

  Enterprise Integration & Workflow Automation

  - Integrate AI agents with enterprise platforms through REST
    APIs, webhooks, OAuth2, and workflow automation
    technologies.
  - Design scalable approval workflows, routing logic,
    notifications, and intelligent automation supporting
    enterprise marketing operations.
  - Assess existing client workflows and identify opportunities
    to improve efficiency through intelligent automation.
  - Design secure, scalable integrations capable of supporting
    enterprise production workloads.
  - Develop reusable integration patterns that simplify future
    client implementations.

  Client Engagement & Delivery

  - Partner directly with client stakeholders to understand
    business processes and operational challenges.
  - Identify and prioritize high-value automation opportunities
    that reduce manual effort and improve business outcomes.
  - Rapidly prototype AI solutions, gather client feedback, and
    iterate toward production-ready implementations.
  - Present technical recommendations and solution approaches to
    both technical and business audiences.
  - Deliver measurable business outcomes throughout client
    engagements.

  Technical Leadership

  - Collaborate with architects, engineers, delivery managers,
    and consultants to deliver enterprise AI solutions.
  - Participate in solution architecture discussions, technical
    discovery sessions, and implementation planning.
  - Perform peer code reviews and promote engineering best
    practices across project teams.
  - Mentor fellow engineers on emerging AI technologies and
    integration patterns.
  - Support sales and solution teams by providing technical
    expertise during client pursuits, demonstrations, and
    solution estimation.

  Required Skills & Experience

  - Bachelor's degree in Computer Science, Software Engineering,
    Information Systems, or equivalent practical experience.
  - 5+ years of professional software engineering experience
    developing enterprise applications.
  - 1+ years of hands-on experience designing, building, and
    deploying agentic AI systems.
  - Experience working with multi-agent orchestration frameworks
    such as LangGraph, CrewAI, AutoGen, or similar
    technologies.
  - Experience integrating commercial Large Language Models
    (LLMs) through model APIs.
  - Strong experience with enterprise integration technologies
    including REST APIs, OAuth2, webhooks, workflow automation
    platforms, and iPaaS solutions.
  - Experience designing scalable, secure production software
    solutions.
  - Ability to quickly understand complex business processes and
    translate them into technical solutions.
  - Excellent communication, consulting, and stakeholder
    management skills.
  - Comfortable working independently while collaborating across
    cross-functional delivery teams.

  Preferred Qualifications

  - Hands-on experience with Adobe Workfront, including
    Workfront Fusion, Workfront APIs, and Custom Forms.
  - Experience within marketing operations or content supply
    chain environments.
  - Familiarity with Model Context Protocol (MCP) and AI tool
    integration standards.
  - Experience with Adobe Experience Cloud technologies,
    including Adobe Experience Manager (AEM), Adobe Experience
    Platform (AEP), Adobe Journey Optimizer (AJO), or Adobe
    Analytics.
  - Experience deploying AI solutions on Azure, AWS, or Google
    Cloud.
  - Previous consulting or professional services experience
    delivering enterprise technology solutions.

  Compensation

  The base salary range for this position is $160,000 –
  $210,000 annually. Actual compensation may vary depending on
  experience, qualifications, geographic location, and other
  job-related factors.
