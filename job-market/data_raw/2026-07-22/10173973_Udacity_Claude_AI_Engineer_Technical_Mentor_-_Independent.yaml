title: "Claude AI Engineer Technical Mentor - Independent Contractor (US Canada, Europe, MENA, India & APAC Timezones)"
company: Udacity
location: USA
work_type: FULL_TIME
description: |
  About Us

  Udacity is now an Accenture company, and exciting things are
  happening! 🚀 We are on a mission of forging futures in tech
  through radical talent transformation in digital
  technologies. We offer a unique and immersive online
  learning platform, powering corporate technical training in
  fields such as Artificial Intelligence, Machine Learning,
  Data Science, Autonomous Systems, Cloud Computing and more.
  Our rapidly growing global organization is revolutionizing
  how the enterprise market bridges the talent shortage and
  skills gaps during their digital transformation journey.

  Recognized for its innovative impact, Udacity part of
  Accenture continues to empower people with the skills they
  need to secure the jobs they want.

  Udacity is committed to providing high-quality upskilling
  opportunities in this rapidly evolving field. We regularly
  launch new projects and are seeking experienced mentors to
  join us as external contractors to support our programs and
  learners.

  As new initiatives arise, we will reach out to qualified
  candidates within this talent pool to provide details on
  project scope, expected timelines, and compensation. If you
  are passionate about tackling meaningful challenges and
  making a difference we invite you to apply and explore this
  opportunity to collaborate with us.

  You’ll be an excellent fit if you have:

  - Proven technical expertise with 5+ years of experience in
    the relevant field
  - A passion for mentoring and helping others succeed in their
    learning
  - Excellent interpersonal skills. You enjoy building
    relationships, communicating effectively, and fostering a
    positive learning environment
  - A deep understanding of the tech industry and emerging
    trends in AI and related fields
  - The flexibility to work part-time as an external contractor
    alongside your current commitments

  Mandatory Technical Skills – Claude AI Engineer

  - Anthropic Claude Ecosystem: Claude API, Claude Code, Claude
    Agent SDK, Model Context Protocol (MCP)
  - Agentic AI Development: AI Agents, Multi-Agent Systems,
    Agent Orchestration, Tool Calling & Workflow Design
  - Prompt & Context Engineering: Prompt Engineering, Context
    Engineering, Structured Outputs (JSON Schema), AI
    Validation
  - Programming & APIs: Python (required), REST APIs, JSON,
    Bash/Shell Scripting
  - Software Engineering & Architecture: System Design, Solution
    Architecture, API Design, Code Review, Design Patterns
  - Data & Production AI Systems: SQL, Data Extraction, Error
    Handling, State Management, Human-in-the-Loop Workflows
  - DevOps & CI/CD: Git, GitHub, CI/CD Pipelines, Automated
    Testing, MCP Server Integration

  Exposure to real-world data projects (analytics,
  engineering, or architecture)

  Responsibilities:

  Your responsibilities as a technical mentor will be divided
  into three major tasks.

  - 1:1 video calls
  - Virtual Technical Deep-Dive Sessions
  - Group Q&A sessions

  Personal 1:1 Session:

  - Provide personalized support by addressing learner questions
    related to course content and projects.
  - Prior to the call mentors are expected to review the
    students' previous project submission(s) - provided by the
    Mentor Success Team when available - and/or any specific
    areas of the Nanodegree content or project that the
    student has expressed confusion or difficulty with.

  Technical Deep-Dive Session:

  - For concept deep-dives, mentors will come prepared with a
    slide presentation that reviews a Nanodegree concept in
    more detail, share different use-cases for the concept to
    broaden student perspectives and understanding, and hold a
    Q&A session with the learners.
  - For project walkthroughs, a mentor will come prepared with a
    slide presentation that outlines each element of the
    rubric to help learners understand expectations and
    typical problem areas they may encounter. This can include
    a mentor “grading” a sample submission to demonstrate what
    mentors are looking for when reviewing projects.

  Group Q&A Session:

  - Host regular sessions (via Slack or video) to address
    learner queries related to projects and coursework. No
    prior preparation required.

  Why should you apply?

  - Make an impact by mentoring and contributing to a vibrant,
    global learning community
  - Showcase your expertise and gain recognition for your
    technical knowledge
  - Learn and network with our global community of mentors while
    staying ahead of the curve on cutting-edge technologies
  - Earn additional income with the flexibility to work on your
    own schedule

  Mentoring at Udacity offers a unique opportunity to make a
  significant impact on the lives of learners and to
  contribute to achieving our mission.

  If you're passionate about learning, technology and want to
  make a positive impact, we encourage you to apply to become
  a mentor at Udacity part of Accenture.

  Let's work together to shape the future of tech education!

