description: |
  About Citi:

  Citi, the leading global bank, has approximately 200 million
  customer accounts and does business in more than 160
  countries and jurisdictions. Citi provides consumers,
  corporations, governments, and institutions with a broad
  range of financial products and services, including consumer
  banking and credit, corporate and investment banking,
  securities brokerage, transaction services, and wealth
  management.

  As a bank with a brain and a soul, Citi creates economic
  value that is systemically responsible and in our clients’
  best interests. As a financial institution that touches
  every region of the world and every sector that shapes your
  daily life, our Operations & Technology teams are charged
  with a mission that rivals any large tech company. Our
  technology solutions are the foundations of everything we do
  from keeping the bank safe, managing global resources, and
  providing the technical tools our workers need to be
  successful to designing our digital architecture and
  ensuring our platforms provide a first-class customer
  experience. We reimagine client and partner experiences to
  deliver excellence through secure, reliable, and efficient
  services.

  Our commitment to diversity includes a workforce that
  represents the clients we serve from all walks of life,
  backgrounds, and origins. We foster an environment where the
  best people want to work. We value and demand respect for
  others, promote individuals based on merit, and ensure
  opportunities for personal development are widely available
  to all. Ideal candidates are innovators with well-rounded
  backgrounds who bring their authentic selves to work and
  complement our culture of delivering results with pride. If
  you are a problem solver who seeks passion in your work,
  come join us. We’ll enable growth and progress together.

  The Role:

  Citi's global Innovation Labs is seeking a versatile Senior
  GenAI Platform Engineer to spearhead the design and
  development of cutting-edge Generative AI platforms. This
  role is a key driver in creating a competitive advantage for
  Citi’s lines of business by architecting and delivering
  high-impact, scalable AI solutions primarily using Python,
  while also leveraging Node.js and TypeScript. The ideal
  candidate is an expert polyglot engineer with a proven track
  record in building enterprise-grade products, who will lead
  innovative AI projects and shape the future of financial
  technology at Citi.

  Responsibilities

  - Lead the design, development, and maintenance of highly
    complex GenAI platforms, applications, and services using
    Python, Node.js, and TypeScript.
  - Ensure the seamless operation, scalability, and integration
    of AI capabilities across various Citi business units.
  - Engage with data science, technical, and business
    stakeholders to define and design the overall architecture
    for key use-cases.
  - Drive the deployment of new GenAI products and process
    improvements, working with internal and external partners
    to design, validate, and deliver solutions.
  - Resolve high-impact technical and business problems, leading
    projects through in-depth evaluation of complex business
    processes, system architecture, and industry standards.
  - Provide expert guidance and advanced knowledge in modern
    programming, ensuring platform design adheres to
    architectural blueprints and best practices for generative
    models.
  - Develop and enforce robust coding standards, testing
    methodologies, debugging practices, and implementation
    strategies for enterprise-grade solutions across Python,
    Node.js, and TypeScript.
  - Manage multiple concurrent initiatives and projects of
    varying sizes and complexity.
  - Engage with external vendors and startups for joint
    initiatives and exploration of new technologies.
  - Cultivate a comprehensive understanding of how business,
    architecture, and infrastructure integrate within the
    GenAI ecosystem at Citi.
  - Serve as an advisor and coach to mid-level developers and
    analysts specializing in AI technologies to foster skill
    development.
  - Collaborate with Citi's Risk and Control teams to ensure
    best practices are followed regarding governance, risk
    management, standardization, and tooling.

  Qualifications

  - 5+ years' progressive experience with hands-on Python
    engineering in developing and implementing scalable and
    robust platforms, applications, and services using modern
    libraries and frameworks (e.g., Python: FastAPI, Flask,
    Pandas, Scikit-learn, Hugging Face; Node.js: Express,
    NestJS; TypeScript).
  - 5+ years of experience delivering complex backend solutions
    and services (e.g., APIs, microservices) into production.
  - Demonstrated experience in managing and implementing
    successful projects of varying sizes and complexities.
  - Proven understanding of Generative AI systems, AIOps, and
    application monitoring/evaluation.
  - Experience with cloud architectures, with specific
    experience in public cloud offerings.
  - Strong passion and proven hands-on experience integrating
    with AI/ML technologies.
  - Experience with software development agents, agile
    development, CI/CD pipelines, software testing, and code
    reviews.
  - Ability to quickly learn new technologies, adjust
    priorities, influence highly skilled engineering teams,
    and guide technology decisions.
  - Demonstrated leadership and project management skills.
  - Excellent communication and documentation skills, with the
    ability to communicate clearly and concisely, both written
    and verbal.
  - Strong analytical, problem-solving skills, and a strategic
    mindset.
  - Experience in the financial industry is a significant
    advantage.

  Education

  - Bachelor's degree/University degree or equivalent experience
    is required.
  - Master's degree is preferred.

