  About Genesys:

  Genesys® empowers more than 8,000 organizations worldwide to
  create the best customer and employee experiences. With
  agentic AI at its core, Genesys Cloud™ is the AI-Powered
  Experience Orchestration platform that connects people,
  systems, data and AI across the enterprise. As a result,
  organizations can drive customer loyalty, growth and
  retention while increasing operational efficiency and
  teamwork across human and AI workforces. To learn more,
  visit www.genesys.com.

