description: |
  This is Adyen

  Adyen provides payments, data, and financial products in a
  single solution for customers like Meta, Uber, H&M, and
  Microsoft - making us the financial technology platform of
  choice. At Adyen, everything we do is engineered for
  ambition.

  For our teams, we create an environment with opportunities
  for our people to succeed, backed by the culture and support
  to ensure they are enabled to truly own their careers. We
  are motivated individuals who tackle unique technical
  challenges at scale and solve them as a team. Together, we
  deliver innovative and ethical solutions that help
  businesses achieve their ambitions faster. Senior AI
  Engineer

  We are looking for a Senior AI Engineer to join our AML
  (Anti-Money Laundering) Tech team in Amsterdam. You will
  help build our next-generation financial crime investigation
  system, leveraging AI to manage and mitigate risk at scale.
  With our global footprint, you will have access to a
  uniquely rich dataset to fuel these solutions.

  You will bridge the gap between applied research and
  engineering excellence, taking ownership of the end-to-end
  lifecycle of these AI systems – from initial ideation to
  production. We are building a Human-in-the-Loop system. By
  evolving our capabilities from isolated workflows to a
  highly performant, trustworthy agentic system, you will
  shape how humans and AI collaborate in a complex, regulated
  domain.

  This is a unique opportunity to be part of the foundational
  group driving AI product development at Adyen. You will be
  building zero-to-one products, setting the architectural
  standards for our team, and defining how AI is practically
  deployed across the company.

  In this role, you will:

  - Build Agentic Systems: You will lead the design and
    deployment of robust, multi-step AI agents tailored for
    complex investigation workflows (orchestration, tool
    dispatching, state and memory management, error recovery,
    human-in-the-loop design).
  - Develop Platform Infrastructure: You will build a scalable
    modular agent platform that seamlessly integrates with
    enterprise data to support Adyen’s massive operational
    scale and diverse use cases.
  - Architect Evaluation Frameworks: You will design custom,
    domain-specific benchmarks and reusable infrastructure to
    rigorously test LLM reliability, edge cases, failure
    modes, and overall production readiness.
  - Provide Strategic Leadership: You will act as the leading
    engineer for the team, driving the AI product roadmap in
    close collaboration with a high-performing product team
    and leadership, guide company-wide MLOps decisions,
    evaluate third-party tools, and lead cross-functional
    integration.

  Who You Are:

  - Experienced Builder: 5+ years in Software or Machine
    Learning Engineering, including 2+ years successfully
    designing and productionizing AI systems.
  - Agentic Architecture Expert: Proven experience in applied
    AI, with a focus on building systems around pre-trained
    models (e.g., context engineering, fine-tuning, RAG,
    inference optimization, orchestrating model interactions
    with external tools to deliver solutions, multi-step
    tasks). You know exactly what separates a research
    prototype from a production agent.
  - Engineering & MLOps Pragmatist: Highly proficient in Python
    with a strong grasp of engineering best practices and
    tracking "LLM-native" metrics (e.g., granular tracing,
    tokens/sec, cost-per-request).
  - Proactive Leader: A self-starter who thrives in ambiguity,
    continuously raises the technical bar, influences system
    architecture, and mentors the team to build for scale.
  - Educated: Master’s degree in a STEM field (Science,
    Technology, Engineering, Mathematics) or equivalent
    technical background.
  - Bonus (Nice to Have): A strong foundation in traditional
    Machine Learning. You understand that this product sits
    within a broader ML ecosystem and pragmatically choose the
    right tool for the problem.

  Our Diversity, Equity and Inclusion commitments

  Our unique approach is a product of our diverse
  perspectives. This diversity of backgrounds and cultures is
  essential in helping us maintain our momentum. Our business
  and technical challenges are unique, and we need as many
  different voices as possible to join us in solving them -
  voices like yours. No matter who you are or where you’re
  from, we welcome you to be your true self at Adyen.

  Studies show that women and members of underrepresented
  communities apply for jobs only if they meet 100% of the
  qualifications. Does this sound like you? If so, Adyen
  encourages you to reconsider and apply. We look forward to
  your application!

  What’s next?

  Ensuring a smooth and enjoyable candidate experience is
  critical for us. We aim to get back to you regarding your
  application within 5 business days. Our interview process
  tends to take about 4 weeks to complete, but may fluctuate
  depending on the role. Learn more about our hiring process
  here. Don’t be afraid to let us know if you need more
  flexibility.

  This role is based out of our Amsterdam office. We are an
  office-first company and value in-person collaboration; we
  do not offer remote-only roles.
