description: |
  Salary: $120k - $135k

  Overview:

  EXL, a global consultancy, seeks Computer Science, Computer
  Engineering, Analytics, Math and Multidisciplinary majors
  who are willing to learn an Agentic AI product suite and
  then go into industry as a Forward Deployment Engineer.

  This role is client-facing, hands-on technical role that
  embeds with enterprise customers to deploy AI models and
  agentic workflows into production environments. They bridge
  the gap between the EXLdata.AI platform team focusing
  practical application, building, coding, and troubleshooting
  solutions to solve complex business problems while providing
  feedback to improve the core AI platform.

  Responsibilities

  Overview:

  EXL, a global consultancy, seeks Computer Science, Computer
  Engineering, Analytics, Math and Multidisciplinary majors
  who are willing to learn an Agentic AI product suite and
  then go into industry as a Forward Deployment Engineer.

  This role is client-facing, hands-on technical role that
  embeds with enterprise customers to deploy AI models and
  agentic workflows into production environments. They bridge
  the gap between the EXLdata.AI platform team focusing
  practical application, building, coding, and troubleshooting
  solutions to solve complex business problems while providing
  feedback to improve the core AI platform.

  Qualifications

  Requirements:

  - Master’s degree in Computer Science, Computer Engineering,
    Data Science, Analytics, Mathematics, or a related
    technical field
  - Strong programming skills in one or more languages such as
    Python, Java, or Scala
  - Foundational knowledge of machine learning, artificial
    intelligence, and/or data engineering concepts
  - Exposure to building, testing, or deploying models or data
    pipelines through academic projects, internships, or
    research
  - Familiarity with modern AI/ML frameworks and tools (e.g.,
    TensorFlow, PyTorch, scikit-learn, or similar)
  - Understanding of APIs, system integration, and working with
    structured and unstructured data
  - Strong problem-solving skills with the ability to translate
    business challenges into technical solutions
  - Excellent communication skills and ability to work directly
    with clients in a professional setting
  - Ability to thrive in ambiguous, fast-paced environments and
    quickly learn new technologies
  - Willingness to travel and work on-site with enterprise
    clients as needed

  Preferred Qualifications:

  - Exposure to cloud platforms such as AWS, Azure, or Google
    Cloud
  - Experience with LLMs, generative AI, or agent-based
    workflows
  - Knowledge of data engineering tools (e.g., Spark,
    Databricks, Airflow)
  - Prior client-facing experience through internships,
    consulting projects, or research collaborations
  - Understanding of software development best practices
    (version control, CI/CD, testing)

  About Us

   EXL (NASDAQ: EXLS) is a leading data analytics and digital
