description: |
  Senior Software Developers collaborate with Business and
  Quality Analysts, Designers, Project Managers and more to
  design software solutions that will create meaningful change
  for our clients. They listen thoughtfully to understand the
  context of a business problem and write clean and iterative
  code to deliver a powerful end result whilst consistently
  advocating for better engineering practices. By balancing
  strong opinions with a willingness to find the right answer,
  Senior Software Developers bring integrity to technology,
  ensuring all voices are heard.

  For a team to thrive, it needs collaboration and room for
  healthy, respectful debate. Senior Developers are the
  technologists who cultivate this environment while driving
  teams toward delivering on an aspirational tech vision and
  acting as mentors for more junior-level consultants. You
  will leverage deep technical knowledge to solve complex
  business problems and proactively assess your team’s health,
  code quality and nonfunctional requirements.

  Job responsibilities

  - You will learn and adopt best practices like writing clean
    and reusable code using TDD, pair programming and design
    patterns
  - You will use and advocate for continuous delivery practices
    to deliver high-quality software as well as value to end
    customers as early as possible
  - You will work in collaborative, value-driven teams to build
    innovative customer experiences for our clients
  - You will create large-scale distributed systems out of
    microservices
  - You will collaborate with a variety of teammates to build
    features, design concepts and interactive prototypes and
    ensure best practices and UX specifications are embedded
    along the way.
  - You will apply the latest technology thinking from our
    Technology Radar to solve client problems
  - You will efficiently utilize DevSecOps tools and practices
    to build and deploy software, advocating devops culture
    and shifting security left in development
  - You will oversee or take part in the entire cycle of
    software consulting and delivery from ideation to
    deployment and everything in between
  - You will act as a mentor for less-experienced peers through
    both your technical knowledge and leadership skills

  Job qualifications

  Technical Skills

  - You have 5+ years of experience in Java, React, and AWS with
    strong proficiency in development and a solid foundation
    in object-oriented programming
  - You have a foundational understanding of Generative AI and
    Large Language Models (LLMs) and their application in
    enterprise software development.
  - You can skillfully write high-quality, well-tested code and
    you are comfortable with Object-Oriented programming
  - You are comfortable with Agile methodologies, such as
    Extreme Programming (XP), Scrum and/or Kanban
  - You have a good awareness of TDD, continuous integration and
    continuous delivery approaches/tools

  Professional Skills

  - You enjoy influencing others and always advocate for
    technical excellence while being open to change when
    needed
  - Presence in the external tech community: you willingly share
    your expertise with others via speaking engagements,
    contributions to open source, blogs and more
  - You’re resilient in ambiguous situations and can approach
    challenges from multiple perspectives

  Other things to know

  Learning & Development

  There is no one-size-fits-all career path at Thoughtworks:
  however you want to develop your career is entirely up to
  you. But we also balance autonomy with the strength of our
  cultivation culture. This means your career is supported by
  interactive tools, numerous development programs and
  teammates who want to help you grow. We see value in helping
  each other be our best and that extends to empowering our
  employees in their career journeys.

  Onsite Work Expectation

  You may be expected to work out of our Thoughtworks office
  or at our client's office location for all five working days
  of the week, depending on business or clients’ needs.

  About Thoughtworks

  Thoughtworks is a global technology consultancy that
  integrates strategy, design and engineering to drive digital
  innovation. For 30+ years, our clients have trusted our
  autonomous teams to build solutions that look past the
  obvious. Here, computer science grads come together with
  seasoned technologists, self-taught developers, midlife
  career changers and more to learn from and challenge each
  other. Career journeys flourish with the strength of our
  cultivation culture, which has won numerous awards around
  the world.  Join Thoughtworks and thrive. Together, our
  extra curiosity, innovation, passion and dedication
  overcomes ordinary.

  See here our AI policy.
