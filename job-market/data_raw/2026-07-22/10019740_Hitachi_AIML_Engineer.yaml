  Job Description:

  AI/ML Engineer Your responsibilities:

   Run within the Artificial Intelligence field, feasibility
  studies, propose, and develop new technical concepts,
  design, and implement new solutions.  Integrating AI
  projects within our production leading the way towards the
  industry 4.0 revolution.  Organizing prototyping and
  testing activities to validate new technologies/algorithms.
   Providing technical support to factories in the field of
  operational excellence and improving the processes as well
  as data analysis of different stages of the production. 
  Having global collaboration with scientists of Hitachi
  energy’s research teams and technology centers, technology
  managers and engineers from the various factories.

   Be an active member in further strengthening the
  collaboration with universities and research institutes. 
  Living Hitachi Energy’s core values safety and integrity,
  which means taking responsibility for your own actions while
  caring for your colleagues and the business.

  Your background:

   Bachelor's or master's degree in fields such as Computer
  Science, Electrical Engineering or related disciplines. 
  Minimum of 2 years of experience with proven hands-on
  experience in Artificial Intelligence field.  Expert-level
  Python skills and hands-on model development experience for
  Regression, Classification, and computer vision-related
  tasks.  Proficient in Computer vision with hands-on
  experience in Object detection, Image classification, and
  Image processing.  Best practices in deploying computer
  vision models in a production environment.  Extensive
  hands-on experience with Python packages such as Scikit-
  learn, Numpy, Pandas etc.,  Hands-on experience in Cloud
  technologies like Azure or AWS and GCP is a plus.  Good to
  have experience with Agile software delivery environments. 
  You have experience working in the field of Data Science and
  a degree in software engineering or equivalent.  You also
  have experience in integration of a system with different
  existing hardware as well as building new setups from
  scratch. Experience with Artificial Intelligence Vision
  Systems is a plus.  You have sound analytical skills and
  have ambition towards applying new and innovative solutions
  to improve the current solutions.  You are a team player
  who enjoys collaborating with others to achieve great
  results.  Preferably you also have experience in, or
  ability to develop, project management and technical
  leadership skills.  Proficiency in both spoken & written
  English language is required.

