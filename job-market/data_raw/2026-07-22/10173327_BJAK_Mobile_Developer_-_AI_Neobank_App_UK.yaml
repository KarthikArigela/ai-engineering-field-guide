description: |
  About BJAK

  The original mission of BJAK is we believe people deserve
  smarter ways to plan, save and grow their money. This is the
  origin of our name. Started in 2019, we built the first
  mobile-first, insurance platform, enabling insurance to be
  accessible online by millions in the region. Today, its the
  leading insurance platform in Southeast Asia. Today, we are
  expanding ways to help people in the region — this includes
  spending, saving, investing, exchanging, travelling, and
  more. Our mission is help people get more from their money
  every day. We have teams working around the world, with over
  20 nationalities from our offices and remotely, who truly
  enjoys their work. We are looking for the most talented and
  driven people we can find. We are looking for people who
  work for their passion, not counting hours. Who loves
  building great next-generation products, not status quo. Who
  cares about redefining how everyone around us can get the
  best financial applications, not for an exclusive few. If
  you're this person, we'd love to talk to you.

  The Role

  We are looking for mobile developers to build BJAK's AI
  Neobank App across Android and iOS. This role is for strong
  mobile builders who can ship clean, reliable and intuitive
  mobile experiences, whether their main strength is Android,
  iOS or both.

  What You'll Own

  - Build and ship mobile features for Android and/or iOS.
  - Create simple mobile flows for insurance, payments, claims,
    renewals and financial services.
  - Work with product, design and backend teams to turn complex
    journeys into usable mobile products.
  - Integrate APIs and handle edge cases, loading states, errors
    and production issues.
  - Improve app performance, reliability, crash rate and user
    experience.
  - Support fast product launches, experiments and iterations
    across mobile journeys.
  - Help set high standards for mobile product quality across
    the app.

  What We're Looking For

  - 3+ years of mobile development experience in Android, iOS or
    both.
  - Strong experience with Kotlin and/or Swift.
  - Experience shipping production apps used by real users.
  - Strong product sense and attention to mobile UX.
  - Able to work with APIs, analytics, crash logs and production
    feedback.
  - Fast, practical and comfortable owning work with limited
    handholding.
  - App links, GitHub, screenshots or examples of shipped work
    are a strong advantage.

  The Kind of Builder We Want

  - Thinks like a product builder, not just a mobile coder.
  - Cares about smooth flows, small details and real user
    behaviour.
  - Can work across ambiguity and ship without waiting for
    perfect specs.
  - Takes production quality personally.
  - Honest about what they built directly versus what the wider
    team delivered.

  This Role Is Not For

  - Developers who only want to build isolated screens.
  - People who do not care about UX, performance or reliability.
  - Candidates who cannot explain their own contribution
    clearly.
  - People who need heavy guidance for every task.
  - Engineers who move slowly in a high-growth environment.

  Location

  This role is based in UK. This is a hybrid role. You are
  expected to work from our UK office at least 3 days per
  week.

  Language

  English is our main working language across global teams.
  Strong English communication is required.

  Interview Process

  Our process is designed to move fast:

  - Online assessment or practical task
  - Technical interview
  - CEO / final round

  For strong candidates, we aim to complete the process and
  make an offer within 1 week from the start of the interview
  process. Candidates who complete assessments quickly will be
  prioritized.
