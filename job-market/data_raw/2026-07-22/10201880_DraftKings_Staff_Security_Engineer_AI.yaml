title: Staff Security Engineer, AI
company: DraftKings
location: USA
work_type: FULL_TIME
description: |
  At DraftKings, AI is becoming an integral part of both our
  present and future, powering how work gets done today,
  guiding smarter decisions, and sparking bold ideas. It's
  transforming how we enhance customer experiences, streamline
  operations, and unlock new possibilities. Our teams are
  energized by innovation and readily embrace emerging
  technology. We're not waiting for the future to arrive.
  We're shaping it, one bold step at a time. To those who see
  AI as a driver of progress, come build the future together.
  The Crown Is Yours We're seeking a Staff Security Security
  Engineer to join our growing security team focused on
  ensuring our use of emerging technology at DraftKings is
  done safely and securely, relying on deep technical
  expertise and knowledge to assess how to safely connect and
  deploy new workflows, processes, and technologies. To do
  this you will work strategically, influencing the company's
  overall security posture, architecture, and roadmap in a
  variety of domains. You'll work with product, engineering
  and research teams to build and deploy tooling that will
  help the business connect different services and data
  together. You'll explain your work to a broad audience
  spanning from individual contributors in a variety of
  departments to senior leadership. The team you're joining is
  cross-disciplinary, driven, supportive, and global. Each
  member brings unique, respected perspectives whether they
  just joined or were founding team members. What you'll do as
  a Staff Security Engineer

  - Set the security standards and guardrails for the AI
    platform. Define the principles, reference architectures,
    and policy-as-code that all AI tooling at DraftKings
    adheres to, so that many teams can build agents and
    workflows while still meeting a consistent security bar.
    Focus on specifying the environment, infrastructure, and
    authentication methods agents rely on, rather than
    reviewing every individual implementation.
  - Review and build the architecture of AI gateways and
    tooling. Provide security review, sign-off, and possibly
    pair on implementation of these systems, and the systems
    that they interface with.
  - Make the security review process scale. Streamline how AI
    services move through InfoSec review on their way to
    production, so the bar stays high but does not become the
    bottleneck.
  - Reduce AI-driven security noise. Partner with platform and
    detection teams on telemetry (tool-call metrics, auditing
    agents over that data) and on lightweight controls like
    standardized system prompts that cut unnecessary
    investigations without slowing engineers down.
  - Drive remediation efforts of complex, cross-functional
    security issues. When relevant, you'll be called into
    investigations to assist.
  - Coach and raise the bar. Mentor security and platform
    engineers, lead technical and SME discussions on AI
    security, and elevate the team's overall capability in
    this space.

  What you'll bring

  - 7+ years experience in engineering - building and operating
    systems in production.
  - 5+ years experience contributing and advising on security
    design.
  - Broad security fluency across infrastructure and enterprise
    security - endpoint protection, network security,
    identity, SaaS tools, and cloud security - even if your
    deepest expertise is in application and product security.
  - Deep hands-on ability to debug systems issues. We're
    comfortable hacking on things to solve security problems,
    so long as we can unlock functionality and make it usable
    for the organization.
  - Experience writing high quality code in a typed and untyped
    programming language.
  - Excellent collaboration and communication skills - you can
    align engineering, platform, privacy, legal, and
    leadership stakeholders, and you bias toward enabling
    teams rather than blocking them.
  - Ability to manage competing priorities and thrive in a fast-
    paced, dynamic environment.

  Join Our Team We're a publicly traded (NASDAQ: DKNG)
  technology company headquartered in Boston. As a regulated
  gaming company, you may be required to obtain a gaming
  license issued by the appropriate state agency as a
  condition of employment. Don't worry, we'll guide you
  through the process if this is relevant to your role. The US
  base salary range for this full-time position is 160,700.00
  USD - 200,900.00 USD, plus bonus, equity, and benefits as
  applicable. Our ranges are determined by role, level, and
  location. The compensation information displayed on each job
  posting reflects the range for new hire pay rates for the
  position across all US locations. Within the range,
  individual pay is determined by work location and additional
  factors, including job-related skills, experience, and
  relevant education or training. Your recruiter can share
  more about the specific pay range and how that was
  determined during the hiring process. It is unlawful in
  Massachusetts to require or administer a lie detector test
  as a condition of employment or continued employment. An
  employer who violates this law shall be subject to criminal
  penalties and civil liability.
