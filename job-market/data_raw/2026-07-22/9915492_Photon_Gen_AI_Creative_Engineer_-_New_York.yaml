title: Gen AI Creative Engineer - New York
company: Photon
location: New York, USA
work_type: FULL_TIME
company_size: 5,017 Employees
description: |
  What You’ll Do:

  - Generate high-quality visuals, design concepts, and
    experience mockups using tools like Midjourney, DALL·E,
    Stable Diffusion, and Runway ML.
  - Prototype interactive experiences, brand moments, or UI/UX
    flows using tools such as Figma, Webflow, Framer, or
    HTML/CSS/JS.
  - Collaborate with cross-functional teams including product
    designers, brand creatives, and engineers to bring AI-
    assisted concepts to life.
  - Iterate rapidly — test, refine, and evolve concepts using AI
    tools and traditional design methods.
  - Explore & innovate: Push the capabilities of AI to explore
    new visual languages, interaction paradigms, and
    storytelling formats.
  - Document your process and learnings to help build scalable
    workflows and design systems infused with AI capabilities.
  - Stay ahead of trends in generative design, AI tooling, and
    prototyping best practices.

  What You Bring:

  - 3–6 years of experience in digital/visual/product design,
    creative technology, or a related field.
  - A strong portfolio showcasing AI-generated work and rapid
    prototyping examples.
  - Mastery of generative AI tools (e.g. Midjourney, DALL·E,
    Runway, Stable Diffusion, ChatGPT for ideation/scripting).
  - Solid skills in visual design and UX/UI principles.
  - Experience with Figma, Framer, Webflow, or front-end tools
    for prototyping.
  - Curiosity, adaptability, and a love for experimentation.
  - Ability to work in a fast-paced, exploratory environment
    with shifting priorities.

  Nice-to-Have:

  - Experience with creative coding (e.g. p5.js, Three.js) or
    scripting in Python/JavaScript.
  - Motion design or 3D prototyping skills (e.g. Blender, After
    Effects, Spline).
  - Familiarity with fine-tuning AI models or working with APIs
    (OpenAI, Stability, etc.).
  - Previous work in innovation labs, R&D, or startup
    environments.

  Compensation, Benefits and Duration

  Minimum Compensation: USD 52,000 Maximum Compensation: USD
  182,000 Compensation is based on actual experience and
  qualifications of the candidate. The above is a reasonable
  and a good faith estimate for the role. Medical, vision, and
  dental benefits, 401k retirement plan, variable
  pay/incentives, paid time off, and paid holidays are
  available for full time employees. This position is not
  available for independent contractors No applications will
  be considered if received more than 120 days after the date
  of this post
