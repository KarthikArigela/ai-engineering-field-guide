description: |
  Our mission is to enable everyone to build wealth.

  We reinvent how trading and investing work by creating
  exceptional products people love.

  Fostering a culture of excellence and high velocity is the
  key to our success.

  Today, we serve over 6 million clients, with more than €38
  billion in assets under management - a testament to the
  scale and trust we’ve built in just a few years

  Our platform is powered by a modern, high-performance
  engineering stack designed for scale and reliability: Java
  21 (Spring), PostgreSQL, MariaDB, Redis, Kafka, ClickHouse,
  Elasticsearch, Docker, Grafana, AWS, k8s, Kibana.

  You'll join the team building Trading 212's AI Financial
  Assistant - giving everyday traders the tools and insights
  to trade at a professional level. This means working at the
  intersection of cutting-edge AI, real-time market data. The
  scale is real, the data is rich, and the engineering
  challenges are the kind that don't have easy answers.

  We offer remote or hybrid working, depending on location,
  with flexibility balanced against team performance and
  collaboration needs. We also provide an attractive benefits
  package, which may vary depending on your location. Full
  details will be shared during the initial screening, and we
  encourage you to come prepared with any questions.

  What you’ll do

  - Develop solutions by taking a holistic approach to problem
    solving, understanding business needs, service
    architecture, and underlying technologies and
    infrastructure.
  - Engage in the full SDLC: from forming requirements, design,
    implementation, testing, deployment, to monitoring,
    ownership sits with you end to end.
  - Take full ownership of your code and maintain it to a high
    standard, continuously improving and refactoring when
    needed.
  - Build for performance, scale, and resilience, operating in
    an environment where downtime, latency, and data loss are
    not acceptable.
  - Work in small, autonomous teams with short release cycles,
    balancing speed with engineering discipline.
  - Learn from peers and actively share knowledge, contributing
    to a culture of honest feedback and continuous
    improvement.



  What you need to have

  - Passion for building AI-driven solutions using rich, large
    scale datasets, with the ambition to take advantage of the
    tools, resources, and engineering support needed to solve
    challenging real world problems.
  - Experience building services in a microservices
    architecture.
  - Strong understanding of communication protocols such as
    HTTP, WebSockets, and AMQP, and when to apply each.
  - Experience with at least one modern web framework (language-
    agnostic mindset preferred).
  - Deep understanding of relational databases, including
    indexing, transactions, isolation levels, locking
    mechanisms, and high-performance design.
  - Ability to design and operate systems that perform reliably
    at scale.

  All applicants will be contacted, regardless of whether they
  are selected!

  Are you ready to accelerate your career with us? We'd love
  to hear from you!

  We process applicant data confidentially and in accordance
  with applicable data protection laws. We may use AI-powered
  tools to help review applications, but all hiring decisions
  are made by our human recruitment team. Where required by
  law, we rely on your consent to use these tools.  You may
  withdraw this consent or exercise your data protection
  rights at any time by contacting us.
