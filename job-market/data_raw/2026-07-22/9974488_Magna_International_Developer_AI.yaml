  What we offer:

  At Magna, you can expect an engaging and dynamic environment
  where you can help to develop industry-leading automotive
  technologies. We invest in our employees, providing them
  with the support and resources they need to succeed. As a
  member of our global team, you can expect exciting, varied
  responsibilities as well as a wide range of development
  prospects. Because we believe that your career path should
  be as unique as you are.

  Group Summary:

  Cosma provides a comprehensive range of body, chassis and
  engineering solutions to global customers. Through our
  robust product engineering, outstanding tooling capabilities
  and diverse process expertise, we continue to bring
  lightweight and innovative products to market.

  Job Responsibilities:

  - We are building fully connected systems to achieve
    operational excellence and flawless launches – help us:
  - Collaborate closely with product managers, stakeholders,
    data scientists, and software engineers to design and
    deliver AI/ML and Generative AI solutions aligned to
    business objectives
  - Design, build, deploy, and maintain LLM-based applications
    and AI agents using Azure OpenAI Studio and Azure
    Cognitive Services
  - Develop and manage secure integrations between AI models,
    enterprise applications, APIs, and external services
  - Build and maintain robust data pipelines to connect,
    extract, transform, and load (ETL) structured and
    unstructured data from multiple enterprise data sources
  - Implement and optimize Retrieval-Augmented Generation (RAG)
    pipelines to enhance model context, accuracy, and
    relevance
  - Perform model tuning, prompt engineering, testing,
    monitoring, and performance optimization to ensure
    scalable and reliable AI solutions
  - Support business decision-making and operational
    improvements through AI-driven insights, experimentation,
    and data analysis
  - Develop, test, and deploy AI services, APIs, and
    microservices following enterprise engineering and DevOps
    best practices
  - Work with SQL databases and complex data models to support
    AI workflows, training, and inference
  - Monitor and improve system performance, latency,
    reliability, security, and compliance with enterprise
    governance standards
  - Create and maintain technical documentation for AI
    solutions, APIs, data pipelines, and system architecture.
  - Explain technical concepts, AI capabilities, and analytical
    insights clearly to both technical and non-technical
    audiences
  - Support multiple projects in a fast-paced, agile development
    environment
  - Participate in DevOps processes to track development,
    testing, deployment, and production support activities
  - Respond to production issues, user inquiries, and
    enhancement requests related to AI applications and
    services
  - Perform additional duties as assigned
  - Act with honesty and integrity and make ethical business
    decisions in compliance with organizational policies and
    procedures

  Awareness, Unity, Empowerment:

  At Magna, we believe that a diverse workforce is critical to
  our success. That’s why we are proud to be an equal
  opportunity employer. We hire on the basis of experience and
  qualifications, and in consideration of job requirements,
  regardless of, in particular, color, ancestry, religion,
  gender, origin, sexual orientation, age, citizenship,
  marital status, disability or gender identity. Magna takes
  the privacy of your personal information seriously. We
  discourage you from sending applications via email or
  traditional mail to comply with GDPR requirements and your
  local Data Privacy Law.

  AI-Assisted Screening Disclosure

  As part of our commitment to a fair, consistent, and
  efficient recruitment process, we may use artificial
  intelligence (AI) tools to assist in the initial screening
  of applications submitted through our Workday system. These
  tools help identify qualifications and experience that align
  with the role requirements. Please note that AI is used
  solely to support our recruiters. Final decisions are always
  made by the hiring manager and the hiring team. Importantly,
  no applicant data is shared externally through these AI
  tools. All information remains securely within our systems
  and is handled in accordance with our privacy and data
  protection policies.

  Under conditions defined by applicable law, you may have the
  right to request an explanation of how AI is used to support
  decision-making.

  If you have any questions or concerns about this process,
  feel free to contact our Talent Attraction team.

