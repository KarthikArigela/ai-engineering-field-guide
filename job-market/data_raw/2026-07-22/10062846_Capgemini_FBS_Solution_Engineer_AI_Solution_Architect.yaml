title: FBS Solution Engineer (AI Solution Architect)
company: Capgemini
location:
work_type: FULL_TIME
company_size: 340,000 Employees
description: |
  Own end-to-end architecture for AI voice agent solutions
  across Cisco, GECX, and backend services. Lead integration
  and orchestration across telephony, AI, and CX systems to
  enable real-time interactions. Define backend architecture,
  APIs, and scalability patterns. Design conversational flows,
  state management, and observability frameworks. Establish
  performance standards and optimize system scalability.
  Collaborate with product, engineering, and vendors to drive
  roadmap and implementation.

  Must to have Skills : Cisco contact center, GECX / CX,
  Node.JS, AI-driven conversational or customer interaction
  platforms (voice/chat)

  Work Timings (India): 01:00 PM to 10:00PM IST

  Relevant Experience: 3 - 5+ years in conversational systems,
  voice/chat platforms, or AI-driven customer interaction
  solutions, GECX (CX) or similar platforms (1-2 years)

  Total Experience: 15 to 20 Years

  Requirements

  - Solution architecture for distributed, real-time systems

  - Cisco contact center platforms (telephony, SIP, routing,
    handoffs)

  - CX platforms (GECX / Genesys or similar)

  - Node.js backend architecture (APIs, microservices,
    integration layers)

  - API design, system integration, and event-driven
    architectures

  - Conversational systems design (prompt-based flows,
    session/state management)

  - Experience building integration layers/services (Node.js
    and/or Python)

  - Observability, logging, and performance monitoring for real-
    time systems

  Benefits

  Competitive compensation and benefits package:

  - Competitive salary and performance-based bonuses
  - Comprehensive benefits package
  - Career development and training opportunities
  - Flexible work arrangements (remote and/or office-based)
  - Dynamic and inclusive work culture within a globally
    renowned group
  - Private Health Insurance
  - Pension Plan
  - Paid Time Off
  - Training & Development

  Note: Benefits differ based on employee level.

