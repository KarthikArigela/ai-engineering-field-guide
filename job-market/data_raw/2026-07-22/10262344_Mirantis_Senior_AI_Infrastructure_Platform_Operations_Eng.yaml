description: |
  Company Description

  Mirantis is the Kubernetes-native AI infrastructure company,
  enabling organizations to build and operate scalable,
  secure, and sovereign infrastructure for modern AI, machine
  learning, and data-intensive applications. By combining open
  source innovation with deep expertise in Kubernetes
  orchestration, Mirantis empowers platform engineering teams
  to deliver composable, production-ready developer platforms
  across any environment—on-premises, in the cloud, at the
  edge, or in sovereign data centers. As enterprises navigate
  the growing complexity of AI-driven workloads, Mirantis
  delivers the automation, GPU orchestration, and policy-
  driven control needed to manage infrastructure with
  confidence and agility. Committed to open standards and
  freedom from lock-in, Mirantis ensures that customers retain
  full control of their infrastructure strategy.
  https://www.mirantis.com/

  Job Description

  Our organization is establishing an Americas-based AI
  Infrastructure & Platform Operations unit dedicated to the
  management of expansive AI ecosystems utilizing NVIDIA GPU
  acceleration, high-speed interconnects, Kubernetes, and
  bleeding-edge platform frameworks.

  This team maintains the reliability, efficiency, and
  architectural integrity of vital AI service platforms across
  a global datacenter footprint. Positioned at the nexus of
  core infrastructure and network engineering, you will
  sustain the high-performance environments essential for
  contemporary AI application suites.

  This position offers the chance to engage with pioneering AI
  hardware while driving the development of automated
  operational capabilities via the k0rdent AI platform.

  Responsibilities

  Technical Operations & Service Reliability

  - Lead the investigation and resolution of complex
    infrastructure, networking, and platform-related
    incidents.
  - Act as a senior escalation point for operational teams
    during critical service-impacting events.
  - Support large-scale NVIDIA GPU infrastructure and high-
    performance networking environments.
  - Troubleshoot complex Linux, Kubernetes, networking, storage,
    and hardware-related issues.
  - Analyze platform performance, capacity, stability, and
    reliability trends to proactively identify risks.
  - Lead root cause analysis activities and drive long-term
    corrective actions.
  - Collaborate with engineering teams, hardware vendors, and
    datacenter personnel to resolve complex technical
    challenges.
  - Participate in major incident management and service
    restoration activities.

  Platform Operations & Engineering

  - Provide technical leadership for Kubernetes platform
    operations and supporting infrastructure services.
  - Drive improvements in platform reliability, observability,
    monitoring, and operational processes.
  - Identify opportunities to automate repetitive operational
    activities and improve operational efficiency.
  - Contribute to operational readiness reviews, infrastructure
    changes, upgrades, and service introductions.
  - Support the adoption and operation of AI-powered
    infrastructure services and operational capabilities
    through k0rdent AI.
  - Evaluate emerging technologies and operational practices to
    improve service delivery and platform resilience.

  Technical Leadership

  - Mentor and support AI Infrastructure & Platform Operations
    Engineers.
  - Share technical knowledge through documentation, training
    sessions, and operational reviews.
  - Develop and maintain operational standards, runbooks,
    troubleshooting guides, and best practices.
  - Help define operational processes, escalation paths, and
    service reliability standards.
  - Act as a trusted technical advisor during operational
    planning and service improvement initiatives.

  Qualifications

  - 7+ years of experience in infrastructure operations,
    platform operations, site reliability engineering, network
    operations, cloud operations, datacenter operations, or
    related technical roles.
  - Expert-level Linux administration and troubleshooting
    skills.
  - Strong networking expertise, including experience diagnosing
    complex performance, connectivity, and reliability issues.
  - Strong experience operating Kubernetes in production
    environments.
  - Experience supporting large-scale production infrastructure
    and distributed systems.
  - Proven experience leading technical investigations and
    managing complex incidents.
  - Experience performing root cause analysis and driving long-
    term operational improvements.
  - Strong understanding of observability, monitoring, and
    service reliability practices.
  - Excellent troubleshooting and analytical skills across
    multiple infrastructure domains.
  - Strong communication, collaboration, and stakeholder
    management skills.

  Preferred Experience

  Experience in one or more of the following areas is highly
  desirable:

  - NVIDIA GPU infrastructure and accelerated computing
    platforms.
  - InfiniBand networking and NVIDIA UFM.
  - AI infrastructure environments.
  - HPC environments.
  - Platform Engineering or Site Reliability Engineering (SRE).
  - Large-scale Kubernetes operations.
  - Infrastructure automation technologies and Infrastructure-
    as-Code practices.
  - Observability platforms such as Grafana, Prometheus, ELK, or
    OpenTelemetry.
  - Performance analysis and optimisation of distributed
    infrastructure platforms.
  - Technical leadership, mentoring, or team lead
    responsibilities.

  Why Join Us?

  - Operate some of the most advanced AI infrastructure
    environments in production today.
  - Work with the latest NVIDIA GPU technologies, Kubernetes
    platforms, and high-performance networking environments.
  - Help define operational standards and reliability practices
    for next-generation AI infrastructure services.
  - Influence the adoption of AI-powered operational
    capabilities through k0rdent AI.
  - Work alongside highly skilled engineers solving complex
    infrastructure and platform challenges at scale.
  - Join a growing organisation investing heavily in AI
    infrastructure, platform services, and operational
    innovation.

  Additional Information

  What does Mirantis offer you?

  - Work with an established Silicon Valley leader in the cloud
    infrastructure industry;
  - Work with exceptionally passionate, talented and engaging
    colleagues, helping Fortune 500 and Global 2000 customers
    implement next-generation cloud technologies;
  - Be a part of cutting-edge, open-source innovation;
  - Thrive in the high-energy environment of a young company
    where openness, collaboration, risk-taking, and continuous
    growth are valued;
  - Professional development and training;
  - Attend conferences and working groups;
  - Company outings, happy hours, hackathons, and tech talks;
  - Receive a competitive compensation package with a strong
    benefits plan.

  We are a Leader for Container Management in G2 (#2 after
  AWS)!
