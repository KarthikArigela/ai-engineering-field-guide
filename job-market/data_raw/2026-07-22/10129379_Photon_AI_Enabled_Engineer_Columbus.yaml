title: "AI Enabled Engineer | Columbus"
company: Photon
location: USA
work_type: FULL_TIME
description: |
  Job Summary

  We are seeking an innovative and experienced AI Enabled
  Engineer to join our team. The ideal candidate will possess
  strong software engineering fundamentals and hands-on
  expertise in developing AI-powered solutions using Python
  and Java. This role requires experience in designing and
  building intelligent agents that are focused on enhancing
  end-user journeys and delivering seamless, personalized
  experiences.

  The candidate will collaborate with cross-functional teams
  to architect, develop, and deploy scalable AI-driven
  applications that solve complex business problems and
  improve customer engagement.

  Key Responsibilities

  - Design, develop, and maintain AI-enabled applications and
    services using Python and Java.
  - Build and deploy intelligent agents, copilots, and
    automation workflows that optimize end-user journeys.
  - Develop, test, and integrate AI/ML models into enterprise
    applications.
  - Collaborate with product managers, designers, and
    engineering teams to translate business requirements into
    scalable technical solutions.
  - Design and implement APIs, microservices, and backend
    systems to support AI-powered capabilities.
  - Integrate Large Language Models (LLMs), conversational AI
    frameworks, and third-party AI services into existing
    platforms.
  - Monitor, evaluate, and continuously improve the performance,
    accuracy, and reliability of AI systems.
  - Ensure security, scalability, and maintainability of AI-
    enabled solutions.
  - Stay current with emerging technologies and industry trends
    in artificial intelligence and agentic systems.

  Required Qualifications

  - Bachelor’s or Master’s degree in Computer Science,
    Engineering, or a related field.
  - Strong programming experience in Python and Java.
  - Proven experience in building intelligent agents focused on
    end-user journeys, including conversational AI, copilots,
    or autonomous workflows.
  - Solid understanding of software engineering principles,
    object-oriented programming, and system design.
  - Experience developing and consuming RESTful APIs and
    microservices.
  - Familiarity with databases, including SQL and NoSQL
    technologies.
  - Experience working with cloud platforms such as AWS, Azure,
    or Google Cloud.
  - Strong analytical, problem-solving, and communication
    skills.

  Preferred Qualifications

  - Experience with Generative AI, Large Language Models (LLMs),
    and agentic AI frameworks such as LangChain, LangGraph,
    CrewAI, or similar technologies.
  - Knowledge of prompt engineering, Retrieval-Augmented
    Generation (RAG), vector databases, and AI orchestration
    frameworks.
  - Experience with containerization and orchestration
    technologies such as Docker and Kubernetes.
  - Familiarity with CI/CD pipelines and Agile development
    methodologies.

  Compensation, Benefits and Duration

  Minimum Compensation: USD 44,000 Maximum Compensation: USD
  154,000 Compensation is based on actual experience and
  qualifications of the candidate. The above is a reasonable
  and a good faith estimate for the role. Medical, vision, and
  dental benefits, 401k retirement plan, variable
  pay/incentives, paid time off, and paid holidays are
  available for full time employees. This position is
  available for independent contractors No applications will
  be considered if received more than 120 days after the date
  of this post
