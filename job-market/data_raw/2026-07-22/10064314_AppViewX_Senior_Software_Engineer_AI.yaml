description: |
  Job Title: Senior Software Engineer, AI

  Experience: 5-8 yrs

  Location: Bangalore/Coimbatore

  AppViewX is trusted by the world’s leading organizations to
  reduce risk, ensure compliance, and increase visibility
  through automated certificate lifecycle management. At
  AppViewX, you will get to work with our AVX ONE platform
  that provides complete certificate lifecycle management and
  PKI-as-a-Service using streamlined automation workflows to
  prevent outages, reduce security incidents, and enable
  crypto-agility. AppViewX is also certified as a Great Place
  to Work in India, cementing us as an employer of choice.

  Role Overview:

  A seasoned full-stack engineer to take ownership of critical
  system components and lead technical initiatives. You'll
  architect scalable solutions, mentor junior developers, and
  partner with customers to deliver transformative AI Security
  products. Your expertise will shape the technical direction
  of our platform.

  Key Responsibilities:

  - Architect and deliver scalable full-stack and AI-driven
    systems on AWS, ensuring security, performance, and
    reliability.
  - Lead design reviews and establish coding standards, best
    practices, and architectural patterns.
  - Mentor and guide junior engineers on technical problem-
    solving, code quality, and career growth.
  - Drive AI/ML tool integrations, evaluate, implement, and
    optimize AI APIs and models within production systems.
  - Optimize system performance by identifying bottlenecks,
    implementing caching strategies, and optimizing queries
    and infrastructure.
  - Interact with customers, translate business requirements
    into technical solutions, present technical architecture,
    and gather feedback.
  - Collaborate cross-functionally with product, security, and
    DevOps teams to deliver end-to-end solutions.

  Qualifications:

  - 5–8 years of professional experience in software
    engineering, specializing in designing and deploying
    enterprise-grade applications.
  - Demonstrates proven full-stack skills, particularly in
    backend development with Python and modern frontend
    frameworks like React.
  - Has system design and architecture expertise, capable of
    creating scalable and resilient systems from the ground
    up.
  - Possesses strong analytical and reasoning abilities to solve
    complex technical problems.
  - Excellent at communicating and presenting in English,
    comfortable engaging with customers, stakeholders, and
    cross-functional teams.
  - Holds operational knowledge at the production level,
    including monitoring, logging, debugging, and incident
    response.
  - Has a deep understanding of distributed systems, covering
    concepts like eventual consistency, consensus algorithms,
    and microservices architecture.
  - Familiar with high-availability design patterns, such as
    load balancing, replication, and failover strategies.
  - Skilled in performance engineering, including profiling,
    optimization, and capacity planning.
  - Contributor to open-source projects or active in technical
    communities.
  - Good to have AWS certifications like Solutions Architect
    Professional or Specialty.
  - Experienced with containerization technologies such as
    Docker and Kubernetes.

  Our Values

  At AppViewX, our values reflect how we work together in
  practice—not just what we aspire to. They show up in
  everyday decisions, how we collaborate across teams, and how
  we treat each other while building and delivering our work.
  If these values resonate with you, you’ll likely feel at
  home here.

  - Clarity: We interact with transparency, simplicity, and
    shared purpose.
  - Unity: We build unity through mutual respect, trust, and
    collaboration.
  - Innovation: We stay curious, challenge assumptions, and
    drive continuous improvement.
  - Speed: We act with urgency, focus, and follow-through to
    deliver results fast.
  - Precision: We bring accuracy, consistency, and care to
    everything we do.

  Why AppViewX?

  AppViewX caters to a wide range of customers from Fortune
  1000 companies, including six of the top ten global
  commercial banks, five of the top ten global media
  companies, and five of the top ten managed healthcare
  providers. Over the years, we grew our diverse team,
  perfected our automation platform, and expanded our global
  footprint to India, North America, United Kingdom, and
  Australia. Today, we are headquartered in New York City and
  have come a long way by optimizing opportunities to create
  lasting relationships with enterprises, gaining unshakable
  customer trust along the way.

  AppViewX is proud to be an Equal Employment Opportunity
