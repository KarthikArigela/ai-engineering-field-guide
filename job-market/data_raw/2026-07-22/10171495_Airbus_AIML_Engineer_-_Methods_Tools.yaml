description: |
  Job Description:

  AI/ML Engineer - Methods & Tools

  Team: Airbus India - Engineering Methods & Tools

  About the team:

  We are a transverse team working with different core
  engineering verticals in Airbus. The USP of this team is
  working in a multi-functional environment providing digital
  solutions to engineering problems. The team is composed of
  people with Core Engineering domain knowledge complemented
  by software development skills. The team plays an enabler
  role in various digitization initiatives across Airbus
  utilizing the latest technologies and the domain knowledge
  they have.

  Some examples of the digital solutions are Data driven
  designs of wiring, Automated routing electrical harnesses,
  Data Analytics based products aimed at reducing physical
  tests of material specimens. We are also involved in
  developing web-based solutions to encapsulate and automate
  different workflows such as flight test planning, business
  management etc. Some of the tools developed are used in the
  areas of Aircraft Safety analysis and Engineering Business
  Data monitoring etc.

  We work in Agile/Scrum/SAFe processes in developing state of
  the art digital products for the areas mentioned above.

  The Role: What You’ll Do

  As an AI/ML Engineer, you will bridge the gap between data
  science and software engineering. You will own the lifecycle
  of machine learning models from conceptualization to
  production deployment and monitoring.

  - Design & Build: Develop, optimize, and deploy scalable ML/DL
    models (including computer vision, NLP, or LLMs).
  - Scale & Deploy: Architect robust ML pipelines (MLOps) to
    automate model training, testing, and deployment.
  - Collaborate: Work closely with Data Scientists and Product
    Managers to integrate AI capabilities into our core
    platform.
  - Optimize: Fine-tune models for latency, throughput, and
    resource utilization in a cloud or edge environment.
  - Innovate: Stay at the forefront of AI research and evaluate
    how new technologies/methodologies can be applied to our
    product roadmap.

  What We’re Looking For (Requirements)

  - Experience: 3+ years of professional experience as an ML
    Engineer, Data Scientist, or Software Engineer with focus
    on AI.
  - Education: BTech/MTech/PhD in Computer Science, Data
    Science, Mathematics, or a related quantitative field (or
    equivalent practical experience).
  - Programming Power: Strong proficiency in Python (and/or Go)
    with clean, production-grade coding standards.
  - ML Stack: Good expertise with frameworks like PyTorch,
    TensorFlow/Keras and libraries like Scikit-Learn, Pandas,
    and NumPy.
  - Computer Vision: Solid understanding of CV techniques and
    frameworks. Experience with object detection, image
    segmentation, or image classification using tools like
    OpenCV, YOLO, or Hugging Face vision models.
  - Data Engineering: Experience with Data engineering and
    orchestration tools (MLFlow, DVC, Spark, Kafka) or Data
    Platforms (Snowflake/Foundry).
  - LLMs (Optional but preferred): LangChain, LlamaIndex, vector
    databases, experience with RAGs and fine-tuning open-
    source LLMs.
  - Cloud (Optional but preferred): Hands-on experience with
    cloud platforms (AWS, GCP, or Azure).
  - Knowledge Graphs: Ability to design, build, and query
    Knowledge Graphs. Familiarity with graph technologies,
    ontologies, and graph databases (e.g., Neo4j, AWS Neptune,
    NetworkX, or Graph Neural Networks).

  Bonus Points If You Have

  - A strong portfolio of GitHub projects or contributions to
    open-source AI/ML libraries.
  - Experience with model deployment (ONNX, TensorRT)

  Soft Skills

  - Very good communication and presentation skills
  - Ability to demonstrate effectiveness in holding
    conversations with customers in a customer-centric
    outreach.
  - Demonstrate ability to work as a team in a highly
    collaborative and cross-cultural environment.

  Why Join Us?

  You will work at the exciting intersection of code and the
  physical world. Your work won't just live in a database—it
  will directly influence how real-world aerospace systems are
  designed, simulated, and built. We offer a collaborative
  environment, cutting-edge projects, and ample opportunities
  for professional growth.

