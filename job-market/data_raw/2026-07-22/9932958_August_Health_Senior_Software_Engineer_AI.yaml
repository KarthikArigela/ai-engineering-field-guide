title: Senior Software Engineer, AI
company: August Health
location: USA
remote: true
work_type: FULL_TIME
description: |
  About August Health

  At August Health, our mission is to empower the essential
  work of caring for our elders.

  We achieve this by providing a modern operating platform and
  electronic health record (EHR) that enables senior living
  operators to deliver high-quality care with confidence.

  Caregivers are the heart of senior living communities,
  embodying care, compassion, and well-being. Yet, they face
  increasing challenges—higher resident acuity, complex
  workflows, and staffing shortages. At August Health, we
  build tools that simplify their tasks, eliminate
  inefficiencies, and provide the insights they need to focus
  on what truly matters—caring for residents.

  At August, we strive to live our values each day, in every
  interaction with our customers and with each other.

  - Be responsible – leave things better than you found them
  - Take ownership – be decisive and take action
  - Be ambitious – build something great
  - Keep an open mindset – communicate candidly and welcome new
    ideas
  - Be humble – celebrate each others’ successes and learn from
    our mistakes
  - Stay positive – assume best intent

  About the Role

  August Intelligence is the AI layer woven throughout the
  August Health platform. It turns the data caregivers and
  operators already create into timely, role-specific insight:
  resident summaries, assessment suggestions, voice-to-chart
  documentation, and more.

  Today, August Intelligence runs primarily through a
  TypeScript service that orchestrates Claude on AWS Bedrock
  against carefully permissioned, PHI-aware context from our
  backend. The work is deeply product-facing: the goal is not
  to build AI demos, but to ship reliable AI capabilities into
  real healthcare workflows.

  You will be the first dedicated engineer to join August
  Intelligence alongside its lead. This is a high-autonomy,
  high-ownership role. You will take AI features from idea
  through pilot to production, build the evaluation and
  observability discipline that keeps nondeterministic
  features trustworthy, and partner directly with product
  teams across EHR, Care Track, billing, and future verticals.

  A major part of the charter is enablement. August
  Intelligence should help other product teams build better AI
  features by pairing with their engineers, sharing reusable
  patterns, reviewing designs and code, and tending the AI
  tooling and practices that make the whole engineering
  organization more effective.

  You will have real influence over how August builds AI: the
  product instincts, implementation patterns, guardrails,
  developer experience, and bar for quality.

  What You'll Do

  - Design and ship LLM-powered product features end to end,
    including prompt and context design, structured output,
    tool/agent orchestration, and the UI/API work needed to
    land them in the product.
  - Pair with product-vertical engineers to unblock AI feature
    work and help teams apply August Intelligence patterns in
    their own product areas.
  - Turn repeated AI implementation work into reusable tools,
    examples, documentation, and lightweight practices that
    other teams can adopt.
  - Build and extend our evaluation discipline so we can measure
    quality, catch regressions, and reason about
    nondeterministic behavior before customers feel it.
  - Improve observability for AI workflows, including traces,
    prompt visibility, errors, latency, cost, and production
    feedback loops.
  - Harden AI features for production: latency, cost, caching,
    pre-computation, timeouts, cancellation, memory behavior,
    and operational reliability.
  - Handle PHI and sensitive resident data with care, including
    redaction, permissioning, tenancy boundaries, and safe
    access patterns.
  - Partner with product managers and vertical engineering teams
    to translate clinical and operational workflows into AI
    capabilities.
  - Help August learn where AI can make the product meaningfully
    more useful by prototyping, measuring, and refining ideas
    against real workflows.
  - Help non-engineers experiment safely with real data while
    creating a clear path from prototype to production.
  - Help drive responsible AI tool use inside engineering by
    modeling effective workflows, reviewing AI-assisted
    output, and raising shared standards without turning
    experimentation into ceremony.
  - Review code, including AI-assisted code, with rigor and help
    set August Intelligence's engineering standards.

  About You

  - You have 5+ years of experience building and shipping
    production software.
  - You have owned customer-facing features end to end and care
    about what happens after launch.
  - You are strong in production TypeScript, including typed
    Node services, testing, APIs, and clean data modeling.
  - You have hands-on applied-LLM experience: prompt design,
    structured output, tool or agent design, and practical
    reasoning about cost, latency, hallucination, and
    reliability tradeoffs.
  - You have a bias toward the smallest useful thing: you ship a
    walking skeleton, learn from it, and iterate rather than
    guessing future states and going big too early.
  - You can explain exactly how your code works, including code
    an LLM helped you write.
  - You enjoy pairing with other engineers, teaching through
    real work, and helping teams adopt new patterns without
    taking ownership away from them.
  - You are comfortable working with sensitive data and treat
    permissioning, privacy, and safety as table stakes.
  - You communicate clearly in writing and conversation,
    especially when working with PMs, clinicians, operators,
    and engineers from other product areas.
  - You have high agency and low ego. You like shaping ambiguous
    problems, not just implementing tickets.

  Nice to Have

  - Experience with Mastra, the Vercel AI SDK, LangChain,
    LlamaIndex, or similar applied-LLM frameworks.
  - Experience with eval or observability tooling for LLM
    systems, such as Phoenix/Arize, Langfuse, Helicone, or
    related tools.
  - Experience helping an engineering team adopt AI tools,
    agentic coding workflows, or new development practices
    responsibly.
  - Experience with functional TypeScript or Effect.
  - Ability to read Scala or interest in learning enough Scala
    to navigate our backend.
  - Healthcare, senior living, SOC 2, HIPAA, or other regulated-
    industry experience.
  - Experience as an early engineer on a small, high-ownership
    team.

  You will join a small, senior, mission-driven engineering
  organization that values depth, candor, and shipping. August
  Intelligence is a focused effort with outsized impact: our
  AI features are already being used in beta communities, and
  demand is accelerating across product areas.

  This team is meant to be a multiplier: building important AI
  capabilities directly, helping product teams build their
  own, and raising the quality of August's AI tooling and
  practices over time.

  This is a chance to help define how AI should work inside a
  healthcare product: useful, reliable, permission-aware,
  observable, and grounded in the reality of caregiving.

  About our team

  Our team brings together deep expertise in technology,
  healthcare, and company-building. We’ve led teams at Apple,
  Google, Landmark Health, and Adobe, co-founded and exited
  multiple companies, shipped products used by hundreds of
  millions of users, and managed clinical teams caring for
  thousands of patients.

  Backed by top-tier Silicon Valley investors, we are
  partnering with some of the largest senior care
  organizations in the U.S. to transform the future of senior
  living.

  We offer market-competitive compensation based on experience
  and ability, including significant equity option grants. Our
  benefits prioritize your well-being with 100% company-paid
  premiums for health, dental, and vision coverage, along with
  company contributions to your HSA. We help you plan for the
  future with a 2% 401(k) match, and support your physical and
  mental health through services like Rightway Health Advocacy
  and Spring Health Mental Wellness. Beyond traditional
  benefits, we offer a flexible time off policy, 100% paid
  family leave, and all-expenses-paid, in-person company
  offsites twice a year.
