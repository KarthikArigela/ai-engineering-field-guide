title: Software Engineer II, AI Developer Experience
company: Temporal Technologies
location: USA
work_type: FULL_TIME
description: |
  About Us

  Temporal is an open source programming model that can
  simplify code, make applications more reliable, and help
  developers focus on the important things like delivering
  features faster. We are on a mission to be the reliable
  foundation of every developer’s toolbox, and are building
  the team that will make that happen.



  Our values guide us —they are present in how we show up,
  make decisions, and work together to make an impact. We’re
  curious, driven, collaborative, genuine and humble.



  Temporal is growing and we are looking for those who share
  our values, challenge 'standard' thinking, and want to
  influence our future. If you have a passion for improving
  the developer experience, building world-class open-source
  software and communities, and want to be a part of our
  amazing team, we'd love to hear from you!

  Summary

  Summary Join our AI Developer Experience Team as a Software
  Engineer II. Our mission is to empower a company of builders
  by delivering a frictionless, standardized ecosystem of core
  engineering tools. You'll partner with teams across the
  company to help standardize workflows and contribute to a
  tight feedback loop with product leadership that shapes our
  product direction.

  What You Will Do

  - Build and maintain internal engineering tooling that
    improves builder flow and reduces friction across the
    company.
  - Help support adoption of AI agentic coding tools through
    documentation, automation, and guidance.
  - Contribute to the development and operation of internally
    facing agents.
  - Help implement developer workflows, including guardrails and
    evaluation approaches that enable safe adoption of new
    tooling.
  - Support the development and operation of our internal agent
    platform.
  - Partner with teams across Engineering, Product, Sales, and
    G&A to understand where AI could accelerate their work or
    improve outcomes.
  - Contribute to measurement and feedback loops (usage,
    reliability, cost, and cycle time) to help quantify impact
    and guide iteration.
  - Help maintain documentation and enablement materials that
    support builders using the paved roads.
  - Participate in on-call to support internal users.

  What You’ll Bring

  - Solid software engineering fundamentals, with some
    experience contributing to production-quality internal
    platforms or developer tooling.
  - Familiarity with modern agentic coding tools such as Codex
    and Claude Code.
  - Proficiency in one or more programming languages commonly
    used at Temporal, such as Go, TypeScript/JavaScript,
    Python, or Java.
  - Experience building or contributing to workflow automation
    or internal tools (CLI tools, services, GitHub automation,
    cloud automation, or similar).
  - Good judgment about when to standardize versus when to
    enable flexibility, with growing ability to balance
    friction reduction against reliability.
  - Comfort working cross-functionally, including with non-
    traditional developers, and translating their needs into
    usable solutions.
  - Ability to use data and qualitative feedback to help
    prioritize and measure impact.
  - Clear written communication, including documentation that
    supports self-service.

  Nice to Have

  - Exposure to building internal agents or supporting an agent
    platform.
  - Familiarity with developer productivity measurement
    frameworks such as SPACE and DORA metrics.

  Compensation

  - The estimated pay range for this role is $160,000 -
    $200,000.
  - Additionally, this role is eligible to participate in
    Temporal's equity plan.

  Compensation ranges reflect salary and commission
  compensation (when applicable) across several geographic
  markets. Employment offers carefully consider multiple
  factors, including prior experience, knowledge, expertise,
  skillset, market location, and job level assessed during the
  interview process.



  Employee benefits and perks below are for full-time
  employees, part-time or temporary positions are excluded.



  U.S. Benefits

  - Unlimited PTO, 12 Holidays + 2 Floating Holidays
  - 100% Premiums Coverage for Medical, Dental, and Vision
  - AD&D, LT & ST Disability, and Life Insurance (Standard &
    Supplemental Available)
  - Empower 401K Plan
  - Additional Perks for Learning & Development, Lifestyle
    Spending, In-Home Office Setup, Professional Memberships,
    WFH Meals, Internet Stipend and more!

  International Benefits

  Paid Time Off (PTO) and Benefits outside the United States
  vary by country, and are issued in partnership with
  Remote.com.  Additionally, Temporal offers perks to all
  international employees for learning & career development, a
  lifestyle spending account, in-home office setup (in
  addition to company-issued hardware), professional
  memberships, work-from-home meals, and access to the Calm
  app for mental wellness.

  Travel

  Temporal is a globally distributed, collaborative team that
  values opportunities for in-person connection. Occasional
  travel may be required for company events, team offsites,
  and other meaningful moments that bring us together.

  Additional Perks

  - $3,600 / Year Work from Home Meals
  - $1,800 / Year Professional Enrichment (Career Development &
    Professional Memberships)
  - $1,200 / Year Lifestyle Spending Account
  - $1,000 / Year In-Home Office Setup (In addition to Temporal
    issued equipment - laptop, monitor, keyboard, mouse,
    trackpad, and extension power cable at no cost to you)
  - $74 / Month Reimbursement for Internet
  - Calm App Subscription for Mental Health & Wellness

