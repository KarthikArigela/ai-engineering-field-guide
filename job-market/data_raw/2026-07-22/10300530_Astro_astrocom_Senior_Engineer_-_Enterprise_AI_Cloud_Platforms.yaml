description: |
  WHY JOIN US?

  - We practice a vibrant & energetic office culture.
  - We provide opportunities for career advancement within the
    company.
  - Good performance is always rewarded accordingly.

  “It's our people that make Astro Malaysia’s leading
  entertainment company. We are an inclusive employer, to
  enable everyone at Astro to be their best. We embrace
  differences – we celebrate it, we support it, and we thrive
  on it for the benefit of our employees, our
  products/services and our community. We also understand and
  appreciate that diversity is a driver of creativity and
  innovation, which will make our business more competitive,
  compelling and profitable.”

  JOB RESPONSIBILITIES:

  What you will do:

  - Hybrid Identity & Directory Services
    - Manage Hybrid Active Directory and Entra ID environments.
    - Integrate enterprise applications using SAML, OAuth 2.0,
      OpenID Connect (OIDC), and Single Sign-On (SSO)
      technologies.
    - Implement and maintain Multifactor Authentication (MFA) and
      Conditional Access policies.
    - Troubleshoot authentication, authorization, and identity-
      related issues.

  - Azure Cloud Operations
    - Monitor and maintain Azure services for performance,
      availability, and reliability.
    - Troubleshoot cloud issues with minimal business impact.
    - Govern Azure resources and ensure compliance with security
      and regulatory standards.

  - Microsoft 365 Administration
    - Administer Exchange Online, including mailboxes, mail flow,
      distribution groups, and compliance policies.
    - Manage SharePoint Online and OneDrive for Business
      environments, permissions, and collaboration services.
    - Administer Microsoft Teams, including governance, policies,
      guest access, and adoption initiatives.
    - Support Microsoft 365 security, compliance, and Copilot-
      related capabilities.

  - Security & Compliance
    - Enforce security controls and policies across Microsoft 365
      and Azure.
    - Conduct periodic security reviews and audits.

  - End‑User & Operational Support
    - Provide Level 2/3 support for Microsoft 365 and Azure
      services.
    - Act as a technical escalation point and subject matter
      expert.

  - On‑Premises Infrastructure Administration
    - Oversee Windows and Linux/Unix servers to ensure
      availability, performance, and stability.
    - Manage on‑prem infrastructure including compute, storage &
      backup.
    - Implement system hardening, patching, access control,
      monitoring, and capacity planning.

  - Vendor, Project & Stakeholder Management
    - Manage vendors to ensure SLA, KPI, security, and contractual
      compliance.
    - End‑to‑end delivery of infrastructure and cloud projects.

  - Delivery and Governance
    - Oversee the end-to-end lifecycle of AI solutions:
    - Establish best practices, frameworks, and reusable assets.
    - Ensure compliance with enterprise governance, data privacy,
      and AI ethics policies.

  - AI Platform Engineering & Execution
    - Develop and deliver solutions leveraging:
      - Azure OpenAI Service
      - Azure AI Services and Cognitive Services
      - Azure Machine Learning
      - Azure AI Studio
      - Microsoft 365 Copilot
      - Microsoft Graph APIs
      - Copilot extensibility, plugins, agents, and custom solutions
      - Enterprise automation and workflow orchestration
        technologies
    - Responsibilities include:
      - Developing and integrating AI-driven business solutions.
      - Conducting experiments, pilot programs, and solution
        validation activities.
      - Monitoring AI solution performance, adoption, and business
        impact.
      - Collaborating with cross-functional teams to scale
        successful AI initiatives across the enterprise.
      - Drive experimentation (POCs, pilots) and scale successful
        solutions.

  REQUIREMENTS:

  Who you are:

  - Bachelor's degree in Computer Science, Information
    Technology, Engineering, or related discipline.
  - 7+ years of experience in Microsoft infrastructure, Azure,
    and Microsoft 365 environments.
  - 3+ years of experience delivering enterprise AI, machine
    learning, or Generative AI solutions.
  - Hands-on experience with Azure OpenAI, Azure AI Services,
    Azure Machine Learning, and Microsoft 365 Copilot.
  - Strong experience with Entra ID, Hybrid Active Directory,
    SSO, MFA, and identity federation technologies.
  - Experience managing enterprise-scale Microsoft 365 and Azure
    environments.
  - Knowledge of cloud security, governance, compliance, and
    data privacy principles.
  - Strong stakeholder management, communication, and problem-
    solving skills.

  Preferred:

  - Microsoft Certified: Azure Solutions Architect Expert
  - Microsoft Certified: Azure AI Engineer Associate
  - Microsoft Certified: Cybersecurity Architect Expert
  - Experience with Power Platform, Power Automate, and Copilot
    Studio.
  - Experience with Python, PowerShell, REST APIs, Microsoft
    Graph, and automation frameworks.
  - Knowledge of Responsible AI frameworks and AI governance
    models.

  CORE SKILLS:

  - Azure Architecture & Governance
  - Microsoft 365 (Exchange, Teams, SharePoint, Intune)
  - Cloud Migration & Modernization
  - AI & Data Platforms (Azure AI, ML, OpenAI)
  - DevOps & Platform Engineering
  - Security & Compliance (Zero Trust, IAM, Defender)
  - Infrastructure as Code (Bicep, Terraform)
  - CI/CD (GitHub Actions, Azure DevOps)
  - Enterprise Architecture & Solution Design
  - Stakeholder & Leadership Management
