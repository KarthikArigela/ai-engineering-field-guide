description: |
  What's the role? The role spans software engineering,
  platform engineering, and production ML lifecycle
  management. As a ML-AI Platform Engineer you will build and
  operate our map compilation platform that delivers high-
  definition live maps for autonomous driving. Furhtemore you
  will:

  - Build, operate, and continuously improve end-to-end Agentic
    AI/ML pipelines
  - Implement scalable CI/CD/CT pipelines for ML workflows and
    services
  - Design reliable, fault-tolerant data and Agentic AI/ML
    pipeline orchestration systems
  - Deploy models into production using containerized and cloud-
    native environments
  - Implement monitoring for model performance, data quality,
    and drift detection
  - Manage Agentic AI lifecycle including versioning and
    rollback
  - Collaborate with teams on requirements, architecture, and
    incident resolution
  - Build and maintain automation for Agentic release,
    validation, and infrastructure provisioning
  - Drive Infrastructure as Code (IaC) practices and cloud
    platform reliability

  Who are you? You are a fast learner, with an eye for detail,
  strong problem-solving and debugging skills. In addition you
  have the following qualifications.

  - Bachelor's degree in Computer Science/ Engineering or
    related science/technology field.
  - Five to eight years of industry workign expereicne including
    4+ years experience in infrastructure / platform
    engineering / MLOps
  - Strong programming skills in Python, Go, or Bash
  - Hands-on cloud experience (AWS preferred)
  - Hands-on engineer who works across ML systems + DevOps +
    platform engineering
  - Experience working with AI/ML, Agentic systems in production
    environments
  - Comfortable working in Agile teams with strong collaboration
    habits
  - Proactive in adopting AI-assisted development tools for
    productivity
  - Experience with containerization and Kubernetes
  - Strong Linux fundamentals and distributed systems

   What we offer  HERE offers an opportunity to work in a
  cutting-edge technology environment with challenging
  problems to solve! You can make a direct impact on delivery
  of company's strategic goals and the freedom to decide how
  to perform your work. We will support you in delivering your
  day-to-day tasks and achieving your personal goals and
  developing your skills. Personal development is highly
  encouraged at HERE. You can take different courses and
  training at our online Learning Campus and join cross-
  functional team projects within our Talent Platform. HERE is
  an equal opportunity employer. We evaluate qualified
  applicants without regard to race, color, age, gender
  identity, sexual orientation, marital status, parental
  status, religion, sex, national origin, disability, veteran
  status, and other legally protected characteristics. Who are
  we? HERE Technologies is a location data and technology
  platform company. We empower our customers to achieve better
  outcomes - from helping a city manage its infrastructure or
  a business optimize its assets to guiding drivers to their
  destination safely. At HERE we take it upon ourselves to be
  the change we wish to see. We create solutions that fuel
  innovation, provide opportunity and foster inclusion to
  improve people's lives. If you are inspired by an open world
  and driven to create positive change, join us. Learn more
  about us on our YouTube Channel. In this role you will join
  our fast growing, highly motivated NDS (Navigation Data
  Standard) team. As a member of our team, you will have the
  opportunity to dive deep into how we capture the real world,
  how this is reflected in our reality index, and work with
  the team on how this data goes straight into cars with our
  NDS deliveries. We work with Agile practices and co-operate
  with numerous different teams inside and outside of the
  company. Our team delivers digital maps in NDS formats to
  our automotive customers where the data is going straight
  into cars to power autonomous driving uses cases.
