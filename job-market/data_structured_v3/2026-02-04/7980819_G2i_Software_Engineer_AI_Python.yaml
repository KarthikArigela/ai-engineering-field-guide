  - Inject feedback (ratings, edits, test results) into the RLHF pipeline and keep
    it running smoothly
  - Help train large-language models to write production-grade code across a wide
    range of programming languages
  - Spot logic errors, performance traps, and security issues during code review
  - Work asynchronously with excellent written communication in a low-oversight environment
  use_cases:
  - Training LLMs to write production-grade code
  - Evaluating and ranking AI-generated code snippets
  - Repairing and refactoring AI-generated code
  - Converting expert code feedback into RLHF reward signals
