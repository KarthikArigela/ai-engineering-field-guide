    reasoning: |-
      This is a cloud platform, security, and SRE role: the work
      is Azure foundations, CI/CD, DevSecOps controls, compliance
      evidence, and observability. AI appears only as workloads
      the engineer runs securely in production (designed by
      product/solutions teams) and as internal tools (LLMs/code-
      gen to accelerate ops workflows) — no prompt design,
      retrieval design, fine-tuning, or output-quality evaluation.
      Running models others build and using AI to speed up one's
      own engineering is ai-support.
  responsibilities:
  - 'Own and evolve Azure platform foundations: subscription strategy, landing zones,
    networking, identity (Entra ID), secrets (Key Vault), and data services'
  - Design, implement, and harden CI/CD pipelines (GitHub Actions, Azure DevOps) with
    Infrastructure as Code (Terraform/Bicep), golden images, and automated drift detection
  - Operate and automate threat detection and response (Microsoft Sentinel, Defender
    for Cloud) plus container/dependency scanning and least-privilege IAM
  - Map controls to compliance frameworks (ISO 27001, SOC 2, NIST, HIPAA, GDPR, FedRAMP)
    and produce practical evidence via policy-as-code and reporting
  - 'Establish SRE practices: SLOs/SLIs, error budgets, end-to-end observability,
    actionable alerting, auto-remediation, and incident response with post-incident
    reviews'
  - 'Use LLMs and code generation to accelerate infra and ops workflows: pipeline
    scaffolding, policy generation, runbook creation, and knowledge capture'
  - Partner with product and solutions teams to run AI workloads securely in production
  - Work directly with enterprise client teams to translate requirements into secure,
    reliable designs, present trade-offs, and guide adoption and handover
  use_cases:
  - Secure, compliant deployment of generative AI solutions in enterprise Azure environments
  - LibreChat-based conversational AI with RAG pipelines backed by Azure OpenAI
  - Vector and semantic search over enterprise data (MeiliSearch, Vector Search)
  - AI-assisted infrastructure and operations automation (pipeline scaffolding, policy
    generation, runbooks)
  - Multi-cloud AI provider integration across OpenAI, Google Gemini, and Cohere
  - Automated compliance evidence and audit reporting for enterprise clients
