position:
  title: AI Sales Engineer
  ai_type:
    type: ai-support
    reasoning: |-
      This is a consultative pre-sales/sales engineering role: the
      person demos, positions, and proves the value of an AI
      platform built by others, with deliverables like
      presentations, POCs, RFP responses, and CRM pipeline work.
      The required AI knowledge (prompt engineering, RAG, LLMs,
      model training) is domain expertise for selling, not hands-
      on shaping of model behaviour. No responsibility involves
      tuning prompts, designing retrieval, training models, or
      evaluating output quality as the actual work of the job.
