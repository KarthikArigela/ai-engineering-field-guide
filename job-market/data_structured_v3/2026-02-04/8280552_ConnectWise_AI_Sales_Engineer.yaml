  - Position AI solutions consultatively with sales teams, guiding customers through
    capability assessments and ROI analysis
  - Serve as a key technical resource for revenue teams by providing product expertise,
    training, coaching, and ongoing support
  - Relay customer insights to influence future product development and generate pipeline
  - Maintain CRM hygiene by documenting activities, technical notes, and engagement
    details throughout the presales cycle
  use_cases:
  - Pre-sales demonstrations and POCs of AI platform capabilities for prospects and
    existing accounts
  - AI solution design including model selection, data integration, and workflow automation
    tailored to customer requirements
  - Automation workflows and data-driven insights for technology solution providers
    (MSPs, VARs, enterprise IT)
  - Capability assessments and ROI analysis to justify AI adoption
  - Customer onboarding and implementation support for AI solutions
