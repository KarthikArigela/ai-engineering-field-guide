position:
  title: Lead/Staff Software Engineer, AI
  ai_type:
    type: ai-first
    reasoning: |-
      The role directly shapes model behavior: it designs and
      evaluates prompts, builds document-intelligence models with
      LLMs and embeddings, applies retrieval-augmented and tool-
      use orchestration patterns with guardrails, and owns model
      selection, evaluation, and drift monitoring. Since LLM
      components are central alongside classical CV/NLP work, the
      role is ai-first.
  responsibilities:
  - Build generalizable document intelligence models for standard and non-standard
    tax documents using CV/NLP/LLMs and embeddings for dynamic, context-aware parsing
    beyond fixed OCR templates
  - Improve auto-verification and quality through native-PDF/text-layer matching,
    anomaly detection, and prior-year-aware checks, designing human-in-the-loop flows
    that preserve practitioner control
  - Productionize low-latency training and inference pipelines over millions of documents
    with robust observability, evaluation, and drift monitoring
  - Integrate LLMs and traditional ML models into robust, auditable workflows supporting
    tax determination, document processing, and rules-based automation
  - Build and maintain data pipelines, feature extraction, and preprocessing for tax-relevant
    data such as invoices, filings, and transactional data
  - Develop and integrate RESTful APIs and microservices to expose AI capabilities
    to internal and external systems
  - Ensure solutions meet compliance, security, and auditability requirements typical
    of regulated tax domains
  - Lead design reviews, perform code reviews, and mentor mid-level and junior engineers
    on AI best practices while partnering with Product and Tax SMEs
  use_cases:
  - Automated tax document understanding and data extraction in the 1040 scan-and-populate
    workflow
  - Auto-verification of extracted tax data with anomaly detection and human-in-the-loop
    review
  - Organizing tax workpapers and exporting structured data to tax software at scale
  - Layout parsing, table extraction, and doc-type classification for financial documents
  - Rules-based tax determination and auditable automation in regulated domains
