position:
  title: Lead Identity Engineer – API  & AI Gateways
  ai_type:
    type: ai-support
    reasoning: |-
      The role architects security and authorization
      infrastructure (MCP Gateway, OAuth/OIDC, fine-grained
      authorization, API governance) that AI agents pass through,
      but never shapes a model's behavior: no prompting, retrieval
      design, agent-flow design, or training/evals. The
      deliverable is access control and secure gateways around the
      AI ecosystem, which is plumbing rather than model shaping,
      so it is ai-support.
  responsibilities:
  - Lead the architecture of next-generation API security and authorization platforms
  - Architect and govern the MCP Gateway, the secure bridge connecting enterprise
    data to AI agents
  - Build robust authorization frameworks and API governance layers that scale to
    human users and high-velocity AI agent access patterns
  - Implement Fine-Grained Authorization (FGA) and context-aware policies to enable
    safe adoption of Generative AI
  - Protect critical data sources against unauthorized AI access and keep the digital
    supply chain secure and compliant
  - Extend API security controls to the emerging AI agent ecosystem
  - Develop high-performance APIs and microservices in Java or Python
  - Integrate security controls into CI/CD pipelines using Jenkins, GitHub Actions,
    or GitLab
  use_cases:
  - Secure bridging of enterprise data to AI agents via an MCP Gateway
  - Protection of critical data sources against unauthorized AI agent access
  - Fine-grained, context-aware authorization for safe Generative AI adoption
  - API governance and access control scaling to both human users and high-velocity
    AI agents
  - Secure and compliant digital supply chain for automation
