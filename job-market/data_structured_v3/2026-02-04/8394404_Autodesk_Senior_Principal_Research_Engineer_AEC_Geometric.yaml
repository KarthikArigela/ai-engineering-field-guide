  - Transform unstructured AEC data into representations suitable for machine learning
  - Collaborate cross-functionally with ML Research Scientists and Engineers to align
    data formats with downstream training and fine-tuning of LLMs
  - Apply deduplication, normalization, and validation techniques to ensure high-quality
    data in production environments
  - Architect and optimize pipelines for scalability, reproducibility, and cloud deployment
  - Mentor junior engineers and provide technical guidance on complex data engineering
    challenges
  - Perform requirements analysis with senior stakeholders and participate in technical
    planning and roadmap development
  use_cases:
  - Foundation models and generative AI tools for the AEC (Architecture, Engineering,
    and Construction) industry
  - Machine learning on multi-modal AEC data combining text and geometric data
  - Content understanding and preprocessing of BIM, IFC, CAD, and drawing-set data
  - Enhancing design and engineering workflows in Autodesk products such as AutoCAD,
    Revit, and Forma
