position:
  title: Software Engineer, AI (C)
  ai_type:
    type: ai-first
    reasoning: |-
      The engineer ranks, critiques, and repairs LLM-generated
      code and injects that feedback into the RLHF pipeline as
      reward signals, directly shaping what the model learns.
      Judging model output quality for an LLM target is shaping,
      so the role is ai-first.
  responsibilities:
  - Compare and rank multiple AI-generated code snippets, explaining which is best
    and why
  - Repair and refactor AI-generated code for correctness, efficiency, and style
  - Inject feedback (ratings, edits, test results) into the RLHF pipeline and keep
    it running smoothly
  - Spot logic errors, performance traps, and security issues during code review
  - Provide clear written justifications for code quality and design decisions
  - Help train LLMs to propose, critique, and improve production-grade code
  use_cases:
  - Training LLMs to write production-grade code
  - Ranking and critiquing AI-generated code snippets
  - Repairing AI-generated code for correctness, efficiency, and style
  - Generating RLHF reward signals from expert code review feedback
