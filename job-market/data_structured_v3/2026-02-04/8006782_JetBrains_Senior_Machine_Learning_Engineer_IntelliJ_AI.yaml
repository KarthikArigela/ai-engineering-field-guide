  - Experiment with contexts and lightweight models to develop the ML system end to
    end
  - Act as the ML liaison for product teams across JetBrains, adapting and scaling
    AI capabilities in JetBrains IDEs to their needs
  - Build and maintain small helper models such as re-rankers, classifiers, and embedding
    models for domain-specific tasks
  - Collaborate with ML, product, engineering, and analytics teams to deliver improvements
    and monitor their impact in production
  - Mentor junior engineers and shape team culture, processes, and tooling around
    experimentation and evaluation
  use_cases:
  - AI assistance supporting the entire development lifecycle across JetBrains IDEs
  - AI features embedded in IDEs that accelerate developer workflows
  - Context orchestration powering AI capabilities inside developer tools
  - Domain-specific helper models for re-ranking, classification, and embeddings supporting
    AI features
  - Evaluation and monitoring of LLM and agent features in production
