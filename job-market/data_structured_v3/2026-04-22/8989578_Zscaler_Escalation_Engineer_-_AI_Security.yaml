position:
  title: Escalation Engineer - AI Security
  ai_type:
    type: ai-support
    reasoning: |-
      This escalation engineer role troubleshoots and investigates
      security issues around AI usage (model security, agent
      governance, inference security, data leakage prevention) but
      never shapes model behavior — there is no prompt
      engineering, retrieval design, fine-tuning, or
      eval/guardrail building. Governance and validation oversight
      of AI systems without building the evals or guardrails
      themselves is ai-support.
  responsibilities:
  - Own and resolve the highest-severity technical escalations through deep analysis,
    ensuring fast resolution and managing the on-call rotation for critical issues
  - Troubleshoot and resolve complex issues across Zscaler cloud security services,
    configuration, policy engines, APIs, and AI-assisted capabilities
  - Investigate and resolve scenarios related to secure use of AI models, governance
    of AI agents, data protection, and inference security
  - Perform detailed log, telemetry, and packet-level analysis to identify root causes,
    reproduce complex defects, and deliver engineering-ready bug reports
  - Validate fixes and articulate clear root-cause analyses across client, edge, and
    cloud layers
  - Drive cross-functional collaboration with Engineering, Cloud Ops, and Product
    Management on escalations
  - Create advanced troubleshooting documentation and act as a technical mentor to
    uplift support capability
  use_cases:
  - Resolution of highest-severity customer escalations on a cloud security platform
  - Secure enterprise use of AI models including inference security
  - Governance of AI agent behavior in enterprise deployments
  - Data protection and data leakage prevention for AI systems
  - Root-cause analysis and defect reproduction across client, edge, and cloud layers
  - Troubleshooting of AI-assisted capabilities within cloud security services
