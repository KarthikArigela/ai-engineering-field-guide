position:
  title: Platform Solutions Engineer - Knowledge Management & AI Integration
  ai_type:
    type: ai-support
    reasoning: |-
      The role centers on owning the Confluence knowledge
      platform: vendor coordination, controlled change delivery,
      content governance, and L2/L3 operational support. The GenAI
      work is enabling and operationalizing ROVO agents and MCP
      endpoints that other teams built, plus making content AI-
      ready through metadata and hygiene — not shaping model
      behavior via prompts, retrieval design, or training.
      Integrating and operationalizing AI capabilities designed
      elsewhere is ai-support.
  responsibilities:
  - Own Confluence platform requirements across North America departments, translating
    user needs into workflows, templates, permissions, taxonomy, space structure,
    and automation
  - Coordinate with Atlassian and Stack Overflow vendors to manage roadmaps, releases,
    validation, and deployment across all change phases (intake, build, test, rollout,
    support)
  - Enable and operationalize ROVO agents, Confluence MCP, and Stack Overflow MCP,
    integrating these capabilities with internal GenAI systems securely and auditably
  - Enhance AI-readiness of platform content through metadata, organization, and content
    quality initiatives
  - Run content hygiene programs to manage stale, duplicate, and broken content, and
    enforce governance standards for ownership, permissions, labeling, templates,
    and reviews
  - Adapt governance to GenAI trends covering content eligibility, sensitive data,
    storage, traceability, and compliance, tracking outcomes with dashboards
  - Provide L2/L3 operational support for Confluence and knowledge tools, including
    incident response, root cause analysis, and long-term fixes
  - Build automation and self-service tooling for reliability, and develop documentation
    and onboarding guides
  use_cases:
  - Firmwide knowledge management and discovery across Confluence and Stack Overflow
    for Enterprise
  - GenAI-enabled knowledge discovery using ROVO agents and MCP integrations
  - Enterprise GenAI use cases including retrieval, summarization, semantic search,
    and metadata enrichment
  - Content governance and compliance for AI-ready enterprise knowledge
  - Reliability and operational support for firmwide knowledge platforms
