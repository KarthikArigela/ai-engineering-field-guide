position:
  title: Senior Software Design Quality Engineer - AI
  ai_type:
    type: ai-support
    reasoning: |-
      This is a design quality and regulatory assurance role: the
      person oversees QA planning, validation strategies, risk
      management, and governance for AI-enabled products developed
      by R&D, conducting design reviews of others' work. They do
      not themselves shape model behaviour through prompts,
      retrieval, agent design, training, or by building
      evals/guardrails. Per the rules, safety, governance, and QA
      oversight of models is ai-support.
  responsibilities:
  - Lead Design Quality Engineering activities for AI-enabled software products across
    the full lifecycle from concept to commercialization
  - Drive compliance with design control processes and standards including ISO 13485,
    IEC 62304, ISO 14971, IEEE 1633, and EU AI Act-ready practices
  - Define and maintain quality strategies and KPIs for complex multi-component systems
    integrating software, cloud, data, and AI/ML
  - Oversee quality planning, documentation, and reviews for software and AI-enabled
    solutions including foundation models, prompt engineering, and deep neural networks
  - Ensure robust validation strategies for AI models covering dataset quality, model
    performance, bias detection, and continuous learning
  - Oversee risk management per ISO 14971 including hazard analyses, FMEAs, fault
    tree analyses, cybersecurity risks, and AI-specific risks
  - Conduct expert-level design reviews on architecture, algorithms, code, test strategy,
    and verification/validation evidence with R&D teams
  - Serve as quality SME during regulatory submissions and audits and mentor teams
    in quality engineering best practices
  use_cases:
  - Design assurance and quality engineering for AI-enabled medical software products
    (IGT-Systems)
  - Regulatory compliance of AI-enabled software in a medical device context (ISO
    13485, IEC 62304, ISO 14971, EU AI Act)
  - Validation of AI models including dataset quality, model performance, bias detection,
    and continuous learning
  - Risk management for software and AI products including hazard analysis, FMEA,
    and fault tree analysis
  - Traceability, explainability, and governance of AI model development and training
    pipelines
