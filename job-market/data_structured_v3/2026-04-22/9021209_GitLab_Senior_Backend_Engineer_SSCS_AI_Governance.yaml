position:
  title: 'Senior Backend Engineer, SSCS: AI Governance'
  ai_type:
    type: ai-support
    reasoning: |-
      This is backend engineering for AI governance
      infrastructure: audit event ingestion/export, access control
      integration, artifact storage, and MCP registry enforcement
      controls. The person never shapes model behavior through
      prompts, retrieval design, agent orchestration, training, or
      evals — the deliverable is compliance, visibility, and
      policy enforcement, not model output quality. AI components
      (agents, MCP, LLMs) are governed and consumed rather than
      built or tuned here.
  responsibilities:
  - Implement and evolve the AI audit event pipeline, covering event ingestion, schema
    normalization, storage design, partitioning, retention, and export capabilities
  - Integrate AI Governance permissions for audit logs, policy configuration, and
    governance dashboards into GitLab's existing authorization model
  - Build backend functionality for the AI agent artifact feature, supporting structured
    storage and retrieval of agent run metadata alongside CI/CD artifacts
  - Build backend services for the MCP registry, including tool metadata and enforcement
    controls that restrict or block access when needed
  - Design and optimize data models and queries for high-write, event-heavy systems
    using PostgreSQL and ClickHouse
  - Write and maintain RSpec and integration test coverage while improving team test
    reliability practices
  - Contribute to architecture decisions and partner with AI and Continuous Delivery
    teams in a remote, async-first environment
  use_cases:
  - AI governance and compliance visibility for regulated enterprises using AI in
    the software development lifecycle
  - Audit event tracking, retention, and export of AI usage for compliance evidence
  - Role-based access control and policy enforcement for AI governance features
  - MCP registry governance with tool metadata and enforcement controls that restrict
    or block tool access
  - Structured storage and retrieval of AI agent run artifacts and metadata
  - Usage tracking and observability of AI adoption inside GitLab
