position:
  title: Machine Learning Engineer (MLOps & AI Infrastructure)
  ai_type:
    type: ai-support
    reasoning: |-
      This is an MLOps/infrastructure role: the person builds
      pipelines, deploys, hosts, and monitors ML models that data
      scientists build — the deliverable is capacity, reliability,
      and process, not model behaviour. The GenAI/LLM
      experimentation is explicitly a secondary/emerging focus and
      centers on integrating solutions from AI research teams, not
      shaping LLM output through prompts or retrieval. No owned
      model training, prompt tuning, RAG design, or eval building.
  responsibilities:
  - Design, build, and maintain scalable production-grade ML pipelines for data ingestion,
    model training, and inference
  - Implement automated workflows for data preprocessing, feature engineering, and
    model retraining
  - Deploy and manage ML models in production environments using AWS cloud services,
    ensuring high availability and scalability
  - Implement monitoring and alerting frameworks for data drift, model drift, and
    performance degradation
  - Collaborate with data scientists, product managers, and IT teams to operationalize
    models and translate business requirements into scalable ML architectures
  - Take end-to-end ownership of MLOps initiatives, enforcing CI/CD, version control,
    and automated testing best practices
  - Develop reusable frameworks and internal tools to standardize and accelerate the
    ML development lifecycle
  - Experiment with LLMs and prompt-based workflows and support integration of GenAI
    solutions and orchestration tools (Kubeflow, Airflow, MLflow) into ML workflows
  use_cases:
  - Production ML infrastructure supporting real-world healthcare and commercial applications
  - Data-led decision making across Roche healthcare and biotech operations via the
    GATE analytics center
  - Automated model retraining with data drift and performance monitoring for production
    reliability
  - Integration of Generative AI and prompt-based automation into enterprise ML workflows
  - Analytics on pharmaceutical and US healthcare market datasets (IQVIA, SHA, patient
    data)
