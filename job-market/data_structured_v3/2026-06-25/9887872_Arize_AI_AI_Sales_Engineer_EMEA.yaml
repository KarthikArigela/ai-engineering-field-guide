  - Lead product demonstrations of the Arize platform to prospects
  - Lead discovery on prospects' GenAI tech stacks to construct compelling value propositions
    with the Sales team
  - Lead Proof of Concept (PoC) motions with prospective buyers from requirements
    gathering to close
  - Work hands-on to develop small proofs of concept
  - Handle technical objections and develop cross-functional strategies across sales,
    engineering, and product to unblock deals
  - Act as trusted technical advisor to sophisticated GenAI teams, including pitching
    to senior executives
  use_cases:
  - AI observability and monitoring for LLM applications and agents in production
  - Evaluation and troubleshooting of GenAI systems to improve reliability and performance
  - Helping enterprise GenAI teams ship high-performing, reliable AI agents and applications
  - Enabling sales of an AI engineering platform through demos and proofs of concept
