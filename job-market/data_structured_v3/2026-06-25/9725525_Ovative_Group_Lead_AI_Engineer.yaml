position:
  title: Lead AI Engineer
  ai_type:
    type: ai-first
    reasoning: |-
      This role architecturally owns agent orchestration logic,
      MCP-based integration frameworks, prompt structure, tool
      use, and agent behavior in production LLM systems — all
      direct shaping of model/agent behaviour. Since LLM and agent
      components are central, it classifies as ai-first rather
      than ml-first or ai-support.
  responsibilities:
  - Develop reusable infrastructure patterns and guardrails that let non-technical
    practitioners and domain experts build and run their own AI workflows without
    engineering involvement
  - Design the abstraction layer separating technical implementation from business
    logic so non-engineers can configure and iterate safely
  - Design and build the integration layer connecting the enterprise AI platform to
    daily-use tools and data sources across project management, communications, and
    analytics
  - Architect orchestration logic for multi-step automated workflows, including input
    routing, output connections back into existing systems, and human review checkpoints
  - Own the bidirectional write-back layer that reads from and writes results back
    to task management and operational systems, including output routing, status updates,
    and the human action loop
  - 'Own the security and governance framework for all AI integrations: access controls,
    credential management, audit logging, least privilege, and SOC2 compliance in
    partnership with IT and security'
  - Build and maintain CI/CD pipelines and infrastructure-as-code practices so AI
    platform deployments are repeatable, auditable, and low-risk
  - Serve as technical reviewer for new agents and automated workflows before organization-wide
    deployment, and maintain the post-deployment monitoring and observability framework
    for production workflow behavior
  use_cases:
  - AI-native workflow automation across a 500-person media, measurement, analytics,
    and strategy organization
  - Connecting an enterprise AI platform to project management, communications, and
    analytics tools
  - Multi-step and multi-agent automated workflows with human-in-the-loop review checkpoints
  - Bidirectional write-back of AI results into task management and operational systems
  - Self-service workflow building by non-technical practitioners and domain experts
