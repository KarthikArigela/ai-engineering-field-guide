company:
  name: LumiMeds
  stage: early-stage startup
  focus: |-
    Telehealth platform for weight management and metabolic
    health
position:
  title: Senior Full-Stack Engineer (Node.js & Next.js, AI-Native) - Remote
  ai_type:
    type: ai-first
    reasoning: |-
      The role directly shapes LLM behavior: it builds prompt
      pipelines, RAG architectures, structured output parsing, and
      agentic workflows embedded into product interfaces, and
      integrates OpenAI/Anthropic APIs with tool use.
      Orchestrating Claude agent teams with the Claude Agent SDK
      is design of agent flows, which is also shaping. Although
      the role heavily emphasizes AI coding tools (Cursor,
      Copilot), the explicit LLM product integration
      responsibilities make it ai-first.
  responsibilities:
  - Build and scale healthcare systems including an EMR/clinical data engine, e-prescribing
    workflows, and virtual care infrastructure
  - Design and operate teams of Claude agents to parallelize engineering work, decomposing
    large tasks into agent-executable subtasks and managing context handoffs
  - Build and iterate on AI-powered product features including prompt pipelines, RAG
    architectures, structured output parsing, and agentic workflows embedded into
    clinical and consumer interfaces
  - Use Cursor, Copilot, and LLM APIs as first-class engineering tools to generate,
    validate, and iterate on code at machine speed
  - Drive end-to-end full-stack feature ownership across Node.js backends and Next.js
    frontends, from schema design to production deployment
  - Maintain production quality standards for API contracts, database schema migrations,
    CI/CD pipelines, and observability, owning correctness of AI-generated code
  - Ensure systems meet HIPAA/SOC2 standards with data encryption, audit logs, and
    PII protection
  - Engineer e-commerce and checkout experiences including product catalogs, subscription
    billing, and dynamic pricing engines
  use_cases:
  - AI clinical copilot automating clinical documentation and summarizing patient
    charts
  - Surfacing actionable insights for providers from patient data
  - Agentic LLM workflows embedded in clinical and consumer telehealth interfaces
  - Claude agent teams parallelizing and accelerating internal engineering delivery
