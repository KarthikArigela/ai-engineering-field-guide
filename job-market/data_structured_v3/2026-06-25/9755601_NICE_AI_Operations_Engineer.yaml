  - Operate the platform within security and governance policies, managing least-privilege
    access, audit logging, and access reviews in partnership with the Security team
  - Contribute to automation of repetitive operational tasks and feed real-world usage
    and pain points back into the platform roadmap
  use_cases:
  - Internal enterprise AI platform powering intelligent automation across the business
  - AI agents, assistants, and automations deployed by business users via self-service
    tooling
  - RAG services and a Models Gateway serving enterprise AI workloads
  - Governed self-service delivery of AI agents, assistants, automations, and dashboards
  - Platform KPI tracking covering adoption, token and cost consumption, latency,
