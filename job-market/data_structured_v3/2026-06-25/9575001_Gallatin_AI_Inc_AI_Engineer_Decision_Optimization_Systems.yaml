position:
  title: AI Engineer – Decision & Optimization Systems
  ai_type:
    type: ai-first
    reasoning: |-
      The role builds the guardrails themselves: it converts AI-
      agent outputs (LLMs, planners, probabilistic models) into
      deterministic, enforceable constraints and owns the
      feasibility/authority framework that gates AI-generated
      plans before execution. Building guardrails and validation
      for model output is shaping, and LLM/agent components are
      explicitly involved, so it is ai-first rather than classical
      ml-first despite the strong OR/optimization background.
  responsibilities:
  - Design and implement models that encode command hierarchy, authority limits, and
    policy rules into formal feasibility checks
  - Convert AI-agent outputs (LLMs, planners, probabilistic models) into deterministic,
    enforceable constraints before execution
  - Build and maintain a centralized constraint framework covering authority rules,
    compatibility constraints, timing windows, and asset readiness across optimization
    and planning systems
  - Surface clear diagnostics for infeasible plans and constraint violations so humans
    and machines understand what failed and why
  - Own data inputs for feasibility and constraint enforcement, defining data contracts,
    normalization, and validation pipelines
  - Build robustness against incomplete, delayed, or noisy operational data
  - Integrate feasibility checks into real-time and batch planning pipelines, gating
    actions on valid, policy-compliant inputs
  - Validate system behavior using scenario testing, simulations, and operational
    feedback from real users
  use_cases:
  - AI-driven logistics planning and decision-making for US national security and
    allied missions
  - Enforcing command hierarchy, authority, policy, and safety compliance on AI-generated
    logistics plans
  - Gating optimizer, agent, and human actions on feasible, policy-compliant inputs
    before execution
  - Military and defense supply chain operations from factory to foxhole
  - Disaster response and humanitarian logistics support
