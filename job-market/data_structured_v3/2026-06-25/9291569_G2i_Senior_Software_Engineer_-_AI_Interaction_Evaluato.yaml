position:
  title: Senior Software Engineer - AI Interaction Evaluator (Codex / Claude Code,
    up to $200/hr)
  ai_type:
    type: ai-first
    reasoning: |-
      The role's core work is judging and critiquing the output
      quality of AI coding agents (Codex, Claude Code, Cursor) —
      rating interactions, distinguishing quality levels, and
      providing preference feedback that determines what the model
      learns. Judging model output quality is shaping, and the
      targets are LLM/code-generation components, so this is ai-
      first despite no production code being written.
  responsibilities:
  - Evaluate AI-generated coding interactions end-to-end using modern coding agents
    such as OpenAI Codex and Claude Code
  - Judge whether outputs are useful, correct at a high level, and aligned with how
    a strong engineer would think
  - Assess the quality of preambles, explanations, and reasoning rather than just
    code syntax
  - Distinguish between different levels of response quality, such as what makes an
    interaction a 2 versus a 4
  - Provide clear, opinionated feedback on what worked, what didn't, and what felt
    off or misleading
  - Help define what great interactions look like with AI coding tools like Cursor
  use_cases:
  - Quality evaluation of AI coding agent interactions in real-world engineering scenarios
  - Rating and preference feedback on coding agent reasoning, preambles, and explanations
  - Assessing whether AI agent behavior reflects strong engineering judgment and builds
    user trust
  - Defining quality standards for AI-assisted development workflows
