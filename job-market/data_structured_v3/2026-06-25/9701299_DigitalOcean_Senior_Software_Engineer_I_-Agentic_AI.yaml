  - Collaborate with cross-functional teams to ensure infrastructure reliably supports
    complex evaluation scenarios and outcome metrics
  - Drive engineering best practices including code reviews, comprehensive testing,
    and technical design documentation
  - Monitor system performance, investigate bottlenecks, and ensure high reliability
    of orchestration systems
