position:
  title: Senior Integration Engineer, Client Data & AI
  ai_type:
    type: ai-support
    reasoning: |-
      This is a data integration/ETL role: the engineer builds
      pipelines connecting client Epic EHR and telephony systems
      to the platform, and structures data so it is AI-accessible
      for others. They do not write prompts, design retrieval or
      agent flows, or evaluate model output themselves; AI appears
      as a working partner (AI-assisted coding, agent-driven
      monitoring) and as a consumer of the data plumbing, which is
      tool usage, not shaping model behaviour.
  responsibilities:
  - Lead technical integration with client Epic EHR systems, building extraction and
    ETL pipelines across Clarity, Caboodle, FHIR, or other access methods
  - Work directly with client technical teams to scope integrations, resolve configuration
    issues, and validate data quality before pipelines go live
  - Assess client telephony systems and build pipelines that ingest historical telephony
    data and pair it with Epic clinical data
  - Model and structure ingested data so it is readily accessible to AI and usable
    by citizen developers building on the platform
  - Own the technical integration workstream during client onboarding, coordinating
    with client contacts and internal teams and communicating status, risks, and blockers
  - Design reusable integration frameworks and automation using agents, templated
    pipelines, and self-service tooling to speed up each onboarding
  - Apply AI-native development practices including AI-assisted coding and agent-driven
    monitoring within CI/CD and infrastructure-as-code standards
  - Document client-specific configurations and integration decisions, and mentor
    less experienced engineers
  use_cases:
  - Ingesting client Epic EHR clinical data into Hummingbird's patient access platform
  - Ingesting historical telephony and contact center data and pairing it with Epic
    clinical data
  - Preparing and modeling client data so it is accessible to AI tools and citizen
    developers
  - Automating and accelerating client onboarding integrations with reusable frameworks
    and agents
  - Validating client data quality before integration pipelines go live
