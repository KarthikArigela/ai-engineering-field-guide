position:
  title: Data Quality Engineer,  AI Business
  ai_type:
    type: ai-support
    reasoning: |-
      The role designs quality measurement systems, rubrics,
      sampling plans, and automated checks for human participant
      data delivered via managed service studies — the deliverable
      is trustworthy training data, not model behaviour. LLM evals
      and red teaming appear only as nice-to-have background, and
      no prompt, retrieval, or training work is part of the role
      itself. Building and QA-ing datasets that feed others'
      training runs is ai-support per the dataset rule.
  responsibilities:
  - Own end-to-end quality design for Prolific managed service studies, including
    rubrics, acceptance criteria, defect taxonomies, severity models, and definitions
    of done
  - Define, implement, and maintain quality measurement systems covering sampling
    plans, golden sets, calibration protocols, agreement targets, adjudication workflows,
    and drift detection
  - Build and deploy automated quality checks and launch gates using Python and SQL,
    including schema and format validation, completeness checks, anomaly detection,
    and label distribution monitoring
  - Design and run launch readiness processes including pre-launch checks, pilot calibration,
    ramp criteria, full-launch thresholds, and pause/rollback mechanisms
  - Partner with Product and Engineering to embed in-study quality controls and authenticity
    checks into workflows, tooling, and escalation paths
  - Investigate quality and integrity issues end to end, running root-cause analysis
    and driving corrective and preventive actions (CAPAs)
  - Build dashboards and operating cadences to track defect rates, rework, throughput
    versus quality trade-offs, integrity events, and SLA adherence
  - Lead calibration sessions and coach QA leads and reviewers to improve decision
    consistency and rubric application
  use_cases:
  - Quality assurance for human participant data delivered to AI training and research
    customers
  - Automated data quality checks and launch gates for managed service studies
  - Quality measurement through sampling plans, golden sets, calibration, and drift
    detection
  - Integrity and fraud prevention in participant data collection
  - Quality monitoring and reporting across customers, programs, and study types
