  - Establish AI integration best practices and governance patterns as repeatable
    playbooks across the holding company
  - Own system design reviews for AI initiatives across portfolio companies, identifying
    bottlenecks and recommending architectural improvements
  - Optimize production AI systems for cost and latency by profiling pipelines, implementing
    compression, and right-sizing compute infrastructure
  - Mentor engineers at portfolio companies on production AI best practices, reproducibility,
    monitoring, and safe deployment patterns
  use_cases:
  - Embedding AI capabilities at scale into portfolio companies' existing backend
    services
  - Production LLM applications integrated cleanly with backend infrastructure
  - Vector search and ML inference pipelines deployed in production
  - Cost- and latency-optimized production AI systems across multiple software businesses
