  - Architect medallion-layer data models (Bronze/Silver/Gold) in Databricks, ensuring
    clean, well-documented schemas that meet business needs
  - Automate, test, and harden data workflows with AI-augmented tests, data quality
    checks, and CI/CD pipelines that catch issues before production
  - 'Build and maintain AI-ready team tooling: craft prompts, custom Claude Code slash
    commands, and agent workflows for pipeline scaffolding, documentation generation,
    and data quality validation'
  - Build and improve Databricks Genie chatbots that let non-technical users query
    data using natural language
  - Partner with Analytics Engineering, Data Science, and product teams, providing
    data infrastructure support and onboarding new data sources into the bronze layer
  - Contribute to infrastructure-as-code (Terraform/Atmos) for provisioning and managing
    cloud data infrastructure
  use_cases:
  - Family safety and location-sharing product powered by high-throughput event streams
    (location sharing, safe driver reports, crash detection with emergency dispatch)
  - Real-time and batch data ingestion unifying streaming (Kafka, Kinesis) and batch
    sources (MySQL, DynamoDB, APIs) into a queryable lakehouse for product decisions
    and analytics
  - Natural-language data access for non-technical users via Databricks Genie chatbots
    that automate frequently asked data questions
  - Reliable, governed datasets powering analytics, data science, and partner integrations
    for roughly 98 million monthly active users
  - AI-assisted engineering workflows (Claude Code, custom slash commands, agentic
    workflows) that accelerate pipeline development and team velocity
