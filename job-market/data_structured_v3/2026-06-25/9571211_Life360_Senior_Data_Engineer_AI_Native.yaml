    reasoning: |-
      The core deliverables are data pipelines and lakehouse
      infrastructure — Kafka/Kinesis ingestion, Databricks
      medallion models, Airflow orchestration — not model
      behaviour. The AI work is developer-workflow tooling (Claude
      Code/Cursor, crafting prompts, custom slash commands,
      agentic workflows that help engineers scaffold pipelines
      faster) plus configuring Databricks Genie, a managed
      natural-language-to-SQL service, rather than designing
