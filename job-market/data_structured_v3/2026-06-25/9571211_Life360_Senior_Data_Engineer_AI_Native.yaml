      velocity is ai-support even though the team calls itself AI-
      native.
  responsibilities:
  - Design and manage scalable data platforms powering real-time analytics, batch
    processing, and exploratory analysis, using AI-assisted development as the default
    workflow
  - Own critical data pipelines end to end, ingesting 6+ billion events and ~2 TB
    daily from streaming (Kafka, Kinesis) and batch sources (MySQL, DynamoDB, internal
