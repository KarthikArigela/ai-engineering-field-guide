position:
  title: Site Reliability Engineer - AI Agents
  ai_type:
    type: ai-support
    reasoning: |-
      This is an SRE/platform engineering role: the person runs,
      scales, and serves the model-inference and agent-execution
      infrastructure that the AI and Agent Systems teams design.
      They never write prompts, design retrieval or agent flows,
      or train models; the deliverable is capacity, reliability,
      observability, and a developer platform, not model
      behaviour. The guardrails and failure-handling patterns
      mentioned are operational resilience for infrastructure, not
      output-quality shaping.
  responsibilities:
  - Design, build, and operate the infrastructure layer supporting AI agent workflows
    in production
  - Ensure reliability, scalability, and observability of agentic systems across internal
    and external products
  - Design and develop platform services, APIs, SDKs, and self-service capabilities
    that let engineering teams consume AI infrastructure as a service
  - Manage and maintain the compute, orchestration, and model-serving infrastructure
    powering model inference and agent execution
  - Implement monitoring, alerting, and incident response procedures tailored to AI/ML
    workloads
  - Define and implement guardrails, failure handling, and recovery patterns specific
    to agentic and LLM-powered systems
  - Provision and manage AWS cloud infrastructure using Terraform and manage containerized
    workloads with Kubernetes, including access controls and security best practices
  - Build and maintain CI/CD pipelines supporting rapid, reliable deployment of AI
    services and agent workflows
  use_cases:
  - Production infrastructure powering AI agents for internal tools and external-facing
    crypto trading products
  - Reliable, scalable model serving and agent execution orchestration
  - Developer platform offering agent infrastructure, APIs, and SDKs as a service
    to AI, Data, and Engineering teams
  - Monitoring, alerting, and incident response for agentic and LLM-powered systems
    in production
  - Hardening experimental agent prototypes into production-grade systems
