position:
  title: Senior Forward Deployed Engineer (AI)
  ai_type:
    type: ai-first
    reasoning: |-
      This is an end-to-end Forward Deployed Engineer role that
      designs, builds, and ships AI-powered internal applications,
      requiring hands-on experience building AI-enabled
      applications with no separate team designing the AI layer.
      Following the FDE edge case, adapting and delivering AI
      solutions directly to business stakeholders is ai-first,
      even though internal rather than customer-facing. The
      agentic coding tools (Claude Code, Cursor) are the
      development environment, not the only AI component - the
      applications themselves are powered by modern AI.
  responsibilities:
  - Partner with business teams (Operations, Customer Success, Marketing, Finance,
    Legal) to identify opportunities where AI can improve internal workflows and outcomes
  - Conduct discovery with stakeholders and translate business needs into clear product
    requirements and acceptance criteria
  - Carry each product through its full lifecycle from prototyping and stakeholder
    validation through hardening, deployment, and production rollout
  - Use agentic coding tools such as Claude Code, Cursor, or Augment as the primary
    development environment
  - Operate independently on standalone internal applications and partner with central
    Engineering teams when work intersects with core systems or production platforms
  - Make engineering tradeoffs balancing speed of delivery with reliability, security,
    and maintainability for an internal user base
  - Own deployed tools through adoption, including post-launch support, iteration
    based on user feedback, documentation, user training, and rollouts
  - Contribute reusable components, patterns, and learnings back to AI teams
  use_cases:
  - Internal AI applications that improve business team workflows and outcomes
  - Automating internal workflows across Operations, Customer Success, Marketing,
    Finance, and Legal
  - AI-powered productivity tools for private markets fund administration operations
