  - Implement security and compliance controls aligned with SEC/FINRA requirements,
    enforce AI governance guardrails at the infrastructure level, and produce architecture
    designs, runbooks, and developer support documentation
  use_cases:
  - Internal AI application development and deployment platform for the firm
  - RAG-based document retrieval and search applications
  - Secure, governed access to LLM APIs (Claude, Azure OpenAI) with cost monitoring
    and usage logging
  - AI-serving data pipelines and data stores for investment banking workflows
  - Regulated, compliance-aware AI infrastructure in financial services (SEC/FINRA,
    MNPI segregation)
