position:
  title: Senior Software Engineer/Applied AI Scientist
  ai_type:
    type: ai-first
    reasoning: |-
      The role directly shapes LLM/agent behavior: designing RAG
      pipelines (chunking, embeddings, hybrid search, rerankers),
      authoring system prompts and structured outputs, defining
      agent tool-use and function calling policies, building
      LLM/RAG evals and guardrails, and fine-tuning LLMs with
      PEFT/LoRA and distillation. Although it also covers
      classical ML (forecasting, recommenders, classification), a
      role shaping both LLM and classical ML systems is ai-first.
  responsibilities:
  - Design and deliver statistical, ML, and generative/agentic AI solutions spanning
    RAG pipelines, chat/assistants, classification, forecasting, and recommendation
    systems
  - Design and deploy GenAI capabilities to automate regulatory filing support, including
    DOI objection response generation and ingestion of legacy filings into searchable
    knowledge bases, partnering with Legal and Compliance
  - Engineer and maintain domain-specific knowledge bases (regulatory intelligence,
    competitive insights, customer sentiment) powering generative applications across
    underwriting, pricing, and service
  - Own the end-to-end AI lifecycle from problem framing through deployment, including
    data prep, modeling, evaluation, CI/CD, orchestration, observability, safety filters/guardrails,
    and rollback plans
  - Prepare multi-format unstructured content with normalization, metadata/lineage
    management, and PII detection/redaction, and design retrieval strategies (chunking,
    embeddings, hybrid search, rerankers) tuned for cost, latency, and domain fit
  - Author robust system prompts, few-shot patterns, and structured outputs, and define
    safe tool-use policies and function/structured calling for reliable agent behavior
  - Define evaluation metrics across use cases, build gold/synthetic test sets, support
    A/B testing, and monitor drift and performance regressions
  - Develop synthetic data pipelines for low-frequency perils and emerging segments,
    and partner with enterprise architects and platform teams to standardize MLOps
    patterns and scalable, secure deployments
  use_cases:
  - Regulatory filing automation including DOI objection response generation and ingestion
