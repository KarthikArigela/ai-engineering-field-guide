  - Collaborate with data scientists, software engineers, and delivery teams to integrate
    AI into client platforms and CRM programs
  - Translate client requirements into operational AI solutions that scale across
    multiple client engagements
  use_cases:
  - Operationalizing ML and generative AI models from proof-of-concept to production
    for client use
  - Real-time and batch inference powering client digital, analytics, and marketing
    applications
  - AI-enhanced customer experiences within CRM programs and marketing ecosystems
  - Continuously monitored and improving models informing client business decisions
  - Integrated digital, media, and technology solutions for complex B2B organizations
