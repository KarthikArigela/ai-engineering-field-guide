      This is an MLOps/production engineering role: the person
      builds pipelines, serving architectures, monitoring, and
      lifecycle tooling so models built by others run reliably in
      production. The deliverable is capacity, reliability, and
      observability — not shaping model behaviour through prompts,
      retrieval design, training, or building output-quality
      evals. Per Step 1, serving, monitoring, and moving models to
      production is not shaping, so this is ai-support.
