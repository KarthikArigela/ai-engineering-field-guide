  - Implement MLOps best practices including experiment tracking, model versioning,
    and reproducible training workflows
  - Build and maintain monitoring systems to detect data drift, performance degradation,
    and operational issues in production
  - Use evaluation frameworks and monitoring signals to guide continuous improvement
    of ML and generative AI systems
  - Work directly with clients to explain AI concepts, tradeoffs, and outcomes in
