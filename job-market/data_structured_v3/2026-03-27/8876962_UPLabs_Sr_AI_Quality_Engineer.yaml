position:
  title: Sr. AI Quality Engineer
  ai_type:
    type: ai-first
    reasoning: |-
      This role owns output-quality evaluation for an LLM-powered
      inference system and builds the evaluation apparatus itself:
      quality rubrics, golden datasets, regression tests, drift
      detection, and per-customer scorecards that judge model
      outputs. Building evals and output-quality monitoring for a
      model is shaping, and the target is an LLM
      extraction/RAG/tool-calling pipeline, so it is ai-first.
  responsibilities:
  - Own end-to-end system quality for the AI-powered inference system, defining what
    correct output looks like for key use cases and exception types
  - Develop and maintain quality rubrics and build golden datasets of representative
    emails with expected structured outputs and final outcomes, including customer-specific
    variations
  - Review high-volume LLM outputs in dev and production, diagnose what is breaking
    and why, and convert discoveries into roadmap items and regression coverage
  - Define and execute regression tests for new model changes, backend logic changes,
    and customer-specific use cases
  - Triage quality incidents by tracing through email ingestion, prompts and model
    outputs, normalization steps, event streams, state-machine transitions, and downstream
    audit exception reporting
  - Use logs, traces, event histories, and data queries to isolate root cause and
    produce high-signal findings reports with minimal reproduction, evidence, impact,
    and recommended fix
  - Define monitoring and dashboards for quality signals such as volume anomalies,
    exception drift, and per-customer error hotspots, and partner with engineering
    to improve observability
  - Translate freight billing workflows and customer-specific requirements into testable
    rules and expected outcomes, and propose product changes where the schema gaps
    reality
  use_cases:
  - Automating accuracy and trust in complex freight billing transactions
  - Transforming unstructured freight data (email chains, documents, telematics, contracts)
    into a reliable system of record
  - LLM-driven extraction and classification of emails into structured billing outputs
  - Quality evaluation, regression testing, and monitoring of LLM inference as email
    volume and customer complexity scale
  - Generating audit exceptions and root-cause diagnosis of downstream billing behavior
