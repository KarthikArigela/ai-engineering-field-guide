      writes prompts, designs retrieval, or evaluates model
      output. The deliverable is clean, reliable data
      infrastructure rather than model behaviour, so this is ai-
      support despite the AI-native product.
  responsibilities:
  - Design and maintain a semantic layer that translates raw database schemas into
    high-context metadata so LLMs and autonomous agents can reason across enterprise
    data
  - Integrate ERPs, operational tools, and legacy systems into a clean, unified internal
    data layer powering Skiffra's orchestration engine
  - Design schemas and data contracts consumed by LLMs and workflow engines to ensure
    predictable, high-fidelity inputs from messy sources
  - Ensure every data point carries the lineage and metadata an LLM needs to understand
    its business significance
  - Architect end-to-end ingestion and normalization pipelines for structured, semi-structured,
    and unstructured data
  - Implement monitoring, observability, and automated data quality gates so the orchestration
    engine never acts on stale or corrupted enterprise context
  - Partner with product and engineering to translate complex operational needs into
    scalable data systems
  use_cases:
  - AI-native orchestration of industrial operations, starting with mining and natural
    resources
  - Autonomous agents that understand and act on complex industrial and enterprise
    systems
  - Real-time decision support for high-stakes physical-world operations
  - Unifying fragmented enterprise data (ERPs, operational tools, legacy systems)
    into high-fidelity context for LLM reasoning
