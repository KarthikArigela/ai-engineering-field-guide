    reasoning: |-
      The core of this role is building RPA/low-code automations
      in Finance, with AI work consisting of piloting and scaling
      pre-approved AI capabilities (IDP tools, approved GenAI
      assistants, workflow copilots) inside those automations. The
      person consumes AI tools designed and governed by IT/CoE
      rather than shaping model behavior themselves through
      prompts, retrieval design, fine-tuning, or building evals,
      so it is ai-support.
  responsibilities:
  - Identify and prioritize automation opportunities across Finance (AP/AR, close,
    reconciliations, reporting, master data, audit support), including candidates
    for AI augmentation
  - Build and maintain RPA workflows using approved low-code tools such as UiPath,
    Power Automate, Automation Anywhere, and Blue Prism
  - Partner with Finance and IT/CoE to pilot and scale AI-enabled automations including
    intelligent document processing, AI-assisted triage, narrative generation, and
    knowledge search
  - Document future-state processes (SOPs, process maps, user stories, acceptance
    criteria) including AI human-in-the-loop checkpoints
  - Implement exception handling, audit logs, monitoring/alerting, and operational
    runbooks for bots and AI-assisted workflows
  - Execute unit testing, support UAT, assist with deployment and hypercare, and resolve
    incidents
  - Ensure solutions meet SOX/internal controls, data privacy, model/data usage policies,
    and security requirements
  - Track and report automation value and AI quality metrics (hours saved, cycle time,
    error reduction, accuracy, exception rate, reviewer effort)
  use_cases:
  - Finance process automation across AP/AR, close, reconciliations, journal preparation,
    and reporting
  - Intelligent document processing for invoices, statements, and support documentation
  - AI-assisted email and case triage and routing
  - Automated narrative generation for reconciliations and variance explanations with
    human review
  - Knowledge search and Q&A over approved finance procedures and policies
