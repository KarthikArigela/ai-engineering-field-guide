position:
  title: Senior Networking Solution Test Engineer – AI Cluster Debugging
  ai_type:
    type: ai-support
    reasoning: |-
      The role tests and debugs networking infrastructure (NVLink,
      InfiniBand, RoCE/RDMA, NCCL) for AI clusters — the
      deliverable is fabric/cluster correctness and performance,
      not model behavior. There is no prompt work, retrieval
      design, model training, or output-quality evaluation; deep
      learning workloads are only profiled as system/network
      telemetry to find bottlenecks. Serving, validating, and
      scaling infrastructure someone else builds is ai-support.
  responsibilities:
  - Design and review test and product requirements across the NVLink, Ethernet, and
    InfiniBand NIC/DPU/switch portfolio, focusing on large-scale AI cluster behavior
  - Build and maintain realistic customer-like testbeds with heterogeneous hardware,
    OS/driver combinations, and complex network fabrics
  - 'Own end-to-end cluster troubleshooting: reproduce customer scenarios, triage
    across hardware, system software, and AI workloads, and drive issues to root cause'
  - Read and reason about source code to identify defects, validate fixes, and improve
    logging and instrumentation
  - Collaborate with development teams to debug NCCL, RoCE/RDMA, and related networking
    components using logs, code inspection, and targeted experiments
  - Define tests and guide the automation team to implement robust, debuggable test
    suites producing actionable logs, metrics, and traces
  - Run regression, performance, functional, and scale testing, analyze results, and
    provide data-driven reports
  - Profile and benchmark deep learning training and inference workloads, correlating
    model-level metrics with system and network telemetry to uncover bottlenecks
  use_cases:
  - Large-scale AI training and inference cluster validation
  - Collective communication (NCCL) performance and correctness debugging
  - NVLink, InfiniBand, and RoCE/RDMA network fabric troubleshooting
  - Lossless Ethernet and congestion control tuning for AI workloads
  - Multi-layer root-cause analysis of cluster incidents spanning hardware, drivers,
    and AI frameworks
