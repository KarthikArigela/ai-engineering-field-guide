    onboarding users, fielding questions, triaging issues, and training stakeholders
  - Monitor query logs and user behavior to identify context coverage gaps, recurring
    questions worth standardizing, and self-service expansion opportunities
  use_cases:
  - Natural-language-to-SQL self-service analytics that removes analysts as the bottleneck
    for every data question
  - Trustworthy AI-generated insights validated through predefined test cases, accuracy
