  - Support customer onboarding, site visits, and resolution of onboarding or support
    tickets
  use_cases:
  - AI-powered control systems for industrial facilities such as data centers
  - Reinforcement learning converting raw sensor data into high-value control actions
    and decisions
  - Data center cooling optimization including chiller plants and air-side systems
  - Enabling industrial facilities to automatically learn and improve performance
    over time
  - Energy efficiency improvement for industrial operations
