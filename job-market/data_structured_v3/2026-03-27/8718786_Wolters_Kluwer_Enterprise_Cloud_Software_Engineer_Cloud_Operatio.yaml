position:
  title: Enterprise Cloud Software Engineer (Cloud Operations, AI Engineering, Azure/AWS)
  ai_type:
    type: ai-support
    reasoning: |-
      The core role is cloud automation, IaC, and CI/CD
      engineering. The AI component is limited to integrating API-
      driven AI services (alert enrichment, intelligent runbooks,
      basic remediation) into CloudOps workflows — the engineer
      consumes AI endpoints designed elsewhere rather than shaping
      model behavior via prompts, retrieval, training, or evals.
      No LLM/agent design or model work is present, so it
      classifies as ai-support.
  responsibilities:
  - Design, develop, test, and maintain cloud automation solutions using Python, PowerShell,
    Bash, and JavaScript to automate IT and CloudOps tasks
  - Build reusable automation frameworks, libraries, and services using cloud SDKs,
    APIs, and serverless technologies (AWS Lambda, Azure Functions)
  - Lead Infrastructure-as-Code efforts with Terraform, CloudFormation, ARM/Bicep,
    and Ansible across multi-cloud and hybrid environments
  - Develop and maintain CI/CD pipelines for infrastructure and automation using Azure
    DevOps, GitHub Actions, Jenkins, or GitLab CI
  - Automate operational capabilities such as provisioning, scaling, patching, backup,
    disaster recovery, and decommissioning across AWS and Azure
  - Build automation enforcing cloud governance including tagging standards, security
    baselines, cost optimization, and policy-as-code guardrails
  - Integrate AI-driven automation into CloudOps workflows for alert enrichment, operational
    insights, and basic remediation
  - Develop and support automation for container platforms including Docker, Kubernetes,
    AKS, and EKS, collaborating with Architecture, Security, and Operations teams
  use_cases:
  - Automating traditional IT and CloudOps tasks to replace manual operations with
    repeatable, governed workflows
  - AI-augmented alert enrichment, operational insights, and basic automated remediation
  - Infrastructure provisioning, scaling, patching, backup, and disaster recovery
    as code
  - Cloud governance enforcement including tagging, security baselines, cost optimization,
    and policy-as-code guardrails
  - Container platform automation across Docker, Kubernetes, AKS, and EKS
  - Multi-cloud and hybrid workload automation across AWS and Azure
