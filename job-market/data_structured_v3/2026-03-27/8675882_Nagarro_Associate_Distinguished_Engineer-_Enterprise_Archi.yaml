position:
  title: Associate Distinguished Engineer- Enterprise Architect (Azure AI)
  ai_type:
    type: ai-support
    reasoning: |-
      The role is an enterprise/solution architect that governs an
      AI platform: designing the Azure AI Landing Zone, security
      and compliance controls, integrations, and MLOps standards.
      It does not itself write prompts, design retrieval or agent
      flows, train models, or build evals or guardrails — it
      ensures solutions incorporate responsible AI checks and
      reviews others' work, which is governance/oversight. The
      deliverable is a scalable, secure platform, not model
      behaviour, so it is ai-support.
  responsibilities:
  - Architect the AI Landing Zone spanning Azure OpenAI, Azure AI Foundry, Power Platform,
    Microsoft Fabric, and Microsoft Copilot services
  - Define and enforce governance, identity/SSO integration, and infrastructure requirements
    so the platform is secure, compliant, and scalable
  - Implement architectural controls supporting FERPA, accessibility (WCAG/508), privacy,
    institutional policy, and responsible AI requirements
  - Design integration patterns with core client systems (SIS, LMS, SSO, APIs) and
    collaborate on secure data pipelines and access patterns
  - Evaluate technology options and define technical requirements and architectural
    components for AI use cases across complexity levels
  - Provide technical guidance to developers and ML engineers during design, build,
    and deployment
  - Establish CI/CD pipelines, monitoring dashboards, cost transparency mechanisms,
    and lifecycle management processes for platform maturity
  - Review prototypes, solution designs, integrations, and deployments, and coach
    engineering teams for architectural consistency
  use_cases:
  - Enterprise AI adoption platform for an academic and healthcare institution spanning
    academic, administrative, research, and healthcare environments
  - AI Landing Zone enabling pilot development through long-term institutionalization
    of scalable enterprise AI services
  - Secure integration of AI capabilities with enterprise systems such as SIS, LMS,
    SSO, and data sources
  - Governance, compliance, and responsible AI validation across AI use cases
  - Platform maturity covering MLOps, monitoring, and cost transparency for AI services
