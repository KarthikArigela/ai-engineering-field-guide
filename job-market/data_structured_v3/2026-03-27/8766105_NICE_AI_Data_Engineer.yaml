    reasoning: |-
      This role prepares and transforms unstructured CX
      interaction data (audio, chat, email, social) and metadata
      into formats consumable by the NICE Interaction Analytics
      product suite for sales POCs. The person never shapes model
      behavior — no prompt design, retrieval design, training,
      fine-tuning, or output-quality evaluation — they only move
      and reformat data for a product built by others, which is
      data plumbing and therefore ai-support.
  responsibilities:
  - Manage the delivery of customer CX interactions and corresponding metadata using
    various data delivery methods
  - Develop pre-defined data structures for automated analysis of large sets of CX
    interactions across all channels (audio, chat, email, social)
  - Manipulate CX interaction metadata, interactions, and transcripts into approved
    formats for the NICE Interaction Analytics platform
  - Utilize evolving tools from the Research team to build data structures and provide
    feedback on tooling and data integration
  - Work with client requirements to assess new requests and feasibility for POC builds
  - Educate field teams (Consulting and Customer Success) on data solutions, definitions,
    and best practices
  - Manage the utilization of the CX Proof of Concept (POC) VM servers
  - Support additional Enlighten AI projects, solutions, and deployments as needed
  use_cases:
  - Customer Experience (CX) interaction analytics across audio, chat, email, and
    social media channels
  - Proofs of Concept demonstrating the value of the NICE Interaction Analytics product
    suite to support sales
  - Automated analysis of large volumes of unstructured customer interactions
  - Data structures that reveal operational and measurable business outcomes from
    CX data
