  - Work alongside Customer Success teams to support Coder's enterprise user base
  - Champion best practices with internal team members and external contributors
  - Document the design, implementation, and operations of systems for knowledge sharing
  use_cases:
  - Centralized LLM gateway providing audit trails, token tracking, cost control,
