position:
  title: AI Research Engineer (Agentic Post-training) - 100% Remote Worldwide
  ai_type:
    type: ai-first
    reasoning: |-
      The role directly shapes LLM behavior: it performs post-
      training of agentic LLMs via tool-use fine-tuning, function
      calling, and reinforcement learning from feedback on multi-
      turn interactions, and builds evaluation frameworks and
      curates agentic training data to steer model quality. Since
      the models being shaped are LLMs and agents, this is ai-
      first.
  responsibilities:
  - Conduct end-to-end research and engineering to advance post-training of agentic
    and tool-use models toward SOTA results
  - Drive cross-cutting model improvements including factuality, instruction adherence,
    tool/function use, multi-agent coordination, and reasoning calibration
  - Design and enhance large-scale post-training systems including data pipelines,
    training workflows, evaluation frameworks, and benchmark infrastructure
  - Develop rigorous evaluation suites and diagnostic tools to assess model readiness
    for deployment
  - Strengthen feedback loops from real-world product usage, incorporating explicit
    and implicit user signals into post-training
  - Curate agentic training data such as tool-use trajectories, reasoning chains,
    and environment interactions
  - Collaborate with tooling, product, and training teams to improve the usefulness,
    reliability, and agentic capabilities of frontier models
  - Liaise with research, engineering, and cross-functional teams to determine which
    integrations are production-ready for major model releases
  use_cases:
  - Agentic task execution on edge devices such as smartphones with resource-efficient
    agents
  - Tool-augmented decision making for real-world multi-step tasks
  - Multimodal agents integrating text, images, and audio
  - Reasoning, planning, and autonomous tool invocation with self-correction
  - Improving factuality, instruction adherence, and multi-agent coordination in frontier
    models
