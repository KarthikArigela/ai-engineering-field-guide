      and inference security. The person investigates, reproduces
      defects, and files engineering-ready bug reports, but does
      not write prompts, design retrieval or agent flows, train
      models, or build evals or guardrails. Per the edge case,
      governance and QA oversight of models without building the
      evals/guardrails themselves is ai-support.
  responsibilities:
  - Own and resolve the highest-severity technical escalations through deep analysis,
    ensuring fast resolution and managing the on-call rotation for critical issues
  - Troubleshoot and resolve complex issues across Zscaler cloud security services,
    configuration, policy engines, APIs, and AI-assisted capabilities
  - Investigate and resolve scenarios related to the secure use of AI models, governance
    of AI agents, data protection, and inference security
  - Perform detailed log, telemetry, and packet-level analysis to identify root causes,
    reproduce complex defects, and provide engineering-ready bug reports
  - Validate fixes and drive cross-functional collaboration with Engineering, Cloud
    Ops, and Product Management
  - Create advanced troubleshooting documentation and act as a technical mentor to
    uplift support capability
  use_cases:
  - Escalation management for cloud security services
  - Secure enterprise use of AI models and governance of AI agents
  - Data protection and inference security in AI systems
  - Root cause analysis and defect reproduction for complex technical issues
  - Support enablement through troubleshooting documentation and technical mentoring
