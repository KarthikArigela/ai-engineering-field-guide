    reasoning: |-
      This is a compiler engineering role building the MLIR-based
      graph compiler inside Modular's MAX ML serving stack,
      optimizing inference efficiency (kernel fusion, memory
      planning, shape optimization) and mapping computation graphs
      onto heterogeneous hardware. The person optimizes how models
      built by others are executed; they do not shape model
      behavior or output quality through prompts, retrieval,
      training, fine-tuning, or evals. Like vLLM/TensorRT-style
      serving work, the deliverable is execution performance and
      capacity, not model behavior.
  responsibilities:
  - Design and develop compiler optimizations to improve inference efficiency across
    CPUs, GPUs, and ML accelerators, including kernel fusion, memory planning, and
    shape optimization
  - Compile large-scale application workloads onto heterogeneous hardware by mapping
    hardware-agnostic operator graphs onto hardware-specific device graphs
  - Extend and develop the graph compiler to support state-of-the-art features and
    hardware platforms
  - Collaborate with the kernels, serving, and Mojo compiler teams to deliver end-to-end
    performance across heterogeneous hardware
  - Write design documents for new features and drive alignment on designs with cross-functional
    teams
  - Engage with customers alongside the customer success team to understand performance
    requirements and use cases
  use_cases:
  - High-performance ML model inference across CPUs, GPUs, and ML accelerators
  - Heterogeneous compilation of large-scale application workloads
  - Kernel fusion, memory planning, and shape optimization for inference efficiency
  - Distributed model execution across heterogeneous devices
