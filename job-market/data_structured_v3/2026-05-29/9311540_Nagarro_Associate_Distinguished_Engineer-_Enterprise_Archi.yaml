    reasoning: |-
      The role is a platform/enterprise architect: it designs the
      AI Landing Zone, governs security and compliance, defines
      integrations, and sets MLOps/CI-CD standards, but never
      shapes model behaviour itself — no prompt design, RAG, agent
      flows, fine-tuning, or model output evaluation is done by
      this person. Responsible AI and fairness checks are
      architectural oversight of others' work, and technology
      evaluation is platform selection rather than judging model
      output quality, so this is ai-support.
  responsibilities:
  - Architect the AI Landing Zone spanning Azure OpenAI, Azure AI Foundry, Power Platform,
    Microsoft Fabric, and Microsoft Copilot services
  - Define and enforce governance, identity/SSO integration, and infrastructure requirements
    across academic, administrative, research, and healthcare environments
  - Implement architectural controls for FERPA, accessibility (WCAG/508), privacy,
    responsible AI checks, and observability
  - Design integration patterns with core client systems (SIS, LMS, SSO, APIs) and
    secure data pipelines, connectors, and access patterns
  - Evaluate technology options and define technical requirements and constraints
    for low, medium, and high-complexity AI use cases
  - Provide technical guidance to developers and ML engineers during design, build,
    and deployment
  - Establish CI/CD pipelines, monitoring dashboards, cost transparency mechanisms,
    and lifecycle management to mature the platform from pilots to enterprise services
  - Review prototypes, solution designs, and deployments for architectural alignment
    and coach development and engineering teams
  use_cases:
  - Enterprise AI adoption and platform institutionalization for a large academic
    and healthcare institution
  - AI Landing Zone architecture for scalable, secure Azure AI services
  - AI use cases across academic, administrative, research, and healthcare environments
  - Integration of the AI platform with student information and learning management
    systems
  - Secure, compliant AI governance covering FERPA, privacy, and accessibility requirements
