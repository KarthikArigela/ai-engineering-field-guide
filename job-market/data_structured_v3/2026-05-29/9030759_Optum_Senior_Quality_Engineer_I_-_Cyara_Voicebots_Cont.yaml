position:
  title: Senior Quality Engineer I - Cyara, Voicebots, Contact Center, Gen AI
  ai_type:
    type: ai-support
    reasoning: |-
      This is a quality engineering role: the person tests and
      validates voice bots, IVR flows, and GenAI/LLM behavior that
      others build, producing test results, defect reports, and
      release readiness rather than shaping model behavior. They
      do not write prompts, design retrieval or agent flows, or
      train/fine-tune models themselves. Per the rules, QA
      validation and oversight of models is ai-support.
  responsibilities:
  - Lead bot governance across Azure and GCP platforms, ensuring quality, compliance,
    and release readiness for Conversational AI and voice bot solutions
  - Validate NLU/NLP performance, intent accuracy, training data quality, and GenAI/LLM
    prompt behavior, while monitoring bot health, conversational performance, and
    model drift
  - Design, execute, and maintain Cyara test plans, campaigns, CX models, IVR workflows,
    and regression packs, driving end-to-end automation with Cyara, Botium, and API
