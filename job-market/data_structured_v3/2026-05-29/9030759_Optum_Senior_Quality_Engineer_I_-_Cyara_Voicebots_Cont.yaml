  - Perform in-depth troubleshooting of Cyara logs, call recordings, and performance
    metrics to improve IVR reliability and voice channel stability
  - Execute end-to-end testing of contact centre and telephony platforms including
    Genesys Cloud/Engage and Amazon Connect, validating IVR flows, routing logic,
    queues, and agent desktop interactions
  - Test and regression validate Google Dialogflow ES/CX voice bots covering intent
    recognition, entity extraction, fulfillment and webhook integrations, telephony
    integration, and fallback handling
  - Define and execute quality engineering practices including test scenarios, test
    cases, traceability matrices, defect management, and functional, integration,
    regression, and UAT testing
  - Collaborate with Product Owners, Architects, Conversational Designers, Developers,
    and DevOps teams, participating in Agile ceremonies and delivering test reports
    and release readiness documentation
  use_cases:
  - Automated testing and quality assurance of contact centre IVR and telephony platforms
  - Voice bot and Conversational AI quality assurance covering intent recognition,
    entity extraction, and fallback handling
  - Validation of GenAI/LLM-powered customer interactions and NLU/NLP accuracy
  - Bot governance, compliance, and release readiness for conversational AI solutions
    across Azure and GCP
  - Monitoring bot health, conversational performance, and model drift for healthcare
    contact centre voice channels
