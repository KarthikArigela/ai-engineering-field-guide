      systems is ai-first.
  responsibilities:
  - Design, build, and maintain large-scale property graphs and RDF triplestores (Neo4j,
    Amazon Neptune, Stardog)
  - Develop and govern ontologies, taxonomies, and entity-relationship schemas; optimize
    Cypher, SPARQL, and Gremlin traversal queries for sub-second production performance
  - Train and deploy graph neural networks for node classification, link prediction,
