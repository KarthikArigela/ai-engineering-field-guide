position:
  title: Senior Gen AI Engineer
  ai_type:
    type: ai-first
    reasoning: |-
      The role shapes model behavior directly: architecting LLM
      agents with multi-step reasoning chains, building graph-
      aware RAG pipelines, designing tool-use/function-calling
      layers, and maintaining evaluation harnesses for agent
      accuracy and hallucination rate. Preferred experience
      includes fine-tuning open-source LLMs. GNN training is also
