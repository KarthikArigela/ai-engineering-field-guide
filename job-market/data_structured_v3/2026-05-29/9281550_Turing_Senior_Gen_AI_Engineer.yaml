  - Build graph-aware RAG pipelines that blend structured graph context with unstructured
    document retrieval
  - Design tool-use and function-calling layers so agents can query live sources (web
    search, REST/GraphQL APIs, relational databases) and implement memory, reflection,
    and self-correction loops
  - Integrate web scraping, news feeds, and OSINT sources to enrich the graph, with
    entity resolution, deduplication, confidence scoring, and provenance tracking
  - Package agents as scalable microservices with observability tooling, deploy on
    AWS/GCP/Azure, and maintain evaluation harnesses measuring agent accuracy, hallucination
    rate, and graph coverage
  use_cases:
  - Large-scale knowledge graph construction and enrichment from structured, semi-structured,
    and unstructured data
  - Autonomous agents performing multi-step reasoning and question answering over
    knowledge graphs
  - Context enrichment via live web, enterprise API, and OSINT data fusion with provenance
    and confidence tracking
  - Entity resolution and deduplication merging heterogeneous sources into a consistent
    graph
  - Graph reasoning via GNNs for node classification, link prediction, and subgraph
    retrieval
  - Intelligence/trade-craft applications such as link analysis and entity disambiguation
    under adversarial conditions
