company:
  name: Exactera
  stage: Start-up founded in 2016, backed by over $100 million from Savant Venture
    Fund and Insight Partners
  focus: FinTech SaaS providing AI-powered corporate tax solutions
position:
  title: Principal AI Engineer
  ai_type:
    type: ai-first
    reasoning: |-
      The role owns the intelligence layer and directly shapes LLM
      behavior: designing RAG pipelines (chunking, embeddings,
      context assembly), the agent platform and tool access, MCP
      interfaces, versioned prompts, and the evaluation harness
      that captures expert judgment as ground truth. LLMs and
      agentic workflows are central, so it is ai-first. Model
      serving and infrastructure are present but secondary to the
      shaping work.
  responsibilities:
  - Own the inference and intelligence layer of the Exactera platform as an individual
    contributor with architectural authority, setting technical direction and build-versus-buy
    decisions
  - 'Design and operate the tax-domain knowledge graph: typed entities and reified
    relationships, entity resolution and relationship extraction at scale across reports,
    SEC filings, and customer data, with versioned snapshots for audit reconstruction'
  - Build hybrid retrieval combining graph traversal, vector search, and structured
    queries, with a planner that orchestrates mode selection and result fusion per
    task
  - 'Build the full RAG pipeline as one retrieval mode: chunking strategies, embedding
    generation, index management, retrieval optimization, and context assembly'
  - 'Develop the agent platform: short-term, long-term, and episodic memory, controlled
    tool access and permissioning, determinism and replayability, and observability
    of agent decisions'
  - Design the evaluation harness that turns practitioner judgment into versioned
    ground truth, with system-level evaluation of retrieval, decision, and justification
    quality plus regression detection in CI and shadow
  - Run production model serving with real-time inference endpoints under latency,
    cost, and reliability SLAs, plus experiment tracking, model registry, and deployment
    lifecycle in MLflow
  - Deliver developer-facing APIs, Python and Node SDKs, and production MCP gateways
    that expose platform capabilities to product engineers composing agentic workflows
  use_cases:
  - Comparable company selection for transfer pricing, replicating and defending expert
    comparability analysis
  - Document classification and structured extraction of entities, transactions, and
    reasoning from 34,000 TP reports and SEC filings
  - Automated tax advisory report generation via agentic workflows replacing manual
    practitioner work
  - Audit-defensible AI outputs for tax authorities, with replayability of exactly
    what the system saw when a decision was made
  - Unlocking trapped expert reasoning as a searchable, versioned knowledge substrate
    for future analyses
