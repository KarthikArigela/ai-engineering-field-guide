position:
  title: Senior Software Engineer, AI Inference Systems
  ai_type:
    type: ai-first
    reasoning: |-
      This role directly optimizes model internals rather than
      merely serving or scaling someone else's models: it develops
      and tunes CUDA kernels and ML compilers/DSLs, and implements
      speculative decoding and parallelism strategies inside LLM
      inference engines like vLLM and SGLang. Per the edge-case
      rules, optimizing a model's own internals (kernels,
      quantization, decoding strategies) is shaping, and since the
      targets are LLM inference stacks, this is ai-first.
  responsibilities:
  - Contribute features to vLLM that enable the newest models with the latest NVIDIA
    GPU hardware features
  - Profile and optimize the vLLM inference framework using speculative decoding,
    data/tensor/expert/pipeline parallelism, and prefill-decode disaggregation
  - Develop, optimize, and benchmark hand-tuned and compiler-generated GPU kernels
    using fusion, autotuning, and memory/layout optimization
  - Build and extend high-level DSLs and compiler infrastructure to boost kernel developer
    productivity while approaching peak hardware utilization
  - Define and build inference benchmarking methodologies and tools and contribute
    benchmarks and NVIDIA submissions to the MLPerf Inference suite
  - Architect scheduling and orchestration of containerized large-scale inference
    deployments on GPU clusters across clouds
  - Conduct and publish original ML Systems research and integrate research ideas
    and prototypes into NVIDIA software products
  use_cases:
  - Serving large-scale AI models with extreme efficiency
  - High-performance GPU kernel and compiler optimization for LLM inference
  - Industry-standard inference benchmarking via MLPerf
  - Scaling inference workloads across multi-GPU, multi-node, and multi-cloud environments
  - ML systems research advancing the pareto frontier of accelerated computing
