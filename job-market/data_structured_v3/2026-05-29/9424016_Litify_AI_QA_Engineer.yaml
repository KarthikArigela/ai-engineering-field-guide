  focus: All-in-one legal operations platform for law firms
position:
  title: AI QA Engineer
  ai_type:
    type: ai-support
    reasoning: |-
      This is a QA engineer role where AI is a tool, not the
      object being shaped. The person reviews AI-generated test
      outputs as QA validation/oversight, uses Claude and GitHub
      Copilot as workflow assistants to generate test cases and
      scripts, and writes traditional Playwright automation. They
      do not build evals, guardrails, prompts, retrieval systems,
      or train models, and their judgments are not fed back as
      preference/reward signals — so per the QA oversight and AI-
      coding-assistant rules, this is ai-support.
  responsibilities:
  - Review and validate AI-generated test results for accuracy, completeness, and
    false positives/negatives, applying domain judgment to determine pass/fail outcomes
  - Perform manual, exploratory, and edge-case testing on complex workflows, boundary
    conditions, and integration points where AI coverage is insufficient
  - Own QA strategy and execution for the squad, including test planning, risk assessment,
    and release readiness decisions
  - Write and maintain Playwright automation following Page Object Model design patterns,
    expanding coverage toward 80% by end of year
  - Leverage AI development tools (Claude, GitHub Copilot) to generate test cases,
    write automation scripts, and debug failures
  - Report defects, track bugs, and provide clear, actionable suggestions for product
    enhancements
  - Collaborate with development, product management, delivery, and Customer Support
    teams across the SDLC to triage complex application issues
  use_cases:
  - AI agents performing initial automated test passes on a Salesforce-based legal
    software product
  - Human QA review and validation of AI-generated test results for pass/fail determination
  - AI-assisted test case generation, automation script writing, and failure debugging
  - Quality assurance for an all-in-one legal operations platform used by law firms
    and legal departments
