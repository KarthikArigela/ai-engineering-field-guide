position:
  title: Principal AI Engineer
  ai_type:
    type: ai-first
    reasoning: |-
      The role designs agent harnesses, agentic loops, tool
      orchestration, and structured output handling around LLM
      calls, which is direct shaping of LLM/agent behavior. It
      also owns evaluation frameworks and improvement loops
      including prompt tuning, context engineering, model right-
      sizing, and exploring fine-tuning (SFT, DPO, RLHF) on trace
      data. With a clear LLM/agent component, this is ai-first.
  responsibilities:
  - Design and build agent harness infrastructure that wraps LLM calls, manages tool
    use, handles retries, enforces policy, and feeds results into iterative improvement
    loops
  - Implement agentic loop patterns with multi-turn reasoning, tool orchestration,
    memory management, and structured output handling as reusable platform primitives
  - 'Build the agent flywheel: automated pipelines that collect agent traces, surface
    regressions, and close the loop from production signal back to prompt and model
    improvement'
  - Implement evaluation frameworks with eval datasets and golden trace libraries
    covering task success, tool selection accuracy, trajectory evaluation, hallucination
    rates, latency, and cost
  - Build sandboxed execution environments and tiered autonomy models so agents can
    act with bounded blast radius and human approval gates
  - Drive agent optimization via prompt tuning, tool calling optimizations, context
    engineering, model right-sizing, and fine-tuning (SFT, DPO, RLHF), validated through
    A/B tests, shadow deployments, and replay
  - Build and optimize CI/CD pipelines (GitHub Actions, ArgoCD) with agent evaluation
    gates, automated Docker builds, security scanning, and integration tests
  - Establish monitoring, alerting, and security compliance for agent infrastructure,
    including end-to-end trace instrumentation and agent quality metrics
  use_cases:
  - Autonomous AI agents operating at enterprise scale
  - Agent development, testing, and trust across marketing, sales, service, and product
    growth verticals
  - Agent quality evaluation covering task success, tool selection, hallucination
    rates, latency, and cost
  - Safe agent execution through sandboxing, tiered autonomy, and replay testing
  - Build-evaluate-improve-ship flywheel for production agent iteration
