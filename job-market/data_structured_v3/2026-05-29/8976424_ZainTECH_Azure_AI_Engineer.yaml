  - Build evaluation pipelines for safety, groundedness, relevance, and bias using
    Azure AI Foundry evaluations and embed Responsible AI checks in deployment workflows
  - Author Terraform/Bicep modules and CI/CD pipelines for AI services, prompt flows,
    model training, and endpoint deployment with registry and promotion gates
  - Instrument AI workloads with Azure Monitor and Application Insights for token
    usage, latency, cost, drift, and guardrail violations, and enforce security controls
    (private endpoints, Managed Identity, Key Vault, RBAC)
  use_cases:
  - Enterprise generative AI solutions built and deployed on the Azure stack
  - Retrieval-augmented generation over enterprise data via AI Search, vector stores,
    and Data Lake
  - AI agents and prompt-flow applications delivered as production AI services
  - Responsible AI with safety guardrails, PII filtering, and groundedness checks
    for UAE regulated industries
  - End-to-end MLOps lifecycle for model training, evaluation, deployment, and monitoring
  - Data pipelines feeding curated enterprise data into AI models and vector indexes
