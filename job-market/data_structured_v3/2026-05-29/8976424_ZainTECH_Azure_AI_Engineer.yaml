position:
  title: Azure AI Engineer
  ai_type:
    type: ai-first
    reasoning: |-
      The role directly shapes LLM behaviour: it designs agent
      flows and prompt flows, builds RAG pipelines, selects and
      fine-tunes models, and implements guardrails and evaluation
      pipelines for output quality. Generative/LLM components
      dominate (Azure OpenAI, RAG, agents), so it is ai-first
      despite the heavy deployment and MLOps duties.
  responsibilities:
  - Implement AI solutions on Azure AI Foundry including agent design, model selection,
    prompt flows, evaluation pipelines, and deployment of fine-tuned and base models
  - Build RAG pipelines using Azure AI Search, Azure OpenAI, and vector stores, integrated
    with enterprise data sources via Azure Data Lake and Databricks
  - Deploy models and AI endpoints to Azure ML, Azure AI Foundry, AKS, and Azure Container
