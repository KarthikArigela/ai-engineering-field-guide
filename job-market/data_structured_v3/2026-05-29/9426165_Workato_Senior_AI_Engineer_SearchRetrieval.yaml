position:
  title: Senior AI Engineer (Search/Retrieval)
  ai_type:
    type: ai-first
    reasoning: |-
      This is a hands-on IC role that directly shapes LLM/agent
      output quality: designing RAG pipelines, chunking and
      embedding strategies, LLM-assisted query rewriting, prompt
      engineering, cross-source re-ranking, and evaluation
      harnesses (faithfulness, citation accuracy) for end-to-end
      agent answers. Because LLM and agent components are central
      to the retrieval layer being built, Step 2 classifies it as
      ai-first.
  responsibilities:
  - Build a unified, agent-friendly retrieval layer across enterprise systems (Google
    Drive, SharePoint, Confluence, Jira, Asana, Zendesk, Freshdesk, Salesforce, Notion)
  - Design hybrid retrieval pipelines combining lexical BM25, dense vector, and structured
    SQL/graph retrieval with smart cross-source re-ranking
  - Engineer incremental ingestion and freshness pipelines syncing millions of documents,
    tickets, tasks, and CRM records with low latency and predictable cost
  - Own permission-aware retrieval that mirrors source-system ACL models so users
    and agents never see unauthorized content
  - Build query understanding for agents including intent parsing, cross-system entity
    linking, and LLM-assisted query rewriting and decomposition
  - Design chunking and embedding strategies tailored to content types such as long
    docs, short tickets, threaded conversations, structured records, and call transcripts
  - Build evaluation and experimentation harnesses (NDCG, MRR, recall@k, faithfulness,
    citation accuracy) for retrieval and end-to-end agent answers
  - Ship production-grade observable systems with SLOs on latency, freshness, recall,
    and cost, and mentor teammates on retrieval architecture and evaluation rigor
  use_cases:
  - Enterprise AI agent question answering that stitches together Salesforce opportunities,
    call summaries, Zendesk tickets, Jira blockers, and SharePoint contracts into
    one ranked answer
  - Unified permission-aware enterprise search across heterogeneous content (docs,
    tickets, tasks, CRM records, transcripts, chat threads)
  - RAG and semantic search grounding for enterprise AI agents with strict freshness
    constraints
  - Cross-source entity linking so identities like a customer in Salesforce and Zendesk
    resolve correctly
  - Fresh low-latency retrieval over millions of incrementally synced enterprise records
