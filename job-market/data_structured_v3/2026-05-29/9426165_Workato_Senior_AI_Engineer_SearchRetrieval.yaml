    ml: [Embeddings, Fine-Tuning, Learning-to-Rank, Cross-Encoders]
    web: [REST APIs, GraphQL, Webhooks, OAuth]
    databases: [OpenSearch, Elasticsearch, Solr, Vespa, FAISS, pgvector, Pinecone,
      Weaviate, Qdrant, Milvus, Vector Search, Knowledge Graphs, NoSQL]
    data: [Kafka, Flink, Spark, Entity Resolution]
    cloud: [AWS, GCP, Azure]
    ops: [CI/CD, Containerization, Distributed Systems, Observability]
    languages: [Python, Go, Java, SQL]
    domains: [Information Retrieval, NLP]
