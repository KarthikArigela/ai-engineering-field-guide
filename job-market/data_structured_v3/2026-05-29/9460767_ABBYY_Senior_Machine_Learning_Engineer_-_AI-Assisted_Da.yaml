position:
  title: Senior Machine Learning Engineer -  AI-Assisted Data Annotation
  ai_type:
    type: ai-first
    reasoning: |-
      The role directly shapes LLM and vision-language model
      behavior: designing and refining prompting strategies, few-
      shot examples, instruction tuning, and fine-tuning
      approaches, plus building evaluation frameworks and feedback
      loops that judge model-generated output quality. Because
      prompt-driven LLM/VLM components are the core of the work,
      this is ai-first rather than ml-first or ai-support.
  responsibilities:
  - Design and implement AI-powered annotation pipelines using LLMs and vision-language
    models to generate ground truth labels at scale
  - Develop and refine prompting strategies, few-shot examples, and fine-tuning approaches
    to improve annotation accuracy and consistency
  - Build systems for label verification, confidence scoring, and quality validation,
    and create evaluation frameworks benchmarking automated annotations against human-labeled
    data
  - Own the automated annotation track end-to-end, driving technical decisions on
    model selection, pipeline design, and validation strategies
  - Evaluate which tasks suit automated annotation versus human review and design
    human-in-the-loop review workflows with Data Operations
  - Build and optimize large-scale inference pipelines for processing millions of
    documents, including batching, caching, and fallback mechanisms
  - Implement monitoring and alerting for quality degradation and system failures
  - Collaborate with Platform teams on model serving, APIs, and infrastructure scaling
  use_cases:
  - Automated generation of ground truth training labels at scale for document AI
    models
  - AI-assisted annotation for document understanding tasks including classification,
    extraction, layout analysis, and semantic parsing
  - Label quality verification, confidence scoring, and validation feeding downstream
    model training
  - Human-in-the-loop review workflows balancing automated annotation with human judgment
  - Large-scale document processing covering millions of documents with cost, throughput,
    and accuracy trade-offs
