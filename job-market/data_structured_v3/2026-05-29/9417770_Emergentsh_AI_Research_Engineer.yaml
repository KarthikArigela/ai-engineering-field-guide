position:
  title: AI Research Engineer
  ai_type:
    type: ai-first
    reasoning: |-
      The role directly shapes model and agent behavior: designing
      the coding agent's core architecture, running fine-tuning,
      RLHF/RLAIF, DPO, distillation, reward modeling, and prompt-
      optimization experiments, and building the evals and judge-
      model calibration that determine output quality. The targets
      are LLM-based coding agents, so it is ai-first rather than
      ml-first.
  responsibilities:
  - Architect the next version of the Emergent coding agent, making foundational design
    choices for how it thinks, learns, and improves over time
  - Characterize agent behavior at depth across real-world usage and convert findings
    into rigorous quantitative metrics
  - Design and ship evaluations covering reasoning, planning, tool use, code correctness,
    long-horizon execution, security, and agent reliability
  - Run training and post-training experiments including supervised fine-tuning, RLHF/RLAIF,
    DPO, distillation, reward modeling, and prompt optimization
  - Mine large volumes of production agent behavior data to surface rare, hidden failure
    modes
  - Drive step-function performance gains and climb public benchmarks such as SWE-bench
    Pro and Terminal-Bench
  - Calibrate judge models and make defensible shipping decisions in noisy, subjective,
    probabilistic systems
  - Own work end-to-end from hypothesis through experiment design, execution, analysis,
    rollout, and post-launch measurement
  use_cases:
  - Autonomous code generation from plain-language intent
  - Generating, testing, and deploying production applications end-to-end
  - Long-horizon coding agent execution with correctness, reliability, and security
  - Mining production data for rare agent failure modes at scale
  - Benchmark-driven improvement of coding agents on SWE-bench Pro and Terminal-Bench
