position:
  title: Associate AI Engineer
  ai_type:
    type: ai-first
    reasoning: |-
      The role directly shapes LLM behaviour: writing and refining
      prompts, building agentic workflows with MCP and tool-use
      patterns, maintaining embedding and vector store retrieval
      pipelines, and defining automated evaluation frameworks to
      catch hallucination and bias. The primary target is an LLM-
      driven conversational product (FarmerChat), with secondary
      multimodal (speech/vision) work, making it ai-first.
  responsibilities:
  - Build and integrate LLM-powered features for FarmerChat using provider APIs (Anthropic
    Claude, OpenAI, Google Gemini)
  - Write and refine prompts and wire up tool-use patterns using provider SDKs and
    the Model Context Protocol (MCP)
  - Run and extend automated test suites that check LLM outputs for accuracy, hallucination,
    and bias using Ragas, DeepEval, or Promptfoo
  - Test agent workflows end-to-end and document edge cases, failure modes, and regressions
  - Maintain embedding pipelines and vector stores (Qdrant, pgvector, FAISS) that
    ground LLM responses in agricultural knowledge
  - Support multimodal work spanning speech-to-text, text-to-speech, and image classification
    for crop and pest detection
  - Monitor system health and flag issues using observability tools (Langfuse, Arize
    Phoenix, Weights & Biases)
  - Document prompts, experiments, and runbooks so the team can reproduce and build
    on the work
  use_cases:
  - FarmerChat - a conversational AI advisory platform serving millions of smallholder
    farmers
  - Multilingual and low-resource agricultural advisory grounded in agricultural knowledge
    via embeddings and vector stores
  - Speech interfaces for farmers through speech-to-text and text-to-speech
  - Crop and pest detection via image classification
  - Evaluation pipelines that validate model updates for accuracy, hallucination,
    and bias before production release
