position:
  title: 'Senior Software Engineer: AI Platform Integrations'
  ai_type:
    type: ai-support
    reasoning: |-
      The role builds third-party API integrations (Salesforce
      Agentforce, Microsoft Copilot ecosystem) to discover,
      identify, and govern AI agents running on external
      platforms. The person never shapes model behavior — no
      prompts, retrieval design, training, or model evals — they
      consume provider APIs and identity signals to do security
      governance, akin to a CASB for AI agents. Integrating with
      AI services someone else designed is ai-support.
  responsibilities:
  - Build integrations that extend Delinea's discovery, identity, and governance onto
    third-party AI platforms
  - Extend the existing Microsoft integration to new platforms, starting with Salesforce
    Agentforce
  - Retrieve each platform's native identity signals, such as Salesforce and Microsoft
    Entra, and pass them to the identity layer
  - Govern agents through provider APIs and attestation where direct enforcement is
    not possible
  - Contribute upstream improvements to the shared discovery platform to expand coverage
    to AWS and Google Cloud
  - Reuse the platform's shared identity and policy building blocks rather than building
    separate ones per integration
  use_cases:
  - Discovery, identification, and governance of AI agents running on third-party
    platforms
  - Ingesting native identity signals from platforms like Salesforce and Microsoft
    Entra into an identity layer
  - Governing agents through provider APIs and attestation where direct enforcement
    is not possible, similar to a CASB governing SaaS
  - Expanding agent governance coverage from the Microsoft ecosystem to Salesforce,
    AWS, and Google Cloud
  - Securing human and machine identities across cloud infrastructure, data, SaaS
    applications, and AI
  skills:
    genai: [Microsoft Copilot, Agentforce, Bedrock AgentCore]
