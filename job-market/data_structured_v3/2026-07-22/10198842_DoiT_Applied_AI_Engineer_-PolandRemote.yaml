position:
  title: Applied AI Engineer -Poland(Remote)
  ai_type:
    type: ai-support
    reasoning: |-
      The role is a full-stack platform engineer building internal
      business systems; AI enters in two ways - using Claude Code
      as a coding assistant across the SDLC (explicitly ai-support
      territory) and designing APIs that AI agents can safely
      consume, without the person writing prompts, designing
      retrieval, or shaping agent flows themselves. LLM API
      integration and prompt design appear only as nice-to-haves,
      and reviewing AI-generated code for shipping is standard
      engineering review, not shaping model behaviour.
  responsibilities:
  - Own internal tools end to end from understanding the operational problem through
    design, implementation, deployment, and iteration
  - 'Build full-stack systems: Python/Go services on GCP Cloud Run, TypeScript/React
    web apps and internal admin tools, and event-driven integrations on Pub/Sub'
  - Integrate third-party SaaS platforms and cloud APIs using REST, webhooks, OAuth,
    and event-driven patterns, handling failures, retries, and schema drift
  - Build and maintain workflow automation and business process orchestration as named,
    observable flows rather than logic buried in vendor scripts
  - Use AI tooling (Claude Code) across the development lifecycle - spec, code, and
    review - directing it as a coding collaborator while owning the output
  - Review AI-generated code before it ships for correctness, security, and type safety
  - Operate shipped systems in production covering monitoring, reliability, cost,
    and failure modes
  - Contribute to shared engineering standards, playbooks, and internal tooling
  use_cases:
  - Unifying dozens of internal SaaS platforms (CRM, ERP, support, marketing, billing)
    into a composable, event-driven platform with a canonical event log
  - Exposing business domains (Customer, Billing, Support) as versioned, permissioned
    APIs so AI agents can operate the platform safely as first-class consumers
  - Reconciling marketing leads into the CRM via orchestrated integrations
  - Providing Finance real-time forecasting instead of spreadsheet exports
  - Turning quarterly access audits into observable workflows that produce their own
    evidence
  - Business process orchestration via named, observable BPMN flows replacing vendor
    scripts
  skills:
    genai: [Claude Code, LLMs, Prompt Engineering, Function Calling]
    ml: []
    web: [React, REST APIs, Webhooks, OAuth]
    databases: [Neo4j, Cypher]
    data: [Pub/Sub]
    cloud: [GCP, Cloud Run, IAM]
    ops: [Terraform, Observability, Monitoring, BPMN, Camunda, Temporal, Deployment
        Pipelines, Secrets Management, Distributed Systems]
    languages: [Python, Go, TypeScript, Rust]
    domains: []
    other: [Event-Driven Architecture, n8n, Zapier, Graph Algorithms, Tauri, AI Safety]
  is_customer_facing: false
  is_management: false
