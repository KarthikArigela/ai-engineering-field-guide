    (Jira, Jenkins, Slack) to AI-powered Duo Flows
  - Contribute to the broader event platform, the core infrastructure many of GitLab's
    AI features rely on to know when and how to run
  - Architect for high availability and throughput so the system reliably processes
    events at scale at the center of automated AI workflows
  - Work within GitLab's Rails monolith while staying open to other languages used
    elsewhere in the platform
  - Influence product and architecture direction by proposing iterative solutions
    to complex technical problems across a multi-service environment
  - Collaborate with teammates, product manager, and designer to shape what the trigger
    system supports next
  - Partner cross-departmentally with other Duo Agent Platform teams so triggers and
    events integrate with the broader agent ecosystem
  - Participate in Tier 2 and Tier 3 on-call rotations to troubleshoot production,
    security, and urgent engineering issues
  use_cases:
  - Automated AI-powered workflows (Duo Flows) that run automatically in response
    to events across the development lifecycle
  - Automated code review triggered by GitLab events
  - Event-driven AI automation linking CI/CD results, deployments, and issue/merge
    request changes to agentic workflows
  - Integrating third-party tool events from Jira, Jenkins, and Slack into AI agent
    workflows
