position:
  title: AI Systems Engineer
  ai_type:
    type: ai-support
    reasoning: |-
      This is a full-stack platform engineer role whose
      deliverable is the B2B platform (React, FastAPI,
      Terraform/IAM/ECS, Postgres, SAP integration), with Claude
      Code agents operated as the core productivity tool for
      writing and shipping code. The description explicitly frames
      AI as orchestration of coding agents ("The job isn't writing
      code with AI; it's operating it"), not shaping model
      behaviour or output quality — no prompt product, RAG design,
      or model training. Per the edge cases, rolling out/directing
      AI coding agents to ship engineering work faster is ai-
      support even when the orchestration fluency is a hiring
      requirement.
  responsibilities:
  - Own the multi-app B2B platform end to end, from React/TypeScript front ends and
    FastAPI/Python services to the Terraform/IAM/ECS infrastructure and shared design
    system
  - Stand up infrastructure and environments from scratch, including new services,
    cloud accounts, tenants, connectors, data syncs, and cross-region migrations
  - Direct fleets of coding agents, decomposing cross-repo changes into disjoint parallel
    tasks in isolated worktrees and running adversarial multi-reviewer verification
  - Integrate deeply with enterprise systems via SAP RFC/BAPI, authoring ABAP where
    necessary, reverse-engineering business rules, and running idempotent event sync
  - Architect multi-tenant data using Postgres row-level security, JSONB-backed tenant-extensible
    capability platforms, and a graph database where it fits
  - Ship multiple PRs across multiple repos in a working session with CI green and
    verified deployments while keeping the architecture coherent
  - Author specs, design docs, discovery-question sets, and runbooks so work can be
    understood and resumed by others
  - Build tooling that makes AI agents effective on the codebase, including navigation
    maps, documentation indexes, guard hooks, and custom Claude skills
  use_cases:
  - Replacing fragmented materials-industry tooling (CRMs, ERPs, point tools, flat
    files) with one platform that turns interactions and transactions into usable
    commercial data
  - Orchestrating parallel fleets of coding agents to build and ship changes across
    many repositories at once
  - Automating recurring engineering workflows as reusable Claude skills, hooks, and
    slash commands
  - Deep SAP/ERP integration for sales-order and customer-master flows with idempotent
    event sync
  - Multi-tenant B2B data architecture with row-level security and tenant-extensible
    capabilities
