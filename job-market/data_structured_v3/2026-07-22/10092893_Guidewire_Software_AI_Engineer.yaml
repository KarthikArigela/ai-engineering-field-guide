      prompt assembly), and running evals/accuracy validation
      loops. All shaping work targets LLM/agent components, so it
      is ai-first; the light classical ML work is secondary and
      complements the LLM systems.
  responsibilities:
  - Build and maintain the LLM agent harnesses powering each AI feature — agent loops,
    tool/function calling, context construction, memory, retries, and failure handling
  - Design, iterate, and version prompts as first-class assets, running structured
    experiments and measuring deltas with eval datasets
  - Build and operate RAG pipelines that extract information from documents into structured
    knowledge bases — chunking, indexing, retrieval, reranking, and prompt assembly
  - Generate embeddings and manage vector indexes (OpenSearch, Pinecone, pgvector),
    tuning them for retrieval quality and cost
  - Build extraction and parsing pipelines so documents, structured records, and customer
    datasets are clean, labeled, and ready for downstream AI work
  - Write and operate accuracy validation scripts, maintain evaluation datasets (golden
    and regression sets), and report quality metrics
  - Apply traditional ML — classification, clustering, lightweight fine-tuning — to
    complement LLM-based components
  - Perform data analysis (sample inspection, error analysis, prompt iteration) that
    informs AI design decisions and help shape the technical approach with the AI
    Architect
  use_cases:
  - End-to-end AI productization projects delivered by dedicated Strike Teams
  - Turning LLMs into production AI features via agent harnesses and tool calling
  - Document-heavy information extraction into structured knowledge bases (insurance/finance
    datasets)
  - Retrieval-augmented generation over customer documents and records
  - Accuracy validation and quality evaluation of AI features against golden and regression
    datasets
