position:
  title: Solution Engineer - Cloud & AI Infrastructure
  ai_type:
    type: ai-support
    reasoning: |-
      This is a technical pre-sales solution engineering role
      selling Azure cloud infrastructure; the person designs cloud
      architectures, migrations, and hybrid networking but never
      shapes model behavior through prompts, retrieval, fine-
      tuning, or evals. AI appears only as workloads the
      infrastructure supports ("AI-powered infrastructure", "AI
      workloads", intelligent agents for legacy transformation),
      so the role is ai-support.
  responsibilities:
  - Own technical sales with customers' technical decision makers through demos, offers,
    programs, and proof of concepts using consultative sales methodology
  - Build trusted advisor relationships with customers and co-develop secure, resilient
    solution architectures for production-scale delivery using Cloud Adoption Framework
    and Cloud Migration Factory best practices
  - Overcome competitors and technical objections and manage customer escalations
    with Global Black Belt and engineering teams
  - Maintain deep expertise in cloud migration workloads (Windows, SQL, Linux, PostgreSQL)
    and enterprise applications (SAP, Oracle)
  - Lead customers through modernization using the 6R strategy, containerization best
    practices, and Azure-native services like AKS and Arc
  - Design hybrid and cloud-native networking solutions including virtual networks,
    VPNs, and secure routing architectures
  - Grow expertise in VMware with Azure VMware Services (AVS)
  - Stay current on market trends and competitive insights and share them with the
    infrastructure technical community
  use_cases:
  - Cloud migration of core workloads including Windows, SQL Server, Linux, PostgreSQL,
    and Oracle to Azure
  - Infrastructure modernization using the 6R strategy, containerization, AKS, and
    Azure Arc
  - Hybrid and cloud-native networking with secure connectivity and enterprise performance
    optimization
  - Secure, scalable cloud architectures that support AI workloads and business-critical
    applications
  - Compliance-ready cloud environments aligned with regulatory requirements
