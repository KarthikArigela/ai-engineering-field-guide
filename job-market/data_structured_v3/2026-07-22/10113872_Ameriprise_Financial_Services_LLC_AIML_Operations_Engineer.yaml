  - Automate repetitive operational tasks and build reusable platform components,
    automation scripts, templates, and deployment patterns
  - Support monitoring, logging, alerting, dashboards, incident management, root cause
    analysis, and cost optimization across platforms
  - Create and maintain operational dashboards and reports, including Power BI dashboards
    for platform usage, adoption, and metrics
  use_cases:
  - Enterprise AI/ML platform operations and enablement for data science and ML teams
  - Production deployment of AI/ML and Generative AI workloads using AWS-native services
  - Governed, secure, and compliant enterprise AI/ML workloads with audit and access
    controls
  - Data science experimentation and prototyping on Dataiku and Amazon SageMaker
  - Platform usage monitoring, cost optimization, and adoption reporting via dashboards
