    reasoning: |-
      The role centers on operating and supporting AI/ML platforms
      (Dataiku, Amazon SageMaker) and enabling AWS AI services —
      availability, patching, access, CI/CD, infrastructure-as-
      code, monitoring, and governance. The deliverable is
      reliable platform capacity and compliance, not shaping model
      behavior; prompt management, model evaluation, and
      guardrails appear only as preferred knowledge, and models
