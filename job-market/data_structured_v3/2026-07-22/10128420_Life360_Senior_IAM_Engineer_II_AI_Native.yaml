position:
  title: Senior IAM Engineer II (AI Native)
  ai_type:
    type: ai-support
    reasoning: |-
      This is an enterprise IAM engineering role owning Okta, SSO,
      SCIM, and Terraform-based identity infrastructure. AI
      appears only as coding assistants (Claude Code, Cursor,
      GitHub Copilot) used to draft and validate Terraform modules
      and provisioning scripts, which is explicitly engineering
      work done with AI tooling rather than shaping model
      behavior. The deliverable is identity infrastructure, so the
      role is ai-support.
  responsibilities:
  - Own the enterprise identity platform as an engineering system — architect SSO
    integrations, lifecycle workflows, MFA policy, and group provisioning in Okta
    with IaC as the source of truth
  - Engineer the identity lifecycle management layer — design access control models
    and codify provisioning/deprovisioning workflows in IaC, integrating with HR systems
    to eliminate manual access operations
  - Engineer access governance across the cloud and SaaS portfolio — own role assignments,
    group structures, and access controls, and design automated periodic access reviews
  - Harden the device-to-identity trust boundary — own device trust integrations between
    the identity provider and MDM platforms with compliance signals evaluated in access
    policy
  - Rationalize and consolidate the legacy identity surface — clean up orphaned accounts,
    stale SSO integrations, and guest access sprawl across the SaaS portfolio
  - Build the IAM measurement layer — define, instrument, and track KPIs such as access
    review completion rates, provisioning latency, and orphaned account age
  - Define the identity layer of the self-service access request platform and contribute
    identity workflows to a unified employee-facing service catalog
  - Use AI coding agents to draft and validate Terraform modules, provisioning logic,
    and access-policy changes, owning review of AI-generated output before it reaches
    production
  use_cases:
  - Enterprise workforce identity and access management at a company handling sensitive
    data for nearly 100 million users
  - Automated identity lifecycle provisioning and deprovisioning across cloud and
    SaaS platforms via Okta, SCIM, and IaC
  - Access governance and auditability — automated periodic access reviews, role assignments,
    and group-based access controls
  - Device-to-identity trust enforcement using device compliance signals from MDM
    platforms in access policy
  - Self-service employee access request workflows surfaced through a unified service
    catalog
  - AI-assisted drafting and validation of Terraform modules, provisioning logic,
    and access-policy configuration
