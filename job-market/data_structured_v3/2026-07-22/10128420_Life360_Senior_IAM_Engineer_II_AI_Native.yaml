    ops: [Terraform, Infrastructure as Code]
    languages: [Python, Go]
    domains: [Identity and Access Management]
    other: [Okta, SSO, SAML 2.0, OIDC, SCIM, MFA, MDM, Zero Trust Architecture, SOX,
      SOC 2, GDPR, CCPA, COPPA]
