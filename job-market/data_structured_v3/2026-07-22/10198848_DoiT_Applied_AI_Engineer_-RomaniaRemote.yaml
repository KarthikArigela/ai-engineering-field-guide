    reasoning: |-
      The core work is full-stack internal platform engineering:
      Python/Go services on GCP Cloud Run, TypeScript/React
      surfaces, Pub/Sub integrations, and BPMN orchestration for
      business systems. AI appears only as a development tool
      (Claude Code for spec/build/review) and as platform design
      so agents can safely consume APIs — neither involves shaping
      model behavior, and LLM API integration is merely a nice-to-
      have. The deliverable is internal business systems, not
      model output quality.
  responsibilities:
  - Own internal tools end to end, from understanding the operational problem through
    design, implementation, deployment, and iteration
  - 'Build full-stack services: Python/Go services on GCP Cloud Run, TypeScript/React
    web apps and internal admin tools, and event-driven integrations on Pub/Sub'
  - Integrate with third-party SaaS platforms and cloud APIs via REST, webhooks, OAuth,
    and event-driven patterns, handling failures, retries, and schema drift
  - Build and maintain workflow automation and business process orchestration as named,
    observable BPMN flows
  - Design platform capabilities as stable, versioned semantic APIs with narrow permissions
    and audit trails so AI agents can operate them safely
  - Use AI tooling (Claude Code) across spec, code, and review, while critically reviewing
    AI-generated output for correctness, security, and type safety
  - Operate production systems, covering monitoring, reliability, cost, and failure
    modes
  - Contribute to shared engineering standards, playbooks, and internal tooling
  use_cases:
  - Internal business systems platform (Project Babylon) connecting dozens of SaaS
    platforms across CRM, ERP, support, marketing, and billing
  - Event-driven business process orchestration replacing point-to-point vendor integrations
  - Reconciling marketing leads into the CRM
  - Real-time financial forecasting for the Finance team instead of spreadsheet exports
  - Automating quarterly access audits as observable flows that produce their own
    evidence
  - Exposing internal capabilities as semantic APIs so AI agents can safely consume
    and operate the platform
