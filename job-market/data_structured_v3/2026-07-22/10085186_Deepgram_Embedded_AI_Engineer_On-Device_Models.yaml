  title: Embedded AI Engineer, On-Device Models
  ai_type:
    type: ml-first
    reasoning: |-
      The role shapes model internals directly through
      quantization, pruning, distillation, operator fusion, and
      architecture-specific compilation, which counts as shaping.
      However, the targets are speech models
      (STT/TTS/conversational voice) deployed on-device — audio-
      driven speech models with no prompt-driven LLM or agent
      component — so per Step 2 this is ml-first.
  responsibilities:
  - Port Deepgram's speech and conversational models onto embedded and low-power consumer
    hardware, defining the architecture for on-device real-time inference across diverse
    processors and accelerators
  - Optimize models for constrained targets through quantization, pruning, distillation,
    operator fusion, and architecture-specific compilation to meet strict latency,
    memory, power, and thermal budgets
  - Write and optimize performance-critical runtime code in C, C++, and Rust for embedded
    environments including bare-metal and RTOS platforms such as FreeRTOS and Zephyr
  - Integrate edge inference runtimes and vendor NPU/DSP toolchains, mapping model
    graphs efficiently onto on-device accelerators and CPU/GPU/NPU heterogeneous systems
  - Build on-device runtime plumbing including model packaging, deployment pipelines,
    over-the-air update mechanisms, and lightweight telemetry for intermittently connected
    devices
  - Establish repeatable benchmarking and validation across target hardware, measuring
    latency, accuracy, power consumption, memory footprint, and resource utilization
    to catch regressions
  - Partner with silicon and device vendors on SDK integration and performance tuning
    for new chipsets and reference platforms
  - Collaborate with Research and Engine teams to influence model architectures toward
    edge-friendly designs
  use_cases:
  - Real-time speech-to-text and conversational voice AI running directly on phones,
    earbuds, wearables, appliances, cameras, and consumer hardware
  - Private, offline-capable voice experiences on devices closest to the user
  - Always-on listening and wake-word detection on low-power microcontrollers and
    edge SoCs
  - Streaming voice inference under tight battery, thermal, and memory constraints
