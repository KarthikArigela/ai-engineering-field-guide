position:
  title: Applied AI Engineer -Ukraine(Remote)
  ai_type:
    type: ai-support
    reasoning: |-
      The core work is full-stack platform engineering for
      internal business systems: Python/Go services, SaaS
      integrations, event-driven architecture, and BPMN
      orchestration. The role's AI usage is Claude Code as a
      coding collaborator across the SDLC, which is explicitly not
      shaping model behavior, and LLM API integration/prompt
      design appears only as a nice-to-have. The role exposes APIs
      that AI agents can consume safely, but it does not itself
      write prompts, design retrieval, or shape model output
      quality as a core responsibility.
  responsibilities:
  - Own internal tools end to end from understanding the operational problem through
    design, implementation, deployment, and iteration
  - 'Build across the stack: Python and Go services on GCP Cloud Run, TypeScript/React
    web apps and internal admin tools, and Pub/Sub event-driven integrations'
  - Integrate third-party SaaS platforms and cloud APIs handling REST, webhooks, OAuth,
    and event-driven patterns including failures, retries, and schema drift
  - Build and maintain workflow automation and business process orchestration as named,
    observable BPMN flows
  - Use AI tooling like Claude Code across spec, build, and review, and review AI-generated
    code for correctness, security, and type safety
  - Operate shipped systems in production covering monitoring, reliability, cost,
    and failure modes
  - Design the platform so AI agents can operate it safely as first-class consumers
    of its APIs
  - Contribute to shared engineering standards, playbooks, and internal tooling
  use_cases:
  - Internal platform connecting dozens of SaaS systems spanning CRM, ERP, support,
    marketing, and billing
  - Reconciling marketing leads into the CRM
  - Real-time financial forecasting for Finance instead of spreadsheet exports
  - Quarterly access audit turned into an observable flow that produces its own evidence
  - Event-driven business process orchestration over a canonical event log with versioned
    domain APIs
  - Safe AI agent operation as first-class consumers of internal platform capabilities
