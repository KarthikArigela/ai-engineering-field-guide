  - Assess the security posture of discovered agents including configuration, access
    rights, and risk exposure
  - Feed discovered agents and their context into the identity and attribution layer
    so they can be governed
  - Partner closely with platform teams whose discovery services the work builds on
  - Break down complex, ambiguous problems and select sound technical approaches with
    limited direction
  use_cases:
  - Discovery of AI agents running across cloud platforms and endpoints
  - Security posture assessment for AI agents covering configuration, access, and
    risk
  - Identity governance and attribution for discovered AI agents
  - Enterprise identity security for human and machine identities
