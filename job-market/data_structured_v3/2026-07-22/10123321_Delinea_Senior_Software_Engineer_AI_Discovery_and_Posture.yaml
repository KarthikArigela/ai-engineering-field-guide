    reasoning: |-
      The role builds discovery and security posture
      infrastructure that finds AI agents across clouds and
      endpoints and assesses their configuration, access, and
      risk. The engineer never shapes an LLM or agent's behavior -
      no prompts, retrieval design, training, evals, or output
      quality work; the agents are objects being inventoried, not
      systems being built. AI agent framework familiarity appears
