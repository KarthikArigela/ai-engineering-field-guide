position:
  title: Staff Security Engineer, AI
  ai_type:
    type: ai-first
    reasoning: |-
      Although this is a security role at its core, the person
      does not merely oversee AI systems — they build the
      guardrails themselves: defining policy-as-code, reference
      architectures, and standardized system prompts that shape
      how AI agents and workflows behave across DraftKings.
      Writing prompts and building guardrails for LLM/agent
      platforms is shaping model behavior, and since agents and
      LLM tooling are the targets, this classifies as ai-first.
  responsibilities:
  - Set security standards and guardrails for the AI platform, defining the principles,
    reference architectures, and policy-as-code that all AI tooling at DraftKings
    adheres to
  - Specify the environment, infrastructure, and authentication methods AI agents
    rely on so many teams can build agents and workflows to a consistent security
    bar
  - Review and build the architecture of AI gateways and tooling, providing security
    review, sign-off, and pairing on implementation
  - Streamline the InfoSec review process so AI services can move to production without
    security becoming the bottleneck
  - Partner with platform and detection teams on telemetry such as tool-call metrics,
    agent auditing, and lightweight controls like standardized system prompts to reduce
    AI-driven security noise
  - Drive remediation of complex, cross-functional security issues and assist in investigations
    when relevant
  - Work with product, engineering, and research teams to build and deploy tooling
    that helps the business connect services and data together
  - Mentor security and platform engineers, lead technical and SME discussions on
    AI security, and explain security work to audiences from ICs to senior leadership
  use_cases:
  - Secure adoption of an AI platform across DraftKings
  - Safe connection and deployment of new AI workflows, processes, and technologies
  - Enabling engineering teams to build AI agents and workflows that meet a consistent
    security bar
  - Reducing AI-driven security noise through telemetry and standardized system prompts
  - Scaling InfoSec review of AI services on their path to production
