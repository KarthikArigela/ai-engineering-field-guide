position:
  title: Applied AI Engineer -Croatia(Remote)
  ai_type:
    type: ai-support
    reasoning: |-
      The core work is full-stack platform engineering for
      internal business systems (Python/Go services, React
      surfaces, Pub/Sub integrations, BPMN orchestration); the AI
      content is using Claude Code as a coding collaborator across
      the SDLC and reviewing its output, which is explicitly non-
      shaping. LLM API integration, prompt design, and tool use
      appear only as nice-to-haves, and making platform APIs
      consumable by agents is API design, not shaping agent or
      model behavior.
  responsibilities:
  - Own internal tools end to end from understanding the operational problem through
    design, implementation, deployment, and iteration
  - 'Build full-stack services and surfaces: Python/Go services on Cloud Run, TypeScript/React
    web apps, and internal admin tools'
  - Integrate third-party SaaS platforms and cloud APIs handling REST, webhooks, OAuth,
    and event-driven patterns including failures, retries, and schema drift
  - Build workflow automation and business process orchestration as named, observable
    BPMN flows instead of logic buried in vendor scripts
  - Use AI tooling (Claude Code) across the development lifecycle for spec, code,
    and review while owning the output
  - Review AI-generated code before it ships for correctness, security, and type safety
  - 'Operate what you ship: monitoring, reliability, cost, and failure modes in production'
  - Contribute to shared engineering standards, playbooks, and internal tooling
  use_cases:
  - Event-driven orchestration of business processes across SaaS platforms (CRM, ERP,
    support, marketing, billing)
  - Reconciling marketing leads into the CRM
  - Real-time financial forecasting for the Finance team instead of spreadsheet exports
  - Automating quarterly access audits as observable flows that produce their own
    evidence
  - Exposing internal capabilities as semantic APIs that AI agents can consume safely
    with narrow permissions and audit trails
