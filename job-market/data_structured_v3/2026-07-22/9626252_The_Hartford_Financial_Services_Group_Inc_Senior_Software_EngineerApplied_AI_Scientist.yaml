position:
  title: Senior Software Engineer/Applied AI Scientist
  ai_type:
    type: ai-first
    reasoning: |-
      The role directly shapes LLM and agent behavior: authoring
      system prompts and few-shot patterns, designing RAG
      retrieval (chunking, embeddings, hybrid search, rerankers),
      defining tool-use/function-calling policies and structured
      outputs for agents, and building evals and guardrails. It
