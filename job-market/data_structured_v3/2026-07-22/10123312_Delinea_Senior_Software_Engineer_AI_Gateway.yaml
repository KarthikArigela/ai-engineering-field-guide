  - Inspection and control of AI agent and user traffic at an access gateway
  - Policy enforcement and just-in-time access for AI workloads in the request path
  - Controls for agent-to-agent communication, including MCP as an enforcement boundary
  - Identity security for human and machine identities across the enterprise
