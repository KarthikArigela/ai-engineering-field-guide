    analysis tools for planners, executives, and regulators
  - Identify and lead AI/ML use cases for long-term grid planning, ensuring methods
    are explainable, traceable, and appropriate for regulated environments
  - Partner with engineering teams to integrate data and AI workflows into production-grade
    planning software
  - Own data governance, quality assurance, and validation processes across the planning
    platform
  use_cases:
  - Long-term transmission and generation planning
  - Capacity expansion and reliability assessment of interconnected power systems
  - Multi-scenario, multi-year planning study execution and analysis
  - Explainable, governed AI-assisted decision support for grid planning
  - Auditable reporting of planning results for planners, executives, and regulators
