position:
  title: Azure AI / ML Engineer
  ai_type:
    type: ai-support
    reasoning: |-
      The responsibilities centre on building and securing AI/ML
      platform infrastructure: IaC (Terraform, ARM), CI/CD, Azure
      networking, PKI, RBAC, and enabling service pipelines for
      training and production models. GenAI frameworks (LangChain,
      Semantic Kernel), RAG, and vector databases appear only as
      knowledge requirements, and the security/governance work
      around Generative AI is oversight rather than building evals
      or guardrails. The deliverable is platform capacity and
      compliance, not model behaviour, so this is ai-support.
  responsibilities:
  - Design and implement enterprise-grade data and AI/ML platform services across
    Azure and GCP
  - Apply an AIOps/MLOps mindset to enable AI/ML services and build pipelines for
    training and production models
  - Develop APIs, Webhooks, and platform orchestration code using Python, GitHub Actions,
    and Terraform
  - Write and maintain Azure Resource Manager (ARM) and Terraform templates
  - Implement and support Azure security features (data protection, authentication,
    RBAC) and manage PKI certificate handling for Azure PaaS services
  - Troubleshoot Azure services, DNS, connectivity, NSGs, and routing, and automate
    cloud operations using Azure CLI
  - Support platform and analytics deployments via CI/CD pipelines while ensuring
    adherence to internal security and compliance policies
  - Partner with application development teams and business units to improve AI/ML
    frameworks, tooling, and automation
  use_cases:
  - Enterprise AI/ML platform enablement and automation across Azure and GCP
  - Secure, self-service AI/ML platform services in regulated industries such as financial
    services
  - Automated pipelines for model training and production deployment
  - Generative AI service adoption including RAG-based solution patterns
  - Cloud security, governance, and compliance for AI/ML workloads
