position:
  title: Software Test Engineer (Automation + AI)
  ai_type:
    type: ai-support
    reasoning: |-
      The core role is test automation engineering (UI, API,
      database, CI/CD); AI appears only as tooling the engineer
      uses - coding assistants for test generation, code review,
      and RAG-based retrieval from documentation. The person does
      not shape model behaviour, design retrieval systems as a
      deliverable, or build evals/guardrails, so this is ai-
      support.
  responsibilities:
  - Analyze requirements, user stories, and API contracts to create comprehensive
    test scenarios and automation strategies
  - Build and maintain automated UI tests using Selenium, Playwright, and Cypress
    with clean, reusable frameworks (POM, BDD)
  - Test APIs thoroughly covering authentication, payloads, error handling, and contract
    validation using Postman and REST automation
  - Write SQL queries to validate data integrity, transformations, and business logic
    in databases
  - Integrate test suites into CI/CD pipelines and monitor build health, flaky tests,
    and execution quality
  - Track defects in JIRA with clear reproduction steps and impact analysis, collaborating
    with developers on root causes
  - Use AI-powered tools and RAG approaches to speed up test generation, code reviews,
    failure pattern analysis, and knowledge retrieval
  - Champion Shift-Left practices through requirement reviews, early test planning,
    and participation in Agile ceremonies
  use_cases:
  - Automated regression and functional testing for web, SaaS, API, and mobile applications
  - AI-assisted test script generation and code review acceleration
  - RAG-based knowledge retrieval from technical documentation and past test runs
  - Defect pattern analysis and root-cause identification from test execution failures
  - CI/CD pipeline quality monitoring and flaky test detection
