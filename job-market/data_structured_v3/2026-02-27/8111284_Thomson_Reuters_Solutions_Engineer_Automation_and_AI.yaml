position:
  title: Solutions Engineer – Automation and AI
  ai_type:
    type: ai-support
    reasoning: |-
      The role establishes engineering best practices, DevOps,
      CI/CD, IaC, cloud architecture, and monitoring/observability
      for AI/automation solutions that the team of AI developers
      builds. The deliverable is enterprise-grade delivery,
      reliability, and process — not shaping model behaviour
      through prompts, retrieval, or agent design — so Step 1 is a
      no and the role is ai-support.
  responsibilities:
  - Lead and mentor a team of AI/Automation solution developers, providing technical
    guidance on development and deployment best practices
  - Establish software engineering best practices including version control, clean
    code principles, code reviews, and configuration management
  - Implement CI/CD pipelines, automated testing frameworks (unit, integration, end-to-end),
    and multi-environment deployment strategies
  - Establish Infrastructure as Code practices with Terraform or CloudFormation and
    lead cloud deployment initiatives on AWS and GCP
  - Design scalable, secure, cost-effective cloud and serverless architectures for
    AI solutions
  - Implement logging, monitoring, alerting, and observability practices for production
    AI/automation systems
  - Create reusable component libraries, shared workflows, design standards, and QA
    processes including output validation
  - Collaborate with security, compliance, and governance teams, translate business
    requirements into technical specifications, and prototype new technologies
  use_cases:
  - Enterprise automation and AI agent solutions built with LangGraph, AWS AgentCore,
    Google Agentspace, and CrewAI
  - Robotic process automation using UiPath
  - Production deployment, monitoring, and observability of AI/automation solutions
  - Multi-environment (Dev, UAT, QA, Production) delivery of AI solutions on AWS and
    GCP
  - Reusable component libraries and shared workflows to accelerate automation development
