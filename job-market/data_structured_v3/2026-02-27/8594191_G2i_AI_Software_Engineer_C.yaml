position:
  title: AI Software Engineer (C++)
  ai_type:
    type: ai-first
    reasoning: |-
      This role directly shapes LLM output quality: the engineer
      ranks, critiques, and repairs LLM-generated code, then feeds
      ratings, edits, and test results into the RLHF pipeline as
      reward signals. Judging model output and converting it into
      preference/reward data is explicitly shaping behavior, and
      the target is an LLM, making it ai-first despite no ML
      background being required.
  responsibilities:
  - Compare and rank multiple code snippets, explaining which is best and why
  - Repair and refactor AI-generated code for correctness, efficiency, and style
  - Inject feedback (ratings, edits, test results) into the RLHF pipeline and keep
    it running smoothly
  - Review code to spot logic errors, performance traps, and security issues
  - Write clear justifications for code quality and ranking decisions
  - Read documentation and language specs to inform evaluations in a low-oversight,
    asynchronous environment
  use_cases:
  - Training LLMs to write production-grade code across programming languages
  - Ranking and critiquing AI-generated code snippets
  - Repairing and refactoring AI-generated code for correctness, efficiency, and style
  - Converting expert code feedback into RLHF reward signals to tune code-generation
    models
