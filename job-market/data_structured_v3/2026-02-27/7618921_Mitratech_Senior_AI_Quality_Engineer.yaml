position:
  title: Senior AI Quality Engineer
  ai_type:
    type: ai-first
    reasoning: |-
      This QA role goes beyond generic oversight: the person
      designs and builds test plans and automated frameworks that
      judge model output quality — validating RAG retrieval
      quality, embedding accuracy, model response evaluation, and
      correctness of agent multi-step reasoning and tool
      invocations. Building evals for LLM-based systems is
      shaping, and since LLM/agent components are central, this is
      ai-first.
  responsibilities:
  - Design and execute manual and automated test cases for backend APIs, frontend
    interfaces, and end-to-end AI workflows
  - Validate RAG pipelines including embedding accuracy, retrieval quality, and model
    response evaluation
  - Test AI agents and orchestration flows, ensuring correctness in multi-step reasoning
    and tool invocations
  - Perform performance and scalability testing for ML inference endpoints (SageMaker,
    Bedrock, custom APIs) monitoring latency and throughput
  - Develop and maintain automated UI and API test frameworks, including automation
    scripts for AI/ML pipelines using pytest, unittest, or custom frameworks
  - Integrate automated test suites into CI/CD pipelines (GitHub Actions, GitLab CI,
    Jenkins) and manage defects in Jira
  - Conduct exploratory testing of generative AI features and validate UI/UX and Gen
    AI interaction flows across devices and browsers
  - Collaborate with ML engineers, data scientists, and developers to reproduce issues,
    validate fixes, and ensure model reliability while upholding security and data
    privacy standards
  use_cases:
  - Quality assurance for AI-driven products in legal, risk, compliance, and HR domains
  - Validation of RAG-based retrieval and generative AI features
  - End-to-end testing of document upload, retrieval, summarization, and inference
    workflows
  - Correctness testing of AI agents and multi-step reasoning with tool invocations
  - Performance and scalability validation of ML inference endpoints
  - Cross-browser UI/UX validation of Gen AI interaction flows
