position:
  title: AI Data Engineer
  ai_type:
    type: ai-first
    reasoning: |-
      The role directly shapes LLM output quality: designing
      semantic chunking/embedding strategies and vector indices
      for RAG, choosing between models, building evaluation
      harnesses for extraction quality, and fine-tuning (SFT/LoRA)
      with prompting/model-selection judgment. LLMs and agentic
      components are central to the extraction pipelines, so it is
      ai-first.
  responsibilities:
  - Build automated content discovery pipelines that discover and acquire grant-related
    content from the open web (foundation websites, RFPs, program announcements) into
    structured, actionable data
  - Implement production LLM extraction pipelines that transform unstructured documents
    (PDF, HTML, Word) into canonical business objects, including OCR, table extraction,
    and layout-aware parsing
  - Design semantic chunking strategies, select and manage embedding models, and maintain
    vector indices that power downstream search and RAG features
  - Optimize LLM systems for cost and latency by profiling token usage, implementing
    caching and batching strategies, and choosing appropriate models for different
    tasks
  - Build evaluation harnesses and implement validation, anomaly detection, and alerting
    for extraction drift to keep AI-derived data trustworthy
  - Expose clean data to product teams via APIs, materialized views, or event streams
    without exposing extraction complexity
  - Integrate and normalize data from external providers, resolving entities and mapping
    them to internal canonical schemas
  use_cases:
  - Grant discovery, tracking, and management for nonprofits
  - Automated extraction of grant documents and foundation profiles into structured
    business objects
  - Web-scale discovery of RFPs and funding announcements
  - Semantic search and RAG over grant and foundation data powering product features
  - Fundraising automation for the nonprofit sector
  - Entity resolution across third-party data providers
