position:
  title: Senior Data and AI engineer
  ai_type:
    type: ai-support
    reasoning: |-
      This role builds and maintains data pipelines, data
      lakes/warehouses, and MLOps enablement to feed AI/ML and
      agentic AI applications that other teams own; model training
      and data science are explicitly partner functions. The
      person does not write prompts, design retrieval or agent
      flows, or tune models, so they do not shape model behaviour
      - they move and serve data for models others shape.
  responsibilities:
