  - Architect scalable, secure, low-latency data pipelines and systems supporting
    agentic AI applications
  - Partner with Data Science teams to support model training, feature engineering,
    and deployment processes
  - Develop and manage data architecture, data lakes, and data warehouses supporting
    Service AI use cases
  - Collaborate with data scientists, project managers, software engineering, and
    Service & Support stakeholders to translate business requirements into technical
    solutions
  - Optimize data storage, compute, and retrieval strategies for structured and unstructured
    data including logs, text, images, and telemetry
  - Support MLOps workflows by enabling model deployment, monitoring, and versioning
    pipelines
  - Create reports and visualizations using Power BI, Power App, Power Automate, or
    similar BI tools
  use_cases:
  - Ticket analytics for service and support operations
  - Customer interaction insights
  - Predictive maintenance
  - Resource planning
  - Equipment failure prediction at scale
  - Data infrastructure for agentic AI applications
