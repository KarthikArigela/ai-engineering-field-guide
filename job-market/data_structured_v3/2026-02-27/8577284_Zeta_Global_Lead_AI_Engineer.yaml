  - Design, curate, and maintain high-quality SFT and preference datasets combining
    human-labeled and synthetic data for marketing and decisioning use cases
  - Own model evaluation and benchmarking, including offline behavioral evals, online
    A/B experiments, and continuous regression and performance monitoring
  - Develop and operate agentic LLM systems enabling multi-step reasoning, tool use,
    workflow orchestration, and decision execution
  - Implement and optimize prompting, retrieval-augmented generation (RAG), memory,
    and tool-calling strategies, deciding when to solve problems via SFT versus prompting
  - Partner with data engineering, platform, and product teams to integrate fine-tuned
    models into high-throughput, low-latency production systems
  - Establish best practices for LLM versioning, experimentation, deployment, rollback,
    governance, and safety, and provide technical leadership and mentorship to engineers
  use_cases:
  - Real-time ad decisioning to serve the right advertisement to the right user at
    the right time
  - Personalized omnichannel marketing experiences at the individual consumer level
  - Agentic multi-step reasoning, tool use, and decision execution for marketing workflows
  - Domain-aligned LLM behavior for marketing and decisioning use cases
  - Customer acquisition, growth, and retention optimization using consumer signal
    data
