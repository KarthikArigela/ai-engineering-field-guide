position:
  title: Marketing Platform Engineer (Data & AI)
  ai_type:
    type: ai-first
    reasoning: |-
      The role designs the retrieval/context backbone that LLM
      agents consume: versioned context endpoints with filtering,
      boosting, time-decay, and ranking logic tuned for relevance
      and sub-second latency, plus re-embedding maintenance and
      reasoning about prompt versioning and retrieval quality.
      This is designing retrieval and context assembly for agents
      (shaping behavior), not merely moving data or consuming an
      AI API another team designed. The Salesforce data-quality
      work alone would be ai-support, but the retrieval design and
      ranking optimization make agent output quality the
      deliverable.
  responsibilities:
  - Own Salesforce data integrity including quality, deduplication, enrichment, field
    standardization, and freshness as the single source of truth
  - Design and ship versioned, documented API endpoints that GTM agents call to retrieve
    context such as contacts, accounts, engagement history, and intent signals
  - Optimize retrieval performance by tuning query logic, filters, boosts, and ranking
    algorithms for sub-second, contextually relevant, cost-effective results
  - Scale GTM Brain data sources (product usage, web signals, third-party enrichment,
    intent platforms) without forcing agents to rebuild their logic
  - Build and operate background jobs that refresh context on schedule, fix failed
    re-embeddings, and backfill deltas without drift or disruption
  - Enable agent developers and operators with starter queries and templated context
    patterns, coordinating with AI Ops and enablement teams
  - Evaluate and integrate vendor tools like N8N, Clay, and Rattle ensuring their
    data flows meet latency and freshness requirements
  - Co-create the scalable GTM data stack with RevOps and AI Ops, integrating Salesforce,
    BigQuery, Supabase/Postgres, LLM tools, and analytics
  use_cases:
  - Centralized real-time context retrieval serving 50-200 GTM (sales and marketing)
    AI agents
  - Agent access to contacts, accounts, engagement history, intent signals, and enrichment
    data with fresh, reliable context
  - Salesforce data enrichment and deduplication powering reliable agent intelligence
  - Autonomous marketing and workflow automation for go-to-market teams
  - Agentic personalization across the customer journey for commerce brands
