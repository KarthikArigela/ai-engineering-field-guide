position:
  title: AI/ML Engineer - RAG
  ai_type:
    type: ai-first
    reasoning: |-
      The role designs and builds end-to-end RAG
      pipelines—chunking, embeddings, retrieval strategy tuning,
      reranking, grounding, and citation mechanisms—which directly
      shapes LLM output quality. It also builds evaluation
      harnesses, guardrails, and quality gates for prompts,
      retrievers, and model updates, confirming the person shapes
      model behaviour rather than merely consuming or serving an
      AI API. The shaped components are LLM-based generation and
      retrieval, so it is ai-first.
  responsibilities:
  - Design and implement end-to-end RAG pipelines from ingestion, parsing, and chunking
    through embedding, indexing, retrieval, reranking, and answer generation
  - Choose and tune dense, sparse/lexical, and hybrid retrieval strategies, with query
    understanding and rewriting, to maximize recall and precision on real enterprise
    queries
  - Develop reranking and fusion strategies (cross-encoder, late-interaction, LLM-based,
    RRF/weighted fusion) to improve ranking quality
  - Build evaluation harnesses for retrieval and generation (precision/recall@k, MRR/nDCG,
    groundedness) with automated regression tests, quality gates, and human feedback
    loops
  - Implement citation/grounding mechanisms and response policies to ensure traceable,
    trustworthy outputs with reduced hallucinations
  - Optimize latency, throughput, and cost across embedding, retrieval, and generation
    using caching, batching, streaming responses, and efficient index configurations
  - Instrument the full pipeline with logs, metrics, traces, dashboards, and alerting,
    and triage failures with runbooks
  - Implement document-level security and ACL-aware retrieval, ensure enterprise governance
    compliance, and partner with domain owners to integrate RAG into products and
    workflows
  use_cases:
  - Enterprise knowledge search and question answering grounded in company documents,
    wikis, tickets, logs, and metadata
  - Reducing hallucinations, answer failures, and unresolved queries in LLM-generated
    responses
  - Traceable, citation-backed answers with document-level security and access control
    for sensitive enterprise knowledge
  - Cost- and latency-efficient internal retrieval serving at production scale with
    measurable relevance gains
  - Integrating RAG capabilities into internal products and employee workflows to
    improve productivity
