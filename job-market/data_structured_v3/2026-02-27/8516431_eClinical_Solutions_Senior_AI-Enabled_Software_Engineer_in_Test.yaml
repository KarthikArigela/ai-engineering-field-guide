  - Maintain complete, traceable, audit-ready documentation aligned with SOPs, QMS,
    GxP, and 21 CFR Part 11 requirements
  - Collaborate with DevOps and Cloud teams to optimize infrastructure scalability,
    reliability, and performance within compliance constraints
  use_cases:
  - Quality engineering for elluminate, a SaaS Clinical Data Intelligence Platform
  - Automated regression, integration, and performance testing of cloud-based clinical
    data services
  - AI-assisted test generation and coverage expansion to reduce manual testing
  - Regulatory-compliant, audit-ready testing under GxP and 21 CFR Part 11 constraints
  - Continuous delivery quality gates enabling faster release cadence with production
    stability
